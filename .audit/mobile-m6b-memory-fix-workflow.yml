name: Mobile M6-B Memory Fix Finalize

on:
  push:
    branches:
      - "audit/mobile-m6-b-before-20260825"
    paths:
      - ".github/workflows/mobile-m6-b-memory-fix.yml"

permissions:
  contents: write

jobs:
  finalize:
    name: Rewrite M6-B as one memory-safe product commit
    runs-on: ubuntu-latest
    env:
      PRODUCT_BASE: 0a577f05f55a772a1b3f6d2980b18ef4e1a643fb
      OLD_HEAD: fd45d97004774ff3261aede51ae6c5c726c2d2c4
      PRODUCT_BRANCH: mobile/m6-b-document-scan
      SECRET_KEY: ci-only-secret-key-minimum-32-characters-long
      DATABASE_URL: "sqlite:///:memory:"
      ENVIRONMENT: development
      TELEMETRY_ENABLED: "false"
      CLOUD_AI_ENABLED: "false"
    steps:
      - name: Checkout frozen correction inputs
        uses: actions/checkout@v4
        with:
          path: audit

      - name: Checkout exact superseded product head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.OLD_HEAD }}
          path: product
          fetch-depth: 0

      - name: Assert branch still points to superseded head
        working-directory: product
        run: |
          test "$(git rev-parse HEAD)" = "$OLD_HEAD"
          test "$(git ls-remote origin "refs/heads/$PRODUCT_BRANCH" | cut -f1)" = "$OLD_HEAD"
          test "$(git rev-list --count "$PRODUCT_BASE"..HEAD)" = "1"

      - name: Apply memory-safe PDF assembly correction
        working-directory: product
        run: python ../audit/.audit/mobile-m6b-memory-fix.py

      - name: Assert correction scope and architecture
        working-directory: product
        run: |
          git diff --check
          test "$(git diff --name-only)" = "backend/routers/mobile_resource_bridge.py"
          grep -q "page.insert_image(page.rect, stream=raw" backend/routers/mobile_resource_bridge.py
          grep -q "document.tobytes(garbage=4, deflate=True)" backend/routers/mobile_resource_bridge.py
          ! grep -q "images: list\[Image.Image\]" backend/routers/mobile_resource_bridge.py
          python -m py_compile backend/routers/mobile_resource_bridge.py

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend test dependencies
        working-directory: product
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.12.0 torchvision==0.27.0 --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^(torch|torchvision)([<=>].*)?$' requirements.txt > /tmp/requirements-m6b-memory.txt
          pip install -r /tmp/requirements-m6b-memory.txt
          pip install httpx==0.27.2 pytest pytest-asyncio

      - name: Run M6-B and M6-A targeted regressions
        working-directory: product
        run: |
          python -m pytest \
            backend/tests/test_mobile_m6b_document_scan.py \
            backend/tests/test_mobile_m6a_clinical_photo.py \
            -q

      - name: Rewrite branch as exactly one final product commit
        working-directory: product
        run: |
          git config user.name "hraaaaf"
          git config user.email "123034021+hraaaaf@users.noreply.github.com"
          git add backend/routers/mobile_resource_bridge.py
          git reset --soft "$PRODUCT_BASE"
          git add backend/routers/mobile_resource_bridge.py backend/tests/test_mobile_m6b_document_scan.py frontend/src/features/mobile/Context/MobileContext.tsx
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" = "3"
          git commit -m "feat(mobile): add context-bound document scanning"
          test "$(git rev-list --count "$PRODUCT_BASE"..HEAD)" = "1"
          git push --force-with-lease="refs/heads/$PRODUCT_BRANCH:$OLD_HEAD" origin "HEAD:refs/heads/$PRODUCT_BRANCH"

      - name: Record final proof
        working-directory: product
        run: |
          echo "FINAL_PRODUCT_HEAD=$(git rev-parse HEAD)"
          echo "FILES=$(git diff --name-only "$PRODUCT_BASE"..HEAD | wc -l)"
