# Frozen M4-B exact-head AFTER harness, extended by M6-H viewer certification. Not a workflow.
scenario:
  materialize: |
    cat > mobile-m4b-after.html <<'EOF'
          <!doctype html><html lang="fr"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/><link rel="icon" href="data:,"/><title>Digital Crown M4-B / M6-H AFTER</title></head><body><div id="root"></div><script type="module" src="/src/mobile-m4b-after.tsx"></script></body></html>
