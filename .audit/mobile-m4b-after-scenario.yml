# Frozen M4-B exact-head AFTER harness. Not a workflow.
scenario:
  materialize: |
    cat > mobile-m4b-after.html <<'EOF'
          <!doctype html><html lang="fr"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/><link rel="icon" href="data:,"/><title>Digital Crown M4-B AFTER</title></head><body><div id="root"></div><script type="module" src="/src/mobile-m4b-after.tsx"></script></body></html>
    EOF
    cat > src/mobile-m4b-after.tsx <<'EOF'
          import React from 'react';
          import { createRoot } from 'react-dom/client';
          import { MemoryRouter, Route, Routes, useLocation } from 'react-router-dom';
          import { QueryClient, QueryClientProvider } from '@tanstack/react-query';
          import './index.css';
          import { PatientDetails } from './features/patients/PatientDetailsInner';
          import { MobileContext } from './features/mobile/Context/MobileContext';
          import { MobileStorage } from './services/zka/MobileStorage';
          import { useAuthStore } from './stores/useAuthStore';

          const params = new URLSearchParams(window.location.search);
          const view = params.get('view') || 'desktop';
          const queryClient = new QueryClient({ defaultOptions: { queries: { retry: false } } });
          useAuthStore.setState({ user: ({ id: 1, email: 'dentiste@m4b-after.local', nom_complet: 'Dr M4B', role: 'ADMIN', employer_id: null, is_superadmin: false, permissions: { patients: true, agenda: true, clinical: true, panoramic: true, cephalo: true, admin: true } } as any), isAuthenticated: true, isLoading: false, error: null });

          const RouteProbe = () => { const location = useLocation(); return <div data-testid="m4b-route-probe" data-path={location.pathname} data-search={location.search} className="hidden"/>; };
          const futureJwt = 'eyJhbGciOiJub25lIiwidHlwIjoiSldUIn0.eyJleHAiOjQxMDI0NDQ4MDB9.';
          if (view === 'mobile') {
            await MobileStorage.clearAll().catch(() => {});
            await MobileStorage.saveCredentials({ publicId: 'abcdef1234567890', masterKey: 'a'.repeat(64), access_token: futureJwt, refresh_token: 'm4b-after-refresh', device_id: '11111111-2222-4333-8444-555555555555', api_base_url: 'http://127.0.0.1:8005' });
            await MobileStorage.saveBridgeContext({ type: 'panoramic', key: 'M4BContextKeyExact', label: 'Radio panoramique', state: 'ready' });
          }
          const entry = view === 'mobile' ? '/mobile/context' : '/patients/42?tab=radiology&radioTab=panoramic';
          createRoot(document.getElementById('root')!).render(<React.StrictMode><QueryClientProvider client={queryClient}><MemoryRouter initialEntries={[entry]}><RouteProbe/><Routes><Route path="/patients/:id" element={<PatientDetails/>}/><Route path="/mobile/context" element={<MobileContext/>}/><Route path="/mobile/dashboard" element={<div>Dashboard mobile</div>}/></Routes></MemoryRouter></QueryClientProvider></React.StrictMode>);
    EOF
    cat > mobile-m4b-after.mjs <<'EOF'
          import { chromium } from 'playwright';
          import { createServer } from 'vite';
          import fs from 'node:fs/promises';

          const output = 'mobile-m4b-after-artifacts';
          await fs.rm(output, { recursive: true, force: true }); await fs.mkdir(output, { recursive: true });
          const productHead = process.env.PRODUCT_HEAD || 'unknown';
          const captures = []; const pairingBodies = []; const network = [];
          const patient = { id: 42, numero_dossier: 'DC-0042', nom: 'BENNANI', prenom: 'Sara', date_naissance: '1992-05-18T00:00:00', telephone: '0612345678', email: 'sara.bennani@example.test', assurance: 'MUTUELLE', antecedents_medicaux: 'Allergie pénicilline', motif_consultation: 'Contrôle', dossier: { is_ortho_active: false } };
          const analysis = { id: 73, patient_id: 42, image_path: 'api/static/uploads/panoramic/m4b-after.jpg', detections_data: { detections: [] }, report_narrative: 'Bilan panoramique enregistré.', created_at: '2026-08-20T10:30:00' };
          const radioSvg = `<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520"><rect width="900" height="520" fill="#05070c"/><path d="M115 260 C210 95 365 110 450 225 C535 110 690 95 785 260 C715 435 185 435 115 260Z" fill="none" stroke="#e5e7eb" stroke-width="28" opacity=".82"/><path d="M190 260 C300 205 390 205 450 275 C510 205 600 205 710 260" fill="none" stroke="#9ca3af" stroke-width="20"/><text x="35" y="480" fill="#94a3b8" font-family="Arial" font-size="22">PANORAMIQUE M4-B · BENNANI SARA</text></svg>`;
          const qrSvg = `<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180"><rect width="180" height="180" fill="white"/><g fill="#4f46e5"><rect x="12" y="12" width="48" height="48"/><rect x="120" y="12" width="48" height="48"/><rect x="12" y="120" width="48" height="48"/><rect x="78" y="78" width="20" height="20"/><rect x="112" y="102" width="28" height="28"/></g></svg>`;
          const qrData = `data:image/svg+xml;base64,${Buffer.from(qrSvg).toString('base64')}`;
          const server = await createServer({ server: { host: '127.0.0.1', port: 4183, strictPort: true }, clearScreen: false }); await server.listen();
          const browser = await chromium.launch();
          const json = body => ({ status: 200, contentType: 'application/json', body: JSON.stringify(body) });

          async function setup(viewport) {
            const context = await browser.newContext({ viewport, screen: viewport, deviceScaleFactor: 1, hasTouch: viewport.width <= 768, isMobile: viewport.width <= 768, serviceWorkers: 'block' });
            const page = await context.newPage(); const errors = [];
            page.on('pageerror', e => errors.push(`pageerror: ${e.message}`)); page.on('console', m => { if (m.type() === 'error') errors.push(`console: ${m.text()}`); });
            await page.route('**/*', async route => {
              const req = route.request(); const url = new URL(req.url()); const path = url.pathname;
              if (!path.startsWith('/api/')) return route.continue(); network.push(`${req.method()} ${path}`);
              if (path === '/api/patients/42') return route.fulfill(json(patient));
              if (path === '/api/intelligence/patient/42/nba') return route.fulfill(json({ nba: null }));
              if (path === '/api/ia/patients/42/panoramic-comparison') return route.fulfill(json({ available: false, reason: 'Moins de 2 bilans panoramiques disponibles.' }));
              if (path === '/api/ia/patients/42/panoramic-analyses') return route.fulfill(json([analysis]));
              if (path === '/api/mobile/resource-bridge-options') return route.fulfill(json({ resource_type: 'panoramic', resource_label: 'Radio panoramique', expires_in: 300, contains_patient_data: false, contains_resource_data: false, targets: [{ id: 1, name: 'Dr M4B', email: 'dentiste@m4b-after.local', role: 'ADMIN', is_current_user: true }] }));
              if (path === '/api/mobile/resource-bridge-pairing') { pairingBodies.push(req.postDataJSON()); return route.fulfill(json({ qr_code: qrData, expires_in: 300, lan_url: 'http://192.168.1.20:8005', token_code: '427315', target_user_id: 1, target_user_name: 'Dr M4B', target_role: 'ADMIN', resource_type: 'panoramic', resource_label: 'Radio panoramique', contains_patient_data: false, contains_resource_data: false })); }
              if (path === '/api/mobile/resource-context') return route.fulfill(json({ type: 'panoramic', label: 'Radio panoramique', panoramic: { patient_name: 'BENNANI Sara', created_at: '2026-08-20T10:30:00', landmarks_count: 0, report_saved: true } }));
              if (path === '/api/mobile/resource-context-media') return route.fulfill({ status: 200, contentType: 'image/svg+xml', body: radioSvg });
              if (path === '/api/mobile/refresh-token') return route.fulfill({ status: 401, contentType: 'application/json', body: '{}' });
              return route.fulfill(json(req.method() === 'GET' ? [] : {}));
            });
            return { context, page, errors };
          }

          async function metrics(page) { return page.evaluate(() => { const root = document.documentElement; const touches = [...document.querySelectorAll('[data-m4b-touch]')].map(el => { const r = el.getBoundingClientRect(); return { text: (el.textContent || el.getAttribute('aria-label') || '').trim().replace(/\s+/g, ' ').slice(0, 80), width: Math.round(r.width), height: Math.round(r.height) }; }); return { scrollWidth: root.scrollWidth, clientWidth: root.clientWidth, hasHorizontalOverflow: root.scrollWidth > root.clientWidth + 1, touchesBelow44: touches.filter(t => t.height < 44), routePath: document.querySelector('[data-testid="m4b-route-probe"]')?.getAttribute('data-path') || null, routeSearch: document.querySelector('[data-testid="m4b-route-probe"]')?.getAttribute('data-search') || null }; }); }
          async function capture(page, errors, name, state, viewport) { const measured = await metrics(page); await page.screenshot({ path: `${output}/${name}.png`, fullPage: false, animations: 'disabled' }); const record = { name, state, ...viewport, metrics: measured, errors: [...errors] }; captures.push(record); await fs.writeFile(`${output}/${name}.json`, JSON.stringify(record, null, 2)); }

          try {
            for (const viewport of [{ width: 1280, height: 900 }, { width: 768, height: 1024 }]) {
              const { context, page, errors } = await setup(viewport); await page.goto('http://127.0.0.1:4183/mobile-m4b-after.html?view=desktop', { waitUntil: 'networkidle' });
              await page.getByText('Studio Panoramique - BENNANI Sara', { exact: true }).waitFor({ state: 'visible', timeout: 15000 }); await page.getByRole('button', { name: 'Historique', exact: true }).first().click(); await page.getByText('Historique des examens (1)', { exact: true }).waitFor({ state: 'visible' });
              await capture(page, errors, `history-${viewport.width}x${viewport.height}`, 'desktop-history', viewport);
              await page.getByRole('button', { name: 'Ouvrir cette radio panoramique sur mobile', exact: true }).click(); await page.getByRole('button', { name: 'Générer le QR', exact: true }).click(); await page.getByText('427315', { exact: true }).waitFor({ state: 'visible' });
              await capture(page, errors, `bridge-${viewport.width}x${viewport.height}`, 'desktop-bridge', viewport); await context.close();
            }
            for (const viewport of [{ width: 390, height: 844 }, { width: 430, height: 932 }, { width: 768, height: 1024 }]) {
              const { context, page, errors } = await setup(viewport); await page.goto('http://127.0.0.1:4183/mobile-m4b-after.html?view=mobile', { waitUntil: 'networkidle' });
              await page.getByRole('heading', { name: 'Radio panoramique', exact: true }).waitFor({ state: 'visible', timeout: 10000 }); await page.getByText('BENNANI Sara', { exact: true }).waitFor({ state: 'visible' });
              await capture(page, errors, `mobile-radio-${viewport.width}x${viewport.height}`, 'mobile-context', viewport); await context.close();
            }
            const safePairingBodies = pairingBodies.length === 2 && pairingBodies.every(body => body.resource_type === 'panoramic' && body.resource_id === 73 && !('patient_id' in body) && !('image_path' in body));
            const report = { productHead, captures, count: captures.length, safePairingBodies, trashEndpointAbsent: !network.some(item => item.includes('panoramic-trash')), mobileContextCount: captures.filter(item => item.state === 'mobile-context').length, idlessMobileRoute: captures.filter(item => item.state === 'mobile-context').every(item => item.metrics.routePath === '/mobile/context' && !item.metrics.routeSearch), noUnexpectedErrors: captures.every(item => item.errors.length === 0), noHorizontalOverflow: captures.every(item => !item.metrics.hasHorizontalOverflow), noM4BTouchBelow44: captures.every(item => item.metrics.touchesBelow44.length === 0) };
            await fs.writeFile(`${output}/report.json`, JSON.stringify(report, null, 2)); console.log(JSON.stringify(report, null, 2));
            if (report.count !== 7 || !report.safePairingBodies || !report.trashEndpointAbsent || report.mobileContextCount !== 3 || !report.idlessMobileRoute || !report.noUnexpectedErrors || !report.noHorizontalOverflow || !report.noM4BTouchBelow44) throw new Error('M4-B AFTER gate failed.');
          } finally { await browser.close(); await server.close(); }
    EOF
