    <linearGradient id="primary" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b4ea2"/><stop offset="1" stop-color="#053b82"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#18375d" flood-opacity=".12"/></filter>
