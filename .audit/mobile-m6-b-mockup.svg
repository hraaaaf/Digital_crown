    <rect x="20" y="246" width="270" height="220" rx="24" fill="#fff" fill-opacity=".9" stroke="#cfe3d7" filter="url(#shadow)"/>
    <circle cx="54" cy="284" r="18" fill="#e7f8ed"/><text x="47" y="291" font-family="Arial" font-size="17" fill="#128348">✓</text>
