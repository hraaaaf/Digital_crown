    <text x="30" y="574" font-family="Arial" font-size="11" font-weight="800" fill="#c03a4b">Supprimer cette page</text>
    <text x="267" y="174" font-family="Arial" font-size="11" font-weight="700" fill="#718097">Annuler</text>
