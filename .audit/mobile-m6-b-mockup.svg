      <rect x="74" width="64" height="52" rx="10" fill="#eaf3ff" stroke="#0b4ea2" stroke-width="2"/><text x="99" y="31" font-family="Arial" font-size="11" font-weight="800" fill="#0b4ea2">2</text>
      <rect x="148" width="64" height="52" rx="10" fill="#fff" stroke="#cbd8e5"/><text x="173" y="31" font-family="Arial" font-size="11" font-weight="800" fill="#61728a">3</text>
      <rect x="222" width="68" height="52" rx="10" fill="#f4f7fa" stroke="#cbd8e5"/><text x="239" y="31" font-family="Arial" font-size="18" font-weight="700" fill="#0b4ea2">＋</text>
