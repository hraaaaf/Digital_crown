  <text x="646" y="438" font-family="Arial,sans-serif" font-size="13" fill="#64748b">TTL 5 min · usage unique · révocable</text>

  <text x="72" y="602" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#334155">MOBILE · /mobile/context</text>
  <rect x="130" y="632" width="390" height="790" rx="42" fill="#0f172a"/>
  <rect x="144" y="648" width="362" height="758" rx="32" fill="#f8fafc"/>
