  <rect x="332" y="1010" width="146" height="54" rx="16" fill="#4f46e5"/><text x="365" y="1043" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#ffffff">Agenda</text>
  <rect x="172" y="1102" width="306" height="160" rx="22" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="194" y="1138" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#334155">Résumé</text>
  <text x="194" y="1170" font-family="Arial,sans-serif" font-size="13" fill="#64748b">Assurance · Mutuelle</text>
  <text x="194" y="1198" font-family="Arial,sans-serif" font-size="13" fill="#64748b">Motif · Contrôle</text>
  <text x="194" y="1226" font-family="Arial,sans-serif" font-size="13" fill="#64748b">Contexte chargé depuis le serveur</text>
  <rect x="172" y="1312" width="306" height="54" rx="16" fill="#e2e8f0"/><text x="230" y="1345" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#475569">Retour au mobile</text>

  <rect x="610" y="632" width="758" height="378" rx="28" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="646" y="684" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#0f172a">Contrat UX / sécurité</text>
  <text x="646" y="728" font-family="Arial,sans-serif" font-size="16" fill="#475569">1. Le QR ne contient qu’un secret opaque temporaire.</text>
  <text x="646" y="762" font-family="Arial,sans-serif" font-size="16" fill="#475569">2. Patient + cabinet + permission sont validés à la génération.</text>
  <text x="646" y="796" font-family="Arial,sans-serif" font-size="16" fill="#475569">3. Après pairing, ils sont revalidés avant ouverture.</text>
  <text x="646" y="830" font-family="Arial,sans-serif" font-size="16" fill="#475569">4. L’URL mobile reste /mobile/context, sans patient_id.</text>
  <text x="646" y="864" font-family="Arial,sans-serif" font-size="16" fill="#475569">5. Le contexte IndexedDB est lié cabinet + device et purgé avec la session.</text>
  <text x="646" y="898" font-family="Arial,sans-serif" font-size="16" fill="#475569">6. Expiré / supprimé / révoqué / non autorisé = état d’erreur, jamais Agenda silencieux.</text>
  <text x="646" y="954" font-family="Arial,sans-serif" font-size="14" fill="#94a3b8">Cible M4-A uniquement. Imagerie, Documents et RDV seront branchés sur le même contrat serveur générique.</text>
</svg>