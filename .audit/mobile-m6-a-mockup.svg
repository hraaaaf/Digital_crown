<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eef5ff"/><stop offset="1" stop-color="#e5effb"/></linearGradient>
    <linearGradient id="primary" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b4ea2"/><stop offset="1" stop-color="#053b82"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#18375d" flood-opacity=".12"/></filter>
  </defs>
  <rect width="1200" height="800" fill="#f5f8fc"/>
  <text x="52" y="54" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#10213d">M6-A — Référence visuelle verrouillée</text>
  <text x="52" y="84" font-family="Arial,sans-serif" font-size="15" fill="#60708a">Patient exact → Photo clinique → Preview → Enregistrer</text>

  <!-- Phone / patient state -->
  <g transform="translate(60 120)">
    <rect width="350" height="620" rx="34" fill="url(#bg)" stroke="#cbd8e8"/>
    <text x="24" y="42" font-family="Arial" font-size="12" font-weight="700" fill="#74839a">‹  Retour</text>
    <text x="24" y="86" font-family="Arial" font-size="10" font-weight="700" letter-spacing="2" fill="#0b4ea2">CONTEXTE CABINET VÉRIFIÉ</text>
    <text x="24" y="124" font-family="Arial" font-size="29" font-weight="800" fill="#111c31">Dossier patient</text>
    <rect x="20" y="148" width="310" height="156" rx="26" fill="#ffffff" fill-opacity=".78" stroke="#d5e0ec" filter="url(#shadow)"/>
    <text x="40" y="186" font-family="Arial" font-size="22" font-weight="800" fill="#111c31">BENNANI Sara</text>
    <text x="40" y="212" font-family="Arial" font-size="13" font-weight="700" fill="#687890">Dossier DC-0012</text>
    <text x="40" y="244" font-family="Arial" font-size="13" font-weight="700" fill="#687890">37 ans   0612345678</text>
    <rect x="40" y="262" width="140" height="30" rx="10" fill="#fff1f3" stroke="#ffb8c0"/>
    <text x="52" y="282" font-family="Arial" font-size="11" font-weight="800" fill="#d91d3d">⚠ ALERTE MÉDICALE</text>
    <text x="20" y="340" font-family="Arial" font-size="14" font-weight="800" fill="#111c31">Actions rapides</text>
    <rect x="20" y="356" width="148" height="54" rx="16" fill="#ffffff" fill-opacity=".82" stroke="#cad7e5"/>
    <text x="62" y="389" font-family="Arial" font-size="14" font-weight="800" fill="#14213a">☎  Appeler</text>
    <rect x="182" y="356" width="148" height="54" rx="16" fill="url(#primary)"/>
    <text x="220" y="389" font-family="Arial" font-size="14" font-weight="800" fill="#fff">▣  Agenda</text>
    <rect x="20" y="424" width="310" height="66" rx="18" fill="url(#primary)" filter="url(#shadow)"/>
    <circle cx="54" cy="457" r="18" fill="#ffffff" fill-opacity=".15"/>
    <text x="46" y="463" font-family="Arial" font-size="20" fill="#fff">◉</text>
    <text x="84" y="451" font-family="Arial" font-size="15" font-weight="800" fill="#fff">Photo clinique</text>
    <text x="84" y="471" font-family="Arial" font-size="11" font-weight="600" fill="#dbeaff">Prendre une photo au fauteuil</text>
    <rect x="20" y="508" width="310" height="84" rx="22" fill="#ffffff" fill-opacity=".76" stroke="#d5e0ec"/>
    <text x="40" y="536" font-family="Arial" font-size="10" font-weight="800" letter-spacing="1.5" fill="#718097">ASSURANCE</text>
    <text x="40" y="558" font-family="Arial" font-size="14" font-weight="800" fill="#111c31">CNSS</text>
    <text x="40" y="582" font-family="Arial" font-size="11" font-weight="600" fill="#718097">Motif : Contrôle implant 36</text>
  </g>

  <!-- Preview sheet -->
  <g transform="translate(470 120)">
    <rect width="350" height="620" rx="34" fill="url(#bg)" stroke="#cbd8e8"/>
    <rect x="0" y="0" width="350" height="620" rx="34" fill="#17304f" fill-opacity=".13"/>
    <rect x="12" y="178" width="326" height="430" rx="30" fill="#fbfdff" fill-opacity=".94" stroke="#d8e2ed" filter="url(#shadow)"/>
    <rect x="147" y="190" width="56" height="5" rx="2.5" fill="#c5d0dd"/>
    <text x="32" y="228" font-family="Arial" font-size="19" font-weight="800" fill="#111c31">Nouvelle photo clinique</text>
    <text x="32" y="250" font-family="Arial" font-size="12" font-weight="700" fill="#667790">BENNANI Sara · Dossier DC-0012</text>
    <rect x="32" y="270" width="286" height="190" rx="20" fill="#dbe5ef" stroke="#c8d5e2"/>
    <path d="M60 420 C95 350 135 325 175 350 C215 375 240 330 294 405" fill="none" stroke="#84a4c7" stroke-width="5" opacity=".65"/>
    <circle cx="173" cy="350" r="20" fill="#b9cee2"/>
    <text x="128" y="382" font-family="Arial" font-size="11" font-weight="700" fill="#60758f">PREVIEW PHOTO</text>
    <text x="32" y="488" font-family="Arial" font-size="11" fill="#6a7b91">La photo n'est pas enregistrée avant confirmation.</text>
    <rect x="32" y="510" width="126" height="54" rx="16" fill="#ffffff" stroke="#cbd8e5"/>
    <text x="59" y="543" font-family="Arial" font-size="13" font-weight="800" fill="#163257">↻ Reprendre</text>
    <rect x="170" y="510" width="148" height="54" rx="16" fill="url(#primary)"/>
    <text x="186" y="536" font-family="Arial" font-size="12" font-weight="800" fill="#fff">Enregistrer</text>
    <text x="194" y="551" font-family="Arial" font-size="9" font-weight="700" fill="#dceaff">dans le dossier</text>
    <text x="268" y="214" font-family="Arial" font-size="12" font-weight="700" fill="#718097">Annuler</text>
  </g>

  <!-- Success state -->
  <g transform="translate(880 120)">
    <rect width="260" height="620" rx="34" fill="url(#bg)" stroke="#cbd8e8"/>
    <text x="22" y="48" font-family="Arial" font-size="11" font-weight="700" fill="#74839a">‹  Retour</text>
    <text x="22" y="92" font-family="Arial" font-size="24" font-weight="800" fill="#111c31">Dossier patient</text>
    <rect x="20" y="126" width="220" height="112" rx="24" fill="#fff" fill-opacity=".8" stroke="#d4dfeb"/>
    <text x="38" y="164" font-family="Arial" font-size="18" font-weight="800" fill="#111c31">BENNANI Sara</text>
    <text x="38" y="190" font-family="Arial" font-size="12" font-weight="700" fill="#6b7c92">Dossier DC-0012</text>
    <rect x="20" y="262" width="220" height="196" rx="24" fill="#ffffff" fill-opacity=".88" stroke="#cfe3d7" filter="url(#shadow)"/>
    <circle cx="50" cy="296" r="16" fill="#e7f8ed"/>
    <text x="43" y="302" font-family="Arial" font-size="16" fill="#128348">✓</text>
    <text x="76" y="292" font-family="Arial" font-size="14" font-weight="800" fill="#12653b">Photo clinique</text>
    <text x="76" y="312" font-family="Arial" font-size="11" font-weight="700" fill="#43805f">enregistrée dans le dossier</text>
    <rect x="38" y="330" width="184" height="84" rx="16" fill="#dbe5ef"/>
    <path d="M52 397 C80 354 112 345 130 362 C154 384 173 345 209 394" fill="none" stroke="#86a5c6" stroke-width="4"/>
    <rect x="20" y="478" width="220" height="56" rx="17" fill="url(#primary)"/>
    <text x="54" y="512" font-family="Arial" font-size="13" font-weight="800" fill="#fff">◉  Prendre une autre photo</text>
    <text x="20" y="574" font-family="Arial" font-size="10" font-weight="700" fill="#718097">Aucun identifiant patient dans l'URL.</text>
  </g>
</svg>