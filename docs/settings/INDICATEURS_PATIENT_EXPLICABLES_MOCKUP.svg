  <text x="96" y="505" font-family="Inter, Arial" font-size="25" font-weight="800" fill="#0f172a">Repères du dossier</text>
  <text x="96" y="537" font-family="Inter, Arial" font-size="14" fill="#64748b">AMRANI Salma · T2-0001</text>
  <line x1="96" y1="558" x2="662" y2="558" stroke="#e2e8f0"/>
  <text x="96" y="598" font-family="Inter, Arial" font-size="12" font-weight="800" fill="#64748b">DERNIÈRE VISITE</text>
