  <text x="762" y="505" font-family="Inter, Arial" font-size="25" font-weight="800" fill="#0f172a">Prochaine action factuelle</text>
  <rect x="762" y="540" width="582" height="118" rx="20" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="786" y="574" font-family="Inter, Arial" font-size="15" font-weight="800" fill="#0f172a">Planifier un RDV</text>
  <text x="786" y="603" font-family="Inter, Arial" font-size="14" fill="#475569">Aucun rendez-vous futur n'est enregistré.</text>
  <text x="786" y="632" font-family="Inter, Arial" font-size="12" fill="#64748b">Pourquoi ? Traitement orthodontique actif · Source : Agenda</text>
  <text x="762" y="708" font-family="Inter, Arial" font-size="13" font-weight="800" fill="#64748b">CE QUI DISPARAÎT</text>
  <text x="786" y="742" font-family="Inter, Arial" font-size="15" fill="#b91c1c">✕ Intelligence score /100</text>
  <text x="786" y="772" font-family="Inter, Arial" font-size="15" fill="#b91c1c">✕ “Risque No-Show” basé sur de simples annulations</text>
  <text x="786" y="802" font-family="Inter, Arial" font-size="15" fill="#b91c1c">✕ “Amélioration / dégradation” IMPA par signe seul</text>
  <text x="786" y="832" font-family="Inter, Arial" font-size="15" fill="#b91c1c">✕ Toast NBA sans justification visible</text>
  <text x="762" y="882" font-family="Inter, Arial" font-size="12" font-weight="700" fill="#64748b">Journey et Finances restent inchangés hors raccord minimal.</text>
