  <rect x="96" y="662" width="566" height="92" rx="18" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="118" y="692" font-family="Inter, Arial" font-size="13" font-weight="800" fill="#c2410c">À replanifier</text>
  <text x="118" y="718" font-family="Inter, Arial" font-size="14" fill="#7c2d12">Pourquoi ? Acte enregistré dans les 90 derniers jours et aucun RDV futur.</text>
