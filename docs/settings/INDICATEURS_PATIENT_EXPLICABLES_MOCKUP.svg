  <text x="118" y="828" font-family="Inter, Arial" font-size="14" fill="#1e3a8a">1 RDV annulé sur 4 récents · vérifier le prochain créneau avec le patient.</text>
  <text x="96" y="882" font-family="Inter, Arial" font-size="12" font-weight="700" fill="#64748b">Données du dossier • règles déterministes</text>

