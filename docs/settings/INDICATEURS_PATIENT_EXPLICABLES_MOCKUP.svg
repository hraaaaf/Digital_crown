  <text x="1147" y="260" font-family="Inter, Arial" font-size="13" font-weight="800" fill="#334155">Patient prioritaire</text>
  <text x="176" y="326" font-family="Inter, Arial" font-size="13" fill="#64748b">Pas de Platinum / Gold / Bronze. Chaque repère décrit une donnée réelle.</text>

  <rect x="64" y="414" width="630" height="490" rx="30" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
