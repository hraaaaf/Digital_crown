schema_version: "2.0"
title: Cephalometric measurement
type: object
required: [id, canonical_name, analysis, version, status, formula_source_ids, landmarks, geometry, unit, sign_convention, orientation, calibration, precision, norm_profile_ids, missing_data_behavior, degenerate_geometry_behavior, dependencies, limitations, test_references, approval]
properties:
  id: {type: string}
  canonical_name: {type: string}
  analysis: {type: string}
  version: {type: string}
  status: {type: string}
  formula_source_ids: {type: array, minItems: 1, uniqueItems: true, items: {type: string}}
  landmarks:
    type: array
    items: {type: object, required: [id, role]}
  geometry:
    type: object
    required: [kind, formula, directed]
    properties:
      kind: {type: string, enum: [angle, distance, ratio, projection]}
      formula: {type: string}
      directed: {type: boolean}
  unit: {type: string, enum: [degree, mm, ratio, percent]}
  sign_convention: {type: string}
  orientation: {type: object, required: [required, reference]}
  calibration: {type: object, required: [required, unit_per_pixel_source]}
  precision: {type: object, required: [compute, storage, display_decimals]}
  norm_profile_ids: {type: array, items: {type: string}}
  missing_data_behavior: {type: string, enum: [block, not-computable]}
  degenerate_geometry_behavior: {type: string, enum: [block, not-computable]}
  dependencies: {type: array, items: {type: string}}
  limitations: {type: array, items: {type: string}}
  test_references: {type: array, items: {type: string}}
  approval: {type: object}
additionalProperties: false
