schema_version: "2.0"
title: Scientific rule
type: object
required: [id, domain, version, status, source_ids, population, inputs, prerequisites, logic_reference, outputs, missing_data_behavior, limitations, test_references, approval]
properties:
  id: {type: string, pattern: "^[a-z0-9][a-z0-9-]+$"}
  domain: {type: string, enum: [pharmacology, clinical-diagnosis, cephalometry, radiology]}
  version: {type: string}
  status: {type: string, enum: [candidate, needs_review, approved-for-implementation, active, deprecated, rejected, conflicting-sources, license_uncertain]}
  source_ids: {type: array, minItems: 1, uniqueItems: true, items: {type: string}}
  population:
    type: object
    required: [description, age_range, sex, jurisdiction]
    properties:
      description: {type: string}
      age_range: {type: string}
      sex: {type: string}
      jurisdiction: {type: string}
  inputs:
    type: array
    items:
      type: object
      required: [name, data_type, unit, required]
      properties:
        name: {type: string}
        data_type: {type: string}
        unit: {type: string}
        required: {type: boolean}
  prerequisites: {type: array, items: {type: string}}
  exclusions: {type: array, items: {type: string}}
  logic_reference: {type: string}
  outputs: {type: array, items: {type: object}}
  missing_data_behavior: {type: string, enum: [block, return-unknown, require-clinician-input, not-applicable]}
  limitations: {type: array, items: {type: string}}
  test_references: {type: array, items: {type: string}}
  approval:
    type: object
    required: [scientific_reviewer, clinician_reviewer, reviewed_at]
    properties:
      scientific_reviewer: {type: string}
      clinician_reviewer: {type: string}
      reviewed_at: {type: string}
additionalProperties: false
