<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <rect width="100" height="100" fill="#1e293b" rx="20" />
  <defs>
    <!-- Simple, clean medical blue gradient -->
    <linearGradient id="medGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    /* One-line drawing animation effect */
    .draw {
      stroke-dasharray: 180;
      stroke-dashoffset: 180;
      animation: draw-line 3.5s ease-in-out infinite alternate;
    }
    @keyframes draw-line {
      0% { stroke-dashoffset: 180; }
      100% { stroke-dashoffset: 0; }
    }
  </style>

  <!-- Continuous morphed line: Mirror -> Explorer Probe -> Turbine -> Mirror -->
  <path class="draw" stroke="url(#medGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"
        d="M 20 80 C 30 70 40 60 50 50 C 55 45 60 45 65 40 C 70 30 85 30 85 45 C 85 60 70 60 65 40">
    <animate attributeName="d" 
             values="
               M 20 80 C 30 70 40 60 50 50 C 55 45 60 45 65 40 C 70 30 85 30 85 45 C 85 60 70 60 65 40;
               M 20 80 C 30 70 40 60 50 50 C 55 45 60 45 65 40 C 70 35 75 30 75 20 C 75 15 72 12 68 15;
               M 20 80 C 30 70 40 60 50 50 C 55 45 60 45 65 40 C 70 35 75 35 75 30 C 75 30 72 40 70 45;
               M 20 80 C 30 70 40 60 50 50 C 55 45 60 45 65 40 C 70 30 85 30 85 45 C 85 60 70 60 65 40" 
             dur="8s" repeatCount="indefinite" />
  </path>
</svg>
