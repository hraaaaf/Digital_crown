<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Digital Crown" />
    <meta name="theme-color" content="#003380" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>Digital Crown</title>
    <script>
      (function() {
        const theme = localStorage.getItem('digitalcrown_theme') || '';
        if (theme) document.documentElement.dataset.theme = theme;
      })();
    </script>
    <script>
      (function () {
        const allowedPreviewHosts = new Set([
          'digital-crown-p2-runtime-q7spkciph-achraf-benmoussa-s-projects.vercel.app',
          'digital-crown-p2-runtime-git-51e609-achraf-benmoussa-s-projects.vercel.app'
        ]);
        const params = new URLSearchParams(window.location.search);
        const requestedDemo = params.get('demo') === '1';
        const isDedicatedPreview = allowedPreviewHosts.has(window.location.hostname);
        const isDemoRoute = window.location.pathname === '/mobile/demo';
        const isOnboardingRoute = window.location.pathname === '/mobile/onboarding';

        window.__DC_PREVIEW_DEMO_REDIRECT__ = false;

        if (requestedDemo && isDedicatedPreview && isDemoRoute) {
          const policy = document.createElement('meta');
          policy.httpEquiv = 'Content-Security-Policy';
          policy.content = "connect-src 'none'; form-action 'none'";
          policy.dataset.dcPreviewIsolation = 'true';
          document.head.appendChild(policy);
          return;
        }

        if (!requestedDemo || !isDedicatedPreview || isOnboardingRoute) return;

        window.__DC_PREVIEW_DEMO_REDIRECT__ = true;
        window.location.replace('/mobile/onboarding?demo=1');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      if (!window.__DC_PREVIEW_DEMO_REDIRECT__) {
        await import('/src/main.tsx');
      }
    </script>
  </body>
</html>
