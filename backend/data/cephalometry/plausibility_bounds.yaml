# Cephalometric plausibility bounds — Phase 2 (legacy inventory).
#
# Copied exactly from backend/services/cephalo_consistency_validator.py's
# current _HARD_BOUNDS / _SOFT_BOUNDS / _MM_METRICS dicts, plus the
# frontend Step4Documents.tsx ANGLE_CARDS "flo/fhi" fatal-boundary values
# that duplicate several of these hard bounds independently. Where a
# Step4 card has no separate soft band of its own (it only has a single
# fatal boundary), soft_min/soft_max are set equal to hard_min/hard_max —
# this accurately represents "this origin does not distinguish soft from
# hard", not an invented soft band.
#
# These bounds are NOT normative profiles (see normative_profiles.yaml) —
# they represent "anatomically possible for any human", independent of
# population/age/sex, per the approved architecture design §18.
#
# Schema: docs/scientific-ai/templates/plausibility-bounds.schema.yaml
# Types:  backend/schemas/cephalo_normative.py::PlausibilityBounds

