# Cephalometric measurement definitions — Phase 2 (legacy inventory).
#
# `origin` here points to the geometric formula's primary location (usually
# backend/services/cephalo_engine.py). It is NOT where a norm value lives —
# that's on the NormativeProfile/ClassificationRule/PlausibilityBounds
# entries in the sibling files, each with its own origin.
#
# `definition_version: "v1"` for everything: this phase does not change any
# formula, so there is exactly one version of each in the current codebase.
#
# Schema: docs/scientific-ai/templates/cephalo-measurement.schema.yaml
# Types:  backend/schemas/cephalo_normative.py::MeasurementDefinition

