# Cephalometric normative profiles — Phase 2 (legacy inventory).
#
# Every entry here is a literal copied EXACTLY as it appears in the current
# codebase, tagged validation_status: LEGACY_UNVALIDATED (or QUARANTINED for
# the four quarantined measurements). No value has been corrected, rounded,
# harmonized, or arbitrated between conflicting sources — where two origins
# disagree (e.g. Inter_Incisif ±10 vs ±13, Ligne_E -4/-2 vs -2/-1), BOTH
# entries are kept, exactly as coded.
#
# population_id: UNSPECIFIED_LEGACY for every entry — no population field
# exists anywhere in Digital Crown's patient model or code today, so this
# honestly reflects "whatever population the original unsourced literal
# assumed" rather than inventing a specific population claim.
#
# source_id: omitted for every entry — Phase 2 does not choose or validate
# scientific sources. See docs/scientific-ai/SOURCE_REGISTRY.yaml separately
# for candidate publications; none are linked here yet (Phase 4's job).
#
# effective_from: 2026-07-20 for every entry — the date this Phase 2
# migration happened, not a claim about when the underlying value was
# first validated (it hasn't been).
#
# Schema: docs/scientific-ai/templates/normative-profile.schema.yaml
# Types:  backend/schemas/cephalo_normative.py::NormativeProfile

