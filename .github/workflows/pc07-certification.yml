name: PC-07 Emergency Photo Certification

on:
  pull_request:
    branches: [master]
    paths:
      - "backend/models_patient_companion.py"
      - "alembic/versions/pc070000014_add_pc07_emergency_photo_chunks.py"
      - "backend/routers/patient_companion.py"
      - "backend/routers/patient_companion_emergency_photo.py"
      - "backend/routers/mobile_resource_bridge.py"
      - "backend/services/clinical_photo_normalization.py"
      - "backend/services/patient_companion_emergency_photo.py"
      - "backend/services/patient_companion_remote_worker.py"
      - "backend/tests/test_patient_companion_emergency_photo.py"
      - "frontend/src/features/patient-companion/**"
      - ".github/workflows/pc07-certification.yml"
      - "docs/clinic/patient_companion/PC_07_*.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pc07:
    name: PC-07 emergency photo safety boundary
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: "sqlite:///:memory:"
      ENVIRONMENT: test
      SECRET_KEY: pc07-certification-only-secret-key-000001
      TELEMETRY_ENABLED: "false"
      CLOUD_AI_ENABLED: "false"
      DIGITALCROWN_ISOLATED_RUNTIME: "true"
      CABINET_MASTER_KEY_HEX: "1111111111111111111111111111111111111111111111111111111111111111"

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Assert exact head
        if: github.event_name == 'pull_request'
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install focused Python dependencies
        run: >-
          python -m pip install
          pytest==9.0.3
          alembic==1.20.0
          "pydantic[email]==2.6.3"
          fastapi==0.115.6
          passlib==1.7.4
          bcrypt==3.2.2
          python-dotenv==1.0.1
          pydantic-settings==2.2.1
          python-jose==3.5.0
          python-multipart==0.0.31
          qrcode==8.2
          pillow==12.2.0
          opencv-python-headless==4.13.0.92
          reportlab==4.4.10
          arabic-reshaper==3.0.0
          python-bidi==0.6.7
          Jinja2==3.1.6
          SQLAlchemy==2.0.28
          httpx==0.28.1
          jwcrypto==1.6.1
          PyMuPDF==1.26.6
          firebase-admin==7.5.0
          sentry-sdk[fastapi]==2.69.0

      - name: Alembic graph
        run: python -m alembic heads

      - name: PC-07 backend emergency-photo invariants
        run: python -m pytest backend/tests/test_patient_companion_emergency_photo.py -q --maxfail=1

      - name: M6-A shared normalizer regression
        run: python -m pytest backend/tests/test_mobile_m6a_clinical_photo.py -q --maxfail=1

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: PC-07 frontend truth-boundary tests
        working-directory: frontend
        run: npm test -- --run src/features/patient-companion/PatientCompanionEmergencyPhoto.test.tsx

      - name: Frontend production build
        working-directory: frontend
        run: npm run build
