name: Sidebar Help Visual Certification

on:
  pull_request:
    paths:
      - "frontend/src/components/Sidebar.tsx"
      - "frontend/src/features/clinical_tips/**"
      - ".github/workflows/sidebar-help-visual-cert.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    name: Capture ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: before
            ref: a58589c1b8769864a6e3e4162e1c8d06fc8678d5
          - label: after
            ref: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout target
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend and Chromium
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Materialize deterministic Sidebar harness
        working-directory: frontend
        run: |
          cat > sidebar-help-cert.html <<'EOF'
          <!doctype html>
          <html lang="fr">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <title>Sidebar Help Certification</title>
            </head>
            <body>
              <div id="root"></div>
              <script type="module" src="/src/sidebar-help-cert.tsx"></script>
            </body>
          </html>
          EOF

          cat > src/sidebar-help-cert.tsx <<'EOF'
          import React from 'react';
          import { createRoot } from 'react-dom/client';
          import { MemoryRouter } from 'react-router-dom';
          import './index.css';
          import { Sidebar } from './components/Sidebar';
          import { useAuthStore } from './stores/useAuthStore';
          import { useSettingsStore } from './features/admin/Settings/hooks/useSettingsStore';

          localStorage.removeItem('clinical_tips_enabled');
          useAuthStore.setState({
            user: {
              id: 1,
              email: 'admin@visual.local',
              nom_complet: 'Dr Visual Cert',
              role: 'ADMIN',
              is_superadmin: false,
              permissions: {},
            } as any,
            isAuthenticated: true,
            isLoading: false,
            error: null,
          });
          useSettingsStore.setState({
            activeCabinetId: 'visual',
            cabinets: [{
              id: 'visual',
              nom: 'Cabinet Visual',
              specialty: 'Chirurgien Dentiste',
              primary_color: '#003380',
              accent_color: '#60a5fa',
              theme: 'elite',
              caisse: 0,
            }],
          });

          createRoot(document.getElementById('root')!).render(
            <React.StrictMode>
              <MemoryRouter initialEntries={['/dashboard']}>
                <div className="h-screen bg-medical-pearl">
                  <Sidebar />
                </div>
              </MemoryRouter>
            </React.StrictMode>,
          );
          EOF

          cat > sidebar-help-cert.mjs <<'EOF'
          import { chromium } from 'playwright';
          import { createServer } from 'vite';
          import fs from 'node:fs/promises';

          const output = 'sidebar-help-artifacts';
          await fs.mkdir(output, { recursive: true });
          const server = await createServer({ server: { host: '127.0.0.1', port: 4181, strictPort: true }, clearScreen: false });
          await server.listen();
          const browser = await chromium.launch();
          try {
            for (const width of [1440, 1024]) {
              const context = await browser.newContext({ viewport: { width, height: 900 } });
              const page = await context.newPage();
              await page.route('**/api/**', async route => {
                await route.fulfill({ status: 200, contentType: 'application/json', body: JSON.stringify({ total: 0 }) });
              });
              const errors = [];
              page.on('pageerror', error => errors.push(`pageerror: ${error.message}`));
              page.on('console', message => { if (message.type() === 'error') errors.push(`console: ${message.text()}`); });
              await page.goto('http://127.0.0.1:4181/sidebar-help-cert.html', { waitUntil: 'networkidle' });
              await page.waitForTimeout(11200);
              const tipVisible = await page.getByText('Elite Clinical Tip').isVisible().catch(() => false);
              await page.screenshot({ path: `${output}/${width}x900.png`, fullPage: true, animations: 'disabled' });
              await fs.writeFile(`${output}/${width}x900.txt`, `tipVisible=${tipVisible}\nerrors=${errors.join(' | ')}\n`);
              await context.close();
            }
          } finally {
            await browser.close();
            await server.close();
          }
          EOF

      - name: Capture at unsolicited-trigger time
        working-directory: frontend
        run: node sidebar-help-cert.mjs

      - name: Record metadata
        working-directory: frontend
        env:
          TARGET_REF: ${{ matrix.ref }}
          TARGET_LABEL: ${{ matrix.label }}
        run: |
          cat > sidebar-help-artifacts/metadata.txt <<EOF
          label=${TARGET_LABEL}
          ref=${TARGET_REF}
          goal=no unsolicited help popup or help-specific attention animation
          viewports=1440x900,1024x900
          capture_delay_ms=11200
          EOF

      - name: Upload proof
        uses: actions/upload-artifact@v4
        with:
          name: sidebar-help-${{ matrix.label }}
          path: frontend/sidebar-help-artifacts/
          if-no-files-found: error
          retention-days: 14
