name: Facad Ricketts 32F PTV cranial cluster contract

on:
  push:
    branches:
      - feat/ortho-studio-lot08-ricketts-protocol-v2
    paths:
      - .github/workflows/facad-314-ricketts32-ptv-cranial-contract.yml
      - docs/audits/schemas/ortho_lot08_ricketts32_facad_ptv_cranial_cluster_resolution_v1.json
      - docs/audits/schemas/ortho_lot08_facad_dc_unmapped_backlog_v1.json
      - scripts/ci_contract_tests/test_cephalo_lot08_ricketts32_facad_ptv_cranial_cluster_contract.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pytest
        shell: pwsh
        run: python -m pip install --disable-pip-version-check pytest==9.0.3

      - name: Download and extract official Facad 3.14.1 payload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path facad-r32-ptv | Out-Null
          $installer = 'facad-r32-ptv/Facad-Installer-3.14.1.1111.exe'
          Invoke-WebRequest -Uri 'https://downloads.citodent.com/pub/Facad/Facad-Installer-3.14.1.1111.exe' -OutFile $installer
          $seven = "$env:ProgramFiles\7-Zip\7z.exe"
          New-Item -ItemType Directory -Force -Path facad-r32-ptv/outer | Out-Null
          & $seven x $installer '-ofacad-r32-ptv/outer' -y | Out-Null
          New-Item -ItemType Directory -Force -Path facad-r32-ptv/release | Out-Null
          & $seven x 'facad-r32-ptv/outer/FacadRelease-3.14.1.1111.zip' '-ofacad-r32-ptv/release' -y | Out-Null

      - name: Verify pinned Ricketts 32F profile bytes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = 'd0b442b39ac7db3dc9c46d807cb3c20bd937c69783b096b484872017f9376518'
          $path = 'facad-r32-ptv/release/Ceph/Ricketts (32 F).cph'
          $actual = (Get-FileHash -Algorithm SHA256 $path).Hash.ToLowerInvariant()
          Write-Host "Ricketts32.cph sha256=$actual"
          if ($actual -ne $expected) { throw "Ricketts32.cph SHA256 drift: expected $expected got $actual" }

      - name: Verify exact vendor definitions for PTV cranial cluster
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          root = ET.parse(Path(r"facad-r32-ptv/release/Ceph/Ricketts (32 F).cph")).getroot()

          expected = {
              "Ms-PtV": ("ProjLine", ["FH", "Pt", "Ms-d"], "19±3"),
              "Cranium ant len": ("Dist2p", ["CC", "N"], "61±2.5"),
              "PFH": ("Dist2p", ["CF", "Go"], "63±3.5"),
              "Ramus Xi pos": ("Angle3p", ["CF", "Xi", "P"], "76±3"),
              "Porion pos": ("DistLine", ["PtV", "P"], "-33.5±2"),
          }
          expected_constructions = {
              "FH": ("Line", ["P", "Or"]),
              "PtV": ("Normal", ["FH", "Pt"]),
              "CF": ("Inter2ln", ["FH", "PtV"]),
              "CC": ("Intersect", ["N", "Ba", "Pt", "Gn"]),
              "Xi": ("Intersect", ["R23", "R14", "R13", "R24"]),
          }
          expected_markers = {
              "P": "Porion",
              "Or": "Orbitale",
              "Pt": "Pterygo-maxillary fissure; Foramen rotundum",
              "Ms-d": "Molar superior, most distal point",
              "Go": "Gonion",
              "Gn": "Gnathion",
              "N": "Nasion",
              "Ba": "Basion",
          }

          found = {}
          constructions = {}
          porion_change_right_left = None
          for e in root.iter("ceph_calc"):
              fields = {}
              for c in list(e):
                  if len(list(c)) == 0:
                      fields.setdefault(c.tag, []).append((c.text or "").strip())
              name = (fields.get("name") or [None])[0]
              if name in expected:
                  found[name] = (
                      (fields.get("calc_type") or [None])[0],
                      fields.get("point_ref", []),
                      (fields.get("norm") or [None])[0],
                  )
                  if name == "Porion pos":
                      porion_change_right_left = (fields.get("changeRightLeft") or [None])[0]
              if name in expected_constructions:
                  constructions[name] = (
                      (fields.get("calc_type") or [None])[0],
                      fields.get("point_ref", []),
                  )

          markers = {}
          for e in root.iter("marker"):
              fields = {c.tag: (c.text or "").strip() for c in list(e) if len(list(c)) == 0}
              name = fields.get("name")
              if name in expected_markers:
                  markers[name] = fields.get("longname")

          assert found == expected, (found, expected)
          assert constructions == expected_constructions, (constructions, expected_constructions)
          assert markers == expected_markers, (markers, expected_markers)
          assert porion_change_right_left == "true", porion_change_right_left
          print("VENDOR_PTV_CRANIAL_ASSERTIONS=PASS", len(found), len(constructions), len(markers))
          '@ | python -

      - name: Run PTV cranial contract tests
        shell: pwsh
        run: python -m pytest scripts/ci_contract_tests/test_cephalo_lot08_ricketts32_facad_ptv_cranial_cluster_contract.py -q
