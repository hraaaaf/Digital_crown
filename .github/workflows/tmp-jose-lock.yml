name: TEMP Generate JOSE lockfile

on:
  push:
    branches:
      - feature/patient-companion-e2e-relay-gate
    paths:
      - ".github/workflows/tmp-jose-lock.yml"
  pull_request:
    paths:
      - ".github/workflows/tmp-jose-lock.yml"
      - "frontend/package.json"
      - "frontend/package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Generate lockfile with jose
        working-directory: frontend
        run: npm install jose@6.2.12 --save-exact --package-lock-only --ignore-scripts
      - uses: actions/upload-artifact@v4
        with:
          name: jose-lockfile
          path: |
            frontend/package.json
            frontend/package-lock.json
          if-no-files-found: error
