name: FACAD F02.4 DC synthetic layer interaction proof
on:
  push:
    branches:
      - research/facad-dc-visual-comparison-20261011
    paths:
      - .github/workflows/facad-dc-layer-interaction-observation.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  digital-crown-layer-interaction:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PRODUCT_HEAD: c0d47f4832e6da2211c6f94eb88f0db56fcaebb6
    steps:
      - name: Checkout pinned product tree without product edits
        uses: actions/checkout@v4
        with:
          ref: c0d47f4832e6da2211c6f94eb88f0db56fcaebb6
          persist-credentials: false
      - name: Verify exact HEAD and unmodified source harness
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$PRODUCT_HEAD"
          test "$(git hash-object frontend/scripts/capture-cephalo-r19-analysis-reference-after.mjs)" = "01a834b070ced65fd8074e5cbfe7c0e3b2a8916d"
          test "$(git hash-object frontend/src/features/ortho/orthoLayerRegistry.ts)" = "0597b006bb8c0a093a0563e12c1ad1fe676720a8"
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install synthetic UI dependencies
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save --package-lock=false --legacy-peer-deps playwright@1.55.0 react-is@19.2.0 @testing-library/dom@10.4.1 pngjs@7.0.0
          npx playwright install --with-deps chromium
      - name: Extend checked-in R19 browser fixture temporarily with measured layer actions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('frontend/scripts/capture-cephalo-r19-analysis-reference-after.mjs')
          s=p.read_text()
          a="  { name: '768x1024', width: 768, height: 1024 },"
          assert s.count(a)==1
          s=s.replace(a,"  { name: '1024x768', width: 1024, height: 768 },\n"+a)
          # Synthetic, ephemeral visual content only; do not edit the pinned product or checked-in harness.
          fixture_needle=" visual_debug:{}, calibration_status:'verified'"
          assert s.count(fixture_needle)==1
          fixture_data=" visual_debug:{normative_zones:[{cx:600,cy:600,rx:48,ry:25,rotation:0}]}, t1_projection:Object.fromEntries(landmarks.map(p=>[p.id,[p.x-14,p.y-8]])), t2_projection:Object.fromEntries(landmarks.map(p=>[p.id,[p.x+18,p.y+9]])), calibration_status:'verified'"
          s=s.replace(fixture_needle,fixture_data)
          import_needle="import path from 'node:path';"
          assert s.count(import_needle)==1
          s=s.replace(import_needle,import_needle+"\nimport { createHash } from 'node:crypto';\nimport pngjs from 'pngjs';\nconst { PNG } = pngjs;")
          needle='  const states=[];'
          assert s.count(needle)==1
          extra=r"""
          const layerAudit={viewport:viewport.name,fixture:'synthetic-only',controlled:[],hardTissueDisabled:false,valid:false};
          // Independent browser DOM oracle: inspect SVG geometry, not the pressed control.
          const selectors={
            landmarks:'svg [data-ortho-layer="landmarks"]',
            plans:'svg [data-ortho-layer="plans"]',
            teeth:'svg path[d^="M 0,-52"]',
            soft_tissue:'svg [data-ortho-layer="soft_tissue"]',
            measurements:'svg [data-ortho-layer="measurements"]',
            t1:'svg [data-cephalo-line-key]',
            t2:'svg [data-cephalo-line-key]'
          };
          const svgProbe=async(id)=>{
            const inspected=await page.evaluate(sel=>{
              const host=document.querySelector('[data-cephalo-analysis]');
              if(!host)throw new Error('Cephalometric SVG host is missing');
              const elements=Array.from(host.querySelectorAll(sel));
              return {count:elements.length,markup:elements.map(n=>n.outerHTML).join('\n')};
            },selectors[id]);
            return {count:inspected.count,sha256:createHash('sha256').update(inspected.markup).digest('hex')};
          };
          const waitForSvgCount=async(id,oldCount,changed)=>{
            await page.waitForFunction(([selector,baseline,expectChanged,showProjection])=>{
              const host=document.querySelector('[data-cephalo-analysis]');
              if(!host)return false;
              const count=host.querySelectorAll(selector).length;
              return expectChanged?(showProjection?count>baseline:count===0):count===baseline;
            },[selectors[id],oldCount,changed,id==='t1'||id==='t2'],{timeout:6000});
          };
          // Element capture forces the tracing SVG into view on mobile (viewport capture alone can miss it).
          const traceSvg=page.locator('[data-cephalo-analysis] svg:has(image)').first();
          await traceSvg.waitFor({state:'attached',timeout:6000});
          let lastTracePng,lastTraceBytes;
          const tracePixel=async(filename)=>{
            const bytes=await traceSvg.screenshot({animations:'disabled',timeout:20000});
            lastTraceBytes=bytes;
            lastTracePng=PNG.sync.read(bytes);
            if(filename)await writeFile(path.join(OUTPUT_DIR,filename),bytes);
            return {bytes:bytes.length,sha256:createHash('sha256').update(bytes).digest('hex')};
          };
          // Fixed, preregistered visual thresholds; no dynamic tuning from this run.
          const rasterDiff=(a,b)=>{
            if(a.width!==b.width||a.height!==b.height)throw new Error('Raster geometry changed');
            let pixelsOver3=0,pixelsOver10=0,pixelsOver30=0,maxRgbDelta=0,energyRgb=0,excessEnergyOver10=0;
            for(let i=0;i<a.data.length;i+=4){
              const dr=Math.abs(a.data[i]-b.data[i]);
              const dg=Math.abs(a.data[i+1]-b.data[i+1]);
              const db=Math.abs(a.data[i+2]-b.data[i+2]);
              const d=Math.max(dr,dg,db);
              maxRgbDelta=Math.max(maxRgbDelta,d);
              energyRgb+=dr+dg+db;
              excessEnergyOver10+=Math.max(dr-10,0)+Math.max(dg-10,0)+Math.max(db-10,0);
              if(d>3)pixelsOver3++;
              if(d>10)pixelsOver10++;
              if(d>30)pixelsOver30++;
            }
            return {totalPixels:a.width*a.height,pixelsOver3,pixelsOver10,pixelsOver30,maxRgbDelta,energyRgb,excessEnergyOver10};
          };
          const visualGate=(before,toggled,restored)=>{
            const toggle=rasterDiff(before,toggled);
            const residual=rasterDiff(before,restored);
            return {toggle,residual,changed:toggle.pixelsOver30>=60,
              restored:residual.pixelsOver30===0
                && residual.pixelsOver10<=Math.max(35,Math.ceil(residual.totalPixels*0.0003))
                && residual.pixelsOver3<=Math.max(350,Math.ceil(residual.totalPixels*0.001))
                && residual.excessEnergyOver10<=250};
          };
          const geometrySegments=async()=>page.evaluate(()=>{
            const root=document.querySelector('[data-cephalo-analysis]');
            return Array.from(root?.querySelectorAll('svg line[data-cephalo-line-key]')??[]).map(el=>({
              key:el.getAttribute('data-cephalo-line-key'),
              x1:Number(el.getAttribute('x1')),y1:Number(el.getAttribute('y1')),
              x2:Number(el.getAttribute('x2')),y2:Number(el.getAttribute('y2'))
            }));
          });
          layerAudit.tracePixelProbes=[];
          layerAudit.svgProbes=[];
          const hardControl=page.locator('[data-ortho-layer-control="hard_tissue"] button');
          await hardControl.waitFor({state:'visible',timeout:8000});
          layerAudit.hardTissueDisabled=await hardControl.isDisabled();
          const hardLabel=(await hardControl.getAttribute('aria-label'))||'';
          if(!layerAudit.hardTissueDisabled || !hardLabel.includes('en construction'))
            throw new Error('hard_tissue gate incorrectly appears available');
          await page.screenshot({path:path.join(OUTPUT_DIR,'layer-before-'+viewport.name+'.png'),fullPage:false});
          await page.waitForTimeout(350);
          await tracePixel('trace-before-'+viewport.name+'.png');
          // Adversarial calibration: a single obvious corrupted pixel MUST be rejected,
          // while a ≤10 RGB single-channel perturbation is treated as capture noise.
          const clean=lastTracePng;
          const corrupt={...clean,data:Buffer.from(clean.data)};
          corrupt.data[0]=clean.data[0]>127?0:255;
          const benign={...clean,data:Buffer.from(clean.data)};
          benign.data[0]=clean.data[0]>127?clean.data[0]-10:clean.data[0]+10;
          const widespread={...clean,data:Buffer.from(clean.data)};
          for(let i=0;i<3000;i++){
            const offset=i*4;
            widespread.data[offset]=clean.data[offset]>127?clean.data[offset]-5:clean.data[offset]+5;
          }
          if(visualGate(clean,clean,corrupt).restored||visualGate(clean,clean,widespread).restored||!visualGate(clean,clean,benign).restored)
            throw new Error('Raster visual-oracle single-pixel/broad-drift sabotage or benign-noise controls failed');
          layerAudit.rasterOracleSabotageRejected=true;
          layerAudit.rasterOracleWidespreadDriftRejected=true;
          layerAudit.rasterOracleBenignNoiseAccepted=true;
          for(const id of ['landmarks','plans','teeth','soft_tissue','measurements','t1','t2']){
            const control=page.locator('[data-ortho-layer-control="'+id+'"] button');
            if(await control.isDisabled())throw new Error('Available layer unexpectedly disabled: '+id);
            const original=await control.getAttribute('aria-pressed');
            if(original!=='true'&&original!=='false')throw new Error('Missing original pressed state: '+id);
            const beforeSvg=await svgProbe(id);
            if(beforeSvg.count===0)throw new Error('No fixture-backed SVG geometry before toggling '+id);
            await page.waitForTimeout(200);
            const beforePixel=await tracePixel('trace-layer-before-'+id+'-'+viewport.name+'.png');
            const beforeRaster=lastTracePng;
            const baselineSegments=(id==='t1'||id==='t2')?await geometrySegments():null;

            const changed=original==='true'?'false':'true';
            // Negative control: spoof pressed state without React click; SVG MUST stay unchanged.
            await control.evaluate((node,state)=>node.setAttribute('aria-pressed',state),changed);
            const spoofSvg=await svgProbe(id);
            const spoofRejected=spoofSvg.count===beforeSvg.count&&spoofSvg.sha256===beforeSvg.sha256;
            const spoofPixel=await tracePixel();
            if(spoofPixel.sha256!==beforePixel.sha256)throw new Error('Pixel image changed from aria-pressed spoof: '+id);

            await control.evaluate((node,state)=>node.setAttribute('aria-pressed',state),original);
            if(!spoofRejected)throw new Error('SVG changed after only spoofing aria-pressed: '+id);
            await control.click();
            await page.waitForFunction(([which,expected])=>
              document.querySelector('[data-ortho-layer-control="'+which+'"] button')?.getAttribute('aria-pressed')===expected,
              [id,changed],{timeout:4000});
            await waitForSvgCount(id,beforeSvg.count,true);
            const toggledSvg=await svgProbe(id);
            if(toggledSvg.sha256===beforeSvg.sha256)throw new Error('Control toggled but SVG unchanged: '+id);
            if(baselineSegments){
              const afterSegments=await geometrySegments();
              const [dx,dy]=id==='t1'?[-14,-8]:[18,9];
              const matches=(a,b)=>a.key===b.key&&Math.abs(a.x1+dx-b.x1)<1e-3&&Math.abs(a.y1+dy-b.y1)<1e-3&&Math.abs(a.x2+dx-b.x2)<1e-3&&Math.abs(a.y2+dy-b.y2)<1e-3;
              if(baselineSegments.length<6||!baselineSegments.every(a=>afterSegments.some(b=>matches(a,b))))
                throw new Error('Synthetic projection geometry not attributed to '+id);
            }
            const toggledPixel=await tracePixel('trace-layer-toggle-'+id+'-'+viewport.name+'.png');
            const toggledRaster=lastTracePng;
            if(id==='landmarks'||id==='soft_tissue')
              await writeFile(path.join(OUTPUT_DIR,'trace-toggle-'+id+'-'+viewport.name+'.png'),lastTraceBytes);
            if(toggledPixel.sha256===beforePixel.sha256)
              throw new Error('SVG markup changed but rendered tracing pixels did not: '+id);

            if(id==='landmarks'||id==='soft_tissue')
              await page.screenshot({path:path.join(OUTPUT_DIR,'layer-toggle-'+id+'-'+viewport.name+'.png'),fullPage:false});
            await control.click();
            await page.waitForFunction(([which,expected])=>
              document.querySelector('[data-ortho-layer-control="'+which+'"] button')?.getAttribute('aria-pressed')===expected,
              [id,original],{timeout:4000});
            await waitForSvgCount(id,beforeSvg.count,false);
            const restoredSvg=await svgProbe(id);
            const svgRestored=restoredSvg.sha256===beforeSvg.sha256&&restoredSvg.count===beforeSvg.count;
            if(!svgRestored)throw new Error('SVG not faithfully restored: '+id);
            // Compare raster restoration as an observed result; transient SVG animation/capture variation
            // must not be misclassified as a clinical rendering bug without pixel-difference analysis.
            await page.waitForTimeout(400);
            const restoredPixel=await tracePixel('trace-layer-restored-'+id+'-'+viewport.name+'.png');
            const restoredRaster=lastTracePng;
            if(id==='landmarks'||id==='soft_tissue')
              await writeFile(path.join(OUTPUT_DIR,'trace-restored-'+id+'-'+viewport.name+'.png'),lastTraceBytes);
            const rasterOracle=visualGate(beforeRaster,toggledRaster,restoredRaster);
            if(!rasterOracle.changed)throw new Error('Raster image did not change visibly: '+viewport.name+'/'+id+' '+JSON.stringify(rasterOracle.toggle));
            if(!rasterOracle.restored)throw new Error('Raster restoration exceeded preregistered thresholds: '+viewport.name+'/'+id+' '+JSON.stringify(rasterOracle.residual));
            layerAudit.tracePixelProbes.push({id,before:beforePixel,toggled:toggledPixel,restored:restoredPixel,spoofRejected:true,pixelsVerified:true,pixelRestoredExact:restoredPixel.sha256===beforePixel.sha256,rasterOracle});

            layerAudit.svgProbes.push({id,before:beforeSvg,toggled:toggledSvg,restored:restoredSvg,spoofRejected,svg_effect_verified:true});
            layerAudit.controlled.push({id,original,toggled:changed,restored:original,click_verified:true});
          }
          layerAudit.valid=layerAudit.rasterOracleSabotageRejected&&layerAudit.rasterOracleWidespreadDriftRejected&&layerAudit.rasterOracleBenignNoiseAccepted&&layerAudit.hardTissueDisabled&&layerAudit.controlled.length===7&&layerAudit.svgProbes.length===7&&layerAudit.svgProbes.every(x=>x.spoofRejected&&x.svg_effect_verified)&&layerAudit.tracePixelProbes.length===7&&layerAudit.tracePixelProbes.every(x=>x.pixelsVerified&&x.before.sha256!==x.toggled.sha256);
          if(!layerAudit.valid)throw new Error('Layer audit failure');
          """
          s=s.replace(needle,extra+'\n'+needle)
          original_return='return {viewport:viewport.name,attempt,valid,pageErrors,consoleErrors,states};'
          assert s.count(original_return)==1
          s=s.replace(original_return,'return {viewport:viewport.name,attempt,valid,pageErrors,consoleErrors,states,layerAudit};')
          assert s.count('layerAudit.valid')>=2
          p.write_text(s)
          PY
      - name: Execute actual Playwright clicks 7 layers times 4 viewports on local synthetic patient
        working-directory: frontend
        shell: bash
        run: |
          node scripts/capture-cephalo-r19-analysis-reference-after.mjs >/tmp/facad-dc-layer-action.log 2>&1 || { tail -120 /tmp/facad-dc-layer-action.log; exit 1; }
      - name: Verify screenshots and exact original vendor limitations
        shell: bash
        run: |
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          root=Path('frontend/cephalo-r19-analysis-reference-after-artifacts')
          z=json.loads((root/'report.json').read_text())
          viewports={'390x844','768x1024','1024x768','1280x900'}
          expected={'landmarks','plans','teeth','soft_tissue','measurements','t1','t2'}
          assert z['productHead']=='c0d47f4832e6da2211c6f94eb88f0db56fcaebb6'
          assert set(z['viewports'])==viewports
          assert z['invalidCount']==0 and not z['blockedExternalRequests']
          assert len(z['captures'])==4
          manifest={
            'schema':'FACAD_F02_4_DC_LAYER_REAL_BROWSER_ACTIONS_V2',
            'provenance':'REAL_CHROMIUM_SYNTHETIC_FIXTURE_NOT_VENDOR',
            'DC_product_head':z['productHead'],
            'vendor_source_run':37967170536,
            'vendor_source_archive_SHA256':'e8db415cda6c4dbc27cdca1eaa25bd6f6200a95a428c902726998a4fc79c1574',
            'vendor_leaf_clicks_proven':0,
            'vendor_behavior_parity_proven':False,
            'same_case_numeric_parity':False,
            'D3':'OPEN_RED',
            'f02_4':'OPEN_PARTIAL',
            'f05_1':'OPEN',
            'facad_percentage_before_and_after':53.8,
            'global_percentage_before_and_after':41.4,
            'captures':[],'layer_control_probes':[]}
          for capture in z['captures']:
            assert capture['valid'] and len(capture['states'])==6 and all(s['valid'] for s in capture['states'])
            a=capture['layerAudit']
            assert a['valid'] and a['hardTissueDisabled'] and a['viewport'] in viewports
            assert a['rasterOracleSabotageRejected'] and a['rasterOracleWidespreadDriftRejected'] and a['rasterOracleBenignNoiseAccepted']
            assert {x['id'] for x in a['controlled']}==expected
            assert all(x['click_verified'] and x['original']==x['restored'] and x['original']!=x['toggled'] for x in a['controlled'])
            assert len(a['svgProbes'])==7
            assert {x['id'] for x in a['svgProbes']}==expected
            assert all(x['spoofRejected'] and x['svg_effect_verified'] and x['before']['count']>0 and x['before']==x['restored'] and x['before']['sha256']!=x['toggled']['sha256'] for x in a['svgProbes'])
            assert len(a['tracePixelProbes'])==7
            assert all(x['pixelsVerified'] and x['spoofRejected'] and x['before']['sha256']!=x['toggled']['sha256'] and x['rasterOracle']['changed'] and x['rasterOracle']['restored'] for x in a['tracePixelProbes'])
            manifest.setdefault('pixel_restore_exact_counts',{})[a['viewport']]=sum(1 for x in a['tracePixelProbes'] if x['pixelRestoredExact'])
            manifest['layer_control_probes'].append(a)
            for name in ('layer-before','layer-toggle-landmarks','layer-toggle-soft_tissue','trace-before','trace-toggle-landmarks','trace-toggle-soft_tissue','trace-restored-landmarks','trace-restored-soft_tissue'):
              p=root/(name+'-'+a['viewport']+'.png')
              assert p.stat().st_size>1000,p
              manifest['captures'].append({'name':p.name,'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()})
            for probe_id in expected:
              for phase in ('before','toggle','restored'):
                p=root/('trace-layer-'+phase+'-'+probe_id+'-'+a['viewport']+'.png')
                assert p.stat().st_size>1000,p
                manifest['captures'].append({'name':p.name,'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()})
          assert len(manifest['layer_control_probes'])==4
          assert len(manifest['captures'])==116
          (root/'facad-f02-4-verified-layer-action-manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n')
          print('FACAD_F02_4_DC_ACTUAL_LAYER_TOGGLES=28_CONFIRMED_AND_RESTORED')
          print('FACAD_F02_4_DC_HARD_TISSUE_DISABLED=4_OF_4')
          print('FACAD_F02_4B_SVG_REAL_RENDER_TOGGLES=28_PROVEN_AND_RESTORED')
          print('FACAD_F02_4B_ARIA_SPOOF_NEGATIVES=28_REJECTED')
          print('FACAD_F02_4B_RENDERED_TRACE_PIXEL_TOGGLES=28_CHANGED_AND_SVG_RESTORED')
          print('FACAD_F02_4C_RASTER_TOLERANT_RESTORATION=28_OF_28_PREREGISTERED_THRESHOLD_PASS')
          print('FACAD_F02_4C_RASTER_NEGATIVE_CONTROL=SINGLE_CORRUPT_PIXEL_AND_WIDESPREAD_DRIFT_REJECTED_ON_4_VIEWPORTS')
          print('FACAD_F02_4C_RASTER_EVIDENCE=116_HASHED_PNGS; T1_T2_INCLUDED')
          print('FACAD_F02_4B_PROJECTED_COORDINATES=T1_T2_DISTINCT_SYNTHETIC_ORACLE')
          print('FACAD_F02_4_MOBILE_RENDERED=390x844')
          print('FACAD_F02_4_SCREENSHOTS=12_SHA256')
          print('FACAD_F02_4_SAME_CASE_VENDOR_BEHAVIOR_PROVED=false')
          print('FACAD_F02_4_PERCENTAGE_UNCHANGED=21_OF_39')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: facad-f02-4-dc-layer-action-evidence
          path: frontend/cephalo-r19-analysis-reference-after-artifacts/
          if-no-files-found: error
          retention-days: 14
