name: Superadmin Denied AFTER

on:
  pull_request:
    branches: [master]
    paths:
      - 'frontend/src/features/superadmin/SuperAdminAccessBoundary.tsx'
      - 'frontend/src/App.tsx'
      - '.github/workflows/superadmin-denied-after.yml'

permissions:
  contents: read

jobs:
  after:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend and Chromium
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Materialize AFTER harness
        working-directory: frontend
        run: |
          cat > superadmin-after.html <<'EOF'
          <!doctype html><html lang="fr"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>Superadmin denied AFTER</title></head><body><div id="root"></div><script type="module" src="/src/superadmin-after.tsx"></script></body></html>
          EOF
          cat > src/superadmin-after.tsx <<'EOF'
          import React from 'react';
          import { createRoot } from 'react-dom/client';
          import './index.css';
          import { SuperAdminAccessBoundary } from './features/superadmin/SuperAdminAccessBoundary';
          createRoot(document.getElementById('root')!).render(<React.StrictMode><SuperAdminAccessBoundary /></React.StrictMode>);
          EOF
          cat > superadmin-after.mjs <<'EOF'
          import { chromium } from 'playwright';
          import { createServer } from 'vite';
          import fs from 'node:fs/promises';
          import { execSync } from 'node:child_process';
          const output = '../artifacts/superadmin-denied-after';
          await fs.mkdir(output,{recursive:true});
          const viewports=[{width:390,height:844},{width:430,height:932},{width:768,height:1024},{width:1280,height:800}];
          const server=await createServer({server:{host:'127.0.0.1',port:4178,strictPort:true},clearScreen:false}); await server.listen();
          const browser=await chromium.launch({headless:true}); const evidence=[];
          try {
            for (const viewport of viewports) {
              const context=await browser.newContext({viewport,colorScheme:'light'}); const page=await context.newPage(); const responses=[]; const pageErrors=[];
              page.on('pageerror',e=>pageErrors.push(String(e)));
              await page.route('**/*',async route=>{const req=route.request(); const url=new URL(req.url()); if(url.port==='8005'&&url.pathname.startsWith('/api/superadmin/')){responses.push({method:req.method(),path:url.pathname,status:403}); return route.fulfill({status:403,contentType:'application/json',body:JSON.stringify({detail:'Accès plateforme refusé'})});} return route.continue();});
              await page.goto('http://127.0.0.1:4178/superadmin-after.html',{waitUntil:'networkidle',timeout:60000}); await page.waitForTimeout(800);
              const denied=await page.getByText('Accès Superadmin non autorisé',{exact:true}).count();
              const shellTitle=await page.getByText('SuperAdmin',{exact:true}).count();
              const globalManagement=await page.getByText('Gestion Globale des Licences & Clients',{exact:true}).count();
              const activationForm=await page.getByText("Générer un code d'activation",{exact:true}).count();
              const totalClients=await page.getByText('Total Clients',{exact:true}).count();
              const horizontalOverflow=await page.evaluate(()=>document.documentElement.scrollWidth>document.documentElement.clientWidth+2);
              const screenshot=`after-denied-${viewport.width}x${viewport.height}.png`; await page.screenshot({path:`${output}/${screenshot}`,fullPage:true,animations:'disabled'});
              evidence.push({viewport,screenshot,responses,denied,shellTitle,globalManagement,activationForm,totalClients,horizontalOverflow,pageErrors}); await context.close();
            }
          } finally { await browser.close(); await server.close(); }
          const head=execSync('git rev-parse HEAD',{encoding:'utf8'}).trim();
          await fs.writeFile(`${output}/report.json`,JSON.stringify({phase:'AFTER',head,viewports,captures:evidence.length,evidence},null,2));
          const invalid=evidence.some(i=>i.responses.length<2||i.responses.some(r=>r.status!==403)||i.denied!==1||i.shellTitle!==0||i.globalManagement!==0||i.activationForm!==0||i.totalClients!==0||i.horizontalOverflow||i.pageErrors.length>0);
          if(invalid) process.exit(1);
          EOF

      - name: Capture exact denied AFTER
        working-directory: frontend
        run: node superadmin-after.mjs

      - name: Upload AFTER evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: superadmin-denied-after
          path: artifacts/superadmin-denied-after
          if-no-files-found: error
          retention-days: 14
