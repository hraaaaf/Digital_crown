name: Facad D3 Windows storage observation (EXPERIMENTAL)

on:
  push:
    branches:
      - feat/cephalo-facad-direct-parity-runtime-probe
    paths:
      - .github/workflows/facad-314-d3-windows-storage-observation.yml
      - scripts/facad_314_d3_windows_snapshot.ps1
      - scripts/facad_314_d3_cold_warm_verdict_gate.py
      - scripts/facad_314_d3e_facad_root_pid_write_observer.ps1
      - scripts/facad_314_d3e3_same_file_correlation_gate.py
      - scripts/test_facad_314_d3e3_same_file_correlation_gate.py
      - scripts/facad_314_d3e4_unattributed_classification_gate.py
      - scripts/test_facad_314_d3e4_unattributed_classification_gate.py
      - scripts/facad_314_d3e5_first_observed_timing_gate.py
      - scripts/facad_314_d3e6_early_window_gate.py
      - scripts/facad_314_d3e7_preflight_gate.py
      - scripts/test_facad_314_d3e7_preflight_gate.py
      - scripts/test_facad_314_d3e6_early_window_gate.py
      - scripts/test_facad_314_d3e5_first_observed_timing_gate.py
      - scripts/facad_314_d3e_facad_root_pid_verdict_gate.py
      - scripts/test_facad_314_d3e_facad_root_pid_verdict_gate.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-sample-storage-observation:
    name: EXPERIMENTAL only - NOT Facad D3 isolation clearance
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Parse snapshot PowerShell and Python safety gate
        shell: pwsh
        run: |
          $tokens=$null
          $errors=$null
          foreach($path in @('scripts/facad_314_d3_windows_snapshot.ps1','scripts/facad_314_d3_process_io_observer.ps1','scripts/facad_314_d3e_facad_root_pid_write_observer.ps1')){
            $tokens=$null;$errors=$null
            [void][Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path).Path,[ref]$tokens,[ref]$errors)
            if($errors.Count){
              foreach($e in $errors){Write-Host "D3_PARSE_FAILURE_PATH=$path;LINE=$($e.Extent.StartLineNumber);COL=$($e.Extent.StartColumnNumber);MESSAGE=$($e.Message)"}
              throw 'D3 PowerShell collector does not parse'
            }
            Write-Host "D3_POWERSHELL_PARSE_PASS=$path"
          }
          python -m py_compile scripts/facad_314_d3_snapshot_diff_gate.py scripts/facad_314_d3_cold_warm_verdict_gate.py
          python -m py_compile scripts/facad_314_d3e_facad_root_pid_verdict_gate.py scripts/facad_314_d3e3_same_file_correlation_gate.py scripts/facad_314_d3e4_unattributed_classification_gate.py scripts/facad_314_d3e5_first_observed_timing_gate.py scripts/facad_314_d3e6_early_window_gate.py scripts/facad_314_d3e7_preflight_gate.py
          if($LASTEXITCODE -ne 0){throw 'D3 Python gate failed syntax'}

      - name: Extract official Facad installer wrapper
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force -Path facad-quick-demo | Out-Null
          $installer='facad-quick-demo/Facad-Installer-3.14.1.1111.exe'
          Invoke-WebRequest -Uri 'https://downloads.citodent.com/pub/Facad/Facad-Installer-3.14.1.1111.exe' -OutFile $installer
          $seven="$env:ProgramFiles\7-Zip\7z.exe"
          New-Item -ItemType Directory -Force -Path facad-quick-demo/outer | Out-Null
          & $seven x $installer '-ofacad-quick-demo/outer' -y | Out-Null
          Get-FileHash 'facad-quick-demo/outer/FacadNstaller.exe' -Algorithm SHA256 |
            Format-List | Set-Content facad-quick-demo/installer-wrapper-meta.txt

      - name: Select Quick demo installation only
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes

          $exe=(Resolve-Path 'facad-quick-demo/outer/FacadNstaller.exe').Path
          $wd=Split-Path $exe
          $before=Get-Date
          $p=Start-Process -FilePath $exe -WorkingDirectory $wd -PassThru
          "INSTALLER_PID=$($p.Id)" | Set-Content facad-quick-demo/quick-demo-process.txt

          # The official installer exposes its options as ControlType.Pane, not Button.
          # This was observed on run 37753115873, artifact 11539320376.
          # The official installer UI is sometimes slow to appear on GitHub Windows.
          # Wait longer for the SAME previously validated exact "Start" + "Quick demo installation" pane.
          # No alternate window or button is accepted, and no consent/activation control is clicked.
          $deadline=(Get-Date).AddSeconds(120)
          'QUICK_DEMO_EXPECTED_PANE_TIMEOUT_SECONDS=120' | Add-Content facad-quick-demo/quick-demo-process.txt
          $button=$null
          $startWindow=$null
          while((Get-Date) -lt $deadline -and $null -eq $button){
            Start-Sleep -Milliseconds 500
            $root=[System.Windows.Automation.AutomationElement]::RootElement
            $windows=$root.FindAll(
              [System.Windows.Automation.TreeScope]::Children,
              [System.Windows.Automation.PropertyCondition]::new(
                [System.Windows.Automation.AutomationElement]::ControlTypeProperty,
                [System.Windows.Automation.ControlType]::Window
              )
            )
            foreach($w in $windows){
              if($w.Current.Name -eq 'Start'){
                $startWindow=$w
                $panes=$w.FindAll(
                  [System.Windows.Automation.TreeScope]::Descendants,
                  [System.Windows.Automation.PropertyCondition]::new(
                    [System.Windows.Automation.AutomationElement]::ControlTypeProperty,
                    [System.Windows.Automation.ControlType]::Pane
                  )
                )
                foreach($candidate in $panes){
                  if($candidate.Current.Name -eq 'Quick demo installation'){
                    $button=$candidate
                    break
                  }
                }
              }
            }
          }
          if($null -eq $button){
            'QUICK_DEMO_PANE_NOT_FOUND=true' | Add-Content facad-quick-demo/quick-demo-process.txt
            # Metadata-only diagnostics. Do not log names/titles/registry values or installer license text.
            "QUICK_DEMO_START_WINDOW_SEEN=$($null -ne $startWindow)" | Add-Content facad-quick-demo/quick-demo-process.txt
            "QUICK_DEMO_INSTALLER_EXITED=$($p.HasExited)" | Add-Content facad-quick-demo/quick-demo-process.txt
            $root=[System.Windows.Automation.AutomationElement]::RootElement
            $nodes=$root.FindAll([System.Windows.Automation.TreeScope]::Descendants,[System.Windows.Automation.Condition]::TrueCondition)
            $rows=New-Object System.Collections.Generic.List[string]
            foreach($n in $nodes){
              try{
                $rows.Add("TYPE=$($n.Current.ControlType.ProgrammaticName) | NAME=$($n.Current.Name) | RECT=$($n.Current.BoundingRectangle)")
              }catch{}
            }
            $rows | Sort-Object -Unique | Set-Content facad-quick-demo/ui-before-click.txt
            try{
              Add-Type -AssemblyName System.Windows.Forms
              Add-Type -AssemblyName System.Drawing
              $bounds=[System.Windows.Forms.SystemInformation]::VirtualScreen
              $bmp=New-Object System.Drawing.Bitmap $bounds.Width,$bounds.Height
              $g=[System.Drawing.Graphics]::FromImage($bmp)
              $g.CopyFromScreen($bounds.Left,$bounds.Top,0,0,$bmp.Size)
              $bmp.Save((Join-Path (Resolve-Path 'facad-quick-demo').Path 'before-click-screen.png'),[System.Drawing.Imaging.ImageFormat]::Png)
              $g.Dispose();$bmp.Dispose()
            }catch{$_ | Out-String | Set-Content facad-quick-demo/screenshot-error.txt}
            Get-Process FacadNstaller -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            Write-Host 'NO_CLICK_PERFORMED: inspection artifacts captured'
            throw 'QUICK_DEMO_NOT_CLICKED: diagnostic evidence collected; installation gate not passed'
          }

          $rect=$button.Current.BoundingRectangle
          $windowRect=$startWindow.Current.BoundingRectangle
          if($rect.IsEmpty -or $rect.Width -lt 140 -or $rect.Width -gt 400 -or
             $rect.Height -lt 30 -or $rect.Height -gt 100 -or
             $rect.Left -lt $windowRect.Left -or $rect.Right -gt $windowRect.Right -or
             $rect.Top -lt $windowRect.Top -or $rect.Bottom -gt $windowRect.Bottom){
            throw "Quick demo Pane bounds invalid: $rect inside window $windowRect"
          }
          "TARGET_NAME=$($button.Current.Name)" | Add-Content facad-quick-demo/quick-demo-process.txt
          "TARGET_TYPE=$($button.Current.ControlType.ProgrammaticName)" | Add-Content facad-quick-demo/quick-demo-process.txt
          "TARGET_RECT=$rect" | Add-Content facad-quick-demo/quick-demo-process.txt
          $x=[int]($rect.Left+$rect.Width/2)
          $y=[int]($rect.Top+$rect.Height/2)
          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          public static class ScopedMouse {
              [DllImport("user32.dll")] public static extern bool SetCursorPos(int x, int y);
              [DllImport("user32.dll")] public static extern void mouse_event(uint flags, uint dx, uint dy, uint data, UIntPtr extra);
          }
          '@
          if(-not [ScopedMouse]::SetCursorPos($x,$y)){ throw "SetCursorPos failed" }
          Start-Sleep -Milliseconds 200
          [ScopedMouse]::mouse_event(0x0002,0,0,0,[UIntPtr]::Zero)
          Start-Sleep -Milliseconds 120
          [ScopedMouse]::mouse_event(0x0004,0,0,0,[UIntPtr]::Zero)
          "QUICK_DEMO_CLICK_SENT_AT=$x,$y" | Add-Content facad-quick-demo/quick-demo-process.txt

          Start-Sleep -Seconds 8

          function Dump-Ui {
            param([string]$Path)
            $root=[System.Windows.Automation.AutomationElement]::RootElement
            $nodes=$root.FindAll([System.Windows.Automation.TreeScope]::Descendants,[System.Windows.Automation.Condition]::TrueCondition)
            $rows=New-Object System.Collections.Generic.List[string]
            foreach($n in $nodes){
              try{
                if(-not [string]::IsNullOrWhiteSpace($n.Current.Name)){
                  $rows.Add("TYPE=$($n.Current.ControlType.ProgrammaticName) | NAME=$($n.Current.Name) | ENABLED=$($n.Current.IsEnabled)")
                }
              }catch{}
            }
            $rows | Sort-Object -Unique | Set-Content $Path
          }

          Dump-Ui 'facad-quick-demo/ui-after-click.txt'

          $consentRegex='(?i)eula|license agreement|licence agreement|terms and conditions|terms of use|i agree|accept|agreement'
          $consentHits=Get-Content facad-quick-demo/ui-after-click.txt | Where-Object { $_ -match $consentRegex }
          if($consentHits){
            'CONSENT_GATE_DETECTED=true' | Add-Content facad-quick-demo/quick-demo-process.txt
            $consentHits | Set-Content facad-quick-demo/consent-gate.txt
          } else {
            'CONSENT_GATE_DETECTED=false' | Add-Content facad-quick-demo/quick-demo-process.txt
          }

          try{
            Add-Type -AssemblyName System.Windows.Forms
            Add-Type -AssemblyName System.Drawing
            $bounds=[System.Windows.Forms.SystemInformation]::VirtualScreen
            $bmp=New-Object System.Drawing.Bitmap $bounds.Width,$bounds.Height
            $g=[System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($bounds.Left,$bounds.Top,0,0,$bmp.Size)
            $bmp.Save((Join-Path (Resolve-Path 'facad-quick-demo').Path 'after-click-screen.png'),[System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose();$bmp.Dispose()
          }catch{$_ | Out-String | Set-Content facad-quick-demo/screenshot-error.txt}

          if($consentHits){
            # Explicit human authorization was provided to accept this specific Facad EULA.
            # Navigation stops immediately after Next to inspect the next screen.
            $root=[System.Windows.Automation.AutomationElement]::RootElement
            $eulaWindows=$root.FindAll(
              [System.Windows.Automation.TreeScope]::Children,
              [System.Windows.Automation.PropertyCondition]::new(
                [System.Windows.Automation.AutomationElement]::NameProperty,
                'End User License Agreement'
              )
            )
            if($eulaWindows.Count -ne 1){throw "Expected exactly one Facad EULA window, found $($eulaWindows.Count)"}
            $eulaWindow=$eulaWindows.Item(0)
            if($eulaWindow.Current.ControlType -ne [System.Windows.Automation.ControlType]::Window){
              throw 'Facad EULA top-level window type mismatch'
            }

            Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          public static class FacadWindowGuard {
            [DllImport("user32.dll")] public static extern IntPtr GetForegroundWindow();
            [DllImport("user32.dll")] public static extern bool SetCursorPos(int x, int y);
            [DllImport("user32.dll")] public static extern void mouse_event(uint flags, uint dx, uint dy, uint data, UIntPtr extra);
          }
          '@

            function Click-VerifiedPane {
              param(
                [System.Windows.Automation.AutomationElement]$Window,
                [string]$Name
              )
              $matches=$Window.FindAll(
                [System.Windows.Automation.TreeScope]::Descendants,
                [System.Windows.Automation.PropertyCondition]::new(
                  [System.Windows.Automation.AutomationElement]::NameProperty,$Name
                )
              )
              $targets=@()
              for($i=0;$i -lt $matches.Count;$i++){
                $candidate=$matches.Item($i)
                if($candidate.Current.ControlType -eq [System.Windows.Automation.ControlType]::Pane){
                  $targets+=,$candidate
                }
              }
              if($targets.Count -ne 1){throw "Expected exactly one Pane '$Name', got $($targets.Count)"}
              $pane=$targets[0]
              if(-not $pane.Current.IsEnabled){throw "Pane '$Name' is disabled"}
              $r=$pane.Current.BoundingRectangle
              $wr=$Window.Current.BoundingRectangle
              if($r.IsEmpty -or $r.Width -lt 60 -or $r.Width -gt 500 -or
                 $r.Height -lt 15 -or $r.Height -gt 100 -or
                 $r.Left -lt $wr.Left -or $r.Right -gt $wr.Right -or
                 $r.Top -lt $wr.Top -or $r.Bottom -gt $wr.Bottom){
                 throw "Pane '$Name' invalid bounds $r / window $wr"
              }
              $foreground=[FacadWindowGuard]::GetForegroundWindow()
              if($foreground -ne [IntPtr]$Window.Current.NativeWindowHandle){
                throw "Wrong foreground window before '$Name'"
              }
              $px=[int]($r.Left+$r.Width/2)
              $py=[int]($r.Top+$r.Height/2)
              $point=[System.Windows.Point]::new([double]$px,[double]$py)
              $hit=[System.Windows.Automation.AutomationElement]::FromPoint($point)
              $walker=[System.Windows.Automation.TreeWalker]::RawViewWalker
              $hitMatches=$false
              for($depth=0;$depth -lt 15 -and $null -ne $hit;$depth++){
                if($hit.Equals($pane)){$hitMatches=$true;break}
                $hit=$walker.GetParent($hit)
              }
              if(-not $hitMatches){throw "Foreground hit test for '$Name' did not resolve to intended pane"}
              if(-not [FacadWindowGuard]::SetCursorPos($px,$py)){throw "SetCursorPos failed for '$Name'"}
              Start-Sleep -Milliseconds 150
              [FacadWindowGuard]::mouse_event(0x0002,0,0,0,[UIntPtr]::Zero)
              Start-Sleep -Milliseconds 100
              [FacadWindowGuard]::mouse_event(0x0004,0,0,0,[UIntPtr]::Zero)
              "VERIFIED_CLICK=$Name | $px,$py" | Add-Content facad-quick-demo/quick-demo-process.txt
            }

            Click-VerifiedPane -Window $eulaWindow -Name 'I accept the license'
            Start-Sleep -Seconds 2
            $root=[System.Windows.Automation.AutomationElement]::RootElement
            $eulaWindow=$root.FindFirst(
              [System.Windows.Automation.TreeScope]::Children,
              [System.Windows.Automation.PropertyCondition]::new(
                [System.Windows.Automation.AutomationElement]::NameProperty,'End User License Agreement'
              )
            )
            if($null -eq $eulaWindow){throw 'EULA disappeared before Next was verified'}
            Click-VerifiedPane -Window $eulaWindow -Name 'Next >'
            'EULA_ACCEPTED_AND_NEXT_CLICK_SENT=true' | Add-Content facad-quick-demo/quick-demo-process.txt
            Start-Sleep -Seconds 5
            Dump-Ui 'facad-quick-demo/ui-after-eula-next.txt'
            try{
              Add-Type -AssemblyName System.Windows.Forms
              Add-Type -AssemblyName System.Drawing
              $bounds=[System.Windows.Forms.SystemInformation]::VirtualScreen
              $bmp=New-Object System.Drawing.Bitmap $bounds.Width,$bounds.Height
              $g=[System.Drawing.Graphics]::FromImage($bmp)
              $g.CopyFromScreen($bounds.Left,$bounds.Top,0,0,$bmp.Size)
              $bmp.Save((Join-Path (Resolve-Path 'facad-quick-demo').Path 'after-eula-next-screen.png'),[System.Drawing.Imaging.ImageFormat]::Png)
              $g.Dispose();$bmp.Dispose()
            }catch{$_ | Out-String | Set-Content facad-quick-demo/screenshot-error.txt}
            # The exact post-EULA screen was observed in run 37757103793.
            # No new contract is visible; Finish is the bounded standard install action.
            $installRoot=[System.Windows.Automation.AutomationElement]::RootElement
            $installWindow=$installRoot.FindFirst(
              [System.Windows.Automation.TreeScope]::Children,
              [System.Windows.Automation.PropertyCondition]::new(
                [System.Windows.Automation.AutomationElement]::NameProperty,'Installation'
              )
            )
            if($null -eq $installWindow){throw 'Expected Installation window after EULA, none found'}
            $ready=$installWindow.FindAll(
              [System.Windows.Automation.TreeScope]::Descendants,
              [System.Windows.Automation.PropertyCondition]::new(
                [System.Windows.Automation.AutomationElement]::NameProperty,'Ready to start installing Facad.'
              )
            )
            if($ready.Count -ne 1){throw "Expected one Ready to start installing Facad pane, found $($ready.Count)"}
            Click-VerifiedPane -Window $installWindow -Name 'Finish'
            'INSTALL_FINISH_CLICK_SENT=true' | Add-Content facad-quick-demo/quick-demo-process.txt
            Start-Sleep -Seconds 10
            Dump-Ui 'facad-quick-demo/ui-after-finish.txt'
            $newGates=Get-Content facad-quick-demo/ui-after-finish.txt | Where-Object {
              $_ -match '(?i)license agreement|licence agreement|purchase|payment|activation key|enter serial|subscription|new terms'
            }
            if($newGates){
              $newGates | Set-Content facad-quick-demo/new-gate-after-finish.txt
              'NEW_CONTRACT_GATE_AFTER_FINISH=true' | Add-Content facad-quick-demo/quick-demo-process.txt
              throw 'STOP: new license/payment/activation gate requires separate authorization'
            }
            'NEW_CONTRACT_GATE_AFTER_FINISH=false' | Add-Content facad-quick-demo/quick-demo-process.txt
          }

          # No new consent gate detected: allow the authorized quick-demo install to settle.
          $installDeadline=(Get-Date).AddMinutes(8)
          while((Get-Date) -lt $installDeadline){
            Start-Sleep -Seconds 5
            $settings=Get-ChildItem 'C:\Program Files','C:\Program Files (x86)','C:\Facad' -Filter 'Facad.Admin.settings' -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if($settings){ break }
            $installerProcesses=Get-Process FacadNstaller,FacadInstall -ErrorAction SilentlyContinue
            if(-not $installerProcesses){ Start-Sleep -Seconds 5 }
          }

          $settingsHits=Get-ChildItem 'C:\Program Files','C:\Program Files (x86)','C:\Facad' -Filter 'Facad.Admin.settings' -File -Recurse -ErrorAction SilentlyContinue
          $settingsHits | Select-Object FullName,Length,LastWriteTime |
            Format-Table -AutoSize | Out-File facad-quick-demo/settings-found.txt -Width 500

          $facadExe=Get-ChildItem 'C:\Program Files','C:\Program Files (x86)','C:\Facad' -Filter 'Facad.exe' -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if($facadExe){
            "INSTALLED_FACAD_EXE=$($facadExe.FullName)" | Add-Content facad-quick-demo/quick-demo-process.txt
          } else {
            'INSTALLED_FACAD_EXE=NOT_FOUND' | Add-Content facad-quick-demo/quick-demo-process.txt
          }

          if($settingsHits){
            'FACAD_ADMIN_SETTINGS_FOUND=true' | Add-Content facad-quick-demo/quick-demo-process.txt
          } else {
            'FACAD_ADMIN_SETTINGS_FOUND=false' | Add-Content facad-quick-demo/quick-demo-process.txt
          }

          Get-ChildItem 'C:\Program Files','C:\Program Files (x86)','C:\Facad' -File -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.LastWriteTime -ge $before -and $_.FullName -match 'Facad|Ilexis' } |
            Select-Object FullName,Length,LastWriteTime |
            Sort-Object FullName |
            Format-Table -AutoSize |
            Out-File facad-quick-demo/installed-files.txt -Width 500

          Get-Content facad-quick-demo/quick-demo-process.txt
          if(Test-Path facad-quick-demo/settings-found.txt){Get-Content facad-quick-demo/settings-found.txt}
          if(Test-Path facad-quick-demo/consent-gate.txt){Get-Content facad-quick-demo/consent-gate.txt}

      - name: Observe nonclinical startup of official Robert disposable demo only
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $state=(Get-Content facad-quick-demo/quick-demo-process.txt -Raw)
          if($state -match 'NEW_CONTRACT_GATE_AFTER_FINISH=true'){throw 'Consent gate detected'}
          if($state -notmatch 'FACAD_ADMIN_SETTINGS_FOUND=true'){throw 'Facad Quick Demo installation not proven'}
          $installed=Get-ChildItem 'C:\Program Files','C:\Program Files (x86)','C:\Facad' -Filter 'Facad.exe' -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if(-not $installed){throw 'Facad executable absent'}
          $zip='facad-quick-demo/outer/FacadRelease-3.14.1.1111.zip'
          if(-not (Test-Path $zip -PathType Leaf)){throw 'Verified official Facad sample bundle missing'}
          New-Item -ItemType Directory -Force -Path 'facad-quick-demo/release' | Out-Null
          $seven="$env:ProgramFiles\7-Zip\7z.exe"
          & $seven x $zip '-ofacad-quick-demo/release' -y | Out-Null
          if($LASTEXITCODE -ne 0){throw 'Official sample extraction failed'}
          $examples=(Resolve-Path 'facad-quick-demo/release/Examples').Path
          $official=Join-Path $examples 'Robert-2.0.fcd'
          if(-not (Test-Path $official -PathType Leaf)){throw 'Official Robert case missing'}
          $copyRoot=Join-Path (Resolve-Path 'facad-quick-demo').Path 'd3-app-copy'
          if(Test-Path $copyRoot){throw 'Unexpected pre-existing disposable copy'}
          Copy-Item -LiteralPath $examples -Destination $copyRoot -Recurse -ErrorAction Stop
          $copy=Join-Path $copyRoot 'Robert-2.0.fcd'
          $officialHash=(Get-FileHash -LiteralPath $official -Algorithm SHA256).Hash
          $copyHash=(Get-FileHash -LiteralPath $copy -Algorithm SHA256).Hash
          if($officialHash -ne $copyHash){throw 'Disposable Robert hash differs from original'}
          $script=Join-Path $env:GITHUB_WORKSPACE 'scripts/facad_314_d3_windows_snapshot.ps1'
          $session="$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $processScript=Join-Path $env:GITHUB_WORKSPACE 'scripts/facad_314_d3_process_io_observer.ps1'
          $officialScopeCount=10
          # Both experiments remain on one ephemeral Windows runner with the same
          # copied, rights-cleared Robert demo, and no UI click, patient Load or Save.
          function Invoke-D3ResearchStartup([string]$label) {
            $processOut="facad-quick-demo/d3-process-io-$label.json"
            $auditOut="facad-quick-demo/d3e2-facad-root-pid-$label.json"
            $eventOut=Join-Path $env:RUNNER_TEMP ("d3e3-event-keys-$label.json")
            $timelineManifest=Join-Path $env:RUNNER_TEMP ("d3e5-timeline-$label.json")
            $preLaunchManifest=Join-Path $env:RUNNER_TEMP ("d3e6-prelaunch-$label.json")
            $preflightManifest=Join-Path $env:RUNNER_TEMP ("d3e7-preflight-$label.json")
            $auditScript=Join-Path $env:GITHUB_WORKSPACE 'scripts/facad_314_d3e_facad_root_pid_write_observer.ps1'
            & $auditScript -FacadExecutable $installed.FullName -DisposableRobert $copy -ProcessCounterScript $processScript -ProcessCounterOutput (Join-Path $env:GITHUB_WORKSPACE $processOut) -OutputPath (Join-Path $env:GITHUB_WORKSPACE $auditOut) -EventKeysPath $eventOut -TimelinePath $timelineManifest -PreLaunchPath $preLaunchManifest -PreflightPath $preflightManifest -SessionId "$session-$label"
            $auditStatus=$LASTEXITCODE
            python scripts/facad_314_d3e_facad_root_pid_verdict_gate.py --input $auditOut | Out-Host
            $contractStatus=$LASTEXITCODE
            if($auditStatus -ne 0 -or $contractStatus -ne 0){
              throw "D3E.2 $label root-PID write-use attribution unproven; D3 remains BLOCKED"
            }
            Write-Host "D3E2_$($label.ToUpperInvariant())_ROOT_PID_POSITIVE_ONLY=true"
            Write-Host 'D3E2_DESCENDANT_COVERAGE_COMPLETE=false'
            Write-Host 'D3_PROBE_ACTION=APP_STARTUP_ONLY_NO_UI_CLICKS'
          }

          function Invoke-D3ResearchPair([string]$label) {
            try{
            $before="facad-quick-demo/d3-storage-$label-before.json"
            $after="facad-quick-demo/d3-storage-$label-after.json"
            $verdict="facad-quick-demo/d3-storage-$label-verdict.json"
            & $script -Phase before -SessionId "$session-$label" -OfficialExamples $examples -DisposableExamples $copyRoot -InstallDirectory $installed.DirectoryName -OutputPath $before
            Invoke-D3ResearchStartup $label
            & $script -Phase after -SessionId "$session-$label" -OfficialExamples $examples -DisposableExamples $copyRoot -InstallDirectory $installed.DirectoryName -OutputPath $after
            $officialAfter=(Get-FileHash -LiteralPath $official -Algorithm SHA256).Hash
            $copyAfter=(Get-FileHash -LiteralPath $copy -Algorithm SHA256).Hash
            if($officialHash -ne $officialAfter -or $copyHash -ne $copyAfter){
              throw "Official demo original/copy hash changed in $label"
            }
            Write-Host "D3_DEMO_COPY_INTEGRITY_$($label.ToUpperInvariant())=true"
            python scripts/facad_314_d3_snapshot_diff_gate.py --before $before --after $after --output $verdict | Out-Host
            $status=$LASTEXITCODE
            if($status -notin @(1,3)){
              throw "D3 $label capture invalid or incomplete: comparator code $status"
            }
            $evidence=Get-Content -LiteralPath $verdict -Raw | ConvertFrom-Json
            if($evidence.monitored_scope_count -ne $officialScopeCount -or
               $evidence.d3_isolation_verified -ne $false -or
               $evidence.clinical_edit_allowed -ne $false){
              throw "D3 $label verdict metadata mismatch"
            }
            if($status -eq 1 -and
               ($evidence.verdict -cne 'BLOCKED_OBSERVED_STORAGE_DRIFT' -or
                $evidence.observed_change_count -lt 1)){
              throw "D3 $label unexpected storage drift report"
            }
            if($status -eq 3 -and
               ($evidence.verdict -cne 'INCONCLUSIVE_NO_OBSERVED_STORAGE_DRIFT' -or
                $evidence.observed_change_count -ne 0)){
              throw "D3 $label invalid clean report"
            }
            $keys=Join-Path $env:RUNNER_TEMP ("d3e3-event-keys-$label.json")
            $correlation="facad-quick-demo/d3e3-correlation-$label.json"
            python scripts/facad_314_d3e3_same_file_correlation_gate.py --before $before --after $after --event-keys $keys --output $correlation | Out-Host
            $correlationStatus=$LASTEXITCODE
            if($correlationStatus -ne 0){
              throw "D3E.3 $label local same-file correlation UNVERIFIED; clinical D3 still BLOCKED"
            }
            $aggregate=Get-Content -LiteralPath $correlation -Raw | ConvertFrom-Json
            if($aggregate.schema -cne 'facad314_d3e3_same_file_aggregate_v1' -or
               $aggregate.causal_metadata_change_proven -ne $false -or
               $aggregate.shared_app_storage_isolation_verified -ne $false -or
               $aggregate.clinical_edit_allowed -ne $false){
              throw 'D3E.3 invalid aggregate or forged clearance'
            }
            Write-Host "D3E3_$($label.ToUpperInvariant())_SAME_FILE_OVERLAP=$($aggregate.same_file_metadata_and_4663_count)"
            $classification="facad-quick-demo/d3e4-classification-$label.json"
            python scripts/facad_314_d3e4_unattributed_classification_gate.py --before $before --after $after --event-keys $keys --output $classification | Out-Host
            if($LASTEXITCODE -ne 0){throw "D3E.4 $label metadata change classification incomplete; D3 still BLOCKED"}
            $class=Get-Content -LiteralPath $classification -Raw | ConvertFrom-Json
            if($class.schema -cne 'facad314_d3e4_unattributed_aggregate_v1' -or
               $class.changed_identity_count -ne $aggregate.selected_scope_metadata_changed_count -or
               $class.change_classification.modified.no_4663_event -ne (
                 $class.unexplained_modified_size_changed_count +
                 $class.unexplained_modified_same_size_fingerprint_changed_count
               ) -or
               $class.specific_process_cause_proven -ne $false -or
               $class.non_root_events_are_proven_descendants -ne $false -or
               $class.shared_app_storage_isolation_verified -ne $false -or
               $class.clinical_edit_allowed -ne $false){
              throw 'D3E.4 forged class or inconsistent changed-identity counts'
            }
            Write-Host "D3E4_$($label.ToUpperInvariant())_UNATTRIBUTED_CHANGES=$($class.changed_identity_without_any_observed_4663_count)"
            Write-Host "D3E4_$($label.ToUpperInvariant())_UNEXPLAINED_MODIFIED_SIZE_CHANGED=$($class.unexplained_modified_size_changed_count)"
            Write-Host "D3E4_$($label.ToUpperInvariant())_UNEXPLAINED_MODIFIED_SAME_SIZE_FINGERPRINT_CHANGED=$($class.unexplained_modified_same_size_fingerprint_changed_count)"
            $timelineManifest=Join-Path $env:RUNNER_TEMP ("d3e5-timeline-$label.json")
            $timingAggregate="facad-quick-demo/d3e5-timing-$label.json"
            python scripts/facad_314_d3e5_first_observed_timing_gate.py --before $before --after $after --event-keys $keys --timeline $timelineManifest --classification $classification --output $timingAggregate | Out-Host
            if($LASTEXITCODE -ne 0){throw 'D3E.5 incomplete temporal evidence; D3 still BLOCKED'}
            $timing=Get-Content -LiteralPath $timingAggregate -Raw | ConvertFrom-Json
            if($timing.schema -cne 'facad314_d3e5_first_observed_timing_aggregate_v1' -or
               $timing.unattributed_modified_size_changed_count -ne $class.unexplained_modified_size_changed_count -or
               $timing.shared_app_storage_isolation_verified -ne $false -or
               $timing.clinical_edit_allowed -ne $false -or
               $timing.causality_proven -ne $false -or
               $timing.continuous_change_tracking -ne $false){
              throw 'D3E.5 timing count mismatch or forged isolation claim'
            }
            Write-Host "D3E5_$($label.ToUpperInvariant())_TIMING_VERDICT=$($timing.verdict)"
            $preLaunchManifest=Join-Path $env:RUNNER_TEMP ("d3e6-prelaunch-$label.json")
            $earlyAggregate="facad-quick-demo/d3e6-early-window-$label.json"
            python scripts/facad_314_d3e6_early_window_gate.py --before $before --after $after --event-keys $keys --timeline $timelineManifest --classification $classification --timing $timingAggregate --prelaunch $preLaunchManifest --output $earlyAggregate | Out-Host
            if($LASTEXITCODE -ne 0){throw "D3E.6 $label prelaunch provenance incomplete; D3 still BLOCKED"}
            $early=Get-Content -LiteralPath $earlyAggregate -Raw | ConvertFrom-Json
            if($early.schema -cne 'facad314_d3e6_early_window_aggregate_v1' -or
               $early.unattributed_modified_size_changed_count -ne $class.unexplained_modified_size_changed_count -or
               $early.shared_app_storage_isolation_verified -ne $false -or
               $early.clinical_edit_allowed -ne $false -or
               $early.specific_process_causality_proven -ne $false -or
               $early.continuous_change_tracking -ne $false){
              throw 'D3E.6 early-window count mismatch or forged isolation claim'
            }
            Write-Host "D3E6_$($label.ToUpperInvariant())_EARLY_WINDOW_VERDICT=$($early.verdict)"
            $preflightManifest=Join-Path $env:RUNNER_TEMP ("d3e7-preflight-$label.json")
            $preflightAggregate="facad-quick-demo/d3e7-preflight-$label.json"
            python scripts/facad_314_d3e7_preflight_gate.py --before $before --after $after --event-keys $keys --timeline $timelineManifest --classification $classification --timing $timingAggregate --prelaunch $preLaunchManifest --early-window $earlyAggregate --preflight $preflightManifest --output $preflightAggregate | Out-Host
            if($LASTEXITCODE -ne 0){throw "D3E.7 $label preflight evidence incomplete; D3 still BLOCKED"}
            $preflight=Get-Content -LiteralPath $preflightAggregate -Raw | ConvertFrom-Json
            if($preflight.schema -cne 'facad314_d3e7_preflight_aggregate_v1' -or
               $preflight.unattributed_modified_size_changed_count -ne $class.unexplained_modified_size_changed_count -or
               $preflight.shared_app_storage_isolation_verified -ne $false -or
               $preflight.clinical_edit_allowed -ne $false -or
               $preflight.audit_policy_or_sacl_causality_proven -ne $false -or
               $preflight.file_identity_or_metadata_exported -ne $false){
              throw 'D3E.7 preflight aggregate inconsistent or forged isolation claim'
            }
            Write-Host "D3E7_$($label.ToUpperInvariant())_PREFLIGHT_VERDICT=$($preflight.verdict)"
            Write-Host "D3_$($label.ToUpperInvariant())_OBSERVED_CHANGE_COUNT=$($evidence.observed_change_count)"
            return $evidence
            }finally{
              $keys=Join-Path $env:RUNNER_TEMP ("d3e3-event-keys-$label.json")
              if(Test-Path -LiteralPath $keys){Remove-Item -LiteralPath $keys -Force -ErrorAction Stop}
              $timelineManifest=Join-Path $env:RUNNER_TEMP ("d3e5-timeline-$label.json")
              if(Test-Path -LiteralPath $timelineManifest){Remove-Item -LiteralPath $timelineManifest -Force -ErrorAction Stop}
              Write-Host 'D3E5_PRIVATE_TIMELINE_CLEANED=true'
              $preLaunchManifest=Join-Path $env:RUNNER_TEMP ("d3e6-prelaunch-$label.json")
              if(Test-Path -LiteralPath $preLaunchManifest){Remove-Item -LiteralPath $preLaunchManifest -Force -ErrorAction Stop}
              Write-Host 'D3E6_PRIVATE_PRELAUNCH_CLEANED=true'
              $preflightManifest=Join-Path $env:RUNNER_TEMP ("d3e7-preflight-$label.json")
              if(Test-Path -LiteralPath $preflightManifest){Remove-Item -LiteralPath $preflightManifest -Force -ErrorAction Stop}
              Write-Host 'D3E7_PRIVATE_PREFLIGHT_CLEANED=true'
              Write-Host 'D3E3_TEMPORARY_EVENT_KEY_IDS_CLEANED=true'
            }
          }

          $cold=Invoke-D3ResearchPair 'cold'
          # A scope other than non-patient UI preferences changing is never
          # permission to launch the second research observation.
          $coldOutside=@($cold.observed_changes | Where-Object {$_.scope -cne 'facad_ilexis_roaming_settings'})
          if($coldOutside.Count){
            throw 'D3 non-preference scope drift in cold startup; abort warm research, D3 BLOCKED'
          }
          $warm=Invoke-D3ResearchPair 'warm'
          $coldVerdict='facad-quick-demo/d3-storage-cold-verdict.json'
          $warmVerdict='facad-quick-demo/d3-storage-warm-verdict.json'
          $summary='facad-quick-demo/d3-cold-warm-research-summary.json'
          python scripts/facad_314_d3_cold_warm_verdict_gate.py --cold $coldVerdict --warm $warmVerdict --output $summary
          $researchStatus=$LASTEXITCODE
          if($researchStatus -eq 1){
            throw 'D3 BLOCKED: observed storage drift in cold or warm nonclinical session'
          } elseif($researchStatus -eq 3){
            Write-Host 'D3_OBSERVATION_COMPLETE=true'
            Write-Host 'D3_VERDICT=INCONCLUSIVE_NO_OBSERVED_STORAGE_DRIFT'
            Write-Host 'D3_ISOLATION_VERIFIED=false'
            Write-Host 'CLINICAL_EDIT_ALLOWED=false'
            # Only experimental monitoring completed. This NEVER clears the D3 gate.
            exit 0
          } else {
            throw "D3 cold/warm evidence invalid: exit code $researchStatus"
          }

      - name: Upload D3 observation evidence (redacted)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: facad-314-d3-windows-storage-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            # Restricted runner only. Do not publish raw before/after manifests
            # or any hashed filename list; output is aggregate verdict-only.
            facad-quick-demo/d3-storage-cold-verdict.json
            facad-quick-demo/d3-storage-warm-verdict.json
            facad-quick-demo/d3-process-io-cold.json
            facad-quick-demo/d3-process-io-warm.json
            facad-quick-demo/d3-cold-warm-research-summary.json
            facad-quick-demo/d3e2-facad-root-pid-cold.json
            facad-quick-demo/d3e2-facad-root-pid-warm.json
            facad-quick-demo/d3e3-correlation-cold.json
            facad-quick-demo/d3e3-correlation-warm.json
            facad-quick-demo/d3e4-classification-cold.json
            facad-quick-demo/d3e4-classification-warm.json
            facad-quick-demo/d3e5-timing-cold.json
            facad-quick-demo/d3e5-timing-warm.json
            facad-quick-demo/d3e6-early-window-cold.json
            facad-quick-demo/d3e6-early-window-warm.json
            facad-quick-demo/d3e7-preflight-cold.json
            facad-quick-demo/d3e7-preflight-warm.json
