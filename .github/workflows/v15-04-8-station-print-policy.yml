name: V1.5-04.8 Station Print Policy (LAB)

on:
  push:
    branches:
      - feat/v15-04-8-print-policy-bridge-20261012
    paths:
      - backend/services/station_document_print_policy.py
      - backend/tests/test_station_document_print_policy_v15.py
      - .github/workflows/v15-04-8-station-print-policy.yml
  pull_request:
    branches:
      - feat/v15-04-4-station-bound-document-qr-nfc-20261011
    paths:
      - backend/services/station_document_print_policy.py
      - backend/tests/test_station_document_print_policy_v15.py
      - .github/workflows/v15-04-8-station-print-policy.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fail-closed-print-policy:
    name: Print policy pure unit tests (no printer, no PDF dispatch)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Minimal pytest dependency
        run: python -m pip install pytest
      - name: Policy source syntax
        run: python -m py_compile backend/services/station_document_print_policy.py
      - name: Denial, private release and cross-printer identity tests
        run: python -m pytest backend/tests/test_station_document_print_policy_v15.py -q
