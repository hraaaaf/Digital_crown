name: V1.5-04.8 Station Print Policy (LAB)

on:
  push:
    branches:
      - feat/v15-04-8-print-policy-bridge-20261012
    paths:
      - backend/services/station_document_print_policy.py
      - backend/services/station_document_print_configuration.py
      - backend/services/station_document_print_store.py
      - backend/tests/test_station_document_print_policy_v15.py
      - backend/tests/test_station_document_print_configuration_v15.py
      - backend/tests/test_station_document_print_store_v15.py
      - .github/workflows/v15-04-8-station-print-policy.yml
      - docs/quality/V15_04_8_POCKET_852_BOUNDARY_CONTRACT.md
      - docs/quality/V15_04_8_B_SECURE_PRINT_CONFIGURATION_CONTRACT.md
  pull_request:
    branches:
      - feat/v15-04-4-station-bound-document-qr-nfc-20261011
    paths:
      - backend/services/station_document_print_policy.py
      - backend/services/station_document_print_configuration.py
      - backend/services/station_document_print_store.py
      - backend/tests/test_station_document_print_policy_v15.py
      - backend/tests/test_station_document_print_configuration_v15.py
      - backend/tests/test_station_document_print_store_v15.py
      - .github/workflows/v15-04-8-station-print-policy.yml
      - docs/quality/V15_04_8_POCKET_852_BOUNDARY_CONTRACT.md
      - docs/quality/V15_04_8_B_SECURE_PRINT_CONFIGURATION_CONTRACT.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fail-closed-print-policy:
    name: Print policy pure unit tests (no printer, no PDF dispatch)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact source SHA (not GitHub synthetic PR merge commit)
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Minimal pytest dependency
        run: python -m pip install pytest SQLAlchemy==2.0.28
      - name: Policy source syntax
        run: python -m py_compile backend/services/station_document_print_policy.py backend/services/station_document_print_configuration.py backend/services/station_document_print_store.py
      - name: Pure module unit tests without unrelated backend boot side effects
        run: |
          # backend/tests/conftest.py boots every SQLAlchemy model and FastAPI
          # even for a pure dataclass helper. Run this real module and real
          # test source in a neutral test root. Full backend integration remains
          # a separate REQUIRED gate before real print routes exist.
          mkdir -p /tmp/dc04-8-print-policy
          cp backend/tests/test_station_document_print_policy_v15.py /tmp/dc04-8-print-policy/test_print_policy.py
          cp backend/tests/test_station_document_print_configuration_v15.py /tmp/dc04-8-print-policy/test_print_configuration.py
          cp backend/tests/test_station_document_print_store_v15.py /tmp/dc04-8-print-policy/test_print_store.py
          python - <<'PY'
          import os
          import sys
          import types
          import pytest

          for module_name, directory in (
              ("backend", "backend"),
              ("backend.services", "backend/services"),
          ):
              module = types.ModuleType(module_name)
              module.__path__ = [os.path.abspath(directory)]
              sys.modules[module_name] = module
          raise SystemExit(pytest.main(["-q", "/tmp/dc04-8-print-policy/test_print_policy.py", "/tmp/dc04-8-print-policy/test_print_configuration.py", "/tmp/dc04-8-print-policy/test_print_store.py"]))
          PY
