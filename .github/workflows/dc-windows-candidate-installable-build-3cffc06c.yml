name: Digital Crown installable Windows build - exact certified master (isolated)
on:
  push:
    branches:
      - evidence/windows-installable-build-3cffc06c-20261024
permissions:
  contents: read
  actions: read
  attestations: read
jobs:
  windows-cabinet-build:
    name: Windows signed-provenance composition and installer build (no activation)
    runs-on: windows-2022
    timeout-minutes: 100
    env:
      GH_TOKEN: ${{ github.token }}
      CERTIFIED_SHA: 3cffc06c23c5be2086cdb18e23aae93d66dee700
      CERT_RUN_ID: '40043891636'
      MODEL_RUN_ID: '34281082926'
      PATCH_SHA: 017beb40e6e36ec2bdaf7de315c0f9e196e7dd55
      PATCH_ISS_BLOB_SHA: 08ef5779890eb733862ef501cc0fd4ac25be8f11
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3cffc06c23c5be2086cdb18e23aae93d66dee700
          persist-credentials: false
      - name: Immutable master preflight and zero clinical context
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -ne $env:CERTIFIED_SHA) { throw 'Certified commit mismatch' }
          $current=(gh api "repos/$env:GITHUB_REPOSITORY/branches/master" --jq '.commit.sha').Trim()
          Write-Host "CURRENT_MASTER=$current; RELEASE_SHA=$env:CERTIFIED_SHA (immutable separately attested source)"
          if (Test-Path 'backend/ai_models') { throw 'Unexpected model bytes in Git' }
          New-Item -ItemType Directory -Force -Path 'evidence/code','evidence/models','evidence/output','evidence/runtime' | Out-Null
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download exact official CODE_CERTIFIED release and historical pinned scientific artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          gh run download $env:CERT_RUN_ID --repo $env:GITHUB_REPOSITORY --name 'code-certified-dc-cabinet-3cffc06c23c5-run40043891636' --dir evidence/code
          if ($LASTEXITCODE -ne 0) {throw 'Missing official code artifact'}
          gh run download $env:MODEL_RUN_ID --repo $env:GITHUB_REPOSITORY --name 'cephalo-srpose38-onnx-parity' --dir evidence/models
          if ($LASTEXITCODE -ne 0) {throw 'Missing historical scientific asset'}
          $code=(Get-Content evidence/code/release-certification.json -Raw | ConvertFrom-Json)
          if ($code.commit_sha -ne $env:CERTIFIED_SHA -or $code.certification_level -ne 'CODE_CERTIFIED' -or $code.installable -ne $false) { throw 'Invalid certified source' }
          $model = Get-Item evidence/models/srpose38-tta-1024.onnx
          if ($model.Length -ne 267484931L) { throw 'Pinned model size mismatch' }
          $hash=(Get-FileHash evidence/models/srpose38-tta-1024.onnx -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne 'a5ecd466d6d2c4ef02e145a143076a05720c0be56a260224812c23e2ecf42ddb') { throw 'Pinned model integrity mismatch' }
          New-Item -ItemType Directory -Force -Path evidence/models-ai | Out-Null
          Copy-Item evidence/models/srpose38-tta-1024.onnx evidence/models-ai/srpose38-tta-1024.onnx
          Write-Host 'OFFICIAL_CODE_AND_PINNED_MODEL=PASS'
      - name: Install exact certified Windows dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Windows-hosted toolcache has global pipx constraints unrelated to Cabinet.
          # Isolate pinned cabinet packages; never weaken pip check or change the lock.
          $venv=Join-Path $env:GITHUB_WORKSPACE 'evidence/venv-win'
          python -m venv $venv
          if ($LASTEXITCODE -ne 0) {throw 'Isolated Python venv creation failed'}
          $venvScripts=Join-Path $venv 'Scripts'
          $env:PATH="$venvScripts;$env:PATH"
          $venvScripts | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) {throw 'Isolated pip setup failed'}
          Push-Location evidence/code/backend
          try {
            python -m pip install -r requirements-windows-build.txt
            if ($LASTEXITCODE -ne 0) { throw 'Pinned Windows build dependencies failed' }
          } finally { Pop-Location }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { throw 'Python dependency compatibility failed' }
          python evidence/code/backend/scripts/windows_build_dependency_contract.py
          if ($LASTEXITCODE -ne 0) { throw 'Windows dependency contract failed' }
      - name: Create canonical asset ZIP and repackage actual official code files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PYTHONPATH=(Resolve-Path evidence/code).Path
          python evidence/code/backend/scripts/certify_runtime_assets.py --code-release-dir evidence/code --ai-models-dir evidence/models-ai --output evidence/output/dc-runtime-assets.zip
          if ($LASTEXITCODE -ne 0) {throw 'Real model asset certification failed'}
          # Pack ONLY the immutable source files named in the signed CODE manifest;
          # dependency imports can generate unrelated __pycache__ on Windows.
          # Never amend the certificate, content manifest, or certified bytes.
          $script=@(
            'import sys,zipfile,pathlib,hashlib,re,json'
            'src=pathlib.Path(sys.argv[1]).resolve()'
            'dest=pathlib.Path(sys.argv[2]).resolve()'
            'cert=json.loads((src/"release-certification.json").read_text(encoding="utf-8"))'
            'manifest=(src/"release-content.sha256").read_bytes()'
            'assert hashlib.sha256(manifest).hexdigest()==cert["content_manifest_sha256"]'
            'names={"release-certification.json",".digitalcrown-release-sha","release-content.sha256"}'
            'for line in manifest.decode("utf-8").splitlines():'
            '    m=re.fullmatch(r"([0-9a-f]{64})  (.+)",line)'
            '    if not m: raise ValueError("malformed signed manifest")'
            '    digest,name=m.groups()'
            '    path=pathlib.PurePosixPath(name)'
            '    if path.is_absolute() or ".." in path.parts or name in names: raise ValueError("unsafe/duplicate signed path")'
            '    full=src.joinpath(*path.parts)'
            '    if not full.is_file() or full.is_symlink(): raise ValueError("missing/unsafe signed code file "+name)'
            '    if hashlib.sha256(full.read_bytes()).hexdigest()!=digest: raise ValueError("certified byte mismatch "+name)'
            '    names.add(name)'
            'with zipfile.ZipFile(dest,"w",zipfile.ZIP_DEFLATED,allowZip64=True) as z:'
            '    for name in sorted(names):'
            '        full=src.joinpath(*pathlib.PurePosixPath(name).parts)'
            '        if not full.is_file() or full.is_symlink(): raise ValueError("missing certified metadata "+name)'
            '        z.write(full,name)'
            'print("EXACT_SIGNED_CODE_FILESET_PACKED",len(names))'
          )
          $script | Set-Content evidence/repack.py -Encoding utf8
          python evidence/repack.py evidence/code evidence/output/dc-official-code.zip
          if ($LASTEXITCODE -ne 0) {throw 'Official code ZIP repacking failed'}
      - name: Compose genuine INSTALLABLE_CERTIFIED in isolated runner (Sigstore mandatory)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sourceScript=(Resolve-Path evidence/code/backend/scripts/create_release.ps1).Path
          $codeZip=(Resolve-Path evidence/output/dc-official-code.zip).Path
          $assetZip=(Resolve-Path evidence/output/dc-runtime-assets.zip).Path
          $runtimeRoot=Join-Path $env:RUNNER_TEMP 'DigitalCrown-ISOLATED'
          & $sourceScript -CertifiedArtifactZip $codeZip -RuntimeAssetsZip $assetZip -RuntimeRoot $runtimeRoot -VerifierPython python -GitHubCli gh
          if ($LASTEXITCODE -ne 0) {throw 'INSTALLABLE composition failed closed'}
          $release=Join-Path $runtimeRoot 'releases/dc-cabinet-3cffc06c23c5-run40043891636'
          if (-not (Test-Path "$release/installable-certification.json")) {throw 'INSTALLABLE certificate absent'}
          $proof=(Get-Content "$release/installable-certification.json" -Raw | ConvertFrom-Json)
          if ($proof.certification_level -ne 'INSTALLABLE_CERTIFIED' -or $proof.installable -ne $true -or $proof.commit_sha -ne $env:CERTIFIED_SHA -or $proof.github_attestation_verified -ne $true) {throw 'Unexpected INSTALLABLE certificate'}
          foreach($pack in @('BASIC','GOLD','ELITE')) {
            $env:PYTHONPATH=$release
            python "$release/backend/scripts/verify_installable_release.py" --release-dir $release --expected-pack $pack
            if ($LASTEXITCODE -ne 0) {throw "INSTALLABLE verification failed: $pack"}
          }
          "$release" | Out-File -Encoding ascii evidence/output/release-dir.txt
          $proof | ConvertTo-Json -Depth 10 | Out-File -Encoding utf8 evidence/output/installable-certification-proof.json
          Write-Host 'INSTALLABLE_CERTIFIED_SOURCE=SUCCESS'
      - name: Build Windows EXE from certified composition ONLY
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release=(Get-Content evidence/output/release-dir.txt -Raw).Trim()
          $env:PYTHONPATH=''
          Push-Location $release
          try {
            python -m PyInstaller --noconfirm --clean DigitalCrown.spec
            if ($LASTEXITCODE -ne 0) {throw 'PyInstaller failed'}
            if (-not (Test-Path 'dist/DigitalCrown/DigitalCrown.exe')) {throw 'EXE not found'}
            $proofs=@('release-certification.json','.digitalcrown-release-sha','release-content.sha256','installable-certification.json','runtime-assets-certification.json','runtime-assets-content.sha256','github-attestation-verification.json')
            foreach($f in $proofs) {
              if (-not (Test-Path -LiteralPath "dist/DigitalCrown/_internal/$f" -PathType Leaf)) {throw "PyInstaller bundle missing required identity file in _internal: $f"}
            }
            $env:PYTHONPATH=(Get-Location).Path
            python -c "from backend.release_certification import verify_installable_release_identity; verify_installable_release_identity('dist/DigitalCrown/_internal', expected_pack='BASIC'); print('FROZEN_BUNDLE_IDENTITY_AND_ASSETS=PASS')"
            if ($LASTEXITCODE -ne 0) {throw 'Bundled identity/asset hash verification rejected _internal; do not compile installer'}
            $env:PYTHONPATH=''
            Write-Host 'CERTIFIED_SOURCE_TO_WINDOWS_EXE_BUNDLE=SUCCESS; INNO_CANDIDATE_NOT_CERTIFIED'
          } finally { Pop-Location }
      - name: Diagnostic certified onedir layout (read-only, even after packaging failure)
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $report=Join-Path $env:GITHUB_WORKSPACE 'evidence/output/windows-bundle-layout.txt'
          $lines=New-Object System.Collections.Generic.List[string]
          $lines.Add("SOURCE_CERTIFIED_SHA=$env:CERTIFIED_SHA")
          $lines.Add("WORKFLOW_HEAD_SHA=$env:GITHUB_SHA")
          if (-not (Test-Path 'evidence/output/release-dir.txt')) {
            $lines.Add('RELEASE_DIR_MARKER=MISSING')
          } else {
            $release=(Get-Content evidence/output/release-dir.txt -Raw).Trim()
            $dist=Join-Path $release 'dist/DigitalCrown'
            $lines.Add("DIST=$dist")
            foreach ($name in @('.', '_internal')) {
              $folder=Join-Path $dist $name
              $lines.Add("DIRECTORY=$name EXISTS=$(Test-Path -LiteralPath $folder -PathType Container)")
              if (Test-Path -LiteralPath $folder -PathType Container) {
                Get-ChildItem -LiteralPath $folder -Force | Sort-Object Name | ForEach-Object {
                  $lines.Add("ENTRY=$name/$($_.Name) TYPE=$(if ($_.PSIsContainer) {'DIR'} else {'FILE'}) SIZE=$($_.Length)")
                }
              }
            }
            $proofs=@('release-certification.json','.digitalcrown-release-sha','release-content.sha256','installable-certification.json','runtime-assets-certification.json','runtime-assets-content.sha256','github-attestation-verification.json')
            foreach ($f in $proofs) {
              foreach ($name in @('.', '_internal')) {
                $candidate=Join-Path (Join-Path $dist $name) $f
                if (Test-Path -LiteralPath $candidate -PathType Leaf) {
                  $file=Get-Item -LiteralPath $candidate
                  $sha=(Get-FileHash -LiteralPath $candidate -Algorithm SHA256).Hash.ToLowerInvariant()
                  $lines.Add("PROOF=$name/$f EXISTS=YES SIZE=$($file.Length) SHA256=$sha")
                } else {
                  $lines.Add("PROOF=$name/$f EXISTS=NO")
                }
              }
            }
          }
          $lines | Set-Content -LiteralPath $report -Encoding utf8
          $lines | ForEach-Object {Write-Host $_}
      - name: Candidate Inno Setup compile and seven negative guards (not a certified installer)
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $report=Join-Path $env:GITHUB_WORKSPACE 'evidence/output/inno-candidate-validation.txt'
          $record=New-Object System.Collections.Generic.List[string]
          $record.Add('CB02_TEST_ONLY=YES; THIS IS NOT A CERTIFIED INSTALLER')
          $record.Add("CERTIFIED_SOURCE=$env:CERTIFIED_SHA")
          $record.Add("CANDIDATE_SOURCE=$env:PATCH_SHA")
          $release=(Get-Content evidence/output/release-dir.txt -Raw).Trim()
          $compiler='C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $compiler -PathType Leaf)) {throw 'Pinned ISCC missing on Windows runner; no unsigned substitution'}
          # The tested script is fetched at its immutable PR commit, never from floating master or PR head.
          $endpoint="repos/$env:GITHUB_REPOSITORY/contents/installer/DigitalCrown.iss?ref=$env:PATCH_SHA"
          $entry=(gh api $endpoint | ConvertFrom-Json)
          if ($LASTEXITCODE -ne 0 -or $entry.sha -ne $env:PATCH_ISS_BLOB_SHA) {throw 'Unpinned or mismatched PR candidate script'}
          $candidate=Join-Path $env:RUNNER_TEMP 'CB02-INNO-CANDIDATE'
          New-Item -ItemType Directory -Force -Path (Join-Path $candidate 'installer') | Out-Null
          $script=Join-Path $candidate 'installer/DigitalCrown.iss'
          [IO.File]::WriteAllBytes($script,[Convert]::FromBase64String($entry.content))
          $scriptText=Get-Content -LiteralPath $script -Raw
          if (-not $scriptText.Contains('MyBundledProofDir')) {throw 'Candidate guards do not target _internal'}
          $record.Add("CANDIDATE_SCRIPT_BLOB=$($entry.sha)")
          $record.Add("CANDIDATE_SCRIPT_SHA256=$((Get-FileHash -LiteralPath $script -Algorithm SHA256).Hash.ToLowerInvariant())")
          # Junction points to immutable certified-source-derived EXE bundle; signed release files are NOT rewritten.
          $distSource=Join-Path $release 'dist'
          $distJunction=Join-Path $candidate 'dist'
          & cmd /c mklink /J "$distJunction" "$distSource"
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path (Join-Path $distJunction 'DigitalCrown/_internal/release-certification.json'))) {throw 'Isolated junction to proven bundle missing'}
          # Positive compile tests exact DRAFT PR script against real PyInstaller bundle.
          & $compiler $script
          if ($LASTEXITCODE -ne 0) {throw 'Real-bundle candidate Inno compilation failed'}
          $setup=Get-Item (Join-Path $candidate 'dist_installer/DigitalCrownSetup-INSTALLABLE-CERTIFIED.exe') -ErrorAction Stop
          $record.Add("REAL_BUNDLE_CANDIDATE_INNO=PASS SIZE=$($setup.Length) SHA256=$((Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLowerInvariant())")
          $record | Set-Content -LiteralPath $report -Encoding utf8
          # A separate synthetic test tree verifies all seven fail-closed Inno preprocessor guards.
          # Synthetic placeholders are NEVER used for the above real-bundle compilation.
          $fake=Join-Path $env:RUNNER_TEMP 'CB02-INNO-NEGATIVE'
          $fakeInternal=Join-Path $fake 'dist/DigitalCrown/_internal'
          New-Item -ItemType Directory -Force -Path $fakeInternal,(Join-Path $fake 'installer') | Out-Null
          Copy-Item -LiteralPath $script -Destination (Join-Path $fake 'installer/DigitalCrown.iss')
          Set-Content -LiteralPath (Join-Path $fake 'dist/DigitalCrown/DigitalCrown.exe') -Value 'Synthetic placeholder, not executable' -Encoding ascii
          $proofs=@('release-certification.json','.digitalcrown-release-sha','release-content.sha256','installable-certification.json','runtime-assets-certification.json','runtime-assets-content.sha256','github-attestation-verification.json')
          foreach($name in $proofs) {Set-Content -LiteralPath (Join-Path $fakeInternal $name) -Value 'Synthetic placeholder: NOT CERTIFIED' -Encoding ascii}
          $fakeScript=Join-Path $fake 'installer/DigitalCrown.iss'
          & $compiler $fakeScript | Out-Null
          if ($LASTEXITCODE -ne 0) {throw 'Inno synthetic positive fixture unexpectedly rejected'}
          $record.Add('SYNTHETIC_POSITIVE_GUARDS=PASS; FIXTURE_NOT_AUTHENTIC')
          $record | Set-Content -LiteralPath $report -Encoding utf8
          foreach($name in $proofs) {
            $full=Join-Path $fakeInternal $name
            Remove-Item -LiteralPath $full -Force
            try {
              $log=(& $compiler $fakeScript 2>&1 | Out-String)
              if ($LASTEXITCODE -eq 0) {throw "MISSING_PROOF_ACCEPTED=$name"}
              # Inno's intentional #error text for attestation omits the filename.
              # Match the exact declared error instead of weakening exit-code checks.
              $expectedReason=if ($name -eq 'github-attestation-verification.json') {'GitHub attestation verification evidence is missing'} else {$name}
              if ($log -notlike '*INSTALLABLE_CERTIFIED REQUIRED*' -or $log -notlike "*$expectedReason*") {
                throw "Missing-proof rejection reason not found: $name; expected: $expectedReason; compiler_exit=$LASTEXITCODE"
              }
              $record.Add("MISSING_$name=REJECTED")
              $record | Set-Content -LiteralPath $report -Encoding utf8
            } finally {
              Set-Content -LiteralPath $full -Value 'Synthetic placeholder: NOT CERTIFIED' -Encoding ascii
            }
          }
          $record.Add('SEVEN_MISSING_CERT_GUARDS=PASS')
          $record | Set-Content -LiteralPath $report -Encoding utf8
          $record | ForEach-Object { Write-Host $_ }
          Write-Host 'CANDIDATE_INNO_TEST_ONLY=PASS; NO_INSTALLATION; NO_CERTIFIED_SETUP_ARTIFACT'
          # The last intentional negative ISCC invocation exits nonzero by design.
          # PowerShell's final native $LASTEXITCODE otherwise makes the step RED
          # despite every asserted fail-closed check passing. Only reachable after
          # all seven expected rejections and the genuine positive compilation.
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dc-windows-candidate-installer-3cffc06c
          path: |
            evidence/output/installable-certification-proof.json
            evidence/output/windows-bundle-layout.txt
            evidence/output/inno-candidate-validation.txt
          retention-days: 14
          if-no-files-found: warn
