name: V1.5-05.7-H Fake Authority Handoff and Multicomponent Manifest Gate

on:
  push:
    branches:
      - feat/v15-05-7h-dormant-authority-bundle-rehearsal-20261018
  pull_request:
    paths:
      - backend/services/legacy_migration_recovery_authority_lab_v15.py
      - backend/tests/test_legacy_sql_057h_dormant_authority_bundle.py
      - docs/quality/V15_05_7_H_FAKE_AUTHORITY_BUNDLE_CONTRACT.md
      - .github/workflows/v15-05-7-h-fake-authority-bundle-gate.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-sqlcipher-fake-authority:
    name: Auth job worker fake bundle real SQLCipher (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 32
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      LOT05E_REAL_SQLCIPHER_FAKE_ONLY: '1'
      LOT05H_SYNTHETIC_ONLY: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux native SQLCipher build dependency
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsqlcipher-dev
      - name: Install isolated pinned fake lab dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install \
            alembic==1.20.0 sqlalchemy==2.0.28 sqlcipher3==0.6.2 \
            'pydantic[email]==2.6.3' pydantic-settings==2.2.1 \
            fastapi==0.115.6 starlette==0.41.3 httpx==0.28.1 \
            python-jose==3.5.0 passlib==1.7.4 bcrypt==3.2.2 \
            python-multipart==0.0.31 python-dotenv==1.2.1 \
            cryptography==49.0.0 PyYAML==6.0.3 pytest==9.0.3
      - name: Verify native cipher and compile dormant code
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            backend/services/legacy_migration_recovery_authority_lab_v15.py \
            backend/tests/test_legacy_sql_057h_dormant_authority_bundle.py
          python -c "from sqlcipher3 import dbapi2 as s; import secrets; c=s.connect(':memory:'); c.execute(\"PRAGMA key = '\" + secrets.token_hex(32) + \"'\"); v=c.execute('PRAGMA cipher_version').fetchone(); assert v and v[0], 'REAL_SQLCIPHER_REQUIRED'; print('NATIVE_SQLCIPHER_OK'); c.close()"
      - name: Execute exact real-head synthetic SQLCipher authority+bundle tests
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python -B backend/tests/test_legacy_sql_057h_dormant_authority_bundle.py -v 2>&1 | tee lot05h-tests.log
          grep -q '^Ran 18 tests' lot05h-tests.log
          grep -Eq '^OK[[:space:]]*$' lot05h-tests.log
          ! grep -E 'skipped=[0-9]+|^FAILED \(|^ERROR: test_|^ERROR: setUpClass' lot05h-tests.log
      - name: Exact HEAD and NO active worker, auth or schema changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || 'e9d2eb7f9ff4ccb17c8e0758471fefd76e59b1b6' }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git diff --exit-code "$BASE_SHA" HEAD -- \
            backend/main.py backend/database.py backend/models.py \
            backend/routers backend/core \
            backend/services/backup_service.py \
            backend/services/guided_restore.py \
            backend/services/guided_restore_worker.py \
            backend/services/guided_restore_archive.py \
            backend/services/legacy_migration_gateway_v15.py \
            backend/services/legacy_migration_restore_policy_v15.py \
            alembic frontend
          test "$(git diff --name-only "$BASE_SHA" HEAD | grep -Ev \
            '^(\.github/workflows/v15-05-7-h-fake-authority-bundle-gate\.yml|backend/services/legacy_migration_recovery_authority_lab_v15\.py|backend/tests/test_legacy_sql_057h_dormant_authority_bundle\.py|docs/quality/V15_05_7_H_FAKE_AUTHORITY_BUNDLE_CONTRACT\.md|techdoubt\.md)$' | wc -l | tr -d '[:space:]')" = 0
