name: Client Copy Panoramic BEFORE AFTER

on:
  pull_request:
    branches: [master]
    paths:
      - 'frontend/src/features/panoramic/PanoramicStudio.tsx'
      - 'frontend/src/features/panoramic/ReportViewer.tsx'
      - 'frontend/src/ClientFacingCopyCandidateAudit.test.ts'
      - '.github/workflows/client-copy-panoramic-before-after.yml'

permissions:
  contents: read

jobs:
  visual-proof:
    name: Panoramic ${{ matrix.state }} 390/430/768/1280
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - state: before
            ref: ${{ github.event.pull_request.base.sha }}
          - state: after
            ref: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend and Chromium
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install chromium

      - name: Capture Panoramic wording proof
        working-directory: frontend
        env:
          PROOF_STATE: ${{ matrix.state }}
          PROOF_SHA: ${{ matrix.ref }}
        run: |
          cat > client-copy-panoramic.html <<'HTML'
          <!doctype html><html lang="fr"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><link rel="icon" href="data:,"/></head><body><div id="root"></div><script type="module" src="/src/client-copy-panoramic.tsx"></script></body></html>
          HTML
          cat > src/client-copy-panoramic.tsx <<'TSX'
          import React from 'react';
          import { createRoot } from 'react-dom/client';
          import './index.css';
          import { PanoramicStudio } from './features/panoramic/PanoramicStudio';
          createRoot(document.getElementById('root')!).render(
            <PanoramicStudio patientId={42} patientName="BENNANI Sara" />,
          );
          TSX
          cat > client-copy-panoramic-proof.mjs <<'JS'
          import fs from 'node:fs/promises';
          import path from 'node:path';
          import { chromium } from 'playwright';
          import { createServer } from 'vite';

          const state = process.env.PROOF_STATE;
          const sha = process.env.PROOF_SHA;
          const out = path.resolve(`../artifacts/client-copy-panoramic-${state}`);
          await fs.mkdir(out, { recursive: true });
          process.env.VITE_API_URL = 'http://127.0.0.1:8005';
          const server = await createServer({
            server: { host: '127.0.0.1', port: 4186, strictPort: true },
            clearScreen: false,
            optimizeDeps: { include: ['workbox-window'] },
          });
          await server.listen();
          const browser = await chromium.launch({ headless: true });
          const viewports = [
            { width:390, height:844, label:'390x844' },
            { width:430, height:932, label:'430x932' },
            { width:768, height:1024, label:'768x1024' },
            { width:1280, height:900, label:'1280x900' },
          ];
          const results = [];
          const reportPayload = {
            id: 73,
            image_path: 'static/pano-proof.svg',
            vision: { detections_data: { detections: [] } },
            report_narrative: '### Bilan de démonstration\nConstatations à valider par le praticien.',
            created_at: '2026-09-15T10:00:00',
          };
          const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600"><rect width="1200" height="600" fill="#111827"/><path d="M150 310 C300 120 500 150 600 270 C700 150 900 120 1050 310" fill="none" stroke="#d1d5db" stroke-width="30"/></svg>';
          const forbidden = /Loki[- ]Silvres|\bd[ée]terministe(?:ment)?\b|\bSOTA\b|z[ée]ro[- ]hallucination|\bLLM\b|\bMoteur\b/i;

          try {
            for (const scene of ['loading', 'report']) {
              for (const viewport of viewports) {
                const context = await browser.newContext({ viewport, colorScheme: 'light' });
                const page = await context.newPage();
                const pageErrors = [];
                const consoleErrors = [];
                page.on('pageerror', e => pageErrors.push(String(e)));
                page.on('console', m => { if (m.type() === 'error') consoleErrors.push(m.text()); });
                await page.route('**/*', async route => {
                  const req = route.request();
                  const url = new URL(req.url());
                  if (url.hostname !== '127.0.0.1' || url.port !== '8005') return route.continue();
                  if (url.pathname.endsWith('/static/pano-proof.svg')) return route.fulfill({ status:200, contentType:'image/svg+xml', body:svg });
                  if (!url.pathname.startsWith('/api/')) return route.fulfill({ status:404, body:'' });
                  if (url.pathname === '/api/ia/patients/42/panoramic-comparison') return route.fulfill({ status:200, contentType:'application/json', body:JSON.stringify({ available:false, reason:'Moins de 2 bilans panoramiques disponibles.' }) });
                  if (url.pathname === '/api/ia/upload-panoramic' && req.method() === 'POST') {
                    if (scene === 'loading') await new Promise(resolve => setTimeout(resolve, 5000));
                    return route.fulfill({ status:200, contentType:'application/json', body:JSON.stringify(reportPayload) });
                  }
                  return route.fulfill({ status:200, contentType:'application/json', body:'{}' });
                });

                await page.goto('http://127.0.0.1:4186/client-copy-panoramic.html', { waitUntil:'domcontentloaded', timeout:30000 });
                await page.locator('h2').first().waitFor({ state:'visible', timeout:15000 });
                await page.locator('input[type="file"]').setInputFiles({ name:'pano.png', mimeType:'image/png', buffer:Buffer.from('panoramic-proof') });

                if (scene === 'loading') {
                  await page.getByText('Repérage dentaire', { exact:true }).waitFor({ state:'visible', timeout:3000 });
                } else {
                  await page.getByRole('button', { name:'Bilan PDF', exact:true }).waitFor({ state:'visible', timeout:10000 });
                  await page.getByRole('button', { name:'Bilan PDF', exact:true }).click();
                  await page.getByText('Bilan de démonstration', { exact:true }).waitFor({ state:'visible', timeout:10000 });
                }

                const text = await page.locator('body').innerText();
                const overflow = await page.evaluate(() => document.documentElement.scrollWidth > document.documentElement.clientWidth + 1);
                if (state === 'after' && forbidden.test(text)) throw new Error(`technical wording remains in ${scene}/${viewport.label}: ${text.match(forbidden)?.[0]}`);
                if (overflow) throw new Error(`horizontal overflow ${scene}/${viewport.label}`);
                if (pageErrors.length || consoleErrors.length) throw new Error(`runtime errors ${scene}/${viewport.label}: ${[...pageErrors, ...consoleErrors].join(' | ')}`);
                const shot = `${state}-${scene}-${viewport.label}.png`;
                await page.screenshot({ path:path.join(out, shot), fullPage:false, animations:'disabled' });
                results.push({ state, sha, scene, viewport, shot, overflow, technicalMatch: text.match(forbidden)?.[0] || null });
                await context.close();
              }
            }
            await fs.writeFile(path.join(out, 'results.json'), JSON.stringify({ state, sha, results }, null, 2));
          } finally {
            await browser.close();
            await server.close();
          }
          JS
          node client-copy-panoramic-proof.mjs
          rm -f client-copy-panoramic-proof.mjs client-copy-panoramic.html src/client-copy-panoramic.tsx

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: client-copy-panoramic-${{ matrix.state }}
          path: artifacts/client-copy-panoramic-${{ matrix.state }}
          if-no-files-found: error
          retention-days: 14
