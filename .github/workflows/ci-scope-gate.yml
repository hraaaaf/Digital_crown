name: CI Scope Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-scope-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify change scope
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          shopt -s nocasematch

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --name-only "$BASE_SHA" "$HEAD_SHA" > /tmp/changed.txt
          else
            git diff --name-only HEAD^ HEAD > /tmp/changed.txt || true
          fi

          frontend=false
          backend=false
          browser=false
          visual=false
          scientific=false
          patient=false
          mobile=false
          settings=false
          data=false
          workflow=false
          recommend_t2=false

          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            case "$file" in
              frontend/*) frontend=true ;;
            esac
            case "$file" in
              backend/*) backend=true ;;
            esac
            case "$file" in
              frontend/scripts/*|frontend/src/*|frontend/src/**/*) browser=true ;;
            esac
            case "$file" in
              frontend/src/*|frontend/src/**/*|frontend/public/*|frontend/public/**/*) visual=true ;;
            esac
            case "$file" in
              *cephalo*|*ortho*|*pharmacology*|*scientific*) scientific=true ;;
            esac
            case "$file" in
              *patient*|*patients*) patient=true ;;
            esac
            case "$file" in
              *mobile*|frontend/src/features/mobile/*|frontend/src/features/mobile/**/*) mobile=true ;;
            esac
            case "$file" in
              *settings*|*clinic*|*team*|*rbac*) settings=true ;;
            esac
            case "$file" in
              alembic/*|alembic/**/*|backend/alembic/*|backend/alembic/**/*|*migration*|*schema*|*postgres*) data=true ;;
            esac
            case "$file" in
              .github/workflows/*|.github/workflows/**/*|.github/CI_GOVERNANCE.md) workflow=true ;;
            esac
            case "$file" in
              .github/workflows/t2-runtime-cert.yml|scripts/t2_runtime_server.py|frontend/scripts/audit-first-user-experience*.mjs|frontend/scripts/run-with-t2-workstation.mjs|frontend/scripts/certify-*.mjs|backend/tests/test_panoramic_*|backend/tests/test_ia_router.py)
                recommend_t2=true
                ;;
            esac
          done < /tmp/changed.txt

          {
            echo "## CI scope gate"
            echo
            echo "No heavy certification is dispatched automatically."
            echo
            echo "| Scope | Relevant |"
            echo "| --- | --- |"
            echo "| frontend | $frontend |"
            echo "| backend | $backend |"
            echo "| browser/runtime | $browser |"
            echo "| visual | $visual |"
            echo "| scientific/clinical | $scientific |"
            echo "| patient | $patient |"
            echo "| mobile | $mobile |"
            echo "| settings/RBAC | $settings |"
            echo "| data/migration | $data |"
            echo "| CI/workflow | $workflow |"
            echo
            echo "### Recommended targeted certifications"
            if [[ "$recommend_t2" == "true" ]]; then
              echo "- T2 Runtime Browser Certification — relevant to the changed files above."
            else
              echo "- None proven by the current classifier."
            fi
            echo
            echo "### Changed files"
            sed 's/^/- `/; s/$/`/' /tmp/changed.txt
            echo
            echo "### Decision rule"
            echo "Run only the manual workflow(s) whose scope is demonstrated above. Full matrices are reserved for explicit closeout/release."
          } >> "$GITHUB_STEP_SUMMARY"

  # Explicit user-authorized R&D exception scoped to this ONE unmerged stacked branch.
  # No production/cabinet change, model binary, patient data or deploy.
  fdi-interactive-contract:
    if: github.event_name == 'pull_request' && github.head_ref == 'exp/lot05-j10e-fdi-model-interactive-prototype-20261022'
    name: Clinician FDI correction/confirmation state (offline synthetic only)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Exact HEAD
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run local FDI editor logic (no image or network)
        run: node --test experiments/test_lot05_j10e_fdi_review_state.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run ONNX bridge and parity pure synthetic tests
        env:
          PYTHONPATH: experiments
        run: python -m unittest -v experiments/test_lot05_j10e_fdi_onnx_bridge.py
      - name: Verify standalone prototype includes no remote scripts or model/data assets
        shell: bash
        run: |
          set -euo pipefail
          test ! -e experiments/lot05_j10e_fdi_model.onnx
          test ! -e experiments/best.pt
          python - <<'PY'
          from pathlib import Path
          raw = Path('experiments/lot05_j10e_fdi_review_demo.html').read_text(encoding='utf8')
          assert 'lot05_j10e_fdi_review_state.mjs' in raw
          assert '<script src="https://' not in raw
          assert 'RESEARCH_ONLY_NOT_SAVED_TO_PATIENT' in Path('experiments/lot05_j10e_fdi_review_state.mjs').read_text()
          assert 'fetch(' not in raw
          PY

  fdi-real-public-onnx-parity:
    if: github.event_name == 'pull_request' && github.head_ref == 'exp/lot05-j10e-fdi-model-interactive-prototype-20261022'
    name: "Public research film — pinned FDI PT vs exported ONNX CPU parity"
    runs-on: ubuntu-24.04
    needs: fdi-interactive-contract
    timeout-minutes: 50
    env:
      GIT_TERMINAL_PROMPT: '0'
      ULTRALYTICS_AUTOINSTALL: 'False'
      YOLO_CONFIG_DIR: /tmp/j10e-fdi-onnx-yolo
      WANDB_DISABLED: 'true'
      HF_HUB_DISABLE_TELEMETRY: '1'
      PYTHONPATH: experiments
      PYTHONUNBUFFERED: '1'
      PUBLIC_SOURCE: /tmp/dc-lot05-j10e-published-akudental
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact PR HEAD
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU export/inference tooling
        run: |
          python -m pip install torch==2.10.0 torchvision==0.25.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'ultralytics>=8.3.200,<8.4' 'huggingface_hub>=0.34,<2' onnx==1.21.0 onnxruntime==1.25.0
          python -m pip check
      - name: Retrieve only author-public noncommercial-research panoramics in disposable runner
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --depth=1 --filter=blob:none --sparse https://github.com/melihoz/AKUDENTAL.git "$PUBLIC_SOURCE"
          git -C "$PUBLIC_SOURCE" sparse-checkout set --no-cone '/AKUDENTAL/images/' '/AKUDENTAL/akudental_instances.json' >/dev/null
          test "$(git -C "$PUBLIC_SOURCE" rev-parse HEAD)" = "92e2cc3ae5eebc9de509311a3edefb7106fca7dd"
          test -d "$PUBLIC_SOURCE/AKUDENTAL/images"
          test -f "$PUBLIC_SOURCE/AKUDENTAL/akudental_instances.json"
      - name: Verify FDI PT vs ONNX predictions on 2 real public OPGs
        shell: bash
        run: |
          set -euo pipefail
          python experiments/lot05_j10e_fdi_onnx_parity_ci.py --publisher-repo "$PUBLIC_SOURCE" --count 2 --report lot05-j10e-onnx-parity-aggregate.json
      - name: Keep aggregate results only — never images/weights/individual boxes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lot05-j10e-fdi-onnx-parity-${{ github.event.pull_request.head.sha || github.sha }}
          path: lot05-j10e-onnx-parity-aggregate.json
          if-no-files-found: ignore
          retention-days: 7
