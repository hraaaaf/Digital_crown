name: CI Scope Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-scope-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify change scope
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          shopt -s nocasematch

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --name-only "$BASE_SHA" "$HEAD_SHA" > /tmp/changed.txt
          else
            git diff --name-only HEAD^ HEAD > /tmp/changed.txt || true
          fi

          frontend=false
          backend=false
          browser=false
          visual=false
          scientific=false
          patient=false
          mobile=false
          settings=false
          data=false
          workflow=false
          recommend_t2=false

          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            case "$file" in
              frontend/*) frontend=true ;;
            esac
            case "$file" in
              backend/*) backend=true ;;
            esac
            case "$file" in
              frontend/scripts/*|frontend/src/*|frontend/src/**/*) browser=true ;;
            esac
            case "$file" in
              frontend/src/*|frontend/src/**/*|frontend/public/*|frontend/public/**/*) visual=true ;;
            esac
            case "$file" in
              *cephalo*|*ortho*|*pharmacology*|*scientific*) scientific=true ;;
            esac
            case "$file" in
              *patient*|*patients*) patient=true ;;
            esac
            case "$file" in
              *mobile*|frontend/src/features/mobile/*|frontend/src/features/mobile/**/*) mobile=true ;;
            esac
            case "$file" in
              *settings*|*clinic*|*team*|*rbac*) settings=true ;;
            esac
            case "$file" in
              alembic/*|alembic/**/*|backend/alembic/*|backend/alembic/**/*|*migration*|*schema*|*postgres*) data=true ;;
            esac
            case "$file" in
              .github/workflows/*|.github/workflows/**/*|.github/CI_GOVERNANCE.md) workflow=true ;;
            esac
            case "$file" in
              .github/workflows/t2-runtime-cert.yml|scripts/t2_runtime_server.py|frontend/scripts/audit-first-user-experience*.mjs|frontend/scripts/run-with-t2-workstation.mjs|frontend/scripts/certify-*.mjs|backend/tests/test_panoramic_*|backend/tests/test_ia_router.py)
                recommend_t2=true
                ;;
            esac
          done < /tmp/changed.txt

          {
            echo "## CI scope gate"
            echo
            echo "No heavy certification is dispatched automatically."
            echo
            echo "| Scope | Relevant |"
            echo "| --- | --- |"
            echo "| frontend | $frontend |"
            echo "| backend | $backend |"
            echo "| browser/runtime | $browser |"
            echo "| visual | $visual |"
            echo "| scientific/clinical | $scientific |"
            echo "| patient | $patient |"
            echo "| mobile | $mobile |"
            echo "| settings/RBAC | $settings |"
            echo "| data/migration | $data |"
            echo "| CI/workflow | $workflow |"
            echo
            echo "### Recommended targeted certifications"
            if [[ "$recommend_t2" == "true" ]]; then
              echo "- T2 Runtime Browser Certification — relevant to the changed files above."
            else
              echo "- None proven by the current classifier."
            fi
            echo
            echo "### Changed files"
            sed 's/^/- `/; s/$/`/' /tmp/changed.txt
            echo
            echo "### Decision rule"
            echo "Run only the manual workflow(s) whose scope is demonstrated above. Full matrices are reserved for explicit closeout/release."
          } >> "$GITHUB_STEP_SUMMARY"

  # Explicit PR #911 ONLY. Experimental side-car: the REQUIRED Scope classifier
  # retains its own unchanged logic. A failure here MUST NOT silently promote
  # R23-G5 into a global required gate. Inspect each pytest step, not job green.
  r23g5-http-evidence:
    name: EXPERIMENTAL PR911 real JWT API evidence (nonblocking)
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 911
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SECRET_KEY: r23g5-only-ci-test-secret-key-over-32-characters
      DATABASE_URL: 'sqlite:///:memory:'
      ENVIRONMENT: test
      DIGITALCROWN_ISOLATED_RUNTIME: 'true'
      TELEMETRY_ENABLED: 'false'
      CLOUD_AI_ENABLED: 'false'
    steps:
      - name: Checkout exact PR 911 HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify exact HEAD
        env:
          PRODUCT_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated Python scientific API runtime
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.10.0 torchvision==0.25.0 torchaudio==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^(torch|torchvision|torchaudio)([<=>].*)?$' requirements.txt > /tmp/r23g5-isolated-requirements.txt
          pip install -r /tmp/r23g5-isolated-requirements.txt
          python -m pip check
      - name: Execute real JWT GET PUT GET synthetic patient and tenant guards
        run: python -m pytest backend/tests/test_cephalo_r23g5_authenticated_api.py -q
      - name: Execute typed GET and runtime graph baseline
        run: python -m pytest backend/tests/test_cephalo_typed_read_route.py backend/tests/test_cephalo_runtime_chain.py -q
