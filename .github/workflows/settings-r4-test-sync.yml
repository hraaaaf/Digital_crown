name: Settings R4 Legacy Test Sync

on:
  pull_request:
    paths:
      - ".github/workflows/settings-r4-test-sync.yml"

permissions:
  contents: write

jobs:
  sync:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: settings-r4-document-studio
          fetch-depth: 0
      - name: Align Heritage unit tests with centered premium layout
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/tests/test_services_unit20.py')
          text = path.read_text(encoding='utf-8')
          replacements = {
              "    def test_canvas_drawString_called(self):\n        assert self._call().drawString.called\n\n    def test_canvas_drawRightString_called(self):\n        assert self._call().drawRightString.called\n":
              "    def test_canvas_drawCentredString_called(self):\n        assert self._call().drawCentredString.called\n\n    def test_centered_layout_avoids_left_right_draws(self):\n        c = self._call()\n        assert not c.drawString.called\n        assert not c.drawRightString.called\n",
              "    def test_no_logo_runs(self):\n        assert self._call(logo=None).drawString.called\n":
              "    def test_no_logo_runs(self):\n        assert self._call(logo=None).drawCentredString.called\n",
              "    def test_heritage_called(self):\n        c = self._call('heritage')\n        assert c.drawString.called\n":
              "    def test_heritage_called(self):\n        c = self._call('heritage')\n        assert c.drawCentredString.called\n",
          }

          # Restrict the first replacement to the Heritage class only.
          marker = '# ── _draw_header_heritage'
          head, tail = text.split(marker, 1)
          for old, new in replacements.items():
              if old not in tail:
                  raise SystemExit(f'missing expected legacy assertion: {old!r}')
              tail = tail.replace(old, new, 1)
          path.write_text(head + marker + tail, encoding='utf-8')
          PY
      - name: Verify updated assertions
        run: |
          grep -n "drawCentredString" backend/tests/test_services_unit20.py
          python -m py_compile backend/tests/test_services_unit20.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/tests/test_services_unit20.py
          git commit -m "test(settings): align Heritage header assertions with centered layout"
          git push origin HEAD:settings-r4-document-studio
