name: BENCH REA-03 Authenticated WF04-WF07 Observational Lab
on:
  push:
    branches:
      - experiment/bench-rea03-wf04-wf07-20261018
permissions:
  contents: read
jobs:
  cabinet-real-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ENVIRONMENT: test
      SECRET_KEY: p2ter-t2-disposable-only-secret-key-000001
      DATABASE_URL: sqlite:///./t2-runtime-cert.db
      DIGITALCROWN_ISOLATED_RUNTIME: "1"
      DIGITALCROWN_ISOLATION_DB_FINGERPRINT: c04779c8d18b3ac12a0f4093a47a5d0c3c0e2251714be532893cfa052e9ee780
      TELEMETRY_ENABLED: "false"
      CLOUD_AI_ENABLED: "false"
      DEBUG: "false"
      ALLOWED_ORIGINS: http://127.0.0.1:5173,http://localhost:5173
      PRODUCT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Require exact HEAD in T2 lab
        run: test "$(git rev-parse HEAD)" = "$PRODUCT_HEAD"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Generate disposable T2 password (masked)
        run: |
          password="$(python -c 'import secrets; print(secrets.token_urlsafe(24))')"
          echo "::add-mask::$password"
          echo "T2_PASSWORD=$password" >> "$GITHUB_ENV"
          # One ephemeral, independent SQLCipher key for server and seed.
          # Never reuse the authentication key for encrypted storage.
          storage_key="$(python -c 'import secrets; print(secrets.token_hex(32))')"
          echo "::add-mask::$storage_key"
          echo "SQLCIPHER_KEY_HEX=$storage_key" >> "$GITHUB_ENV"
      - name: Install backend isolated
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.10.0 torchvision==0.25.0 torchaudio==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^(torch|torchvision|torchaudio)([<=>].*)?$' requirements.txt > /tmp/p2ter-cabinet-dependencies.txt
          pip install -r /tmp/p2ter-cabinet-dependencies.txt
          python -m pip check
      - name: Install frontend and Playwright
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save --package-lock=false --legacy-peer-deps playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start isolated T2 FastAPI runtime (real JWT and workstation)
        run: |
          python scripts/t2_runtime_server.py > /tmp/p2ter-backend.log 2>&1 &
          echo $! > /tmp/p2ter-backend.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8005/health >/dev/null; then exit 0; fi
            sleep 1
          done
          tail -100 /tmp/p2ter-backend.log
          exit 1
      - name: Seed two synthetic versioned studies on disposable test DB
        run: |
          python -m scripts.ceph_p2ter_seed_t2 | tee /tmp/p2ter-seed.log
          studies="$(python - <<'PY'
          import json
          text=open('/tmp/p2ter-seed.log').read()
          line=next(x.split('=',1)[1] for x in text.splitlines() if x.startswith('P2TER_SYNTHETIC_STUDIES='))
          print(json.dumps(json.loads(line),separators=(',',':')))
          PY
          )"
          echo "P2TER_STUDIES=$studies" >> "$GITHUB_ENV"
      - name: Start real Cabinet React frontend
        working-directory: frontend
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 > /tmp/p2ter-frontend.log 2>&1 &
          echo $! > /tmp/p2ter-frontend.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:5173 >/dev/null; then exit 0; fi
            sleep 1
          done
          tail -100 /tmp/p2ter-frontend.log
          exit 1
      - name: BENCH WF04 authentic UI 13-33-13 and focus reset two desktop sizes
        working-directory: frontend
        run: node scripts/bench-rea03-wf04-authenticated.mjs
      - name: REAL UI login, history study A/B, JWT PDF at two desktops
        working-directory: frontend
        run: node scripts/certify-ceph-p2ter-authenticated-cabinet.mjs
      - name: Verify A4 PDF identity and rendered nonclinical pages
        run: |
          python - <<'PY'
          from pathlib import Path
          import fitz,json
          root=Path('artifacts/ceph-p2ter-authenticated-desktop')
          report=json.loads((root/'report.json').read_text())
          assert report['head']=='${{ github.event.pull_request.head.sha || github.sha }}' and len(report['viewports'])==2
          assert all(item['valid'] for item in report['viewports'])
          for label in ('1280x900','1600x1000'):
              for kind in ('older','newer'):
                  p=root/(label+'-'+kind+'-selected-study.pdf')
                  with fitz.open(p) as doc:
                      assert len(doc)>=2
                      for index,page in enumerate(doc):
                          assert 590 < page.rect.width < 600 and 838 < page.rect.height < 845
                          if index<8:
                              page.get_pixmap(matrix=fitz.Matrix(1,1),alpha=False).save(root/(label+'-'+kind+'-page-'+str(index+1)+'.png'))
          PY
      - name: Verify clicked archives persisted same old study and scientific revision
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import fitz
          from backend import database, models
          source=json.loads(Path('artifacts/ceph-p2ter-authenticated-desktop/report.json').read_text())
          studied=json.loads(next(line.split('=',1)[1] for line in Path('/tmp/p2ter-seed.log').read_text().splitlines() if line.startswith('P2TER_SYNTHETIC_STUDIES=')))
          with database.SessionLocal() as db:
              rows=db.query(models.DocumentArchive).filter(models.DocumentArchive.patient_id==studied['patient_id'], models.DocumentArchive.document_type==models.DocumentType.RAPPORT_CEPHALO).all()
              assert len(rows)==2, f"Expected 1 clicked archive per viewport, got {len(rows)}"
              assert all(row.analysis_id==studied['older_id'] and row.clinical_data.get('cephalo_analysis_revision')==2 for row in rows)
          for viewport in source['viewports']:
              assert any('REAL_CABINET_ARCHIVE_BUTTON_OLDER_STUDY_' in check for check in viewport['checks'])
              pdf=Path('artifacts/ceph-p2ter-authenticated-desktop')/(viewport['viewport']+'-older-click-archived.pdf')
              with fitz.open(pdf) as doc:
                  assert len(doc)>=2 and all(590 < page.rect.width < 600 and 838 < page.rect.height < 845 for page in doc)
          print('P2TER_CLICK_ARCHIVE_DB_FK_REVISION_AND_A4_PASS')
          PY
      - name: Compare WF04 and WF07 outcomes to pinned FACAD inventory (not clinical parity)
        env:
          FACAD_P0_HEAD: 220e75e919e0220cca74c5b6bf55b75687066fe3
        run: |
          set -euo pipefail
          curl -fLsS --retry 2 --max-time 45 "https://raw.githubusercontent.com/hraaaaf/Digital_crown/$FACAD_P0_HEAD/docs/audits/data/CEPH_FACAD_PARITY_P0_DESKTOP_EVIDENCE_MATRIX_2026-10-17.json" -o /tmp/facad-p0.json
          python - <<'PY'
          import json,os,hashlib
          from pathlib import Path
          facad_raw=Path('/tmp/facad-p0.json').read_bytes()
          facad=json.loads(facad_raw)
          wf04=json.loads(Path('artifacts/bench-rea03-wf04-wf07/wf04-report.json').read_text())
          wf07=json.loads(Path('artifacts/ceph-p2ter-authenticated-desktop/report.json').read_text())
          assert facad['schema']=='CEPH_FACAD_PARITY_P0_DESKTOP_EVIDENCE_MATRIX_V1'
          assert len(facad['menus'])==9 and len(facad['toolbar'])==30 and len(facad['workflows'])==7
          assert wf04['head']==os.environ['PRODUCT_HEAD']==wf07['head']
          assert len(wf04['viewports'])==len(wf07['viewports'])==2
          for a,b in zip(wf04['viewports'],wf07['viewports']):
            assert a['valid'] and b['valid'] and a['viewport']==b['viewport']
            assert [(p['mode'],p['rows']) for p in a['profiles']]==[('mcnamara',13),('ricketts',33),('ricketts',13)]
            assert any('REAL_CABINET_ARCHIVE_BUTTON_OLDER_STUDY_' in v for v in b['checks'])
            assert a['screens'] and b['shots']
          out={
            'scope':'nonclinical AUTHENTICATED Chromium comparison to FACAD P0 UIA inventory',
            'dc_exact_head':wf04['head'],'vendor_inventory_commit':os.environ['FACAD_P0_HEAD'],
            'vendor_inventory_sha256':hashlib.sha256(facad_raw).hexdigest(),
            'vendor_menus_discovered':9,'vendor_toolbar_commands_discovered':30,
            'vendor_workflows_catalogued':7,
            'wf04_observed_profile_rows':{'mcnamara':13,'ricketts_atlas':33,'ricketts_gregoret':13},
            'wf04_two_viewports_verified':True,'wf07_two_viewports_archive_click_verified':True,
            'matched_same_clinical_data':False,'vendor_executed':False,
            'vendor_functional_parity_verified':False,'vendor_numeric_parity_verified':False,
            'clinically_ready':False,
            'limitations':['facad vendor UI observations are from older authorized Robert example and not this synthetic patient',
              'no FACAD actions were executed in this run',
              'P2ter same-analysis same-revision concurrent archive atomicity remains unproven']
          }
          folder=Path('artifacts/bench-rea03-wf04-wf07')
          (folder/'comparison.json').write_text(json.dumps(out,indent=2,ensure_ascii=False))
          print('BENCH_WF04_WF07_SOURCE_LOCKED_COMPARISON_PASS')
          print(json.dumps({k:v for k,v in out.items() if k!='limitations'}))
          PY
      - name: Dump isolated runtime diagnostic on failure
        if: failure()
        run: |
          tail -100 /tmp/p2ter-backend.log || true
          tail -100 /tmp/p2ter-frontend.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-rea03-wf04-wf07-${{ github.sha }}
          path: |
            artifacts/ceph-p2ter-authenticated-desktop/
            artifacts/bench-rea03-wf04-wf07/
          if-no-files-found: warn
          retention-days: 30
