name: PostgreSQL Alembic Schema Certification

on:
  pull_request:
    paths:
      - "alembic/**"
      - "backend/models*.py"
      - "backend/core/schema_runtime.py"
      - "backend/core/runtime_safety.py"
      - "backend/core/sqlite_alembic_baseline.py"
      - "backend/core/postgresql_alembic_baseline.py"
      - "backend/tests/test_schema_runtime_head_sync.py"
      - "backend/tests/certify_station_print_claim_pg_v15.py"
      - "backend/services/station_print_held_claims_lab.py"
      - ".github/workflows/postgresql-alembic-schema-cert.yml"
      - ".github/workflows/v15-04-8-e-integrated-software-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-schema:
    name: PostgreSQL 18 Alembic from-scratch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: digitalcrown_schema_cert
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d digitalcrown_schema_cert"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/digitalcrown_schema_cert
      ENVIRONMENT: rehearsal
      SECRET_KEY: postgresql-schema-cert-only-secret-key-000001
      TELEMETRY_ENABLED: "false"
      CLOUD_AI_ENABLED: "false"
      DEBUG: "false"

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install migration boundary dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            alembic \
            sqlalchemy==2.0.28 \
            psycopg2-binary==2.9.9 \
            "pydantic[email]==2.6.3" \
            pydantic-settings==2.2.1 \
            fastapi==0.110.0 \
            python-multipart==0.0.31 \
            python-dotenv \
            cryptography \
            PyYAML==6.0.3 \
            pytest

      - name: Prove runtime gate matches unique Alembic head
        run: python backend/tests/test_schema_runtime_head_sync.py

      - name: Assert fresh PostgreSQL database is empty
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, inspect

          engine = create_engine(os.environ["DATABASE_URL"])
          with engine.connect() as connection:
              tables = inspect(connection).get_table_names(schema="public")
          assert tables == [], tables
          print("fresh PostgreSQL schema is empty")
          PY

      - name: Upgrade fresh PostgreSQL database to head
        run: alembic upgrade head

      - name: Record first-upgrade schema proof
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          from sqlalchemy import create_engine, inspect, text
          from backend.core.schema_runtime import CURRENT_ALEMBIC_HEAD, assert_database_at_current_head

          engine = create_engine(os.environ["DATABASE_URL"])
          assert_database_at_current_head(engine)
          payload = []
          with engine.connect() as connection:
              inspector = inspect(connection)
              tables = sorted(inspector.get_table_names(schema="public"))
              table_set = set(tables)
              version = connection.execute(text("SELECT version_num FROM alembic_version")).scalar_one()
              assert version == CURRENT_ALEMBIC_HEAD, (version, CURRENT_ALEMBIC_HEAD)

              critical_tables = {
                  "patient_companion_identities",
                  "patient_companion_accesses",
                  "patient_companion_invitations",
                  "patient_companion_share_grants",
                  "patient_companion_notification_preferences",
                  "patient_companion_notification_receipts",
                  "cabinet_settings",
                  "agenda_exceptions",
                  "cabinet_specialties",
                  "cabinet_pathologies",
                  "cabinet_catalog_acts",
                  "ngap_catalog_mappings",
              }
              missing_tables = critical_tables - table_set
              assert not missing_tables, sorted(missing_tables)

              def column_names(table):
                  return {item["name"] for item in inspector.get_columns(table, schema="public")}

              required_columns = {
                  "appointments": {"source", "phone", "confirmed_by_id", "confirmed_at", "expires_at"},
                  "actes": {"document_archive_id", "deleted_at", "source_line_uid", "catalog_act_id"},
                  "patients": {"deleted_at", "deleted_by"},
                  "proactive_alerts": {"snoozed_until"},
                  "users": {"nom_complet_ar", "inpe_professionnel"},
                  "patient_companion_notification_preferences": {
                      "access_id", "employer_id", "patient_id",
                      "appointments", "documents", "questionnaires", "consents",
                  },
                  "patient_companion_notification_receipts": {
                      "access_id", "employer_id", "patient_id",
                      "source_key", "read_at", "snoozed_until",
                  },
                  "zka_pairing_tokens": {"user_id", "manual_code"},
                  "cabinet_settings": {"employer_id", "weekly_schedule_json"},
                  "agenda_exceptions": {"employer_id"},
              }
              for table, required in required_columns.items():
                  missing = required - column_names(table)
                  assert not missing, (table, sorted(missing))

              # LOT04.8 B/C staged tables MUST actually exist in the
              # fresh-metadata baseline, not merely be stamped in Alembic.
              staged_tables = {
                  "station_print_printer_drafts", "station_print_held_claims",
                  "station_print_claim_events",
              }
              assert staged_tables <= table_set, sorted(staged_tables - table_set)
              for staged in ("station_print_printer_drafts", "station_print_held_claims"):
                  fks = inspector.get_foreign_keys(staged, schema="public")
                  assert any(
                      item.get("constrained_columns") == ["tenant_id"]
                      and item.get("referred_table") == "users"
                      for item in fks
                  ), (staged, fks)
              journal_fks = inspector.get_foreign_keys("station_print_claim_events", schema="public")
              assert any(
                  item.get("constrained_columns") == ["tenant_id", "delivery_key"]
                  and item.get("referred_table") == "station_print_held_claims"
                  for item in journal_fks
              ), journal_fks
              journal_checks = {
                  item["name"]
                  for item in inspector.get_check_constraints("station_print_claim_events", schema="public")
              }
              assert {"ck_station_print_event_revision", "ck_station_print_event_transition"} <= journal_checks
              for staged in staged_tables:
                  assert connection.execute(text(f'SELECT COUNT(*) FROM "{staged}"')).scalar_one() == 0
              staged_claim_checks = {
                  item["name"]
                  for item in inspector.get_check_constraints("station_print_held_claims", schema="public")
              }
              assert {"ck_print_claim_state", "ck_print_claim_revision"} <= staged_claim_checks
              print("B/C tenant FKs and held-only print ledger verified on fresh baseline")

              # neo30 evidence/recovery are *deny-only*: a stored digest is not
              # a device certificate and an uncertain review is not a reprint.
              review_tables = {"station_print_device_evidence", "station_print_uncertain_reviews"}
              assert review_tables <= table_set, sorted(review_tables - table_set)
              evidence_fks = inspector.get_foreign_keys("station_print_device_evidence", schema="public")
              assert any(
                  fk.get("constrained_columns") == ["tenant_id", "printer_id"]
                  and fk.get("referred_table") == "station_print_printer_drafts"
                  for fk in evidence_fks
              ), evidence_fks
              review_fks = inspector.get_foreign_keys("station_print_uncertain_reviews", schema="public")
              assert any(
                  fk.get("constrained_columns") == ["tenant_id", "delivery_key"]
                  and fk.get("referred_table") == "station_print_held_claims"
                  for fk in review_fks
              ), review_fks
              assert "ck_device_evidence_never_certified" in {
                  c["name"] for c in inspector.get_check_constraints("station_print_device_evidence", schema="public")
              }
              assert "ck_uncertain_review_finding" in {
                  c["name"] for c in inspector.get_check_constraints("station_print_uncertain_reviews", schema="public")
              }
              for table in review_tables:
                  assert connection.execute(text(f'SELECT COUNT(*) FROM "{table}"')).scalar_one() == 0
              print("neo30 pending-only device evidence and uncertain-only reviews verified on fresh baseline")


              # The rollback rehearsal must not silently hide a missing
              # audit index in the UP migration. Observe it on PostgreSQL.
              print_audit_indexes = {
                  item["name"]
                  for item in inspector.get_indexes("station_print_config_audit", schema="public")
              }
              assert "ix_station_print_config_audit_tenant_revision" in print_audit_indexes, print_audit_indexes

              actes_fks = inspector.get_foreign_keys("actes", schema="public")
              assert any(
                  (item.get("constrained_columns") or []) == ["catalog_act_id"]
                  and item.get("referred_table") == "catalog_acts"
                  and (item.get("referred_columns") or []) == ["id"]
                  for item in actes_fks
              ), "actes.catalog_act_id FK missing"

              ngap_checks = {
                  item.get("name")
                  for item in inspector.get_check_constraints("ngap_catalog_mappings", schema="public")
                  if item.get("name")
              }
              required_ngap_checks = {
                  "ck_ngap_mapping_code_kind",
                  "ck_ngap_mapping_verification_status",
                  "ck_ngap_mapping_ngap_payload",
                  "ck_ngap_mapping_verified_evidence",
              }
              assert required_ngap_checks <= ngap_checks, sorted(required_ngap_checks - ngap_checks)

              ngap_unique_sets = {
                  tuple(item.get("column_names") or ())
                  for item in inspector.get_unique_constraints("ngap_catalog_mappings", schema="public")
              }
              assert ("catalog_act_id", "reference_version") in ngap_unique_sets
              assert ("mapping_rule_id",) in ngap_unique_sets

              payment_labels = set(connection.execute(text("""
                  SELECT e.enumlabel
                  FROM pg_type t
                  JOIN pg_enum e ON e.enumtypid = t.oid
                  JOIN pg_namespace n ON n.oid = t.typnamespace
                  WHERE n.nspname = current_schema()
                    AND t.typname = 'paiementstatut'
              """)).scalars().all())
              assert "A_ENCAISSER" in payment_labels, sorted(payment_labels)

              for table in tables:
                  columns = sorted(
                      (column["name"], str(column["type"]), bool(column["nullable"]))
                      for column in inspector.get_columns(table, schema="public")
                  )
                  indexes = sorted(
                      (index["name"], tuple(index.get("column_names") or ()), bool(index.get("unique")))
                      for index in inspector.get_indexes(table, schema="public")
                  )
                  payload.append((table, columns, indexes))

              for table in ("patients", "appointments", "actes", "payments", "document_archives"):
                  if table in table_set:
                      count = connection.execute(text(f'SELECT COUNT(*) FROM "{table}"')).scalar_one()
                      assert count == 0, (table, count)

          digest = hashlib.sha256(json.dumps(payload, sort_keys=True, default=str).encode()).hexdigest()
          Path("/tmp/postgres-schema-first.sha256").write_text(digest, encoding="utf-8")
          Path("/tmp/postgres-table-count.txt").write_text(str(len(tables)), encoding="utf-8")
          print(f"head={version} tables={len(tables)} schema_sha256={digest}")
          PY

      - name: Prove second upgrade is a schema no-op
        run: |
          alembic upgrade head
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          from sqlalchemy import create_engine, inspect, text
          from backend.core.schema_runtime import CURRENT_ALEMBIC_HEAD, assert_database_at_current_head

          engine = create_engine(os.environ["DATABASE_URL"])
          assert_database_at_current_head(engine)
          payload = []
          with engine.connect() as connection:
              inspector = inspect(connection)
              tables = sorted(inspector.get_table_names(schema="public"))
              version = connection.execute(text("SELECT version_num FROM alembic_version")).scalar_one()
              assert version == CURRENT_ALEMBIC_HEAD
              for table in tables:
                  columns = sorted(
                      (column["name"], str(column["type"]), bool(column["nullable"]))
                      for column in inspector.get_columns(table, schema="public")
                  )
                  indexes = sorted(
                      (index["name"], tuple(index.get("column_names") or ()), bool(index.get("unique")))
                      for index in inspector.get_indexes(table, schema="public")
                  )
                  payload.append((table, columns, indexes))

          digest = hashlib.sha256(json.dumps(payload, sort_keys=True, default=str).encode()).hexdigest()
          first = Path("/tmp/postgres-schema-first.sha256").read_text(encoding="utf-8").strip()
          first_count = int(Path("/tmp/postgres-table-count.txt").read_text(encoding="utf-8").strip())
          assert digest == first, (first, digest)
          assert len(tables) == first_count, (first_count, len(tables))
          print(f"second upgrade no-op: head={version} tables={len(tables)} schema_sha256={digest}")
          PY


      - name: Rehearse 027 to 028 on nonempty synthetic PostgreSQL and preserve witness
        run: |
          # Keep this after the full head+second-upgrade certification above.
          # Disposable CI-only PG. No real patient data, no production rollback.
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text

          engine = create_engine(os.environ["DATABASE_URL"])
          with engine.begin() as connection:
              connection.execute(text(
                  "CREATE TABLE dc_print_migration_witness "
                  "(id INTEGER PRIMARY KEY, marker VARCHAR(80) NOT NULL)"
              ))
              connection.execute(text(
                  "INSERT INTO dc_print_migration_witness (id, marker) "
                  "VALUES (1, 'synthetic-do-not-delete')"
              ))
          PY
          alembic downgrade neo000000027
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, inspect, text

          engine = create_engine(os.environ["DATABASE_URL"])
          with engine.connect() as connection:
              assert connection.execute(text("SELECT version_num FROM alembic_version")).scalar_one() == "neo000000027"
              assert connection.execute(text("SELECT marker FROM dc_print_migration_witness WHERE id=1")).scalar_one() == "synthetic-do-not-delete"
              assert "station_print_configurations" not in inspect(connection).get_table_names()
          print("nonempty synthetic predecessor preserved after 028 downgrade")
          PY
          alembic upgrade head
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, inspect, text
          from backend.core.schema_runtime import assert_database_at_current_head

          engine = create_engine(os.environ["DATABASE_URL"])
          assert_database_at_current_head(engine)
          with engine.connect() as connection:
              assert connection.execute(text("SELECT marker FROM dc_print_migration_witness WHERE id=1")).scalar_one() == "synthetic-do-not-delete"
              names = set(inspect(connection).get_table_names())
              assert {
                  "station_print_configurations", "station_print_config_stations",
                  "station_print_config_printers", "station_print_config_audit"
              } <= names
              assert connection.execute(text("SELECT COUNT(*) FROM station_print_configurations")).scalar_one() == 0
          print("neo000000027 -> 028 preserves nonempty synthetic witness; no active print configuration")
          PY


      - name: Rehearse 028 to 029 with nonempty synthetic PostgreSQL witness
        run: |
          # This tests a revision-chain upgrade, not a production migration.
          # A client printer or a Station never executes DDL.
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          engine = create_engine(os.environ["DATABASE_URL"])
          with engine.begin() as connection:
              connection.execute(text(
                  "INSERT INTO dc_print_migration_witness (id, marker) "
                  "VALUES (2, 'neo28-to-29-synthetic')"
              ))
          PY
          alembic downgrade neo000000028
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, inspect, text
          engine = create_engine(os.environ["DATABASE_URL"])
          with engine.connect() as conn:
              assert conn.execute(text("SELECT version_num FROM alembic_version")).scalar_one() == "neo000000028"
              tables = set(inspect(conn).get_table_names())
              assert "station_print_printer_drafts" not in tables
              assert "station_print_held_claims" not in tables
              assert "station_print_claim_events" not in tables
              assert "station_print_configurations" in tables
              assert conn.execute(text("SELECT marker FROM dc_print_migration_witness WHERE id=2")).scalar_one() == "neo28-to-29-synthetic"
          print("neo28 predecessor preserved with synthetic witness")
          PY
          alembic upgrade head
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, inspect, text
          from backend.core.schema_runtime import assert_database_at_current_head
          engine = create_engine(os.environ["DATABASE_URL"])
          assert_database_at_current_head(engine)
          with engine.connect() as conn:
              tables = set(inspect(conn).get_table_names())
              assert {"station_print_printer_drafts", "station_print_held_claims", "station_print_claim_events"} <= tables
              assert conn.execute(text("SELECT marker FROM dc_print_migration_witness WHERE id=2")).scalar_one() == "neo28-to-29-synthetic"
              assert conn.execute(text("SELECT COUNT(*) FROM station_print_printer_drafts")).scalar_one() == 0
              assert conn.execute(text("SELECT COUNT(*) FROM station_print_held_claims")).scalar_one() == 0
              assert conn.execute(text("SELECT COUNT(*) FROM station_print_claim_events")).scalar_one() == 0
          print("neo28->neo29 migration preserves synthetic witness and remains inert")
          PY


      - name: Rehearse neo29 to neo30 with nonempty synthetic PostgreSQL witness
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          engine=create_engine(os.environ["DATABASE_URL"])
          with engine.begin() as c:
              c.execute(text("INSERT INTO dc_print_migration_witness (id,marker) VALUES (3,'neo29-to-30-synthetic')"))
          PY
          alembic downgrade neo000000029
          python - <<'PY'
          import os
          from sqlalchemy import create_engine,inspect,text
          engine=create_engine(os.environ["DATABASE_URL"])
          with engine.connect() as c:
              assert c.execute(text("SELECT version_num FROM alembic_version")).scalar_one()=="neo000000029"
              names=set(inspect(c).get_table_names())
              assert "station_print_device_evidence" not in names
              assert "station_print_uncertain_reviews" not in names
              assert "station_print_held_claims" in names
              assert c.execute(text("SELECT marker FROM dc_print_migration_witness WHERE id=3")).scalar_one()=="neo29-to-30-synthetic"
          print("neo29 predecessor with synthetic witness preserved")
          PY
          alembic upgrade head
          python - <<'PY'
          import os
          from sqlalchemy import create_engine,inspect,text
          from backend.core.schema_runtime import assert_database_at_current_head
          engine=create_engine(os.environ["DATABASE_URL"])
          assert_database_at_current_head(engine)
          with engine.connect() as c:
              names=set(inspect(c).get_table_names())
              assert {"station_print_device_evidence","station_print_uncertain_reviews"} <= names
              assert c.execute(text("SELECT marker FROM dc_print_migration_witness WHERE id=3")).scalar_one()=="neo29-to-30-synthetic"
              for table in ("station_print_device_evidence","station_print_uncertain_reviews"):
                  assert c.execute(text(f"SELECT COUNT(*) FROM {table}")).scalar_one()==0
          print("neo29->neo30 additive upgrade: pending evidence only, no printer cert, witness preserved")
          PY

      - name: Certify two independent PostgreSQL processes and atomic journal rollback
        run: |
          python backend/tests/certify_station_print_claim_pg_v15.py
