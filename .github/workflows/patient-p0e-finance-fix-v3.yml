name: Patient P0-E Finance Fix V3

on:
  push:
    branches: [agent/patient-page-p0-rescue]
    paths:
      - '.github/workflows/patient-p0e-finance-fix-v3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ENVIRONMENT: test
      SECRET_KEY: patient-p0e-finance-v3-secret-000001
      DATABASE_URL: sqlite:///./t2-runtime-cert.db
      TELEMETRY_ENABLED: 'false'
      CLOUD_AI_ENABLED: 'false'
      DEBUG: 'false'
      ALLOWED_ORIGINS: 'http://127.0.0.1:5173,http://localhost:5173'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/patient-page-p0-rescue
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply proven P0-E frontend candidates
        run: |
          git fetch origin agent/patient-page-p0-truth-safety --depth=1
          git show FETCH_HEAD:frontend/src/features/patients/components/PatientFinances.tsx > frontend/src/features/patients/components/PatientFinances.tsx
          git show FETCH_HEAD:frontend/src/features/patients/components/InstallmentPlanModal.tsx > frontend/src/features/patients/components/InstallmentPlanModal.tsx
          git show FETCH_HEAD:scripts/t2_runtime_server.py > scripts/t2_runtime_server.py
          python - <<'PY'
          from pathlib import Path
          f=Path('frontend/src/features/patients/components/PatientFinances.tsx').read_text(encoding='utf-8')
          m=Path('frontend/src/features/patients/components/InstallmentPlanModal.tsx').read_text(encoding='utf-8')
          assert "recoveryRate === null ? '—'" in f
          assert "recoveryRate === null ? 'Non applicable'" in f
          assert "api.post('/installments/'" in m
          assert 'acte_id: acte.id' in m
          assert 'if (!coverageExact)' in m
          assert "api.post('/accounting/plans'" not in m
          PY
          git diff --check
      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.12.0 torchvision==0.27.0 --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^(torch|torchvision)([<=>].*)?$' requirements.txt > /tmp/requirements-p0e-v3.txt
          pip install -r /tmp/requirements-p0e-v3.txt
          pip install httpx==0.27.2
      - name: Install frontend and Chromium
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Frontend build
        working-directory: frontend
        run: npm run build
      - name: Start isolated runtime
        run: |
          rm -f t2-runtime-cert.db
          python scripts/t2_runtime_server.py > /tmp/p0e-v3-backend.log 2>&1 &
          for i in {1..90}; do if curl -fsS http://127.0.0.1:8005/health >/dev/null; then break; fi; sleep 1; done
          curl -fsS http://127.0.0.1:8005/health >/dev/null || { cat /tmp/p0e-v3-backend.log; exit 1; }
          cd frontend
          npm run dev -- --host 127.0.0.1 --port 5173 > /tmp/p0e-v3-front.log 2>&1 &
          for i in {1..90}; do if curl -fsS http://127.0.0.1:5173 >/dev/null; then exit 0; fi; sleep 1; done
          cat /tmp/p0e-v3-front.log
          exit 1
      - name: Capture AFTER same viewports
        working-directory: frontend
        run: |
          mkdir -p ../artifacts/p0e-finance-after-v3
          cat > .p0e-v3.mjs <<'JS'
          import fs from 'node:fs'; import path from 'node:path'; import { chromium, request } from 'playwright';
          const out=path.resolve('../artifacts/p0e-finance-after-v3');
          const viewports=[{width:390,height:844},{width:430,height:932},{width:768,height:1024},{width:1280,height:900}];
          const api=await request.newContext({baseURL:'http://127.0.0.1:8005'});
          const login=await api.post('/api/auth/login',{form:{username:'t2-browser@cabinet.ma',password:'T2BrowserPass123!'}}); if(!login.ok()) throw new Error(await login.text());
          const tok=await login.json(); const ps=await api.get('/api/patients',{headers:{Authorization:`Bearer ${tok.access_token}`}}); if(!ps.ok()) throw new Error(await ps.text());
          const all=await ps.json(); const zero=all.find(p=>p.numero_dossier==='T2-ZERO-BILL'); const main=all.find(p=>p.numero_dossier==='T2-0001'); if(!zero||!main) throw new Error('fixtures missing');
          const browser=await chromium.launch({headless:true}); const evidence=[];
          for(const viewport of viewports){
            const ctx=await browser.newContext({viewport,colorScheme:'light'}); const page=await ctx.newPage();
            await page.addInitScript(({a,r})=>{localStorage.setItem('token',a);localStorage.setItem('refresh_token',r||'');localStorage.setItem('appMode','prod');},{a:tok.access_token,r:tok.refresh_token});
            const errors=[]; const http5xx=[]; page.on('pageerror',e=>errors.push(String(e))); page.on('response',r=>{if(r.status()>=500)http5xx.push({url:r.url(),status:r.status()});});
            await page.goto(`http://127.0.0.1:5173/patients/${zero.id}?tab=finances`,{waitUntil:'networkidle',timeout:90000}); await page.getByText('Taux Recouvrement',{exact:true}).waitFor();
            const body=await page.locator('body').innerText(); const zeroShot=`zero-billed-after-${viewport.width}x${viewport.height}.png`; await page.screenshot({path:path.join(out,zeroShot),fullPage:true});
            await page.goto(`http://127.0.0.1:5173/patients/${main.id}?tab=finances`,{waitUntil:'networkidle',timeout:90000}); const plan=page.getByRole('button',{name:/Plan/i}).first(); await plan.waitFor(); await plan.click(); await page.getByRole('dialog').waitFor();
            const modalShot=`installment-after-${viewport.width}x${viewport.height}.png`; await page.screenshot({path:path.join(out,modalShot),fullPage:false});
            const metrics=await page.evaluate(()=>({scrollWidth:document.documentElement.scrollWidth,clientWidth:document.documentElement.clientWidth,noHorizontalOverflow:document.documentElement.scrollWidth<=document.documentElement.clientWidth+2}));
            evidence.push({viewport,noFalse100:!body.includes('100%'),showsNA:body.includes('Non applicable'),modalVisible:await page.getByRole('dialog').isVisible(),metrics,errors,http5xx,zeroShot,modalShot}); await ctx.close();
          }
          const summary={captures:evidence.length*2,noFalse100:evidence.every(x=>x.noFalse100),nonApplicableEverywhere:evidence.every(x=>x.showsNA),modalVisibleEverywhere:evidence.every(x=>x.modalVisible),overflowFindings:evidence.filter(x=>!x.metrics.noHorizontalOverflow),runtimeErrors:evidence.filter(x=>x.errors.length),http5xx:evidence.filter(x=>x.http5xx.length)};
          fs.writeFileSync(path.join(out,'evidence.json'),JSON.stringify(evidence,null,2)); fs.writeFileSync(path.join(out,'summary.json'),JSON.stringify(summary,null,2)); await browser.close(); await api.dispose();
          if(summary.captures!==8||!summary.noFalse100||!summary.nonApplicableEverywhere||!summary.modalVisibleEverywhere||summary.runtimeErrors.length||summary.http5xx.length) process.exit(1);
          JS
          node .p0e-v3.mjs
          rm .p0e-v3.mjs
      - name: Write proof
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          summary=json.loads(Path('artifacts/p0e-finance-after-v3/summary.json').read_text())
          proof={'status':'CERTIFIED','baseline_run_id':32134082751,'baseline_artifact_id':9323361000,'after':summary,'run_id':os.environ['RUN_ID'],'contracts':['no fictitious recovery rate without billing base','canonical /installments/ endpoint','acte_id explicit','exact coverage required']}
          Path('docs/PATIENT_P0E_FINANCE_UI_CERT.json').write_text(json.dumps(proof,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git diff --check
      - uses: actions/upload-artifact@v4
        with:
          name: patient-p0e-finance-after-v3
          path: artifacts/p0e-finance-after-v3
          if-no-files-found: error
          retention-days: 14
      - name: Commit, rebase, push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/features/patients/components/PatientFinances.tsx frontend/src/features/patients/components/InstallmentPlanModal.tsx docs/PATIENT_P0E_FINANCE_UI_CERT.json
          git diff --cached --check
          git commit -m 'cert(patient): fix P0-E finance truth'
          git fetch origin agent/patient-page-p0-rescue
          git rebase origin/agent/patient-page-p0-rescue
          git push origin HEAD:agent/patient-page-p0-rescue
