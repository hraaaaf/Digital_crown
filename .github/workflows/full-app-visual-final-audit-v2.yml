name: Full App Visual Final Audit V2

on:
  push:
    branches: [audit/visual-final-2026-09-08]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend and Chromium
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Build robust final harness
        working-directory: frontend
        run: |
          awk '/cat > full-app-visual-audit.mjs <<'"'"'EOF'"'"'/{flag=1;next}/^          EOF$/{flag=0}flag{sub(/^          /,"");print}' ../.github/workflows/full-app-visual-theme-audit.yml > full-app-visual-audit.mjs
          sed -i "s/\['default', 'medical-ocean'\]/['default', 'ocean']/" full-app-visual-audit.mjs
          python - <<'PY'
          from pathlib import Path
          p=Path('full-app-visual-audit.mjs')
          s=p.read_text()
          marker='function fixture(pathname, method) {'
          prefix="""function fixture(pathname, method) {
            if (pathname.endsWith('/api/mobile/passkey/status')) return { state: 'disabled', credential_id: null, rp_id: 'digitalcrown.local', expected_origin: 'https://digitalcrown.local:8005', origin_ready: true, user_verification: 'required', server_gate: true };
            if (pathname.endsWith('/api/patients/1/journey')) return { patient_id: 1, window_months: 12, truncated: false, total_events_available: 0, summary: { active_plan_steps: 0, total_plan_steps: 0, remaining_due: 0, has_billing_data: false, next_appointment: null, last_document_date: null }, events: [] };
            if (pathname.endsWith('/api/patients/1/documents')) return [];
            if (pathname.endsWith('/api/actes/patient/1')) return [];
            if (pathname.endsWith('/api/superadmin/clients')) return [];
            if (pathname.endsWith('/api/superadmin/trial-codes')) return [];
          """
          if marker not in s: raise SystemExit('fixture marker missing')
          s=s.replace(marker,prefix,1)
          goto="await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 30000 });"
          force=goto+"\n                  await page.evaluate((theme) => { document.documentElement.dataset.theme = theme === 'ocean' ? 'ocean' : ''; document.body.dataset.theme = theme === 'ocean' ? 'ocean' : ''; }, theme);"
          if goto not in s: raise SystemExit('goto marker missing')
          s=s.replace(goto,force,1)
          p.write_text(s)
          PY
          node --check full-app-visual-audit.mjs
      - name: Capture definitive routes and themes
        working-directory: frontend
        run: node full-app-visual-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-app-visual-final-audit-v2
          path: artifacts/full-app-visual-audit
          retention-days: 14
          if-no-files-found: error
