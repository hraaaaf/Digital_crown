name: Patient P6A Shared Identity Contract V2

on:
  pull_request:
    branches:
      - agent/patient-page-p5-documents
    paths:
      - '.github/workflows/patient-p6a-shared-identity-contract-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/patient-page-p6-finances-identite'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Reuse guarded P6-A shared identity patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap
          workflow = Path('.github/workflows/patient-p6a-shared-identity-contract.yml').read_text(encoding='utf-8')
          start = workflow.index("          python - <<'PY'\n") + len("          python - <<'PY'\n")
          end = workflow.index("\n          PY\n", start)
          script = textwrap.dedent(workflow[start:end])
          exec(compile(script, 'patient-p6a-shared-identity-contract', 'exec'), {})
          PY
          git diff --check
      - name: Test shared identity contract
        working-directory: frontend
        run: |
          npm ci
          npm run test -- --run src/features/patients/PatientIdentityContract.p6.test.ts
          npm run build
      - name: Commit shared contract wiring
        run: |
          git config user.name 'digital-crown-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add frontend/src/features/patients/PatientIdentityContract.ts frontend/src/features/patients/PatientIdentityContract.p6.test.ts frontend/src/features/patients/AddPatientForm.tsx frontend/src/features/patients/EditPatientForm.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'refactor(patient): unify P6 identity contract'
          git push origin HEAD:${GITHUB_HEAD_REF}
