name: Patient P4 Imagerie UI Contract

on:
  pull_request:
    branches:
      - agent/patient-page-p3-clinique
    paths:
      - 'frontend/src/features/patients/PatientDetailsInner.tsx'
      - 'frontend/src/features/patients/PatientP4ImagingTruth.test.ts'
      - 'frontend/src/features/panoramic/PanoramicStudio.tsx'
      - 'frontend/src/features/panoramic/PanoramicHistory.tsx'
      - 'frontend/src/features/ortho/CephaloWorkspace.tsx'
      - 'frontend/src/features/ortho/CephaloHistory.tsx'
      - '.github/workflows/patient-p4-imagerie-ui-contract.yml'

permissions:
  contents: read

jobs:
  ui-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: P4 UI truth test and build
        working-directory: frontend
        run: |
          npm ci
          npm test -- --run src/features/patients/PatientP4ImagingTruth.test.ts
          npm run build
