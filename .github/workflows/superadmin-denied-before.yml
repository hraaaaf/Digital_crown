name: Superadmin Denied BEFORE

on:
  workflow_dispatch:

permissions:
  contents: read

# Immutable historical baseline only. The denied-state BEFORE proof was captured
# successfully against product HEAD 6e2280214ff6cefc8512b1978179bfe9d0209049.
# Keep this workflow manual so the historical harness cannot become a recurring
# PR gate after the product has moved to the AFTER state.
jobs:
  before:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout frozen BEFORE product head
        uses: actions/checkout@v4
        with:
          ref: 6e2280214ff6cefc8512b1978179bfe9d0209049

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend and Chromium
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Materialize immutable BEFORE harness
        working-directory: frontend
        run: |
          cat > superadmin-before.html <<'EOF'
          <!doctype html>
          <html lang="fr">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <title>Superadmin denied BEFORE</title>
            </head>
            <body>
              <div id="root"></div>
              <script type="module" src="/src/superadmin-before.tsx"></script>
            </body>
          </html>
          EOF

          cat > src/superadmin-before.tsx <<'EOF'
          import React from 'react';
          import { createRoot } from 'react-dom/client';
          import { MemoryRouter } from 'react-router-dom';
          import { Toaster } from 'react-hot-toast';
          import './index.css';
          import { SuperAdminDashboard } from './features/superadmin/SuperAdminDashboard';

          createRoot(document.getElementById('root')!).render(
            <React.StrictMode>
              <MemoryRouter initialEntries={['/super-admin']}>
                <SuperAdminDashboard />
                <Toaster />
              </MemoryRouter>
            </React.StrictMode>,
          );
          EOF

          cat > superadmin-before.mjs <<'EOF'
          import { chromium } from 'playwright';
          import { createServer } from 'vite';
          import fs from 'node:fs/promises';

          const output = '../artifacts/superadmin-denied-before';
          await fs.mkdir(output, { recursive: true });
          const viewports = [
            { width: 390, height: 844 },
            { width: 430, height: 932 },
            { width: 768, height: 1024 },
            { width: 1280, height: 800 },
          ];

          const server = await createServer({
            server: { host: '127.0.0.1', port: 4177, strictPort: true },
            clearScreen: false,
          });
          await server.listen();

          const browser = await chromium.launch({ headless: true });
          const evidence = [];
          try {
            for (const viewport of viewports) {
              const context = await browser.newContext({ viewport, colorScheme: 'light' });
              const page = await context.newPage();
              const responses = [];
              const pageErrors = [];

              page.on('pageerror', error => pageErrors.push(String(error)));
              await page.route('**/*', async route => {
                const request = route.request();
                const url = new URL(request.url());
                if (url.port === '8005' && url.pathname.startsWith('/api/superadmin/')) {
                  responses.push({ method: request.method(), path: url.pathname, status: 403 });
                  return route.fulfill({
                    status: 403,
                    contentType: 'application/json',
                    body: JSON.stringify({ detail: 'Accès plateforme refusé' }),
                  });
                }
                return route.continue();
              });

              await page.goto('http://127.0.0.1:4177/superadmin-before.html', {
                waitUntil: 'networkidle',
                timeout: 60000,
              });
              await page.waitForTimeout(1200);

              const shellTitle = await page.getByText('SuperAdmin', { exact: true }).count();
              const globalManagement = await page.getByText('Gestion Globale des Licences & Clients', { exact: true }).count();
              const activationForm = await page.getByText("Générer un code d'activation", { exact: true }).count();
              const totalClients = await page.getByText('Total Clients', { exact: true }).count();
              const deniedToast = await page.getByText(/Accès refusé|Erreur lors du chargement des codes/).count();
              const horizontalOverflow = await page.evaluate(() => document.documentElement.scrollWidth > document.documentElement.clientWidth + 2);
              const screenshot = `before-denied-${viewport.width}x${viewport.height}.png`;
              await page.screenshot({ path: `${output}/${screenshot}`, fullPage: true, animations: 'disabled' });

              evidence.push({
                viewport,
                screenshot,
                responses,
                shellTitle,
                globalManagement,
                activationForm,
                totalClients,
                deniedToast,
                horizontalOverflow,
                pageErrors,
              });
              await context.close();
            }
          } finally {
            await browser.close();
            await server.close();
          }

          const report = {
            baseline_sha: '6e2280214ff6cefc8512b1978179bfe9d0209049',
            goal: 'Prove the current denied authenticated state before any Superadmin UI correction.',
            viewports,
            captures: evidence.length,
            evidence,
          };
          await fs.writeFile(`${output}/report.json`, JSON.stringify(report, null, 2));
          await fs.writeFile(`${output}/metadata.txt`, [
            'phase=BEFORE',
            'baseline_sha=6e2280214ff6cefc8512b1978179bfe9d0209049',
            'surface=frontend/src/features/superadmin/SuperAdminDashboard.tsx',
            'scenario=authenticated non-platform user; all /api/superadmin/* requests return authoritative 403',
            'viewports=390x844,430x932,768x1024,1280x800',
          ].join('\n'));

          const invalid = evidence.some(item =>
            item.responses.length < 2 ||
            item.responses.some(response => response.status !== 403) ||
            item.shellTitle < 1 ||
            item.globalManagement < 1 ||
            item.activationForm < 1 ||
            item.totalClients < 1 ||
            item.pageErrors.length > 0
          );
          if (invalid) process.exit(1);
          EOF

      - name: Capture exact denied BEFORE
        working-directory: frontend
        run: node superadmin-before.mjs

      - name: Upload immutable BEFORE evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: superadmin-denied-before-6e228021
          path: artifacts/superadmin-denied-before
          if-no-files-found: error
          retention-days: 14
