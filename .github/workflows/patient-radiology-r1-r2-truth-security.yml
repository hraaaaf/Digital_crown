name: Patient Radiology R1-R2 Truth Security

on:
  push:
    branches:
      - agent/patient-page-p0-truth-safety
    paths:
      - '.github/workflows/patient-radiology-r1-r2-truth-security.yml'
      - 'backend/routers/ia.py'
      - 'backend/services/panoramic_service.py'
      - 'backend/services/sota_panoramic_service.py'
      - 'frontend/src/features/panoramic/PanoramicStudio.tsx'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: patient-r1-panoramic-pdf-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Patch R1 authenticated PDF and R2 fail-closed radiology
        run: |
          python - <<'PY'
          from pathlib import Path

          # R1 — authenticated panoramic PDF stream.
          ia = Path('backend/routers/ia.py')
          src = ia.read_text(encoding='utf-8')
          old = '''@router.get("/panoramic/{analysis_id}/pdf")
def download_panoramic_pdf(analysis_id: int, db: Session = Depends(database.get_db), current_user: models.User = Depends(require_permission("panoramic"))):
    """Génère et retourne l'URL du bilan PDF professionnel Élite."""
    try:
        from backend.services.generators.panoramic_elite_gen import panoramic_elite_generator
        pdf_url = panoramic_elite_generator.generate(
            db=db,
            analysis_id=analysis_id,
            current_user=current_user
        )
        return {"pdf_url": f"{os.getenv('BACKEND_URL', 'http://localhost:8000')}/{pdf_url}"}
    except Exception as e:
        logger.exception(f"Erreur lors de la génération du PDF panoramique Élite: {e}")
        raise HTTPException(status_code=500, detail=str(e))
'''
          new = '''@router.get("/panoramic/{analysis_id}/pdf")
def download_panoramic_pdf(analysis_id: int, db: Session = Depends(database.get_db), current_user: models.User = Depends(require_permission("panoramic"))):
    """Génère et diffuse le PDF panoramique via un flux authentifié."""
    analysis = db.query(models.PanoramicAnalysis).filter(models.PanoramicAnalysis.id == analysis_id).first()
    if not analysis:
        raise HTTPException(status_code=404, detail="Analyse introuvable")
    assert_patient_access(analysis.patient_id, current_user, db)

    try:
        from fastapi.responses import FileResponse
        from backend.services.generators.panoramic_elite_gen import panoramic_elite_generator

        pdf_rel = panoramic_elite_generator.generate(
            db=db,
            analysis_id=analysis_id,
            current_user=current_user
        )
        clean_rel = pdf_rel.removeprefix("api/")
        pdf_path = os.path.join(BASE_DIR, clean_rel)
        if not os.path.isfile(pdf_path):
            raise HTTPException(status_code=500, detail="PDF généré introuvable")
        return FileResponse(
            path=pdf_path,
            media_type="application/pdf",
            filename=os.path.basename(pdf_path),
        )
    except HTTPException:
        raise
    except Exception as e:
        logger.exception(f"Erreur lors de la génération du PDF panoramique Élite: {e}")
        raise HTTPException(status_code=500, detail=str(e))
'''
          if new not in src:
              if old not in src:
                  raise SystemExit('ia.py: expected PDF endpoint source not found')
              src = src.replace(old, new, 1)
              ia.write_text(src, encoding='utf-8')

          ui = Path('frontend/src/features/panoramic/PanoramicStudio.tsx')
          src = ui.read_text(encoding='utf-8')
          old_download = '''  const handleDownloadPDF = async () => {
    if (!result?.id) return;
    setDownloading(true);
    try {
      const response = await api.get(`/ia/panoramic/${result.id}/pdf`);
      window.open(response.data.pdf_url, '_blank');
    } catch (err: any) {
      console.error("Erreur téléchargement PDF :", err);
      const errorMsg = err?.response?.data?.detail || "Erreur lors de la génération du PDF.";
      toast.error(errorMsg);
    } finally {
      setDownloading(false);
    }
  };
'''
          new_download = '''  const handleDownloadPDF = async () => {
    if (!result?.id) return;
    setDownloading(true);
    try {
      const response = await api.get(`/ia/panoramic/${result.id}/pdf`, { responseType: 'blob' });
      const blobUrl = URL.createObjectURL(response.data);
      window.open(blobUrl, '_blank', 'noopener,noreferrer');
      window.setTimeout(() => URL.revokeObjectURL(blobUrl), 60_000);
    } catch (err: any) {
      console.error("Erreur téléchargement PDF :", err);
      const errorMsg = err?.response?.data?.detail || "Erreur lors de la génération du PDF.";
      toast.error(errorMsg);
    } finally {
      setDownloading(false);
    }
  };
'''
          old_preview = '''  const handlePreview = async () => {
    if (!result?.id) return;
    setIsPreviewLoading(true);
    setPreviewPdfUrl(null);
    try {
      const response = await api.get(`/ia/panoramic/${result.id}/pdf`);
      setPreviewPdfUrl(response.data.pdf_url);
    } catch (err: any) {
      console.error("Erreur aperçu PDF :", err);
      const errorMsg = err?.response?.data?.detail || "Impossible de charger l'aperçu PDF.";
      toast.error(errorMsg);
    } finally {
      setIsPreviewLoading(false);
    }
  };
'''
          new_preview = '''  const handlePreview = async () => {
    if (!result?.id) return;
    setIsPreviewLoading(true);
    setPreviewPdfUrl(null);
    try {
      const response = await api.get(`/ia/panoramic/${result.id}/pdf`, { responseType: 'blob' });
      setPreviewPdfUrl(URL.createObjectURL(response.data));
    } catch (err: any) {
      console.error("Erreur aperçu PDF :", err);
      const errorMsg = err?.response?.data?.detail || "Impossible de charger l'aperçu PDF.";
      toast.error(errorMsg);
    } finally {
      setIsPreviewLoading(false);
    }
  };
'''
          if new_download not in src:
              if old_download not in src:
                  raise SystemExit('PanoramicStudio: download source not found')
              src = src.replace(old_download, new_download, 1)
          if new_preview not in src:
              if old_preview not in src:
                  raise SystemExit('PanoramicStudio: preview source not found')
              src = src.replace(old_preview, new_preview, 1)
          ui.write_text(src, encoding='utf-8')

          # R2 — cabinet is production-like: never synthesize clinical image detections.
          sota = Path('backend/services/sota_panoramic_service.py')
          src = sota.read_text(encoding='utf-8')
          old_env = '''def _is_production() -> bool:
    """En production, aucune simulation IA clinique silencieuse n'est tolérée (P0.8)."""
    return str(getattr(settings, "ENVIRONMENT", "development")).lower() == "production"
'''
          new_env = '''def _is_clinical_environment() -> bool:
    """En production ou cabinet, aucune simulation clinique n'est tolérée."""
    return str(getattr(settings, "ENVIRONMENT", "development")).lower() in {"production", "cabinet"}
'''
          if new_env not in src:
              if old_env not in src:
                  raise SystemExit('sota: environment helper source not found')
              src = src.replace(old_env, new_env, 1)
              src = src.replace('_is_production()', '_is_clinical_environment()')
              sota.write_text(src, encoding='utf-8')

          pano = Path('backend/services/panoramic_service.py')
          src = pano.read_text(encoding='utf-8')
          old_env = '''def _is_production() -> bool:
    """En production, aucune simulation IA clinique silencieuse n'est tolérée (P0.8)."""
    return str(getattr(settings, "ENVIRONMENT", "development")).lower() == "production"
'''
          new_env = '''def _is_clinical_environment() -> bool:
    """En production ou cabinet, aucune simulation clinique n'est tolérée."""
    return str(getattr(settings, "ENVIRONMENT", "development")).lower() in {"production", "cabinet"}
'''
          if new_env not in src:
              if old_env not in src:
                  raise SystemExit('panoramic: environment helper source not found')
              src = src.replace(old_env, new_env, 1)
              src = src.replace('_is_production()', '_is_clinical_environment()')

          old_fallback = '''            # Fallback: retourner une liste vide avec succès
            return {
                "status": "SUCCESS",
                "mode_inference": "FALLBACK_EMPTY",
                "detections_data": {
                    "detections": [],
                    "summary": "Détection indisponible — annotation manuelle par le praticien",
                    "error": str(e)
                },
            }
'''
          new_fallback = '''            # Échec explicite : aucune détection clinique n'est fabriquée ni présentée comme réussie.
            return {
                "status": "UNAVAILABLE",
                "mode_inference": "FALLBACK_EMPTY",
                "detections_data": {
                    "detections": [],
                    "summary": "Détection automatique indisponible — repérage manuel requis par le praticien",
                    "error": str(e)
                },
            }
'''
          if new_fallback not in src:
              if old_fallback not in src:
                  raise SystemExit('panoramic: fallback source not found')
              src = src.replace(old_fallback, new_fallback, 1)
          pano.write_text(src, encoding='utf-8')
          PY

      - name: Truth and security contracts
        run: |
          python - <<'PY'
          from pathlib import Path

          ia = Path('backend/routers/ia.py').read_text(encoding='utf-8')
          ui = Path('frontend/src/features/panoramic/PanoramicStudio.tsx').read_text(encoding='utf-8')
          pano = Path('backend/services/panoramic_service.py').read_text(encoding='utf-8')
          sota = Path('backend/services/sota_panoramic_service.py').read_text(encoding='utf-8')

          start = ia.index('@router.get("/panoramic/{analysis_id}/pdf")')
          end = ia.index('@router.delete("/panoramic/{analysis_id}"', start)
          endpoint = ia[start:end]
          assert 'assert_patient_access(analysis.patient_id, current_user, db)' in endpoint
          assert endpoint.index('assert_patient_access') < endpoint.index('panoramic_elite_generator.generate')
          assert 'FileResponse(' in endpoint
          assert 'pdf_url' not in endpoint
          assert "responseType: 'blob'" in ui
          assert 'response.data.pdf_url' not in ui

          for text in (pano, sota):
              assert 'in {"production", "cabinet"}' in text
              assert '_is_production()' not in text
          assert '"status": "UNAVAILABLE"' in pano
          assert '"status": "SUCCESS",\n                "mode_inference": "FALLBACK_EMPTY"' not in pano
          print('Radiology R1-R2 truth/security contracts: OK')
          PY

      - name: Python syntax
        run: |
          python -m py_compile backend/routers/ia.py backend/services/panoramic_service.py backend/services/sota_panoramic_service.py

      - name: Cabinet fail-closed unit probe
        run: |
          python - <<'PY'
          import os
          os.environ['ENVIRONMENT'] = 'cabinet'
          from backend.config import settings
          object.__setattr__(settings, 'ENVIRONMENT', 'cabinet')
          import backend.services.sota_panoramic_service as sota
          import backend.services.panoramic_service as pano
          assert sota._is_clinical_environment() is True
          assert pano._is_clinical_environment() is True
          print('Cabinet environment is fail-closed: OK')
          PY

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend build
        working-directory: frontend
        run: npm run build

      - name: Commit certified radiology product patch
        run: |
          if git diff --quiet -- backend/routers/ia.py backend/services/panoramic_service.py backend/services/sota_panoramic_service.py frontend/src/features/panoramic/PanoramicStudio.tsx; then
            echo "Radiology R1-R2 product patch already committed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/routers/ia.py backend/services/panoramic_service.py backend/services/sota_panoramic_service.py frontend/src/features/panoramic/PanoramicStudio.tsx
          git commit -m "fix(patient): fail closed radiology and secure PDF access"
          git push origin HEAD:${GITHUB_REF_NAME}
