name: Mobile Stock MOB-5D Cert

on:
  pull_request:
    branches: [master]
    paths:
      - .github/workflows/mobile-stock-mob5d-cert.yml
      - frontend/src/features/mobile/**
      - frontend/src/pages/StockPage.tsx
      - frontend/src/App.tsx
      - frontend/scripts/capture-mobile-stock-mob5d.mjs
      - docs/ux/DIGITAL_CROWN_MOBILE_STOCK_MOB5D_*.md
  workflow_dispatch:

concurrency:
  group: mobile-stock-mob5d-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    name: MOB-5D contracts + build + exact BEFORE/AFTER
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record exact candidate and baseline
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test "$(git cat-file -t aaa28ef97b22df2c5654c4e0da7efc15692787a8)" = commit
          echo "candidate=${{ github.sha }}"
          echo "baseline=aaa28ef97b22df2c5654c4e0da7efc15692787a8"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install candidate frontend
        working-directory: frontend
        run: npm ci

      - name: Verify MOB-5D contracts
        working-directory: frontend
        run: >-
          npx vitest run
          src/features/mobile/bridge.m5a.test.ts
          src/features/mobile/Dashboard/components/MobileBottomNav.test.tsx
          src/features/mobile/Dashboard/views/StockView.test.tsx
          src/features/mobile/mobileThemeHardcoding.test.ts

      - name: Verify production frontend build
        working-directory: frontend
        run: npm run build

      - name: Install Chromium evidence runner
        working-directory: frontend
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Prepare exact BEFORE baseline
        run: |
          git worktree add /tmp/mob5d-before aaa28ef97b22df2c5654c4e0da7efc15692787a8
          cd /tmp/mob5d-before/frontend
          npm ci

      - name: Start exact BEFORE preview harness
        env:
          VITE_DC_PREVIEW_DEMO: "1"
        run: |
          cd /tmp/mob5d-before/frontend
          npm run dev -- --host 127.0.0.1 --port 5173 >/tmp/mob5d-before-vite.log 2>&1 &
          for i in {1..60}; do
            curl -fsS 'http://127.0.0.1:5173/mobile/demo?demo=1' >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/mob5d-before-vite.log
          exit 1

      - name: Capture and assert exact MOB-5D BEFORE
        working-directory: frontend
        env:
          MOBILE_EVIDENCE_MODE: before
          MOBILE_EVIDENCE_URL: http://127.0.0.1:5173/mobile/demo?demo=1
          MOBILE_EVIDENCE_DIR: ../artifacts/mobile-stock-mob5d
        run: node scripts/capture-mobile-stock-mob5d.mjs

      - name: Start candidate AFTER preview harness
        working-directory: frontend
        env:
          VITE_DC_PREVIEW_DEMO: "1"
        run: |
          npm run dev -- --host 127.0.0.1 --port 5174 >/tmp/mob5d-after-vite.log 2>&1 &
          for i in {1..60}; do
            curl -fsS 'http://127.0.0.1:5174/mobile/demo?demo=1&tab=stock' >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/mob5d-after-vite.log
          exit 1

      - name: Capture and assert MOB-5D AFTER
        working-directory: frontend
        env:
          MOBILE_EVIDENCE_MODE: after
          MOBILE_EVIDENCE_URL: http://127.0.0.1:5174/mobile/demo?demo=1&tab=stock
          MOBILE_EVIDENCE_DIR: ../artifacts/mobile-stock-mob5d
        run: node scripts/capture-mobile-stock-mob5d.mjs

      - name: Verify PNG dimensions and record evidence
        run: |
          python - <<'PY'
          from pathlib import Path
          import struct
          expected = {
              'before-plus-390x844.png': (390, 844),
              'before-plus-430x932.png': (430, 932),
              'before-plus-768x1024.png': (768, 1024),
              'after-stock-390x844.png': (390, 844),
              'after-stock-430x932.png': (430, 932),
              'after-stock-768x1024.png': (768, 1024),
          }
          root = Path('artifacts/mobile-stock-mob5d')
          for name, dims in expected.items():
              data = (root / name).read_bytes()
              width, height = struct.unpack('>II', data[16:24])
              if (width, height) != dims:
                  raise SystemExit(f'{name}: got {(width, height)}, expected {dims}')
              print(f'{name}: {width}x{height} OK')
          PY
          printf 'baseline=%s\ncandidate=%s\nviewports=390x844,430x932,768x1024\nbefore=Plus-without-Stock\nafter=Plus->Stock\ncanonical_nav=preserved\nhorizontal_overflow=none-required\nruntime_errors=none-required\ndeployment=none\n' 'aaa28ef97b22df2c5654c4e0da7efc15692787a8' '${{ github.sha }}' > artifacts/mobile-stock-mob5d/result.txt
          cp /tmp/mob5d-before-vite.log artifacts/mobile-stock-mob5d/before-vite.log
          cp /tmp/mob5d-after-vite.log artifacts/mobile-stock-mob5d/after-vite.log

      - uses: actions/upload-artifact@v4
        with:
          name: mobile-stock-mob5d-evidence
          path: artifacts/mobile-stock-mob5d
          if-no-files-found: error
          retention-days: 30