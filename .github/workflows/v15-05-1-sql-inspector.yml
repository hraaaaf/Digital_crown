name: V1.5-05.1 SQL Copy Inspector Proof

on:
  pull_request:
    paths:
      - backend/services/legacy_sql_inspector_v15.py
      - backend/tests/test_legacy_sql_inspector_v15.py
      - backend/tests/test_legacy_sql_inspector_v15_security.py
      - docs/quality/V15_05_SQL_MIGRATION_CONTRACT.md
      - .github/workflows/v15-05-1-sql-inspector.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-schema-inspector:
    name: Synthetic read-only SQL inspector
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Verify exact test collection and synthetic isolation
        shell: bash
        run: |
          set -euo pipefail
          test -f backend/services/legacy_sql_inspector_v15.py
          test -f backend/tests/test_legacy_sql_inspector_v15.py
          test -f backend/tests/test_legacy_sql_inspector_v15_security.py
          python -m compileall -q backend/services/legacy_sql_inspector_v15.py backend/tests/test_legacy_sql_inspector_v15*.py
          PYTHONWARNINGS=error::ResourceWarning python -m unittest discover -s backend/tests -p 'test_legacy_sql_inspector_v15*.py' -v 2>&1 | tee /tmp/lot05-inspector-results.txt
          grep -q 'Ran 25 tests' /tmp/lot05-inspector-results.txt
          grep -q '^OK$' /tmp/lot05-inspector-results.txt
          if grep -Ei 'skipped|expected failure' /tmp/lot05-inspector-results.txt; then exit 1; fi
      - name: Exact SHA and honest gate claim
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          {
            echo "LOT05.1 schema-only inspector — exact SHA: $EXPECTED"
            echo "Synthetic 25 unittest cases; no production data, migration, dry-run, mapping or UI."
            echo "Native PostgreSQL dumps and comprehensive MySQL syntax: NOT IMPLEMENTED."
            echo "No shared database schema change, data import or deployment."
          } >> "$GITHUB_STEP_SUMMARY"
