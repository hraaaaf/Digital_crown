name: Clinic P3 Document Signature Certification

on:
  pull_request:
    paths:
      - "backend/routers/document_provenance_p3.py"
      - "backend/services/document_signature_p3.py"
      - "backend/tests/test_document_signature_p3.py"
      - ".github/workflows/clinic-p3-document-signature-cert.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clinic-p3-document-signature-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  signature-contract:
    name: P3 signature exact-bytes fail-closed invariants
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-only-secret-key-minimum-32-characters-long
      DATABASE_URL: "sqlite:///:memory:"
      ENVIRONMENT: development
      TELEMETRY_ENABLED: "false"
      CLOUD_AI_ENABLED: "false"
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Record exact head
        run: |
          HEAD_SHA=$(git rev-parse HEAD)
          EXPECTED_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$HEAD_SHA" = "$EXPECTED_SHA"
          echo "P3_SIGNATURE_HEAD=$HEAD_SHA" >> "$GITHUB_ENV"

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.12.0 torchvision==0.27.0 --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^(torch|torchvision)([<=>].*)?$' requirements.txt > /tmp/requirements-ci.txt
          pip install -r /tmp/requirements-ci.txt
          pip install httpx==0.27.2 pytest pytest-asyncio

      - name: Verify signature governance anchors exist
        run: |
          test -f backend/services/document_signature_p3.py
          test -f backend/tests/test_document_signature_p3.py
          grep -q "Le praticien connecté ne peut signer que ses propres documents" backend/services/document_signature_p3.py
          grep -q "Document sans auteur P3" backend/services/document_signature_p3.py
          grep -q "verify_document_integrity" backend/services/document_signature_p3.py
          grep -q "Authentique • Non signé" backend/services/document_signature_p3.py
          grep -q "test_author_can_sign_exact_active_bytes_once" backend/tests/test_document_signature_p3.py
          grep -q "test_signature_refuses_non_author_and_legacy_unknown_author" backend/tests/test_document_signature_p3.py
          grep -q "test_p3_signature_and_public_verification_routes_are_unique" backend/tests/test_document_signature_p3.py

      - name: Run signature invariant suite
        run: python -m pytest backend/tests/test_document_signature_p3.py -q --maxfail=1

      - name: Certification summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Clinic P3 Document Signature
          - exact head: \`${P3_SIGNATURE_HEAD}\`
          - signer: authenticated active approved author only
          - legacy/unknown author: signing refused
          - non-active document: signing refused
          - physical SHA-256 + size: verified before signature
          - repeated signature: idempotent, timestamp preserved
          - public verification: unsigned != signed; tampered = invalid
          - stable sign and public verification routes: single P3 facade
          EOF
