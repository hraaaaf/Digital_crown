name: FUE-B Header Identity Tests

on:
  pull_request:
    paths:
      - 'frontend/src/components/Header.tsx'
      - 'frontend/src/components/Header.g1Interactive.test.tsx'
      - '.github/workflows/fue-b-header-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  header-identity:
    name: FUE-B Header (7 targeted tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Run Header identity regression tests
        run: npx vitest run src/components/Header.g1Interactive.test.tsx --maxWorkers=1 --fileParallelism=false
