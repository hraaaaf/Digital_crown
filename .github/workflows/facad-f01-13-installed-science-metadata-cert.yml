name: Facad F01.13 145 installed PDF source manifest

on:
  push:
    branches:
      - feat/cephalo-facad-direct-parity-runtime-probe
    paths:
      - .github/workflows/facad-f01-13-installed-science-metadata-cert.yml
      - audit/facad_f01_13_installed_science_manifest_validate.py
      - docs/audits/data/FACAD_314_INSTALLED_SCIENCE_PDF_PROVENANCE_2026-10-09.json
      - docs/audits/CEPHALO_FACAD_F01_13_INSTALLED_MANUALS_SOURCE_ACQUISITION_2026-10-09.md
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  source-provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
      - name: Verify source HEAD
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "EXACT_HEAD=$GITHUB_SHA"
      - name: Download ONLY source metadata from successful Windows CI
        uses: actions/download-artifact@v4
        with:
          name: facad-f01-13-installed-manual-index-e91a25e230258e3a2653df226df73937a5dd4a70
          run-id: 37981554220
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: original-vendor-metadata
      - name: Assert only expected JSON metadata and audited source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          root = Path("original-vendor-metadata")
          files = sorted(x for x in root.rglob("*") if x.is_file())
          print("ARTIFACT_METADATA_FILENAMES=" + ",".join(x.name for x in files))
          required_files = {"installed-manuals-index.json", "installed-manual-status.txt"}
          if not required_files.issubset({x.name for x in files}):
              raise SystemExit("Installed vendor inventory/status artifact missing")
          if any(x.suffix.lower() in {".pdf", ".fcd", ".cph", ".exe"} for x in files):
              raise SystemExit("Unexpected proprietary/clinical binary content in metadata artifact")
          statusfiles = [x for x in files if x.name == "installed-manual-status.txt"]
          if len(statusfiles) != 1:
              raise SystemExit("Ambiguous installed document status")
          # Official Windows PowerShell artifact may be UTF-8 BOM + CRLF.
          status = {line.strip() for line in statusfiles[0].read_text(encoding="utf-8-sig").splitlines()}
          needed = {"NO_PATIENT_READ_OR_EXPORT=true",
                    "FACAD_PROCESS_ABSENT_BEFORE_DOCUMENT_INVENTORY=true",
                    "INSTALLED_DOC_SCAN_COMPLETED=true"}
          if not needed.issubset(status):
              raise SystemExit("Windows installed-document safety flags incomplete: " +
                               ",".join(sorted(needed - status)))
          print("INSTALLED_VENDOR_ARTIFACT_SAFETY_FLAGS_PASS=3")
          PY
      - name: Python offline negatives and 145/75/12 scientific-source proof
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile audit/facad_f01_13_installed_science_manifest_validate.py
          python audit/facad_f01_13_installed_science_manifest_validate.py \
            --manifest docs/audits/data/FACAD_314_INSTALLED_SCIENCE_PDF_PROVENANCE_2026-10-09.json --self-test
          python audit/facad_f01_13_installed_science_manifest_validate.py \
            --inventory original-vendor-metadata/installed-manuals-index.json \
            --manifest docs/audits/data/FACAD_314_INSTALLED_SCIENCE_PDF_PROVENANCE_2026-10-09.json
