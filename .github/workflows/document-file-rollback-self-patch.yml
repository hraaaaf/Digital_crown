name: Financial Document File Rollback Guarded Patch

on:
  push:
    branches: [fix/document-archive-consistency]
    paths:
      - '.github/workflows/document-file-rollback-self-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/document-archive-consistency
          fetch-depth: 0
      - name: Apply guarded file rollback patch
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('backend/routers/documents.py')
          text = p.read_text()

          old = '''    patient = db.query(models.Patient).filter(models.Patient.id == patient_id).first()\n\n    try:\n'''
          new = '''    patient = db.query(models.Patient).filter(models.Patient.id == patient_id).first()\n    replacement_file_backups: list[tuple[pathlib.Path, bytes]] = []\n\n    def _backup_financial_edit_files() -> None:\n        if req.type not in ["honoraires", "note"]:\n            return\n        raw_id = req.data.get("_replace_archive_id") if isinstance(req.data, dict) else None\n        if raw_id in (None, ""):\n            return\n        try:\n            archive_id = int(raw_id)\n        except (TypeError, ValueError):\n            return\n        target = db.query(models.DocumentArchive).filter(\n            models.DocumentArchive.id == archive_id,\n            models.DocumentArchive.patient_id == patient_id,\n        ).first()\n        if target is None:\n            return\n        if target.file_path.startswith("static/archives/") or target.file_path.startswith("static/documents/"):\n            canonical = MEDIA_DIR / target.file_path.replace("static/", "", 1)\n        else:\n            canonical = BASE_DIR / target.file_path\n        candidates = [canonical]\n        if target.created_at:\n            candidates.append(\n                MEDIA_DIR / "documents" / str(target.created_at.year) / f"{target.created_at.month:02d}" / canonical.name\n            )\n        seen = set()\n        for candidate in candidates:\n            resolved = candidate.resolve()\n            if resolved in seen or not resolved.exists():\n                continue\n            seen.add(resolved)\n            replacement_file_backups.append((resolved, resolved.read_bytes()))\n\n    def _restore_financial_edit_files() -> None:\n        for path, content in replacement_file_backups:\n            path.parent.mkdir(parents=True, exist_ok=True)\n            path.write_bytes(content)\n\n    try:\n'''
          if text.count(old) != 1:
              raise SystemExit(f'patient/try marker mismatch: {text.count(old)}')
          text = text.replace(old, new, 1)

          old = '''        if should_archive:\n            with open(pdf_path, "rb") as f: pdf_content = f.read()\n            archive_service = get_archive_service(db)\n'''
          new = '''        if should_archive:\n            with open(pdf_path, "rb") as f: pdf_content = f.read()\n            _backup_financial_edit_files()\n            archive_service = get_archive_service(db)\n'''
          if text.count(old) != 1:
              raise SystemExit(f'archive marker mismatch: {text.count(old)}')
          text = text.replace(old, new, 1)

          old = '''            pdf_path = doc.file_path\n\n            # Étape 2 & 3 : Trésorerie Relationnelle (Ghost Treasury v4.6)\n'''
          new = '''            pdf_path = doc.file_path\n\n            # Le miroir historique éventuel doit évoluer dans le même lot que le\n            # PDF canonique. En cas d'échec comptable, les deux seront restaurés.\n            if req.type in ["honoraires", "note"]:\n                for backup_path, _ in replacement_file_backups[1:]:\n                    backup_path.write_bytes(pdf_content)\n\n            # Étape 2 & 3 : Trésorerie Relationnelle (Ghost Treasury v4.6)\n'''
          if text.count(old) != 1:
              raise SystemExit(f'pdf path marker mismatch: {text.count(old)}')
          text = text.replace(old, new, 1)

          old = '''    except ValueError as e:\n        db.rollback()\n        msg = str(e)\n'''
          new = '''    except ValueError as e:\n        db.rollback()\n        _restore_financial_edit_files()\n        msg = str(e)\n'''
          if text.count(old) != 1:
              raise SystemExit(f'value error marker mismatch: {text.count(old)}')
          text = text.replace(old, new, 1)

          old = '''    except Exception as e:\n        db.rollback()\n        logger.error(f"Erreur Génération : {e}")\n'''
          new = '''    except Exception as e:\n        db.rollback()\n        _restore_financial_edit_files()\n        logger.error(f"Erreur Génération : {e}")\n'''
          if text.count(old) != 1:
              raise SystemExit(f'exception marker mismatch: {text.count(old)}')
          text = text.replace(old, new, 1)

          p.write_text(text)
          PY
          python -m py_compile backend/routers/documents.py
          grep -q '_backup_financial_edit_files()' backend/routers/documents.py
          grep -q '_restore_financial_edit_files()' backend/routers/documents.py
      - name: Commit and remove one-shot workflow
        run: |
          rm .github/workflows/document-file-rollback-self-patch.yml
          git config user.name 'Digital Crown CI'
          git config user.email 'actions@users.noreply.github.com'
          git add backend/routers/documents.py .github/workflows/document-file-rollback-self-patch.yml
          git commit -m 'Rollback edited financial PDFs with database transaction'
          git push origin HEAD:fix/document-archive-consistency
