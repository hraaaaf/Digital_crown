name: LOT05 J11D Source-Pinned FDI Autonomous Annotation Pretriage

on:
  push:
    branches:
      - exp/lot05-j10o-public-panoramic-datasets-research-smoke-20261022
    paths:
      - .github/workflows/lot05-j11d-fdi-autonomous-pretriage.yml
      - experiments/lot05_j11d_fdi_anomaly_autotriage.py
      - experiments/test_lot05_j11d_fdi_anomaly_autotriage.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  text-only-autotriage:
    name: Taxonomy of 31 duplicate FDI groups in 28 academic radiographs
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run nine synthetic anatomy-location and fail-closed tests
        run: python experiments/test_lot05_j11d_fdi_anomaly_autotriage.py -v
      - name: Fetch pinned academic YOLO TXT annotations only; never images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p third_party
          git clone --filter=blob:none --depth=1 --no-checkout \
            https://github.com/melihoz/AKUDENTAL.git third_party/AKUDENTAL
          git -C third_party/AKUDENTAL sparse-checkout set --no-cone \
            '/AKUDENTAL/folds/fold_0/labels/'
          git -C third_party/AKUDENTAL checkout --detach \
            92e2cc3ae5eebc9de509311a3edefb7106fca7dd
          test "$(git -C third_party/AKUDENTAL rev-parse HEAD)" = \
            92e2cc3ae5eebc9de509311a3edefb7106fca7dd
      - name: Autotriage all 333 label files; print ONLY aggregate taxonomy
        shell: bash
        run: |
          set -euo pipefail
          python experiments/lot05_j11d_fdi_anomaly_autotriage.py \
            --labels-dir third_party/AKUDENTAL/AKUDENTAL/folds/fold_0/labels
      - name: Destroy transient university labels, even if failed
        if: always()
        shell: bash
        run: |
          rm -rf third_party/AKUDENTAL
          echo "J11D_TRANSIENT_SOURCE_LABELS_REMOVED_NO_ARTIFACTS"
