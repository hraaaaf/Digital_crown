name: Patient UX1-C Overlay Visual Certification

on:
  pull_request:
    paths:
      - "frontend/src/App.tsx"
      - "frontend/src/components/Header.tsx"
      - "frontend/src/components/Layout/MainLayout.tsx"
      - "frontend/src/components/Layout/patientDossierResponsive.css"
      - "frontend/src/features/patients/**"
      - "frontend/scripts/certify-patient-ux1c-overlays.mjs"
      - "scripts/t2_runtime_server.py"
      - "requirements.txt"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - ".github/workflows/patient-ux1c-overlay-cert.yml"
  workflow_dispatch:

concurrency:
  group: patient-ux1c-overlay-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  visual-certification:
    name: UX1-C CrownBot overlay matrix
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ENVIRONMENT: test
      SECRET_KEY: patient-ux1c-overlay-secret-000001-long-enough
      DATABASE_URL: sqlite:///./t2-runtime-cert.db
      DIGITALCROWN_ISOLATED_RUNTIME: "1"
      DIGITALCROWN_ISOLATION_DB_FINGERPRINT: "c04779c8d18b3ac12a0f4093a47a5d0c3c0e2251714be532893cfa052e9ee780"
      TELEMETRY_ENABLED: 'false'
      CLOUD_AI_ENABLED: 'false'
      DEBUG: 'false'
      ALLOWED_ORIGINS: 'http://127.0.0.1:5173,http://localhost:5173'
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Generate isolated runtime credential
        shell: bash
        run: |
          echo "T2_USER=t2-browser@cabinet.ma" >> "$GITHUB_ENV"
          echo "T2_PASSWORD=$(python -c 'import secrets; print(secrets.token_urlsafe(32))')" >> "$GITHUB_ENV"

      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.12.0 torchvision==0.27.0 --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^(torch|torchvision)([<=>].*)?$' requirements.txt > /tmp/requirements-ux1c.txt
          pip install -r /tmp/requirements-ux1c.txt

      - name: Install frontend and Chromium
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start isolated backend
        run: |
          rm -f t2-runtime-cert.db
          python scripts/t2_runtime_server.py > /tmp/ux1c-backend.log 2>&1 &
          for i in {1..90}; do
            if curl -fsS http://127.0.0.1:8005/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/ux1c-backend.log
          exit 1

      - name: Start frontend
        working-directory: frontend
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 > /tmp/ux1c-frontend.log 2>&1 &
          for i in {1..90}; do
            if curl -fsS http://127.0.0.1:5173 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/ux1c-frontend.log
          exit 1

      - name: Capture UX1-C AFTER 390 / 768 / 1280
        working-directory: frontend
        run: node scripts/certify-patient-ux1c-overlays.mjs

      - name: Dump runtime logs on failure
        if: failure()
        run: |
          echo '===== BACKEND ====='
          cat /tmp/ux1c-backend.log || true
          echo '===== FRONTEND ====='
          cat /tmp/ux1c-frontend.log || true

      - name: Upload UX1-C visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patient-ux1c-overlay-evidence
          path: artifacts/patient-ux1c-overlays
          if-no-files-found: error
          retention-days: 14
