name: Neo N4.3B Procedure Safety Visual Proof

on:
  pull_request:
    paths:
      - 'frontend/src/features/admin/DocumentStudio/Forms/ProcedureSafetyNotice.tsx'
      - 'frontend/src/features/admin/DocumentStudio/Forms/ProcedureSafetyNotice.test.tsx'
      - 'frontend/src/features/admin/DocumentStudio/Forms/PrescriptionAgenticStudioV1.tsx'
      - 'frontend/scripts/certify-neo-n43b-procedure-safety-visual.mjs'
      - 'frontend/scripts/certify-neo-dol-quick-search.mjs'
      - 'backend/services/prescription_procedure_safety.py'
      - 'backend/routers/prescriptions.py'
      - 'backend/routers/patient_clinical_context.py'
      - 'backend/schemas/patient_clinical_context.py'
      - 'alembic/versions/neo000000025_add_procedure_safety_context.py'
      - '.github/workflows/neo-n43b-procedure-safety-visual.yml'
  workflow_dispatch:

jobs:
  visual-proof:
    name: N4.3B real app 390/1280
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ENVIRONMENT: test
      SECRET_KEY: neo-n43b-visual-proof-secret-key-000001
      DATABASE_URL: sqlite:///./neo-n43b-visual-proof.db
      DIGITALCROWN_ISOLATED_RUNTIME: "1"
      DIGITALCROWN_ISOLATION_DB_FINGERPRINT: "c04779c8d18b3ac12a0f4093a47a5d0c3c0e2251714be532893cfa052e9ee780"
      TELEMETRY_ENABLED: 'false'
      CLOUD_AI_ENABLED: 'false'
      DEBUG: 'false'
      ALLOWED_ORIGINS: http://127.0.0.1:5173,http://localhost:5173
      T2_USER: t2-browser@cabinet.ma

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Assert exact product HEAD
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          ACTUAL_HEAD="$(git rev-parse HEAD)"
          echo "expected=$EXPECTED_HEAD"
          echo "actual=$ACTUAL_HEAD"
          test "$ACTUAL_HEAD" = "$EXPECTED_HEAD"

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Generate isolated runtime credential
        shell: bash
        run: python -c 'import secrets; print("T2_PASSWORD=" + secrets.token_urlsafe(24))' >> "$GITHUB_ENV"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.12.0 torchvision==0.27.0 --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^(torch|torchvision)([<=>].*)?$' requirements.txt > /tmp/requirements-neo-n43b.txt
          pip install -r /tmp/requirements-neo-n43b.txt
          pip install httpx==0.27.2

      - name: Install frontend and Playwright Chromium
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.63.0
          npx playwright install --with-deps chromium

      - name: Start isolated backend
        run: |
          python scripts/t2_runtime_server.py > /tmp/neo-n43b-backend.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8005/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/neo-n43b-backend.log
          exit 1

      - name: Start real frontend
        working-directory: frontend
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 > /tmp/neo-n43b-frontend.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:5173 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/neo-n43b-frontend.log
          exit 1

      - name: Capture real N4.3B MRONJ alert evidence
        working-directory: frontend
        run: node scripts/certify-neo-n43b-procedure-safety-visual.mjs

      - name: Capture real DOL quick search evidence
        working-directory: frontend
        run: node scripts/certify-neo-dol-quick-search.mjs

      - name: Dump runtime logs on failure
        if: failure()
        run: |
          echo '===== BACKEND ====='
          cat /tmp/neo-n43b-backend.log || true
          echo '===== FRONTEND ====='
          cat /tmp/neo-n43b-frontend.log || true

      - name: Upload real visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neo-n43b-procedure-safety-real-visual
          path: artifacts/neo-n43b-procedure-safety-visual
          if-no-files-found: error
          retention-days: 14
