name: Cephalo SRPose38 smoke

on:
  push:
    branches:
      - test/cephalo-srpose38-ci
  pull_request:
    branches:
      - refactor/scientific-core-purge
  workflow_dispatch:

permissions:
  contents: read

jobs:
  srpose38-real-ceph-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Digital Crown
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: Fetch candidate, public challenge sample and official GT
        run: |
          git clone --depth 1 https://github.com/5k5000/CLdetection2023.git srpose
          git clone --depth 1 https://github.com/szuboy/CL-Detection2023.git baseline
          git clone --depth 1 https://github.com/cwwang1979/CL-detection2023.git organizer
          test -f baseline/step5_docker_and_upload/test/stack1.mha
          test -f organizer/train-gt.json.zip
          unzip -p organizer/train-gt.json.zip > train-gt.json
          test -s train-gt.json

      - name: Install CPU inference dependencies
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip install torch==2.0.1 torchvision==0.15.2 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==1.26.4 gdown SimpleITK opencv-python-headless==4.11.0.86 mmengine==0.10.7 json_tricks munkres scipy pillow 'xtcocotools>=1.12'
          python -m pip install mmcv==2.0.1 --no-deps -f https://download.openmmlab.com/mmcv/dist/cpu/torch2.0.0/index.html
          python -m pip install -e srpose/mmpose_package/mmpose --no-deps --no-build-isolation

      - name: Download published SRPose checkpoint
        run: |
          mkdir -p srpose/MMPose-checkpoints/CLdetection/srpose_s2
          gdown 'https://drive.google.com/uc?id=10HrNDBBpuECTcgNgcWNUt7kM6m4ZMXM4' -O srpose/MMPose-checkpoints/CLdetection/srpose_s2/demo.pth
          test -s srpose/MMPose-checkpoints/CLdetection/srpose_s2/demo.pth
          sha256sum srpose/MMPose-checkpoints/CLdetection/srpose_s2/demo.pth | tee srpose38-checkpoint.sha256

      - name: Run inference against official 38-point GT
        run: |
          cat > /tmp/srpose38_smoke.py <<'PY'
          import json
          from pathlib import Path
          import cv2
          import numpy as np
          import SimpleITK as sitk
          import torch
          from mmpose.apis import init_model, inference_topdown
          from mmpose.structures import merge_data_samples
          from cldetection_utils import remove_zero_padding

          root = Path.cwd()
          config = root / 'srpose/configs/CLdetection2023/srpose_s2.py'
          checkpoint = root / 'srpose/MMPose-checkpoints/CLdetection/srpose_s2/demo.pth'
          mha = root / 'baseline/step5_docker_and_upload/test/stack1.mha'
          gt_path = root / 'train-gt.json'

          stack = sitk.GetArrayFromImage(sitk.ReadImage(str(mha)))
          print('MHA stack shape:', stack.shape, 'dtype:', stack.dtype)
          image = remove_zero_padding(stack[0])
          print('After official remove_zero_padding:', image.shape)
          if image.shape[:2] != (2400, 1935):
              raise AssertionError(f'Unexpected unpadded image shape: {image.shape}')

          gt_all = json.loads(gt_path.read_text(encoding='utf-8'))
          gt_items = [p for p in gt_all['points'] if int(p['point'][2]) == 1]
          gt_items.sort(key=lambda p: int(p['name']))
          if len(gt_items) != 38:
              raise AssertionError(f'Expected 38 official GT landmarks for image 1, got {len(gt_items)}')
          if [int(p['name']) for p in gt_items] != list(range(1, 39)):
              raise AssertionError('Official GT landmark numbering is not exactly 1..38')

          gt = np.asarray([[float(p['point'][0]), float(p['point'][1])] for p in gt_items], dtype=float)
          scales = {float(p['scale']) for p in gt_items}
          if len(scales) != 1:
              raise AssertionError(f'Inconsistent GT scale for image 1: {scales}')
          scale = scales.pop()

          # Identity guard from organizer README example for image 1.
          if not np.array_equal(gt[0], [835.0, 996.0]) or not np.array_equal(gt[1], [1473.0, 1029.0]):
              raise AssertionError(f'Unexpected image-1 GT identity: first points={gt[:2].tolist()}')

          model = init_model(str(config), str(checkpoint), device='cpu')
          model.eval()
          with torch.no_grad():
              predictions = inference_topdown(model=model, img=image, bboxes=None, bbox_format='xyxy')
              merged = merge_data_samples(predictions)
              points = np.asarray(merged.pred_instances.keypoints[0], dtype=float)

          if points.shape != (38, 2):
              raise AssertionError(f'Expected (38,2), got {points.shape}')
          if not np.isfinite(points).all():
              raise AssertionError('Non-finite coordinates returned')

          err_px = np.linalg.norm(points - gt, axis=1)
          err_mm = err_px * scale
          mre = float(np.mean(err_mm))
          med = float(np.median(err_mm))
          sdr = {str(t): float(np.mean(err_mm <= t)) for t in (2.0, 2.5, 3.0, 4.0)}

          per_point = []
          for i in range(38):
              per_point.append({
                  'index': i + 1,
                  'pred_x': round(float(points[i, 0]), 3),
                  'pred_y': round(float(points[i, 1]), 3),
                  'gt_x': float(gt[i, 0]),
                  'gt_y': float(gt[i, 1]),
                  'error_mm': round(float(err_mm[i]), 3),
              })

          metrics = {
              'checkpoint_sha256': 'fb1a781ac1c83149b379cb15724e3b0fae06ba2d567978f35c61e9d06b46fdcc',
              'image': 'public CL-Detection stack1.mha slice 1 after official zero-padding removal',
              'ground_truth': 'cwwang1979/CL-detection2023 train-gt.json.zip image z=1',
              'evaluated_landmarks': 38,
              'scale_mm_per_pixel': scale,
              'mre_mm': round(mre, 4),
              'median_error_mm': round(med, 4),
              'max_error_mm': round(float(np.max(err_mm)), 4),
              'sdr': {k: round(v, 6) for k, v in sdr.items()},
              'worst_landmarks': sorted(per_point, key=lambda x: x['error_mm'], reverse=True)[:10],
              'per_landmark': per_point,
          }
          Path('srpose38-official38-metrics.json').write_text(json.dumps(metrics, indent=2), encoding='utf-8')
          Path('srpose38-coordinates.json').write_text(json.dumps([
              {'index': i + 1, 'x': round(float(x), 3), 'y': round(float(y), 3)}
              for i, (x, y) in enumerate(points)
          ], indent=2), encoding='utf-8')
          Path('srpose38-official38-gt.json').write_text(json.dumps([
              {'index': i + 1, 'x': float(x), 'y': float(y), 'scale': scale}
              for i, (x, y) in enumerate(gt)
          ], indent=2), encoding='utf-8')

          overlay = image.copy()
          for i, ((px, py), (gx, gy)) in enumerate(zip(points, gt), start=1):
              p = (int(round(px)), int(round(py)))
              g = (int(round(gx)), int(round(gy)))
              cv2.line(overlay, g, p, (255, 255, 0), 1)
              cv2.circle(overlay, g, 7, (0, 0, 255), 2)
              cv2.circle(overlay, p, 5, (0, 255, 0), -1)
              cv2.putText(overlay, str(i), (p[0] + 7, p[1] - 7), cv2.FONT_HERSHEY_SIMPLEX, 0.45, (0, 255, 0), 1, cv2.LINE_AA)
          cv2.imwrite('srpose38-real-ceph-official38-vs-pred.png', overlay)
          cv2.imwrite('srpose38-real-ceph-input-unpadded.png', image)

          print(f'SRPOSE38_OFFICIAL38_OK MRE={mre:.4f}mm MEDIAN={med:.4f}mm MAX={np.max(err_mm):.4f}mm SDR2={sdr["2.0"]:.4f} SDR2.5={sdr["2.5"]:.4f} SDR3={sdr["3.0"]:.4f} SDR4={sdr["4.0"]:.4f}')
          print('WORST:', json.dumps(metrics['worst_landmarks']))
          PY
          PYTHONPATH="$PWD/srpose:$PWD/srpose/mmpose_package/mmpose" python /tmp/srpose38_smoke.py | tee srpose38-smoke.log
          grep -q 'SRPOSE38_OFFICIAL38_OK' srpose38-smoke.log

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cephalo-srpose38-real-ceph-evidence
          if-no-files-found: warn
          path: |
            srpose38-checkpoint.sha256
            srpose38-smoke.log
            srpose38-coordinates.json
            srpose38-official38-gt.json
            srpose38-official38-metrics.json
            srpose38-real-ceph-input-unpadded.png
            srpose38-real-ceph-official38-vs-pred.png
