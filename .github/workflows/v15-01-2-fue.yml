name: V1.5-01.2 Annex First Connection FUE-I

on:
  pull_request:
    branches: [master]
    paths:
      - "frontend/scripts/audit-v15-01-2-annex-first-use.mjs"
      - ".github/workflows/v15-01-2-fue.yml"
      - "frontend/src/features/hub/ControlCenterTopologyPanel.tsx"
      - "frontend/src/pages/LoginPage.tsx"
      - "frontend/src/services/apiBase.ts"
      - "frontend/src/services/auth.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  annex-first-use:
    name: Annex PC — isolated browser + backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ENVIRONMENT: test
      SECRET_KEY: fue-v15-01-2-synthetic-only-not-production
      DATABASE_URL: sqlite:///./t2-runtime-cert.db
      DIGITALCROWN_ISOLATED_RUNTIME: "1"
      DIGITALCROWN_ISOLATION_DB_FINGERPRINT: "c04779c8d18b3ac12a0f4093a47a5d0c3c0e2251714be532893cfa052e9ee780"
      TELEMETRY_ENABLED: "false"
      CLOUD_AI_ENABLED: "false"
      DEBUG: "false"
      ALLOWED_ORIGINS: "http://127.0.0.1:5173,http://localhost:5173"
      T2_USER: t2-browser@cabinet.ma
      PRODUCT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PRODUCT_HEAD }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Generate ephemeral lab credential
        run: python -c 'import secrets; print("T2_PASSWORD=" + secrets.token_urlsafe(24))' >> "$GITHUB_ENV"

      - name: Install backend (isolated)
        run: |
          python -m pip install --upgrade pip
          grep -vE '^(torch|torchvision|torchaudio)([<=>].*)?$' requirements.txt >/tmp/requirements-fue-v15-01-2.txt
          pip install torch==2.10.0 torchvision==0.25.0 torchaudio==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r /tmp/requirements-fue-v15-01-2.txt
          python -m pip check

      - name: Install and build frontend for backend SPA serving
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
          npm run build
          test -f dist/index.html

      - name: Start isolated backend with synthetic fixtures
        run: |
          rm -f t2-runtime-cert.db
          python scripts/t2_runtime_server.py >/tmp/fue-01-2-backend.log 2>&1 &
          for i in {1..60}; do
            curl -fsS http://127.0.0.1:8005/health >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/fue-01-2-backend.log
          exit 1

      - name: Confirm backend serves a fresh SPA on alternate loopback origin
        run: |
          curl -fsS http://localhost:8005/control-center | grep -q '<html'
          curl -fsS http://127.0.0.1:8005/api/health/topology > /dev/null

      - name: Start Vite origin
        working-directory: frontend
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 >/tmp/fue-01-2-frontend.log 2>&1 &
          for i in {1..60}; do
            curl -fsS http://127.0.0.1:5173 >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/fue-01-2-frontend.log
          exit 1

      - name: Run real browser annex FUE-I
        working-directory: frontend
        run: node scripts/run-with-t2-workstation.mjs scripts/audit-v15-01-2-annex-first-use.mjs

      - name: CI backend/frontend logs on failure
        if: failure()
        run: |
          tail -n 120 /tmp/fue-01-2-backend.log || true
          tail -n 120 /tmp/fue-01-2-frontend.log || true

      - name: Publish all screenshots and structured evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fue-v15-01-2-annex-evidence
          path: artifacts/fue-v15-01-2
          if-no-files-found: error
          retention-days: 14
