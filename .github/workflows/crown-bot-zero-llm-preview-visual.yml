name: Crown Bot ZERO-LLM Preview Visual (experimental)

on:
  pull_request:
    paths:
      - frontend/src/components/CrownBot/CrownBotChat.tsx
      - frontend/src/components/CrownBot/CrownBotWorkflowPreview.tsx
      - frontend/scripts/certify-crownbot-zero-llm-preview.mjs
      - .github/workflows/crown-bot-zero-llm-preview-visual.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-preview:
    name: Synthetic preview UI 390 / 430 / 1280
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ENVIRONMENT: test
      SECRET_KEY: crown-bot-visual-only-secret-000001-long-enough
      DATABASE_URL: sqlite:///./t2-runtime-cert.db
      DIGITALCROWN_ISOLATED_RUNTIME: '1'
      DIGITALCROWN_ISOLATION_DB_FINGERPRINT: c04779c8d18b3ac12a0f4093a47a5d0c3c0e2251714be532893cfa052e9ee780
      TELEMETRY_ENABLED: 'false'
      CLOUD_AI_ENABLED: 'false'
      DEBUG: 'false'
      ALLOWED_ORIGINS: 'http://127.0.0.1:5173,http://localhost:5173'
      CROWN_BOT_DETERMINISTIC_WORKFLOWS_ENABLED: 'true'
      VITE_CROWN_BOT_WORKFLOW_PREVIEW_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Seed isolated synthetic cabinet credentials
        shell: bash
        run: |
          echo "T2_USER=t2-browser@cabinet.ma" >> "$GITHUB_ENV"
          echo "T2_PASSWORD=$(python -c 'import secrets; print(secrets.token_urlsafe(32))')" >> "$GITHUB_ENV"
      - name: Install isolated backend runtime
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.10.0 torchvision==0.25.0 torchaudio==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^(torch|torchvision|torchaudio)' requirements.txt > /tmp/cb-visual-requirements.txt
          pip install -r /tmp/cb-visual-requirements.txt
      - name: Install frontend + Chromium
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start synthetic backend
        run: |
          rm -f t2-runtime-cert.db
          python scripts/t2_runtime_server.py > /tmp/crown-bot-visual-backend.log 2>&1 &
          for i in {1..90}; do
            if curl -fsS http://127.0.0.1:8005/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/crown-bot-visual-backend.log
          exit 1
      - name: Start frontend with preview-only local opt-in
        working-directory: frontend
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 > /tmp/crown-bot-visual-frontend.log 2>&1 &
          for i in {1..90}; do
            if curl -fsS http://127.0.0.1:5173 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/crown-bot-visual-frontend.log
          exit 1
      - name: Verify non-executable preview and capture same-viewport BEFORE/AFTER
        working-directory: frontend
        run: node scripts/run-with-t2-workstation.mjs scripts/certify-crownbot-zero-llm-preview.mjs
      - name: Print debug logs on failure
        if: failure()
        run: |
          cat /tmp/crown-bot-visual-backend.log || true
          cat /tmp/crown-bot-visual-frontend.log || true
      - name: Upload screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crown-bot-zero-llm-preview-visual
          path: artifacts/crown-bot-zero-llm-preview
          if-no-files-found: warn
          retention-days: 14
