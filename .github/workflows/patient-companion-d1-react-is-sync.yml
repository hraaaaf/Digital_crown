name: Patient Companion D1 react-is sync

on:
  push:
    branches:
      - feat/patient-companion-d1-ui
    paths:
      - '.github/workflows/patient-companion-d1-react-is-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/patient-companion-d1-ui
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Add exact Recharts runtime peer
        working-directory: frontend
        run: npm install --package-lock-only --save-exact react-is@19.2.0
      - name: Verify exact dependency contract
        run: |
          node - <<'NODE'
          const pkg = require('./frontend/package.json');
          const lock = require('./frontend/package-lock.json');
          if (pkg.dependencies['react-is'] !== '19.2.0') throw new Error('react-is manifest pin missing');
          if (lock.packages[''].dependencies['react-is'] !== '19.2.0') throw new Error('react-is lock pin missing');
          if (pkg.dependencies.firebase !== '12.19.0') throw new Error('Firebase manifest pin changed');
          if (pkg.devDependencies['@testing-library/dom'] !== '10.4.1') throw new Error('Testing Library DOM manifest pin changed');
          NODE
      - name: Commit manifest and lockfile only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package.json frontend/package-lock.json
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "fix(frontend): declare react-is runtime dependency"
          git push origin HEAD:feat/patient-companion-d1-ui
