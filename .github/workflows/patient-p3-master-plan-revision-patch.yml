            "patient_id": row.patient_id,
            "revision": row.revision,
            "steps_snapshot": row.steps_snapshot,
            "updated_by": row.updated_by,
            "updated_by_name": authors.get(row.updated_by),
            "created_at": row.created_at,
        }
        for row in rows
