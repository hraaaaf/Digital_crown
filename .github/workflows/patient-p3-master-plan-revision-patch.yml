@router.put("/{patient_id}/master-plan", response_model=schemas.TreatmentMasterPlanOut)
def update_master_plan(patient_id: int, steps: List[schemas.TreatmentPlanStepCreate], db: Session = Depends(database.get_db), current_user: models.User = Depends(require_permission("clinical"))):
    assert_patient_access(patient_id, current_user, db)
    from backend.models_clinical_p3 import TreatmentMasterPlanRevision

    plan = db.query(models.TreatmentMasterPlan).filter(models.TreatmentMasterPlan.patient_id == patient_id).first()
    if not plan:
        plan = models.TreatmentMasterPlan(patient_id=patient_id)
        db.add(plan)
        db.flush()
    else:
        db.query(models.TreatmentPlanStep).filter(models.TreatmentPlanStep.plan_id == plan.id).delete()

    snapshot = []
    for i, step_data in enumerate(steps):
        step = models.TreatmentPlanStep(
            plan_id=plan.id,
            title=step_data.title,
            assistant=step_data.assistant,
            status=step_data.status,
            date_str=step_data.date_str,
            order_index=i
        )
        db.add(step)
        snapshot.append({
            "title": step_data.title,
            "assistant": step_data.assistant,
            "status": step_data.status,
            "date_str": step_data.date_str,
            "order_index": i,
        })

    latest_revision = (
        db.query(func.max(TreatmentMasterPlanRevision.revision))
        .filter(TreatmentMasterPlanRevision.plan_id == plan.id)
        .scalar()
        or 0
    )
    revision_number = int(latest_revision) + 1
    db.add(TreatmentMasterPlanRevision(
        plan_id=plan.id,
        patient_id=patient_id,
        revision=revision_number,
        steps_snapshot=snapshot,
        updated_by=current_user.id,
    ))
    plan.updated_at = datetime.now()

    audit_service.log(
        db=db,
        user_id=current_user.id,
        employer_id=current_user.get_employer_id(),
        action="UPDATE",
        resource_type="TreatmentMasterPlan",
        resource_id=str(plan.id),
        details=f"patient_id={patient_id} revision={revision_number} steps={len(snapshot)}",
    )

    db.commit()
    db.refresh(plan)
    return plan
'''
