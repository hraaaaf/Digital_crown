name: CEPH A4 V1 Practitioner Approval Synthetic JWT SQLite E2E (NO DEPLOY)
on:
  pull_request:
    paths:
      - .github/workflows/ceph-a4-v1-practitioner-approval-e2e.yml
      - backend/services/cephalo_a4_approval_v1.py
      - backend/services/generators/cephalo_four_part_report.py
      - backend/services/document_factory.py
      - backend/routers/patients.py
      - backend/tests/test_ceph_a4_descriptive_approval_v1.py
      - frontend/src/features/ortho/components/CephaloA4ApprovalV1.tsx
      - frontend/src/features/ortho/components/CephaloA4ApprovalV1.test.tsx
      - .github/workflows/ceph-odf-gui-sqlite-e2e.yml
      - frontend/src/features/ortho/components/Step4Documents.tsx
      - docs/audits/CEPH_BILAN_A4_DESCRIPTIF_SIGNATURE_20261112.md
permissions:
  contents: read
concurrency:
  group: ceph-a4-practitioner-approval-v1-${{ github.ref }}
  cancel-in-progress: true
jobs:
  a4-descriptive-approval-jwt-sqlite:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ENVIRONMENT: test
      DIGITALCROWN_ISOLATED_RUNTIME: '1'
      DATABASE_URL: sqlite:///:memory:
      CLOUD_AI_ENABLED: 'false'
      TELEMETRY_ENABLED: 'false'
      PRODUCT_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Exact head and bounded S2B sources
        shell: python
        run: |
          import os,subprocess
          def git(*args): return subprocess.check_output(['git',*args], text=True).strip()
          assert git('rev-parse','HEAD') == os.environ['PRODUCT_HEAD']
          base='d8b7f47627dd9f0a55364c14320c329bcaa9f9d3'
          changed=set(git('diff','--name-only',base,'HEAD').splitlines())
          expected={
            '.github/workflows/ceph-a4-v1-practitioner-approval-e2e.yml',
            'backend/services/cephalo_a4_approval_v1.py',
            'backend/services/generators/cephalo_four_part_report.py',
            'backend/services/document_factory.py',
            'backend/routers/patients.py',
            'backend/tests/test_ceph_a4_descriptive_approval_v1.py',
            'frontend/src/features/ortho/components/CephaloA4ApprovalV1.tsx',
            'frontend/src/features/ortho/components/CephaloA4ApprovalV1.test.tsx',
            '.github/workflows/ceph-odf-gui-sqlite-e2e.yml',
            'frontend/src/features/ortho/components/Step4Documents.tsx',
            'docs/audits/CEPH_BILAN_A4_DESCRIPTIF_SIGNATURE_20261112.md',
          }
          assert changed==expected,(sorted(changed),sorted(expected))
          print('CEPH_A4_S2B_EXACT_SCOPE_PASS_NO_DEPLOY')
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install isolated backend dependencies without model inference
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.10.0 torchvision==0.25.0 torchaudio==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^(torch|torchvision|torchaudio)([<=>].*)?$' requirements.txt > /tmp/ceph-a4-s2b-req.txt
          python -m pip install -r /tmp/ceph-a4-s2b-req.txt
          python -m pip check
      - name: Authenticated exact PDF prep/approval and archive SHA checks
        shell: bash
        run: |
          python -m pytest -q backend/tests/test_ceph_a4_descriptive_approval_v1.py
          echo CEPH_A4_S2B_JWT_SQLITE_APPROVAL_AND_REPLAY_SYNTHETIC_PASS
      - name: Existing unsigned archive and historical safety regressions
        run: |
          python -m pytest -q backend/tests/test_cephalo_unsigned_archive_entrypoints_contract.py backend/tests/test_cephalo_p2ter_atomic_archive.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Locked frontend typecheck and Step4 UI interactions
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx tsc -p tsconfig.app.json --noEmit
          npx vitest run src/features/ortho/components/Step4Documents.g4Interactive.test.tsx src/features/ortho/components/CephaloA4ApprovalV1.test.tsx
      - name: Cleanup and zero deployment
        if: always()
        run: |
          rm -f /tmp/ceph-a4-s2b-req.txt
          echo CEPH_A4_S2B_SYNTHETIC_ARTIFACT_CLEANUP_NO_DEPLOY
