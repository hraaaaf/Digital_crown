name: Patient P0-D Routine Responsive Cert

on:
  push:
    branches:
      - agent/patient-page-p0-truth-safety
    paths:
      - .github/workflows/patient-p0d-routine-responsive-cert.yml
      - frontend/src/features/patients/PatientDetailsInner.tsx
      - frontend/src/features/patients/components/ClinicalHub.tsx
      - frontend/src/features/patients/components/wizards/AssistantExamenComplet.tsx
      - frontend/scripts/capture-patient-p0d-routine-after.mjs
      - scripts/t2_runtime_server.py
  workflow_dispatch:

concurrency:
  group: patient-p0d-routine-responsive-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      ENVIRONMENT: test
      SECRET_KEY: patient-p0d-responsive-secret-000001
      DATABASE_URL: sqlite:///./t2-runtime-cert.db
      TELEMETRY_ENABLED: "false"
      CLOUD_AI_ENABLED: "false"
      DEBUG: "false"
      ALLOWED_ORIGINS: "http://127.0.0.1:5173,http://localhost:5173"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Patch ClinicalHub mobile result layout
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('frontend/src/features/patients/components/ClinicalHub.tsx')
          text = path.read_text()

          replacements = [
              (
                  'className="w-full flex flex-col gap-6 p-6 bg-white/40 dark:bg-slate-900/40 rounded-[2.5rem] border border-white/60 dark:border-slate-800/50 backdrop-blur-xl shadow-elite min-h-[80vh] relative overflow-hidden"',
                  'className="w-full min-w-0 flex flex-col gap-4 p-3 sm:gap-6 sm:p-6 bg-white/40 dark:bg-slate-900/40 rounded-[1.75rem] sm:rounded-[2.5rem] border border-white/60 dark:border-slate-800/50 backdrop-blur-xl shadow-elite min-h-[80vh] relative overflow-hidden"'
              ),
              (
                  '<div className="mb-6 p-4 bg-indigo-50 border border-indigo-200 rounded-2xl flex items-start justify-between gap-4">\n                  <div className="flex items-start gap-3 flex-1">\n                    <div className="w-10 h-10 bg-indigo-500/20 text-indigo-600 rounded-full flex items-center justify-center shrink-0 mt-0.5">\n                      <Sparkles size={18} />\n                    </div>\n                    <div className="flex-1 min-w-0">\n                      <h4 className="text-sm font-black text-indigo-900">Proposition clinique à valider — {lastDiagnosis.wizard}</h4>\n                      <p className="text-xs text-indigo-700 font-bold mt-1 leading-relaxed break-words">{lastDiagnosis.text}</p>\n                      <p className="text-[10px] text-indigo-600/70 font-mono mt-2">{lastDiagnosis.date}</p>\n                    </div>\n                  </div>\n                  <button\n                    onClick={clearLastDiagnosis}\n                    className="text-indigo-400 hover:text-indigo-600 transition-colors p-1 shrink-0"\n                  >\n                    <Trash2 size={16} />\n                  </button>\n                </div>',
                  '<div className="mb-6 scroll-mt-48 sm:scroll-mt-40 p-3 sm:p-4 bg-indigo-50 border border-indigo-200 rounded-2xl flex items-start gap-2 sm:gap-4 relative">\n                  <div className="flex min-w-0 items-start gap-2 sm:gap-3 flex-1">\n                    <div className="hidden sm:flex w-10 h-10 bg-indigo-500/20 text-indigo-600 rounded-full items-center justify-center shrink-0 mt-0.5">\n                      <Sparkles size={18} />\n                    </div>\n                    <div className="flex-1 min-w-0 pr-7 sm:pr-0">\n                      <h4 className="text-xs sm:text-sm font-black text-indigo-900 leading-snug">Proposition clinique à valider — {lastDiagnosis.wizard}</h4>\n                      <p className="text-[11px] sm:text-xs text-indigo-700 font-bold mt-1 leading-relaxed break-words">{lastDiagnosis.text}</p>\n                      <p className="text-[10px] text-indigo-600/70 font-mono mt-2">{lastDiagnosis.date}</p>\n                    </div>\n                  </div>\n                  <button\n                    onClick={clearLastDiagnosis}\n                    className="absolute right-2.5 top-2.5 sm:static text-indigo-400 hover:text-indigo-600 transition-colors p-1 shrink-0"\n                  >\n                    <Trash2 size={16} />\n                  </button>\n                </div>'
              ),
              (
                  'className="mt-2 p-8 bg-card-bg border border-primary/30 rounded-[2.5rem] shadow-2xl relative overflow-hidden"',
                  'className="mt-2 p-4 sm:p-8 bg-card-bg border border-primary/30 rounded-[1.75rem] sm:rounded-[2.5rem] shadow-2xl relative overflow-hidden"'
              ),
          ]

          changed = False
          for old, new in replacements:
              if old in text:
                  text = text.replace(old, new, 1)
                  changed = True
              elif new not in text:
                  raise SystemExit(f'Expected ClinicalHub fragment not found: {old[:100]}')

          if changed:
              path.write_text(text)
          PY

      - name: Patch capture scroll below sticky header
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('frontend/scripts/capture-patient-p0d-routine-after.mjs')
          text = path.read_text()
          old = """  await focus.scrollIntoViewIfNeeded();\n  await page.waitForTimeout(150);"""
          new = """  await focus.evaluate((el) => {\n    const header = document.querySelector('header');\n    const headerBottom = header ? header.getBoundingClientRect().bottom : 0;\n    const targetTop = el.getBoundingClientRect().top + window.scrollY;\n    window.scrollTo({ top: Math.max(0, targetTop - headerBottom - 24), behavior: 'instant' });\n  });\n  await page.waitForTimeout(150);"""
          if old in text:
              path.write_text(text.replace(old, new, 1))
          elif new not in text:
              raise SystemExit('Expected capture scroll fragment not found')
          PY

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.12.0 torchvision==0.27.0 --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^(torch|torchvision)([<=>].*)?$' requirements.txt > /tmp/requirements-p0d-responsive.txt
          pip install -r /tmp/requirements-p0d-responsive.txt
          pip install httpx==0.27.2
      - name: Install frontend and Chromium
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Start isolated backend
        run: |
          python scripts/t2_runtime_server.py > /tmp/p0d-responsive-backend.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8005/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/p0d-responsive-backend.log
          exit 1
      - name: Start frontend
        working-directory: frontend
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 > /tmp/p0d-responsive-frontend.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:5173 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/p0d-responsive-frontend.log
          exit 1
      - name: Capture Routine responsive evidence
        working-directory: frontend
        run: |
          set -euo pipefail
          rm -rf ../artifacts/patient-p0d-routine-after
          node scripts/capture-patient-p0d-routine-after.mjs 2>&1 | tee /tmp/p0d-responsive-runner.log
          test -f ../artifacts/patient-p0d-routine-after/summary.json
          test -f ../artifacts/patient-p0d-routine-after/evidence.json
          test "$(find ../artifacts/patient-p0d-routine-after -maxdepth 1 -name '*.png' | wc -l)" -eq 8
          cp /tmp/p0d-responsive-runner.log ../artifacts/patient-p0d-routine-after/runner.log
      - name: Upload Routine responsive evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patient-p0d-routine-responsive-after
          path: artifacts/patient-p0d-routine-after
          if-no-files-found: error
          retention-days: 14
      - name: Commit certified ClinicalHub mobile patch
        run: |
          if git diff --quiet -- frontend/src/features/patients/components/ClinicalHub.tsx; then
            echo "ClinicalHub already contains certified mobile layout."
            exit 0
          fi
          git add frontend/src/features/patients/components/ClinicalHub.tsx
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(patient): make clinical proposal readable on mobile"
          git push origin HEAD:agent/patient-page-p0-truth-safety
