name: Mobile Marketplace MOB-5G Cert

on:
  pull_request:
    paths:
      - "frontend/src/features/partnerMarketplace/**"
      - "frontend/src/features/mobile/Dashboard/views/MarketplaceView*"
      - "frontend/src/features/mobile/Dashboard/MobileDashboard.tsx"
      - "frontend/src/features/mobile/Dashboard/MobilePreviewDashboard.tsx"
      - "frontend/src/features/mobile/Dashboard/components/MobileBottomNav*"
      - "frontend/src/features/mobile/Dashboard/types.tsx"
      - "frontend/src/features/mobile/bridge*"
      - "frontend/src/pages/PartnerMarketplacePage.tsx"
      - "frontend/scripts/capture-mobile-marketplace-mob5g.mjs"
      - "docs/ux/DIGITAL_CROWN_MOBILE_MARKETPLACE_MOB5G_GOAL_UI.md"
      - ".github/workflows/mobile-marketplace-mob5g-cert.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-marketplace-mob5g-cert-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-contract:
    name: Marketplace shared/mobile contracts + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout exact candidate HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Prove exact candidate HEAD
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Setup Node 20
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend
        run: npm ci

      - name: Run targeted MOB-5G contracts
        run: |
          npm test -- \
            src/features/partnerMarketplace/data.test.ts \
            src/features/partnerMarketplace/usePartnerMarketplace.test.tsx \
            src/features/mobile/Dashboard/views/MarketplaceView.test.tsx \
            src/features/mobile/Dashboard/components/MobileBottomNav.test.tsx \
            src/features/mobile/bridge.m5a.test.ts

      - name: Build production frontend
        run: npm run build

  visual-certification:
    name: Marketplace AFTER 390/430/768/1280
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Record exact candidate HEAD
        run: |
          PRODUCT_HEAD=$(git rev-parse HEAD)
          test "$PRODUCT_HEAD" = "${{ github.event.pull_request.head.sha || github.sha }}"
          echo "PRODUCT_HEAD=$PRODUCT_HEAD" >> "$GITHUB_ENV"

      - name: Setup Node 20
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend and Chromium
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.62.1
          npx playwright install --with-deps chromium

      - name: Capture exact AFTER
        working-directory: frontend
        env:
          PRODUCT_HEAD: ${{ env.PRODUCT_HEAD }}
          VITE_DC_PREVIEW_DEMO: "1"
        run: node scripts/capture-mobile-marketplace-mob5g.mjs

      - name: Assert artifact contract
        working-directory: frontend
        env:
          PRODUCT_HEAD: ${{ env.PRODUCT_HEAD }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const report = JSON.parse(readFileSync('mobile-marketplace-mob5g-artifacts/report.json', 'utf8'));
          if (report.productHead !== process.env.PRODUCT_HEAD) throw new Error('MOB-5G candidate HEAD mismatch');
          if (report.baselineBefore !== '062eadf1afc6ffc241be8420313e065a35f7d95b') throw new Error('MOB-5G BEFORE baseline mismatch');
          if (report.beforeArtifactId !== 9992935589) throw new Error('MOB-5G BEFORE artifact mismatch');
          if (report.mobile.length !== 3) throw new Error(`Expected 3 mobile AFTER captures, got ${report.mobile.length}`);
          if (report.mobileInvalidCount !== 0) throw new Error(`Invalid mobile captures: ${report.mobileInvalidCount}`);
          if (report.desktopInvalid) throw new Error('Desktop AFTER contract failed');
          NODE

      - name: Upload MOB-5G evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-marketplace-mob5g-evidence
          path: frontend/mobile-marketplace-mob5g-artifacts/
          if-no-files-found: error
          retention-days: 30
