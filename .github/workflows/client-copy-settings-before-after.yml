name: Client Copy Settings BEFORE AFTER

on:
  pull_request:
    branches: [master]
    paths:
      - 'frontend/src/features/admin/Settings/**'
      - '.github/workflows/client-copy-settings-before-after.yml'

permissions:
  contents: read

jobs:
  visual-proof:
    name: Settings ${{ matrix.state }} 390/430/768/1280
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - state: before
            ref: ${{ github.event.pull_request.base.sha }}
          - state: after
            ref: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend and Chromium
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install chromium

      - name: Capture Settings copy proof
        working-directory: frontend
        env:
          PROOF_STATE: ${{ matrix.state }}
          PROOF_SHA: ${{ matrix.ref }}
        run: |
          cat > client-copy-settings-proof.mjs <<'JS'
          import fs from 'node:fs/promises';
          import path from 'node:path';
          import { chromium } from 'playwright';
          import { createServer } from 'vite';

          const state = process.env.PROOF_STATE;
          const sha = process.env.PROOF_SHA;
          const out = path.resolve(`../artifacts/client-copy-settings-${state}`);
          await fs.mkdir(out, { recursive: true });

          await fs.writeFile('client-copy-settings.html', `<!doctype html><html lang="fr"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><link rel="icon" href="data:,"/></head><body><div id="root"></div><script type="module" src="/src/client-copy-settings.tsx"></script></body></html>`);
          await fs.writeFile('src/client-copy-settings.tsx', `
            import React from 'react';
            import { createRoot } from 'react-dom/client';
            import { MemoryRouter } from 'react-router-dom';
            import './index.css';
            import Settings from './pages/Settings';
            import { useAuthStore } from './stores/useAuthStore';
            useAuthStore.setState({
              user: { id: 1, email: 'admin@copy-proof.local', nom_complet: 'Dr Copy Proof', role: 'ADMIN', is_superadmin: false, permissions: {} } as any,
              isAuthenticated: true, isLoading: false, error: null,
            });
            createRoot(document.getElementById('root')!).render(<MemoryRouter initialEntries={['/settings']}><Settings /></MemoryRouter>);
          `);

          const profile = {
            id:1, public_id:'copy-proof', nom_cabinet:'Cabinet Copy Proof', nom_praticien:'Dr Copy Proof', nom_praticien_ar:'',
            footer_address:'Rabat, Maroc', footer_phones:'05 37 00 00 00', inpe:'123456789', ice:'001234567890123', if_:'12345678',
            primary_color:'#003380', secondary_color:'#1e40af', accent_color:'#60a5fa', selected_theme:'elite', font_fr:'inter', selected_template:'swiss',
            header_lines_fr:['Dr Copy Proof','Chirurgien Dentiste'], header_lines_ar:[], specialty_ids:[], contacts_json:{}, margin_top:3.6, margin_bottom:3.2,
            watermark_enabled:true, use_letterhead:false, qr_code_enabled:false, qr_code_type:'VCARD', qr_code_style:'dots', show_patient_badges:true,
            performance_mode:false, clinical_tips_enabled:true, hide_header:true, hide_footer:true, cabinet_type:'PRIVE'
          };
          const json = (body, status=200) => ({ status, contentType:'application/json', body:JSON.stringify(body) });
          const server = await createServer({ server:{ host:'127.0.0.1', port:4179, strictPort:true }, clearScreen:false });
          await server.listen();
          const browser = await chromium.launch({ headless:true });
          const viewports = [
            { width:390, height:844, label:'390x844' },
            { width:430, height:932, label:'430x932' },
            { width:768, height:1024, label:'768x1024' },
            { width:1280, height:900, label:'1280x900' },
          ];
          const results = [];
          try {
            for (const mode of ['success','error']) {
              for (const viewport of viewports) {
                const context = await browser.newContext({ viewport, colorScheme:'light' });
                const page = await context.newPage();
                const pageErrors = [];
                page.on('pageerror', e => pageErrors.push(String(e)));
                await page.route('**/*', async route => {
                  const req = route.request();
                  const url = new URL(req.url());
                  if (url.port !== '8005' || !url.pathname.startsWith('/api/')) return route.continue();
                  if (url.pathname === '/api/clinics/me') {
                    return route.fulfill(mode === 'error' ? json({detail:'unavailable'},503) : json(profile));
                  }
                  if (url.pathname.includes('/specialties')) return route.fulfill(json([]));
                  if (url.pathname.includes('/agenda/exceptions') || url.pathname.includes('/upcoming-holidays')) return route.fulfill(json([]));
                  if (url.pathname.includes('/agenda/settings')) return route.fulfill(json({ opening_time_morning:'09:00', closing_time_morning:'13:00', opening_time_afternoon:'14:00', closing_time_afternoon:'18:00', is_continuous:false, agenda_mode:'EXACT', use_tickets:false }));
                  if (url.pathname.includes('/team')) return route.fulfill(json([]));
                  if (url.pathname.includes('/audit-logs')) return route.fulfill(json({ total:0, logs:[] }));
                  return route.fulfill(json({}));
                });
                await page.goto(`http://127.0.0.1:4179/client-copy-settings.html?mode=${mode}`, { waitUntil:'networkidle', timeout:30000 });
                await page.getByRole('heading', { name:'Paramètres' }).waitFor({ state:'visible', timeout:15000 });
                if (mode === 'error') await page.getByText('Profil indisponible').waitFor({ state:'visible', timeout:15000 });
                const text = await page.locator('body').innerText();
                const overflow = await page.evaluate(() => document.documentElement.scrollWidth > document.documentElement.clientWidth + 1);
                if (state === 'after') {
                  if (/Ghost Elite Studio/i.test(text)) throw new Error('internal Settings brand still rendered');
                  if (mode === 'error' && /\bbackend\b/i.test(text)) throw new Error('backend wording still rendered in Settings error state');
                }
                if (overflow) throw new Error(`horizontal overflow ${mode} ${viewport.label}`);
                const shot = `${state}-${mode}-${viewport.label}.png`;
                await page.screenshot({ path:path.join(out,shot), fullPage:true, animations:'disabled' });
                results.push({ state, sha, mode, viewport, shot, pageErrors, overflow });
                if (pageErrors.length) throw new Error(`page errors ${mode} ${viewport.label}: ${pageErrors.join(' | ')}`);
                await context.close();
              }
            }
            await fs.writeFile(path.join(out,'results.json'), JSON.stringify({ state, sha, results }, null, 2));
          } finally {
            await browser.close();
            await server.close();
            await fs.rm('client-copy-settings.html', { force:true });
            await fs.rm('src/client-copy-settings.tsx', { force:true });
          }
          JS
          node client-copy-settings-proof.mjs
          rm client-copy-settings-proof.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: client-copy-settings-${{ matrix.state }}
          path: artifacts/client-copy-settings-${{ matrix.state }}
          if-no-files-found: error
          retention-days: 14
