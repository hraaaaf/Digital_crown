name: LOT05 J10L — FDI 32 dataset provenance and synthetic-only training dry run

on:
  pull_request:
    branches:
      - exp/lot05-j10k-actions-dfine-onnx-parity-20261022
    paths:
      - 'docs/research/LOT05_J10L_*'
      - 'experiments/lot05_j10l_*'
      - 'experiments/test_lot05_j10l_*'
      - '.github/workflows/lot05-j10l-fdi-provenance-synthetic-train.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fdi-j10l-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rights-before-training:
    name: "Source and cloud rights gate — real panoramics prohibited"
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate commercial FDI model rights still NO-GO
        run: |
          python experiments/lot05_j10i_fdi_commercial_rights_gate.py
          python experiments/test_lot05_j10i_fdi_commercial_rights_gate.py -v
      - name: Prevent actual X-ray training, cloud processing and model bundling
        run: |
          python experiments/lot05_j10l_fdi_training_readiness.py --mode synthetic_geometry
          python -m pip install --disable-pip-version-check 'pillow==11.3.0'
          python experiments/test_lot05_j10l_fdi_provenance_and_synthetic_train.py -v
      - name: Source only — no real-image upload paths
        run: |
          python - <<'PY'
          from pathlib import Path
          src=Path('experiments/lot05_j10l_dfine_synthetic_fdi_training.py').read_text()
          assert 'Image.new(' in src
          assert 'snapshot_download(' in src
          assert 'model.save_pretrained(' not in src
          assert 'torch.save(' not in src
          assert 'download_dataset' not in src
          print('NO-GO real clinical/cloud data training; YES to generated geometric fixtures')
          PY

  cpu-32class-training-plumbing:
    name: "Native ${{ matrix.os }} — one 32-class synthetic gradient step only"
    needs: rights-before-training
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    env:
      HF_HUB_DISABLE_XET: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      DO_NOT_TRACK: '1'
      HF_HUB_DISABLE_SYMLINKS_WARNING: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '2'
      CUDA_VISIBLE_DEVICES: ''
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact SHA
        shell: bash
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install torch CPU-only and pinned public D-FINE runtime
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir \
            'torch==2.7.1' 'torchvision==0.22.1' \
            --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check --no-cache-dir \
            'transformers==4.57.3' 'huggingface-hub==0.36.0' \
            'safetensors==0.6.2' 'pillow==11.3.0' 'numpy==2.2.6' 'scipy==1.16.2'
          python -m pip check
      - name: Execute real D-FINE 32-FDI class head loss and backprop on synthetic shapes ONLY
        shell: bash
        run: |
          python experiments/lot05_j10l_fdi_training_readiness.py --mode synthetic_geometry
          python experiments/lot05_j10l_dfine_synthetic_fdi_training.py \
            --mode synthetic_geometry \
            --output-json reports/j10l-${{ matrix.os }}.json
      - name: Refuse false clinical claims and any non-JSON artifacts
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          files = list(Path('reports').glob('j10l-*.json'))
          assert len(files) == 1
          for path in files:
              x=json.loads(path.read_text())
              assert x['status'] == 'SYNTHETIC_32_CLASS_TRAINING_PLUMBING_PASS'
              assert x['target_fdi_label_count'] == 32
              assert x['synthetic_box_count'] == 32
              assert x['forward_backward_optimizer_steps'] == 1
              assert x['nonzero_gradient_parameter_tensors'] > 0
              for key in ('real_dataset_loaded','clinical_accuracy_measured',
                          'weights_trained_on_real_radiographs','model_checkpoint_saved',
                          'cloud_real_image_processing_approved',
                          'commercial_release_approved','clinical_release_approved'):
                  assert x[key] is False,key
              print('PASS: synthetic loss/backprop, NO real FDI training or release',path)
          PY
      - name: Upload JSON metadata ONLY — no training weights or patient images
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: j10l-synthetic-fdi-gradient-${{ matrix.os }}
          path: reports/j10l-${{ matrix.os }}.json
          retention-days: 7
          if-no-files-found: warn
