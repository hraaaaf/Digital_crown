name: Neo D7 Isolated Runtime Contracts

on:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/neo-d7-runtime-contracts.yml'
      - 'backend/routers/documents.py'
      - 'backend/schemas/documents.py'
      - 'backend/services/archive_service.py'
      - 'backend/tests/test_archive_service.py'
      - 'backend/tests/test_neo_ordonnance_d7_roundtrip.py'
      - 'frontend/src/features/admin/DocumentHub.tsx'
      - 'frontend/src/features/admin/DocumentStudio/**'

permissions:
  contents: read

concurrency:
  group: neo-d7-contracts-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  backend-contracts:
    name: Backend archive and D7 prescription tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ENVIRONMENT: test
      SECRET_KEY: neo-d7-ci-only-unsafe-outside-testing-00001
      DATABASE_URL: 'sqlite:///:memory:'
      DIGITALCROWN_ISOLATED_RUNTIME: '1'
      DIGITALCROWN_ISOLATION_DB_FINGERPRINT: 'c04779c8d18b3ac12a0f4093a47a5d0c3c0e2251714be532893cfa052e9ee780'
      MEDIA_ROOT: /tmp/neo-d7-rehearsal-media
      TELEMETRY_ENABLED: 'false'
      CLOUD_AI_ENABLED: 'false'
      DEBUG: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.10.0 torchvision==0.25.0 torchaudio==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^(torch|torchvision|torchaudio)([<=>].*)?$' requirements.txt > /tmp/requirements-neo-d7.txt
          pip install -r /tmp/requirements-neo-d7.txt
          python -m pip check
      - name: Run isolated archive and medication contract tests
        run: |
          mkdir -p "$MEDIA_ROOT"
          python -m pytest backend/tests/test_archive_service.py backend/tests/test_neo_ordonnance_d7_roundtrip.py -q

  frontend-contracts:
    name: Frontend D7 mapping, catalog provenance and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Run focused prescription catalog and D7 re-open tests
        run: |
          npx vitest run src/features/admin/DocumentStudio/Forms/DrugRow.test.tsx src/features/admin/DocumentStudio/NeoOrdonnanceRoundTrip.d7.test.ts --maxWorkers=1 --fileParallelism=false
      - name: Verify production TypeScript / build
        run: npm run build
