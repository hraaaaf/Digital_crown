name: SEC-P1 Experimental Nuitka Parity Lab

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "scripts/security/sec_p1_nuitka_lab.py"
      - ".github/workflows/sec-p1-nuitka-parity-lab.yml"
      - "docs/security/SEC_P1_NUITKA_LAB.md"
      - "backend/core/key_material.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sec-p1-nuitka-lab-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-key-material-parity:
    name: EXPERIMENTAL Nuitka native parity (Linux only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Check SHA identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install isolated native compiler dependency
        run: python -m pip install Nuitka==4.3

      - name: Native compilation plus 11 synthetic parity scenarios
        run: python scripts/security/sec_p1_nuitka_lab.py
