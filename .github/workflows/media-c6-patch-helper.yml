name: Media C6 Patch Helper

on:
  push:
    branches:
      - feat/media-c6-controlled-smartphone-capture

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/media-c6-controlled-smartphone-capture
          fetch-depth: 0
      - name: Apply guarded C6 patch
        run: python scripts/apply_media_c6_patch.py
      - name: Syntax-check patched route and test
        run: python -m py_compile backend/routers/mobile_resource_bridge.py backend/tests/test_media_c6_controlled_smartphone_capture.py
      - name: Commit atomic C6 implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(media): add controlled smartphone capture to Media Core"
          git push origin HEAD:feat/media-c6-controlled-smartphone-capture
