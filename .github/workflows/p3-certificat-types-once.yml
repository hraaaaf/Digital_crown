name: P3 Certificat Types Once

on:
  push:
    branches:
      - work-20260815-p3-certificat-types
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work-20260815-p3-certificat-types
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Apply P3 certificate patch
        run: |
          python scripts/p3_certificat_types_once.py
          python - <<'PY'
          from pathlib import Path
          path = Path('frontend/src/features/admin/DocumentStudio/Forms/CertificateForm.tsx')
          text = path.read_text(encoding='utf-8')
          old = '<label className={labelClass}>Contenu du certificat médical</label>\n                <textarea'
          new = '<label htmlFor="certificate-free-content" className={labelClass}>Contenu du certificat médical</label>\n                <textarea\n                  id="certificate-free-content"'
          assert old in text, 'free certificate label anchor not found'
          text = text.replace(old, new, 1)
          old = '<label className={labelClass + " mb-1"}>Durée du repos</label>'
          new = '<label htmlFor="certificate-rest-days" className={labelClass + " mb-1"}>Durée du repos</label>'
          assert old in text, 'duration label anchor not found'
          text = text.replace(old, new, 1)
          old = '<input\n                type="range"'
          new = '<input\n                id="certificate-rest-days"\n                type="range"'
          assert old in text, 'duration range anchor not found'
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Targeted frontend tests
        working-directory: frontend
        run: |
          npm ci
          npx vitest run src/features/admin/DocumentStudio/CertificatePolicy.test.ts src/features/admin/DocumentStudio/Forms/CertificateForm.p3a.test.tsx

      - name: Commit clean patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(p3): add practitioner-authored medical certificate"
          git push origin HEAD:work-20260815-p3-certificat-types
