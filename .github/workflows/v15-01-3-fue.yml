name: V1.5-01.3 Network Error FUE-I

on:
  pull_request:
    branches: [master]
    paths:
      - "frontend/src/features/hub/ControlCenterTopologyPanel.tsx"
      - "frontend/scripts/audit-v15-01-3-network-errors.mjs"
      - ".github/workflows/v15-01-3-fue.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  PRODUCT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  VITE_API_URL: http://127.0.0.1:8005
  BASELINE_HEAD: ed9d7f763cd6af7b38c9455dd3b22eaf2006e30d

jobs:
  before:
    name: Baseline 01.2 — actual error screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout current harness
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Preserve scenario runner, then checkout exact prior HEAD
        shell: bash
        run: |
          cp frontend/scripts/audit-v15-01-3-network-errors.mjs /tmp/audit-v15-01-3-network-errors.mjs
          git fetch --no-tags --depth=1 origin "$BASELINE_HEAD"
          git checkout --force "$BASELINE_HEAD"
          cp /tmp/audit-v15-01-3-network-errors.mjs frontend/scripts/audit-v15-01-3-network-errors.mjs
          test "$(git rev-parse HEAD)" = "$BASELINE_HEAD"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install browser dependencies
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install chromium
          node --check scripts/audit-v15-01-3-network-errors.mjs
      - name: Start isolated baseline Vite, no cabinet backend
        working-directory: frontend
        run: |
          npm run dev -- --host 127.0.0.1 --port 8005 >/tmp/fue-01-3-before-vite.log 2>&1 &
          for i in {1..60}; do
            curl -fsS http://127.0.0.1:8005/control-center >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/fue-01-3-before-vite.log
          exit 1
      - name: Capture exact baseline failure / remediation / recovery
        working-directory: frontend
        env:
          V15_01_3_PHASE: before
          PRODUCT_HEAD: ${{ env.BASELINE_HEAD }}
        run: node scripts/audit-v15-01-3-network-errors.mjs
      - name: Vite diagnostic on failure
        if: failure()
        run: tail -n 100 /tmp/fue-01-3-before-vite.log || true
      - name: Preserve BEFORE JSON + screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fue-v15-01-3-before
          path: frontend/artifacts/fue-v15-01-3-before/
          if-no-files-found: error
          retention-days: 14

  after:
    name: Candidate — error-state recovery and safety
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install browser dependencies
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install chromium
          node --check scripts/audit-v15-01-3-network-errors.mjs
      - name: Targeted frontend topology source contract
        working-directory: frontend
        run: npm test -- --run src/test/v15HubRoutingContract.test.ts
      - name: Start isolated candidate Vite, no cabinet backend
        working-directory: frontend
        run: |
          npm run dev -- --host 127.0.0.1 --port 8005 >/tmp/fue-01-3-after-vite.log 2>&1 &
          for i in {1..60}; do
            curl -fsS http://127.0.0.1:8005/control-center >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/fue-01-3-after-vite.log
          exit 1
      - name: FUE-I 01.3 real browser error recovery
        working-directory: frontend
        env:
          V15_01_3_PHASE: after
        run: node scripts/audit-v15-01-3-network-errors.mjs
      - name: Vite diagnostic on failure
        if: failure()
        run: tail -n 100 /tmp/fue-01-3-after-vite.log || true
      - name: Preserve AFTER JSON + screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fue-v15-01-3-after
          path: frontend/artifacts/fue-v15-01-3-after/
          if-no-files-found: error
          retention-days: 14
