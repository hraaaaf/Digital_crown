name: Cephalo Facad P2 API PDF React Contract (experimental)
on:
  push:
    branches:
      - 'audit/dc-ceph-facad-parity-p1-p2-*'
  pull_request:
    branches:
      - 'audit/dc-ceph-facad-parity-p1-desktop-20261017'
permissions:
  contents: read

jobs:
  frontend-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact HEAD
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend
        working-directory: frontend
        run: npm ci
      - name: React verified profile, Focus, version toggle and fail-closed contracts
        working-directory: frontend
        run: |
          set -o pipefail
          npx vitest run src/features/ortho/components/CephaloR23G2ProtocolPanel.test.tsx src/features/ortho/cephaloR23G2ClinicalProfiles.test.ts src/features/ortho/cephaloR23G3PointSource.test.ts src/features/ortho/cephaloR23G8W1OrientationRequirements.test.ts | tee ../p2-react-tests.log
      - name: TypeScript application static contract
        working-directory: frontend
        run: |
          set -o pipefail
          npx tsc --noEmit -p tsconfig.app.json | tee ../p2-typescript.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p2-frontend-${{ github.event.pull_request.head.sha || github.sha }}
          path: p2-*.log
          retention-days: 30

  authenticated-backend-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SECRET_KEY: p2-ci-synthetic-secret-key-minimum-32-chars
      DATABASE_URL: 'sqlite:///:memory:'
      ENVIRONMENT: test
      DIGITALCROWN_ISOLATED_RUNTIME: 'true'
      TELEMETRY_ENABLED: 'false'
      CLOUD_AI_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact HEAD
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test-only backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.10.0 torchvision==0.25.0 torchaudio==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^(torch|torchvision|torchaudio)([<=>].*)?$' requirements.txt > /tmp/ceph-p2-requirements.txt
          pip install -r /tmp/ceph-p2-requirements.txt
          python -m pip check
      - name: JWT GET PUT GET / tenant isolation / stale evidence / PDF parity & fail-closed
        run: |
          set -o pipefail
          python -m pytest backend/tests/test_cephalo_r23g5_authenticated_api.py backend/tests/test_cephalo_typed_read_route.py backend/tests/test_cephalo_runtime_chain.py backend/tests/test_cephalo_r17_pdf_renderer_contract.py backend/tests/test_cephalo_r23g2_pdf_sections.py -q | tee p2-backend-tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p2-backend-${{ github.event.pull_request.head.sha || github.sha }}
          path: p2-backend-tests.log
          retention-days: 30
