name: Pocket Patient Shell
on:
  pull_request:
    paths:
      - frontend/src/features/patient-companion/**
      - frontend/scripts/capture-pocket-patient-shell.mjs
      - .github/workflows/pocket-patient-shell.yml
jobs:
  patient-shell:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Assert exact candidate
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Patient shell and module regression
        working-directory: frontend
        run: >-
          npx vitest run
          src/features/patient-companion/PatientCompanionApp.test.tsx
          src/features/patient-companion/PatientCompanionMessages.contract.test.ts
          src/features/patient-companion/PatientCompanionQuestionnaires.test.tsx
          src/features/patient-companion/PatientCompanionFinance.test.tsx
          src/features/patient-companion/PatientCompanionConsentVault.test.tsx
          src/features/patient-companion/PatientCompanionNotifications.test.tsx
          src/features/patient-companion/PatientCompanionEmergencyPhoto.test.tsx
      - name: TypeScript
        working-directory: frontend
        run: npx tsc -b
      - name: Install evidence runner
        working-directory: frontend
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps webkit
      - name: Capture real patient component with synthetic vault
        working-directory: frontend
        run: |
          npx vite --host 127.0.0.1 --port 5201 --strictPort >/tmp/patient-shell-vite.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:5201/ >/dev/null && break; sleep 1; done
          node scripts/capture-pocket-patient-shell.mjs after
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pocket-patient-shell-${{ github.event.pull_request.head.sha }}
          path: artifacts/patient-shell-after
          if-no-files-found: error
