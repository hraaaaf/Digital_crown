name: CEPH V1 L2 ED EN targeted QA (NO DEPLOY)

on:
  pull_request:
    branches:
      - feat/cephalo-v1-l1a-20261101
    paths:
      - 'backend/schemas/clinical.py'
      - 'backend/services/cephalo_service.py'
      - 'backend/tests/test_cephalo_treatment_boundary.py'
      - 'backend/tests/test_ortho_frontend_fail_closed_contract.py'
      - 'frontend/src/features/ortho/cephaloUtils.ts'
      - 'frontend/src/features/ortho/cephaloUtils.test.ts'
      - 'frontend/src/features/ortho/cephaloClinicalIsolation.ts'
      - 'frontend/src/features/ortho/cephaloClinicalIsolation.test.ts'
      - 'frontend/src/features/ortho/components/Step2Occlusal.tsx'
      - '.github/workflows/ceph-v1-l2-ed-en-targeted.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-ddm:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SECRET_KEY: 'ceph-l2-targeted-isolated-test-key-32-chars'
      DATABASE_URL: 'sqlite:///:memory:'
      ENVIRONMENT: test
      DIGITALCROWN_ISOLATED_RUNTIME: 'true'
      TELEMETRY_ENABLED: 'false'
      CLOUD_AI_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact candidate
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated backend requirements
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.10.0 torchvision==0.25.0 torchaudio==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^(torch|torchvision|torchaudio)([<=>].*)?$' requirements.txt > /tmp/ceph-l2-requirements.txt
          pip install -r /tmp/ceph-l2-requirements.txt
      - name: Test direct ED/EN source authority and safety boundary
        run: python -m pytest backend/tests/test_cephalo_treatment_boundary.py backend/tests/test_ortho_frontend_fail_closed_contract.py -q

  frontend-ddm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact candidate
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend locked dependencies
        working-directory: frontend
        run: npm ci
      - name: Test ED/EN signs, blanks and study isolation
        working-directory: frontend
        run: npx vitest run src/features/ortho/cephaloUtils.test.ts src/features/ortho/cephaloClinicalIsolation.test.ts
