name: Ortho Journey F Visual

on:
  pull_request:
    branches: [master]
    paths:
      - 'frontend/src/features/patients/components/OrthoJourneyOverview.tsx'
      - 'frontend/src/features/patients/components/OrthoJourneyOverview.test.tsx'
      - 'frontend/src/features/patients/PatientDetailsInner.tsx'
      - 'docs/audits/ORTHO_JOURNEY_F_GOAL.md'
      - '.github/workflows/ortho-journey-f-visual.yml'

permissions:
  contents: read

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ENVIRONMENT: test
      SECRET_KEY: ortho-journey-f-visual-secret-000001
      DATABASE_URL: sqlite:///./t2-runtime-cert.db
      TELEMETRY_ENABLED: 'false'
      CLOUD_AI_ENABLED: 'false'
      DEBUG: 'false'
      ALLOWED_ORIGINS: 'http://127.0.0.1:5173,http://localhost:5173'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - id: mode
        name: Resolve evidence phase
        shell: bash
        run: |
          if [ -f frontend/src/features/patients/components/OrthoJourneyOverview.tsx ]; then
            echo 'phase=after' >> "$GITHUB_OUTPUT"
          else
            echo 'phase=before' >> "$GITHUB_OUTPUT"
          fi

      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.12.0 torchvision==0.27.0 --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^(torch|torchvision)([<=>].*)?$' requirements.txt > /tmp/requirements-ortho-f-visual.txt
          pip install -r /tmp/requirements-ortho-f-visual.txt
          pip install httpx==0.27.2

      - name: Install frontend and Chromium
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start backend
        run: |
          rm -f t2-runtime-cert.db
          python scripts/t2_runtime_server.py > /tmp/ortho-f-backend.log 2>&1 &
          for i in {1..90}; do if curl -fsS http://127.0.0.1:8005/health >/dev/null; then exit 0; fi; sleep 1; done
          cat /tmp/ortho-f-backend.log
          exit 1

      - name: Start frontend
        working-directory: frontend
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 > /tmp/ortho-f-front.log 2>&1 &
          for i in {1..90}; do if curl -fsS http://127.0.0.1:5173 >/dev/null; then exit 0; fi; sleep 1; done
          cat /tmp/ortho-f-front.log
          exit 1

      - name: Capture Lot F ${{ steps.mode.outputs.phase }}
        working-directory: frontend
        env:
          EVIDENCE_PHASE: ${{ steps.mode.outputs.phase }}
        run: |
          mkdir -p "../artifacts/ortho-journey-f-${EVIDENCE_PHASE}"
          cat > .ortho-f-visual.mjs <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import { chromium, request } from 'playwright';

          const phase=process.env.EVIDENCE_PHASE || 'before';
          const out=path.resolve(`../artifacts/ortho-journey-f-${phase}`);
          const viewports=[
            {width:390,height:844},
            {width:430,height:932},
            {width:768,height:1024},
            {width:1280,height:900},
          ];
          const api=await request.newContext({baseURL:'http://127.0.0.1:8005'});
          const login=await api.post('/api/auth/login',{form:{username:'t2-browser@cabinet.ma',password:'T2BrowserPass123!'}});
          if(!login.ok()) throw new Error(`login failed: ${await login.text()}`);
          const tok=await login.json();
          const headers={Authorization:`Bearer ${tok.access_token}`};
          const ps=await api.get('/api/patients',{headers});
          if(!ps.ok()) throw new Error(`patients failed: ${await ps.text()}`);
          const patient=(await ps.json()).find(p=>p.numero_dossier==='T2-0001');
          if(!patient) throw new Error('T2 patient missing');
          const ortho=await api.patch(`/api/patients/${patient.id}/ortho`,{headers,data:{is_ortho_active:true}});
          if(!ortho.ok()) throw new Error(`ortho activation failed: ${await ortho.text()}`);

          const browser=await chromium.launch({headless:true});
          const evidence=[];
          for(const viewport of viewports){
            const ctx=await browser.newContext({viewport,colorScheme:'light'});
            const page=await ctx.newPage();
            await page.addInitScript(({a,r})=>{
              localStorage.setItem('token',a);
              localStorage.setItem('refresh_token',r||'');
              localStorage.setItem('appMode','prod');
            },{a:tok.access_token,r:tok.refresh_token});
            const errors=[]; const http5xx=[];
            page.on('pageerror',e=>errors.push(String(e)));
            page.on('response',r=>{if(r.status()>=500)http5xx.push({url:r.url(),status:r.status()});});
            await page.goto(`http://127.0.0.1:5173/patients/${patient.id}?tab=tracking`,{waitUntil:'networkidle',timeout:90000});
            await page.getByText('Prochaine action',{exact:true}).waitFor({state:'visible',timeout:30000});
            if(phase==='after'){
              await page.getByText('Parcours orthodontique',{exact:true}).waitFor({state:'visible',timeout:30000});
            } else if(await page.getByText('Parcours orthodontique',{exact:true}).count()>0){
              throw new Error(`BEFORE unexpectedly contains Ortho Journey @ ${viewport.width}`);
            }
            await page.waitForTimeout(500);
            const overflow=await page.evaluate(()=>document.documentElement.scrollWidth>document.documentElement.clientWidth+2);
            const shot=`ortho-journey-f-${phase}-${viewport.width}x${viewport.height}.png`;
            await page.screenshot({path:path.join(out,shot),fullPage:false});
            evidence.push({viewport,overflow,errors,http5xx,shot});
            await ctx.close();
          }
          const summary={
            phase,
            captures:evidence.length,
            noHorizontalOverflow:evidence.every(x=>!x.overflow),
            runtimeErrors:evidence.filter(x=>x.errors.length),
            http5xx:evidence.filter(x=>x.http5xx.length),
          };
          fs.writeFileSync(path.join(out,'evidence.json'),JSON.stringify(evidence,null,2));
          fs.writeFileSync(path.join(out,'summary.json'),JSON.stringify(summary,null,2));
          await browser.close(); await api.dispose();
          if(summary.captures!==4||!summary.noHorizontalOverflow||summary.runtimeErrors.length||summary.http5xx.length) process.exit(1);
          JS
          node .ortho-f-visual.mjs
          rm .ortho-f-visual.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ortho-journey-f-${{ steps.mode.outputs.phase }}
          path: artifacts/ortho-journey-f-${{ steps.mode.outputs.phase }}
          if-no-files-found: error
          retention-days: 14
