name: Patient P0-D Remaining Assistants PR Cert

on:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/patient-p0d-remaining-assistants-pr-cert.yml'
      - 'frontend/src/features/patients/components/wizards/**'

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Apply fail-closed candidate in workspace
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          files = {
            'AssistantATM.tsx': 'Synthèse ATM / parafonctions structurée.',
            'AssistantGeneral.tsx': 'Synthèse générale structurée.',
            'AssistantOrtho.tsx': 'Synthèse orthodontique structurée.',
            'AssistantParo.tsx': 'Synthèse parodontale structurée.',
            'AssistantProthese.tsx': 'Synthèse prothétique structurée.',
          }
          root = Path('frontend/src/features/patients/components/wizards')
          pattern = re.compile(r"  const generateDiagnosis = \(finalAnswers: Record<string, number>\) => \{.*?\n  \};\n\n  if \(isCalculating\)", re.S)
          for filename, title in files.items():
              p = root / filename
              src = p.read_text(encoding='utf-8')
              if 'onComplete(summary, [])' in src:
                  continue
              replacement = f'''  const generateDiagnosis = (finalAnswers: Record<string, number>) => {{
    setIsCalculating(true);

    setTimeout(() => {{
      const selected = QUESTIONS.map((question) => {{
        const value = finalAnswers[question.id];
        const option = question.options.find((item) => item.value === value);
        return `${{question.title}} : ${{option?.label ?? 'Non renseigné'}}`;
      }});

      const summary = [
        '{title}',
        `Observations recueillies : ${{selected.join(' ; ')}}.`,
        'Ces réponses décrivent uniquement les informations saisies dans le questionnaire.',
        'Aucun diagnostic, examen complémentaire, médicament, dispositif, orientation ou traitement n’est déterminé automatiquement.',
        'Diagnostic, examens complémentaires et conduite thérapeutique : décision exclusive du praticien après validation clinique.'
      ].join(' ');

      onComplete(summary, []);
    }}, 1500);
  }};

  if (isCalculating)'''
              updated, count = pattern.subn(replacement, src, count=1)
              if count != 1:
                  raise SystemExit(f'{filename}: generateDiagnosis source mismatch')
              p.write_text(updated, encoding='utf-8')
          PY

      - name: Safety contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          root=Path('frontend/src/features/patients/components/wizards')
          names=['AssistantATM.tsx','AssistantGeneral.tsx','AssistantOrtho.tsx','AssistantParo.tsx','AssistantProthese.tsx']
          banned=['Prescription Myorelaxants','CBCT / IRM','Gouttière de libération occlusale','Antibioprophylaxie avant tout soin invasif','Radiographie de contrôle (RVG)','Traitement global par Aligneurs','Pose Appareillage Multi-attaches','Appareillage Orthopédique','Avis Chirurgie Maxillo-Faciale','Antibiothérapie adjuvante','Chirurgie parodontale','Pose d\\'Implant','Couronne monolithique']
          for name in names:
              text=(root/name).read_text(encoding='utf-8')
              assert 'onComplete(summary, [])' in text, name
              assert 'Aucun diagnostic, examen complémentaire, médicament, dispositif, orientation ou traitement n’est déterminé automatiquement.' in text, name
              for marker in banned:
                  assert marker not in text, f'{name}: banned marker {marker}'
          print('P0-D remaining assistants contracts OK')
          PY

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Diff check
        run: git diff --check
