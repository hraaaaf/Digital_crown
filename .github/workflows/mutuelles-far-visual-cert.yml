name: Mutuelles FAR Visual Certification

on:
  pull_request:
    paths:
      - "backend/routers/insurance_submissions.py"
      - "backend/schemas/insurance_submission.py"
      - "backend/services/insurance_*.py"
      - "backend/tests/test_insurance_*.py"
      - "frontend/src/MutuellesFarUI.test.ts"
      - "frontend/src/features/patients/FarInsuranceSubmissionReview.tsx"
      - "frontend/src/features/patients/CnssInsuranceAction.tsx"
      - "frontend/src/features/patients/InsuranceSubmissionTypes.ts"
      - ".github/workflows/mutuelles-far-visual-cert.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutuelles-far-visual-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.12.0 torchvision==0.27.0 --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^(torch|torchvision)([<=>].*)?$' requirements.txt > /tmp/requirements-far.txt
          pip install -r /tmp/requirements-far.txt
          pip install httpx==0.27.2 pytest
      - name: Run FAR and shared insurance contracts
        env:
          ENVIRONMENT: test
          SECRET_KEY: far-contract-cert-secret-key-000001
          DATABASE_URL: sqlite:///./far-contract-cert.db
          TELEMETRY_ENABLED: "false"
          CLOUD_AI_ENABLED: "false"
          DEBUG: "false"
          DIGITAL_CROWN_TESTING: "1"
        run: |
          python -m pytest -q --maxfail=1 \
            backend/tests/test_insurance_far.py \
            backend/tests/test_insurance_administrative.py \
            backend/tests/test_insurance_cnops_profile.py \
            backend/tests/test_insurance_source_store.py \
            backend/tests/test_insurance_submission_api.py \
            backend/tests/test_insurance_template_registry.py \
            backend/tests/test_insurance_preparation.py \
            backend/tests/test_insurance_finalization.py \
            backend/tests/test_insurance_validation.py

  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend and Chromium
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Inject deterministic FAR runtime harness
        working-directory: frontend
        run: |
          cat > mutuelles-far-visual.html <<'EOF'
          <!doctype html><html lang="fr"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>FAR Visual</title></head><body><div id="root"></div><script type="module" src="/src/mutuelles-far-visual.tsx"></script></body></html>
          EOF
          cat > src/mutuelles-far-visual.tsx <<'EOF'
          import React, { useState } from 'react';
          import { createRoot } from 'react-dom/client';
          import './index.css';
          import { FarInsuranceSubmissionReview } from './features/patients/FarInsuranceSubmissionReview';
          import type { InsuranceSubmissionDraft } from './features/patients/InsuranceSubmissionTypes';

          const initialDraft: InsuranceSubmissionDraft = {
            schema_version: '1',
            organization: 'FAR',
            patient_id: 101,
            honoraires_document_id: 1284,
            lines: [{
              source: { honoraires_document_id: 1284, honoraires_line_index: 0, source_line_uid: 'line-1', acte_id: 42, catalog_act_id: 12 },
              service_date: '2026-09-17',
              label: 'Obturation composite',
              teeth: ['12'],
              amount_mad: 650,
              ngap_code: 'DENT',
              ngap_coefficient: 12,
              mapping_status: 'EXACT',
              mapping_rule_id: 'catalog_exact',
            }],
            administrative: {
              insured_national_id: 'AB123456',
              insured_account_number: 'CPT-00184',
              insured_phone: '0612345678',
              insured_full_name: 'Amal El Mansouri',
              insured_grade: 'Commandant',
              insured_unit: 'Unité Rabat',
              insured_address: 'Rabat',
              beneficiary_full_name: 'Amal El Mansouri',
              beneficiary_birth_date: '1990-04-18',
              relationship_to_insured: 'ADHERENT',
              claim_context: 'MALADIE',
              practitioner_inpe: '123456789',
              care_type: 'SOINS',
              attachments_count: 0,
            },
            unresolved_fields: [],
            status: 'READY_FOR_REVIEW',
            template: {
              template_version: 'FAR-2021-1-DERIVED-CABINET-2026-09-17',
              template_hash: 'c953d74f25ee5e3160683f16c45783448d55ea89640c710653a3e2cbf782bf42',
              trust: 'CABINET_VALIDATED_DERIVED_REFERENCE',
            },
            reference: { ngap_reference_version: 'cabinet-reference', ngap_reference_hash: 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa' },
            source_ordonnance_document_id: null,
            validated_by_practitioner_id: null,
            validated_at: null,
          };

          function Harness() {
            const [draft, setDraft] = useState(initialDraft);
            return <FarInsuranceSubmissionReview draft={draft} onChange={setDraft} onValidate={() => {}} onFinalize={() => {}} onClose={() => {}} />;
          }
          createRoot(document.getElementById('root')!).render(<Harness />);
          EOF
          cat > mutuelles-far-visual.mjs <<'EOF'
          import { chromium } from 'playwright';
          import { createServer } from 'vite';
          import fs from 'node:fs/promises';
          const out='mutuelles-far-visual';
          await fs.mkdir(out,{recursive:true});
          const server=await createServer({server:{host:'127.0.0.1',port:4201,strictPort:true},clearScreen:false,optimizeDeps:{disabled:true}});
          await server.listen();
          const browser=await chromium.launch();
          try {
            for (const [width,height] of [[390,844],[768,1024],[1280,900]]) {
              const context=await browser.newContext({viewport:{width,height}});
              const page=await context.newPage();
              const errors=[];
              page.on('pageerror',e=>errors.push(`pageerror: ${e.message}`));
              page.on('console',m=>{ if(m.type()==='error') errors.push(`console: ${m.text()}`); });
              await page.goto('http://127.0.0.1:4201/mutuelles-far-visual.html',{waitUntil:'domcontentloaded'});
              const review=page.locator('[data-insurance-review="far"]');
              await review.waitFor({state:'visible',timeout:15000});
              await page.locator('[data-far-section="administrative"]').waitFor({state:'visible'});
              await page.locator('[data-far-section="prescription"]').waitFor({state:'attached'});
              await page.locator('[data-far-action="validate"]').waitFor({state:'attached'});
              const state=await page.evaluate(()=>({clientWidth:document.documentElement.clientWidth,scrollWidth:document.documentElement.scrollWidth}));
              await page.screenshot({path:`${out}/far-${width}x${height}.png`,fullPage:true,animations:'disabled'});
              await fs.writeFile(`${out}/far-${width}x${height}.json`,JSON.stringify({...state,overflowPx:Math.max(0,state.scrollWidth-state.clientWidth),errors},null,2));
              if(state.scrollWidth>state.clientWidth) throw new Error(`FAR overflow ${state.scrollWidth}>${state.clientWidth} at ${width}`);
              if(errors.length) throw new Error(`FAR runtime errors at ${width}: ${errors.join(' | ')}`);
              await context.close();
            }
          } finally { await browser.close(); await server.close(); }
          EOF
      - name: Capture FAR AFTER
        working-directory: frontend
        run: node mutuelles-far-visual.mjs
      - name: Verify evidence
        working-directory: frontend
        run: |
          test "$(find mutuelles-far-visual -name '*.png' | wc -l)" -eq 3
          test "$(find mutuelles-far-visual -name '*.json' | wc -l)" -eq 3
          cat > mutuelles-far-visual/metadata.txt <<EOF
          head_sha=${{ github.event.pull_request.head.sha || github.sha }}
          base_sha=${{ github.event.pull_request.base.sha || github.sha }}
          phase=AFTER
          viewports=390x844,768x1024,1280x900
          component=FarInsuranceSubmissionReview
          goal=runtime proof of FAR review, explicit admin fields and separate prescription boundary
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutuelles-far-visual-evidence
          path: frontend/mutuelles-far-visual/
          if-no-files-found: error
          retention-days: 14
