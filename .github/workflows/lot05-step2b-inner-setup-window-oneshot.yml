name: LOT05 Step2B — Actual Embedded Open Dental Setup First Window Only

on:
  pull_request:
    types: [opened, synchronize]
    branches: [master]
    paths:
      - '.github/workflows/lot05-step2b-inner-setup-window-oneshot.yml'

permissions:
  contents: read

jobs:
  genuine-setup-first-window:
    name: Signed archive → exact embedded Setup.exe → read-only first window
    if: ${{ github.event.pull_request.draft == true && github.event.pull_request.head.ref == 'feat/lot05-step2b-open-inner-setup-wizard-once-20261110' && github.run_attempt == 1 }}
    runs-on: windows-2022
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 12
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Prove ephemeral hosted admin, exact SHA, single lab workflow
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if ($env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or $env:RUNNER_OS -cne 'Windows' -or
              (git rev-parse HEAD).Trim() -cne '${{ github.event.pull_request.head.sha }}') { throw 'EXACT_HOSTED_WINDOWS_REQUIRED' }
          $base='d4d2d144393fc884e01ca8734c1efa9fb0e0f2e3'
          if ((git merge-base HEAD $base).Trim() -cne $base) { throw 'BASE_MISMATCH' }
          $paths=@(git diff --name-only $base HEAD)
          if ($paths.Count -ne 1 -or $paths[0] -cne '.github/workflows/lot05-step2b-inner-setup-window-oneshot.yml') {
            throw 'OUTSIDE_LAB_SCOPE'
          }
          $admin=([Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole(
            [Security.Principal.WindowsBuiltInRole]::Administrator)
          if (-not $admin) { throw 'ADMIN_TOKEN_REQUIRED' }
          if (@(Get-Service 'MariaDB','MySQL*' -ErrorAction SilentlyContinue).Count -gt 0) { throw 'DB_SERVICE_PREEXISTING' }
          Write-Host 'LOT05_ACTUAL_SETUP_EXACT_SHA_EPHEMERAL_ADMIN_VERIFIED'
      - name: One official Setup.exe launch, no Next, no license acceptance, no patient data
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $exe=Join-Path $env:RUNNER_TEMP 'LOT05_PINNED_VENDOR_TRIAL.exe'
          $root=Join-Path $env:RUNNER_TEMP 'LOT05_SIGNED_TRIAL_TEMP_EXTRACT'
          $json=Join-Path $env:RUNNER_TEMP 'lot05-2b-inner-setup-window-observation.json'
          $png=Join-Path $env:RUNNER_TEMP 'lot05-2b-inner-setup-first-window-only.png'
          $knownIds=@()
          $report=[ordered]@{
            evidence='SIGNED_VENDOR_EMBEDDED_SETUP_FIRST_WINDOW_LAB'
            sha='${{ github.event.pull_request.head.sha }}'
            wrapper_sha256_pinned=$false
            wrapper_authenticode_valid=$false
            vendor_signer_verified=$false
            archive_extracted=$false
            exact_embedded_setup_path_present=$false
            embedded_setup_sha256='UNKNOWN'
            embedded_setup_authenticode_status='UNKNOWN'
            exact_inner_setup_launched_once=$false
            strong_opendental_wizard_title=$false
            windows_installer_transient_seen=$false
            license_title_observed=$false
            trial_setup_window_capture_retained=$false
            capture_dimensions=$null
            title_captured_from_owned_process=$false
            observation_cycles=0
            clicked_next=$false
            accepted_eula=$false
            clicked_finish=$false
            patient_data_used=$false
            csv_exported=$false
            db_service_created=$false
            status='NOT_PROVEN'
            refusal_code=$null
          }
          try {
            [Net.ServicePointManager]::SecurityProtocol=[Net.SecurityProtocolType]::Tls12
            Invoke-WebRequest 'https://www.opendental.com/TrialDownload-25-3-48.exe' -OutFile $exe -TimeoutSec 210 -MaximumRedirection 2
            if ((Get-Item -LiteralPath $exe).Length -ne 149781424) { throw 'EXE_LENGTH_CHANGED' }
            if ((Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant() -cne 'b892db0d3b2fc0947fa25fe4fc07c2e81815d70119f72e7abf1f8b9b0671bcb9') { throw 'WRAPPER_DIGEST_CHANGED' }
            $report.wrapper_sha256_pinned=$true
            $sig=Get-AuthenticodeSignature -LiteralPath $exe
            if ($sig.Status -ne [System.Management.Automation.SignatureStatus]::Valid) { throw 'WRAPPER_SIGNATURE_INVALID' }
            $report.wrapper_authenticode_valid=$true
            if ($null -eq $sig.SignerCertificate -or $sig.SignerCertificate.Subject -notmatch '(?i)Open\s*Dental') { throw 'WRONG_PUBLISHER' }
            $report.vendor_signer_verified=$true
            $sevenzip='C:\Program Files\7-Zip\7z.exe'
            if (-not (Test-Path -LiteralPath $sevenzip)) { throw 'SEVENZIP_REQUIRED' }
            $null=New-Item -ItemType Directory -Path $root -Force
            $null=& $sevenzip x $exe "-o$root" '-y' 2>$null
            if ($LASTEXITCODE -ne 0) { throw 'VENDOR_ARCHIVE_EXTRACT_FAILED' }
            $report.archive_extracted=$true
            $setup=Join-Path $root 'Release\Open Dental Setup\Setup.exe'
            if (-not (Test-Path -LiteralPath $setup)) { throw 'OFFICIAL_EMBEDDED_SETUP_MISSING' }
            $report.exact_embedded_setup_path_present=$true
            $report.embedded_setup_sha256=(Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash.ToLowerInvariant()
            $innerSig=Get-AuthenticodeSignature -LiteralPath $setup
            $report.embedded_setup_authenticode_status=[string]$innerSig.Status
            if ($innerSig.Status -notin @([System.Management.Automation.SignatureStatus]::Valid,
                                         [System.Management.Automation.SignatureStatus]::NotSigned)) {
              throw 'INNER_BINARY_SIGNATURE_UNSAFE'
            }
            Add-Type -AssemblyName System.Drawing -ErrorAction Stop
            Add-Type -TypeDefinition @'
          using System;
          using System.Text;
          using System.Runtime.InteropServices;
          public static class Lot05GenuineSetupWindow {
            public delegate bool EnumCallback(IntPtr hwnd,IntPtr user);
            [DllImport("user32.dll")] public static extern bool EnumWindows(EnumCallback callback,IntPtr user);
            [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr hwnd);
            [DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(IntPtr hwnd,out uint pid);
            [DllImport("user32.dll",CharSet=CharSet.Unicode)] public static extern int GetWindowText(IntPtr hwnd,StringBuilder sb,int count);
            [StructLayout(LayoutKind.Sequential)] public struct Rect {public int Left,Top,Right,Bottom;}
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr hwnd,out Rect rect);
            [DllImport("user32.dll")] public static extern bool PrintWindow(IntPtr hwnd,IntPtr hdc,uint flags);
          }
          '@
            # Owner-authorized single launch only. No automation input afterwards.
            $proc=Start-Process -FilePath $setup -WorkingDirectory (Split-Path -Parent $setup) -PassThru -ErrorAction Stop
            $report.exact_inner_setup_launched_once=$true
            $knownIds=@([int]$proc.Id)
            $winner=[IntPtr]::Zero
            for($cycle=0;$cycle -lt 95;$cycle++){
              Start-Sleep -Seconds 1
              $report.observation_cycles=$cycle+1
              $all=@(Get-CimInstance Win32_Process -ErrorAction SilentlyContinue)
              for($depth=0;$depth -lt 3;$depth++){
                foreach($child in $all){
                  if($knownIds -contains [int]$child.ParentProcessId -and
                     $knownIds -notcontains [int]$child.ProcessId){$knownIds += [int]$child.ProcessId}
                }
              }
              $candidates=New-Object 'System.Collections.Generic.List[System.IntPtr]'
              $callback=[Lot05GenuineSetupWindow+EnumCallback]{
                param([IntPtr]$h,[IntPtr]$unused)
                if(-not [Lot05GenuineSetupWindow]::IsWindowVisible($h)){return $true}
                $ownerId=[uint32]0
                $null=[Lot05GenuineSetupWindow]::GetWindowThreadProcessId($h,[ref]$ownerId)
                if($knownIds -notcontains [int]$ownerId){return $true}
                $buf=New-Object System.Text.StringBuilder(256)
                $null=[Lot05GenuineSetupWindow]::GetWindowText($h,$buf,$buf.Capacity)
                $title=$buf.ToString()
                if($title -match '(?i)Windows Installer' -and $title -match '(?i)Preparing'){
                  $report.windows_installer_transient_seen=$true
                }
                if($title -match '(?i)(Licen[cs]e Agreement|EULA|Terms and Conditions)'){
                  $report.license_title_observed=$true
                  [void]$candidates.Add($h)
                } elseif($title -match '(?i)(Open.?Dental.?Setup|Open Dental|Setup Wizard)'){
                  $report.strong_opendental_wizard_title=$true
                  [void]$candidates.Add($h)
                }
                return $true
              }
              $null=[Lot05GenuineSetupWindow]::EnumWindows($callback,[IntPtr]::Zero)
              if($candidates.Count -eq 1){$winner=$candidates[0];break}
            }
            if($winner -ne [IntPtr]::Zero){
              $pidOut=[uint32]0
              $null=[Lot05GenuineSetupWindow]::GetWindowThreadProcessId($winner,[ref]$pidOut)
              $report.title_captured_from_owned_process=($knownIds -contains [int]$pidOut)
              $r=New-Object Lot05GenuineSetupWindow+Rect
              if($report.title_captured_from_owned_process -and [Lot05GenuineSetupWindow]::GetWindowRect($winner,[ref]$r)){
                $w=[int]($r.Right-$r.Left)
                $h=[int]($r.Bottom-$r.Top)
                if($w -ge 260 -and $h -ge 150 -and $w -le 1600 -and $h -le 1100){
                  $bmp=New-Object System.Drawing.Bitmap($w,$h)
                  try{
                    $g=[System.Drawing.Graphics]::FromImage($bmp)
                    try{
                      $hdc=$g.GetHdc()
                      try{$ok=[Lot05GenuineSetupWindow]::PrintWindow($winner,$hdc,[uint32]0)}
                      finally{$g.ReleaseHdc($hdc)}
                    }finally{$g.Dispose()}
                    if($ok){
                      $bmp.Save($png,[System.Drawing.Imaging.ImageFormat]::Png)
                      if((Get-Item -LiteralPath $png).Length -gt 2048 -and (Get-Item -LiteralPath $png).Length -lt 6000000){
                        $report.trial_setup_window_capture_retained=$true
                        $report.capture_dimensions="$w" + "x" + "$h"
                      }
                    }
                  }finally{$bmp.Dispose()}
                }
              }
            }
            $report.status=if($report.trial_setup_window_capture_retained){
              'OFFICIAL_EMBEDDED_SETUP_FIRST_WINDOW_CAPTURED_NO_INPUT'
            }elseif($report.strong_opendental_wizard_title){
              'OFFICIAL_SETUP_TITLE_SEEN_BUT_IMAGE_NOT_PROVEN'
            }elseif($report.license_title_observed){
              'LICENSE_TITLE_SEEN_BUT_CAPTURE_NOT_PROVEN'
            }else{
              'EMBEDDED_SETUP_LAUNCHED_BUT_UI_NOT_PROVEN'
            }
          }catch{
            $report.refusal_code='OFFICIAL_INNER_SETUP_WINDOW_OR_SOURCE_REFUSED'
            $report.status='SAFE_LAB_PROBE_NOT_PROVEN'
          }finally{
            foreach($childPid in @($knownIds | Select-Object -Unique)){
              try{Stop-Process -Id $childPid -Force -ErrorAction SilentlyContinue}catch{}
            }
            Remove-Item -LiteralPath $exe -Force -ErrorAction SilentlyContinue
            # Ephemeral runner discarded; no patient records or persistent test data.
            $report.db_service_created=(@(Get-Service 'MariaDB','MySQL*' -ErrorAction SilentlyContinue).Count -gt 0)
            [System.IO.File]::WriteAllText($json,($report|ConvertTo-Json -Depth 4),(New-Object System.Text.UTF8Encoding($false)))
          }
          Write-Host ('LOT05_INNER_SETUP_STATUS=' + $report.status)
          Write-Host ('LOT05_INNER_SETUP_LAUNCHED=' + $report.exact_inner_setup_launched_once)
          Write-Host ('LOT05_INNER_SETUP_WIZARD_TITLE=' + $report.strong_opendental_wizard_title)
          Write-Host ('LOT05_INNER_SETUP_LICENSE_TITLE=' + $report.license_title_observed)
          Write-Host ('LOT05_INNER_SETUP_WINDOW_ONLY_PNG=' + $report.trial_setup_window_capture_retained)
          if($report.trial_setup_window_capture_retained -and $report.title_captured_from_owned_process){Add-Content -LiteralPath $env:GITHUB_ENV -Value 'LOT05_SETUP_PNG_OK=1'}
          Write-Host 'LOT05_INNER_SETUP_NO_NEXT_NO_ACCEPT_NO_PATIENT_NO_IMPORT'
          if(-not $report.wrapper_sha256_pinned -or -not $report.wrapper_authenticode_valid -or
             -not $report.vendor_signer_verified -or -not $report.archive_extracted -or
             -not $report.exact_embedded_setup_path_present) { throw 'PUBLISHER_SETUP_PROVENANCE_FAILED' }
      - name: Publish safe vendor metadata (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lot05-step2b-inner-setup-provenance-json
          path: ${{ runner.temp }}/lot05-2b-inner-setup-window-observation.json
          retention-days: 7
          if-no-files-found: warn
      - name: Publish exactly one verified setup WINDOW ONLY PNG (no desktop)
        if: ${{ env.LOT05_SETUP_PNG_OK == '1' }}
        uses: actions/upload-artifact@v4
        with:
          name: lot05-step2b-inner-setup-first-window-only-png
          path: ${{ runner.temp }}/lot05-2b-inner-setup-first-window-only.png
          retention-days: 7
          if-no-files-found: error
