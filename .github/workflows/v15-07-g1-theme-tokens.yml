name: V1.5-07 G1 Theme tokens isolated browser proof

on:
  push:
    branches:
      - feat/v15-07-g1-theme-tokens-proof-20261015
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v15-07-g1-theme-tokens-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-theme-tokens:
    name: Actual React/CSS/browser color inheritance (dormant ViewSlot)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify isolated nonclinical source and script
        shell: bash
        run: |
          set -euo pipefail
          test -f frontend/src/index.css
          test -f frontend/src/features/multiview/ViewSlotThemeFrame.tsx
          test -f frontend/scripts/certify-v15-07-g1-theme-tokens.mjs
          node --check frontend/scripts/certify-v15-07-g1-theme-tokens.mjs
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Install minimal disposable browser dependencies (not product npm graph)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .v15-07-probe
          npm install --prefix .v15-07-probe --no-package-lock --ignore-scripts --no-audit --no-fund \
            react@19.2.0 react-dom@19.2.0 vite@7.3.1 \
            tailwindcss@4.1.18 @tailwindcss/postcss@4.1.18 postcss@8.5.6 \
            playwright@1.55.0
          test ! -e node_modules
          ln -s .v15-07-probe/node_modules node_modules
          node .v15-07-probe/node_modules/playwright/cli.js install --with-deps chromium
      - name: Render real canonical theme CSS in isolated React + Chromium
        shell: bash
        run: |
          set -euo pipefail
          node frontend/scripts/certify-v15-07-g1-theme-tokens.mjs
          test -f artifacts/v15-07-g1-theme-tokens/manifest.json
      - name: Publish screenshots and manifest (no clinical data)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v15-07-g1-theme-tokens-browser-proof
          path: artifacts/v15-07-g1-theme-tokens/
          if-no-files-found: warn
          retention-days: 14
