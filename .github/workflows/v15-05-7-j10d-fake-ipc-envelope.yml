name: V1.5-05.7-J10D Synthetic IPC Envelope Contract
on:
  push:
    branches:
      - feat/v15-05-7j10d-installed-worker-authority-contract-20261019
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fake-envelope-only:
    name: J10D parser-only negative tests (NOT authenticated IPC)
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run bounded synthetic frame tests only
        shell: bash
        run: |
          set -euo pipefail
          python backend/tests/test_legacy_sql_057j10d_fake_ipc_envelope.py -v 2>&1 | tee j10d.log
          grep -q 'Ran 10 tests' j10d.log
          grep -Eq '^OK[[:space:]]*$' j10d.log
      - name: Compile deny-only SCM consumer on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $csc = Get-ChildItem "$env:WINDIR\\Microsoft.NET\\Framework64" -Filter csc.exe -Recurse | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $csc) { throw 'Windows .NET Framework csc.exe missing' }
          $global:PSNativeCommandUseErrorActionPreference = $false
          $source = Join-Path $env:GITHUB_WORKSPACE 'backend/tests/fixtures/lot05j10d_windows_deny_only_consumer.cs'
          $output = Join-Path $env:RUNNER_TEMP 'j10d-deny-only-consumer.exe'
          if ((git rev-parse HEAD).Trim() -ne $env:GITHUB_SHA) { throw 'Checkout SHA mismatch' }
          if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
            throw "C# source missing: $source"
          }
          & $csc /nologo /target:exe "/out:$output" /reference:System.ServiceProcess.dll /reference:System.Core.dll "$source"
          if ($LASTEXITCODE -ne 0) { throw "C# compiler failed: $LASTEXITCODE" }
          # Explicit nonzero exit is the EXPECTED deny path; avoid PowerShell
          # native-command error promotion on runners configured to stop.
          $binary = Join-Path $env:RUNNER_TEMP 'j10d-deny-only-consumer.exe'
          $process = Start-Process -FilePath $binary -Wait -PassThru -NoNewWindow
          if ($process.ExitCode -ne 2) { throw "Expected invalid invocation DENY exit 2; got $($process.ExitCode)" }
      - name: Install and probe actual deny-only SCM consumer on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE/backend/tests/fixtures/lot05j10d_scm_deny_only_probe.ps1"
          if (!$?) { throw 'J10D SCM probe failed' }
      - name: Compile and probe two distinct SCM services (DENY only)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $csc = Get-ChildItem "$env:WINDIR\\Microsoft.NET\\Framework64" -Filter csc.exe -Recurse | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if(!$csc) { throw 'Missing C# compiler' }
          $source = Join-Path $env:GITHUB_WORKSPACE 'backend/tests/fixtures/lot05j10d_windows_scm_caller.cs'
          $output = Join-Path $env:RUNNER_TEMP 'j10d-scm-caller.exe'
          if(!(Test-Path -LiteralPath $source -PathType Leaf)) { throw 'Second SCM caller source missing' }
          $compilerOutput = @(& $csc /nologo /target:exe "/out:$output" /reference:System.ServiceProcess.dll /reference:System.Core.dll "$source" 2>&1)
          $compilerExit = $LASTEXITCODE
          if($compilerExit -ne 0) {
            Write-Host "J10D_CALLER_CSC_EXIT=$compilerExit"
            foreach($line in $compilerOutput) {
              $message = [string]$line
              # Put the actionable compiler code and text at the beginning of
              # each log line, where GitHub mobile does not crop them.
              if($message -match '(error|warning)\s+(CS[0-9]+)\s*:\s*(.*)') {
                Write-Host ("CSC_{0}: {1}" -f $Matches[2],$Matches[3])
              } else {
                Write-Host ("CSC_DETAIL: {0}" -f $message)
              }
            }
            throw "Caller compile failed: $compilerExit"
          }
          & "$env:GITHUB_WORKSPACE/backend/tests/fixtures/lot05j10d_two_scm_deny_probe.ps1"
          if(!$?) { throw 'Two-SCM probe failed' }
      - name: Strict J10D scope and exact SHA
        shell: bash
        env:
          BASE_SHA: 12374a5e3e9f6c16ddf10859f53a8c816077ac36
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          git diff --exit-code "$BASE_SHA" HEAD -- backend/main.py backend/database.py backend/models.py backend/services backend/routers alembic frontend
          git diff --name-only "$BASE_SHA" HEAD | sort > actual.txt
          printf '%s\n' '.github/workflows/v15-05-7-j10d-fake-ipc-envelope.yml' 'backend/tests/fixtures/lot05j10d_fake_ipc_envelope.py' 'backend/tests/fixtures/lot05j10d_scm_deny_only_probe.ps1' 'backend/tests/fixtures/lot05j10d_two_scm_deny_probe.ps1' 'backend/tests/fixtures/lot05j10d_windows_deny_only_consumer.cs' 'backend/tests/fixtures/lot05j10d_windows_scm_caller.cs' 'backend/tests/test_legacy_sql_057j10d_fake_ipc_envelope.py' 'docs/quality/V15_05_7_J10D_INSTALLED_WINDOWS_AUTHORITY_GATE.md' 'techdoubt.md' | sort > expected.txt
          diff -u expected.txt actual.txt
