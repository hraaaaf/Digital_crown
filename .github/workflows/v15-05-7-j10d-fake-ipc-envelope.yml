name: V1.5-05.7-J10D Synthetic IPC Envelope Contract
on:
  push:
    branches:
      - feat/v15-05-7j10d-installed-worker-authority-contract-20261019
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fake-envelope-only:
    name: J10D parser + SCM deny-only adversarial lab (NOT restore IPC)
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test-only RSA verifier dependency (NOT vendor provenance)
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install cryptography==49.0.0
      - name: Run bounded synthetic frame and J10C-format RSA nonce tests
        shell: bash
        run: |
          set -euo pipefail
          python backend/tests/test_legacy_sql_057j10d_fake_ipc_envelope.py -v 2>&1 | tee j10d.log
          grep -q 'Ran 10 tests' j10d.log
          grep -Eq '^OK[[:space:]]*$' j10d.log
          python backend/tests/test_legacy_sql_057j10d_signed_replay_lab.py -v 2>&1 | tee j10d-signed.log
          grep -q 'Ran 10 tests' j10d-signed.log
          grep -Eq '^OK[[:space:]]*$' j10d-signed.log
          ! grep -E '^FAILED|skipped=[0-9]+|^ERROR:' j10d-signed.log
      - name: Enforce external witness NON-ENROLLED DENY-only contract (all platforms)
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python -B backend/tests/test_legacy_sql_057j10d_external_witness_gate.py -v 2>&1 | tee j10d-witness.log
          grep -q 'Ran 12 tests' j10d-witness.log
          grep -Eq '^OK[[:space:]]*$' j10d-witness.log
          grep -q 'J10D_FAKE_ED25519_CRYPTO_OK_BUT_NO_INDEPENDENT_ROOT_PASS' j10d-witness.log
          grep -q 'J10D_EXTERNAL_AUTHORITY_ABSENT_PRODUCT_FAIL_CLOSED_PASS' j10d-witness.log
          grep -q 'J10D_WITNESS_FLOOR_REPLAY_AND_ROLLBACK_REJECTED_LAB_PASS' j10d-witness.log
          grep -q 'J10D_UNENROLLED_EXTERNAL_WITNESS_CLI_DENY_NONZERO_PASS' j10d-witness.log
          ! grep -E '^FAILED|skipped=[0-9]+|^ERROR:' j10d-witness.log
          set +e
          denial="$(python -B backend/tests/fixtures/lot05j10d_external_witness_gate.py 2>&1)"
          result=$?
          set -e
          test "$result" -eq 3
          test "$denial" = 'DENY_J10D_WITNESS_EXTERNAL_AUTHORITY_NOT_ENROLLED'
      - name: Verify fake remote monotonic checkpoint service (not independently trusted)
        shell: bash
        run: |
          set -euo pipefail
          python -B backend/tests/test_legacy_sql_057j10d_fake_offhost_witness_store.py -v 2>&1 | tee j10d-fake-remote.log
          grep -q 'Ran 13 tests' j10d-fake-remote.log
          grep -Eq '^OK[[:space:]]*$' j10d-fake-remote.log
          grep -q 'J10D_FAKE_REMOTE_SIGNED_RECEIPT_STILL_PRODUCT_DENY_PASS' j10d-fake-remote.log
          grep -q 'J10D_FAKE_OFF_LEDGER_CLIENT_ROLLBACK_DENIED_PASS' j10d-fake-remote.log
          grep -q 'J10D_FAKE_REMOTE_SQLITE_SINGLE_ADVANCE_CONCURRENCY_PASS' j10d-fake-remote.log
          grep -q 'J10D_FAKE_REMOTE_LOST_ACK_DOES_NOT_REUSE_CHECKPOINT_PASS' j10d-fake-remote.log
          grep -q 'J10D_FAKE_REMOTE_WORKER_PROCESS_RESTART_ROLLBACK_DENIED_PASS' j10d-fake-remote.log
          grep -q 'J10D_FAKE_REMOTE_COMPLETE_STATE_ROLLBACK_UNPROTECTED_PRODUCT_NO_GO_PASS' j10d-fake-remote.log
          ! grep -E '^FAILED|skipped=[0-9]+|^ERROR:' j10d-fake-remote.log
      - name: Compile deny-only SCM consumer on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $csc = Get-ChildItem "$env:WINDIR\\Microsoft.NET\\Framework64" -Filter csc.exe -Recurse | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $csc) { throw 'Windows .NET Framework csc.exe missing' }
          $global:PSNativeCommandUseErrorActionPreference = $false
          $source = Join-Path $env:GITHUB_WORKSPACE 'backend/tests/fixtures/lot05j10d_windows_deny_only_consumer.cs'
          $output = Join-Path $env:RUNNER_TEMP 'j10d-deny-only-consumer.exe'
          if ((git rev-parse HEAD).Trim() -ne $env:GITHUB_SHA) { throw 'Checkout SHA mismatch' }
          if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
            throw "C# source missing: $source"
          }
          & $csc /nologo /target:exe "/out:$output" /reference:System.ServiceProcess.dll /reference:System.Core.dll "$source"
          if ($LASTEXITCODE -ne 0) { throw "C# compiler failed: $LASTEXITCODE" }
          # Explicit nonzero exit is the EXPECTED deny path; avoid PowerShell
          # native-command error promotion on runners configured to stop.
          $binary = Join-Path $env:RUNNER_TEMP 'j10d-deny-only-consumer.exe'
          $process = Start-Process -FilePath $binary -Wait -PassThru -NoNewWindow
          if ($process.ExitCode -ne 2) { throw "Expected invalid invocation DENY exit 2; got $($process.ExitCode)" }
      - name: Install and probe actual deny-only SCM consumer on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE/backend/tests/fixtures/lot05j10d_scm_deny_only_probe.ps1"
          if (!$?) { throw 'J10D SCM probe failed' }
      - name: Compile and probe two distinct SCM services (DENY only)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $csc = Get-ChildItem "$env:WINDIR\\Microsoft.NET\\Framework64" -Filter csc.exe -Recurse | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if(!$csc) { throw 'Missing C# compiler' }
          $source = Join-Path $env:GITHUB_WORKSPACE 'backend/tests/fixtures/lot05j10d_windows_scm_caller.cs'
          $output = Join-Path $env:RUNNER_TEMP 'j10d-scm-caller.exe'
          if(!(Test-Path -LiteralPath $source -PathType Leaf)) { throw 'Second SCM caller source missing' }
          $compilerOutput = @(& $csc /nologo /target:exe "/out:$output" /reference:System.ServiceProcess.dll /reference:System.Core.dll "$source" 2>&1)
          $compilerExit = $LASTEXITCODE
          if($compilerExit -ne 0) {
            Write-Host "J10D_CALLER_CSC_EXIT=$compilerExit"
            foreach($line in $compilerOutput) {
              $message = [string]$line
              # Put the actionable compiler code and text at the beginning of
              # each log line, where GitHub mobile does not crop them.
              if($message -match '(error|warning)\s+(CS[0-9]+)\s*:\s*(.*)') {
                Write-Host ("CSC_{0}: {1}" -f $Matches[2],$Matches[3])
              } else {
                Write-Host ("CSC_DETAIL: {0}" -f $message)
              }
            }
            throw "Caller compile failed: $compilerExit"
          }
          & "$env:GITHUB_WORKSPACE/backend/tests/fixtures/lot05j10d_two_scm_deny_probe.ps1"
          if(!$?) { throw 'Two-SCM probe failed' }
      - name: Prove third hostile SCM SID denied and reports protected
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & "$env:GITHUB_WORKSPACE/backend/tests/fixtures/lot05j10d_three_scm_sid_adversarial_probe.ps1"
          if (!$?) { throw 'Third-SCM SID negative proof failed' }
      - name: Install actual J10C Windows SCM JWT and SQLCipher FAKE dependencies
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install alembic==1.20.0 sqlalchemy==2.0.28 sqlcipher3==0.6.2 'pydantic[email]==2.6.3' pydantic-settings==2.2.1 fastapi==0.115.6 starlette==0.41.3 httpx==0.28.1 python-jose==3.5.0 passlib==1.7.4 bcrypt==3.2.2 python-multipart==0.0.31 python-dotenv==1.2.1 PyYAML==6.0.3 pytest==9.0.3
          python -c "from sqlcipher3 import dbapi2 as d; c=d.connect(':memory:'); assert c.execute('PRAGMA cipher_version').fetchone()[0]; c.close(); print('J10D_REAL_NATIVE_SQLCIPHER_FAKE_PROVEN')"
      - name: Parse J10D PowerShell SCM authenticated pipe probe
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $path='backend/tests/fixtures/lot05j10d_scm_authenticated_pipe_probe.ps1'
          $tokens=$null; $parseErrors=$null
          [System.Management.Automation.Language.Parser]::ParseFile($path,[ref]$tokens,[ref]$parseErrors) | Out-Null
          if($parseErrors.Count -ne 0) {throw ('J10D_PIPE_PS_SYNTAX '+($parseErrors -join '; '))}
          $path='backend/tests/fixtures/lot05j10d_direct_original_scm_signer_pipe_probe.ps1'
          $tokens=$null; $parseErrors=$null
          [System.Management.Automation.Language.Parser]::ParseFile($path,[ref]$tokens,[ref]$parseErrors) | Out-Null
          if($parseErrors.Count -ne 0) {throw ('J10D_DIRECT_ORIGIN_PS_SYNTAX '+($parseErrors -join '; '))}
      - name: Actual J10C Windows SCM JWT RSA ticket to J10D deny-only replay verifier
        if: runner.os == 'Windows'
        shell: bash
        env:
          LOT05J10B_SQLCIPHER_FAKE_ONLY: '1'
          LOT05J9_SIGNER_SID_FAKE_ONLY: '1'
          LOT05J9_REAL_JWT_SCM_FAKE_ONLY: '1'
          LOT05E_REAL_SQLCIPHER_FAKE_ONLY: '1'
          LOT05I_REAL_JWT_WAL_FAKE_ONLY: '1'
          PYTHONDONTWRITEBYTECODE: '1'
          ENVIRONMENT: cabinet
        run: |
          set -euo pipefail
          PYTHONPATH=. python -B backend/tests/test_legacy_sql_057j10d_j10c_real_issuer_interop.py -v 2>&1 | tee j10d-real-issuer.log
          grep -q '^Ran 1 test' j10d-real-issuer.log
          grep -Eq '^OK[[:space:]]*$' j10d-real-issuer.log
          grep -q 'J10D_J10C_REAL_SCM_RSA_TO_DENY_ONLY_VERIFIER_PASS' j10d-real-issuer.log
          ! grep -E '^FAILED|skipped=[0-9]+|^ERROR: test_' j10d-real-issuer.log
      - name: Strict J10D scope and exact SHA
        shell: bash
        env:
          BASE_SHA: 12374a5e3e9f6c16ddf10859f53a8c816077ac36
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          git diff --exit-code "$BASE_SHA" HEAD -- backend/main.py backend/database.py backend/models.py backend/services backend/routers alembic frontend
          git diff --name-only "$BASE_SHA" HEAD | sort > actual.txt
          printf '%s\n' '.github/workflows/v15-05-7-j10d-fake-ipc-envelope.yml' 'backend/tests/fixtures/lot05j10d_fake_ipc_envelope.py' 'backend/tests/fixtures/lot05j10d_signed_replay_lab.py' 'backend/tests/fixtures/lot05j10d_external_witness_gate.py' 'backend/tests/fixtures/lot05j10d_fake_offhost_witness_store.py' 'backend/tests/fixtures/lot05j10d_scm_deny_only_probe.ps1' 'backend/tests/fixtures/lot05j10d_three_scm_sid_adversarial_probe.ps1' 'backend/tests/fixtures/lot05j10d_two_scm_deny_probe.ps1' 'backend/tests/fixtures/lot05j10d_windows_deny_only_consumer.cs' 'backend/tests/fixtures/lot05j10d_windows_real_ticket_consumer.cs' 'backend/tests/fixtures/lot05j10d_real_issuer_to_installed_consumer_probe.ps1' 'backend/tests/fixtures/lot05j10d_windows_authenticated_pipe_consumer.cs' 'backend/tests/fixtures/lot05j10d_windows_authenticated_pipe_relay.cs' 'backend/tests/fixtures/lot05j10d_scm_authenticated_pipe_probe.ps1' 'backend/tests/fixtures/lot05j10d_windows_direct_scm_jwt_signer.cs' 'backend/tests/fixtures/lot05j10d_direct_original_scm_signer_pipe_probe.ps1' 'backend/tests/fixtures/lot05j10d_windows_scm_caller.cs' 'backend/tests/test_legacy_sql_057j10d_fake_ipc_envelope.py' 'backend/tests/test_legacy_sql_057j10d_signed_replay_lab.py' 'backend/tests/test_legacy_sql_057j10d_external_witness_gate.py' 'backend/tests/test_legacy_sql_057j10d_fake_offhost_witness_store.py' 'backend/tests/test_legacy_sql_057j10d_j10c_real_issuer_interop.py' 'docs/quality/V15_05_7_J10D_INSTALLED_WINDOWS_AUTHORITY_GATE.md' 'techdoubt.md' | sort > expected.txt
          diff -u expected.txt actual.txt
