name: Patient P0-G Medical Source Cert

on:
  push:
    branches:
      - agent/patient-page-p0-rescue
    paths:
      - '.github/workflows/patient-p0g-medical-source-cert.yml'
      - 'backend/models.py'
      - 'backend/schemas/**'
      - 'backend/tests/test_patient_medical_source_truth.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: patient-p0g-medical-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-only-secret-key-minimum-32-characters-long
      DATABASE_URL: "sqlite:///:memory:"
      ENVIRONMENT: development
      TELEMETRY_ENABLED: "false"
      CLOUD_AI_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.12.0 torchvision==0.27.0 --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^(torch|torchvision)([<=>].*)?$' requirements.txt > /tmp/requirements-ci.txt
          pip install -r /tmp/requirements-ci.txt
          pip install httpx==0.27.2 pytest pytest-asyncio
      - name: Single medical source regression
        run: python -m pytest backend/tests/test_patient_medical_source_truth.py -q --maxfail=1
      - name: Write certified proof
        env:
          TESTED_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          Path('docs/PATIENT_P0G_MEDICAL_SOURCE_CERT.json').write_text(json.dumps({
              'status': 'CERTIFIED',
              'tested_sha': os.environ['TESTED_SHA'],
              'run_id': os.environ['RUN_ID'],
              'contracts': ['Patient.antecedents_medicaux canonical', 'no DossierClinique duplicate', 'single API field'],
          }, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PATIENT_P0G_MEDICAL_SOURCE_CERT.json
          git commit -m "test(patient): certify single medical history source"
          git push origin HEAD:${GITHUB_REF_NAME}
