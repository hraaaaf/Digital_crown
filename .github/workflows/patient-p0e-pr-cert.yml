name: Patient P0-E PR Cert

on:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/patient-p0e-pr-cert.yml'
      - 'backend/routers/accounting.py'
      - 'backend/routers/installments.py'
      - 'backend/models.py'
      - 'backend/schemas/installments.py'
      - 'backend/schemas/payments.py'
      - 'backend/tests/test_patient_p0_payment_binding.py'
      - 'backend/tests/test_patient_p0_installment_acte_link.py'
      - 'alembic/versions/**'
  workflow_dispatch:

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ENVIRONMENT: test
      SECRET_KEY: patient-p0e-pr-cert-secret-000001
      DATABASE_URL: sqlite:///:memory:
      TELEMETRY_ENABLED: 'false'
      CLOUD_AI_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.12.0 torchvision==0.27.0 --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^(torch|torchvision)([<=>].*)?$' requirements.txt > /tmp/requirements-p0e-pr.txt
          pip install -r /tmp/requirements-p0e-pr.txt
          pip install httpx==0.27.2 pytest pytest-asyncio
      - name: Payment entity binding contracts
        run: python -m pytest backend/tests/test_patient_p0_payment_binding.py -q --maxfail=1
      - name: Installment to acte binding contracts
        run: python -m pytest backend/tests/test_patient_p0_installment_acte_link.py -q --maxfail=1
      - name: Alembic single head
        run: |
          python -m alembic heads | tee /tmp/heads.txt
          test "$(grep -c '(head)' /tmp/heads.txt)" -eq 1
