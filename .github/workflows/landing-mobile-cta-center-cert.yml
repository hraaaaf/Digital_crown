name: Landing Mobile CTA Center Cert

on:
  push:
    branches: [fix/landing-mobile-cta-center]
    paths:
      - 'frontend/src/pages/LandingPage.tsx'
      - '.github/workflows/landing-mobile-cta-center-cert.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Write capture harness
        working-directory: frontend
        run: |
          cat > landing-mobile-cta-cert.mjs <<'EOF'
          import { chromium } from 'playwright';
          import { createServer } from 'vite';
          import fs from 'node:fs/promises';

          const label = process.env.CAPTURE_LABEL;
          const out = `../artifacts/landing-mobile-cta/${label}`;
          await fs.mkdir(out, { recursive: true });
          const server = await createServer({ server: { host: '127.0.0.1', port: 4177, strictPort: true }, clearScreen: false });
          await server.listen();
          const browser = await chromium.launch();
          try {
            for (const width of [390, 430]) {
              const context = await browser.newContext({ viewport: { width, height: 900 }, locale: 'fr-FR' });
              const page = await context.newPage();
              const errors = [];
              page.on('pageerror', e => errors.push(`pageerror: ${e.message}`));
              page.on('console', m => { if (m.type() === 'error') errors.push(`console: ${m.text()}`); });
              await page.addInitScript(() => localStorage.setItem('digitalcrown_theme', 'ocean'));
              await page.goto('http://127.0.0.1:4177/landing', { waitUntil: 'domcontentloaded' });
              await page.waitForTimeout(700);
              await page.screenshot({ path: `${out}/landing-top-${width}.png`, animations: 'disabled' });
              await fs.writeFile(`${out}/landing-${width}.errors.txt`, errors.join('\n'));
              await context.close();
            }
          } finally {
            await browser.close();
            await server.close();
          }
          EOF
      - name: Capture BEFORE
        working-directory: frontend
        env:
          CAPTURE_LABEL: before
        run: |
          git show origin/master:frontend/src/pages/LandingPage.tsx > src/pages/LandingPage.tsx
          node landing-mobile-cta-cert.mjs
      - name: Capture AFTER
        working-directory: frontend
        env:
          CAPTURE_LABEL: after
        run: |
          git show "$GITHUB_SHA":frontend/src/pages/LandingPage.tsx > src/pages/LandingPage.tsx
          node landing-mobile-cta-cert.mjs
      - name: Assert captures
        run: |
          test $(find artifacts/landing-mobile-cta -name '*.png' | wc -l) -eq 4
          if grep -R -n -E '.+' artifacts/landing-mobile-cta/*/*.errors.txt 2>/dev/null; then exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: landing-mobile-cta-before-after
          path: artifacts/landing-mobile-cta
          retention-days: 14
          if-no-files-found: error
