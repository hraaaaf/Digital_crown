name: LOT05 J10D OralGuard four-class panoramic comparison (experimental)

on:
  pull_request:
    branches: [master]
    paths:
      - 'experiments/lot05_j10d_oralguard_head_to_head.py'
      - '.github/workflows/lot05-j10d-oralguard-dentex-benchmark.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oralguard-research:
    name: OralGuard 4-class 74 DENTEX CPU research-only
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GIT_TERMINAL_PROMPT: '0'
      ULTRALYTICS_AUTOINSTALL: 'False'
      YOLO_CONFIG_DIR: /tmp/lot05-oralguard-config
      WANDB_DISABLED: 'true'
      PYTHONUNBUFFERED: '1'
      LOT05_ORALGUARD_REPORT: lot05-oralguard-head-to-head.json
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Match checkout to exact candidate HEAD
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare ephemeral CPU-only research runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.10.0 torchvision==0.25.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'ultralytics>=8.3.200,<8.4' 'datasets>=4.4,<5' pyarrow==21.0.0
          python -m pip check
      - name: Evaluate 4-class OralGuard at 640 and 1024 on 74 public films
        run: python experiments/lot05_j10d_oralguard_head_to_head.py
      - name: Upload numbers only; exclude all model weights and images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lot05-oralguard-evaluation-${{ github.event.pull_request.head.sha || github.sha }}
          path: lot05-oralguard-head-to-head.json
          if-no-files-found: warn
          retention-days: 30
