          set -euo pipefail
          mapfile -t files < <(npx vitest list --filesOnly --shard=9/12)
          test "${#files[@]}" -gt 0
          for file in "${files[@]}"; do
            echo "::group::vitest $file"
            npx vitest run "$file" --maxWorkers=1 --fileParallelism=false
            echo "::endgroup::"
          done
      - name: Test suite — shard 10/12 isolated files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(npx vitest list --filesOnly --shard=10/12)
          test "${#files[@]}" -gt 0
          for file in "${files[@]}"; do
            echo "::group::vitest $file"
            npx vitest run "$file" --maxWorkers=1 --fileParallelism=false
            echo "::endgroup::"
          done
      - name: Test suite — shard 11/12 isolated files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(npx vitest list --filesOnly --shard=11/12)
          test "${#files[@]}" -gt 0
          for file in "${files[@]}"; do
            echo "::group::vitest $file"
            npx vitest run "$file" --maxWorkers=1 --fileParallelism=false
            echo "::endgroup::"
          done
      - name: Test suite — shard 12/12 isolated files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(npx vitest list --filesOnly --shard=12/12)
          test "${#files[@]}" -gt 0
          for file in "${files[@]}"; do
            echo "::group::vitest $file"
            npx vitest run "$file" --maxWorkers=1 --fileParallelism=false
            echo "::endgroup::"
          done
      - name: Build
        run: npm run build
