name: Temporary D2 tablet sticky fix

on:
  push:
    branches:
      - feat/patient-companion-d2-staff-ui
    paths:
      - '.github/workflows/tmp-d2-fix-tablet-sticky.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/patient-companion-d2-staff-ui
      - name: Patch tablet header breakpoint and self-remove
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('frontend/src/features/patients/PatientDetailsInner.tsx')
          s = p.read_text()
          old = 'className="sm:sticky sm:top-0 z-[300] bg-card-bg/90 backdrop-blur-xl border-b border-border-main shadow-elite"'
          new = 'className="lg:sticky lg:top-0 z-[300] bg-card-bg/90 backdrop-blur-xl border-b border-border-main shadow-elite"'
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one header breakpoint contract, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
          rm .github/workflows/tmp-d2-fix-tablet-sticky.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/features/patients/PatientDetailsInner.tsx .github/workflows/tmp-d2-fix-tablet-sticky.yml
          git commit -m 'fix(patient): prevent tablet companion header overlap'
          git push origin HEAD:feat/patient-companion-d2-staff-ui
