name: LOT05 05.7A Trust Root FUE (synthetic no-op)

on:
  pull_request:
    branches: [master]
    paths:
      - 'backend/services/legacy_migration_trust_root_v15.py'
      - 'backend/tests/test_legacy_sql_057a_trust_root_fue.py'
      - 'docs/quality/V15_05_7A_TRUST_ROOT_PRODUCT_GATE.md'
      - '.github/workflows/v15-05-7a-trust-root-fue.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cryptographic-noop-fue:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install cryptographic FUE dependencies
        run: python -m pip install --disable-pip-version-check pytest cryptography
      - name: Compile verifier
        run: python -m py_compile backend/services/legacy_migration_trust_root_v15.py
      - name: Execute FUE-G05.7A negative and positive no-op cases
        run: python -m pytest backend/tests/test_legacy_sql_057a_trust_root_fue.py -q --noconftest -ra
