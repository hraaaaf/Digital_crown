name: Patient P0 ClinicalHub Baseline

on:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/patient-p0-clinicalhub-baseline.yml'
      - 'frontend/src/features/patients/components/ClinicalHub.tsx'

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ENVIRONMENT: test
      SECRET_KEY: patient-clinicalhub-baseline-secret-000001
      DATABASE_URL: sqlite:///./t2-runtime-cert.db
      TELEMETRY_ENABLED: 'false'
      CLOUD_AI_ENABLED: 'false'
      DEBUG: 'false'
      ALLOWED_ORIGINS: 'http://127.0.0.1:5173,http://localhost:5173'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.12.0 torchvision==0.27.0 --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^(torch|torchvision)([<=>].*)?$' requirements.txt > /tmp/requirements-clinicalhub.txt
          pip install -r /tmp/requirements-clinicalhub.txt
          pip install httpx==0.27.2

      - name: Install frontend and Chromium
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start isolated backend
        run: |
          rm -f t2-runtime-cert.db
          python scripts/t2_runtime_server.py > /tmp/clinicalhub-backend.log 2>&1 &
          for i in {1..90}; do
            if curl -fsS http://127.0.0.1:8005/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/clinicalhub-backend.log
          exit 1

      - name: Start frontend
        working-directory: frontend
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 > /tmp/clinicalhub-front.log 2>&1 &
          for i in {1..90}; do
            if curl -fsS http://127.0.0.1:5173 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/clinicalhub-front.log
          exit 1

      - name: Capture ClinicalHub BEFORE
        working-directory: frontend
        run: |
          mkdir -p ../artifacts/clinicalhub-before
          cat > .clinicalhub-before.mjs <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import { chromium, request } from 'playwright';
          const out=path.resolve('../artifacts/clinicalhub-before');
          const viewports=[{width:390,height:844},{width:430,height:932},{width:768,height:1024},{width:1280,height:900}];
          const api=await request.newContext({baseURL:'http://127.0.0.1:8005'});
          const login=await api.post('/api/auth/login',{form:{username:'t2-browser@cabinet.ma',password:'T2BrowserPass123!'}});
          if(!login.ok()) throw new Error(`login ${login.status()} ${await login.text()}`);
          const tok=await login.json();
          const ps=await api.get('/api/patients',{headers:{Authorization:`Bearer ${tok.access_token}`}});
          if(!ps.ok()) throw new Error(`patients ${ps.status()} ${await ps.text()}`);
          const patient=(await ps.json()).find(p=>p.numero_dossier==='T2-0001');
          if(!patient) throw new Error('T2 patient missing');
          const browser=await chromium.launch({headless:true});
          const evidence=[];
          for(const viewport of viewports){
            const ctx=await browser.newContext({viewport,colorScheme:'light'});
            const page=await ctx.newPage();
            await page.addInitScript(({a,r})=>{localStorage.setItem('token',a);localStorage.setItem('refresh_token',r||'');localStorage.setItem('appMode','prod');},{a:tok.access_token,r:tok.refresh_token});
            const errors=[]; page.on('pageerror',e=>errors.push(String(e)));
            await page.goto(`http://127.0.0.1:5173/patients/${patient.id}?tab=clinical`,{waitUntil:'networkidle',timeout:90000});
            await page.waitForTimeout(900);
            const heading=await page.getByText(/Cerveau Clinique Central|Espace Clinique/).first().count();
            const metrics=await page.evaluate(()=>({scrollWidth:document.documentElement.scrollWidth,clientWidth:document.documentElement.clientWidth,noHorizontalOverflow:document.documentElement.scrollWidth<=document.documentElement.clientWidth+2}));
            const screenshot=`clinicalhub-before-${viewport.width}x${viewport.height}.png`;
            await page.screenshot({path:path.join(out,screenshot),fullPage:false});
            evidence.push({viewport,heading,metrics,errors,screenshot});
            await ctx.close();
          }
          const summary={captures:evidence.length,headingVisibleEverywhere:evidence.every(x=>x.heading===1),overflowFindings:evidence.filter(x=>!x.metrics.noHorizontalOverflow),runtimeErrors:evidence.filter(x=>x.errors.length)};
          fs.writeFileSync(path.join(out,'evidence.json'),JSON.stringify(evidence,null,2));
          fs.writeFileSync(path.join(out,'summary.json'),JSON.stringify(summary,null,2));
          await browser.close(); await api.dispose();
          if(!summary.headingVisibleEverywhere || summary.runtimeErrors.length) process.exit(1);
          JS
          node .clinicalhub-before.mjs
          rm .clinicalhub-before.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: patient-clinicalhub-before
          path: artifacts/clinicalhub-before
          if-no-files-found: error
