name: Ortho F5 BEFORE

on:
  pull_request:
    branches:
      - master
    paths:
      - '.github/workflows/ortho-f5-before.yml'
      - '.audit/ortho-f5-goal.md'
      - 'docs/assets/ortho/f5-superimposition-target.svg'
      - 'frontend/scripts/capture-ortho-f5-before.mjs'
  workflow_dispatch:

permissions:
  contents: read

env:
  F5_BEFORE_BASE: 20bfe3349399bf49a2f5ece14c5f70526e9d4a1b

jobs:
  visual-before:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout proof harness
        uses: actions/checkout@v4
        with:
          path: proof-head
      - name: Checkout certified F4 baseline
        uses: actions/checkout@v4
        with:
          ref: ${{ env.F5_BEFORE_BASE }}
          path: baseline
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: baseline/frontend/package-lock.json
      - name: Install browser dependencies
        working-directory: baseline/frontend
        run: |
          npm ci
          npm install --no-save --package-lock=false --legacy-peer-deps playwright@1.55.0 react-is@19.2.0
          npx playwright install --with-deps chromium
      - name: Capture certified F4/F3 surface as F5 BEFORE
        working-directory: baseline/frontend
        run: |
          test "$(git rev-parse HEAD)" = "$F5_BEFORE_BASE"
          PRODUCT_HEAD="$F5_BEFORE_BASE" F5_BEFORE_BASE="$F5_BEFORE_BASE" node ../../proof-head/frontend/scripts/capture-ortho-f5-before.mjs
      - name: Verify BEFORE contract
        working-directory: baseline/frontend
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const report = JSON.parse(await readFile('ortho-f5-before-artifacts/report.json','utf8'));
          if (report.phase !== 'BEFORE') throw new Error('Wrong phase');
          if (report.productHead !== process.env.F5_BEFORE_BASE) throw new Error('BEFORE is not pinned to certified F4 base');
          if (report.baselineCommit !== process.env.F5_BEFORE_BASE) throw new Error('Missing certified baseline proof');
          if (report.invalidCount !== 0) throw new Error('Invalid BEFORE captures');
          if (report.blockedExternalRequests.length !== 0) throw new Error('Unexpected external egress');
          if (report.captures.length !== 3) throw new Error('Expected three viewports');
          for (const c of report.captures) {
            if (!c.valid) throw new Error('Invalid '+c.viewport);
            if (c.metrics.horizontalOverflow) throw new Error('Overflow '+c.viewport);
          }
          NODE
          for viewport in 390x844 768x1024 1280x900; do
            test -s "ortho-f5-before-artifacts/before-overview-$viewport.png"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ortho-f5-before
          path: baseline/frontend/ortho-f5-before-artifacts
          if-no-files-found: error
          retention-days: 30
