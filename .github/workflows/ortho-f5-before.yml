name: Ortho F5 BEFORE

on:
  pull_request:
    branches:
      - master
    paths:
      - '.github/workflows/ortho-f5-before.yml'
      - '.audit/ortho-f5-goal.md'
      - 'docs/assets/ortho/f5-superimposition-target.svg'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-before:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install browser dependencies
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save --package-lock=false --legacy-peer-deps playwright@1.55.0 react-is@19.2.0
          npx playwright install --with-deps chromium
      - name: Capture exact current F3 as F5 BEFORE
        working-directory: frontend
        run: |
          PRODUCT_HEAD="$GITHUB_SHA" node scripts/capture-ortho-f3-after.mjs
          mkdir -p ortho-f5-before-artifacts
          for viewport in 390x844 768x1024 1280x900; do
            cp "ortho-f3-after-artifacts/after-overview-$viewport.png" "ortho-f5-before-artifacts/before-overview-$viewport.png"
          done
          cp ortho-f3-after-artifacts/vite.log ortho-f5-before-artifacts/vite.log
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const report = JSON.parse(await readFile('ortho-f3-after-artifacts/report.json','utf8'));
          report.lot = 'V1-05-F5';
          report.phase = 'BEFORE';
          report.sourceHarness = 'capture-ortho-f3-after.mjs';
          await writeFile('ortho-f5-before-artifacts/report.json', JSON.stringify(report,null,2));
          NODE
      - name: Verify BEFORE contract
        working-directory: frontend
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const report = JSON.parse(await readFile('ortho-f5-before-artifacts/report.json','utf8'));
          if (report.phase !== 'BEFORE') throw new Error('Wrong phase');
          if (report.invalidCount !== 0) throw new Error('Invalid BEFORE captures');
          if (report.blockedExternalRequests.length !== 0) throw new Error('Unexpected external egress');
          if (report.captures.length !== 3) throw new Error('Expected three viewports');
          for (const c of report.captures) {
            if (!c.valid) throw new Error('Invalid '+c.viewport);
            if (c.metrics.horizontalOverflow) throw new Error('Overflow '+c.viewport);
          }
          NODE
          for viewport in 390x844 768x1024 1280x900; do
            test -s "ortho-f5-before-artifacts/before-overview-$viewport.png"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ortho-f5-before
          path: frontend/ortho-f5-before-artifacts
          if-no-files-found: error
          retention-days: 30
