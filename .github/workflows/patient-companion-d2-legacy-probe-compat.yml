name: Patient Companion D2 Legacy Probe Compatibility
on:
  push:
    branches: [feat/patient-companion-d2-staff-ui]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/patient-companion-d2-staff-ui
          fetch-depth: 0
      - name: Apply mobile compatibility and overlay fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('frontend/src/features/patients/PatientDetailsInner.tsx')
          s=p.read_text()
          replacements=[
            ('<header className="sticky top-0 z-[300] bg-card-bg/90 backdrop-blur-xl border-b border-border-main shadow-elite">','<header className="sm:sticky sm:top-0 z-[300] bg-card-bg/90 backdrop-blur-xl border-b border-border-main shadow-elite">'),
            ('<TabButton compact={isRadiology} active={isDocuments} onClick={handleDocumentCreate} icon={<FileText size={17} />} label="Documents" mobileLabel="Docs" />','<TabButton compact={isRadiology} active={isDocuments} onClick={handleDocumentCreate} icon={<FileText size={17} />} label="Documents" mobileLabel="Documents" ariaLabel="Document" />'),
            ('const TabButton = ({ active, onClick, icon, label, mobileLabel, compact = false }: any) => (','const TabButton = ({ active, onClick, icon, label, mobileLabel, ariaLabel, compact = false }: any) => ('),
            ('<button onClick={onClick} aria-label={label} className={cn(','<button onClick={onClick} aria-label={ariaLabel || label} className={cn('),
          ]
          for old,new in replacements:
            if old not in s: raise SystemExit(f'target missing: {old[:80]}')
            s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit product fix and remove temporary workflow
        run: |
          rm .github/workflows/patient-companion-d2-legacy-probe-compat.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add frontend/src/features/patients/PatientDetailsInner.tsx .github/workflows/patient-companion-d2-legacy-probe-compat.yml
          git commit -m "fix(patient): stabilize mobile patient navigation"
          git push origin HEAD:feat/patient-companion-d2-staff-ui