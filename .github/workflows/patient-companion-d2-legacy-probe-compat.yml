name: Patient Companion D2 Legacy Probe Compatibility
on:
  push:
    branches: [feat/patient-companion-d2-staff-ui]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/patient-companion-d2-staff-ui
          fetch-depth: 0
      - name: Keep compact mobile UI compatible with canonical probes
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('frontend/src/features/patients/PatientDetailsInner.tsx')
          s=p.read_text()
          old='<TabButton compact={isRadiology} active={isDocuments} onClick={handleDocumentCreate} icon={<FileText size={17} />} label="Documents" mobileLabel="Docs" />'
          new='<TabButton compact={isRadiology} active={isDocuments} onClick={handleDocumentCreate} icon={<FileText size={17} />} label="Documents" mobileLabel="Documents" ariaLabel="Document" />'
          if old not in s: raise SystemExit('Documents tab target missing')
          s=s.replace(old,new,1)
          old2='const TabButton = ({ active, onClick, icon, label, mobileLabel, compact = false }: any) => ('
          new2='const TabButton = ({ active, onClick, icon, label, mobileLabel, ariaLabel, compact = false }: any) => ('
          if old2 not in s: raise SystemExit('TabButton signature target missing')
          s=s.replace(old2,new2,1)
          old3='<button onClick={onClick} aria-label={label} className={cn('
          new3='<button onClick={onClick} aria-label={ariaLabel || label} className={cn('
          if old3 not in s: raise SystemExit('TabButton aria target missing')
          s=s.replace(old3,new3,1)
          p.write_text(s)
          PY
      - name: Commit compatibility fix and remove temporary workflow
        run: |
          rm .github/workflows/patient-companion-d2-legacy-probe-compat.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add frontend/src/features/patients/PatientDetailsInner.tsx .github/workflows/patient-companion-d2-legacy-probe-compat.yml
          git commit -m "fix(patient): preserve mobile document probe semantics"
          git push origin HEAD:feat/patient-companion-d2-staff-ui