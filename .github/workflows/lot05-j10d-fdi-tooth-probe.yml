name: LOT05 J10D FDI tooth numbering checkpoint (experimental)

on:
  pull_request:
    branches: [master]
    paths:
      - 'experiments/lot05_j10d_fdi_tooth_model_probe.py'
      - 'experiments/test_lot05_j10d_fdi_tooth_model_probe.py'
      - '.github/workflows/lot05-j10d-fdi-tooth-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fdi-tooth-cpu:
    name: FDI 32-label checkpoint / synthetic CPU contract (no patient data)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONUNBUFFERED: '1'
      GIT_TERMINAL_PROMPT: '0'
      ULTRALYTICS_AUTOINSTALL: 'False'
      YOLO_CONFIG_DIR: /tmp/lot05-fdi-probe
      WANDB_DISABLED: 'true'
      HF_HUB_DISABLE_TELEMETRY: '1'
      PYTHONPATH: experiments
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact research HEAD
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU dependencies on disposable runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.10.0 torchvision==0.25.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'ultralytics>=8.3.200,<8.4' 'huggingface_hub>=0.34,<2'
          python -m pip check
      - name: Verify class mapping and missing-tooth negative tests
        run: python -m unittest -v experiments/test_lot05_j10d_fdi_tooth_model_probe.py
      - name: Verify real 32-class FDI weight on SYNTHETIC image only
        run: python experiments/lot05_j10d_fdi_tooth_model_probe.py --report lot05-fdi-tooth-probe.json
      - name: Keep numbers only (no weights/images/patient metadata)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lot05-fdi-tooth-candidate-${{ github.event.pull_request.head.sha || github.sha }}
          path: lot05-fdi-tooth-probe.json
          if-no-files-found: warn
          retention-days: 21
