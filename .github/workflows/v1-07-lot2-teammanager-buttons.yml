name: V1-07 LOT2 TeamManager Buttons

on:
  pull_request:
    branches: [master]
    paths:
      - "backend/routers/auth.py"
      - "backend/routers/team.py"
      - "backend/tests/test_v1_07_lot2_team_security.py"
      - "frontend/src/features/admin/TeamManager.tsx"
      - "frontend/src/features/admin/TeamManager.buttonMatrix.test.tsx"
      - ".github/workflows/v1-07-lot2-teammanager-buttons.yml"

permissions:
  contents: read

jobs:
  backend-team-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SECRET_KEY: ci-only-secret-key-minimum-32-characters-long
      DATABASE_URL: "sqlite:///:memory:"
      ENVIRONMENT: test
      DIGITALCROWN_ISOLATED_RUNTIME: "true"
      TELEMETRY_ENABLED: "false"
      CLOUD_AI_ENABLED: "false"
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Record exact candidate
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.10.0 torchvision==0.25.0 torchaudio==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^(torch|torchvision|torchaudio)([<=>].*)?$' requirements.txt > /tmp/requirements-ci.txt
          pip install -r /tmp/requirements-ci.txt
          python -m pip check
      - name: Run rejected-identity security test
        run: python -m pytest backend/tests/test_v1_07_lot2_team_security.py -q --maxfail=1

  frontend-teammanager:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Record exact candidate
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Run TeamManager real-button matrix
        working-directory: frontend
        run: npx vitest run src/features/admin/TeamManager.buttonMatrix.test.tsx
