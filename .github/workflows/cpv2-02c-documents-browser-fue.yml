name: CPV2-02C Documents Browser FUE-I (synthetic, NO DEPLOY)

on:
  pull_request:
    paths:
      - .github/workflows/cpv2-02c-documents-browser-fue.yml
      - frontend/scripts/capture-cpv2-02c-documents-fue.mjs
      - frontend/src/features/mobile/Dashboard/views/MobileQuickDocumentSheet.tsx
      - frontend/src/features/mobile/Dashboard/views/MobileQuickDocumentSheet.test.tsx
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpv2-02c-documents-fue-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser-documents:
    name: Pocket documents Chromium + WebKit / 200% / negatives / screenshots
    runs-on: ubuntu-latest
    # Playwright's pinned image contains Chromium/WebKit and OS dependencies.
    # Avoid slow azure.archive.ubuntu.com apt downloads during every FUE run.
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
    timeout-minutes: 20
    steps:
      - name: Checkout immutable PR source HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact HEAD and NO DEPLOY
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(node -e 'const v=require("./vercel.json"); process.stdout.write(String(v.git?.deploymentEnabled))')" = false
          echo "FUE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install isolated frontend runner
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.55.0
          node -e "const { chromium, webkit } = require('playwright'); const fs=require('node:fs'); for (const browser of [chromium, webkit]) { if (!fs.existsSync(browser.executablePath())) throw Error('Pinned Playwright browser missing: ' + browser.executablePath()); }"
      - name: Start local Vite-only component harness
        working-directory: frontend
        run: |
          npm run dev -- --host 127.0.0.1 --port 5174 --strictPort > /tmp/cpv2-02c-vite.log 2>&1 &
          for i in {1..60}; do
            curl -fsS 'http://127.0.0.1:5174/mobile/demo?demo=1' >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/cpv2-02c-vite.log
          exit 1
      - name: Execute real React browser interactions and screen captures (stubbed APIs)
        working-directory: frontend
        env:
          CPV2_DOCS_FUE_URL: http://127.0.0.1:5174/mobile/demo?demo=1
          CPV2_DOCS_FUE_DIR: ../artifacts/cpv2-02c-documents-fue
          CPV2_DOCS_FUE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/capture-cpv2-02c-documents-fue.mjs
      - name: Verify exact-SHA FUE-I evidence count
        env:
          EXPECTED_FUE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const path = require('node:path');
          const root = 'artifacts/cpv2-02c-documents-fue';
          const payload = JSON.parse(fs.readFileSync(path.join(root, 'fue-i-evidence.json'), 'utf8'));
          assert.equal(payload.sha, process.env.EXPECTED_FUE_SHA);
          const records = payload.evidence;
          assert.equal(records.length, 22);
          assert.ok(records.every(record => record.passed && record.mocks));
          assert.deepEqual(new Set(records.map(record => record.engine)), new Set(['chromium', 'webkit']));
          for (const record of records) {
            if (record.case === 'preview-archive') {
              assert.equal(record.counts.previewHits, 1);
              assert.equal(record.counts.archiveHits, 1);
            }
          }
          assert.ok(fs.readdirSync(root).filter(name => name.endsWith('.png')).length >= 50);
          console.log('FUE-I SYNTHETIC 22/22 cases PASS, screenshots captured; FUE-G NOT RUN');
          NODE
      - name: Upload exact-SHA screenshots and evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpv2-02c-documents-fue-i-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            artifacts/cpv2-02c-documents-fue/
          if-no-files-found: warn
          retention-days: 30
