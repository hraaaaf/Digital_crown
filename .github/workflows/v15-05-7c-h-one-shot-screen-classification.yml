name: LOT05 05.7C-H One Shot First-Screen Classification (DISPOSABLE WIN ONLY)

on:
  pull_request:
    types: [synchronize]
    branches: [master]
    paths:
      - '.github/workflows/v15-05-7c-h-one-shot-screen-classification.yml'

permissions:
  contents: read

jobs:
  one-time-first-wizard:
    name: One authorized Install click; classify first new publisher window only
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 1236 && github.event.pull_request.draft == true && github.event.pull_request.head.ref == 'feat/lot05-7c-h-windows-gui-proof-20261108' && github.run_attempt == 1 }}
    runs-on: windows-2022
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
          ref: ${{ github.event.pull_request.head.sha }}
      - name: One-shot commit identity, hosted runner, PowerShell AST, no repeat
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -cne '${{ github.event.pull_request.head.sha }}') { throw 'EXACT_HEAD_REQUIRED_NO_CLICK' }
          if ((git rev-parse HEAD^).Trim() -cne 'deb0b75f940e77cf87033ca45da9fbf0b46704b2') { throw 'ONE_SHOT_PARENT_CHANGED_NO_CLICK' }
          $changed = @(git diff --name-only HEAD^ HEAD)
          if ($changed.Count -ne 1 -or $changed[0] -cne '.github/workflows/v15-05-7c-h-one-shot-screen-classification.yml') {
            throw 'ONE_SHOT_COMMIT_NOT_EXCLUSIVE_NO_CLICK'
          }
          if ($env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or $env:RUNNER_OS -cne 'Windows') {
            throw 'GITHUB_HOSTED_WINDOWS_REQUIRED_NO_CLICK'
          }
          foreach ($path in @(
            './scripts/quality/v15_05_7c_h_windows_gui_capability_probe.ps1',
            './scripts/quality/v15_05_7c_h_signed_vendor_window_probe.ps1'
          )) {
            $tokens = $null
            $errors = @()
            $null = [System.Management.Automation.Language.Parser]::ParseFile($path,[ref]$tokens,[ref]$errors)
            if ($errors.Count -ne 0) {
              foreach ($err in $errors) {
                Write-Host ('AST_ERROR line=' + $err.Extent.StartLineNumber + ' id=' + $err.ErrorId)
              }
              throw 'POWERSHELL_AST_INVALID_NO_CLICK'
            }
          }
          Write-Host 'LOT05H_ONE_SHOT_EXACT_SHA_AST_VALID'
      - name: Synthetic interactive WinForms proof (no vendor)
        shell: pwsh
        run: |
          & powershell.exe -NoLogo -NoProfile -STA -ExecutionPolicy Bypass -File './scripts/quality/v15_05_7c_h_windows_gui_capability_probe.ps1'
          if ($LASTEXITCODE -ne 0) { throw 'SYNTHETIC_GUI_NOT_READY_NO_CLICK' }
          $cap = Get-Content (Join-Path $env:RUNNER_TEMP 'lot05-7c-h-gui-capability-metadata-only.json') -Raw | ConvertFrom-Json
          if (-not $cap.synthetic_textbox_keyboard_roundtrip -or
              -not $cap.synthetic_bm_click_proven -or
              -not $cap.synthetic_bm_click_handler_fired) { throw 'SYNTHETIC_NO_EVENT_NO_CLICK' }
          Write-Host 'LOT05H_SYNTHETIC_EVENT_PRECONDITION_PROVEN'
      - name: First-screen bounded semantic classification after ONE Install click (NO EULA)
        shell: pwsh
        run: |
          & powershell.exe -NoLogo -NoProfile -STA -ExecutionPolicy Bypass -File './scripts/quality/v15_05_7c_h_signed_vendor_window_probe.ps1' -ReadOnlyButtonOwnershipProbe -LaunchSetupWizardViaPhysicalInputOnly
          if ($LASTEXITCODE -ne 0) { throw 'BOUNDED_VENDOR_PROBE_ERROR' }
      - name: Fail closed if post-click semantic identity or no-install safety missing
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = Join-Path $env:RUNNER_TEMP 'lot05-7c-h-official-vendor-gui-window-metadata-only.json'
          if (-not (Test-Path -LiteralPath $path)) { throw 'VENDOR_JSON_MISSING' }
          $v = Get-Content -LiteralPath $path -Raw -Encoding UTF8 | ConvertFrom-Json
          if (-not $v.official_binary_sha256_pinned -or
              -not $v.official_binary_authenticode_valid -or
              -not $v.install_button_owner_queryable -or
              $v.install_button_same_process_as_vendor_window -ne $true -or
              $v.install_button_same_thread_as_vendor_window -ne $true -or
              $v.install_button_same_process_as_runner -ne $false -or
              -not $v.install_button_parent_chain_contains_vendor_window -or
              -not $v.physical_input_probe_requested -or
              -not $v.physical_input_hit_target_verified -or
              -not $v.install_button_invocation_attempted -or
              $v.physical_input_events_accepted -ne 2 -or
              $v.install_button_message_delivered -or
              -not $v.setup_wizard_new_window_observed -or
              -not $v.post_click_screen_read_only_probe_requested -or
              -not $v.post_click_screen_new_hwnd_verified -or
              -not $v.post_click_screen_process_lineage_bound -or
              -not $v.post_click_screen_uia_queryable -or
              $v.post_click_screen_kind -cne 'SETUP_WIZARD_SEMANTICALLY_PROVEN' -or
              $v.db_service_preexisting -or
              $v.db_service_created_observed -or
              $v.licence_or_eula_accepted -or
              $v.clicked_wizard_next -or
              $v.database_installed -or
              $v.official_trial_installer_completed -or
              $v.gui_product_launched -or
              $v.publisher_gui_csv_export_verified -or
              $v.target_rows_written -ne 0 -or
              $v.import_permitted) {
            throw 'FIRST_WIZARD_EVIDENCE_NOT_PROVEN_OR_UNSAFE_FAIL_CLOSED'
          }
          Write-Host 'LOT05H_FIRST_SCREEN_SEMANTICALLY_PROVEN_NO_EULA_NO_DB_NO_PATIENTS'
      - name: Upload sanitized JSON only, even if refused (no post-click screenshot)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lot05-7c-h-one-shot-first-screen-classification-JSON-only
          path: ${{ runner.temp }}/lot05-7c-h-official-vendor-gui-window-metadata-only.json
          if-no-files-found: warn
          retention-days: 5
