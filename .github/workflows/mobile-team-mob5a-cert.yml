name: Mobile Team MOB-5A Cert

on:
  push:
    branches: [audit/mobile-secondary-value-mob5]
    paths:
      - .github/workflows/mobile-team-mob5a-cert.yml
      - frontend/src/features/mobile/**
      - frontend/scripts/capture-mobile-team-mob5a-after.mjs
      - docs/ux/DIGITAL_CROWN_MOBILE_TEAM_MOB5A_GOAL_UI.md
  workflow_dispatch:

concurrency:
  group: mobile-team-mob5a-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    name: MOB-5A contracts + build + same-viewport AFTER
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Record exact candidate
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          echo "candidate=${{ github.sha }}"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Verify MOB-5A contracts
        working-directory: frontend
        run: >-
          npx vitest run
          src/features/mobile/bridge.m5a.test.ts
          src/features/mobile/Dashboard/components/MobileBottomNav.test.tsx
          src/test/mobileM64ContextualBridge.test.ts
          src/features/mobile/mobileThemeHardcoding.test.ts

      - name: Verify production frontend build
        working-directory: frontend
        run: npm run build

      - name: Install Chromium evidence runner
        working-directory: frontend
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start isolated real-app preview harness
        working-directory: frontend
        env:
          VITE_DC_PREVIEW_DEMO: "1"
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 >/tmp/mob5a-vite.log 2>&1 &
          for i in {1..60}; do
            curl -fsS 'http://127.0.0.1:5173/mobile/demo?demo=1' >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/mob5a-vite.log
          exit 1

      - name: Capture and assert MOB-5A AFTER at canonical viewports
        working-directory: frontend
        env:
          MOBILE_EVIDENCE_URL: http://127.0.0.1:5173/mobile/demo?demo=1
          MOBILE_EVIDENCE_DIR: ../artifacts/mobile-team-mob5a-after
        run: node scripts/capture-mobile-team-mob5a-after.mjs

      - name: Verify PNG dimensions and record evidence
        run: |
          python - <<'PY'
          from pathlib import Path
          import struct

          expected = {
              'after-team-390x844.png': (390, 844),
              'after-team-430x932.png': (430, 932),
              'after-team-768x1024.png': (768, 1024),
          }
          root = Path('artifacts/mobile-team-mob5a-after')
          for name, dims in expected.items():
              data = (root / name).read_bytes()
              if data[:8] != b'\x89PNG\r\n\x1a\n':
                  raise SystemExit(f'{name}: not a PNG')
              width, height = struct.unpack('>II', data[16:24])
              if (width, height) != dims:
                  raise SystemExit(f'{name}: got {(width, height)}, expected {dims}')
              print(f'{name}: {width}x{height} OK')
          PY
          printf 'head=%s\nviewports=390x844,430x932,768x1024\nentry=Plus->Equipe\ncanonical_nav=preserved\nhorizontal_overflow=none-required\nruntime_errors=none-required\ntheme=runtime-settings-driven\ndeployment=none\n' '${{ github.sha }}' > artifacts/mobile-team-mob5a-after/result.txt
          cp /tmp/mob5a-vite.log artifacts/mobile-team-mob5a-after/vite.log

      - uses: actions/upload-artifact@v4
        with:
          name: mobile-team-mob5a-after
          path: artifacts/mobile-team-mob5a-after
          if-no-files-found: error
          retention-days: 30
