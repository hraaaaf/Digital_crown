name: Mobile Routing MOB-6 BEFORE

on:
  push:
    branches: [ux/mobile-routing-mob6]
    paths:
      - .github/workflows/mobile-routing-mob6-before.yml
      - frontend/scripts/capture-mobile-routing-mob6-before.mjs
  workflow_dispatch:

concurrency:
  group: mobile-routing-mob6-before-${{ github.ref }}
  cancel-in-progress: false

jobs:
  before:
    name: BEFORE routing 390 430 768
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout branch harness
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Freeze corrected harness then checkout exact pre-implementation head
        run: |
          cp frontend/scripts/capture-mobile-routing-mob6-before.mjs /tmp/capture-mobile-routing-mob6-before.mjs
          git checkout --detach d5bf9439e8eae60c1d0c8616a92353041fb5ac9a
          cp /tmp/capture-mobile-routing-mob6-before.mjs frontend/scripts/capture-mobile-routing-mob6-before.mjs
          test "$(git rev-parse HEAD)" = "d5bf9439e8eae60c1d0c8616a92353041fb5ac9a"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Install Playwright runner
        working-directory: frontend
        run: npm install --no-save --package-lock=false playwright@1.63.0

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start isolated frontend
        working-directory: frontend
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 >/tmp/mobile-routing-mob6-before-vite.log 2>&1 &
          for i in {1..60}; do
            curl -fsS 'http://127.0.0.1:5173/login' >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/mobile-routing-mob6-before-vite.log
          exit 1

      - name: Capture and assert immutable BEFORE
        working-directory: frontend
        env:
          PRODUCT_HEAD: 301454a367b8b7952d0fef94e86c40e8e4a248e2
          ARTIFACT_DIR: ../artifacts/mobile-routing-mob6-before
        run: node scripts/capture-mobile-routing-mob6-before.mjs

      - name: Preserve harness log
        if: always()
        run: cp /tmp/mobile-routing-mob6-before-vite.log artifacts/mobile-routing-mob6-before/vite.log || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-routing-mob6-before
          path: artifacts/mobile-routing-mob6-before
          if-no-files-found: error
          retention-days: 30
