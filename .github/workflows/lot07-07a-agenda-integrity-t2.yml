name: LOT07 07-A Agenda Integrity Authenticated T2
on:
  pull_request:
    paths:
      - 'frontend/src/features/agenda/**'
      - 'frontend/scripts/lot07-07a-agenda-integrity-t2.mjs'
      - '.github/workflows/lot07-07a-agenda-integrity-t2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrity-t2:
    name: Real FastAPI CRUD + 409/403/401 + tenant isolation on disposable SQLite
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      ENVIRONMENT: test
      DIGITALCROWN_ISOLATED_RUNTIME: '1'
      DATABASE_URL: sqlite:///./t2-runtime-cert.db
      TELEMETRY_ENABLED: 'false'
      CLOUD_AI_ENABLED: 'false'
      DEBUG: 'false'
      ALLOWED_ORIGINS: http://127.0.0.1:5173,http://localhost:5173
      T2_USER: t2-browser@cabinet.ma
    steps:
      - name: Checkout exact source, never master clinic data
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_HEAD }}
          persist-credentials: false
      - name: Attest source and isolated DB
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"
          test "$ENVIRONMENT" = test
          test "$DIGITALCROWN_ISOLATED_RUNTIME" = 1
          test "$DATABASE_URL" = sqlite:///./t2-runtime-cert.db
          test ! -e t2-runtime-cert.db
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Create masked disposable T2 password
        run: |
          value="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          echo "::add-mask::$value"
          echo "T2_PASSWORD=$value" >> "$GITHUB_ENV"
      - name: Install isolated backend (not production)
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install torch==2.10.0 torchvision==0.25.0 torchaudio==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^(torch|torchvision|torchaudio)([<=>].*)?$' requirements.txt >/tmp/lot07-agenda-integrity-reqs.txt
          pip install -r /tmp/lot07-agenda-integrity-reqs.txt
      - name: Verify T2 DB fingerprint after dependencies
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import os
          from backend.core.runtime_safety import is_known_cabinet_database, database_target_fingerprint
          target='sqlite:///./t2-runtime-cert.db'
          assert os.environ['ENVIRONMENT']=='test'
          assert os.environ['DIGITALCROWN_ISOLATED_RUNTIME']=='1'
          assert os.environ['DATABASE_URL']==target
          assert not is_known_cabinet_database(target)
          print('DIGITALCROWN_ISOLATION_DB_FINGERPRINT='+database_target_fingerprint(target))
          PY
      - name: Install only isolated Playwright API runtime
        working-directory: frontend
        run: |
          set -euo pipefail
          npm ci
          mkdir -p /tmp/lot07-agenda-integrity-playwright
          npm install --prefix /tmp/lot07-agenda-integrity-playwright --no-save --ignore-scripts --no-audit --no-fund playwright@1.55.0
          ln -s /tmp/lot07-agenda-integrity-playwright/node_modules/playwright node_modules/playwright
      - name: Start genuine disposable FastAPI
        run: |
          set -euo pipefail
          test -n "${DIGITALCROWN_ISOLATION_DB_FINGERPRINT:-}"
          python scripts/t2_runtime_server.py >/tmp/lot07-agenda-integrity-api.log 2>&1 &
          for i in {1..110}; do
            if curl -fsS http://127.0.0.1:8005/health >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8005/health >/dev/null
      - name: Test exact-source authenticated CRUD and negative security
        working-directory: frontend
        run: |
          set -euo pipefail
          node scripts/run-with-t2-workstation.mjs scripts/lot07-07a-agenda-integrity-t2.mjs
      - name: Sanitized startup diagnostics on failure
        if: failure()
        run: |
          tail -70 /tmp/lot07-agenda-integrity-api.log || true
