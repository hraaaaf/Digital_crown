name: Agenda A2 BEFORE Visual Certification

on:
  pull_request:
    paths:
      - ".github/workflows/agenda-a2-before-visual.yml"
      - "frontend/src/features/agenda/**"
      - "frontend/src/features/clinic/**"
      - "frontend/src/pages/AgendaPage.tsx"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agenda-a2-before-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  capture-before:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend and Chromium
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Inject deterministic A2 BEFORE harness
        working-directory: frontend
        run: |
          cat > agenda-a2-before.html <<'EOF'
          <!doctype html><html lang="fr"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Agenda A2 BEFORE</title></head><body><div id="root"></div><script type="module" src="/src/agenda-a2-before.tsx"></script></body></html>
          EOF

          cat > src/agenda-a2-before.tsx <<'EOF'
          import React from 'react';
          import { createRoot } from 'react-dom/client';
          import { MemoryRouter } from 'react-router-dom';
          import './index.css';
          import { AgendaPage } from './pages/AgendaPage';
          import { ClinicPractitionerBar } from './features/clinic/ClinicPractitionerBar';
          import { useAuthStore } from './stores/useAuthStore';

          useAuthStore.setState({
            user: { id:1, email:'owner@agenda-a2.local', nom_complet:'Dr Lina Alaoui', role:'ADMIN', is_superadmin:false, permissions:{} } as any,
            isAuthenticated:true, isLoading:false, error:null,
          });

          createRoot(document.getElementById('root')!).render(
            <MemoryRouter initialEntries={['/agenda']}>
              <div className="min-h-screen min-w-0 overflow-x-hidden bg-slate-50 p-3 sm:p-4 lg:p-6">
                <ClinicPractitionerBar />
                <div className="mt-4 min-w-0"><AgendaPage /></div>
              </div>
            </MemoryRouter>,
          );
          EOF

          cat > agenda-a2-before.mjs <<'EOF'
          import { chromium } from 'playwright';
          import { createServer } from 'vite';
          import fs from 'node:fs/promises';

          const out='agenda-a2-before';
          await fs.mkdir(out,{recursive:true});
          const json=(body,status=200)=>({status,contentType:'application/json',body:JSON.stringify(body)});

          const mk=(id,patient_name,praticien_id,datetime_start,duration_minutes,motif,status='PRÉVU')=>({
            id,patient_name,patient_id:id+1000,praticien_id,datetime_start,duration_minutes,motif,status,
            scheduling_type:'EXACT_TIME',reminder_sent:false,
          });
          const lina=[
            mk(201,'Sara El Amrani',1,'2026-09-16T09:00:00',30,'Consultation'),
            mk(202,'Adam Tazi',1,'2026-09-16T11:00:00',45,'Endodontie','CONFIRMÉ'),
            mk(203,'Nora Idrissi',1,'2026-09-17T15:00:00',30,'Contrôle'),
          ];
          const youssef=[
            mk(211,'Yasmine Fassi',2,'2026-09-16T09:00:00',60,'Prothèse','CONFIRMÉ'),
            mk(212,'Omar Bennani',2,'2026-09-16T14:30:00',30,'Consultation'),
          ];
          const salma=[
            mk(221,'Aya Alaoui',3,'2026-09-16T10:30:00',30,'Contrôle'),
            mk(222,'Mehdi Kabbaj',3,'2026-09-18T16:00:00',45,'Chirurgie','EN_S_ATTENTE'),
          ];
          const legacy=[mk(299,'Legacy non assigné',null,'2026-09-16T12:00:00',30,'RDV historique')];

          const multiPractitioner={
            plan:'ELITE',
            dentists:[
              {dentist_id:1,dentist_name:'Dr Lina Alaoui',appointments:lina},
              {dentist_id:2,dentist_name:'Dr Youssef Benali',appointments:youssef},
              {dentist_id:3,dentist_name:'Dr Salma Idrissi',appointments:salma},
            ],
            legacy_unassigned:legacy,
            total_appointments:lina.length+youssef.length+salma.length+legacy.length,
          };

          const all=[...lina,...youssef,...salma,...legacy];
          const fixtures={
            '/api/admin/cabinet/me':{header_lines_fr:['Clinique A2']},
            '/api/clinics/me':{nom_praticien:'Dr Lina Alaoui',nom_cabinet:'Clinique A2',header_lines_fr:['Dr Lina Alaoui'],specialty_ids:[],contacts_json:{}},
            '/api/agenda/settings':{id:1,opening_time_morning:'09:00',closing_time_morning:'13:00',opening_time_afternoon:'14:00',closing_time_afternoon:'18:00',is_continuous:false,agenda_mode:'EXACT',use_tickets:true},
            '/api/agenda/exceptions':[],
            '/api/appointments/pending':[],
            '/api/upcoming-holidays':[],
            '/api/agenda/upcoming-holidays':[],
            '/api/team/':[],
            '/api/team':[],
            '/api/team/quota':{plan:'ELITE',dentistes_used:3,dentistes_max:null,secretaires_used:1,secretaires_max:null,pending_count:0,can_add_dentiste:true,can_add_secretaire:true},
          };

          const server=await createServer({server:{host:'127.0.0.1',port:4198,strictPort:true},clearScreen:false});
          await server.listen();
          const browser=await chromium.launch();
          const report=[];
          try {
            for(const [width,height] of [[390,844],[768,1024],[1280,900]]){
              const context=await browser.newContext({viewport:{width,height},locale:'fr-FR',timezoneId:'Africa/Casablanca'});
              const page=await context.newPage();
              const errors=[];
              page.on('pageerror',e=>errors.push(`pageerror: ${e.message}`));
              page.on('console',m=>{if(m.type()==='error')errors.push(`console: ${m.text()}`)});
              await page.route('**/api/**',async route=>{
                const req=route.request(); const url=new URL(req.url());
                if(url.pathname==='/api/appointments/multi-practitioner') return route.fulfill(json(multiPractitioner));
                if(url.pathname==='/api/appointments/' || url.pathname.startsWith('/api/appointments?')) return route.fulfill(json(all));
                if(url.pathname.startsWith('/api/appointments')) return route.fulfill(json(url.pathname==='/api/appointments/pending'?[]:all));
                if(url.pathname==='/api/patients/') return route.fulfill(json([]));
                if(req.method()!=='GET') return route.fulfill(json({}));
                return route.fulfill(json(fixtures[url.pathname] ?? {}));
              });

              await page.goto('http://127.0.0.1:4198/agenda-a2-before.html',{waitUntil:'networkidle'});
              await page.getByRole('heading',{name:'Agenda'}).waitFor({state:'visible',timeout:15000});
              await page.getByRole('button',{name:'Multi',exact:true}).click();
              await page.getByText('Dr Lina Alaoui',{exact:true}).last().waitFor({state:'visible',timeout:15000});
              await page.getByText('Dr Youssef Benali',{exact:true}).last().waitFor({state:'visible',timeout:15000});
              await page.getByText('Dr Salma Idrissi',{exact:true}).last().waitFor({state:'visible',timeout:15000});

              const metrics=await page.evaluate(()=>({
                clientWidth:document.documentElement.clientWidth,
                scrollWidth:document.documentElement.scrollWidth,
                bodyScrollWidth:document.body.scrollWidth,
                multiText:document.body.innerText.includes('Legacy non assigné'),
              }));
              const row={width,height,...metrics,overflowPx:Math.max(0,metrics.scrollWidth-metrics.clientWidth),errors};
              report.push(row);
              await fs.writeFile(`${out}/agenda-multi-${width}x${height}.json`,JSON.stringify(row,null,2));
              await page.screenshot({path:`${out}/agenda-multi-${width}x${height}.png`,fullPage:true,animations:'disabled'});
              if(errors.length) throw new Error(`runtime errors at ${width}: ${errors.join(' | ')}`);
              await context.close();
            }
            await fs.writeFile(`${out}/report.json`,JSON.stringify(report,null,2));
          } finally { await browser.close(); await server.close(); }
          EOF

      - name: Capture immutable BEFORE at 390 / 768 / 1280
        working-directory: frontend
        run: node agenda-a2-before.mjs

      - name: Verify BEFORE evidence
        working-directory: frontend
        run: |
          test "$(find agenda-a2-before -name '*.png' | wc -l)" -eq 3
          test "$(find agenda-a2-before -name 'agenda-multi-*.json' | wc -l)" -eq 3
          cat > agenda-a2-before/metadata.txt <<EOF
          phase=BEFORE
          product_base_sha=bc3d8d145670dc70dc6c6842e772e56d1d89aa99
          capture_head_sha=${{ github.event.pull_request.head.sha || github.sha }}
          viewports=390x844,768x1024,1280x900
          screen=agenda-multi-practitioner
          expected_current_contract=vertical appointment lists per practitioner; legacy_unassigned returned by API but not rendered
          goal_A2=shared synchronized time axis; one practitioner lane each; explicit legacy blocker; lane-based creation; no silent reassignment
          EOF

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agenda-a2-before-visual-evidence
          path: frontend/agenda-a2-before/
          if-no-files-found: error
          retention-days: 14
