name: CEPH PDF Premium V3 — Shared Cabinet Document Identity
on:
  pull_request:
    paths:
      - 'backend/services/document_factory.py'
      - 'backend/services/document_branding_contract.py'
      - 'backend/services/cephalo_pdf_presentation.py'
      - 'backend/services/generators/bilan_ortho_gen.py'
      - 'backend/templates/bilan_ortho_authoritative.html'
      - 'tests/test_cephalo_premium_pdf_v3_contract.py'
      - '.github/workflows/ceph-pdf-premium-v3.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-five-template-pdf:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Confirm exact review HEAD
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test -z "$(git status --porcelain)"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install print-only runtime and backend imports
        run: |
          python -m pip install 'Jinja2==3.1.6' 'weasyprint==68.1' 'PyPDF2==3.0.1' \
            'reportlab==4.4.10' 'arabic-reshaper==3.0.0' 'python-bidi==0.6.7' \
            'qrcode==8.2' 'svglib==1.5.1' 'pillow==12.2.0' \
            'SQLAlchemy==2.0.28' 'pydantic==2.6.3' 'fastapi==0.115.6' \
            'python-jose==3.5.0' 'python-multipart==0.0.31'
      - name: Compile and test synthetic clinician-facing PDF contracts
        run: |
          python -m compileall -q backend/services/document_branding_contract.py backend/services/cephalo_pdf_presentation.py backend/services/generators/bilan_ortho_gen.py
          python -m unittest discover -s tests -p 'test_cephalo_premium_pdf_v2_contract.py' -v
          python -m unittest discover -s tests -p 'test_cephalo_premium_pdf_v3_contract.py' -v
