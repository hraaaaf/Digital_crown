name: CB-03 integration-only reconciliation check

on:
  push:
    branches:
      - integration/cb03-g9-on-master-20261027
    paths:
      - .github/workflows/cb03-integration-reconcile.yml
      - backend/main.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cb03-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  only-merged-router-and-bilan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ENVIRONMENT: test
      DIGITALCROWN_ISOLATED_RUNTIME: "1"
      CLOUD_AI_ENABLED: "false"
      TELEMETRY_ENABLED: "false"
      SECRET_KEY: "integration-rehearsal-synthetic-key-at-least-32bytes"
      CROWN_BOT_DETERMINISTIC_WORKFLOWS_ENABLED: "false"
      CROWN_BOT_GUIDED_NLU_ENABLED: "false"
      CROWN_BOT_CB03_PREPARATION_ENABLED: "false"
      CROWN_BOT_CB03_STATUS_PREPARATION_ENABLED: "false"
      CROWN_BOT_CB03_CONFIRMATION_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check only the reconciliation delta; preserve G7/G8/G9 certifications
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          python -m py_compile backend/main.py
          python - <<'PY'
          from pathlib import Path
          source=Path("backend/main.py").read_text(encoding="utf-8")
          needles=(
              "bot_cb03_safe_actions.router",
              "bot_cb03_status_prepare.router",
              "bot_cb03_confirm_g2.router",
              "linked_bilans = db.query(models.DocumentArchive)",
              "Lecture BILAN via route dédiée uniquement.",
          )
          for needle in needles:
              assert source.count(needle)==1,("MISSING_OR_DUPLICATE",needle)
          print("CB03_INTEGRATION_MAIN_STATIC_CONTRACT_PASS")
          PY
      - name: Install synthetic FastAPI test dependencies only
        run: |
          set -euo pipefail
          pip install torch==2.10.0 torchvision==0.25.0 torchaudio==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^(torch|torchvision|torchaudio)' requirements.txt > /tmp/cb03-integration-req.txt
          pip install -r /tmp/cb03-integration-req.txt
          pip install pytest
          python -m pip check
      - name: New integration-only contract — document BILAN and Crown Bot entrypoint
        run: |
          set -euo pipefail
          python -m pytest -q -s \
            backend/tests/test_lot07_r2_bilan_readonly_dec01.py \
            backend/tests/test_bot_cb03_g2_confirm.py::test_flag_off_blocks_confirm_and_reconcile \
            backend/tests/test_bot_cb03_g2_confirm.py::test_status_confirm_atomic_success_replay_reconciliation
          python - <<'PY'
          from backend.main import app
          actual={(r.path,m) for r in app.routes for m in getattr(r,"methods",set())}
          required={
            ("/api/bot/guided/prepare-appointment","POST"),
            ("/api/bot/guided/prepare-status","POST"),
            ("/api/bot/guided/confirm","POST"),
            ("/api/bot/guided/actions/{preparation_id}","GET"),
          }
          assert required <= actual,("MISSING_ROUTING",sorted(required-actual))
          for path,method in required:
              assert sum((r.path==path and method in getattr(r,"methods",set())) for r in app.routes)==1,(path,method)
          print("CB03_INTEGRATION_REAL_APP_ROUTER_REGISTRY_PASS",flush=True)
          PY
      - name: Document exact scope
        if: always()
        run: |
          echo "Only newly reconciled backend/main.py was integration-tested: static BILAN guard, exact CB-03 route registration, 5 synthetic BILAN HTTP policy scenarios and 2 CB-03 G2 HTTP scenarios." >> "$GITHUB_STEP_SUMMARY"
          echo "G7 #40496890801, G8 #40504497364 and G9 #40510856505 remain prior GREEN proofs, deliberately NOT rerun." >> "$GITHUB_STEP_SUMMARY"
          echo "Integration branch is not master. No merge to master, deployment or clinical enablement." >> "$GITHUB_STEP_SUMMARY"
