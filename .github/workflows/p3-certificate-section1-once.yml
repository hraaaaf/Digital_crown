name: P3 Certificate Section 1 Patch

on:
  push:
    branches:
      - work-20260815-p3-certificat-type-motif

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply deterministic patch
        run: python scripts/p3_certificate_section1_patch.py
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run focused frontend tests
        working-directory: frontend
        run: npm test -- CertificatePolicy.test.ts CertificateForm.p3a.test.tsx CertificateForm.section1.test.tsx
      - name: Install minimal backend test dependencies
        run: pip install -r backend/requirements.txt
      - name: Run focused backend date tests
        run: pytest -q backend/tests/test_certificate_date_policy.py
      - name: Remove one-off patch machinery
        run: |
          rm scripts/p3_certificate_section1_patch.py
          rm .github/workflows/p3-certificate-section1-once.yml
      - name: Commit product changes only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(p3): make certificate type selection explicit"
          git push origin HEAD:work-20260815-p3-certificat-type-motif
