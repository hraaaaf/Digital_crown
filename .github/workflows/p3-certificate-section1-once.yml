name: P3 Certificate Section 1 Patch

on:
  push:
    branches:
      - work-20260815-p3-certificat-type-motif

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply deterministic patches
        run: |
          python scripts/p3_certificate_section1_patch.py
          python scripts/p3_certificate_section1_followup.py
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run focused frontend tests
        working-directory: frontend
        run: npm test -- CertificatePolicy.test.ts CertificateForm.p3a.test.tsx CertificateForm.section1.test.tsx CertificateForm.suggestion.test.tsx
      - name: Install focused generator dependencies
        run: pip install reportlab arabic-reshaper python-bidi qrcode pillow
      - name: Run isolated certificate date smoke test
        run: |
          python - <<'PY'
          from datetime import date, datetime
          from types import SimpleNamespace
          from backend.services.generators.certificat_gen import _resolve_certificate_date

          assert _resolve_certificate_date(SimpleNamespace(start_date=date(2026, 8, 10), doc_date=date(2026, 8, 1))) == date(2026, 8, 10)
          assert _resolve_certificate_date(SimpleNamespace(start_date=None, doc_date='2026-08-09')) == date(2026, 8, 9)
          assert _resolve_certificate_date(SimpleNamespace(start_date=datetime(2026, 8, 8, 12, 30), doc_date=None)) == date(2026, 8, 8)
          print('certificate date policy smoke test passed')
          PY
      - name: Remove one-off patch machinery
        run: |
          rm scripts/p3_certificate_section1_patch.py
          rm scripts/p3_certificate_section1_followup.py
          rm .github/workflows/p3-certificate-section1-once.yml
      - name: Commit product changes only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(p3): make certificate type selection explicit"
          git push origin HEAD:work-20260815-p3-certificat-type-motif
