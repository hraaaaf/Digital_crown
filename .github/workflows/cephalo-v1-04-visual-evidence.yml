name: Cephalo V1-04 Visual Evidence

on:
  pull_request:
    branches: [master]
    paths:
      - 'frontend/src/features/ortho/cephaloUtils.ts'
      - 'frontend/src/features/ortho/components/Step3Clinical.tsx'
      - 'frontend/scripts/capture-cephalo-v1-04-signed-overjet.mjs'
      - '.github/workflows/cephalo-v1-04-visual-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  V104_BASE_SHA: 7454215274032898d1a50659d624a5cb32aab494

jobs:
  before-after:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install candidate frontend and browser
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save --package-lock=false --legacy-peer-deps playwright@1.55.0 react-is@19.2.0 @testing-library/dom@10.4.1
          npx playwright install --with-deps chromium

      - name: Prepare exact BEFORE worktree
        run: |
          git worktree add /tmp/dc-v104-before "$V104_BASE_SHA"
          test "$(git -C /tmp/dc-v104-before rev-parse HEAD)" = "$V104_BASE_SHA"
          cd /tmp/dc-v104-before/frontend
          npm ci
          npm install --no-save --package-lock=false --legacy-peer-deps playwright@1.55.0 react-is@19.2.0 @testing-library/dom@10.4.1
          cp "$GITHUB_WORKSPACE/frontend/scripts/capture-cephalo-v1-04-signed-overjet.mjs" scripts/capture-cephalo-v1-04-signed-overjet.mjs

      - name: Capture BEFORE
        run: |
          cd /tmp/dc-v104-before/frontend
          PHASE=before PRODUCT_HEAD="$V104_BASE_SHA" EXPECTED_OVERJET="+2.6 mm" node scripts/capture-cephalo-v1-04-signed-overjet.mjs
          rm -rf "$GITHUB_WORKSPACE/frontend/cephalo-v1-04-before"
          mv cephalo-v1-04-before "$GITHUB_WORKSPACE/frontend/cephalo-v1-04-before"

      - name: Capture AFTER
        working-directory: frontend
        env:
          PRODUCT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          PHASE=after PRODUCT_HEAD="$PRODUCT_HEAD" EXPECTED_OVERJET="-2.6 mm" node scripts/capture-cephalo-v1-04-signed-overjet.mjs

      - name: Verify evidence contract
        working-directory: frontend
        env:
          PRODUCT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const before = JSON.parse(await readFile('cephalo-v1-04-before/report.json', 'utf8'));
          const after = JSON.parse(await readFile('cephalo-v1-04-after/report.json', 'utf8'));
          const viewports = ['390x844','768x1024','1280x900'];
          if (before.productHead !== process.env.V104_BASE_SHA) throw new Error('BEFORE SHA mismatch');
          if (after.productHead !== process.env.PRODUCT_HEAD) throw new Error('AFTER SHA mismatch');
          if (before.expectedOverjet !== '+2.6 mm' || after.expectedOverjet !== '-2.6 mm') throw new Error('Signed overjet contract mismatch');
          for (const report of [before, after]) {
            if (report.captures.length !== 3) throw new Error('Expected 3 captures');
            for (const c of report.captures) {
              if (!viewports.includes(c.viewport)) throw new Error('Unexpected viewport');
              if (c.pageErrors.length || c.consoleErrors.length) throw new Error('Runtime error');
              if (c.layout.scrollWidth > c.layout.clientWidth + 1) throw new Error('Horizontal overflow');
            }
          }
          NODE
          for viewport in 390x844 768x1024 1280x900; do
            test -s "cephalo-v1-04-before/before-step3-$viewport.png"
            test -s "cephalo-v1-04-after/after-step3-$viewport.png"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cephalo-v1-04-before-after-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            frontend/cephalo-v1-04-before/
            frontend/cephalo-v1-04-after/
          if-no-files-found: error
          retention-days: 30
