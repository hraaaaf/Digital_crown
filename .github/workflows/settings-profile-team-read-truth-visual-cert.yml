name: Settings Profile Team Read Truth Visual Certification

on:
  pull_request:
    paths:
      - "frontend/src/features/admin/Settings/SettingsContainer.tsx"
      - "frontend/src/features/admin/Settings/components/TeamReadTruthGate.tsx"
      - "frontend/src/features/admin/Settings/profileTeamReadTruth.test.ts"
      - ".github/workflows/settings-profile-team-read-truth-visual-cert.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend and browser
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Inject profile/team degraded-read harness
        working-directory: frontend
        run: |
          cat > settings-profile-team-read-truth-cert.html <<'EOF'
          <!doctype html><html lang="fr"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><link rel="icon" href="data:,"/><title>Settings Profile Team Read Truth</title></head><body><div id="root"></div><script type="module" src="/src/settings-profile-team-read-truth-cert.tsx"></script></body></html>
          EOF

          cat > src/settings-profile-team-read-truth-cert.tsx <<'EOF'
          import React from 'react';
          import { createRoot } from 'react-dom/client';
          import { MemoryRouter } from 'react-router-dom';
          import './index.css';
          import Settings from './pages/Settings';
          import { useAuthStore } from './stores/useAuthStore';

          useAuthStore.setState({
            user: ({ id: 1, email: 'admin@read-truth.local', nom_complet: 'Dr Read Truth', role: 'ADMIN', is_superadmin: false, permissions: {} } as any),
            isAuthenticated: true,
            isLoading: false,
            error: null,
          });

          createRoot(document.getElementById('root')!).render(
            <MemoryRouter initialEntries={['/settings']}><Settings /></MemoryRouter>,
          );
          EOF

          cat > settings-profile-team-read-truth-cert.mjs <<'EOF'
          import { chromium } from 'playwright';
          import { createServer } from 'vite';
          import fs from 'node:fs/promises';

          const output = 'settings-profile-team-read-truth-artifacts';
          await fs.mkdir(output, { recursive: true });
          const profile = {
            id: 1, public_id: 'read-truth', nom_cabinet: 'Cabinet Read Truth', nom_praticien: 'Dr Read Truth',
            footer_address: 'Rabat, Maroc', footer_phones: '05 37 00 00 00', primary_color: '#003380',
            secondary_color: '#1e40af', accent_color: '#60a5fa', selected_theme: 'elite', font_fr: 'inter',
            selected_template: 'swiss', header_lines_fr: ['Dr Read Truth'], header_lines_ar: [], specialty_ids: [],
            contacts_json: {}, margin_top: 3.6, margin_bottom: 3.2, watermark_enabled: false, use_letterhead: false,
            qr_code_enabled: false, qr_code_type: 'VCARD', qr_code_style: 'dots', show_patient_badges: true,
            performance_mode: false, clinical_tips_enabled: true, hide_header: true, hide_footer: true, cabinet_type: 'PRIVE',
          };
          const json = body => ({ status: 200, contentType: 'application/json', body: JSON.stringify(body) });
          const expectedDiagnostic = text =>
            text.includes('API Error [503]') ||
            text.includes('Path: /clinics/me') ||
            text.includes('Path: /team') ||
            text.includes('Details: unavailable') ||
            text === 'unavailable';

          const server = await createServer({ server: { host: '127.0.0.1', port: 4178, strictPort: true }, clearScreen: false });
          await server.listen();
          const browser = await chromium.launch();
          try {
            for (const width of [1440, 1024, 768, 430, 390]) {
              for (const target of ['profil', 'equipe']) {
                const context = await browser.newContext({ viewport: { width, height: 1200 } });
                const page = await context.newPage();
                const runtimeErrors = [];
                page.on('pageerror', e => runtimeErrors.push(`pageerror: ${e.message}`));
                page.on('console', m => {
                  if (m.type() === 'error' && !expectedDiagnostic(m.text())) runtimeErrors.push(`console: ${m.text()}`);
                });

                await page.route('**/*', async route => {
                  const request = route.request();
                  const url = new URL(request.url());
                  if (url.port !== '8005' || !url.pathname.startsWith('/api/')) return route.continue();
                  if (request.method() !== 'GET') return route.fulfill(json({}));

                  if (url.pathname === '/api/clinics/me') {
                    if (target === 'profil') return route.fulfill({ status: 503, contentType: 'application/json', body: '{"detail":"unavailable"}' });
                    return route.fulfill(json(profile));
                  }
                  if (target === 'equipe' && (url.pathname === '/api/team/' || url.pathname === '/api/team/quota')) {
                    return route.fulfill({ status: 503, contentType: 'application/json', body: '{"detail":"unavailable"}' });
                  }
                  if (url.pathname.includes('/audit-logs')) return route.fulfill(json({ total: 0, logs: [] }));
                  if (url.pathname.includes('/backups')) return route.fulfill(json([]));
                  return route.fulfill(json({}));
                });

                await page.goto('http://127.0.0.1:4178/settings-profile-team-read-truth-cert.html', { waitUntil: 'networkidle' });
                await page.getByRole('heading', { name: 'Paramètres', exact: true }).waitFor({ timeout: 15000 });

                if (target === 'profil') {
                  await page.getByText('Profil indisponible', { exact: true }).waitFor({ state: 'visible', timeout: 15000 });
                  await page.getByRole('button', { name: 'Réessayer', exact: true }).waitFor({ state: 'visible' });
                  const text = await page.locator('body').innerText();
                  if (text.includes('Cabinet Privé')) throw new Error('False profile fallback visible after failed read');
                  if (text.includes('Mettre à jour le Profil')) throw new Error('Global profile mutation exposed after failed read');
                } else {
                  await page.getByRole('button', { name: 'Mon Équipe', exact: true }).click();
                  await page.getByText('Équipe indisponible', { exact: true }).waitFor({ state: 'visible', timeout: 15000 });
                  await page.getByRole('button', { name: 'Réessayer', exact: true }).waitFor({ state: 'visible' });
                  const text = await page.locator('body').innerText();
                  if (text.includes("Aucun membre dans l'équipe")) throw new Error('False empty team visible after failed read');
                  if (text.includes('Ajouter un membre')) throw new Error('Team mutation exposed after failed read');
                }

                const bodyWidth = await page.evaluate(() => document.documentElement.scrollWidth);
                if (bodyWidth > width) throw new Error(`Horizontal overflow: document=${bodyWidth}, viewport=${width}`);
                if (runtimeErrors.length) throw new Error(runtimeErrors.join('\n'));

                await page.screenshot({ path: `${output}/admin-${target}-error-${width}x1200.png`, fullPage: true, animations: 'disabled' });
                await context.close();
              }
            }
          } finally {
            await browser.close();
            await server.close();
          }
          EOF

      - name: Capture and assert profile/team degraded reads
        working-directory: frontend
        run: node settings-profile-team-read-truth-cert.mjs

      - name: Verify proof count
        working-directory: frontend
        run: test "$(find settings-profile-team-read-truth-artifacts -name '*.png' | wc -l)" -eq 10

      - uses: actions/upload-artifact@v4
        with:
          name: settings-profile-team-read-truth-visual-cert
          path: frontend/settings-profile-team-read-truth-artifacts/
          if-no-files-found: error
          retention-days: 14
