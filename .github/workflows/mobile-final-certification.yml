name: Mobile Full Experience Final Certification

on:
  push:
    branches:
      - mobile/final-certification
  workflow_dispatch:

concurrency:
  group: mobile-final-certification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-mobile-contracts:
    name: Backend mobile contracts
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-only-secret-key-minimum-32-characters-long
      DATABASE_URL: "sqlite:///:memory:"
      ENVIRONMENT: development
      TELEMETRY_ENABLED: "false"
      CLOUD_AI_ENABLED: "false"
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4

      - name: Record exact HEAD
        run: |
          PRODUCT_HEAD=$(git rev-parse HEAD)
          test "$PRODUCT_HEAD" = "${{ github.sha }}"
          echo "PRODUCT_HEAD=$PRODUCT_HEAD" >> "$GITHUB_ENV"

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.12.0 torchvision==0.27.0 --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^(torch|torchvision)([<=>].*)?$' requirements.txt > /tmp/requirements-mobile-final.txt
          pip install -r /tmp/requirements-mobile-final.txt
          pip install httpx==0.27.2 pytest pytest-asyncio

      - name: Replay M6 backend contracts
        run: |
          python -m pytest -q --maxfail=1 \
            backend/tests/test_mobile_m6a_clinical_photo.py \
            backend/tests/test_mobile_m6b_document_scan.py \
            backend/tests/test_mobile_m6c_signature_hardening.py \
            backend/tests/test_mobile_m6d_notifications.py \
            backend/tests/test_mobile_m6d2_push.py \
            backend/tests/test_mobile_m6i_passkey.py

  frontend-mobile-contracts:
    name: Frontend mobile foundations and M6
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4

      - name: Record exact HEAD
        run: |
          PRODUCT_HEAD=$(git rev-parse HEAD)
          test "$PRODUCT_HEAD" = "${{ github.sha }}"
          echo "PRODUCT_HEAD=$PRODUCT_HEAD" >> "$GITHUB_ENV"

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Replay foundations and M6 contracts
        run: |
          npx vitest run \
            src/test/mobileM4APatientContext.test.ts \
            src/test/mobileM4BPanoramicContext.test.ts \
            src/test/mobileM4CDocumentContext.test.ts \
            src/test/mobileM62Behavior.test.ts \
            src/test/mobileM62OfflineTruth.test.ts \
            src/test/mobileM63CanonicalAgenda.test.ts \
            src/test/mobileM64ContextualBridge.test.ts \
            src/test/mobileM6D1Notifications.test.tsx \
            src/test/mobileM6D2Push.test.ts \
            src/test/mobileM6EPatientCommunication.test.ts \
            src/test/mobileM6FDocumentShare.test.ts \
            src/test/mobileM6HImageViewport.test.ts \
            src/test/mobileM6IPasskey.test.ts \
            src/services/zka/ecdhPairing.test.ts \
            src/utils/accessControl.test.ts

      - name: Build guarded frontend
        run: npm run build

  software-gate:
    name: Mobile software certification gate
    needs:
      - backend-mobile-contracts
      - frontend-mobile-contracts
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Enforce aggregate result
        env:
          BACKEND_RESULT: ${{ needs.backend-mobile-contracts.result }}
          FRONTEND_RESULT: ${{ needs.frontend-mobile-contracts.result }}
        run: |
          test "$BACKEND_RESULT" = "success"
          test "$FRONTEND_RESULT" = "success"
          {
            echo "## Mobile Full Experience software gate"
            echo
            echo "- Candidate: `${{ github.sha }}`"
            echo "- Backend mobile contracts: $BACKEND_RESULT"
            echo "- Frontend foundations + M6 contracts + build: $FRONTEND_RESULT"
            echo "- Physical-only gates intentionally excluded: Face ID, Touch ID, Android biometric, real-device Push reception."
            echo "- Deployment: none"
          } >> "$GITHUB_STEP_SUMMARY"
