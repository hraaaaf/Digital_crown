name: Facad Ricketts 32F vertical FH cluster contract

on:
  push:
    branches:
      - feat/ortho-studio-lot08-ricketts-protocol-v2
    paths:
      - .github/workflows/facad-314-ricketts32-vertical-fh-contract.yml
      - docs/audits/schemas/ortho_lot08_ricketts32_facad_vertical_fh_cluster_resolution_v1.json
      - docs/audits/schemas/ortho_lot08_facad_dc_unmapped_backlog_v1.json
      - scripts/ci_contract_tests/test_cephalo_lot08_ricketts32_facad_vertical_fh_cluster_contract.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pytest
        shell: pwsh
        run: python -m pip install --disable-pip-version-check pytest==9.0.3

      - name: Download and extract official Facad 3.14.1 payload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path facad-r32-vfh | Out-Null
          $installer = 'facad-r32-vfh/Facad-Installer-3.14.1.1111.exe'
          Invoke-WebRequest -Uri 'https://downloads.citodent.com/pub/Facad/Facad-Installer-3.14.1.1111.exe' -OutFile $installer
          $seven = "$env:ProgramFiles\7-Zip\7z.exe"
          New-Item -ItemType Directory -Force -Path facad-r32-vfh/outer | Out-Null
          & $seven x $installer '-ofacad-r32-vfh/outer' -y | Out-Null
          New-Item -ItemType Directory -Force -Path facad-r32-vfh/release | Out-Null
          & $seven x 'facad-r32-vfh/outer/FacadRelease-3.14.1.1111.zip' '-ofacad-r32-vfh/release' -y | Out-Null

      - name: Verify pinned Ricketts 32F profile bytes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = 'd0b442b39ac7db3dc9c46d807cb3c20bd937c69783b096b484872017f9376518'
          $path = 'facad-r32-vfh/release/Ceph/Ricketts (32 F).cph'
          if (-not (Test-Path $path)) { throw "Missing expected Facad profile: $path" }
          $actual = (Get-FileHash -Algorithm SHA256 $path).Hash.ToLowerInvariant()
          Write-Host "Ricketts32.cph sha256=$actual"
          if ($actual -ne $expected) { throw "Ricketts32.cph SHA256 drift: expected $expected got $actual" }

      - name: Verify exact vendor definitions for vertical FH cluster
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          root = ET.parse(Path(r"facad-r32-vfh/release/Ceph/Ricketts (32 F).cph")).getroot()
          expected = {
              "LFH": ("Angle3p", ["Xi", "ANS", "PM"], "47±4"),
              "Max depth": ("Angle4p", ["A", "N", "P", "Or"], "90±3"),
              "Max hgh": ("Angle3p", ["CF", "N", "A"], "56±3"),
              "NL/FH": ("Angle2ln", ["FH", "NL"], "1±3.5"),
              "CBL/FH": ("Angle4p", ["N", "Ba", "Or", "P"], "27±3"),
          }
          expected_constructions = {
              "FH": ("Line", ["P", "Or"]),
              "NL": ("Line", ["PNS", "ANS"]),
              "PtV": ("Normal", ["FH", "Pt"]),
              "CF": ("Inter2ln", ["FH", "PtV"]),
              "Xi": ("Intersect", ["R23", "R14", "R13", "R24"]),
              "R1-line": ("Parallel", ["PtV", "R1"]),
              "R2-line": ("Parallel", ["PtV", "R2"]),
              "R3-line": ("Parallel", ["FH", "R3"]),
              "R4-line": ("Parallel", ["FH", "R4"]),
              "R13": ("Inter2ln", ["R1-line", "R3-line"]),
              "R14": ("Inter2ln", ["R1-line", "R4-line"]),
              "R23": ("Inter2ln", ["R2-line", "R3-line"]),
              "R24": ("Inter2ln", ["R2-line", "R4-line"]),
          }
          expected_markers = {
              "P": "Porion", "Or": "Orbitale", "Pt": "Pterygo-maxillary fissure; Foramen rotundum",
              "N": "Nasion", "PNS": "Posterior Nasal Spine", "ANS": "Anterior Nasal Spine",
              "A": "Downs' A-point; Subspinale", "PM": "Protuberance Menti; Suprapogonion", "Ba": "Basion",
              "R1": "Deepest point on anterior border of ramus", "R2": "Point on posterior border of ramus",
              "R3": "Most inferior/centre point on sigmoid notch", "R4": "Point on lower border of mandible, below R3",
          }
          found = {}
          constructions = {}
          markers = {}
          for e in root.iter("ceph_calc"):
              fields = {}
              for c in list(e):
                  if len(list(c)) == 0:
                      fields.setdefault(c.tag, []).append((c.text or "").strip())
              name = (fields.get("name") or [None])[0]
              if name in expected:
                  found[name] = ((fields.get("calc_type") or [None])[0], fields.get("point_ref", []), (fields.get("norm") or [None])[0])
              if name in expected_constructions:
                  constructions[name] = ((fields.get("calc_type") or [None])[0], fields.get("point_ref", []))
          for e in root.iter("marker"):
              fields = {c.tag: (c.text or "").strip() for c in list(e) if len(list(c)) == 0}
              name = fields.get("name")
              if name in expected_markers:
                  markers[name] = fields.get("longname")
          assert found == expected, (found, expected)
          assert constructions == expected_constructions, (constructions, expected_constructions)
          assert markers == expected_markers, (markers, expected_markers)
          print("VENDOR_VERTICAL_FH_ASSERTIONS=PASS", len(found), len(constructions), len(markers))
          '@ | python -

      - name: Run vertical FH contract tests
        shell: pwsh
        run: python -m pytest scripts/ci_contract_tests/test_cephalo_lot08_ricketts32_facad_vertical_fh_cluster_contract.py -q
