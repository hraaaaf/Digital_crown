name: V1.5-04.8 Owner Review Readonly and Audit Guards

on:
  pull_request:
    branches:
      - feat/v15-04-8-attestation-recovery-guard-20261013
    paths:
      - "backend/core/print_audit_ddl.py"
      - "backend/services/station_print_attestation_recovery_v15.py"
      - "backend/routers/station_print_config_admin.py"
      - "backend/tests/certify_station_print_audit_guards_sqlite_v15.py"
      - "frontend/src/features/admin/Settings/**"
      - "frontend/visual-lab/**"
      - "frontend/scripts/capture-v15-04-8-blocked-readonly.mjs"
      - ".github/workflows/v15-04-8-owner-readonly-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sqlite-append-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Exact HEAD
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install SQLAlchemy==2.0.28
      - name: Exercise SQLite trigger immutability on actual synthetic rows
        run: python backend/tests/certify_station_print_audit_guards_sqlite_v15.py

  readonly-react-mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Exact HEAD
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend and Chromium
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Unit tests — no print or PHI
        working-directory: frontend
        run: |
          npx vitest run src/features/admin/Settings/tabs/BlockedPrintJobsReadOnly.test.tsx src/features/admin/Settings/tabs/SecurityTab.g5Interactive.test.tsx --maxWorkers=1 --fileParallelism=false
          node --check scripts/capture-v15-04-8-blocked-readonly.mjs
      - name: Capture actual component at mobile and desktop sizes (no physical device)
        working-directory: frontend
        shell: bash
        env:
          GITHUB_SHA_SOURCE: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          ./node_modules/.bin/vite --host 127.0.0.1 --port 4198 >/tmp/048-owner-readonly-vite.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          ready=0
          for i in {1..90}; do
            if curl -fsS http://127.0.0.1:4198/visual-lab/blocked-jobs.html >/dev/null; then ready=1; break; fi
            sleep 1
          done
          if [[ "$ready" != 1 ]]; then cat /tmp/048-owner-readonly-vite.log; exit 1; fi
          node scripts/capture-v15-04-8-blocked-readonly.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v15-04-8-cabinet-blocked-readonly-visual
          path: frontend/artifacts/v15-04-8-blocked-readonly
          if-no-files-found: warn
          retention-days: 14
