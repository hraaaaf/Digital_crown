name: Explicit Document Edit Identity Guarded Patch

on:
  push:
    branches: [fix/document-archive-consistency]
    paths:
      - '.github/workflows/document-edit-explicit-id-self-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/document-archive-consistency
          fetch-depth: 0
      - name: Apply guarded frontend replacements
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, got {count}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1))

          hub = 'frontend/src/features/admin/DocumentHub.tsx'
          replace_once(
              hub,
              '    installments, isAccounted, paymentStatus, isGlobalNote,\n    showLegalAnnotations, echeancierPayload,',
              '    installments, isAccounted, paymentStatus, isGlobalNote,\n    editArchiveId: editData?.id,\n    showLegalAnnotations, echeancierPayload,',
          )
          replace_once(
              hub,
              '    installments, isAccounted, paymentStatus, isGlobalNote, showLegalAnnotations, echeancierPayload,\n  ]);',
              '    installments, isAccounted, paymentStatus, isGlobalNote, editData?.id, showLegalAnnotations, echeancierPayload,\n  ]);',
          )

          gen = 'frontend/src/features/admin/DocumentStudio/useDocumentGenerator.ts'
          replace_once(
              gen,
              '  installments: any[];\n  isAccounted?: boolean;',
              '  installments: any[];\n  editArchiveId?: number;\n  isAccounted?: boolean;',
          )
          replace_once(
              gen,
              '      const payload = buildPayload();\n      const res = await api.post(`/documents/generate?archive=${archive}&preview=${isPreview}&force=${force}`, payload);',
              '''      const payload = buildPayload();\n      if (archive && !isPreview && params.editArchiveId) {\n        payload.data = { ...payload.data, _replace_archive_id: params.editArchiveId };\n      }\n      const res = await api.post(`/documents/generate?archive=${archive}&preview=${isPreview}&force=${force}`, payload);\n      if (archive && !isPreview && params.editArchiveId && res.data?.status === 'success') {\n        window.dispatchEvent(new CustomEvent('digitalcrown:document-edit-complete'));\n      }''',
          )

          api = 'frontend/src/services/api.ts'
          api_path = Path(api)
          text = api_path.read_text()
          start = text.find("const DOCUMENT_EDIT_ARCHIVE_KEY = 'digitalcrown:document-edit-archive-id';")
          end_marker = "// Synchronisation du token entre onglets (BroadcastChannel)"
          end = text.find(end_marker)
          if start < 0 or end < 0 or end <= start:
              raise SystemExit('api.ts edit identity block not found')
          text = text[:start] + text[end:]
          if text.count('  attachDocumentEditArchiveId(config);\n') != 1:
              raise SystemExit('api.ts attach call mismatch')
          text = text.replace('  attachDocumentEditArchiveId(config);\n\n', '', 1)
          if text.count('    completeDocumentEdit(response);\n') != 1:
              raise SystemExit('api.ts completion call mismatch')
          text = text.replace('    completeDocumentEdit(response);\n', '', 1)
          api_path.write_text(text)
          PY
      - name: Static frontend sanity
        run: |
          grep -q '_replace_archive_id: params.editArchiveId' frontend/src/features/admin/DocumentStudio/useDocumentGenerator.ts
          ! grep -q 'attachDocumentEditArchiveId' frontend/src/services/api.ts
          ! grep -q 'DOCUMENT_EDIT_ARCHIVE_KEY' frontend/src/services/api.ts
          ! grep -q 'sessionStorage.setItem' frontend/src/stores/usePatientStore.ts
      - name: Commit patch and remove this one-shot workflow
        run: |
          rm .github/workflows/document-edit-explicit-id-self-patch.yml
          git config user.name 'Digital Crown CI'
          git config user.email 'actions@users.noreply.github.com'
          git add frontend/src/features/admin/DocumentHub.tsx frontend/src/features/admin/DocumentStudio/useDocumentGenerator.ts frontend/src/services/api.ts .github/workflows/document-edit-explicit-id-self-patch.yml
          git commit -m 'Use explicit archive identity for document edits'
          git push origin HEAD:fix/document-archive-consistency
