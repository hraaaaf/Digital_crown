name: Client Copy Security Finalize

on:
  push:
    branches:
      - fix/client-facing-copy-hygiene

permissions:
  contents: write

concurrency:
  group: client-copy-security-finalize
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/client-facing-copy-hygiene
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Apply security and harness copy hygiene
        run: python scripts/finalize_security_copy.py

      - name: Fail closed unknown displayed statuses
        run: python scripts/finalize_status_fallback.py

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run targeted wording contracts
        working-directory: frontend
        run: |
          npm test -- \
            src/ClientFacingCopyCandidateAudit.test.ts \
            src/features/mobile/Dashboard/views/MobileSuperAdminView.test.tsx \
            src/features/mobile/Dashboard/views/MarketplaceView.test.tsx

      - name: Build production frontend
        working-directory: frontend
        run: npm run build

      - name: Validate diff
        run: |
          git diff --check
          git diff --stat

      - name: Remove one-shot files
        run: |
          rm .github/workflows/client-copy-security-finalize.yml
          rm scripts/finalize_security_copy.py
          rm scripts/finalize_status_fallback.py

      - name: Commit verified patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(ui): finish client-facing security wording"
          git push origin HEAD:fix/client-facing-copy-hygiene
