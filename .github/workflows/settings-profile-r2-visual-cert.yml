name: Settings Profile R2 Visual Certification

on:
  pull_request:
    paths:
      - "frontend/src/features/admin/Settings/SettingsContainer.tsx"
      - "frontend/src/features/admin/Settings/tabs/ProfileTab.tsx"
      - "frontend/src/features/admin/Settings/hooks/useSettingsStore.ts"
      - ".github/workflows/settings-profile-r2-visual-cert.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual:
    name: Profile R2 AFTER
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend and Chromium
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Inject R2 Profile harness
        working-directory: frontend
        run: |
          cat > settings-r2-profile-cert.html <<'EOF'
          <!doctype html>
          <html lang="fr">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <title>Settings Profile R2</title>
            </head>
            <body>
              <div id="root"></div>
              <script type="module" src="/src/settings-r2-profile-cert.tsx"></script>
            </body>
          </html>
          EOF

          cat > src/settings-r2-profile-cert.tsx <<'EOF'
          import React from 'react';
          import { createRoot } from 'react-dom/client';
          import { MemoryRouter } from 'react-router-dom';
          import './index.css';
          import Settings from './pages/Settings';
          import { useAuthStore } from './stores/useAuthStore';

          const isSuperadmin = new URLSearchParams(window.location.search).get('role') === 'superadmin';
          useAuthStore.setState({
            user: {
              id: isSuperadmin ? 1 : 2,
              email: isSuperadmin ? 'owner@digitalcrown.local' : 'admin@cabinet.local',
              nom_complet: isSuperadmin ? 'Achraf Benmoussa' : 'Dr Cabinet Standard',
              role: 'ADMIN',
              is_superadmin: isSuperadmin,
              permissions: {},
            } as any,
            isAuthenticated: true,
            isLoading: false,
            error: null,
          });

          createRoot(document.getElementById('root')!).render(
            <React.StrictMode>
              <MemoryRouter initialEntries={['/settings']}>
                <Settings />
              </MemoryRouter>
            </React.StrictMode>,
          );
          EOF

          cat > settings-r2-profile-cert.mjs <<'EOF'
          import { chromium } from 'playwright';
          import { createServer } from 'vite';
          import fs from 'node:fs/promises';

          const output = 'settings-profile-r2-artifacts';
          await fs.mkdir(output, { recursive: true });

          const profile = {
            id: 1,
            public_id: 'r2-profile',
            nom_cabinet: 'Cabinet Dentaire Baseline',
            nom_praticien: 'Achraf Baseline',
            nom_praticien_ar: 'أشرف',
            footer_address: 'Rabat, Maroc',
            footer_phones: '📞 05 37 00 00 00',
            inpe: '123456789',
            ice: '001234567890123',
            if_: '12345678',
            primary_color: '#003380',
            secondary_color: '#1e40af',
            accent_color: '#60a5fa',
            selected_theme: 'elite',
            font_fr: 'inter',
            selected_template: 'swiss',
            header_lines_fr: ['Dr. Achraf Baseline', 'Chirurgien Dentiste'],
            header_lines_ar: ['د. أشرف', 'طبيب جراح للأسنان'],
            header_customized: false,
            specialty_ids: [],
            contacts_json: {
              fixe: { enabled: true, value: '05 37 00 00 00' },
              mobile: { enabled: true, value: '06 00 00 00 00' },
              whatsapp: { enabled: false, value: '' },
              instagram: { enabled: false, value: '' },
            },
            margin_top: 3.6,
            margin_bottom: 3.2,
            watermark_enabled: true,
            use_letterhead: false,
            qr_code_enabled: false,
            qr_code_type: 'VCARD',
            qr_code_style: 'dots',
            show_patient_badges: true,
            performance_mode: false,
            clinical_tips_enabled: true,
            hide_header: true,
            hide_footer: true,
            cabinet_type: 'PRIVE',
          };

          const json = body => ({ status: 200, contentType: 'application/json', body: JSON.stringify(body) });
          const server = await createServer({ server: { host: '127.0.0.1', port: 4182, strictPort: true }, clearScreen: false });
          await server.listen();
          const browser = await chromium.launch();

          try {
            for (const role of ['admin', 'superadmin']) {
              for (const width of [1440, 768, 390]) {
                const context = await browser.newContext({ viewport: { width, height: 1200 } });
                const page = await context.newPage();
                const errors = [];
                page.on('pageerror', e => errors.push(`pageerror: ${e.message}`));
                page.on('console', m => { if (m.type() === 'error') errors.push(`console: ${m.text()}`); });

                await page.route('**/*', async route => {
                  const request = route.request();
                  const url = new URL(request.url());
                  if (url.port !== '8005' || !url.pathname.startsWith('/api/')) return route.continue();
                  if (request.method() !== 'GET') return route.fulfill(json({}));
                  if (url.pathname === '/api/clinics/me') return route.fulfill(json(profile));
                  if (url.pathname.endsWith('/specialties')) return route.fulfill(json([]));
                  if (url.pathname.endsWith('/agenda/settings')) return route.fulfill(json({
                    opening_time_morning: '09:00', closing_time_morning: '13:00',
                    opening_time_afternoon: '14:00', closing_time_afternoon: '18:00',
                    is_continuous: false, agenda_mode: 'EXACT', use_tickets: false,
                  }));
                  if (url.pathname.includes('/team/quota')) return route.fulfill(json({ plan: 'GOLD', dentistes_used: 1, dentistes_max: 2, secretaires_used: 0, secretaires_max: 2, pending_count: 0, can_add_dentiste: true, can_add_secretaire: true }));
                  if (url.pathname.includes('/team')) return route.fulfill(json([]));
                  if (url.pathname.includes('/audit-logs')) return route.fulfill(json({ total: 0, logs: [] }));
                  return route.fulfill(json({}));
                });

                await page.goto(`http://127.0.0.1:4182/settings-r2-profile-cert.html?role=${role}`, { waitUntil: 'networkidle' });
                await page.getByRole('heading', { name: 'Paramètres' }).waitFor({ state: 'visible', timeout: 15000 });
                await page.getByText('Aucun détourage automatique', { exact: false }).waitFor({ state: 'visible' });

                const profileSave = page.getByRole('button', { name: /Mettre à jour le profil/i });
                if (await profileSave.count() !== 1) throw new Error('Profile must expose exactly one save action');

                await page.screenshot({ path: `${output}/${role}-profil-collapsed-${width}x1200.png`, fullPage: true, animations: 'disabled' });

                await page.getByRole('button', { name: /En-tête bilingue/i }).click();
                await page.getByText('Personnalisation avancée').waitFor({ state: 'visible' });
                if (role === 'superadmin') {
                  await page.getByRole('button', { name: /Modèle Benmoussa/i }).waitFor({ state: 'visible' });
                  if (await page.getByRole('button', { name: /Réinitialiser depuis le cabinet/i }).count()) throw new Error('Standard reset action leaked into superadmin state');
                } else {
                  await page.getByRole('button', { name: /Réinitialiser depuis le cabinet/i }).waitFor({ state: 'visible' });
                  if (await page.getByRole('button', { name: /Modèle Benmoussa/i }).count()) throw new Error('Personal Benmoussa preset leaked to standard admin');
                }

                await page.screenshot({ path: `${output}/${role}-profil-advanced-${width}x1200.png`, fullPage: true, animations: 'disabled' });
                await fs.writeFile(`${output}/${role}-${width}.errors.txt`, errors.join('\n'));
                await context.close();
              }
            }
          } finally {
            await browser.close();
            await server.close();
          }
          EOF

      - name: Capture R2 AFTER
        working-directory: frontend
        run: node settings-r2-profile-cert.mjs

      - name: Verify R2 proof
        working-directory: frontend
        run: |
          count=$(find settings-profile-r2-artifacts -name '*.png' | wc -l)
          test "$count" -eq 12
          if grep -R -n -E 'pageerror:|console:' settings-profile-r2-artifacts/*.errors.txt; then
            echo "Runtime errors detected in R2 Profile harness" >&2
            exit 1
          fi
          ! grep -R -n -E 'Détourage IA|Logo Premium généré' src/features/admin/Settings/tabs/ProfileTab.tsx src/features/admin/Settings/hooks/useSettingsStore.ts

      - name: Record metadata
        working-directory: frontend
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          cat > settings-profile-r2-artifacts/metadata.txt <<EOF
          head_sha=${HEAD_SHA}
          goal=R2 Profil Cabinet simplification et vérité produit
          viewports=1440x1200,768x1200,390x1200
          roles=ADMIN,SUPERADMIN
          states=collapsed,advanced
          expected_screenshots=12
          EOF

      - name: Upload R2 visual proof
        uses: actions/upload-artifact@v4
        with:
          name: settings-profile-r2-visual-cert
          path: frontend/settings-profile-r2-artifacts/
          if-no-files-found: error
          retention-days: 14
