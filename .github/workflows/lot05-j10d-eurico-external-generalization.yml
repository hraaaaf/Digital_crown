name: LOT05 J10D external OralXrays9 model on DENTEX (experimental)

on:
  pull_request:
    branches: [master]
    paths:
      - 'experiments/lot05_j10d_eurico_external_generalization.py'
      - '.github/workflows/lot05-j10d-eurico-external-generalization.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-source-panoramic:
    name: YOLO26m OralXrays9 to DENTEX pathology research-only
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GIT_TERMINAL_PROMPT: '0'
      YOLO_CONFIG_DIR: /tmp/lot05-eurico-config
      ULTRALYTICS_AUTOINSTALL: 'False'
      WANDB_DISABLED: 'true'
      PYTHONUNBUFFERED: '1'
      LOT05_EURICO_REPORT: lot05-eurico-external-generalization.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert tested exact PR SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU-only experimental YOLO26 inference
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.10.0 torchvision==0.25.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'ultralytics>=8.4.115,<8.5' 'datasets>=4.4,<5' pyarrow==21.0.0
          python -m pip check
      - name: Measure caries and apical findings on DENTEX, no patient exports
        run: python experiments/lot05_j10d_eurico_external_generalization.py
      - name: Upload only structured metrics, not radiographs or model weights
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lot05-eurico-cross-source-${{ github.event.pull_request.head.sha || github.sha }}
          path: lot05-eurico-external-generalization.json
          if-no-files-found: warn
          retention-days: 30
