name: Neo Ordonnance D6 Quantity End-to-End

on:
  push:
    branches:
      - feat/neo-medication-search-intelligence
    paths:
      - 'backend/schemas/documents.py'
      - 'backend/services/generators/ordonnance_gen.py'
      - 'backend/tests/test_document_layout_consistency.py'
      - 'backend/services/far_ordonnance_bridge.py'
      - 'backend/services/insurance_far_prescription_renderer.py'
      - 'backend/tests/test_far_ordonnance_bridge.py'
      - 'backend/tests/test_insurance_far_prescription_renderer.py'
      - 'frontend/src/features/admin/DocumentStudio/useDocumentGenerator.ts'
      - 'frontend/src/features/admin/DocumentHub.tsx'
      - 'frontend/src/features/admin/DocumentStudio/Forms/DrugRowV1.tsx'
      - 'frontend/src/features/admin/DocumentStudio/Forms/DrugRow.r5.test.tsx'
      - 'frontend/src/features/admin/DocumentStudio/DocumentGeneration.g4Interactive.test.tsx'
      - 'frontend/src/features/admin/DocumentStudio/DocumentEditConsistency.regression.test.ts'
      - '.github/workflows/neo-ordonnance-d6-quantity.yml'
      - '.github/workflows/ordonnance-composer-visual-cert.yml'
      - 'frontend/scripts/certify-ordonnance-composer.mjs'
  workflow_dispatch:

jobs:
  d6-quantity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Assert exact HEAD
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Backend quantity + real PDF contract
        run: pytest -q backend/tests/test_document_layout_consistency.py backend/tests/test_far_ordonnance_bridge.py backend/tests/test_insurance_far_prescription_renderer.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend quantity contracts
        working-directory: frontend
        run: npm test -- src/features/admin/DocumentStudio/Forms/DrugRow.r5.test.tsx src/features/admin/DocumentStudio/DocumentGeneration.g4Interactive.test.tsx src/features/admin/DocumentStudio/DocumentEditConsistency.regression.test.ts

      - name: Build frontend
        working-directory: frontend
        run: npm run build
