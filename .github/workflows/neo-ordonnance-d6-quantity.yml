name: Neo Ordonnance D6 Quantity End-to-End

on:
  workflow_dispatch:

jobs:
  d6-quantity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Assert exact HEAD
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Backend quantity + real PDF contract
        run: pytest -q backend/tests/test_document_layout_consistency.py backend/tests/test_far_ordonnance_bridge.py backend/tests/test_insurance_far_prescription_renderer.py backend/tests/test_neo_ordonnance_reusables.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend quantity contracts
        working-directory: frontend
        run: npm test -- src/features/admin/DocumentStudio/Forms/DrugRow.r5.test.tsx src/features/admin/DocumentStudio/Forms/PrescriptionQuickAccessBar.test.tsx src/features/admin/DocumentStudio/DocumentGeneration.g4Interactive.test.tsx src/features/admin/DocumentStudio/DocumentEditConsistency.regression.test.ts

      - name: Build frontend
        working-directory: frontend
        run: npm run build
