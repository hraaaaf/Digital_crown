name: CUST-04 Prescription Presets Visual Evidence

on:
  pull_request:
    branches: [master]
    paths:
      - ".github/workflows/cust-04-prescription-presets-visual.yml"
      - "frontend/src/features/admin/DocumentStudio/Forms/PrescriptionAgenticStudioV1.tsx"
      - "frontend/src/features/admin/DocumentStudio/Forms/PrescriptionPresetBar.tsx"
      - "docs/customization/CUST_04_PRACTITIONER_PRESETS_GOAL.md"

permissions:
  contents: read

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout AFTER
        uses: actions/checkout@v4
        with:
          path: after

      - name: Checkout BEFORE base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: before

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: after/frontend/package-lock.json

      - name: Install frontend and Chromium
        working-directory: after/frontend
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
          ln -s "$(realpath node_modules)" ../../before/frontend/node_modules

      - name: Inject identical harnesses
        run: |
          for root in before/frontend after/frontend; do
            cat > "$root/cust04-presets.html" <<'EOF'
          <!doctype html>
          <html lang="fr">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <title>CUST-04 Prescription Presets</title>
            </head>
            <body class="bg-white">
              <div id="root"></div>
              <script type="module" src="/src/cust04-presets.tsx"></script>
            </body>
          </html>
          EOF

            cat > "$root/src/cust04-presets.tsx" <<'EOF'
          import React, { useState } from 'react';
          import { createRoot } from 'react-dom/client';
          import './index.css';
          import { PrescriptionAgenticStudio } from './features/admin/DocumentStudio/Forms/PrescriptionAgenticStudio';

          function Harness() {
            const [drugs, setDrugs] = useState([{
              id: 1,
              name: 'PARACETAMOL',
              dosage: '1g',
              forme: 'Comprimés',
              posologie: '1 comprimé si douleur',
              type: 'MEDICAMENT',
              quantite: 1,
              non_substituable: false,
            }]);
            const [indication, setIndication] = useState('Douleur postopératoire documentée par le praticien');

            return (
              <main className="mx-auto max-w-5xl px-3 py-4 sm:px-5">
                <h1 className="mb-3 text-xl font-black text-slate-900">Document Studio</h1>
                <PrescriptionAgenticStudio
                  patientId="205"
                  drugs={drugs}
                  setDrugs={setDrugs}
                  prescriptionIndication={indication}
                  onPrescriptionIndicationChange={setIndication}
                  onUpdateDrug={(id, field, value) => setDrugs(current => current.map(drug => (
                    drug.id === id ? { ...drug, [field]: value } : drug
                  )))}
                  onRemoveDrug={id => setDrugs(current => current.filter(drug => drug.id !== id))}
                  onAddDrug={() => setDrugs(current => [...current, {
                    id: Math.max(0, ...current.map(drug => drug.id)) + 1,
                    name: '',
                    dosage: '',
                    forme: '',
                    posologie: '',
                    type: 'MEDICAMENT',
                  }])}
                  validationErrors={[]}
                />
              </main>
            );
          }

          createRoot(document.getElementById('root')!).render(<Harness />);
          EOF
          done

      - name: Prepare PWA dev harness
        run: |
          mkdir -p before/frontend/dev-dist after/frontend/dev-dist
          : > before/frontend/dev-dist/registerSW.js
          : > after/frontend/dev-dist/registerSW.js

      - name: Capture BEFORE and AFTER
        working-directory: after/frontend
        run: |
          cat > cust04-visual.mjs <<'EOF'
          import path from 'node:path';
          import fs from 'node:fs/promises';
          import { chromium } from 'playwright';
          import { createServer } from 'vite';

          const afterRoot = process.cwd();
          const beforeRoot = path.resolve('../../before/frontend');
          const output = path.resolve('../../artifacts/cust-04-prescription-presets');
          await fs.mkdir(output, { recursive: true });

          const beforeServer = await createServer({ root: beforeRoot, server: { host: '127.0.0.1', port: 4200, strictPort: true }, clearScreen: false });
          const afterServer = await createServer({ root: afterRoot, server: { host: '127.0.0.1', port: 4201, strictPort: true }, clearScreen: false });
          await beforeServer.listen();
          await afterServer.listen();

          const browser = await chromium.launch({ headless: true });
          const viewports = [{width:390,height:844},{width:768,height:1024},{width:1280,height:900}];
          const rows = [];

          const capture = async (kind, port, viewport) => {
            const context = await browser.newContext({ viewport, colorScheme: 'light' });
            const page = await context.newPage();
            const errors = [];
            page.on('pageerror', e => errors.push(String(e)));
            page.on('console', m => {
              if (m.type() !== 'error') return;
              const text = m.text();
              if (text.includes('Outdated Optimize Dep')) return;
              errors.push(text);
            });

            await page.route('**/api/**', route => {
              const url = new URL(route.request().url());
              if (url.pathname.endsWith('/api/prescriptions/habits/presets')) {
                return route.fulfill({
                  status: 200,
                  contentType: 'application/json',
                  body: JSON.stringify([{
                    id: 11,
                    act_context: 'MON POST-OP',
                    label: 'Mon post-op',
                    drugs: [{
                      name:'IBUPROFENE',
                      dosage:'400mg',
                      forme:'Comprimés',
                      posologie:'1 comprimé après repas',
                      type:'MEDICAMENT',
                      quantite:1,
                      non_substituable:false,
                    }],
                  }]),
                });
              }
              if (route.request().method() === 'GET') {
                return route.fulfill({ status: 200, contentType: 'application/json', body: '{}' });
              }
              return route.fulfill({ status: 200, contentType: 'application/json', body: '{"status":"success"}' });
            });

            await page.goto(`http://127.0.0.1:${port}/cust04-presets.html`, { waitUntil: 'networkidle' });
            await page.getByText('Prescription', { exact: true }).first().waitFor();
            if (kind === 'after') await page.locator('[data-cust04-presets]').waitFor();

            const overflow = await page.evaluate(() => document.documentElement.scrollWidth > document.documentElement.clientWidth + 2);
            const shot = `${kind}-${viewport.width}x${viewport.height}.png`;
            await page.screenshot({ path: path.join(output, shot), fullPage: true, animations: 'disabled' });
            rows.push({ kind, viewport, overflow, errors:[...errors], shot });

            if (kind === 'after') {
              await page.getByRole('button', { name: /Enregistrer comme modèle/i }).click();
              await page.getByRole('dialog', { name: /Enregistrer un modèle/i }).waitFor();
              const saveOverflow = await page.evaluate(() => document.documentElement.scrollWidth > document.documentElement.clientWidth + 2);
              const saveShot = `after-save-${viewport.width}x${viewport.height}.png`;
              await page.screenshot({ path: path.join(output, saveShot), fullPage: true, animations: 'disabled' });
              rows.push({ kind:'after-save', viewport, overflow:saveOverflow, errors:[...errors], shot:saveShot });
              await page.getByRole('button', { name: 'Fermer' }).click();

              await page.getByRole('button', { name: 'Mon post-op', exact: true }).click();
              await page.getByRole('dialog', { name: /Remplacer les lignes actuelles/i }).waitFor();
              const replaceOverflow = await page.evaluate(() => document.documentElement.scrollWidth > document.documentElement.clientWidth + 2);
              const replaceShot = `after-replace-${viewport.width}x${viewport.height}.png`;
              await page.screenshot({ path: path.join(output, replaceShot), fullPage: true, animations: 'disabled' });
              rows.push({ kind:'after-replace', viewport, overflow:replaceOverflow, errors:[...errors], shot:replaceShot });
            }

            await context.close();
          };

          try {
            for (const viewport of viewports) {
              await capture('before', 4200, viewport);
              await capture('after', 4201, viewport);
            }
          } finally {
            await browser.close();
            await beforeServer.close();
            await afterServer.close();
          }

          const failures = rows.filter(row => row.overflow || row.errors.length);
          await fs.writeFile(path.join(output, 'evidence.json'), JSON.stringify(rows, null, 2));
          await fs.writeFile(path.join(output, 'summary.json'), JSON.stringify({
            beforeSha: process.env.BASE_SHA,
            afterSha: process.env.HEAD_SHA,
            viewports,
            screenshots: rows.length,
            failures,
          }, null, 2));
          if (failures.length) process.exit(1);
          EOF
          BASE_SHA="${{ github.event.pull_request.base.sha }}" HEAD_SHA="${{ github.event.pull_request.head.sha }}" node cust04-visual.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cust-04-prescription-presets-before-after
          path: artifacts/cust-04-prescription-presets
          if-no-files-found: error
          retention-days: 14
