name: Mobile Waiting Room MOB-5I BEFORE

on:
  push:
    branches: [ux/mobile-waiting-room-mob5i]
    paths:
      - .github/workflows/mobile-waiting-room-mob5i-before.yml
      - frontend/scripts/capture-mobile-waiting-room-mob5i-before.mjs
      - docs/ux/DIGITAL_CROWN_MOBILE_WAITING_ROOM_MOB5I_GOAL_UI.md
      - docs/ux/DIGITAL_CROWN_MOBILE_WAITING_ROOM_MOB5I_AUDIT.md
  workflow_dispatch:

concurrency:
  group: mobile-waiting-room-mob5i-before-${{ github.ref }}
  cancel-in-progress: false

jobs:
  before:
    name: BEFORE 390 430 768
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Install Playwright runner
        working-directory: frontend
        run: npm install --no-save --package-lock=false playwright@1.63.0

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start isolated mobile demo
        working-directory: frontend
        env:
          VITE_DC_PREVIEW_DEMO: "1"
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 >/tmp/mobile-waiting-room-mob5i-before-vite.log 2>&1 &
          for i in {1..60}; do
            curl -fsS 'http://127.0.0.1:5173/mobile/demo?demo=1&tab=agenda' >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/mobile-waiting-room-mob5i-before-vite.log
          exit 1

      - name: Capture and assert immutable BEFORE
        working-directory: frontend
        env:
          PRODUCT_HEAD: fd19dab006d46f274946fd932927b9ac4821d3ec
          ARTIFACT_DIR: ../artifacts/mobile-waiting-room-mob5i-before
        run: node scripts/capture-mobile-waiting-room-mob5i-before.mjs

      - name: Preserve harness log
        if: always()
        run: cp /tmp/mobile-waiting-room-mob5i-before-vite.log artifacts/mobile-waiting-room-mob5i-before/vite.log || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-waiting-room-mob5i-before
          path: artifacts/mobile-waiting-room-mob5i-before
          if-no-files-found: error
          retention-days: 30
