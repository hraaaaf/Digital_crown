name: Patient P0 Recovery Rate Patch

on:
  push:
    branches:
      - agent/patient-page-p0-truth-safety
    paths:
      - .github/workflows/patient-p0-recovery-rate-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/patient-page-p0-truth-safety
          fetch-depth: 0
      - name: Apply exact PatientFinances patch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('frontend/src/features/patients/components/PatientFinances.tsx')
          text = path.read_text()
          old = '''  const recoveryRate =
    snapshot.total_billed > 0
      ? Math.round((snapshot.total_collected / snapshot.total_billed) * 100)
      : 100;
'''
          new = '''  const hasBillingBase = snapshot.total_billed > 0;
  const recoveryRate = hasBillingBase
    ? Math.round((snapshot.total_collected / snapshot.total_billed) * 100)
    : null;
'''
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one recovery-rate logic block, got {text.count(old)}')
          text = text.replace(old, new)

          old_card = '''          <div className={cn(
            "text-3xl font-black",
            recoveryRate >= 80 ? "text-emerald-600" : recoveryRate >= 50 ? "text-amber-600" : "text-red-600"
          )}>
            {recoveryRate}%
          </div>
          <div className="text-xs text-text-muted font-bold mt-1">Encaissé / Facturé</div>
'''
          new_card = '''          <div className={cn(
            "text-3xl font-black",
            recoveryRate === null
              ? "text-slate-500"
              : recoveryRate >= 80
                ? "text-emerald-600"
                : recoveryRate >= 50
                  ? "text-amber-600"
                  : "text-red-600"
          )}>
            {recoveryRate === null ? '—' : `${recoveryRate}%`}
          </div>
          <div className="text-xs text-text-muted font-bold mt-1">
            {recoveryRate === null ? 'Non applicable' : 'Encaissé / Facturé'}
          </div>
'''
          if text.count(old_card) != 1:
              raise SystemExit(f'Expected exactly one recovery-rate card block, got {text.count(old_card)}')
          text = text.replace(old_card, new_card)
          path.write_text(text)
          PY
      - name: Commit patch and remove one-shot workflow
        run: |
          git config user.name "digital-crown-ci"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/patient-p0-recovery-rate-patch.yml
          git add frontend/src/features/patients/components/PatientFinances.tsx
          git diff --cached --check
          git commit -m "fix(patient): make zero-billed recovery rate non-applicable"
          git push origin HEAD:agent/patient-page-p0-truth-safety
