name: Theme Token Validation

on:
  push:
    branches: [audit/visual-theme-2026-09-08]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: theme-token-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Unit tests
        run: npm test -- --run
      - name: Safe build
        run: npm run build
