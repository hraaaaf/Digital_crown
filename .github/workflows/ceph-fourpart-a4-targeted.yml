name: CEPH Four-Part A4 Clinical Draft Gate (NO DEPLOY)

on:
  pull_request:
    paths:
      - 'backend/services/generators/cephalo_four_part_report.py'
      - 'backend/services/generators/bilan_ortho_gen.py'
      - 'backend/services/cephalo_pdf_projection.py'
      - 'backend/tests/test_cephalo_four_part_report.py'
      - 'frontend/src/features/patients/PatientDetailsInner.tsx'
      - '.github/workflows/ceph-fourpart-a4-targeted.yml'

permissions:
  contents: read

jobs:
  a4-draft-and-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SECRET_KEY: ceph-fourpart-disposable-test-key-000001
      DATABASE_URL: 'sqlite:///:memory:'
      ENVIRONMENT: test
      DIGITALCROWN_ISOLATED_RUNTIME: 'true'
      TELEMETRY_ENABLED: 'false'
      CLOUD_AI_ENABLED: 'false'
      PRODUCT_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify exact HEAD
        run: test "$(git rev-parse HEAD)" = "$PRODUCT_HEAD"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.10.0 torchvision==0.25.0 torchaudio==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^(torch|torchvision|torchaudio)([<=>].*)?$' requirements.txt > /tmp/ceph-fourpart-deps.txt
          python -m pip install -r /tmp/ceph-fourpart-deps.txt
          python -m pip check
      - name: Verify four-part A4 PDF and preserve existing R17 gates
        run: |
          python -m pytest \
            backend/tests/test_cephalo_four_part_report.py \
            backend/tests/test_cephalo_r17_pdf_projection.py \
            backend/tests/test_cephalo_r17_pdf_certification.py \
            backend/tests/test_cephalo_r17_pdf_renderer_contract.py -q
      - name: Render authentic synthetic A4 pages for visual review
        run: |
          mkdir -p artifacts/ceph-fourpart-a4
          python - <<'PY'
          import fitz
          from pathlib import Path
          from backend.tests.test_cephalo_four_part_report import _vm, _projection
          from backend.services.generators.bilan_ortho_gen import BilanOrthoPDFGenerator
          root = Path('artifacts/ceph-fourpart-a4')
          filename = BilanOrthoPDFGenerator(str(root)).generate(
              _vm(), filename='synthetic-unsigned.pdf', projection=_projection())
          with fitz.open(filename) as pdf:
              assert len(pdf) >= 1
              text = '\n'.join(p.get_text() for p in pdf)
              assert 'BROUILLON' in text and 'IV' in text
              for n, page in enumerate(pdf, 1):
                  page.get_pixmap(matrix=fitz.Matrix(1.4, 1.4), alpha=False).save(
                      root / f'page-{n:02d}.png')
          print('FOUR_PART_A4_SYNTHETIC_DRAFT_RENDERED_NONCLINICAL')
          PY
      - name: Upload A4 rendered pages (NOT human clinical approval)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ceph-fourpart-a4-${{ github.event.pull_request.head.sha }}
          path: artifacts/ceph-fourpart-a4/
          if-no-files-found: warn
          retention-days: 30
