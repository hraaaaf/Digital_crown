name: Patient Companion D1 repair

on:
  push:
    branches:
      - feat/patient-companion-d1-ui
    paths:
      - '.github/workflows/patient-companion-d1-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/patient-companion-d1-ui
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Repair exact D1 certification defects
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}')
              p.write_text(text.replace(old, new))

          replace_once(
              'frontend/scripts/capture-patient-companion-d1-after.mjs',
              "        && !metrics.hasStaffNavigation\n        && stateValid;",
              "        && (state === 'public-entry' || !metrics.hasStaffNavigation)\n        && stateValid;",
          )
          replace_once(
              'frontend/src/PatientCompanionTransport.test.ts',
              '    vi.restoreAllMocks();',
              '    vi.clearAllMocks();',
          )
          for workflow in [
              '.github/workflows/patient-companion-d1-check.yml',
              '.github/workflows/patient-companion-d1-after.yml',
          ]:
              replace_once(
                  workflow,
                  'npm install --package-lock=false --legacy-peer-deps',
                  'npm ci --legacy-peer-deps',
              )
          PY
      - name: Add missing Testing Library peer and regenerate lockfile
        working-directory: frontend
        run: npm install --package-lock-only --save-dev --save-exact @testing-library/dom@10.4.1
      - name: Verify repaired contracts
        shell: bash
        run: |
          node - <<'NODE'
          const pkg = require('./frontend/package.json');
          const lock = require('./frontend/package-lock.json');
          if (pkg.dependencies.firebase !== '12.19.0') throw new Error('Firebase pin changed');
          if (pkg.devDependencies['@testing-library/dom'] !== '10.4.1') throw new Error('Testing Library DOM pin missing');
          if (lock.packages[''].dependencies.firebase !== '12.19.0') throw new Error('Firebase lock pin changed');
          if (lock.packages[''].devDependencies['@testing-library/dom'] !== '10.4.1') throw new Error('Testing Library DOM lock pin missing');
          NODE
          grep -F "state === 'public-entry' || !metrics.hasStaffNavigation" frontend/scripts/capture-patient-companion-d1-after.mjs
          grep -F 'vi.clearAllMocks();' frontend/src/PatientCompanionTransport.test.ts
          grep -F 'npm ci --legacy-peer-deps' .github/workflows/patient-companion-d1-check.yml
          grep -F 'npm ci --legacy-peer-deps' .github/workflows/patient-companion-d1-after.yml
      - name: Remove temporary helpers and commit repair
        shell: bash
        run: |
          rm -f .github/workflows/patient-companion-d1-lockfile.yml
          rm -f .github/workflows/patient-companion-d1-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "fix(patient-companion): repair D1 certification gates"
          git push origin HEAD:feat/patient-companion-d1-ui
