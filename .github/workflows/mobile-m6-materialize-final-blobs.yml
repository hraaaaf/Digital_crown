name: Mobile M6 Exact Blob Materializer

on:
  push:
    branches: [audit/mobile-m6-generator]
    paths: [.github/workflows/mobile-m6-materialize-final-blobs.yml]

permissions:
  actions: read
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    env:
      BASE_SHA: 2bf0f639b198b5aacdd1f797f62ea9ac11aa9cff
      ARTIFACT_ID: "9485239294"
      STAGE_BRANCH: audit/mobile-m61-blob-stage
      PATCH_B64_SHA256: b59f024b159fd0badf7e89dfaddbba1276e9f99be42166455ee0b7e5f58a7a9c
      PATCH_SHA256: e3a7197e2fd645d62832550f851a81da0e13b5f3b7decbc4e1cb4ac216f9d784
      CORRECTION_B64_SHA256: 058d981259735504002363252a9a18e97f9ce29008296160b27dace3f7dc6bad
      CORRECTION_SHA256: b3c081ae9edf56e89dd12f0ef795442da1444936d54aa109e2542eea51688f72
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/mobile-m6-generator
          fetch-depth: 0

      - name: Reconstruct exact corrected candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin master
          test "$(git rev-parse origin/master)" = "$BASE_SHA"
          git worktree add --detach /tmp/m61 "$BASE_SHA"

          gh api "repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID/zip" > /tmp/m61.zip
          rm -rf /tmp/m61-artifact && mkdir /tmp/m61-artifact
          unzip -q /tmp/m61.zip -d /tmp/m61-artifact
          test -d /tmp/m61-artifact/files
          cp -a /tmp/m61-artifact/files/. /tmp/m61/

          PATCH_B64="$GITHUB_WORKSPACE/.github/m6/m61-post-artifact.patch.gz.b64"
          printf '%s  %s\n' "$PATCH_B64_SHA256" "$PATCH_B64" | sha256sum -c -
          base64 -d "$PATCH_B64" | gzip -d > /tmp/m61-post.patch
          printf '%s  %s\n' "$PATCH_SHA256" /tmp/m61-post.patch | sha256sum -c -
          cd /tmp/m61
          git apply --check /tmp/m61-post.patch
          git apply /tmp/m61-post.patch

          CORRECTION_B64="$GITHUB_WORKSPACE/.github/m6/m61-correction.patch.gz.b64"
          printf '%s  %s\n' "$CORRECTION_B64_SHA256" "$CORRECTION_B64" | sha256sum -c -
          base64 -d "$CORRECTION_B64" | gzip -d > /tmp/m61-correction.patch
          printf '%s  %s\n' "$CORRECTION_SHA256" /tmp/m61-correction.patch | sha256sum -c -
          git apply --check /tmp/m61-correction.patch
          git apply /tmp/m61-correction.patch

      - name: Verify exact 13 corrected final blobs
        working-directory: /tmp/m61
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          test "$(git hash-object backend/database.py)" = "77aebb07ce0b91e924e897d217cf98e7141b4d74"
          test "$(git hash-object backend/main.py)" = "99be9a280d941d5297720ad5f833155661e287fd"
          test "$(git hash-object backend/models.py)" = "7c23a93116a2cdd0a786951c1256dfee13efa961"
          test "$(git hash-object backend/models_platform.py)" = "682ee86d17b2578893c083aca1002d3c5b0e2ff8"
          test "$(git hash-object backend/routers/admin_legacy.py)" = "184fa27e4fefd2244bc4f2b648dbdb421b63fbcf"
          test "$(git hash-object backend/routers/mobile.py)" = "02a6a2e8ef1c3f061ccb6b5de7e79df5523bc89d"
          test "$(git hash-object backend/routers/mobile_legacy.py)" = "9cba5cb7c2ec0ca26842baffe6105720fa374e3e"
          test "$(git hash-object backend/security.py)" = "2ca778135261f45e5db52ec93103c410725a4fc3"
          test "$(git hash-object backend/tests/test_mobile_credential_hardening.py)" = "e1412be9963d7c885dd90075d114f2913715b6f1"
          test "$(git hash-object backend/tests/test_mobile_identity_security.py)" = "db541ce1777944b695e9095c32606ad9d354fdf1"
          test "$(git hash-object backend/utils/rate_limit.py)" = "37bb5e164463d898dfe784c8c7429c581e5105c0"
          test "$(git hash-object frontend/src/features/mobile/Onboarding/OnboardingScanner.tsx)" = "27210fe4dfcee7146162e85895958dca98d4c97e"
          test "$(git hash-object frontend/src/services/zka/MobileStorage.ts)" = "2003f2cb044a15fc9c2f8f15f02c7c78d8a1827a"

          python -m py_compile \
            backend/database.py backend/main.py backend/models.py backend/models_platform.py \
            backend/routers/admin_legacy.py backend/routers/mobile.py backend/routers/mobile_legacy.py \
            backend/security.py backend/utils/rate_limit.py \
            backend/tests/test_mobile_credential_hardening.py backend/tests/test_mobile_identity_security.py

          grep -q 'token_type == "mobile"' backend/main.py
          grep -q 'get_mobile_user_license_status' backend/main.py
          grep -q 'camera=(self), microphone=(), geolocation=()' backend/main.py
          grep -q 'token_blacklist.revoke_mobile_access(emp_id, db)' backend/routers/admin_legacy.py
          grep -q 'test_mobile_mutation_uses_numeric_subject_as_user_id' backend/tests/test_mobile_identity_security.py
          grep -q 'test_permissions_policy_allows_same_origin_camera_only' backend/tests/test_mobile_identity_security.py
          grep -q 'test_admin_revoke_mobile_invalidates_claimed_device_and_refresh' backend/tests/test_mobile_identity_security.py

          git add -- \
            backend/database.py backend/main.py backend/models.py backend/models_platform.py \
            backend/routers/admin_legacy.py backend/routers/mobile.py backend/routers/mobile_legacy.py \
            backend/security.py backend/tests/test_mobile_credential_hardening.py \
            backend/tests/test_mobile_identity_security.py backend/utils/rate_limit.py \
            frontend/src/features/mobile/Onboarding/OnboardingScanner.tsx \
            frontend/src/services/zka/MobileStorage.ts
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 13
          ! git diff --cached --name-only | grep -Eq '(^|/)sw\.js$|vite\.config\.ts$|useMobileDashboard\.ts$|frontend/src/services/api\.ts$'

      - name: Publish corrected audit staging only
        working-directory: /tmp/m61
        run: |
          set -euo pipefail
          git config user.name "Digital Crown M6 Audit"
          git config user.email "123034021+hraaaaf@users.noreply.github.com"
          git commit -m "audit(m6): materialize corrected M6.1 final blobs"
          test "$(git rev-list --count "$BASE_SHA"..HEAD)" -eq 1
          git push --force origin "HEAD:refs/heads/$STAGE_BRANCH"
