name: Patient P0 G — Antecedents usage audit

on:
  push:
    branches:
      - agent/patient-page-p0-truth-safety
    paths:
      - .github/workflows/patient-p0-g-antecedents-audit.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/patient-page-p0-truth-safety
          fetch-depth: 0

      - name: Generate exhaustive repository usage audit
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          result = subprocess.run(
              ["git", "grep", "-n", "-I", "antecedents_medicaux", "--", ".", ":!docs/PATIENT_P0_G_ANTECEDENTS_USAGE_AUDIT.md"],
              text=True,
              capture_output=True,
          )
          if result.returncode not in (0, 1):
              raise SystemExit(result.stderr)
          hits = [line for line in result.stdout.splitlines() if line.strip()]

          report = [
              "# Patient P0-G — Audit exhaustif des usages `antecedents_medicaux`",
              "",
              "Source de preuve : `git grep -n -I antecedents_medicaux` exécuté sur la branche Patient P0. Ce rapport ne déduit aucune migration ; il inventorie uniquement les références réellement présentes dans le repository.",
              "",
              f"Nombre de références textuelles trouvées : **{len(hits)}**.",
              "",
              "## Références",
              "",
              "```text",
              *hits,
              "```",
              "",
              "## Gate P0-G",
              "",
              "La suppression ou migration de `DossierClinique.antecedents_medicaux` reste interdite tant que les références ci-dessus n'ont pas été classées en lecture, écriture, schéma, test ou documentation et qu'une stratégie de migration de données n'est pas prouvée.",
              "",
          ]
          Path("docs/PATIENT_P0_G_ANTECEDENTS_USAGE_AUDIT.md").write_text("\n".join(report), encoding="utf-8")
          PY

      - name: Verify report
        run: |
          test -s docs/PATIENT_P0_G_ANTECEDENTS_USAGE_AUDIT.md
          git diff --check

      - name: Commit report and remove temporary workflow
        run: |
          rm .github/workflows/patient-p0-g-antecedents-audit.yml
          git config user.name "digital-crown-ci"
          git config user.email "actions@users.noreply.github.com"
          git add docs/PATIENT_P0_G_ANTECEDENTS_USAGE_AUDIT.md .github/workflows/patient-p0-g-antecedents-audit.yml
          git commit -m "docs(patient): inventory medical antecedent truth sources"
          git push origin HEAD:agent/patient-page-p0-truth-safety
