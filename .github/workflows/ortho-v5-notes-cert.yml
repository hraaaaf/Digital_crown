name: ORTHO V5 G2 — Authenticated Practitioner Notes Gate
on:
  pull_request:
    paths:
      - 'backend/models.py'
      - 'alembic/versions/neo000000033_ortho_bilan_practitioner_notes.py'
      - 'backend/core/schema_runtime.py'
      - 'backend/services/legacy_sql_target_manifest_v15.py'
      - 'backend/schemas/ortho_bilan_notes.py'
      - 'backend/services/ortho_bilan_practitioner_notes.py'
      - 'backend/services/ortho_bilan_document_v5.py'
      - 'backend/services/document_factory.py'
      - 'backend/services/cephalo_document_lock.py'
      - 'backend/routers/patients.py'
      - 'frontend/src/features/ortho/components/OrthoPractitionerNotesApproval.tsx'
      - 'frontend/src/features/ortho/components/Step3Clinical.tsx'
      - 'frontend/src/features/ortho/cephaloRepository.ts'
      - 'tests/test_ortho_bilan_practitioner_approval.py'
      - '.github/workflows/ortho-v5-notes-cert.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend-practitioner-notes:
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact branch commit
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install minimal isolated backend contract dependencies
        run: |
          python -m pip install 'SQLAlchemy==2.0.28' 'pydantic==2.6.3' 'fastapi==0.115.6' 'alembic==1.14.0' \
            'PyPDF2==3.0.1' 'reportlab==4.4.10' 'Jinja2==3.1.6' 'weasyprint==68.1' \
            'arabic-reshaper==3.0.0' 'python-bidi==0.6.7' 'qrcode==8.2' \
            'svglib==1.5.1' 'pillow==12.2.0' 'python-jose==3.5.0' \
            'python-multipart==0.0.31' 'email-validator==2.3.0'
      - name: Compile and run real SQLite clinician approval tests
        run: |
          python -m compileall -q backend/models.py backend/services/ortho_bilan_practitioner_notes.py \
            backend/routers/patients.py backend/services/document_factory.py backend/services/ortho_bilan_document_v5.py
          python -m unittest discover -s tests -p 'test_ortho_bilan_practitioner_approval.py' -v
          python -m unittest discover -s tests -p 'test_ortho_bilan_v5_contract.py' -v
  frontend-types:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Typecheck clinician validation controls
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npx tsc --noEmit -p tsconfig.app.json
