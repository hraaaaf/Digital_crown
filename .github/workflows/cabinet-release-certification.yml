name: Cabinet Certified Release

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Exact 40-character master HEAD SHA to certify"
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: cabinet-release-cert-${{ inputs.commit_sha }}
  cancel-in-progress: false

env:
  CERTIFIED_SHA: ${{ inputs.commit_sha }}

jobs:
  preflight:
    name: Exact immutable master HEAD
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Refuse branches, tags, historical SHAs and moving refs
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$CERTIFIED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::commit_sha must match ^[0-9a-f]{40}$"
            exit 1
          fi
          if [[ "$GITHUB_REF" != "refs/heads/master" ]]; then
            echo "::error::Cabinet release certification must be dispatched from master"
            exit 1
          fi
          git fetch origin master --no-tags
          MASTER_SHA="$(git rev-parse origin/master)"
          if [[ "$CERTIFIED_SHA" != "$MASTER_SHA" || "$GITHUB_SHA" != "$MASTER_SHA" ]]; then
            echo "::error::Only the exact current immutable master HEAD can be newly certified"
            echo "requested=$CERTIFIED_SHA github_sha=$GITHUB_SHA master=$MASTER_SHA"
            exit 1
          fi

  backend:
    name: Backend full certification
    needs: preflight
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: certified-release-ci-secret-key-minimum-32-characters
      DATABASE_URL: "sqlite:///:memory:"
      ENVIRONMENT: development
      TELEMETRY_ENABLED: "false"
      CLOUD_AI_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.10.0 torchvision==0.25.0 torchaudio==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^(torch|torchvision|torchaudio)([<=>].*)?$' requirements.txt > /tmp/requirements-ci.txt
          pip install -r /tmp/requirements-ci.txt
          pip install httpx==0.28.1 pytest pytest-asyncio
          python -m pip check

      - name: Production safety contract
        run: python scripts/prod_safety_check.py
      - name: Full backend regression
        run: |
          # This file is a standalone PostgreSQL/rehearsal gate, not a pytest
          # module: its top-level safety assertions reject the general SQLite
          # suite. A separate standalone staff-gateway unittest script also
          # imports an unqualified sibling module under a constrained process.
          # Keep both independent security harnesses and their CI intact.
          # The 14 legacy-migration scripts have a standalone subprocess entrypoint.
          # Their own mandatory PG18/SQLite isolated job runs ALL of them;
          # collecting them inside this shared pytest runtime violates isolation.
          python -m pytest backend/tests -q --maxfail=1 \
            --ignore-glob='backend/tests/test_legacy_migration_*.py' \
            --ignore-glob='backend/tests/test_legacy_sql_*.py'

  postgres18:
    name: PostgreSQL 18 upgrade + preservation
    needs: preflight
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cabinet_compat
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cabinet_compat"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/cabinet_compat
      CABINET_COMPAT_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/cabinet_compat
      SECRET_KEY: certified-release-postgres-secret-key-minimum-32-characters
      SUPERADMIN_EMAIL: ci-admin@example.invalid
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install compatibility dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Cabinet compatibility gates
        run: |
          python -m pytest \
            backend/tests/test_cabinet_upgrade_compatibility.py \
            backend/tests/test_cabinet_upgrade_postgres.py \
            backend/tests/test_clinic_local_data_preservation.py \
            backend/tests/test_certified_release_policy.py \
            -q

  frontend:
    name: Frontend tests + production build
    needs: preflight
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Frontend regression
        run: npm test
      - name: Build exact-SHA frontend
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: certified-frontend-${{ inputs.commit_sha }}
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 14

  legacy-standalone:
    name: Independent 14-script PostgreSQL 18 legacy-migration gate
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dc_cert_candidate_rehearsal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dc_cert_candidate_rehearsal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/dc_cert_candidate_rehearsal
      ENVIRONMENT: rehearsal
      SECRET_KEY: candidate-rehearsal-jwt-secret-key-minimum-32-characters
      DIGITALCROWN_ISOLATED_RUNTIME: '1'
      TELEMETRY_ENABLED: 'false'
      CLOUD_AI_ENABLED: 'false'
      DEBUG: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
      - name: Verify exact PR head
        env:
          EXPECTED_HEAD: ${{ inputs.commit_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated HTTP/PG dependencies
        run: |
          python -m pip install alembic==1.20.0 sqlalchemy==2.0.28 psycopg2-binary==2.9.9 \
            'pydantic[email]==2.6.3' pydantic-settings==2.2.1 \
            fastapi==0.115.6 starlette==0.41.3 httpx==0.28.1 \
            python-jose==3.5.0 passlib==1.7.4 bcrypt==3.2.2 \
            python-multipart==0.0.31 python-dotenv==1.2.1 \
            cryptography==49.0.0 PyYAML==6.0.3
      - name: Migrate fresh isolated PostgreSQL 18
        run: alembic upgrade head
      - name: Execute standalone safety contract (no pytest collection)
        run: |
          set -euo pipefail
          PYTHONPATH=. python backend/tests/test_legacy_migration_http_pg_v15.py 2>&1 | tee /tmp/candidate-rehearsal.log
          grep -q '^LOT05_6_HTTP_PG_PASS ' /tmp/candidate-rehearsal.log
      - name: Preserve independent staff-gateway unittest guards
        run: |
          set -euo pipefail
          PYTHONWARNINGS=error::ResourceWarning python backend/tests/test_legacy_migration_staff_gateway_v15.py -v 2>&1 | tee /tmp/candidate-staff-gateway.log
          grep -q '^Ran 14 tests' /tmp/candidate-staff-gateway.log
          grep -q '^OK$' /tmp/candidate-staff-gateway.log
      - name: Official synthetic-file and preceding legacy-migration safety contracts
        run: |
          set -euo pipefail
          PYTHONWARNINGS=error::ResourceWarning python backend/tests/test_legacy_migration_synthetic_file_v15.py -v 2>&1 | tee /tmp/candidate-synthetic-file.log
          grep -q 'Ran 12 tests' /tmp/candidate-synthetic-file.log
          grep -q '^OK$' /tmp/candidate-synthetic-file.log
          for item in \
            "test_legacy_sql_sqlite_e2e_100x200_v15.py:11" \
            "test_legacy_sql_tenant_link_guard_lab_v15.py:7" \
            "test_legacy_sql_physical_schema_gate_lab_v15.py:6" \
            "test_legacy_sql_replay_restore_lab_v15.py:8" \
            "test_legacy_sql_real_orm_scratch_v15.py:10" \
            "test_legacy_sql_synthetic_dryrun_v15.py:19" \
            "test_legacy_sql_migration_scenarios_v15.py:12" \
            "test_legacy_sql_mapping_v15.py:25" \
            "test_legacy_sql_target_manifest_v15.py:25"; do
            name="${item%%:*}"
            count="${item##*:}"
            python "backend/tests/${name}" -v 2>&1 | tee "/tmp/${name}.log"
            grep -q "Ran ${count} tests" "/tmp/${name}.log"
            grep -q '^OK$' "/tmp/${name}.log"
          done
          python -m unittest discover -s backend/tests -p 'test_legacy_sql_inspector_v15*.py' -v 2>&1 | tee /tmp/candidate-inspector.log
          grep -q 'Ran 28 tests' /tmp/candidate-inspector.log
          grep -q '^OK$' /tmp/candidate-inspector.log

  package:
    name: Emit attested CODE_CERTIFIED universal artifact
    needs: [preflight, backend, postgres18, frontend, legacy-standalone]
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install release verification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check
      - uses: actions/download-artifact@v4
        with:
          name: certified-frontend-${{ inputs.commit_sha }}
          path: /tmp/certified-frontend

      - name: Materialize exact-SHA CODE_CERTIFIED release
        id: materialize
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CERTIFIED_SHA"
          SHORT_SHA="${CERTIFIED_SHA:0:12}"
          RELEASE_ID="dc-cabinet-${SHORT_SHA}-run${GITHUB_RUN_ID}"
          ROOT="$RUNNER_TEMP/certified-release"
          mkdir -p "$ROOT/frontend/dist"

          # Runtime/build inputs are copied from the checked-out exact SHA only.
          cp -a backend "$ROOT/backend"
          cp -a relay "$ROOT/relay"
          cp -a alembic "$ROOT/alembic"
          cp alembic.ini run.py DigitalCrown.spec requirements.txt "$ROOT/"
          cp -a installer "$ROOT/installer"
          cp -a /tmp/certified-frontend/. "$ROOT/frontend/dist/"

          # Package-closure gates: the emitted artifact must contain every top-level
          # runtime/update input required after checkout is gone.
          test -f "$ROOT/alembic.ini"
          test -f "$ROOT/relay/contract.py"
          PYTHONPATH="$ROOT" python -c "from relay.contract import JOSE_JWE_ALG; import backend.services.patient_companion_remote_crypto; print('PACKAGE_IMPORT_SMOKE=PASS')"
          (
            cd "$ROOT"
            PYTHONPATH="$ROOT" python -m alembic heads
          )

          python - "$ROOT" <<'PY'
          import hashlib
          import json
          import os
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path(sys.argv[1])
          sha = os.environ["CERTIFIED_SHA"]
          run_id = int(os.environ["GITHUB_RUN_ID"])
          release_id = f"dc-cabinet-{sha[:12]}-run{run_id}"
          cert_name = "release-certification.json"
          marker_name = ".digitalcrown-release-sha"
          manifest_name = "release-content.sha256"

          excluded = {cert_name, marker_name, manifest_name}
          lines = []
          for path in sorted(p for p in root.rglob("*") if p.is_file()):
              rel = path.relative_to(root).as_posix()
              if rel in excluded:
                  continue
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              lines.append(f"{digest}  {rel}")
          manifest = root / manifest_name
          manifest.write_text("\n".join(lines) + "\n", encoding="utf-8")
          manifest_digest = hashlib.sha256(manifest.read_bytes()).hexdigest()

          certificate = {
              "certificate_version": 1,
              "artifact_type": "cabinet-certified-release",
              "certification_level": "CODE_CERTIFIED",
              "repository": "hraaaaf/Digital_crown",
              "commit_sha": sha,
              "release_id": release_id,
              "certified_packs": ["BASIC", "GOLD", "ELITE"],
              "certification_run_id": run_id,
              "certified_at": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
              "content_manifest_sha256": manifest_digest,
              "attestation_subject": manifest_name,
              "installable": False,
              "installable_requires": "runtime-asset composition",
              "checks": [
                  "backend-full",
                  "frontend-tests-build",
                  "postgres18-upgrade",
                  "local-data-preservation",
                  "certified-release-policy",
              ],
          }
          (root / cert_name).write_text(json.dumps(certificate, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          (root / marker_name).write_text(sha + "\n", encoding="utf-8")
          print(release_id)
          PY

          for PACK in BASIC GOLD ELITE; do
            PYTHONPATH="$ROOT" python "$ROOT/backend/scripts/verify_certified_release.py" \
              --release-dir "$ROOT" --expected-pack "$PACK"
          done

          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"

      - name: Cryptographically attest the code content manifest
        uses: actions/attest@v4
        with:
          subject-path: ${{ runner.temp }}/certified-release/release-content.sha256

      - name: Certification summary
        shell: bash
        run: |
          cat "$RUNNER_TEMP/certified-release/release-certification.json"
          echo "CODE_CERTIFIED immutable SHA: $CERTIFIED_SHA"
          echo "Universal release profiles: BASIC / GOLD / ELITE"
          echo "NOT INSTALLABLE until certified runtime assets are composed locally."

      - uses: actions/upload-artifact@v4
        with:
          name: code-certified-${{ steps.materialize.outputs.release_id }}
          path: ${{ runner.temp }}/certified-release/
          if-no-files-found: error
          retention-days: 90
          include-hidden-files: true
