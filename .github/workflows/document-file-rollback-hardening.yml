name: Harden Financial PDF Rollback

on:
  push:
    branches: [fix/document-archive-consistency]
    paths:
      - '.github/workflows/document-file-rollback-hardening.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/document-archive-consistency
          fetch-depth: 0
      - name: Apply guarded rollback hardening
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('backend/routers/documents.py')
          text=p.read_text()

          old='''    replacement_file_backups: list[tuple[pathlib.Path, bytes]] = []\n\n    def _backup_financial_edit_files() -> None:\n'''
          new='''    replacement_file_backups: list[tuple[pathlib.Path, bytes]] = []\n    financial_edit_committed = False\n\n    def _backup_financial_edit_files() -> None:\n'''
          if text.count(old) != 1: raise SystemExit(f'backup declaration mismatch: {text.count(old)}')
          text=text.replace(old,new,1)

          old='''    def _restore_financial_edit_files() -> None:\n        for path, content in replacement_file_backups:\n            path.parent.mkdir(parents=True, exist_ok=True)\n            path.write_bytes(content)\n'''
          new='''    def _restore_financial_edit_files() -> None:\n        if financial_edit_committed:\n            return\n        for path, content in replacement_file_backups:\n            path.parent.mkdir(parents=True, exist_ok=True)\n            path.write_bytes(content)\n'''
          if text.count(old) != 1: raise SystemExit(f'restore mismatch: {text.count(old)}')
          text=text.replace(old,new,1)

          old='''            if req.type in ["honoraires", "note"]:\n                for backup_path, _ in replacement_file_backups[1:]:\n                    backup_path.write_bytes(pdf_content)\n'''
          new='''            if req.type in ["honoraires", "note"]:\n                if doc.file_path.startswith("static/archives/") or doc.file_path.startswith("static/documents/"):\n                    canonical_after = (MEDIA_DIR / doc.file_path.replace("static/", "", 1)).resolve()\n                else:\n                    canonical_after = (BASE_DIR / doc.file_path).resolve()\n                for backup_path, _ in replacement_file_backups:\n                    if backup_path != canonical_after:\n                        backup_path.write_bytes(pdf_content)\n'''
          if text.count(old) != 1: raise SystemExit(f'legacy sync mismatch: {text.count(old)}')
          text=text.replace(old,new,1)

          old='''                # Commit unique du lot comptable Document Studio.\n                db.commit()\n'''
          new='''                # Commit unique du lot comptable Document Studio.\n                db.commit()\n                financial_edit_committed = True\n'''
          if text.count(old) != 1: raise SystemExit(f'commit mismatch: {text.count(old)}')
          text=text.replace(old,new,1)

          p.write_text(text)
          PY
          python -m py_compile backend/routers/documents.py
          grep -q 'financial_edit_committed = True' backend/routers/documents.py
          grep -q 'if financial_edit_committed:' backend/routers/documents.py
          grep -q 'backup_path != canonical_after' backend/routers/documents.py
      - name: Commit and remove one-shot workflow
        run: |
          rm .github/workflows/document-file-rollback-hardening.yml
          git config user.name 'Digital Crown CI'
          git config user.email 'actions@users.noreply.github.com'
          git add backend/routers/documents.py .github/workflows/document-file-rollback-hardening.yml
          git commit -m 'Harden rollback of edited financial PDFs'
          git push origin HEAD:fix/document-archive-consistency
