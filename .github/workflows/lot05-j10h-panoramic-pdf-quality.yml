name: LOT05 J10H — written panoramic PDF quality and source fidelity

on:
  pull_request:
    branches:
      - exp/lot05-j10g-panoramic-text-report-pdf-20261022
    paths:
      - 'backend/services/panoramic_pdf_outline.py'
      - 'backend/services/generators/panoramic_elite_gen.py'
      - 'backend/templates/panoramic_elite.html'
      - 'backend/tests/test_panoramic_pdf_quality_j10h.py'
      - 'backend/tests/test_panoramic_pdf_text_only_j10g.py'
      - '.github/workflows/lot05-j10h-panoramic-pdf-quality.yml'
      - 'docs/research/LOT05_J10H_*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-pdf-quality:
    name: "Written report PDF: faithful sections, secure text and no images"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact PR source
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PDF rendering and inspection only — no database
        run: |
          python -m pip install 'weasyprint==68.1' 'jinja2==3.1.6' 'pypdf==6.1.3'
          python -m pip check
      - name: Existing J10G text-only protected report suite
        run: python backend/tests/test_panoramic_pdf_text_only_j10g.py -v
      - name: J10H true PDF quality, long-form and XSS checks
        run: python backend/tests/test_panoramic_pdf_quality_j10h.py -v
      - name: Verify no scanned or patient radiographs in files/artifacts
        run: |
          python - <<'PY'
          from pathlib import Path
          template = Path("backend/templates/panoramic_elite.html").read_text()
          assert "<img" not in template.lower()
          assert "pano_url" not in template
          assert "cephalo_url" not in template
          assert "qr_code_base64" not in template
          assert "cat.findings" in template
          print("PASS: synthetic-only PDF tests with no image resources or new clinical access")
          PY
