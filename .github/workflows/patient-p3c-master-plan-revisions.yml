name: Patient P3C Master Plan Revisions

on:
  pull_request:
    branches:
      - agent/patient-page-p2-journey
    paths:
      - '.github/workflows/patient-p3c-master-plan-revisions.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/patient-page-p3-clinique'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ENVIRONMENT: test
      SECRET_KEY: patient-p3c-secret-000001
      DATABASE_URL: sqlite:///./p3c-master-plan.db
      TELEMETRY_ENABLED: 'false'
      CLOUD_AI_ENABLED: 'false'
      DEBUG: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply P3-C append-only Master Plan revisions
        run: |
          python - <<'PY'
          from pathlib import Path

          patients = Path('backend/routers/patients.py')
          migration = Path('alembic/versions/d5e6f7a8b9c0_add_patient_odontograms.py')
          test = Path('backend/tests/test_patient_p3_master_plan_revisions.py')

          p = patients.read_text(encoding='utf-8')
          old = '''# --- MASTER PLAN CLINIQUE ---

@router.get("/{patient_id}/master-plan", response_model=Optional[schemas.TreatmentMasterPlanOut])
def get_master_plan(patient_id: int, db: Session = Depends(database.get_db), current_user: models.User = Depends(require_permission("clinical"))):
    assert_patient_access(patient_id, current_user, db)
    plan = db.query(models.TreatmentMasterPlan).filter(models.TreatmentMasterPlan.patient_id == patient_id).first()
    return plan

@router.put("/{patient_id}/master-plan", response_model=schemas.TreatmentMasterPlanOut)
def update_master_plan(patient_id: int, steps: List[schemas.TreatmentPlanStepCreate], db: Session = Depends(database.get_db), current_user: models.User = Depends(require_permission("clinical"))):
    assert_patient_access(patient_id, current_user, db)
    plan = db.query(models.TreatmentMasterPlan).filter(models.TreatmentMasterPlan.patient_id == patient_id).first()
    if not plan:
        plan = models.TreatmentMasterPlan(patient_id=patient_id)
        db.add(plan)
        db.flush()
    else:
        db.query(models.TreatmentPlanStep).filter(models.TreatmentPlanStep.plan_id == plan.id).delete()
        
    for i, step_data in enumerate(steps):
        step = models.TreatmentPlanStep(
            plan_id=plan.id,
            title=step_data.title,
            assistant=step_data.assistant,
            status=step_data.status,
            date_str=step_data.date_str,
            order_index=i
        )
        db.add(step)
        
    db.commit()
    db.refresh(plan)
    return plan
'''
          new = '''# --- MASTER PLAN CLINIQUE ---

@router.get("/{patient_id}/master-plan", response_model=Optional[schemas.TreatmentMasterPlanOut])
def get_master_plan(patient_id: int, db: Session = Depends(database.get_db), current_user: models.User = Depends(require_permission("clinical"))):
    assert_patient_access(patient_id, current_user, db)
    plan = db.query(models.TreatmentMasterPlan).filter(models.TreatmentMasterPlan.patient_id == patient_id).first()
    return plan


@router.get("/{patient_id}/master-plan/revisions")
def get_master_plan_revisions(
    patient_id: int,
    limit: int = 20,
    db: Session = Depends(database.get_db),
    current_user: models.User = Depends(require_permission("clinical")),
):
    """Retourne les snapshots append-only du Master Plan, du plus récent au plus ancien."""
    assert_patient_access(patient_id, current_user, db)
    from backend.models_clinical_p3 import TreatmentMasterPlanRevision

    safe_limit = max(1, min(limit, 100))
    revisions = (
        db.query(TreatmentMasterPlanRevision)
        .filter(TreatmentMasterPlanRevision.patient_id == patient_id)
        .order_by(TreatmentMasterPlanRevision.revision.desc())
        .limit(safe_limit)
        .all()
    )
    return [
        {
            "id": revision.id,
            "plan_id": revision.plan_id,
            "patient_id": revision.patient_id,
            "revision": revision.revision,
            "steps_snapshot": revision.steps_snapshot,
            "updated_by": revision.updated_by,
            "created_at": revision.created_at,
        }
        for revision in revisions
    ]


@router.put("/{patient_id}/master-plan", response_model=schemas.TreatmentMasterPlanOut)
def update_master_plan(patient_id: int, steps: List[schemas.TreatmentPlanStepCreate], db: Session = Depends(database.get_db), current_user: models.User = Depends(require_permission("clinical"))):
    assert_patient_access(patient_id, current_user, db)
    from backend.models_clinical_p3 import TreatmentMasterPlanRevision

    plan = (
        db.query(models.TreatmentMasterPlan)
        .filter(models.TreatmentMasterPlan.patient_id == patient_id)
        .with_for_update()
        .first()
    )
    if not plan:
        plan = models.TreatmentMasterPlan(patient_id=patient_id)
        db.add(plan)
        db.flush()
    else:
        db.query(models.TreatmentPlanStep).filter(
            models.TreatmentPlanStep.plan_id == plan.id
        ).delete(synchronize_session=False)

    snapshot = []
    for i, step_data in enumerate(steps):
        step = models.TreatmentPlanStep(
            plan_id=plan.id,
            title=step_data.title,
            assistant=step_data.assistant,
            status=step_data.status,
            date_str=step_data.date_str,
            order_index=i,
        )
        db.add(step)
        snapshot.append({
            "title": step_data.title,
            "assistant": step_data.assistant,
            "status": step_data.status,
            "date_str": step_data.date_str,
            "order_index": i,
        })

    plan.updated_at = datetime.now()
    db.flush()
    last_revision = (
        db.query(func.max(TreatmentMasterPlanRevision.revision))
        .filter(TreatmentMasterPlanRevision.plan_id == plan.id)
        .scalar()
        or 0
    )
    db.add(TreatmentMasterPlanRevision(
        plan_id=plan.id,
        patient_id=patient_id,
        revision=last_revision + 1,
        steps_snapshot=snapshot,
        updated_by=current_user.id,
    ))

    db.commit()
    db.refresh(plan)
    return plan
'''
          if old not in p:
              if 'master-plan/revisions' not in p:
                  raise SystemExit('Master Plan block not recognized')
          else:
              p = p.replace(old, new, 1)
              patients.write_text(p, encoding='utf-8')

          m = migration.read_text(encoding='utf-8')
          marker = '''    op.create_index("ix_clinical_conclusions_created_at", "clinical_conclusions", ["created_at"], unique=False)\n\n\ndef downgrade() -> None:\n'''
          addition = '''    op.create_index("ix_clinical_conclusions_created_at", "clinical_conclusions", ["created_at"], unique=False)\n\n    op.create_table(\n        "treatment_master_plan_revisions",\n        sa.Column("id", sa.Integer(), nullable=False),\n        sa.Column("plan_id", sa.Integer(), nullable=False),\n        sa.Column("patient_id", sa.Integer(), nullable=False),\n        sa.Column("revision", sa.Integer(), nullable=False),\n        sa.Column("steps_snapshot", sa.JSON(), nullable=False),\n        sa.Column("updated_by", sa.Integer(), nullable=True),\n        sa.Column("created_at", sa.DateTime(), nullable=False, server_default=sa.func.now()),\n        sa.ForeignKeyConstraint(["plan_id"], ["treatment_master_plans.id"], ondelete="CASCADE"),\n        sa.ForeignKeyConstraint(["patient_id"], ["patients.id"], ondelete="CASCADE"),\n        sa.ForeignKeyConstraint(["updated_by"], ["users.id"], ondelete="SET NULL"),\n        sa.PrimaryKeyConstraint("id"),\n        sa.UniqueConstraint("plan_id", "revision", name="uq_master_plan_revision"),\n    )\n    op.create_index("ix_treatment_master_plan_revisions_plan_id", "treatment_master_plan_revisions", ["plan_id"], unique=False)\n    op.create_index("ix_treatment_master_plan_revisions_patient_id", "treatment_master_plan_revisions", ["patient_id"], unique=False)\n    op.create_index("ix_treatment_master_plan_revisions_updated_by", "treatment_master_plan_revisions", ["updated_by"], unique=False)\n    op.create_index("ix_treatment_master_plan_revisions_created_at", "treatment_master_plan_revisions", ["created_at"], unique=False)\n\n\ndef downgrade() -> None:\n    op.drop_index("ix_treatment_master_plan_revisions_created_at", table_name="treatment_master_plan_revisions")\n    op.drop_index("ix_treatment_master_plan_revisions_updated_by", table_name="treatment_master_plan_revisions")\n    op.drop_index("ix_treatment_master_plan_revisions_patient_id", table_name="treatment_master_plan_revisions")\n    op.drop_index("ix_treatment_master_plan_revisions_plan_id", table_name="treatment_master_plan_revisions")\n    op.drop_table("treatment_master_plan_revisions")\n'''
          if 'op.create_table(\n        "treatment_master_plan_revisions"' not in m:
              if marker not in m:
                  raise SystemExit('P3 migration marker missing')
              m = m.replace(marker, addition, 1)
              migration.write_text(m, encoding='utf-8')

          test.write_text('''from datetime import datetime\n\nfrom backend import models\nfrom backend.models_clinical_p3 import TreatmentMasterPlanRevision  # noqa: F401 — registers metadata\n\n\ndef _make_patient(db, owner):\n    patient = models.Patient(\n        numero_dossier="P3-PLAN-REV-1",\n        nom="PLAN",\n        prenom="Revision",\n        date_naissance=datetime(1990, 1, 1),\n        sexe="M",\n        employer_id=owner.id,\n    )\n    db.add(patient)\n    db.commit()\n    db.refresh(patient)\n    return patient\n\n\ndef test_master_plan_saves_append_revisions(client, db, dentiste, auth_headers):\n    patient = _make_patient(db, dentiste)\n    url = f"/api/patients/{patient.id}/master-plan"\n\n    first = client.put(url, headers=auth_headers, json=[{\n        "title": "Assainissement", "assistant": "GENERAL", "status": "pending", "date_str": "2026-08-19"\n    }])\n    assert first.status_code == 200, first.text\n\n    second = client.put(url, headers=auth_headers, json=[{\n        "title": "Restauration", "assistant": "GENERAL", "status": "pending", "date_str": "2026-08-20"\n    }])\n    assert second.status_code == 200, second.text\n\n    history = client.get(f"{url}/revisions", headers=auth_headers)\n    assert history.status_code == 200, history.text\n    rows = history.json()\n    assert [row["revision"] for row in rows[:2]] == [2, 1]\n    assert rows[0]["steps_snapshot"][0]["title"] == "Restauration"\n    assert rows[1]["steps_snapshot"][0]["title"] == "Assainissement"\n    assert rows[0]["updated_by"] == dentiste.id\n\n\ndef test_master_plan_revision_history_is_patient_scoped(client, db, dentiste, auth_headers):\n    patient = _make_patient(db, dentiste)\n    client.put(\n        f"/api/patients/{patient.id}/master-plan",\n        headers=auth_headers,\n        json=[{"title": "Etape", "assistant": "GENERAL", "status": "pending", "date_str": "2026-08-19"}],\n    )\n    missing = client.get("/api/patients/999999/master-plan/revisions", headers=auth_headers)\n    assert missing.status_code in (403, 404), missing.text\n''', encoding='utf-8')

          final_p = patients.read_text(encoding='utf-8')
          final_m = migration.read_text(encoding='utf-8')
          for required in ['master-plan/revisions', 'TreatmentMasterPlanRevision', 'steps_snapshot=snapshot', 'updated_by=current_user.id']:
              if required not in final_p:
                  raise SystemExit(f'P3-C patients requirement missing: {required}')
          if 'treatment_master_plan_revisions' not in final_m:
              raise SystemExit('P3-C migration table missing')
          PY
          python -m compileall -q backend alembic/versions/d5e6f7a8b9c0_add_patient_odontograms.py
          git diff --check

      - name: Install targeted test dependencies
        run: |
          python -m pip install --upgrade pip
          grep -vE '^(torch|torchvision)([<=>].*)?$' requirements.txt > /tmp/requirements-p3c.txt
          pip install -r /tmp/requirements-p3c.txt
          pip install httpx==0.27.2

      - name: Run P3-C targeted tests
        run: |
          rm -f p3c-master-plan.db
          pytest -q backend/tests/test_patient_p3_master_plan_revisions.py

      - name: Commit P3-C revisions
        run: |
          git config user.name 'digital-crown-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add backend/routers/patients.py backend/tests/test_patient_p3_master_plan_revisions.py alembic/versions/d5e6f7a8b9c0_add_patient_odontograms.py
          git diff --cached --quiet && exit 0
          git commit -m 'fix(patient): version P3 Master Plan saves'
          git push origin HEAD:${GITHUB_HEAD_REF}
