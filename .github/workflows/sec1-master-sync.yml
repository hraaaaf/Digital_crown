name: SEC-1 deterministic master sync

on:
  push:
    branches:
      - security/sec1-signed-licenses
    paths:
      - '.github/workflows/sec1-master-sync.yml'

permissions:
  contents: write

jobs:
  merge-master:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout SEC-1 branch
        uses: actions/checkout@v4
        with:
          ref: security/sec1-signed-licenses
          fetch-depth: 0

      - name: Merge current master with deterministic auth resolution
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin master

          SEC1_HEAD=$(git rev-parse HEAD)
          MASTER_HEAD=$(git rev-parse origin/master)
          echo "SEC1_HEAD=$SEC1_HEAD"
          echo "MASTER_HEAD=$MASTER_HEAD"

          set +e
          git merge --no-commit --no-ff "$MASTER_HEAD"
          MERGE_RC=$?
          set -e

          UNMERGED=$(git diff --name-only --diff-filter=U || true)
          if [ -n "$UNMERGED" ] && [ "$UNMERGED" != "backend/routers/auth.py" ]; then
            echo "Unexpected merge conflicts:"
            printf '%s\n' "$UNMERGED"
            exit 1
          fi

          if [ "$MERGE_RC" -ne 0 ]; then
            test "$UNMERGED" = "backend/routers/auth.py"
            git checkout --ours backend/routers/auth.py

            MASTER_HEAD="$MASTER_HEAD" python - <<'PY'
          import os
          import subprocess
          from pathlib import Path

          path = Path('backend/routers/auth.py')
          ours = path.read_text(encoding='utf-8')
          master_sha = os.environ['MASTER_HEAD']
          master = subprocess.check_output(
              ['git', 'show', f'{master_sha}:backend/routers/auth.py'],
              text=True,
              encoding='utf-8',
          )
          marker = '# ---------------------------------------------------------------------------\n# Google OAuth 2.0 — Authorization Code Flow\n# ---------------------------------------------------------------------------'
          if marker not in ours or marker not in master:
              raise SystemExit('Google OAuth marker missing during deterministic merge')

          merged = ours.split(marker, 1)[0].rstrip() + '\n\n' + marker + master.split(marker, 1)[1]
          if 'import os\n' not in merged:
              merged = merged.replace('import logging\n', 'import logging\nimport os\n', 1)

          required = (
              'return is_platform_superadmin(user)',
              'await _enforce_signed_license_for_mutation(request, db, user)',
              'if request.url.path.startswith("/api/superadmin") and token_type != "access":',
              '_GOOGLE_LOCAL_HTTPS_ORIGIN = "https://127.0.0.1:8005"',
              '_GOOGLE_LOCAL_HTTP_ORIGIN = "http://127.0.0.1:8005"',
              'os.getenv("DIGITALCROWN_ENABLE_HTTPS", "false")',
              'return f"{_google_local_origin()}/api/auth/google/callback"',
              'if _cabinet_https_enabled():',
              'frontend_url = _GOOGLE_LOCAL_HTTPS_ORIGIN',
              '"redirect_uri": _google_redirect_uri(),',
              'return _GOOGLE_LOCAL_HTTPS_ORIGIN if _cabinet_https_enabled() else _GOOGLE_LOCAL_HTTP_ORIGIN',
          )
          missing = [needle for needle in required if needle not in merged]
          if missing:
              raise SystemExit(f'Merged auth missing required contracts: {missing}')

          compile(merged, str(path), 'exec')
          path.write_text(merged, encoding='utf-8')
          PY
            git add backend/routers/auth.py
          fi

          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "Unresolved conflicts remain"
            git diff --name-only --diff-filter=U
            exit 1
          fi

          python -m py_compile backend/routers/auth.py
          python - <<'PY'
          from pathlib import Path
          source = Path('backend/routers/auth.py').read_text(encoding='utf-8')
          required = (
              'return is_platform_superadmin(user)',
              'await _enforce_signed_license_for_mutation(request, db, user)',
              'if request.url.path.startswith("/api/superadmin") and token_type != "access":',
              '_GOOGLE_LOCAL_HTTPS_ORIGIN = "https://127.0.0.1:8005"',
              '_GOOGLE_LOCAL_HTTP_ORIGIN = "http://127.0.0.1:8005"',
              'os.getenv("DIGITALCROWN_ENABLE_HTTPS", "false")',
              'return f"{_google_local_origin()}/api/auth/google/callback"',
              'if _cabinet_https_enabled():',
              'frontend_url = _GOOGLE_LOCAL_HTTPS_ORIGIN',
              '"redirect_uri": _google_redirect_uri(),',
              'return _GOOGLE_LOCAL_HTTPS_ORIGIN if _cabinet_https_enabled() else _GOOGLE_LOCAL_HTTP_ORIGIN',
          )
          missing = [needle for needle in required if needle not in source]
          if missing:
              raise SystemExit(f'Final auth contract missing: {missing}')
          PY

          git rm .github/workflows/sec1-master-sync.yml
          git add -A
          git commit -m "merge(master): sync OAuth HTTPS into SEC-1"
          git push origin HEAD:security/sec1-signed-licenses
