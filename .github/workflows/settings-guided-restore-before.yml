name: Settings Guided Restore BEFORE

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  before:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout immutable BEFORE
        uses: actions/checkout@v4
        with:
          ref: 99c2aa32c6b145804467f7f38ea10722c2714e78

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend and Chromium
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Inject immutable Settings security harness
        working-directory: frontend
        run: |
          cat > settings-guided-restore-before.html <<'EOF'
          <!doctype html><html lang="fr"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><link rel="icon" href="data:,"/><title>Guided Restore BEFORE</title></head><body><div id="root"></div><script type="module" src="/src/settings-guided-restore-before.tsx"></script></body></html>
          EOF

          cat > src/settings-guided-restore-before.tsx <<'EOF'
          import React from 'react';
          import { createRoot } from 'react-dom/client';
          import { MemoryRouter } from 'react-router-dom';
          import './index.css';
          import Settings from './pages/Settings';
          import { useAuthStore } from './stores/useAuthStore';

          useAuthStore.setState({
            user: ({ id: 1, email: 'admin@guided-restore-cert.local', nom_complet: 'Dr Restore', role: 'ADMIN', is_superadmin: false, permissions: {} } as any),
            isAuthenticated: true,
            isLoading: false,
            error: null,
          });

          createRoot(document.getElementById('root')!).render(
            <MemoryRouter initialEntries={['/settings']}><Settings /></MemoryRouter>,
          );
          EOF

          cat > settings-guided-restore-before.mjs <<'EOF'
          import { chromium } from 'playwright';
          import { createServer } from 'vite';
          import fs from 'node:fs/promises';

          const output = 'settings-guided-restore-before-artifacts';
          const viewports = [
            { width: 1440, height: 1200 }, { width: 768, height: 1200 }, { width: 390, height: 1200 },
            { width: 360, height: 1200 }, { width: 320, height: 1200 },
          ];
          await fs.mkdir(output, { recursive: true });
          const json = body => ({ status: 200, contentType: 'application/json', body: JSON.stringify(body) });
          const profile = { id: 1, public_id: 'guided-restore-cert', nom_cabinet: 'Cabinet Restore', nom_praticien: 'Dr Restore', footer_address: 'Rabat, Maroc', footer_phones: '05 37 00 00 00', primary_color: '#003380', secondary_color: '#1e40af', accent_color: '#60a5fa', selected_theme: 'elite', font_fr: 'inter', selected_template: 'swiss', header_lines_fr: ['Dr Restore'], header_lines_ar: [], specialty_ids: [], contacts_json: {}, margin_top: 3.6, margin_bottom: 3.2, watermark_enabled: false, use_letterhead: false, qr_code_enabled: false, qr_code_type: 'VCARD', qr_code_style: 'dots', show_patient_badges: true, performance_mode: false, clinical_tips_enabled: true, hide_header: true, hide_footer: true, cabinet_type: 'PRIVE' };
          const server = await createServer({ server: { host: '127.0.0.1', port: 4178, strictPort: true }, clearScreen: false });
          await server.listen();
          const browser = await chromium.launch({ headless: true });
          const evidence = [];
          try {
            for (const viewport of viewports) {
              const context = await browser.newContext({ viewport, colorScheme: 'light' });
              const page = await context.newPage();
              const pageErrors = []; const http5xx = []; const requestFailed = [];
              page.on('pageerror', e => pageErrors.push(String(e)));
              page.on('response', r => { if (r.status() >= 500) http5xx.push({ url: r.url(), status: r.status() }); });
              page.on('requestfailed', r => requestFailed.push({ url: r.url(), error: r.failure()?.errorText || 'unknown' }));
              await page.route('**/*', async route => {
                const request = route.request(); const url = new URL(request.url());
                if (url.port !== '8005' || !url.pathname.startsWith('/api/')) return route.continue();
                if (request.method() !== 'GET') return route.fulfill(json({}));
                if (url.pathname === '/api/clinics/me') return route.fulfill(json(profile));
                if (url.pathname.includes('/audit-logs')) return route.fulfill(json({ total: 0, logs: [] }));
                if (url.pathname.includes('/backups')) return route.fulfill(json([]));
                return route.fulfill(json({}));
              });
              await page.goto('http://127.0.0.1:4178/settings-guided-restore-before.html', { waitUntil: 'networkidle', timeout: 90000 });
              await page.getByRole('heading', { name: 'Paramètres', exact: true }).waitFor({ timeout: 15000 });
              await page.getByRole('button', { name: 'Sécurité & Backup', exact: true }).click();
              await page.getByRole('heading', { name: 'Sécurité & Souveraineté', exact: true }).waitFor({ state: 'visible' });
              await page.getByText('Sauvegarde chiffrée vérifiée', { exact: true }).waitFor({ state: 'visible' });
              const overflow = await page.evaluate(() => document.documentElement.scrollWidth > document.documentElement.clientWidth + 2);
              const filename = `before-security-${viewport.width}x${viewport.height}.png`;
              await page.screenshot({ path: `${output}/${filename}`, fullPage: true, animations: 'disabled' });
              evidence.push({ viewport, filename, overflow, pageErrors, http5xx, requestFailed });
              await context.close();
            }
          } finally { await browser.close(); await server.close(); }
          const invalid = evidence.filter(e => e.overflow || e.pageErrors.length || e.http5xx.length || e.requestFailed.length);
          await fs.writeFile(`${output}/evidence.json`, JSON.stringify({ immutable_before_sha: '99c2aa32c6b145804467f7f38ea10722c2714e78', evidence, invalid }, null, 2));
          if (evidence.length !== 5) throw new Error(`Expected 5 viewports, got ${evidence.length}`);
          if (invalid.length) throw new Error(`Invalid BEFORE evidence: ${JSON.stringify(invalid)}`);
          EOF

      - name: Capture immutable BEFORE
        working-directory: frontend
        run: node settings-guided-restore-before.mjs

      - name: Verify proof count
        working-directory: frontend
        run: test "$(find settings-guided-restore-before-artifacts -name '*.png' | wc -l)" -eq 5

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guided-restore-before
          path: frontend/settings-guided-restore-before-artifacts/
          if-no-files-found: error
          retention-days: 14
