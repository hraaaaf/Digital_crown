name: Patient P6 Finances Identite Before

on:
  pull_request:
    branches:
      - agent/patient-page-p5-documents
    paths:
      - 'docs/PATIENT_P6_FINANCES_IDENTITE_GOAL.md'
      - '.github/workflows/patient-p6-finances-identite-before.yml'

permissions:
  contents: read

jobs:
  before:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ENVIRONMENT: test
      SECRET_KEY: patient-p6-before-secret-000001
      DATABASE_URL: sqlite:///./t2-runtime-cert.db
      TELEMETRY_ENABLED: 'false'
      CLOUD_AI_ENABLED: 'false'
      DEBUG: 'false'
      ALLOWED_ORIGINS: 'http://127.0.0.1:5173,http://localhost:5173'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.12.0 torchvision==0.27.0 --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^(torch|torchvision)([<=>].*)?$' requirements.txt > /tmp/requirements-p6-before.txt
          pip install -r /tmp/requirements-p6-before.txt
          pip install httpx==0.27.2

      - name: Install frontend and Chromium
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start backend
        run: |
          rm -f t2-runtime-cert.db
          python scripts/t2_runtime_server.py > /tmp/p6-before-backend.log 2>&1 &
          for i in {1..90}; do if curl -fsS http://127.0.0.1:8005/health >/dev/null; then exit 0; fi; sleep 1; done
          cat /tmp/p6-before-backend.log
          exit 1

      - name: Start frontend
        working-directory: frontend
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 > /tmp/p6-before-front.log 2>&1 &
          for i in {1..90}; do if curl -fsS http://127.0.0.1:5173 >/dev/null; then exit 0; fi; sleep 1; done
          cat /tmp/p6-before-front.log
          exit 1

      - name: Capture P6 BEFORE
        working-directory: frontend
        run: |
          mkdir -p ../artifacts/p6-finances-identite-before
          cat > .p6-before.mjs <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import { chromium, request } from 'playwright';
          const out=path.resolve('../artifacts/p6-finances-identite-before');
          const viewports=[{width:390,height:844},{width:430,height:932},{width:768,height:1024},{width:1280,height:900}];
          const api=await request.newContext({baseURL:'http://127.0.0.1:8005'});
          const login=await api.post('/api/auth/login',{form:{username:'t2-browser@cabinet.ma',password:'T2BrowserPass123!'}});
          if(!login.ok()) throw new Error(await login.text());
          const tok=await login.json(); const headers={Authorization:`Bearer ${tok.access_token}`};
          const ps=await api.get('/api/patients',{headers});
          const patient=(await ps.json()).find(p=>p.numero_dossier==='T2-0001');
          if(!patient) throw new Error('T2 patient missing');
          const browser=await chromium.launch({headless:true}); const evidence=[];
          for(const viewport of viewports){
            const ctx=await browser.newContext({viewport,colorScheme:'light'}); const page=await ctx.newPage();
            await page.addInitScript(({a,r})=>{localStorage.setItem('token',a);localStorage.setItem('refresh_token',r||'');localStorage.setItem('appMode','prod');},{a:tok.access_token,r:tok.refresh_token});
            const errors=[]; const http5xx=[];
            page.on('pageerror',e=>errors.push(String(e)));
            page.on('response',r=>{if(r.status()>=500)http5xx.push({url:r.url(),status:r.status()});});

            await page.goto('http://127.0.0.1:5173/patients/new',{waitUntil:'networkidle',timeout:90000});
            await page.getByText('Nouveau Patient',{exact:true}).waitFor({state:'visible',timeout:30000});
            await page.waitForTimeout(500);
            const addShot=`p6-before-add-${viewport.width}x${viewport.height}.png`;
            const addOverflow=await page.evaluate(()=>document.documentElement.scrollWidth>document.documentElement.clientWidth+2);
            const addSex=await page.locator('select[name="sexe"]').inputValue();
            await page.screenshot({path:path.join(out,addShot),fullPage:false});

            await page.goto(`http://127.0.0.1:5173/patients/${patient.id}/edit`,{waitUntil:'networkidle',timeout:90000});
            await page.getByText('Mise à jour',{exact:true}).waitFor({state:'visible',timeout:30000});
            await page.waitForTimeout(500);
            const editShot=`p6-before-edit-${viewport.width}x${viewport.height}.png`;
            const editOverflow=await page.evaluate(()=>document.documentElement.scrollWidth>document.documentElement.clientWidth+2);
            await page.screenshot({path:path.join(out,editShot),fullPage:false});

            await page.goto(`http://127.0.0.1:5173/patients/${patient.id}`,{waitUntil:'networkidle',timeout:90000});
            const financesTab=page.getByRole('button',{name:'Finances',exact:true});
            await financesTab.waitFor({state:'visible',timeout:30000});
            await financesTab.click();
            await page.getByText('Total Facturé',{exact:true}).waitFor({state:'visible',timeout:30000});
            await page.waitForTimeout(600);
            const financeShot=`p6-before-finances-${viewport.width}x${viewport.height}.png`;
            const financeOverflow=await page.evaluate(()=>document.documentElement.scrollWidth>document.documentElement.clientWidth+2);
            const recoveryVisible=await page.getByText('Taux Recouvrement',{exact:true}).count();
            await page.screenshot({path:path.join(out,financeShot),fullPage:false});

            evidence.push({viewport,addOverflow,editOverflow,financeOverflow,addSex,recoveryVisible,errors,http5xx,addShot,editShot,financeShot});
            await ctx.close();
          }
          fs.writeFileSync(path.join(out,'evidence.json'),JSON.stringify(evidence,null,2));
          fs.writeFileSync(path.join(out,'summary.json'),JSON.stringify({captures:evidence.length*3,evidence},null,2));
          await browser.close(); await api.dispose();
          if(evidence.length!==4) process.exit(1);
          JS
          node .p6-before.mjs
          rm .p6-before.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: patient-p6-finances-identite-before
          path: artifacts/p6-finances-identite-before
          if-no-files-found: warn
          retention-days: 14
