name: UX Continuity AFTER

on:
  pull_request:
    branches: [master]
    paths:
      - 'frontend/src/components/CrownDialog.tsx'
      - 'frontend/src/hooks/useFlowHandoff.ts'
      - 'frontend/src/features/patients/PatientList.tsx'
      - 'frontend/src/features/admin/SetupWizard/SetupWizard.tsx'
      - 'frontend/src/UXContinuity.test.ts'
      - '.github/workflows/ux-continuity-cert.yml'

permissions:
  contents: read

jobs:
  after:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.12.0 torchvision==0.27.0 --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^(torch|torchvision)([<=>].*)?$' requirements.txt > /tmp/requirements-ux-continuity-after.txt
          pip install -r /tmp/requirements-ux-continuity-after.txt
          pip install httpx==0.27.2
      - name: Install frontend and Chromium
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Targeted contract and build
        working-directory: frontend
        run: |
          npx vitest run src/UXContinuity.test.ts
          npm run build:test
      - name: Start isolated runtime
        run: |
          rm -f t2-runtime-cert.db
          python scripts/t2_runtime_server.py > /tmp/ux-continuity-after-backend.log 2>&1 &
          for i in {1..90}; do if curl -fsS http://127.0.0.1:8005/health >/dev/null; then exit 0; fi; sleep 1; done
          cat /tmp/ux-continuity-after-backend.log
          exit 1
      - name: Start frontend
        working-directory: frontend
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 > /tmp/ux-continuity-after-front.log 2>&1 &
          for i in {1..90}; do if curl -fsS http://127.0.0.1:5173 >/dev/null; then exit 0; fi; sleep 1; done
          cat /tmp/ux-continuity-after-front.log
          exit 1
      - name: Capture and assert AFTER
        working-directory: frontend
        run: |
          mkdir -p ../artifacts/ux-continuity-after
          cat > .ux-continuity-after.mjs <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import { chromium, request } from 'playwright';
          const source=fs.readFileSync('../scripts/t2_runtime_server.py','utf8');
          const user=source.match(/email=\"([^\"]+)\"/)?.[1];
          const pass=source.match(/get_password_hash\(\"([^\"]+)\"\)/)?.[1];
          if(!user||!pass) throw new Error('isolated credentials unavailable');
          const out=path.resolve('../artifacts/ux-continuity-after');
          const api=await request.newContext({baseURL:'http://127.0.0.1:8005'});
          const login=await api.post('/api/auth/login',{form:{username:user,password:pass}});
          if(!login.ok()) throw new Error(`login ${login.status()}`);
          const tok=await login.json();
          const browser=await chromium.launch({headless:true});
          const evidence={head_sha:process.env.GITHUB_SHA||null,patientDelete:[],setupWizard:[]};
          const init=async(page)=>page.addInitScript(({a,r})=>{localStorage.setItem('token',a);localStorage.setItem('refresh_token',r||'');localStorage.setItem('appMode','prod');localStorage.setItem('patient_list_view_mode','grid');},{a:tok.access_token,r:tok.refresh_token});
          for(const viewport of [{width:390,height:844,label:'390x844'},{width:430,height:932,label:'430x932'},{width:768,height:1024,label:'768x1024'},{width:1366,height:700,label:'1366x700'},{width:1440,height:900,label:'1440x900'}]){
            for(const position of ['top','middle','bottom']){
              const ctx=await browser.newContext({viewport,colorScheme:'light'});const page=await ctx.newPage();await init(page);
              const errors=[];page.on('pageerror',e=>errors.push(String(e)));
              await page.goto('http://127.0.0.1:5173/patients',{waitUntil:'networkidle',timeout:90000});
              await page.getByRole('heading',{name:'Dossiers Patients',exact:true}).waitFor({state:'visible'});
              const buttons=page.locator('button[aria-label^="Supprimer"]');const count=await buttons.count();
              const target=position==='top'?buttons.first():position==='bottom'?buttons.last():buttons.nth(Math.floor(count/2));
              await target.scrollIntoViewIfNeeded();const scrollBefore=await page.evaluate(()=>window.scrollY);await target.click();
              const dialog=page.getByRole('dialog',{name:'Supprimer le dossier'});await dialog.waitFor({state:'visible'});await page.waitForTimeout(80);
              const box=await dialog.boundingBox();const state=await page.evaluate(()=>({bodyOverflow:getComputedStyle(document.body).overflow,htmlOverflow:getComputedStyle(document.documentElement).overflow,activeAttr:document.activeElement?.hasAttribute('data-dialog-autofocus')||false}));
              const fullyVisible=!!box&&box.x>=-1&&box.y>=-1&&box.x+box.width<=viewport.width+1&&box.y+box.height<=viewport.height+1;
              const shot=`after-delete-${viewport.label}-${position}.png`;await page.screenshot({path:path.join(out,shot),fullPage:false});
              await page.keyboard.press('Escape');await dialog.waitFor({state:'hidden'});const focusRestored=await target.evaluate(el=>document.activeElement===el);
              evidence.patientDelete.push({viewport,position,scrollBefore,dialogBox:box,dialogFullyVisible:fullyVisible,...state,focusRestored,errors,shot});
              if(!fullyVisible||state.bodyOverflow!=='hidden'||state.htmlOverflow!=='hidden'||!state.activeAttr||!focusRestored||errors.length) throw new Error(`patient delete failed ${viewport.label} ${position}: ${JSON.stringify(evidence.patientDelete.at(-1))}`);
              await ctx.close();
            }
          }
          for(const viewport of [{width:390,height:844,label:'390x844'},{width:1366,height:700,label:'1366x700'}]){
            const ctx=await browser.newContext({viewport,colorScheme:'light'});const page=await ctx.newPage();await init(page);
            await page.route('**/api/clinics/init-status',route=>route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({is_initialized:false})}));
            await page.goto('http://127.0.0.1:5173/setup',{waitUntil:'networkidle',timeout:90000});
            await page.getByRole('heading',{name:'Profil Cabinet',exact:true}).waitFor({state:'visible'});
            await page.getByPlaceholder(/Cabinet Dentaire|Centre Dentaire/).fill('Cabinet UX Test');await page.getByPlaceholder('Étage, Résidence, Rue, Ville...').fill('1 rue Test, Rabat');await page.getByPlaceholder('Dr. Jean Dupont').fill('Dr UX Test');
            const next=page.getByRole('button',{name:/Continuer/});await next.scrollIntoViewIfNeeded();const beforeScroll=await page.evaluate(()=>window.scrollY);await next.click();await page.waitForTimeout(700);
            const heading=page.getByRole('heading',{name:'Spécialités',exact:true});const box=await heading.boundingBox();const afterScroll=await page.evaluate(()=>window.scrollY);const activeInside=await page.evaluate(()=>!!document.activeElement?.closest('[data-flow-step="2"]'));
            const visible=!!box&&box.y>=64&&box.y<viewport.height;const shot=`after-wizard-step2-${viewport.label}.png`;await page.screenshot({path:path.join(out,shot),fullPage:false});
            evidence.setupWizard.push({viewport,beforeScroll,afterScroll,headingBox:box,headingVisible:visible,activeInside,shot});
            if(!visible||!activeInside) throw new Error(`wizard failed ${viewport.label}: ${JSON.stringify(evidence.setupWizard.at(-1))}`);
            await ctx.close();
          }
          fs.writeFileSync(path.join(out,'evidence.json'),JSON.stringify(evidence,null,2));
          await browser.close();await api.dispose();
          JS
          node .ux-continuity-after.mjs
          rm .ux-continuity-after.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ux-continuity-after
          path: artifacts/ux-continuity-after
          if-no-files-found: error
          retention-days: 14
