name: Cephalo R18 Tracing BEFORE

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - 'frontend/scripts/capture-cephalo-r18-tracing-before.mjs'
      - '.github/workflows/cephalo-r18-tracing-before.yml'

permissions:
  contents: read

jobs:
  visual-before:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact product HEAD
        env:
          PRODUCT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$PRODUCT_HEAD"
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend and browser
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save --package-lock=false --legacy-peer-deps playwright@1.55.0 react-is@19.2.0 @testing-library/dom@10.4.1
          npx playwright install --with-deps chromium
      - name: Capture exact-head R18 tracing BEFORE
        working-directory: frontend
        env:
          PRODUCT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/capture-cephalo-r18-tracing-before.mjs
      - name: Verify BEFORE evidence contract
        working-directory: frontend
        env:
          PRODUCT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const r=JSON.parse(await readFile('cephalo-r18-tracing-before-artifacts/report.json','utf8'));
          if(r.productHead!==process.env.PRODUCT_HEAD||r.phase!=='BEFORE'||r.invalidCount!==0||r.blockedExternalRequests.length) throw new Error('Invalid R18 BEFORE evidence');
          if(r.captures.length!==3) throw new Error('Expected three viewports');
          for(const c of r.captures){if(!c.valid||c.metrics.hasAnalysisSelector||c.metrics.horizontalOverflow)throw new Error(`Invalid ${c.viewport}`)}
          NODE
          for viewport in 390x844 768x1024 1280x900; do test -s "cephalo-r18-tracing-before-artifacts/before-tracing-${viewport}.png"; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cephalo-r18-tracing-before-${{ github.sha }}
          path: frontend/cephalo-r18-tracing-before-artifacts
          if-no-files-found: error
          retention-days: 30
