name: R23-G2 Profile Contract (experimental)

on:
  pull_request:
    paths:
      - '.github/workflows/cephalo-r23g2-profile-contract.yml'
      - 'backend/services/cephalo_protocol_projection.py'
      - 'backend/services/cephalo_runtime_chain.py'
      - 'backend/data/cephalometry/clinical_reference_profiles_v1.json'
      - 'backend/data/cephalometry/ricketts_*_protocol_profile_v1.json'
      - 'backend/tests/test_cephalo_r23g2_protocol_read_projection.py'
      - 'frontend/src/features/ortho/cephaloR23G2ClinicalProfiles.ts'
      - 'frontend/src/features/ortho/cephaloR23G2ClinicalProfiles.test.ts'
      - 'frontend/src/features/ortho/components/CephaloR23G2ProtocolPanel.tsx'
      - 'frontend/src/features/ortho/components/CephaloAnalysisWorkbenchPanel.tsx'
      - 'frontend/src/features/ortho/components/Step1Cephalo.tsx'

permissions:
  contents: read

jobs:
  python-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact product HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Require exact HEAD
        env:
          PRODUCT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$PRODUCT_HEAD"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pytest (stdlib-only projector under test)
        run: python -m pip install pytest==9.0.3
      - name: Test source-profile cardinality and fail-closed values
        run: python -m pytest backend/tests/test_cephalo_r23g2_protocol_read_projection.py -q

  typescript-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact product HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Require exact HEAD
        env:
          PRODUCT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$PRODUCT_HEAD"
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Run fail-closed clinical profile reader tests
        working-directory: frontend
        run: npx vitest run src/features/ortho/cephaloR23G2ClinicalProfiles.test.ts
      - name: Full TypeScript check
        working-directory: frontend
        run: npx tsc --noEmit -p tsconfig.app.json
