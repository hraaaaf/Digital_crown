name: Mobile SuperAdmin MOB-5H Cert

on:
  push:
    branches:
      - ux/mobile-superadmin-mob5h
    paths:
      - "backend/routers/partner_superadmin_security.py"
      - "backend/tests/test_marketplace_superadmin_security.py"
      - "frontend/src/main.tsx"
      - "frontend/src/features/mobile/superadmin/**"
      - "frontend/src/features/mobile/Dashboard/views/MobileSuperAdminView*"
      - "frontend/src/features/mobile/Dashboard/MobilePreviewDashboard.tsx"
      - "frontend/src/features/mobile/Dashboard/types.tsx"
      - "frontend/scripts/capture-mobile-superadmin-mob5h-after.mjs"
      - ".github/workflows/mobile-superadmin-mob5h-cert.yml"
  pull_request:
    paths:
      - "backend/routers/partner_superadmin_security.py"
      - "backend/tests/test_marketplace_superadmin_security.py"
      - "frontend/src/main.tsx"
      - "frontend/src/features/mobile/superadmin/**"
      - "frontend/src/features/mobile/Dashboard/views/MobileSuperAdminView*"
      - "frontend/src/features/mobile/Dashboard/MobilePreviewDashboard.tsx"
      - "frontend/src/features/mobile/Dashboard/types.tsx"
      - "frontend/scripts/capture-mobile-superadmin-mob5h-after.mjs"
      - ".github/workflows/mobile-superadmin-mob5h-cert.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-superadmin-mob5h-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-security:
    name: SuperAdmin WebAuthn boundary
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SECRET_KEY: mob5h-superadmin-cert-secret-key-minimum-32-characters
      DATABASE_URL: "sqlite:///:memory:"
      ENVIRONMENT: development
      TELEMETRY_ENABLED: "false"
      CLOUD_AI_ENABLED: "false"
    steps:
      - name: Checkout exact candidate HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Prove exact candidate HEAD
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.12.0 torchvision==0.27.0 --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^(torch|torchvision)([<=>].*)?$' requirements.txt > /tmp/requirements-mob5h.txt
          pip install -r /tmp/requirements-mob5h.txt
          pip install httpx==0.27.2 pytest pytest-asyncio

      - name: Certify P10 mobile UV boundary
        run: python -m pytest -q --maxfail=1 backend/tests/test_marketplace_superadmin_security.py

  frontend-build:
    name: SuperAdmin frontend test + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout exact candidate HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Prove exact candidate HEAD
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Setup Node 20
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run SuperAdmin mobile parity test
        run: npm test -- src/features/mobile/Dashboard/views/MobileSuperAdminView.test.tsx

      - name: Build frontend
        run: npm run build
