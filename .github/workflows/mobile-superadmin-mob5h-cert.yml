name: Mobile SuperAdmin MOB-5H Cert

on:
  push:
    branches:
      - ux/mobile-superadmin-mob5h
    paths:
      - "backend/routers/partner_superadmin_security.py"
      - "backend/tests/test_marketplace_superadmin_security.py"
      - "frontend/src/main.tsx"
      - "frontend/src/features/mobile/superadmin/**"
      - "frontend/src/features/mobile/Dashboard/views/MobileSuperAdminView*"
      - "frontend/src/features/mobile/Dashboard/MobilePreviewDashboard.tsx"
      - "frontend/src/features/mobile/Dashboard/types.tsx"
      - "frontend/scripts/capture-mobile-superadmin-mob5h-after.mjs"
      - ".github/workflows/mobile-superadmin-mob5h-cert.yml"
  pull_request:
    paths:
      - "backend/routers/partner_superadmin_security.py"
      - "backend/tests/test_marketplace_superadmin_security.py"
      - "frontend/src/main.tsx"
      - "frontend/src/features/mobile/superadmin/**"
      - "frontend/src/features/mobile/Dashboard/views/MobileSuperAdminView*"
      - "frontend/src/features/mobile/Dashboard/MobilePreviewDashboard.tsx"
      - "frontend/src/features/mobile/Dashboard/types.tsx"
      - "frontend/scripts/capture-mobile-superadmin-mob5h-after.mjs"
      - ".github/workflows/mobile-superadmin-mob5h-cert.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-superadmin-mob5h-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-security:
    name: SuperAdmin WebAuthn boundary
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SECRET_KEY: mob5h-superadmin-cert-secret-key-minimum-32-characters
      DATABASE_URL: "sqlite:///:memory:"
      ENVIRONMENT: development
      TELEMETRY_ENABLED: "false"
      CLOUD_AI_ENABLED: "false"
    steps:
      - name: Checkout exact candidate HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Prove exact candidate HEAD
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.12.0 torchvision==0.27.0 --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^(torch|torchvision)([<=>].*)?$' requirements.txt > /tmp/requirements-mob5h.txt
          pip install -r /tmp/requirements-mob5h.txt
          pip install httpx==0.27.2 pytest pytest-asyncio

      - name: Certify P10 mobile UV boundary
        run: python -m pytest -q --maxfail=1 backend/tests/test_marketplace_superadmin_security.py

  frontend-build:
    name: SuperAdmin frontend contracts + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout exact candidate HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Prove exact candidate HEAD
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Setup Node 20
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run SuperAdmin mobile contract tests
        run: npm test -- src/features/mobile/Dashboard/views/MobileSuperAdminView.test.tsx src/features/mobile/superadmin/useMobileSuperAdmin.test.tsx

      - name: Build frontend
        run: npm run build

  visual-certification:
    name: SuperAdmin AFTER 390 430 768
    needs: frontend-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout exact candidate HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Prove exact candidate HEAD
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Setup Node 20
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Playwright runner
        run: npm install --no-save --package-lock=false playwright@1.63.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture exact AFTER evidence
        env:
          PRODUCT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/capture-mobile-superadmin-mob5h-after.mjs

      - name: Assert AFTER report contract
        env:
          PRODUCT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const report = JSON.parse(fs.readFileSync('mobile-superadmin-mob5h-after-artifacts/report.json', 'utf8'));
          if (report.productHead !== process.env.PRODUCT_HEAD) throw new Error(`HEAD mismatch: ${report.productHead}`);
          if (report.baselineBefore !== '6eb93c75f91402031ecc2c8fc1f8858372a97b9b') throw new Error('BEFORE baseline mismatch');
          if (report.beforeArtifactId !== 9997848118) throw new Error('BEFORE artifact mismatch');
          if (report.captures?.length !== 3) throw new Error('Expected 3 viewport captures');
          if (report.invalidCount !== 0) throw new Error(`Invalid captures: ${report.invalidCount}`);
          if (report.unexpectedApiRequests?.length !== 0) throw new Error('Preview attempted API requests');
          if (report.blockedExternalRequests?.length !== 0) throw new Error('Unexpected external egress attempted');
          if (report.realExternalEgressAllowed !== false) throw new Error('Preview egress contract weakened');
          NODE

      - name: Upload MOB-5H AFTER evidence
        uses: actions/upload-artifact@v4
        with:
          name: mobile-superadmin-mob5h-after
          path: frontend/mobile-superadmin-mob5h-after-artifacts
          if-no-files-found: error
          retention-days: 30
