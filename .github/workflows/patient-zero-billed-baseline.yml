name: Patient Zero-Billed Recovery Baseline

on:
  push:
    branches:
      - agent/patient-page-p0-truth-safety
    paths:
      - .github/workflows/patient-zero-billed-baseline.yml
      - frontend/scripts/capture-patient-zero-billed-baseline.mjs
      - scripts/t2_runtime_server.py
  workflow_dispatch:

concurrency:
  group: patient-zero-billed-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ENVIRONMENT: test
      SECRET_KEY: patient-zero-billed-baseline-secret-000001
      DATABASE_URL: sqlite:///./t2-runtime-cert.db
      TELEMETRY_ENABLED: "false"
      CLOUD_AI_ENABLED: "false"
      DEBUG: "false"
      ALLOWED_ORIGINS: "http://127.0.0.1:5173,http://localhost:5173"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.12.0 torchvision==0.27.0 --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^(torch|torchvision)([<=>].*)?$' requirements.txt > /tmp/requirements-zero-billed.txt
          pip install -r /tmp/requirements-zero-billed.txt
          pip install httpx==0.27.2
      - name: Install frontend and Chromium
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start isolated backend
        run: |
          python scripts/t2_runtime_server.py > /tmp/zero-billed-backend.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8005/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/zero-billed-backend.log
          exit 1
      - name: Start frontend
        working-directory: frontend
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 > /tmp/zero-billed-frontend.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:5173 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/zero-billed-frontend.log
          exit 1
      - name: Capture zero-billed baseline
        working-directory: frontend
        run: |
          mkdir -p ../artifacts/patient-zero-billed-baseline
          node scripts/capture-patient-zero-billed-baseline.mjs | tee ../artifacts/patient-zero-billed-baseline/runner.log
      - name: Upload baseline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patient-zero-billed-baseline
          path: artifacts/patient-zero-billed-baseline
          if-no-files-found: error
          retention-days: 14
