name: Patient P0-D Routine Apply

on:
  push:
    branches:
      - agent/patient-page-p0-truth-safety
    paths:
      - .github/workflows/patient-p0d-routine-apply.yml
      - frontend/scripts/capture-patient-p0d-routine-after.mjs
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: patient-p0d-routine-apply-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-and-certify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ENVIRONMENT: test
      SECRET_KEY: patient-p0d-routine-apply-secret-000001
      DATABASE_URL: sqlite:///./t2-runtime-cert.db
      TELEMETRY_ENABLED: "false"
      CLOUD_AI_ENABLED: "false"
      DEBUG: "false"
      ALLOWED_ORIGINS: "http://127.0.0.1:5173,http://localhost:5173"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/patient-page-p0-truth-safety
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Patch Routine engine fail-closed
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('frontend/src/features/patients/components/wizards/AssistantExamenComplet.tsx')
          text = p.read_text()
          start_marker = 'function buildRoutineDiag(ans: Record<string, string>): { diag: string; steps: any[]; next: string | null } {'
          end_marker = '// ── Composant principal ────────────────────────────────────────────────────'
          assert text.count(start_marker) == 1, text.count(start_marker)
          assert text.count(end_marker) == 1, text.count(end_marker)
          start = text.index(start_marker)
          end = text.index(end_marker)
          replacement = r'''function buildRoutineDiag(ans: Record<string, string>): { diag: string; steps: any[]; next: string | null } {
            const selectedLabel = (questionId: string, value: string | undefined) => {
              const question = ROUTINE_STEPS.find((item) => item.id === questionId);
              return question?.options.find((option) => option.value === value)?.label || 'Non renseigné';
            };

            const observations = [
              `Antécédents rapportés : ${selectedLabel('antecedents', ans.antecedents)}`,
              `Hygiène renseignée : ${selectedLabel('hygiene', ans.hygiene)}`,
              `Statut parodontal renseigné : ${selectedLabel('paro', ans.paro)}`,
              `Statut dentaire renseigné : ${selectedLabel('dentaire', ans.dentaire)}`,
              `Examen occlusal renseigné : ${selectedLabel('occlusion', ans.occlusion)}`,
              `Tissus mous renseignés : ${selectedLabel('tissus_mous', ans.tissus_mous)}`,
            ];

            const vigilance: string[] = [];
            if (ans.antecedents === 'cardio') {
              vigilance.push('Antécédent cardiovasculaire / prothèse valvulaire déclaré : indication éventuelle de prophylaxie à qualifier précisément selon la cardiopathie, le geste envisagé et les recommandations applicables.');
            }
            if (ans.antecedents === 'allergie') {
              vigilance.push('Allergie médicamenteuse déclarée : substance, réaction, gravité et statut actuel à confirmer avant toute prescription.');
            }
            if (ans.antecedents === 'hta_diabete') {
              vigilance.push('HTA / diabète / anticoagulants déclarés : situation médicale et traitements en cours à préciser avant décision clinique.');
            }
            if (ans.paro === 'paro_severe' || ans.paro === 'paro_moderee') {
              vigilance.push('Signes parodontaux rapportés : diagnostic et stade à confirmer par examen parodontal complet et données nécessaires.');
            }
            if (ans.dentaire === 'caries' || ans.dentaire === 'caries_et_restaurations' || ans.dentaire === 'restaurations') {
              vigilance.push('Anomalies dentaires rapportées : confirmer dent par dent avant diagnostic, imagerie ou plan thérapeutique.');
            }
            if (ans.occlusion !== 'normale') {
              vigilance.push('Anomalie occlusale / parafonction rapportée : examen fonctionnel à compléter avant conclusion ou traitement.');
            }
            if (ans.tissus_mous === 'lesion_suspecte') {
              vigilance.push('Lésion muqueuse rapportée comme suspecte : examen clinique ciblé, documentation et orientation à décider sans délai selon les constatations du praticien.');
            } else if (ans.tissus_mous !== 'ras') {
              vigilance.push('Anomalie des tissus mous rapportée : description clinique, durée, évolution et facteurs associés à documenter.');
            }

            const summary = [
              `Observations recueillies : ${observations.join(' ; ')}.`,
              vigilance.length ? `Vigilance : ${vigilance.join(' ')}` : 'Vigilance : aucun signal particulier déclaré dans ce questionnaire.',
              "Données à confirmer / compléter : examen clinique complet et examens complémentaires décidés par le praticien selon les indications constatées.",
              "Ce questionnaire ne pose pas automatiquement de diagnostic et ne détermine pas de traitement.",
              "Diagnostic, examens complémentaires et conduite thérapeutique : décision du praticien après validation clinique.",
            ].join(' ');

            return { diag: summary, steps: [], next: null };
          }

          '''
          patched = text[:start] + replacement + text[end:]
          old_calc = "{branch === 'urgence' ? 'Synthèse des observations et signaux de vigilance' : 'Génération du diagnostic + plan de traitement'}"
          new_calc = "{branch === 'urgence' ? 'Synthèse des observations et signaux de vigilance' : 'Synthèse clinique structurée'}"
          assert patched.count(old_calc) == 1, patched.count(old_calc)
          patched = patched.replace(old_calc, new_calc, 1)
          forbidden = [
            'Antibioprophylaxie avant tout soin invasif (Amox 2g, 1h avant)',
            "Phase I : surfaçage radiculaire (par quadrant)",
            "Traitement des caries (composite / amalgame)",
            "Gouttière de protection nocturne (thermoformée)",
            "Biopsie / cytodiagnostic — PRIORITAIRE",
          ]
          routine_block = patched[patched.index(start_marker):patched.index(end_marker)]
          for token in forbidden:
            assert token not in routine_block, token
          assert 'return { diag: summary, steps: [], next: null };' in routine_block
          p.write_text(patched)
          PY
          git diff --check

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.12.0 torchvision==0.27.0 --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^(torch|torchvision)([<=>].*)?$' requirements.txt > /tmp/requirements-p0d-routine-apply.txt
          pip install -r /tmp/requirements-p0d-routine-apply.txt
          pip install httpx==0.27.2
      - name: Install frontend and Chromium
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Start isolated backend
        run: |
          python scripts/t2_runtime_server.py > /tmp/p0d-routine-apply-backend.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8005/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/p0d-routine-apply-backend.log
          exit 1
      - name: Start frontend
        working-directory: frontend
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 > /tmp/p0d-routine-apply-frontend.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:5173 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/p0d-routine-apply-frontend.log
          exit 1
      - name: Capture Routine after evidence
        working-directory: frontend
        run: |
          set -euo pipefail
          rm -rf ../artifacts/patient-p0d-routine-after
          mkdir -p ../artifacts/patient-p0d-routine-after
          node scripts/capture-patient-p0d-routine-after.mjs 2>&1 | tee ../artifacts/patient-p0d-routine-after/runner.log
          test -f ../artifacts/patient-p0d-routine-after/summary.json
          test -f ../artifacts/patient-p0d-routine-after/evidence.json
          test "$(find ../artifacts/patient-p0d-routine-after -maxdepth 1 -name '*.png' | wc -l)" -eq 8
          sha256sum src/features/patients/components/wizards/AssistantExamenComplet.tsx > ../artifacts/patient-p0d-routine-after/source.sha256
      - name: Upload Routine after evidence
        uses: actions/upload-artifact@v4
        with:
          name: patient-p0d-routine-after
          path: artifacts/patient-p0d-routine-after
          if-no-files-found: error
          retention-days: 14
      - name: Commit certified Routine patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/features/patients/components/wizards/AssistantExamenComplet.tsx
          git diff --cached --check
          git commit -m "fix(patient): make complete routine exam fail-closed"
          git push origin HEAD:agent/patient-page-p0-truth-safety
