name: Patient P0-F RVG Rescue

on:
  push:
    branches:
      - agent/patient-page-p0-rescue
    paths:
      - '.github/workflows/patient-p0f-rvg-rescue.yml'
      - 'backend/routers/documents.py'
      - 'frontend/src/services/rvgService.ts'
      - 'frontend/src/features/patients/components/RvgCard.tsx'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: patient-p0f-rvg-rescue-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-only-secret-key-minimum-32-characters-long
      DATABASE_URL: "sqlite:///:memory:"
      ENVIRONMENT: development
      TELEMETRY_ENABLED: "false"
      CLOUD_AI_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Apply header-only document auth patch
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('backend/routers/documents.py')
          src = path.read_text(encoding='utf-8')
          old = '''    # 1. Extraction du token (Header ou Query)\n    auth_header = request.headers.get("Authorization")\n    token = None\n    if auth_header and auth_header.startswith("Bearer "):\n        token = auth_header.split(" ")[1]\n    else:\n        token = request.query_params.get("token")\n'''
          new = '''    # 1. Extraction du token — Authorization header uniquement.\n    # Les tokens en query string sont interdits : ils peuvent fuiter dans\n    # l'historique navigateur, les logs intermédiaires et les referrers.\n    auth_header = request.headers.get("Authorization")\n    token = None\n    if auth_header and auth_header.startswith("Bearer "):\n        token = auth_header.split(" ", 1)[1]\n'''
          if new not in src:
              if old not in src:
                  raise SystemExit('documents.py auth source mismatch')
              path.write_text(src.replace(old, new, 1), encoding='utf-8')
          PY

      - name: RVG source contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          docs = Path('backend/routers/documents.py').read_text(encoding='utf-8')
          service = Path('frontend/src/services/rvgService.ts').read_text(encoding='utf-8')
          card = Path('frontend/src/features/patients/components/RvgCard.tsx').read_text(encoding='utf-8')
          assert 'request.query_params.get("token")' not in docs
          assert 'auth_header.split(" ", 1)[1]' in docs
          assert "responseType: 'blob'" in service
          assert '?token=' not in service
          assert 'fetchRVGBlob(doc.id)' in card
          assert 'URL.createObjectURL(blob)' in card
          print('P0-F source contracts: OK')
          PY

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.12.0 torchvision==0.27.0 --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^(torch|torchvision)([<=>].*)?$' requirements.txt > /tmp/requirements-ci.txt
          pip install -r /tmp/requirements-ci.txt
          pip install httpx==0.27.2 pytest pytest-asyncio

      - name: Load canonical RVG lifecycle regression from prior branch
        run: |
          git fetch origin agent/patient-page-p0-truth-safety --depth=1
          git show origin/agent/patient-page-p0-truth-safety:backend/tests/test_patient_p0_rvg_lifecycle.py > /tmp/test_patient_p0_rvg_lifecycle.py
          cp /tmp/test_patient_p0_rvg_lifecycle.py backend/tests/test_patient_p0_rvg_lifecycle.py

      - name: RVG lifecycle regression
        run: python -m pytest backend/tests/test_patient_p0_rvg_lifecycle.py -q --maxfail=1

      - name: Frontend install
        working-directory: frontend
        run: npm ci

      - name: Frontend build
        working-directory: frontend
        run: npm run build

      - name: Commit certified RVG product patch and proof
        env:
          TESTED_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          git checkout -- backend/tests/test_patient_p0_rvg_lifecycle.py || true
          rm -f backend/tests/test_patient_p0_rvg_lifecycle.py
          python - <<'PY'
          import json, os
          from pathlib import Path
          Path('docs/PATIENT_P0F_RVG_CERT.json').write_text(json.dumps({
              'status': 'CERTIFIED',
              'tested_sha': os.environ['TESTED_SHA'],
              'run_id': os.environ['RUN_ID'],
              'contracts': ['header-only auth', 'tenant isolation', 'recoverable trash/restore', 'authenticated blob UI', 'frontend build'],
          }, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/routers/documents.py frontend/src/services/rvgService.ts frontend/src/features/patients/components/RvgCard.tsx docs/PATIENT_P0F_RVG_CERT.json
          if git diff --cached --quiet; then
            echo "RVG product and proof already current."
            exit 0
          fi
          git commit -m "fix(patient): harden RVG authenticated lifecycle"
          git push origin HEAD:${GITHUB_REF_NAME}
