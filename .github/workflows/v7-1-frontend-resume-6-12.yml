name: V7.1 Frontend Resume 6-12

on:
  push:
    branches:
      - fix/v7-1-crownbot-g9-test-race-20260928

concurrency:
  group: v7-1-frontend-resume-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-resume:
    name: Frontend resume (shards 6-12 + build)
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Resume shards 6-12
        shell: bash
        run: |
          set -euo pipefail
          for shard in 6 7 8 9 10 11 12; do
            echo "::group::shard ${shard}/12"
            mapfile -t files < <(npx vitest list --filesOnly --shard="${shard}/12")
            test "${#files[@]}" -gt 0
            for file in "${files[@]}"; do
              echo "::group::vitest $file"
              npx vitest run "$file" --maxWorkers=1 --fileParallelism=false
              echo "::endgroup::"
            done
            echo "::endgroup::"
          done

      - name: Build
        run: npm run build
