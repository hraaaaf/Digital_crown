name: CB 2.0 G6 Actual MainLayout Floating Chat (synthetic only)
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [feature/cb03-g4b-integrated-cert-20261024]
    paths:
      - frontend/src/components/CrownBot/CB03G6MainLayoutLab.tsx
      - frontend/cb03-g6-mainlayout-lab.html
      - frontend/scripts/certify-cb03-g6-mainlayout.mjs
      - frontend/src/components/CrownBot/CrownBotChat.tsx
      - frontend/src/components/CrownBot/CrownBotGuidedConversationG5.tsx
      - .github/workflows/cb03-g6-actual-mainlayout.yml
permissions:
  contents: read
concurrency:
  group: cb03-g6-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  real-mainlayout-floating:
    name: Chromium opens actual MainLayout launcher and real CrownBotChat
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CB03_G5_SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
      DIGITALCROWN_ISOLATED_RUNTIME: '1'
      CB03_G6_MAINLAYOUT_LAB: '1'
      VITE_CROWN_BOT_CB03_CHAT_ENABLED: 'false'
      CROWN_BOT_CB03_CONFIRMATION_ENABLED: 'false'
      CLOUD_AI_ENABLED: 'false'
      TELEMETRY_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Fail closed source identity and production flags
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CB03_G5_SOURCE_HEAD"
          test "$VITE_CROWN_BOT_CB03_CHAT_ENABLED" = false
          test "$CROWN_BOT_CB03_CONFIRMATION_ENABLED" = false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Compile and install synthetic Chromium
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx tsc --noEmit -p tsconfig.app.json
          npx playwright install --with-deps chromium
      - name: Test actual MainLayout floating launcher to G5 guided chat
        working-directory: frontend
        run: node scripts/certify-cb03-g6-mainlayout.mjs
      - name: Save evidence — synthetic mock API only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cb03-g6-actual-mainlayout-floating-synthetic
          path: artifacts/cb03-g6/real-mainlayout-chat
          retention-days: 14
          if-no-files-found: warn
