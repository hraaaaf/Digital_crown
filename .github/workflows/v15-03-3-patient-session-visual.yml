name: V1.5-03.3 Patient Session QR NFC Visual Gate

on:
  push:
    branches:
      - feat/v1-5-03-3-patient-session-qr-nfc
  pull_request:
    branches: [master]
    paths:
      - "frontend/src/features/hub/StationKioskShell.tsx"
      - "frontend/src/features/hub/StationPatientIdentity.tsx"
      - "frontend/src/features/hub/StationPatientIdentity.test.tsx"
      - "frontend/src/features/hub/WorkstationIdentityPanel.tsx"
      - "frontend/src/features/hub/WorkstationIdentityPanel.test.tsx"
      - "frontend/src/services/stationPatientSession.ts"
      - "frontend/src/test/v15StationPatientSessionContract.test.ts"
      - "frontend/scripts/capture-v15-03-3-patient-session.mjs"
      - ".github/workflows/v15-03-3-patient-session-visual.yml"
  workflow_dispatch:

concurrency:
  group: v15-03-3-patient-session-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  before:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EVALUATED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      EVALUATED_BASE: ${{ github.event.pull_request.base.sha || '1cbae04db8915eb970e46357977758209d3240da' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EVALUATED_SHA }}

      - name: Preserve 03.3 capture harness
        run: cp frontend/scripts/capture-v15-03-3-patient-session.mjs /tmp/capture-v15-03-3-patient-session.mjs

      - name: Checkout exact BEFORE base
        run: |
          git fetch --no-tags --depth=1 origin "${EVALUATED_BASE}"
          git checkout --force "${EVALUATED_BASE}"
          cp /tmp/capture-v15-03-3-patient-session.mjs frontend/scripts/capture-v15-03-3-patient-session.mjs

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend + Chromium
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start BEFORE frontend
        working-directory: frontend
        run: |
          npm run dev -- --host 127.0.0.1 --port 4197 >/tmp/v15-03-3-before.log 2>&1 &
          for i in {1..90}; do curl -fsS http://127.0.0.1:4197 >/dev/null && exit 0; sleep 1; done
          cat /tmp/v15-03-3-before.log
          exit 1

      - name: Capture BEFORE patient-session matrix
        working-directory: frontend
        env:
          V15_03_3_PHASE: before
          EVALUATED_SHA: ${{ env.EVALUATED_BASE }}
          EVALUATED_BASE: ${{ env.EVALUATED_BASE }}
        run: node scripts/capture-v15-03-3-patient-session.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v15-03-3-patient-session-before
          path: frontend/artifacts/v15-03-3-patient-session-before
          if-no-files-found: error
          retention-days: 14

  after:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EVALUATED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      EVALUATED_BASE: ${{ github.event.pull_request.base.sha || '1cbae04db8915eb970e46357977758209d3240da' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EVALUATED_SHA }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend + Chromium
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Targeted 03.3 frontend tests
        working-directory: frontend
        run: npx vitest run src/features/hub/StationPatientIdentity.test.tsx src/features/hub/WorkstationIdentityPanel.test.tsx src/test/v15StationPatientSessionContract.test.ts --maxWorkers=1 --fileParallelism=false

      - name: Frontend build
        working-directory: frontend
        run: npm run build

      - name: Start AFTER frontend
        working-directory: frontend
        run: |
          npm run dev -- --host 127.0.0.1 --port 4197 >/tmp/v15-03-3-after.log 2>&1 &
          for i in {1..90}; do curl -fsS http://127.0.0.1:4197 >/dev/null && exit 0; sleep 1; done
          cat /tmp/v15-03-3-after.log
          exit 1

      - name: Capture AFTER patient-session matrix
        working-directory: frontend
        env:
          V15_03_3_PHASE: after
        run: node scripts/capture-v15-03-3-patient-session.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v15-03-3-patient-session-after
          path: frontend/artifacts/v15-03-3-patient-session-after
          if-no-files-found: error
          retention-days: 14
