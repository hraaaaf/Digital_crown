name: CEPH P2ter Identity-Bound Documents (required)
on:
  push:
    branches:
      - fix/ceph-fac-parity-p2ter-*
  pull_request:
    branches:
      - audit/dc-ceph-facad-parity-p2bis-http-pdf-20261017
      - fix/ceph-fac-parity-p2ter-analysis-bound-pdf-20261017
      - fix/ceph-fac-parity-p2ter-plus-ux-archive-concurrency-20261017

permissions:
  contents: read

jobs:
  identity-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SECRET_KEY: ceph-p2ter-ci-only-isolated-key-32-characters
      DATABASE_URL: 'sqlite:///:memory:'
      ENVIRONMENT: test
      DIGITALCROWN_ISOLATED_RUNTIME: 'true'
      TELEMETRY_ENABLED: 'false'
      CLOUD_AI_ENABLED: 'false'
      P2TER_EVIDENCE_DIR: p2ter-pdf-artifacts
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Require exact HEAD
        env:
          PRODUCT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$PRODUCT_HEAD"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated backend
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.10.0 torchvision==0.25.0 torchaudio==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^(torch|torchvision|torchaudio)([<=>].*)?$' requirements.txt > /tmp/p2ter-requirements.txt
          pip install -r /tmp/p2ter-requirements.txt
          python -m pip check
      - name: Real JWT HTTP A/B selected analysis PDF bytes and archive fail-closed
        run: |
          set -o pipefail
          python -m pytest backend/tests/test_cephalo_p2ter_atomic_archive.py backend/tests/test_cephalo_p2ter_identity_bound_pdf.py backend/tests/test_cephalo_p2bis_http_pdf_continuity.py backend/tests/test_cephalo_r23g5_authenticated_api.py backend/tests/test_cephalo_r23g2_pdf_sections.py backend/tests/test_cephalo_r17_pdf_renderer_contract.py backend/tests/test_document_provenance_p3.py -q | tee p2ter-backend-results.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ceph-p2ter-backend-${{ github.sha }}
          path: |
            p2ter-backend-results.log
            p2ter-pdf-artifacts/
          retention-days: 30
          if-no-files-found: warn

  identity-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Require exact HEAD
        env:
          PRODUCT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$PRODUCT_HEAD"
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend
        working-directory: frontend
        run: npm ci
      - name: Identity-bound frontend tests and prior protocol regressions
        working-directory: frontend
        run: |
          set -o pipefail
          npx vitest run src/features/ortho/cephaloArchiveGate.test.ts src/features/ortho/cephaloDocumentSource.test.ts src/features/ortho/cephaloRepository.document.test.ts src/features/ortho/components/CephaloR23G2ProtocolPanel.test.tsx src/features/ortho/cephaloR23G2ClinicalProfiles.test.ts | tee ../p2ter-react-results.log
      - name: TypeScript application check
        working-directory: frontend
        run: |
          set -o pipefail
          npx tsc --noEmit -p tsconfig.app.json | tee ../p2ter-typescript-results.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ceph-p2ter-frontend-${{ github.sha }}
          path: p2ter-*.log
          retention-days: 30
          if-no-files-found: warn
