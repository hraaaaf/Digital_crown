name: Settings RBAC Visual Certification

on:
  pull_request:
    paths:
      - "frontend/src/features/admin/Settings/**"
      - "frontend/src/pages/Settings.tsx"
      - "frontend/src/utils/settingsAccess.ts"
      - "frontend/src/utils/settingsAccess.test.ts"
      - ".github/workflows/settings-rbac-visual-cert.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend and browser
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Inject Settings RBAC harness
        working-directory: frontend
        run: |
          cat > settings-rbac-cert.html <<'EOF'
          <!doctype html><html lang="fr"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><link rel="icon" href="data:,"/><title>Settings RBAC</title></head><body><div id="root"></div><script type="module" src="/src/settings-rbac-cert.tsx"></script></body></html>
          EOF
          cat > src/settings-rbac-cert.tsx <<'EOF'
          import React from 'react';
          import { createRoot } from 'react-dom/client';
          import { MemoryRouter } from 'react-router-dom';
          import './index.css';
          import Settings from './pages/Settings';
          import { useAuthStore } from './stores/useAuthStore';

          const secretary = new URLSearchParams(window.location.search).get('role') === 'secretary';
          useAuthStore.setState({
            user: ({
              id: secretary ? 2 : 1,
              email: secretary ? 'secretary@example.com' : 'admin@example.com',
              role: secretary ? 'SECRETAIRE' : 'ADMIN',
              is_superadmin: false,
              employer_id: secretary ? 1 : null,
              permissions: secretary ? { agenda: true, settings: false, admin: false } : {},
            } as any),
            isAuthenticated: true,
            isLoading: false,
            error: null,
          });
          createRoot(document.getElementById('root')!).render(<MemoryRouter initialEntries={['/settings']}><Settings /></MemoryRouter>);
          EOF
          cat > settings-rbac-cert.mjs <<'EOF'
          import { chromium } from 'playwright';
          import { createServer } from 'vite';
          import fs from 'node:fs/promises';

          const output = 'settings-rbac-artifacts';
          await fs.mkdir(output, { recursive: true });
          const server = await createServer({ server: { host: '127.0.0.1', port: 4178, strictPort: true }, clearScreen: false });
          await server.listen();
          const browser = await chromium.launch();
          const widths = [1440, 1024, 768, 430, 390];
          const forbiddenForSecretary = ['Profil Cabinet','Design & Ambiance','Catalogue Actes','IA & Système','Sécurité & Backup','Mon Équipe'];
          const allAdminTabs = ['Profil Cabinet','Design & Ambiance','Catalogue Actes','Horaires & Agenda','IA & Système','Sécurité & Backup','Mon Équipe'];
          try {
            for (const role of ['admin','secretary']) {
              for (const width of widths) {
                const context = await browser.newContext({ viewport: { width, height: 1200 } });
                const page = await context.newPage();
                const errors = [];
                page.on('pageerror', e => errors.push(`pageerror: ${e.message}`));
                page.on('console', m => { if (m.type() === 'error') errors.push(`console: ${m.text()}`); });
                await page.route('**/api/**', async route => {
                  const url = new URL(route.request().url());
                  if (url.pathname.endsWith('/clinics/me')) return route.fulfill({ status: 200, contentType: 'application/json', body: JSON.stringify({ nom_praticien: 'Dr Visual', nom_cabinet: 'Cabinet Visual', adresse: 'Rabat', telephone: '05 00 00 00 00', header_lines_fr: ['Dr Visual'], specialty_ids: [] }) });
                  if (url.pathname.endsWith('/agenda/settings')) return route.fulfill({ status: 200, contentType: 'application/json', body: JSON.stringify({ opening_time_morning:'09:00', closing_time_morning:'13:00', opening_time_afternoon:'14:00', closing_time_afternoon:'18:00', is_continuous:false, agenda_mode:'EXACT', use_tickets:false }) });
                  return route.fulfill({ status: 200, contentType: 'application/json', body: '{}' });
                });
                await page.goto(`http://127.0.0.1:4178/settings-rbac-cert.html?role=${role}`, { waitUntil: 'networkidle' });
                await page.getByRole('heading', { name: 'Paramètres', exact: true }).waitFor({ timeout: 15000 });
                if (role === 'admin') {
                  for (const label of allAdminTabs) {
                    await page.getByRole('button', { name: label, exact: true }).waitFor({ state: 'visible' });
                  }
                  await page.screenshot({ path: `${output}/admin-profil-${width}x1200.png`, fullPage: true, animations: 'disabled' });
                } else {
                  await page.getByRole('button', { name: 'Horaires & Agenda', exact: true }).waitFor({ state: 'visible' });
                  await page.getByRole('heading', { name: 'Horaires & Agenda', exact: true }).waitFor({ state: 'visible' });
                  for (const label of forbiddenForSecretary) {
                    if (await page.getByRole('button', { name: label, exact: true }).count()) throw new Error(`Forbidden secretary tab visible: ${label}`);
                  }
                  if (await page.getByRole('button', { name: 'Mettre à jour le Profil', exact: true }).count()) throw new Error('Forbidden profile save button visible to secretary');
                  await page.screenshot({ path: `${output}/secretary-agenda-${width}x1200.png`, fullPage: true, animations: 'disabled' });
                }
                if (errors.length) throw new Error(errors.join('\n'));
                await context.close();
              }
            }
          } finally {
            await browser.close();
            await server.close();
          }
          EOF
      - name: Capture and assert RBAC views
        working-directory: frontend
        run: node settings-rbac-cert.mjs
      - name: Verify proof count
        working-directory: frontend
        run: |
          test "$(find settings-rbac-artifacts -name '*.png' | wc -l)" -eq 10
      - uses: actions/upload-artifact@v4
        with:
          name: settings-rbac-visual-cert
          path: frontend/settings-rbac-artifacts/
          if-no-files-found: error
          retention-days: 14
