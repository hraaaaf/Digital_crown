name: Patient R1 PDF Single Shot

on:
  push:
    branches: [agent/patient-page-p0-rescue]
    paths:
      - '.github/workflows/patient-r1-pdf-single-shot.yml'

permissions:
  contents: write

jobs:
  apply-test-push:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/patient-page-p0-rescue
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply authenticated PDF transport
        run: |
          python - <<'PY'
          from pathlib import Path
          ia=Path('backend/routers/ia.py'); s=ia.read_text(encoding='utf-8')
          a=s.index('@router.get("/panoramic/{analysis_id}/pdf")')
          b=s.index('@router.delete("/panoramic/{analysis_id}"',a)
          new='''@router.get("/panoramic/{analysis_id}/pdf")
          def download_panoramic_pdf(analysis_id: int, db: Session = Depends(database.get_db), current_user: models.User = Depends(require_permission("panoramic"))):
              """Génère et diffuse le PDF panoramique via un flux authentifié."""
              analysis = db.query(models.PanoramicAnalysis).filter(models.PanoramicAnalysis.id == analysis_id).first()
              if not analysis:
                  raise HTTPException(status_code=404, detail="Analyse introuvable")
              assert_patient_access(analysis.patient_id, current_user, db)
              try:
                  from fastapi.responses import FileResponse
                  from backend.services.generators.panoramic_elite_gen import panoramic_elite_generator
                  pdf_rel = panoramic_elite_generator.generate(db=db, analysis_id=analysis_id, current_user=current_user)
                  clean_rel = pdf_rel.removeprefix("api/")
                  pdf_path = os.path.join(BASE_DIR, clean_rel)
                  if not os.path.isfile(pdf_path):
                      raise HTTPException(status_code=500, detail="PDF généré introuvable")
                  return FileResponse(path=pdf_path, media_type="application/pdf", filename=os.path.basename(pdf_path))
              except HTTPException:
                  raise
              except Exception as e:
                  logger.exception(f"Erreur lors de la génération du PDF panoramique Élite: {e}")
                  raise HTTPException(status_code=500, detail=str(e))

          '''
          import textwrap
          s=s[:a]+textwrap.dedent(new)+s[b:]
          ia.write_text(s,encoding='utf-8')

          ui=Path('frontend/src/features/panoramic/PanoramicStudio.tsx'); s=ui.read_text(encoding='utf-8')
          s=s.replace("const response = await api.get(`/ia/panoramic/${result.id}/pdf`);\n      window.open(response.data.pdf_url, '_blank');","const response = await api.get(`/ia/panoramic/${result.id}/pdf`, { responseType: 'blob' });\n      const blobUrl = URL.createObjectURL(response.data);\n      window.open(blobUrl, '_blank', 'noopener,noreferrer');\n      window.setTimeout(() => URL.revokeObjectURL(blobUrl), 60_000);")
          s=s.replace("const response = await api.get(`/ia/panoramic/${result.id}/pdf`);\n      setPreviewPdfUrl(response.data.pdf_url);","const response = await api.get(`/ia/panoramic/${result.id}/pdf`, { responseType: 'blob' });\n      setPreviewPdfUrl(URL.createObjectURL(response.data));")
          ui.write_text(s,encoding='utf-8')
          PY
      - name: Contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          ia=Path('backend/routers/ia.py').read_text(encoding='utf-8')
          ui=Path('frontend/src/features/panoramic/PanoramicStudio.tsx').read_text(encoding='utf-8')
          a=ia.index('@router.get("/panoramic/{analysis_id}/pdf")'); b=ia.index('@router.delete("/panoramic/{analysis_id}"',a); x=ia[a:b]
          assert 'assert_patient_access(analysis.patient_id, current_user, db)' in x
          assert 'FileResponse(' in x
          assert 'pdf_url' not in x
          assert "responseType: 'blob'" in ui
          assert 'response.data.pdf_url' not in ui
          PY
      - name: Python syntax
        run: python -m py_compile backend/routers/ia.py backend/services/generators/panoramic_elite_gen.py
      - name: Frontend build
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Commit and rebase-safe push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/routers/ia.py frontend/src/features/panoramic/PanoramicStudio.tsx
          git commit -m 'fix(patient): secure panoramic PDF transport'
          git fetch origin agent/patient-page-p0-rescue
          git rebase origin/agent/patient-page-p0-rescue
          git push origin HEAD:agent/patient-page-p0-rescue
