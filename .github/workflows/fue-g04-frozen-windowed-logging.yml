name: FUE-G04 frozen windowed logging regression

# Focused REQUIRED source-PR regression; no code or deployment packaging and
# no access to production/clinical data, GitHub secrets, or real cabinet.
on:
  pull_request:
    paths:
      - 'run.py'
      - 'ci_fue_g04/test_frozen_windows_uvicorn_logging.py'
      - '.github/workflows/fue-g04-frozen-windowed-logging.yml'
  push:
    branches:
      - fix/fue-g04-frozen-uvicorn-no-console-20261011
    paths:
      - 'run.py'
      - 'ci_fue_g04/test_frozen_windows_uvicorn_logging.py'
      - '.github/workflows/fue-g04-frozen-windowed-logging.yml'

permissions:
  contents: read

jobs:
  frozen-windowed-logger:
    name: Uvicorn no-TTY regression (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install pinned Uvicorn and test harness only
        run: python -m pip install uvicorn==0.27.1 pytest==9.0.3
      - name: Verify no console streams and preserve dev launcher behavior
        run: python -m pytest -q ci_fue_g04/test_frozen_windows_uvicorn_logging.py
      - name: Python syntax check source
        run: python -m py_compile run.py ci_fue_g04/test_frozen_windows_uvicorn_logging.py
