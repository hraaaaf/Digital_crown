name: LOT05 J10K — GitHub Actions D-FINE Nano PyTorch vs ONNX native CPU parity

on:
  pull_request:
    branches:
      - exp/lot05-j10j-actions-only-dfine-cpu-smoke-20261022
    paths:
      - 'experiments/lot05_j10k_dfine_coco_onnx_parity.py'
      - 'experiments/test_lot05_j10k_dfine_coco_onnx_parity.py'
      - '.github/workflows/lot05-j10k-dfine-onnx-parity.yml'
      - 'docs/research/LOT05_J10K_*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: j10k-onnx-${{ github.ref }}
  cancel-in-progress: true

jobs:
  licensing-parity-preflight:
    name: "No clinical FDI commercialization: rights + mismatch tests"
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check FDI licensing remains HOLD and prove fail-closed parity contracts
        run: |
          python -m pip install 'numpy==2.2.6'
          python experiments/lot05_j10i_fdi_commercial_rights_gate.py
          python experiments/test_lot05_j10i_fdi_commercial_rights_gate.py -v
          python experiments/test_lot05_j10k_dfine_coco_onnx_parity.py -v

  cpu-onnx-parity:
    name: "Native ${{ matrix.os }} — compare real COCO ONNX vs pinned PyTorch"
    needs: licensing-parity-preflight
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    env:
      HF_HUB_DISABLE_XET: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_DISABLE_SYMLINKS_WARNING: '1'
      DO_NOT_TRACK: '1'
      OMP_NUM_THREADS: '2'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact PR HEAD before downloading public model
        shell: bash
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install explicit CPU-only Torch
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir \
            'torch==2.7.1' 'torchvision==0.22.1' \
            --index-url https://download.pytorch.org/whl/cpu
      - name: Install pinned ONNX Runtime, original Torch/HF backend and image library
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir \
            'transformers==4.57.3' 'huggingface-hub==0.36.0' \
            'safetensors==0.6.2' 'pillow==11.3.0' 'numpy==2.2.6' \
            'onnx==1.18.0' 'onnxruntime==1.22.1'
          python -m pip check
      - name: CPU inference on generated rectangles, compare ONNX and Torch logits and boxes
        shell: bash
        run: |
          python experiments/lot05_j10k_dfine_coco_onnx_parity.py \
            --output-json reports/j10k-${{ matrix.os }}.json
      - name: Strictly research-only JSON check
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path("reports").glob("j10k-*.json"):
              p=json.loads(path.read_text())
              assert p["status"] == "PINNED_COCO_ONNX_CPU_PARITY_PASS"
              assert p["synthetic_only"] is True
              assert p["clinical_use_approved"] is False
              assert p["commercial_release_approved"] is False
              assert p["fdi_class_training_performed"] is False
              assert p["fdi_accuracy_validated"] is False
              assert p["onnx_sha256"] == "b0ec2e5793f3a3cbd07440d098645a0e102cd450fb92f4f35e713f36e35d152e"
              print("PASS checked public COCO ONNX parity, NOT a clinically approved FDI model",path)
          PY
      - name: Archive metadata-only JSON; never export ONNX weights/images
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: j10k-coco-onnx-parity-${{ matrix.os }}
          path: reports/j10k-${{ matrix.os }}.json
          if-no-files-found: warn
          retention-days: 7
