name: Portability P6 Windows Packaging Certification

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "VERSION"
      - "run.py"
      - "DigitalCrown.spec"
      - "installer/**"
      - "scripts/p6_packaging_check.py"
      - "scripts/generate_windows_version_info.py"
      - "scripts/build_exe.py"
      - "backend/**/*.py"
      - "backend/requirements.txt"
      - "backend/requirements-p6-windows.txt"
      - "backend/scientific_assets.json"
      - "backend/templates/**"
      - "backend/static/assets/**"
      - "backend/data/**"
      - "frontend/**"
      - ".github/workflows/portability-p6-windows-packaging.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portability-p6-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"
  INNO_SETUP_RELEASE: "is-6_7_3"
  INNO_SETUP_URL: "https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe"
  INNO_SETUP_SHA256: "9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732"

jobs:
  windows-package:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Static packaging contract
        run: python scripts/p6_packaging_check.py --static

      - name: Record scientific packaging policy
        shell: pwsh
        run: |
          Write-Host "P6_SCIENTIFIC_PACKAGE_POLICY=FAIL_CLOSED_NO_WEIGHTS"
          Write-Host "P6_UNQUALIFIED_SCIENTIFIC_WEIGHTS=FORBIDDEN"

      - name: Install frontend dependencies and build
        shell: pwsh
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build

      - name: Install Python packaging toolchain
        shell: pwsh
        run: |
          python -m pip install --no-cache-dir -r backend/requirements-p6-windows.txt
          python -m pip check

      - name: Generate Windows version metadata
        run: python scripts/generate_windows_version_info.py --output build/windows-version-info.txt

      - name: Build frozen application
        run: python -m PyInstaller --noconfirm --clean DigitalCrown.spec

      - name: Frozen package self-test
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = (Resolve-Path ".\dist\DigitalCrown\DigitalCrown.exe").Path
          $workingDir = Split-Path $exe -Parent
          $report = Join-Path $env:RUNNER_TEMP "dc-p6-frozen-self-test.json"
          $env:DIGITALCROWN_PACKAGE_SELF_TEST_REPORT = $report
          try {
            $selfTest = Start-Process -FilePath $exe -ArgumentList "--package-self-test" -WorkingDirectory $workingDir -Wait -PassThru
          } finally {
            Remove-Item Env:DIGITALCROWN_PACKAGE_SELF_TEST_REPORT -ErrorAction SilentlyContinue
          }
          if (-not (Test-Path $report -PathType Leaf)) { throw "frozen package self-test report missing: $report" }
          Write-Host "P6_FROZEN_SELF_TEST_REPORT=$(Get-Content $report -Raw)"
          if ($selfTest.ExitCode -ne 0) { throw "frozen package self-test failed: $($selfTest.ExitCode)" }

      - name: Install exact Inno Setup 6.7.3
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Join-Path $env:RUNNER_TEMP "innosetup-6.7.3.exe"
          $innoDir = Join-Path $env:RUNNER_TEMP "InnoSetup-6.7.3"
          Invoke-WebRequest -Uri $env:INNO_SETUP_URL -OutFile $installer
          $actual = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLowerInvariant()
          if ($actual -ne $env:INNO_SETUP_SHA256) { throw "Inno Setup SHA256 mismatch: $actual" }
          $signature = Get-AuthenticodeSignature $installer
          if ($signature.Status -ne 'Valid') { throw "Inno Setup Authenticode invalid: $($signature.Status)" }
          $proc = Start-Process -FilePath $installer -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-',"/DIR=$innoDir") -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "Inno Setup install failed: $($proc.ExitCode)" }
          $iscc = Join-Path $innoDir "ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe missing after exact install" }
          "P6_ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "P6_INNO_SETUP=SUCCESS release=$env:INNO_SETUP_RELEASE sha256=$actual authenticode=$($signature.Status)"

      - name: Build installer
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if (-not $env:P6_ISCC -or -not (Test-Path $env:P6_ISCC)) { throw "P6_ISCC missing" }
          & $env:P6_ISCC "/DMyAppVersion=$version" installer\DigitalCrown.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed" }

      - name: Private Authenticode signing gate
        id: codesign
        shell: pwsh
        env:
          CERT_PFX_B64: ${{ secrets.WINDOWS_CODESIGN_PFX_B64 }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PASSWORD }}
          EXPECTED_CERT_SHA256: ${{ vars.WINDOWS_CODESIGN_CERT_SHA256 }}
        run: |
          $ErrorActionPreference = "Stop"
          $values = @($env:CERT_PFX_B64, $env:CERT_PASSWORD, $env:EXPECTED_CERT_SHA256)
          $present = @($values | Where-Object { -not [string]::IsNullOrWhiteSpace([string]$_) })
          if ($present.Count -eq 0) { throw "P6_PRIVATE_CODESIGN_NOT_CONFIGURED" }
          if ($present.Count -ne 3) { throw "P6_PRIVATE_CODESIGN_PARTIAL_CONFIGURATION" }
          if ($env:EXPECTED_CERT_SHA256 -notmatch '^[0-9a-fA-F]{64}$') { throw "P6_PRIVATE_CODESIGN_CERT_SHA256_INVALID" }

          $pfx = Join-Path $env:RUNNER_TEMP "digitalcrown-private-codesign.pfx"
          try { [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_PFX_B64)) }
          catch { throw "P6_PRIVATE_CODESIGN_PFX_BASE64_INVALID" }

          $securePassword = ConvertTo-SecureString $env:CERT_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $securePassword -Exportable:$false
          if ($null -eq $cert -or -not $cert.HasPrivateKey) { throw "P6_PRIVATE_CODESIGN_PRIVATE_KEY_MISSING" }
          $ekuObjectIds = @($cert.EnhancedKeyUsageList | ForEach-Object { [string]$_.ObjectId })
          if ($ekuObjectIds -notcontains '1.3.6.1.5.5.7.3.3') { throw "P6_PRIVATE_CODESIGN_EKU_MISSING" }

          $cer = Join-Path $env:RUNNER_TEMP "digitalcrown-private-codesign.cer"
          Export-Certificate -Cert $cert -FilePath $cer -Type CERT | Out-Null
          $actualCertSha256 = (Get-FileHash -Algorithm SHA256 $cer).Hash.ToLowerInvariant()
          if ($actualCertSha256 -ne $env:EXPECTED_CERT_SHA256.ToLowerInvariant()) {
            throw "P6_PRIVATE_CODESIGN_CERT_SHA256_MISMATCH actual=$actualCertSha256"
          }

          Import-Certificate -FilePath $cer -CertStoreLocation Cert:\CurrentUser\Root | Out-Null
          Import-Certificate -FilePath $cer -CertStoreLocation Cert:\CurrentUser\TrustedPublisher | Out-Null

          $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          if (-not $signtool) { throw "signtool.exe missing" }
          $version = (Get-Content VERSION -Raw).Trim()
          $setup = (Resolve-Path "dist_installer\DigitalCrownSetup-$version.exe").Path
          & $signtool sign /fd SHA256 /sha1 $cert.Thumbprint /s My /tr http://timestamp.digicert.com /td SHA256 $setup
          if ($LASTEXITCODE -ne 0) { throw "P6_PRIVATE_AUTHENTICODE_SIGN_FAILED" }

          $verifyLog = Join-Path $env:RUNNER_TEMP "dc-p6-signtool-verify.txt"
          $verifyOutput = & $signtool verify /pa /v $setup 2>&1
          $verifyExitCode = $LASTEXITCODE
          $verifyOutput | Tee-Object -FilePath $verifyLog | ForEach-Object { Write-Host $_ }
          if ($verifyExitCode -ne 0) { throw "P6_PRIVATE_AUTHENTICODE_VERIFY_FAILED" }

          $signature = Get-AuthenticodeSignature -FilePath $setup
          if ($signature.Status -ne 'Valid') { throw "P6_PRIVATE_AUTHENTICODE_INVALID status=$($signature.Status)" }
          if ($null -eq $signature.TimeStamperCertificate) { throw "P6_PRIVATE_AUTHENTICODE_TIMESTAMP_MISSING" }
          if ($signature.SignerCertificate.Thumbprint -ne $cert.Thumbprint) { throw "P6_PRIVATE_AUTHENTICODE_SIGNER_MISMATCH" }

          $setupSha256 = (Get-FileHash -Algorithm SHA256 $setup).Hash.ToLowerInvariant()
          $proofPath = Join-Path $env:RUNNER_TEMP "dc-p6-authenticode-proof.json"
          [ordered]@{
            format = "digitalcrown-p6-authenticode-proof-v1"
            head_sha = "${{ github.sha }}"
            installer = [IO.Path]::GetFileName($setup)
            installer_sha256 = $setupSha256
            certificate_sha256 = $actualCertSha256
            signer_thumbprint_sha1 = $cert.Thumbprint.ToLowerInvariant()
            signer_subject = $signature.SignerCertificate.Subject
            signature_status = [string]$signature.Status
            timestamper_subject = $signature.TimeStamperCertificate.Subject
            timestamper_thumbprint_sha1 = $signature.TimeStamperCertificate.Thumbprint.ToLowerInvariant()
            timestamp_present = $true
            signtool_verify_exit_code = $verifyExitCode
          } | ConvertTo-Json -Depth 3 | Set-Content -Path $proofPath -Encoding utf8

          "thumbprint=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "setup_sha256=$setupSha256" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "ready=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "P6_AUTHENTICODE=SUCCESS provider=digitalcrown-private-pki cert_sha256=$actualCertSha256 setup_sha256=$setupSha256 timestamp=present signer=$($signature.SignerCertificate.Subject)"

      - name: Cleanup private signing material from runner
        if: always()
        shell: pwsh
        env:
          SIGNER_THUMBPRINT: ${{ steps.codesign.outputs.thumbprint }}
        run: |
          Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP "digitalcrown-private-codesign.pfx") -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP "digitalcrown-private-codesign.cer") -Force -ErrorAction SilentlyContinue
          if ($env:SIGNER_THUMBPRINT) {
            foreach ($store in @('My','Root','TrustedPublisher')) {
              Remove-Item -LiteralPath "Cert:\CurrentUser\$store\$env:SIGNER_THUMBPRINT" -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Install / runtime / upgrade / uninstall smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          function Invoke-P6Installer {
            param([Parameter(Mandatory=$true)][string]$FilePath,[Parameter(Mandatory=$true)][string]$ArgumentLine,[Parameter(Mandatory=$true)][string]$LogPath,[Parameter(Mandatory=$true)][string]$Phase)
            $proc = Start-Process -FilePath $FilePath -ArgumentList $ArgumentLine -Wait -PassThru
            Write-Host "P6_INSTALLER_PHASE=$Phase exit_code=$($proc.ExitCode) log=$LogPath"
            if ($proc.ExitCode -ne 0) {
              if (Test-Path $LogPath) { Get-Content -Path $LogPath -Tail 250 | ForEach-Object { Write-Host $_ } }
              throw "$Phase failed: $($proc.ExitCode)"
            }
          }
          function Show-P6RuntimeLog {
            param([Parameter(Mandatory=$true)][string]$LogPath)
            if (Test-Path $LogPath -PathType Leaf) { Get-Content -Path $LogPath -Tail 250 | ForEach-Object { Write-Host $_ } }
          }
          $version = (Get-Content VERSION -Raw).Trim()
          $setup = (Resolve-Path "dist_installer\DigitalCrownSetup-$version.exe").Path
          $sandbox = Join-Path $env:RUNNER_TEMP "dc-p6-cabinet"
          $install = Join-Path $env:RUNNER_TEMP "dc-p6-program"
          $installLog = Join-Path $env:RUNNER_TEMP "dc-p6-install.log"
          $upgradeLog = Join-Path $env:RUNNER_TEMP "dc-p6-upgrade.log"
          $uninstallLog = Join-Path $env:RUNNER_TEMP "dc-p6-uninstall.log"
          $installedSelfTestReport = Join-Path $env:RUNNER_TEMP "dc-p6-installed-self-test.json"
          $runtimeLog = Join-Path $sandbox "logs\digitalcrown.log"
          New-Item -ItemType Directory -Force $sandbox,$install | Out-Null
          $installArgs = "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP- /DIR=`"$install`" /LOG=`"$installLog`""
          Invoke-P6Installer -FilePath $setup -ArgumentLine $installArgs -LogPath $installLog -Phase "install"
          $exe = Join-Path $install "DigitalCrown.exe"
          if (-not (Test-Path $exe -PathType Leaf)) { throw "installed executable missing: $exe" }
          $env:DIGITALCROWN_PACKAGE_SELF_TEST_REPORT = $installedSelfTestReport
          try { $selfTest = Start-Process -FilePath $exe -ArgumentList "--package-self-test" -WorkingDirectory $install -Wait -PassThru }
          finally { Remove-Item Env:DIGITALCROWN_PACKAGE_SELF_TEST_REPORT -ErrorAction SilentlyContinue }
          if (-not (Test-Path $installedSelfTestReport -PathType Leaf)) { throw "installed package self-test report missing: $installedSelfTestReport" }
          Write-Host "P6_INSTALLED_SELF_TEST_REPORT=$(Get-Content $installedSelfTestReport -Raw)"
          if ($selfTest.ExitCode -ne 0) { throw "installed package self-test failed: $($selfTest.ExitCode)" }
          $sentinel = Join-Path $sandbox "P6_DATA_SENTINEL.txt"
          Set-Content -Path $sentinel -Value "preserve-me" -NoNewline
          $env:DIGITALCROWN_USER_DATA_DIR = $sandbox
          $env:DIGITALCROWN_CONFIG_DIR = $sandbox
          $env:DIGITALCROWN_LOG_DIR = (Join-Path $sandbox "logs")
          $env:DIGITALCROWN_RUNTIME_DIR = (Join-Path $sandbox "runtime")
          $env:CABINET_PORT = "8765"
          $env:DIGITALCROWN_RESTORE_RESTART = "1"
          $proc = Start-Process -FilePath $exe -WorkingDirectory $install -PassThru
          try {
            $ok = $false
            1..60 | ForEach-Object {
              if ($ok) { return }
              Start-Sleep -Seconds 2
              if ($proc.HasExited) { $exitCode = $proc.ExitCode; Show-P6RuntimeLog -LogPath $runtimeLog; throw "frozen runtime exited before health: $exitCode" }
              try { $r = Invoke-RestMethod -Uri "http://127.0.0.1:8765/health" -TimeoutSec 2; if ($r.status -eq "ok") { $ok = $true } } catch {}
            }
            if (-not $ok) { Show-P6RuntimeLog -LogPath $runtimeLog; throw "frozen runtime health failed" }
          } finally { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
          $upgradeArgs = "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP- /DIR=`"$install`" /LOG=`"$upgradeLog`""
          Invoke-P6Installer -FilePath $setup -ArgumentLine $upgradeArgs -LogPath $upgradeLog -Phase "upgrade-reinstall"
          $uninstaller = Join-Path $install "unins000.exe"
          if (-not (Test-Path $uninstaller -PathType Leaf)) { throw "uninstaller missing: $uninstaller" }
          $uninstallArgs = "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /LOG=`"$uninstallLog`""
          Invoke-P6Installer -FilePath $uninstaller -ArgumentLine $uninstallArgs -LogPath $uninstallLog -Phase "uninstall"
          if (-not (Test-Path $sentinel)) { throw "cabinet data sentinel was deleted" }
          Write-Host "P6_WINDOWS_INSTALL_SMOKE=SUCCESS"

      - name: Verify signed installer stayed immutable
        shell: pwsh
        env:
          EXPECTED_SETUP_SHA256: ${{ steps.codesign.outputs.setup_sha256 }}
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:EXPECTED_SETUP_SHA256 -notmatch '^[0-9a-fA-F]{64}$') { throw "P6_SIGNED_INSTALLER_HASH_OUTPUT_MISSING" }
          $version = (Get-Content VERSION -Raw).Trim()
          $setup = (Resolve-Path "dist_installer\DigitalCrownSetup-$version.exe").Path
          $actual = (Get-FileHash -Algorithm SHA256 $setup).Hash.ToLowerInvariant()
          if ($actual -ne $env:EXPECTED_SETUP_SHA256.ToLowerInvariant()) { throw "P6_SIGNED_INSTALLER_MUTATED expected=$env:EXPECTED_SETUP_SHA256 actual=$actual" }
          Write-Host "P6_SIGNED_INSTALLER_IMMUTABLE=SUCCESS sha256=$actual"

      - name: Upload installer lifecycle diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digitalcrown-p6-installer-lifecycle-logs
          path: |
            ${{ runner.temp }}\dc-p6-frozen-self-test.json
            ${{ runner.temp }}\dc-p6-installed-self-test.json
            ${{ runner.temp }}\dc-p6-install.log
            ${{ runner.temp }}\dc-p6-upgrade.log
            ${{ runner.temp }}\dc-p6-uninstall.log
            ${{ runner.temp }}\dc-p6-cabinet\logs\digitalcrown.log
            ${{ runner.temp }}\dc-p6-authenticode-proof.json
            ${{ runner.temp }}\dc-p6-signtool-verify.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Windows installer proof
        uses: actions/upload-artifact@v4
        with:
          name: digitalcrown-p6-windows-installer
          path: |
            dist_installer/*.exe
            ${{ runner.temp }}\dc-p6-authenticode-proof.json
            ${{ runner.temp }}\dc-p6-signtool-verify.txt
          if-no-files-found: error
          retention-days: 7
