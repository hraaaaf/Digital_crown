name: Staff Clinic & Reference Library Proof (experimental)
on:
  pull_request:
    branches: [master]
    paths:
      - ".github/workflows/staff-clinic-library-audit.yml"
      - "frontend/scripts/audit-staff-clinic-library.mjs"
      - "frontend/src/components/Header.tsx"
      - "frontend/src/components/Sidebar.tsx"
      - "frontend/src/features/clinical-ref/**"
      - "scripts/t2_runtime_server.py"
  workflow_dispatch:
permissions:
  contents: read

jobs:
  staff-library-browser:
    name: Exact-HEAD 4-session staff/tenant/reference browser proof
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ENVIRONMENT: test
      SECRET_KEY: staff-audit-certification-secret-key-000001
      DATABASE_URL: sqlite:///./t2-runtime-cert.db
      DIGITALCROWN_ISOLATED_RUNTIME: "1"
      DIGITALCROWN_ISOLATION_DB_FINGERPRINT: "c04779c8d18b3ac12a0f4093a47a5d0c3c0e2251714be532893cfa052e9ee780"
      TELEMETRY_ENABLED: "false"
      CLOUD_AI_ENABLED: "false"
      DEBUG: "false"
      T2_STAFF_AUDIT: "1"
      ALLOWED_ORIGINS: "http://127.0.0.1:5173,http://localhost:5173"
      PRODUCT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PRODUCT_HEAD }}
      - name: Require exact HEAD and validate source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_HEAD"
          node --check frontend/scripts/audit-staff-clinic-library.mjs
          python -m py_compile scripts/t2_runtime_server.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Generate disposable credential and mask before environment export
        shell: bash
        run: |
          set -euo pipefail
          credential="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          echo "::add-mask::$credential"
          printf 'T2_PASSWORD=%s\n' "$credential" >> "$GITHUB_ENV"
          unset credential
      - name: Install isolated T2 backend
        run: |
          python -m pip install --upgrade pip
          grep -vE '^(torch|torchvision|torchaudio)([<=>].*)?$' requirements.txt > /tmp/requirements-staff-audit.txt
          pip install torch==2.10.0 torchvision==0.25.0 torchaudio==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r /tmp/requirements-staff-audit.txt
          python -m pip check
      - name: Verify tenant-scoped cabinet GET/PUT authentication contract
        run: python -m pytest backend/tests/test_admin_router.py -k "test_get_cabinet_requires_auth or test_get_cabinet_returns_200 or test_update_cabinet_requires_auth" -q
      - name: Install existing frontend and real Chromium
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify staff sidebar and header identity unit contracts
        working-directory: frontend
        run: npm test -- --run src/components/Sidebar.g1Interactive.test.tsx src/components/Header.g1Interactive.test.tsx
      - name: Start synthetic backend
        shell: bash
        run: |
          set -euo pipefail
          rm -f t2-runtime-cert.db
          python scripts/t2_runtime_server.py > "$RUNNER_TEMP/staff-backend.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/staff-backend.pid"
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8005/health >/dev/null; then exit 0; fi
            sleep 1
          done
          echo "Staff audit backend readiness failed; raw logs withheld"
          exit 1
      - name: Start native frontend
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          npm run dev -- --host 127.0.0.1 --port 5173 > "$RUNNER_TEMP/staff-vite.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/staff-vite.pid"
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:5173/login >/dev/null; then exit 0; fi
            sleep 1
          done
          echo "Staff audit frontend readiness failed; raw logs withheld"
          exit 1
      - name: Certify four real clinic identities, staff permissions and library
        working-directory: frontend
        shell: bash
        run: node scripts/audit-staff-clinic-library.mjs
      - name: Upload exact-HEAD evidence (also on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staff-clinic-library-evidence
          path: artifacts/staff-library
          if-no-files-found: warn
          retention-days: 14
      - name: Clean disposable runtime
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/staff-backend.pid" ]; then kill "$(cat "$RUNNER_TEMP/staff-backend.pid")" 2>/dev/null || true; fi
          if [ -f "$RUNNER_TEMP/staff-vite.pid" ]; then kill "$(cat "$RUNNER_TEMP/staff-vite.pid")" 2>/dev/null || true; fi
          rm -f t2-runtime-cert.db
