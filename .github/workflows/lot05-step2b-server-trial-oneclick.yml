name: LOT05 Step2B Official Server and Wizard Same-Runner Trial

on:
  pull_request:
    types: [opened, synchronize]
    branches: [master]
    paths:
      - '.github/workflows/lot05-step2b-server-trial-oneclick.yml'
      - 'scripts/quality/lot05_step2b_server_trial_oneclick_lab.ps1'
      - 'scripts/quality/lot05_step2b_server_fullchain_lab.ps1'

permissions:
  contents: read

jobs:
  official-server-trial:
    name: Signed server orchestrator then vendor wizard, same Windows runner
    if: ${{ github.run_attempt == 1 && github.event.pull_request.draft == true && github.event.pull_request.head.ref == 'feat/lot05-step2b-signed-server-trial-install-oneclick-20261110' }}
    runs-on: windows-2022
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 80
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Isolated admin Windows, exact SHA and three lab files; AST check
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or $env:RUNNER_OS -cne 'Windows' -or
             (git rev-parse HEAD).Trim() -cne '${{ github.event.pull_request.head.sha }}'){
            throw 'HOSTED_WINDOWS_EXACT_HEAD_REQUIRED'
          }
          $base='027a82aca4cc37308f6323e759283c4ca0e45fad'
          $mergeBase=git merge-base HEAD $base
          if(-not $mergeBase -or $mergeBase.Trim() -cne $base){throw 'EXPECTED_BASE_NOT_PRESENT'}
          $paths=@(git diff --name-only $base HEAD)
          $expected=@('.github/workflows/lot05-step2b-server-trial-oneclick.yml',
                      'scripts/quality/lot05_step2b_server_trial_oneclick_lab.ps1',
                      'scripts/quality/lot05_step2b_server_fullchain_lab.ps1')
          if($paths.Count -ne 3 -or @($paths | Where-Object {$expected -cnotcontains $_}).Count -gt 0){
            throw 'EXTRA_PROJECT_FILE_CHANGED'
          }
          $admin=([Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole(
            [Security.Principal.WindowsBuiltInRole]::Administrator)
          if(-not $admin){throw 'ADMIN_REQUIRED'}
          if(@(Get-Service 'MySQL*','MariaDB' -ErrorAction SilentlyContinue).Count -gt 0){
            throw 'UNEXPECTED_PREEXISTING_DB'
          }
          $tokens=$null
          $parseErrors=@()
          $script='scripts/quality/lot05_step2b_server_fullchain_lab.ps1'
          $null=[System.Management.Automation.Language.Parser]::ParseFile($script,[ref]$tokens,[ref]$parseErrors)
          if($parseErrors.Count -gt 0){
            foreach($err in $parseErrors){Write-Host ('AST_ERROR_LINE_'+$err.Extent.StartLineNumber)}
            throw 'SCRIPT_AST_INVALID'
          }
          Write-Host 'LOT05_SERVER_FULLCHAIN_EXACT_SHA_ADMIN_THREE_FILES_AST_PASS'
      - name: Execute signed server Install then guarded Open Dental wizard in same runner
        shell: pwsh
        run: |
          $env:LOT05_EXPECTED_SHA='${{ github.event.pull_request.head.sha }}'
          & powershell.exe -NoProfile -NoLogo -STA -ExecutionPolicy Bypass -File './scripts/quality/lot05_step2b_server_fullchain_lab.ps1'
          if($LASTEXITCODE -ne 0){throw 'OFFICIAL_SERVER_INSTALL_SCRIPT_FAILED_CLOSED'}
      - name: Verify actual MariaDB service and demo SQL, without patient data
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $file=Join-Path $env:RUNNER_TEMP 'lot05_server_fullchain_evidence.json'
          if(-not (Test-Path -LiteralPath $file)){throw 'NO_FULLCHAIN_JSON_EVIDENCE'}
          $r=Get-Content -LiteralPath $file -Raw | ConvertFrom-Json
          if(-not $r.wrapper_hash_pinned -or -not $r.wrapper_authenticode_valid -or
             -not $r.inner_setup_authenticode_valid -or
             $r.inner_setup_sha256 -cne 'd9fefd875d82b391d981a53fe412f6c8da7481c828e8e173aa1626c722a16e27' -or
             $r.patient_data_accessed -or $r.csv_exported -or $null -ne $r.error_code){
            throw 'SIGNED_PUBLISHER_OR_PRIVACY_FAILURE'
          }
          Write-Host ('SERVER_SIX_ITEMS_PINNED='+[bool]$r.server_launcher_exact_six_items_verified)
          Write-Host ('SERVER_INSTALL_CLICK='+[bool]$r.server_launcher_install_clicked)
          Write-Host ('WIZARD_NEXT='+[bool]$r.next_click_acknowledged)
          Write-Host ('EULA_ACCEPTED_WITH_PRIOR_USER_AUTH='+[bool]$r.accepted_eula)
          Write-Host ('WIZARD_DESTINATION='+[bool]$r.destination_next_clicked)
          Write-Host ('WIZARD_INSTALL='+[bool]$r.install_click_sent)
          Write-Host ('APP_EXE_SIGNED='+[string]$r.installed_exe_authenticode_status)
          Write-Host ('MARIADB_RUNNING='+[bool]$r.mariadb_service_running)
          Write-Host ('DEMO_SQL_VERIFIED='+[bool]$r.demo_schema_verified)
          Write-Host ('DEMO_QUERY_STATUS='+[string]$r.demo_schema_check)
          if(-not $r.server_launcher_install_clicked -or -not $r.mariadb_service_running -or
             -not $r.demo_schema_verified){throw 'MARIADB_DEMO_NOT_PROVEN'}
      - name: Publish no-patient full-chain JSON evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lot05-server-fullchain-diagnostic
          path: ${{ runner.temp }}/lot05_server_fullchain_evidence.json
          retention-days: 7
          if-no-files-found: warn
      - name: Publish only vendor installer screens
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lot05-server-fullchain-vendor-screens
          path: |
            ${{ runner.temp }}/lot05_server_fullchain_initial.png
            ${{ runner.temp }}/lot05-step2b-license-before-accept-window-only.png
            ${{ runner.temp }}/lot05-step2b-license-after-accept-window-only.png
            ${{ runner.temp }}/lot05-step2b-screen-after-eula-next-only.png
            ${{ runner.temp }}/lot05-step2b-after-destination-next-window-only.png
            ${{ runner.temp }}/lot05-step2b-after-install-finish-wizard-only.png
            ${{ runner.temp }}/lot05-postinstall-last-setup.png
            ${{ runner.temp }}/lot05-postinstall-last-server.png
          retention-days: 7
          if-no-files-found: warn
