name: LOT05 Step2B Signed Publisher Server Install One-Click

on:
  pull_request:
    types: [opened, synchronize]
    branches: [master]
    paths:
      - '.github/workflows/lot05-step2b-server-trial-oneclick.yml'
      - 'scripts/quality/lot05_step2b_server_trial_oneclick_lab.ps1'

permissions:
  contents: read

jobs:
  official-server-trial:
    name: Exact signed all-selected trial server GUI, one Install click max
    if: ${{ github.event.pull_request.draft == true && github.event.pull_request.head.ref == 'feat/lot05-step2b-signed-server-trial-install-oneclick-20261110' && github.run_attempt == 1 }}
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 12
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Isolated admin Windows, exact SHA and two lab files; AST check
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or $env:RUNNER_OS -cne 'Windows' -or
             (git rev-parse HEAD).Trim() -cne '${{ github.event.pull_request.head.sha }}'){
            throw 'HOSTED_WINDOWS_EXACT_HEAD_REQUIRED'
          }
          $base='027a82aca4cc37308f6323e759283c4ca0e45fad'
          if((git merge-base HEAD $base).Trim() -cne $base){throw 'EXPECTED_BASE_NOT_PRESENT'}
          $paths=@(git diff --name-only $base HEAD)
          $expected=@('.github/workflows/lot05-step2b-server-trial-oneclick.yml',
                      'scripts/quality/lot05_step2b_server_trial_oneclick_lab.ps1')
          if($paths.Count -ne 2 -or @($paths | Where-Object {$expected -cnotcontains $_}).Count -gt 0){
            throw 'EXTRA_PROJECT_FILE_CHANGED'
          }
          $admin=([Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole(
            [Security.Principal.WindowsBuiltInRole]::Administrator)
          if(-not $admin){throw 'ADMIN_REQUIRED'}
          if(@(Get-Service 'MySQL*','MariaDB' -ErrorAction SilentlyContinue).Count -gt 0){
            throw 'UNEXPECTED_PREEXISTING_DB'
          }
          $tokens=$null
          $parseErrors=@()
          $script='scripts/quality/lot05_step2b_server_trial_oneclick_lab.ps1'
          $null=[System.Management.Automation.Language.Parser]::ParseFile($script,[ref]$tokens,[ref]$parseErrors)
          if($parseErrors.Count -gt 0){
            foreach($err in $parseErrors){Write-Host ('AST_ERROR_LINE_'+$err.Extent.StartLineNumber)}
            throw 'SCRIPT_AST_INVALID'
          }
          Write-Host 'LOT05_SERVER_ONECLICK_EXACT_SHA_ADMIN_TWO_FILES_AST_PASS'
      - name: One physical Install on hash-pinned official trial default all-selected GUI
        shell: pwsh
        run: |
          $env:LOT05_EXPECTED_SHA='${{ github.event.pull_request.head.sha }}'
          & powershell.exe -NoProfile -NoLogo -STA -ExecutionPolicy Bypass -File './scripts/quality/lot05_step2b_server_trial_oneclick_lab.ps1'
          if($LASTEXITCODE -ne 0){throw 'OFFICIAL_SERVER_INSTALL_SCRIPT_FAILED_CLOSED'}
      - name: Verify no PHI, signed publisher and screenshot provenance
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $file=Join-Path $env:RUNNER_TEMP 'lot05_server_launcher_readonly.json'
          if(-not (Test-Path -LiteralPath $file)){throw 'NO_JSON_PROOF'}
          $r=Get-Content -LiteralPath $file -Raw | ConvertFrom-Json
          if(-not $r.wrapper_hash_pinned -or -not $r.wrapper_signature_valid -or
             -not $r.publisher_is_open_dental -or -not $r.embedded_launcher_started -or
             $r.accepted_license -or $r.accessed_patient_data -or $r.exported_csv -or
             $null -ne $r.error_code){throw 'VENDOR_PROVENANCE_OR_PATIENT_DATA_FAILURE'}
          Write-Host ('LOT05_ALL_SELECTED_OFFICIAL_GUI_SHA='+[bool]$r.exact_all_selected_gui_sha256_verified)
          Write-Host ('LOT05_SERVER_INSTALL_UNIQUE_CONTROL='+[int]$r.install_control_candidates)
          Write-Host ('LOT05_SERVER_INSTALL_PID_VERIFIED='+[bool]$r.install_button_pid_verified)
          Write-Host ('LOT05_SERVER_INSTALL_HIT_TEST='+[bool]$r.install_hit_test_exact_button)
          Write-Host ('LOT05_SERVER_INSTALL_CLICK='+[bool]$r.clicked_install)
          Write-Host ('LOT05_SERVER_POST_CLICK_WINDOW='+[bool]$r.post_click_window_captured)
          Write-Host ('LOT05_SERVER_POST_CLICK_TITLE='+[string]$r.post_click_window_title)
          Write-Host ('LOT05_SERVER_DB_SERVICE_PRESENT='+[bool]$r.created_database)
          if($r.vendor_window_capture_ok){
            $png=Join-Path $env:RUNNER_TEMP 'lot05_server_launcher_window.png'
            if(-not (Test-Path -LiteralPath $png) -or
               (Get-FileHash -LiteralPath $png -Algorithm SHA256).Hash.ToLowerInvariant() -cne $r.vendor_window_sha256){
              throw 'SIGNED_INITIAL_WINDOW_HASH_MISMATCH'
            }
            Add-Content -LiteralPath $env:GITHUB_ENV -Value 'LOT05_SERVER_INITIAL_PNG_OK=1'
          }
          if($r.post_click_window_captured -and $r.clicked_install){
            $png=Join-Path $env:RUNNER_TEMP 'lot05_after_official_server_install_click_window.png'
            if(-not (Test-Path -LiteralPath $png) -or
               (Get-Item -LiteralPath $png).Length -gt 6000000 -or
               (Get-FileHash -LiteralPath $png -Algorithm SHA256).Hash.ToLowerInvariant() -cne $r.post_click_window_sha256){
              throw 'SIGNED_POST_CLICK_WINDOW_HASH_MISMATCH'
            }
            Add-Content -LiteralPath $env:GITHUB_ENV -Value 'LOT05_SERVER_POST_PNG_OK=1'
          }
      - name: Publish no-PHI JSON diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lot05-server-trial-install-oneclick-json
          path: ${{ runner.temp }}/lot05_server_launcher_readonly.json
          retention-days: 7
          if-no-files-found: warn
      - name: Publish screenshot of signed official all-selected trial options
        if: ${{ env.LOT05_SERVER_INITIAL_PNG_OK == '1' }}
        uses: actions/upload-artifact@v4
        with:
          name: lot05-server-trial-all-selected-official-png
          path: ${{ runner.temp }}/lot05_server_launcher_window.png
          retention-days: 7
          if-no-files-found: error
      - name: Publish only captured real vendor window after Install
        if: ${{ env.LOT05_SERVER_POST_PNG_OK == '1' }}
        uses: actions/upload-artifact@v4
        with:
          name: lot05-server-trial-after-install-next-window-png
          path: ${{ runner.temp }}/lot05_after_official_server_install_click_window.png
          retention-days: 7
          if-no-files-found: error
