name: Settings R6 Type Import Sync

on:
  pull_request:
    paths:
      - ".github/workflows/settings-r6-type-import-sync.yml"

permissions:
  contents: write

jobs:
  sync:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: settings-r6-catalog-crud
          fetch-depth: 0
      - name: Convert Catalog model imports to type-only imports
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('frontend/src/features/admin/Settings/tabs/CatalogTab.tsx')
          text = path.read_text(encoding='utf-8')
          old = """import {\n  CatalogAct,\n  Pathology,\n  Specialty,\n  useCatalogStore,\n} from '../hooks/useCatalogStore';"""
          new = """import { useCatalogStore } from '../hooks/useCatalogStore';\nimport type { CatalogAct, Pathology, Specialty } from '../hooks/useCatalogStore';"""
          if old not in text:
              raise SystemExit('expected Catalog import block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Verify import contract
        run: |
          grep -n "import type { CatalogAct, Pathology, Specialty }" frontend/src/features/admin/Settings/tabs/CatalogTab.tsx
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/features/admin/Settings/tabs/CatalogTab.tsx
          git commit -m "fix(settings): use type-only Catalog imports"
          git push origin HEAD:settings-r6-catalog-crud
