name: Patient P0 Migration Certification

on:
  push:
    branches:
      - agent/patient-page-p0-truth-safety
    paths:
      - .github/workflows/patient-p0-migration-cert.yml
      - alembic/versions/c3d4e5f6a7b8_backfill_patient_medical_history.py
      - alembic/versions/c4d5e6f7a8b9_link_installment_plans_to_actes.py
      - backend/models.py
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ENVIRONMENT: test
      SECRET_KEY: patient-p0-migration-cert-secret-000001
      DATABASE_URL: sqlite:///./patient-p0-migration-cert.db
      TELEMETRY_ENABLED: "false"
      CLOUD_AI_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install migration dependencies
        run: |
          python -m pip install --upgrade pip
          pip install alembic==1.19.1 sqlalchemy==2.0.28 passlib==1.7.4 python-dotenv

      - name: Build exact pre-P0 fixture at b2c3d4e5f6a7
        run: |
          python - <<'PY'
          import sqlite3

          conn = sqlite3.connect('patient-p0-migration-cert.db')
          conn.executescript('''
          PRAGMA foreign_keys=ON;
          CREATE TABLE patients (
              id INTEGER PRIMARY KEY,
              antecedents_medicaux VARCHAR
          );
          CREATE TABLE dossiers_cliniques (
              id INTEGER PRIMARY KEY,
              patient_id INTEGER UNIQUE NOT NULL,
              antecedents_medicaux TEXT
          );
          CREATE TABLE actes (
              id INTEGER PRIMARY KEY
          );
          CREATE TABLE installment_plans (
              id INTEGER PRIMARY KEY,
              patient_id INTEGER NOT NULL,
              title VARCHAR(200) NOT NULL,
              total_amount FLOAT NOT NULL,
              created_at DATETIME,
              updated_at DATETIME
          );
          CREATE TABLE alembic_version (
              version_num VARCHAR(32) NOT NULL
          );
          INSERT INTO alembic_version(version_num) VALUES ('b2c3d4e5f6a7');

          INSERT INTO patients(id, antecedents_medicaux) VALUES (1, NULL);
          INSERT INTO patients(id, antecedents_medicaux) VALUES (2, 'Canonique à préserver');
          INSERT INTO dossiers_cliniques(id, patient_id, antecedents_medicaux)
              VALUES (1, 1, 'Legacy à récupérer');
          INSERT INTO dossiers_cliniques(id, patient_id, antecedents_medicaux)
              VALUES (2, 2, 'Legacy à ne pas écraser');
          INSERT INTO actes(id) VALUES (10);
          INSERT INTO installment_plans(id, patient_id, title, total_amount)
              VALUES (20, 1, 'Plan historique', 1000.0);
          ''')
          conn.commit()
          conn.close()
          PY

      - name: Upgrade only Patient P0 migrations to c4d5e6f7a8b9
        run: python -m alembic upgrade c4d5e6f7a8b9

      - name: Verify exact P0 migration outcome
        run: |
          python - <<'PY'
          import sqlite3

          conn = sqlite3.connect('patient-p0-migration-cert.db')
          head = conn.execute('SELECT version_num FROM alembic_version').fetchone()[0]
          if head != 'c4d5e6f7a8b9':
              raise SystemExit(f'Unexpected Alembic head: {head}')

          copied = conn.execute('SELECT antecedents_medicaux FROM patients WHERE id=1').fetchone()[0]
          preserved = conn.execute('SELECT antecedents_medicaux FROM patients WHERE id=2').fetchone()[0]
          if copied != 'Legacy à récupérer':
              raise SystemExit(f'Legacy medical history was not backfilled: {copied!r}')
          if preserved != 'Canonique à préserver':
              raise SystemExit(f'Canonical medical history was overwritten: {preserved!r}')

          dossier_cols = {row[1] for row in conn.execute('PRAGMA table_info(dossiers_cliniques)')}
          plan_cols = {row[1] for row in conn.execute('PRAGMA table_info(installment_plans)')}
          if 'antecedents_medicaux' not in dossier_cols:
              raise SystemExit('Legacy physical medical-history column was unexpectedly dropped')
          if 'acte_id' not in plan_cols:
              raise SystemExit('InstallmentPlan acte_id column missing')

          fks = list(conn.execute('PRAGMA foreign_key_list(installment_plans)'))
          if not any(row[2] == 'actes' and row[3] == 'acte_id' and row[4] == 'id' for row in fks):
              raise SystemExit(f'InstallmentPlan acte_id FK missing: {fks}')

          legacy_plan_acte = conn.execute('SELECT acte_id FROM installment_plans WHERE id=20').fetchone()[0]
          if legacy_plan_acte is not None:
              raise SystemExit('Historical global installment plan was unexpectedly linked to an Acte')

          print({
              'head': head,
              'backfill_preserved': True,
              'legacy_column_retained': True,
              'acte_fk': True,
              'historical_plan_backward_compatible': True,
          })
          conn.close()
          PY
