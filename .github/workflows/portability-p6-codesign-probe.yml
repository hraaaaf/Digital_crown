name: Portability P6 Authenticode Probe

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - ".github/workflows/portability-p6-codesign-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portability-p6-codesign-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  codesign-probe:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Validate signing inputs and decode PFX
        shell: pwsh
        timeout-minutes: 1
        env:
          CERT_PFX_B64: ${{ secrets.WINDOWS_CODESIGN_PFX_B64 }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PASSWORD }}
          EXPECTED_CERT_SHA256: ${{ vars.WINDOWS_CODESIGN_CERT_SHA256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          $values = @($env:CERT_PFX_B64, $env:CERT_PASSWORD, $env:EXPECTED_CERT_SHA256)
          $present = @($values | Where-Object { -not [string]::IsNullOrWhiteSpace([string]$_) })
          if ($present.Count -eq 0) { throw 'P6_PRIVATE_CODESIGN_NOT_CONFIGURED' }
          if ($present.Count -ne 3) { throw 'P6_PRIVATE_CODESIGN_PARTIAL_CONFIGURATION' }
          if ($env:EXPECTED_CERT_SHA256 -notmatch '^[0-9a-fA-F]{64}$') { throw 'P6_PRIVATE_CODESIGN_CERT_SHA256_INVALID' }
          $pfx = Join-Path $env:RUNNER_TEMP 'digitalcrown-private-codesign.pfx'
          try { [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_PFX_B64)) }
          catch { throw 'P6_PRIVATE_CODESIGN_PFX_BASE64_INVALID' }
          if (-not (Test-Path -LiteralPath $pfx -PathType Leaf)) { throw 'P6_PRIVATE_CODESIGN_PFX_MISSING_AFTER_DECODE' }
          Write-Host 'P6_PROBE_PHASE=INPUTS_DECODE_SUCCESS'

      - name: Parse PFX in memory
        shell: pwsh
        timeout-minutes: 2
        env:
          CERT_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PASSWORD }}
          EXPECTED_CERT_SHA256: ${{ vars.WINDOWS_CODESIGN_CERT_SHA256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          $pfx = Join-Path $env:RUNNER_TEMP 'digitalcrown-private-codesign.pfx'
          $bytes = [IO.File]::ReadAllBytes($pfx)
          $flags = [Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet
          $cert = [Security.Cryptography.X509Certificates.X509Certificate2]::new($bytes, $env:CERT_PASSWORD, $flags)
          if (-not $cert.HasPrivateKey) { throw 'P6_PRIVATE_CODESIGN_PRIVATE_KEY_MISSING' }
          $eku = $cert.Extensions | Where-Object { $_.Oid.Value -eq '2.5.29.37' } | Select-Object -First 1
          if ($null -eq $eku) { throw 'P6_PRIVATE_CODESIGN_EKU_MISSING' }
          $ekuTyped = [Security.Cryptography.X509Certificates.X509EnhancedKeyUsageExtension]$eku
          $ekuOids = @($ekuTyped.EnhancedKeyUsages | ForEach-Object { $_.Value })
          if ($ekuOids -notcontains '1.3.6.1.5.5.7.3.3') { throw 'P6_PRIVATE_CODESIGN_EKU_MISSING' }
          if ($cert.Subject -ne 'CN=Digital Crown Private Publisher') { throw "P6_PRIVATE_CODESIGN_SUBJECT_MISMATCH subject=$($cert.Subject)" }
          $cer = Join-Path $env:RUNNER_TEMP 'digitalcrown-private-codesign.cer'
          [IO.File]::WriteAllBytes($cer, $cert.Export([Security.Cryptography.X509Certificates.X509ContentType]::Cert))
          $actual = (Get-FileHash -Algorithm SHA256 $cer).Hash.ToLowerInvariant()
          if ($actual -ne $env:EXPECTED_CERT_SHA256.ToLowerInvariant()) { throw "P6_PRIVATE_CODESIGN_CERT_SHA256_MISMATCH actual=$actual" }
          "P6_PROBE_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "P6_PROBE_PHASE=PFX_MEMORY_PARSE_SUCCESS cert_sha256=$actual subject=$($cert.Subject)"
          $cert.Dispose()

      - name: Import private signing certificate into CurrentUser My
        shell: pwsh
        timeout-minutes: 2
        env:
          CERT_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $pfx = Join-Path $env:RUNNER_TEMP 'digitalcrown-private-codesign.pfx'
          $securePassword = ConvertTo-SecureString $env:CERT_PASSWORD -AsPlainText -Force
          Write-Host 'P6_PROBE_PHASE=PFX_STORE_IMPORT_START'
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $securePassword -Exportable:$false
          if ($null -eq $cert -or -not $cert.HasPrivateKey) { throw 'P6_PRIVATE_CODESIGN_PRIVATE_KEY_MISSING_AFTER_IMPORT' }
          if ($cert.Thumbprint -ne $env:P6_PROBE_THUMBPRINT) { throw 'P6_PRIVATE_CODESIGN_IMPORT_THUMBPRINT_MISMATCH' }
          Write-Host 'P6_PROBE_PHASE=PFX_STORE_IMPORT_SUCCESS'

      - name: Import public trust into CurrentUser stores
        shell: pwsh
        timeout-minutes: 2
        run: |
          $ErrorActionPreference = 'Stop'
          $cer = Join-Path $env:RUNNER_TEMP 'digitalcrown-private-codesign.cer'
          $cert = [Security.Cryptography.X509Certificates.X509Certificate2]::new($cer)
          Write-Host 'P6_PROBE_PHASE=TRUST_IMPORT_START'
          foreach ($storeName in @('Root', 'TrustedPublisher')) {
            $store = [Security.Cryptography.X509Certificates.X509Store]::new($storeName, [Security.Cryptography.X509Certificates.StoreLocation]::CurrentUser)
            try {
              $store.Open([Security.Cryptography.X509Certificates.OpenFlags]::ReadWrite)
              $store.Add($cert)
            } finally {
              $store.Close()
            }
          }
          Write-Host 'P6_PROBE_PHASE=TRUST_IMPORT_SUCCESS'

      - name: Sign timestamped probe executable
        shell: pwsh
        timeout-minutes: 4
        run: |
          $ErrorActionPreference = 'Stop'
          $signtool = (Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter signtool.exe | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          if (-not $signtool) { throw 'P6_PRIVATE_CODESIGN_SIGNTOOL_MISSING' }
          $probe = Join-Path $env:RUNNER_TEMP 'dc-p6-codesign-probe.exe'
          Add-Type -TypeDefinition 'public static class Program { public static void Main() { } }' -Language CSharp -OutputAssembly $probe -OutputType ConsoleApplication
          $stdout = Join-Path $env:RUNNER_TEMP 'dc-p6-probe-sign.stdout.txt'
          $stderr = Join-Path $env:RUNNER_TEMP 'dc-p6-probe-sign.stderr.txt'
          Write-Host 'P6_PROBE_PHASE=SIGN_START timeout_seconds=180'
          $proc = Start-Process -FilePath $signtool -ArgumentList @('sign','/fd','SHA256','/sha1',$env:P6_PROBE_THUMBPRINT,'/s','My','/tr','http://timestamp.digicert.com','/td','SHA256',$probe) -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          if (-not $proc.WaitForExit(180000)) {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            throw 'P6_PRIVATE_AUTHENTICODE_SIGN_TIMEOUT'
          }
          $proc.WaitForExit()
          if (Test-Path $stdout) { Get-Content $stdout | ForEach-Object { Write-Host $_ } }
          if (Test-Path $stderr) { Get-Content $stderr | ForEach-Object { Write-Host $_ } }
          if ($proc.ExitCode -ne 0) { throw "P6_PRIVATE_AUTHENTICODE_SIGN_FAILED exit_code=$($proc.ExitCode)" }
          Write-Host 'P6_PROBE_PHASE=SIGN_SUCCESS'

      - name: Verify timestamped probe executable
        shell: pwsh
        timeout-minutes: 2
        run: |
          $ErrorActionPreference = 'Stop'
          $signtool = (Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter signtool.exe | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          $probe = Join-Path $env:RUNNER_TEMP 'dc-p6-codesign-probe.exe'
          $stdout = Join-Path $env:RUNNER_TEMP 'dc-p6-probe-verify.stdout.txt'
          $stderr = Join-Path $env:RUNNER_TEMP 'dc-p6-probe-verify.stderr.txt'
          Write-Host 'P6_PROBE_PHASE=VERIFY_START timeout_seconds=60'
          $proc = Start-Process -FilePath $signtool -ArgumentList @('verify','/pa','/v',$probe) -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          if (-not $proc.WaitForExit(60000)) {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            throw 'P6_PRIVATE_AUTHENTICODE_VERIFY_TIMEOUT'
          }
          $proc.WaitForExit()
          if (Test-Path $stdout) { Get-Content $stdout | ForEach-Object { Write-Host $_ } }
          if (Test-Path $stderr) { Get-Content $stderr | ForEach-Object { Write-Host $_ } }
          if ($proc.ExitCode -ne 0) { throw "P6_PRIVATE_AUTHENTICODE_VERIFY_FAILED exit_code=$($proc.ExitCode)" }
          $signature = Get-AuthenticodeSignature -FilePath $probe
          if ($signature.Status -ne 'Valid') { throw "P6_PRIVATE_AUTHENTICODE_INVALID status=$($signature.Status)" }
          if ($null -eq $signature.TimeStamperCertificate) { throw 'P6_PRIVATE_AUTHENTICODE_TIMESTAMP_MISSING' }
          if ($signature.SignerCertificate.Thumbprint -ne $env:P6_PROBE_THUMBPRINT) { throw 'P6_PRIVATE_AUTHENTICODE_SIGNER_MISMATCH' }
          Write-Host "P6_PROBE=SUCCESS signer=$($signature.SignerCertificate.Subject) timestamp=$($signature.TimeStamperCertificate.Subject)"

      - name: Upload probe diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digitalcrown-p6-codesign-probe
          path: |
            ${{ runner.temp }}\dc-p6-probe-sign.stdout.txt
            ${{ runner.temp }}\dc-p6-probe-sign.stderr.txt
            ${{ runner.temp }}\dc-p6-probe-verify.stdout.txt
            ${{ runner.temp }}\dc-p6-probe-verify.stderr.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Cleanup probe signing material
        if: always()
        shell: pwsh
        run: |
          foreach ($path in @('digitalcrown-private-codesign.pfx','digitalcrown-private-codesign.cer','dc-p6-codesign-probe.exe')) {
            Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP $path) -Force -ErrorAction SilentlyContinue
          }
          if ($env:P6_PROBE_THUMBPRINT) {
            foreach ($store in @('My','Root','TrustedPublisher')) {
              Remove-Item -LiteralPath "Cert:\CurrentUser\$store\$env:P6_PROBE_THUMBPRINT" -Force -ErrorAction SilentlyContinue
            }
          }
