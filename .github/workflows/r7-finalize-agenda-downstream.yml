name: R7 Finalize Agenda Downstream

on:
  pull_request:
    paths:
      - ".github/workflows/r7-finalize-agenda-downstream.yml"

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Finalize authoritative Agenda downstream behavior
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if old in text:
                  if text.count(old) != 1:
                      raise SystemExit(f'{label}: expected 1 match, found {text.count(old)}')
                  return text.replace(old, new, 1)
              if new in text:
                  return text
              raise SystemExit(f'{label}: neither source nor target form found')

          daily_path = Path('frontend/src/features/agenda/DailyView.tsx')
          daily = daily_path.read_text()

          # If the first one-shot applier has not run yet, reuse its verified Python block.
          if 'agendaSettings?: AgendaSettingsLike | null;' not in daily:
              applier = Path('.github/workflows/r7-apply-agenda-downstream.yml').read_text()
              marker = "          python - <<'PY'\n"
              start = applier.index(marker) + len(marker)
              end = applier.index("\n          PY\n", start)
              base_script = textwrap.dedent(applier[start:end])
              exec(compile(base_script, 'r7-apply-agenda-downstream.yml', 'exec'), {})

          schedule_path = Path('frontend/src/features/agenda/agendaSchedule.ts')
          schedule = schedule_path.read_text()
          helper = """export const isTimeWithinSchedule = (time: string, schedule: DaySchedule): boolean => {
            if (!schedule.is_open || !/^\\d{2}:\\d{2}$/.test(time)) return false;
            const target = timeToMinutes(time);
            const morningStart = timeToMinutes(schedule.morning_start);
            const morningEnd = timeToMinutes(schedule.morning_end);
            if (schedule.is_continuous) return target >= morningStart && target < morningEnd;
            const afternoonStart = timeToMinutes(schedule.afternoon_start);
            const afternoonEnd = timeToMinutes(schedule.afternoon_end);
            return (target >= morningStart && target < morningEnd) || (target >= afternoonStart && target < afternoonEnd);
          };

          """
          if 'export const isTimeWithinSchedule' not in schedule:
              anchor = "export const getDayBounds = (schedule: DaySchedule): { startHour: number; endHour: number } => {"
              if anchor not in schedule:
                  raise SystemExit('agendaSchedule helper anchor missing')
              schedule = schedule.replace(anchor, helper + anchor, 1)
              schedule_path.write_text(schedule)

          daily = daily_path.read_text()
          daily = replace_once(
              daily,
              "import { getDayBounds, getDaySchedule, getExceptionForDate, isDateOpen, type AgendaExceptionLike, type AgendaSettingsLike } from './agendaSchedule';",
              "import { getDayBounds, getDaySchedule, getExceptionForDate, isDateOpen, isTimeWithinSchedule, type AgendaExceptionLike, type AgendaSettingsLike } from './agendaSchedule';",
              'DailyView schedule import',
          )
          daily = replace_once(
              daily,
              "    const timeString = `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}`;\n    \n    setInitialTime(timeString);",
              "    const timeString = `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}`;\n    if (!isTimeWithinSchedule(timeString, daySchedule)) return;\n    \n    setInitialTime(timeString);",
              'DailyView split-day booking guard',
          )
          daily_path.write_text(daily)

          weekly_path = Path('frontend/src/features/agenda/WeeklyView.tsx')
          weekly = weekly_path.read_text()
          weekly = replace_once(
              weekly,
              "import { formatScheduleSummary, getDaySchedule, getExceptionForDate, getWeekBounds, isDateOpen, type AgendaExceptionLike, type AgendaSettingsLike } from './agendaSchedule';",
              "import { formatScheduleSummary, getDaySchedule, getExceptionForDate, getWeekBounds, isDateOpen, isTimeWithinSchedule, type AgendaExceptionLike, type AgendaSettingsLike } from './agendaSchedule';",
              'WeeklyView schedule import',
          )
          weekly = replace_once(
              weekly,
              "    const timeString = `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}`;\n    \n    setModalDate(date);",
              "    const timeString = `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}`;\n    if (!isTimeWithinSchedule(timeString, getDaySchedule(date, agendaSettings))) return;\n    \n    setModalDate(date);",
              'WeeklyView split-day booking guard',
          )
          weekly_path.write_text(weekly)

          test_path = Path('frontend/src/test/agendaR7Schedule.test.ts')
          test_path.write_text(textwrap.dedent("""\
          import { describe, expect, it } from 'vitest';
          import fs from 'node:fs';
          import path from 'node:path';
          import { isTimeWithinSchedule, type DaySchedule } from '../features/agenda/agendaSchedule';

          const splitDay: DaySchedule = {
            is_open: true,
            is_continuous: false,
            morning_start: '09:00',
            morning_end: '13:00',
            afternoon_start: '14:00',
            afternoon_end: '18:00',
          };

          describe('R7 authoritative booking windows', () => {
            it('rejects the midday pause and closing boundary', () => {
              expect(isTimeWithinSchedule('09:00', splitDay)).toBe(true);
              expect(isTimeWithinSchedule('12:45', splitDay)).toBe(true);
              expect(isTimeWithinSchedule('13:00', splitDay)).toBe(false);
              expect(isTimeWithinSchedule('13:30', splitDay)).toBe(false);
              expect(isTimeWithinSchedule('14:00', splitDay)).toBe(true);
              expect(isTimeWithinSchedule('18:00', splitDay)).toBe(false);
            });

            it('uses one contiguous interval for a continuous day', () => {
              const continuous = { ...splitDay, is_continuous: true, morning_end: '17:00' };
              expect(isTimeWithinSchedule('13:30', continuous)).toBe(true);
              expect(isTimeWithinSchedule('17:00', continuous)).toBe(false);
            });

            it('wires the guard into both exact-time agenda views', () => {
              const daily = fs.readFileSync(path.join(process.cwd(), 'src/features/agenda/DailyView.tsx'), 'utf8');
              const weekly = fs.readFileSync(path.join(process.cwd(), 'src/features/agenda/WeeklyView.tsx'), 'utf8');
              expect(daily).toContain('isTimeWithinSchedule(timeString, daySchedule)');
              expect(weekly).toContain('isTimeWithinSchedule(timeString, getDaySchedule(date, agendaSettings))');
            });
          });
          """))
          PY

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            frontend/src/features/agenda/AgendaStudio.tsx \
            frontend/src/features/agenda/DailyView.tsx \
            frontend/src/features/agenda/WeeklyView.tsx \
            frontend/src/features/agenda/agendaSchedule.ts \
            frontend/src/test/agendaR7Schedule.test.ts
          if git diff --cached --quiet; then
            echo "R7 downstream already finalized"
            exit 0
          fi
          git commit -m "fix(agenda): enforce real booking windows downstream"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
