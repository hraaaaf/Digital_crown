name: P1 Canonical Closeout Once

on:
  push:
    branches:
      - work-20260815-p1-canonical-closeout

permissions:
  contents: write

jobs:
  closeout:
    if: github.event.head_commit.message == 'chore(p1): run canonical closeout'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update canonical P1 documents
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          merge_sha = '91a2c2efd781fd736ebdc96e9de4f5e3c73c82c8'
          pr_head = '9a00f07c4b1dc98776cf03bc17b27c23b50d7a81'
          pre_run = '31897932430'
          pre_artifact = '9250318673'
          pre_digest = 'sha256:81db7ba5b525413908bb3b9faa84a2d6fc6478da756a6367b22d590c88e511e0'
          glass_run = '31898157179'
          glass_artifact = '9250378182'
          glass_digest = 'sha256:4809953baa1ed5dd49a7b143da694ae13e438394146a2d3c8809be90e39dd6de'
          pr_ci = '31898122575'
          merge_ci = '31898590067'

          p = Path('ROADMAP_ORDONNANCE_P1.md')
          text = p.read_text(encoding='utf-8')
          replacements = {
              '- [ ] hiérarchie visuelle glass premium restaurée sans perte de sécurité': '- [x] hiérarchie visuelle glass premium restaurée sans perte de sécurité',
              '- [ ] recapture comparative glass 1440/768/390 validée': '- [x] recapture comparative glass 1440/768/390 validée',
              '- [ ] CI exacte sur le head final de PR #43 verte': '- [x] CI exacte sur le head final de PR #43 verte',
              '- [ ] merge PR #43': '- [x] merge PR #43',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          closeout = f'''\n---\n\n## 13. Closeout UX/engineering P1 — 2026-08-15\n\n### Preuves finales\n- PR `#43` mergée sur `master` : `{merge_sha}`.\n- Head fonctionnel final PR : `{pr_head}`.\n- CI exacte-head PR : run `{pr_ci}` — **SUCCESS**.\n- Audit visuel historique pré-R1 : run `{pre_run}` — **SUCCESS**, artifact `{pre_artifact}`, digest `{pre_digest}`.\n- Recertification glass finale 1440 / 768 / 390 : run `{glass_run}` — **SUCCESS**, artifact `{glass_artifact}`, digest `{glass_digest}`.\n- Inspection visuelle manuelle des trois captures : **propre**, sans débordement horizontal destructif ni action principale rognée.\n- Le langage glassmorphique historique est conservé ; la hiérarchie contexte/sécurité a été regroupée en une surface glass principale sans suppression d'information de sécurité.\n- CI push exacte du merge sur `master` : run `{merge_ci}` — **à vérifier avant fermeture complète**.\n\n### Limites explicitement conservées\n- L'interaction authentifiée dans l'application locale réelle du cabinet reste **non certifiée** par ces captures isolées.\n- La certification clinique/pharmacologique humaine reste un gate séparé.\n- Aucun statut `production ready` n'est déduit de cette certification visuelle/engineering.\n'''
          if '## 13. Closeout UX/engineering P1 — 2026-08-15' not in text:
              text = text.rstrip() + '\n' + closeout
          p.write_text(text, encoding='utf-8')

          p = Path('DOCUMENT_STUDIO_ROADMAP.md')
          text = p.read_text(encoding='utf-8')
          text = text.replace(
              '- [ ] **Recertification après refonte**',
              f'- [x] **Recertification visuelle après refonte** — PR #43 mergée `{merge_sha}` ; captures 1440/768/390 inspectées ; CI PR `{pr_ci}` SUCCESS. Interaction authentifiée locale reste séparée.'
          )
          block = f'''\n#### P1 — closeout runtime visuel / glass\n- PR `#43` — **MERGED**.\n- Head final PR : `{pr_head}` ; CI exacte run `{pr_ci}` — **SUCCESS**.\n- Merge `master` : `{merge_sha}`.\n- Baseline visuelle pré-R1 auditée via run `{pre_run}` — SUCCESS.\n- Recapture finale glass 1440 / 768 / 390 via run `{glass_run}` — **SUCCESS** ; artifact `{glass_artifact}` ; inspection visuelle propre.\n- Le glassmorphisme historique n'a pas été supprimé ; le correctif final regroupe contexte, sécurité, actions et alerte forme dans une hiérarchie glass cohérente sans retirer les gardes de sécurité.\n- **Non couvert par cette preuve :** interaction authentifiée dans l'application locale réelle et certification clinique/pharmacologique.\n- CI push post-merge : run `{merge_ci}` — à vérifier avant fermeture documentaire complète.\n\n'''
          marker = '### P2 — Devis + Honoraires'
          if '#### P1 — closeout runtime visuel / glass' not in text and marker in text:
              text = text.replace(marker, block + marker, 1)
          p.write_text(text, encoding='utf-8')

          p = Path('docs/audits/DOCUMENT_STUDIO_P1_ORDONNANCE_AUDIT.md')
          text = p.read_text(encoding='utf-8')
          appendix = f'''\n\n---\n\n## Addendum de recertification P1 — 2026-08-15\n\nCet addendum met à jour le statut de l'audit statique historique sans réécrire rétroactivement ses constats.\n\n### État engineering / UX vérifié\n- R1 → R7 sont fermés côté engineering selon leurs CI exact-head documentées.\n- PR `#43` a corrigé les défauts responsive observés en runtime isolé et restauré la hiérarchie glass premium.\n- Head final PR : `{pr_head}` ; CI exacte `{pr_ci}` — **SUCCESS**.\n- Merge sur `master` : `{merge_sha}`.\n- Comparaison historique pré-R1 : run `{pre_run}` — SUCCESS, artifact `{pre_artifact}`, digest `{pre_digest}`.\n- Recertification finale glass : run `{glass_run}` — SUCCESS, artifact `{glass_artifact}`, digest `{glass_digest}`.\n- Vues inspectées : **1440 × 1100, 768 × 1100, 390 × 844**.\n- Verdict visuel : aucune action principale rognée, aucun débordement horizontal destructif observé ; glassmorphisme conservé et hiérarchie contexte/sécurité regroupée.\n\n### Constats historiques désormais corrigés côté engineering\nLes sections plus haut décrivent la baseline auditée au moment de l'audit. Elles restent utiles comme historique, mais ne doivent plus être lues comme l'état courant pour : safety non branchée, dirty-state absent, fallback de forme implicite, UX rapide, protocoles/référentiel et preview responsive. Les preuves R1→R7 et PR #43 font foi pour l'état engineering actuel.\n\n### Gates toujours ouverts\n- **INTERACTION AUTHENTIFIÉE APPLICATION LOCALE : non certifiée.** Le harness rend les vrais composants mais n'est pas une session cabinet authentifiée.\n- **CERTIFICATION CLINIQUE/PHARMACOLOGIQUE : non certifiée.** Revue qualifiée distincte requise.\n- CI push exacte du merge `{merge_sha}` : run `{merge_ci}` — à vérifier avant closeout documentaire final.\n'''
          if '## Addendum de recertification P1 — 2026-08-15' not in text:
              text = text.rstrip() + appendix
          p.write_text(text, encoding='utf-8')
          PY

          rm -f .github/workflows/p1-canonical-closeout-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ROADMAP_ORDONNANCE_P1.md DOCUMENT_STUDIO_ROADMAP.md docs/audits/DOCUMENT_STUDIO_P1_ORDONNANCE_AUDIT.md .github/workflows/p1-canonical-closeout-once.yml
          git commit -m "docs(p1): close out visual runtime certification"
          git push origin HEAD:work-20260815-p1-canonical-closeout
