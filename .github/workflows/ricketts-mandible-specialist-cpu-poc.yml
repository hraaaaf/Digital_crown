name: Ricketts Mandible Specialist CPU POC

on:
  pull_request:
    paths:
      - 'backend/scripts/train_ricketts_mandible_specialist.py'
      - 'backend/tests/test_ricketts_mandible_specialist_poc.py'
      - 'docs/audits/RICKETTS_MANDIBLE_SPECIALIST_V1_CPU_POC.md'
      - 'docs/audits/schemas/ricketts_mandible_specialist_dataset_v1.schema.json'
      - '.github/workflows/ricketts-mandible-specialist-cpu-poc.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'smoke is synthetic/non-clinical; real remains fail-closed until a reviewed dataset source exists'
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - real

jobs:
  cpu-poc:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'smoke' }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install minimal CPU training dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy==2.4.3" "onnx==1.21.0" "onnxruntime==1.25.0"
          python -m pip install "torch==2.10.0" --index-url https://download.pytorch.org/whl/cpu

      - name: Compile POC training entrypoint
        run: python -m py_compile backend/scripts/train_ricketts_mandible_specialist.py

      - name: Reject unconfigured clinical training
        if: env.MODE == 'real'
        working-directory: backend
        run: |
          python scripts/train_ricketts_mandible_specialist.py \
            --mode real \
            --dataset-root ../datasets/ricketts-mandible-specialist-v1

      - name: Execute deterministic synthetic CPU smoke training
        if: env.MODE == 'smoke'
        working-directory: backend
        run: |
          python scripts/train_ricketts_mandible_specialist.py \
            --mode smoke \
            --epochs 8 \
            --seed 20261005 \
            --out ../artifacts/ricketts-mandible-specialist
          cat ../artifacts/ricketts-mandible-specialist/metrics.json

      - name: Verify non-clinical artifact contract
        if: env.MODE == 'smoke'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("artifacts/ricketts-mandible-specialist")
          metrics = json.loads((root / "metrics.json").read_text(encoding="utf-8"))
          assert metrics["model_id"] == "RICKETTS_MANDIBLE_SPECIALIST_V1"
          assert metrics["clinical_status"] == "NON_CLINICAL_SMOKE_ONLY"
          assert metrics["landmark_order"] == [
              "R1_Ricketts", "R2_Ricketts", "R3_Ricketts",
              "R4_Ricketts", "Pm_Ricketts", "DC_Ricketts",
          ]
          assert metrics["final_train_loss"] < metrics["initial_train_loss"]
          assert metrics["onnx_max_abs_delta"] <= 1e-4
          assert len(metrics["onnx_sha256"]) == 64
          assert (root / "ricketts_mandible_specialist_smoke.onnx").stat().st_size > 0
          assert (root / "README.txt").read_text(encoding="utf-8").startswith("NON-CLINICAL")
          print("RICKETTS_MANDIBLE_SPECIALIST_CPU_POC_OK")
          PY

      - name: Upload non-clinical smoke evidence
        if: env.MODE == 'smoke'
        uses: actions/upload-artifact@v4
        with:
          name: ricketts-mandible-specialist-cpu-poc-${{ github.sha }}
          path: artifacts/ricketts-mandible-specialist/
          if-no-files-found: error
          retention-days: 30
