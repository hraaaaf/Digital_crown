name: Patient P0-E Transaction Cert

on:
  push:
    branches:
      - agent/patient-page-p0-rescue
    paths:
      - '.github/workflows/patient-p0e-transaction-cert.yml'
      - 'backend/routers/accounting.py'
      - 'backend/routers/installments.py'
      - 'backend/models.py'
      - 'backend/schemas/installments.py'
      - 'backend/schemas/payments.py'
      - 'backend/tests/test_patient_p0_payment_binding.py'
      - 'backend/tests/test_patient_p0_installment_acte_link.py'
      - 'alembic/versions/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: patient-p0e-transaction-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ENVIRONMENT: test
      SECRET_KEY: patient-p0e-transaction-cert-secret-000001
      DATABASE_URL: sqlite:///:memory:
      TELEMETRY_ENABLED: 'false'
      CLOUD_AI_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.12.0 torchvision==0.27.0 --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^(torch|torchvision)([<=>].*)?$' requirements.txt > /tmp/requirements-p0e.txt
          pip install -r /tmp/requirements-p0e.txt
          pip install httpx==0.27.2 pytest pytest-asyncio
      - name: Run P0-E transaction tests
        run: |
          python -m pytest \
            backend/tests/test_patient_p0_payment_binding.py \
            backend/tests/test_patient_p0_installment_acte_link.py \
            -q --maxfail=1
      - name: Alembic single head
        run: |
          python -m alembic heads | tee /tmp/heads.txt
          test "$(grep -c '(head)' /tmp/heads.txt)" -eq 1
      - name: Write proof
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          proof = {
            'status': 'CERTIFIED',
            'tested_sha': os.environ['GITHUB_SHA'],
            'run_id': os.environ['GITHUB_RUN_ID'],
            'payment_binding_tests': 4,
            'installment_acte_link_tests': 4,
            'alembic_single_head': True,
          }
          Path('docs/PATIENT_P0E_TRANSACTION_CERT.json').write_text(json.dumps(proof, indent=2) + '\n')
          PY
      - name: Commit proof
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/PATIENT_P0E_TRANSACTION_CERT.json
          git commit -m 'test(patient): certify P0-E transactions' || exit 0
          git push origin HEAD:${GITHUB_REF_NAME}
