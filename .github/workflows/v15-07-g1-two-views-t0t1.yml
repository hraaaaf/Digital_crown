name: V1.5-07 G1 Two real Cabinet views T0-T1 (isolated T2)

on:
  push:
    branches:
      - feat/v15-07-g1-two-views-t0t1-20261015
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v15-07-g1-split-${{ github.ref }}
  cancel-in-progress: true

jobs:
  authenticated-media-pilot:
    name: Actual Dossier + Media / T0-T1 opt-in / isolated T2
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      SOURCE_HEAD: ${{ github.sha }}
      VITE_V15_07_G1_MEDIA_FRAME_PILOT: '1'
      VITE_V15_07_G1_TWO_VIEWS_PILOT: '1'
      ENVIRONMENT: test
      DIGITALCROWN_ISOLATED_RUNTIME: "1"
      DATABASE_URL: sqlite:///./t2-runtime-cert.db
      TELEMETRY_ENABLED: "false"
      CLOUD_AI_ENABLED: "false"
      DEBUG: "false"
      ALLOWED_ORIGINS: "http://127.0.0.1:5173,http://localhost:5173"
      T2_USER: t2-browser@cabinet.ma
    steps:
      - name: Checkout exact candidate product commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_HEAD }}
      - name: Attest exact immutable source
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"
          test "$ENVIRONMENT" = test
          test "$DIGITALCROWN_ISOLATED_RUNTIME" = 1
          test "$DATABASE_URL" = sqlite:///./t2-runtime-cert.db
          echo "PRODUCT_SHA=$SOURCE_HEAD" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Isolated synthetic T2 password
        shell: bash
        run: |
          password="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          echo "::add-mask::$password"
          echo "T2_PASSWORD=$password" >> "$GITHUB_ENV"
      - name: Install server dependencies for disposable fixture DB
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install torch==2.10.0 torchvision==0.25.0 torchaudio==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^(torch|torchvision|torchaudio)([<=>].*)?$' requirements.txt >/tmp/v15-07-g1-req.txt
          pip install -r /tmp/v15-07-g1-req.txt
      - name: Install real frontend and Chromium (Playwright isolated from product npm graph)
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          mkdir -p /tmp/v15-07-g1-playwright
          npm install --prefix /tmp/v15-07-g1-playwright --no-save --ignore-scripts --no-audit --no-fund playwright@1.55.0
          test -d /tmp/v15-07-g1-playwright/node_modules/playwright
          test -d /tmp/v15-07-g1-playwright/node_modules/playwright-core
          ln -s /tmp/v15-07-g1-playwright/node_modules/playwright node_modules/playwright
          /tmp/v15-07-g1-playwright/node_modules/.bin/playwright install --with-deps chromium
      - name: Attest disposable test database target (do not bypass boot policy)
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_ENV"
          import os
          from backend.core.runtime_safety import database_target_fingerprint, is_known_cabinet_database
          target = "sqlite:///./t2-runtime-cert.db"
          assert os.environ["ENVIRONMENT"] == "test"
          assert os.environ["DIGITALCROWN_ISOLATED_RUNTIME"] == "1"
          assert os.environ["DATABASE_URL"] == target
          assert not is_known_cabinet_database(target), "Never start on known clinic data"
          print("DIGITALCROWN_ISOLATION_DB_FINGERPRINT=" + database_target_fingerprint(target))
          PY
      - name: Start isolated FastAPI fixture runtime
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DIGITALCROWN_ISOLATION_DB_FINGERPRINT:-}"
          test "$DATABASE_URL" = "sqlite:///./t2-runtime-cert.db"
          rm -f t2-runtime-cert.db
          python scripts/t2_runtime_server.py >/tmp/v15-07-g1-backend.log 2>&1 &
          backend_pid=$!
          for i in {1..100}; do
            if ! kill -0 "$backend_pid" 2>/dev/null; then
              echo "Isolated backend process exited before /health"
              tail -100 /tmp/v15-07-g1-backend.log
              exit 1
            fi
            if curl -fsS http://127.0.0.1:8005/health >/dev/null; then exit 0; fi
            sleep 1
          done
          tail -100 /tmp/v15-07-g1-backend.log
          exit 1
      - name: Start actual pilot frontend with opt-in
        working-directory: frontend
        shell: bash
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 >/tmp/v15-07-g1-frontend.log 2>&1 &
          for i in {1..100}; do
            if curl -fsS http://127.0.0.1:5173 >/dev/null; then exit 0; fi
            sleep 1
          done
          tail -80 /tmp/v15-07-g1-frontend.log
          exit 1
      - name: Test Desktop-only pilot and unchanged media module in Vitest
        working-directory: frontend
        run: npx vitest run src/features/multiview/CabinetMediaViewPilot.test.tsx src/features/multiview/CabinetTwoViewsPilot.test.tsx
      - name: Materialize ephemeral browser evidence script (not product code)
        working-directory: frontend
        shell: bash
        run: |
          cat > scripts/v15-07-g1-two-views-t0t1.mjs <<'EVIDENCE'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          import { chromium, request } from 'playwright';

          const out = path.resolve('../artifacts/v15-07-g1-two-views-t0t1');
          fs.mkdirSync(out, { recursive: true });
          const sourceHead = process.env.SOURCE_HEAD;
          const user = process.env.T2_USER;
          const password = process.env.T2_PASSWORD;
          if (!sourceHead || !user || !password) throw Error('Missing isolated G1 identity');
          const api = await request.newContext({ baseURL: 'http://127.0.0.1:8005' });
          const login = await api.post('/api/auth/login', { form: { username:user, password } });
          if (!login.ok()) throw Error('Disposable T2 authentication failed HTTP ' + login.status());
          const tokens = await login.json();
          const headers = { Authorization: 'Bearer ' + tokens.access_token };
          const response = await api.get('/api/patients/', { headers });
          if (!response.ok()) throw Error('Cannot read isolated fixture patients HTTP ' + response.status());
          const rows = await response.json();
          const patient = rows.find(x => x.numero_dossier === 'T2-0001') || rows[0];
          if (!patient) throw Error('No isolated T2 patient fixture');
          const fixturePatientName = [patient.nom, patient.prenom].map(x => String(x || '').trim()).filter(Boolean).join(' ');
          if (!fixturePatientName) throw Error('T2 fixture has no displayable patient name');
          // Seed genuine authenticated MEDIA API rows on disposable T2 patient only.
          // These are flat synthetic PNG fixtures (not clinical images), via the
          // existing certified C5 import contract; no mock HTTP handlers.
          const png = Buffer.from('iVBORw0KGgoAAAANSUhEUgAAAEAAAABACAIAAAAlC+aJAAAAY0lEQVR4nO3PQQ3AIADAQEANmpCD8ongcVnSU9DOfe74s6UDXjWgNaA1oDWgNaA1oDWgNaA1oDWgNaA1oDWgNaA1oDWgNaA1oDWgNaA1oDWgNaA1oDWgNaA1oDWgNaA1oDWgfUJxAYTIfIvQAAAAAElFTkSuQmCC','base64');
          for (const point of ['T0','T1','T2']) {
            const uploaded = await api.post('/api/patients/' + patient.id + '/assets/import',{
              headers,multipart:{
                file:{name:'g1-fictif-'+point.toLowerCase()+'.png',mimeType:'image/png',buffer:png},
                asset_type:'PHOTO',source_kind:'UPLOAD',timepoint:point
              }
            });
            if(!uploaded.ok())throw Error('Synthetic T2 '+point+' MEDIA API import rejected: HTTP '+uploaded.status()+' '+(await uploaded.text()).slice(0,500));
          }

          const screens = [
            {key:'dashboard',path:'/dashboard'},
            {key:'agenda',path:'/agenda'},
            {key:'dossier',path:'/patients/' + patient.id},
            {key:'imagerie',path:'/patients/' + patient.id,imaging:true},
          ];
          const sizes = [
            {key:'desktop1280',width:1280,height:900},
            {key:'desktop1440',width:1440,height:900},
            {key:'desktop1920',width:1920,height:1080},
            {key:'desktop2560',width:2560,height:1080},
            {key:'cssZoom200Proxy',width:1280,height:900,cssZoom:2},
            {key:'mobile390Regression',width:390,height:844},
            {key:'mobile430Regression',width:430,height:932},
            {key:'tablet768Regression',width:768,height:1024},
          ];
          const evidence = [];
          const desktopQA = [];
          const browser = await chromium.launch({headless:true});
          try {
            for (const size of sizes) {
              const context = await browser.newContext({viewport:{width:size.width,height:size.height},locale:'fr-FR',colorScheme:'light'});
              for (const screen of screens) {
                const page = await context.newPage();
                const errors=[], http5xx=[];
                page.on('pageerror',err=>errors.push(String(err).slice(0,350)));
                page.on('response',res=>{if(res.status()>=500)http5xx.push({status:res.status(),path:new URL(res.url()).pathname});});
                let failure=null, actualUrl=null, dom=null, screenshot=null, hash=null, patientReadyMs=null;
                try {
                  await page.addInitScript(({access,refresh})=>{
                    localStorage.setItem('token',access);
                    localStorage.setItem('refresh_token',refresh||'');
                    localStorage.setItem('appMode','prod');
                  },{access:tokens.access_token,refresh:tokens.refresh_token});
                  const navigationStartedAt = Date.now();
                  await page.goto('http://127.0.0.1:5173'+screen.path,{waitUntil:'domcontentloaded',timeout:90000});
                  await page.locator('main').first().waitFor({state:'visible',timeout:30000});
                  if(screen.key === 'dossier' || screen.imaging){
                    // Lazy-loaded patient dossier: visible <main> may still be an empty splash.
                    // Wait for the real, uniquely identified fictitious patient header before assessing content.
                    await page.locator('main').getByText(fixturePatientName,{exact:false})
                      .first().waitFor({state:'visible',timeout:60000});
                    patientReadyMs = Date.now() - navigationStartedAt;
                  }
                  if(screen.imaging){
                    await page.getByRole('button',{name:'Imagerie',exact:true}).click({timeout:20000});
                    await page.getByRole('button',{name:'Médiathèque',exact:true}).click({timeout:20000});
                    await page.getByText('Médiathèque clinique',{exact:true}).first().waitFor({state:'visible',timeout:20000});
                    await page.locator('[data-testid="patient-media-timeline"]').first().waitFor({state:'visible',timeout:30000});
                    // This exact authenticated patient route owns the data and RBAC.
                    // An isolated opt-in exposes two real modules; no second patient route.
                    const expectedSplit = size.width >= 1280;
                    const splitCount = await page.locator('[data-v15-07-two-views]').count();
                    const paneCount = await page.locator('[data-v15-07-theme-slot]').count();
                    if(splitCount !== Number(expectedSplit) || paneCount !== (expectedSplit ? 2 : 0))
                      throw Error('G1 true split mismatch ' + JSON.stringify({expectedSplit,splitCount,paneCount,width:size.width}));
                    if (await page.locator('[data-testid="patient-media-timeline"]').count() !== 1)
                      throw Error('Existing real media module should be mounted exactly once');
                    if(expectedSplit) {
                      const summary = page.locator('[data-v15-07-real-dossier]');
                      await summary.waitFor({state:'visible',timeout:25000});
                      if(!(await summary.innerText()).includes(patient.numero_dossier))
                        throw Error('Dossier pane did not use the authenticated active patient');
                      if((await summary.innerText()).includes('T00:00:00'))
                        throw Error('Raw ISO timestamp is exposed in the patient dossier');
                      if(await page.getByText('Médiathèque clinique',{exact:true}).count() !== 1)
                        throw Error('Duplicated or missing clinical media heading in the split view');
                      // The media toolbar must adapt to the CONTAINER width.
                      // A responsive layout based only on the browser breakpoint
                      // can overflow when placed inside a half-width ViewSlot.
                      const paneBox=await page.locator('[data-v15-07-second-pane]').boundingBox();
                      const filtersBox=await page.locator('[data-v15-07-second-pane] [aria-label="Recherche et filtres médias"]').boundingBox();
                      if (!paneBox || !filtersBox || filtersBox.x + filtersBox.width > paneBox.x + paneBox.width + 2)
                        throw Error('Medical media toolbar clipped in half-width pane');
                      const splitter = page.getByRole('separator',{name:'Redimensionner les vues'});
                      if(!(await splitter.isVisible())) throw Error('Keyboard and pointer resize separator missing');
                      if(size.key === 'desktop1440') {
                        // Two-pane BEFORE interactions on the actual authenticated React UI.
                        const stableTop=async()=>{
                          // The Cabinet shell can scroll inside an overflow:auto
                          // ancestor while window.scrollY remains zero.
                          await page.evaluate(()=>{
                            const h=document.querySelector('.v15-g1-opaque-patient-header');
                            for(let n=h?.parentElement;n;n=n.parentElement){
                              if(n.scrollTop>0)n.scrollTop=0;
                            }
                            if(document.scrollingElement)document.scrollingElement.scrollTop=0;
                          });
                          await page.waitForTimeout(400);
                        };
                        await stableTop();
                        await page.screenshot({path:path.join(out,'imagerie-deux-vues-initial-desktop1440.png'),fullPage:false});
                        const scrollQA=await page.evaluate(()=>{
                          const h=document.querySelector('.v15-g1-opaque-patient-header');
                          if(!(h instanceof HTMLElement))return {pass:false,reason:'header missing'};
                          const candidates=[];
                          for(let n=h.parentElement;n;n=n.parentElement){
                            const style=getComputedStyle(n);
                            if(/auto|scroll/.test(style.overflowY) && n.scrollHeight-n.clientHeight>=100)candidates.push(n);
                          }
                          const root=document.scrollingElement;
                          if(root&&root.scrollHeight-root.clientHeight>=100&&!candidates.includes(root))candidates.push(root);
                          const target=candidates[0];
                          if(!target)return {pass:false,reason:'no scrollable page ancestor'};
                          target.scrollTop=Math.min(160,target.scrollHeight-target.clientHeight);
                          return {pass:target.scrollTop>=80,actualScrollTop:target.scrollTop,scrollHost:target.tagName,
                            candidateCount:candidates.length};
                        });
                        await page.waitForTimeout(250);
                        const stickyQA=await page.evaluate(()=>{
                          const el=document.querySelector('.v15-g1-opaque-patient-header');
                          if(!(el instanceof HTMLElement))return {pass:false,reason:'G1 header missing'};
                          const style=getComputedStyle(el);
                          const canvas=document.createElement('canvas');canvas.width=canvas.height=1;
                          const ctx=canvas.getContext('2d',{willReadFrequently:true});
                          if(!ctx)return {pass:false,reason:'canvas not available'};
                          ctx.fillStyle=style.backgroundColor;ctx.fillRect(0,0,1,1);
                          const alpha=ctx.getImageData(0,0,1,1).data[3];
                          return {pass:style.position==='sticky'&&alpha>=254,position:style.position,alpha,windowScrollY:scrollY};
                        });
                        const stickyProof={pass:scrollQA.pass&&stickyQA.pass,scroll:scrollQA,header:stickyQA};
                        desktopQA.push({check:'desktop sticky header is opaque during REAL scroll',...stickyProof});
                        if(!stickyProof.pass)throw Error('G1 actual scroll/opaque header proof failed: '+JSON.stringify(stickyProof));
                        await page.screenshot({path:path.join(out,'imagerie-entete-scroll-desktop1440.png'),fullPage:false});
                        await stableTop();
                        await splitter.focus();
                        await page.keyboard.press('ArrowRight');
                        if((await splitter.getAttribute('aria-valuenow')) !== '50')
                          throw Error('Keyboard resize did not update the panel ratio');
                        await page.getByRole('button',{name:'Échanger les vues',exact:true}).click();
                        const swapped = await page.locator('[data-v15-07-split-container]').evaluate(el=>getComputedStyle(el).flexDirection);
                        if(swapped !== 'row-reverse') throw Error('Pane swap failed');
                        await stableTop();
                        await page.screenshot({path:path.join(out,'imagerie-deux-vues-echangees-desktop1440.png'),fullPage:false});
                        await page.getByRole('button',{name:'Réinitialiser',exact:true}).click();
                        const select=page.getByRole('combobox',{name:'Contenu du premier panneau'});
                        if(await select.locator('option[value="suivi"]').count()) {
                          await select.selectOption('suivi');
                          await page.getByRole('region',{name:'Suivi orthodontique T0 / T1'}).waitFor({state:'visible'});
                          await stableTop();
                          await page.screenshot({path:path.join(out,'imagerie-suivi-T0-T1-desktop1440.png'),fullPage:false});
                          await select.selectOption('dossier');
                          await summary.waitFor({state:'visible'});
                        }
                        // Two genuine server-backed PHOTO assets from the synthetic T2
                        // fixture: select exactly T0 and T1, not just two arbitrary rows.
                        const mediaRail = page.locator('[data-testid="media-asset-rail"]');
                        await mediaRail.locator('section[aria-label="Temps T0"]').getByRole('button',{name:'Ajouter à la comparaison'}).first().click();
                        await mediaRail.locator('section[aria-label="Temps T1"]').getByRole('button',{name:'Ajouter à la comparaison'}).first().click();
                        const comparison = page.locator('[data-testid="media-compare-panel"]');
                        await comparison.waitFor({state:'visible',timeout:25000});
                        const pair=await comparison.getByRole('heading').first().innerText();
                        if(!(pair.includes('T0')&&pair.includes('T1')))throw Error('API-backed T0/T1 photo comparison missing '+pair);
                        await comparison.scrollIntoViewIfNeeded();
                        await page.screenshot({path:path.join(out,'imagerie-photos-T0-T1-vraies-api-desktop1440.png'),fullPage:false});
                        await page.getByRole('button',{name:'Fermer la comparaison'}).click();
                        // CSS theme rerender proof in the REAL authenticated Cabinet media route.
                        const frame=page.locator('[data-v15-07-theme-slot]').first();
                        const lightBg=await frame.evaluate(el=>getComputedStyle(el).backgroundColor);
                        await page.evaluate(() => {
                          document.documentElement.dataset.theme='prestige';
                          document.body.dataset.theme='prestige';
                        });
                        await page.waitForTimeout(650);
                        const darkBg=await frame.evaluate(el=>getComputedStyle(el).backgroundColor);
                        if(darkBg===lightBg) throw Error('Active theme did not recolor real dossier frame');
                        const contrastQA=await page.locator('[data-v15-07-two-views] p.text-primary').first().evaluate(el=>{
                          const canvas=document.createElement('canvas');canvas.width=canvas.height=1;
                          const ctx=canvas.getContext('2d',{willReadFrequently:true});
                          const rgb=v=>{ctx.clearRect(0,0,1,1);ctx.fillStyle=v;ctx.fillRect(0,0,1,1);return Array.from(ctx.getImageData(0,0,1,1).data).slice(0,3);};
                          const lum=a=>a.map(v=>{v/=255;return v<=0.04045?v/12.92:Math.pow((v+0.055)/1.055,2.4);}).reduce((s,c,i)=>s+c*[0.2126,0.7152,0.0722][i],0);
                          const fg=getComputedStyle(el).color,bg=getComputedStyle(el).getPropertyValue('--card-bg').trim();
                          const contrast=(a,b)=>{const x=lum(rgb(a)),y=lum(rgb(b));return (Math.max(x,y)+0.05)/(Math.min(x,y)+0.05);};
                          const ratio=contrast(fg,bg);
                          const title=document.querySelector('.v15-g1-opaque-patient-header h1');
                          const titleFg=title?getComputedStyle(title).color:null;
                          const titleRatio=titleFg?contrast(titleFg,bg):0;
                          return {pass:ratio>=4.5&&titleRatio>=4.5,
                            ratio:+ratio.toFixed(2),titleRatio:+titleRatio.toFixed(2),fg,titleFg,bg};
                        });
                        desktopQA.push({check:'Prestige small media label WCAG AA contrast',...contrastQA});
                        if(!contrastQA.pass)throw Error('Prestige media contrast <4.5:1: '+JSON.stringify(contrastQA));
                        await stableTop();
                        await page.screenshot({path:path.join(out,'imagerie-deux-vues-sombre-desktop1440.png'),fullPage:false});
                        await page.evaluate(() => {
                          document.documentElement.dataset.theme='';
                          document.body.dataset.theme='';
                        });
                        await page.waitForTimeout(650);
                        // Chromium's native compositor/pinch scale, NOT Ctrl+Plus
                        // page zoom. Record this distinction in the proof.
                        const cdp=await context.newCDPSession(page);
                        try {
                          await cdp.send('Emulation.setPageScaleFactor',{pageScaleFactor:2});
                          await page.waitForTimeout(200);
                          const scale=await page.evaluate(()=>window.visualViewport?.scale||1);
                          desktopQA.push({check:'Chromium compositor scale 2 (not page zoom)',scale,pass:scale>=1.9});
                          if(scale<1.9)throw Error('Chromium compositor scaling failed: '+scale);
                          await page.screenshot({path:path.join(out,'imagerie-compositor-scale-200-NOT-pagezoom.png'),fullPage:false});
                        } finally {
                          await cdp.send('Emulation.setPageScaleFactor',{pageScaleFactor:1});
                          await cdp.detach();
                        }
                        // Browser 200% page zoom would halve effective CSS width;
                        // test that reflow independently, without claiming native zoom.
                        await page.setViewportSize({width:720,height:900});
                        await page.waitForTimeout(400);
                        const reflow=await page.evaluate(()=>({
                          split:document.querySelectorAll('[data-v15-07-two-views]').length,
                          media:document.querySelectorAll('[data-testid="patient-media-timeline"]').length,
                          overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+2,
                        }));
                        desktopQA.push({check:'720px layout proxy for 1440 at browser zoom 200%',...reflow,
                          pass:reflow.split===0&&reflow.media===1&&!reflow.overflow});
                        if(reflow.split!==0||reflow.media!==1||reflow.overflow)throw Error('G1 reflow fallback failed '+JSON.stringify(reflow));
                        await page.screenshot({path:path.join(out,'imagerie-reflow-proxy-200-NOT-native-zoom.png'),fullPage:false});
                        await page.setViewportSize({width:1440,height:900});
                      }
                    }
                  }
                  if(size.cssZoom) {
                    await page.evaluate(z=>{document.documentElement.style.zoom=String(z)},size.cssZoom);
                  }
                  await page.waitForTimeout(1250);
                  actualUrl=new URL(page.url()).pathname;
                  dom=await page.evaluate(()=>{
                    const main=document.querySelector('main');
                    return {title:document.title,heading:document.querySelector('main h1')?.textContent?.trim().slice(0,120)||null,
                      mainVisible:!!main&&main.getBoundingClientRect().height>0,
                      mainTextLength:(main?.innerText||'').trim().length,
                      viewportWidth:innerWidth,docScrollWidth:document.documentElement.scrollWidth,
                      horizontalOverflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+2,
                      visibleButtons:Array.from(document.querySelectorAll('main button')).filter(e=>e.getBoundingClientRect().width>0).length};
                  });
                  if(actualUrl!==screen.path||!dom.mainVisible||dom.mainTextLength<12)failure='route/visible-app validation: '+JSON.stringify({actualUrl,expected:screen.path,dom});
                  const name=screen.key+'-'+size.key+'.png';
                  screenshot=name;
                  const bytes=await page.screenshot({path:path.join(out,name),fullPage:false,timeout:30000});
                  hash=crypto.createHash('sha256').update(bytes).digest('hex');
                } catch(e){failure=String(e).slice(0,600); actualUrl=actualUrl||new URL(page.url()).pathname;}
                evidence.push({screen:screen.key,size:size.key,viewport:{width:size.width,height:size.height},
                  zoom:size.cssZoom?'CSS zoom proxy only, NOT browser 200%': '1x',
                  intendedPath:screen.path,actualUrl,dom,screenshot,sha256:hash,
                  pageErrors:errors,http5xx,failure,patientReadyMs});
                await page.close();
              }
              await context.close();
            }
          } finally {await browser.close(); await api.dispose();}
          const critical=evidence.filter(e=>e.failure||e.pageErrors.length||e.http5xx.length);
          const report={sourceHead,runnerHead:process.env.GITHUB_SHA,fixture:'isolated T2 only',desktopQA,
            authentication:'real API credentials with enrolled disposable workstation',
            method:'real Vite React UI + disposable FastAPI + Playwright chromium, no routes mocked',
            cssZoomWarning:'CSS zoom proxy does not prove actual browser zoom at 200%',
