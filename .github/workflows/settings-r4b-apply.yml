name: Settings R4B Heritage Finalizer

on:
  pull_request:
    paths:
      - ".github/workflows/settings-r4b-apply.yml"

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: settings-r4-document-studio
          fetch-depth: 0
      - name: Fix Heritage bilingual geometry
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('backend/services/premium_document_headers.py')
          text = path.read_text(encoding='utf-8')
          replacement = '''def draw_heritage(base, canvas, config, logo_path, p_color, s_color, a_color, p_width, p_height, fr_lines, ar_lines, h_scale):
    """L'Héritage: centered stationery, real serif identity, restrained double rule."""
    canvas.saveState()
    fs, ls, line_scale = _scale(base, config, h_scale)
    margin = 1.5 * cm
    center = p_width / 2
    logo_size = 1.08 * cm * ls
    if logo_path:
        _logo(base, canvas, config, logo_path, center - logo_size / 2, p_height - 1.38 * cm, logo_size)

    # Compact but non-overlapping stacked identity: 3 FR lines, then 2 AR lines.
    fr_y = p_height - 1.76 * cm
    _fr_block(
        base, canvas, fr_lines, center, fr_y, align="center",
        title_size=10.6 * fs, sub_size=6.7 * fs,
        font="Times-Roman", bold="Times-Bold", color=p_color, line_scale=line_scale * 0.82,
    )
    _ar_block(
        base, canvas, ar_lines, center, p_height - 2.64 * cm, align="center",
        title_size=8.2 * fs, sub_size=6.4 * fs, color=s_color, line_scale=line_scale * 0.82,
    )

    line_y = p_height - 3.22 * cm
    canvas.setStrokeColor(s_color)
    canvas.setLineWidth(0.35)
    canvas.line(margin, line_y, p_width - margin, line_y)
    canvas.setStrokeColor(a_color)
    canvas.setLineWidth(0.65)
    canvas.line(margin + 0.35 * cm, line_y - 0.11 * cm, p_width - margin - 0.35 * cm, line_y - 0.11 * cm)
    canvas.restoreState()
'''
          text, count = re.subn(r'^def draw_heritage\(.*\Z', replacement, text, count=1, flags=re.M | re.S)
          if count != 1:
              raise SystemExit(f'heritage replacement count={count}')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Verify syntax
        run: python -m py_compile backend/services/premium_document_headers.py
      - name: Self-remove and push finalization
        run: |
          git rm .github/workflows/settings-r4b-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/services/premium_document_headers.py
          git commit -m "settings: fix Heritage bilingual geometry and remove R4B applier"
          git push origin HEAD:settings-r4-document-studio
