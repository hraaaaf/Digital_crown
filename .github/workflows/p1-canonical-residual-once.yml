name: P1 Canonical Residual Once

on:
  push:
    branches:
      - work-20260815-p1-roadmap-coherence

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply residual canonical fix
        run: python scripts/p1_canonical_residual_fix.py
      - name: Commit canonical cleanup
        run: |
          rm -f scripts/p1_canonical_residual_fix.py .github/workflows/p1-canonical-residual-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ROADMAP_ORDONNANCE_P1.md DOCUMENT_STUDIO_ROADMAP.md docs/audits/DOCUMENT_STUDIO_P1_ORDONNANCE_AUDIT.md scripts/p1_canonical_residual_fix.py .github/workflows/p1-canonical-residual-once.yml
          git commit -m "docs(p1): finalize canonical coherence"
          git push origin HEAD:work-20260815-p1-roadmap-coherence
