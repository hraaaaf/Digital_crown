name: V1-07 Schema Open + Tooth Visual Proof

on:
  push:
    branches:
      - "cert/v1-07-schema-open-tooth-proof-20260926"
  workflow_dispatch:

concurrency:
  group: v1-07-schema-open-tooth-proof
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  visual-proof:
    name: Capture Devis and Honoraires odontogram states
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ENVIRONMENT: test
      SECRET_KEY: v1-07-schema-open-tooth-proof-secret-000001
      DATABASE_URL: sqlite:///./t2-runtime-cert.db
      DIGITALCROWN_ISOLATED_RUNTIME: "1"
      DIGITALCROWN_ISOLATION_DB_FINGERPRINT: "c04779c8d18b3ac12a0f4093a47a5d0c3c0e2251714be532893cfa052e9ee780"
      TELEMETRY_ENABLED: "false"
      CLOUD_AI_ENABLED: "false"
      DEBUG: "false"
      ALLOWED_ORIGINS: "http://127.0.0.1:5173,http://localhost:5173"

    steps:
      - name: Checkout exact proof branch
        uses: actions/checkout@v4

      - name: Record product parent
        run: |
          echo "proof_head=$(git rev-parse HEAD)"
          echo "product_parent=$(git rev-parse HEAD^)"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Generate isolated runtime credential
        shell: bash
        run: |
          echo "T2_USER=t2-browser@cabinet.ma" >> "$GITHUB_ENV"
          echo "T2_PASSWORD=$(python -c 'import secrets; print(secrets.token_urlsafe(32))')" >> "$GITHUB_ENV"

      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.12.0 torchvision==0.27.0 --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^(torch|torchvision)([<=>].*)?$' requirements.txt > /tmp/requirements-schema-proof.txt
          pip install -r /tmp/requirements-schema-proof.txt
          pip install httpx==0.27.2 pytest

      - name: Install frontend + Chromium
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Build exact frontend
        working-directory: frontend
        run: npm run build

      - name: Start isolated backend
        run: |
          rm -f t2-runtime-cert.db
          python scripts/t2_runtime_server.py > /tmp/schema-proof-backend.log 2>&1 &
          for i in {1..90}; do
            if curl -fsS http://127.0.0.1:8005/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/schema-proof-backend.log
          exit 1

      - name: Start frontend
        working-directory: frontend
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 > /tmp/schema-proof-frontend.log 2>&1 &
          for i in {1..90}; do
            if curl -fsS http://127.0.0.1:5173 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/schema-proof-frontend.log
          exit 1

      - name: Capture schema open and selected tooth
        working-directory: frontend
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ../artifacts/v1-07-schema-open-tooth-proof
          node scripts/capture-v1-07-schema-open-tooth-proof.mjs 2>&1 | tee ../artifacts/v1-07-schema-open-tooth-proof/runner.log

      - name: Dump logs on failure
        if: failure()
        run: |
          echo "===== BACKEND ====="
          cat /tmp/schema-proof-backend.log || true
          echo "===== FRONTEND ====="
          cat /tmp/schema-proof-frontend.log || true

      - name: Upload visual proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v1-07-schema-open-tooth-proof
          path: artifacts/v1-07-schema-open-tooth-proof
          if-no-files-found: error
          retention-days: 14
