name: Mobile M6-B Prepare

on:
  push:
    branches:
      - "audit/mobile-m6-b-before-20260825"
    paths:
      - ".audit/mobile-m6b-apply.py"
      - ".github/workflows/mobile-m6-b-prepare.yml"

permissions:
  contents: write

# M6-B preparation is intentionally single-run: full patch -> targeted tests -> build -> one product commit.
jobs:
  prepare:
    name: Test then create single M6-B product commit
    runs-on: ubuntu-latest
    env:
      PRODUCT_BASE: 0a577f05f55a772a1b3f6d2980b18ef4e1a643fb
      PRODUCT_BRANCH: mobile/m6-b-document-scan
      SECRET_KEY: ci-only-secret-key-minimum-32-characters-long
      DATABASE_URL: "sqlite:///:memory:"
      ENVIRONMENT: development
      TELEMETRY_ENABLED: "false"
      CLOUD_AI_ENABLED: "false"
    steps:
      - name: Checkout frozen audit inputs
        uses: actions/checkout@v4
        with:
          path: audit

      - name: Checkout exact product baseline
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PRODUCT_BASE }}
          path: product
          fetch-depth: 0

      - name: Assert baseline and unused product branch
        run: |
          test "$(git -C product rev-parse HEAD)" = "$PRODUCT_BASE"
          if git -C product ls-remote --exit-code --heads origin "refs/heads/$PRODUCT_BRANCH" >/dev/null 2>&1; then
            echo "::error::Product branch already exists: $PRODUCT_BRANCH"
            exit 1
          fi

      - name: Materialize complete M6-B patch
        working-directory: product
        run: python ../audit/.audit/mobile-m6b-apply.py

      - name: Assert exact product scope
        working-directory: product
        run: |
          git add -N backend/tests/test_mobile_m6b_document_scan.py
          git diff --check
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' \
            backend/routers/mobile_resource_bridge.py \
            backend/tests/test_mobile_m6b_document_scan.py \
            frontend/src/features/mobile/Context/MobileContext.tsx | sort)"
          grep -q "resource-context-document-scan" backend/routers/mobile_resource_bridge.py
          grep -q "DocumentType.AUTRE" backend/routers/mobile_resource_bridge.py
          grep -q "_document_scan_pdf" backend/routers/mobile_resource_bridge.py
          grep -q "data-m6b-scan-action" frontend/src/features/mobile/Context/MobileContext.tsx
          grep -q "data-m6b-scan-sheet" frontend/src/features/mobile/Context/MobileContext.tsx
          ! grep -q "form.append('patient_id'" frontend/src/features/mobile/Context/MobileContext.tsx
          python -m py_compile backend/routers/mobile_resource_bridge.py backend/tests/test_mobile_m6b_document_scan.py

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend test dependencies
        working-directory: product
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.12.0 torchvision==0.27.0 --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^(torch|torchvision)([<=>].*)?$' requirements.txt > /tmp/requirements-m6b.txt
          pip install -r /tmp/requirements-m6b.txt
          pip install httpx==0.27.2 pytest pytest-asyncio

      - name: Run M6-B and M6-A backend tests
        working-directory: product
        run: |
          python -m pytest \
            backend/tests/test_mobile_m6b_document_scan.py \
            backend/tests/test_mobile_m6a_clinical_photo.py \
            -q

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: product/frontend/package-lock.json

      - name: Install frontend
        working-directory: product/frontend
        run: npm ci

      - name: Build frontend
        working-directory: product/frontend
        run: npm run build

      - name: Create exactly one product commit
        working-directory: product
        run: |
          git config user.name "hraaaaf"
          git config user.email "123034021+hraaaaf@users.noreply.github.com"
          git add backend/routers/mobile_resource_bridge.py backend/tests/test_mobile_m6b_document_scan.py frontend/src/features/mobile/Context/MobileContext.tsx
          git diff --cached --check
          git commit -m "feat(mobile): add context-bound document scanning"
          test "$(git rev-list --count "$PRODUCT_BASE"..HEAD)" = "1"
          git push origin "HEAD:refs/heads/$PRODUCT_BRANCH"

      - name: Record proof
        working-directory: product
        run: |
          echo "PRODUCT_HEAD=$(git rev-parse HEAD)"
          echo "PRODUCT_BASE=$PRODUCT_BASE"
          echo "FILES=$(git diff --name-only "$PRODUCT_BASE"..HEAD | wc -l)"
