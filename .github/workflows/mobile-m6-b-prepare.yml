name: Mobile M6-B Prepare

on:
  push:
    branches:
      - audit/mobile-m6-b-before-20260825
    paths:
      - '.audit/mobile-m6b-apply.py'
      - '.github/workflows/mobile-m6-b-prepare.yml'

permissions:
  contents: write

jobs:
  prepare:
    name: Test then create single M6-B product commit
    runs-on: ubuntu-latest
    env:
      PRODUCT_BASE: 0a577f05f55a772a1b3f6d2980b18ef4e1a643fb
      PRODUCT_BRANCH: mobile/m6-b-document-scan
      SECRET_KEY: ci-only-secret-key-minimum-32-characters-long
      DATABASE_URL: sqlite:///:memory:
      ENVIRONMENT: development
      TELEMETRY_ENABLED: 'false'
      CLOUD_AI_ENABLED: 'false'
    steps:
      - name: Checkout frozen audit inputs
        uses: actions/checkout@v4
        with:
          path: audit

      - name: Checkout exact product baseline
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PRODUCT_BASE }}
          path: product
          fetch-depth: 1

      - name: Assert baseline and unused product branch
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_BASE"
          if git ls-remote --exit-code --heads origin "$PRODUCT_BRANCH" >/dev/null 2>&1; then
            echo "Product branch already exists: $PRODUCT_BRANCH" >&2
            exit 1
          fi

      - name: Materialize complete M6-B patch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p product/.audit
          cp audit/.audit/mobile-m6b-apply.py product/.audit/mobile-m6b-apply.py
          cd product
          python .audit/mobile-m6b-apply.py
          rm .audit/mobile-m6b-apply.py

      - name: Assert exact product scope
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          ACTUAL="$(git status --short | sed -E 's/^.. //' | sort)"
          EXPECTED="$(printf '%s\n' \
            'backend/routers/mobile_resource_bridge.py' \
            'backend/tests/test_mobile_m6b_document_scan.py' \
            'frontend/src/features/mobile/Context/MobileContext.tsx' | sort)"
          test "$ACTUAL" = "$EXPECTED" || { echo "Unexpected scope:"; printf '%s\n' "$ACTUAL"; exit 1; }
          python -m py_compile backend/routers/mobile_resource_bridge.py backend/tests/test_mobile_m6b_document_scan.py

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend test dependencies
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install torch==2.12.0 torchvision==0.27.0 --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^(torch|torchvision)([<=>].*)?$' requirements.txt > /tmp/requirements-m6b.txt
          pip install -r /tmp/requirements-m6b.txt
          pip install httpx==0.27.2 pytest pytest-asyncio

      - name: Run M6-B and M6-A backend tests
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest \
            backend/tests/test_mobile_m6b_document_scan.py \
            backend/tests/test_mobile_m6a_clinical_photo.py \
            -q

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: product/frontend/package-lock.json

      - name: Install frontend
        working-directory: product/frontend
        run: npm ci

      - name: Build frontend
        working-directory: product/frontend
        run: npm run build

      - name: Create exactly one product commit
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'hraaaaf'
          git config user.email '123034021+hraaaaf@users.noreply.github.com'
          git checkout -b "$PRODUCT_BRANCH"
          git add -- \
            backend/routers/mobile_resource_bridge.py \
            backend/tests/test_mobile_m6b_document_scan.py \
            frontend/src/features/mobile/Context/MobileContext.tsx
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          git commit -m 'feat(mobile): add context-bound document scanning'
          git push origin "HEAD:$PRODUCT_BRANCH"
          echo "PRODUCT_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Record proof
        shell: bash
        run: |
          printf 'M6-B product HEAD: %s\n' "$PRODUCT_HEAD"
          git -C product show --stat --oneline --decorate --no-renames HEAD
