name: Document History Actions Visual Certification

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - 'frontend/src/features/patients/PatientDocuments.tsx'
      - 'frontend/scripts/capture-document-history-actions.mjs'
      - '.github/workflows/document-history-actions-visual-cert.yml'

permissions:
  contents: read

jobs:
  visual-cert:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install frontend and Chromium
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save --package-lock=false --legacy-peer-deps playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Capture exact-head document actions
        working-directory: frontend
        env:
          PRODUCT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/capture-document-history-actions.mjs
      - name: Assert visual certificate
        working-directory: frontend
        run: |
          node - <<'JS'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('document-history-actions-artifacts/report.json', 'utf8'));
          if (report.invalidCount !== 0) throw new Error(`invalidCount=${report.invalidCount}`);
          if (report.blockedExternalRequests.length !== 0) throw new Error('external egress detected');
          if (report.captures.length !== 3) throw new Error(`captures=${report.captures.length}`);
          for (const capture of report.captures) {
            if (!capture.valid) throw new Error(`invalid viewport ${capture.viewport}`);
            if (capture.pageErrors.length || capture.consoleErrors.length) throw new Error(`runtime errors ${capture.viewport}`);
            if (capture.metrics.horizontalOverflow || capture.metrics.overlap !== 0 || !capture.metrics.menuWithinViewport) throw new Error(`layout failure ${capture.viewport}`);
            if (capture.metrics.edit.height < 44 || capture.metrics.trash.height < 44) throw new Error(`touch target failure ${capture.viewport}`);
          }
          console.log(JSON.stringify({ productHead: report.productHead, viewports: report.viewports, invalidCount: report.invalidCount }, null, 2));
          JS
      - name: Upload visual evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: document-history-actions-exact-head
          path: frontend/document-history-actions-artifacts
          if-no-files-found: error
          retention-days: 14
