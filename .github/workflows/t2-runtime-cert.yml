name: T2 Runtime Browser Certification

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: t2-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-cert:
    name: T2 Browser Runtime Matrix
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ENVIRONMENT: test
      SECRET_KEY: t2-runtime-certification-secret-key-000001
      DATABASE_URL: sqlite:///./t2-runtime-cert.db
      DIGITALCROWN_ISOLATED_RUNTIME: "1"
      DIGITALCROWN_ISOLATION_DB_FINGERPRINT: "c04779c8d18b3ac12a0f4093a47a5d0c3c0e2251714be532893cfa052e9ee780"
      TELEMETRY_ENABLED: "false"
      CLOUD_AI_ENABLED: "false"
      DEBUG: "false"
      ALLOWED_ORIGINS: "http://127.0.0.1:5173,http://localhost:5173"
      T2_USER: t2-browser@cabinet.ma
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Generate isolated runtime credential
        shell: bash
        run: python -c 'import secrets; print("T2_PASSWORD=" + secrets.token_urlsafe(24))' >> "$GITHUB_ENV"

      - name: Align legacy output probe with runtime credential
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          legacy = ''.join(['T2', 'Browser', 'Pass', '123', '!'])
          current = os.environ['T2_PASSWORD']
          path = Path('frontend/scripts/certify-document-studio-output.mjs')
          text = path.read_text(encoding='utf-8')
          if legacy not in text:
              raise SystemExit(f'legacy credential marker missing in {path}')
          path.write_text(text.replace(legacy, current), encoding='utf-8')
          PY

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.10.0 torchvision==0.25.0 torchaudio==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^(torch|torchvision|torchaudio)([<=>].*)?$' requirements.txt > /tmp/requirements-t2-runtime.txt
          pip install -r /tmp/requirements-t2-runtime.txt
          python -m pip check

      - name: Install frontend and Chromium
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save playwright@1.55.0
          npx playwright install chromium

      - name: Start isolated backend
        run: |
          python scripts/t2_runtime_server.py > /tmp/t2-backend.log 2>&1 &
          echo $! > /tmp/t2-backend.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8005/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/t2-backend.log
          exit 1

      - name: Seed T1 second isolated patient
        run: python scripts/t1_runtime_seed_patient_b.py

      - name: Certify strict runtime PDF
        run: python scripts/t2_runtime_pdf_probe.py

      - name: Certify P3 P4 P5 persisted reconciliation
        run: python scripts/t2_runtime_financial_probe.py

      - name: Start frontend
        working-directory: frontend
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 > /tmp/t2-frontend.log 2>&1 &
          echo $! > /tmp/t2-frontend.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:5173 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/t2-frontend.log
          exit 1

      - name: Execute authenticated browser matrix
        working-directory: frontend
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ../artifacts/t2-browser
          node scripts/certify-document-studio-browser.mjs 2>&1 | tee ../artifacts/t2-browser/runner.log

      - name: Certify T1 transversal runtime boundaries
        working-directory: frontend
        shell: bash
        run: |
          set -o pipefail
          node scripts/certify-t1-transversal.mjs 2>&1 | tee ../artifacts/t2-browser/t1-transversal-runner.log

      - name: Certify P6 Document Libre editor
        working-directory: frontend
        shell: bash
        run: |
          set -o pipefail
          node scripts/certify-p6-editor.mjs 2>&1 | tee ../artifacts/t2-browser/p6-editor-runner.log

      - name: Certify browser print and PDF freshness
        working-directory: frontend
        shell: bash
        run: |
          set -o pipefail
          node scripts/certify-document-studio-output.mjs 2>&1 | tee ../artifacts/t2-browser/output-runner.log

      - name: Certify G4 Ordonnance browser actions
        working-directory: frontend
        shell: bash
        run: |
          set -o pipefail
          node scripts/certify-v1-07-g4-ordonnance-actions.mjs 2>&1 | tee ../artifacts/t2-browser/g4-ordonnance-actions-runner.log

      - name: Certify G4 Honoraires browser actions
        working-directory: frontend
        shell: bash
        run: |
          set -o pipefail
          node scripts/certify-v1-07-g4-honoraires-actions.mjs 2>&1 | tee ../artifacts/t2-browser/g4-honoraires-actions-runner.log

      - name: Certify G4 remaining document actions
        working-directory: frontend
        shell: bash
        run: |
          set -o pipefail
          node scripts/certify-v1-07-g4-remaining-documents.mjs 2>&1 | tee ../artifacts/t2-browser/g4-remaining-documents-runner.log

      - name: Certify G4 Devis and History actions
        working-directory: frontend
        shell: bash
        run: |
          set -o pipefail
          node scripts/certify-v1-07-g4-devis-history.mjs 2>&1 | tee ../artifacts/t2-browser/g4-devis-history-runner.log

      - name: Inventory G4 dynamic controls
        working-directory: frontend
        shell: bash
        run: |
          set -o pipefail
          node scripts/inventory-v1-07-g4-dynamic-controls.mjs 2>&1 | tee ../artifacts/t2-browser/g4-dynamic-inventory-runner.log

      - name: Certify G4 Clinical browser actions
        working-directory: frontend
        shell: bash
        run: |
          set -o pipefail
          node scripts/certify-v1-07-g4-clinical-actions.mjs 2>&1 | tee ../artifacts/t2-browser/g4-clinical-actions-runner.log

      - name: Certify G4 Imaging media/tab browser actions
        working-directory: frontend
        shell: bash
        run: |
          set -o pipefail
          node scripts/certify-media-c4-browser.mjs 2>&1 | tee ../artifacts/t2-browser/g4-imaging-media-runner.log

      - name: Certify G4 Panoramic browser actions
        working-directory: frontend
        shell: bash
        run: |
          set -o pipefail
          node scripts/certify-v1-07-g4-panoramic-actions.mjs 2>&1 | tee ../artifacts/t2-browser/g4-panoramic-actions-runner.log

      - name: Certify G4 RVG browser actions
        working-directory: frontend
        shell: bash
        run: |
          set -o pipefail
          node scripts/certify-v1-07-g4-rvg-actions.mjs 2>&1 | tee ../artifacts/t2-browser/g4-rvg-actions-runner.log

      - name: Capture G4 truth-label BEFORE
        working-directory: frontend
        run: node scripts/capture-v1-07-g4-truth-labels-before.mjs

      - name: Capture G4 Panoramic trash BEFORE
        working-directory: frontend
        run: node scripts/capture-v1-07-g4-panoramic-trash-before.mjs

      - name: Certify G4 Panoramic browser actions
        working-directory: frontend
        run: node scripts/certify-v1-07-g4-panoramic-actions.mjs

      - name: Certify G4 Cephalo browser actions
        working-directory: frontend
        run: node scripts/certify-v1-07-g4-cephalo-actions.mjs

      - name: Certify G4 Finances browser actions
        working-directory: frontend
        shell: bash
        run: |
          set -o pipefail
          node scripts/certify-v1-07-g4-finances-actions.mjs 2>&1 | tee ../artifacts/t2-browser/g4-finances-actions-runner.log

      - name: Dump runtime logs on failure
        if: failure()
        run: |
          echo "===== BACKEND ====="
          cat /tmp/t2-backend.log || true
          echo "===== FRONTEND ====="
          cat /tmp/t2-frontend.log || true

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t2-browser-evidence
          path: artifacts/t2-browser
          if-no-files-found: warn
          retention-days: 14
