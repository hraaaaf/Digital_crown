name: T2 Runtime Browser Certification

on:
  pull_request:
    branches: [master]
    paths:
      - ".github/workflows/t2-runtime-cert.yml"
      - "backend/routers/auth.py"
      - "backend/routers/admin_legacy.py"
      - "backend/schemas/patient.py"
      - "backend/tests/test_admin_router.py"
      - "backend/tests/test_workstation_mode_v15.py"
      - "frontend/scripts/audit-first-user-experience.mjs"
      - "frontend/scripts/audit-first-user-experience-b.mjs"
      - "frontend/src/pages/Dashboard.tsx"
      - "frontend/src/features/dashboard/components/RecentActivity.tsx"
      - "frontend/src/features/dashboard/components/WaitingRoom.tsx"
      - "scripts/t2_runtime_server.py"
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull request number whose exact HEAD and changed files will be certified'
        required: true
        type: string
      expected_head:
        description: 'Exact 40-character PR HEAD SHA expected by the caller; stale or mismatched runs fail closed'
        required: true
        type: string
      fue_only:
        description: 'Run only FUE-A/FUE-B and skip the general browser matrix'
        required: false
        default: false
        type: boolean
      resume_from_23:
        description: 'Skip already-certified browser steps 14-22 and resume at G4 Devis/History'
        required: false
        default: false
        type: boolean
      resume_from_24:
        description: 'Skip already-certified browser steps 14-23 and resume at G4 dynamic inventory'
        required: false
        default: false
        type: boolean
      resume_from_27:
        description: 'Skip already-certified browser steps 14-26 and resume at G4 Panoramic'
        required: false
        default: false
        type: boolean
      resume_from_29:
        description: 'Skip already-certified browser steps 14-28 and resume at G4 truth-label BEFORE'
        required: false
        default: false
        type: boolean
      resume_from_31:
        description: 'Skip already-certified browser steps 14-30 and resume at G4 Cephalo'
        required: false
        default: false
        type: boolean
      resume_from_after:
        description: 'Skip already-certified browser steps 14-32 and run only G4 UI truth AFTER'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: t2-runtime-pr-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  scope:
    name: Scope T2 runtime
    runs-on: ubuntu-latest
    outputs:
      run_heavy: ${{ steps.scope.outputs.run_heavy }}
      pr_head_sha: ${{ steps.scope.outputs.pr_head_sha }}
    steps:
      - id: scope
        name: Classify T2 relevance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || inputs.pr_number }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || inputs.expected_head }}
        run: |
          set -euo pipefail

          if [[ ! "$PR" =~ ^[0-9]+$ ]]; then
            echo "::error::pr_number must be numeric"
            exit 1
          fi
          if [[ ! "$EXPECTED_HEAD" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::expected_head must be a full 40-character commit SHA"
            exit 1
          fi

          pr_state="$(gh api "repos/$REPO/pulls/$PR" --jq '.state')"
          pr_head_sha="$(gh api "repos/$REPO/pulls/$PR" --jq '.head.sha')"
          pr_head_repo="$(gh api "repos/$REPO/pulls/$PR" --jq '.head.repo.full_name')"
          pr_base_ref="$(gh api "repos/$REPO/pulls/$PR" --jq '.base.ref')"
          if [[ "$pr_state" != "open" ]]; then
            echo "::error::PR #$PR is not open"
            exit 1
          fi
          if [[ "$pr_head_repo" != "$REPO" ]]; then
            echo "::error::PR #$PR is not a same-repository PR"
            exit 1
          fi
          if [[ "$pr_base_ref" != "master" ]]; then
            echo "::error::PR #$PR targets $pr_base_ref instead of master"
            exit 1
          fi
          if [[ "${pr_head_sha,,}" != "${EXPECTED_HEAD,,}" ]]; then
            echo "::error::stale or mismatched HEAD: PR #$PR is $pr_head_sha, expected $EXPECTED_HEAD"
            exit 1
          fi
          echo "pr_head_sha=$pr_head_sha" >> "$GITHUB_OUTPUT"

          run_heavy=false
          while IFS= read -r file; do
            case "$file" in
              frontend/src/features/mobile/*|frontend/src/features/hub/*|frontend/src/services/stationPatientSession.ts|frontend/src/services/stationStaffAssistance.ts|frontend/src/test/v15StationPatientSessionContract.test.ts|frontend/scripts/capture-v15-03-*|docs/*|.github/workflows/ci.yml)
                ;;
              *)
                run_heavy=true
                break
                ;;
            esac
          done < <(gh api --paginate "repos/$REPO/pulls/$PR/files?per_page=100" --jq '.[].filename')
          echo "run_heavy=$run_heavy" >> "$GITHUB_OUTPUT"

  fue-audit:
    name: First User Experience Audit
    needs: scope
    if: github.event_name == 'pull_request' || inputs.fue_only == true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ENVIRONMENT: test
      SECRET_KEY: fue-runtime-audit-secret-key-000001
      DATABASE_URL: sqlite:///./t2-runtime-cert.db
      DIGITALCROWN_ISOLATED_RUNTIME: "1"
      DIGITALCROWN_ISOLATION_DB_FINGERPRINT: "c04779c8d18b3ac12a0f4093a47a5d0c3c0e2251714be532893cfa052e9ee780"
      TELEMETRY_ENABLED: "false"
      CLOUD_AI_ENABLED: "false"
      DEBUG: "false"
      ALLOWED_ORIGINS: "http://127.0.0.1:5173,http://localhost:5173"
      T2_USER: t2-browser@cabinet.ma
      PRODUCT_HEAD: ${{ needs.scope.outputs.pr_head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.scope.outputs.pr_head_sha }}
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: FUE harness syntax check
        run: |
          node --check frontend/scripts/audit-first-user-experience.mjs
          node --check frontend/scripts/audit-first-user-experience-b.mjs
      - name: Generate isolated runtime credential
        shell: bash
        run: |
          password="$(python -c 'import secrets; print(secrets.token_urlsafe(24))')"
          echo "::add-mask::$password"
          echo "T2_PASSWORD=$password" >> "$GITHUB_ENV"
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.10.0 torchvision==0.25.0 torchaudio==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^(torch|torchvision|torchaudio)([<=>].*)?$' requirements.txt > /tmp/requirements-fue-runtime.txt
          pip install -r /tmp/requirements-fue-runtime.txt
          python -m pip check
      - name: Certify setup-to-workstation handoff
        run: python -m pytest backend/tests/test_workstation_mode_v15.py -k clinic_init_status_remains_available_during_workstation_identity_handoff -q
      - name: Test cabinet identity response contract
        run: python -m pytest backend/tests/test_admin_router.py -k "get_cabinet_exposes_cabinet_name or update_cabinet_preserves_cabinet_name_in_response" -q
      - name: Install frontend and Chromium
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Test dashboard user context
        working-directory: frontend
        run: npm test -- src/features/dashboard/components/DashboardHeader.test.tsx
      - name: Start isolated backend
        run: |
          python scripts/t2_runtime_server.py > /tmp/fue-backend.log 2>&1 &
          echo $! > /tmp/fue-backend.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8005/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/fue-backend.log
          exit 1
      - name: Start frontend
        working-directory: frontend
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 > /tmp/fue-frontend.log 2>&1 &
          echo $! > /tmp/fue-frontend.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:5173 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/fue-frontend.log
          exit 1
      - name: Run First User Experience audit
        id: fue_a
        continue-on-error: true
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../artifacts/t2-browser
          node scripts/audit-first-user-experience.mjs 2>&1 | tee ../artifacts/t2-browser/fue-audit-runner.log
      - name: Run FUE-B existing-cabinet new-user audit
        id: fue_b
        if: always()
        continue-on-error: true
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          node scripts/audit-first-user-experience-b.mjs 2>&1 | tee ../artifacts/t2-browser/fue-b-audit-runner.log
      - name: Aggregate FUE audit result
        if: always()
        run: |
          if [ "${{ steps.fue_a.outcome }}" != "success" ] || [ "${{ steps.fue_b.outcome }}" != "success" ]; then
            echo "FUE-A outcome=${{ steps.fue_a.outcome }}"
            echo "FUE-B outcome=${{ steps.fue_b.outcome }}"
            exit 1
          fi
      - name: Dump FUE runtime logs on failure
        if: failure()
        run: |
          echo "===== BACKEND ====="
          cat /tmp/fue-backend.log || true
          echo "===== FRONTEND ====="
          cat /tmp/fue-frontend.log || true
      - name: Upload FUE evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: first-user-experience-evidence
          path: |
            artifacts/t2-browser/first-user-experience
            artifacts/t2-browser/first-user-experience-b
            artifacts/t2-browser/fue-audit-runner.log
            artifacts/t2-browser/fue-b-audit-runner.log
          if-no-files-found: error
          retention-days: 14

  browser-cert:
    name: T2 Browser Runtime Matrix
    needs: scope
    if: github.event_name == 'workflow_dispatch' && needs.scope.outputs.run_heavy == 'true' && inputs.fue_only != true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ENVIRONMENT: test
      SECRET_KEY: t2-runtime-certification-secret-key-000001
      DATABASE_URL: sqlite:///./t2-runtime-cert.db
      DIGITALCROWN_ISOLATED_RUNTIME: "1"
      DIGITALCROWN_ISOLATION_DB_FINGERPRINT: "c04779c8d18b3ac12a0f4093a47a5d0c3c0e2251714be532893cfa052e9ee780"
      TELEMETRY_ENABLED: "false"
      CLOUD_AI_ENABLED: "false"
      DEBUG: "false"
      ALLOWED_ORIGINS: "http://127.0.0.1:5173,http://localhost:5173"
      T2_USER: t2-browser@cabinet.ma
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.scope.outputs.pr_head_sha }}

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Generate isolated runtime credential
        shell: bash
        run: |
          password="$(python -c 'import secrets; print(secrets.token_urlsafe(24))')"
          echo "::add-mask::$password"
          echo "T2_PASSWORD=$password" >> "$GITHUB_ENV"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.10.0 torchvision==0.25.0 torchaudio==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^(torch|torchvision|torchaudio)([<=>].*)?$' requirements.txt > /tmp/requirements-t2-runtime.txt
          pip install -r /tmp/requirements-t2-runtime.txt
          python -m pip check

      - name: Certify G4 Panoramic backend contracts
        run: |
          pytest -q backend/tests/test_panoramic_report_fail_closed.py backend/tests/test_panoramic_pdf_fail_closed.py
          pytest -q backend/tests/test_ia_router.py -k panoramic

      - name: Install frontend and Chromium
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save playwright@1.55.0
          npx playwright install chromium

      - name: Start isolated backend
        run: |
          python scripts/t2_runtime_server.py > /tmp/t2-backend.log 2>&1 &
          echo $! > /tmp/t2-backend.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8005/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/t2-backend.log
          exit 1

      - name: Seed T1 second isolated patient
        run: python scripts/t1_runtime_seed_patient_b.py

      - name: Certify strict runtime PDF
        run: python scripts/t2_runtime_pdf_probe.py

      - name: Certify P3 P4 P5 persisted reconciliation
        run: python scripts/t2_runtime_financial_probe.py

      - name: Start frontend
        working-directory: frontend
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 > /tmp/t2-frontend.log 2>&1 &
          echo $! > /tmp/t2-frontend.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:5173 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/t2-frontend.log
          exit 1

      - name: Execute authenticated browser matrix
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.resume_from_23 != true && inputs.resume_from_24 != true && inputs.resume_from_27 != true && inputs.resume_from_29 != true && inputs.resume_from_31 != true && inputs.resume_from_after != true }}
        working-directory: frontend
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ../artifacts/t2-browser
          node scripts/run-with-t2-workstation.mjs scripts/certify-document-studio-browser.mjs 2>&1 | tee ../artifacts/t2-browser/runner.log

      - name: Certify T1 transversal runtime boundaries
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.resume_from_23 != true && inputs.resume_from_24 != true && inputs.resume_from_27 != true && inputs.resume_from_29 != true && inputs.resume_from_31 != true && inputs.resume_from_after != true }}
        working-directory: frontend
        shell: bash
        run: |
          set -o pipefail
          node scripts/run-with-t2-workstation.mjs scripts/certify-t1-transversal.mjs 2>&1 | tee ../artifacts/t2-browser/t1-transversal-runner.log

      - name: Certify P6 Document Libre editor
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.resume_from_23 != true && inputs.resume_from_24 != true && inputs.resume_from_27 != true && inputs.resume_from_29 != true && inputs.resume_from_31 != true && inputs.resume_from_after != true }}
        working-directory: frontend
        shell: bash
        run: |
          set -o pipefail
          node scripts/run-with-t2-workstation.mjs scripts/certify-p6-editor.mjs 2>&1 | tee ../artifacts/t2-browser/p6-editor-runner.log

      - name: Certify browser print and PDF freshness
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.resume_from_23 != true && inputs.resume_from_24 != true && inputs.resume_from_27 != true && inputs.resume_from_29 != true && inputs.resume_from_31 != true && inputs.resume_from_after != true }}
        working-directory: frontend
        shell: bash
        run: |
          set -o pipefail
          node scripts/run-with-t2-workstation.mjs scripts/certify-document-studio-output.mjs 2>&1 | tee ../artifacts/t2-browser/output-runner.log

      - name: Certify Honoraires cross-surface reconciliation
        working-directory: frontend
        shell: bash
        env:
          PRODUCT_HEAD: ${{ needs.scope.outputs.pr_head_sha }}
        run: |
          set -o pipefail
          mkdir -p ../artifacts/honoraires-reconciliation
          node scripts/run-with-t2-workstation.mjs scripts/certify-honoraires-reconciliation-browser.mjs 2>&1 | tee ../artifacts/honoraires-reconciliation/runner.log

      - name: Certify G4 Ordonnance browser actions
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.resume_from_23 != true && inputs.resume_from_24 != true && inputs.resume_from_27 != true && inputs.resume_from_29 != true && inputs.resume_from_31 != true && inputs.resume_from_after != true }}
        working-directory: frontend
        shell: bash
        run: |
          set -o pipefail
          node scripts/run-with-t2-workstation.mjs scripts/certify-v1-07-g4-ordonnance-actions.mjs 2>&1 | tee ../artifacts/t2-browser/g4-ordonnance-actions-runner.log

      - name: Certify G4 Finances browser actions
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.resume_from_23 != true && inputs.resume_from_24 != true && inputs.resume_from_27 != true && inputs.resume_from_29 != true && inputs.resume_from_31 != true && inputs.resume_from_after != true }}
        working-directory: frontend
        shell: bash
        run: |
          set -o pipefail
          node scripts/run-with-t2-workstation.mjs scripts/certify-v1-07-g4-finances-actions.mjs 2>&1 | tee ../artifacts/t2-browser/g4-finances-actions-runner.log

      - name: Capture G4 Treasury partial guard BEFORE
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.resume_from_23 != true && inputs.resume_from_24 != true && inputs.resume_from_27 != true && inputs.resume_from_29 != true && inputs.resume_from_31 != true && inputs.resume_from_after != true }}
        working-directory: frontend
        shell: bash
        env:
          G4_TREASURY_GUARD_BEFORE_ONLY: "1"
        run: |
          set -o pipefail
          node scripts/run-with-t2-workstation.mjs scripts/certify-v1-07-g4-honoraires-actions.mjs 2>&1 | tee ../artifacts/t2-browser/g4-treasury-guard-before-runner.log

      - name: Certify G4 Honoraires browser actions
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.resume_from_23 != true && inputs.resume_from_24 != true && inputs.resume_from_27 != true && inputs.resume_from_29 != true && inputs.resume_from_31 != true && inputs.resume_from_after != true }}
        working-directory: frontend
        shell: bash
        run: |
          set -o pipefail
          node scripts/run-with-t2-workstation.mjs scripts/certify-v1-07-g4-honoraires-actions.mjs 2>&1 | tee ../artifacts/t2-browser/g4-honoraires-actions-runner.log

      - name: Certify G4 remaining document actions
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.resume_from_23 != true && inputs.resume_from_24 != true && inputs.resume_from_27 != true && inputs.resume_from_29 != true && inputs.resume_from_31 != true && inputs.resume_from_after != true }}
        working-directory: frontend
        shell: bash
        run: |
          set -o pipefail
          node scripts/run-with-t2-workstation.mjs scripts/certify-v1-07-g4-remaining-documents.mjs 2>&1 | tee ../artifacts/t2-browser/g4-remaining-documents-runner.log

      - name: Certify G4 Devis and History actions
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.resume_from_24 != true && inputs.resume_from_27 != true && inputs.resume_from_29 != true && inputs.resume_from_31 != true && inputs.resume_from_after != true }}
        working-directory: frontend
        shell: bash
        run: |
          set -o pipefail
          node scripts/run-with-t2-workstation.mjs scripts/certify-v1-07-g4-devis-history.mjs 2>&1 | tee ../artifacts/t2-browser/g4-devis-history-runner.log

      - name: Inventory G4 dynamic controls
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.resume_from_27 != true && inputs.resume_from_29 != true && inputs.resume_from_31 != true && inputs.resume_from_after != true }}
        working-directory: frontend
        shell: bash
        run: |
          set -o pipefail
          node scripts/run-with-t2-workstation.mjs scripts/inventory-v1-07-g4-dynamic-controls.mjs 2>&1 | tee ../artifacts/t2-browser/g4-dynamic-inventory-runner.log

      - name: Certify G4 Clinical browser actions
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.resume_from_27 != true && inputs.resume_from_29 != true && inputs.resume_from_31 != true && inputs.resume_from_after != true }}
        working-directory: frontend
        shell: bash
        run: |
          set -o pipefail
          node scripts/run-with-t2-workstation.mjs scripts/certify-v1-07-g4-clinical-actions.mjs 2>&1 | tee ../artifacts/t2-browser/g4-clinical-actions-runner.log

      - name: Certify G4 Imaging media/tab browser actions
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.resume_from_27 != true && inputs.resume_from_29 != true && inputs.resume_from_31 != true && inputs.resume_from_after != true }}
        working-directory: frontend
        shell: bash
        run: |
          set -o pipefail
          node scripts/run-with-t2-workstation.mjs scripts/certify-media-c4-browser.mjs 2>&1 | tee ../artifacts/t2-browser/g4-imaging-media-runner.log

      - name: Certify G4 Panoramic browser actions
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.resume_from_29 != true && inputs.resume_from_31 != true && inputs.resume_from_after != true }}
        working-directory: frontend
        shell: bash
        run: |
          set -o pipefail
          node scripts/run-with-t2-workstation.mjs scripts/certify-v1-07-g4-panoramic-actions.mjs 2>&1 | tee ../artifacts/t2-browser/g4-panoramic-actions-runner.log

      - name: Certify G4 RVG browser actions
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.resume_from_29 != true && inputs.resume_from_31 != true && inputs.resume_from_after != true }}
        working-directory: frontend
        shell: bash
        run: |
          set -o pipefail
          node scripts/run-with-t2-workstation.mjs scripts/certify-v1-07-g4-rvg-actions.mjs 2>&1 | tee ../artifacts/t2-browser/g4-rvg-actions-runner.log

      - name: Capture G4 truth-label BEFORE
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.resume_from_31 != true && inputs.resume_from_after != true }}
        working-directory: frontend
        run: node scripts/run-with-t2-workstation.mjs scripts/capture-v1-07-g4-truth-labels-before.mjs

      - name: Capture G4 Panoramic trash BEFORE
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.resume_from_31 != true && inputs.resume_from_after != true }}
        working-directory: frontend
        run: node scripts/run-with-t2-workstation.mjs scripts/capture-v1-07-g4-panoramic-trash-before.mjs

      - name: Certify G4 Cephalo browser actions
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.resume_from_after != true }}
        working-directory: frontend
        run: node scripts/run-with-t2-workstation.mjs scripts/certify-v1-07-g4-cephalo-actions.mjs

      - name: Reproduce Dashboard to patient Finances path
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.resume_from_after != true }}
        working-directory: frontend
        shell: bash
        run: |
          set -o pipefail
          node scripts/run-with-t2-workstation.mjs scripts/certify-v1-07-dashboard-finance-path.mjs 2>&1 | tee ../artifacts/t2-browser/dashboard-finance-path-runner.log

      - name: Certify G4 UI truth AFTER
        working-directory: frontend
        shell: bash
        run: |
          set -o pipefail
          node scripts/run-with-t2-workstation.mjs scripts/certify-v1-07-g4-ui-truth-after.mjs 2>&1 | tee ../artifacts/t2-browser/g4-ui-truth-after-runner.log

      - name: Dump runtime logs on failure
        if: failure()
        run: |
          echo "===== BACKEND ====="
          cat /tmp/t2-backend.log || true
          echo "===== FRONTEND ====="
          cat /tmp/t2-frontend.log || true

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t2-browser-evidence
          path: |
            artifacts/t2-browser
            artifacts/honoraires-reconciliation
          if-no-files-found: warn
          retention-days: 14
