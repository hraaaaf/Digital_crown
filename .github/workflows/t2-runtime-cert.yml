name: T2 Runtime Browser Certification

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: t2-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-cert:
    name: T2 Browser Runtime Matrix
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ENVIRONMENT: test
      SECRET_KEY: t2-runtime-certification-secret-key-000001
      DATABASE_URL: sqlite:///./t2-runtime-cert.db
      TELEMETRY_ENABLED: "false"
      CLOUD_AI_ENABLED: "false"
      DEBUG: "false"
      ALLOWED_ORIGINS: '["http://127.0.0.1:5173","http://localhost:5173"]'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.12.0 torchvision==0.27.0 --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^(torch|torchvision)([<=>].*)?$' requirements.txt > /tmp/requirements-t2-runtime.txt
          pip install -r /tmp/requirements-t2-runtime.txt
          pip install httpx==0.27.2

      - name: Install frontend and Chromium
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start isolated backend
        run: |
          python scripts/t2_runtime_server.py > /tmp/t2-backend.log 2>&1 &
          echo $! > /tmp/t2-backend.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8005/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/t2-backend.log
          exit 1

      - name: Start frontend
        working-directory: frontend
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 > /tmp/t2-frontend.log 2>&1 &
          echo $! > /tmp/t2-frontend.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:5173 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/t2-frontend.log
          exit 1

      - name: Execute authenticated browser matrix
        working-directory: frontend
        run: node scripts/certify-document-studio-browser.mjs

      - name: Dump runtime logs on failure
        if: failure()
        run: |
          echo "===== BACKEND ====="
          cat /tmp/t2-backend.log || true
          echo "===== FRONTEND ====="
          cat /tmp/t2-frontend.log || true

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t2-browser-evidence
          path: artifacts/t2-browser
          if-no-files-found: warn
          retention-days: 14
