name: CB-03 G3 Synthetic Browser Visual Evidence (no backend)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - master
      - feature/cb03-g2-confirm-reconcile-20261024
    paths:
      - frontend/src/components/CrownBot/CrownBotGuidedActionsG3.tsx
      - frontend/src/components/CrownBot/CB03G3VisualLab.tsx
      - frontend/cb03-g3-visual-lab.html
      - frontend/scripts/certify-cb03-g3-synthetic-visual.mjs
      - .github/workflows/cb03-g3-synthetic-visual.yml

permissions:
  contents: read

concurrency:
  group: cb03-g3-visual-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: Chromium 390/430/1280/1600 source-only visual (NOT FUE-G/NVDA)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      G3_SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
      DIGITALCROWN_ISOLATED_RUNTIME: "true"
      VITE_CB03_G3_VISUAL_LAB: "true"
      VITE_CROWN_BOT_CB03_G3_ENABLED: "true"
      VITE_CROWN_BOT_WORKFLOW_PREVIEW_ENABLED: "false"
      VITE_CROWN_BOT_GUIDED_NLU_ENABLED: "false"
      CLOUD_AI_ENABLED: "false"
      TELEMETRY_ENABLED: "false"
      CROWN_BOT_CB03_CONFIRMATION_ENABLED: "false"
      CROWN_BOT_CB03_PREPARATION_ENABLED: "false"
      CROWN_BOT_CB03_STATUS_PREPARATION_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Assert immutable SHA and isolated browser-only exemption
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$G3_SOURCE_HEAD"
          test "$DIGITALCROWN_ISOLATED_RUNTIME" = true
          test "$CROWN_BOT_CB03_CONFIRMATION_ENABLED" = false
          test "$VITE_CB03_G3_VISUAL_LAB" = true
          test "$VITE_CROWN_BOT_CB03_G3_ENABLED" = true
          test "$CLOUD_AI_ENABLED" = false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend and Chromium
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Launch localhost-only static G3 visual lab (no backend)
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          npm run dev -- --host 127.0.0.1 --port 5173 > /tmp/cb03-g3-lab.log 2>&1 &
          for i in {1..90}; do
            if curl -fsS http://127.0.0.1:5173/cb03-g3-visual-lab.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/cb03-g3-lab.log
          exit 1
      - name: Capture real Chromium user steps with intercepted synthetic transport
        working-directory: frontend
        run: node scripts/certify-cb03-g3-synthetic-visual.mjs
      - name: Failure diagnostic
        if: failure()
        run: tail -n 150 /tmp/cb03-g3-lab.log || true
      - name: Upload SHA-tagged synthetic screenshots and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cb03-g3-synthetic-ui-chromium
          path: artifacts/cb03-g3-synthetic-visual
          if-no-files-found: warn
          retention-days: 14
      - name: Strict evidence classification
        run: |
          echo "G3 visual lab: Chromium screenshots + mocked server. Exact SHA ${{ github.event.pull_request.head.sha }}." >> "$GITHUB_STEP_SUMMARY"
          echo "NOT clinical UI FUE-G, no real backend writes, not native zoom / NVDA / Windows, not deployment." >> "$GITHUB_STEP_SUMMARY"
