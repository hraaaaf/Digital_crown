name: Patient Companion D1 lock sync

on:
  push:
    branches:
      - feat/patient-companion-d1-ui
    paths:
      - '.github/workflows/patient-companion-d1-lock-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/patient-companion-d1-ui
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Synchronize lockfile from exact package manifest
        working-directory: frontend
        run: npm install --package-lock-only --legacy-peer-deps
      - name: Verify exact D1 pins
        run: |
          node - <<'NODE'
          const pkg = require('./frontend/package.json');
          const lock = require('./frontend/package-lock.json');
          if (pkg.dependencies.firebase !== '12.19.0') throw new Error('Firebase manifest pin changed');
          if (pkg.devDependencies['@testing-library/dom'] !== '10.4.1') throw new Error('Testing Library DOM manifest pin missing');
          if (lock.packages[''].dependencies.firebase !== '12.19.0') throw new Error('Firebase lock pin changed');
          if (lock.packages[''].devDependencies['@testing-library/dom'] !== '10.4.1') throw new Error('Testing Library DOM lock pin missing');
          NODE
      - name: Commit synchronized lockfile only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "chore(patient-companion): synchronize frontend lockfile"
          git push origin HEAD:feat/patient-companion-d1-ui
