name: Patient Indicators Responsive Guarded Patch

on:
  push:
    branches: [fix/document-archive-consistency]
    paths:
      - '.github/workflows/patient-indicators-responsive-self-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/document-archive-consistency
          fetch-depth: 0
      - name: Patch responsive runtime locator
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/patient-indicators-cert.yml')
          text = p.read_text()

          old = """      - 'frontend/src/features/patients/PatientIndicatorsExplainable.test.ts'\n"""
          new = """      - 'frontend/src/features/patients/PatientIndicatorsExplainable.test.ts'\n      - '.github/workflows/patient-indicators-cert.yml'\n"""
          if text.count(old) != 1:
              raise SystemExit(f'paths marker mismatch: {text.count(old)}')
          text = text.replace(old, new, 1)

          old = """            await page.goto('http://127.0.0.1:5173/patients',{waitUntil:'networkidle',timeout:90000});\n            await page.getByRole('heading',{name:'Dossiers Patients',exact:true}).waitFor({state:'visible',timeout:30000});\n            await page.waitForTimeout(1500);\n            const dossier=String(patient.numero_dossier||'');\n            let row=page.locator('tbody tr').first();\n            if(dossier){\n              const exact=page.getByText(dossier,{exact:true});\n              if(await exact.count()) row=exact.first().locator('xpath=ancestor::tr');\n            }\n"""
          new = """            await page.goto('http://127.0.0.1:5173/patients',{waitUntil:'networkidle',timeout:90000});\n            const dossier=String(patient.numero_dossier||'');\n            const patientMarker = dossier ? page.getByText(dossier,{exact:true}).first() : page.locator('tbody tr').first();\n            await patientMarker.waitFor({state:'visible',timeout:30000});\n            await page.waitForTimeout(1500);\n            let row=page.locator('tbody tr').first();\n            if(dossier){\n              const exact=page.getByText(dossier,{exact:true});\n              if(await exact.count()) row=exact.first().locator('xpath=ancestor::tr');\n            }\n"""
          if text.count(old) != 1:
              raise SystemExit(f'runtime marker mismatch: {text.count(old)}')
          text = text.replace(old, new, 1)
          p.write_text(text)
          PY
          grep -q "patientMarker.waitFor" .github/workflows/patient-indicators-cert.yml
          grep -q "patient-indicators-cert.yml'" .github/workflows/patient-indicators-cert.yml
      - name: Commit and remove one-shot workflow
        run: |
          rm .github/workflows/patient-indicators-responsive-self-patch.yml
          git config user.name 'Digital Crown CI'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/workflows/patient-indicators-cert.yml .github/workflows/patient-indicators-responsive-self-patch.yml
          git commit -m 'Fix responsive patient indicators certification locator'
          git push origin HEAD:fix/document-archive-consistency
