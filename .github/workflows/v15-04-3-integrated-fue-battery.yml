name: V1.5-04.3 Integrated FUE Battery (LAB + Terrain Matrix)

on:
  push:
    branches: [test/v15-04-3-fue-integrated-battery-20261011]
    paths:
      - ".github/workflows/v15-04-3-integrated-fue-battery.yml"
      - "frontend/scripts/audit-v15-04-3-integrated-ux.mjs"
      - "scripts/verify_v15_04_3_pg_concurrency.py"
      - "backend/services/station_care_sheet.py"
      - "backend/tests/test_fue_v15_04_3_unsimulated_backend_e2e.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fue-v15-04-3-integrated-${{ github.sha }}
  cancel-in-progress: false

jobs:
  station-browser-matrix:
    name: FUE LAB station browser BEFORE/AFTER
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BEFORE_SHA: fa377f1ee05534cafbc26971f70f2e8ba8b792fd
      FUE_HEAD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Preserve reusable visual harness before switching revisions
        run: cp frontend/scripts/audit-v15-04-3-integrated-ux.mjs /tmp/fue043-integrated-ux.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend + Chromium (test runner only)
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Capture exact master BEFORE at 4 viewports x 3 locales x 2 actions
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "${BEFORE_SHA}"
          git checkout --force "${BEFORE_SHA}"
          cp /tmp/fue043-integrated-ux.mjs frontend/scripts/audit-v15-04-3-integrated-ux.mjs
          cd frontend
          ./node_modules/.bin/vite --host 127.0.0.1 --port 4197 >/tmp/fue043-before-vite.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          ready=0
          for i in {1..90}; do if curl -fsS http://127.0.0.1:4197/ >/dev/null; then ready=1; break; fi; sleep 1; done
          if [[ "$ready" != 1 ]]; then cat /tmp/fue043-before-vite.log; exit 1; fi
          FUE_PHASE=before FUE_EVALUATED_SHA="$BEFORE_SHA" node scripts/audit-v15-04-3-integrated-ux.mjs
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          trap - EXIT
      - name: Capture exact candidate AFTER using same harness/viewports
        shell: bash
        run: |
          set -euo pipefail
          git checkout --force "${FUE_HEAD_SHA}"
          cd frontend
          ./node_modules/.bin/vite --host 127.0.0.1 --port 4197 >/tmp/fue043-after-vite.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          ready=0
          for i in {1..90}; do if curl -fsS http://127.0.0.1:4197/ >/dev/null; then ready=1; break; fi; sleep 1; done
          if [[ "$ready" != 1 ]]; then cat /tmp/fue043-after-vite.log; exit 1; fi
          FUE_PHASE=after FUE_EVALUATED_SHA="$FUE_HEAD_SHA" node scripts/audit-v15-04-3-integrated-ux.mjs
      - name: Verify honest UI availability and screenshots for both phases
        shell: bash
        working-directory: frontend
        run: |
          set -euo pipefail
          for p in before after; do
            jq -e '.rows | length == 24' "artifacts/fue-v15-04-3-$p/report.json"
            jq -e '.failed | length == 0' "artifacts/fue-v15-04-3-$p/report.json"
            jq -e '.observations.documentRetrievalUiReady == false' "artifacts/fue-v15-04-3-$p/report.json"
            find "artifacts/fue-v15-04-3-$p" -maxdepth 1 -name '*.png' | wc -l
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fue043-browser-before-after-synthetic
          path: frontend/artifacts/fue-v15-04-3-*
          if-no-files-found: warn
          retention-days: 21

  postgres-concurrency:
    name: PostgreSQL real concurrent authorization (8 threads)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fue043_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fue043_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      ENVIRONMENT: test
      DIGITALCROWN_ISOLATED_RUNTIME: "true"
      TELEMETRY_ENABLED: "false"
      CLOUD_AI_ENABLED: "false"
      SECRET_KEY: fue043-postgresql-isolated-synthetic-secret-key
      FUE_EVALUATED_SHA: ${{ github.sha }}
      FUE_PG_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/fue043_ci
      FUE_PG_REPORT: artifacts/fue043/postgresql-concurrency.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install backend dependencies (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.10.0 torchvision==0.25.0 torchaudio==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^(torch|torchvision|torchaudio)([<=>].*)?$' requirements.txt >/tmp/requirements-fue043.txt
          pip install -r /tmp/requirements-fue043.txt
          pip install psycopg2-binary
      - name: Verify script compiles
        run: python -m py_compile scripts/verify_v15_04_3_pg_concurrency.py
      - name: Run actual PostgreSQL race proof
        run: python -m scripts.verify_v15_04_3_pg_concurrency
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fue043-postgresql-concurrency
          path: artifacts/fue043/postgresql-concurrency.json
          if-no-files-found: warn
          retention-days: 21

  insurance-coverage:
    name: Insurance real renderer + station HTTP full flow (SYNTHETIC)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ENVIRONMENT: test
      DIGITALCROWN_ISOLATED_RUNTIME: "true"
      TELEMETRY_ENABLED: "false"
      CLOUD_AI_ENABLED: "false"
      SECRET_KEY: fue043-insurance-isolated-test-secret-key
      DATABASE_URL: sqlite:///./fue043-insurance-test.db
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install backend dependencies (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.10.0 torchvision==0.25.0 torchaudio==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^(torch|torchvision|torchaudio)([<=>].*)?$' requirements.txt >/tmp/requirements-fue043.txt
          pip install -r /tmp/requirements-fue043.txt
      - name: Run real overlay algorithm + API contract regressions
        run: |
          python -m pytest backend/tests/test_insurance_pdf_overlay.py backend/tests/test_insurance_finalization.py backend/tests/test_insurance_submission_api.py backend/tests/test_station_care_sheet_v15.py backend/tests/test_fue_v15_04_3_unsimulated_backend_e2e.py -q
          echo "CLASSIFICATION=SYNTHETIC_FULL_BACKEND_E2E; actual renderer + archive + API + station retrieval; synthetic template test configuration, not official insurer fixture" | tee /tmp/fue043-insurance-limit.txt

  evidence-manifest:
    name: Eight-check truth matrix (no fake physical PASS)
    runs-on: ubuntu-latest
    needs: [station-browser-matrix, postgres-concurrency, insurance-coverage]
    if: always()
    steps:
      - name: Produce machine-readable eight-check classification
        env:
          BROWSER: ${{ needs.station-browser-matrix.result }}
          PG: ${{ needs.postgres-concurrency.result }}
          INSURANCE: ${{ needs.insurance-coverage.result }}
          EVALUATED_SHA: ${{ github.sha }}
        run: |
          mkdir -p artifacts/fue043
          python - <<'PY'
          import json, os
          checks = [
            ("station_patient_ui", "LAB_SIMULATED", os.environ["BROWSER"], "Browser interactions use mocked workstation responses; not a person"),
            ("all_station_screen_buttons", "PARTIAL", os.environ["BROWSER"], "Documents/help sampled; full device+app controls not asserted"),
            ("responsive_before_after", "LAB_SIMULATED", os.environ["BROWSER"], "4 viewports, FR/AR/EN, screenshots before/after same viewport"),
            ("real_nfc_qr_scan", "BLOCKED_TERRAIN", None, "Requires real NFC sensor / physical QR scan and actual station and companion device"),
            ("real_print_pocket", "BLOCKED_TERRAIN", None, "04.5 not implemented; requires real printer/Pocket delivery receipt"),
            ("postgres_simultaneous_authorization", "REAL_DB_CI", os.environ["PG"], "8 parallel threads against isolated PostgreSQL 18 in runner, synthetic identities"),
            ("insurance_real_full_e2e", "SYNTHETIC_FULL_BACKEND_E2E", os.environ["INSURANCE"], "Actual render/archive/staff-authorize/patient retrieve without renderer stub; synthetic validated source with test-only expected SHA override; no official insurer source or physical delivery"),
            ("human_patient_ux", "BLOCKED_HUMAN", None, "Actual patient observation and consent required; can't be simulated"),
          ]
          result = {"head": os.environ["EVALUATED_SHA"], "gate": "NOT_COMPLETE_PHYSICAL",
                    "checks": [dict(name=n, scope=s, job_result=j, note=t) for n,s,j,t in checks]}
          with open("artifacts/fue043/eight-check-matrix.json","w") as f: json.dump(result,f,indent=2)
          print(json.dumps(result,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fue043-unified-eight-check-truth-matrix
          path: artifacts/fue043/eight-check-matrix.json
          retention-days: 21
      - name: Fail fast if any technical job failed
        env:
          BROWSER: ${{ needs.station-browser-matrix.result }}
          PG: ${{ needs.postgres-concurrency.result }}
          INSURANCE: ${{ needs.insurance-coverage.result }}
        run: |
          test "$BROWSER" = success && test "$PG" = success && test "$INSURANCE" = success
