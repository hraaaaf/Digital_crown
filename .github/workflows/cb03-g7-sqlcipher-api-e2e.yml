name: CB-03 G7 Real FastAPI SQLCipher API E2E (isolated)
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - scripts/ci/cb03_g7_cipher_pytest.py
      - .github/workflows/cb03-g7-sqlcipher-api-e2e.yml
      - backend/tests/test_bot_cb03_g2_confirm.py
      - backend/routers/bot_cb03_confirm_g2.py
permissions:
  contents: read
jobs:
  real-api-encrypted-file:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CB03_G7_SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
      GITHUB_ACTIONS: "true"
      DIGITALCROWN_ISOLATED_RUNTIME: "1"
      ENVIRONMENT: test
      CLOUD_AI_ENABLED: "false"
      TELEMETRY_ENABLED: "false"
      CROWN_BOT_DETERMINISTIC_WORKFLOWS_ENABLED: "false"
      CROWN_BOT_GUIDED_NLU_ENABLED: "false"
      CROWN_BOT_CB03_PREPARATION_ENABLED: "false"
      CROWN_BOT_CB03_STATUS_PREPARATION_ENABLED: "false"
      CROWN_BOT_CB03_CONFIRMATION_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated backend and SQLCipher
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install torch==2.10.0 torchvision==0.25.0 torchaudio==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^(torch|torchvision|torchaudio)' requirements.txt > /tmp/cb03-g7-requirements.txt
          pip install -r /tmp/cb03-g7-requirements.txt
          pip install "sqlcipher3>=0.5,<1" pytest
          python -m pip check
      - name: Real G1/G2 FastAPI HTTP on encrypted SQLCipher file
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CB03_G7_SOURCE_HEAD"
          PYTHONPATH=. python -m pytest -q -s -p scripts.ci.cb03_g7_cipher_pytest backend/tests/test_bot_cb03_g2_confirm.py
      - name: Scope of certification
        if: success()
        run: |
          echo "PASS: Real FastAPI G1/G2 HTTP API tests with synthetic SQLCipher encrypted on-disk file; replay, expiry, tenant, rollback, audit, receipt and wrong-key/header checks." >> "$GITHUB_STEP_SUMMARY"
          echo "NOT CERTIFIED: full MainLayout browser→FastAPI→SQLCipher, real OS SIGKILL on SQLCipher, real clinic." >> "$GITHUB_STEP_SUMMARY"
