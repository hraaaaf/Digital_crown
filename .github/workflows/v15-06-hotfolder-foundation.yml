name: V1.5-06A Imaging Synthetic

on:
  push:
    branches:
      - feat/v15-06-*
    paths:
      - 'tools/imaging_gateway/**'
      - 'docs/quality/V15_06_IMAGING_ACQUISITION_GATEWAY_CONTRACT.md'
      - '.github/workflows/v15-06-hotfolder-foundation.yml'
  pull_request:
    paths:
      - 'tools/imaging_gateway/**'
      - 'docs/quality/V15_06_IMAGING_ACQUISITION_GATEWAY_CONTRACT.md'
      - '.github/workflows/v15-06-hotfolder-foundation.yml'
  workflow_dispatch:

jobs:
  synthetic:
    name: Synthetic hot-folder on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          # The default pull_request ref is a synthetic merge commit.
          # This gate must execute the PR's exact source HEAD instead.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -c "import os, subprocess; actual=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(); expected=os.environ['EXPECTED_SHA']; print('Checked out:',actual,'Expected:',expected); assert actual == expected, 'LOT06A_EXACT_HEAD_MISMATCH'"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install spool encryption
        run: python -m pip install "cryptography>=42,<48"
      - name: Compile source
        run: python -m compileall -q tools/imaging_gateway
      - name: Parse Windows preflight PowerShell without execution
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            'tools/imaging_gateway/windows/preflight.ps1',
            [ref]$tokens,
            [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -gt 0) {
            throw 'LOT06G_POWERSHELL_SYNTAX_REJECTED'
          }
      - name: Run synthetic tests
        run: python -m unittest discover -s tools/imaging_gateway/tests -v
