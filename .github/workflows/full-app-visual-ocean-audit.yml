name: Full App Visual Ocean Audit

on:
  push:
    branches: [audit/visual-ocean-2026-09-08]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend and Chromium
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Extract harness and switch to ocean
        working-directory: frontend
        run: |
          awk '/cat > full-app-visual-audit.mjs <<'"'"'EOF'"'"'/{flag=1;next}/^          EOF$/{flag=0}flag{sub(/^          /,"");print}' ../.github/workflows/full-app-visual-theme-audit.yml > full-app-visual-audit.mjs
          sed -i "s/\['default', 'medical-ocean'\]/['ocean']/" full-app-visual-audit.mjs
          grep "const themes" full-app-visual-audit.mjs
      - name: Capture ocean routes
        working-directory: frontend
        run: node full-app-visual-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-app-visual-ocean-audit
          path: artifacts/full-app-visual-audit
          retention-days: 14
          if-no-files-found: error
