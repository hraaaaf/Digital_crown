name: LOT06 B05A Windows SCM package ACL and synthetic key isolation FUE
on:
  push:
    branches: [test/lot06-phase2-b05a-package-acl-20261101]
    paths:
      - .github/workflows/lot06-phase2-b05a-package-acl.yml
      - isolated_fue_lot06c/windows_scm_service_sid_fue_c05b03r.ps1
      - isolated_fue_lot06c/windows_scm_client_c05b03r.ps1
      - docs/lot06/LOT06-PHASE2-B05A-PACKAGE-ACL-20261101.md
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: lot06-b05a-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-scm-package-acl-key-access-synthetic-only:
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      ENVIRONMENT: test
      DIGITALCROWN_ISOLATED_RUNTIME: 'true'
      DC06C05B03R_TEST_ONLY: '1'
      DC06B02_PROBE: '1'
      DC06B03_SERVICE_SPOOL: '1'
      DC06B04_RESTART_KEY_TEST: '1'
      DC06B05_PACKAGE_ACL_TEST: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synthetic crypto dependencies only
        shell: pwsh
        run: python -m pip install cryptography==46.0.3
      - name: Exact SHA Win32 other-user key read and binary write denied plus B04 continuity
        shell: pwsh
        run: |
          if ((git rev-parse HEAD) -ne $env:GITHUB_SHA) { throw 'DC06B05_EXACT_SHA_MISMATCH' }
          ./isolated_fue_lot06c/windows_scm_service_sid_fue_c05b03r.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Ensure product and clinical gates remain closed
        shell: pwsh
        run: |
          if (-not (Select-String -Path docs/lot06/LOT06-PHASE2-B05A-PACKAGE-ACL-20261101.md -Pattern 'CLINICAL_GO=false' -Quiet)) { throw 'DC06B05_CLINICAL_GATE_MISSING' }
          if ($env:ENVIRONMENT -ne 'test' -or $env:DIGITALCROWN_ISOLATED_RUNTIME -ne 'true') { throw 'DC06B05_NOT_ISOLATED' }
          Write-Output 'DC06B05_HOSTED_WINDOWS_SYNTHETIC_ONLY_NO_PRODUCT_INSTALL_PASS'
