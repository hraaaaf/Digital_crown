name: Portability Runtime Certification

on:
  pull_request:
    paths:
      - "backend/core/platform.py"
      - "backend/core/paths.py"
      - "backend/core/runtime_supervisor.py"
      - "backend/env_loader.py"
      - "backend/main.py"
      - "backend/routers/__init__.py"
      - "backend/routers/admin.py"
      - "backend/routers/license_portability_p4.py"
      - "backend/services/cabinet_bundle.py"
      - "backend/services/guided_restore.py"
      - "backend/services/guided_restore_archive.py"
      - "backend/services/guided_restore_worker.py"
      - "backend/services/license_service.py"
      - "backend/services/portability_license_rebind.py"
      - "backend/tests/test_cabinet_bundle.py"
      - "backend/tests/test_platform_abstraction.py"
      - "backend/tests/test_runtime_supervisor.py"
      - "scripts/portability_p1_check.py"
      - "scripts/portability_p2_check.py"
      - "scripts/portability_p3_check.py"
      - "scripts/portability_p4_check.py"
      - "run.py"
      - ".github/workflows/portability-p1-cert.yml"
  workflow_dispatch:

concurrency:
  group: portability-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-contract:
    name: Runtime contract (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install minimal portability dependencies
        run: python -m pip install python-dotenv cryptography==46.0.5

      - name: Compile portability runtime boundaries and harnesses
        run: >-
          python -m py_compile
          backend/core/platform.py
          backend/core/paths.py
          backend/core/runtime_supervisor.py
          backend/env_loader.py
          backend/main.py
          backend/routers/__init__.py
          backend/routers/admin.py
          backend/routers/license_portability_p4.py
          backend/services/cabinet_bundle.py
          backend/services/guided_restore.py
          backend/services/guided_restore_archive.py
          backend/services/guided_restore_worker.py
          backend/services/license_service.py
          backend/services/portability_license_rebind.py
          run.py
          scripts/portability_p1_check.py
          scripts/portability_p2_check.py
          scripts/portability_p3_check.py
          scripts/portability_p4_check.py

      - name: Preserve P1 OS abstraction contract
        run: python scripts/portability_p1_check.py

      - name: Certify P2 runtime supervisor
        run: python scripts/portability_p2_check.py

      - name: Certify P3 portable cabinet bundle
        run: python scripts/portability_p3_check.py

      - name: Certify P4 licence and machine-security rebind
        run: python scripts/portability_p4_check.py
