name: Portability P1 OS Abstraction Certification

on:
  pull_request:
    paths:
      - "backend/core/platform.py"
      - "backend/core/paths.py"
      - "backend/env_loader.py"
      - "backend/services/guided_restore.py"
      - "backend/services/guided_restore_worker.py"
      - "backend/tests/test_platform_abstraction.py"
      - "scripts/portability_p1_check.py"
      - "run.py"
      - ".github/workflows/portability-p1-cert.yml"
  workflow_dispatch:

concurrency:
  group: portability-p1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  adapter-contract:
    name: Adapter contract (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install minimal test dependency
        run: python -m pip install python-dotenv

      - name: Compile P1 runtime boundary and harness
        run: python -m py_compile backend/core/platform.py backend/core/paths.py backend/env_loader.py backend/services/guided_restore.py backend/services/guided_restore_worker.py run.py scripts/portability_p1_check.py

      - name: Run isolated P1 adapter and static-guard certification
        run: python scripts/portability_p1_check.py
