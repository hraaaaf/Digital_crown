name: Facad 3.14 installer static inspection

on:
  push:
    branches:
      - feat/ortho-studio-lot08-ricketts-protocol-v2
    paths:
      - .github/workflows/facad-314-static-inspection.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4

      - name: Download public Facad 3.14.1 installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path facad-inspect | Out-Null
          $url = 'https://downloads.citodent.com/pub/Facad/Facad-Installer-3.14.1.1111.exe'
          $out = 'facad-inspect/Facad-Installer-3.14.1.1111.exe'
          Invoke-WebRequest -Uri $url -OutFile $out
          if (-not (Test-Path $out)) { throw 'Installer download missing' }
          $size = (Get-Item $out).Length
          if ($size -lt 1MB) { throw "Installer unexpectedly small: $size bytes" }
          Get-FileHash $out -Algorithm SHA256 | Format-List | Out-File facad-inspect/hash.txt
          Get-AuthenticodeSignature $out | Format-List * | Out-File facad-inspect/authenticode.txt
          Write-Host "FACAD_INSTALLER_BYTES=$size"
          Get-Content facad-inspect/hash.txt
          Get-Content facad-inspect/authenticode.txt

      - name: Inspect installer archive structure
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $seven = "$env:ProgramFiles\7-Zip\7z.exe"
          if (-not (Test-Path $seven)) { throw '7-Zip unavailable on runner' }
          & $seven l facad-inspect/Facad-Installer-3.14.1.1111.exe | Tee-Object -FilePath facad-inspect/archive-list.txt
          New-Item -ItemType Directory -Force -Path facad-inspect/extracted | Out-Null
          & $seven x facad-inspect/Facad-Installer-3.14.1.1111.exe "-ofacad-inspect/extracted" -y | Tee-Object -FilePath facad-inspect/extract-log.txt
          if ($LASTEXITCODE -gt 1) { throw "7-Zip extraction failed with $LASTEXITCODE" }

      - name: Search extracted payload for Ricketts standard analyses
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $patterns = @('Ricketts (32 F)','Ricketts (13 F)','Ricketts','32 F','13 F')
          $files = Get-ChildItem facad-inspect/extracted -File -Recurse
          $files | Select-Object FullName,Length | Format-Table -AutoSize | Out-File facad-inspect/extracted-inventory.txt -Width 300
          $textExt = @('.txt','.xml','.ini','.cfg','.json','.csv','.dat','.properties','.config','.html','.htm','.rtf')
          $hits = New-Object System.Collections.Generic.List[string]
          foreach ($file in $files) {
            if ($textExt -contains $file.Extension.ToLowerInvariant()) {
              try {
                $content = Get-Content -LiteralPath $file.FullName -Raw -ErrorAction Stop
                foreach ($pattern in $patterns) {
                  if ($content -like "*$pattern*") { $hits.Add("$pattern | $($file.FullName)") }
                }
              } catch {}
            }
          }
          $hits | Sort-Object -Unique | Set-Content facad-inspect/ricketts-text-hits.txt
          foreach ($file in ($files | Where-Object { $_.Length -gt 0 -and $_.Length -lt 100MB })) {
            try {
              $bytes = [System.IO.File]::ReadAllBytes($file.FullName)
              $ascii = [System.Text.Encoding]::ASCII.GetString($bytes)
              foreach ($pattern in $patterns) {
                if ($ascii.Contains($pattern)) { "$pattern | $($file.FullName)" | Add-Content facad-inspect/ricketts-binary-hits.txt }
              }
            } catch {}
          }
          Write-Host '=== TEXT HITS ==='
          if (Test-Path facad-inspect/ricketts-text-hits.txt) { Get-Content facad-inspect/ricketts-text-hits.txt }
          Write-Host '=== BINARY HITS ==='
          if (Test-Path facad-inspect/ricketts-binary-hits.txt) { Get-Content facad-inspect/ricketts-binary-hits.txt }

      - name: Upload static inspection evidence
        uses: actions/upload-artifact@v4
        with:
          name: facad-314-static-inspection-${{ github.sha }}
          path: |
            facad-inspect/hash.txt
            facad-inspect/authenticode.txt
            facad-inspect/archive-list.txt
            facad-inspect/extract-log.txt
            facad-inspect/extracted-inventory.txt
            facad-inspect/ricketts-text-hits.txt
            facad-inspect/ricketts-binary-hits.txt
          if-no-files-found: warn