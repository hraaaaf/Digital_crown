name: R23-G12 Two Public Images Interactive Pixel Workbook (experimental)

on:
  pull_request:
    paths:
      - '.github/workflows/cephalo-r23g12-public-workbook.yml'
      - 'docs/audits/g12_atlas33_public_pixel_workbook.template.html'
      - 'docs/audits/CEPHALO_R23G12_TWO_PUBLIC_IMAGES_MANUAL_WORKBOOK.md'
      - 'scripts/cephalo_r23g12_public_manual_workbook.py'
      - 'audit/cephalo_r23g12_contract_tests/**'
      - 'scripts/cephalo_r23g11_public_radiograph_smoke.py'
      - 'scripts/cephalo_r23g10_annotation_intake.py'
      - 'docs/audits/schemas/cephalo_r23g9_atlas33_aariz_compatibility_preflight_v1.json'
      - 'docs/audits/schemas/cephalo_r23g11_public_radiographs_v1.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-public-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact PR HEAD
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch exact G11 public radiograph originals
        run: |
          mkdir -p /tmp/dc-g12-originals
          curl -fL --retry 4 --retry-delay 2 --max-time 90 -A 'DigitalCrown-SourceAudit/1.0' 'https://upload.wikimedia.org/wikipedia/commons/6/66/Cephalometric_radiograph.JPG' -o /tmp/dc-g12-originals/anug.jpg
          curl -fL --retry 4 --retry-delay 2 --max-time 90 -A 'DigitalCrown-SourceAudit/1.0' 'https://upload.wikimedia.org/wikipedia/commons/8/8e/A_lateral_cephalogram_without_true_vertical.jpg' -o /tmp/dc-g12-originals/challiyan.jpg
          echo '2a284993c666790a72d0c004044b35a92534ce9d  /tmp/dc-g12-originals/anug.jpg' | sha1sum -c -
          echo '66c74c588af3c54dfc581f8a870c5276c3427498  /tmp/dc-g12-originals/challiyan.jpg' | sha1sum -c -
      - name: Build offline workbook from real original public JPEGs
        run: |
          python -m scripts.cephalo_r23g12_public_manual_workbook \
            --input-dir /tmp/dc-g12-originals --output-dir /tmp/dc-g12-workbook
      - name: Ten structural and clinical NO-GO negative unit tests
        run: python -m unittest discover -s audit/cephalo_r23g12_contract_tests -p 'test_*.py' -v
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install isolated Chromium Playwright (not product frontend dependencies)
        run: |
          npm install --prefix /tmp/dc-g12-playwright-deps --no-audit --no-fund playwright@1.55.0
          /tmp/dc-g12-playwright-deps/node_modules/.bin/playwright install --with-deps chromium
      - name: Run real browser on both public JPEGs, then validate synthetic exported pixel drafts
        env:
          G12_PLAYWRIGHT_MODULE: /tmp/dc-g12-playwright-deps/node_modules/playwright
          G12_URL: http://127.0.0.1:8765/
          G12_EVIDENCE_DIR: /tmp/dc-g12-browser-evidence
        run: |
          python -m http.server 8765 --bind 127.0.0.1 --directory /tmp/dc-g12-workbook >/tmp/dc-g12-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 2
          node audit/cephalo_r23g12_contract_tests/g12_public_browser_e2e.cjs
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.cephalo_r23g11_public_radiograph_smoke import smoke
          from scripts.cephalo_r23g12_public_manual_workbook import build_catalog,verify_draft
          root=Path('.')
          catalog=build_catalog(root,smoke(root,Path('/tmp/dc-g12-originals')))
          for size in (1280,1600):
              p=Path(f'/tmp/dc-g12-browser-evidence/synthetic_browser_export_{size}.json')
              verdict=verify_draft(json.loads(p.read_text(encoding='utf8')),catalog)
              assert verdict['manual_draft_pixel_points']==2
              assert verdict['clinical_release'] is False
              print('G12 REAL-BROWSER PUBLIC PIXEL TEST PASS NONCLINICAL',size,verdict)
          PY
      - name: Upload attributed synthetic-only browser evidence (public derivatives)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cephalo-r23g12-synthetic-browser-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/dc-g12-browser-evidence/
          retention-days: 30
          if-no-files-found: error
