name: App Theme Wave04 — 46 Screens Exact Cosmetic Diff (NO DEPLOY)
on:
  push:
    branches:
      - fix/theme-neutral-bulk-wave04-20261025
  pull_request:
    branches:
      - fix/theme-neutral-bulk-wave03-20261025
permissions:
  contents: read
jobs:
  wave04:
    name: 46 UI screens exact-token diff, patient UI safety, TS and build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CLOUD_AI_ENABLED: "false"
      TELEMETRY_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify 46 exact cosmetic diffs and semantic roles
        run: python scripts/ci/theme_neutral_batch02.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install pinned frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: TypeScript
        working-directory: frontend
        run: npx tsc --noEmit -p tsconfig.app.json
      - name: Patient data-entry and insurance interface regression
        working-directory: frontend
        run: |
          npx vitest run \
            src/features/patients/AddPatientForm.g2Interactive.test.tsx \
            src/features/patients/EditPatientForm.g2Interactive.test.tsx \
            src/features/patients/PatientDetails.g2Interactive.test.tsx \
            src/features/patients/CnssInsuranceAction.preferred.test.tsx \
            src/features/admin/DocumentStudio/StudioFooter.certificat-print.test.tsx \
            src/features/multiview/themeTokens.r2.test.ts \
            --maxWorkers=1 --fileParallelism=false
      - name: Production build only (no deployment)
        working-directory: frontend
        run: npm run build
      - name: Evidence restrictions
        if: success()
        run: |
          echo "46 source files / 2,210 neutral hardcodes migrated across Wave02+Wave03+Wave04." >> "$GITHUB_STEP_SUMMARY"
          echo "Original source reconstructed exactly by whitelisted semantic CSS utility mapping; no functional edits." >> "$GITHUB_STEP_SUMMARY"
          echo "Synthetic tests only; no clinical HTTP writes, no merge or release; brand/clinical printed palette exceptions untouched." >> "$GITHUB_STEP_SUMMARY"
