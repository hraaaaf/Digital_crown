name: V1.5-06B Imaging Preflight Safety

on:
  push:
    branches:
      - 'feat/v15-06-*'
    paths:
      - 'backend/services/imaging_acquisition_preflight_v15.py'
      - 'backend/services/imaging_acquisition_transfer_lab_v15.py'
      - 'backend/routers/imaging_acquisition_transfer_lab_v15.py'
      - 'backend/tests/test_imaging_transfer_lab_v15.py'
      - 'backend/tests/test_imaging_lab_browser_real_http_v15.py'
      - 'backend/tests/test_imaging_durable_receipt_restart_v15.py'
      - 'backend/tests/test_imaging_backup_restore_rollback_v15.py'
      - 'tools/imaging_gateway/qa_backup_restore_witness_lab.py'
      - 'tools/imaging_gateway/qa_durable_receipt_restart_lab.py'
      - 'backend/routers/imaging_acquisition_preflight_v15.py'
      - 'backend/tests/test_imaging_acquisition_preflight_v15.py'
      - 'backend/tests/test_imaging_bridge_lifespan_v15.py'
      - 'tools/imaging_gateway/bridge_background_lab.py'
      - 'backend/main.py'
      - 'tools/imaging_gateway/qa_staff_review_desktop_lab.py'
      - 'frontend/src/features/imaging/**'
      - 'frontend/staff-review-lab.html'
      - '.github/workflows/v15-06b-preflight.yml'
  pull_request:
    paths:
      - 'backend/services/imaging_acquisition_preflight_v15.py'
      - 'backend/services/imaging_acquisition_transfer_lab_v15.py'
      - 'backend/routers/imaging_acquisition_transfer_lab_v15.py'
      - 'backend/tests/test_imaging_transfer_lab_v15.py'
      - 'backend/tests/test_imaging_lab_browser_real_http_v15.py'
      - 'backend/tests/test_imaging_durable_receipt_restart_v15.py'
      - 'backend/tests/test_imaging_backup_restore_rollback_v15.py'
      - 'tools/imaging_gateway/qa_backup_restore_witness_lab.py'
      - 'tools/imaging_gateway/qa_durable_receipt_restart_lab.py'
      - 'backend/routers/imaging_acquisition_preflight_v15.py'
      - 'backend/tests/test_imaging_acquisition_preflight_v15.py'
      - 'backend/tests/test_imaging_bridge_lifespan_v15.py'
      - 'tools/imaging_gateway/bridge_background_lab.py'
      - 'backend/main.py'
      - 'tools/imaging_gateway/qa_staff_review_desktop_lab.py'
      - 'frontend/src/features/imaging/**'
      - 'frontend/staff-review-lab.html'
      - '.github/workflows/v15-06b-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  imaging-preflight-synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ENVIRONMENT: test
      SECRET_KEY: v15-06b-synthetic-backend-secret-more-than-32
      DATABASE_URL: sqlite:///./v15-06b-isolated.db
      DIGITALCROWN_ISOLATED_RUNTIME: 'true'
      DC_V15_06_PREFLIGHT_LAB: '1'
      TELEMETRY_ENABLED: 'false'
      CLOUD_AI_ENABLED: 'false'
      DEBUG: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install existing backend runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.10.0 torchvision==0.25.0 torchaudio==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^(torch|torchvision|torchaudio)([<=>].*)?$' requirements.txt > /tmp/requirements-v15-06b.txt
          pip install -r /tmp/requirements-v15-06b.txt
      - name: Compile contract and API
        run: |
          python -m py_compile backend/services/imaging_acquisition_preflight_v15.py
          python -m py_compile backend/services/imaging_acquisition_transfer_lab_v15.py
          python -m py_compile backend/routers/imaging_acquisition_transfer_lab_v15.py
          python -m py_compile backend/tests/test_imaging_transfer_lab_v15.py
          python -m py_compile backend/tests/test_imaging_lab_browser_real_http_v15.py
          python -m py_compile backend/tests/test_imaging_durable_receipt_restart_v15.py
          python -m py_compile backend/tests/test_imaging_backup_restore_rollback_v15.py
          python -m py_compile tools/imaging_gateway/qa_backup_restore_witness_lab.py
          python -m py_compile tools/imaging_gateway/qa_durable_receipt_restart_lab.py
          python -m py_compile backend/routers/imaging_acquisition_preflight_v15.py
          python -m py_compile backend/tests/test_imaging_acquisition_preflight_v15.py
          python -m py_compile backend/tests/test_imaging_bridge_lifespan_v15.py
          python -m py_compile backend/main.py
          python -m py_compile tools/imaging_gateway/qa_visual_runtime.py
          python -m py_compile tools/imaging_gateway/tests/test_qa_visual_runtime.py
          python -m py_compile tools/imaging_gateway/qa_staff_review_desktop_lab.py
      - name: Preflight negative scenarios and Media Core regressions
        run: python -m pytest backend/tests/test_imaging_acquisition_preflight_v15.py backend/tests/test_imaging_transfer_lab_v15.py backend/tests/test_media_core_ingestion_api.py tools/imaging_gateway/tests/test_qa_visual_runtime.py -q

      - name: DR-04 independent process restart SQLCipher + AES-GCM (synthetic only)
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          DC06B_DURABILITY_EVIDENCE_DIR: lot06b-durable-evidence
        run: |
          set -euo pipefail
          mkdir -p "$DC06B_DURABILITY_EVIDENCE_DIR"
          python -m pytest backend/tests/test_imaging_durable_receipt_restart_v15.py -q -s
          test -s "$DC06B_DURABILITY_EVIDENCE_DIR/lot06b-sqlcipher-restart-fue.json"
          test -s "$DC06B_DURABILITY_EVIDENCE_DIR/lot06b-actual-clinical-asset-restart-fue.json"
          python -c 'import json; d=json.load(open("lot06b-durable-evidence/lot06b-sqlcipher-restart-fue.json")); assert d["wrong_aesgcm_media_key_rejected_on_original_ciphertext"] is True'
      - name: Publish isolated process-restart FUE (NO PRODUCT CERTIFICATION)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: lot06b-sqlcipher-restart-synthetic-fue
          path: lot06b-durable-evidence/
          if-no-files-found: error
          retention-days: 14

      - name: DR-05 cold SQLCipher backup+AES media restore+antirollback witness FUE
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          DC06B_BACKUP_EVIDENCE_DIR: lot06b-backup-evidence
        run: |
          set -euo pipefail
          mkdir -p "$DC06B_BACKUP_EVIDENCE_DIR"
          python -m pytest backend/tests/test_imaging_backup_restore_rollback_v15.py -q -s
          test -s "$DC06B_BACKUP_EVIDENCE_DIR/lot06b-backup-restore-antirollback-fue.json"
      - name: Publish synthetic backup restore rollback witness FUE
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: lot06b-backup-restore-rollback-synthetic-fue
          path: lot06b-backup-evidence/
          if-no-files-found: error
          retention-days: 14

      - name: Real FastAPI lifespan + isolated Imaging Bridge synthetic integration
        run: python -m pytest backend/tests/test_imaging_bridge_lifespan_v15.py -q

      - name: Install isolated browser for operational route evidence
        if: github.event_name == 'pull_request'
        run: |
          python -m pip install 'playwright==1.55.0'
          python -m playwright install --with-deps chromium
      - name: Capture exact-SHA BEFORE and AFTER FastAPI route registry
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.pull_request.base.sha }}
          AFTER_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/lot06-before" "$BEFORE_SHA"
          python tools/imaging_gateway/qa_visual_runtime.py \
            --before-root "$RUNNER_TEMP/lot06-before" \
            --after-root "." \
            --before-sha "$BEFORE_SHA" \
            --after-sha "$AFTER_SHA" \
            --out lot06-visual-evidence
          test "$(find lot06-visual-evidence -name '*.png' | wc -l)" -eq 6
      - name: Publish software-only BEFORE AFTER evidence for human review
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: lot06-preflight-runtime-before-after
          path: lot06-visual-evidence/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/setup-node@v4
        if: github.event_name == 'pull_request'
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies for isolated LAB browser FUE
        if: github.event_name == 'pull_request'
        run: npm ci --prefix frontend
      - name: Browser→real FastAPI LAB API / AES media receipt FUE
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          DC06B_HTTP_EVIDENCE_DIR: lot06b-real-http-evidence
        run: |
          set -euo pipefail
          mkdir -p "$DC06B_HTTP_EVIDENCE_DIR"
          # npm ci + Python Playwright/Chromium are installed by earlier steps.
          python -m pytest backend/tests/test_imaging_lab_browser_real_http_v15.py -q -s
          test -s "$DC06B_HTTP_EVIDENCE_DIR/lot06b-real-http-proof-matched-rdv.json"
          test -s "$DC06B_HTTP_EVIDENCE_DIR/lot06b-real-http-proof-patient-only.json"
      - name: Publish exact-SHA real HTTP synthetic receipt proof
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: lot06b-real-browser-fastapi-receipt
          path: lot06b-real-http-evidence/
          if-no-files-found: error
          retention-days: 14
      - name: Test DEV-only React patient/RDV review and browser screenshots
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix frontend run test -- src/features/imaging/StaffReviewLab.test.tsx
          (
            cd frontend
            npm run dev -- --host 127.0.0.1 --port 5186 > "$RUNNER_TEMP/lot06b-vite.log" 2>&1 &
            echo $! > "$RUNNER_TEMP/lot06b-vite.pid"
          )
          for attempt in $(seq 1 45); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:5186/staff-review-lab.html; then break; fi
            sleep 2
          done
          curl --fail --silent --output /dev/null http://127.0.0.1:5186/staff-review-lab.html
          python tools/imaging_gateway/qa_staff_review_desktop_lab.py \
            --url http://127.0.0.1:5186/staff-review-lab.html \
            --out lot06b-desktop-evidence
      - name: Publish DEV-only staff desktop FUE screenshot evidence
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: lot06b-desktop-staff-review-fixture
          path: lot06b-desktop-evidence/
          if-no-files-found: error
          retention-days: 14
