name: V1.5-06B Imaging Preflight Safety

on:
  push:
    branches:
      - 'feat/v15-06-*'
    paths:
      - 'backend/services/imaging_acquisition_preflight_v15.py'
      - 'backend/services/imaging_acquisition_transfer_lab_v15.py'
      - 'backend/routers/imaging_acquisition_transfer_lab_v15.py'
      - 'backend/tests/test_imaging_transfer_lab_v15.py'
      - 'backend/tests/test_imaging_lab_browser_real_http_v15.py'
      - 'backend/tests/test_imaging_durable_receipt_restart_v15.py'
      - 'backend/tests/test_imaging_backup_restore_rollback_v15.py'
      - 'tools/imaging_gateway/qa_backup_restore_witness_lab.py'
      - 'tools/imaging_gateway/qa_durable_receipt_restart_lab.py'
      - 'backend/routers/imaging_acquisition_preflight_v15.py'
      - 'backend/services/clinical_asset_storage.py'
      - 'backend/tests/test_clinical_asset_storage.py'
      - 'backend/services/imaging_clinical_asset_verifier_v15.py'
      - 'backend/tests/test_imaging_clinical_asset_verifier_v15.py'
      - 'backend/services/imaging_lab_authorized_media_gate_v15.py'
      - 'backend/tests/test_imaging_lab_authorized_media_gate_v15.py'
      - 'isolated_fue_lot06c/test_sqlcipher_onprem_authority_v15.py'
      - 'isolated_fue_lot06c/test_sqlcipher_clinical_asset_receipt_v15.py'
      - 'isolated_fue_lot06c/test_sqlcipher_persistent_approval_v15.py'
      - 'isolated_fue_lot06c/test_sqlcipher_wal_durability_contract_v15.py'
      - 'backend/tests/test_imaging_acquisition_preflight_v15.py'
      - 'backend/tests/test_imaging_bridge_lifespan_v15.py'
      - 'tools/imaging_gateway/bridge_background_lab.py'
      - 'backend/main.py'
      - 'tools/imaging_gateway/qa_staff_review_desktop_lab.py'
      - 'frontend/src/features/imaging/**'
      - 'frontend/staff-review-lab.html'
      - '.github/workflows/v15-06b-preflight.yml'
  pull_request:
    paths:
      - 'backend/services/imaging_acquisition_preflight_v15.py'
      - 'backend/services/imaging_acquisition_transfer_lab_v15.py'
      - 'backend/routers/imaging_acquisition_transfer_lab_v15.py'
      - 'backend/tests/test_imaging_transfer_lab_v15.py'
      - 'backend/tests/test_imaging_lab_browser_real_http_v15.py'
      - 'backend/tests/test_imaging_durable_receipt_restart_v15.py'
      - 'backend/tests/test_imaging_backup_restore_rollback_v15.py'
      - 'tools/imaging_gateway/qa_backup_restore_witness_lab.py'
      - 'tools/imaging_gateway/qa_durable_receipt_restart_lab.py'
      - 'backend/routers/imaging_acquisition_preflight_v15.py'
      - 'backend/services/clinical_asset_storage.py'
      - 'backend/tests/test_clinical_asset_storage.py'
      - 'backend/services/imaging_clinical_asset_verifier_v15.py'
      - 'backend/tests/test_imaging_clinical_asset_verifier_v15.py'
      - 'backend/services/imaging_lab_authorized_media_gate_v15.py'
      - 'backend/tests/test_imaging_lab_authorized_media_gate_v15.py'
      - 'isolated_fue_lot06c/test_sqlcipher_onprem_authority_v15.py'
      - 'isolated_fue_lot06c/test_sqlcipher_clinical_asset_receipt_v15.py'
      - 'isolated_fue_lot06c/test_sqlcipher_persistent_approval_v15.py'
      - 'isolated_fue_lot06c/test_sqlcipher_wal_durability_contract_v15.py'
      - 'backend/tests/test_imaging_acquisition_preflight_v15.py'
      - 'backend/tests/test_imaging_bridge_lifespan_v15.py'
      - 'tools/imaging_gateway/bridge_background_lab.py'
      - 'backend/main.py'
      - 'tools/imaging_gateway/qa_staff_review_desktop_lab.py'
      - 'frontend/src/features/imaging/**'
      - 'frontend/staff-review-lab.html'
      - '.github/workflows/v15-06b-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  imaging-preflight-synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ENVIRONMENT: test
      SECRET_KEY: v15-06b-synthetic-backend-secret-more-than-32
      DATABASE_URL: sqlite:///./v15-06b-isolated.db
      DIGITALCROWN_ISOLATED_RUNTIME: 'true'
      DC_V15_06_PREFLIGHT_LAB: '1'
      TELEMETRY_ENABLED: 'false'
      CLOUD_AI_ENABLED: 'false'
      DEBUG: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install existing backend runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.10.0 torchvision==0.25.0 torchaudio==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^(torch|torchvision|torchaudio)([<=>].*)?$' requirements.txt > /tmp/requirements-v15-06b.txt
          pip install -r /tmp/requirements-v15-06b.txt
      - name: Compile contract and API
        run: |
          python -m py_compile backend/services/clinical_asset_storage.py
          python -m py_compile backend/tests/test_clinical_asset_storage.py
          python -m py_compile backend/services/imaging_acquisition_preflight_v15.py
          python -m py_compile backend/services/imaging_acquisition_transfer_lab_v15.py
          python -m py_compile backend/routers/imaging_acquisition_transfer_lab_v15.py
          python -m py_compile backend/tests/test_imaging_transfer_lab_v15.py
          python -m py_compile backend/tests/test_imaging_lab_browser_real_http_v15.py
          python -m py_compile backend/tests/test_imaging_durable_receipt_restart_v15.py
          python -m py_compile backend/tests/test_imaging_backup_restore_rollback_v15.py
          python -m py_compile tools/imaging_gateway/qa_backup_restore_witness_lab.py
          python -m py_compile tools/imaging_gateway/qa_durable_receipt_restart_lab.py
          python -m py_compile backend/routers/imaging_acquisition_preflight_v15.py
          python -m py_compile backend/tests/test_imaging_acquisition_preflight_v15.py
          python -m py_compile backend/tests/test_imaging_bridge_lifespan_v15.py
          python -m py_compile backend/main.py
          python -m py_compile tools/imaging_gateway/qa_visual_runtime.py
          python -m py_compile tools/imaging_gateway/tests/test_qa_visual_runtime.py
          python -m py_compile tools/imaging_gateway/qa_staff_review_desktop_lab.py
      - name: Preflight negative scenarios and Media Core regressions
        run: python -m pytest backend/tests/test_imaging_acquisition_preflight_v15.py backend/tests/test_imaging_transfer_lab_v15.py backend/tests/test_media_core_ingestion_api.py tools/imaging_gateway/tests/test_qa_visual_runtime.py -q

      - name: LOT06-C1 POSIX parent directory sync / encrypted orphan FUE (synthetic only)
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          DC06C1_EVIDENCE_DIR: lot06c1-fsync-evidence
        run: |
          set -euo pipefail
          mkdir -p "$DC06C1_EVIDENCE_DIR"
          python -m pytest backend/tests/test_clinical_asset_storage.py -q -s -k durable_parent_barrier
          test -s "$DC06C1_EVIDENCE_DIR/lot06c1-parent-fsync-fue.json"
          python -c 'import json; d=json.load(open("lot06c1-fsync-evidence/lot06c1-parent-fsync-fue.json")); assert all(d[k] is True for k in ("file_and_parent_fsync_tested", "failure_refuses_sql_asset_binding", "failed_sync_keeps_only_encrypted_orphan", "retry_resyncs_original_encrypted_blob_before_sql_binding")); assert d["product_ready"] is False and d["windows_durability_certified"] is False'

      - name: Publish LOT06-C1 POSIX durability FUE (NO PRODUCT CERTIFICATION)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: lot06c1-parent-fsync-synthetic-fue
          path: lot06c1-fsync-evidence/
          if-no-files-found: error
          retention-days: 14

      - name: LOT06-C1b new ancestor directory durability FUE (synthetic POSIX)
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          DC06C1B_EVIDENCE_DIR: lot06c1b-ancestor-evidence
        run: |
          set -euo pipefail
          mkdir -p "$DC06C1B_EVIDENCE_DIR"
          python -m pytest backend/tests/test_clinical_asset_storage.py -q -s -k c1b_
          test -s "$DC06C1B_EVIDENCE_DIR/lot06c1b-ancestor-fsync-fue.json"
          python -c 'import json; d=json.load(open("lot06c1b-ancestor-evidence/lot06c1b-ancestor-fsync-fue.json")); assert all(d[k] is True for k in ("new_ancestor_and_parent_sync_barriers_checked", "failed_ancestor_sync_blocks_sql_binding", "failed_ancestor_sync_writes_no_clinical_media", "retry_after_failure_restores_verified_aesgcm")); assert d["product_ready"] is False and d["actual_power_loss_tested"] is False and d["windows_ntfs_certified"] is False'

      - name: Publish LOT06-C1b ancestor fsync FUE (NO PRODUCT CERTIFICATION)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: lot06c1b-ancestor-fsync-synthetic-fue
          path: lot06c1b-ancestor-evidence/
          if-no-files-found: error
          retention-days: 14

      - name: LOT06-C05B-02A actual ClinicalAsset AES-GCM media binding FUE (TEST ONLY)
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          DC06C05B02A_EVIDENCE_DIR: lot06c05b02a-media-evidence
        run: |
          set -euo pipefail
          python -m py_compile backend/services/imaging_clinical_asset_verifier_v15.py
          python -m py_compile backend/tests/test_imaging_clinical_asset_verifier_v15.py
          mkdir -p "$DC06C05B02A_EVIDENCE_DIR"
          python -m pytest backend/tests/test_imaging_clinical_asset_verifier_v15.py -q -s
          test -s "$DC06C05B02A_EVIDENCE_DIR/lot06c05b02a-media-binding-fue.json"
          python -c 'import json,os; d=json.load(open(os.path.join(os.environ["DC06C05B02A_EVIDENCE_DIR"],"lot06c05b02a-media-binding-fue.json"))); assert all(d[k] is True for k in ("actual_clinical_asset_model_used","actual_storage_read_decrypts_and_rehashes","tenant_patient_staff_asset_sha_size_checked","tampered_ciphertext_and_missing_blob_rejected","non_device_capture_provenance_rejected_in_separate_test")); assert all(d[k] is False for k in ("real_staff_device_authorization_verified","approval_version_bound_to_receipt","postgresql_receipt_transaction_connected","product_ready"))'
      - name: Upload LOT06-C05B-02A clinical media verification LAB FUE
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: lot06c05b02a-clinical-media-verification-synthetic-fue
          path: lot06c05b02a-media-evidence/
          if-no-files-found: error
          retention-days: 14

      - name: LOT06-C05B-02B lab staff/device approval + real AES media FUE
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          DC06C05B02B_EVIDENCE_DIR: lot06c05b02b-auth-media-evidence
          DC_V15_06_TRANSFER_LAB: '1'
        run: |
          set -euo pipefail
          python -m py_compile backend/services/imaging_lab_authorized_media_gate_v15.py
          python -m py_compile backend/tests/test_imaging_lab_authorized_media_gate_v15.py
          mkdir -p "$DC06C05B02B_EVIDENCE_DIR"
          python -m pytest backend/tests/test_imaging_lab_authorized_media_gate_v15.py -q -s
          test -s "$DC06C05B02B_EVIDENCE_DIR/lot06c05b02b-lab-auth-media-fue.json"
          python -c 'import json,os; d=json.load(open(os.path.join(os.environ["DC06C05B02B_EVIDENCE_DIR"],"lot06c05b02b-lab-auth-media-fue.json"))); assert all(d[k] is True for k in ("real_lab_server_review_challenge_consumed","lab_device_token_and_revocation_checked","current_staff_permission_and_revocation_checked","approved_capture_claims_and_media_provenance_checked","real_aesgcm_media_tamper_refused","lab_guard_persistent_disabled")); assert d["negative_claims_rejected"]==9;assert all(d[k] is False for k in ("clinical_receipt_authorization_granted","approval_version_persisted_in_postgres","production_device_trust_certified","sql_fs_atomicity_certified","product_ready"))'
      - name: Upload LOT06-C05B-02B lab authorization/media FUE
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: lot06c05b02b-lab-authorized-media-synthetic-fue
          path: lot06c05b02b-auth-media-evidence/
          if-no-files-found: error
          retention-days: 14

      - name: LOT06-C05B-03A on-prem SQLCipher concurrent receipt + ACK recovery FUE
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          DC06C05B03A_TEST_SQLCIPHER: '1'
          DC06C05B03A_EVIDENCE_DIR: lot06c05b03a-sqlcipher-evidence
        run: |
          set -euo pipefail
          python -m py_compile isolated_fue_lot06c/test_sqlcipher_onprem_authority_v15.py
          mkdir -p "$DC06C05B03A_EVIDENCE_DIR"
          python -m pytest isolated_fue_lot06c/test_sqlcipher_onprem_authority_v15.py -q -s
          test -s "$DC06C05B03A_EVIDENCE_DIR/lot06c05b03a-sqlcipher-target-fue.json"
          python -c 'import json,os; d=json.load(open(os.path.join(os.environ["DC06C05B03A_EVIDENCE_DIR"],"lot06c05b03a-sqlcipher-target-fue.json"))); assert all(d[k] is True for k in ("encrypted_sqlcipher_file_and_wrong_key_refusal","six_concurrent_independent_sqlcipher_connections","begin_immediate_serializes_writers","sql_receipt_audit_outbox_atomic_rollback","postcommit_os_process_exit_before_ack_replayed","postgres_for_update_not_supported_by_sqlite","approval_and_version_conflicts_fail_closed")); assert all(d[k] is False for k in ("actual_clinical_asset_joined","production_schema_migration_applied","real_staff_device_identity_certified","physical_power_loss_tested","product_ready"))'
      - name: Upload LOT06-C05B-03A SQLCipher target FUE (NO CLINICAL GO)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: lot06c05b03a-sqlcipher-onprem-concurrency-synthetic-fue
          path: lot06c05b03a-sqlcipher-evidence/
          if-no-files-found: error
          retention-days: 14

      - name: LOT06-C05B-03B actual ClinicalAsset plus receipt in one SQLCipher commit FUE
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          DC06C05B03B_TEST_ONLY: '1'
          DC06C05B03B_EVIDENCE_DIR: lot06c05b03b-sqlcipher-asset-evidence
        run: |
          set -euo pipefail
          python -m py_compile isolated_fue_lot06c/test_sqlcipher_clinical_asset_receipt_v15.py
          mkdir -p "$DC06C05B03B_EVIDENCE_DIR"
          python -m pytest isolated_fue_lot06c/test_sqlcipher_clinical_asset_receipt_v15.py -q -s
          test -s "$DC06C05B03B_EVIDENCE_DIR/lot06c05b03b-real-asset-sqlcipher-fue.json"
          python -c 'import json,os; d=json.load(open(os.path.join(os.environ["DC06C05B03B_EVIDENCE_DIR"],"lot06c05b03b-real-asset-sqlcipher-fue.json"))); assert all(d[k] is True for k in ("actual_clinical_asset_orm_in_encrypted_file","real_aesgcm_written_verified_before_sql_commit","asset_receipt_audit_outbox_same_sql_commit","four_injected_failpoints_leave_no_sql_receipt","encrypted_orphan_retained_and_rechecked","postcommit_os_exit_recovered_with_real_media","tampered_ciphertext_blocks_receipt_replay","cabinet_sqlcipher_wal_normal_used","cabinet_policy_source_checked_in_separate_test")); assert all(d[k] is False for k in ("real_device_staff_authentication","real_approval_schema_migration","sql_and_filesystem_globally_atomic","production_clinical_transfer_enabled","per_commit_powerloss_durability_certified","actual_power_cut_tested","product_ready"))'
      - name: Upload LOT06-C05B-03B actual media + SQLCipher transaction FUE
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: lot06c05b03b-actual-asset-sqlcipher-atomic-synthetic-fue
          path: lot06c05b03b-sqlcipher-asset-evidence/
          if-no-files-found: error
          retention-days: 14

      - name: LOT06-C05B-03C persisted staff/device approval and receipt FUE (TEST ONLY)
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          DC06C05B03B_TEST_ONLY: '1'
          DC06C05B03C_TEST_ONLY: '1'
          DC06C05B03C_EVIDENCE_DIR: lot06c05b03c-authority-evidence
        run: |
          set -euo pipefail
          python -m py_compile isolated_fue_lot06c/test_sqlcipher_persistent_approval_v15.py
          mkdir -p "$DC06C05B03C_EVIDENCE_DIR"
          python -m pytest isolated_fue_lot06c/test_sqlcipher_persistent_approval_v15.py -q -s
          test -s "$DC06C05B03C_EVIDENCE_DIR/lot06c05b03c-persistent-approval-fue.json"
          python -c 'import json,os; d=json.load(open(os.path.join(os.environ["DC06C05B03C_EVIDENCE_DIR"],"lot06c05b03c-persistent-approval-fue.json"))); assert all(d[k] is True for k in ("persistent_server_owned_approval_fixture","persisted_tenant_staff_device_station_revision_checked","cross_tenant_identity_version_and_role_refused","revocation_before_issue_refused","historical_receipt_internal_audit_after_revocation","revoked_requester_receipt_replay_denied","receipt_immutable_test_trigger_enforced","four_sql_failpoints_atomic_rollback","real_aesgcm_media_bound_before_sql_commit","postcommit_process_exit_ack_replay","tampered_media_blocks_historical_replay","foreign_keys_enabled_for_synthetic_authority")); assert all(d[k] is False for k in ("actual_authenticated_device_or_staff","production_approval_schema_migrated","powercut_durability_certified","windows_ntfs_certified","sql_and_media_globally_atomic","production_clinical_receipt_enabled","product_ready"))'
      - name: Upload LOT06-C05B-03C persisted approval FUE (NO PRODUCT CERTIFICATION)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: lot06c05b03c-persistent-sqlcipher-approval-synthetic-fue
          path: lot06c05b03c-authority-evidence/
          if-no-files-found: error
          retention-days: 14

      - name: LOT06-C05B-03D SQLCipher WAL NORMAL/FULL process crash and ACK policy FUE (LAB ONLY)
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          DC06C05B03D_TEST_ONLY: '1'
          DC06C05B03D_EVIDENCE_DIR: lot06c05b03d-durability-evidence
        run: |
          set -euo pipefail
          python -m py_compile isolated_fue_lot06c/test_sqlcipher_wal_durability_contract_v15.py
          mkdir -p "$DC06C05B03D_EVIDENCE_DIR"
          python -m pytest isolated_fue_lot06c/test_sqlcipher_wal_durability_contract_v15.py -q -s
          test -s "$DC06C05B03D_EVIDENCE_DIR/lot06c05b03d-wal-sync-uncertain-ack-fue.json"
          python -c 'import json,os; d=json.load(open(os.path.join(os.environ["DC06C05B03D_EVIDENCE_DIR"],"lot06c05b03d-wal-sync-uncertain-ack-fue.json"))); assert all(d[k] is True for k in ("actual_sqlcipher_wal_normal_and_full_config_observed","cabinet_wal_normal_source_pinned","full_requires_same_writer_connection","normal_refused_for_strict_policy","normal_full_sql_triplet_rollback_verified","normal_full_precommit_os_process_exit_verified","normal_full_postcommit_os_process_exit_ack_recovered","identity_and_media_corruption_block_receipt_recovery","uncertain_commit_no_receipt_never_acknowledged","test_only_synthetic_aesgcm_media_not_clinical_asset","observed_os_process_exit_not_power_failure")); assert all(d[k] is False for k in ("actual_power_loss_tested","os_kernel_crash_tested","vfs_xsync_invocations_instrumented","physical_media_flush_guaranteed","windows_ntfs_certified","clinical_staff_device_authenticated","production_schema_migrated","sql_and_filesystem_globally_atomic","per_commit_powerloss_durability_certified","production_durable_receipt_enabled","product_ready")); assert d["sqlite_primary_documentation_wal_sync_semantics"] == "https://www.sqlite.org/pragma.html"'
      - name: Upload LOT06-C05B-03D SQLCipher WAL synchronicity FUE (NO POWERLOSS CLAIM)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: lot06c05b03d-wal-normal-full-ack-lab-fue
          path: lot06c05b03d-durability-evidence/
          if-no-files-found: error
          retention-days: 14

      - name: DR-04 independent process restart SQLCipher + AES-GCM (synthetic only)
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          DC06B_DURABILITY_EVIDENCE_DIR: lot06b-durable-evidence
        run: |
          set -euo pipefail
          mkdir -p "$DC06B_DURABILITY_EVIDENCE_DIR"
          python -m pytest backend/tests/test_imaging_durable_receipt_restart_v15.py -q -s
          test -s "$DC06B_DURABILITY_EVIDENCE_DIR/lot06b-sqlcipher-restart-fue.json"
          test -s "$DC06B_DURABILITY_EVIDENCE_DIR/lot06b-actual-clinical-asset-restart-fue.json"
          python -c 'import json; d=json.load(open("lot06b-durable-evidence/lot06b-sqlcipher-restart-fue.json")); assert d["wrong_aesgcm_media_key_rejected_on_original_ciphertext"] is True'
      - name: Publish isolated process-restart FUE (NO PRODUCT CERTIFICATION)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: lot06b-sqlcipher-restart-synthetic-fue
          path: lot06b-durable-evidence/
          if-no-files-found: error
          retention-days: 14

      - name: LOT06-C02/C04 post-COMMIT lost ACK identity FUE (SQLCipher synthetic)
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          DC06C02C04_EVIDENCE_DIR: lot06c02c04-postcommit-evidence
        run: |
          set -euo pipefail
          mkdir -p "$DC06C02C04_EVIDENCE_DIR"
          python -m pytest backend/tests/test_imaging_durable_receipt_restart_v15.py -q -s -k postcommit_crash_lost_ack
          test -s "$DC06C02C04_EVIDENCE_DIR/lot06c02c04-postcommit-lost-ack-fue.json"
          python -c 'import json; d=json.load(open("lot06c02c04-postcommit-evidence/lot06c02c04-postcommit-lost-ack-fue.json")); assert all(d[k] is True for k in ("encrypted_sqlcipher_file", "encrypted_media_verified_after_restart", "real_os_process_exit_after_commit_before_ack", "three_independent_process_replays_same_receipt", "identity_digest_size_tenant_patient_reason_conflicts_rejected", "unique_capture_db_constraint_rejects_duplicate_insert", "receipt_audit_outbox_single_row_each_per_capture")); assert d["product_ready"] is False and d["real_concurrent_writers_tested"] is False and d["lab_transfer_persistent_db_used"] is False'

      - name: Publish LOT06-C02/C04 postcommit FUE (NO CLINICAL CERTIFICATION)
        if: github.event_name == 'pull_request'
