name: Patient P0-D Assistant Rescue

on:
  push:
    branches:
      - agent/patient-page-p0-rescue
    paths:
      - '.github/workflows/patient-p0d-assistant-rescue.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: patient-p0d-assistant-rescue-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rescue:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Fetch certified source branch
        run: git fetch origin agent/patient-page-p0-truth-safety --depth=1

      - name: Restore fail-closed assistants
        run: |
          git show FETCH_HEAD:frontend/src/features/patients/components/wizards/AssistantEndo.tsx > frontend/src/features/patients/components/wizards/AssistantEndo.tsx
          git show FETCH_HEAD:frontend/src/features/patients/components/wizards/AssistantExamenComplet.tsx > frontend/src/features/patients/components/wizards/AssistantExamenComplet.tsx

      - name: Fail-closed contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          endo = Path('frontend/src/features/patients/components/wizards/AssistantEndo.tsx').read_text(encoding='utf-8')
          exam = Path('frontend/src/features/patients/components/wizards/AssistantExamenComplet.tsx').read_text(encoding='utf-8')

          assert 'onComplete(summary, [])' in endo
          assert 'Diagnostic et conduite thérapeutique : décision du praticien' in endo
          for banned in ['Traitement Canalaire (Endodontie)', "Extirpation pulpaire", 'Pulpite Irréversible Symptomatique', 'Nécrose pulpaire']:
              assert banned not in endo, banned

          assert 'return { diag: summary, steps: [], next: null };' in exam
          assert 'Ce questionnaire ne pose pas automatiquement de diagnostic et ne détermine pas de traitement.' in exam
          assert 'Diagnostic, examens complémentaires et conduite thérapeutique : décision du praticien après validation clinique.' in exam
          for banned in ['Antibioprophylaxie avant tout soin invasif', 'Amox 2g', 'Pulpectomie', 'Drainage chirurgical immédiat']:
              assert banned not in exam, banned
          print('Endo + Complete exam fail-closed contracts: OK')
          PY

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Frontend build
        working-directory: frontend
        run: npm run build

      - name: Commit rescued assistants
        run: |
          if git diff --quiet -- frontend/src/features/patients/components/wizards/AssistantEndo.tsx frontend/src/features/patients/components/wizards/AssistantExamenComplet.tsx; then
            echo 'Assistants already aligned.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/features/patients/components/wizards/AssistantEndo.tsx frontend/src/features/patients/components/wizards/AssistantExamenComplet.tsx
          git commit -m 'fix(patient): restore fail-closed Endo and complete exam'
          git push origin HEAD:${GITHUB_REF_NAME}
