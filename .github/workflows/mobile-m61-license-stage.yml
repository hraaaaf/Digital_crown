name: Mobile M6.1 License Fix Stage

on:
  push:
    branches: [audit/mobile-m6-generator]
    paths: [.github/workflows/mobile-m61-license-stage.yml]

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    env:
      BASE_SHA: 2bf0f639b198b5aacdd1f797f62ea9ac11aa9cff
      PRODUCT_SHA: 634892172ac8026a74a47d15de794a7f64c46d86
      PRODUCT_BRANCH: mobile/m6-security-first
      STAGE_BRANCH: audit/mobile-m61-blob-stage
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/mobile-m6-generator
          fetch-depth: 0

      - name: Build reviewed three-file correction
        run: |
          set -euo pipefail
          git fetch origin master "$PRODUCT_BRANCH"
          test "$(git rev-parse origin/master)" = "$BASE_SHA"
          test "$(git rev-parse origin/$PRODUCT_BRANCH)" = "$PRODUCT_SHA"
          git worktree add --detach /tmp/m61-fix "$PRODUCT_SHA"
          cd /tmp/m61-fix
          python - <<'PY'
          from pathlib import Path

          def replace_function(source: str, start_marker: str, end_marker: str, replacement: str) -> str:
              if source.count(start_marker) != 1 or source.count(end_marker) != 1:
                  raise SystemExit(f'function boundary mismatch: {start_marker!r} / {end_marker!r}')
              start = source.index(start_marker)
              end = source.index(end_marker, start)
              return source[:start] + replacement.rstrip() + '\n\n' + source[end:]

          path = Path('backend/main.py')
          src = path.read_text(encoding='utf-8')
          helper_and_web = '''def _effective_user_license_status(db, user):
              """Combine l'état propre du compte avec la licence source-of-truth du cabinet."""
              if not user:
                  return (False, "USER_NOT_FOUND")
              if user.email and user.email.lower() == _SUPERADMIN_EMAIL:
                  return (True, "OK")
              if user.is_suspended:
                  return (False, "SUSPENDED")
              if user.is_archived:
                  return (False, "ARCHIVED")

              license_owner = user
              if user.employer_id is not None:
                  license_owner = db.query(models.User).filter(models.User.id == user.employer_id).first()
                  if not license_owner:
                      return (False, "USER_NOT_FOUND")
                  if license_owner.is_suspended:
                      return (False, "SUSPENDED")
                  if license_owner.is_archived:
                      return (False, "ARCHIVED")

              if not license_owner.is_licensed:
                  return (False, "NOT_LICENSED")
              if license_owner.license_expires_at and datetime.utcnow() > license_owner.license_expires_at:
                  return (False, "LICENSE_EXPIRED")
              return (True, "OK")


          def _get_user_status_sync(email: str):
              with database.SessionLocal() as db:
                  user = db.query(models.User).filter(models.User.email == email).first()
                  return _effective_user_license_status(db, user)
          '''
          helper_and_web = '\n'.join(line[10:] if line.startswith('          ') else line for line in helper_and_web.splitlines())
          src = replace_function(src, 'def _get_user_status_sync(email: str):', 'async def get_user_license_status(email: str)', helper_and_web)
          mobile_fn = '''def _get_mobile_user_status_sync(user_id: int):
              with database.SessionLocal() as db:
                  user = db.query(models.User).filter(models.User.id == int(user_id)).first()
                  return _effective_user_license_status(db, user)
          '''
          mobile_fn = '\n'.join(line[10:] if line.startswith('          ') else line for line in mobile_fn.splitlines())
          src = replace_function(src, 'def _get_mobile_user_status_sync(user_id: int):', 'async def get_mobile_user_license_status(user_id: int)', mobile_fn)
          path.write_text(src, encoding='utf-8')

          path = Path('backend/tests/test_mobile_identity_security.py')
          src = path.read_text(encoding='utf-8')
          anchor = 'from backend import models\n'
          if src.count(anchor) != 1:
              raise SystemExit('identity import anchor mismatch')
          src = src.replace(anchor, anchor + 'import backend.main as backend_main\n', 1)
          old_sig = "def _user(db, *, email, role, employer_id=None, permissions=None, active=True, approval='approved'):"
          new_sig = "def _user(db, *, email, role, employer_id=None, permissions=None, active=True, approval='approved', licensed=True):"
          if src.count(old_sig) != 1 or src.count('        is_licensed=True,\n') != 1:
              raise SystemExit('identity helper anchor mismatch')
          src = src.replace(old_sig, new_sig, 1).replace('        is_licensed=True,\n', '        is_licensed=licensed,\n', 1)
          test_body = '''def test_mobile_mutation_uses_numeric_subject_as_user_id(client, db, dentiste):
              secretary = _user(
                  db,
                  email='license-inherited-mobile@cabinet.ma',
                  role=models.UserRole.SECRETAIRE,
                  employer_id=dentiste.id,
                  permissions={'agenda': True, 'patients': True},
                  licensed=False,
              )
              body = _claim(client, _pairing(db, dentiste, secretary)).json()
              response = client.post(
                  '/api/mobile/register-device',
                  json={'fcm_token': f'm6-license-{uuid.uuid4()}', 'platform': 'ios'},
                  headers={'Authorization': f"Bearer {body['access_token']}"},
              )
              assert response.status_code == 200, response.text

              dentiste.is_licensed = False
              db.commit()
              backend_main._license_cache.clear()
              denied = client.post(
                  '/api/mobile/register-device',
                  json={'fcm_token': f'm6-license-denied-{uuid.uuid4()}', 'platform': 'ios'},
                  headers={'Authorization': f"Bearer {body['access_token']}"},
              )
              assert denied.status_code == 403
              assert denied.json()['detail'] == 'NOT_LICENSED'
          '''
          test_body = '\n'.join(line[10:] if line.startswith('          ') else line for line in test_body.splitlines())
          src = replace_function(src, 'def test_mobile_mutation_uses_numeric_subject_as_user_id', 'def test_permissions_policy_allows_same_origin_camera_only', test_body)
          path.write_text(src, encoding='utf-8')

          path = Path('backend/tests/test_mobile_revocation_epoch.py')
          src = path.read_text(encoding='utf-8')
          marker = 'def _snapshot(client, token: str):'
          if src.count(marker) != 1:
              raise SystemExit('revocation snapshot marker mismatch')
          helper = '''def _paired_mobile_token(db, user):
              device_id = str(uuid.uuid4())
              db.add(models.MobilePairedDevice(
                  device_id=device_id,
                  user_id=user.id,
                  employer_id=user.get_employer_id(),
                  client_public_key_hex='04' + ('11' * 64),
                  refresh_jti=f'refresh-{uuid.uuid4().hex}',
              ))
              db.commit()
              role = user.role.value if hasattr(user.role, 'value') else str(user.role)
              return _create_mobile_jwt(user.id, role, user.get_employer_id(), device_id)


          '''
          helper = '\n'.join(line[10:] if line.startswith('          ') else line for line in helper.splitlines())
          src = src.replace(marker, helper + marker, 1)
          replacements = {
              'old_token = _create_mobile_jwt(dentiste.id, "DENTISTE")': 'old_token = _paired_mobile_token(db, dentiste)',
              'new_token = _create_mobile_jwt(dentiste.id, "DENTISTE")': 'new_token = _paired_mobile_token(db, dentiste)',
              'own_token = _create_mobile_jwt(dentiste.id, "DENTISTE")': 'own_token = _paired_mobile_token(db, dentiste)',
              'other_token = _create_mobile_jwt(other.id, "DENTISTE")': 'other_token = _paired_mobile_token(db, other)',
          }
          expected_counts = {
              'old_token = _create_mobile_jwt(dentiste.id, "DENTISTE")': 3,
              'new_token = _create_mobile_jwt(dentiste.id, "DENTISTE")': 1,
              'own_token = _create_mobile_jwt(dentiste.id, "DENTISTE")': 1,
              'other_token = _create_mobile_jwt(other.id, "DENTISTE")': 1,
          }
          for old, new in replacements.items():
              count = src.count(old)
              if count != expected_counts[old]:
                  raise SystemExit(f'revocation anchor mismatch {old!r}: {count}')
              src = src.replace(old, new)
          path.write_text(src, encoding='utf-8')
          PY

          git diff --check
          python -m py_compile backend/main.py backend/tests/test_mobile_identity_security.py backend/tests/test_mobile_revocation_epoch.py
          git diff --name-only | sort > /tmp/actual
          printf '%s\n' backend/main.py backend/tests/test_mobile_identity_security.py backend/tests/test_mobile_revocation_epoch.py | sort > /tmp/expected
          diff -u /tmp/expected /tmp/actual
          grep -q '_effective_user_license_status' backend/main.py
          grep -q 'licensed=False' backend/tests/test_mobile_identity_security.py
          grep -q '_paired_mobile_token' backend/tests/test_mobile_revocation_epoch.py

      - name: Materialize corrected staging tree only
        working-directory: /tmp/m61-fix
        run: |
          set -euo pipefail
          git config user.name "Digital Crown M6 Audit"
          git config user.email "123034021+hraaaaf@users.noreply.github.com"
          git add backend/main.py backend/tests/test_mobile_identity_security.py backend/tests/test_mobile_revocation_epoch.py
          git commit -m "audit(m6): stage cabinet-license inheritance fix"
          git push --force origin "HEAD:refs/heads/$STAGE_BRANCH"
