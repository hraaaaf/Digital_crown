name: Dashboard D1 Visual Proof V2

on:
  push:
    branches:
      - agent/dashboard-d1-visual-proof

jobs:
  capture-v2:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend and Playwright
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start Vite
        working-directory: frontend
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 >/tmp/vite.log 2>&1 &
          for i in {1..60}; do curl -fsS http://127.0.0.1:4173 >/dev/null && exit 0; sleep 1; done
          cat /tmp/vite.log
          exit 1
      - name: Capture dashboard directly
        working-directory: frontend
        run: |
          mkdir -p visual-proof-v2
          cat > capture-v2.mjs <<'JS'
          import { chromium } from 'playwright';

          const user = {id:1,email:'achraf@example.test',nom_complet:'Dr Achraf Benmoussa',role:'DENTISTE',employer_id:null,permissions:{},is_superadmin:false};
          const stats = {total_patients:1248,total_analyses:318,in_waiting:2,weekly_activity:[12,15,10,18,16,5,0],weekly_patient_counts:[9,12,8,14,13,4,0],weekly_patients:60,recent_patients:[{id:1,nom:'EL ALAMI',prenom:'Youssef',acte:'Consultation',time:'10:30',type:'CONSULTATION'},{id:2,nom:'BENNANI',prenom:'Salma',acte:'Détartrage',time:'09:45',type:'SOINS'}]};
          const responses = new Map([
            ['/health',{status:'ok'}],
            ['/api/auth/me',user],
            ['/api/clinics/init-status',{is_initialized:true}],
            ['/api/admin/cabinet/me',{header_lines_fr:['Dr Achraf Benmoussa']}],
            ['/api/admin/dashboard/stats',stats],
            ['/api/intelligence/alerts/today',{alerts:[]}],
            ['/api/intelligence/forecast-semaine',{week_start:'2026-08-16',week_end:'2026-08-22',rdv_count:31,forecast_revenue:28400,avg_per_rdv:916}],
            ['/api/intelligence/taux-conversion',{devis_count:18,converted_count:13,taux:72.2,avg_days:4.2}],
            ['/api/intelligence/projection-mensuelle',{historical:[],projections:[],avg_monthly:112000}],
            ['/api/intelligence/latent-cash',{total_opportunites:7,valeur_totale_latente:18600,opportunites:[]}],
            ['/api/stats/financial',{today_revenue:4200,month_revenue:68400,total_debt:12900}],
            ['/api/admin/cabinet-health',{database:{status:'ok',detail:null},disk:{status:'ok',free_gb:182.4,total_gb:476.8},backup_local:{status:'ok',overall_status:'SUCCESS',age_hours:2.1,run_id:'visual-proof'},offsite:{status:'NOT_CONFIGURED',offsite_status:null,db_copied:null,media_copied:null},overall_severity:'ok'}],
          ]);
          const browser = await chromium.launch({headless:true});
          for (const vp of [{name:'desktop-1280',width:1280,height:900},{name:'tablet-768',width:768,height:1024},{name:'mobile-430',width:430,height:932},{name:'mobile-390',width:390,height:844}]) {
            const context = await browser.newContext({viewport:{width:vp.width,height:vp.height}});
            const page = await context.newPage();
            await page.route('http://127.0.0.1:8005/**', async route => {
              const u = new URL(route.request().url());
              let body;
              if (u.pathname === '/api/appointments/') body = [{id:11,start_time:'2026-08-16T11:00:00',status:'EN_ATTENTE',patient:{id:3,nom:'TAZI',prenom:'Amine'}},{id:12,start_time:'2026-08-16T14:30:00',status:'CONFIRME',patient:{id:4,nom:'IDRISSI',prenom:'Nadia'}}];
              else if (u.pathname.startsWith('/api/patients/')) body = [];
              else if (u.pathname.includes('unread')) body = {count:0};
              else body = responses.get(u.pathname) ?? {};
              await route.fulfill({status:200,contentType:'application/json',headers:{'Access-Control-Allow-Origin':'http://127.0.0.1:4173','Access-Control-Allow-Credentials':'true'},body:JSON.stringify(body)});
            });
            await page.addInitScript(() => {
              const payload=btoa(JSON.stringify({exp:4102444800})).replaceAll('=','');
              localStorage.setItem('token',`e30.${payload}.x`);
              localStorage.setItem('digitalcrown_tour_completed','2.0');
              localStorage.setItem('digital_crown_tour_completed','true');
              localStorage.setItem('appMode','prod');
            });
            await page.goto('http://127.0.0.1:4173/dashboard',{waitUntil:'networkidle',timeout:60000});
            await page.waitForTimeout(3000);
            const bodyText = await page.locator('body').innerText();
            console.log(vp.name, page.url(), bodyText.slice(0,1000));
            if (!bodyText.includes('Bonjour')) throw new Error(`Dashboard non rendu pour ${vp.name}: ${bodyText.slice(0,300)}`);
            await page.screenshot({path:`visual-proof-v2/d1-${vp.name}.png`,fullPage:true});
            await context.close();
          }
          await browser.close();
          JS
          node capture-v2.mjs
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-d1-visual-proof-v2
          path: frontend/visual-proof-v2/*.png
          if-no-files-found: error
          retention-days: 7
