name: Clinic P3 Document Provenance Certification

on:
  pull_request:
    paths:
      - "backend/models_document_provenance_p3.py"
      - "backend/routers/document_provenance_p3.py"
      - "backend/routers/patient_practitioner_p2.py"
      - "backend/schemas/document_provenance_p3.py"
      - "backend/services/document_factory.py"
      - "backend/services/document_provenance_context.py"
      - "backend/services/honoraires_persistence.py"
      - "backend/services/practitioner_policy.py"
      - "backend/tests/test_document_provenance_p3.py"
      - "alembic/versions/f5a55e700005_add_document_provenance.py"
      - ".github/workflows/clinic-p3-document-provenance-cert.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clinic-p3-document-provenance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  provenance-contract:
    name: P3 provenance fail-closed invariants
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-only-secret-key-minimum-32-characters-long
      DATABASE_URL: "sqlite:///:memory:"
      ENVIRONMENT: development
      TELEMETRY_ENABLED: "false"
      CLOUD_AI_ENABLED: "false"
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Record exact head
        run: |
          HEAD_SHA=$(git rev-parse HEAD)
          EXPECTED_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$HEAD_SHA" = "$EXPECTED_SHA"
          echo "P3_HEAD=$HEAD_SHA" >> "$GITHUB_ENV"

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.12.0 torchvision==0.27.0 --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^(torch|torchvision)([<=>].*)?$' requirements.txt > /tmp/requirements-ci.txt
          pip install -r /tmp/requirements-ci.txt
          pip install httpx==0.27.2 pytest pytest-asyncio

      - name: Verify P3 governance anchors exist
        run: |
          test -f backend/tests/test_document_provenance_p3.py
          test -f backend/services/practitioner_policy.py
          test -f backend/models_document_provenance_p3.py
          grep -q "test_explicit_document_author_is_validated_fail_closed" backend/tests/test_document_provenance_p3.py
          grep -q "test_historical_schema_migration_preserves_row_and_does_not_backfill" backend/tests/test_document_provenance_p3.py
          grep -q "test_regenerated_file_reassigns_author_and_invalidates_old_signature" backend/tests/test_document_provenance_p3.py
          grep -q "Praticien non assignable dans ce cabinet" backend/services/practitioner_policy.py
          grep -q "Auteur praticien requis pour générer ce document" backend/services/practitioner_policy.py

      - name: Run P3 invariant suite
        run: python -m pytest backend/tests/test_document_provenance_p3.py -q --maxfail=1

      - name: Certification summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Clinic P3 Document Provenance
          - exact head: \`${P3_HEAD}\`
          - same-cabinet practitioner validation: enforced
          - inactive/pending/non-practitioner attribution: refused
          - non-practitioner actor without explicit clinical author: refused
          - historical documents: no provenance backfill
          - generated document: author recorded without forged signature
          - regenerated signed document: stale signature invalidated
          - stable document and cephalo generation facades: single P3 route
          EOF
