name: Patient P0-H PR Baseline

on:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/patient-p0h-pr-baseline.yml'
      - 'frontend/src/features/patients/PatientDetailsInner.tsx'
      - 'frontend/src/features/patients/components/PatientScoreBadge.tsx'
      - 'scripts/t2_runtime_server.py'
  workflow_dispatch:

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ENVIRONMENT: test
      SECRET_KEY: patient-p0h-pr-baseline-secret-000001
      DATABASE_URL: sqlite:///./t2-runtime-cert.db
      TELEMETRY_ENABLED: 'false'
      CLOUD_AI_ENABLED: 'false'
      DEBUG: 'false'
      ALLOWED_ORIGINS: 'http://127.0.0.1:5173,http://localhost:5173'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.12.0 torchvision==0.27.0 --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^(torch|torchvision)([<=>].*)?$' requirements.txt > /tmp/requirements-p0h.txt
          pip install -r /tmp/requirements-p0h.txt
          pip install httpx==0.27.2

      - name: Install frontend and Chromium
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Instrument existing enabled badge state without visual changes
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('frontend/src/features/patients/PatientDetailsInner.tsx')
          s=p.read_text(encoding='utf-8')
          old="  const show_patient_badges = useSettingsStore(state => state.profile.show_patient_badges);"
          if old not in s: raise SystemExit('PatientDetails badge setting source mismatch')
          p.write_text(s.replace(old,"  const show_patient_badges = true; // baseline-only existing enabled state",1),encoding='utf-8')
          b=Path('frontend/src/features/patients/components/PatientScoreBadge.tsx')
          s=b.read_text(encoding='utf-8')
          old='<div className={cn("relative", className)}>'
          if old not in s: raise SystemExit('PatientScoreBadge root mismatch')
          b.write_text(s.replace(old,'<div data-testid="patient-score-badge" className={cn("relative", className)}>',1),encoding='utf-8')
          PY

      - name: Start isolated backend
        run: |
          python scripts/t2_runtime_server.py > /tmp/p0h-backend.log 2>&1 &
          for i in {1..90}; do
            if curl -fsS http://127.0.0.1:8005/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/p0h-backend.log
          exit 1

      - name: Start frontend
        working-directory: frontend
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 > /tmp/p0h-front.log 2>&1 &
          for i in {1..90}; do
            if curl -fsS http://127.0.0.1:5173 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/p0h-front.log
          exit 1

      - name: Capture baseline
        working-directory: frontend
        run: |
          mkdir -p ../artifacts/p0h-pr-baseline
          cat > /tmp/p0h-baseline.mjs <<'JS'
          import fs from 'node:fs'; import path from 'node:path'; import { chromium, request } from 'playwright';
          const out=path.resolve('../artifacts/p0h-pr-baseline');
          const viewports=[{width:390,height:844},{width:430,height:932},{width:768,height:1024},{width:1280,height:900}];
          const api=await request.newContext({baseURL:'http://127.0.0.1:8005'});
          const login=await api.post('/api/auth/login',{form:{username:'t2-browser@cabinet.ma',password:'T2BrowserPass123!'}});
          if(!login.ok()) throw new Error(`login ${login.status()} ${await login.text()}`); const tok=await login.json();
          const ps=await api.get('/api/patients',{headers:{Authorization:`Bearer ${tok.access_token}`}}); if(!ps.ok()) throw new Error('patients fetch failed');
          const patient=(await ps.json()).find(p=>p.numero_dossier==='T2-0001'); if(!patient) throw new Error('T2 patient missing');
          const browser=await chromium.launch({headless:true}); const ev=[];
          for(const viewport of viewports){const ctx=await browser.newContext({viewport,colorScheme:'light'});const page=await ctx.newPage();await page.addInitScript(({a,r})=>{localStorage.setItem('token',a);localStorage.setItem('refresh_token',r||'');localStorage.setItem('appMode','prod');},{a:tok.access_token,r:tok.refresh_token});const errors=[];page.on('pageerror',e=>errors.push(String(e)));await page.goto(`http://127.0.0.1:5173/patients/${patient.id}?tab=tracking`,{waitUntil:'networkidle',timeout:90000});await page.waitForTimeout(700);const badgeCount=await page.getByTestId('patient-score-badge').count();const m=await page.evaluate(()=>({scrollWidth:document.documentElement.scrollWidth,clientWidth:document.documentElement.clientWidth,noHorizontalOverflow:document.documentElement.scrollWidth<=document.documentElement.clientWidth+2}));const screenshot=`before-${viewport.width}x${viewport.height}.png`;await page.screenshot({path:path.join(out,screenshot),fullPage:false});ev.push({viewport,badgeCount,metrics:m,errors,screenshot});await ctx.close();}
          fs.writeFileSync(path.join(out,'evidence.json'),JSON.stringify(ev,null,2));
          fs.writeFileSync(path.join(out,'summary.json'),JSON.stringify({captures:ev.length,badgeVisibleEverywhere:ev.every(x=>x.badgeCount===1),overflowFindings:ev.filter(x=>!x.metrics.noHorizontalOverflow),runtimeErrors:ev.filter(x=>x.errors.length)},null,2));
          await browser.close();await api.dispose();
          if(ev.some(x=>x.badgeCount!==1)||ev.some(x=>!x.metrics.noHorizontalOverflow)||ev.some(x=>x.errors.length)) process.exit(1);
          JS
          node /tmp/p0h-baseline.mjs

      - name: Upload baseline
        uses: actions/upload-artifact@v4
        with:
          name: patient-p0h-pr-baseline
          path: artifacts/p0h-pr-baseline
          if-no-files-found: error
          retention-days: 14
