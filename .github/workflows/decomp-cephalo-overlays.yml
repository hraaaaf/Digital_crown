name: DECOMP P0-B Cephalo overlays

on:
  pull_request:
    branches: [master]
    paths:
      - 'scripts/decomp_cephalo_overlays.py'
      - '.github/workflows/decomp-cephalo-overlays.yml'

permissions:
  contents: write

jobs:
  refactor-and-verify:
    if: github.head_ref == 'agent/decomp-p0-large-files'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/decomp-p0-large-files
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply guarded cephalo overlay extraction
        run: python scripts/decomp_cephalo_overlays.py
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: TypeScript exact check
        working-directory: frontend
        run: npx tsc -b --pretty false
      - name: Verify intended diff only
        run: |
          python - <<'PY'
          import subprocess
          expected = {
              'frontend/src/features/ortho/CephaloTracingLayer.tsx',
              'frontend/src/features/ortho/components/CephaloCalibrationOverlay.tsx',
              'frontend/src/features/ortho/components/CephaloMagnifierOverlay.tsx',
          }
          lines = subprocess.check_output(['git', 'status', '--short', '-uall'], text=True).splitlines()
          paths = {line[3:] for line in lines if line.strip()}
          if paths != expected:
              raise SystemExit(f'Unexpected cephalo overlay diff: {sorted(paths)}')
          PY
      - name: Commit verified cephalo overlay extraction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- frontend/src/features/ortho/CephaloTracingLayer.tsx frontend/src/features/ortho/components/CephaloCalibrationOverlay.tsx frontend/src/features/ortho/components/CephaloMagnifierOverlay.tsx
          git commit -m 'refactor(ortho): extract cephalo overlays'
          git push origin HEAD:agent/decomp-p0-large-files
