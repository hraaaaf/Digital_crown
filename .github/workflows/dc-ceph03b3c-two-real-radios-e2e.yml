name: DC Cephalo 03B3c two real public radiographs E2E
on:
  push:
    branches:
      - feat/dc-ceph03b3c-two-real-cephalo-e2e-20261012
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-real-radio-http-sqlite:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BASE_HEAD: fc211f7d50f0db47c00e92be8ad7804c95113ab8
      ENVIRONMENT: test
      DIGITALCROWN_ISOLATED_RUNTIME: 'true'
      TELEMETRY_ENABLED: 'false'
      CLOUD_AI_ENABLED: 'false'
      DEBUG: 'false'
      DATABASE_URL: 'sqlite:///:memory:'
      SECRET_KEY: 'test-only-ceph03b3c-exact-head-20261012'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify source HEAD and no production or mobile diff
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "hraaaaf/Digital_crown"
          test "$GITHUB_REF" = "refs/heads/feat/dc-ceph03b3c-two-real-cephalo-e2e-20261012"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git merge-base HEAD "$BASE_HEAD")" = "$BASE_HEAD"
          while IFS= read -r file; do
            case "$file" in
              backend/tests/test_ceph03b3c_two_real_cephalograms_e2e.py | \
              frontend/scripts/fixtures/dc-ceph03b3c-public-cephalograms.json | \
              .github/workflows/dc-ceph03b3c-two-real-radios-e2e.yml | \
              frontend/scripts/capture-dc-ceph03b3c-real-radios.mjs | \
              frontend/src/features/ortho/CephaloTracingLayer.realRadioFixture.tsx) ;;
              *) echo "HORS SCOPE: $file" >&2; exit 1;;
            esac
          done < <(git diff --name-only "$BASE_HEAD" "$GITHUB_SHA")
          echo "DC_CEPH03B3C_HEAD=$GITHUB_SHA"
          echo "DC_CEPH03B3C_REAL_PATIENT_DATA=false"
          echo "DC_CEPH03B3C_PROD_DATABASE=false"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download two Commons X-rays; verify publisher SHA-1 and JPEG metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dc-ceph03b3c-real-radios"
          export DC_CEPH03B3C_RADIO_DIR="$RUNNER_TEMP/dc-ceph03b3c-real-radios"
          echo "DC_CEPH03B3C_RADIO_DIR=$DC_CEPH03B3C_RADIO_DIR" >> "$GITHUB_ENV"
          python - <<'PY'
          import hashlib, json, os, pathlib, urllib.request
          base=pathlib.Path(os.environ['DC_CEPH03B3C_RADIO_DIR'])
          manifest=json.loads(pathlib.Path('frontend/scripts/fixtures/dc-ceph03b3c-public-cephalograms.json').read_text())
          assert len(manifest['images'])==2
          for item in manifest['images']:
              assert item['license']=='CC BY-SA 4.0' and item['source_page'].startswith('https://commons.wikimedia.org/')
              req=urllib.request.Request(item['url'],headers={
                  'User-Agent':'DigitalCrown-Cephalo-CI/1.0 (testing openly licensed Wikimedia Commons radiographs)',
                  'Accept':'image/jpeg',
                  'Referer':item['source_page'],
              })
              with urllib.request.urlopen(req,timeout=60) as response:
                  assert response.status==200
                  data=response.read(11*1024*1024)
              assert len(data)==item['size_bytes'],(item['id'],'byte count',len(data))
              assert hashlib.sha1(data).hexdigest()==item['sha1'],(item['id'],'source checksum')
              assert data[:3]==b'\xff\xd8\xff' and data[-2:]==b'\xff\xd9',(item['id'],'JPEG')
              (base/item['file_name']).write_bytes(data)
              print('PUBLIC_RADIO_SOURCE_VERIFIED',item['id'],len(data),hashlib.sha256(data).hexdigest(),item['source_page'])
          PY
      - name: Install isolated backend test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install torch==2.12.0 torchvision==0.27.0 --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^(torch|torchvision)([<=>].*)?$' requirements.txt >/tmp/dc-ceph03b3c-python-requirements.txt
          pip install -r /tmp/dc-ceph03b3c-python-requirements.txt
      - name: Authenticated two-radio upload and committed SQLite read-after-write
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q -s \
            backend/tests/test_ceph03b3c_two_real_cephalograms_e2e.py
          echo "DC_CEPH03B3C_AUTHENTICATED_TWO_RADIO_SQLITE_PASS"
      - name: Publish tested public image provenance metadata only
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/dc-ceph03b3c-proof
          cp frontend/scripts/fixtures/dc-ceph03b3c-public-cephalograms.json /tmp/dc-ceph03b3c-proof/source-manifest.json
          printf 'HEAD=%s\nSCOPE=isolated SQLite only\nIMAGES=two Commons CC BY-SA 4.0 originals\nMODEL_INFERENCE=stubbed; nonclinical\n' "$GITHUB_SHA" > /tmp/dc-ceph03b3c-proof/scope.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dc-ceph03b3c-two-real-radios-e2e-proof
          path: /tmp/dc-ceph03b3c-proof
          retention-days: 10
          if-no-files-found: warn
