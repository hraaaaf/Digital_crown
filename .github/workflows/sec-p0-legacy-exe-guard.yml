name: SEC-P0 Legacy EXE Builder Guard

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "scripts/build_exe.py"
      - "backend/tests/test_legacy_build_exe_disabled.py"
      - ".github/workflows/sec-p0-legacy-exe-guard.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sec-p0-legacy-exe-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  legacy-builder-fail-closed:
    name: Legacy EXE fail-closed (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          python -c "import os, subprocess;
          actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip();
          expected = os.environ['EXPECTED_SHA'];
          print('checkout_sha=' + actual);
          assert actual == expected, 'SEC-P0 checkout SHA mismatch'"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install isolated test dependency
        run: python -m pip install pytest==8.4.2

      - name: Required regression tests — no EXE build or credential copying
        run: python -m pytest -q backend/tests/test_legacy_build_exe_disabled.py
