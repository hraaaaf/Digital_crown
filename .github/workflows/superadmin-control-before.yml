name: Superadmin Control BEFORE

on:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/superadmin-control-before.yml'

permissions:
  contents: read

jobs:
  before:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout frozen authorized BEFORE head
        uses: actions/checkout@v4
        with:
          ref: 31a02d17616b31b736fa25343b26deefd4335f5f

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend and Chromium
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Materialize authorized BEFORE harness
        working-directory: frontend
        run: |
          cat > superadmin-control-before.html <<'EOF'
          <!doctype html><html lang="fr"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>Superadmin control BEFORE</title></head><body><div id="root"></div><script type="module" src="/src/superadmin-control-before.tsx"></script></body></html>
          EOF
          cat > src/superadmin-control-before.tsx <<'EOF'
          import React from 'react';
          import { createRoot } from 'react-dom/client';
          import { MemoryRouter } from 'react-router-dom';
          import { Toaster } from 'react-hot-toast';
          import './index.css';
          import { SuperAdminDashboard } from './features/superadmin/SuperAdminDashboard';
          createRoot(document.getElementById('root')!).render(
            <React.StrictMode>
              <MemoryRouter initialEntries={['/super-admin']}>
                <SuperAdminDashboard />
                <Toaster />
              </MemoryRouter>
            </React.StrictMode>,
          );
          EOF
          cat > superadmin-control-before.mjs <<'EOF'
          import { chromium } from 'playwright';
          import { createServer } from 'vite';
          import fs from 'node:fs/promises';
          const output='../artifacts/superadmin-control-before';
          await fs.mkdir(output,{recursive:true});
          const viewports=[{width:390,height:844},{width:430,height:932},{width:768,height:1024},{width:1280,height:800}];
          const server=await createServer({server:{host:'127.0.0.1',port:4179,strictPort:true},clearScreen:false}); await server.listen();
          const browser=await chromium.launch({headless:true}); const evidence=[];
          try {
            for (const viewport of viewports) {
              const context=await browser.newContext({viewport,colorScheme:'light'}); const page=await context.newPage(); const responses=[]; const pageErrors=[];
              page.on('pageerror',e=>pageErrors.push(String(e)));
              await page.route('**/*',async route=>{
                const req=route.request(); const url=new URL(req.url());
                if(url.port==='8005'&&url.pathname==='/api/superadmin/clients') {responses.push({path:url.pathname,status:200}); return route.fulfill({status:200,contentType:'application/json',body:'[]'});}
                if(url.port==='8005'&&url.pathname==='/api/superadmin/trial-codes') {responses.push({path:url.pathname,status:200}); return route.fulfill({status:200,contentType:'application/json',body:'[]'});}
                return route.continue();
              });
              await page.goto('http://127.0.0.1:4179/superadmin-control-before.html',{waitUntil:'networkidle',timeout:60000}); await page.waitForTimeout(800);
              const shellTitle=await page.getByText('SuperAdmin',{exact:true}).count();
              const activationForm=await page.getByText("Générer un code d'activation",{exact:true}).count();
              const devices=await page.getByText('Devices',{exact:true}).count();
              const releaseChannel=await page.getByText('Canal de diffusion',{exact:true}).count();
              const operators=await page.getByText('Opérateurs plateforme',{exact:true}).count();
              const audit=await page.getByText("Journal d'audit",{exact:true}).count();
              const horizontalOverflow=await page.evaluate(()=>document.documentElement.scrollWidth>document.documentElement.clientWidth+2);
              const screenshot=`before-control-${viewport.width}x${viewport.height}.png`;
              await page.screenshot({path:`${output}/${screenshot}`,fullPage:true,animations:'disabled'});
              evidence.push({viewport,screenshot,responses,shellTitle,activationForm,devices,releaseChannel,operators,audit,horizontalOverflow,pageErrors});
              await context.close();
            }
          } finally { await browser.close(); await server.close(); }
          const report={phase:'BEFORE',baseline_sha:'31a02d17616b31b736fa25343b26deefd4335f5f',goal:'Prove authorized Superadmin dashboard lacks device, release-channel, platform-operator and audit controls before control-plane UI implementation.',viewports,captures:evidence.length,evidence};
          await fs.writeFile(`${output}/report.json`,JSON.stringify(report,null,2));
          const invalid=evidence.some(i=>i.responses.length<2||i.responses.some(r=>r.status!==200)||i.shellTitle<1||i.activationForm<1||i.devices!==0||i.releaseChannel!==0||i.operators!==0||i.audit!==0||i.horizontalOverflow||i.pageErrors.length>0);
          if(invalid) process.exit(1);
          EOF

      - name: Capture exact authorized BEFORE
        working-directory: frontend
        run: node superadmin-control-before.mjs

      - name: Upload immutable authorized BEFORE evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: superadmin-control-before-31a02d17
          path: artifacts/superadmin-control-before
          if-no-files-found: error
          retention-days: 14
