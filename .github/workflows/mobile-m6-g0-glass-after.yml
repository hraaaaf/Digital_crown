name: Mobile M6-G0 Glass AFTER

on:
  push:
    branches:
      - "audit/mobile-m6-g0-glass-before-20260825"
    paths:
      - ".github/workflows/mobile-m6-g0-glass-after.yml"

permissions:
  contents: read

jobs:
  after:
    name: M6-G0 glass exact-head AFTER
    runs-on: ubuntu-latest
    env:
      PRODUCT_HEAD: d5c13f02233304c809984052ff518b1e78807a6a
    steps:
      - name: Checkout audit evidence
        uses: actions/checkout@v4
        with:
          path: audit

      - name: Checkout exact product HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PRODUCT_HEAD }}
          path: product

      - name: Assert exact product HEAD
        run: test "$(git -C product rev-parse HEAD)" = "$PRODUCT_HEAD"

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: product/frontend/package-lock.json

      - name: Install frontend and Chromium
        working-directory: product/frontend
        run: |
          npm ci
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.62.1
          npx playwright install --with-deps chromium

      - name: Materialize versioned AFTER harness
        run: |
          cp audit/.audit/mobile-m6-g0-after.html product/frontend/mobile-m6-g0-after.html
          cp audit/.audit/mobile-m6-g0-after.tsx product/frontend/src/mobile-m6-g0-after.tsx
          cp audit/.audit/mobile-m6-g0-after.mjs product/frontend/mobile-m6-g0-after.mjs

      - name: Capture and assert glass AFTER
        working-directory: product/frontend
        run: PRODUCT_HEAD="$PRODUCT_HEAD" node mobile-m6-g0-after.mjs

      - name: Upload AFTER artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobile-m6-g0-glass-after
          path: product/frontend/mobile-m6-g0-after-artifacts/
          if-no-files-found: error
          retention-days: 14
