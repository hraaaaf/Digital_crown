name: Patient P6 Stack Sync

on:
  pull_request:
    branches:
      - agent/patient-page-p5-documents
    paths:
      - '.github/workflows/patient-p6-stack-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    if: github.head_ref == 'agent/patient-page-p6-finances-identite'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Merge current P5 base into P6 stack
        run: |
          git config user.name 'digital-crown-ci'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin agent/patient-page-p5-documents

          set +e
          git merge --no-commit --no-ff origin/agent/patient-page-p5-documents
          merge_status=$?
          set -e

          if [ "$merge_status" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            printf 'Merge conflicts:\n%s\n' "$conflicts"
            unexpected="$(printf '%s\n' "$conflicts" | grep -vE '^(backend/routers/__init__\.py|frontend/src/features/patients/PatientDetailsInner\.tsx)$' || true)"
            if [ -n "$unexpected" ]; then
              echo "Unexpected P5/P6 conflicts:"
              printf '%s\n' "$unexpected"
              git merge --abort
              exit 1
            fi

            # P5 is the authoritative stack base. Start from its two conflicted files,
            # then re-apply only the narrow P6 finance/RBAC deltas.
            git checkout --theirs backend/routers/__init__.py
            git checkout --theirs frontend/src/features/patients/PatientDetailsInner.tsx

            python - <<'PY'
          from pathlib import Path

          routers = Path('backend/routers/__init__.py')
          text = routers.read_text(encoding='utf-8')
          import_anchor = 'from . import patient_clinical_conclusions as patient_clinical_conclusions\n'
          assert import_anchor in text
          assert 'patient_financial_p6' not in text
          text = text.replace(
              import_anchor,
              import_anchor + 'from . import patient_financial_p6 as patient_financial_p6\n',
              1,
          )

          include_anchor = 'patients.router.include_router(patient_odontogram.router)\n'
          assert include_anchor in text
          assert '/{patient_id}/financial-snapshot' not in text
          finance_override = '''# P6 replaces the legacy finance snapshot route rather than registering a duplicate
          # GET handler for the same path. The legacy implementation could turn an absent
          # billing basis into a misleading zero balance.
          patients.router.routes = [
              route
              for route in patients.router.routes
              if not (
                  getattr(route, "path", None) == "/{patient_id}/financial-snapshot"
                  and "GET" in (getattr(route, "methods", set()) or set())
              )
          ]

          '''
          text = text.replace(include_anchor, finance_override + include_anchor, 1)

          p4_include = 'patients.router.include_router(patient_journey_p4.router)\n'
          assert p4_include in text
          text = text.replace(
              p4_include,
              p4_include + 'patients.router.include_router(patient_financial_p6.router)\n',
              1,
          )
          routers.write_text(text, encoding='utf-8')

          details = Path('frontend/src/features/patients/PatientDetailsInner.tsx')
          text = details.read_text(encoding='utf-8')

          old_permissions = '''  const user = useAuthStore(state => state.user);
            const canClinical = !user?.employer_id || Boolean(user?.permissions?.clinical);
            const role = userRoleValue(user?.role);
            const permissions = user?.permissions || {};
            const hasExplicitPermissions = Object.keys(permissions).length > 0;
            const ownerOrAdmin = Boolean(user && (!user.employer_id || role === 'ADMIN'));
            const legacyDentistEmployee = Boolean(user?.employer_id && role === 'DENTISTE' && !hasExplicitPermissions);
            const canPanoramic = ownerOrAdmin || legacyDentistEmployee || Boolean(hasExplicitPermissions && permissions.panoramic === true);
            const canCephalo = ownerOrAdmin || legacyDentistEmployee || Boolean(hasExplicitPermissions && permissions.cephalo === true);
          '''
          new_permissions = '''  const user = useAuthStore(state => state.user);
            const role = userRoleValue(user?.role);
            const userPermissions = user?.permissions || {};
            const hasExplicitPermissions = Object.keys(userPermissions).length > 0;
            const ownerOrAdmin = Boolean(user && (role === 'ADMIN' || (role === 'DENTISTE' && !user.employer_id)));
            const canClinical = ownerOrAdmin || Boolean(userPermissions.clinical === true);
            const legacyDentistEmployee = Boolean(user?.employer_id && role === 'DENTISTE' && !hasExplicitPermissions);
            const canPanoramic = ownerOrAdmin || legacyDentistEmployee || Boolean(hasExplicitPermissions && userPermissions.panoramic === true);
            const canCephalo = ownerOrAdmin || legacyDentistEmployee || Boolean(hasExplicitPermissions && userPermissions.cephalo === true);
            const canFinance = Boolean(
              ownerOrAdmin ||
              (hasExplicitPermissions && (userPermissions.accounting === true || userPermissions.payments === true))
            );
          '''
          assert old_permissions in text
          text = text.replace(old_permissions, new_permissions, 1)

          clinical_guard = '''  useEffect(() => {
            if (!canClinical && activeTab === 'clinical') {
              setSearchParams({ tab: 'tracking' }, { replace: true });
            }
          }, [canClinical, activeTab, setSearchParams]);
          '''
          finance_guard = clinical_guard + '''
            useEffect(() => {
              if (!canFinance && activeTab === 'finances') {
                setIsPayModalOpen(false);
                setSearchParams({ tab: 'tracking' }, { replace: true });
              }
            }, [canFinance, activeTab, setSearchParams]);
          '''
          assert text.count(clinical_guard) == 1
          text = text.replace(clinical_guard, finance_guard, 1)

          old_actions = '<div className="grid grid-cols-4 gap-2 w-full xl:w-auto" aria-label="Actions rapides patient">'
          new_actions = "<div className={cn('grid gap-2 w-full xl:w-auto', canFinance ? 'grid-cols-4' : 'grid-cols-3')} aria-label=\"Actions rapides patient\">"
          assert text.count(old_actions) == 1
          text = text.replace(old_actions, new_actions, 1)

          old_pay_action = '<QuickAction icon={<Banknote size={18} />} label="Encaisser" onClick={() => setIsPayModalOpen(true)} accent="emerald" />'
          new_pay_action = '{canFinance && <QuickAction icon={<Banknote size={18} />} label="Encaisser" onClick={() => setIsPayModalOpen(true)} accent="emerald" />}'
          assert text.count(old_pay_action) == 1
          text = text.replace(old_pay_action, new_pay_action, 1)

          old_finance_tab = '<TabButton active={activeTab === \'finances\'} onClick={() => handleTabChange(\'finances\')} icon={<Banknote size={17} />} label="Finances" />'
          new_finance_tab = '{canFinance && <TabButton active={activeTab === \'finances\'} onClick={() => handleTabChange(\'finances\')} icon={<Banknote size={17} />} label="Finances" />}'
          assert text.count(old_finance_tab) == 1
          text = text.replace(old_finance_tab, new_finance_tab, 1)

          old_finance_render = "{activeTab === 'finances' && <PatientFinances patientId={Number(id)} />}"
          new_finance_render = "{canFinance && activeTab === 'finances' && <PatientFinances patientId={Number(id)} />}"
          assert text.count(old_finance_render) == 1
          text = text.replace(old_finance_render, new_finance_render, 1)

          old_modal = '<QuickPayModal isOpen={isPayModalOpen} onClose={() => setIsPayModalOpen(false)} patientId={Number(id)} />'
          new_modal = '''{canFinance && (
                <QuickPayModal isOpen={isPayModalOpen} onClose={() => setIsPayModalOpen(false)} patientId={Number(id)} />
              )}'''
          assert text.count(old_modal) == 1
          text = text.replace(old_modal, new_modal, 1)

          details.write_text(text, encoding='utf-8')
          PY

            git add backend/routers/__init__.py frontend/src/features/patients/PatientDetailsInner.tsx
          fi

          if git diff --name-only --diff-filter=U | grep -q .; then
            echo 'Unresolved merge conflicts remain.'
            git diff --name-only --diff-filter=U
            exit 1
          fi

          git diff --check
          git commit -m 'sync(patient): merge current P5 into P6 stack'
          git push origin HEAD:${GITHUB_HEAD_REF}
