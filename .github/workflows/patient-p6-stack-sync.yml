name: Patient P6 Stack Sync

on:
  pull_request:
    branches:
      - agent/patient-page-p5-documents
    paths:
      - '.github/workflows/patient-p6-stack-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    if: github.head_ref == 'agent/patient-page-p6-finances-identite'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Merge current P5 base into P6 stack
        run: |
          git config user.name 'digital-crown-ci'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin agent/patient-page-p5-documents
          git merge --no-edit origin/agent/patient-page-p5-documents
          git push origin HEAD:${GITHUB_HEAD_REF}
