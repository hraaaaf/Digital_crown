name: PC-07 AFTER Visual Evidence

on:
  pull_request:
    branches: [master]
    paths:
      - .github/workflows/pc07-after-visual.yml
      - frontend/scripts/capture-pc07-after.mjs
      - frontend/src/features/patient-companion/**
      - backend/services/patient_companion_emergency_photo.py
      - docs/clinic/patient_companion/PC_07_*.md

concurrency:
  group: pc07-after-${{ github.ref }}
  cancel-in-progress: true

jobs:
  after:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium webkit
      - name: Start AFTER
        shell: bash
        run: |
          cd frontend
          npm run dev -- --host 127.0.0.1 --port 5183 >/tmp/pc07-after.log 2>&1 &
          for i in {1..60}; do curl -fsS http://127.0.0.1:5183/ >/dev/null && break || sleep 1; done
      - name: Capture AFTER
        working-directory: frontend
        env:
          PC07_AFTER_URL: http://127.0.0.1:5183
          PC07_EVIDENCE_DIR: ../artifacts/pc07-emergency-photo-after
        run: node scripts/capture-pc07-after.mjs
      - name: Assert evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          items=json.loads(Path("artifacts/pc07-emergency-photo-after/evidence.json").read_text())
          assert len(items)==16
          assert {x["state"] for x in items} == {"idle","preview","pending","success"}
          assert all(not x["horizontalOverflow"] for x in items)
          assert all(all(c["height"] >= 44 for c in x["controls"]) for x in items)
          print("pc07_after=PASS")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pc07-emergency-photo-after
          path: artifacts/pc07-emergency-photo-after
          if-no-files-found: error
          retention-days: 30
