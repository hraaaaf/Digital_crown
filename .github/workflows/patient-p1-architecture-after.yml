name: Patient P1 Architecture After

on:
  pull_request:
    branches: [master]
    paths:
      - 'frontend/src/features/patients/PatientDetailsInner.tsx'
      - 'docs/PATIENT_P1_ARCHITECTURE_GOAL.md'
      - '.github/workflows/patient-p1-architecture-after.yml'

permissions:
  contents: read

jobs:
  after:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ENVIRONMENT: test
      SECRET_KEY: patient-p1-after-secret-000001
      DATABASE_URL: sqlite:///./t2-runtime-cert.db
      TELEMETRY_ENABLED: 'false'
      CLOUD_AI_ENABLED: 'false'
      DEBUG: 'false'
      ALLOWED_ORIGINS: 'http://127.0.0.1:5173,http://localhost:5173'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: P1 source architecture contract
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('frontend/src/features/patients/PatientDetailsInner.tsx').read_text(encoding='utf-8')
          for required in ['Vue d’ensemble','Clinique','Imagerie','Documents','Finances','Créer','Historique']:
              assert required in s, required
          for removed in ['Radiologie (IA)','Documents A5','Archives & Historique']:
              assert removed not in s, removed
          assert "active={isDocuments}" in s
          assert "documentView === 'create'" in s
          assert "documentView === 'history'" in s
          assert '<DocumentHub' in s and '<PatientDocuments' in s
          PY
      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.12.0 torchvision==0.27.0 --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^(torch|torchvision)([<=>].*)?$' requirements.txt > /tmp/requirements-p1-after.txt
          pip install -r /tmp/requirements-p1-after.txt
          pip install httpx==0.27.2
      - name: Install frontend and Chromium
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Frontend tests and build
        working-directory: frontend
        run: |
          npm test -- --run
          npm run build
      - name: Start backend
        run: |
          rm -f t2-runtime-cert.db
          python scripts/t2_runtime_server.py > /tmp/p1-after-backend.log 2>&1 &
          for i in {1..90}; do if curl -fsS http://127.0.0.1:8005/health >/dev/null; then exit 0; fi; sleep 1; done
          cat /tmp/p1-after-backend.log
          exit 1
      - name: Start frontend
        working-directory: frontend
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 > /tmp/p1-after-front.log 2>&1 &
          for i in {1..90}; do if curl -fsS http://127.0.0.1:5173 >/dev/null; then exit 0; fi; sleep 1; done
          cat /tmp/p1-after-front.log
          exit 1
      - name: Capture P1 AFTER
        working-directory: frontend
        run: |
          mkdir -p ../artifacts/p1-architecture-after
          cat > .p1-after.mjs <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import { chromium, request } from 'playwright';
          const out=path.resolve('../artifacts/p1-architecture-after');
          const viewports=[{width:390,height:844},{width:430,height:932},{width:768,height:1024},{width:1280,height:900}];
          const api=await request.newContext({baseURL:'http://127.0.0.1:8005'});
          const login=await api.post('/api/auth/login',{form:{username:'t2-browser@cabinet.ma',password:'T2BrowserPass123!'}});
          if(!login.ok()) throw new Error(await login.text());
          const tok=await login.json(); const headers={Authorization:`Bearer ${tok.access_token}`};
          const ps=await api.get('/api/patients',{headers});
          const patient=(await ps.json()).find(p=>p.numero_dossier==='T2-0001');
          if(!patient) throw new Error('T2 patient missing');
          const browser=await chromium.launch({headless:true}); const evidence=[];
          for(const viewport of viewports){
            const ctx=await browser.newContext({viewport,colorScheme:'light'}); const page=await ctx.newPage();
            await page.addInitScript(({a,r})=>{localStorage.setItem('token',a);localStorage.setItem('refresh_token',r||'');localStorage.setItem('appMode','prod');},{a:tok.access_token,r:tok.refresh_token});
            const errors=[]; const http5xx=[];
            page.on('pageerror',e=>errors.push(String(e)));
            page.on('response',r=>{if(r.status()>=500)http5xx.push({url:r.url(),status:r.status()});});
            await page.goto(`http://127.0.0.1:5173/patients/${patient.id}`,{waitUntil:'networkidle',timeout:90000});
            await page.waitForTimeout(1800);
            for(const label of ['Vue d’ensemble','Clinique','Imagerie','Documents','Finances']){
              if(await page.getByText(label,{exact:true}).count()===0) throw new Error(`main tab missing: ${label} @ ${viewport.width}`);
            }
            const body=await page.locator('body').innerText();
            for(const bad of ['Radiologie (IA)','Documents A5','Archives & Historique']) if(body.includes(bad)) throw new Error(`legacy label visible: ${bad}`);
            const overflow=await page.evaluate(()=>document.documentElement.scrollWidth>document.documentElement.clientWidth+2);
            await page.getByText('Documents',{exact:true}).first().click();
            await page.waitForTimeout(500);
            if(await page.getByText('Créer',{exact:true}).count()===0 || await page.getByText('Historique',{exact:true}).count()===0) throw new Error('document subnav missing');
            await page.getByText('Historique',{exact:true}).first().click();
            await page.waitForTimeout(500);
            const historyVisible=(await page.getByPlaceholder("Rechercher dans l'historique...").count())>0 || (await page.getByText(/Documents$/).count())>0;
            if(!historyVisible) throw new Error('document history inaccessible');
            await page.getByText('Vue d’ensemble',{exact:true}).first().click();
            await page.waitForTimeout(350);
            const shot=`p1-after-${viewport.width}x${viewport.height}.png`;
            await page.screenshot({path:path.join(out,shot),fullPage:false});
            evidence.push({viewport,overflow,errors,http5xx,shot});
            await ctx.close();
          }
          const summary={captures:evidence.length,noHorizontalOverflow:evidence.every(x=>!x.overflow),runtimeErrors:evidence.filter(x=>x.errors.length),http5xx:evidence.filter(x=>x.http5xx.length),mainSpaces:5,documentsMerged:true};
          fs.writeFileSync(path.join(out,'evidence.json'),JSON.stringify(evidence,null,2));
          fs.writeFileSync(path.join(out,'summary.json'),JSON.stringify(summary,null,2));
          await browser.close(); await api.dispose();
          if(summary.captures!==4||!summary.noHorizontalOverflow||summary.runtimeErrors.length||summary.http5xx.length) process.exit(1);
          JS
          node .p1-after.mjs
          rm .p1-after.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: patient-p1-architecture-after
          path: artifacts/p1-architecture-after
          if-no-files-found: error
          retention-days: 14
