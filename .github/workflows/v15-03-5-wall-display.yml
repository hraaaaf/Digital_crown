name: V1.5-03.5 Wall Display Proof

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v15-03-5-wall-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
  cancel-in-progress: false

jobs:
  targeted-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ENVIRONMENT: test
      SECRET_KEY: v15-03-5-wall-proof-secret-long-enough
      DATABASE_URL: sqlite:///./v15-03-5-test.db
      TELEMETRY_ENABLED: "false"
      CLOUD_AI_ENABLED: "false"
      DEBUG: "false"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.10.0 torchvision==0.25.0 torchaudio==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^(torch|torchvision|torchaudio)([<=>].*)?$' requirements.txt >/tmp/requirements-v15-03-5.txt
          pip install -r /tmp/requirements-v15-03-5.txt

      - name: Backend wall + station regression
        run: python -m pytest backend/tests/test_station_patient_session_v15.py -q

      - name: Frontend dependencies + Chromium
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Frontend targeted tests
        working-directory: frontend
        run: |
          npx vitest run src/features/hub/StationWallDisplay.test.tsx src/features/admin/Settings/hooks/useSettingsStore.test.ts src/features/admin/Settings/tabs/ProfileTabWallDisplay.test.tsx src/features/dashboard/components/WaitingRoomWallCall.test.tsx src/components/mobile/OfflineQueueViewer.g8Interactive.test.tsx src/features/hub/StationKioskShell.test.tsx src/features/hub/StationAppointmentArrival.test.tsx

      - name: Frontend build
        working-directory: frontend
        run: npm run build

      - name: Assert 03.5 wall runtime ownership unchanged
        run: |
          git fetch origin master --depth=1
          if ! git diff --quiet origin/master -- \
            backend/services/station_wall_display.py \
            frontend/src/features/hub/StationWallDisplay.tsx \
            frontend/src/services/stationWallDisplay.ts; then
            git diff origin/master -- \
              backend/services/station_wall_display.py \
              frontend/src/features/hub/StationWallDisplay.tsx \
              frontend/src/services/stationWallDisplay.ts
            echo "Unexpected change to 03.5-owned wall runtime"
            exit 1
          fi

      - name: Start visual-only frontend
        working-directory: frontend
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 >/tmp/v15-03-5-frontend.log 2>&1 &
          for i in {1..60}; do curl -fsS http://127.0.0.1:5173 >/dev/null && exit 0; sleep 1; done
          cat /tmp/v15-03-5-frontend.log
          exit 1

      - name: Capture BEFORE reference + AFTER matrix
        working-directory: frontend
        run: node scripts/capture-v15-03-5-wall-display.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v15-03-5-wall-display-proof
          path: artifacts/v15-03-5-wall-display
          if-no-files-found: error
          retention-days: 14
