name: Cephalo R1 BEFORE

on:
  push:
    branches:
      - feat/cephalo-auto-fiducial-calibration
    paths:
      - .github/workflows/cephalo-r1-before.yml

permissions:
  contents: read

jobs:
  before-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASELINE_HEAD: a76f2568418d0d7d9465ee24163324047b246c86
    steps:
      - name: Checkout R1 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore exact product baseline
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard "$BASELINE_HEAD"
          test "$(git rev-parse HEAD)" = "$BASELINE_HEAD"
          echo "Exact product baseline restored: $(git rev-parse HEAD)"

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install ephemeral Playwright
        working-directory: frontend
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install chromium

      - name: Capture exact R1 BEFORE
        working-directory: frontend
        env:
          PRODUCT_HEAD: a76f2568418d0d7d9465ee24163324047b246c86
        shell: bash
        run: |
          cat > .tmp-cephalo-r1-before.mjs <<'NODE'
          import { chromium } from 'playwright';
          import { spawn } from 'node:child_process';
          import { once } from 'node:events';
          import { mkdir, rm, writeFile } from 'node:fs/promises';
          import path from 'node:path';

          const PRODUCT_HEAD = process.env.PRODUCT_HEAD || 'unknown';
          const FRONTEND_DIR = process.cwd();
          const OUTPUT_DIR = path.join(FRONTEND_DIR, 'cephalo-r1-before-artifacts');
          const PORT = 5187;
          const BASE_URL = `http://127.0.0.1:${PORT}`;
          const viewports = [
            { name: '390x844', width: 390, height: 844 },
            { name: '768x1024', width: 768, height: 1024 },
            { name: '1280x900', width: 1280, height: 900 },
          ];

          const entrySource = `
          import React from 'react';
          import ReactDOM from 'react-dom/client';
          import { MemoryRouter } from 'react-router-dom';
          import { CephaloWorkspace } from './features/ortho/CephaloWorkspace';
          import { useOrthoStore } from './features/ortho/stores/useOrthoStore';
          import './index.css';

          document.body.dataset.theme = 'dark';
          const fixture = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(\`
            <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600">
              <defs><radialGradient id="g"><stop offset="0" stop-color="#334155"/><stop offset="1" stop-color="#020617"/></radialGradient></defs>
              <rect width="1200" height="1600" fill="url(#g)"/>
              <path d="M470 220 C720 260 820 520 760 760 C710 960 570 1160 420 1340" fill="none" stroke="#94a3b8" stroke-width="18" opacity=".38"/>
              <path d="M390 520 C600 450 790 560 820 760 C760 900 620 970 460 940" fill="none" stroke="#cbd5e1" stroke-width="12" opacity=".28"/>
              <circle cx="680" cy="470" r="105" fill="none" stroke="#e2e8f0" stroke-width="10" opacity=".24"/>
            </svg>\`);

          useOrthoStore.setState({
            patientId: 901,
            patientName: 'Patient Démo R1',
            analysisId: 9901,
            imageSrc: fixture,
            imgDim: { w: 1200, h: 1600 },
            local: { landmarks: [], version: 1 },
            anglesData: {},
            visionMetadata: {},
            isCalibrated: false,
            mmPerPixel: null,
            showCalibration: true,
            calibrationClickPoints: [],
            calibrationDistance: '',
            calibrationStep: 'selecting',
            completedSteps: new Set([1]),
            step: 1,
          });

          ReactDOM.createRoot(document.getElementById('root')!).render(
            <MemoryRouter initialEntries={['/patients/901/cephalo']}>
              <div style={{height:'100vh'}}>
                <CephaloWorkspace patientId={901} patientName="Patient Démo R1" />
              </div>
            </MemoryRouter>,
          );
          `;

          const htmlSource = `<!doctype html><html lang="fr"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>Cephalo R1 BEFORE</title><style>html,body,#root{width:100%;height:100%;margin:0}</style></head><body><div id="root"></div><script type="module" src="/src/cephalo-r1-before-entry.tsx"></script></body></html>`;

          function json(body, status = 200) {
            return { status, contentType: 'application/json', body: JSON.stringify(body) };
          }

          async function waitForServer(url, timeoutMs = 30000) {
            const startedAt = Date.now();
            while (Date.now() - startedAt < timeoutMs) {
              try {
                const response = await fetch(url);
                if (response.ok) return;
              } catch {}
              await new Promise((resolve) => setTimeout(resolve, 250));
            }
            throw new Error(`Vite server unavailable at ${url}`);
          }

          await rm(OUTPUT_DIR, { recursive: true, force: true });
          await mkdir(OUTPUT_DIR, { recursive: true });
          await writeFile(path.join(FRONTEND_DIR, 'src', 'cephalo-r1-before-entry.tsx'), entrySource, 'utf8');
          await writeFile(path.join(FRONTEND_DIR, 'cephalo-r1-before.html'), htmlSource, 'utf8');

          const viteBin = path.join(FRONTEND_DIR, 'node_modules', '.bin', process.platform === 'win32' ? 'vite.cmd' : 'vite');
          const server = spawn(viteBin, ['--host', '127.0.0.1', '--port', String(PORT)], {
            cwd: FRONTEND_DIR,
            env: { ...process.env, BROWSER: 'none', VITE_API_URL: 'http://127.0.0.1:8005' },
            stdio: ['ignore', 'pipe', 'pipe'],
          });
          let serverLog = '';
          server.stdout.on('data', (chunk) => { serverLog += chunk.toString(); });
          server.stderr.on('data', (chunk) => { serverLog += chunk.toString(); });

          let browser;
          const captures = [];
          const apiRequests = [];
          const blockedExternalRequests = [];

          try {
            await waitForServer(`${BASE_URL}/cephalo-r1-before.html`);
            browser = await chromium.launch({ headless: true });

            for (const viewport of viewports) {
              const context = await browser.newContext({
                viewport: { width: viewport.width, height: viewport.height },
                deviceScaleFactor: 1,
                reducedMotion: 'reduce',
                locale: 'fr-FR',
              });
              const page = await context.newPage();
              const pageErrors = [];
              const consoleErrors = [];
              const requests = [];

              page.on('pageerror', (error) => pageErrors.push(error.message));
              page.on('console', (message) => { if (message.type() === 'error') consoleErrors.push(message.text()); });

              await page.route('**/*', async (route) => {
                const request = route.request();
                const url = new URL(request.url());
                if (url.hostname === '127.0.0.1' && url.port === String(PORT)) return route.continue();
                if (url.hostname === '127.0.0.1' && url.port === '8005') {
                  const record = `${request.method()} ${url.pathname}${url.search}`;
                  requests.push(record);
                  apiRequests.push({ viewport: viewport.name, request: record });
                  if (request.method() === 'GET' && url.pathname === '/api/patients/901') {
                    return route.fulfill(json({ id: 901, nom: 'Démo', prenom: 'R1', age: 34, sexe: 'M' }));
                  }
                  return route.fulfill(json({ detail: 'Endpoint neutralisé dans le BEFORE' }, 418));
                }
                if (url.hostname === 'fonts.googleapis.com') {
                  return route.fulfill({ status: 200, contentType: 'text/css; charset=utf-8', body: '/* offline visual harness */' });
                }
                blockedExternalRequests.push({ viewport: viewport.name, url: request.url(), method: request.method() });
                return route.abort('blockedbyclient');
              });

              const response = await page.goto(`${BASE_URL}/cephalo-r1-before.html`, { waitUntil: 'domcontentloaded', timeout: 30000 });
              await page.getByRole('heading', { name: 'Studio Céphalométrique' }).waitFor({ state: 'visible', timeout: 30000 });
              await page.getByText('Non Calibré', { exact: true }).waitFor({ state: 'visible', timeout: 30000 });
              await page.getByText('Calibration', { exact: true }).waitFor({ state: 'visible', timeout: 30000 });
              await page.waitForTimeout(300);

              const metrics = await page.evaluate(() => {
                const bodyText = document.body.innerText;
                const calibrationLabel = Array.from(document.querySelectorAll('span')).find((node) => node.textContent?.trim() === 'Calibration');
                const modal = calibrationLabel?.closest('div.absolute');
                const rect = modal?.getBoundingClientRect();
                const doc = document.documentElement;
                const body = document.body;
                return {
                  innerWidth,
                  scrollWidth: Math.max(doc.scrollWidth, body.scrollWidth),
                  horizontalDocumentOverflow: Math.max(doc.scrollWidth, body.scrollWidth) > innerWidth + 1,
                  calibrationModalRect: rect ? { left: rect.left, right: rect.right, width: rect.width, top: rect.top, bottom: rect.bottom } : null,
                  calibrationModalClipped: Boolean(rect && (rect.left < 0 || rect.right > innerWidth || rect.top < 0 || rect.bottom > innerHeight)),
                  hasBinaryNonCalibratedStatus: bodyText.includes('Non Calibré'),
                  hasCandidateUnverifiedLabel: bodyText.includes('Réglette détectée') || bodyText.includes('CANDIDATE_UNVERIFIED'),
                  hasAutoVerifiedLabel: bodyText.includes('AUTO_VERIFIED') || bodyText.includes('Calibration automatique vérifiée'),
                  hasClinicianConfirmedLabel: bodyText.includes('CLINICIAN_CONFIRMED') || bodyText.includes('Confirmée par le praticien'),
                  hasManualTwoPointInstructions: bodyText.includes('premier point de référence'),
                  hasWorkspaceHeading: bodyText.includes('Studio Céphalométrique'),
                };
              });

              await page.screenshot({ path: path.join(OUTPUT_DIR, `before-cephalo-r1-${viewport.name}.png`), fullPage: false });
              captures.push({
                viewport: viewport.name,
                httpStatus: response?.status() ?? null,
                pageErrors,
                consoleErrors,
                apiRequests: requests,
                metrics,
              });
              await context.close();
            }
          } finally {
            if (browser) await browser.close();
            if (!server.killed) server.kill('SIGTERM');
            await Promise.race([once(server, 'exit'), new Promise((resolve) => setTimeout(resolve, 3000))]).catch(() => {});
            if (server.exitCode === null && !server.killed) server.kill('SIGKILL');
            await writeFile(path.join(OUTPUT_DIR, 'vite.log'), serverLog, 'utf8');
          }

          const invalid = captures.filter((item) =>
            item.httpStatus !== 200 ||
            item.pageErrors.length > 0 ||
            !item.metrics.hasWorkspaceHeading ||
            !item.metrics.hasBinaryNonCalibratedStatus ||
            !item.metrics.hasManualTwoPointInstructions
          );

          const report = {
            lot: 'CEPHALO-R1',
            phase: 'BEFORE',
            baselineProductHead: PRODUCT_HEAD,
            viewports: viewports.map((item) => item.name),
            fixturePolicy: 'Real production CephaloWorkspace/Step1Cephalo rendered with deterministic non-clinical image and isolated patient metadata.',
            captures,
            apiRequests,
            blockedExternalRequests,
            invalidCount: invalid.length,
            baselineContractObserved: {
              binaryCalibrationStateOnly: captures.every((item) => item.metrics.hasBinaryNonCalibratedStatus),
              candidateUnverifiedAbsent: captures.every((item) => !item.metrics.hasCandidateUnverifiedLabel),
              autoVerifiedProvenanceAbsent: captures.every((item) => !item.metrics.hasAutoVerifiedLabel),
              clinicianConfirmedProvenanceAbsent: captures.every((item) => !item.metrics.hasClinicianConfirmedLabel),
              manualTwoPointFlowPresent: captures.every((item) => item.metrics.hasManualTwoPointInstructions),
            },
          };

          await writeFile(path.join(OUTPUT_DIR, 'report.json'), JSON.stringify(report, null, 2), 'utf8');
          if (invalid.length > 0) {
            console.error(JSON.stringify(report, null, 2));
            process.exitCode = 1;
          } else {
            console.log(JSON.stringify(report, null, 2));
          }
          NODE
          node .tmp-cephalo-r1-before.mjs

      - name: Assert BEFORE evidence contract
        working-directory: frontend
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const report = JSON.parse(await readFile('cephalo-r1-before-artifacts/report.json', 'utf8'));
          const expected = 'a76f2568418d0d7d9465ee24163324047b246c86';
          if (report.baselineProductHead !== expected) throw new Error(`Wrong baseline ${report.baselineProductHead}`);
          if (report.phase !== 'BEFORE') throw new Error('Wrong phase');
          if (report.invalidCount !== 0) throw new Error(`Invalid captures: ${report.invalidCount}`);
          if (report.captures.length !== 3) throw new Error('Expected exactly 3 viewports');
          if (!report.baselineContractObserved.binaryCalibrationStateOnly) throw new Error('Binary calibration status not observed consistently');
          if (!report.baselineContractObserved.candidateUnverifiedAbsent) throw new Error('Unexpected candidate provenance already visible');
          if (!report.baselineContractObserved.autoVerifiedProvenanceAbsent) throw new Error('Unexpected auto-verified provenance already visible');
          if (!report.baselineContractObserved.clinicianConfirmedProvenanceAbsent) throw new Error('Unexpected clinician-confirmed provenance already visible');
          console.log('CEPHALO-R1 BEFORE evidence captured on exact product baseline.');
          NODE

      - name: Upload BEFORE evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cephalo-r1-before
          path: frontend/cephalo-r1-before-artifacts/
          if-no-files-found: error
          retention-days: 30
