name: Facad 3.14 full ceph analysis inventory\n\non:\n  push:\n    branches:\n      - feat/ortho-studio-lot08-ricketts-protocol-v2\n    paths:\n      - .github/workflows/facad-314-all-cph-inventory.yml\n      - audit/cephalo_lot08_facad_cph_inventory.py\n  workflow_dispatch:\n\npermissions:\n  contents: read\n\njobs:\n  inventory:\n    runs-on: windows-latest\n    timeout-minutes: 30\n    steps:\n      - name: Checkout exact candidate\n        uses: actions/checkout@v4\n\n      - name: Download and extract Facad release payload\n        shell: pwsh\n        run: |\n          $ErrorActionPreference = 'Stop'\n          New-Item -ItemType Directory -Force -Path facad-all | Out-Null\n          $installer = 'facad-all/Facad-Installer-3.14.1.1111.exe'\n          Invoke-WebRequest -Uri 'https://downloads.citodent.com/pub/Facad/Facad-Installer-3.14.1.1111.exe' -OutFile $installer\n          $seven = "$env:ProgramFiles\7-Zip\7z.exe"\n          New-Item -ItemType Directory -Force -Path facad-all/outer | Out-Null\n          & $seven x $installer '-ofacad-all/outer' -y | Out-Null\n          New-Item -ItemType Directory -Force -Path facad-all/release | Out-Null\n          & $seven x 'facad-all/outer/FacadRelease-3.14.1.1111.zip' '-ofacad-all/release' -y | Out-Null\n          Get-ChildItem facad-all/release/Ceph -File -Filter '*.cph' | Sort-Object Name |\n            Select-Object Name,Length | Format-Table -AutoSize | Tee-Object -FilePath facad-all/cph-files.txt\n\n      - name: Parse all CPH analyses\n        shell: pwsh\n        run: |\n          $ErrorActionPreference = 'Stop'\n          python audit/cephalo_lot08_facad_cph_inventory.py facad-all/release/Ceph --json facad-all/cph-inventory.json --markdown facad-all/cph-inventory.md | Tee-Object -FilePath facad-all/cph-inventory.txt\n          Get-Content facad-all/cph-inventory.txt\n\n      - name: Upload full inventory evidence\n        uses: actions/upload-artifact@v4\n        with:\n          name: facad-314-all-cph-inventory-${{ github.sha }}\n          path: |\n            facad-all/cph-files.txt\n            facad-all/cph-inventory.json\n            facad-all/cph-inventory.md\n            facad-all/cph-inventory.txt\n          if-no-files-found: error