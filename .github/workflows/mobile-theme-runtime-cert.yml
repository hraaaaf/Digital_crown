name: Mobile Theme Runtime Certification

on:
  push:
    branches: [ux/mobile-patient-cockpit-mob2]
    paths:
      - .github/workflows/mobile-theme-runtime-cert.yml
      - frontend/src/features/mobile/**
      - frontend/src/main.tsx
      - frontend/scripts/capture-mobile-theme-after.mjs
      - backend/routers/clinic_profile_p4.py
      - backend/routers/mobile_patient_cockpit.py
      - backend/tests/test_mobile_patient_cockpit.py
  workflow_dispatch:

concurrency:
  group: mobile-theme-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    name: Theme contract + Patient Cockpit same-viewport AFTER
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SECRET_KEY: ci-only-secret-key-minimum-32-characters-long
      DATABASE_URL: "sqlite:///:memory:"
      ENVIRONMENT: development
      TELEMETRY_ENABLED: "false"
      CLOUD_AI_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4

      - name: Record exact candidate
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          echo "candidate=${{ github.sha }}"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Install backend dependencies exactly like repository CI
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.12.0 torchvision==0.27.0 --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^(torch|torchvision)([<=>].*)?$' requirements.txt > /tmp/requirements-ci.txt
          pip install -r /tmp/requirements-ci.txt
          pip install httpx==0.27.2 pytest pytest-asyncio

      - name: Verify runtime theme, offline and patient isolation contracts
        working-directory: frontend
        run: npx vitest run src/features/mobile/Dashboard/hooks/useMobileRuntimeTheme.test.ts src/features/mobile/mobileThemeHardcoding.test.ts src/features/mobile/Dashboard/views/MobilePatientsGate.test.tsx src/features/mobile/Dashboard/views/MobilePatientsIsolation.test.ts

      - name: Verify Patient Cockpit tenant, finance and device gates
        run: python -m pytest -q backend/tests/test_mobile_patient_cockpit.py

      - name: Verify production frontend build
        working-directory: frontend
        run: npm run build

      - name: Verify backend route syntax
        run: python -m py_compile backend/routers/clinic_profile_p4.py backend/routers/mobile_patient_cockpit.py

      - name: Install Chromium evidence runner
        working-directory: frontend
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start isolated demo harness
        working-directory: frontend
        env:
          VITE_DC_PREVIEW_DEMO: "1"
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 >/tmp/mobile-theme-vite.log 2>&1 &
          for i in {1..60}; do
            curl -fsS 'http://127.0.0.1:5173/mobile/demo?demo=1' >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/mobile-theme-vite.log
          exit 1

      - name: Capture dashboard and Patient Cockpit AFTER at immutable BEFORE viewports
        working-directory: frontend
        env:
          MOBILE_EVIDENCE_URL: http://127.0.0.1:5173/mobile/demo?demo=1
          MOBILE_EVIDENCE_DIR: ../artifacts/mobile-theme-after
        run: node scripts/capture-mobile-theme-after.mjs

      - name: Verify PNG dimensions and record evidence
        run: |
          python - <<'PY'
          from pathlib import Path
          import struct

          expected = {
              'after-dashboard-390x844.png': (390, 844),
              'after-dashboard-430x932.png': (430, 932),
              'after-dashboard-768x1024.png': (768, 1024),
              'after-patient-cockpit-390x844.png': (390, 844),
              'after-patient-cockpit-430x932.png': (430, 932),
              'after-patient-cockpit-768x1024.png': (768, 1024),
          }
          root = Path('artifacts/mobile-theme-after')
          for name, dims in expected.items():
              data = (root / name).read_bytes()
              if data[:8] != b'\x89PNG\r\n\x1a\n':
                  raise SystemExit(f'{name}: not a PNG')
              width, height = struct.unpack('>II', data[16:24])
              if (width, height) != dims:
                  raise SystemExit(f'{name}: got {(width, height)}, expected {dims}')
              print(f'{name}: {width}x{height} OK')
          PY
          printf 'head=%s\nbefore_run=33880152997\nbefore_artifact=9939517547\nviewports=390x844,430x932,768x1024\nsurfaces=dashboard,patient-cockpit\ntheme=elite\nfont=settings-driven\noffline_gate=targeted_test\ninter_patient_isolation=targeted_test\ntenant_finance_device_gates=targeted_pytest\nruntime_errors=none-required\nhorizontal_overflow=none-required\ndeployment=none\n' '${{ github.sha }}' > artifacts/mobile-theme-after/result.txt
          cp /tmp/mobile-theme-vite.log artifacts/mobile-theme-after/vite.log

      - uses: actions/upload-artifact@v4
        with:
          name: mobile-theme-after
          path: artifacts/mobile-theme-after
          if-no-files-found: error
          retention-days: 30
