name: DECOMP P0-B Cephalo interaction

on:
  pull_request:
    branches: [master]
    paths:
      - 'scripts/decomp_cephalo_interaction.py'
      - '.github/workflows/decomp-cephalo-interaction.yml'

permissions:
  contents: write

jobs:
  refactor-and-verify:
    if: github.head_ref == 'agent/decomp-p0-large-files'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/decomp-p0-large-files
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply guarded interaction extraction
        run: python scripts/decomp_cephalo_interaction.py
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: TypeScript exact check
        working-directory: frontend
        run: npx tsc -b --pretty false
      - name: Ortho targeted regression
        working-directory: frontend
        run: npx vitest run src/features/ortho/cephaloUtils.test.ts
      - name: Verify intended diff only
        run: |
          python - <<'PY'
          import subprocess
          expected = {
              'frontend/src/features/ortho/CephaloTracingLayer.tsx',
              'frontend/src/features/ortho/hooks/useCephaloInteraction.ts',
          }
          lines = subprocess.check_output(['git', 'status', '--short', '-uall'], text=True).splitlines()
          paths = {line[3:] for line in lines if line.strip()}
          if paths != expected:
              raise SystemExit(f'Unexpected cephalo interaction diff: {sorted(paths)}')
          PY
      - name: Commit verified interaction extraction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- frontend/src/features/ortho/CephaloTracingLayer.tsx frontend/src/features/ortho/hooks/useCephaloInteraction.ts
          git commit -m 'refactor(ortho): extract cephalo interaction foundation'
          git push origin HEAD:agent/decomp-p0-large-files

# trigger: p0-b2 interaction gate
