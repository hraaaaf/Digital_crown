name: SEC-P1.5 Legacy Windows Builder Fail-Closed

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "scripts/build_exe.py"
      - "backend/tests/test_legacy_build_exe_disabled.py"
      - ".github/workflows/sec-p1-5-legacy-builder-guard.yml"
      - "docs/security/SEC_P1_5_LEGACY_BUILDER_REMEDIATION.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sec-p1-5-builder-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  legacy-builder-disabled:
    name: SEC-P1.5 fail-closed builder (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout exact PR SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact checkout SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install isolated test runner
        run: python -m pip install pytest==8.4.2

      - name: Verify package dependencies
        run: python -m pip check

      - name: Prove legacy builder refuses all packaging paths
        run: python -m pytest -q backend/tests/test_legacy_build_exe_disabled.py
