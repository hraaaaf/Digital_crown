name: PC-08 Staff AFTER Visual Evidence

on:
  pull_request:
    branches: [master]
    paths:
      - .github/workflows/pc08-staff-after-visual.yml
      - frontend/scripts/capture-pc08-staff-after.mjs
      - docs/clinic/patient_companion/PC_08_*.md

permissions:
  contents: read

concurrency:
  group: pc08-staff-after-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  after:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      BASE_HEAD: ${{ github.event.pull_request.head.sha }}
      PRODUCT_HEAD: ${{ github.event.pull_request.head.sha }}
      ENVIRONMENT: test
      SECRET_KEY: pc08-staff-after-isolated-secret-000000000001
      DATABASE_URL: sqlite:///./pc08-staff-after.db
      TELEMETRY_ENABLED: "false"
      CLOUD_AI_ENABLED: "false"
      DEBUG: "false"
      DIGITAL_CROWN_TESTING: "1"
      DIGITALCROWN_ISOLATED_RUNTIME: "1"
      ALLOWED_ORIGINS: "http://127.0.0.1:5173,http://localhost:5173"
      T2_USER: t2-browser@cabinet.ma
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Materialize exact AFTER
        shell: bash
        run: |
          set -euo pipefail
          git worktree add /tmp/pc08-staff-after "$BASE_HEAD"
          test "$(git -C /tmp/pc08-staff-after rev-parse HEAD)" = "$BASE_HEAD"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Generate isolated runtime credential
        run: |
          python -c 'import secrets; print("T2_PASSWORD=" + secrets.token_urlsafe(24))' >> "$GITHUB_ENV"

      - name: Install AFTER backend dependencies
        working-directory: /tmp/pc08-staff-after
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.12.0 torchvision==0.27.0 --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^(torch|torchvision)([<=>].*)?$' requirements.txt > /tmp/requirements-pc08-staff-after.txt
          pip install -r /tmp/requirements-pc08-staff-after.txt
          pip install httpx==0.27.2 pytest

      - name: Compute isolated DB fingerprint
        working-directory: /tmp/pc08-staff-after
        run: |
          PYTHONPATH=. python - <<'PY' >> "$GITHUB_ENV"
import os
from backend.core.runtime_safety import database_target_fingerprint
print("DIGITALCROWN_ISOLATION_DB_FINGERPRINT=" + database_target_fingerprint(os.environ["DATABASE_URL"]))
PY

      - name: Install exact AFTER frontend
        working-directory: /tmp/pc08-staff-after/frontend
        run: npm ci

      - name: Install HEAD capture dependencies
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start isolated exact AFTER backend
        working-directory: /tmp/pc08-staff-after
        run: |
          python scripts/t2_runtime_server.py > /tmp/pc08-staff-after-backend.log 2>&1 &
          echo $! > /tmp/pc08-staff-after-backend.pid
          for i in {1..90}; do
            if curl -fsS http://127.0.0.1:8005/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/pc08-staff-after-backend.log
          exit 1

      - name: Start exact AFTER frontend
        working-directory: /tmp/pc08-staff-after/frontend
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 > /tmp/pc08-staff-after-frontend.log 2>&1 &
          echo $! > /tmp/pc08-staff-after-frontend.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:5173 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/pc08-staff-after-frontend.log
          exit 1

      - name: Capture staff AFTER
        working-directory: frontend
        env:
          PC08_API_URL: http://127.0.0.1:8005
          PC08_APP_URL: http://127.0.0.1:5173
          PC08_STAFF_AFTER_DIR: ../artifacts/pc08-staff-after
        run: node scripts/capture-pc08-staff-after.mjs

      - name: Verify staff AFTER
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const report = JSON.parse(fs.readFileSync('artifacts/pc08-staff-after/report.json', 'utf8'));
          if (report.productHead !== process.env.BASE_HEAD) throw new Error('base head mismatch');
          if (report.captures.length !== 3) throw new Error('expected 3 staff captures');
          if (report.captures.some(item => item.overflow || item.pageErrors.length || item.consoleErrors.length)) {
            throw new Error('staff AFTER contract failed');
          }
          console.log('pc08_staff_after=PASS');
          NODE

      - name: Dump logs on failure
        if: failure()
        run: |
          echo '===== BACKEND ====='; cat /tmp/pc08-staff-after-backend.log || true
          echo '===== FRONTEND ====='; cat /tmp/pc08-staff-after-frontend.log || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pc08-staff-after-${{ github.event.pull_request.head.sha }}
          path: artifacts/pc08-staff-after
          if-no-files-found: error
          retention-days: 30
