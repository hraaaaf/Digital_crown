name: RESTORE-03 P4 normal rebind Windows A-to-B persistence LAB
on:
  pull_request:
    paths:
      - '.github/workflows/restore03-p4-normal-crosshost-lab.yml'
      - 'scripts/restore03_p4_normal_crosshost_lab.py'
      - 'scripts/restore03_remote_windows_worker_lab.py'
      - 'scripts/restore03_cross_host_lab.py'
      - 'backend/services/portability_license_rebind.py'
      - 'backend/services/guided_restore.py'
      - 'backend/services/guided_restore_worker.py'
      - 'backend/services/cabinet_bundle.py'
      - 'backend/security.py'
      - 'backend/models.py'
      - 'backend/models_platform.py'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'
  RESTORE03_TEST_MIGRATION_SECRET: 'SYNTHETIC_ONLY_NOT_A_REAL_CABINET_PASSPHRASE_v1'

jobs:
  source-windows-a:
    name: Windows A - real model synthetic DB/media encrypted bundle
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install minimal P4 lab runtime
        run: python -m pip install cryptography==44.0.3 SQLAlchemy==2.0.28
      - name: Produce encrypted portable bundle from synthetic ORM fixture
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sha = "${{ github.event.pull_request.head.sha || github.sha }}"
          if ((git rev-parse HEAD).Trim() -ne $sha) { throw 'RESTORE03_P4_A_HEAD_MISMATCH' }
          if ($env:DATABASE_URL -or $env:DIGITALCROWN_USER_DATA_DIR -or $env:CABINET_MASTER_KEY_HEX -or $env:MEDIA_ROOT) { throw 'RESTORE03_P4_A_UNSAFE_ENV' }
          python scripts/restore03_p4_normal_crosshost_lab.py source --output "$env:RUNNER_TEMP/restore03-p4-a"
          if ($LASTEXITCODE -ne 0) { throw 'RESTORE03_P4_A_FAILED' }
          if (-not (Test-Path -LiteralPath "$env:RUNNER_TEMP/restore03-p4-a/restore03-SYNTHETIC-P4.dcbundle" -PathType Leaf)) { throw 'RESTORE03_P4_BUNDLE_MISSING' }
          Write-Output 'RESTORE03_P4_A_BUNDLE_ENCRYPTED_SYNTHETIC_PASS'
      - uses: actions/upload-artifact@v4
        with:
          name: restore03-p4-a-encrypted-synthetic-bundle
          path: ${{ runner.temp }}/restore03-p4-a/
          retention-days: 1
          if-no-files-found: error

  target-windows-b:
    name: Windows B - normal P4 rebind persistent license + DB/media oracle
    runs-on: windows-latest
    needs: source-windows-a
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install minimal ORM, security and restore runtime
        run: python -m pip install cryptography==44.0.3 SQLAlchemy==2.0.28 python-jose==3.5.0 passlib==1.7.4 pydantic==2.6.3 pydantic-settings==2.2.1 python-dotenv==1.2.1
      - uses: actions/download-artifact@v4
        with:
          name: restore03-p4-a-encrypted-synthetic-bundle
          path: ${{ runner.temp }}/restore03-p4-transfer
      - name: Run actual P4 function and independent persistent rollback-free oracles
        shell: pwsh
        env:
          RESTORE03_TEST_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -ne $env:RESTORE03_TEST_HEAD) { throw 'RESTORE03_P4_B_HEAD_MISMATCH' }
          if ($env:DATABASE_URL -or $env:DIGITALCROWN_USER_DATA_DIR -or $env:CABINET_MASTER_KEY_HEX -or $env:MEDIA_ROOT) { throw 'RESTORE03_P4_B_UNSAFE_ENV' }
          python scripts/restore03_p4_normal_crosshost_lab.py target --input "$env:RUNNER_TEMP/restore03-p4-transfer" --output "$env:RUNNER_TEMP/restore03-p4-b"
          if ($LASTEXITCODE -ne 0) { throw 'RESTORE03_P4_B_WORKER_FAILED' }
          $path = Join-Path $env:RUNNER_TEMP 'restore03-p4-b/restore03-p4-normal-success-evidence.json'
          if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw 'RESTORE03_P4_B_REPORT_MISSING' }
          $proof = Get-Content -LiteralPath $path -Raw | ConvertFrom-Json
          if ($proof.tested_head -ne $env:RESTORE03_TEST_HEAD) { throw 'RESTORE03_P4_B_REPORT_WRONG_HEAD' }
          if ($proof.license_rebind_normal_execution -ne 'PASS' -or $proof.db_original_and_media_applied -ne 'PASS' -or $proof.owner_license_unlicensed_after_reopen -ne 'PASS') { throw 'RESTORE03_P4_B_LICENSE_OR_DATA_NOT_PROVEN' }
          if ($proof.mobile_cutoff_persisted_after_reopen -ne 'PASS' -or $proof.pairing_tokens_invalidated -ne 'PASS' -or $proof.paired_device_revoked -ne 'PASS') { throw 'RESTORE03_P4_B_REVOCATION_NOT_PERSISTED' }
          if ($proof.vault_from_old_machine_removed -ne 'PASS' -or $proof.db_integrity_after_reopen -ne 'PASS' -or $proof.bundle_integrity -ne 'PASS') { throw 'RESTORE03_P4_B_INTEGRITY_ORACLE_FAILED' }
          if ($proof.actual_p4_code -ne $true -or $proof.real_patients -ne $false -or $proof.frozen_exe -ne $false -or $proof.physical_second_pc -ne $false -or $proof.clinical_go -ne $false) { throw 'RESTORE03_P4_B_FALSE_CLINICAL_CLAIM' }
          if ($proof.http_health -ne 'STAND_IN_ONLY' -or $proof.database_binding -ne 'SYNTHETIC_REAL_SQLALCHEMY_NOT_PACKAGED_APP_STARTUP') { throw 'RESTORE03_P4_B_SCOPE_UNDISCLOSED' }
          Write-Output 'RESTORE03_P4_NORMAL_REBIND_CROSSHOST_PERSISTENCE_SYNTHETIC_LAB_PASS_NO_CLINICAL_GO'
      - uses: actions/upload-artifact@v4
        with:
          name: restore03-p4-b-normal-rebind-evidence-only
          path: ${{ runner.temp }}/restore03-p4-b/restore03-p4-normal-success-evidence.json
          retention-days: 7
          if-no-files-found: error
