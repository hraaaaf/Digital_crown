name: V1.5 FUE G02 G03 Risk Matrix (synthetic only)

on:
  pull_request:
    branches: [master]
    paths:
      - "docs/quality/V15_FUE_G02_G03_RISK_MATRIX_20261024.md"
      - ".github/workflows/v15-fue-g02-g03-risk-matrix.yml"
      - "frontend/scripts/certify-v15-03-real-station-wall-integrated.mjs"
      - "scripts/seed_v15_station_fue_lab.py"
      - "frontend/src/features/hub/StationPatientIdentity.tsx"
      - "frontend/src/features/hub/StationPatientIdentity.test.tsx"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v15-fue-g02-g03-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  photo-integrated-fue:
    name: "02 / real T2 UI + backend FUE"
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      ENVIRONMENT: test
      SECRET_KEY: v15-fue-g02-synthetic-ci-only-secret-key
      DATABASE_URL: sqlite:///./t2-runtime-cert.db
      DIGITALCROWN_ISOLATED_RUNTIME: "1"
      DIGITALCROWN_ISOLATION_DB_FINGERPRINT: c04779c8d18b3ac12a0f4093a47a5d0c3c0e2251714be532893cfa052e9ee780
      TELEMETRY_ENABLED: "false"
      CLOUD_AI_ENABLED: "false"
      DEBUG: "false"
      ALLOWED_ORIGINS: http://127.0.0.1:5173,http://localhost:5173
      EVALUATED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      EVALUATED_BASE: ${{ github.event.pull_request.base.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EVALUATED_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Generate synthetic-only runtime credentials
        run: |
          echo "T2_USER=t2-browser@cabinet.ma" >> "$GITHUB_ENV"
          echo "T2_PASSWORD=$(python -c 'import secrets; print(secrets.token_urlsafe(32))')" >> "$GITHUB_ENV"
          echo "T2_MOBILE_PAIRING_TOKEN=$(python -c 'import secrets; print(secrets.token_urlsafe(24))')" >> "$GITHUB_ENV"
      - name: Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.12.0 torchvision==0.27.0 --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^(torch|torchvision)([<=>].*)?$' requirements.txt >/tmp/v15-fue-g02-requirements.txt
          pip install -r /tmp/v15-fue-g02-requirements.txt
      - name: Photo authorization, replacement, bad file, delete contracts
        run: python -m pytest backend/tests/test_patient_profile_photo_v15.py -q
      - name: Frontend setup
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Photo UX targeted regression
        working-directory: frontend
        run: |
          npx vitest run src/features/dashboard/components/DashboardHeader.test.tsx src/features/patients/PatientListSearchSort.g2Interactive.test.tsx src/features/patients/components/PatientAvatar.test.tsx src/features/patients/components/PatientPhotoEditor.test.tsx src/features/mobile/Dashboard/views/WaitingRoomView.g3Interactive.test.tsx --maxWorkers=1 --fileParallelism=false
      - name: Frontend build
        working-directory: frontend
        run: npm run build
      - name: Boot isolated T2 backend
        run: |
          test "$ENVIRONMENT" = test
          test "$DIGITALCROWN_ISOLATED_RUNTIME" = 1
          rm -f t2-runtime-cert.db
          python scripts/t2_runtime_server.py >/tmp/v15-fue-g02-backend.log 2>&1 &
          for i in {1..90}; do curl -fsS http://127.0.0.1:8005/health >/dev/null && exit 0; sleep 1; done
          cat /tmp/v15-fue-g02-backend.log
          exit 1
      - name: Boot actual frontend
        working-directory: frontend
        env:
          VITE_DC_PREVIEW_DEMO: "1"
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 >/tmp/v15-fue-g02-frontend.log 2>&1 &
          for i in {1..90}; do curl -fsS http://127.0.0.1:5173 >/dev/null && exit 0; sleep 1; done
          cat /tmp/v15-fue-g02-frontend.log
          exit 1
      - name: FUE 02 initial -> add -> replace -> delete, 5 surfaces and 2 viewports
        working-directory: frontend
        run: node scripts/run-with-t2-workstation.mjs scripts/capture-v15-02-3-photo-ui-after.mjs
      - name: FUE 02 desktop / mobile search and patient badges geometry
        working-directory: frontend
        run: |
          node --check scripts/certify-v15-02-dashboard-search-viewport.mjs
          T2_MOBILE_PAIRING_TOKEN= node scripts/run-with-t2-workstation.mjs scripts/certify-v15-02-dashboard-search-viewport.mjs
      - name: FUE 02 from truly unauthenticated browser, rights and private media
        working-directory: frontend
        run: |
          node --check scripts/certify-v15-02-photo-fresh-login.mjs
          node scripts/certify-v15-02-photo-fresh-login.mjs
      - name: FUE 02 failed upload/retry/single-flight/delete UI
        working-directory: frontend
        # The preceding lifecycle flow consumes the one-use mobile pairing token.
        # This case authenticates the workstation only and MUST NOT reclaim mobile.
        env:
          T2_MOBILE_PAIRING_TOKEN: ""
        run: |
          node --check scripts/certify-v15-02-patient-photo-actions.mjs
          node scripts/run-with-t2-workstation.mjs scripts/certify-v15-02-patient-photo-actions.mjs
      - name: Photo artifact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v15-fue-g02-synthetic-evidence
          path: |
            artifacts/v15-02-3-photo-ui-after
            artifacts/v15-02-4-photo-lifecycle
          if-no-files-found: warn
          retention-days: 14

  station-backend-security:
    name: "03 / station auth and arrival HTTP contracts"
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ENVIRONMENT: test
      SECRET_KEY: v15-fue-g03-synthetic-ci-only-secret-key
      PAIRING_CODE_PEPPER: v15-fue-g03-synthetic-pepper
      DATABASE_URL: sqlite:///./v15-fue-g03-test.db
      DIGITALCROWN_ISOLATED_RUNTIME: "1"
      DIGITALCROWN_ISOLATION_DB_FINGERPRINT: c04779c8d18b3ac12a0f4093a47a5d0c3c0e2251714be532893cfa052e9ee780
      TELEMETRY_ENABLED: "false"
      CLOUD_AI_ENABLED: "false"
      DEBUG: "false"
      EVALUATED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EVALUATED_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.12.0 torchvision==0.27.0 --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^(torch|torchvision)([<=>].*)?$' requirements.txt >/tmp/v15-fue-g03-requirements.txt
          pip install -r /tmp/v15-fue-g03-requirements.txt
      - name: Station migration heads and roundtrip
        run: |
          python -m alembic heads
          python -m pytest backend/tests/test_station_identity_pairing_migration_v15.py -q
      - name: Station workstation role and revocation contracts
        run: python -m pytest backend/tests/test_workstation_mode_v15.py -q
      - name: Station QR/expiry/replay/tenant/fallback/0-1-N-arrival/wall API
        run: python -m pytest backend/tests/test_station_patient_session_v15.py -q

  station-browser-fixtures:
    name: "03 / kiosk UI, identity, QR, wall, offline browser fixtures"
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      EVALUATED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      EVALUATED_BASE: ${{ github.event.pull_request.base.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EVALUATED_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend and Chromium
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Kiosk shell / staff / pairing / arrival / wall / offline UX tests
        working-directory: frontend
        run: |
          npx vitest run src/features/hub/StationKioskShell.test.tsx src/features/hub/WorkstationExperiencePage.test.tsx src/features/hub/WorkstationIdentityPanel.test.tsx src/features/hub/WorkstationModeAdminPanel.test.tsx src/features/hub/StationPatientIdentity.test.tsx src/features/hub/StationAppointmentArrival.test.tsx src/features/hub/StationWallDisplay.test.tsx src/features/dashboard/components/WaitingRoomWallCall.test.tsx src/test/v15StationPatientSessionContract.test.ts src/test/v15WorkstationModeContract.test.ts --maxWorkers=1 --fileParallelism=false
      - name: Frontend build
        working-directory: frontend
        run: npm run build
      - name: Chromium user-journey fixture matrix (NOT real station backend E2E)
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          SERVER_PID=""
          stop_server() {
            if [[ -n "$SERVER_PID" ]]; then
              kill "$SERVER_PID" 2>/dev/null || true
              wait "$SERVER_PID" 2>/dev/null || true
              SERVER_PID=""
            fi
          }
          trap stop_server EXIT
          start_server() {
            local port="$1"
            ./node_modules/.bin/vite --host 127.0.0.1 --port "$port" --strictPort >"/tmp/v15-fue-g03-${port}.log" 2>&1 &
            SERVER_PID="$!"
            for i in {1..90}; do
              if curl -fsS "http://127.0.0.1:${port}/" >/dev/null; then return 0; fi
              sleep 1
            done
            cat "/tmp/v15-fue-g03-${port}.log"
            return 1
          }
          start_server 4195
          V15_03_1_PHASE=after node scripts/capture-v15-03-1-kiosk-shell.mjs
          stop_server

          start_server 4196
          V15_03_2_PHASE=after node scripts/capture-v15-03-2-station-identity.mjs
          stop_server

          start_server 4197
          V15_03_3_PHASE=after node scripts/capture-v15-03-3-patient-session.mjs
          stop_server

          start_server 4198
          V15_03_6_PHASE=after node scripts/capture-v15-03-6-station-hardening.mjs
          stop_server

          start_server 5173
          node scripts/capture-v15-03-5-wall-display.mjs
          stop_server
      - name: Station fixture screenshots (not a true multi-device FUE-G)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v15-fue-g03-visual-fixtures
          path: |
            frontend/artifacts/v15-03-1-kiosk-shell-after
            frontend/artifacts/v15-03-2-station-identity-after
            frontend/artifacts/v15-03-3-patient-session-after
            frontend/artifacts/v15-03-6-station-hardening-after
            artifacts/v15-03-5-wall-display
          if-no-files-found: warn
          retention-days: 14


  station-real-browser-e2e:
    name: "03.21 / real kiosk -> FastAPI -> SQLite -> independent wall"
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      ENVIRONMENT: test
      SECRET_KEY: v15-fue-g03-21-only-synthetic-key
      DATABASE_URL: sqlite:///./t2-runtime-cert.db
      DIGITALCROWN_ISOLATED_RUNTIME: "1"
      DIGITALCROWN_ISOLATION_DB_FINGERPRINT: c04779c8d18b3ac12a0f4093a47a5d0c3c0e2251714be532893cfa052e9ee780
      T2_STAFF_AUDIT: "1"
      T2_STATION_FUE: "1"
      TELEMETRY_ENABLED: "false"
      CLOUD_AI_ENABLED: "false"
      DEBUG: "false"
      ALLOWED_ORIGINS: http://127.0.0.1:5173,http://localhost:5173
      EVALUATED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EVALUATED_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Generate isolated synthetic login
        run: |
          echo "T2_USER=t2-browser@cabinet.ma" >> "$GITHUB_ENV"
          echo "T2_PASSWORD=$(python -c 'import secrets; print(secrets.token_urlsafe(32))')" >> "$GITHUB_ENV"
      - name: Python and Playwright prerequisites
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.12.0 torchvision==0.27.0 --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^(torch|torchvision)([<=>].*)?$' requirements.txt >/tmp/v15-fue-g03-21-req.txt
          pip install -r /tmp/v15-fue-g03-21-req.txt
          python -m py_compile scripts/seed_v15_station_fue_lab.py
      - name: Install Chromium
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
          node --check scripts/certify-v15-03-real-station-wall-integrated.mjs
      - name: Start true local isolated FastAPI
        run: |
          test "$ENVIRONMENT" = test
          test "$DIGITALCROWN_ISOLATED_RUNTIME" = 1
          test "$T2_STATION_FUE" = 1
          test "$DATABASE_URL" = "sqlite:///./t2-runtime-cert.db"
          rm -f t2-runtime-cert.db
          python scripts/t2_runtime_server.py >/tmp/v15-fue-g03-21-backend.log 2>&1 &
          for i in {1..90}; do curl -fsS http://127.0.0.1:8005/health >/dev/null && exit 0; sleep 1; done
          tail -100 /tmp/v15-fue-g03-21-backend.log
          exit 1
      - name: Seed only fictitious 0/1/N appointments
        run: python scripts/seed_v15_station_fue_lab.py
      - name: Start true local Vite React UI
        working-directory: frontend
        env:
          VITE_DC_PREVIEW_DEMO: "1"
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 >/tmp/v15-fue-g03-21-frontend.log 2>&1 &
          for i in {1..90}; do curl -fsS http://127.0.0.1:5173 >/dev/null && exit 0; sleep 1; done
          tail -100 /tmp/v15-fue-g03-21-frontend.log
          exit 1
      - name: Real browser 3 identities / station fallback 0-1-N / staff / wall
        working-directory: frontend
        run: node scripts/certify-v15-03-real-station-wall-integrated.mjs
      - name: Independent post-E2E SQLite appointment and audit oracle
        run: python scripts/seed_v15_station_fue_lab.py --verify
      - name: FUE-G03-21 authentic after screenshots and HTTP/SQL evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v15-fue-g03-21-real-integrated
          path: frontend/artifacts/v15-03-real-integration
          if-no-files-found: warn
          retention-days: 14
