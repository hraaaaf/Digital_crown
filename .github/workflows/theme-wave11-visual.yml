name: Wave11 auth and PWA visual evidence (NO DEPLOY)
on:
  pull_request:
    paths:
      - 'frontend/src/pages/ForgotPasswordPage.tsx'
      - 'frontend/src/components/PWAInstallPrompt.tsx'
      - 'frontend/src/hooks/usePWAInstall.ts'
      - '.github/workflows/theme-wave11-visual.yml'
  push:
    branches:
      - 'fix/theme-wave11-auth-pwa-20261026'
permissions:
  contents: read
jobs:
  wave11-visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend and browser
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Create isolated visual-only harness
        working-directory: frontend
        run: |
          cat > wave11-visual.html <<'EOF'
          <!doctype html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"></head><body><div id="root"></div><script type="module" src="/src/wave11-visual.tsx"></script></body></html>
          EOF
          cat > src/wave11-visual.tsx <<'EOF'
          import React from 'react';
          import { createRoot } from 'react-dom/client';
          import { MemoryRouter } from 'react-router-dom';
          import './index.css';
          import { ForgotPasswordPage } from './pages/ForgotPasswordPage';
          import { PWAInstallPrompt } from './components/PWAInstallPrompt';
          const isPWA = new URLSearchParams(location.search).get('screen') === 'pwa';
          createRoot(document.getElementById('root')!).render(
            <MemoryRouter>{isPWA ? <main className="min-h-screen bg-background p-5 flex items-center justify-center"><div className="w-full max-w-md"><PWAInstallPrompt /></div></main> : <ForgotPasswordPage />}</MemoryRouter>
          );
          EOF
      - name: Run isolated Vite frontend
        working-directory: frontend
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 > /tmp/wave11-vite.log 2>&1 &
          for i in {1..50}; do if curl -fsS http://127.0.0.1:5173/wave11-visual.html >/dev/null; then exit 0; fi; sleep 1; done
          cat /tmp/wave11-vite.log; exit 1
      - name: Capture real Chromium component render at two viewports and two themes
        working-directory: frontend
        run: |
          cat > wave11-visual.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          fs.mkdirSync('wave11-visual-evidence', {recursive:true});
          const browser = await chromium.launch({headless:true});
          const errors = [];
          for (const width of [390,1440]) {
            for (const mode of ['light','dark']) {
              for (const screen of ['forgot','pwa-ios','pwa-android']) {
                const ios = screen==='pwa-ios';
                const context = await browser.newContext({
                  viewport:{width,height:900},
                  colorScheme:mode,
                  userAgent:ios?'Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 Version/17.0 Mobile/15E148 Safari/604.1':'Mozilla/5.0 (Linux; Android 14; Pixel 7) AppleWebKit/537.36 Chrome/120.0 Mobile Safari/537.36'
                });
                const page = await context.newPage();
                page.on('pageerror',e=>errors.push(screen+': '+e.message));
                await page.goto('http://127.0.0.1:5173/wave11-visual.html?screen='+(screen==='forgot'?'forgot':'pwa'),{waitUntil:'networkidle'});
                if (mode==='dark') await page.evaluate(()=>document.documentElement.classList.add('dark'));
                if (screen==='pwa-android') await page.evaluate(()=>{
                  const e = new Event('beforeinstallprompt',{cancelable:true});
                  Object.assign(e,{prompt:async()=>{},userChoice:Promise.resolve({outcome:'dismissed',platform:'web'})});
                  window.dispatchEvent(e);
                });
                const expected=screen==='forgot'?'Récupération d’accès':screen==='pwa-ios'?'Comment installer sur iPhone':'Installer maintenant';
                await page.getByText(expected,{exact:false}).first().waitFor({timeout:10000});
                if (ios) await page.getByText('Comment installer sur iPhone').click();
                const overflow=await page.evaluate(()=>document.documentElement.scrollWidth>window.innerWidth+1);
                if(overflow) errors.push(screen+' '+width+' '+mode+': horizontal overflow');
                await page.screenshot({path:'wave11-visual-evidence/'+screen+'-'+width+'-'+mode+'.png',fullPage:true});
                await context.close();
              }
            }
          }
          await browser.close();
          fs.writeFileSync('wave11-visual-evidence/report.json',JSON.stringify({screenshots:12,errors},null,2));
          if(errors.length) {console.error(errors);process.exit(1);}
          EOF
          node wave11-visual.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wave11-auth-pwa-after
          path: frontend/wave11-visual-evidence/
          if-no-files-found: error
