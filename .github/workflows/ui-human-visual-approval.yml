name: UI Human Visual Approval

# Privileged event: NEVER checkout or execute code from the PR head.
# The trusted bot attests the exact approved SHA when the label is added.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  human-visual-approval:
    name: Human visual approval (Achraf)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted repository base only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fail-closed exact-HEAD visual approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/visual-approval-gate.mjs
