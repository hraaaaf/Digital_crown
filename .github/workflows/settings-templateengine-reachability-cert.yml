name: Settings TemplateEngine Reachability Certification

on:
  pull_request:
    branches: [master]
    paths:
      - 'backend/services/template_engine.py'
      - 'backend/services/document_factory.py'
      - 'backend/tests/test_template_engine.py'
      - 'backend/tests/test_services_unit*.py'
      - 'backend/tests/test_settings_branding_preview_files.py'
      - 'backend/routers/documents.py'
      - 'backend/routers/templates.py'
      - 'backend/models.py'
      - 'backend/seed_templates.py'
      - 'backend/main.py'
      - 'docs/settings/TEMPLATEENGINE_REACHABILITY_GOAL.md'
      - '.github/workflows/settings-templateengine-reachability-cert.yml'
      - '.github/workflows/settings-r11-templatebuilder-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Prove dead engine removed and live template contracts preserved
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/templateengine
          python - <<'PY'
          import json
          from pathlib import Path

          backend = Path('backend')
          document_factory = Path('backend/services/document_factory.py')
          documents_router = Path('backend/routers/documents.py')
          templates_router = Path('backend/routers/templates.py')
          models = Path('backend/models.py')
          seed = Path('backend/seed_templates.py')
          main = Path('backend/main.py')

          errors = []
          if Path('backend/services/template_engine.py').exists():
              errors.append('template_engine.py doit être supprimé')
          if Path('backend/tests/test_template_engine.py').exists():
              errors.append('test_template_engine.py doit être supprimé avec le module isolé')

          factory_text = document_factory.read_text(encoding='utf-8')
          for forbidden in ('TemplateEngine', 'template_engine', '_get_default_template'):
              if forbidden in factory_text:
                  errors.append(f'référence résiduelle dans DocumentFactory: {forbidden}')

          for required in (
              'OrdonnanceGenerator', 'CertificatGenerator', 'AccountingGenerator',
              'LibreGenerator', 'BilanOrthoPDFGenerator'
          ):
              if required not in factory_text:
                  errors.append(f'générateur actif absent de DocumentFactory: {required}')

          documents_text = documents_router.read_text(encoding='utf-8')
          for required in ('DocumentFactory', 'create_ordonnance', 'create_certificat', 'create_devis'):
              if required not in documents_text:
                  errors.append(f'contrat documents absent: {required}')

          router_text = templates_router.read_text(encoding='utf-8')
          model_text = models.read_text(encoding='utf-8')
          seed_text = seed.read_text(encoding='utf-8')
          main_text = main.read_text(encoding='utf-8')
          if 'DocumentTemplate' not in router_text:
              errors.append('DocumentTemplate absent du router templates')
          if 'class DocumentTemplate' not in model_text:
              errors.append('DocumentTemplate model absent')
          if 'models.DocumentTemplate' not in seed_text:
              errors.append('DocumentTemplate seed absent')
          if 'include_router(templates.router' not in main_text:
              errors.append('router /api/templates non monté')

          forbidden_needles = (
              'TemplateEngine',
              'SecureTemplateRenderer',
              'backend.services.template_engine',
              '_get_default_template',
          )
          refs = {needle: [] for needle in forbidden_needles}
          for path in backend.rglob('*.py'):
              if '__pycache__' in path.parts:
                  continue
              text = path.read_text(encoding='utf-8')
              for lineno, line in enumerate(text.splitlines(), 1):
                  for needle in forbidden_needles:
                      if needle in line:
                          refs[needle].append(f'{path.as_posix()}:{lineno}:{line.strip()}')
          leftovers = {needle: lines for needle, lines in refs.items() if lines}
          if leftovers:
              errors.append(f'références legacy résiduelles: {leftovers}')

          evidence = {
              'document_factory': str(document_factory),
              'documents_router_uses_factory': 'DocumentFactory' in documents_text,
              'documenttemplate_model_preserved': 'class DocumentTemplate' in model_text,
              'documenttemplate_router_preserved': 'DocumentTemplate' in router_text,
              'documenttemplate_seed_preserved': 'models.DocumentTemplate' in seed_text,
              'templates_router_mounted': 'include_router(templates.router' in main_text,
              'legacy_references': refs,
              'errors': errors,
          }
          Path('artifacts/templateengine/reachability.json').write_text(
              json.dumps(evidence, indent=2, ensure_ascii=False), encoding='utf-8'
          )
          if errors:
              raise AssertionError('\n'.join(errors))
          PY

      - name: Compile active document entrypoints
        run: python -m py_compile backend/services/document_factory.py backend/routers/documents.py backend/routers/templates.py backend/main.py

      - name: Record exact HEAD
        if: always()
        run: |
          git rev-parse HEAD | tee artifacts/templateengine/head.txt
          git diff --stat HEAD^ HEAD | tee artifacts/templateengine/diff-stat.txt || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: settings-templateengine-reachability
          path: artifacts/templateengine/
          if-no-files-found: error
          retention-days: 14
