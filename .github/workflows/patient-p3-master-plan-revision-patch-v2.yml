name: Patient P3 Master Plan Revision Patch V2

on:
  pull_request:
    branches:
      - agent/patient-page-p2-journey
    paths:
      - '.github/workflows/patient-p3-master-plan-revision-patch-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/patient-page-p3-clinique'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ENVIRONMENT: test
      SECRET_KEY: patient-p3-master-plan-secret-000001-long-enough
      DATABASE_URL: sqlite:///./p3-master-plan.db
      TELEMETRY_ENABLED: 'false'
      CLOUD_AI_ENABLED: 'false'
      DEBUG: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reuse guarded P3-C route patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap
          workflow = Path('.github/workflows/patient-p3-master-plan-revision-patch.yml').read_text(encoding='utf-8')
          start = workflow.index("          python - <<'PY'\n") + len("          python - <<'PY'\n")
          end = workflow.index("\n          PY\n", start)
          script = textwrap.dedent(workflow[start:end])
          exec(compile(script, 'patient-p3-master-plan-revision-patch', 'exec'), {})
          PY
          python -m compileall -q backend
          git diff --check
      - name: Install backend and run P3-C test
        run: |
          python -m pip install --upgrade pip
          grep -vE '^(torch|torchvision)([<=>].*)?$' requirements.txt > /tmp/requirements-p3c-v2.txt
          pip install -r /tmp/requirements-p3c-v2.txt
          pip install httpx==0.27.2 pytest
          pytest -q backend/tests/test_patient_p3_master_plan_revisions.py
      - name: Commit P3-C route wiring
        run: |
          git config user.name 'digital-crown-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add backend/routers/patients.py
          git diff --cached --quiet && exit 0
          git commit -m 'feat(patient): version Master Plan saves'
          git push origin HEAD:${GITHUB_HEAD_REF}
