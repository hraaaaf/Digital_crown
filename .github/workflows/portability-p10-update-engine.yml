name: Portability P10 Update Engine

on:
  pull_request:
    paths:
      - "backend/core/platform.py"
      - "backend/services/update_engine.py"
      - "backend/services/update_apply.py"
      - "backend/services/update_finalize.py"
      - "backend/services/update_post_install.py"
      - "backend/services/update_db_rollback.py"
      - "backend/services/update_recovery.py"
      - "backend/routers/update_portability_p10.py"
      - "backend/routers/__init__.py"
      - "backend/tests/test_update_engine.py"
      - "backend/tests/test_update_apply.py"
      - "backend/tests/test_update_post_install.py"
      - "backend/tests/test_update_db_rollback.py"
      - "backend/tests/test_update_recovery.py"
      - "run.py"
      - "DigitalCrown.spec"
      - "scripts/p10_update_contract_check.py"
      - "scripts/windows_update_worker_entry.ps1"
      - "scripts/windows_update_worker.ps1"
      - "scripts/windows_update_worker_core.ps1"
      - "scripts/windows_update_recovery.ps1"
      - "scripts/p10_windows_worker_ci.ps1"
      - "scripts/p10_windows_db_rollback_ci.ps1"
      - "scripts/p10_windows_packaged_lifecycle_ci.py"
      - "scripts/p10_windows_packaged_finalization_ci.py"
      - "docs/portability/P10_UPDATE_ENGINE.md"
      - ".github/workflows/portability-p10-update-engine.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secure-core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install targeted dependencies
        run: python -m pip install --disable-pip-version-check pytest cryptography sqlalchemy python-dotenv
      - name: Compile P10
        run: python -m py_compile run.py backend/core/platform.py backend/services/update_engine.py backend/services/update_apply.py backend/services/update_finalize.py backend/services/update_post_install.py backend/services/update_db_rollback.py backend/services/update_recovery.py backend/routers/update_portability_p10.py backend/tests/test_update_engine.py backend/tests/test_update_apply.py backend/tests/test_update_post_install.py backend/tests/test_update_db_rollback.py backend/tests/test_update_recovery.py scripts/p10_update_contract_check.py scripts/p10_windows_packaged_lifecycle_ci.py scripts/p10_windows_packaged_finalization_ci.py
      - name: Static contract
        run: python scripts/p10_update_contract_check.py
      - name: Secure-core, production wiring, recovery, finalization, post-install and DB rollback tests
        run: python -m pytest backend/tests/test_update_engine.py backend/tests/test_update_apply.py backend/tests/test_update_post_install.py backend/tests/test_update_db_rollback.py backend/tests/test_update_recovery.py -q --noconftest

  windows-worker:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Windows PowerShell 5.1 external worker contract
        shell: pwsh
        run: |
          $nativePs = "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe"
          if (-not (Test-Path -LiteralPath $nativePs -PathType Leaf)) { throw "Windows PowerShell 5.1 missing on Windows runner" }
          $nativeVersion = (& $nativePs -NoProfile -Command '$PSVersionTable.PSVersion.ToString()').Trim()
          if (-not $nativeVersion.StartsWith('5.1')) { throw "Expected Windows PowerShell 5.1, got $nativeVersion" }
          $nativeModuleRoot = "$env:SystemRoot\System32\WindowsPowerShell\v1.0\Modules"
          if (-not (Test-Path -LiteralPath $nativeModuleRoot -PathType Container)) { throw "Windows PowerShell native module root missing: $nativeModuleRoot" }
          $moduleRoots = @($nativeModuleRoot)
          $programFilesModules = Join-Path $env:ProgramFiles 'WindowsPowerShell\Modules'
          if (Test-Path -LiteralPath $programFilesModules -PathType Container) { $moduleRoots += $programFilesModules }
          if ($env:PSModulePath) { $moduleRoots += $env:PSModulePath }
          $env:PSModulePath = ($moduleRoots -join ';')
          $fileHashCommand = (& $nativePs -NoProfile -Command '(Get-Command Get-FileHash -ErrorAction Stop).Name').Trim()
          if ($fileHashCommand -ne 'Get-FileHash') { throw "Windows PowerShell 5.1 Get-FileHash unavailable" }
          foreach ($script in @('scripts/windows_update_worker_entry.ps1','scripts/windows_update_recovery.ps1')) {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script).Path,[ref]$tokens,[ref]$errors) | Out-Null
            if (@($errors).Count -gt 0) { throw "$script parse failed: $(@($errors | ForEach-Object { $_.Message }) -join ' | ')" }
          }
          $shimDir = Join-Path $env:RUNNER_TEMP 'dc-p10-ps51-shim'
          New-Item -ItemType Directory -Force $shimDir | Out-Null
          $shim = Join-Path $shimDir 'pwsh.cmd'
          '@echo off' + "`r`n" + '"%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe" %*' + "`r`n" | Set-Content -LiteralPath $shim -Encoding ascii
          $env:PATH = "$shimDir;$env:PATH"
          $resolved = (Get-Command pwsh -CommandType Application).Source
          if (-not $resolved.StartsWith($shimDir, [StringComparison]::OrdinalIgnoreCase)) { throw "PowerShell 5.1 shim is not first on PATH: $resolved" }
          ./scripts/p10_windows_worker_ci.ps1
          if ($LASTEXITCODE -notin @(0, 2)) { throw "Windows worker core harness failed: $LASTEXITCODE" }
          ./scripts/p10_windows_db_rollback_ci.ps1
          if ($LASTEXITCODE -ne 0) { throw "Windows DB rollback bridge harness failed: $LASTEXITCODE" }
          $global:LASTEXITCODE = 0
          Write-Host "P10_WINDOWS_POWERSHELL=5.1"
          exit 0

  windows-packaged-lifecycle:
    runs-on: windows-2025
    timeout-minutes: 120
    env:
      PYTHON_VERSION: "3.12"
      NODE_VERSION: "20"
      INNO_SETUP_RELEASE: "is-6_7_3"
      INNO_SETUP_URL: "https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe"
      INNO_SETUP_SHA256: "9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: P6 packaging static contract
        run: python scripts/p6_packaging_check.py --static
      - name: Build frontend once
        shell: pwsh
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build
      - name: Install exact Windows packaging toolchain
        shell: pwsh
        run: |
          python -m pip install --no-cache-dir -r backend/requirements-p6-windows.txt
          python -m pip check
          $installer = Join-Path $env:RUNNER_TEMP "innosetup-6.7.3.exe"
          $innoDir = Join-Path $env:RUNNER_TEMP "InnoSetup-6.7.3"
          Invoke-WebRequest -Uri $env:INNO_SETUP_URL -OutFile $installer
          $actual = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLowerInvariant()
          if ($actual -ne $env:INNO_SETUP_SHA256) { throw "Inno Setup SHA256 mismatch: $actual" }
          $signature = Get-AuthenticodeSignature $installer
          if ($signature.Status -ne 'Valid') { throw "Inno Setup Authenticode invalid: $($signature.Status)" }
          $proc = Start-Process -FilePath $installer -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-',"/DIR=$innoDir") -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "Inno Setup install failed: $($proc.ExitCode)" }
          $iscc = Join-Path $innoDir "ISCC.exe"
          if (-not (Test-Path -LiteralPath $iscc -PathType Leaf)) { throw "ISCC.exe missing after exact install" }
          "P10_ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "P10_INNO_SETUP=SUCCESS release=$env:INNO_SETUP_RELEASE sha256=$actual authenticode=$($signature.Status)"
      - name: Build real current and next installers
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $baselineVersion = (Get-Content VERSION -Raw).Trim()
          if ($baselineVersion -ne "1.0.0") { throw "P10 benchmark requires current VERSION=1.0.0, got $baselineVersion" }
          if (-not $env:P10_ISCC -or -not (Test-Path -LiteralPath $env:P10_ISCC -PathType Leaf)) { throw "P10_ISCC missing" }
          $packages = Join-Path $env:RUNNER_TEMP "dc-p10-packages"
          New-Item -ItemType Directory -Path $packages -Force | Out-Null
          python scripts/generate_windows_version_info.py --output build/windows-version-info.txt
          python -m PyInstaller --noconfirm --clean DigitalCrown.spec
          & $env:P10_ISCC "/DMyAppVersion=$baselineVersion" installer\DigitalCrown.iss
          if ($LASTEXITCODE -ne 0) { throw "P10 baseline Inno build failed" }
          $baseline = (Resolve-Path "dist_installer\DigitalCrownSetup-$baselineVersion.exe").Path
          $baselineCopy = Join-Path $packages "DigitalCrownSetup-$baselineVersion.exe"
          Copy-Item -LiteralPath $baseline -Destination $baselineCopy -Force
          try {
            Set-Content -LiteralPath VERSION -Value "1.0.1" -NoNewline -Encoding ascii
            python scripts/generate_windows_version_info.py --output build/windows-version-info.txt
            python -m PyInstaller --noconfirm --clean DigitalCrown.spec
            & $env:P10_ISCC "/DMyAppVersion=1.0.1" installer\DigitalCrown.iss
            if ($LASTEXITCODE -ne 0) { throw "P10 target Inno build failed" }
            $target = (Resolve-Path "dist_installer\DigitalCrownSetup-1.0.1.exe").Path
            $targetCopy = Join-Path $packages "DigitalCrownSetup-1.0.1.exe"
            Copy-Item -LiteralPath $target -Destination $targetCopy -Force
          } finally { Set-Content -LiteralPath VERSION -Value $baselineVersion -NoNewline -Encoding ascii }
          "P10_BASELINE_INSTALLER=$baselineCopy" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "P10_TARGET_INSTALLER=$targetCopy" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "P10_PACKAGED_PAIR=READY current=$baselineVersion target=1.0.1"
      - name: Real packaged current to next, finalization, interruption recovery and DB rollback lifecycle
        shell: pwsh
        run: |
          $nativePs = "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe"
          if (-not (Test-Path -LiteralPath $nativePs -PathType Leaf)) { throw "Windows PowerShell 5.1 missing" }
          $nativeModuleRoot = "$env:SystemRoot\System32\WindowsPowerShell\v1.0\Modules"
          $programFilesModules = Join-Path $env:ProgramFiles 'WindowsPowerShell\Modules'
          $moduleRoots = @($nativeModuleRoot)
          if (Test-Path -LiteralPath $programFilesModules -PathType Container) { $moduleRoots += $programFilesModules }
          if ($env:PSModulePath) { $moduleRoots += $env:PSModulePath }
          $env:PSModulePath = ($moduleRoots -join ';')
          $workRoot = Join-Path $env:RUNNER_TEMP "dc-p10-packaged"
          $report = Join-Path $workRoot "proof.json"
          python scripts/p10_windows_packaged_finalization_ci.py `
            --baseline "$env:P10_BASELINE_INSTALLER" `
            --target "$env:P10_TARGET_INSTALLER" `
            --work-root "$workRoot" `
            --report "$report" `
            --repo-root "$env:GITHUB_WORKSPACE"
          if ($LASTEXITCODE -ne 0) { throw "P10 real packaged lifecycle failed: $LASTEXITCODE" }
          Write-Host "P10_WINDOWS_PACKAGED_PROOF=$(Get-Content -LiteralPath $report -Raw)"
      - name: Upload packaged lifecycle proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digitalcrown-p10-windows-packaged-lifecycle-proof
          path: |
            ${{ runner.temp }}\dc-p10-packaged\proof.json
            ${{ runner.temp }}\dc-p10-packaged\**\worker-stdout.log
            ${{ runner.temp }}\dc-p10-packaged\**\worker-stderr.log
            ${{ runner.temp }}\dc-p10-packaged\**\windows-update-worker.log
            ${{ runner.temp }}\dc-p10-packaged\**\windows-update-recovery.log
            ${{ runner.temp }}\dc-p10-packaged\**\recovery-stdout.log
            ${{ runner.temp }}\dc-p10-packaged\**\recovery-stderr.log
            ${{ runner.temp }}\dc-p10-packaged\**\installer-apply.log
            ${{ runner.temp }}\dc-p10-packaged\**\update-finalize-report.json
            ${{ runner.temp }}\dc-p10-packaged\**\db-rollback-report.json
            ${{ runner.temp }}\dc-p10-packaged\**\db-rollback-state.json
            ${{ runner.temp }}\dc-p10-packaged\**\trusted_state.json
            ${{ runner.temp }}\dc-p10-packaged\**\*-install.log
            ${{ runner.temp }}\dc-p10-packaged\**\*-uninstall.log
            ${{ runner.temp }}\dc-p10-packaged\**\*-self-test.json
          if-no-files-found: warn
