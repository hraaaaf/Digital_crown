name: Portability P10 Update Engine

on:
  pull_request:
    paths:
      - "backend/services/update_engine.py"
      - "backend/services/update_post_install.py"
      - "backend/tests/test_update_engine.py"
      - "backend/tests/test_update_post_install.py"
      - "run.py"
      - "DigitalCrown.spec"
      - "scripts/p10_update_contract_check.py"
      - "scripts/windows_update_worker.ps1"
      - "scripts/p10_windows_worker_ci.ps1"
      - "docs/portability/P10_UPDATE_ENGINE.md"
      - ".github/workflows/portability-p10-update-engine.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secure-core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install targeted dependencies
        run: python -m pip install --disable-pip-version-check pytest cryptography sqlalchemy python-dotenv
      - name: Compile P10
        run: python -m py_compile backend/services/update_engine.py backend/services/update_post_install.py backend/tests/test_update_engine.py backend/tests/test_update_post_install.py scripts/p10_update_contract_check.py
      - name: Static contract
        run: python scripts/p10_update_contract_check.py
      - name: Secure-core and post-install truth tests
        run: python -m pytest backend/tests/test_update_engine.py backend/tests/test_update_post_install.py -q --noconftest

  windows-worker:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Windows PowerShell 5.1 external worker contract
        shell: pwsh
        run: |
          $nativePs = "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe"
          if (-not (Test-Path -LiteralPath $nativePs -PathType Leaf)) {
            throw "Windows PowerShell 5.1 missing on Windows runner"
          }
          $nativeVersion = (& $nativePs -NoProfile -Command '$PSVersionTable.PSVersion.ToString()').Trim()
          if (-not $nativeVersion.StartsWith('5.1')) {
            throw "Expected Windows PowerShell 5.1, got $nativeVersion"
          }

          # The existing deterministic harness invokes a command named `pwsh` for
          # child workers. Put a shim first on PATH so every child worker actually
          # executes with the native Windows PowerShell 5.1 binary, without changing
          # the test scenarios themselves.
          $shimDir = Join-Path $env:RUNNER_TEMP 'dc-p10-ps51-shim'
          New-Item -ItemType Directory -Force $shimDir | Out-Null
          $shim = Join-Path $shimDir 'pwsh.cmd'
          '@echo off' + "`r`n" + '"%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe" %*' + "`r`n" |
            Set-Content -LiteralPath $shim -Encoding ascii
          $env:PATH = "$shimDir;$env:PATH"
          $resolved = (Get-Command pwsh -CommandType Application).Source
          if (-not $resolved.StartsWith($shimDir, [StringComparison]::OrdinalIgnoreCase)) {
            throw "PowerShell 5.1 shim is not first on PATH: $resolved"
          }

          ./scripts/p10_windows_worker_ci.ps1
          # The rollback drill intentionally launches a child worker that exits 2.
          # GitHub's pwsh wrapper propagates stale LASTEXITCODE even when the harness
          # has verified that exit code as expected, so normalize only after the
          # harness returns normally. Any terminating harness error stops before here.
          $global:LASTEXITCODE = 0
          Write-Host "P10_WINDOWS_POWERSHELL=5.1"
          exit 0
