name: Portability P10 Update Engine

on:
  pull_request:
    paths:
      - "backend/services/update_engine.py"
      - "backend/services/update_post_install.py"
      - "backend/services/update_db_rollback.py"
      - "backend/tests/test_update_engine.py"
      - "backend/tests/test_update_post_install.py"
      - "backend/tests/test_update_db_rollback.py"
      - "run.py"
      - "DigitalCrown.spec"
      - "scripts/p10_update_contract_check.py"
      - "scripts/windows_update_worker.ps1"
      - "scripts/windows_update_worker_core.ps1"
      - "scripts/p10_windows_worker_ci.ps1"
      - "scripts/p10_windows_db_rollback_ci.ps1"
      - "docs/portability/P10_UPDATE_ENGINE.md"
      - ".github/workflows/portability-p10-update-engine.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secure-core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install targeted dependencies
        run: python -m pip install --disable-pip-version-check pytest cryptography sqlalchemy python-dotenv
      - name: Compile P10
        run: python -m py_compile run.py backend/services/update_engine.py backend/services/update_post_install.py backend/services/update_db_rollback.py backend/tests/test_update_engine.py backend/tests/test_update_post_install.py backend/tests/test_update_db_rollback.py scripts/p10_update_contract_check.py
      - name: Static contract
        run: python scripts/p10_update_contract_check.py
      - name: Secure-core, post-install and DB rollback tests
        run: python -m pytest backend/tests/test_update_engine.py backend/tests/test_update_post_install.py backend/tests/test_update_db_rollback.py -q --noconftest

  windows-worker:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Windows PowerShell 5.1 external worker contract
        shell: pwsh
        run: |
          $nativePs = "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe"
          if (-not (Test-Path -LiteralPath $nativePs -PathType Leaf)) {
            throw "Windows PowerShell 5.1 missing on Windows runner"
          }
          $nativeVersion = (& $nativePs -NoProfile -Command '$PSVersionTable.PSVersion.ToString()').Trim()
          if (-not $nativeVersion.StartsWith('5.1')) {
            throw "Expected Windows PowerShell 5.1, got $nativeVersion"
          }

          # pwsh on the hosted runner can inject a PowerShell 7-centric PSModulePath.
          # Restore the Windows PowerShell module roots before spawning native 5.1
          # children so the contract matches a clean Windows cabinet environment.
          $nativeModuleRoot = "$env:SystemRoot\System32\WindowsPowerShell\v1.0\Modules"
          if (-not (Test-Path -LiteralPath $nativeModuleRoot -PathType Container)) {
            throw "Windows PowerShell native module root missing: $nativeModuleRoot"
          }
          $moduleRoots = @($nativeModuleRoot)
          $programFilesModules = Join-Path $env:ProgramFiles 'WindowsPowerShell\Modules'
          if (Test-Path -LiteralPath $programFilesModules -PathType Container) {
            $moduleRoots += $programFilesModules
          }
          if ($env:PSModulePath) {
            $moduleRoots += $env:PSModulePath
          }
          $env:PSModulePath = ($moduleRoots -join ';')
          $fileHashCommand = (& $nativePs -NoProfile -Command '(Get-Command Get-FileHash -ErrorAction Stop).Name').Trim()
          if ($fileHashCommand -ne 'Get-FileHash') {
            throw "Windows PowerShell 5.1 Get-FileHash unavailable"
          }

          # The deterministic core harness invokes a command named `pwsh` for child
          # workers. Keep its scenarios unchanged while routing the public
          # orchestrator through native Windows PowerShell 5.1.
          $shimDir = Join-Path $env:RUNNER_TEMP 'dc-p10-ps51-shim'
          New-Item -ItemType Directory -Force $shimDir | Out-Null
          $shim = Join-Path $shimDir 'pwsh.cmd'
          '@echo off' + "`r`n" + '"%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe" %*' + "`r`n" |
            Set-Content -LiteralPath $shim -Encoding ascii
          $env:PATH = "$shimDir;$env:PATH"
          $resolved = (Get-Command pwsh -CommandType Application).Source
          if (-not $resolved.StartsWith($shimDir, [StringComparison]::OrdinalIgnoreCase)) {
            throw "PowerShell 5.1 shim is not first on PATH: $resolved"
          }

          ./scripts/p10_windows_worker_ci.ps1
          if ($LASTEXITCODE -notin @(0, 2)) {
            throw "Windows worker core harness failed: $LASTEXITCODE"
          }
          ./scripts/p10_windows_db_rollback_ci.ps1
          if ($LASTEXITCODE -ne 0) {
            throw "Windows DB rollback bridge harness failed: $LASTEXITCODE"
          }
          $global:LASTEXITCODE = 0
          Write-Host "P10_WINDOWS_POWERSHELL=5.1"
          exit 0
