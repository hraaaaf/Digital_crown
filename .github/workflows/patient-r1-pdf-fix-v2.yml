name: Patient R1 PDF Fix V2

on:
  push:
    branches: [agent/patient-page-p0-rescue]
    paths:
      - '.github/workflows/patient-r1-pdf-fix-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ENVIRONMENT: test
      SECRET_KEY: patient-r1-pdf-fix-secret-000001
      DATABASE_URL: sqlite:///:memory:
      TELEMETRY_ENABLED: 'false'
      CLOUD_AI_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/patient-page-p0-rescue
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply authenticated PDF transport
        run: |
          python - <<'PY'
          from pathlib import Path
          ia=Path('backend/routers/ia.py')
          src=ia.read_text(encoding='utf-8')
          old='''@router.get("/panoramic/{analysis_id}/pdf")
def download_panoramic_pdf(analysis_id: int, db: Session = Depends(database.get_db), current_user: models.User = Depends(require_permission("panoramic"))):
    """Génère et retourne l'URL du bilan PDF professionnel Élite."""
    try:
        from backend.services.generators.panoramic_elite_gen import panoramic_elite_generator
        pdf_url = panoramic_elite_generator.generate(
            db=db,
            analysis_id=analysis_id,
            current_user=current_user
        )
        return {"pdf_url": f"{os.getenv('BACKEND_URL', 'http://localhost:8000')}/{pdf_url}"}
    except Exception as e:
        logger.exception(f"Erreur lors de la génération du PDF panoramique Élite: {e}")
        raise HTTPException(status_code=500, detail=str(e))
'''
          new='''@router.get("/panoramic/{analysis_id}/pdf")
def download_panoramic_pdf(analysis_id: int, db: Session = Depends(database.get_db), current_user: models.User = Depends(require_permission("panoramic"))):
    """Génère et diffuse le PDF panoramique via un flux authentifié."""
    analysis = db.query(models.PanoramicAnalysis).filter(models.PanoramicAnalysis.id == analysis_id).first()
    if not analysis:
        raise HTTPException(status_code=404, detail="Analyse introuvable")
    assert_patient_access(analysis.patient_id, current_user, db)
    try:
        from fastapi.responses import FileResponse
        from backend.services.generators.panoramic_elite_gen import panoramic_elite_generator
        pdf_rel = panoramic_elite_generator.generate(db=db, analysis_id=analysis_id, current_user=current_user)
        clean_rel = pdf_rel.removeprefix("api/")
        pdf_path = os.path.join(BASE_DIR, clean_rel)
        if not os.path.isfile(pdf_path):
            raise HTTPException(status_code=500, detail="PDF généré introuvable")
        return FileResponse(path=pdf_path, media_type="application/pdf", filename=os.path.basename(pdf_path))
    except HTTPException:
        raise
    except Exception as e:
        logger.exception(f"Erreur lors de la génération du PDF panoramique Élite: {e}")
        raise HTTPException(status_code=500, detail=str(e))
'''
          if 'return FileResponse(path=pdf_path' not in src:
              if old not in src: raise SystemExit('ia.py PDF anchor mismatch')
              src=src.replace(old,new,1)
              ia.write_text(src,encoding='utf-8')

          ui=Path('frontend/src/features/panoramic/PanoramicStudio.tsx')
          src=ui.read_text(encoding='utf-8')
          pairs=[
          ('''      const response = await api.get(`/ia/panoramic/${result.id}/pdf`);
      window.open(response.data.pdf_url, '_blank');''','''      const response = await api.get(`/ia/panoramic/${result.id}/pdf`, { responseType: 'blob' });
      const blobUrl = URL.createObjectURL(response.data);
      window.open(blobUrl, '_blank', 'noopener,noreferrer');
      window.setTimeout(() => URL.revokeObjectURL(blobUrl), 60_000);'''),
          ('''      const response = await api.get(`/ia/panoramic/${result.id}/pdf`);
      setPreviewPdfUrl(response.data.pdf_url);''','''      const response = await api.get(`/ia/panoramic/${result.id}/pdf`, { responseType: 'blob' });
      setPreviewPdfUrl(URL.createObjectURL(response.data));''')]
          for before,after in pairs:
              if after not in src:
                  if before not in src: raise SystemExit('PanoramicStudio PDF anchor mismatch')
                  src=src.replace(before,after,1)
          ui.write_text(src,encoding='utf-8')
          PY
          git diff --check
      - name: Security contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          ia=Path('backend/routers/ia.py').read_text(encoding='utf-8')
          ui=Path('frontend/src/features/panoramic/PanoramicStudio.tsx').read_text(encoding='utf-8')
          gen=Path('backend/services/generators/panoramic_elite_gen.py').read_text(encoding='utf-8')
          start=ia.index('@router.get("/panoramic/{analysis_id}/pdf")'); end=ia.index('@router.delete("/panoramic/{analysis_id}"',start); endpoint=ia[start:end]
          assert endpoint.index('assert_patient_access') < endpoint.index('panoramic_elite_generator.generate')
          assert 'FileResponse(' in endpoint and 'pdf_url' not in endpoint
          assert "responseType: 'blob'" in ui and 'response.data.pdf_url' not in ui
          g=gen.index('def generate(')
          assert gen.index('assert_patient_access(analysis.patient_id, current_user, db)',g) < gen.index('patient = db.query(models.Patient)',g)
          print('R1 PDF security contracts OK')
          PY
          python -m py_compile backend/routers/ia.py backend/services/generators/panoramic_elite_gen.py
      - name: Install frontend and build
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Write proof
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          proof={'status':'CERTIFIED','run_id':os.environ['RUN_ID'],'contracts':['patient access asserted before PDF generation','authenticated FileResponse only','no static pdf_url response','frontend uses authenticated blob transport','frontend production build']}
          Path('docs/PATIENT_R1_PDF_CERT.json').write_text(json.dumps(proof,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git diff --check
      - name: Commit, rebase, push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/routers/ia.py frontend/src/features/panoramic/PanoramicStudio.tsx docs/PATIENT_R1_PDF_CERT.json
          git diff --cached --check
          git commit -m 'cert(patient): secure panoramic PDF transport'
          git fetch origin agent/patient-page-p0-rescue
          git rebase origin/agent/patient-page-p0-rescue
          git push origin HEAD:agent/patient-page-p0-rescue
