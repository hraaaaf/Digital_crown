name: Patient P0-H Baseline

on:
  push:
    branches:
      - agent/patient-page-p0-rescue
    paths:
      - '.github/workflows/patient-p0h-baseline.yml'
      - 'frontend/scripts/capture-patient-p0h-baseline.mjs'
  workflow_dispatch:

concurrency:
  group: patient-p0h-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ENVIRONMENT: test
      SECRET_KEY: patient-p0h-baseline-secret-000001
      DATABASE_URL: sqlite:///./t2-runtime-cert.db
      TELEMETRY_ENABLED: "false"
      CLOUD_AI_ENABLED: "false"
      DEBUG: "false"
      ALLOWED_ORIGINS: "http://127.0.0.1:5173,http://localhost:5173"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.12.0 torchvision==0.27.0 --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^(torch|torchvision)([<=>].*)?$' requirements.txt > /tmp/requirements-p0h.txt
          pip install -r /tmp/requirements-p0h.txt
          pip install httpx==0.27.2
      - name: Install frontend and Chromium
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start isolated backend
        run: |
          python scripts/t2_runtime_server.py > /tmp/p0h-backend.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8005/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/p0h-backend.log
          exit 1
      - name: Start frontend
        working-directory: frontend
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 > /tmp/p0h-frontend.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:5173 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/p0h-frontend.log
          exit 1
      - name: Capture current Patient header baseline
        working-directory: frontend
        run: |
          mkdir -p ../artifacts/patient-p0h-baseline
          node scripts/capture-patient-p0h-baseline.mjs 2>&1 | tee ../artifacts/patient-p0h-baseline/runner.log
          test -f ../artifacts/patient-p0h-baseline/summary.json
          test -f ../artifacts/patient-p0h-baseline/evidence.json
          test "$(find ../artifacts/patient-p0h-baseline -maxdepth 1 -name '*.png' | wc -l)" -eq 4
      - name: Upload baseline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patient-p0h-baseline
          path: artifacts/patient-p0h-baseline
          if-no-files-found: error
          retention-days: 14
