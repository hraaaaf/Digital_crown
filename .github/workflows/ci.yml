name: CI

# S9 — Pipeline d'intégration continue Digital Crown.
# Gate de pré-production : durcissement config + suite de tests (sécurité,
# contrôle d'accès, capsule IA, Crown Bot). Aucune donnée patient n'est touchée :
# les tests tournent sur SQLite in-memory isolé (voir backend/tests/conftest.py).
#
# INVARIANT ABSOLU DE NON-RÉGRESSION
# Toute modification doit préserver intégralement l'existant.
# Elle ne doit casser, altérer, perdre ou rendre incompatibles ni la base de données
# et ses données existantes, ni les dossiers patients, ni les documents existants
# (lecture, génération, archivage), ni une fonctionnalité déjà validée.
# Une CI verte ne constitue pas à elle seule la preuve de cette préservation :
# tout changement à risque doit ajouter/adapter les tests de non-régression nécessaires
# et, lorsqu'il touche DB/patients/documents, être complété par le rehearsal approprié.

on:
  push:
    branches: [main, master, "S[0-9]*", "redressement*"]
  pull_request:
  workflow_dispatch:
    inputs:
      backend_only:
        description: "Run only the full backend regression job"
        required: false
        default: false
        type: boolean

concurrency:
  group: ci-${{ github.ref }}
  # Keep every post-merge default-branch regression alive. Superseded PR/feature
  # runs may still be cancelled to avoid wasting CI capacity.
  cancel-in-progress: ${{ !(github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')) }}

jobs:
  classify-change:
    name: Classify CI change scope
    runs-on: ubuntu-latest
    outputs:
      test_only: ${{ steps.scope.outputs.test_only }}
      changed_tests: ${{ steps.scope.outputs.changed_tests }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: scope
        name: Detect strict test-only PR synchronization
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
        run: |
          set -euo pipefail
          echo "test_only=false" >> "$GITHUB_OUTPUT"
          echo "changed_tests=" >> "$GITHUB_OUTPUT"

          # Fast-path is intentionally narrow: only an incremental PR synchronize
          # event with an explicit before/after range may qualify.
          if [[ "$EVENT_NAME" != "pull_request" || "$EVENT_ACTION" != "synchronize" ]]; then
            echo "Full CI: event is not an incremental PR synchronization."
            exit 0
          fi
          if [[ -z "$BEFORE_SHA" || -z "$AFTER_SHA" || "$BEFORE_SHA" =~ ^0+$ || "$AFTER_SHA" =~ ^0+$ ]]; then
            echo "Full CI: missing trustworthy before/after range."
            exit 0
          fi

          mapfile -t changed < <(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA")
          if [[ "${#changed[@]}" -eq 0 ]]; then
            echo "Full CI: empty delta is not eligible for fast-path."
            exit 0
          fi

          tests=()
          for file in "${changed[@]}"; do
            case "$file" in
              frontend/src/*.test.ts|frontend/src/*.test.tsx|frontend/src/**/*.test.ts|frontend/src/**/*.test.tsx|frontend/src/*.spec.ts|frontend/src/*.spec.tsx|frontend/src/**/*.spec.ts|frontend/src/**/*.spec.tsx)
                tests+=("${file#frontend/}")
                ;;
              *)
                echo "Full CI: non-test file changed: $file"
                exit 0
                ;;
            esac
          done

          printf 'changed_tests=%s\n' "$(IFS=,; echo "${tests[*]}")" >> "$GITHUB_OUTPUT"
          echo "test_only=true" >> "$GITHUB_OUTPUT"
          printf 'Fast CI: strict test-only delta (%d file(s))\n' "${#tests[@]}"

  # Generic full backend regression is intentionally post-merge.
  # PRs keep targeted lot checks plus frontend/build and the lightweight prod gate.
  test:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'))
    name: Full backend regression (post-merge)
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-only-secret-key-minimum-32-characters-long
      DATABASE_URL: "sqlite:///:memory:"
      ENVIRONMENT: development
      TELEMETRY_ENABLED: "false"
      CLOUD_AI_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.10.0 torchvision==0.25.0 torchaudio==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^(torch|torchvision|torchaudio)([<=>].*)?$' requirements.txt > /tmp/requirements-ci.txt
          pip install -r /tmp/requirements-ci.txt
          python -m pip check

      - name: Prod safety check (config hardening)
        run: python scripts/prod_safety_check.py

      - name: Full backend regression suite (DB / patients / documents included)
        run: python -m pytest backend/tests -q

  frontend:
    needs: classify-change
    if: github.event_name != 'workflow_dispatch' || inputs.backend_only != true
    name: Frontend (tests & build)
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Fast-path — run only changed test files
        if: needs.classify-change.outputs.test_only == 'true'
        shell: bash
        env:
          CHANGED_TESTS: ${{ needs.classify-change.outputs.changed_tests }}
        run: |
          set -euo pipefail
          IFS=',' read -ra files <<< "$CHANGED_TESTS"
          test "${#files[@]}" -gt 0
          for file in "${files[@]}"; do
            echo "::group::vitest $file"
            npx vitest run "$file" --maxWorkers=1 --fileParallelism=false
            echo "::endgroup::"
          done

      - name: Test suite — shard 1/12 isolated files
        if: needs.classify-change.outputs.test_only != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(npx vitest list --filesOnly --shard=1/12)
          test "${#files[@]}" -gt 0
          for file in "${files[@]}"; do
            echo "::group::vitest $file"
            npx vitest run "$file" --maxWorkers=1 --fileParallelism=false
            echo "::endgroup::"
          done

      - name: Test suite — shard 2/12 isolated files
        if: needs.classify-change.outputs.test_only != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(npx vitest list --filesOnly --shard=2/12)
          test "${#files[@]}" -gt 0
          for file in "${files[@]}"; do
            echo "::group::vitest $file"
            npx vitest run "$file" --maxWorkers=1 --fileParallelism=false
            echo "::endgroup::"
          done

      - name: Test suite — shard 3/12 isolated files
        if: needs.classify-change.outputs.test_only != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(npx vitest list --filesOnly --shard=3/12)
          test "${#files[@]}" -gt 0
          for file in "${files[@]}"; do
