name: Mobile M4-A Patient BEFORE

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: mobile-m4a-before-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  before:
    name: M4-A patient exact-context BEFORE
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout audit head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Record immutable baseline
        run: |
          echo "BASELINE_HEAD=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_ENV"
          CHANGED=$(git diff --name-only "${{ github.event.pull_request.base.sha }}"...HEAD || true)
          echo "$CHANGED"
          if echo "$CHANGED" | grep -Ev '^(\.audit/mobile-m4a-|docs/MOBILE_M4_A_PATIENT_BRIDGE_GOAL\.md|\.github/workflows/ci\.yml)$' | grep -q .; then
            echo "::error::Audit M4-A contient un changement produit"
            exit 1
          fi

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend + Chromium
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Materialize BEFORE harness
        run: |
          cp .audit/mobile-m4a-before.html frontend/mobile-m4a-before.html
          cp .audit/mobile-m4a-before.tsx frontend/src/mobile-m4a-before.tsx
          cp .audit/mobile-m4a-before.mjs frontend/mobile-m4a-before.mjs

      - name: Capture M4-A BEFORE
        working-directory: frontend
        run: node mobile-m4a-before.mjs

      - name: Assert BEFORE contract
        working-directory: frontend
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads(Path('mobile-m4a-before-artifacts/report.json').read_text())
          assert report['baselineHead'] == os.environ['BASELINE_HEAD']
          assert len(report['captures']) == 5
          assert report['bridgeAbsent'] is True
          assert report['exactPatientMobileAbsent'] is True
          assert all(not item['errors'] for item in report['captures'])
          assert all(not item['metrics']['hasHorizontalOverflow'] for item in report['captures'])
          print('M4-A BEFORE PASS')
          PY
          cat > mobile-m4a-before-artifacts/metadata.txt <<EOF
          chantier=Digital Crown Mobile Full Experience
          lot=M4-A Patient contextuel
          baseline_head=${BASELINE_HEAD}
          desktop_viewports=1280x900,768x1024
          mobile_viewports=390x844,430x932,768x1024
          product_change=none
          deployment=none
          EOF

      - name: Upload BEFORE evidence
        uses: actions/upload-artifact@v4
        with:
          name: mobile-m4a-patient-before
          path: frontend/mobile-m4a-before-artifacts/
          if-no-files-found: error
          retention-days: 14
