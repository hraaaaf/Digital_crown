name: CI

# S9 — Pipeline d'intégration continue Digital Crown.
# Gate de pré-production : durcissement config + suite de tests (sécurité,
# contrôle d'accès, capsule IA, Crown Bot). Aucune donnée patient n'est touchée :
# les tests tournent sur SQLite in-memory isolé (voir backend/tests/conftest.py).

on:
  push:
    branches: [main, master, "S[0-9]*", "redressement*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests & durcissement
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-only-secret-key-minimum-32-characters-long
      DATABASE_URL: "sqlite:///:memory:"
      ENVIRONMENT: development
      TELEMETRY_ENABLED: "false"
      CLOUD_AI_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.12.0 torchvision==0.27.0 --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^(torch|torchvision)([<=>].*)?$' requirements.txt > /tmp/requirements-ci.txt
          pip install -r /tmp/requirements-ci.txt
          pip install httpx==0.27.2 pytest pytest-asyncio

      - name: Prod safety check (config hardening)
        run: python scripts/prod_safety_check.py

      - name: Test suite
        run: python -m pytest backend/tests -q --maxfail=1

  frontend:
    name: Frontend (tests & build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test suite
        run: npm test

      - name: Build
        run: npm run build

  prod-gate:
    name: Garde production (négatif)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pydantic-settings==2.2.1

      - name: Le garde DOIT refuser une config prod non durcie
        env:
          ENVIRONMENT: production
          SECRET_KEY: changeme
          DEBUG: "true"
          DATABASE_URL: "sqlite:///./x.db"
        run: |
          if python scripts/prod_safety_check.py; then
            echo "::error::Le prod safety check a accepté une config production non durcie."
            exit 1
          else
            echo "OK : le garde a bien refusé la config production non durcie."
          fi

  m4a-e2e:
    if: github.event_name == 'pull_request'
    name: M4-A Patient contextual bridge AFTER
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Record exact product HEAD
        run: |
          PRODUCT_HEAD=$(git rev-parse HEAD)
          test "$PRODUCT_HEAD" = "${{ github.event.pull_request.head.sha }}"
          echo "PRODUCT_HEAD=$PRODUCT_HEAD" >> "$GITHUB_ENV"

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend and Chromium
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Materialize versioned M4-A AFTER harness
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          source = Path('.audit/mobile-m4a-after-scenario.yml').read_text()
          for target in ['mobile-m4a-after.html', 'src/mobile-m4a-after.tsx', 'mobile-m4a-after.mjs']:
              pattern = rf"cat > {re.escape(target)} <<'EOF'\n(.*?)\n    EOF"
              match = re.search(pattern, source, re.S)
              if not match:
                  raise SystemExit(f'M4-A AFTER block missing: {target}')
              lines = [line[10:] if line.startswith('          ') else line for line in match.group(1).splitlines()]
              destination = Path('frontend') / target
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_text('\n'.join(lines) + '\n')
          print('Versioned M4-A AFTER scenario extracted')
          PY

      - name: Capture exact-head M4-A AFTER
        working-directory: frontend
        run: node mobile-m4a-after.mjs

      - name: Assert M4-A report gates
        working-directory: frontend
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads(Path('mobile-m4a-after-artifacts/report.json').read_text())
          assert report['productHead'] == os.environ['PRODUCT_HEAD']
          assert len(report['captures']) == 13
          assert report['safePairingBodies'] is True
          assert report['e2e']['count'] == 3
          assert report['e2e']['exactPatientVisible'] is True
          assert report['e2e']['idlessRoute'] is True
          assert report['e2e']['protocolObserved'] is True
          assert all(not item['errors'] for item in report['captures'])
          assert all(not item['metrics']['hasHorizontalOverflow'] for item in report['captures'])
          assert all(not item['metrics']['m4aTouchesBelow44'] for item in report['captures'])
          print('M4-A exact-head E2E PASS')
          PY
          cat > mobile-m4a-after-artifacts/metadata.txt <<EOF_META
          chantier=Digital Crown Mobile Full Experience
          lot=M4-A Patient contextual bridge
          product_head=${PRODUCT_HEAD}
          desktop_viewports=768x1024,1280x900
          mobile_viewports=390x844,430x932,768x1024
          e2e=desktop-patient->opaque-bridge->pairing->idless-mobile-context->exact-patient
          deployment=none
          EOF_META

      - uses: actions/upload-artifact@v4
        with:
          name: mobile-m4a-patient-after
          path: frontend/mobile-m4a-after-artifacts/
          if-no-files-found: error
          retention-days: 14

  m4b-e2e:
    if: github.event_name == 'pull_request'
    name: M4-B Panoramic contextual bridge AFTER
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Record exact product HEAD
        run: |
          PRODUCT_HEAD=$(git rev-parse HEAD)
          test "$PRODUCT_HEAD" = "${{ github.event.pull_request.head.sha }}"
          echo "PRODUCT_HEAD=$PRODUCT_HEAD" >> "$GITHUB_ENV"

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend and Chromium
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.62.1
          npx playwright install --with-deps chromium

      - name: Materialize versioned M4-B AFTER harness
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          source = Path('.audit/mobile-m4b-after-scenario.yml').read_text()
          for target in ['mobile-m4b-after.html', 'src/mobile-m4b-after.tsx', 'mobile-m4b-after.mjs']:
              pattern = rf"cat > {re.escape(target)} <<'EOF'\n(.*?)\n    EOF"
              match = re.search(pattern, source, re.S)
              if not match:
                  raise SystemExit(f'M4-B AFTER block missing: {target}')
              lines = [line[10:] if line.startswith('          ') else line for line in match.group(1).splitlines()]
              destination = Path('frontend') / target
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_text('\n'.join(lines) + '\n')
          print('Versioned M4-B AFTER scenario extracted')
          PY

      - name: Capture exact-head M4-B AFTER
        working-directory: frontend
        env:
          PRODUCT_HEAD: ${{ env.PRODUCT_HEAD }}
        run: node mobile-m4b-after.mjs

      - name: Assert M4-B report gates
        working-directory: frontend
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads(Path('mobile-m4b-after-artifacts/report.json').read_text())
          assert report['productHead'] == os.environ['PRODUCT_HEAD']
          assert report['count'] == 7
          assert report['safePairingBodies'] is True
          assert report['trashEndpointAbsent'] is True
          assert report['mobileContextCount'] == 3
          assert report['idlessMobileRoute'] is True
          assert report['noUnexpectedErrors'] is True
          assert report['noHorizontalOverflow'] is True
          assert report['noM4BTouchBelow44'] is True
          print('M4-B exact-head visual PASS')
          PY
          cat > mobile-m4b-after-artifacts/metadata.txt <<EOF_META
          chantier=Digital Crown Mobile Full Experience
          lot=M4-B Panoramic contextual bridge
          product_head=${PRODUCT_HEAD}
          desktop_viewports=768x1024,1280x900
          mobile_viewports=390x844,430x932,768x1024
          flow=exact-panoramic-row->opaque-bridge->idless-mobile-context->protected-media
          deployment=none
          EOF_META

      - uses: actions/upload-artifact@v4
        with:
          name: mobile-m4b-panoramic-after
          path: frontend/mobile-m4b-after-artifacts/
          if-no-files-found: error
          retention-days: 14

  m4c-e2e:
    if: github.event_name == 'pull_request'
    name: M4-C Document contextual bridge AFTER
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Record exact product HEAD
        run: |
          PRODUCT_HEAD=$(git rev-parse HEAD)
          test "$PRODUCT_HEAD" = "${{ github.event.pull_request.head.sha }}"
          echo "PRODUCT_HEAD=$PRODUCT_HEAD" >> "$GITHUB_ENV"

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend and Chromium
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.62.1
          npx playwright install --with-deps chromium

      - name: Materialize versioned M4-C AFTER harness
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          source = Path('.audit/mobile-m4c-after-scenario.yml').read_text()
          for target in ['mobile-m4c-after.html', 'src/mobile-m4c-after.tsx', 'mobile-m4c-after.mjs']:
              pattern = rf"cat > {re.escape(target)} <<'EOF'\n(.*?)\n    EOF"
              match = re.search(pattern, source, re.S)
              if not match:
                  raise SystemExit(f'M4-C AFTER block missing: {target}')
              lines = [line[10:] if line.startswith('          ') else line for line in match.group(1).splitlines()]
              destination = Path('frontend') / target
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_text('\n'.join(lines) + '\n')
          print('Versioned M4-C AFTER scenario extracted')
          PY

      - name: Capture exact-head M4-C AFTER
        working-directory: frontend
        env:
          PRODUCT_HEAD: ${{ env.PRODUCT_HEAD }}
        run: node mobile-m4c-after.mjs

      - name: Assert M4-C report gates
        working-directory: frontend
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads(Path('mobile-m4c-after-artifacts/report.json').read_text())
          assert report['productHead'] == os.environ['PRODUCT_HEAD']
          assert report['count'] == 8
          assert report['safePairingBodies'] is True
          assert report['canonicalBridgePresent'] is True
          assert report['legacyDesktopOnly'] is True
          assert report['mobileContextCount'] == 3
          assert report['exactDocumentVisible'] is True
          assert report['idlessMobileRoute'] is True
          assert report['mediaContextObserved'] is True
          assert report['noLegacyTrashRequest'] is True
          assert report['noUnexpectedErrors'] is True
          assert report['noHorizontalOverflow'] is True
          assert report['noM4CTouchBelow44'] is True
          print('M4-C exact-head visual PASS')
          PY
          cat > mobile-m4c-after-artifacts/metadata.txt <<EOF_META
          chantier=Digital Crown Mobile Full Experience
          lot=M4-C Document contextual bridge
          product_head=${PRODUCT_HEAD}
          desktop_viewports=390x844,430x932,768x1024,1280x900
          mobile_viewports=390x844,430x932,768x1024
          flow=canonical-document->opaque-bridge->idless-mobile-context->protected-media
          legacy=desktop-only
          deployment=none
          EOF_META

      - uses: actions/upload-artifact@v4
        with:
          name: mobile-m4c-document-after
          path: frontend/mobile-m4c-after-artifacts/
          if-no-files-found: error
          retention-days: 14
