name: CI

# S9 — Pipeline d'intégration continue Digital Crown.
# Gate de pré-production : durcissement config + suite de tests (sécurité,
# contrôle d'accès, capsule IA, Crown Bot). Aucune donnée patient n'est touchée :
# les tests tournent sur SQLite in-memory isolé (voir backend/tests/conftest.py).
#
# INVARIANT ABSOLU DE NON-RÉGRESSION
# Toute modification doit préserver intégralement l'existant.
# Elle ne doit casser, altérer, perdre ou rendre incompatibles ni la base de données
# et ses données existantes, ni les dossiers patients, ni les documents existants
# (lecture, génération, archivage), ni une fonctionnalité déjà validée.
# Une CI verte ne constitue pas à elle seule la preuve de cette préservation :
# tout changement à risque doit ajouter/adapter les tests de non-régression nécessaires
# et, lorsqu'il touche DB/patients/documents, être complété par le rehearsal approprié.

on:
  push:
    branches: [main, master, "S[0-9]*", "redressement*"]
  pull_request:
  workflow_dispatch:
    inputs:
      backend_only:
        description: "Run only the full backend regression job"
        required: false
        default: false
        type: boolean

concurrency:
  group: ci-${{ github.ref }}
  # Keep every post-merge default-branch regression alive. Superseded PR/feature
  # runs may still be cancelled to avoid wasting CI capacity.
  cancel-in-progress: ${{ !(github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')) }}

jobs:
  classify-change:
    name: Classify CI change scope
    runs-on: ubuntu-latest
    outputs:
      test_only: ${{ steps.scope.outputs.test_only }}
      changed_tests: ${{ steps.scope.outputs.changed_tests }}
      changed_backend_tests: ${{ steps.scope.outputs.changed_backend_tests }}
      frontend_needed: ${{ steps.scope.outputs.frontend_needed }}
      reuse_pr_frontend: ${{ steps.scope.outputs.reuse_pr_frontend }}
      neo_ordonnance_targeted: ${{ steps.scope.outputs.neo_ordonnance_targeted }}
      m4_bridge_needed: ${{ steps.scope.outputs.m4_bridge_needed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: scope
        name: Classify targeted tests and reusable merge evidence
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CURRENT_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "test_only=false" >> "$GITHUB_OUTPUT"
          echo "changed_tests=" >> "$GITHUB_OUTPUT"
          echo "changed_backend_tests=" >> "$GITHUB_OUTPUT"
          echo "frontend_needed=true" >> "$GITHUB_OUTPUT"
          echo "reuse_pr_frontend=false" >> "$GITHUB_OUTPUT"
          echo "neo_ordonnance_targeted=false" >> "$GITHUB_OUTPUT"
          echo "m4_bridge_needed=false" >> "$GITHUB_OUTPUT"

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            if [[ -z "$PR_BASE_SHA" || -z "$PR_HEAD_SHA" ]]; then
              echo "Full CI: missing PR base/head SHA."
              exit 0
            fi

            mapfile -t changed < <(git diff --name-only "$PR_BASE_SHA" "$PR_HEAD_SHA")
            if [[ "${#changed[@]}" -eq 0 ]]; then
              echo "Full CI: empty PR delta."
              exit 0
            fi

            frontend_tests=()
            backend_tests=()
            strict_test_only=true
            m4_bridge_needed=false
            for file in "${changed[@]}"; do
              case "$file" in
                frontend/src/features/mobile/**|frontend/src/features/patients/**|frontend/src/features/panoramic/**|frontend/src/features/agenda/**|backend/routers/mobile_resource_bridge.py)
                  m4_bridge_needed=true
                  ;;
              esac
              case "$file" in
                frontend/src/*.test.ts|frontend/src/*.test.tsx|frontend/src/**/*.test.ts|frontend/src/**/*.test.tsx|frontend/src/*.spec.ts|frontend/src/*.spec.tsx|frontend/src/**/*.spec.ts|frontend/src/**/*.spec.tsx)
                  frontend_tests+=("${file#frontend/}")
                  ;;
                backend/tests/*.py|backend/tests/**/*.py)
                  backend_tests+=("$file")
                  ;;
                .github/workflows/ci.yml)
                  ;;
                *)
                  strict_test_only=false
                  ;;
              esac
            done

            printf 'changed_tests=%s\n' "$(IFS=,; echo "${frontend_tests[*]}")" >> "$GITHUB_OUTPUT"
            printf 'changed_backend_tests=%s\n' "$(IFS=,; echo "${backend_tests[*]}")" >> "$GITHUB_OUTPUT"
            echo "m4_bridge_needed=$m4_bridge_needed" >> "$GITHUB_OUTPUT"

            neo_ordonnance_targeted=true
            for file in "${changed[@]}"; do
              case "$file" in
                frontend/src/features/admin/DocumentStudio/Forms/PrescriptionQuickAccessBar.tsx|\
                frontend/src/features/admin/DocumentStudio/Forms/PrescriptionQuickAccessBar.test.tsx|\
                frontend/src/features/admin/DocumentStudio/Forms/PrescriptionContextualChoice.tsx|\
                frontend/src/features/admin/DocumentStudio/Forms/PrescriptionContextualChoice.test.tsx|\
                frontend/src/features/admin/DocumentStudio/Forms/PrescriptionComposer.ts|\
                frontend/src/features/admin/DocumentStudio/Forms/PrescriptionComposer.test.ts|\
                frontend/src/features/admin/DocumentStudio/Forms/PrescriptionComposerFixture.tsx|\
                frontend/src/features/admin/DocumentStudio/Forms/DrugRowV1.tsx|\
                frontend/src/features/admin/DocumentStudio/Forms/PrescriptionAgenticStudioV1.tsx|\
                frontend/src/features/admin/DocumentStudio/Forms/PrescriptionAgenticStudio.r7.test.tsx|\
                frontend/src/features/admin/DocumentStudio/Forms/PatientClinicalContextPanel.tsx|\
                frontend/src/features/admin/DocumentStudio/Forms/PatientClinicalContextPanel.test.tsx|\
                frontend/src/features/admin/DocumentStudio/Forms/PrescriptionAgenticStudioLegacy.tsx|\
                frontend/src/features/admin/DocumentStudio/Forms/DrugRow.test.tsx|\
                frontend/src/features/admin/DocumentStudio/Forms/DrugRow.r5.test.tsx|\
                frontend/src/features/admin/DocumentStudio/PrescriptionPerfectV2.ux.test.ts|\
                frontend/src/features/admin/DocumentStudio/OrdonnanceFidelityV3.u2.test.ts|\
                frontend/src/features/admin/DocumentStudio/NeoPrescriptionContextAdapter.ts|\
                frontend/src/features/admin/DocumentStudio/NeoPrescriptionContextAdapter.test.ts|\
                frontend/src/features/admin/DocumentStudio/DentalProcedureSafetyContext.ts|\
                frontend/src/features/admin/DocumentStudio/DentalProcedureSafetyContext.test.ts|\
                frontend/scripts/certify-ordonnance-composer.mjs|\
                frontend/ordonnance-composer-fixture.html|\
                backend/models.py|\
                backend/services/prescription_service.py|\
                backend/services/prescription_procedure_safety.py|\
                backend/routers/prescriptions.py|\
                backend/routers/prescriptions_core.py|\
                backend/schemas/prescription_clinical_rules.py|\
                backend/routers/medications.py|\
                backend/core/schema_runtime.py|\
                backend/tests/test_neo_ordonnance_reusables.py|\
                backend/tests/test_prescription_procedure_safety.py|\
                backend/tests/test_prescription_procedure_safety_endpoint.py|\
                backend/tests/test_cust04_prescription_presets.py|\
                alembic/versions/neo000000023_add_neo_rx_context_fields.py|\
                alembic/versions/neo000000024_extend_reusable_prescription_preferences.py|\
                docs/neo-ordonnance/*|\
                .github/workflows/ordonnance-composer-visual-cert.yml|\
                .github/workflows/agenda-a5-visual-evidence.yml|\
                .github/workflows/catalog-connected-cert.yml|\
                .github/workflows/ordonnance-fidelity-v3-visual-cert.yml|\
                .github/workflows/patient-p7-final-certification.yml|\
                .github/workflows/settings-r11-templatebuilder-audit.yml|\
                .github/workflows/t2-runtime-cert.yml|\
                .github/workflows/v1-07-g1-g7-browser-inventory.yml|\
                .github/workflows/v1-07-g4-browser-inventory.yml|\
                .github/workflows/v1-07-g8-browser-adversarial.yml|\
                .github/workflows/ci.yml)
                  ;;
                *)
                  neo_ordonnance_targeted=false
                  break
                  ;;
              esac
            done
            if [[ "$neo_ordonnance_targeted" == "true" ]]; then
              echo "neo_ordonnance_targeted=true" >> "$GITHUB_OUTPUT"
              echo "Neo-Ordonnance targeted CI: global frontend shards are unnecessary."
            fi

            if [[ "$strict_test_only" == "true" ]]; then
              echo "test_only=true" >> "$GITHUB_OUTPUT"
              if [[ "${#frontend_tests[@]}" -eq 0 ]]; then
                echo "frontend_needed=false" >> "$GITHUB_OUTPUT"
              fi
              echo "Targeted PR CI: only tests/workflow changed."
            fi
            exit 0
          fi

          if [[ "$EVENT_NAME" == "push" && ( "$GITHUB_REF" == "refs/heads/master" || "$GITHUB_REF" == "refs/heads/main" ) ]]; then
            read -ra parents <<< "$(git rev-list --parents -n 1 "$CURRENT_SHA")"
            if [[ "${#parents[@]}" -eq 3 ]]; then
              first_parent="${parents[1]}"
              pr_head="${parents[2]}"
              merge_tree="$(git rev-parse "$CURRENT_SHA^{tree}")"
              pr_tree="$(git rev-parse "$pr_head^{tree}")"
              if [[ "$merge_tree" == "$pr_tree" ]]; then
                mapfile -t merged_files < <(git diff --name-only "$first_parent" "$pr_head")
                frontend_changed=false
                for file in "${merged_files[@]}"; do
                  case "$file" in
                    frontend/*|frontend/**/*) frontend_changed=true ;;
                  esac
                done

                if [[ "$frontend_changed" == "false" ]]; then
                  echo "frontend_needed=false" >> "$GITHUB_OUTPUT"
                  echo "reuse_pr_frontend=true" >> "$GITHUB_OUTPUT"
                  echo "Post-merge fast-path: merge contains no frontend change."
                  exit 0
                fi

                checks="$(curl -fsSL \
                  -H "Accept: application/vnd.github+json" \
                  -H "Authorization: Bearer $GH_TOKEN" \
                  -H "X-GitHub-Api-Version: 2022-11-28" \
                  "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${pr_head}/check-runs?per_page=100" || true)"
                if [[ -n "$checks" ]] && jq -e 'any(.check_runs[]; .name == "Frontend (tests & build)" and .conclusion == "success")' <<< "$checks" >/dev/null; then
                  echo "frontend_needed=false" >> "$GITHUB_OUTPUT"
                  echo "reuse_pr_frontend=true" >> "$GITHUB_OUTPUT"
                  echo "Post-merge fast-path: identical PR tree with successful exact-head frontend check."
                else
                  echo "Post-merge fallback: exact-head frontend success not proven."
                fi
              fi
            fi
          fi
  backend-targeted:
    needs: classify-change
    if: github.event_name == 'pull_request' && needs.classify-change.outputs.changed_backend_tests != ''
    name: Backend targeted PR tests
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-only-secret-key-minimum-32-characters-long
      DATABASE_URL: "sqlite:///:memory:"
      ENVIRONMENT: development
      TELEMETRY_ENABLED: "false"
      CLOUD_AI_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.10.0 torchvision==0.25.0 torchaudio==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^(torch|torchvision|torchaudio)' requirements.txt > /tmp/requirements-ci.txt
          pip install -r /tmp/requirements-ci.txt
          python -m pip check
      - name: Run only changed backend test files
        env:
          CHANGED_BACKEND_TESTS: ${{ needs.classify-change.outputs.changed_backend_tests }}
        run: |
          set -euo pipefail
          IFS=',' read -ra files <<< "$CHANGED_BACKEND_TESTS"
          test "${#files[@]}" -gt 0
          python -m pytest "${files[@]}" -q
  # Generic full backend regression is intentionally post-merge.
  # PRs keep targeted lot checks plus frontend/build and the lightweight prod gate.
  test:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'))
    name: Full backend regression (post-merge)
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-only-secret-key-minimum-32-characters-long
      DATABASE_URL: "sqlite:///:memory:"
      ENVIRONMENT: development
      TELEMETRY_ENABLED: "false"
      CLOUD_AI_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.10.0 torchvision==0.25.0 torchaudio==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^(torch|torchvision|torchaudio)([<=>].*)?$' requirements.txt > /tmp/requirements-ci.txt
          pip install -r /tmp/requirements-ci.txt
          python -m pip check

      - name: Prod safety check (config hardening)
        run: python scripts/prod_safety_check.py

      - name: Full backend regression suite (DB / patients / documents included)
        run: python -m pytest backend/tests -q

  frontend:
    needs: classify-change
    if: (github.event_name != 'workflow_dispatch' || inputs.backend_only != true) && needs.classify-change.outputs.frontend_needed != 'false'
    name: Frontend (tests & build)
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Neo-Ordonnance targeted frontend tests
        if: needs.classify-change.outputs.neo_ordonnance_targeted == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npx vitest run \
            src/features/admin/DocumentStudio/Forms/PrescriptionContextualChoice.test.tsx \
            src/features/admin/DocumentStudio/Forms/PrescriptionComposer.test.ts \
            src/features/admin/DocumentStudio/Forms/PrescriptionQuickAccessBar.test.tsx \
            src/features/admin/DocumentStudio/Forms/PrescriptionAgenticStudio.r7.test.tsx \
            src/features/admin/DocumentStudio/Forms/PatientClinicalContextPanel.test.tsx \
            src/features/admin/DocumentStudio/PrescriptionPerfectV2.ux.test.ts \
            src/features/admin/DocumentStudio/OrdonnanceFidelityV3.u2.test.ts \
            src/features/admin/DocumentStudio/NeoPrescriptionContextAdapter.test.ts \
            src/features/admin/DocumentStudio/DentalProcedureSafetyContext.test.ts \
            --maxWorkers=1 --fileParallelism=false

      - name: Neo-Ordonnance targeted build
        if: needs.classify-change.outputs.neo_ordonnance_targeted == 'true'
        run: npm run build

      - name: Fast-path — run only changed test files
        if: needs.classify-change.outputs.test_only == 'true' && needs.classify-change.outputs.neo_ordonnance_targeted != 'true'
        shell: bash
        env:
          CHANGED_TESTS: ${{ needs.classify-change.outputs.changed_tests }}
        run: |
          set -euo pipefail
          if [[ -z "$CHANGED_TESTS" ]]; then
            echo "No product test changed; CI workflow-only fast-path."
            exit 0
          fi
          IFS=',' read -ra files <<< "$CHANGED_TESTS"
          for file in "${files[@]}"; do
            echo "::group::vitest $file"
            npx vitest run "$file" --maxWorkers=1 --fileParallelism=false
            echo "::endgroup::"
          done

      - name: Test suite — shard 1/12 isolated files
        if: needs.classify-change.outputs.test_only != 'true' && needs.classify-change.outputs.neo_ordonnance_targeted != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(npx vitest list --filesOnly --shard=1/12)
          test "${#files[@]}" -gt 0
          for file in "${files[@]}"; do
            echo "::group::vitest $file"
            npx vitest run "$file" --maxWorkers=1 --fileParallelism=false
            echo "::endgroup::"
          done

      - name: Test suite — shard 2/12 isolated files
        if: needs.classify-change.outputs.test_only != 'true' && needs.classify-change.outputs.neo_ordonnance_targeted != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(npx vitest list --filesOnly --shard=2/12)
          test "${#files[@]}" -gt 0
          for file in "${files[@]}"; do
            echo "::group::vitest $file"
            npx vitest run "$file" --maxWorkers=1 --fileParallelism=false
            echo "::endgroup::"
          done

      - name: Test suite — shard 3/12 isolated files
        if: needs.classify-change.outputs.test_only != 'true' && needs.classify-change.outputs.neo_ordonnance_targeted != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(npx vitest list --filesOnly --shard=3/12)
          test "${#files[@]}" -gt 0
          for file in "${files[@]}"; do
            echo "::group::vitest $file"
            npx vitest run "$file" --maxWorkers=1 --fileParallelism=false
            echo "::endgroup::"
          done

      - name: Test suite — shard 4/12 isolated files
        if: needs.classify-change.outputs.test_only != 'true' && needs.classify-change.outputs.neo_ordonnance_targeted != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(npx vitest list --filesOnly --shard=4/12)
          test "${#files[@]}" -gt 0
          for file in "${files[@]}"; do
            echo "::group::vitest $file"
            npx vitest run "$file" --maxWorkers=1 --fileParallelism=false
            echo "::endgroup::"
          done

      - name: Test suite — shard 5/12 isolated files
        if: needs.classify-change.outputs.test_only != 'true' && needs.classify-change.outputs.neo_ordonnance_targeted != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(npx vitest list --filesOnly --shard=5/12)
          test "${#files[@]}" -gt 0
          for file in "${files[@]}"; do
            echo "::group::vitest $file"
            npx vitest run "$file" --maxWorkers=1 --fileParallelism=false
            echo "::endgroup::"
          done

      - name: Test suite — shard 6/12 isolated files
        if: needs.classify-change.outputs.test_only != 'true' && needs.classify-change.outputs.neo_ordonnance_targeted != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(npx vitest list --filesOnly --shard=6/12)
          test "${#files[@]}" -gt 0
          for file in "${files[@]}"; do
            echo "::group::vitest $file"
            npx vitest run "$file" --maxWorkers=1 --fileParallelism=false
            echo "::endgroup::"
          done

      - name: Test suite — shard 7/12 isolated files
        if: needs.classify-change.outputs.test_only != 'true' && needs.classify-change.outputs.neo_ordonnance_targeted != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(npx vitest list --filesOnly --shard=7/12)
          test "${#files[@]}" -gt 0
          for file in "${files[@]}"; do
            echo "::group::vitest $file"
            npx vitest run "$file" --maxWorkers=1 --fileParallelism=false
            echo "::endgroup::"
          done

      - name: Test suite — shard 8/12 isolated files
        if: needs.classify-change.outputs.test_only != 'true' && needs.classify-change.outputs.neo_ordonnance_targeted != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(npx vitest list --filesOnly --shard=8/12)
          test "${#files[@]}" -gt 0
          for file in "${files[@]}"; do
            echo "::group::vitest $file"
            npx vitest run "$file" --maxWorkers=1 --fileParallelism=false
            echo "::endgroup::"
          done

      - name: Test suite — shard 9/12 isolated files
        if: needs.classify-change.outputs.test_only != 'true' && needs.classify-change.outputs.neo_ordonnance_targeted != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(npx vitest list --filesOnly --shard=9/12)
          test "${#files[@]}" -gt 0
          for file in "${files[@]}"; do
            echo "::group::vitest $file"
            npx vitest run "$file" --maxWorkers=1 --fileParallelism=false
            echo "::endgroup::"
          done

      - name: Test suite — shard 10/12 isolated files
        if: needs.classify-change.outputs.test_only != 'true' && needs.classify-change.outputs.neo_ordonnance_targeted != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(npx vitest list --filesOnly --shard=10/12)
          test "${#files[@]}" -gt 0
          for file in "${files[@]}"; do
            echo "::group::vitest $file"
            npx vitest run "$file" --maxWorkers=1 --fileParallelism=false
            echo "::endgroup::"
          done

      - name: Test suite — shard 11/12 isolated files
        if: needs.classify-change.outputs.test_only != 'true' && needs.classify-change.outputs.neo_ordonnance_targeted != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(npx vitest list --filesOnly --shard=11/12)
          test "${#files[@]}" -gt 0
          for file in "${files[@]}"; do
            echo "::group::vitest $file"
            npx vitest run "$file" --maxWorkers=1 --fileParallelism=false
            echo "::endgroup::"
          done

      - name: Test suite — shard 12/12 isolated files
        if: needs.classify-change.outputs.test_only != 'true' && needs.classify-change.outputs.neo_ordonnance_targeted != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(npx vitest list --filesOnly --shard=12/12)
          test "${#files[@]}" -gt 0
          for file in "${files[@]}"; do
            echo "::group::vitest $file"
            npx vitest run "$file" --maxWorkers=1 --fileParallelism=false
            echo "::endgroup::"
          done

      - name: Build
        if: needs.classify-change.outputs.test_only != 'true' && needs.classify-change.outputs.neo_ordonnance_targeted != 'true'
        run: npm run build

  prod-gate:
    needs: classify-change
    if: (github.event_name != 'workflow_dispatch' || inputs.backend_only != true) && needs.classify-change.outputs.test_only != 'true' && needs.classify-change.outputs.neo_ordonnance_targeted != 'true'
    name: Garde production (négatif)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pydantic-settings==2.2.1

      - name: Le garde DOIT refuser une config prod non durcie
        env:
          ENVIRONMENT: production
          SECRET_KEY: changeme
          DEBUG: "true"
          DATABASE_URL: "sqlite:///./x.db"
        run: |
          if python scripts/prod_safety_check.py; then
            echo "::error::Le prod safety check a accepté une config production non durcie."
            exit 1
          else
            echo "OK : le garde a bien refusé la config production non durcie."
          fi

  m4a-e2e:
    needs: classify-change
    if: github.event_name == 'pull_request' && needs.classify-change.outputs.test_only != 'true' && needs.classify-change.outputs.m4_bridge_needed == 'true'
    name: M4-A Patient contextual bridge AFTER
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Assert Pocket patient bridge retirement contract
        run: |
          python - <<'PY'
          from pathlib import Path
          patient = Path('frontend/src/features/patients/PatientDetailsInner.tsx').read_text()
          router = Path('backend/routers/mobile_resource_bridge.py').read_text()
          assert 'PatientMobileBridge' not in patient
          assert 'Ouvrir sur mobile' not in patient
