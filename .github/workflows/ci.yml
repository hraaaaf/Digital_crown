name: CI

# S9 — Pipeline d'intégration continue Digital Crown.
# Gate de pré-production : durcissement config + suite de tests (sécurité,
# contrôle d'accès, capsule IA, Crown Bot). Aucune donnée patient n'est touchée :
# les tests tournent sur SQLite in-memory isolé (voir backend/tests/conftest.py).
#
# INVARIANT ABSOLU DE NON-RÉGRESSION
# Toute modification doit préserver intégralement l'existant.
# Elle ne doit casser, altérer, perdre ou rendre incompatibles ni la base de données
# et ses données existantes, ni les dossiers patients, ni les documents existants
# (lecture, génération, archivage), ni une fonctionnalité déjà validée.
# Une CI verte ne constitue pas à elle seule la preuve de cette préservation :
# tout changement à risque doit ajouter/adapter les tests de non-régression nécessaires
# et, lorsqu'il touche DB/patients/documents, être complété par le rehearsal approprié.

on:
  workflow_dispatch:
    inputs:
      backend_only:
        description: "Run only the full backend regression job"
        required: false
        default: false
        type: boolean

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !(github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')) }}

jobs:
  classify-change:
    name: Classify CI change scope
    runs-on: ubuntu-latest
    outputs:
      test_only: ${{ steps.scope.outputs.test_only }}
      changed_tests: ${{ steps.scope.outputs.changed_tests }}
      changed_backend_tests: ${{ steps.scope.outputs.changed_backend_tests }}
      frontend_needed: ${{ steps.scope.outputs.frontend_needed }}
      reuse_pr_frontend: ${{ steps.scope.outputs.reuse_pr_frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scope
        name: Classify targeted tests and reusable merge evidence
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CURRENT_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "test_only=false" >> "$GITHUB_OUTPUT"
          echo "changed_tests=" >> "$GITHUB_OUTPUT"
          echo "changed_backend_tests=" >> "$GITHUB_OUTPUT"
          echo "frontend_needed=true" >> "$GITHUB_OUTPUT"
          echo "reuse_pr_frontend=false" >> "$GITHUB_OUTPUT"

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            if [[ -z "$PR_BASE_SHA" || -z "$PR_HEAD_SHA" ]]; then
              echo "Full CI: missing PR base/head SHA."
              exit 0
            fi
            mapfile -t changed < <(git diff --name-only "$PR_BASE_SHA" "$PR_HEAD_SHA")
            if [[ "${#changed[@]}" -eq 0 ]]; then
              echo "Full CI: empty PR delta."
              exit 0
            fi

            frontend_tests=()
            backend_tests=()
            strict_test_only=true
            frontend_changed=false
            for file in "${changed[@]}"; do
              case "$file" in
                frontend/src/*.test.ts|frontend/src/*.test.tsx|frontend/src/**/*.test.ts|frontend/src/**/*.test.tsx|frontend/src/*.spec.ts|frontend/src/*.spec.tsx|frontend/src/**/*.spec.ts|frontend/src/**/*.spec.tsx)
                  frontend_tests+=("${file#frontend/}")
                  frontend_changed=true
                  ;;
                backend/tests/*.py|backend/tests/**/*.py)
                  backend_tests+=("$file")
                  ;;
                frontend/*|frontend/**/*|package.json|package-lock.json)
                  frontend_changed=true
                  strict_test_only=false
                  ;;
                .github/workflows/ci.yml)
                  ;;
                *)
                  strict_test_only=false
                  ;;
              esac
            done

            printf 'changed_tests=%s\n' "$(IFS=,; echo "${frontend_tests[*]}")" >> "$GITHUB_OUTPUT"
            printf 'changed_backend_tests=%s\n' "$(IFS=,; echo "${backend_tests[*]}")" >> "$GITHUB_OUTPUT"
            if [[ "$frontend_changed" == "false" ]]; then
              echo "frontend_needed=false" >> "$GITHUB_OUTPUT"
              echo "PR fast-path: delta contains no frontend surface change."
            fi
            if [[ "$strict_test_only" == "true" ]]; then
              echo "test_only=true" >> "$GITHUB_OUTPUT"
              echo "Targeted PR CI: only tests/workflow changed."
            fi
            exit 0
          fi

          if [[ "$EVENT_NAME" == "push" && ( "$GITHUB_REF" == "refs/heads/master" || "$GITHUB_REF" == "refs/heads/main" ) ]]; then
            read -ra parents <<< "$(git rev-list --parents -n 1 "$CURRENT_SHA")"
            if [[ "${#parents[@]}" -eq 3 ]]; then
              first_parent="${parents[1]}"
              pr_head="${parents[2]}"
              merge_tree="$(git rev-parse "$CURRENT_SHA^{tree}")"
              pr_tree="$(git rev-parse "$pr_head^{tree}")"
              if [[ "$merge_tree" == "$pr_tree" ]]; then
                mapfile -t merged_files < <(git diff --name-only "$first_parent" "$pr_head")
                frontend_changed=false
                for file in "${merged_files[@]}"; do
                  case "$file" in
                    frontend/*|frontend/**/*|package.json|package-lock.json) frontend_changed=true ;;
                  esac
                done
                if [[ "$frontend_changed" == "false" ]]; then
                  echo "frontend_needed=false" >> "$GITHUB_OUTPUT"
                  echo "reuse_pr_frontend=true" >> "$GITHUB_OUTPUT"
                  echo "Post-merge fast-path: merge contains no frontend change."
                  exit 0
                fi
                checks="$(curl -fsSL -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${pr_head}/check-runs?per_page=100" || true)"
                if [[ -n "$checks" ]] && jq -e 'any(.check_runs[]; .name == "Frontend (tests & build)" and .conclusion == "success")' <<< "$checks" >/dev/null; then
                  echo "frontend_needed=false" >> "$GITHUB_OUTPUT"
                  echo "reuse_pr_frontend=true" >> "$GITHUB_OUTPUT"
                  echo "Post-merge fast-path: identical PR tree with successful exact-head frontend check."
                else
                  echo "Post-merge fallback: exact-head frontend success not proven."
                fi
              fi
            fi
          fi

  backend-targeted:
    needs: classify-change
    if: github.event_name == 'pull_request' && needs.classify-change.outputs.changed_backend_tests != ''
    name: Backend targeted PR tests
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-only-secret-key-minimum-32-characters-long
      DATABASE_URL: "sqlite:///:memory:"
      ENVIRONMENT: development
      TELEMETRY_ENABLED: "false"
      CLOUD_AI_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.10.0 torchvision==0.25.0 torchaudio==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^(torch|torchvision|torchaudio)' requirements.txt > /tmp/requirements-ci.txt
          pip install -r /tmp/requirements-ci.txt
          pip install jsonschema==4.25.1
          python -m pip check
      - name: Run only changed backend test files
        env:
          CHANGED_BACKEND_TESTS: ${{ needs.classify-change.outputs.changed_backend_tests }}
        run: |
          set -euo pipefail
          IFS=',' read -ra files <<< "$CHANGED_BACKEND_TESTS"
          test "${#files[@]}" -gt 0
          python -m pytest "${files[@]}" -q

  test:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'))
    name: Full backend regression (post-merge)
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-only-secret-key-minimum-32-characters-long
      DATABASE_URL: "sqlite:///:memory:"
      ENVIRONMENT: development
      TELEMETRY_ENABLED: "false"
      CLOUD_AI_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.10.0 torchvision==0.25.0 torchaudio==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^(torch|torchvision|torchaudio)([<=>].*)?$' requirements.txt > /tmp/requirements-ci.txt
          pip install -r /tmp/requirements-ci.txt
          python -m pip check
      - name: Prod safety check (config hardening)
        run: python scripts/prod_safety_check.py
      - name: Full shared SQLite backend regression (DB, patients, documents)
        shell: bash
        run: |
          set -euo pipefail
          # These exact 14 files run in dedicated subprocess/PG18 contracts below.
          # Refuse silently growing the exclusion set: a new standalone test must
          # first be added to the isolated runner, never simply disappear from CI.
          python - <<'PY'
          from pathlib import Path
          tests = Path("backend/tests")
          actual = {p.name for glob in ("test_legacy_migration_*.py", "test_legacy_sql_*.py")
                    for p in tests.glob(glob)}
          expected = {
            "test_legacy_migration_http_pg_v15.py",
            "test_legacy_migration_staff_gateway_v15.py",
            "test_legacy_migration_synthetic_file_v15.py",
            "test_legacy_sql_inspector_v15.py",
            "test_legacy_sql_inspector_v15_security.py",
            "test_legacy_sql_mapping_v15.py",
            "test_legacy_sql_migration_scenarios_v15.py",
            "test_legacy_sql_physical_schema_gate_lab_v15.py",
            "test_legacy_sql_real_orm_scratch_v15.py",
            "test_legacy_sql_replay_restore_lab_v15.py",
            "test_legacy_sql_sqlite_e2e_100x200_v15.py",
            "test_legacy_sql_synthetic_dryrun_v15.py",
            "test_legacy_sql_target_manifest_v15.py",
            "test_legacy_sql_tenant_link_guard_lab_v15.py",
          }
          if actual != expected:
              raise SystemExit(f"LEGACY_ISOLATION_INVENTORY_CHANGED missing={sorted(expected-actual)} unexpected={sorted(actual-expected)}")
          print(f"LEGACY_ISOLATION_INVENTORY_OK count={len(actual)}; dedicated PG18 + subprocess runner REQUIRED")
          PY
          python -m pytest backend/tests -q --maxfail=1 \
            --ignore-glob='backend/tests/test_legacy_migration_*.py' \
            --ignore-glob='backend/tests/test_legacy_sql_*.py'

  legacy-migration-pg18:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'))
    name: Standalone rehearsal-only HTTP/JWT/PostgreSQL guard
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dc_cert_candidate_rehearsal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dc_cert_candidate_rehearsal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/dc_cert_candidate_rehearsal
      ENVIRONMENT: rehearsal
      SECRET_KEY: candidate-rehearsal-jwt-secret-key-minimum-32-characters
      DIGITALCROWN_ISOLATED_RUNTIME: '1'
      TELEMETRY_ENABLED: 'false'
      CLOUD_AI_ENABLED: 'false'
      DEBUG: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Verify exact PR head
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated HTTP/PG dependencies
        run: |
          python -m pip install alembic==1.20.0 sqlalchemy==2.0.28 psycopg2-binary==2.9.9 \
            'pydantic[email]==2.6.3' pydantic-settings==2.2.1 \
            fastapi==0.115.6 starlette==0.41.3 httpx==0.28.1 \
            python-jose==3.5.0 passlib==1.7.4 bcrypt==3.2.2 \
            python-multipart==0.0.31 python-dotenv==1.2.1 \
            cryptography==49.0.0 PyYAML==6.0.3
      - name: Migrate fresh isolated PostgreSQL 18
        run: alembic upgrade head
      - name: Execute standalone safety contract (no pytest collection)
        run: |
          set -euo pipefail
          PYTHONPATH=. python backend/tests/test_legacy_migration_http_pg_v15.py 2>&1 | tee /tmp/candidate-rehearsal.log
          grep -q '^LOT05_6_HTTP_PG_PASS ' /tmp/candidate-rehearsal.log
      - name: Preserve independent staff-gateway unittest guards
        run: |
          set -euo pipefail
          PYTHONWARNINGS=error::ResourceWarning python backend/tests/test_legacy_migration_staff_gateway_v15.py -v 2>&1 | tee /tmp/candidate-staff-gateway.log
          grep -q '^Ran 14 tests' /tmp/candidate-staff-gateway.log
          grep -q '^OK
    if: (github.event_name != 'workflow_dispatch' || inputs.backend_only != true) && needs.classify-change.outputs.frontend_needed != 'false'
    name: Frontend (tests & build)
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Fast-path — run only changed test files
        if: needs.classify-change.outputs.test_only == 'true'
        shell: bash
        env:
          CHANGED_TESTS: ${{ needs.classify-change.outputs.changed_tests }}
        run: |
          set -euo pipefail
          if [[ -z "$CHANGED_TESTS" ]]; then exit 0; fi
          IFS=',' read -ra files <<< "$CHANGED_TESTS"
          for file in "${files[@]}"; do npx vitest run "$file" --maxWorkers=1 --fileParallelism=false; done
      - name: Test suite
        if: needs.classify-change.outputs.test_only != 'true'
        run: npx vitest run --maxWorkers=1 --fileParallelism=false
      - name: Build
        if: needs.classify-change.outputs.test_only != 'true'
        run: npm run build

  prod-gate:
    needs: classify-change
    if: (github.event_name != 'workflow_dispatch' || inputs.backend_only != true) && needs.classify-change.outputs.test_only != 'true'
    name: Garde production (négatif)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pydantic-settings==2.2.1
      - name: Le garde DOIT refuser une config prod non durcie
        env:
          ENVIRONMENT: production
          SECRET_KEY: changeme
          DEBUG: "true"
          DATABASE_URL: "sqlite:///./x.db"
        run: |
          if python scripts/prod_safety_check.py; then exit 1; else echo "OK"; fi

  m4a-e2e:
    needs: classify-change
    if: github.event_name == 'pull_request' && needs.classify-change.outputs.test_only != 'true'
    name: M4-A Patient contextual bridge AFTER
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - run: |
          python - <<'PY'
          from pathlib import Path
          patient = Path('frontend/src/features/patients/PatientDetailsInner.tsx').read_text()
          router = Path('backend/routers/mobile_resource_bridge.py').read_text()
          assert 'PatientMobileBridge' not in patient
          assert 'Ouvrir sur mobile' not in patient
          assert 'resource_type == "patient"' in router
          assert "@router.post('/resource-context'" in router
          PY

  m4b-e2e:
    needs: classify-change
    if: github.event_name == 'pull_request' && needs.classify-change.outputs.test_only != 'true'
    name: M4-B Panoramic contextual bridge AFTER
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - run: |
          python - <<'PY'
          from pathlib import Path
          panoramic = Path('frontend/src/features/panoramic/PanoramicHistory.tsx').read_text()
          router = Path('backend/routers/mobile_resource_bridge.py').read_text()
          assert 'PanoramicMobileBridge' not in panoramic
          assert 'Ouvrir sur mobile' not in panoramic
          assert 'resource_type == "panoramic"' in router
          assert "@router.post('/resource-context-media'" in router
          PY

  m4c-e2e:
    needs: classify-change
    if: github.event_name == 'pull_request' && needs.classify-change.outputs.test_only != 'true'
    name: M4-C Document contextual bridge AFTER
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - run: |
          python - <<'PY'
          from pathlib import Path
          documents = Path('frontend/src/features/patients/PatientDocuments.tsx').read_text()
          router = Path('backend/routers/mobile_resource_bridge.py').read_text()
          assert 'DocumentMobileBridge' not in documents
          assert 'Ouvrir sur mobile' not in documents
          assert 'resource_type == "document"' in router
          assert "@router.post('/resource-context-media'" in router
          PY

  m4d-retired:
    needs: classify-change
    if: github.event_name == 'pull_request' && needs.classify-change.outputs.test_only != 'true'
    name: M4-D Appointment contextual bridge retired
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - run: |
          python - <<'PY'
          from pathlib import Path
          agenda = Path('frontend/src/features/agenda/AgendaModal.tsx').read_text()
          router = Path('backend/routers/mobile_resource_bridge.py').read_text()
          assert 'AppointmentMobileBridge' not in agenda
          assert 'data-m4d-bridge-slot' not in agenda
          assert 'resource_type == "appointment"' in router
          assert "@router.post('/resource-context'" in router
          PY
 /tmp/candidate-staff-gateway.log
      - name: Official synthetic-file and preceding legacy-migration safety contracts
        run: |
          set -euo pipefail
          PYTHONWARNINGS=error::ResourceWarning python backend/tests/test_legacy_migration_synthetic_file_v15.py -v 2>&1 | tee /tmp/candidate-synthetic-file.log
          grep -q 'Ran 12 tests' /tmp/candidate-synthetic-file.log
          grep -q '^OK
    if: (github.event_name != 'workflow_dispatch' || inputs.backend_only != true) && needs.classify-change.outputs.frontend_needed != 'false'
    name: Frontend (tests & build)
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Fast-path — run only changed test files
        if: needs.classify-change.outputs.test_only == 'true'
        shell: bash
        env:
          CHANGED_TESTS: ${{ needs.classify-change.outputs.changed_tests }}
        run: |
          set -euo pipefail
          if [[ -z "$CHANGED_TESTS" ]]; then exit 0; fi
          IFS=',' read -ra files <<< "$CHANGED_TESTS"
          for file in "${files[@]}"; do npx vitest run "$file" --maxWorkers=1 --fileParallelism=false; done
      - name: Test suite
        if: needs.classify-change.outputs.test_only != 'true'
        run: npx vitest run --maxWorkers=1 --fileParallelism=false
      - name: Build
        if: needs.classify-change.outputs.test_only != 'true'
        run: npm run build

  prod-gate:
    needs: classify-change
    if: (github.event_name != 'workflow_dispatch' || inputs.backend_only != true) && needs.classify-change.outputs.test_only != 'true'
    name: Garde production (négatif)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pydantic-settings==2.2.1
      - name: Le garde DOIT refuser une config prod non durcie
        env:
          ENVIRONMENT: production
          SECRET_KEY: changeme
          DEBUG: "true"
          DATABASE_URL: "sqlite:///./x.db"
        run: |
          if python scripts/prod_safety_check.py; then exit 1; else echo "OK"; fi

  m4a-e2e:
    needs: classify-change
    if: github.event_name == 'pull_request' && needs.classify-change.outputs.test_only != 'true'
    name: M4-A Patient contextual bridge AFTER
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - run: |
          python - <<'PY'
          from pathlib import Path
          patient = Path('frontend/src/features/patients/PatientDetailsInner.tsx').read_text()
          router = Path('backend/routers/mobile_resource_bridge.py').read_text()
          assert 'PatientMobileBridge' not in patient
          assert 'Ouvrir sur mobile' not in patient
          assert 'resource_type == "patient"' in router
          assert "@router.post('/resource-context'" in router
          PY

  m4b-e2e:
    needs: classify-change
    if: github.event_name == 'pull_request' && needs.classify-change.outputs.test_only != 'true'
    name: M4-B Panoramic contextual bridge AFTER
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - run: |
          python - <<'PY'
          from pathlib import Path
          panoramic = Path('frontend/src/features/panoramic/PanoramicHistory.tsx').read_text()
          router = Path('backend/routers/mobile_resource_bridge.py').read_text()
          assert 'PanoramicMobileBridge' not in panoramic
          assert 'Ouvrir sur mobile' not in panoramic
          assert 'resource_type == "panoramic"' in router
          assert "@router.post('/resource-context-media'" in router
          PY

  m4c-e2e:
    needs: classify-change
    if: github.event_name == 'pull_request' && needs.classify-change.outputs.test_only != 'true'
    name: M4-C Document contextual bridge AFTER
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - run: |
          python - <<'PY'
          from pathlib import Path
          documents = Path('frontend/src/features/patients/PatientDocuments.tsx').read_text()
          router = Path('backend/routers/mobile_resource_bridge.py').read_text()
          assert 'DocumentMobileBridge' not in documents
          assert 'Ouvrir sur mobile' not in documents
          assert 'resource_type == "document"' in router
          assert "@router.post('/resource-context-media'" in router
          PY

  m4d-retired:
    needs: classify-change
    if: github.event_name == 'pull_request' && needs.classify-change.outputs.test_only != 'true'
    name: M4-D Appointment contextual bridge retired
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - run: |
          python - <<'PY'
          from pathlib import Path
