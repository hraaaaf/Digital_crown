name: CI

# S9 — Pipeline d'intégration continue Digital Crown.
# Gate de pré-production : durcissement config + suite de tests (sécurité,
# contrôle d'accès, capsule IA, Crown Bot). Aucune donnée patient n'est touchée :
# les tests tournent sur SQLite in-memory isolé (voir backend/tests/conftest.py).

on:
  push:
    branches: [main, master, "S[0-9]*", "redressement*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests & durcissement
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-only-secret-key-minimum-32-characters-long
      DATABASE_URL: "sqlite:///:memory:"
      ENVIRONMENT: development
      TELEMETRY_ENABLED: "false"
      CLOUD_AI_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.12.0 torchvision==0.27.0 --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^(torch|torchvision)([<=>].*)?$' requirements.txt > /tmp/requirements-ci.txt
          pip install -r /tmp/requirements-ci.txt
          pip install httpx==0.27.2 pytest pytest-asyncio

      - name: Prod safety check (config hardening)
        run: python scripts/prod_safety_check.py

      - name: Test suite
        run: python -m pytest backend/tests -q --maxfail=1

  frontend:
    name: Frontend (tests & build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test suite
        run: npm test

      - name: Build
        run: npm run build

  prod-gate:
    name: Garde production (négatif)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pydantic-settings==2.2.1

      - name: Le garde DOIT refuser une config prod non durcie
        env:
          ENVIRONMENT: production
          SECRET_KEY: changeme
          DEBUG: "true"
          DATABASE_URL: "sqlite:///./x.db"
        run: |
          if python scripts/prod_safety_check.py; then
            echo "::error::Le prod safety check a accepté une config production non durcie."
            exit 1
          else
            echo "OK : le garde a bien refusé la config production non durcie."
          fi

  patient-indicators-product:
    name: Patient indicators atomic product + exact-tree certification
    if: github.event_name == 'pull_request' && github.head_ref == 'settings-patient-indicators-explainable'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      SECRET_KEY: patient-indicators-cert-secret-000001
      DATABASE_URL: "sqlite:///:memory:"
      ENVIRONMENT: test
      TELEMETRY_ENABLED: "false"
      CLOUD_AI_ENABLED: "false"
      DEBUG: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: settings-patient-indicators-explainable
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Apply guarded product transformation
        run: python .github/scripts/apply_patient_indicators.py

      - name: Restore canonical CI harness and static guards
        run: |
          git checkout origin/master -- .github/workflows/ci.yml
          python -m py_compile \
            backend/services/patient_scoring_service.py \
            backend/services/habits_engine.py \
            backend/services/rag_context.py \
            backend/services/clinical_intelligence.py \
            backend/services/elite_manager.py \
            backend/tests/test_patient_scoring_service.py \
            backend/tests/test_patient_indicators_explainable.py
          git diff --check
          git diff --exit-code -- docs/settings/INDICATEURS_PATIENT_EXPLICABLES_GOAL.md docs/settings/INDICATEURS_PATIENT_EXPLICABLES_MOCKUP.svg

      - name: Commit product atomically
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "feat(patient): replace opaque indicators with factual markers"
          PRODUCT_SHA="$(git rev-parse HEAD)"
          echo "PRODUCT_SHA=$PRODUCT_SHA" >> "$GITHUB_ENV"
          git push origin HEAD:settings-patient-indicators-explainable
          echo "Exact product HEAD: $PRODUCT_SHA"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.12.0 torchvision==0.27.0 --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^(torch|torchvision)([<=>].*)?$' requirements.txt > /tmp/requirements-patient-indicators.txt
          pip install -r /tmp/requirements-patient-indicators.txt
          pip install httpx==0.27.2 pytest pytest-asyncio

      - name: Exact product backend targeted truth
        run: |
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          pytest -q backend/tests/test_patient_scoring_service.py backend/tests/test_patient_indicators_explainable.py

      - name: Exact product backend full suite
        run: |
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          python -m pytest backend/tests -q --maxfail=1

      - name: Install frontend and Chromium
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Exact product frontend targeted truth
        working-directory: frontend
        run: npm test -- src/features/patients/PatientIndicatorsExplainable.test.ts

      - name: Exact product frontend full suite
        working-directory: frontend
        run: npm test

      - name: Exact product frontend build
        working-directory: frontend
        run: npm run build

      - name: Exact product runtime truth and AFTER 15 captures
        env:
          DATABASE_URL: "sqlite:///./t2-runtime-cert.db"
          ALLOWED_ORIGINS: "http://127.0.0.1:5173,http://localhost:5173"
        run: |
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          rm -f t2-runtime-cert.db
          nohup python scripts/t2_runtime_server.py > /tmp/patient-indicators-backend.log 2>&1 &
          for i in {1..90}; do
            if curl -fsS http://127.0.0.1:8005/health >/dev/null; then break; fi
            if [ "$i" = 90 ]; then cat /tmp/patient-indicators-backend.log; exit 1; fi
            sleep 1
          done
          cd frontend
          nohup npm run dev -- --host 127.0.0.1 --port 5173 > /tmp/patient-indicators-front.log 2>&1 &
          for i in {1..90}; do
            if curl -fsS http://127.0.0.1:5173 >/dev/null; then break; fi
            if [ "$i" = 90 ]; then cat /tmp/patient-indicators-front.log; exit 1; fi
            sleep 1
          done
          cd ..
          python - <<'PY'
          from pathlib import Path
          src = Path('.github/workflows/patient-indicators-cert.yml').read_text(encoding='utf-8')
          marker = "          import fs from 'node:fs';"
          start = src.index(marker)
          end = src.index("\n          JS\n", start)
          block = src[start:end].splitlines()
          code = "\n".join(line[10:] if line.startswith("          ") else line for line in block) + "\n"
          Path('frontend/.patient-indicators-after.mjs').write_text(code, encoding='utf-8')
          PY
          mkdir -p artifacts/patient-indicators-after
          cd frontend
          GITHUB_SHA="$PRODUCT_SHA" node .patient-indicators-after.mjs
          rm .patient-indicators-after.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: patient-indicators-after-${{ env.PRODUCT_SHA }}
          path: artifacts/patient-indicators-after
          if-no-files-found: warn
          retention-days: 14
