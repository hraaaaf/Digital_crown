            npx vitest run "$file" --maxWorkers=1 --fileParallelism=false
            echo "::endgroup::"
          done

      - name: Test suite — shard 4/12 isolated files
        if: needs.classify-change.outputs.test_only != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(npx vitest list --filesOnly --shard=4/12)
          test "${#files[@]}" -gt 0
          for file in "${files[@]}"; do
            echo "::group::vitest $file"
            npx vitest run "$file" --maxWorkers=1 --fileParallelism=false
            echo "::endgroup::"
          done

      - name: Test suite — shard 5/12 isolated files
        if: needs.classify-change.outputs.test_only != 'true'
        shell: bash
        run: |
