name: LOT07 07.1 G1 real Cabinet gated MultiView lab
on:
  push:
    branches:
      - 'feat/v15-07-1ab-multiview-cabinet-g1-lab-*'
      - 'feat/v15-07-r2-patient-route-guard-*'
    paths:
      - 'frontend/src/features/multiview/**'
      - 'frontend/src/features/patients/PatientDetailsInner.tsx'
      - 'frontend/src/features/patients/PatientDraftRouteGuard.tsx'
      - 'frontend/src/features/patients/patientDraftNavigationGate.ts'
      - 'frontend/src/App.tsx'
      - '.github/workflows/v15-07-1ab-multiview-cabinet-lab.yml'
      - 'docs/architecture/V15_07_1_AB_CABINET_G1_INTEGRATION.md'
  pull_request:
    branches:
      - master
      - 'feat/v15-07-1ab-multiview-nine-layout-contract-*'
      - 'feat/v15-07-1ab-multiview-cabinet-g1-lab-*'
      - 'feat/v15-07-1ab-multiview-cabinet-g1-lab-r2-security-*'

permissions:
  contents: read

concurrency:
  group: lot07-071-g1-lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  multiview-cabinet-lab:
    name: Dev-only real modules / 8 deny paths / TS / production build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SOURCE_HEAD: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_HEAD }}
      - name: Verify exact SHA and explicit DEV-only route gate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"
          grep -Fq 'isCabinetMultiViewLabEnabled(import.meta.env.DEV, import.meta.env.VITE_V15_07_1_MULTIVIEW_LAB)' frontend/src/features/patients/PatientDetailsInner.tsx
          if grep -Eq 'VITE_V15_07_1_MULTIVIEW_LAB=1' frontend/.env.production frontend/.env 2>/dev/null; then
            echo "Multiview must be opt-in and absent from production env defaults"; exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci --prefix frontend --no-audit --no-fund
      - name: Execute foundation plus integrated desktop, workstation and patient denial tests
        working-directory: frontend
        run: npx vitest run src/features/multiview/studioLayouts.test.tsx src/features/multiview/CabinetMultiViewLab.test.tsx src/features/patients/components/PatientMediaTimeline.multiviewReadonly.test.tsx src/features/patients/patientDraftNavigationGate.test.tsx src/features/patients/PatientDraftRouteGuard.test.tsx
      - name: TypeScript full frontend sources
        working-directory: frontend
        run: npx tsc --noEmit -p tsconfig.app.json
      - name: Production frontend build
        working-directory: frontend
        run: npx vite build --mode production
