name: Settings Document Models Visual Audit

on:
  pull_request:
    paths:
      - "backend/schemas/cabinet.py"
      - "backend/services/base_template.py"
      - "backend/services/base_template_core.py"
      - "backend/services/premium_document_headers.py"
      - "backend/services/generators/ordonnance_gen.py"
      - "backend/services/generators/accounting_gen.py"
      - "backend/tests/test_document_header_specialties.py"
      - "backend/tests/test_premium_document_headers.py"
      - "frontend/src/features/admin/constants.ts"
      - "frontend/src/features/admin/Settings/tabs/branding/StudioControls.tsx"
      - "frontend/src/features/admin/Settings/tabs/branding/StudioControlsCore.tsx"
      - ".github/workflows/settings-document-models-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: audit-only-secret-key-minimum-32-characters-long
      DATABASE_URL: sqlite:///:memory:
      ENVIRONMENT: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install audit dependencies
        run: |
          python -m pip install --upgrade pip
          pip install reportlab arabic-reshaper python-bidi svglib pillow qrcode pymupdf sqlalchemy pydantic pydantic-settings python-jose passlib bcrypt
      - name: Contract check premium font mappings
        run: |
          python - <<'PY'
          import sys
          import types
          from pathlib import Path
          from reportlab.pdfbase import pdfmetrics

          backend_pkg = types.ModuleType('backend')
          backend_pkg.__path__ = [str(Path('backend').resolve())]
          sys.modules['backend'] = backend_pkg

          from backend.services.premium_document_headers import update_document_fonts

          class Base:
              outfit_font = 'Outfit'
              outfit_bold = 'Outfit-Bold'
              premium_font = 'Helvetica'
              premium_bold = 'Helvetica-Bold'
              header_font = 'Helvetica'
              header_bold = 'Helvetica-Bold'
              @staticmethod
              def _get_val(config, key, default=None):
                  return (config or {}).get(key, default)

          base = Base()
          expected = {
              'inter': ('Helvetica', 'Helvetica-Bold'),
              'playfair': ('Times-Roman', 'Times-Bold'),
              'serif': ('Times-Roman', 'Times-Bold'),
              'mono': ('Courier', 'Courier-Bold'),
          }
          for font_id, pair in expected.items():
              update_document_fonts(base, {'font_fr': font_id})
              assert (base.premium_font, base.premium_bold) == pair
              pdfmetrics.getFont(base.premium_font)
              pdfmetrics.getFont(base.premium_bold)
          PY
      - name: Generate five real ordonnance models
        run: |
          python - <<'PY'
          import sys
          import types
          from pathlib import Path
          from types import SimpleNamespace
          import shutil
          import fitz
          from PIL import Image, ImageDraw, ImageFont

          backend_pkg = types.ModuleType('backend')
          backend_pkg.__path__ = [str(Path('backend').resolve())]
          sys.modules['backend'] = backend_pkg

          from backend.services.generators.ordonnance_gen import OrdonnanceGenerator

          out = Path('settings-document-models-audit')
          pdf_dir = out / 'pdf'
          png_dir = out / 'png'
          pdf_dir.mkdir(parents=True, exist_ok=True)
          png_dir.mkdir(parents=True, exist_ok=True)

          upload_dir = Path('backend/static/uploads')
          upload_dir.mkdir(parents=True, exist_ok=True)
          logo_filename = 'audit-logo.png'
          logo_path = upload_dir / logo_filename
          logo = Image.new('RGBA', (400, 400), (255, 255, 255, 0))
          draw = ImageDraw.Draw(logo)
          draw.ellipse((14, 14, 386, 386), fill='#003380')
          font = ImageFont.truetype('backend/static/assets/fonts/Outfit-Bold.ttf', 150)
          bbox = draw.textbbox((0, 0), 'DC', font=font)
          x = (400 - (bbox[2] - bbox[0])) / 2
          y = (400 - (bbox[3] - bbox[1])) / 2 - bbox[1]
          draw.text((x, y), 'DC', fill='white', font=font)
          logo.save(logo_path)

          patient = SimpleNamespace(
              nom='ALAMI', prenom='Sara', date_naissance=__import__('datetime').date(1990, 4, 12)
          )
          medications = [
              SimpleNamespace(nom='Amoxicilline', forme='Gélules', dosage='1 g', posologie='1 g matin et soir pendant 7 jours', type='MEDICAMENT'),
              SimpleNamespace(nom='Paracétamol', forme='Comprimés', dosage='1 g', posologie='1 comprimé si douleur, maximum 3 par jour pendant 3 jours', type='MEDICAMENT'),
              SimpleNamespace(nom='Bain de bouche chlorhexidine', forme='Solution', dosage='0,12 %', posologie='2 bains de bouche par jour pendant 7 jours. Ne pas avaler.', type='MEDICAMENT'),
          ]
          data = SimpleNamespace(id='AUDIT-R4', doc_date='2026-08-19', medications=medications, show_legal_annotations=True)

          specialty_lines_fr = [
              'Soins - Endodontie',
              'Parodontologie - Orthodontie',
              'Prothèse - Chirurgie',
              'Implantologie - Blanchiment',
              'Esthétique - Spécialité personnalisée',
          ]
          expected_specialties = [
              'Soins', 'Endodontie', 'Parodontologie', 'Orthodontie', 'Prothèse',
              'Chirurgie', 'Implantologie', 'Blanchiment', 'Esthétique',
              'Spécialité personnalisée',
          ]

          common = {
              'font_fr': 'inter',
              'primary_color': '#003380',
              'secondary_color': '#1e40af',
              'accent_color': '#60a5fa',
              'nom_cabinet': 'Cabinet Dentaire Digital Crown',
              'nom_praticien': 'Dr. Achraf Benmoussa',
              'nom_complet': 'Achraf Benmoussa',
              'header_lines_fr': ['Dr. Achraf Benmoussa', 'Chirurgien Dentiste', *specialty_lines_fr],
              'header_lines_ar': [
                  'د. أشرف بنموسى',
                  'طبيب جراح للأسنان',
                  'علاج - علاج العصب',
                  'أمراض اللثة - تقويم الأسنان',
                  'تعويض الأسنان - جراحة',
                  'زراعة الأسنان - تبييض الأسنان',
                  'تجميل الأسنان - تخصص مخصص',
              ],
              'footer_address': 'Rabat, Maroc',
              'footer_phones': '05 37 00 00 00',
              'footer_email': 'contact@digitalcrown.local',
              'logo_path': logo_filename,
              'margin_top': None,
              'margin_bottom': None,
              'qr_code_enabled': False,
              'watermark_enabled': False,
              'hide_header': False,
              'hide_footer': False,
              'use_letterhead': False,
              'header_font_scale': 1.0,
              'header_logo_scale': 1.0,
              'header_line_height': 1.0,
          }

          templates = ['swiss', 'royal', 'clinical', 'modern', 'heritage']
          generator = OrdonnanceGenerator(str(pdf_dir / '_tmp'))
          assert generator.base_template.arabic_font == 'ArabicFont', (
              'Audit runner must resolve a Unicode Arabic font; broken-glyph fallback is forbidden.'
          )
          assert Path(generator.base_template.arabic_font_path).exists()
          (out / 'font-proof.txt').write_text(
              f"arabic_font={generator.base_template.arabic_font}\n"
              f"arabic_font_path={generator.base_template.arabic_font_path}\n",
              encoding='utf-8',
          )

          for template in templates:
              config = dict(common, selected_template=template)
              generated = Path(generator.generate(patient, data, custom_config=config))
              target_pdf = pdf_dir / f'{template}.pdf'
              shutil.copy2(generated, target_pdf)

              doc = fitz.open(target_pdf)
              assert doc.page_count == 1, f'{template}: expected one page, got {doc.page_count}'
              page = doc[0]
              text = page.get_text()
              for specialty in expected_specialties:
                  assert specialty in text, f'{template}: missing specialty {specialty!r}'
              pix = page.get_pixmap(matrix=fitz.Matrix(2.2, 2.2), alpha=False)
              pix.save(png_dir / f'{template}.png')
              doc.close()

          shutil.copy2(logo_path, out / logo_filename)
          assert len(list(pdf_dir.glob('*.pdf'))) == 5
          assert len(list(png_dir.glob('*.png'))) == 5
          PY
      - name: Generate five real ten-line accounting models
        run: |
          python - <<'PY'
          import datetime
          import shutil
          from pathlib import Path
          from types import SimpleNamespace
          import fitz

          from backend.services.generators.accounting_gen import AccountingGenerator

          out = Path('settings-document-models-audit') / 'accounting-10-lines'
          pdf_dir = out / 'pdf'
          png_dir = out / 'png'
          pdf_dir.mkdir(parents=True, exist_ok=True)
          png_dir.mkdir(parents=True, exist_ok=True)

          patient = SimpleNamespace(nom='ALAMI', prenom='Sara', date_naissance=datetime.date(1990, 4, 12))
          acts = [
              ('Consultation et bilan clinique complet', [11, 12], 'Carte', 350.00),
              ('Détartrage ultrasonique des deux arcades', [16, 26, 36, 46], 'Carte', 600.00),
              ('Traitement endodontique molaire', [36], 'Espèces', 1800.00),
              ('Reconstitution coronaire composite postérieure', [36], 'Espèces', 750.00),
              ('Couronne céramo-céramique sur molaire', [36], 'Virement', 3200.00),
              ('Extraction chirurgicale dent de sagesse incluse', [48], 'Carte', 1500.00),
              ('Implant dentaire ostéointégré', [46], 'Virement', 6500.00),
              ('Couronne provisoire implanto-portée', [46], 'Virement', 900.00),
              ('Blanchiment ambulatoire avec gouttières', [], 'Carte', 2200.00),
              ('Contrôle post-opératoire et ajustement occlusal', [36, 46], 'Espèces', 300.00),
          ]
          payments = [
              SimpleNamespace(acte=a, dents=d, dent=(d[0] if d else '-'), mode_reglement=m, montant=v)
              for a, d, m, v in acts
          ]
          data = SimpleNamespace(id='AUDIT-FACT-10', doc_date=datetime.date(2026, 9, 2), payments=payments, installments=[], is_global_note=False)

          header_fr = [
              'Dr. Achraf Benmoussa', 'Chirurgien Dentiste', 'Soins - Endodontie',
              'Parodontologie - Orthodontie', 'Prothèse - Chirurgie',
              'Implantologie - Blanchiment', 'Esthétique - Spécialité personnalisée',
          ]
          header_ar = [
              'د. أشرف بنموسى', 'طبيب جراح للأسنان', 'علاج - علاج العصب',
              'أمراض اللثة - تقويم الأسنان', 'تعويض الأسنان - جراحة',
              'زراعة الأسنان - تبييض الأسنان', 'تجميل الأسنان - تخصص مخصص',
          ]

          class FakeQuery:
              def __init__(self, value): self.value = value
              def filter(self, *args, **kwargs): return self
              def first(self): return self.value
          class FakeDB:
              def __init__(self, config, user): self.config, self.user = config, user
              def query(self, model): return FakeQuery(self.config if model.__name__ == 'CabinetConfig' else self.user)

          templates = ['swiss', 'royal', 'clinical', 'modern', 'heritage']
          for template in templates:
              config = SimpleNamespace(
                  primary_color='#003380', secondary_color='#1e40af', accent_color='#60a5fa',
                  selected_template=template, font_fr='inter', header_font_scale=1.0,
                  header_logo_scale=1.0, header_line_height=1.0, header_scale=1.0,
                  header_logo_offset_x=0.0, header_logo_offset_y=0.0,
                  footer_font_scale=1.0, footer_qr_scale=1.0, footer_line_height=1.0,
                  qr_code_enabled=False, watermark_enabled=False, hide_header=False,
                  hide_footer=False, use_letterhead=False, letterhead_path=None,
                  logo_path=None, header_lines_fr=header_fr, header_lines_ar=header_ar,
                  footer_address='Rabat, Maroc', footer_phones='05 37 00 00 00',
                  adresse='Rabat, Maroc', telephone='05 37 00 00 00',
                  nom_cabinet='Cabinet Dentaire Digital Crown', nom_praticien='Dr. Achraf Benmoussa',
                  nom_praticien_ar='د. أشرف بنموسى', nom='Achraf Benmoussa',
                  inpe='', inpe_etablissement='', ice='', if_='', contacts_json={},
                  qr_code_type='VCARD', qr_code_value=None, qr_code_color=None, qr_code_label=None,
                  qr_code_style='dots', qr_code_offset_x=0.0, qr_code_offset_y=0.0,
                  cloture_note_template='Arrêtée la présente note à la somme de {total_words} TTC.',
                  margin_top=3.6, margin_bottom=3.2,
              )
              user = SimpleNamespace(id=1, nom='Benmoussa', prenom='Achraf', email='audit@digitalcrown.local')
              db = FakeDB(config, user)
              generator = AccountingGenerator(str(pdf_dir / template))
              generated = Path(generator.generate_note(patient, data, facture_number='F-2026-0010', db=db, user_id=1))
              target = pdf_dir / f'{template}.pdf'
              shutil.copy2(generated, target)

              doc = fitz.open(target)
              text = '\n'.join(page.get_text() for page in doc)
              assert 'F-2026-0010' in text, f'{template}: invoice number missing'
              for act, *_ in acts:
                  assert act in text, f'{template}: missing row {act!r}'
              assert 'TOTAL GÉNÉRAL' in text, f'{template}: total missing'
              (out / f'{template}-pages.txt').write_text(str(doc.page_count), encoding='utf-8')
              for page_no, page in enumerate(doc):
                  pix = page.get_pixmap(matrix=fitz.Matrix(2.2, 2.2), alpha=False)
                  pix.save(png_dir / f'{template}-p{page_no + 1}.png')
              doc.close()
          PY
      - name: Upload five-model audit
        uses: actions/upload-artifact@v4
        with:
          name: settings-document-models-audit
          path: settings-document-models-audit/
          if-no-files-found: error
          retention-days: 14
