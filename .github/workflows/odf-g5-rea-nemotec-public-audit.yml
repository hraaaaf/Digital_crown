name: ODF G5 LAB - Ubuntu REA browser audit of public Nemotec demos (no license bypass)

on:
  pull_request:
    paths:
      - .github/workflows/odf-g5-rea-nemotec-public-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rea-public-website-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
      REA_CDP_ENDPOINT: http://127.0.0.1:9222
      REA_NEMOTEC_PUBLIC_URL: https://nemouniversity.nemotec.com/en/demo/
    steps:
      - name: Checkout exact PR head (no merge, no deploy)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up supported Node.js 24 for REA
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Prepare isolated evidence folder and pin REA npm version
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p rea-public-evidence
          cat /etc/os-release > rea-public-evidence/host-os.txt
          node --version | tee rea-public-evidence/node-version.txt
          npm --version | tee rea-public-evidence/npm-version.txt
          RESOLVED_REA_VERSION="$(npm view rea-agents version)"
          echo "REA_VERSION=$RESOLVED_REA_VERSION" >> "$GITHUB_ENV"
          echo "$RESOLVED_REA_VERSION" | tee rea-public-evidence/rea-version.txt
          npm install --prefix /tmp/rea-public-lab --no-audit --no-fund --no-save "rea-agents@${RESOLVED_REA_VERSION}"
          test -x /tmp/rea-public-lab/node_modules/.bin/rea
          /tmp/rea-public-lab/node_modules/.bin/rea --help > rea-public-evidence/rea-help.txt
          /tmp/rea-public-lab/node_modules/.bin/rea doctor --json > rea-public-evidence/rea-doctor.json || true

      - name: Prove REA browser inspector works on a synthetic local test page (NOT Nemotec)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/rea-fixture
          printf '%s\n' '<!doctype html><title>G5 REA synthetic smoke</title><main><h1>Local synthetic test only</h1><button type="button">Safe test</button></main>' > /tmp/rea-fixture/index.html
          python3 -m http.server 8123 --bind 127.0.0.1 --directory /tmp/rea-fixture > /tmp/g5-rea-fixture-server.log 2>&1 &
          echo "$!" > /tmp/g5-rea-fixture-server.pid
          google-chrome --headless=new --disable-gpu --no-sandbox \
            --disable-dev-shm-usage --no-first-run \
            --remote-debugging-address=127.0.0.1 --remote-debugging-port=9222 \
            --user-data-dir=/tmp/g5-rea-synthetic-browser --window-size=1440,900 \
            http://127.0.0.1:8123/ > /tmp/g5-rea-smoke-chrome.log 2>&1 &
          echo "$!" > /tmp/g5-rea-chrome.pid
          for i in $(seq 1 35); do
            if curl -fsS --max-time 2 http://127.0.0.1:9222/json/list > rea-public-evidence/chrome-targets-cdp.json; then break; fi
            sleep 1
          done
          python3 - <<'PY'
          import json
          from pathlib import Path
          ts=json.loads(Path("rea-public-evidence/chrome-targets-cdp.json").read_text())
          a=[t for t in ts if t.get("type")=="page" and "127.0.0.1:8123" in t.get("url","")]
          assert a, "LOCAL_SYNTHETIC_PAGE_NOT_VISIBLE"
          Path("rea-public-evidence/smoke-target-id.txt").write_text(a[0]["id"])
          print("CHROME_SYNTHETIC_LOCAL_PAGE_READY")
          PY
          REA=/tmp/rea-public-lab/node_modules/.bin/rea
          "$REA" list-browser-targets http://127.0.0.1:9222 --json > rea-public-evidence/rea-smoke-targets.json
          "$REA" inspect-web-page http://127.0.0.1:9222 "$(cat rea-public-evidence/smoke-target-id.txt)" \
            --observation-ms 1000 --include-accessibility-text --json \
            > rea-public-evidence/rea-smoke-inspection.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("rea-public-evidence/rea-smoke-inspection.json").read_text())
          assert isinstance(d,dict) and len(str(d))>100
          Path("rea-public-evidence/smoke-status.txt").write_text("PASS: REA inspector executed on synthetic local fixture. This is NOT NemoStudio.\n")
          print("REA_REAL_BROWSER_INSPECTION_SMOKE_PASS")
          PY

      - name: Try two official PUBLIC Nemo pages; never mistake a timeout for a REA failure
        shell: bash
        run: |
          set -euo pipefail
          URL=""
          for candidate in \
            'https://nemotec.com/nemostudio/en/products/nemoceph/' \
            'https://nemouniversity.nemotec.com/en/demo/'; do
            if curl --fail --location --silent --show-error --connect-timeout 5 \
              --max-time 18 --output /tmp/g5-nemotec-public-response.html "$candidate"; then
              URL="$candidate"
              break
            fi
          done
          if [ -z "$URL" ]; then
            echo 'UNAVAILABLE: Both official public Nemo URLs failed network reachability from GitHub Ubuntu. NemoStudio itself was NOT installed, and NO Nemo audit was performed.' \
              | tee rea-public-evidence/nemotec-site-check.txt
            exit 0
          fi
          echo "HTTP_PUBLIC_REACHABLE: $URL" | tee rea-public-evidence/nemotec-site-check.txt
          google-chrome --headless=new --disable-gpu --no-sandbox --disable-dev-shm-usage \
            --no-first-run --remote-debugging-address=127.0.0.1 --remote-debugging-port=9223 \
            --user-data-dir=/tmp/g5-rea-nemotec-browser --window-size=1440,900 "$URL" \
            >/tmp/g5-rea-nemotec-chrome.log 2>&1 &
          echo "$!" > /tmp/g5-rea-nemotec-chrome.pid
          for i in $(seq 1 35); do
            if curl -fsS --max-time 2 http://127.0.0.1:9223/json/list \
                > rea-public-evidence/nemotec-chrome-targets.json; then break; fi
            sleep 1
          done
          python3 - <<'PY'
          import json
          from pathlib import Path
          ts=json.loads(Path("rea-public-evidence/nemotec-chrome-targets.json").read_text())
          a=[t for t in ts if t.get("type")=="page" and ("nemotec.com" in t.get("url",""))]
          assert a, "NEMOTEC_ORIGIN_UNAVAILABLE"
          Path("rea-public-evidence/nemotec-public-target-id.txt").write_text(a[0]["id"])
          print("REA_NEMOTEC_PUBLIC_CHROME_READY",a[0]["url"])
          PY
          REA=/tmp/rea-public-lab/node_modules/.bin/rea
          "$REA" list-browser-targets http://127.0.0.1:9223 --json \
            > rea-public-evidence/rea-nemotec-public-targets.json
          "$REA" inspect-web-page http://127.0.0.1:9223 \
            "$(cat rea-public-evidence/nemotec-public-target-id.txt)" \
            --observation-ms 1000 --include-accessibility-text --json \
            > rea-public-evidence/rea-nemotec-public-inspection.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("rea-public-evidence/rea-nemotec-public-inspection.json")
          d=json.loads(p.read_text())
          assert isinstance(d,dict) and p.stat().st_size>100
          print("REA_PUBLIC_NEMOTEC_WEBSITE_INSPECTION_COMPLETED_NOT_NEMOSTUDIO_APP")
          PY

      - name: Ensure browser shutdown and discard dedicated profile
        if: always()
        shell: bash
        run: |
          if test -f /tmp/g5-rea-chrome.pid; then
            kill "$(cat /tmp/g5-rea-chrome.pid)" 2>/dev/null || true
          fi
          if test -f /tmp/g5-rea-fixture-server.pid; then
            kill "$(cat /tmp/g5-rea-fixture-server.pid)" 2>/dev/null || true
          fi
          if test -f /tmp/g5-rea-nemotec-chrome.pid; then
            kill "$(cat /tmp/g5-rea-nemotec-chrome.pid)" 2>/dev/null || true
          fi
          # Chrome can still flush its ephemeral profile after SIGTERM. The VM is disposable.
          sleep 2
          rm -rf /tmp/g5-rea-synthetic-browser /tmp/g5-rea-nemotec-browser || {
            echo 'CLEANUP_WARNING: Chrome profile was still being written; ephemeral runner will be destroyed.'
            true
          }

      - name: Upload only public website evidence; never patients or proprietary software
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g5-rea-nemotec-public-audit-${{ github.run_id }}
          path: rea-public-evidence/
          retention-days: 7
          if-no-files-found: warn
