name: Patient Companion D1 lockfile

on:
  push:
    branches:
      - feat/patient-companion-d1-ui
    paths:
      - '.github/workflows/patient-companion-d1-lockfile.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/patient-companion-d1-ui
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Generate exact Firebase lockfile
        working-directory: frontend
        run: npm install --package-lock-only --save-exact firebase@12.19.0
      - name: Verify lockfile
        working-directory: frontend
        run: |
          node -e "const p=require('./package.json'); if(p.dependencies.firebase!=='12.19.0') process.exit(1)"
          node -e "const l=require('./package-lock.json'); if(l.packages[''].dependencies.firebase!=='12.19.0') process.exit(1)"
      - name: Commit generated package metadata only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package.json frontend/package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "chore(patient-companion): add Firebase web auth dependency"
          git push origin HEAD:feat/patient-companion-d1-ui
