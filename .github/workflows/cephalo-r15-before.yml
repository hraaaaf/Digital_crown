name: Cephalo R15 BEFORE

on:
  workflow_dispatch:
  push:
    branches:
      - feat/cephalo-r15-clinical-studio-ux
    paths:
      - 'frontend/scripts/capture-cephalo-r15-before.mjs'
      - '.github/workflows/cephalo-r15-before.yml'

permissions:
  contents: read

env:
  R15_BASE_SHA: 36091c89a6f4ae0679f40980e9f7f3e5e143d6be

jobs:
  visual-before:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout R15 harness branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Prepare exact R14-closed baseline
        run: |
          git worktree add /tmp/dc-r15-before "$R15_BASE_SHA"
          test "$(git -C /tmp/dc-r15-before rev-parse HEAD)" = "$R15_BASE_SHA"
      - name: Install harness browser dependencies
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save --package-lock=false --legacy-peer-deps playwright@1.55.0 react-is@19.2.0
          npx playwright install --with-deps chromium
      - name: Install exact baseline frontend
        run: |
          cd /tmp/dc-r15-before/frontend
          npm ci
          npm install --no-save --package-lock=false --legacy-peer-deps react-is@19.2.0
      - name: Capture exact R15 BEFORE
        run: |
          cd /tmp/dc-r15-before/frontend
          PRODUCT_HEAD="$R15_BASE_SHA" node "$GITHUB_WORKSPACE/frontend/scripts/capture-cephalo-r15-before.mjs"
          rm -rf "$GITHUB_WORKSPACE/frontend/cephalo-r15-before-artifacts"
          cp -R cephalo-r15-before-artifacts "$GITHUB_WORKSPACE/frontend/"
      - name: Verify exact baseline artifact contract
        working-directory: frontend
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const report = JSON.parse(await readFile('cephalo-r15-before-artifacts/report.json', 'utf8'));
          const expected = process.env.R15_BASE_SHA;
          if (report.productHead !== expected) throw new Error(`Wrong baseline SHA ${report.productHead}`);
          if (report.phase !== 'BEFORE') throw new Error(`Wrong phase ${report.phase}`);
          if (report.invalidCount !== 0) throw new Error(`Invalid captures ${report.invalidCount}`);
          if (report.blockedExternalRequests.length !== 0) throw new Error('Unexpected external egress');
          if (report.captures.length !== 3) throw new Error('Expected three certified viewports');
          for (const capture of report.captures) {
            if (!capture.valid) throw new Error(`Invalid ${capture.viewport}`);
            if (capture.consoleErrors.length) throw new Error(`Console errors ${capture.viewport}`);
            if (capture.pageErrors.length) throw new Error(`Page errors ${capture.viewport}`);
            if (capture.step3Top.horizontalDocumentOverflow || capture.step4Top.horizontalDocumentOverflow) throw new Error(`Overflow ${capture.viewport}`);
            if (!capture.step3Top.hasLegacyDiagnostic || !capture.step3Top.hasLegacyTreatmentDecision) throw new Error(`Missing Step3 baseline semantics ${capture.viewport}`);
            if (!capture.step4Top.hasLegacyTreatmentPanel || !capture.step4Top.hasLegacyArchiveAction) throw new Error(`Missing Step4 baseline semantics ${capture.viewport}`);
            if (capture.step3Top.hasR11Surface || capture.step3Top.hasR12Surface || capture.step3Top.hasR13Surface || capture.step3Top.hasR14Surface) throw new Error(`R11-R14 UI leaked into baseline ${capture.viewport}`);
          }
          NODE
          for viewport in 390x844 768x1024 1280x900; do
            test -s "cephalo-r15-before-artifacts/before-step3-top-${viewport}.png"
            test -s "cephalo-r15-before-artifacts/before-step3-decision-${viewport}.png"
            test -s "cephalo-r15-before-artifacts/before-step4-top-${viewport}.png"
            test -s "cephalo-r15-before-artifacts/before-step4-action-${viewport}.png"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cephalo-r15-before-exact-master
          path: frontend/cephalo-r15-before-artifacts
          if-no-files-found: error
          retention-days: 30
