name: Dashboard D2 apply

on:
  push:
    branches:
      - agent/dashboard-d2-system-truth

jobs:
  apply:
    if: ${{ github.event.head_commit.message != 'fix(dashboard): make system health status fail-closed' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply D2 system truth
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('frontend/src/pages/Dashboard.tsx')
          s=p.read_text()
          old="  const [cabinetHealth, setCabinetHealth] = useState<CabinetHealth | null>(null);\n"
          new=old+"  const [cabinetHealthState, setCabinetHealthState] = useState<'idle' | 'checking' | 'verified' | 'unverified'>('idle');\n"
          assert old in s, 'cabinetHealth state anchor missing'
          s=s.replace(old,new,1)

          start=s.index("  // Widget santé cabinet — propriétaire/admin uniquement, poll 2 min (même pattern")
          end=s.index("\n  const markAlertRead", start)
          replacement="""  // Widget santé cabinet — propriétaire/admin uniquement, poll 2 min.
  // Fail-closed : aucune réponse réseau ne doit être transformée en état rassurant.
  useEffect(() => {
    if (authLoading) return;
    if (!hasAccess('admin')) {
      setCabinetHealth(null);
      setCabinetHealthState('idle');
      return;
    }

    let cancelled = false;
    const fetchHealth = async () => {
      if (!cancelled) setCabinetHealthState('checking');
      try {
        const res = await api.get('/admin/cabinet-health');
        if (cancelled) return;
        setCabinetHealth(res.data);
        setCabinetHealthState('verified');
      } catch {
        if (cancelled) return;
        setCabinetHealth(null);
        setCabinetHealthState('unverified');
      }
    };

    fetchHealth();
    const interval = setInterval(fetchHealth, 120000);
    return () => {
      cancelled = true;
      clearInterval(interval);
    };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [user, authLoading]);
"""
          s=s[:start]+replacement+s[end:]

          start=s.index('          <div className="flex items-center gap-4 bg-card-bg/40 p-2 rounded-elite-lg border border-border-main shadow-elite transition-elite hover:bg-card-bg/60">')
          end=s.index('\n        </div>\n      </motion.header>', start)
          old_widget=s[start:end]
          assert 'Système local actif' in old_widget, 'system widget anchor changed'
          replacement="""          {hasAccess('admin') && (
            <div className="flex items-center gap-4 bg-card-bg/40 p-2 rounded-elite-lg border border-border-main shadow-elite transition-elite hover:bg-card-bg/60">
              <div className="px-6 py-3 rounded-elite-sm flex flex-col items-end">
                <span className="text-[10px] font-black text-text-muted uppercase tracking-widest mb-1">Statut Système</span>
                <div className="flex items-center gap-2">
                  <div className={cn(
                    "w-2 h-2 rounded-full",
                    cabinetHealthState !== 'verified' ? "bg-slate-400" :
                    cabinetHealth?.overall_severity === "ok" ? "bg-emerald-500 animate-pulse" :
                    cabinetHealth?.overall_severity === "warning" ? "bg-amber-500" : "bg-red-500"
                  )} />
                  <span className="text-sm font-black text-main uppercase tracking-tighter" style={{ color: 'var(--text-main)' }}>
                    {cabinetHealthState === 'checking' ? "Vérification…" :
                      cabinetHealthState === 'unverified' ? "État non vérifié" :
                      cabinetHealthState === 'verified' && cabinetHealth?.overall_severity === "ok" ? "Système opérationnel" :
                      cabinetHealthState === 'verified' && cabinetHealth?.overall_severity === "warning" ? "Vigilance requise" :
                      cabinetHealthState === 'verified' ? "Problème détecté" : "État non vérifié"}
                  </span>
                </div>
              </div>
            </div>
          )}"""
          s=s[:start]+replacement+s[end:]
          p.write_text(s)

          Path('frontend/src/pages/Dashboard.systemTruth.test.ts').write_text('''import { describe, expect, it } from "vitest";\nimport fs from "node:fs";\nimport path from "node:path";\nconst source = fs.readFileSync(path.resolve(__dirname, "Dashboard.tsx"), "utf8");\ndescribe("Dashboard D2 system truth", () => {\n  it("does not turn missing health data into a positive state", () => {\n    expect(source).not.toContain('!cabinetHealth ? "Système local actif"');\n    expect(source).toContain("setCabinetHealthState('unverified')");\n    expect(source).toContain('"État non vérifié"');\n  });\n  it("requires verified severity for the green label", () => {\n    expect(source).toContain("cabinetHealthState === 'verified' && cabinetHealth?.overall_severity === \\\"ok\\\"");\n    expect(source).toContain('"Système opérationnel"');\n  });\n  it("hides system status outside admin access", () => {\n    expect(source).toContain("{hasAccess('admin') && (");\n    expect(source).toContain("Statut Système");\n  });\n});\n''')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/pages/Dashboard.tsx frontend/src/pages/Dashboard.systemTruth.test.ts
          git commit -m 'fix(dashboard): make system health status fail-closed'
          git push origin HEAD:agent/dashboard-d2-system-truth
