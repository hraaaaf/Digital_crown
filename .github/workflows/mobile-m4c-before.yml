name: Mobile M4-C Document BEFORE

on:
  push:
    branches:
      - audit/mobile-m4c-document-before-20260825
    paths:
      - '.audit/mobile-m4c-before-scenario.yml'
      - '.github/workflows/mobile-m4c-before.yml'

jobs:
  before:
    name: M4-C Document contextual BEFORE
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend and Chromium
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.62.1
          npx playwright install --with-deps chromium

      - name: Materialize M4-C BEFORE harness
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          source = Path('.audit/mobile-m4c-before-scenario.yml').read_text()
          for target in ['mobile-m4c-before.html', 'src/mobile-m4c-before.tsx', 'mobile-m4c-before.mjs']:
              pattern = rf"cat > {re.escape(target)} <<'EOF'\n(.*?)\n    EOF"
              match = re.search(pattern, source, re.S)
              if not match:
                  raise SystemExit(f'M4-C BEFORE block missing: {target}')
              lines = [line[10:] if line.startswith('          ') else line for line in match.group(1).splitlines()]
              destination = Path('frontend') / target
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_text('\n'.join(lines) + '\n')
          PY

      - name: Capture M4-C BEFORE
        working-directory: frontend
        env:
          BASELINE_HEAD: cb66d2f379803220d1a81f307db803737a167c94
        run: node mobile-m4c-before.mjs

      - name: Upload M4-C BEFORE evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-m4c-document-before
          path: frontend/mobile-m4c-before-artifacts/
          if-no-files-found: error
          retention-days: 14
