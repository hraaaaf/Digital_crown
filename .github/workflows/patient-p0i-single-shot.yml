name: Patient P0-I Truth Single Shot

on:
  push:
    branches: [agent/patient-page-p0-rescue]
    paths:
      - '.github/workflows/patient-p0i-single-shot.yml'

permissions:
  contents: write

jobs:
  apply-test-push:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/patient-page-p0-rescue
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Remove unsupported clinical and commercial NBA conclusions
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('backend/services/habits_engine.py'); s=p.read_text(encoding='utf-8')
          patterns=[
            (r'\n        # Exemple 2 : Prévention \(Trigger Temps\).*?\n        # Exemple 3 : Dossier Incomplet', '\n        # Prévention clinique fondée sur un délai uniquement : supprimée en P0 fail-closed.\n\n        # Exemple 3 : Dossier Incomplet'),
            (r'\n        # C3: Patient Haute Valeur à Risque.*?\n        # A4: Traitement Abandonné', '\n        # Classement commercial Patient Premium : exclu des alertes Patient P0.\n\n        # A4: Traitement Abandonné'),
            (r'\n        # B4: Progression Traitement Ortho.*?\n        # B3: Créneau Maudit', '\n        # Progression orthodontique automatique : supprimée, le dossier ne permet pas de conclure cliniquement.\n\n        # B3: Créneau Maudit'),
            (r'\n        # B5: Prédiction Fin Traitement Ortho.*?\n        # C4: Rappels Semestriels Ortho', '\n        # Estimation automatique de fin orthodontique : supprimée en P0 fail-closed.\n\n        # C4: Rappels Semestriels Ortho'),
          ]
          for pat,repl in patterns:
              s2,n=re.subn(pat,repl,s,count=1,flags=re.S)
              if n!=1: raise SystemExit(f'habits_engine mismatch: {pat[:45]}')
              s=s2
          p.write_text(s,encoding='utf-8')

          p=Path('backend/services/elite_manager.py'); s=p.read_text(encoding='utf-8')
          old='''                    insights.append({
                        "id": f"pano_detect_{latest_pano.id}",
                        "type": "diagnostic",
                        "title": "Intelligence Panoramique",
                        "content": f"🔬 {len(detections)} anomalies détectées sur la panoramique (IA).",
                        "actionLabel": "Consulter le bilan",
                        "source_type": "DETERMINISTIC",
                        "trust_level": 1.0
                    })'''
          new='''                    insights.append({
                        "id": f"pano_detect_{latest_pano.id}",
                        "type": "suggestion",
                        "title": "Repérage Panoramique",
                        "content": f"{len(detections)} repère(s) dentaire(s) automatique(s) disponible(s) sur la panoramique. Aucune anomalie n'est conclue automatiquement.",
                        "actionLabel": "Consulter le bilan",
                        "source_type": "DETERMINISTIC",
                        "trust_level": 1.0
                    })'''
          if old not in s: raise SystemExit('elite_manager panorama block mismatch')
          s=s.replace(old,new,1)
          old2='''            pano_findings = rag_ctx.get("panoramic_findings", [])
            if pano_findings:
                insights.append({
                    "id": f"rag_pano_{patient_id}",
                    "type": "diagnostic",
                    "title": "Findings Panoramiques Récents",
                    "content": "Détections IA récentes : " + ", ".join(pano_findings[:3]) + ".",
                    "source_type": "DETERMINISTIC",
                    "trust_level": 1.0,
                })'''
          new2='''            pano_landmarks = rag_ctx.get("panoramic_landmarks", [])
            if pano_landmarks:
                insights.append({
                    "id": f"rag_pano_{patient_id}",
                    "type": "suggestion",
                    "title": "Repérages Panoramiques Récents",
                    "content": "Repères dentaires automatiques récents : " + ", ".join(pano_landmarks[:3]) + ". Aucune anomalie n'est conclue automatiquement.",
                    "source_type": "DETERMINISTIC",
                    "trust_level": 1.0,
                })'''
          if old2 not in s: raise SystemExit('elite_manager RAG panorama block mismatch')
          p.write_text(s.replace(old2,new2,1),encoding='utf-8')

          p=Path('backend/services/rag_context.py'); s=p.read_text(encoding='utf-8')
          s=s.replace('def _extract_panoramic_summary(panoramics: list) -> list[str]:\n    """Extract top findings from the most recent panoramic analyses."""\n    findings = []', 'def _extract_panoramic_landmarks(panoramics: list) -> list[str]:\n    """Extract tooth-localization landmarks only; this does not infer pathology."""\n    landmarks = []')
          s=s.replace('if entry not in findings:\n                    findings.append(entry)\n    return findings[:5]', 'if entry not in landmarks:\n                    landmarks.append(entry)\n    return landmarks[:5]')
          s=s.replace('"panoramic_findings": _extract_panoramic_summary(panoramics),', '"panoramic_landmarks": _extract_panoramic_landmarks(panoramics),')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Truth contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          h=Path('backend/services/habits_engine.py').read_text(encoding='utf-8')
          e=Path('backend/services/elite_manager.py').read_text(encoding='utf-8')
          r=Path('backend/services/rag_context.py').read_text(encoding='utf-8')
          for bad in ['Risque parodontal élevé','Planifier Détartrage','Suggérer Détartrage','Patient Premium — Impayé Critique','Patient PLATINUM','ORTHO_PROGRESSION','ORTHO_COMPLETION_ESTIMATE']:
              assert bad not in h, bad
          assert 'anomalies détectées sur la panoramique' not in e
          assert '"type": "diagnostic"' not in e[e.index('# --- INTELLIGENCE PANORAMIQUE'):e.index('# --- MPL : TRIGGERS PROACTIFS')]
          assert 'panoramic_findings' not in e
          assert 'panoramic_findings' not in r
          assert 'panoramic_landmarks' in e and 'panoramic_landmarks' in r
          assert 'Aucune anomalie n\'est conclue automatiquement.' in e
          PY
      - name: Syntax
        run: python -m py_compile backend/services/habits_engine.py backend/services/elite_manager.py backend/services/rag_context.py
      - name: Commit and rebase-safe push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/services/habits_engine.py backend/services/elite_manager.py backend/services/rag_context.py
          git commit -m 'fix(patient): fail-close NBA and panoramic truth'
          git fetch origin agent/patient-page-p0-rescue
          git rebase origin/agent/patient-page-p0-rescue
          git push origin HEAD:agent/patient-page-p0-rescue

