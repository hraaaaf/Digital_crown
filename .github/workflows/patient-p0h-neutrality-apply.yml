name: Patient P0-H Neutrality Apply

on:
  push:
    branches: [agent/patient-page-p0-rescue]
    paths:
      - '.github/workflows/patient-p0h-neutrality-apply.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-certify:
    if: ${{ !contains(github.event.head_commit.message, 'cert(patient): P0-H visual neutrality') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ENVIRONMENT: test
      SECRET_KEY: patient-p0h-neutrality-apply-secret-000001
      DATABASE_URL: sqlite:///./t2-runtime-cert.db
      TELEMETRY_ENABLED: 'false'
      CLOUD_AI_ENABLED: 'false'
      DEBUG: 'false'
      ALLOWED_ORIGINS: 'http://127.0.0.1:5173,http://localhost:5173'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/patient-page-p0-rescue
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Apply exact visual-neutrality delta
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('frontend/src/features/patients/PatientDetailsInner.tsx')
          s = p.read_text(encoding='utf-8')
          removals = [
              "import { PatientScoreBadge } from './components/PatientScoreBadge';\n",
              "import { useSettingsStore } from '../admin/Settings/hooks/useSettingsStore';\n",
              "  const show_patient_badges = useSettingsStore(state => state.profile.show_patient_badges);\n",
              "                  {show_patient_badges && <PatientScoreBadge patientId={Number(id)} />}\n",
          ]
          for old in removals:
              if s.count(old) != 1:
                  raise SystemExit(f'P0-H source mismatch; expected exactly once: {old!r}')
              s = s.replace(old, '', 1)
          p.write_text(s, encoding='utf-8')

          # Runtime-only instrumentation. This file is restored before commit.
          b = Path('frontend/src/features/patients/components/PatientScoreBadge.tsx')
          badge = b.read_text(encoding='utf-8')
          old = '<div className={cn("relative", className)}>'
          if badge.count(old) != 1:
              raise SystemExit('PatientScoreBadge root mismatch')
          b.write_text(badge.replace(old, '<div data-testid="patient-score-badge" className={cn("relative", className)}>', 1), encoding='utf-8')
          PY

      - name: Verify product diff scope before runtime
        run: |
          git diff -- frontend/src/features/patients/PatientDetailsInner.tsx
          test "$(git diff --numstat -- frontend/src/features/patients/PatientDetailsInner.tsx | awk '{print $1}')" = "0"
          test "$(git diff --numstat -- frontend/src/features/patients/PatientDetailsInner.tsx | awk '{print $2}')" = "4"

      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.12.0 torchvision==0.27.0 --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^(torch|torchvision)([<=>].*)?$' requirements.txt > /tmp/requirements-p0h-after.txt
          pip install -r /tmp/requirements-p0h-after.txt
          pip install httpx==0.27.2

      - name: Install frontend and Chromium
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Start isolated backend
        run: |
          rm -f t2-runtime-cert.db
          python scripts/t2_runtime_server.py > /tmp/p0h-after-backend.log 2>&1 &
          for i in {1..90}; do
            if curl -fsS http://127.0.0.1:8005/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/p0h-after-backend.log
          exit 1

      - name: Start frontend
        working-directory: frontend
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 > /tmp/p0h-after-front.log 2>&1 &
          for i in {1..90}; do
            if curl -fsS http://127.0.0.1:5173 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/p0h-after-front.log
          exit 1

      - name: Capture after on baseline viewports
        working-directory: frontend
        run: |
          mkdir -p ../artifacts/p0h-neutrality-after
          cat > .p0h-after.mjs <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import { chromium, request } from 'playwright';
          const out=path.resolve('../artifacts/p0h-neutrality-after');
          const viewports=[{width:390,height:844},{width:430,height:932},{width:768,height:1024},{width:1280,height:900}];
          const api=await request.newContext({baseURL:'http://127.0.0.1:8005'});
          const login=await api.post('/api/auth/login',{form:{username:'t2-browser@cabinet.ma',password:'T2BrowserPass123!'}});
          if(!login.ok()) throw new Error(`login ${login.status()} ${await login.text()}`);
          const tok=await login.json();
          const ps=await api.get('/api/patients',{headers:{Authorization:`Bearer ${tok.access_token}`}});
          if(!ps.ok()) throw new Error(`patients ${ps.status()} ${await ps.text()}`);
          const patient=(await ps.json()).find(p=>p.numero_dossier==='T2-0001');
          if(!patient) throw new Error('T2 patient missing');
          const browser=await chromium.launch({headless:true});
          const evidence=[];
          for(const viewport of viewports){
            const ctx=await browser.newContext({viewport,colorScheme:'light'});
            const page=await ctx.newPage();
            await page.addInitScript(({a,r})=>{localStorage.setItem('token',a);localStorage.setItem('refresh_token',r||'');localStorage.setItem('appMode','prod');},{a:tok.access_token,r:tok.refresh_token});
            const errors=[]; page.on('pageerror',e=>errors.push(String(e)));
            const responseErrors=[];
            page.on('response',r=>{ if(r.status()>=500) responseErrors.push({url:r.url(),status:r.status()}); });
            await page.goto(`http://127.0.0.1:5173/patients/${patient.id}?tab=tracking`,{waitUntil:'networkidle',timeout:90000});
            await page.waitForTimeout(700);
            const badgeCount=await page.getByTestId('patient-score-badge').count();
            const metrics=await page.evaluate(()=>({scrollWidth:document.documentElement.scrollWidth,clientWidth:document.documentElement.clientWidth,noHorizontalOverflow:document.documentElement.scrollWidth<=document.documentElement.clientWidth+2}));
            const screenshot=`after-${viewport.width}x${viewport.height}.png`;
            await page.screenshot({path:path.join(out,screenshot),fullPage:false});
            evidence.push({viewport,badgeCount,metrics,errors,responseErrors,screenshot});
            await ctx.close();
          }
          const summary={captures:evidence.length,badgeAbsentEverywhere:evidence.every(x=>x.badgeCount===0),overflowFindings:evidence.filter(x=>!x.metrics.noHorizontalOverflow),runtimeErrors:evidence.filter(x=>x.errors.length),http5xx:evidence.filter(x=>x.responseErrors.length)};
          fs.writeFileSync(path.join(out,'evidence.json'),JSON.stringify(evidence,null,2));
          fs.writeFileSync(path.join(out,'summary.json'),JSON.stringify(summary,null,2));
          await browser.close(); await api.dispose();
          if(!summary.badgeAbsentEverywhere || summary.overflowFindings.length || summary.runtimeErrors.length || summary.http5xx.length) process.exit(1);
          JS
          node .p0h-after.mjs
          rm .p0h-after.mjs

      - name: Restore runtime-only instrumentation and verify final product diff
        run: |
          git checkout -- frontend/src/features/patients/components/PatientScoreBadge.tsx
          git diff --check
          test "$(git diff --numstat -- frontend/src/features/patients/PatientDetailsInner.tsx | awk '{print $1}')" = "0"
          test "$(git diff --numstat -- frontend/src/features/patients/PatientDetailsInner.tsx | awk '{print $2}')" = "4"
          ! grep -q "PatientScoreBadge" frontend/src/features/patients/PatientDetailsInner.tsx
          ! grep -q "show_patient_badges" frontend/src/features/patients/PatientDetailsInner.tsx

      - name: Write canonical P0-H proof
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          summary=json.loads(Path('artifacts/p0h-neutrality-after/summary.json').read_text())
          proof={
            'lot':'Patient P0-H clinical header neutrality',
            'baseline':{'run_id':32129417180,'artifact_id':9321695364,'captures':4,'badge_visible_everywhere':True,'overflow_findings':0,'runtime_errors':0},
            'after':summary,
            'goal':'Remove only PatientScoreBadge from the clinical patient header; preserve existing application layout.',
            'source_delta':{'file':'frontend/src/features/patients/PatientDetailsInner.tsx','additions':0,'deletions':4},
            'workflow_run_id':os.environ.get('GITHUB_RUN_ID'),
            'pre_apply_sha':os.environ.get('GITHUB_SHA'),
            'status':'CERTIFIED'
          }
          Path('docs/PATIENT_P0H_NEUTRALITY_CERT.json').write_text(json.dumps(proof,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          PY

      - name: Upload after evidence
        uses: actions/upload-artifact@v4
        with:
          name: patient-p0h-neutrality-after
          path: artifacts/p0h-neutrality-after
          if-no-files-found: error
          retention-days: 14

      - name: Commit certified product delta only after all gates pass
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/features/patients/PatientDetailsInner.tsx docs/PATIENT_P0H_NEUTRALITY_CERT.json
          git diff --cached --check
          git commit -m 'cert(patient): P0-H visual neutrality'
          git push origin HEAD:agent/patient-page-p0-rescue
