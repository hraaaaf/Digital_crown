name: Patient P4 Imagerie After

on:
  pull_request:
    branches:
      - agent/patient-page-p3-clinique
    paths:
      - 'frontend/src/features/patients/PatientDetailsInner.tsx'
      - 'frontend/src/features/patients/components/PatientRvgPanel.tsx'
      - 'frontend/src/features/patients/PatientP4ImagingTruth.test.ts'
      - 'frontend/src/features/panoramic/**'
      - 'frontend/src/features/ortho/CephaloWorkspace.tsx'
      - 'frontend/src/features/ortho/CephaloHistory.tsx'
      - 'backend/__init__.py'
      - 'backend/models_imaging_p4.py'
      - 'backend/routers/__init__.py'
      - 'backend/routers/imaging_lifecycle_p4.py'
      - 'backend/routers/patient_journey_p4.py'
      - 'backend/services/cmo_agent_service.py'
      - 'backend/tests/test_patient_p4_imaging_trash.py'
      - 'alembic/versions/f7a8b9c0d1e2_add_imaging_trash_records.py'
      - '.github/workflows/patient-p4-imagerie-after.yml'

permissions:
  contents: read

jobs:
  after:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ENVIRONMENT: test
      SECRET_KEY: patient-p4-after-secret-000001-long-enough
      DATABASE_URL: sqlite:///./t2-runtime-cert.db
      TELEMETRY_ENABLED: 'false'
      CLOUD_AI_ENABLED: 'false'
      DEBUG: 'false'
      ALLOWED_ORIGINS: 'http://127.0.0.1:5173,http://localhost:5173'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: P4 source truth contract
        run: |
          python - <<'PY'
          from pathlib import Path
          details = Path('frontend/src/features/patients/PatientDetailsInner.tsx').read_text(encoding='utf-8')
          ceph = Path('frontend/src/features/ortho/CephaloWorkspace.tsx').read_text(encoding='utf-8')
          pano = Path('frontend/src/features/panoramic/PanoramicStudio.tsx').read_text(encoding='utf-8')
          lifecycle = Path('backend/routers/imaging_lifecycle_p4.py').read_text(encoding='utf-8')
          router_init = Path('backend/routers/__init__.py').read_text(encoding='utf-8')
          journey = Path('backend/routers/patient_journey_p4.py').read_text(encoding='utf-8')
          cmo = Path('backend/services/cmo_agent_service.py').read_text(encoding='utf-8')
          migration = Path('alembic/versions/f7a8b9c0d1e2_add_imaging_trash_records.py')

          for required in ["type RadioTab = 'rvg' | 'panoramic' | 'cephalo'", "handleRadioTabChange('rvg')", '<PatientRvgPanel patientId={Number(id)} />', 'legacyDentistEmployee', 'availableRadioTabs']:
              assert required in details, required
          for forbidden in ["age || 20", "sexe: data.sexe || 'M'", "setPatientData({ age: 20, sexe: 'M' })", 'generateTreatmentPlan(']:
              assert forbidden not in ceph, forbidden
          for required in ['patientDataError', 'Données Patient requises', 'setPatientData({ age, sexe })']:
              assert required in ceph, required
          for forbidden in ['Studio Panoramique IA', 'Détection SOTA', 'Intelligence Clinique IA', 'Zéro-Hallucination']:
              assert forbidden not in pano, forbidden
          for required in ['Studio Panoramique - {patientName}', 'Repérage dentaire automatique · validation praticien', 'Moteur déterministe • validation praticien', 'Constatations cliniques']:
              assert required in pano, required
          for required in ['panoramic-trash', 'cephalo-trash', '/panoramic/{analysis_id}/restore', '/cephalo/{analysis_id}/restore', 'ImagingTrashRecord']:
              assert required in lifecycle, required
          assert '_HARD_DELETE_PATHS' in router_init
          assert 'patient_journey_p4.router' in router_init
          assert 'removed_keys' in journey
          assert 'canonical_employer_id = patient.employer_id' in cmo
          assert 'sans LLM' in cmo
          assert migration.exists()
          m = migration.read_text(encoding='utf-8')
          assert 'revision: str = "f7a8b9c0d1e2"' in m
          assert 'down_revision: Union[str, None] = "e6f7a8b9c0d1"' in m
          assert '"imaging_trash_records"' in m
          PY

      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.12.0 torchvision==0.27.0 --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^(torch|torchvision)([<=>].*)?$' requirements.txt > /tmp/requirements-p4-after.txt
          pip install -r /tmp/requirements-p4-after.txt
          pip install httpx==0.27.2 pytest

      - name: P4 recoverable lifecycle tests
        run: pytest -q backend/tests/test_patient_p4_imaging_trash.py

      - name: Install frontend and Chromium
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
          npm test -- --run src/features/patients/PatientP4ImagingTruth.test.ts
          npm run build

      - name: Start backend
        run: |
          rm -f t2-runtime-cert.db
          python scripts/t2_runtime_server.py > /tmp/p4-after-backend.log 2>&1 &
          for i in {1..90}; do if curl -fsS http://127.0.0.1:8005/health >/dev/null; then exit 0; fi; sleep 1; done
          cat /tmp/p4-after-backend.log
          exit 1

      - name: Start frontend
        working-directory: frontend
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 > /tmp/p4-after-front.log 2>&1 &
          for i in {1..90}; do if curl -fsS http://127.0.0.1:5173 >/dev/null; then exit 0; fi; sleep 1; done
          cat /tmp/p4-after-front.log
          exit 1

      - name: Capture P4 AFTER
        working-directory: frontend
        run: |
          mkdir -p ../artifacts/p4-imagerie-after
          cat > .p4-after.mjs <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import { chromium, request } from 'playwright';
          const out=path.resolve('../artifacts/p4-imagerie-after');
          const viewports=[{width:390,height:844},{width:430,height:932},{width:768,height:1024},{width:1280,height:900}];
          const api=await request.newContext({baseURL:'http://127.0.0.1:8005'});
          const login=await api.post('/api/auth/login',{form:{username:'t2-browser@cabinet.ma',password:'T2BrowserPass123!'}});
          if(!login.ok()) throw new Error(await login.text());
          const tok=await login.json(); const headers={Authorization:`Bearer ${tok.access_token}`};
          const ps=await api.get('/api/patients',{headers});
          const patient=(await ps.json()).find(p=>p.numero_dossier==='T2-0001');
          if(!patient) throw new Error('T2 patient missing');
          const browser=await chromium.launch({headless:true}); const evidence=[];
          for(const viewport of viewports){
            const ctx=await browser.newContext({viewport,colorScheme:'light'}); const page=await ctx.newPage();
            await page.addInitScript(({a,r})=>{localStorage.setItem('token',a);localStorage.setItem('refresh_token',r||'');localStorage.setItem('appMode','prod');},{a:tok.access_token,r:tok.refresh_token});
            const errors=[]; const http5xx=[];
            page.on('pageerror',e=>errors.push(String(e)));
            page.on('response',r=>{if(r.status()>=500)http5xx.push({url:r.url(),status:r.status()});});
            await page.goto(`http://127.0.0.1:5173/patients/${patient.id}`,{waitUntil:'networkidle',timeout:90000});
            const imaging=page.getByRole('button',{name:'Imagerie',exact:true});
            await imaging.waitFor({state:'visible',timeout:30000});
            await imaging.click();
            const rvg=page.getByRole('button',{name:'RVG',exact:true});
            const pano=page.getByRole('button',{name:'Panoramique',exact:true});
            const ceph=page.getByRole('button',{name:'Céphalométrie',exact:true});
            for(const tab of [rvg,pano,ceph]) await tab.waitFor({state:'visible',timeout:30000});

            await rvg.click(); await page.waitForTimeout(600);
            const rvgOverflow=await page.evaluate(()=>document.documentElement.scrollWidth>document.documentElement.clientWidth+2);
            const rvgShot=`p4-after-rvg-${viewport.width}x${viewport.height}.png`;
            await page.screenshot({path:path.join(out,rvgShot),fullPage:false});

            await pano.click(); await page.waitForTimeout(900);
            if(await page.getByText(/Studio Panoramique IA|Intelligence Clinique IA|Détection SOTA|Zéro-Hallucination/).count()) throw new Error(`Legacy Pano AI label visible @ ${viewport.width}`);
            await page.getByText('Repérage dentaire automatique · validation praticien',{exact:true}).waitFor({state:'visible',timeout:30000});
            const panoOverflow=await page.evaluate(()=>document.documentElement.scrollWidth>document.documentElement.clientWidth+2);
            const panoShot=`p4-after-panoramic-${viewport.width}x${viewport.height}.png`;
            await page.screenshot({path:path.join(out,panoShot),fullPage:false});

            await ceph.click(); await page.waitForTimeout(900);
            const cephOverflow=await page.evaluate(()=>document.documentElement.scrollWidth>document.documentElement.clientWidth+2);
            const cephShot=`p4-after-cephalo-${viewport.width}x${viewport.height}.png`;
            await page.screenshot({path:path.join(out,cephShot),fullPage:false});

            evidence.push({viewport,rvgOverflow,panoOverflow,cephOverflow,errors,http5xx,rvgShot,panoShot,cephShot,url:page.url()});
            await ctx.close();
          }
          fs.writeFileSync(path.join(out,'evidence.json'),JSON.stringify(evidence,null,2));
          const invalid=evidence.filter(e=>e.rvgOverflow||e.panoOverflow||e.cephOverflow||e.errors.length||e.http5xx.length);
          fs.writeFileSync(path.join(out,'summary.json'),JSON.stringify({captures:evidence.length*3,invalid,evidence},null,2));
          await browser.close(); await api.dispose();
          if(evidence.length!==4||invalid.length) process.exit(1);
          JS
          node .p4-after.mjs
          rm .p4-after.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: patient-p4-imagerie-after
          path: artifacts/p4-imagerie-after
          if-no-files-found: error
          retention-days: 14
