name: Portability P7 macOS Private Distribution Certification

on:
  pull_request:
    paths:
      - "DigitalCrown.spec"
      - "backend/services/macos_private_trust.py"
      - "backend/macos_private_trust_runtime_hook.py"
      - "backend/tests/test_macos_private_trust.py"
      - "scripts/p7_macos_packaging_check.py"
      - "scripts/p10_macos_private_lifecycle_ci.py"
      - ".github/workflows/portability-p7-macos-packaging.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portability-p7-private-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  macos-private-lifecycle:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Require Apple Silicon runner
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(uname -m)" == "arm64" ]]
          echo "P7_RUNNER_ARCH=arm64"

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Static private macOS contract
        run: |
          python scripts/p7_macos_packaging_check.py --static
          python -m py_compile backend/services/macos_private_trust.py backend/macos_private_trust_runtime_hook.py scripts/p10_macos_private_lifecycle_ci.py

      - name: Private trust unit tests
        run: |
          python -m pip install --disable-pip-version-check pytest cryptography sqlalchemy python-dotenv
          python -m pytest backend/tests/test_macos_private_trust.py backend/tests/test_macos_update_apply.py backend/tests/test_macos_update_dispatch.py -q --noconftest

      - name: Build frontend once
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix frontend ci
          npm --prefix frontend run build
          rm -rf frontend/node_modules
          npm cache clean --force || true

      - name: Install exact macOS packaging toolchain
        run: python -m pip install --no-cache-dir -r backend/requirements-p7-macos.txt

      - name: Generate native macOS icon
        shell: bash
        run: |
          set -euo pipefail
          python scripts/generate_macos_icon.py
          iconutil -c icns build/macos/DigitalCrown.iconset -o build/macos/DigitalCrown.icns
          test -s build/macos/DigitalCrown.icns

      - name: Build private 1.0.0 and 1.0.1 DMGs
        shell: bash
        run: |
          set -euo pipefail
          ORIGINAL_VERSION="$(cat VERSION)"
          cleanup() { printf '%s\n' "$ORIGINAL_VERSION" > VERSION; }
          trap cleanup EXIT

          build_version() {
            local version="$1"
            printf '%s\n' "$version" > VERSION
            rm -rf build/DigitalCrown dist/DigitalCrown dist/DigitalCrown.app dist_macos
            python -m PyInstaller --noconfirm --clean DigitalCrown.spec
            codesign --force --deep --sign - dist/DigitalCrown.app
            python scripts/p7_macos_packaging_check.py --bundle dist/DigitalCrown.app
            DIGITALCROWN_PACKAGE_SELF_TEST_REPORT="$RUNNER_TEMP/self-test-${version}.json" dist/DigitalCrown.app/Contents/MacOS/DigitalCrown --package-self-test
            bash scripts/create_macos_dmg.sh
            mkdir -p "$RUNNER_TEMP/private-dmgs"
            cp "dist_macos/DigitalCrown-${version}-arm64.dmg" "$RUNNER_TEMP/private-dmgs/"
          }

          build_version "1.0.0"
          build_version "1.0.1"
          cleanup
          trap - EXIT
          echo "P7_PRIVATE_DMG_PAIR=SUCCESS"

      - name: Real private packaged update lifecycle
        shell: bash
        run: |
          set -euo pipefail
          python scripts/p10_macos_private_lifecycle_ci.py \
            --baseline-dmg "$RUNNER_TEMP/private-dmgs/DigitalCrown-1.0.0-arm64.dmg" \
            --target-dmg "$RUNNER_TEMP/private-dmgs/DigitalCrown-1.0.1-arm64.dmg" \
            --work-root "$RUNNER_TEMP/p10-private-lifecycle" \
            --report "$RUNNER_TEMP/p10-private-lifecycle-proof.json" \
            --repo-root "$GITHUB_WORKSPACE"

          python - <<'PY'
          import json, os
          from pathlib import Path
          proof = json.loads((Path(os.environ["RUNNER_TEMP"]) / "p10-private-lifecycle-proof.json").read_text())
          assert proof["status"] == "success"
          assert proof["trust_mode"] == "signed_manifest_sha256+adhoc_codesign"
          assert proof["apple_developer_id_claim"] is False
          assert proof["apple_notarization_claim"] is False
          assert proof["rescue_preflight_self_test"] == "passed_all_cases"
          assert proof["positive"]["installed_version"] == "1.0.1"
          assert proof["interruption_recovery"]["status"] == "success"
          assert proof["interruption_recovery"]["job_status"] == "rolled_back"
          assert proof["database_rollback"]["database_rollback"] == "passed"
          print("P7_P10_PRIVATE_LIFECYCLE_PROOF=SUCCESS")
          PY

      - name: Uninstall preserves cabinet data
        shell: bash
        run: |
          set -euo pipefail
          DATA="$RUNNER_TEMP/private-uninstall-data"
          APP="$RUNNER_TEMP/private-uninstall-app/DigitalCrown.app"
          mkdir -p "$DATA" "$(dirname "$APP")"
          echo -n "preserve-me" > "$DATA/P7_DATA_SENTINEL.txt"
          MOUNT="$RUNNER_TEMP/private-uninstall-mount"
          mkdir -p "$MOUNT"
          hdiutil attach "$RUNNER_TEMP/private-dmgs/DigitalCrown-1.0.1-arm64.dmg" -mountpoint "$MOUNT" -nobrowse -readonly
          ditto "$MOUNT/DigitalCrown.app" "$APP"
          hdiutil detach "$MOUNT" -force
          rm -rf "$APP"
          test -f "$DATA/P7_DATA_SENTINEL.txt"
          echo "P7_PRIVATE_UNINSTALL_DATA=SUCCESS"

      - name: Upload private macOS proof
        uses: actions/upload-artifact@v4
        with:
          name: digitalcrown-p7-p10-macos-private-lifecycle
          path: |
            ${{ runner.temp }}/private-dmgs/*.dmg
            ${{ runner.temp }}/p10-private-lifecycle-proof.json
            ${{ runner.temp }}/self-test-*.json
          if-no-files-found: error
          retention-days: 7
