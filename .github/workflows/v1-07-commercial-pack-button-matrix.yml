name: V1-07 Commercial Pack Button Matrix

on:
  pull_request:
    branches: [master]
    paths:
      - .github/workflows/v1-07-commercial-pack-button-matrix.yml
      - backend/routers/team.py
      - backend/routers/auth.py
      - backend/routers/superadmin.py
      - backend/services/subscription_policy.py
      - backend/tests/test_commercial_pack_button_matrix.py
      - frontend/src/features/admin/TeamManager.tsx
      - frontend/src/features/admin/TeamManager.buttonMatrix.test.tsx
      - frontend/src/features/superadmin/SuperAdminDashboard.tsx
      - frontend/src/features/superadmin/SuperAdminDashboard.packButtons.test.tsx
      - frontend/src/features/mobile/Dashboard/views/MobileSuperAdminView.tsx
      - frontend/src/features/mobile/Dashboard/views/MobileSuperAdminView.packButtons.test.tsx
      - frontend/src/features/mobile/superadmin/useMobileSuperAdmin.ts
      - frontend/src/features/mobile/superadmin/useMobileSuperAdmin.packActions.test.tsx
  workflow_dispatch:

concurrency:
  group: v1-07-commercial-pack-buttons-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-matrix:
    name: Backend pack/action matrix
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SECRET_KEY: ci-only-secret-key-minimum-32-characters-long
      DATABASE_URL: "sqlite:///:memory:"
      ENVIRONMENT: test
      DIGITALCROWN_ISOLATED_RUNTIME: "true"
      TELEMETRY_ENABLED: "false"
      CLOUD_AI_ENABLED: "false"
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Record exact candidate
        run: |
          echo "candidate=$(git rev-parse HEAD)"
          if [ -n "${{ github.event.pull_request.head.sha }}" ]; then
            test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.10.0 torchvision==0.25.0 torchaudio==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^(torch|torchvision|torchaudio)([<=>].*)?$' requirements.txt > /tmp/requirements-ci.txt
          pip install -r /tmp/requirements-ci.txt
          python -m pip check

      - name: Run commercial pack backend matrix
        run: python -m pytest backend/tests/test_commercial_pack_button_matrix.py -q --maxfail=1

  frontend-buttons:
    name: Frontend real-button matrix
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Record exact candidate
        run: |
          echo "candidate=$(git rev-parse HEAD)"
          if [ -n "${{ github.event.pull_request.head.sha }}" ]; then
            test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Run desktop + mobile real-button matrix
        working-directory: frontend
        run: >-
          npx vitest run
          src/features/admin/TeamManager.buttonMatrix.test.tsx
          src/features/superadmin/SuperAdminDashboard.packButtons.test.tsx
          src/features/mobile/Dashboard/views/MobileSuperAdminView.packButtons.test.tsx
          src/features/mobile/superadmin/useMobileSuperAdmin.packActions.test.tsx
