name: Mobile Quick Action Hub MOB-3 Cert

on:
  push:
    branches: [ux/mobile-quick-action-hub-mob3]
    paths:
      - .github/workflows/mobile-quick-action-hub-mob3-cert.yml
      - frontend/src/features/mobile/**
      - frontend/scripts/capture-mobile-quick-action-hub-after.mjs
      - backend/routers/mobile_patient_cockpit.py
      - backend/tests/test_mobile_patient_cockpit.py
  workflow_dispatch:

concurrency:
  group: mobile-quick-action-hub-mob3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    name: MOB-3 contracts + build + same-viewport AFTER
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SECRET_KEY: ci-only-secret-key-minimum-32-characters-long
      DATABASE_URL: "sqlite:///:memory:"
      ENVIRONMENT: development
      TELEMETRY_ENABLED: "false"
      CLOUD_AI_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4

      - name: Record exact candidate
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          echo "candidate=${{ github.sha }}"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Verify MOB-3 frontend contracts
        working-directory: frontend
        run: >-
          npx vitest run
          src/features/mobile/Dashboard/components/MobileQuickActionHub.test.tsx
          src/features/mobile/mobileThemeHardcoding.test.ts
          src/features/mobile/Dashboard/views/MobilePatientsGate.test.tsx
          src/features/mobile/Dashboard/hooks/useMobileRuntimeTheme.test.ts

      - name: Install targeted backend test dependencies
        run: |
          python -m pip install --upgrade pip
          grep -vE '^(torch|torchvision)([<=>].*)?$' requirements.txt > /tmp/requirements-mob3.txt
          pip install -r /tmp/requirements-mob3.txt
          pip install httpx==0.27.2 pytest pytest-asyncio

      - name: Verify server-authoritative capabilities and Patient Cockpit security
        run: python -m pytest -q backend/tests/test_mobile_patient_cockpit.py

      - name: Verify backend route syntax
        run: python -m py_compile backend/routers/mobile_patient_cockpit.py

      - name: Verify production frontend build
        working-directory: frontend
        run: npm run build

      - name: Install Chromium evidence runner
        working-directory: frontend
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start isolated real-app preview harness
        working-directory: frontend
        env:
          VITE_DC_PREVIEW_DEMO: "1"
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 >/tmp/mob3-vite.log 2>&1 &
          for i in {1..60}; do
            curl -fsS 'http://127.0.0.1:5173/mobile/demo?demo=1&quick=1' >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/mob3-vite.log
          exit 1

      - name: Capture and assert MOB-3 AFTER at immutable BEFORE viewports
        working-directory: frontend
        env:
          MOBILE_EVIDENCE_URL: http://127.0.0.1:5173/mobile/demo?demo=1&quick=1
          MOBILE_EVIDENCE_DIR: ../artifacts/mobile-quick-action-hub-after
        run: node scripts/capture-mobile-quick-action-hub-after.mjs

      - name: Verify PNG dimensions and record evidence
        run: |
          python - <<'PY'
          from pathlib import Path
          import struct

          expected = {
              'after-quick-hub-390x844.png': (390, 844),
              'after-quick-hub-430x932.png': (430, 932),
              'after-quick-hub-768x1024.png': (768, 1024),
          }
          root = Path('artifacts/mobile-quick-action-hub-after')
          for name, dims in expected.items():
              data = (root / name).read_bytes()
              if data[:8] != b'\x89PNG\r\n\x1a\n':
                  raise SystemExit(f'{name}: not a PNG')
              width, height = struct.unpack('>II', data[16:24])
              if (width, height) != dims:
                  raise SystemExit(f'{name}: got {(width, height)}, expected {dims}')
              print(f'{name}: {width}x{height} OK')
          PY
          printf 'head=%s\nbefore_run=33906860335\nbefore_artifact=9949854305\nbefore_digest=sha256:b24cf6ecf919a97be154cfeb45275b54cc3bd2f2f4273fb1ee0f3fa2dee10748\nviewports=390x844,430x932,768x1024\nreal_app_background=true\nlegacy_fab_hidden=true\nserver_capabilities=true\nhorizontal_overflow=none-required\nruntime_errors=none-required\ndeployment=none\n' '${{ github.sha }}' > artifacts/mobile-quick-action-hub-after/result.txt
          cp /tmp/mob3-vite.log artifacts/mobile-quick-action-hub-after/vite.log

      - uses: actions/upload-artifact@v4
        with:
          name: mobile-quick-action-hub-after
          path: artifacts/mobile-quick-action-hub-after
          if-no-files-found: error
          retention-days: 30
