name: Settings R5 QR BEFORE

on:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/settings-r5-qr-before.yml'
      - 'docs/settings/R5_QR_TRUTH_GOAL.md'

permissions:
  contents: read

jobs:
  before:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Source truth BEFORE
        run: |
          set -euo pipefail
          grep -n "id: 'VALIDATION', label: 'Signature'" frontend/src/features/admin/Settings/tabs/branding/StudioControls.tsx
          grep -n "id: 'PAYMENT', label: 'Paiement'" frontend/src/features/admin/Settings/tabs/branding/StudioControls.tsx
          grep -n "Lien / Numéro / Identifiant" frontend/src/features/admin/Settings/tabs/branding/StudioControls.tsx
          grep -nE "verify/|track/" backend/services/base_template.py
          grep -nE "@router.get\(\"/(verify|track)" backend/routers/verification.py
          grep -n "prefix=\"/api/documents\"" backend/main.py

      - name: Install frontend and browser
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Inject R5 QR baseline harness
        working-directory: frontend
        run: |
          cat > settings-r5-before.html <<'EOF'
          <!doctype html><html lang="fr"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><link rel="icon" href="data:,"/><title>R5 QR BEFORE</title></head><body><div id="root"></div><script type="module" src="/src/settings-r5-before.tsx"></script></body></html>
          EOF
          cat > src/settings-r5-before.tsx <<'EOF'
          import React from 'react';
          import { createRoot } from 'react-dom/client';
          import { MemoryRouter } from 'react-router-dom';
          import './index.css';
          import Settings from './pages/Settings';
          import { useAuthStore } from './stores/useAuthStore';
          useAuthStore.setState({ user: ({ id:1,email:'admin@r5.local',nom_complet:'Dr QR',role:'ADMIN',is_superadmin:false,permissions:{} } as any),isAuthenticated:true,isLoading:false,error:null });
          createRoot(document.getElementById('root')!).render(<MemoryRouter initialEntries={['/settings']}><Settings /></MemoryRouter>);
          EOF
          cat > settings-r5-before.mjs <<'EOF'
          import { chromium } from 'playwright';
          import { createServer } from 'vite';
          import fs from 'node:fs/promises';
          const output='settings-r5-before'; await fs.mkdir(output,{recursive:true});
          const profile={
            id:1,public_id:'r5-before',nom_cabinet:'Cabinet QR',nom_praticien:'Dr QR',nom_praticien_ar:'',
            footer_address:'Rabat, Maroc',footer_phones:'05 37 00 00 00',primary_color:'#003380',secondary_color:'#1e40af',accent_color:'#60a5fa',
            selected_theme:'elite',font_fr:'inter',selected_template:'swiss',header_lines_fr:['Dr QR','Chirurgien Dentiste'],header_lines_ar:[],
            specialty_ids:[],contacts_json:{WHATSAPP:{enabled:true,value:'212600000000'}},margin_top:3.6,margin_bottom:3.2,
            watermark_enabled:true,use_letterhead:false,hide_header:false,hide_footer:false,cabinet_type:'PRIVE',
            qr_code_enabled:true,qr_code_type:'VALIDATION',qr_code_value:'',qr_code_label:'Vérifier le document',qr_code_style:'dots',qr_code_color:'#003380'
          };
          const json=body=>({status:200,contentType:'application/json',body:JSON.stringify(body)});
          const server=await createServer({server:{host:'127.0.0.1',port:4191,strictPort:true},clearScreen:false}); await server.listen();
          const browser=await chromium.launch();
          try {
            for (const width of [1440,1024,768,430,390]) {
              const context=await browser.newContext({viewport:{width,height:1200}}); const page=await context.newPage(); const errors=[];
              page.on('pageerror',e=>errors.push(`pageerror: ${e.message}`));
              page.on('console',m=>{if(m.type()==='error') errors.push(`console: ${m.text()}`)});
              await page.route('**/api/**',async route=>{const url=new URL(route.request().url()); if(url.pathname.endsWith('/clinics/me'))return route.fulfill(json(profile)); return route.fulfill(json({}));});
              await page.goto('http://127.0.0.1:4191/settings-r5-before.html',{waitUntil:'networkidle'});
              await page.getByRole('heading',{name:'Paramètres',exact:true}).waitFor({timeout:15000});
              await page.getByRole('button',{name:'Design & Ambiance',exact:true}).click();
              const qrHeading=page.getByText('Code QR',{exact:true}); await qrHeading.waitFor({state:'visible',timeout:15000});
              await page.getByRole('button',{name:'Signature',exact:true}).waitFor();
              await page.getByRole('button',{name:'Paiement',exact:true}).waitFor();
              const qrCard=qrHeading.locator('xpath=ancestor::div[contains(@class,"rounded-2xl")][1]');
              await qrCard.scrollIntoViewIfNeeded(); await page.waitForTimeout(100);
              const layout=await page.evaluate(()=>({clientWidth:document.documentElement.clientWidth,scrollWidth:document.documentElement.scrollWidth}));
              await page.screenshot({path:`${output}/qr-page-${width}x1200.png`,fullPage:true,animations:'disabled'});
              await qrCard.screenshot({path:`${output}/qr-card-${width}x1200.png`,animations:'disabled'});
              await fs.writeFile(`${output}/qr-${width}.layout.json`,JSON.stringify(layout,null,2));
              await fs.writeFile(`${output}/qr-${width}.errors.txt`,errors.join('\n'));
              await context.close();
            }
          } finally {await browser.close();await server.close();}
          EOF

      - name: Capture BEFORE
        working-directory: frontend
        run: node settings-r5-before.mjs

      - name: Verify BEFORE
        working-directory: frontend
        run: |
          test "$(find settings-r5-before -name 'qr-card-*.png' | wc -l)" -eq 5
          test "$(find settings-r5-before -name 'qr-page-*.png' | wc -l)" -eq 5
          if grep -R -n -E 'pageerror:|console:' settings-r5-before/*.errors.txt; then exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: settings-r5-qr-before
          path: frontend/settings-r5-before/
          if-no-files-found: error
          retention-days: 14
