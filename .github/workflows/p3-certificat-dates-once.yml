name: P3 Certificat Dates Once

on:
  push:
    branches: [work-20260815-p3-certificat-dates-clean]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work-20260815-p3-certificat-dates-clean
          fetch-depth: 0
      - name: Apply date model patch
        run: |
          python scripts/p3_certificat_dates_once.py
          python - <<'PY'
          from pathlib import Path
          path = Path('frontend/src/features/admin/DocumentHub.tsx')
          text = path.read_text(encoding='utf-8')
          text = text.replace('certifStartDate, paymentMode, \n    libreTitle, libreContent, docDate, activeTab, \n', 'certifStartDate, paymentMode,\n    libreTitle, libreContent, docDate, activeTab,\n', 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit clean source patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(p3): separate certificate issue and rest dates"
          git push origin HEAD:work-20260815-p3-certificat-dates-clean
