name: Ortho F4 AFTER

on:
  workflow_dispatch:
  pull_request:
    branches:
      - master
    paths:
      - 'frontend/src/features/ortho/OrthoCockpitPanel.tsx'
      - 'frontend/src/features/ortho/orthoCockpit.ts'
      - 'frontend/src/features/patients/PatientDetailsInner.tsx'
      - 'frontend/scripts/capture-ortho-f4-after.mjs'
      - '.github/workflows/ortho-f4-after.yml'

permissions:
  contents: read

jobs:
  visual-after:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install browser dependencies
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save --package-lock=false --legacy-peer-deps playwright@1.55.0 react-is@19.2.0
          npx playwright install --with-deps chromium
      - name: Capture F4 AFTER
        working-directory: frontend
        run: |
          PRODUCT_HEAD="$GITHUB_SHA" node scripts/capture-ortho-f4-after.mjs
      - name: Verify AFTER contract
        working-directory: frontend
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const report = JSON.parse(await readFile('ortho-f4-after-artifacts/report.json','utf8'));
          if (report.phase !== 'AFTER') throw new Error('Wrong phase');
          if (report.invalidCount !== 0) throw new Error('Invalid AFTER captures');
          if (report.blockedExternalRequests.length !== 0) throw new Error('Unexpected external egress');
          if (report.captures.length !== 3) throw new Error('Expected three viewports');
          for (const c of report.captures) {
            if (!c.valid) throw new Error('Invalid '+c.viewport);
            if (c.metrics.horizontalOverflow) throw new Error('Overflow '+c.viewport);
            if (!c.metrics.f4BeforeF3) throw new Error('F4 ordering '+c.viewport);
            if (c.metrics.forbidden.length) throw new Error('Forbidden clinical interpretation '+c.viewport);
          }
          NODE
          for viewport in 390x844 768x1024 1280x900; do
            test -s "ortho-f4-after-artifacts/after-overview-$viewport.png"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ortho-f4-after
          path: frontend/ortho-f4-after-artifacts
          if-no-files-found: error
          retention-days: 30
