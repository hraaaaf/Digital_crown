name: LOT05 05.7C-B Synthetic Patient CSV Read-Only FUE (NO IMPORT)

on:
  pull_request:
    branches: [master]
    paths:
      - 'backend/services/legacy_migration_csv_preview_v15.py'
      - 'backend/services/legacy_sql_inspector_v15.py'
      - 'backend/tests/test_migration_057c_csv_patients_fue.py'
      - '.github/workflows/v15-05-7c-csv-patient-preview-fue.yml'
      - 'docs/quality/V15_05_7A_TRUST_ROOT_PRODUCT_GATE.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-csv-preview:
    name: CSV patient preview — 32 synthetic FUE — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact SHA / isolated source and tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          python -m py_compile backend/services/legacy_migration_csv_preview_v15.py backend/tests/test_migration_057c_csv_patients_fue.py
      - name: 32 synthetic FUE — no clinical imports or patient data
        shell: bash
        run: |
          set -euo pipefail
          python backend/tests/test_migration_057c_csv_patients_fue.py -v 2>&1 | tee lot05-csv-readonly-fue.log
          grep -q 'Ran 32 tests' lot05-csv-readonly-fue.log
          grep -q '^OK' lot05-csv-readonly-fue.log
          echo "LOT05C_CSV_32_SYNTHETIC_READ_ONLY_NO_IMPORT_NO_PHI"
