name: Patient P0-D Endo Urgence Apply

on:
  push:
    branches:
      - agent/patient-page-p0-truth-safety
    paths:
      - .github/workflows/patient-p0d-endo-urgence-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/patient-page-p0-truth-safety
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Apply guarded fail-closed patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib

          endo_path = Path('frontend/src/features/patients/components/wizards/AssistantEndo.tsx')
          endo = endo_path.read_text()
          start = endo.index('  const generateDiagnosis = (finalAnswers: Record<string, number>) => {')
          end = endo.index('\n  if (isCalculating) {', start)
          new_endo_engine = '''  const generateDiagnosis = (finalAnswers: Record<string, number>) => {
            setIsCalculating(true);

            setTimeout(() => {
              const selectedLabel = (questionId: string, value: number | undefined) => {
                const question = QUESTIONS.find((item) => item.id === questionId);
                return question?.options.find((option) => option.value === value)?.label || 'Non renseigné';
              };

              const observations = [
                `Douleur rapportée : ${selectedLabel('douleur', finalAnswers.douleur)}`,
                `Test de sensibilité rapporté : ${selectedLabel('vitalite', finalAnswers.vitalite)}`,
                `Observation radiographique rapportée : ${selectedLabel('radio', finalAnswers.radio)}`,
              ];

              const summary = [
                `Observations recueillies : ${observations.join(' ; ')}.`,
                "Données à confirmer / compléter : anamnèse, examen clinique, tests de sensibilité comparatifs et interprétation de l'imagerie par le praticien.",
                "Ces éléments ne suffisent pas à établir automatiquement un diagnostic pulpaire ou péri-apical.",
                "Diagnostic et conduite thérapeutique : décision du praticien après synthèse des données cliniques.",
              ].join(' ');

              onComplete(summary, []);
            }, 1500);
          };
          '''
          endo = endo[:start] + new_endo_engine + endo[end:]
          old_label = 'Génération du Diagnostic Endodontique...'
          if endo.count(old_label) != 1:
              raise SystemExit(f'Endo calculating label expected once, found {endo.count(old_label)}')
          endo = endo.replace(old_label, 'Synthèse des observations endodontiques...', 1)
          endo_path.write_text(endo)

          exam_path = Path('frontend/src/features/patients/components/wizards/AssistantExamenComplet.tsx')
          exam = exam_path.read_text()
          routine_marker = 'function buildRoutineDiag(ans: Record<string, string>): { diag: string; steps: any[]; next: string | null } {'
          routine_start_before = exam.index(routine_marker)
          routine_before = exam[routine_start_before:]
          routine_hash_before = hashlib.sha256(routine_before.encode()).hexdigest()

          urgency_start = exam.index('function buildUrgenceDiag(ans: Record<string, string>): { diag: string; steps: any[]; next: string | null } {')
          routine_start = exam.index(routine_marker, urgency_start)
          new_urgency_engine = '''function buildUrgenceDiag(ans: Record<string, string>): { diag: string; steps: any[]; next: string | null } {
            const selectedLabel = (questionId: string, value: string | undefined) => {
              const question = URGENCE_STEPS.find((item) => item.id === questionId);
              return question?.options.find((option) => option.value === value)?.label || 'Non renseigné';
            };

            const observations = [
              `Motif urgent rapporté : ${selectedLabel('type_douleur', ans.type_douleur)}`,
              `Localisation rapportée : ${selectedLabel('localisation', ans.localisation)}`,
              `Caractère rapporté : ${selectedLabel('caractere', ans.caractere)}`,
              `Signes généraux rapportés : ${selectedLabel('signes_gen', ans.signes_gen)}`,
            ];

            const vigilance: string[] = [];
            if (ans.signes_gen === 'fievre') {
              vigilance.push('Fièvre ≥ 38°C rapportée : signal de vigilance systémique à évaluer cliniquement sans délai.');
            }
            if (ans.signes_gen === 'trismus') {
              vigilance.push("Trismus rapporté : signal de vigilance nécessitant une évaluation clinique de l'extension et de la gravité.");
            }
            if (ans.signes_gen === 'cellulite') {
              vigilance.push('Adénopathies / cellulite diffuse rapportées : signal de vigilance nécessitant une évaluation clinique immédiate.');
            }

            const summary = [
              `Observations recueillies : ${observations.join(' ; ')}.`,
              vigilance.length ? `Vigilance : ${vigilance.join(' ')}` : 'Vigilance : aucun signe général critique déclaré dans ce questionnaire.',
              "Données à confirmer / compléter : examen extra- et intra-oral, constantes si indiquées, tests cliniques ciblés et examens complémentaires décidés par le praticien.",
              "Ce questionnaire ne pose pas automatiquement de diagnostic et ne détermine pas de traitement.",
              "Diagnostic et conduite thérapeutique : décision du praticien après évaluation clinique complète.",
            ].join(' ');

            return { diag: summary, steps: [], next: null };
          }

          '''
          exam = exam[:urgency_start] + new_urgency_engine + exam[routine_start:]

          old_calc = '<p className="text-xs text-slate-400 font-bold">Génération du diagnostic + plan de traitement</p>'
          new_calc = '''<p className="text-xs text-slate-400 font-bold">
                  {branch === 'urgence' ? 'Synthèse des observations et signaux de vigilance' : 'Génération du diagnostic + plan de traitement'}
                </p>'''
          if exam.count(old_calc) != 1:
              raise SystemExit(f'Exam calculating label expected once, found {exam.count(old_calc)}')
          exam = exam.replace(old_calc, new_calc, 1)

          routine_start_after = exam.index(routine_marker)
          routine_after = exam[routine_start_after:]
          # Only the shared calculating label below the routine function is allowed to differ.
          routine_after_normalized = routine_after.replace(new_calc, old_calc, 1)
          routine_hash_after = hashlib.sha256(routine_after_normalized.encode()).hexdigest()
          if routine_hash_after != routine_hash_before:
              raise SystemExit('Routine branch changed outside the explicitly allowed shared calculating label')

          exam_path.write_text(exam)
          PY

      - name: Verify source safety and diff scope
        run: |
          python - <<'PY'
          from pathlib import Path

          endo = Path('frontend/src/features/patients/components/wizards/AssistantEndo.tsx').read_text()
          exam = Path('frontend/src/features/patients/components/wizards/AssistantExamenComplet.tsx').read_text()
          urgency = exam[exam.index('function buildUrgenceDiag'):exam.index('function buildRoutineDiag')]

          banned_endo = [
            'Pulpite Irréversible', 'Pulpite Réversible', 'Nécrose pulpaire',
            'Traitement Canalaire', 'Extirpation pulpaire', 'coiffage pulpaire',
          ]
          banned_urgency = [
            'Cellulite Cervico-Faciale', 'Pulpite Irréversible', 'Abcès Péri-Apical',
            'Amoxicilline', 'Métronidazole', 'Antibiothérapie', 'AINS',
            'Drainage chirurgical', 'Pulpectomie', 'Radiographie RVG', 'hospitalière',
          ]
          for token in banned_endo:
            assert token not in endo, token
          for token in banned_urgency:
            assert token not in urgency, token
          assert 'onComplete(summary, [])' in endo
          assert 'return { diag: summary, steps: [], next: null }' in urgency
          assert 'Diagnostic et conduite thérapeutique : décision du praticien' in endo
          assert 'Diagnostic et conduite thérapeutique : décision du praticien' in urgency
          PY
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "frontend/src/features/patients/components/wizards/AssistantEndo.tsx frontend/src/features/patients/components/wizards/AssistantExamenComplet.tsx "

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Commit validated patch and remove one-shot workflow
        run: |
          rm .github/workflows/patient-p0d-endo-urgence-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/features/patients/components/wizards/AssistantEndo.tsx frontend/src/features/patients/components/wizards/AssistantExamenComplet.tsx .github/workflows/patient-p0d-endo-urgence-apply.yml
          git commit -m "fix(patient): make Endo and urgency assistants fail closed"
          git push origin HEAD:agent/patient-page-p0-truth-safety
