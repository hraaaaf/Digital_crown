name: Agenda A3 Certification

on:
  pull_request:
    paths:
      - ".github/workflows/agenda-a3-certification.yml"
      - "backend/models_agenda_a3.py"
      - "backend/schemas/agenda.py"
      - "backend/services/agenda_availability.py"
      - "backend/routers/agenda_settings.py"
      - "backend/routers/appointments.py"
      - "backend/tests/test_agenda_a3_*.py"
      - "alembic/versions/a3pa0000003_add_practitioner_agenda_availability.py"
      - "frontend/src/features/agenda/**"
      - "frontend/src/features/admin/Settings/tabs/AgendaTab.tsx"
      - "frontend/src/features/admin/Settings/tabs/PractitionerAvailabilityPanel.tsx"
      - "frontend/src/AgendaClinicA2.test.ts"
      - "frontend/src/AgendaClinicA3.test.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-contract:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-only-secret-key-minimum-32-characters-long
      DATABASE_URL: "sqlite:///:memory:"
      ENVIRONMENT: development
      TELEMETRY_ENABLED: "false"
      CLOUD_AI_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          grep -vE '^(torch|torchvision)([<=>].*)?$' requirements.txt > /tmp/requirements-a3.txt
          pip install -r /tmp/requirements-a3.txt
          pip install pytest
      - name: A3 targeted backend contracts
        run: |
          python -m pytest \
            backend/tests/test_agenda_a3_practitioner_availability.py \
            backend/tests/test_agenda_a3_wall_clock.py \
            -q
      - name: Alembic A3 ancestry contract
        run: |
          python - <<'PY'
          from alembic.config import Config
          from alembic.script import ScriptDirectory

          script = ScriptDirectory.from_config(Config("alembic.ini"))
          heads = script.get_heads()
          assert len(heads) == 1, f"Expected one Alembic head, got {heads}"
          revision = script.get_revision(heads[0])
          lineage = set()
          while revision is not None:
              lineage.add(revision.revision)
              down = revision.down_revision
              if down is None:
                  break
              if not isinstance(down, str):
                  raise AssertionError(f"Unexpected branched Alembic lineage at {revision.revision}: {down}")
              revision = script.get_revision(down)
          assert "a3pa0000003" in lineage, f"A3 missing from migration lineage ending at {heads[0]}"
          print(f"A3 ancestry verified under current head {heads[0]}")
          PY

  after-visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: A2 + A3 frontend contracts
        working-directory: frontend
        run: npx vitest run src/AgendaClinicA2.test.ts src/AgendaClinicA3.test.ts
      - name: Materialize deterministic AFTER harness
        working-directory: frontend
        run: |
          cat > agenda-a3-after-agenda.html <<'EOF'
          <div id="root"></div><script type="module" src="/src/agenda-a3-after-agenda.tsx"></script>
          EOF
          cat > agenda-a3-after-settings.html <<'EOF'
          <div id="root"></div><script type="module" src="/src/agenda-a3-after-settings.tsx"></script>
          EOF
          cat > src/agenda-a3-after-agenda.tsx <<'EOF'
          import React from 'react';
          import { createRoot } from 'react-dom/client';
          import { MemoryRouter } from 'react-router-dom';
          import './index.css';
          import { AgendaPage } from './pages/AgendaPage';
          import { useAuthStore } from './stores/useAuthStore';
          useAuthStore.setState({user:{id:1,email:'a3@test.local',nom_complet:'Dr Lina Alaoui',role:'ADMIN',is_superadmin:false,permissions:{}} as any,isAuthenticated:true,isLoading:false,error:null});
          createRoot(document.getElementById('root')!).render(<MemoryRouter initialEntries={['/agenda']}><div className="min-h-screen min-w-0 overflow-x-hidden bg-slate-50 p-3 sm:p-4 lg:p-6"><AgendaPage /></div></MemoryRouter>);
          EOF
          cat > src/agenda-a3-after-settings.tsx <<'EOF'
          import React from 'react';
          import { createRoot } from 'react-dom/client';
          import './index.css';
          import { AgendaTab } from './features/admin/Settings/tabs/AgendaTab';
          createRoot(document.getElementById('root')!).render(<div className="min-h-screen min-w-0 overflow-x-hidden bg-slate-50 p-3 sm:p-4 lg:p-6"><AgendaTab /></div>);
          EOF
          cat > agenda-a3-after.mjs <<'EOF'
          import { chromium } from 'playwright';
          import { createServer } from 'vite';
          import fs from 'node:fs/promises';
          const out='agenda-a3-after'; await fs.mkdir(out,{recursive:true});
          const json=(body,status=200)=>({status,contentType:'application/json',body:JSON.stringify(body)});
          const mk=(id,name,pid,start,duration,motif,status='PRÉVU')=>({id,patient_name:name,patient_id:id+1000,praticien_id:pid,datetime_start:start,duration_minutes:duration,motif,status,scheduling_type:'EXACT_TIME',reminder_sent:false});
          const lina=[mk(201,'Sara El Amrani',1,'2026-09-16T09:00:00',30,'Consultation'),mk(202,'Adam Tazi',1,'2026-09-16T11:00:00',45,'Endodontie','CONFIRMÉ')];
          const youssef=[mk(211,'Yasmine Fassi',2,'2026-09-16T09:00:00',60,'Prothèse','CONFIRMÉ'),mk(212,'Omar Bennani',2,'2026-09-16T14:30:00',30,'Consultation')];
          const salma=[mk(221,'Aya Alaoui',3,'2026-09-16T10:30:00',30,'Contrôle')];
          const legacy=[mk(299,'Legacy non assigné',null,'2026-09-16T12:00:00',30,'RDV historique')];
          const inheritance={date:'2026-09-16',inherits_cabinet:true,config_error:false,intervals:[],exceptions:[]};
          const custom={date:'2026-09-16',inherits_cabinet:false,config_error:false,intervals:[{start:'09:00',end:'12:00'},{start:'14:00',end:'17:00'}],exceptions:[{id:77,start_date:'2026-09-16T16:00:00',end_date:'2026-09-16T17:00:00',reason:'Congé'}]};
          const dayOff={date:'2026-09-16',inherits_cabinet:false,config_error:false,intervals:[],exceptions:[]};
          const multi={plan:'ELITE',dentists:[{dentist_id:1,dentist_name:'Dr Lina Alaoui',appointments:lina,availability:inheritance},{dentist_id:2,dentist_name:'Dr Youssef Benali',appointments:youssef,availability:custom},{dentist_id:3,dentist_name:'Dr Salma Idrissi',appointments:salma,availability:dayOff}],legacy_unassigned:legacy,total_appointments:6};
          const all=[...lina,...youssef,...salma,...legacy];
          const week=Object.fromEntries(['monday','tuesday','wednesday','thursday','friday','saturday','sunday'].map(day=>[day,{is_open:true,is_continuous:false,morning_start:'09:00',morning_end:'13:00',afternoon_start:'14:00',afternoon_end:'18:00'}]));
          const settings={id:1,opening_time_morning:'09:00',closing_time_morning:'13:00',opening_time_afternoon:'14:00',closing_time_afternoon:'18:00',is_continuous:false,agenda_mode:'EXACT',use_tickets:false,weekly_schedule:week};
          const practitioners=[{practitioner_id:1,practitioner_name:'Dr Lina Alaoui',inherits_cabinet:true},{practitioner_id:2,practitioner_name:'Dr Youssef Benali',inherits_cabinet:false},{practitioner_id:3,practitioner_name:'Dr Salma Idrissi',inherits_cabinet:false}];
          const practitionerSettings={practitioner_id:1,practitioner_name:'Dr Lina Alaoui',inherits_cabinet:true,weekly_schedule:null,updated_at:null};
          const server=await createServer({server:{host:'127.0.0.1',port:4204,strictPort:true},clearScreen:false}); await server.listen();
          const browser=await chromium.launch(); const report=[];
          try {
            for(const [width,height] of [[390,844],[768,1024],[1280,900]]){
              const context=await browser.newContext({viewport:{width,height},locale:'fr-FR',timezoneId:'Africa/Casablanca'}); const page=await context.newPage();
              await page.clock.setFixedTime(new Date('2026-09-16T10:00:00+01:00')); const errors=[];
              page.on('pageerror',e=>errors.push(`pageerror: ${e.message}`)); page.on('console',m=>{if(m.type()==='error')errors.push(`console: ${m.text()}`)});
              await page.route('**/api/**',async route=>{const req=route.request(),u=new URL(req.url());
                if(u.pathname==='/api/appointments/multi-practitioner') return route.fulfill(json(multi));
                if(u.pathname==='/api/appointments/check-conflicts') return route.fulfill(json({has_conflict:false,conflicts:[]}));
                if(u.pathname==='/api/appointments/'||u.pathname.startsWith('/api/appointments?')) return route.fulfill(json(all));
                if(u.pathname==='/api/appointments/pending'||u.pathname==='/api/patients/'||u.pathname==='/api/upcoming-holidays'||u.pathname==='/api/catalog/specialties'||u.pathname==='/api/actes/catalog/search') return route.fulfill(json([]));
                if(u.pathname==='/api/agenda/settings') return route.fulfill(json(settings));
                if(u.pathname==='/api/agenda/exceptions') return route.fulfill(json([]));
                if(u.pathname==='/api/agenda/practitioners') return route.fulfill(json(practitioners));
                if(u.pathname==='/api/agenda/practitioners/1/settings') return route.fulfill(json(practitionerSettings));
                if(u.pathname==='/api/agenda/practitioners/1/exceptions') return route.fulfill(json([]));
                return route.fulfill(json(req.method()==='GET'?[]:{}));
              });
              await page.goto('http://127.0.0.1:4204/agenda-a3-after-agenda.html',{waitUntil:'networkidle'}); await page.getByRole('heading',{name:'Agenda'}).waitFor(); await page.getByRole('button',{name:'Multi',exact:true}).click(); await page.getByText('Heure',{exact:true}).waitFor(); await page.getByText('Non assigné · 12:00').waitFor();
              await page.getByLabel('Créer un rendez-vous avec Dr Youssef Benali à 10:00').waitFor();
              await page.getByLabel('Dr Youssef Benali indisponible à 12:15 : Pause du praticien').waitFor();
              await page.getByLabel('Dr Youssef Benali indisponible à 16:15 : Absence : Congé').waitFor();
              await page.getByLabel('Dr Salma Idrissi indisponible à 10:00 : Praticien absent ce jour').waitFor();
              await page.getByLabel('Dr Lina Alaoui indisponible à 13:15 : Cabinet fermé ou hors horaires du cabinet').waitFor();
              const sara=await page.getByText('09:00 · Sara El Amrani',{exact:true}).locator('..').boundingBox(); const yasmine=await page.getByText('09:00 · Yasmine Fassi',{exact:true}).locator('..').boundingBox(); const syncDelta=sara&&yasmine?Math.abs(sara.y-yasmine.y):null;
              const agendaLayout=await page.evaluate(()=>({clientWidth:document.documentElement.clientWidth,scrollWidth:document.documentElement.scrollWidth})); const internal=await page.getByTestId('multi-practitioner-scroll').evaluate(el=>({clientWidth:el.clientWidth,scrollWidth:el.scrollWidth}));
              if(syncDelta===null||syncDelta>2) throw new Error(`AFTER lane sync mismatch ${width}: ${syncDelta}`); if(agendaLayout.scrollWidth>agendaLayout.clientWidth) throw new Error(`AFTER agenda page overflow ${width}`); if(width===390&&internal.scrollWidth<=internal.clientWidth) throw new Error('AFTER mobile internal scroll missing'); if(errors.length) throw new Error(errors.join(' | '));
              await page.screenshot({path:`${out}/agenda-${width}x${height}.png`,fullPage:true,animations:'disabled'});
              errors.length=0; await page.goto('http://127.0.0.1:4204/agenda-a3-after-settings.html',{waitUntil:'networkidle'}); await page.getByRole('heading',{name:'Horaires & Agenda'}).waitFor(); await page.getByText('Disponibilités par praticien',{exact:true}).waitFor(); await page.getByText('Hérite du cabinet',{exact:true}).waitFor(); const settingsLayout=await page.evaluate(()=>({clientWidth:document.documentElement.clientWidth,scrollWidth:document.documentElement.scrollWidth})); if(settingsLayout.scrollWidth>settingsLayout.clientWidth) throw new Error(`AFTER settings overflow ${width}`); if(errors.length) throw new Error(errors.join(' | ')); await page.screenshot({path:`${out}/settings-${width}x${height}.png`,fullPage:true,animations:'disabled'});
              const row={width,height,syncDelta,agendaLayout,internal,settingsLayout}; report.push(row); await fs.writeFile(`${out}/${width}x${height}.json`,JSON.stringify(row,null,2)); await context.close();
            }
            await fs.writeFile(`${out}/report.json`,JSON.stringify(report,null,2));
            await fs.writeFile(`${out}/visual-score.json`,JSON.stringify({score:100,max:100,criteria:{lane_sync:20,agenda_no_page_overflow:20,settings_no_page_overflow:20,mobile_internal_scroll:15,availability_states:15,settings_inheritance_ui:10}},null,2));
          } finally {await browser.close();await server.close();}
          EOF
      - name: Verify AFTER at identical viewports
        working-directory: frontend
        run: node agenda-a3-after.mjs
      - name: Evidence manifest
        working-directory: frontend
        run: |
          test "$(find agenda-a3-after -name '*.png' | wc -l)" -eq 6
          grep -q '"score": 100' agenda-a3-after/visual-score.json
          printf '%s\n' \
            "phase=AFTER_A3" \
            "head_sha=${{ github.event.pull_request.head.sha || github.sha }}" \
            "before_run=35106951485" \
            "before_head=01eab652ce5960137a582c79265e82ab964a7335" \
            "fixed_clock=2026-09-16T10:00:00+01:00" \
            "viewports=390x844,768x1024,1280x900" \
            "visual_score=100/100 automated criteria" > agenda-a3-after/metadata.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agenda-a3-after-visual-evidence
          path: frontend/agenda-a3-after/
          if-no-files-found: error
          retention-days: 14
