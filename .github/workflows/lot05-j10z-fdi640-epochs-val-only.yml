name: LOT05 J10Z FDI640 Training Duration Validation-Only

on:
  push:
    branches:
      - exp/lot05-j10o-public-panoramic-datasets-research-smoke-20261022
    paths:
      - .github/workflows/lot05-j10z-fdi640-epochs-val-only.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  academic-640-validation:
    name: 640px 96 train x6, checkpoints 3+6, 33 val only
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run deterministic offline signed-delta tests
        run: python experiments/test_lot05_j10z_fdi640_epoch_ablation.py -v
      - name: Install pinned CPU dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'pillow==11.3.0'
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu \
            'torch==2.5.1' 'torchvision==0.20.1'
          python -c 'import torch; assert not torch.cuda.is_available(); print("CPU_ONLY_READY")'
      - name: Acquire exact academic dataset into temporary research runner
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --depth=1 --no-checkout \
            https://github.com/melihoz/AKUDENTAL.git third_party/AKUDENTAL
          git -C third_party/AKUDENTAL sparse-checkout set --no-cone \
            '/AKUDENTAL/folds/fold_0/labels/' '/AKUDENTAL/images/'
          git -C third_party/AKUDENTAL checkout --detach \
            92e2cc3ae5eebc9de509311a3edefb7106fca7dd
          test "$(git -C third_party/AKUDENTAL rev-parse HEAD)" = \
            92e2cc3ae5eebc9de509311a3edefb7106fca7dd
      - name: Validate source labels and stage transient private workspace
        shell: bash
        run: |
          python experiments/lot05_j10r_akudental_private_research_workspace.py \
            --source-repo third_party/AKUDENTAL \
            --fold fold_0 \
            --workspace "$RUNNER_TEMP/j10z-private"
      - name: Compare epochs 3 and 6 on validation only, FDI32 and key teeth
        shell: bash
        run: |
          python experiments/lot05_j10z_fdi640_epoch_ablation.py \
            --workspace "$RUNNER_TEMP/j10z-private"
      - name: Delete temporary licensed images, labels and weights even on failure
        if: always()
        shell: bash
        run: |
          rm -rf third_party/AKUDENTAL "$RUNNER_TEMP/j10z-private" \
            "$HOME/.cache/torch/hub/checkpoints"
          echo "J10Z_EPHEMERAL_IMAGES_LABELS_AND_WEIGHTS_REMOVED"
