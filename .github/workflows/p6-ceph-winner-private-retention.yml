name: P6 Ceph Winner Binary Bridge

on:
  push:
    branches:
      - portability/p6-scientific-assets-refresh
    paths:
      - .github/workflows/p6-ceph-winner-private-retention.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p6-ceph-winner-binary-bridge
  cancel-in-progress: false

jobs:
  export-exact-winner:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      WINNER_COMMIT: 1da113b8776aa2b57e42ac194f12b7a48b01558c
      WINNER_RUN: "32876308676"
      MODEL_SHA256: 809f1d3d2347d2a34f57d4a3415bb319c29f8a25c325d41160e5f28d4e5dadad
      MODEL_SIZE: "7624307"
    steps:
      - name: Checkout exact public winner commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ env.WINNER_COMMIT }}
          path: winner

      - name: Verify exact winner before bridge
        shell: bash
        run: |
          set -euo pipefail
          model="winner/p6-ephemeral-output/model.onnx"
          report="winner/p6-ephemeral-output/training_report.json"
          manifest="winner/p6-ephemeral-output/aariz_v1_ingestion_manifest.json"
          test -f "$model" && test -f "$report" && test -f "$manifest"
          test "$(stat -c '%s' "$model")" = "$MODEL_SIZE"
          echo "$MODEL_SHA256  $model" | sha256sum -c -
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads(Path("winner/p6-ephemeral-output/training_report.json").read_text(encoding="utf-8"))
          assert report["artifacts"]["onnx"]["sha256"] == os.environ["MODEL_SHA256"]
          assert report["artifacts"]["onnx"]["size_bytes"] == int(os.environ["MODEL_SIZE"])
          assert report["result"] == "PASS"
          assert report["clinical_claim"] is False
          assert report["selection"]["best_epoch"] == 24
          assert report["selection"]["test_loaded_once"] is True
          PY
          echo "P6_WINNER_BRIDGE_SOURCE=OK"

      - name: Prepare verified bridge payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bridge
          cp winner/p6-ephemeral-output/model.onnx bridge/model.onnx
          cp winner/p6-ephemeral-output/training_report.json bridge/training_report.json
          cp winner/p6-ephemeral-output/aariz_v1_ingestion_manifest.json bridge/aariz_v1_ingestion_manifest.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          payload = {
              "status": "VERIFIED_PUBLIC_TO_PRIVATE_BRIDGE",
              "source_commit": os.environ["WINNER_COMMIT"],
              "source_run": os.environ["WINNER_RUN"],
              "model_sha256": os.environ["MODEL_SHA256"],
              "model_size_bytes": int(os.environ["MODEL_SIZE"]),
              "clinical_claim": False,
          }
          Path("bridge/BRIDGE.json").write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          PY
          echo "$MODEL_SHA256  bridge/model.onnx" | sha256sum -c -

      - name: Upload exact verified bridge artifact
        uses: actions/upload-artifact@v4
        with:
          name: p6-ceph-winner-binary-bridge
          path: bridge
          if-no-files-found: error
          retention-days: 1
