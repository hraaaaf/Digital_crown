name: V1.5 FUE-G00 Integrated First Use T2 Lab

on:
  pull_request:
    branches: [master]
    paths:
      - "frontend/src/features/hub/**"
      - "frontend/src/App.tsx"
      - "frontend/src/services/workstationMode.ts"
      - "backend/routers/workstation_mode.py"
      - "frontend/scripts/audit-v15-fue-g00-fresh-enrollment-t2.mjs"
      - "frontend/scripts/audit-v15-fue-g00-first-ever-t2.mjs"
      - "frontend/src/services/apiBase.ts"
      - "backend/core/cabinet_topology.py"
      - "backend/routers/mobile_legacy.py"
      - "backend/routers/mobile_push.py"
      - "backend/tests/test_mobile_m6d2_push.py"
      - "backend/main.py"
      - "frontend/scripts/audit-v15-fue-g00-integrated-t2.mjs"
      - "frontend/scripts/t2-workstation-session.mjs"
      - ".github/workflows/v15-fue-g00-integrated-t2.yml"
      - "docs/audits/V1_5_FUE_G00_INTEGRATED_FIRST_USER_LAB.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fue-v15-g00-integrated:
    name: FUE-G00 Hub / Control / Station PIN
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ENVIRONMENT: test
      SECRET_KEY: fue-v15-01-secret-key-long-enough-000001
      DATABASE_URL: sqlite:///./t2-runtime-cert.db
      DIGITALCROWN_ISOLATED_RUNTIME: "1"
      DIGITALCROWN_ISOLATION_DB_FINGERPRINT: "c04779c8d18b3ac12a0f4093a47a5d0c3c0e2251714be532893cfa052e9ee780"
      TELEMETRY_ENABLED: "false"
      CLOUD_AI_ENABLED: "false"
      DEBUG: "false"
      ALLOWED_ORIGINS: "http://127.0.0.1:5173,http://localhost:5173"
      T2_USER: t2-browser@cabinet.ma
      PRODUCT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      EVALUATED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PRODUCT_HEAD }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Generate isolated credential
        shell: bash
        run: |
          credential="$(python -c 'import secrets; print(secrets.token_urlsafe(24))')"
          echo "::add-mask::$credential"
          echo "T2_PASSWORD=$credential" >> "$GITHUB_ENV"

      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          grep -vE '^(torch|torchvision|torchaudio)([<=>].*)?$' requirements.txt >/tmp/requirements-fue-g00.txt
          pip install torch==2.10.0 torchvision==0.25.0 torchaudio==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r /tmp/requirements-fue-g00.txt
          python -m pip check

      - name: Topology contract regression
        run: python -m pytest tests/test_cabinet_topology.py backend/tests/test_v1_5_01_topology_contract.py backend/tests/test_mobile_m6d2_push.py::test_mobile_push_does_not_override_canonical_network_authority -q

      - name: Install frontend and Chromium
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save playwright@1.55.0
          npx playwright install chromium

      - name: Frontend topology contract
        working-directory: frontend
        run: npm test -- --run src/test/v15HubRoutingContract.test.ts

      - name: Start isolated backend
        run: |
          rm -f t2-runtime-cert.db
          python scripts/t2_runtime_server.py >/tmp/fue-g00-backend.log 2>&1 &
          for i in {1..60}; do
            curl -fsS http://127.0.0.1:8005/health >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/fue-g00-backend.log
          exit 1

      - name: Start frontend
        working-directory: frontend
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 >/tmp/fue-g00-frontend.log 2>&1 &
          for i in {1..60}; do
            curl -fsS http://127.0.0.1:5173 >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/fue-g00-frontend.log
          exit 1

      - name: Assert fresh isolated T2 workstation registry empty
        # t2_runtime_server.py deliberately overrides SECRET_KEY for its
        # disposable SQLCipher database. The runner's generic test SECRET_KEY
        # cannot decrypt that file. Align only this read-only verifier.
        env:
          SECRET_KEY: t2-runtime-certification-secret-key-000001
        run: |
          python - <<'PY'
          from backend import database, models
          with database.SessionLocal() as session:
              count = session.query(models.WorkstationMode).count()
          print(f'Isolated T2 initial workstation rows: {count}')
          assert count == 0, 'T2 precondition: first ever tenant must have zero stations'
          PY

      - name: Syntax check first-ever workstation harness
        run: node --check frontend/scripts/audit-v15-fue-g00-first-ever-t2.mjs

      - name: Run first-ever workstation via real UI
        working-directory: frontend
        run: node scripts/audit-v15-fue-g00-first-ever-t2.mjs

      - name: Syntax check integrated FUE-G00 harness
        run: node --check frontend/scripts/audit-v15-fue-g00-integrated-t2.mjs

      - name: Run integrated FUE-G00 T2 browser
        working-directory: frontend
        run: node scripts/audit-v15-fue-g00-integrated-t2.mjs

      - name: Syntax check fresh browser owner enrollment
        run: node --check frontend/scripts/audit-v15-fue-g00-fresh-enrollment-t2.mjs

      - name: Run unregistered browser enrollment through owner UI
        working-directory: frontend
        run: node scripts/audit-v15-fue-g00-fresh-enrollment-t2.mjs

      - name: Dump logs on failure
        if: failure()
        run: |
          echo "===== BACKEND ====="
          cat /tmp/fue-g00-backend.log || true
          echo "===== FRONTEND ====="
          cat /tmp/fue-g00-frontend.log || true

      - name: Upload FUE evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fue-v15-g00-integrated-t2-evidence
          path: |
            artifacts/v15-fue-g00-first-ever
            artifacts/v15-fue-g00-integrated
            artifacts/v15-fue-g00-fresh
          if-no-files-found: error
          retention-days: 14
