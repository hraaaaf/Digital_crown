name: Mobile M6-G0 Glass Prepare

on:
  push:
    branches:
      - "audit/mobile-m6-g0-glass-before-20260825"
    paths:
      - ".github/workflows/mobile-m6-g0-glass-prepare.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    name: Build then create single glass product commit
    runs-on: ubuntu-latest
    env:
      BASE_HEAD: 13b79f572b6a62f6c743f75f4d93b841454d3417
      PRODUCT_BRANCH: mobile/m6-g0-glass-system
    steps:
      - name: Checkout frozen audit inputs
        uses: actions/checkout@v4
        with:
          path: audit

      - name: Checkout exact master baseline
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE_HEAD }}
          path: product
          fetch-depth: 0

      - name: Assert frozen baseline
        run: test "$(git -C product rev-parse HEAD)" = "$BASE_HEAD"

      - name: Materialize glass patch
        working-directory: product
        run: python ../audit/.audit/mobile-m6-g0-apply.py

      - name: Assert exact product scope
        working-directory: product
        run: |
          git diff --check
          python - <<'PY'
          import subprocess
          expected = {
              'frontend/src/main.tsx',
              'frontend/src/styles/mobileGlassSystem.css',
              'frontend/src/features/mobile/Dashboard/MobileDashboard.tsx',
              'frontend/src/features/mobile/Onboarding/OnboardingScanner.tsx',
          }
          tracked = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          untracked = set(subprocess.check_output(['git', 'ls-files', '--others', '--exclude-standard'], text=True).splitlines())
          paths = tracked | untracked
          if paths != expected:
              raise SystemExit(f'Unexpected M6-G0 scope: {sorted(paths ^ expected)}')
          print('M6-G0 scope PASS')
          PY
          test "$(grep -c 'data-dc-mobile-shell className=\"min-h-screen' frontend/src/features/mobile/Onboarding/OnboardingScanner.tsx)" = "7"
          grep -q 'data-dc-mobile-shell className="min-h-\[100dvh\]' frontend/src/features/mobile/Dashboard/MobileDashboard.tsx
          grep -q "import './styles/mobileGlassSystem.css'" frontend/src/main.tsx
          grep -q 'prefers-reduced-transparency' frontend/src/styles/mobileGlassSystem.css
          grep -q "data-theme='high-contrast'" frontend/src/styles/mobileGlassSystem.css
          ! grep -q 'bg-primary\\/' frontend/src/styles/mobileGlassSystem.css
          ! grep -q 'background-attachment' frontend/src/styles/mobileGlassSystem.css

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: product/frontend/package-lock.json

      - name: Install frontend
        working-directory: product/frontend
        run: npm ci

      - name: Build frontend
        working-directory: product/frontend
        run: npm run build

      - name: Create the single product commit
        working-directory: product
        run: |
          git config user.name "hraaaaf"
          git config user.email "123034021+hraaaaf@users.noreply.github.com"
          git switch -c "$PRODUCT_BRANCH"
          git add frontend/src/main.tsx \
                  frontend/src/styles/mobileGlassSystem.css \
                  frontend/src/features/mobile/Dashboard/MobileDashboard.tsx \
                  frontend/src/features/mobile/Onboarding/OnboardingScanner.tsx
          git commit -m "feat(mobile): apply premium glass system"
          test "$(git rev-list --count "$BASE_HEAD"..HEAD)" = "1"
          git push --force-with-lease origin "$PRODUCT_BRANCH"
          echo "PRODUCT_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Record proof
        run: |
          echo "base=$BASE_HEAD"
          echo "product_branch=$PRODUCT_BRANCH"
          echo "product_head=$PRODUCT_HEAD"
