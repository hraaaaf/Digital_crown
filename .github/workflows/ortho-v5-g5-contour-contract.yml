name: ORTHO V5 G5 — Manual anatomical contour contract (no clinical promotion)
on:
  pull_request:
    paths:
      - 'docs/audits/ODF_V5_G5_CONTOURS_ANATOMIQUES_DOD_2026-10-24.md'
      - 'backend/services/ortho_anatomical_trace.py'
      - 'backend/services/ortho_anatomical_trace_store.py'
      - 'backend/services/ortho_lab_image_integrity.py'
      - 'backend/services/document_factory.py'
      - 'backend/models.py'
      - 'backend/routers/patients.py'
      - 'backend/schemas/ortho_anatomical_trace.py'
      - 'backend/templates/bilan_ortho_v5.html'
      - 'backend/services/generators/bilan_ortho_gen.py'
      - 'alembic/versions/neo000000034_ortho_anatomical_trace.py'
      - 'frontend/src/features/ortho/components/OrthoAnatomicalTraceLabEditor.tsx'
      - 'frontend/src/features/ortho/utils/g5BezierGeometry.ts'
      - 'frontend/src/features/ortho/utils/g5BezierGeometry.test.ts'
      - 'frontend/src/features/ortho/components/Step3Clinical.tsx'
      - 'frontend/src/features/ortho/cephaloRepository.ts'
      - 'tests/test_odf_v5_g5_contours.py'
      - '.github/workflows/ortho-v5-g5-contour-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  g5-manual-contour-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Exact-head invariant
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test authenticated-approval geometry contract without clinical images
        run: |
          python -m pip install 'pillow==11.3.0' 'sqlalchemy>=2.0,<3.0'
          python -m compileall -q backend/services/ortho_anatomical_trace.py backend/services/ortho_anatomical_trace_store.py backend/services/ortho_lab_image_integrity.py backend/services/document_factory.py backend/models.py backend/schemas/ortho_anatomical_trace.py backend/routers/patients.py alembic/versions/neo000000034_ortho_anatomical_trace.py
          python -m unittest discover -s tests -p 'test_odf_v5_g5_contours.py' -v
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Validate TypeScript manual contour editor + notes unaffected
        working-directory: frontend
        run: |
          npm ci
          npx tsc --noEmit -p tsconfig.app.json
          npx vitest run src/features/ortho/utils/g5BezierGeometry.test.ts
      - name: G5 acceptance semantics
        run: |
          grep -q "ODF_G5_REQUIRE_CONTOURS" backend/services/document_factory.py
          grep -q "CLINICIAN_MANUAL" backend/services/ortho_anatomical_trace.py
          grep -q "VITE_ODF_G5_LAB" frontend/src/features/ortho/components/Step3Clinical.tsx
          test -f docs/audits/ODF_V5_G5_CONTOURS_ANATOMIQUES_DOD_2026-10-24.md
          echo "ODF_G5_LAB_CONTRACT_PASS_NO_ANATOMICAL_CASE_CERTIFICATION"
