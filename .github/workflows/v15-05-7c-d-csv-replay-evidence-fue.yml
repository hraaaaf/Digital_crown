name: LOT05 05.7C-D Synthetic CSV Replay Evidence FUE (NO IMPORT)

on:
  pull_request:
    branches: [master]
    paths:
      - 'backend/services/legacy_migration_csv_evidence_lab_v15.py'
      - 'backend/services/legacy_migration_csv_mapping_lab_v15.py'
      - 'backend/services/legacy_migration_csv_preview_v15.py'
      - 'backend/services/legacy_sql_inspector_v15.py'
      - 'backend/services/legacy_sql_mapping_v15.py'
      - 'backend/tests/test_migration_057c_csv_evidence_replay_fue.py'
      - '.github/workflows/v15-05-7c-d-csv-replay-evidence-fue.yml'
      - 'docs/quality/V15_05_7A_TRUST_ROOT_PRODUCT_GATE.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-evidence:
    name: FAKE CSV source-to-mapping evidence replay 36 FUE — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact HEAD and standalone compile
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          python -m py_compile backend/services/legacy_sql_inspector_v15.py backend/services/legacy_sql_mapping_v15.py backend/services/legacy_migration_csv_preview_v15.py backend/services/legacy_migration_csv_mapping_lab_v15.py backend/services/legacy_migration_csv_evidence_lab_v15.py backend/tests/test_migration_057c_csv_evidence_replay_fue.py
      - name: Execute 36 FAKE-only replay tests with failure-closed claims
        shell: bash
        run: |
          set -euo pipefail
          python backend/tests/test_migration_057c_csv_evidence_replay_fue.py -v 2>&1 | tee lot05-7c-d-evidence-fue.log
          grep -q 'Ran 36 tests' lot05-7c-d-evidence-fue.log
          grep -q '^OK' lot05-7c-d-evidence-fue.log
          echo 'LOT05_7C_D_36_FAKE_ONLY_REPLAY_EVIDENCE_NO_VENDOR_CERT_NO_CLINICAL_IMPORT'
