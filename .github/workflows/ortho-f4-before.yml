name: Ortho F4 BEFORE

on:
  workflow_dispatch:
  pull_request:
    branches:
      - master
    paths:
      - 'frontend/scripts/capture-ortho-f4-before.mjs'
      - '.github/workflows/ortho-f4-before.yml'
      - 'docs/clinic/audits/V1_05_F4_ORTHO_COCKPIT_DATA_CONTRACT_GOAL.md'
      - 'docs/clinic/audits/V1_05_F4_ORTHO_COCKPIT_MOCKUP.md'

permissions:
  contents: read

env:
  F4_BASE_SHA: 413af20093367e43bc3c59efbaa1ad156b668ef4

jobs:
  visual-before:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Prepare exact merged F3 baseline
        run: |
          git worktree add /tmp/dc-f4-before "$F4_BASE_SHA"
          test "$(git -C /tmp/dc-f4-before rev-parse HEAD)" = "$F4_BASE_SHA"
      - name: Install browser dependencies
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save --package-lock=false --legacy-peer-deps playwright@1.55.0 react-is@19.2.0
          npx playwright install --with-deps chromium
      - name: Install exact baseline frontend
        run: |
          cd /tmp/dc-f4-before/frontend
          npm ci
          npm install --no-save --package-lock=false --legacy-peer-deps react-is@19.2.0
      - name: Capture exact F4 BEFORE
        run: |
          cd /tmp/dc-f4-before/frontend
          set +e
          PRODUCT_HEAD="$F4_BASE_SHA" node "$GITHUB_WORKSPACE/frontend/scripts/capture-ortho-f4-before.mjs"
          capture_status=$?
          set -e
          rm -rf "$GITHUB_WORKSPACE/frontend/ortho-f4-before-artifacts"
          cp -R ortho-f4-before-artifacts "$GITHUB_WORKSPACE/frontend/"
          exit "$capture_status"
      - name: Verify BEFORE contract
        working-directory: frontend
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const report = JSON.parse(await readFile('ortho-f4-before-artifacts/report.json','utf8'));
          if (report.productHead !== process.env.F4_BASE_SHA) throw new Error('Wrong baseline SHA');
          if (report.phase !== 'BEFORE') throw new Error('Wrong phase');
          if (report.invalidCount !== 0) throw new Error('Invalid visual captures');
          if (report.blockedExternalRequests.length !== 0) throw new Error('Unexpected external egress');
          if (report.captures.length !== 3) throw new Error('Expected three viewports');
          for (const c of report.captures) {
            if (!c.valid) throw new Error('Invalid '+c.viewport);
            if (c.metrics.horizontalOverflow) throw new Error('Overflow '+c.viewport);
            if (!c.metrics.hasF3 || !c.metrics.hasJourney || c.metrics.hasF4) throw new Error('Wrong F4 baseline '+c.viewport);
          }
          NODE
          for viewport in 390x844 768x1024 1280x900; do
            test -s "ortho-f4-before-artifacts/before-overview-$viewport.png"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ortho-f4-before-exact-f3
          path: frontend/ortho-f4-before-artifacts
          if-no-files-found: error
          retention-days: 30
