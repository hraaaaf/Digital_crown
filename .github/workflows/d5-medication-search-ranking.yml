name: D5 Medication Search Ranking
# Exact-head D5 convergence gate — final same-head proof

on:
  push:
    branches:
      - feat/neo-medication-search-intelligence
    paths:
      - 'backend/services/medication_dict.py'
      - 'backend/tests/test_medication_search_ranking_d5.py'
      - '.github/workflows/d5-medication-search-ranking.yml'
  workflow_dispatch:

jobs:
  ranking:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install targeted backend dependencies
        run: python -m pip install --disable-pip-version-check -r backend/requirements.txt
      - name: Run D5 lexical ranking tests
        run: pytest -q backend/tests/test_medication_search_ranking_d5.py
      - name: Observe national golden queries
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          module = Path("backend/services/medication_dict.py").resolve()
          spec = importlib.util.spec_from_file_location("medication_dict_d5", module)
          medication_dict = importlib.util.module_from_spec(spec)
          assert spec and spec.loader
          spec.loader.exec_module(medication_dict)
          for q in ("DOL", "DOLIPRANE", "AMOX", "IBUPROFENE"):
              results = medication_dict.search_unified(q, limit=10)
              print(q, [r["nom"] for r in results[:10]])
          dol = medication_dict.search_unified("DOL", limit=100)
          assert dol and all(r["nom"].upper().startswith("DOL") for r in dol[:10])
          doliprane = medication_dict.search_unified("DOLIPRANE", limit=10)
          assert doliprane and doliprane[0]["nom"].upper() == "DOLIPRANE"
          amox = medication_dict.search_unified("AMOX", limit=10)
          assert amox and all(
              r["nom"].upper().startswith("AMOX") or r["dci"].upper().startswith("AMOX")
              for r in amox
          )
          ibuprofen = medication_dict.search_unified("IBUPROFENE", limit=10)
          assert ibuprofen and all(
              r["nom"].upper().startswith("IBUPROFENE") or r["dci"].upper().startswith("IBUPROFENE")
              for r in ibuprofen
          )
          PY
