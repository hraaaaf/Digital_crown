name: Cephalo R23-G4 Reference UI (experimental)
on:
  pull_request:
    paths:
      - '.github/workflows/cephalo-r23g4-reference-ui.yml'
      - 'frontend/src/features/ortho/cephaloR23G4ReferenceProfiles*'
      - 'frontend/src/features/ortho/components/CephaloR23G4ReferencePanel*'
      - 'frontend/src/features/ortho/components/CephaloAnalysisWorkbenchPanel.tsx'
      - 'frontend/src/features/ortho/cephaloAnalysisBridge.ts'
      - 'frontend/src/features/ortho/cephaloRepository.ts'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-ui-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify checkout HEAD
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend
        working-directory: frontend
        run: npm ci
      - name: Compile whole app without emitting artifacts
        working-directory: frontend
        run: npx tsc --noEmit -p tsconfig.app.json
      - name: Test source refusal, patient/study/revision changes, active Focus and unchanged Steiner/Tweed
        working-directory: frontend
        run: >
          npx vitest run
          src/features/ortho/cephaloR23G4ReferenceProfiles.test.ts
          src/features/ortho/components/CephaloR23G4ReferencePanel.test.tsx
          src/features/ortho/components/CephaloAnalysisWorkbenchPanel.test.tsx
