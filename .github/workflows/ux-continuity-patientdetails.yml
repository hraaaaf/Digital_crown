name: UX Continuity PatientDetails Patch

on:
  push:
    branches:
      - ux/continuity-flow-handoff-runner
    paths:
      - '.github/workflows/ux-continuity-patientdetails.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/continuity-flow-handoff-runner
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply PatientDetails handoff
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('frontend/src/features/patients/PatientDetailsInner.tsx')
          s = p.read_text()
          marker = "import { AssuranceBadge } from '../../components/AssuranceBadge';"
          assert marker in s, 'PatientDetails import marker drifted'
          s = s.replace(marker, marker + "\nimport { useFlowHandoff } from '../../hooks/useFlowHandoff';", 1)
          marker = "  const lastEditingDoc = useRef(null);"
          assert marker in s, 'PatientDetails ref marker drifted'
          s = s.replace(marker, marker + "\n  const flowContentRef = useRef<HTMLElement>(null);\n  const flowHandoff = useFlowHandoff();\n  const initialFlowSurface = useRef(true);", 1)
          marker = "  const fetchPatient = useCallback(async () => {"
          assert marker in s, 'PatientDetails effect marker drifted'
          effect = "  useEffect(() => {\n    if (initialFlowSurface.current) {\n      initialFlowSurface.current = false;\n      return;\n    }\n    flowHandoff(flowContentRef.current);\n  }, [activeTab, flowHandoff]);\n\n"
          s = s.replace(marker, effect + marker, 1)
          main = "      <main className={cn('max-w-[1600px] mx-auto w-full transition-all duration-500', isDocuments ? 'flex-1 min-h-0 px-3 py-3 md:px-6 md:py-4' : 'flex-1 px-4 py-6 md:px-8 md:py-8 space-y-6')}>"
          assert main in s, 'PatientDetails main marker drifted'
          s = s.replace(main, main.replace('<main ', '<main ref={flowContentRef} data-flow-patient-surface={activeTab} ', 1), 1)
          p.write_text(s)

          Path('frontend/src/features/patients/PatientDetailsFlowHandoff.test.ts').write_text("import { readFileSync } from 'node:fs';\nimport { describe, expect, it } from 'vitest';\nconst source=readFileSync(new URL('./PatientDetailsInner.tsx',import.meta.url),'utf8');\ndescribe('PatientDetails flow handoff',()=>{it('moves attention with active patient surfaces',()=>{expect(source).toContain(\"useFlowHandoff\");expect(source).toContain('flowHandoff(flowContentRef.current)');expect(source).toContain('data-flow-patient-surface={activeTab}');expect(source).toContain('[activeTab, flowHandoff]');});});\n")
          PY
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Targeted tests
        working-directory: frontend
        run: npx vitest run src/UXContinuity.test.ts src/features/patients/PatientDetailsFlowHandoff.test.ts
      - name: TypeScript build
        working-directory: frontend
        run: npm run build:test
      - name: Commit verified PatientDetails integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/features/patients/PatientDetailsInner.tsx frontend/src/features/patients/PatientDetailsFlowHandoff.test.ts
          git diff --cached --check
          git commit -m "feat(ux): hand off patient surface transitions"
          git push origin HEAD:ux/continuity-flow-handoff-runner
