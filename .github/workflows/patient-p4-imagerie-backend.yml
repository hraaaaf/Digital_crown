name: Patient P4 Imagerie Backend

on:
  pull_request:
    branches:
      - agent/patient-page-p3-clinique
    paths:
      - 'backend/models.py'
      - 'backend/schemas/clinical.py'
      - 'backend/schemas/panoramic.py'
      - 'backend/routers/ia.py'
      - 'backend/services/cmo_agent_service.py'
      - 'backend/services/patient_journey_service.py'
      - 'backend/tests/test_patient_p4_imaging_trash.py'
      - 'alembic/versions/f7a8b9c0d1e2_add_imaging_trash_fields.py'
      - '.github/workflows/patient-p4-imagerie-backend.yml'

permissions:
  contents: read

jobs:
  p4-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ENVIRONMENT: test
      SECRET_KEY: patient-p4-backend-secret-000001-long-enough
      DATABASE_URL: sqlite:///./p4-imaging-test.db
      TELEMETRY_ENABLED: 'false'
      CLOUD_AI_ENABLED: 'false'
      DEBUG: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.12.0 torchvision==0.27.0 --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^(torch|torchvision)([<=>].*)?$' requirements.txt > /tmp/requirements-p4-backend.txt
          pip install -r /tmp/requirements-p4-backend.txt
          pip install httpx==0.27.2 pytest alembic

      - name: Migration ancestry and source contract
        run: |
          python - <<'PY'
          from pathlib import Path
          migration = Path('alembic/versions/f7a8b9c0d1e2_add_imaging_trash_fields.py')
          assert migration.exists(), 'P4 imaging trash migration missing'
          text = migration.read_text(encoding='utf-8')
          assert 'revision: str = "f7a8b9c0d1e2"' in text
          assert 'down_revision: Union[str, None] = "e6f7a8b9c0d1"' in text
          ia = Path('backend/routers/ia.py').read_text(encoding='utf-8')
          cmo = Path('backend/services/cmo_agent_service.py').read_text(encoding='utf-8')
          for required in ['panoramic-trash', 'cephalo-trash', '/panoramic/{analysis_id}/restore', '/cephalo/{analysis_id}/restore']:
              assert required in ia, required
          assert 'db.delete(analysis)' not in ia
          assert 'os.remove(file_abs_path)' not in ia
          assert ia.count('current_user.get_employer_id())') >= 2
          assert 'models.PanoramicAnalysis.deleted_at.is_(None)' in cmo
          assert 'models.CephaloAnalysis.deleted_at.is_(None)' in cmo
          assert 'sans LLM' in cmo
          assert 'practitioner_validation_required' in cmo
          PY
          test "$(alembic heads | wc -l)" -eq 1

      - name: P4 recoverable lifecycle tests
        run: pytest -q backend/tests/test_patient_p4_imaging_trash.py
