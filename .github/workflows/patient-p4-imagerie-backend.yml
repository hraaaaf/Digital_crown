name: Patient P4 Imagerie Backend

on:
  pull_request:
    branches:
      - agent/patient-page-p3-clinique
    paths:
      - 'backend/__init__.py'
      - 'backend/models_imaging_p4.py'
      - 'backend/routers/__init__.py'
      - 'backend/routers/imaging_lifecycle_p4.py'
      - 'backend/routers/patient_journey_p4.py'
      - 'backend/services/cmo_agent_service.py'
      - 'backend/tests/test_patient_p4_imaging_trash.py'
      - 'backend/tests/test_patient_p4_imaging_consumers.py'
      - 'alembic/versions/f7a8b9c0d1e2_add_imaging_trash_records.py'
      - '.github/workflows/patient-p4-imagerie-backend.yml'

permissions:
  contents: read

jobs:
  p4-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ENVIRONMENT: test
      SECRET_KEY: patient-p4-backend-secret-000001-long-enough
      DATABASE_URL: sqlite:///./p4-imaging-test.db
      TELEMETRY_ENABLED: 'false'
      CLOUD_AI_ENABLED: 'false'
      DEBUG: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.12.0 torchvision==0.27.0 --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^(torch|torchvision)([<=>].*)?$' requirements.txt > /tmp/requirements-p4-backend.txt
          pip install -r /tmp/requirements-p4-backend.txt
          pip install httpx==0.27.2 pytest alembic

      - name: Migration and source contract
        run: |
          python - <<'PY'
          from pathlib import Path
          migration = Path('alembic/versions/f7a8b9c0d1e2_add_imaging_trash_records.py')
          assert migration.exists(), 'P4 imaging trash migration missing'
          text = migration.read_text(encoding='utf-8')
          assert 'revision: str = "f7a8b9c0d1e2"' in text
          assert 'down_revision: Union[str, None] = "e6f7a8b9c0d1"' in text
          assert '"imaging_trash_records"' in text

          lifecycle = Path('backend/routers/imaging_lifecycle_p4.py').read_text(encoding='utf-8')
          router_init = Path('backend/routers/__init__.py').read_text(encoding='utf-8')
          cmo = Path('backend/services/cmo_agent_service.py').read_text(encoding='utf-8')
          journey = Path('backend/routers/patient_journey_p4.py').read_text(encoding='utf-8')
          for required in ['panoramic-trash', 'cephalo-trash', '/panoramic/{analysis_id}/restore', '/cephalo/{analysis_id}/restore']:
              assert required in lifecycle, required
          assert 'ImagingTrashRecord' in lifecycle
          assert '_HARD_DELETE_PATHS' in router_init
          assert 'patient_journey_p4.router' in router_init
          assert 'ImagingTrashRecord' in cmo
          assert 'canonical_employer_id = patient.employer_id' in cmo
          assert 'sans LLM' in cmo
          assert 'practitioner_validation_required' in cmo
          assert 'removed_keys' in journey
          PY
          test "$(alembic heads | wc -l)" -eq 1

      - name: P4 recoverable lifecycle and consumer tests
        run: |
          pytest -q \
            backend/tests/test_patient_p4_imaging_trash.py \
            backend/tests/test_patient_p4_imaging_consumers.py
