name: Patient P3 Clinical RBAC Fix

on:
  pull_request:
    branches:
      - agent/patient-page-p2-journey
    paths:
      - '.github/workflows/patient-p3-clinical-rbac-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/patient-page-p3-clinique'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Align clinical tab permission with backend role policy
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('frontend/src/features/patients/PatientDetailsInner.tsx')
          text = path.read_text(encoding='utf-8')
          old = """  // Permission « clinical » : le propriétaire (sans employer_id) passe toujours,
  // un sous-compte doit l'avoir explicitement (miroir de has_permission backend).
  const user = useAuthStore(state => state.user);
  const canClinical = !user?.employer_id || Boolean(user?.permissions?.clinical);
"""
          new = """  // Permission « clinical » : miroir fail-closed de has_permission backend.
  // Seuls ADMIN et DENTISTE propriétaire ont un bypass ; les autres rôles
  // doivent posséder explicitement la permission clinical.
  const user = useAuthStore(state => state.user);
  const role = typeof user?.role === 'string'
    ? user.role
    : (user?.role && typeof user.role === 'object' && 'value' in user.role ? String(user.role.value || '') : '');
  const ownerOrAdmin = Boolean(user && (role === 'ADMIN' || (role === 'DENTISTE' && !user.employer_id)));
  const canClinical = ownerOrAdmin || Boolean(user?.permissions?.clinical === true);
"""
          assert text.count(old) == 1, 'P3 clinical permission block drifted'
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          grep -q "const canClinical = ownerOrAdmin || Boolean(user?.permissions?.clinical === true)" frontend/src/features/patients/PatientDetailsInner.tsx
          git config user.name 'digital-crown-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add frontend/src/features/patients/PatientDetailsInner.tsx
          git commit -m 'fix(patient): align clinical tab RBAC with backend roles'
          git push origin HEAD:${GITHUB_HEAD_REF}
