name: FUE-G04 candidate Windows native PDF source-contract LAB (NOT CERTIFIED)

# Candidate development only. Does NOT build, sign, release, or install Digital Crown.
on:
  push:
    branches:
      - feature/fue-g04-certified-windows-native-pdf-20261011
    paths:
      - '.github/workflows/fue-g04-native-pdf-candidate.yml'
      - 'DigitalCrown.spec'
      - 'backend/windows_native_pdf_bundle.py'
      - 'backend/windows_fontconfig/fonts.conf'
      - 'backend/scripts/pyi_rth_windows_native_pdf.py'
      - 'backend/tests/test_windows_native_pdf_bundle.py'
      - 'docs/audits/FUE_G04_NATIVE_PDF_CANDIDATE_20261011.md'

permissions:
  contents: read
  actions: read

jobs:
  portable-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax, certified spec contract, and negative tests (no app start)
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile backend/windows_native_pdf_bundle.py backend/scripts/pyi_rth_windows_native_pdf.py backend/tests/test_windows_native_pdf_bundle.py
          python - <<'PY'
          from pathlib import Path
          compile(Path("DigitalCrown.spec").read_text(encoding="utf-8"), "DigitalCrown.spec", "exec")
          print("FUE_G04_CANDIDATE_SPEC_SYNTAX=PASS")
          PY
          python -m unittest discover -s backend/tests -p test_windows_native_pdf_bundle.py -v
          echo "FUE_G04_RELEASE_APPROVAL=NOT_GRANTED"

  windows-native-input-parity:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install official UCRT64 dependency set on disposable runner
        id: msys
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        with:
          msystem: UCRT64
          update: true
          cache: false
          install: mingw-w64-ucrt-x86_64-pango mingw-w64-ucrt-x86_64-ttf-dejavu
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Obtain fixed research manifest (never promote this artifact)
        uses: actions/download-artifact@v4
        with:
          run-id: 38105734471
          repository: hraaaaf/Digital_crown
          name: fue-g04-experimental-native-ucrt64-inventory
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/fue-g04-locked-lab-manifest
      - name: Verify native inputs against pinned hashes; reject release
        shell: pwsh
        env:
          FUE_G04_RUN_NATIVE_LAB: '1'
          FUE_G04_MSYS2_ROOT: ${{ steps.msys.outputs.msys2-location }}
          FUE_G04_PROVENANCE_JSON: ${{ runner.temp }}/fue-g04-locked-lab-manifest/FUE-G04-experimental-complete-provenance.json
        run: |
          $ErrorActionPreference = 'Stop'
          $hostPython = Join-Path $env:pythonLocation 'python.exe'
          if (-not (Test-Path -LiteralPath $hostPython -PathType Leaf)) { throw 'Missing host Python' }
          & $hostPython -m unittest discover -s backend/tests -p test_windows_native_pdf_bundle.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Native PDF exact Windows source SHA gate failed' }
          Write-Host 'FUE_G04_WINDOWS_SOURCE_PINS=VERIFIED_IN_LAB'
          Write-Host 'FUE_G04_PRODUCTION_SPEC_EXECUTION=NOT_ATTEMPTED'
          Write-Host 'FUE_G04_INSTALLABLE_CERTIFIED=NO_GO'
