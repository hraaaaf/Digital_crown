name: Patient P6 Finances Identite After

on:
  pull_request:
    branches:
      - agent/patient-page-p5-documents
    paths:
      - 'backend/routers/__init__.py'
      - 'backend/routers/patient_financial_p6.py'
      - 'backend/tests/test_patient_p6_financial_snapshot.py'
      - 'frontend/src/features/patients/AddPatientForm.tsx'
      - 'frontend/src/features/patients/EditPatientForm.tsx'
      - 'frontend/src/features/patients/PatientIdentityContract.ts'
      - 'frontend/src/features/patients/PatientIdentityContract.p6.test.ts'
      - 'frontend/src/features/patients/PatientDetailsInner.tsx'
      - 'frontend/src/features/patients/components/PatientFinances.tsx'
      - 'frontend/src/features/patients/PatientP6Truth.test.ts'
      - 'frontend/src/features/patients/PatientP6PaymentContract.test.ts'
      - '.github/workflows/patient-p6-finances-identite-after.yml'

permissions:
  contents: read

jobs:
  after:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ENVIRONMENT: test
      SECRET_KEY: patient-p6-after-secret-000001-long-enough
      DATABASE_URL: sqlite:///./t2-runtime-cert.db
      TELEMETRY_ENABLED: 'false'
      CLOUD_AI_ENABLED: 'false'
      DEBUG: 'false'
      ALLOWED_ORIGINS: 'http://127.0.0.1:5173,http://localhost:5173'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.12.0 torchvision==0.27.0 --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^(torch|torchvision)([<=>].*)?$' requirements.txt > /tmp/requirements-p6-after.txt
          pip install -r /tmp/requirements-p6-after.txt
          pip install httpx==0.27.2 pytest

      - name: P6 backend financial truth tests
        run: pytest -q backend/tests/test_patient_p6_financial_snapshot.py

      - name: Install frontend and Chromium
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: P6 frontend truth tests and build
        working-directory: frontend
        run: |
          npm test -- --run \
            src/features/patients/PatientP6Truth.test.ts \
            src/features/patients/PatientIdentityContract.p6.test.ts \
            src/features/patients/PatientP6PaymentContract.test.ts
          npm run build

      - name: Source contract
        run: |
          python - <<'PY'
          from pathlib import Path
          add = Path('frontend/src/features/patients/AddPatientForm.tsx').read_text(encoding='utf-8')
          edit = Path('frontend/src/features/patients/EditPatientForm.tsx').read_text(encoding='utf-8')
          identity = Path('frontend/src/features/patients/PatientIdentityContract.ts').read_text(encoding='utf-8')
          details = Path('frontend/src/features/patients/PatientDetailsInner.tsx').read_text(encoding='utf-8')
          finances = Path('frontend/src/features/patients/components/PatientFinances.tsx').read_text(encoding='utf-8')
          backend = Path('backend/routers/patient_financial_p6.py').read_text(encoding='utf-8')
          router_init = Path('backend/routers/__init__.py').read_text(encoding='utf-8')

          for required in ["sexe: ''", 'validatePatientIdentity', 'patientIdentityToApiPayload']:
              assert required in identity, required
          for source, required in [
              (add, "from './PatientIdentityContract'"),
              (add, 'createPatientIdentityFormData'),
              (add, 'validatePatientIdentity'),
              (add, 'patientIdentityToApiPayload'),
              (edit, "from './PatientIdentityContract'"),
              (edit, 'patientIdentityFromApi'),
              (edit, 'validatePatientIdentity'),
              (edit, 'patientIdentityToApiPayload'),
          ]:
              assert required in source, required
          assert "sexe: 'F'" not in identity
          assert '<option value="">Choisir' in add
          assert "patient.sexe || 'F'" not in edit
          assert '<option value="">Choisir' in edit
          for required in ['Impossible de charger le patient', 'Disponibilité non vérifiée']:
              assert required in edit, required

          for required in ['const canFinance = Boolean(', "userPermissions.accounting === true || userPermissions.payments === true", "if (!canFinance && activeTab === 'finances')", "canFinance && activeTab === 'finances'"]:
              assert required in details, required
          for required in ['snapshot.has_billing_data === true', 'Facturé', 'Encaissé', 'Reste dû', 'Prochaine échéance', 'Indéterminé', 'Situation d’impayé indéterminée', 'Impossible de charger les finances']:
              assert required in finances, required
          assert 'Taux Recouvrement' not in finances

          for required in ['require_permission(["accounting", "payments"])', 'has_billing_data = acte_count > 0', 'remaining_due = max(total_billed - total_collected, 0.0) if has_billing_data else None', '"next_installment": next_installment']:
              assert required in backend, required
          assert 'patient_financial_p6.router' in router_init
          assert '/{patient_id}/financial-snapshot' in router_init
          PY

      - name: Start backend
        run: |
          rm -f t2-runtime-cert.db
          python scripts/t2_runtime_server.py > /tmp/p6-after-backend.log 2>&1 &
          for i in {1..90}; do if curl -fsS http://127.0.0.1:8005/health >/dev/null; then exit 0; fi; sleep 1; done
          cat /tmp/p6-after-backend.log
          exit 1

      - name: Start frontend
        working-directory: frontend
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 > /tmp/p6-after-front.log 2>&1 &
          for i in {1..90}; do if curl -fsS http://127.0.0.1:5173 >/dev/null; then exit 0; fi; sleep 1; done
          cat /tmp/p6-after-front.log
          exit 1

      - name: Capture P6 AFTER
        working-directory: frontend
        run: |
          mkdir -p ../artifacts/p6-finances-identite-after
          cat > .p6-after.mjs <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import { chromium, request } from 'playwright';
          const out=path.resolve('../artifacts/p6-finances-identite-after');
          const viewports=[{width:390,height:844},{width:430,height:932},{width:768,height:1024},{width:1280,height:900}];
          const api=await request.newContext({baseURL:'http://127.0.0.1:8005'});
          const login=await api.post('/api/auth/login',{form:{username:'t2-browser@cabinet.ma',password:'T2BrowserPass123!'}});
          if(!login.ok()) throw new Error(await login.text());
          const tok=await login.json(); const headers={Authorization:`Bearer ${tok.access_token}`};
          const ps=await api.get('/api/patients',{headers});
          const patient=(await ps.json()).find(p=>p.numero_dossier==='T2-0001');
          if(!patient) throw new Error('T2 patient missing');
          const browser=await chromium.launch({headless:true}); const evidence=[];
          for(const viewport of viewports){
            const ctx=await browser.newContext({viewport,colorScheme:'light'}); const page=await ctx.newPage();
            await page.addInitScript(({a,r})=>{localStorage.setItem('token',a);localStorage.setItem('refresh_token',r||'');localStorage.setItem('appMode','prod');},{a:tok.access_token,r:tok.refresh_token});
            const errors=[]; const http5xx=[];
            page.on('pageerror',e=>errors.push(String(e)));
            page.on('response',r=>{if(r.status()>=500)http5xx.push({url:r.url(),status:r.status()});});

            await page.goto('http://127.0.0.1:5173/patients/new',{waitUntil:'networkidle',timeout:90000});
            await page.getByText('Nouveau Patient',{exact:true}).waitFor({state:'visible',timeout:30000});
            await page.waitForTimeout(400);
            const addSex=await page.locator('select[name="sexe"]').inputValue();
            if(addSex!=='') throw new Error(`Add sex is implicit: ${addSex}`);
            const addOverflow=await page.evaluate(()=>document.documentElement.scrollWidth>document.documentElement.clientWidth+2);
            const addShot=`p6-after-add-${viewport.width}x${viewport.height}.png`;
            await page.screenshot({path:path.join(out,addShot),fullPage:false});

            await page.goto(`http://127.0.0.1:5173/patients/${patient.id}/edit`,{waitUntil:'networkidle',timeout:90000});
            await page.getByText('Mise à jour',{exact:true}).waitFor({state:'visible',timeout:30000});
            await page.waitForTimeout(400);
            const editOverflow=await page.evaluate(()=>document.documentElement.scrollWidth>document.documentElement.clientWidth+2);
            const editShot=`p6-after-edit-${viewport.width}x${viewport.height}.png`;
            await page.screenshot({path:path.join(out,editShot),fullPage:false});

            await page.goto(`http://127.0.0.1:5173/patients/${patient.id}`,{waitUntil:'networkidle',timeout:90000});
            const finance=page.getByRole('button',{name:'Finances',exact:true});
            await finance.waitFor({state:'visible',timeout:30000});
            await finance.click();
            await page.getByText('Facturé',{exact:true}).waitFor({state:'visible',timeout:30000});
            for(const label of ['Encaissé','Reste dû','Prochaine échéance']){
              if(await page.getByText(label,{exact:true}).count()!==1) throw new Error(`P6 KPI missing: ${label}`);
            }
            if(await page.getByText('Taux Recouvrement',{exact:true}).count()) throw new Error('Recovery KPI still visible');
            await page.waitForTimeout(500);
            const financeOverflow=await page.evaluate(()=>document.documentElement.scrollWidth>document.documentElement.clientWidth+2);
            const financeShot=`p6-after-finances-${viewport.width}x${viewport.height}.png`;
            await page.screenshot({path:path.join(out,financeShot),fullPage:false});

            evidence.push({viewport,addSex,addOverflow,editOverflow,financeOverflow,errors,http5xx,addShot,editShot,financeShot});
            await ctx.close();
          }
          fs.writeFileSync(path.join(out,'evidence.json'),JSON.stringify(evidence,null,2));
          const invalid=evidence.filter(e=>e.addSex!==''||e.addOverflow||e.editOverflow||e.financeOverflow||e.errors.length||e.http5xx.length);
          fs.writeFileSync(path.join(out,'summary.json'),JSON.stringify({captures:evidence.length*3,invalid,evidence},null,2));
          await browser.close(); await api.dispose();
          if(evidence.length!==4||invalid.length) process.exit(1);
          JS
          node .p6-after.mjs
          rm .p6-after.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: patient-p6-finances-identite-after
          path: artifacts/p6-finances-identite-after
          if-no-files-found: error
          retention-days: 14
