name: CUST-03 Certificate Templates Visual Evidence

on:
  pull_request:
    branches: [master]
    paths:
      - ".github/workflows/cust-03-certificate-templates-visual.yml"
      - "frontend/src/features/admin/DocumentStudio/Forms/CertificateFormInner.tsx"
      - "frontend/src/features/admin/DocumentStudio/Forms/CertificateTemplatePresets.cust03.test.tsx"
      - "docs/customization/CUST_03_USER_TEMPLATES_GOAL.md"

permissions:
  contents: read

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout AFTER
        uses: actions/checkout@v4
        with:
          path: after

      - name: Checkout BEFORE base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: before

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: after/frontend/package-lock.json

      - name: Install frontend and Chromium
        working-directory: after/frontend
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
          ln -s "$(realpath node_modules)" ../../before/frontend/node_modules

      - name: Inject identical harnesses
        run: |
          for root in before/frontend after/frontend; do
            cat > "$root/cust03-certificate.html" <<'EOF'
          <!doctype html>
          <html lang="fr">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <title>CUST-03 Certificate Templates</title>
            </head>
            <body class="bg-white">
              <div id="root"></div>
              <script type="module" src="/src/cust03-certificate.tsx"></script>
            </body>
          </html>
          EOF
            cat > "$root/src/cust03-certificate.tsx" <<'EOF'
          import React, { useState } from 'react';
          import { createRoot } from 'react-dom/client';
          import './index.css';
          import { CertificateForm as CertificateFormInner } from './features/admin/DocumentStudio/Forms/CertificateFormInner';

          function Harness() {
            const [type, setType] = useState('Certificat médical');
            const [days, setDays] = useState(0);
            const [startDate, setStartDate] = useState('');
            const [content, setContent] = useState('Je certifie avoir examiné ce patient ce jour. Le présent certificat est remis après validation du praticien.');

            return (
              <main className="mx-auto max-w-5xl px-3 py-4 sm:px-5">
                <h1 className="mb-2 text-xl font-black text-slate-900">Document Studio</h1>
                <CertificateFormInner
                  patientId=""
                  certifType={type}
                  setCertifType={setType}
                  certifDays={days}
                  setCertifDays={setDays}
                  docDate="2026-09-22"
                  certifStartDate={startDate}
                  setCertifStartDate={setStartDate}
                  certifCustomMotif={content}
                  setCertifCustomMotif={setContent}
                />
              </main>
            );
          }

          createRoot(document.getElementById('root')!).render(<Harness />);
          EOF
          done

      - name: Prepare PWA dev harness
        run: |
          mkdir -p before/frontend/dev-dist after/frontend/dev-dist
          : > before/frontend/dev-dist/registerSW.js
          : > after/frontend/dev-dist/registerSW.js

      - name: Capture BEFORE and AFTER
        working-directory: after/frontend
        run: |
          cat > cust03-visual.mjs <<'EOF'
          import path from 'node:path';
          import fs from 'node:fs/promises';
          import { chromium } from 'playwright';
          import { createServer } from 'vite';

          const afterRoot = process.cwd();
          const beforeRoot = path.resolve('../../before/frontend');
          const output = path.resolve('../../artifacts/cust-03-certificate-templates');
          await fs.mkdir(output, { recursive: true });

          const beforeServer = await createServer({ root: beforeRoot, server: { host: '127.0.0.1', port: 4190, strictPort: true }, clearScreen: false });
          const afterServer = await createServer({ root: afterRoot, server: { host: '127.0.0.1', port: 4191, strictPort: true }, clearScreen: false });
          await beforeServer.listen();
          await afterServer.listen();

          const browser = await chromium.launch({ headless: true });
          const viewports = [{width:390,height:844},{width:768,height:1024},{width:1280,height:900}];
          const rows = [];

          const capture = async (kind, port, viewport) => {
            const context = await browser.newContext({ viewport, colorScheme: 'light' });
            const page = await context.newPage();
            const errors = [];
            page.on('pageerror', e => errors.push(String(e)));
            page.on('console', m => { if (m.type() === 'error') errors.push(m.text()); });

            await page.route('**/api/templates**', route => {
              const url = new URL(route.request().url());
              if (/\/api\/templates\/?$/.test(url.pathname)) {
                return route.fulfill({
                  status: 200,
                  contentType: 'application/json',
                  body: JSON.stringify([
                    { id:'tpl-a', name:'Aptitude traitement', description:'Modèle cabinet', is_default:false },
                    { id:'tpl-b', name:'Suivi médical', description:'Modèle cabinet', is_default:false },
                  ]),
                });
              }
              return route.fulfill({
                status: 200,
                contentType: 'application/json',
                body: JSON.stringify({
                  id:'tpl-a',
                  name:'Aptitude traitement',
                  body_html:'Je certifie avoir examiné ce patient ce jour.',
                }),
              });
            });

            await page.goto(`http://127.0.0.1:${port}/cust03-certificate.html`, { waitUntil: 'networkidle' });
            await page.getByText('Contenu du certificat médical', { exact: true }).waitFor();
            if (kind === 'after') {
              await page.getByText('Modèles du cabinet', { exact: true }).waitFor();
            }

            const overflow = await page.evaluate(() => document.documentElement.scrollWidth > document.documentElement.clientWidth + 2);
            const shot = `${kind}-${viewport.width}x${viewport.height}.png`;
            await page.screenshot({ path: path.join(output, shot), fullPage: true, animations: 'disabled' });
            rows.push({ kind, viewport, overflow, errors: [...errors], shot });

            if (kind === 'after') {
              await page.getByRole('button', { name: 'Aptitude traitement' }).click();
              await page.getByRole('dialog', { name: 'Remplacer le brouillon actuel ?' }).waitFor();
              const overwriteOverflow = await page.evaluate(() => document.documentElement.scrollWidth > document.documentElement.clientWidth + 2);
              const overwriteShot = `after-overwrite-${viewport.width}x${viewport.height}.png`;
              await page.screenshot({ path: path.join(output, overwriteShot), fullPage: true, animations: 'disabled' });
              rows.push({ kind:'after-overwrite', viewport, overflow:overwriteOverflow, errors:[...errors], shot:overwriteShot });
              await page.getByRole('button', { name: 'Conserver mon brouillon' }).click();

              await page.getByRole('button', { name: 'Créer un modèle' }).click();
              await page.getByRole('dialog', { name: 'Créer un modèle' }).waitFor();
              const modalOverflow = await page.evaluate(() => document.documentElement.scrollWidth > document.documentElement.clientWidth + 2);
              const modalShot = `after-modal-${viewport.width}x${viewport.height}.png`;
              await page.screenshot({ path: path.join(output, modalShot), fullPage: true, animations: 'disabled' });
              rows.push({ kind:'after-modal', viewport, overflow:modalOverflow, errors:[...errors], shot:modalShot });
            }
            await context.close();
          };

          try {
            for (const viewport of viewports) {
              await capture('before', 4190, viewport);
              await capture('after', 4191, viewport);
            }
          } finally {
            await browser.close();
            await beforeServer.close();
            await afterServer.close();
          }

          const failures = rows.filter(row => row.overflow || row.errors.length);
          await fs.writeFile(path.join(output, 'evidence.json'), JSON.stringify(rows, null, 2));
          await fs.writeFile(path.join(output, 'summary.json'), JSON.stringify({
            beforeSha: process.env.BASE_SHA,
            afterSha: process.env.HEAD_SHA,
            viewports,
            screenshots: rows.length,
            failures,
          }, null, 2));
          if (failures.length) process.exit(1);
          EOF
          BASE_SHA="${{ github.event.pull_request.base.sha }}" HEAD_SHA="${{ github.event.pull_request.head.sha }}" node cust03-visual.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cust-03-certificate-templates-before-after
          path: artifacts/cust-03-certificate-templates
          if-no-files-found: error
          retention-days: 14
