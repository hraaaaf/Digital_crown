name: Patient P6AB Identity Patch

on:
  pull_request:
    branches:
      - agent/patient-page-p5-documents
    paths:
      - '.github/workflows/patient-p6ab-identity-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/patient-page-p6-finances-identite'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply P6-A/B exact replacements
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, count=1):
              p=Path(path); text=p.read_text(encoding='utf-8'); found=text.count(old)
              if found != count:
                  raise SystemExit(f'{path}: expected {count}, found {found}: {old[:110]!r}')
              p.write_text(text.replace(old,new), encoding='utf-8')

          add='frontend/src/features/patients/AddPatientForm.tsx'
          edit='frontend/src/features/patients/EditPatientForm.tsx'

          # ADD: no invented sex, no fail-open prechecks, responsive shell.
          replace_exact(add, "  const [dossierStatus, setDossierStatus] = useState<{ status: 'idle' | 'checking' | 'available' | 'taken', owner?: string }>({ status: 'idle' });", "  const [dossierStatus, setDossierStatus] = useState<{ status: 'idle' | 'checking' | 'available' | 'taken' | 'error', owner?: string }>({ status: 'idle' });")
          replace_exact(add, "    sexe: 'F', ", "    sexe: '', ")
          replace_exact(add, "      } catch (err) {\n        setDossierStatus({ status: 'available' }); // Fallback silent\n      }", "      } catch (err) {\n        console.error('Erreur vérification numéro de dossier:', err);\n        setDossierStatus({ status: 'error' });\n      }")
          replace_exact(add, "    // Téléphone, email et adresse sont optionnels\n    \n", "    if (!formData.sexe) newErrors.sexe = \"Le sexe doit être renseigné explicitement.\";\n    // Téléphone, email et adresse sont optionnels\n    \n")
          replace_exact(add, "  const checkDuplicate = async (): Promise<boolean> => {", "  const checkDuplicate = async (): Promise<boolean | null> => {")
          replace_exact(add, "    } catch (err) {\n      console.error(\"Erreur vérification doublon:\", err);\n      return false; // En cas d'erreur, on continue (le backend vérifiera aussi)\n    }", "    } catch (err) {\n      console.error(\"Erreur vérification doublon:\", err);\n      setErrors(previous => ({ ...previous, global: \"Vérification anti-doublon indisponible. Réessayez avant de créer le patient.\" }));\n      return null;\n    }")
          replace_exact(add, "      const hasDuplicate = await checkDuplicate();\n      setLoading(false);\n      if (hasDuplicate) return; // Arrêter ici, attendre la décision de l'utilisateur", "      const hasDuplicate = await checkDuplicate();\n      setLoading(false);\n      if (hasDuplicate === null) return;\n      if (hasDuplicate) return; // Arrêter ici, attendre la décision de l'utilisateur")
          replace_exact(add, "    <div className=\"max-w-4xl mx-auto p-10\">\n      <div className=\"bg-white/70", "    <div className=\"w-full min-w-0 max-w-4xl mx-auto px-3 sm:px-6 lg:px-10 py-6 lg:py-10\">\n      <div className=\"w-full min-w-0 bg-white/70")
          replace_exact(add, "        <div className=\"bg-[#003380] px-10 py-8 flex justify-between items-center relative overflow-hidden\">", "        <div className=\"bg-[#003380] px-5 sm:px-10 py-6 sm:py-8 flex justify-between items-center relative overflow-hidden\">")
          replace_exact(add, "          <div className=\"flex items-center gap-5 relative z-10\">", "          <div className=\"flex min-w-0 items-center gap-3 sm:gap-5 relative z-10\">")
          replace_exact(add, "              <h2 className=\"text-3xl font-black text-white tracking-tight\">Nouveau Patient</h2>", "              <h2 className=\"text-2xl sm:text-3xl font-black text-white tracking-tight leading-tight\">Nouveau Patient</h2>")
          replace_exact(add, "        <form onSubmit={handleSubmit} className=\"p-10 space-y-10\">", "        <form onSubmit={handleSubmit} className=\"p-5 sm:p-10 space-y-8 sm:space-y-10\">")
          replace_exact(add, "                  <option value=\"F\">Féminin</option>\n                  <option value=\"M\">Masculin</option>", "                  <option value=\"\">Choisir…</option>\n                  <option value=\"F\">Féminin</option>\n                  <option value=\"M\">Masculin</option>")
          replace_exact(add, "                  className={inputClass}\n                >\n                  <option value=\"\">Choisir…</option>", "                  className={cn(inputClass, errors.sexe && \"border-red-400 focus:border-red-400 focus:ring-red-100\")}\n                >\n                  <option value=\"\">Choisir…</option>")
          replace_exact(add, "                </select>\n              </div>\n\n              <div>\n                <label className={labelClass}>Assurance", "                </select>\n                {errors.sexe && <span className=\"text-red-500 text-xs mt-1 ml-1\">{errors.sexe}</span>}\n              </div>\n\n              <div>\n                <label className={labelClass}>Assurance")
          replace_exact(add, "              {dossierStatus.status === 'available' && (\n                <p className=\"text-emerald-600 text-[10px] font-black uppercase tracking-widest mt-2 ml-1 flex items-center gap-1\">\n                  <UserCheck size={12} /> Numéro disponible\n                </p>\n              )}", "              {dossierStatus.status === 'available' && (\n                <p className=\"text-emerald-600 text-[10px] font-black uppercase tracking-widest mt-2 ml-1 flex items-center gap-1\">\n                  <UserCheck size={12} /> Numéro disponible\n                </p>\n              )}\n              {dossierStatus.status === 'error' && (\n                <p className=\"text-amber-600 text-[10px] font-black uppercase tracking-widest mt-2 ml-1 flex items-center gap-1\">\n                  <AlertTriangle size={12} /> Disponibilité non vérifiée\n                </p>\n              )}")

          # EDIT: no fallback sex; explicit load error + retry; dossier check fail-closed.
          replace_exact(edit, "  const [saving, setSaving] = useState(false);", "  const [saving, setSaving] = useState(false);\n  const [fetchError, setFetchError] = useState(false);\n  const [reloadKey, setReloadKey] = useState(0);")
          replace_exact(edit, "    sexe: 'F',", "    sexe: '',")
          replace_exact(edit, "  const [dossierStatus, setDossierStatus] = useState<{ status: 'idle' | 'checking' | 'available' | 'taken', owner?: string }>({ status: 'idle' });", "  const [dossierStatus, setDossierStatus] = useState<{ status: 'idle' | 'checking' | 'available' | 'taken' | 'error', owner?: string }>({ status: 'idle' });")
          replace_exact(edit, "      try {\n        setLoading(true);\n        const res = await api.get(`/patients/${id}`);", "      try {\n        setLoading(true);\n        setFetchError(false);\n        const res = await api.get(`/patients/${id}`);")
          replace_exact(edit, "          sexe: patient.sexe || 'F',", "          sexe: patient.sexe === 'M' || patient.sexe === 'F' ? patient.sexe : '',")
          replace_exact(edit, "      } catch (err) {\n        console.error(\"Erreur de récupération:\", err);\n      } finally", "      } catch (err) {\n        console.error(\"Erreur de récupération:\", err);\n        setFetchError(true);\n      } finally")
          replace_exact(edit, "  }, [id]);", "  }, [id, reloadKey]);", count=1)
          replace_exact(edit, "      } catch (err) {\n        setDossierStatus({ status: 'available' });\n      }", "      } catch (err) {\n        console.error('Erreur vérification numéro de dossier:', err);\n        setDossierStatus({ status: 'error' });\n      }")
          replace_exact(edit, "  if (loading) return (", "  if (loading) return (")
          marker = "  const inputClass = \"w-full px-6 py-4 bg-white/70 border border-slate-200 rounded-[1.5rem] focus:ring-4 focus:ring-[#003380]/10 focus:border-[#003380] outline-none transition-all font-bold text-[#003380] placeholder:text-slate-300\";"
          replace_exact(edit, marker, "  if (fetchError) return (\n    <div className=\"min-h-[60vh] flex flex-col items-center justify-center gap-4 text-center px-6\">\n      <AlertCircle size={42} className=\"text-rose-500\" />\n      <div>\n        <h2 className=\"font-black text-slate-800 text-xl\">Impossible de charger le patient</h2>\n        <p className=\"text-slate-500 text-sm mt-1\">Le formulaire n'est pas affiché avec des valeurs par défaut.</p>\n      </div>\n      <button type=\"button\" onClick={() => setReloadKey(key => key + 1)} className=\"flex items-center gap-2 px-4 py-2 rounded-xl bg-[#003380] text-white font-black text-xs uppercase tracking-widest\">\n        <RefreshCw size={15} /> Réessayer\n      </button>\n    </div>\n  );\n\n" + marker)
          replace_exact(edit, "            {dossierStatus.status === 'available' && (\n              <p className=\"mt-2 text-xs text-emerald-600 font-bold\">✓ Numéro disponible</p>\n            )}", "            {dossierStatus.status === 'available' && (\n              <p className=\"mt-2 text-xs text-emerald-600 font-bold\">✓ Numéro disponible</p>\n            )}\n            {dossierStatus.status === 'error' && (\n              <p className=\"mt-2 text-xs text-amber-600 font-bold flex items-center gap-1\"><AlertTriangle size={13} /> Disponibilité non vérifiée</p>\n            )}")

          add_text=Path(add).read_text(encoding='utf-8'); edit_text=Path(edit).read_text(encoding='utf-8')
          for forbidden in ["sexe: 'F'", "setDossierStatus({ status: 'available' }); // Fallback silent", 'return false; // En cas d\'erreur']:
              if forbidden in add_text: raise SystemExit(f'P6 Add fail-open/default remains: {forbidden}')
          for forbidden in ["sexe: 'F'", "patient.sexe || 'F'"]:
              if forbidden in edit_text: raise SystemExit(f'P6 Edit sex fallback remains: {forbidden}')
          for required in ['Disponibilité non vérifiée', 'Vérification anti-doublon indisponible', '<option value="">Choisir…</option>']:
              if required not in add_text: raise SystemExit(f'P6 Add requirement missing: {required}')
          for required in ['Impossible de charger le patient', 'Disponibilité non vérifiée', 'setFetchError(true)']:
              if required not in edit_text: raise SystemExit(f'P6 Edit requirement missing: {required}')
          PY
          git diff --check

      - name: Commit guarded patch
        run: |
          git config user.name 'digital-crown-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add frontend/src/features/patients/AddPatientForm.tsx frontend/src/features/patients/EditPatientForm.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'fix(patient): harden P6 identity truth boundary'
          git push origin HEAD:${GITHUB_HEAD_REF}
