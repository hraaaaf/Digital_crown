name: Cephalo Runtime Certification

on:
  pull_request:
    paths:
      - "backend/**/cephalo*"
      - "backend/**/cephalo*/**"
      - "frontend/**/cephalo*"
      - "frontend/**/cephalo*/**"
      - "docs/CEPHALO*"
      - "docs/**/CEPHALO*"
      - ".github/workflows/cephalo-runtime-cert.yml"
      - ".github/workflows/t2-runtime-cert.yml"
  workflow_dispatch:
  push:
    branches:
      - ci/cephalo-targeted-runtime-cert

permissions:
  contents: read

concurrency:
  group: cephalo-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cephalo-runtime:
    name: Cephalo Browser Runtime
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ENVIRONMENT: test
      SECRET_KEY: cephalo-runtime-certification-secret-key-000001
      DATABASE_URL: sqlite:///./cephalo-runtime-cert.db
      DIGITALCROWN_ISOLATED_RUNTIME: "1"
      DIGITALCROWN_ISOLATION_DB_FINGERPRINT: c04779c8d18b3ac12a0f4093a47a5d0c3c0e2251714be532893cfa052e9ee780
      TELEMETRY_ENABLED: "false"
      CLOUD_AI_ENABLED: "false"
      DEBUG: "false"
      ALLOWED_ORIGINS: http://127.0.0.1:5173,http://localhost:5173
      T2_USER: t2-browser@cabinet.ma
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Record exact HEAD
        run: git rev-parse HEAD

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Generate isolated runtime credential
        run: python -c 'import secrets; print("T2_PASSWORD=" + secrets.token_urlsafe(24))' >> "$GITHUB_ENV"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.10.0 torchvision==0.25.0 torchaudio==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^(torch|torchvision|torchaudio)([<=>].*)?$' requirements.txt > /tmp/requirements-cephalo-runtime.txt
          pip install -r /tmp/requirements-cephalo-runtime.txt
          python -m pip check

      - name: Install frontend and Chromium
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save playwright@1.55.0
          npx playwright install chromium

      - name: Start isolated backend
        run: |
          rm -f cephalo-runtime-cert.db
          python scripts/t2_runtime_server.py > /tmp/cephalo-backend.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8005/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/cephalo-backend.log
          exit 1

      - name: Start frontend
        working-directory: frontend
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 > /tmp/cephalo-frontend.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:5173 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/cephalo-frontend.log
          exit 1

      - name: Certify G4 Cephalo browser actions
        working-directory: frontend
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ../artifacts/cephalo-runtime
          node scripts/run-with-t2-workstation.mjs scripts/certify-v1-07-g4-cephalo-actions.mjs 2>&1 | tee ../artifacts/cephalo-runtime/runner.log

      - name: Dump runtime logs on failure
        if: failure()
        run: |
          echo "===== BACKEND ====="
          cat /tmp/cephalo-backend.log || true
          echo "===== FRONTEND ====="
          cat /tmp/cephalo-frontend.log || true

      - name: Upload Cephalo evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cephalo-runtime-evidence
          path: artifacts/cephalo-runtime
          if-no-files-found: warn
          retention-days: 14
