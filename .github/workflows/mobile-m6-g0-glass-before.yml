name: Mobile M6-G0 Glass BEFORE

on:
  push:
    branches:
      - "audit/mobile-m6-g0-glass-before-20260825"
    paths:
      - ".github/workflows/mobile-m6-g0-glass-before.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    name: Capture current mobile visual baseline
    runs-on: ubuntu-latest
    env:
      PRODUCT_HEAD: 13b79f572b6a62f6c743f75f4d93b841454d3417
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4

      - name: Checkout exact product baseline
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PRODUCT_HEAD }}
          path: product

      - name: Assert exact product baseline
        run: test "$(git -C product rev-parse HEAD)" = "$PRODUCT_HEAD"

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: product/frontend/package-lock.json

      - name: Install frontend and Chromium
        working-directory: product/frontend
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium

      - name: Inject isolated BEFORE harness
        working-directory: product/frontend
        run: |
          cat > mobile-m6-g0-before.html <<'EOF'
          <!doctype html>
          <html lang="fr">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover" />
              <link rel="icon" href="data:," />
              <title>Digital Crown M6-G0 BEFORE</title>
            </head>
            <body>
              <div id="root"></div>
              <script type="module" src="/src/mobile-m6-g0-before.tsx"></script>
            </body>
          </html>
          EOF

          cat > src/mobile-m6-g0-before.tsx <<'EOF'
          import React from 'react';
          import { createRoot } from 'react-dom/client';
          import { MemoryRouter, Route, Routes } from 'react-router-dom';
          import './index.css';
          import { MobileDashboard } from './features/mobile/Dashboard/MobileDashboard';
          import { OnboardingScanner } from './features/mobile/Onboarding/OnboardingScanner';
          import { MobileContext } from './features/mobile/Context/MobileContext';
          import { MobileStorage } from './services/zka/MobileStorage';

          const params = new URLSearchParams(window.location.search);
          const view = params.get('view') || 'dashboard';
          const jwt = 'eyJhbGciOiJub25lIiwidHlwIjoiSldUIn0.eyJleHAiOjQxMDI0NDQ4MDB9.';

          await MobileStorage.clearAll().catch(() => {});
          if (view !== 'onboarding') {
            await MobileStorage.saveCredentials({
              publicId: 'abcdef1234567890',
              masterKey: 'a'.repeat(64),
              access_token: jwt,
              refresh_token: 'm6-g0-refresh',
              device_id: '11111111-2222-4333-8444-555555555555',
              api_base_url: 'http://127.0.0.1:8005',
            });
          }
          if (view === 'context') {
            await MobileStorage.saveBridgeContext({
              type: 'appointment',
              key: 'M6G0-Appointment',
              label: 'Rendez-vous',
              state: 'ready',
              reason: null,
            });
          }

          const entry = view === 'onboarding'
            ? '/mobile/onboarding'
            : view === 'context'
              ? '/mobile/context'
              : '/mobile/dashboard?tab=agenda';

          createRoot(document.getElementById('root')!).render(
            <MemoryRouter initialEntries={[entry]}>
              <Routes>
                <Route path="/mobile/onboarding" element={<OnboardingScanner />} />
                <Route path="/mobile/dashboard" element={<MobileDashboard />} />
                <Route path="/mobile/context" element={<MobileContext />} />
              </Routes>
            </MemoryRouter>,
          );
          EOF

          cat > mobile-m6-g0-before.mjs <<'EOF'
          import { chromium } from 'playwright';
          import { createServer } from 'vite';
          import fs from 'node:fs/promises';

          const output = 'mobile-m6-g0-before-artifacts';
          await fs.rm(output, { recursive: true, force: true });
          await fs.mkdir(output, { recursive: true });
          const productHead = process.env.PRODUCT_HEAD || 'unknown';
          const captures = [];

          const snapshot = {
            generated_at: '2026-08-25T10:00:00Z',
            role: 'DENTISTE',
            is_superadmin: false,
            appointments: [
              { id: 77, patient_id: 12, time: '10:30', patient_name: 'BENNANI Sara', phone: '0612345678', motif: 'Contrôle implant 36', status: 'PLANIFIE', duration_minutes: 60 },
              { id: 78, patient_id: 13, time: '14:00', patient_name: 'EL MANSOURI Yasmine', phone: '0622334455', motif: 'Empreinte', status: 'TERMINE', duration_minutes: 45 },
            ],
            finance: {
              today_revenue: 1250,
              month_revenue: 18400,
              month_variation: 8.2,
              appointments_count: 2,
              weekly_revenue: [
                { date: '2026-08-19', amount: 2100 },
                { date: '2026-08-20', amount: 1800 },
                { date: '2026-08-21', amount: 2400 },
                { date: '2026-08-22', amount: 1950 },
                { date: '2026-08-23', amount: 900 },
                { date: '2026-08-24', amount: 1450 },
                { date: '2026-08-25', amount: 1250 },
              ],
              total_patients: 287,
              total_debt: 3400,
            },
            debtors: [],
          };

          const appointmentPayload = {
            type: 'appointment',
            label: 'Rendez-vous',
            appointment: {
              patient_name: 'BENNANI Sara',
              datetime_start: '2026-08-25T10:30:00',
              duration_minutes: 60,
              motif: 'Contrôle implant 36',
              status: 'CONFIRMÉ',
              scheduling_type: 'EXACT_TIME',
              notes: 'Contrôle post-opératoire',
            },
          };

          function json(body, status = 200) {
            return { status, contentType: 'application/json', body: JSON.stringify(body) };
          }

          const server = await createServer({ server: { host: '127.0.0.1', port: 4190, strictPort: true }, clearScreen: false });
          await server.listen();
          const browser = await chromium.launch();

          async function capture(view, viewport) {
            const context = await browser.newContext({ viewport, screen: viewport, deviceScaleFactor: 1, hasTouch: true, isMobile: true, serviceWorkers: 'block' });
            const page = await context.newPage();
            const errors = [];
            page.on('pageerror', error => errors.push(`pageerror: ${error.message}`));
            page.on('console', message => { if (message.type() === 'error') errors.push(`console: ${message.text()}`); });
            await page.route('**/*', async route => {
              const req = route.request();
              const url = new URL(req.url());
              const path = url.pathname;
              if (!path.startsWith('/api/')) return route.continue();
              if (path === '/api/mobile/snapshot') return route.fulfill(json(snapshot));
              if (path === '/api/mobile/patients') return route.fulfill(json({ data: [] }));
              if (path === '/api/lab-jobs/' || path === '/api/lab-jobs') return route.fulfill(json([]));
              if (path === '/api/mobile/resource-context') return route.fulfill(json(appointmentPayload));
              if (path === '/api/mobile/refresh-token') return route.fulfill(json({}, 401));
              return route.fulfill(json({}));
            });

            await page.goto(`http://127.0.0.1:4190/mobile-m6-g0-before.html?view=${view}`, { waitUntil: 'networkidle' });
            if (view === 'onboarding') await page.getByRole('heading', { name: 'Compagnon Mobile' }).waitFor({ state: 'visible', timeout: 10000 });
            if (view === 'dashboard') await page.getByText('BENNANI Sara', { exact: true }).waitFor({ state: 'visible', timeout: 10000 });
            if (view === 'context') await page.getByRole('heading', { name: 'Rendez-vous', exact: true }).waitFor({ state: 'visible', timeout: 10000 });

            const metrics = await page.evaluate(() => {
              const root = document.documentElement;
              const all = [...document.querySelectorAll('*')];
              const visible = all.filter(el => {
                const rect = el.getBoundingClientRect();
                const style = getComputedStyle(el);
                return rect.width > 0 && rect.height > 0 && style.visibility !== 'hidden' && style.display !== 'none';
              });
              const blurred = visible.filter(el => {
                const style = getComputedStyle(el);
                return style.backdropFilter !== 'none' || style.webkitBackdropFilter !== 'none';
              }).length;
              return {
                scrollWidth: root.scrollWidth,
                clientWidth: root.clientWidth,
                hasHorizontalOverflow: root.scrollWidth > root.clientWidth + 1,
                visibleBackdropBlurCount: blurred,
                bodyText: document.body.innerText.replace(/\s+/g, ' ').trim().slice(0, 1000),
              };
            });

            const name = `${view}-${viewport.width}x${viewport.height}`;
            await page.screenshot({ path: `${output}/${name}.png`, fullPage: false, animations: 'disabled' });
            const record = { name, view, ...viewport, metrics, errors };
            captures.push(record);
            await fs.writeFile(`${output}/${name}.json`, JSON.stringify(record, null, 2));
            await context.close();
          }

          try {
            await capture('onboarding', { width: 390, height: 844 });
            await capture('dashboard', { width: 390, height: 844 });
            await capture('dashboard', { width: 768, height: 1024 });
            await capture('context', { width: 390, height: 844 });
            await capture('context', { width: 768, height: 1024 });
            const report = {
              productHead,
              count: captures.length,
              captures,
              noHorizontalOverflow: captures.every(c => !c.metrics.hasHorizontalOverflow),
              noUnexpectedRuntimeErrors: captures.every(c => c.errors.length === 0),
            };
            await fs.writeFile(`${output}/report.json`, JSON.stringify(report, null, 2));
            console.log(JSON.stringify(report, null, 2));
            if (report.count !== 5 || !report.noHorizontalOverflow || !report.noUnexpectedRuntimeErrors) throw new Error('M6-G0 BEFORE gate failed');
          } finally {
            await browser.close();
            await server.close();
          }
          EOF

      - name: Capture BEFORE
        working-directory: product/frontend
        run: PRODUCT_HEAD="$PRODUCT_HEAD" node mobile-m6-g0-before.mjs

      - name: Upload BEFORE artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobile-m6-g0-glass-before
          path: product/frontend/mobile-m6-g0-before-artifacts/
          if-no-files-found: error
          retention-days: 14
