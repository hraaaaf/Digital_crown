name: P1 Current Glass Audit

on:
  push:
    branches: [audit-20260815-p1-glass-current]
  workflow_dispatch:

jobs:
  screenshots:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        run: npm ci
      - name: Install Chromium
        run: npx -y playwright@1.55.0 install --with-deps chromium
      - name: Start glass audit harness
        run: |
          npm run dev -- --port 4173 > /tmp/p1-glass-vite.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/p1-glass-screens.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/p1-glass-vite.log
          exit 1
      - name: Capture 1440 768 390
        run: |
          mkdir -p p1-glass-screens
          npx -y playwright@1.55.0 screenshot --browser chromium --viewport-size="1440,1100" --full-page --wait-for-timeout=4000 "http://127.0.0.1:4173/p1-glass-screens.html?documentTab=ordonnance" p1-glass-screens/01-ordonnance-glass-1440.png
          npx -y playwright@1.55.0 screenshot --browser chromium --viewport-size="768,1100" --full-page --wait-for-timeout=4000 "http://127.0.0.1:4173/p1-glass-screens.html?documentTab=ordonnance" p1-glass-screens/02-ordonnance-glass-768.png
          npx -y playwright@1.55.0 screenshot --browser chromium --viewport-size="390,844" --full-page --wait-for-timeout=4000 "http://127.0.0.1:4173/p1-glass-screens.html?documentTab=ordonnance" p1-glass-screens/03-ordonnance-glass-390.png
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: p1-current-glass-audit
          path: frontend/p1-glass-screens/*.png
          if-no-files-found: error
