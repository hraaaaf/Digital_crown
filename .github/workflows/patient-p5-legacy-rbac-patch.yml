name: Patient P5 Legacy RBAC Patch

on:
  pull_request:
    branches:
      - agent/patient-page-p4-imagerie
    paths:
      - '.github/workflows/patient-p5-legacy-rbac-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/patient-page-p5-documents'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Wire canonical frontend permission policy
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('frontend/src/features/admin/DocumentHub.tsx')
          text = path.read_text(encoding='utf-8')

          import_marker = "import { useAuthStore } from '../../stores/useAuthStore';"
          import_line = "import { allowedDocumentStudioTabs } from './DocumentStudio/DocumentStudioPermissionPolicy';"
          if import_line not in text:
              if import_marker not in text:
                  raise SystemExit('DocumentHub auth import marker missing')
              text = text.replace(import_marker, import_marker + '\n' + import_line, 1)

          old = '''  const allowedTabs = useMemo<CertifiableDocumentStudioTab[]>(() => {
    const isOwner = !user?.employer_id;
    const has = (permission: string) => isOwner || Boolean(user?.permissions?.[permission]);
    const tabs: CertifiableDocumentStudioTab[] = [];
    if (has('prescriptions')) tabs.push('ordonnance');
    if (has('patients')) tabs.push('certificat');
    if (has('accounting')) tabs.push('devis', 'honoraires', 'echeancier');
    if (has('clinical')) tabs.push('libre');
    return tabs;
  }, [user?.employer_id, user?.permissions]);'''
          new = '''  const allowedTabs = useMemo<CertifiableDocumentStudioTab[]>(
    () => allowedDocumentStudioTabs(user),
    [user],
  );'''
          if old in text:
              text = text.replace(old, new, 1)
          elif 'allowedDocumentStudioTabs(user)' not in text:
              raise SystemExit('DocumentHub legacy allowedTabs block missing')

          path.write_text(text, encoding='utf-8')
          PY
          git diff --check

      - name: Test P5 permission policy and build
        working-directory: frontend
        run: |
          npm ci
          npm test -- --run \
            src/features/admin/DocumentStudio/DocumentStudioPermissionPolicy.p5.test.ts \
            src/features/admin/DocumentStudio/DocumentStudioRbac.p5.test.ts
          npm run build

      - name: Commit P5 legacy RBAC wiring
        run: |
          git config user.name 'digital-crown-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add frontend/src/features/admin/DocumentHub.tsx frontend/src/features/admin/DocumentStudio/DocumentStudioPermissionPolicy.ts frontend/src/features/admin/DocumentStudio/DocumentStudioPermissionPolicy.p5.test.ts
          git diff --cached --quiet && exit 0
          git commit -m 'fix(patient): mirror backend legacy Document Studio RBAC'
          git push origin HEAD:${GITHUB_HEAD_REF}
