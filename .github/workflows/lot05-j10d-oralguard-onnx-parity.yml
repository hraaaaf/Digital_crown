name: LOT05 J10D OralGuard 4-class ONNX CPU parity (experimental)

on:
  pull_request:
    branches: [master]
    paths:
      - 'experiments/lot05_j10d_oralguard_onnx_parity.py'
      - '.github/workflows/lot05-j10d-oralguard-onnx-parity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oralguard-onnx:
    name: OralGuard ONNX CPU tensor parity (experimental)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GIT_TERMINAL_PROMPT: '0'
      ULTRALYTICS_AUTOINSTALL: 'False'
      YOLO_CONFIG_DIR: /tmp/lot05-oralguard-onnx-config
      WANDB_DISABLED: 'true'
      PYTHONUNBUFFERED: '1'
      LOT05_ORALGUARD_ONNX_REPORT: lot05-oralguard-onnx-parity.json
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Pin execution to exact experimental PR head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install throwaway CPU-only inference libraries
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.10.0 torchvision==0.25.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'ultralytics>=8.3.200,<8.4' onnx==1.19.0 onnxruntime==1.23.2 'huggingface_hub>=0.34,<2'
          python -m pip check
      - name: Verify pinned four-class checkpoint, export, ONNX shape and tensor parity
        run: python experiments/lot05_j10d_oralguard_onnx_parity.py
      - name: Retain JSON report only, no weights or medical images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lot05-oralguard-onnx-parity-${{ github.event.pull_request.head.sha || github.sha }}
          path: lot05-oralguard-onnx-parity.json
          if-no-files-found: warn
          retention-days: 30
