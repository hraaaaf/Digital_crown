name: Voluntary Tutorial Visual Certification

on:
  pull_request:
    paths:
      - "frontend/src/features/tutorial/**"
      - "frontend/src/components/Header.tsx"
      - "frontend/src/components/Layout/MainLayout.tsx"
      - "frontend/src/features/dashboard/**"
      - ".github/workflows/voluntary-tutorial-visual-cert.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    name: Tutorial ${{ matrix.role }} ${{ matrix.width }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        role: [admin, secretary]
        width: [1440, 1024, 768, 430, 390]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend and Chromium
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Materialize tutorial visual harness
        working-directory: frontend
        run: |
          cat > voluntary-tutorial-cert.html <<'EOF'
          <!doctype html>
          <html lang="fr">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <title>Voluntary Tutorial Certification</title>
            </head>
            <body>
              <div id="root"></div>
              <script type="module" src="/src/voluntary-tutorial-cert.tsx"></script>
            </body>
          </html>
          EOF

          cat > src/voluntary-tutorial-cert.tsx <<'EOF'
          import React from 'react';
          import { createRoot } from 'react-dom/client';
          import { MemoryRouter } from 'react-router-dom';
          import './index.css';
          import { TutorialHelpButton, VoluntaryTutorialPanel } from './features/tutorial/VoluntaryTutorial';
          import { useAuthStore } from './stores/useAuthStore';

          const role = new URLSearchParams(window.location.search).get('role') === 'secretary'
            ? 'SECRETAIRE'
            : 'ADMIN';

          const user = role === 'ADMIN'
            ? {
                id: 1,
                email: 'admin@tutorial.local',
                nom_complet: 'Dr Tutorial',
                role: 'ADMIN',
                is_superadmin: false,
                permissions: {},
              }
            : {
                id: 2,
                email: 'secretariat@tutorial.local',
                nom_complet: 'Secrétariat Tutorial',
                role: 'SECRETAIRE',
                is_superadmin: false,
                permissions: {},
              };

          useAuthStore.setState({
            user: user as any,
            isAuthenticated: true,
            isLoading: false,
            error: null,
          });

          createRoot(document.getElementById('root')!).render(
            <React.StrictMode>
              <MemoryRouter initialEntries={['/dashboard']}>
                <div className="min-h-screen bg-medical-pearl text-main">
                  <header className="h-20 bg-transparent flex items-center justify-end gap-6 px-4 sm:px-8 shrink-0 relative z-[1000]">
                    <TutorialHelpButton />
                  </header>
                  <main className="max-w-[1600px] mx-auto w-full px-6 py-8 md:px-10 md:py-10 space-y-8">
                    <section className="flex flex-col gap-5 sm:flex-row sm:items-end sm:justify-between">
                      <div>
                        <p className="text-xs font-black uppercase tracking-[0.18em] text-primary">Digital Crown</p>
                        <h1 className="mt-2 text-3xl font-black">Bonjour, {role === 'ADMIN' ? 'Dr Tutorial' : 'Secrétariat Tutorial'}</h1>
                        <p className="mt-2 text-sm text-text-muted">Votre activité clinique, sans interruption automatique.</p>
                      </div>
                      <button
                        type="button"
                        aria-label="Chercher un patient"
                        className="min-h-11 rounded-2xl border border-border-main bg-card-bg px-4 py-3 text-sm font-bold text-text-muted shadow-elite"
                      >
                        Chercher un patient
                      </button>
                    </section>
                    <section className="grid grid-cols-1 gap-4 md:grid-cols-3">
                      {['Patients', 'Agenda', 'Activité récente'].map(label => (
                        <div key={label} className="min-h-36 rounded-3xl border border-border-main bg-card-bg/80 p-5 shadow-elite">
                          <p className="text-xs font-black uppercase tracking-wider text-text-muted">{label}</p>
                          <div className="mt-5 h-3 w-2/3 rounded-full bg-primary/10" />
                          <div className="mt-3 h-3 w-1/2 rounded-full bg-primary/10" />
                        </div>
                      ))}
                    </section>
                    <section className="rounded-3xl border border-border-main bg-card-bg/70 p-6 shadow-elite">
                      <p className="text-sm font-black">Pilotage du cabinet</p>
                      <p className="mt-2 text-sm text-text-muted">Surface de référence stable pour la certification du guide volontaire.</p>
                    </section>
                  </main>
                  <VoluntaryTutorialPanel />
                </div>
              </MemoryRouter>
            </React.StrictMode>,
          );
          EOF

          cat > voluntary-tutorial-cert.mjs <<'EOF'
          import { chromium } from 'playwright';
          import { createServer } from 'vite';
          import fs from 'node:fs/promises';

          const role = process.env.ROLE;
          const width = Number(process.env.WIDTH);
          const output = 'voluntary-tutorial-artifacts';
          await fs.mkdir(output, { recursive: true });

          const server = await createServer({
            server: { host: '127.0.0.1', port: 4188, strictPort: true },
            clearScreen: false,
          });
          await server.listen();

          const browser = await chromium.launch();
          try {
            const context = await browser.newContext({ viewport: { width, height: 1200 } });
            await context.addInitScript(() => {
              localStorage.setItem('digitalcrown_voluntary_tutorial_v1', JSON.stringify({
                dashboard: { step: 0, status: 'paused' },
              }));
            });
            const page = await context.newPage();

            const errors = [];
            page.on('pageerror', error => errors.push(`pageerror: ${error.message}`));
            page.on('console', message => { if (message.type() === 'error') errors.push(`console: ${message.text()}`); });

            await page.goto(`http://127.0.0.1:4188/voluntary-tutorial-cert.html?role=${role}`, { waitUntil: 'networkidle' });
            const helpEntry = page.locator('[data-guide="help-entry"]');
            await helpEntry.waitFor({ state: 'visible', timeout: 15000 });

            if (await page.getByLabel('Guide volontaire').count() !== 0) {
              throw new Error('Guide auto-opened despite voluntary-only invariant');
            }

            await helpEntry.click();
            const panel = page.getByLabel('Guide volontaire');
            await panel.waitFor({ state: 'visible' });
            await page.screenshot({ path: `${output}/${role}-${width}-panel.png`, fullPage: true, animations: 'disabled' });

            await panel.getByRole('button', { name: 'Reprendre', exact: true }).click();
            await panel.getByText('Retrouver un patient', { exact: true }).waitFor({ state: 'visible' });
            await page.screenshot({ path: `${output}/${role}-${width}-active.png`, fullPage: true, animations: 'disabled' });

            await panel.getByRole('button', { name: 'Reprendre plus tard', exact: true }).click();
            if (await page.getByLabel('Guide volontaire').count() !== 0) throw new Error('Pause did not close guide');

            await page.reload({ waitUntil: 'networkidle' });
            if (await page.getByLabel('Guide volontaire').count() !== 0) throw new Error('Guide reopened automatically after refresh');

            await fs.writeFile(`${output}/${role}-${width}.errors.txt`, errors.join('\n'));
            if (errors.length > 0) throw new Error(errors.join('\n'));
            await context.close();
          } finally {
            await browser.close();
            await server.close();
          }
          EOF

      - name: Capture and assert voluntary tutorial
        working-directory: frontend
        env:
          ROLE: ${{ matrix.role }}
          WIDTH: ${{ matrix.width }}
        run: node voluntary-tutorial-cert.mjs

      - name: Upload tutorial visual proof
        uses: actions/upload-artifact@v4
        with:
          name: voluntary-tutorial-${{ matrix.role }}-${{ matrix.width }}
          path: frontend/voluntary-tutorial-artifacts/
          if-no-files-found: error
