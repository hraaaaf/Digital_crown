name: Voluntary Tutorial Visual Certification

on:
  pull_request:
    paths:
      - "frontend/src/features/tutorial/**"
      - "frontend/src/components/Header.tsx"
      - "frontend/src/components/Layout/MainLayout.tsx"
      - "frontend/src/features/dashboard/**"
      - ".github/workflows/voluntary-tutorial-visual-cert.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    name: Tutorial ${{ matrix.role }} ${{ matrix.width }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        role: [admin, secretary]
        width: [1440, 1024, 768, 430, 390]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend and Chromium
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Materialize tutorial visual harness
        working-directory: frontend
        run: |
          cat > voluntary-tutorial-cert.html <<'EOF'
          <!doctype html>
          <html lang="fr">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <title>Voluntary Tutorial Certification</title>
            </head>
            <body>
              <div id="root"></div>
              <script type="module" src="/src/voluntary-tutorial-cert.tsx"></script>
            </body>
          </html>
          EOF

          cat > src/voluntary-tutorial-cert.tsx <<'EOF'
          import React from 'react';
          import { createRoot } from 'react-dom/client';
          import { MemoryRouter } from 'react-router-dom';
          import './index.css';
          import { Header } from './components/Header';
          import { Dashboard } from './pages/Dashboard';
          import { VoluntaryTutorialPanel } from './features/tutorial/VoluntaryTutorial';
          import { useAuthStore } from './stores/useAuthStore';

          const role = new URLSearchParams(window.location.search).get('role') === 'secretary'
            ? 'SECRETAIRE'
            : 'ADMIN';

          const user = role === 'ADMIN'
            ? {
                id: 1,
                email: 'admin@tutorial.local',
                nom_complet: 'Dr Tutorial',
                role: 'ADMIN',
                is_superadmin: false,
                permissions: {},
              }
            : {
                id: 2,
                email: 'secretariat@tutorial.local',
                nom_complet: 'Secrétariat Tutorial',
                role: 'SECRETAIRE',
                is_superadmin: false,
                permissions: {},
              };

          useAuthStore.setState({
            user: user as any,
            isAuthenticated: true,
            isLoading: false,
            error: null,
          });

          createRoot(document.getElementById('root')!).render(
            <React.StrictMode>
              <MemoryRouter initialEntries={['/dashboard']}>
                <div className="min-h-screen bg-medical-pearl">
                  <Header />
                  <main className="px-4 sm:px-8 pb-10">
                    <Dashboard />
                  </main>
                  <VoluntaryTutorialPanel />
                </div>
              </MemoryRouter>
            </React.StrictMode>,
          );
          EOF

          cat > voluntary-tutorial-cert.mjs <<'EOF'
          import { chromium } from 'playwright';
          import { createServer } from 'vite';
          import fs from 'node:fs/promises';

          const role = process.env.ROLE;
          const width = Number(process.env.WIDTH);
          const output = 'voluntary-tutorial-artifacts';
          await fs.mkdir(output, { recursive: true });

          const server = await createServer({
            server: { host: '127.0.0.1', port: 4188, strictPort: true },
            clearScreen: false,
          });
          await server.listen();

          const browser = await chromium.launch();
          try {
            const context = await browser.newContext({ viewport: { width, height: 1200 } });
            await context.addInitScript(() => {
              localStorage.setItem('digitalcrown_voluntary_tutorial_v1', JSON.stringify({
                dashboard: { step: 0, status: 'paused' },
              }));
              localStorage.setItem('active_cabinet_id', 'benmoussa');
            });
            const page = await context.newPage();

            await page.route('**/*', async route => {
              const request = route.request();
              const url = new URL(request.url());
              if (url.port !== '8005' || !url.pathname.startsWith('/api/')) return route.continue();

              const fixtures = {
                '/api/admin/dashboard/stats': { total_patients: 184, total_analyses: 326, in_waiting: 2, weekly_activity: [38,55,47,72,61,84,66], weekly_patient_counts: [4,7,5,9,6,10,8], weekly_patients: 49, recent_patients: [] },
                '/api/admin/cabinet/me': { nom_cabinet: 'Cabinet Tutorial', header_lines_fr: ['Dr Tutorial'] },
                '/api/accounting/treasury-hub': { pending_count: 0 },
                '/api/intelligence/alerts/today': { alerts: [] },
                '/api/intelligence/forecast-semaine': {},
                '/api/intelligence/taux-conversion': {},
                '/api/intelligence/projection-mensuelle': {},
                '/api/intelligence/latent-cash': { total_opportunites: 0, valeur_totale_latente: 0, opportunites: [] },
                '/api/stats/financial': { today_revenue: 6200, month_revenue: 48600, total_debt: 9300 },
                '/api/admin/cabinet-health': { database: { status: 'ok' }, disk: { status: 'ok' }, backup_local: { status: 'ok' }, offsite: { status: 'ok' }, overall_severity: 'ok' },
                '/api/appointments/': [],
                '/api/patients/': [],
              };
              return route.fulfill({ status: 200, contentType: 'application/json', body: JSON.stringify(fixtures[url.pathname] ?? {}) });
            });

            const errors = [];
            page.on('pageerror', error => errors.push(`pageerror: ${error.message}`));
            page.on('console', message => { if (message.type() === 'error') errors.push(`console: ${message.text()}`); });

            await page.goto(`http://127.0.0.1:4188/voluntary-tutorial-cert.html?role=${role}`, { waitUntil: 'networkidle' });
            await page.getByText(/Bonjour,/).first().waitFor({ state: 'visible', timeout: 15000 });

            // Negative proof: persisted progress must never auto-open the guide.
            if (await page.getByLabel('Guide volontaire').count() !== 0) {
              throw new Error('Guide auto-opened despite voluntary-only invariant');
            }

            const helpEntry = page.locator('[data-guide="help-entry"]');
            await helpEntry.waitFor({ state: 'visible', timeout: 15000 });
            await helpEntry.click();
            await page.getByLabel('Guide volontaire').waitFor({ state: 'visible' });
            await page.screenshot({ path: `${output}/${role}-${width}-panel.png`, fullPage: true, animations: 'disabled' });

            await page.getByText('Découvrir le dashboard').locator('..').locator('..').getByRole('button').click();
            await page.getByText('Retrouver un patient').waitFor({ state: 'visible' });
            await page.screenshot({ path: `${output}/${role}-${width}-active.png`, fullPage: true, animations: 'disabled' });

            await page.getByRole('button', { name: 'Reprendre plus tard' }).click();
            if (await page.getByLabel('Guide volontaire').count() !== 0) throw new Error('Pause did not close guide');

            await page.reload({ waitUntil: 'networkidle' });
            if (await page.getByLabel('Guide volontaire').count() !== 0) throw new Error('Guide reopened automatically after refresh');

            await fs.writeFile(`${output}/${role}-${width}.errors.txt`, errors.join('\n'));
            if (errors.length > 0) throw new Error(errors.join('\n'));
            await context.close();
          } finally {
            await browser.close();
            await server.close();
          }
          EOF

      - name: Capture and assert voluntary tutorial
        working-directory: frontend
        env:
          ROLE: ${{ matrix.role }}
          WIDTH: ${{ matrix.width }}
        run: node voluntary-tutorial-cert.mjs

      - name: Upload tutorial visual proof
        uses: actions/upload-artifact@v4
        with:
          name: voluntary-tutorial-${{ matrix.role }}-${{ matrix.width }}
          path: frontend/voluntary-tutorial-artifacts/
          if-no-files-found: error
