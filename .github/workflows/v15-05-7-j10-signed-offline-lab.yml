name: V1.5-05.7-J10 Signed Offline Multi-component FAKE
on:
  push:
    branches:
      - feat/v15-05-7j10-signed-offline-recovery-20261019
  pull_request:
    paths:
      - backend/services/legacy_migration_j10_signed_offline_lab_v15.py
      - backend/tests/test_legacy_sql_057j10_signed_lab.py
      - .github/workflows/v15-05-7-j10-signed-offline-lab.yml
      - docs/quality/V15_05_7_J10_SIGNED_OFFLINE_LAB_CONTRACT.md
      - techdoubt.md
  workflow_dispatch:
permissions:
  contents: read
jobs:
  j10:
    name: J10 genuine RSA signed offline restore fake
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        py: ['3.11', '3.12']
    env:
      LOT05J10_SIGNED_OFFLINE_FAKE_ONLY: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.py }}
      - name: Install genuine RSA crypto library
        shell: bash
        run: python -m pip install cryptography==49.0.0
      - name: Run 16 real signed WAL media/vault fake tests
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile backend/services/legacy_migration_j10_signed_offline_lab_v15.py backend/tests/test_legacy_sql_057j10_signed_lab.py
          PYTHONPATH=. python -B backend/tests/test_legacy_sql_057j10_signed_lab.py -v 2>&1 | tee j10.log
          grep -q '^Ran 16 tests' j10.log
          grep -Eq '^OK[[:space:]]*$' j10.log
          ! grep -E '^FAILED \(|skipped=[0-9]+|^ERROR: test_' j10.log
      - name: Exact SHA and J10 5 path scope
        shell: bash
        env:
          BASE_SHA: 3756de8841f1f5234616e650d1c7afad598fefd5
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git diff --exit-code "$BASE_SHA" HEAD -- backend/main.py backend/database.py backend/models.py backend/routers alembic frontend backend/services/guided_restore.py backend/services/guided_restore_worker.py
          git diff --name-only "$BASE_SHA" HEAD | sort > actual.txt
          printf '%s\n' '.github/workflows/v15-05-7-j10-signed-offline-lab.yml' 'backend/services/legacy_migration_j10_signed_offline_lab_v15.py' 'backend/tests/test_legacy_sql_057j10_signed_lab.py' 'docs/quality/V15_05_7_J10_SIGNED_OFFLINE_LAB_CONTRACT.md' 'techdoubt.md' | sort > expected.txt
          diff -u expected.txt actual.txt
