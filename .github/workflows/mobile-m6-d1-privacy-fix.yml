name: Mobile M6-D1 Privacy Fix Prep

on:
  push:
    branches:
      - "audit/mobile-m6-d1-privacy-fix-20260825"
    paths:
      - ".github/workflows/mobile-m6-d1-privacy-fix.yml"

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    env:
      PRODUCT_BRANCH: mobile/m6-d1-notification-center
      EXPECTED_HEAD: e0b684e5b8962b4914fb8aedcb9f7fe47dcc8ab5
    steps:
      - name: Checkout audit harness
        uses: actions/checkout@v4
        with:
          path: audit
      - name: Checkout exact product branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PRODUCT_BRANCH }}
          path: product
          fetch-depth: 0
      - name: Assert exact starting HEAD
        run: test "$(git -C product rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Apply permission-aware notification policy
        working-directory: product
        run: |
          python - <<'PY'
          from pathlib import Path

          mobile = Path('backend/routers/mobile.py')
          text = mobile.read_text(encoding='utf-8')

          marker = "def _serialize_mobile_notification(alert) -> dict:\n"
          helper = '''_FINANCIAL_NOTIFICATION_PREFIXES = (\n    "OVERDUE_PAYMENT",\n    "HIGH_VALUE_RISK",\n    "ORTHO_SEMESTER_",\n)\n\n\ndef _mobile_notification_allowed(user: models.User, alert) -> bool:\n    alert_type = str(getattr(alert, "alert_type", "") or "")\n    if alert_type.startswith(_FINANCIAL_NOTIFICATION_PREFIXES):\n        return has_permission(user, ["accounting", "payments"])\n    return True\n\n\n'''
          if helper not in text:
              text = text.replace(marker, helper + marker, 1)

          old_query = '''    alerts = (\n        db.query(models.ProactiveAlert)\n        .outerjoin(models.Patient, models.ProactiveAlert.patient_id == models.Patient.id)\n        .options(contains_eager(models.ProactiveAlert.patient))\n        .filter(\n            models.ProactiveAlert.employer_id == employer_id,\n            models.ProactiveAlert.is_read == False,  # noqa: E712\n            or_(models.ProactiveAlert.expires_at.is_(None), models.ProactiveAlert.expires_at > now),\n            or_(models.ProactiveAlert.patient_id.is_(None), models.Patient.deleted_at.is_(None)),\n            or_(models.ProactiveAlert.snoozed_until.is_(None), models.ProactiveAlert.snoozed_until <= now),\n        )\n        .order_by(models.ProactiveAlert.priority, models.ProactiveAlert.created_at.desc())\n        .limit(20)\n        .all()\n    )\n'''
          new_query = '''    query = (\n        db.query(models.ProactiveAlert)\n        .outerjoin(models.Patient, models.ProactiveAlert.patient_id == models.Patient.id)\n        .options(contains_eager(models.ProactiveAlert.patient))\n        .filter(\n            models.ProactiveAlert.employer_id == employer_id,\n            models.ProactiveAlert.is_read == False,  # noqa: E712\n            or_(models.ProactiveAlert.expires_at.is_(None), models.ProactiveAlert.expires_at > now),\n            or_(models.ProactiveAlert.patient_id.is_(None), models.Patient.deleted_at.is_(None)),\n            or_(models.ProactiveAlert.snoozed_until.is_(None), models.ProactiveAlert.snoozed_until <= now),\n        )\n    )\n    if not has_permission(mobile_user, ["accounting", "payments"]):\n        query = query.filter(\n            ~or_(*[\n                models.ProactiveAlert.alert_type.like(f"{prefix}%")\n                for prefix in _FINANCIAL_NOTIFICATION_PREFIXES\n            ])\n        )\n    alerts = (\n        query\n        .order_by(models.ProactiveAlert.priority, models.ProactiveAlert.created_at.desc())\n        .limit(20)\n        .all()\n    )\n'''
          if old_query not in text:
              raise SystemExit('notification listing block not found')
          text = text.replace(old_query, new_query, 1)

          old_guard = "    if not alert:\n        raise HTTPException(status_code=404, detail='Notification introuvable')\n"
          new_guard = "    if not alert or not _mobile_notification_allowed(mobile_user, alert):\n        raise HTTPException(status_code=404, detail='Notification introuvable')\n"
          if text.count(old_guard) != 2:
              raise SystemExit(f'expected 2 mutation guards, got {text.count(old_guard)}')
          text = text.replace(old_guard, new_guard)
          mobile.write_text(text, encoding='utf-8')

          tests = Path('backend/tests/test_mobile_m6d_notifications.py')
          t = tests.read_text(encoding='utf-8')
          addition = '''\n\ndef test_mobile_financial_notifications_require_finance_permission():\n    financial = SimpleNamespace(alert_type='OVERDUE_PAYMENT_42')\n    ortho_fee = SimpleNamespace(alert_type='ORTHO_SEMESTER_2_REMINDER')\n    clinical = SimpleNamespace(alert_type='ORTHO_GAP')\n    stock = SimpleNamespace(alert_type='STOCK_COMPOSITE')\n\n    patient_only = SimpleNamespace(\n        email='employee@example.test', role='DENTISTE', employer_id=1,\n        permissions={'patients': True, 'accounting': False, 'payments': False},\n    )\n    finance_user = SimpleNamespace(\n        email='finance@example.test', role='DENTISTE', employer_id=1,\n        permissions={'patients': True, 'accounting': True, 'payments': False},\n    )\n\n    assert mobile._mobile_notification_allowed(patient_only, financial) is False\n    assert mobile._mobile_notification_allowed(patient_only, ortho_fee) is False\n    assert mobile._mobile_notification_allowed(patient_only, clinical) is True\n    assert mobile._mobile_notification_allowed(patient_only, stock) is True\n    assert mobile._mobile_notification_allowed(finance_user, financial) is True\n\n\ndef test_mobile_listing_filters_financial_types_before_limit_and_mutations_fail_closed():\n    listing = inspect.getsource(mobile.get_mobile_notifications)\n    reading = inspect.getsource(mobile.mark_mobile_notification_read)\n    snoozing = inspect.getsource(mobile.snooze_mobile_notification)\n\n    assert 'if not has_permission(mobile_user, ["accounting", "payments"])' in listing\n    assert 'models.ProactiveAlert.alert_type.like' in listing\n    assert listing.index('models.ProactiveAlert.alert_type.like') < listing.index('.limit(20)')\n    for source in (reading, snoozing):\n        assert 'not _mobile_notification_allowed(mobile_user, alert)' in source\n        assert "status_code=404" in source\n'''
          if 'test_mobile_financial_notifications_require_finance_permission' not in t:
              tests.write_text(t + addition, encoding='utf-8')
          PY
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: product/requirements.txt
      - name: Install explicit test environment
        working-directory: product
        run: |
          pip install -r requirements.txt
          pip install pytest
      - name: Run M6-D1 backend tests
        working-directory: product
        env:
          ENVIRONMENT: test
          SECRET_KEY: test-secret-key-for-ci-only
        run: python -m pytest -q backend/tests/test_mobile_m6d_notifications.py
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: product/frontend/package-lock.json
      - name: Frontend tests and build
        working-directory: product/frontend
        run: |
          npm ci
          npx vitest run src/test/mobileM6D1Notifications.test.tsx
          npm run build
      - name: Verify exact scope
        working-directory: product
        run: |
          git diff --check
          test "$(git status --short | wc -l)" -eq 2
          git status --short | grep -F 'backend/routers/mobile.py'
          git status --short | grep -F 'backend/tests/test_mobile_m6d_notifications.py'
      - name: Create and push one product commit
        working-directory: product
        run: |
          git config user.name "hraaaaf"
          git config user.email "123034021+hraaaaf@users.noreply.github.com"
          git add backend/routers/mobile.py backend/tests/test_mobile_m6d_notifications.py
          git commit -m "fix(mobile): enforce notification domain permissions"
          git push origin HEAD:${PRODUCT_BRANCH}
