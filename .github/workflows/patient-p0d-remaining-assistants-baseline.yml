name: Patient P0-D Remaining Assistants Baseline

on:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/patient-p0d-remaining-assistants-baseline.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ENVIRONMENT: test
      SECRET_KEY: patient-p0d-remaining-baseline-secret-000001
      DATABASE_URL: sqlite:///./t2-runtime-cert.db
      TELEMETRY_ENABLED: 'false'
      CLOUD_AI_ENABLED: 'false'
      DEBUG: 'false'
      ALLOWED_ORIGINS: 'http://127.0.0.1:5173,http://localhost:5173'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.12.0 torchvision==0.27.0 --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^(torch|torchvision)([<=>].*)?$' requirements.txt > /tmp/requirements-p0d-baseline.txt
          pip install -r /tmp/requirements-p0d-baseline.txt
          pip install httpx==0.27.2
      - name: Install frontend and Chromium
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start isolated backend
        run: |
          rm -f t2-runtime-cert.db
          python scripts/t2_runtime_server.py > /tmp/p0d-baseline-backend.log 2>&1 &
          for i in {1..90}; do if curl -fsS http://127.0.0.1:8005/health >/dev/null; then exit 0; fi; sleep 1; done
          cat /tmp/p0d-baseline-backend.log
          exit 1
      - name: Start frontend
        working-directory: frontend
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 > /tmp/p0d-baseline-front.log 2>&1 &
          for i in {1..90}; do if curl -fsS http://127.0.0.1:5173 >/dev/null; then exit 0; fi; sleep 1; done
          cat /tmp/p0d-baseline-front.log
          exit 1
      - name: Capture representative unsafe outputs BEFORE
        working-directory: frontend
        run: |
          mkdir -p ../artifacts/p0d-remaining-before
          cat > .p0d-remaining-before.mjs <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import { chromium, request } from 'playwright';
          const out=path.resolve('../artifacts/p0d-remaining-before');
          const viewports=[{width:390,height:844},{width:430,height:932},{width:768,height:1024},{width:1280,height:900}];
          const assistants=[
            {id:'atm', card:/Occlusodontie & ATM/i, unsafe:[/DAM/i,/Gouttière/i,/CBCT/i,/IRM/i,/Myorelaxant/i]},
            {id:'ortho', card:/Orthodontie \(ODF\)/i, unsafe:[/Aligneur/i,/Multi-attaches/i,/Appareillage/i,/Chirurgie Maxillo/i]},
            {id:'paro', card:/Parodontologie/i, unsafe:[/Antibiothérapie/i,/Chirurgie parodontale/i,/Stade/i,/Grade/i]},
            {id:'prothese', card:/Prothèse & Esthétique/i, unsafe:[/Implant/i,/Couronne/i,/Facette/i,/Prothèse/i]},
          ];
          const api=await request.newContext({baseURL:'http://127.0.0.1:8005'});
          const login=await api.post('/api/auth/login',{form:{username:'t2-browser@cabinet.ma',password:'T2BrowserPass123!'}}); if(!login.ok()) throw new Error(await login.text());
          const tok=await login.json();
          const ps=await api.get('/api/patients',{headers:{Authorization:`Bearer ${tok.access_token}`}}); if(!ps.ok()) throw new Error(await ps.text());
          const patient=(await ps.json()).find(p=>p.numero_dossier==='T2-0001'); if(!patient) throw new Error('T2 patient missing');
          const browser=await chromium.launch({headless:true}); const evidence=[];
          for(const assistant of assistants){
            for(const viewport of viewports){
              const ctx=await browser.newContext({viewport,colorScheme:'light'}); const page=await ctx.newPage();
              await page.addInitScript(({a,r})=>{localStorage.setItem('token',a);localStorage.setItem('refresh_token',r||'');localStorage.setItem('appMode','prod');},{a:tok.access_token,r:tok.refresh_token});
              const errors=[]; const http5xx=[]; page.on('pageerror',e=>errors.push(String(e))); page.on('response',r=>{if(r.status()>=500)http5xx.push({url:r.url(),status:r.status()});});
              await page.goto(`http://127.0.0.1:5173/patients/${patient.id}?tab=clinical`,{waitUntil:'networkidle',timeout:90000}); await page.waitForTimeout(500);
              const card=page.getByText(assistant.card).first(); await card.waitFor({state:'visible',timeout:15000}); await card.click();
              for(let guard=0;guard<12;guard++){
                const cancel=page.getByRole('button',{name:/Annuler/i});
                const proposal=page.getByText(/Proposition clinique à valider/i);
                if(await proposal.count()) break;
                if(!(await cancel.count())) break;
                const root=cancel.first().locator('xpath=ancestor::div[contains(@class,"flex")][1]');
                const buttons=page.locator('button').filter({hasNotText:/Annuler|Retour|Fermer|Plan|Payer/i});
                let clicked=false;
                const n=await buttons.count();
                for(let i=0;i<n;i++){
                  const b=buttons.nth(i);
                  if(await b.isVisible().catch(()=>false)){
                    const txt=(await b.innerText().catch(()=>'' )).trim();
                    if(txt && !/Examen|Parodontologie|Endodontie|Prothèse|Chirurgie|Pédodontie|Orthodontie|ATM|Médecine|Protocoles|Statut Dentaire/i.test(txt)){
                      await b.click(); clicked=true; await page.waitForTimeout(450); break;
                    }
                  }
                }
                if(!clicked) break;
              }
              await page.waitForTimeout(1800);
              const body=await page.locator('body').innerText();
              const unsafeMatches=assistant.unsafe.filter(rx=>rx.test(body)).map(rx=>String(rx));
              const screenshot=`${assistant.id}-before-${viewport.width}x${viewport.height}.png`; await page.screenshot({path:path.join(out,screenshot),fullPage:false});
              const metrics=await page.evaluate(()=>({scrollWidth:document.documentElement.scrollWidth,clientWidth:document.documentElement.clientWidth,noHorizontalOverflow:document.documentElement.scrollWidth<=document.documentElement.clientWidth+2}));
              evidence.push({assistant:assistant.id,viewport,unsafeMatches,metrics,errors,http5xx,screenshot}); await ctx.close();
            }
          }
          const summary={captures:evidence.length,assistants:[...new Set(evidence.map(x=>x.assistant))],unsafeObserved:evidence.filter(x=>x.unsafeMatches.length),overflowFindings:evidence.filter(x=>!x.metrics.noHorizontalOverflow),runtimeErrors:evidence.filter(x=>x.errors.length),http5xx:evidence.filter(x=>x.http5xx.length)};
          fs.writeFileSync(path.join(out,'evidence.json'),JSON.stringify(evidence,null,2)); fs.writeFileSync(path.join(out,'summary.json'),JSON.stringify(summary,null,2)); await browser.close(); await api.dispose();
          if(summary.captures!==16||summary.runtimeErrors.length||summary.http5xx.length) process.exit(1);
          JS
          node .p0d-remaining-before.mjs
          rm .p0d-remaining-before.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: patient-p0d-remaining-before
          path: artifacts/p0d-remaining-before
          if-no-files-found: error
          retention-days: 14
