name: Mobile M6-D2 AFTER

on:
  push:
    branches:
      - "audit/mobile-m6-d2-after-20260826"
    paths:
      - ".github/workflows/mobile-m6-d2-after.yml"
      - ".audit/mobile-m6-d2-after.html"
      - ".audit/mobile-m6-d2-after.tsx"
      - ".audit/mobile-m6-d2-after.mjs"

permissions:
  contents: read

jobs:
  after:
    name: Exact-head device-bound push certification
    runs-on: ubuntu-latest
    env:
      PRODUCT_HEAD: ec7e1b54b1a08a02fc67e0bf87a5e30954c8b3d9
    steps:
      - name: Checkout audit harness
        uses: actions/checkout@v4
        with:
          path: audit
      - name: Checkout exact product HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PRODUCT_HEAD }}
          path: product
      - name: Assert exact product HEAD
        run: test "$(git -C product rev-parse HEAD)" = "$PRODUCT_HEAD"
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: product/frontend/package-lock.json
      - name: Install frontend and Chromium
        working-directory: product/frontend
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Targeted M6-D2 frontend test
        working-directory: product/frontend
        run: npx vitest run src/test/mobileM6D2Push.test.ts
      - name: Materialize AFTER harness outside product commit
        run: |
          cp audit/.audit/mobile-m6-d2-after.html product/frontend/mobile-m6-d2-after.html
          cp audit/.audit/mobile-m6-d2-after.tsx product/frontend/src/mobile-m6-d2-after.tsx
          cp audit/.audit/mobile-m6-d2-after.mjs product/frontend/mobile-m6-d2-after.mjs
      - name: Capture and exercise M6-D2 AFTER
        working-directory: product/frontend
        run: node mobile-m6-d2-after.mjs
      - name: Upload AFTER evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-m6-d2-after
          path: product/frontend/mobile-m6-d2-after-artifacts
          retention-days: 14
