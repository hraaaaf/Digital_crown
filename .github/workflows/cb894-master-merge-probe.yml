name: CB-894 isolated clinical merge repair CI
on:
  pull_request:
    branches: [master]
    paths:
      - .github/workflows/cb894-master-merge-probe.yml
      - docs/crown-bot/techdoubt.md
      - scripts/ci/cb894_reconcile_clinical_conflicts.py
permissions:
  contents: write
jobs:
  cb894-merge-conflicts:
    name: Prove isolated clinical merge, Pocket and Agenda regressions
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == true
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      SECRET_KEY: ci-only-secret-key-minimum-32-characters-long
      DATABASE_URL: 'sqlite:///:memory:'
      ENVIRONMENT: test
      DIGITALCROWN_ISOLATED_RUNTIME: 'true'
      TELEMETRY_ENABLED: 'false'
      CLOUD_AI_ENABLED: 'false'
      CROWN_BOT_DETERMINISTIC_WORKFLOWS_ENABLED: 'false'
      EXPECTED_CHECKOUT: ${{ github.event.pull_request.head.sha }}
      EXPECTED_MASTER_SHA: b6eafd2cec5516a64c5d8013ffd3b3f54430000f
      EXPECTED_SOURCE_SHA: 9cf19e68026fa92d31fb704f5b81b9cd667e5254
      SOURCE_BRANCH: feat/crown-bot-zero-llm-adapter-safe-20261014
      EXPECTED_REPO: hraaaaf/Digital_crown
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact isolated HEAD and unchanged master source
        shell: bash
        env:
          EXPECTED_CHECKOUT: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPO"
          test "$EXPECTED_BASE" = "master"
          test "$(git rev-parse HEAD)" = "$EXPECTED_CHECKOUT"
          test -z "$(git status --porcelain)"
          git fetch --no-tags origin master
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_MASTER_SHA" || { echo 'REFUSED: master changed; start new diagnostic'; exit 1; }
          test "$(git merge-base HEAD "$EXPECTED_MASTER_SHA")" = "$EXPECTED_MASTER_SHA"
          git fetch --no-tags origin "$SOURCE_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_SOURCE_SHA" || { echo 'REFUSED: PR #894 HEAD changed'; exit 1; }
          echo "Exact isolated diagnostic HEAD: $EXPECTED_CHECKOUT" >> "$GITHUB_STEP_SUMMARY"
      - name: Dry-run real Git merge and list exact conflicts (expected RED)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cb894-merge-diagnostic
          printf 'target-master=%s\nsource-894=%s\nhead=%s\n' "$EXPECTED_MASTER_SHA" "$EXPECTED_SOURCE_SHA" "$(git rev-parse HEAD)" > cb894-merge-diagnostic/summary.txt
          set +e
          git -c user.name='CB894 Diagnostic' -c user.email='cb894-diagnostic@invalid.example' merge --no-commit --no-ff "$EXPECTED_SOURCE_SHA" > cb894-merge-diagnostic/merge-log.txt 2>&1
          result=$?
          set -e
          git diff --name-only --diff-filter=U > cb894-merge-diagnostic/conflicts.txt
          count=$(wc -l < cb894-merge-diagnostic/conflicts.txt | tr -d ' ')
          printf 'merge-exit=%s\nunmerged-path-count=%s\n' "$result" "$count" >> cb894-merge-diagnostic/summary.txt
          cat cb894-merge-diagnostic/summary.txt >> "$GITHUB_STEP_SUMMARY"
          if test "$count" -gt 0; then
            echo 'BLOCKED: actual unresolved paths' >> "$GITHUB_STEP_SUMMARY"
            cat cb894-merge-diagnostic/conflicts.txt >> "$GITHUB_STEP_SUMMARY"
          fi
          python - <<'PY'
          from pathlib import Path
          import re
          root = Path('cb894-merge-diagnostic')
          paths = [x.strip() for x in (root / 'conflicts.txt').read_text().splitlines() if x.strip()]
          out = []
          for name in paths:
              src = Path(name).read_text(encoding='utf-8').splitlines()
              beginnings = [i for i, line in enumerate(src) if line.startswith('<<<<<<< ')]
              if not beginnings:
                  out.append(f'{name}: no conflict markers despite unmerged index')
                  continue
              for start in beginnings:
                  end = next((i for i in range(start + 1, len(src)) if src[i].startswith('>>>>>>> ')), None)
                  if end is None:
                      out.append(f'{name}:{start + 1}: unterminated conflict')
                      continue
                  lo, hi = max(0, start - 7), min(len(src), end + 8)
                  out.append(f'--- {name} conflict lines {start + 1}-{end + 1}, context {lo + 1}-{hi} ---')
                  out.extend(f'{j+1:05}: {src[j]}' for j in range(lo, hi))
          (root / 'conflict-hunks.txt').write_text('\n'.join(out) + '\n', encoding='utf-8')
          PY
          if test "$result" -ne 1 || test "$count" -ne 2; then
            echo 'REFUSED: unexpected Git merge result'
            git merge --abort || true
            exit 1
          fi
          python scripts/ci/cb894_reconcile_clinical_conflicts.py
          python -m compileall -q backend/routers/appointments.py backend/routers/frontdesk.py backend/tests/test_mobile_frontdesk.py
          git add backend/routers/appointments.py backend/routers/frontdesk.py backend/tests/test_mobile_frontdesk.py
          test -z "$(git diff --name-only --diff-filter=U)" || { echo 'REFUSED: unmerged paths remain'; exit 1; }
          git diff --cached --check
          git -c user.name='CB894 Candidate' -c user.email='cb894-candidate@invalid.example' commit --no-gpg-sign -m 'merge(cb894): scoped clinical output and atomic audit'
          test "$(git rev-parse HEAD^1)" = "$EXPECTED_CHECKOUT"
          test "$(git rev-parse HEAD^2)" = "$EXPECTED_SOURCE_SHA"
          git rev-parse HEAD > cb894-merge-diagnostic/resolved-merge-sha.txt
          git diff "$EXPECTED_MASTER_SHA"..HEAD -- backend/routers/appointments.py backend/routers/frontdesk.py backend/tests/test_mobile_frontdesk.py > cb894-merge-diagnostic/clinical-merge.patch
          echo 'Clinical conflict resolution staged on runner only' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies for real isolated tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install torch==2.10.0 torchvision==0.25.0 torchaudio==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^(torch|torchvision|torchaudio)([<=>].*)?
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cb894-master-merge-conflict-probe
          path: cb894-merge-diagnostic/
          if-no-files-found: warn
          retention-days: 14
 requirements.txt > /tmp/cb894-requirements.txt
          python -m pip install -r /tmp/cb894-requirements.txt
          python -m pip check
      - name: REQUIRED integrated Pocket Frontdesk Agenda and authorization tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            backend/tests/test_mobile_frontdesk.py \
            backend/tests/test_frontdesk.py \
            backend/tests/test_appointments_multi_practitioner_p0.py \
            backend/tests/test_agenda_a3_practitioner_availability.py \
            backend/tests/test_crown_bot_clinical_gate.py
          echo 'Pocket/Frontdesk/Agenda contract tests PASS' >> "$GITHUB_STEP_SUMMARY"
      - name: Publish ONLY proven merged candidate to pre-created sandbox branch
        shell: bash
        env:
          GH_PUSH_TOKEN: ${{ github.token }}
          EXPECTED_TARGET: integration/cb894-master-reconciled-candidate-20261021
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = pull_request
          test "$GITHUB_HEAD_REF" = integration/cb894-master-reconcile-diagnostic-20261021
          test "$GITHUB_BASE_REF" = master
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPO"
          test "$(git rev-parse HEAD^1)" = "$EXPECTED_CHECKOUT"
          test "$(git rev-parse HEAD^2)" = "$EXPECTED_SOURCE_SHA"
          git fetch --no-tags origin "$EXPECTED_TARGET"
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_MASTER_SHA" || { echo 'REFUSED: candidate branch was altered'; exit 1; }
          test -n "$GH_PUSH_TOKEN"
          encoded=$(printf 'x-access-token:%s' "$GH_PUSH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $encoded" push origin "HEAD:refs/heads/$EXPECTED_TARGET"
          echo "Candidate published to sandbox branch, never master" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish diagnostic evidence even if merge conflicts fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cb894-master-merge-conflict-probe
          path: cb894-merge-diagnostic/
          if-no-files-found: warn
          retention-days: 14
