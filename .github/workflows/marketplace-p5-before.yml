name: Marketplace P5 BEFORE Baseline

on:
  pull_request:
    paths:
      - '.audit/marketplace-p5-before.mjs'
      - '.github/workflows/marketplace-p5-before.yml'
  workflow_dispatch:

jobs:
  capture-before:
    name: Marketplace P5 BEFORE 390/430/768/1280
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Record product HEAD
        run: |
          PRODUCT_HEAD=$(git rev-parse HEAD)
          echo "PRODUCT_HEAD=$PRODUCT_HEAD" >> "$GITHUB_ENV"
          test "$PRODUCT_HEAD" = "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend and Chromium
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.62.1
          npx playwright install --with-deps chromium

      - name: Capture Marketplace BEFORE
        working-directory: frontend
        env:
          PRODUCT_HEAD: ${{ env.PRODUCT_HEAD }}
        run: node ../.audit/marketplace-p5-before.mjs

      - name: Assert baseline artifact contract
        working-directory: frontend
        env:
          PRODUCT_HEAD: ${{ env.PRODUCT_HEAD }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const report = JSON.parse(readFileSync('marketplace-p5-before-artifacts/report.json', 'utf8'));
          if (report.productHead !== process.env.PRODUCT_HEAD) throw new Error('P5 BEFORE product HEAD mismatch');
          if (report.captures.length !== 4) throw new Error(`Expected 4 captures, got ${report.captures.length}`);
          const invalid = report.captures.filter((capture) => !capture.pageReady || capture.pageErrors.length > 0);
          if (invalid.length) throw new Error(`Invalid captures: ${JSON.stringify(invalid)}`);
          console.log('Marketplace P5 BEFORE artifact PASS');
          console.table(report.captures.map((capture) => ({
            viewport: capture.viewport,
            overflow: capture.metrics.hasHorizontalOverflow,
            consoleErrors: capture.consoleErrors.length,
            visibleTextLength: capture.metrics.visibleTextLength,
          })));
          NODE

      - name: Upload Marketplace BEFORE artifact
        uses: actions/upload-artifact@v4
        with:
          name: marketplace-p5-before
          path: frontend/marketplace-p5-before-artifacts/
          if-no-files-found: error
          retention-days: 30
