name: Mobile M6-D1 Notifications Prepare

on:
  push:
    branches:
      - audit/mobile-m6-d1-prep-20260825

permissions:
  contents: write

env:
  PRODUCT_BASE: 4d58c080569d0177e887deda6948d65026fe3887
  PRODUCT_BRANCH: mobile/m6-d1-notification-center

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout audit prep
        uses: actions/checkout@v4
        with:
          path: audit

      - name: Checkout exact product baseline
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PRODUCT_BASE }}
          path: product
          fetch-depth: 0

      - name: Guard product branch absence
        shell: bash
        run: |
          if git -C product ls-remote --exit-code --heads origin "refs/heads/${PRODUCT_BRANCH}" >/dev/null 2>&1; then
            echo "Product branch already exists; refusing duplicate prepare."
            exit 1
          fi

      - name: Materialize M6-D1 product patch
        shell: bash
        run: |
          cp audit/.audit/m6d1/MobileHeader.tsx product/frontend/src/features/mobile/Dashboard/components/MobileHeader.tsx
          cp audit/.audit/m6d1/MobileNotificationCenter.tsx product/frontend/src/features/mobile/Dashboard/components/MobileNotificationCenter.tsx
          cp audit/.audit/m6d1/test_mobile_m6d_notifications.py product/backend/tests/test_mobile_m6d_notifications.py
          cp audit/.audit/m6d1/apply_backend.py product/.audit-m6d1-apply.py
          cd product
          python .audit-m6d1-apply.py
          rm .audit-m6d1-apply.py

      - name: Assert exact scope
        shell: bash
        run: |
          cd product
          { git diff --name-only; git ls-files --others --exclude-standard; } | sort -u > /tmp/actual
          cat > /tmp/expected <<'EOF'
          backend/routers/mobile.py
          backend/tests/test_mobile_m6d_notifications.py
          frontend/src/features/mobile/Dashboard/components/MobileHeader.tsx
          frontend/src/features/mobile/Dashboard/components/MobileNotificationCenter.tsx
          EOF
          sort -o /tmp/expected /tmp/expected
          diff -u /tmp/expected /tmp/actual
          test "$(git rev-parse HEAD)" = "$PRODUCT_BASE"

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: product/requirements.txt

      - name: Install canonical CI dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.12.0 torchvision==0.27.0 --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^(torch|torchvision)([<=>].*)?$' product/requirements.txt > /tmp/requirements-m6d1-ci.txt
          python -m pip install -r /tmp/requirements-m6d1-ci.txt
          python -m pip install httpx==0.27.2 pytest pytest-asyncio

      - name: Backend targeted proof
        shell: bash
        run: |
          cd product
          python -m py_compile backend/routers/mobile.py
          python -m pytest -q backend/tests/test_mobile_m6d_notifications.py backend/tests/test_mobile_m6c_signature_hardening.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: product/frontend/package-lock.json

      - name: Frontend build
        shell: bash
        run: |
          cd product/frontend
          npm ci
          npm run build

      - name: Create single final product commit
        shell: bash
        run: |
          cd product
          git config user.name hraaaaf
          git config user.email 123034021+hraaaaf@users.noreply.github.com
          git switch -c "$PRODUCT_BRANCH"
          git add backend/routers/mobile.py backend/tests/test_mobile_m6d_notifications.py \
            frontend/src/features/mobile/Dashboard/components/MobileHeader.tsx \
            frontend/src/features/mobile/Dashboard/components/MobileNotificationCenter.tsx
          git commit -m "feat(mobile): add notification center"
          test "$(git rev-list --count "$PRODUCT_BASE"..HEAD)" = "1"
          git push origin "HEAD:refs/heads/$PRODUCT_BRANCH"
          echo "PRODUCT_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Final commit summary
        shell: bash
        run: |
          echo "Final product HEAD: $PRODUCT_HEAD"
          git -C product diff --stat "$PRODUCT_BASE"..HEAD
