name: Pharmacology Independent Scientific Reviewer

on:
  push:
    branches:
      - ci/pharmacology-independent-reviewer-20260916
    paths:
      - '.github/workflows/pharmacology-independent-scientific-review.yml'
  workflow_dispatch:

permissions:
  contents: read
  copilot-requests: write

concurrency:
  group: pharmacology-independent-review-525
  cancel-in-progress: true

env:
  TARGET_PR: '525'
  TARGET_HEAD: '7379ddeab663b833b6be43f455c434be28cafe75'
  EXPECTED_BASE: '1e9fd49af91ffafad89ad9936c6f2e372e883354'

jobs:
  independent-review:
    name: Independent scientific review — PR 525
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact target HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_HEAD }}
          fetch-depth: 0

      - name: Verify immutable review target
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_HEAD"
          git merge-base --is-ancestor "$EXPECTED_BASE" "$TARGET_HEAD"
          CHANGED=$(git diff --name-only "$EXPECTED_BASE...$TARGET_HEAD")
          printf '%s\n' "$CHANGED"
          test "$(printf '%s\n' "$CHANGED" | sed '/^$/d' | wc -l)" -eq 3
          printf '%s\n' "$CHANGED" | grep -Fx 'backend/services/medication_rcp_manifest.py'
          printf '%s\n' "$CHANGED" | grep -Fx 'backend/tests/test_medication_rcp_manifest_m1b.py'
          printf '%s\n' "$CHANGED" | grep -Fx 'docs/audits/PRESCRIPTION_PHARMACOLOGY_MOROCCO_RCP_M1.md'

      - name: Verify reviewer contract exists on target
        run: |
          set -euo pipefail
          test -s .claude/agents/scientific-reviewer.md
          test -s .claude/skills/review-scientific-pull-request/SKILL.md
          test -s .claude/skills/scientific-source-research/SKILL.md

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install reviewer test dependencies
        run: python -m pip install --disable-pip-version-check pytest SQLAlchemy==2.0.28

      - name: Isolate documentary imports from application bootstrap
        run: |
          mkdir -p "$RUNNER_TEMP/pharmacology-isolation"
          cat > "$RUNNER_TEMP/pharmacology-isolation/sitecustomize.py" <<'PY'
          import os
          import sys
          import types
          from pathlib import Path

          workspace = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          package = types.ModuleType("backend")
          package.__path__ = [str(workspace / "backend")]
          package.__package__ = "backend"
          sys.modules["backend"] = package
          PY

      - name: Run exact-head documentary tests and deterministic oracle
        env:
          PYTHONPATH: ${{ runner.temp }}/pharmacology-isolation:${{ github.workspace }}
        run: |
          set -euo pipefail
          mkdir -p audit/out/pharmacology-independent-review
          {
            echo '## Targeted pharmacology documentary tests'
            python -m pytest --noconftest \
              backend/tests/test_prescription_pharmacology_morocco_m0_matrix.py \
              backend/tests/test_medication_rcp_manifest_m1b.py \
              -q
            echo
            echo '## Deterministic pharmacology safety oracle'
            python scripts/pharmacology_scientific_gate.py --output-dir audit/out/pharmacology-scientific-gate
          } 2>&1 | tee audit/out/pharmacology-independent-review/technical-evidence.txt

      - name: Capture live AMMPS evidence with browser
        env:
          EVIDENCE_DIR: ${{ github.workspace }}/audit/out/pharmacology-independent-review
        run: |
          set -euo pipefail
          BROWSER_DIR="$RUNNER_TEMP/pharmacology-review-browser"
          mkdir -p "$BROWSER_DIR" "$EVIDENCE_DIR"
          cd "$BROWSER_DIR"
          npm init -y >/dev/null 2>&1
          npm install --silent playwright
          npx playwright install --with-deps chromium
          node - <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const path = require('path');

          const outDir = process.env.EVIDENCE_DIR;
          const targets = [
            ['https://www.ammps.gov.ma/recherche-medicaments?page=42', 'ammps-recherche-medicaments-page-42-live.txt'],
            ['https://www.ammps.gov.ma/basesdedonnes/liste_marocaine_des_medicaments?page=96', 'ammps-liste-marocaine-page-96-live.txt'],
          ];

          (async () => {
            const browser = await chromium.launch({ headless: true });
            try {
              for (const [url, filename] of targets) {
                const page = await browser.newPage();
                await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 60000 });
                await page.waitForTimeout(5000);

                const visibleText = await page.locator('body').innerText();
                const domText = await page.locator('body').textContent();
                const hrefEvidence = await page.locator('[href]').evaluateAll((nodes) =>
                  nodes.map((node) => ({
                    tag: node.tagName,
                    text: (node.textContent || '').trim(),
                    title: node.getAttribute('title') || '',
                    ariaLabel: node.getAttribute('aria-label') || '',
                    href: node.href || node.getAttribute('href') || '',
                  }))
                );

                if (!visibleText || visibleText.length < 500 || !domText || domText.length < 500) {
                  throw new Error(`AMMPS rendered evidence too short for ${url}`);
                }

                const payload = [
                  `URL: ${url}`,
                  `retrieved_at_utc: ${new Date().toISOString()}`,
                  '',
                  '=== VISIBLE_TEXT ===',
                  visibleText,
                  '',
                  '=== DOM_TEXT ===',
                  domText,
                  '',
                  '=== HREF_EVIDENCE_JSON ===',
                  JSON.stringify(hrefEvidence, null, 2),
                ].join('\n');
                fs.writeFileSync(path.join(outDir, filename), payload, 'utf8');
                await page.close();
              }
            } finally {
              await browser.close();
            }
          })().catch((err) => {
            console.error(err);
            process.exit(1);
          });
          NODE

      - name: Verify live AMMPS evidence contains reviewed presentations
        env:
          EVIDENCE_DIR: ${{ github.workspace }}/audit/out/pharmacology-independent-review
        run: |
          python - <<'PY'
          import re
          import unicodedata
          from pathlib import Path
          import os

          root = Path(os.environ['EVIDENCE_DIR'])

          def norm(text: str) -> str:
              text = unicodedata.normalize('NFC', text).upper()
              return re.sub(r'\s+', ' ', text).strip()

          page42 = norm((root / 'ammps-recherche-medicaments-page-42-live.txt').read_text(encoding='utf-8'))
          page96 = norm((root / 'ammps-liste-marocaine-page-96-live.txt').read_text(encoding='utf-8'))

          patterns_42 = [
              r'AMOXICILLINE LLORENTE.{0,120}DOSAGE\s*:\s*500 MG.{0,140}PRÉSENTATION\s*:\s*BOITE DE 12.{0,100}GELULE',
              r'AMOXICILLINE LLORENTE.{0,120}DOSAGE\s*:\s*500 MG.{0,140}PRÉSENTATION\s*:\s*BOITE DE 24.{0,100}GELULE',
              r'AMOXICILLINE SP.{0,120}DOSAGE\s*:\s*1 G.{0,140}PRÉSENTATION\s*:\s*BOITE DE 12.{0,120}COMPRIME DISPERSIBLE',
              r'AMOXICILLINE SP.{0,120}DOSAGE\s*:\s*1 G.{0,140}PRÉSENTATION\s*:\s*BOITE DE 24.{0,120}COMPRIME DISPERSIBLE',
              r'AMOXICILLINE SP.{0,120}DOSAGE\s*:\s*250 MG / 5 ML.{0,160}PRÉSENTATION\s*:\s*FLACON DE 60 ML.{0,160}POUDRE POUR SUSPENSION BUVABLE',
              r'AMOXICILLINE SP.{0,120}DOSAGE\s*:\s*500 MG / 5 ML.{0,160}PRÉSENTATION\s*:\s*FLACON DE 60 ML.{0,160}POUDRE POUR SUSPENSION BUVABLE',
          ]
          patterns_96 = [
              r'CLAMOXYL.{0,80}500 MG.{0,120}POUDRE POUR SUSPENSION BUVABLE.{0,120}AMOXICILLINE.{0,160}GSK.{0,120}RETIRÉ DU MARCHÉ',
              r'CLAMOXYL.{0,80}500 MG.{0,120}POUDRE POUR SUSPENSION BUVABLE.{0,120}AMOXICILLINE.{0,220}GSK.{0,120}COMMERCIALISÉ',
          ]

          missing = [pattern for pattern in patterns_42 if not re.search(pattern, page42)]
          missing += [pattern for pattern in patterns_96 if not re.search(pattern, page96)]
          if missing:
              raise SystemExit('Live AMMPS evidence missing expected presentation pattern(s): ' + repr(missing))

          for token in ('AFRIC PHAR', 'AMANYS PHARMA'):
              if token not in page42:
                  raise SystemExit(f'Live AMMPS page 42 missing expected EPI token: {token}')

          if 'TÉLÉCHARGER RCP' not in page42:
              raise SystemExit('Live AMMPS page 42 DOM did not expose RCP download controls')
          if 'LIEN RCP / NAF' not in page96:
              raise SystemExit('Live AMMPS page 96 DOM did not expose RCP/NAF evidence')
          PY

      - name: Install GitHub Copilot CLI
        run: npm install -g @github/copilot

      - name: Build immutable reviewer prompt
        run: |
          cat > /tmp/reviewer-prompt.txt <<'PROMPT'
          You are the independent scientific reviewer for Digital Crown PR #525.

          NON-NEGOTIABLE TARGET
          - Review only repository state at exact HEAD 7379ddeab663b833b6be43f455c434be28cafe75.
          - Expected base included in this HEAD: 1e9fd49af91ffafad89ad9936c6f2e372e883354.
          - If git evidence does not match either SHA, return decision "blocked".

          GOVERNANCE
          1. Read .claude/agents/scientific-reviewer.md in full.
          2. Read .claude/skills/review-scientific-pull-request/SKILL.md in full.
          3. Read .claude/skills/scientific-source-research/SKILL.md in full.
          4. Follow those contracts. You are not the author. Be adversarial, read-only and fail closed.
          5. Green CI is not scientific approval.
          6. Do not modify repository files, do not commit, do not push, do not merge, do not access patient data, and do not activate clinical rules.

          SCOPE TO INSPECT
          - backend/services/medication_rcp_manifest.py
          - backend/tests/test_medication_rcp_manifest_m1b.py
          - docs/audits/PRESCRIPTION_PHARMACOLOGY_MOROCCO_RCP_M1.md
          - backend/data/medications_ma_ammps_rcp_manifest_2026.json
          - backend/data/medications_ma_ammps_current_2026.json
          - docs/audits/PRESCRIPTION_PHARMACOLOGY_MOROCCO_COVERAGE.md
          - docs/audits/PRESCRIPTION_PHARMACOLOGY_SCIENTIFIC_GATE.md
          - audit/out/pharmacology-independent-review/technical-evidence.txt
          - audit/out/pharmacology-independent-review/ammps-recherche-medicaments-page-42-live.txt
          - audit/out/pharmacology-independent-review/ammps-liste-marocaine-page-96-live.txt
          - git history/diff needed to prove the three-file scope

          RUNTIME EVIDENCE
          - The technical-evidence file was generated on this runner immediately before your review from the exact target checkout.
          - The two AMMPS evidence files were rendered immediately before your review with headless Chromium from the exact official URLs shown inside each file.
          - Each AMMPS evidence file contains visible text, full DOM text (including expandable/hidden detail blocks) and href metadata.
          - The workflow already failed closed unless the six AMOXICILLINE LLORENTE/SP presentations and the two CLAMOXYL rows were structurally present in those official pages.
          - Independently inspect those files and directly re-open official AMMPS URLs with curl when useful. Do not treat repository assertions alone as regulatory proof.

          CLAIMS TO CHALLENGE INDEPENDENTLY
          - The helper is transport-only and performs no download, persistence or clinical extraction.
          - SNAPSHOT_VERIFIED cannot be produced without an official AMMPS HTTPS URL, a strict ISO date, a safe backend/data/rcp/*.pdf path, a real local PDF-like artifact and matching SHA-256.
          - PENDING_DOWNLOAD and UNAVAILABLE_VERIFIED remain fail-closed.
          - No dose, duration, indication, molecule selection, AUTO_OK, DB, patient, document, UI or clinical activation behavior is changed by this PR.
          - The manifest still has exactly 8 current amoxicillin entries and none is falsely promoted to SNAPSHOT_VERIFIED or UNAVAILABLE_VERIFIED.
          - The synthetic regulatory_presentation_id values are repository-derived SHA-256 package identifiers, not AMMPS-issued identifiers; verify their deterministic mapping from the official presentation fields in medication_dict.py.
          - Negative web search is not treated as evidence of regulatory absence.
          - Current AMMPS provenance claims used by the PR are actually checkable; if official evidence is unavailable, classify the uncertainty rather than inventing a conclusion.

          SOURCE RULES
          - Open actual sources when possible; do not rely on search snippets.
          - Prefer AMMPS / official Moroccan sources. Secondary sources may corroborate but may not promote regulatory state.
          - Record jurisdiction, version/date and limitations for any external scientific/regulatory source actually used.
          - If required evidence cannot be checked, decision must be "blocked" or "request_changes" as appropriate.

          REQUIRED OUTPUT
          Return ONLY one valid JSON object. No Markdown fences and no prose outside JSON.
          Exact top-level keys:
          {
            "schema_version": "pharmacology-independent-review.1",
            "reviewer": "github-copilot-cli",
            "model_selector": "auto",
            "target_pr": 525,
            "target_head": "7379ddeab663b833b6be43f455c434be28cafe75",
            "expected_base": "1e9fd49af91ffafad89ad9936c6f2e372e883354",
            "decision": "approve|approve_with_reservations|request_changes|blocked",
            "blocking_findings": [],
            "major_findings": [],
            "minor_findings": [],
            "missing_tests": [],
            "scientific_uncertainties": [],
            "source_checks": [],
            "required_actions": [],
            "clinical_activation_authorized": false,
            "independence_statement": "..."
          }
          Every finding/action must be concrete and traceable to a file, line/behavior, command result or source URL where possible.
          PROMPT

      - name: Run independent reviewer with GitHub Copilot auto model
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONPATH: ${{ runner.temp }}/pharmacology-isolation:${{ github.workspace }}
        run: |
          set -euo pipefail
          mkdir -p audit/out/pharmacology-independent-review
          copilot \
            -p "$(cat /tmp/reviewer-prompt.txt)" \
            -s \
            --no-ask-user \
            --model auto \
            --allow-tool='shell(git:*)' \
            --allow-tool='shell(cat:*)' \
            --allow-tool='shell(grep:*)' \
            --allow-tool='shell(find:*)' \
            --allow-tool='shell(python:*)' \
            --allow-tool='shell(curl:*)' \
            --allow-url='https://www.ammps.gov.ma/*' \
            > audit/out/pharmacology-independent-review/report.raw.txt

      - name: Validate reviewer report fail-closed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          src = Path('audit/out/pharmacology-independent-review/report.raw.txt')
          raw = src.read_text(encoding='utf-8').strip()
          try:
              report = json.loads(raw)
          except Exception as exc:
              raise SystemExit(f'Reviewer did not return strict JSON: {exc}')

          expected_keys = {
              'schema_version','reviewer','model_selector','target_pr','target_head','expected_base',
              'decision','blocking_findings','major_findings','minor_findings','missing_tests',
              'scientific_uncertainties','source_checks','required_actions',
              'clinical_activation_authorized','independence_statement'
          }
          if set(report) != expected_keys:
              raise SystemExit(f'Unexpected reviewer keys: {sorted(set(report) ^ expected_keys)}')
          if report['schema_version'] != 'pharmacology-independent-review.1':
              raise SystemExit('Wrong schema version')
          if report['reviewer'] != 'github-copilot-cli' or report['model_selector'] != 'auto':
              raise SystemExit('Reviewer/model selector mismatch')
          if report['target_pr'] != 525:
              raise SystemExit('Target PR mismatch')
          if report['target_head'] != '7379ddeab663b833b6be43f455c434be28cafe75':
              raise SystemExit('Target HEAD mismatch')
          if report['expected_base'] != '1e9fd49af91ffafad89ad9936c6f2e372e883354':
              raise SystemExit('Expected base mismatch')
          if report['decision'] not in {'approve','approve_with_reservations','request_changes','blocked'}:
              raise SystemExit('Invalid decision')
          for key in ('blocking_findings','major_findings','minor_findings','missing_tests','scientific_uncertainties','source_checks','required_actions'):
              if not isinstance(report[key], list):
                  raise SystemExit(f'{key} must be a list')
          if report['clinical_activation_authorized'] is not False:
              raise SystemExit('Reviewer must not authorize clinical activation')
          if not isinstance(report['independence_statement'], str) or not report['independence_statement'].strip():
              raise SystemExit('Missing independence statement')

          out = Path('audit/out/pharmacology-independent-review/report.json')
          out.write_text(json.dumps(report, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          summary = [
              '# Independent pharmacology scientific review',
              '',
              f"- target PR: {report['target_pr']}",
              f"- target HEAD: `{report['target_head']}`",
              '- model selector: `auto` (resolved by GitHub Copilot at runtime)',
              f"- decision: **{report['decision']}**",
              f"- blocking findings: {len(report['blocking_findings'])}",
              f"- major findings: {len(report['major_findings'])}",
              f"- scientific uncertainties: {len(report['scientific_uncertainties'])}",
              '- clinical activation authorized: false',
          ]
          Path('audit/out/pharmacology-independent-review/summary.md').write_text('\n'.join(summary) + '\n', encoding='utf-8')
          PY

      - name: Publish reviewer summary
        if: always()
        run: |
          if test -s audit/out/pharmacology-independent-review/summary.md; then
            cat audit/out/pharmacology-independent-review/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo '## Independent pharmacology scientific review' >> "$GITHUB_STEP_SUMMARY"
            echo 'Reviewer report unavailable or validation failed.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload independent reviewer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pharmacology-independent-review-7379ddeab663b833b6be43f455c434be28cafe75
          path: |
            audit/out/pharmacology-independent-review/
            audit/out/pharmacology-scientific-gate/
          if-no-files-found: warn
          retention-days: 30
