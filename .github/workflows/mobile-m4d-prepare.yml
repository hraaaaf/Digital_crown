name: Prepare M4-D RDV Product

on:
  push:
    branches:
      - audit/mobile-m4d-rdv-before-20260825
    paths:
      - '.audit/mobile-m4d-apply.py'
      - '.audit/mobile-m4d-onboarding-fix.py'
      - '.audit/mobile-m4d-after-scenario.yml'
      - '.github/workflows/mobile-m4d-prepare.yml'

permissions:
  contents: write

jobs:
  prepare:
    name: Apply, test, and publish one M4-D product commit
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-only-secret-key-minimum-32-characters-long
      DATABASE_URL: "sqlite:///:memory:"
      ENVIRONMENT: development
      TELEMETRY_ENABLED: "false"
      CLOUD_AI_ENABLED: "false"
    steps:
      - name: Checkout frozen audit inputs
        uses: actions/checkout@v4
        with:
          path: audit

      - name: Checkout canonical master product
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          path: product

      - name: Materialize exact M4-D product patch
        run: |
          python audit/.audit/mobile-m4d-apply.py product
          python audit/.audit/mobile-m4d-onboarding-fix.py product
          mkdir -p product/.audit
          cp audit/.audit/mobile-m4d-goal.md product/.audit/mobile-m4d-goal.md
          cp audit/.audit/mobile-m4d-mockup.svg product/.audit/mobile-m4d-mockup.svg
          cp audit/.audit/mobile-m4d-after-scenario.yml product/.audit/mobile-m4d-after-scenario.yml
          sed -i 's/[[:space:]]\+$//' product/frontend/src/features/agenda/MonthlyView.tsx

      - name: Assert product diff scope before tests
        working-directory: product
        run: |
          git diff --check
          git status --short
          python - <<'PY'
          import subprocess
          expected = {
              '.audit/mobile-m4d-after-scenario.yml',
              '.audit/mobile-m4d-goal.md',
              '.audit/mobile-m4d-mockup.svg',
              'backend/routers/mobile_resource_bridge.py',
              'backend/tests/test_mobile_m4d_appointment_context.py',
              'frontend/src/features/agenda/AgendaModal.tsx',
              'frontend/src/features/agenda/AppointmentMobileBridge.tsx',
              'frontend/src/features/agenda/MonthlyView.tsx',
              'frontend/src/features/mobile/Context/MobileContext.tsx',
              'frontend/src/features/mobile/Onboarding/OnboardingScanner.tsx',
          }
          changed = set(subprocess.check_output(['git','status','--short'], text=True).splitlines())
          paths = {line[3:] for line in changed}
          if paths != expected:
              raise SystemExit(f'Unexpected M4-D scope: {sorted(paths ^ expected)}')
          print('M4-D scope exact:', len(paths), 'files')
          source = open('frontend/src/features/mobile/Onboarding/OnboardingScanner.tsx', encoding='utf-8').read()
          assert "return { route: BRIDGE_ROUTES.context, label: BRIDGE_LABELS.context, context };" not in source
          assert "payload.label.trim()" in source and "label: resourceLabel" in source
          print('M4-D onboarding resource label truth PASS')
          PY

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        working-directory: product
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.12.0 torchvision==0.27.0 --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^(torch|torchvision)([<=>].*)?$' requirements.txt > /tmp/requirements-m4d.txt
          pip install -r /tmp/requirements-m4d.txt
          pip install httpx==0.27.2 pytest pytest-asyncio

      - name: Targeted backend M4 resource regression
        working-directory: product
        run: |
          python -m pytest \
            backend/tests/test_mobile_m4d_appointment_context.py \
            backend/tests/test_mobile_m4c_document_context.py \
            backend/tests/test_mobile_m4b_panoramic_context.py \
            backend/tests/test_mobile_m4a_patient_context.py \
            -q --maxfail=1

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: product/frontend/package-lock.json

      - name: Frontend build gate
        working-directory: product/frontend
        run: |
          npm ci
          npm run build

      - name: Create the single final product commit
        working-directory: product
        run: |
          git switch -c mobile/m4d-rdv-context
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .audit/mobile-m4d-after-scenario.yml \
            .audit/mobile-m4d-goal.md \
            .audit/mobile-m4d-mockup.svg \
            backend/routers/mobile_resource_bridge.py \
            backend/tests/test_mobile_m4d_appointment_context.py \
            frontend/src/features/agenda/AgendaModal.tsx \
            frontend/src/features/agenda/AppointmentMobileBridge.tsx \
            frontend/src/features/agenda/MonthlyView.tsx \
            frontend/src/features/mobile/Context/MobileContext.tsx \
            frontend/src/features/mobile/Onboarding/OnboardingScanner.tsx
          git commit -m 'feat(mobile): add exact appointment contextual bridge'
          test "$(git rev-list --count master..HEAD)" = "1"
          git push origin HEAD:refs/heads/mobile/m4d-rdv-context
          echo "PRODUCT_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Record product HEAD
        run: echo "M4-D product HEAD ${PRODUCT_HEAD}"
