name: Settings R10 Team Password Visual Certification

on:
  pull_request:
    paths:
      - "frontend/src/features/admin/TeamManager.tsx"
      - ".github/workflows/settings-r10-team-password-after.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  after:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify source contract
        run: |
          grep -Fq 'minLength={8}' frontend/src/features/admin/TeamManager.tsx
          grep -Fq 'maxLength={128}' frontend/src/features/admin/TeamManager.tsx
          grep -Fq '8 à 128 caractères' frontend/src/features/admin/TeamManager.tsx
          grep -Fq 'Le mot de passe doit contenir entre 8 et 128 caractères.' frontend/src/features/admin/TeamManager.tsx
          if grep -Fq 'Le mot de passe doit contenir au moins 4 caractères.' frontend/src/features/admin/TeamManager.tsx; then exit 1; fi
      - name: Install frontend and browser
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install chromium
      - name: Inject Team AFTER harness
        working-directory: frontend
        run: |
          cat > settings-r10-after.html <<'EOF'
          <!doctype html><html lang="fr"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>R10 AFTER</title></head><body><div id="root"></div><script type="module" src="/src/settings-r10-after.tsx"></script></body></html>
          EOF
          cat > src/settings-r10-after.tsx <<'EOF'
          import React from 'react';
          import { createRoot } from 'react-dom/client';
          import { MemoryRouter } from 'react-router-dom';
          import './index.css';
          import Settings from './pages/Settings';
          import { useAuthStore } from './stores/useAuthStore';
          useAuthStore.setState({ user:{ id:1,email:'owner@r10.local',role:'ADMIN',is_superadmin:false,permissions:{} } as any,isAuthenticated:true,isLoading:false,error:null });
          createRoot(document.getElementById('root')!).render(<MemoryRouter initialEntries={['/settings']}><Settings /></MemoryRouter>);
          EOF
          cat > settings-r10-after.mjs <<'EOF'
          import { chromium } from 'playwright';
          import { createServer } from 'vite';
          import fs from 'node:fs/promises';
          const output='settings-r10-after'; await fs.mkdir(output,{recursive:true});
          const json=(body,status=200)=>({status,contentType:'application/json',body:JSON.stringify(body)});
          const profile={nom_praticien:'Dr Team',nom_cabinet:'Cabinet Team',header_lines_fr:['Dr Team'],specialty_ids:[],contacts_json:{}};
          const quota={plan:'GOLD',dentistes_used:1,dentistes_max:1,secretaires_used:1,secretaires_max:2,pending_count:0,can_add_dentiste:false,can_add_secretaire:true};
          const members=[{id:2,email:'assistante@cabinet.local',role:'SECRETAIRE',nom_complet:'Assistante Test',telephone_mobile:null,is_active:true,approval_status:'approved',created_at:'2026-08-19T00:00:00',permissions:{agenda:true,patients:true}}];
          const validation={detail:[{type:'string_too_short',loc:['body','password'],msg:'String should have at least 8 characters',input:'1234567',ctx:{min_length:8}}]};
          const server=await createServer({server:{host:'127.0.0.1',port:4188,strictPort:true},clearScreen:false}); await server.listen();
          const browser=await chromium.launch();
          try {
            for (const width of [1440,1024,768,430,390]) {
              const context=await browser.newContext({viewport:{width,height:1200}}); const page=await context.newPage(); const errors=[];
              page.on('pageerror',e=>errors.push(`pageerror: ${e.message}`)); page.on('console',m=>{if(m.type()==='error')errors.push(`console: ${m.text()}`)});
              await page.route('**/api/**',async route=>{const url=new URL(route.request().url()); if(url.pathname.endsWith('/clinics/me'))return route.fulfill(json(profile)); if(url.pathname==='/api/team/'||url.pathname==='/api/team') { if(route.request().method()==='POST') return route.fulfill(json(validation,422)); return route.fulfill(json(members)); } if(url.pathname==='/api/team/quota')return route.fulfill(json(quota)); return route.fulfill(json({}));});
              await page.goto('http://127.0.0.1:4188/settings-r10-after.html',{waitUntil:'networkidle'});
              await page.getByRole('heading',{name:'Paramètres',exact:true}).waitFor({state:'visible',timeout:15000});
              await page.getByRole('button',{name:'Mon Équipe',exact:true}).click();
              await page.getByRole('heading',{name:'Mon Équipe',exact:true}).waitFor({state:'visible'});
              await page.getByRole('button',{name:'Ajouter un membre',exact:true}).click();
              await page.getByRole('heading',{name:'Nouveau sous-compte',exact:true}).waitFor({state:'visible'});
              const password=page.locator('input[type="password"]');
              if(await password.getAttribute('minlength')!=='8') throw new Error('password minlength != 8');
              if(await password.getAttribute('maxlength')!=='128') throw new Error('password maxlength != 128');
              await page.getByText('8 à 128 caractères',{exact:true}).waitFor({state:'visible'});
              const layout=await page.evaluate(()=>({clientWidth:document.documentElement.clientWidth,scrollWidth:document.documentElement.scrollWidth}));
              if(layout.scrollWidth>layout.clientWidth) throw new Error(`Horizontal overflow: ${layout.scrollWidth}>${layout.clientWidth}`);
              if(errors.length) throw new Error(errors.join('\n'));
              await page.screenshot({path:`${output}/team-create-${width}x1200.png`,fullPage:true,animations:'disabled'});
              await fs.writeFile(`${output}/team-create-${width}.layout.json`,JSON.stringify(layout,null,2)); await fs.writeFile(`${output}/team-create-${width}.errors.txt`,errors.join('\n')); await context.close();
            }
          } finally {await browser.close();await server.close();}
          EOF
      - name: Capture AFTER
        working-directory: frontend
        run: node settings-r10-after.mjs
      - name: Verify AFTER
        working-directory: frontend
        run: |
          test "$(find settings-r10-after -name '*.png' | wc -l)" -eq 5
          if grep -R -n -E 'pageerror:|console:' settings-r10-after/*.errors.txt; then exit 1; fi
          node -e "const fs=require('fs'); for (const f of fs.readdirSync('settings-r10-after').filter(x=>x.endsWith('.layout.json'))) { const x=JSON.parse(fs.readFileSync('settings-r10-after/'+f)); if(x.scrollWidth>x.clientWidth) process.exit(1); }"
      - uses: actions/upload-artifact@v4
        with:
          name: settings-r10-team-password-after
          path: frontend/settings-r10-after/
          if-no-files-found: error
          retention-days: 14
