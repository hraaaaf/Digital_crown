name: LOT05 J11C Encrypted Temporary Academic Pair Retrieval

on:
  push:
    branches:
      - exp/lot05-j10o-public-panoramic-datasets-research-smoke-20261022
    paths:
      - .github/workflows/lot05-j11c-encrypted-pair-retrieval.yml

permissions:
  contents: read

jobs:
  encrypt-source-references-without-logging:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install only decoder
        run: python -m pip install --disable-pip-version-check 'pillow==11.3.0'
      - name: Source-pinned dataset ephemeral checkout
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --depth=1 --no-checkout https://github.com/melihoz/AKUDENTAL.git third_party/AKUDENTAL
          git -C third_party/AKUDENTAL sparse-checkout set --no-cone '/AKUDENTAL/folds/fold_0/labels/' '/AKUDENTAL/images/'
          git -C third_party/AKUDENTAL checkout --detach 92e2cc3ae5eebc9de509311a3edefb7106fca7dd
          test "$(git -C third_party/AKUDENTAL rev-parse HEAD)" = 92e2cc3ae5eebc9de509311a3edefb7106fca7dd
      - name: Derive candidate IDs in memory; encrypt with external one-time RSA public key
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib.util
          import pathlib
          import sys
          folder=pathlib.Path('experiments')
          def load(name,file):
              spec=importlib.util.spec_from_file_location(name,folder/file)
              module=importlib.util.module_from_spec(spec)
              sys.modules[name]=module
              spec.loader.exec_module(module)
              return module
          a=load('j11c_src_a','lot05_j11a_akudental_cross_split_image_fingerprint.py')
          b=load('j11c_src_b','lot05_j11b_private_candidate_pair_roster.py')
          root=pathlib.Path('third_party/AKUDENTAL/AKUDENTAL')
          records=[]
          for split,n in a.SPLITS.items():
              files=sorted((root/'folds'/'fold_0'/'labels'/split).glob('*.txt'))
              assert len(files)==n
              for label in files:
                  image=root/'images'/(label.stem+'.jpg')
                  records.append((split,label.stem,a.fingerprint_jpeg(image,split)))
          pairs=b.candidates(records)
          assert len(pairs)==6, 'pinned_source_expected_six_candidate_pairs'
          names={'train':'T','val':'V','test':'S'}
          payload=';'.join(
              f"{names[p['source_split_a']]}{p['source_image_stem_a']}"
              f">{names[p['source_split_b']]}{p['source_image_stem_b']}"
              for p in pairs
          )
          path=pathlib.Path('/tmp/j11c_pairs_plaintext')
          path.write_text(payload)
          path.chmod(0o600)
          print('SIX_CANDIDATE_PAIRS_QUEUED_FOR_RSA_ENCRYPTION')
          PY
          cat > /tmp/j11c_public.pem <<'PUBLIC_KEY'
-----BEGIN PUBLIC KEY-----
MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAvN/SSApvVEot5BSknOiY
u1/AyXOf5MmeJ3mus/UlqoCSwNibgKZjx2VmSUk0cE7B8Qqdu1phwZG8aD7YkV+n
TQGn20WofC2IyHzxFRW1BTIcSe3gE3Ig6M/XxaMqmOETJiLQwUF5l9mvErdiIt+N
nyu2Rg7IYEroSilcx8xZexcLVpatI3jIiRte6jaBhsCcWbUtyXTXo8+9Dark3DXu
9TK90lCLpbJ3keKLMPosjkDXP/xsR3jAK5ZdahhF8cAebKl3Or9GOn6kHWSfzicp
ioNGl3Qy2x6BsojyXr7yDCY/E3hHfK3S2VzjMk503akwaKU2IwL/sq6W5cDT1big
qwIDAQAB
-----END PUBLIC KEY-----
PUBLIC_KEY
          openssl pkeyutl -encrypt -pubin -inkey /tmp/j11c_public.pem \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 \
            -in /tmp/j11c_pairs_plaintext -out /tmp/j11c_pairs_encrypted
          printf 'RSA_OAEP_SHA256_ENCRYPTED_PAIRS='
          base64 -w0 /tmp/j11c_pairs_encrypted
          printf '\n'
          rm -f /tmp/j11c_public.pem /tmp/j11c_pairs_plaintext /tmp/j11c_pairs_encrypted
      - name: Destroy all transient source material
        if: always()
        shell: bash
        run: |
          rm -rf third_party/AKUDENTAL
          rm -f /tmp/j11c_pairs_plaintext /tmp/j11c_pairs_encrypted /tmp/j11c_public.pem
          echo 'J11C_ALL_TEMPORARY_SOURCE_AND_PAIR_FILES_REMOVED'
