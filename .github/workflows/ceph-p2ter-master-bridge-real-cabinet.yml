name: CEPH P2ter master bridge authenticated real Cabinet FUE-I (experimental)
on:
  pull_request:
    branches: [master, test/ceph-v1-facad-two-public-radios-20261105]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'scripts/ceph_p2ter_seed_t2.py'
      - 'scripts/t2_runtime_server.py'
      - '.github/workflows/ceph-p2ter-master-bridge-*.yml'
      - 'frontend/scripts/certify-ceph-p2ter-authenticated-cabinet.mjs'
      - 'frontend/scripts/fue-ceph-p2ter-first-value.mjs'
permissions:
  contents: read
jobs:
  cabinet-real-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ENVIRONMENT: test
      SECRET_KEY: p2ter-t2-disposable-only-secret-key-000001
      DATABASE_URL: sqlite:///./t2-runtime-cert.db
      DIGITALCROWN_ISOLATED_RUNTIME: "1"
      DIGITALCROWN_ISOLATION_DB_FINGERPRINT: c04779c8d18b3ac12a0f4093a47a5d0c3c0e2251714be532893cfa052e9ee780
      TELEMETRY_ENABLED: "false"
      CLOUD_AI_ENABLED: "false"
      DEBUG: "false"
      ALLOWED_ORIGINS: http://127.0.0.1:5173,http://localhost:5173
      PRODUCT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Require exact HEAD in T2 lab
        run: test "$(git rev-parse HEAD)" = "$PRODUCT_HEAD"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Generate disposable T2 password (masked)
        run: |
          password="$(python -c 'import secrets; print(secrets.token_urlsafe(24))')"
          echo "::add-mask::$password"
          echo "T2_PASSWORD=$password" >> "$GITHUB_ENV"
          # One ephemeral, independent SQLCipher key for server and seed.
          # Never reuse the authentication key for encrypted storage.
          storage_key="$(python -c 'import secrets; print(secrets.token_hex(32))')"
          echo "::add-mask::$storage_key"
          echo "SQLCIPHER_KEY_HEX=$storage_key" >> "$GITHUB_ENV"
      - name: Install backend isolated
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.10.0 torchvision==0.25.0 torchaudio==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^(torch|torchvision|torchaudio)([<=>].*)?$' requirements.txt > /tmp/p2ter-cabinet-dependencies.txt
          pip install -r /tmp/p2ter-cabinet-dependencies.txt
          python -m pip check
      - name: Install frontend and Playwright
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save --package-lock=false --legacy-peer-deps playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Enforce scientific CAS clinical-only and negative mutation regressions
        run: |
          python -m pytest \
            backend/tests/test_cephalo_scientific_write.py \
            backend/tests/test_cephalo_repository_calibration_invariants.py -q
      - name: FUE métier evidence tranche 1 - Media Core tenant isolation, manual import, timeline and unsigned A4
        run: |
          python -m pytest \
            backend/tests/test_media_core_ingestion_api.py \
            backend/tests/test_media_core_timeline_api.py \
            backend/tests/test_media_core_c7_certification.py \
            backend/tests/test_cephalo_four_part_report.py -q
      - name: DC-DOS-01 patient-switch media UI race and blob revocation regression
        working-directory: frontend
        run: |
          npx vitest run src/features/ortho/components/OrthoMediaRecordPanel.test.tsx
          npx tsc --noEmit --pretty false
      - name: Start isolated T2 FastAPI runtime (real JWT and workstation)
        run: |
          python scripts/t2_runtime_server.py > /tmp/p2ter-backend.log 2>&1 &
          echo $! > /tmp/p2ter-backend.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8005/health >/dev/null; then exit 0; fi
            sleep 1
          done
          tail -100 /tmp/p2ter-backend.log
          exit 1
      - name: Seed two synthetic versioned studies on disposable test DB
        run: |
          python -m scripts.ceph_p2ter_seed_t2 | tee /tmp/p2ter-seed.log
          studies="$(python - <<'PY'
          import json
          text=open('/tmp/p2ter-seed.log').read()
          line=next(x.split('=',1)[1] for x in text.splitlines() if x.startswith('P2TER_SYNTHETIC_STUDIES='))
          print(json.dumps(json.loads(line),separators=(',',':')))
          PY
          )"
          echo "P2TER_STUDIES=$studies" >> "$GITHUB_ENV"
      - name: Verify synthetic T2 calibration plate (never a patient radiograph)
        run: |
          python - <<'PY'
          from pathlib import Path
          import struct, zlib
          data=Path("backend/static/uploads/radios/t2-cephalo-seeded.png").read_bytes()
          assert data[:8]==bytes.fromhex("89504e470d0a1a0a")
          width,height,bit_depth,color_type,compression,filter_method,interlace=struct.unpack(">IIBBBBB",data[16:29])
          assert (width,height,bit_depth,color_type,compression,filter_method,interlace)==(1935,2400,8,0,0,0,0)
          i=8
          chunks=[]
          while i<len(data):
              size=struct.unpack(">I",data[i:i+4])[0]
              kind=data[i+4:i+8]
              if kind==b"IDAT": chunks.append(data[i+8:i+8+size])
              i+=12+size
              if kind==b"IEND": break
          raw=zlib.decompress(b"".join(chunks))
          assert len(raw)==height*(width+1)
          sample={(x,y):raw[y*(width+1)+1+x] for x,y in
              [(100,120),(100,1400),(967,1200),(1000,0),(967,500)]}
          assert len(set(sample.values()))>=3 and max(sample.values())-min(sample.values())>=60,sample
          print("R23_G4_NONCLINICAL_SYNTHETIC_PLATE_VISIBLE",sample)
          PY
      - name: Start real Cabinet React frontend
        working-directory: frontend
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 > /tmp/p2ter-frontend.log 2>&1 &
          echo $! > /tmp/p2ter-frontend.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:5173 >/dev/null; then exit 0; fi
            sleep 1
          done
          tail -100 /tmp/p2ter-frontend.log
          exit 1
      - name: REAL UI login, history study A/B, unsigned A4 JWT PDF at two desktops
        working-directory: frontend
        run: node scripts/certify-ceph-p2ter-authenticated-cabinet.mjs
      - name: Verify A4 PDF identity and rendered nonclinical pages
        run: |
          python - <<'PY'
          from pathlib import Path
          import fitz,json
          root=Path('artifacts/ceph-p2ter-authenticated-desktop')
          report=json.loads((root/'report.json').read_text())
          assert report['head']=='${{ github.event.pull_request.head.sha || github.sha }}' and len(report['viewports'])==2
          assert all(item['valid'] for item in report['viewports'])
          for label in ('1280x900','1600x1000'):
              for kind in ('older','newer'):
                  p=root/(label+'-'+kind+'-selected-study.pdf')
                  with fitz.open(p) as doc:
                      assert len(doc)>=2
                      clinical_text=' '.join(page.get_text() for page in doc)
                      sentinel='P2TER_SENTINEL_A_ONLY'
                      # Official PDF rendering deliberately consumes the
                      # scientific projection, not clinician free-text as
                      # authoritative content. Do NOT demand A's marker be
                      # rendered: A/B binding is checked at the authenticated
                      # form + request payload. This checks only visible B leak.
                      if kind=='newer':
                          assert sentinel not in clinical_text, 'A-only clinical sentinel leaked to B PDF'
                      for index,page in enumerate(doc):
                          assert 590 < page.rect.width < 600 and 838 < page.rect.height < 845
                          if index<8:
                              page.get_pixmap(matrix=fitz.Matrix(1,1),alpha=False).save(root/(label+'-'+kind+'-page-'+str(index+1)+'.png'))
          PY
      - name: Verify unsigned A4 requests never created an official archived row
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from backend import database, models
          root=Path('artifacts/ceph-p2ter-authenticated-desktop')
          report=json.loads((root/'report.json').read_text())
          studied=json.loads(next(line.split('=',1)[1] for line in Path('/tmp/p2ter-seed.log').read_text().splitlines() if line.startswith('P2TER_SYNTHETIC_STUDIES=')))
          with database.SessionLocal() as db:
              rows=db.query(models.DocumentArchive).filter(
                  models.DocumentArchive.patient_id==studied['patient_id'],
                  models.DocumentArchive.document_type==models.DocumentType.RAPPORT_CEPHALO,
              ).all()
              assert len(rows)==0, f"Unsigned A4 created {len(rows)} official archived row(s)"
          for viewport in report['viewports']:
              assert viewport['valid'], viewport
              checks=set(viewport['checks'])
              assert 'REAL_CABINET_UNSIGNED_ARCHIVE_DISABLED_AND_DRAFT_AVAILABLE' in checks
              assert 'REAL_JWT_UNSIGNED_NEW_OFFICIAL_ARCHIVE_HTTP_409' in checks
              assert 'TWO_AUTHENTICATED_TABS_SAME_STUDY_UNSIGNED_ARCHIVE_BOTH_409' in checks
              assert viewport['sameRevisionArchive']['creation_refused'] is True
              assert viewport['sameRevisionArchive']['responses']==[409,409]
              assert (root/(viewport['viewport']+'-archive-suspended-explained.png')).is_file()
          print('P2TER_UNSIGNED_A4_NO_OFFICIAL_ARCHIVE_AND_DRAFT_PROOF_PASS')
          PY
      - name: EXPERIMENTAL FUE-I unsigned first PDF on two desktop viewports
        working-directory: frontend
        run: node scripts/fue-ceph-p2ter-first-value.mjs
      - name: Verify FUE-I report and same-viewport before-after captures
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report_path=Path("artifacts/ceph-p2ter-fue-i/report.json")
          report=json.loads(report_path.read_text())
          assert report["head"] == "${{ github.event.pull_request.head.sha || github.sha }}"
          assert {r["viewport"] for r in report["viewports"]} == {"1280x900","1600x1000"}
          assert report["overall"] == "FUE_I_AUTOMATED_SCOPE_PASS"
          required_checks={
              "CLEAN_BROWSER_LOGIN","DASHBOARD_PATIENT_SEARCH","ENTER_IMAGING",
              "OPEN_CEPHALO","SELECT_OLDER_STUDY","DESKTOP_STEPPER",
              "NO_HORIZONTAL_VIEWPORT_OVERFLOW","DRAFT_PDF_FIRST_VALUE","UNSIGNED_OFFICIAL_ARCHIVE_HOLD",
          }
          for r in report["viewports"]:
              assert r["valid"] and all(c["status"] == "PASS" for c in r["matrix"])
              assert {c["id"] for c in r["matrix"]} == required_checks, "Missing real UI discovery or first-value check"
              hold=r.get("archiveHoldEvidence") or {}
              assert hold.get("server_status")==409 and hold.get("archive_created") is False
              assert hold.get("clinical_release") is False
              assert "brouillon non signé" in hold.get("reason","").lower()
              for label in ("before-hub", "after-login", "before-patient-search",
                            "patient-search-result","after-patient-opened",
                            "after-imaging-opened","before-select-study",
                            "before-first-value","before-first-value-actions",
                            "after-first-value","before-unsigned-archive-hold",
                            "after-unsigned-archive-hold"):
                  filename=r["viewport"]+"-"+label+".png"
                  assert (report_path.parent/filename).is_file(), filename
          print("P2TER_FUE_I_AUTOMATED_EVIDENCE_VERIFIED")
          PY
      - name: R23-G4 EXPERIMENTAL authenticated desktop AFTER evidence (COM/Focus)
        working-directory: frontend
        run: node scripts/certify-ceph-r23g4-reference-ui.mjs
      - name: Verify R23-G4 two-viewport real UI source-proof screenshots
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("artifacts/ceph-r23g4-reference-ui")
          report=json.loads((root/"report.json").read_text())
          assert report["head"]=="${{ github.event.pull_request.head.sha || github.sha }}"
          assert report["overall"]=="R23_G4_EXPERIMENTAL_DESKTOP_AFTER_PASS"
          assert {v["viewport"] for v in report["viewports"]}=={"1280x900","1600x1000"}
          # Two source-locked browser contracts can reach this unchanged
          # trusted base workflow on pull_request: a verified source Focus
          # (no drawn geometry), or a held/NC Focus explicitly refused.
          # The contract must be identical across both viewports; never
          # forge a source-backed Focus just to satisfy an obsolete oracle.
          assert report["clinical_release"] is False
          assert report["independent_ortho_review"] is False
          assert isinstance(report["viewports"],list) and len(report["viewports"])==2
          common_checks={"GENUINE_CABINET_LOGIN_AND_STUDY_SELECTION",
                         "COM10_SOURCE_ROWS_EXACT_REVISION",
                         "NON_V1_ANALYSES_ARE_NOT_SELECTABLE",
                         "SECOND_STUDY_HAS_NO_STALE_REFERENCE",
                         "COM_LAST_FACTOR_ACCESSIBLE_AND_UNOBSCURED",
                         "NO_DESKTOP_VIEWPORT_OVERFLOW"}
          common_shots=["before-v1-com","after-com-ten-factor"]
          final_shots=["after-other-study-rebound","after-com-last-factor-accessible"]
          proof_variants={
              "verified-source-points":{
                  "check":"COM_FOCUS_MATCHES_SOURCE_EVIDENCE",
                  "shot":"after-com-source-backed-focus"},
              "explicit-NC-refusal":{
                  "check":"NO_FABRICATED_FOCUS_ON_COM_HOLD",
                  "shot":"after-com-focus-hold"},
          }
          first_ids={c["id"] for c in report["viewports"][0]["checks"]}
          modes=[name for name,variant in proof_variants.items()
                 if first_ids==common_checks|{variant["check"]}]
          assert len(modes)==1, "Unknown or mixed R23-G4 evidence contract"
          mode=modes[0]
          variant=proof_variants[mode]
          checks=common_checks|{variant["check"]}
          shots=common_shots+[variant["shot"]]+final_shots
          for v in report["viewports"]:
              assert v["valid"] and not v["errors"], v
              assert isinstance(v["checks"],list) and len(v["checks"])==len(checks)
              assert {c["id"] for c in v["checks"]}==checks, "Inconsistent proof mode across viewports"
              assert all(c["status"]=="PASS" for c in v["checks"])
              evidence_by_id={c["id"]:c["evidence"] for c in v["checks"]}
              focus=evidence_by_id[variant["check"]]
              if mode=="verified-source-points":
                  assert isinstance(focus,dict), "Focus lacks exact source evidence"
                  assert isinstance(focus.get("factor_id"),str) and focus["factor_id"].strip()
                  assert isinstance(focus.get("points"),list) and len(focus["points"])>0
                  assert all(isinstance(p,str) and p.strip() for p in focus["points"])
                  assert focus.get("lines")==[], "Invented Focus lines forbidden"
                  assert focus.get("clinical_release") is False
              else:
                  assert focus=="Row remains NC and no Focus event/geometry is authorized"
              phase1=evidence_by_id["NON_V1_ANALYSES_ARE_NOT_SELECTABLE"]
              assert phase1["options"]==["com","steiner"]
              assert phase1["tracing"]==["com","steiner"]
              assert phase1["phase2_not_exposed"] is True
              last=evidence_by_id["COM_LAST_FACTOR_ACCESSIBLE_AND_UNOBSCURED"]
              assert last["bottomPadding"] >= 120
              assert last["rowTop"] >= last["scrollTop"]-1
              assert last["rowBottom"] <= last["scrollBottom"]+1
              expected_shots=[v["viewport"]+"-"+label+".png" for label in shots]
              assert v["shots"]==expected_shots, "Absent or unexpected source-proof screenshot"
              for filename in expected_shots:
                  proof=root/filename
                  assert proof.is_file() and proof.stat().st_size>128, filename
                  with proof.open("rb") as handle:
                      assert handle.read(8)==bytes.fromhex("89504e470d0a1a0a"), filename
          print("R23_G4_EXPERIMENTAL_AFTER_TWO_DESKTOP_VIEWPORTS_PASS")
          PY
      - name: FUE V1 four-step Desktop real UI and SQLite persistence (synthetic, nonclinical)
        working-directory: frontend
        run: node scripts/fue-ceph-v1-fourstep-desktop.mjs
      - name: Verify 10 exploratory cross-step checks, unsigned 4-part PDF and zero official archive
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          import fitz
          from backend import database,models
          root=Path("artifacts/ceph-v1-fourstep-fue")
          report=json.loads((root/"report.json").read_text())
          assert report["head"]==os.environ["PRODUCT_HEAD"]
          assert report["outcome"]=="CROSSSTEP_EXPERIMENTAL_AUTOMATED_SCOPE_PASS"
          expected={
              "LOGIN_REAL_CABINET","STEP1_EXPLICIT_SOURCE_STUDY",
              "STEP2_DDM_MANUAL_NO_FICTITIOUS_REAL_DDM",
              "STEP3_PROVENANCE_AND_UNVERIFIED_DIAGNOSIS",
              "STEP4_DOCUMENT_DRAFT_NOT_THERAPY_DECISION",
              "A4_SAME_STUDY_REVISION_UNSIGNED_PDF",
              "OFFICIAL_ARCHIVE_DIRECT_HTTP_FAIL_CLOSED",
              "SAVE_CLINICAL_NOTES_WITHOUT_SIGNATURE",
              "SECOND_STUDY_HAS_NO_OLDER_CLINICAL_INPUTS",
              "REOPEN_ORIGINAL_STUDY_PERSISTED_VALUES",
          }
          assert {c["id"] for c in report["checks"]}==expected
          assert all(c["status"]=="PASS" for c in report["checks"])
          assert report["clinical_release"] is False and report["official_archival_allowed"] is False
          assert len(report["screenshots"])>=7
          assert all((root/name).is_file() for name in report["screenshots"])
          with fitz.open(root/"fourstep-unsigned-draft.pdf") as doc:
              assert len(doc)>=1
              body="\n".join(p.get_text() for p in doc)
              for marker in ("CÉPHALOMÉTRIE ET TRACÉ",
                             "EXAMEN DES MOULAGES ET DES IMAGES",
                             "BILAN DIAGNOSTIQUE ET DIAGNOSTIC FINAL",
                             "PLAN DE TRAITEMENT","BROUILLON","NON SIGNÉ"):
                  assert marker in body,marker
          from pathlib import Path
          fixture=json.loads(next(line.split('=',1)[1] for line in Path("/tmp/p2ter-seed.log").read_text().splitlines() if line.startswith("P2TER_SYNTHETIC_STUDIES=")))
          with database.SessionLocal() as db:
              count=db.query(models.DocumentArchive).filter(
                  models.DocumentArchive.patient_id==fixture["patient_id"],
                  models.DocumentArchive.document_type==models.DocumentType.RAPPORT_CEPHALO,
              ).count()
              assert count==0,f"Unsigned 4-part A4 created {count} official archives"
          print("CEPH_V1_EXPERIMENTAL_FOURSTEP_PERSISTENCE_AND_DRAFT_PASS")
          print("NOT_A_COMPLETE_74_FUE_BATTERY_OR_CLINICAL_RELEASE")
          PY
      - name: Dump isolated runtime diagnostic on failure
        if: failure()
        run: |
          tail -100 /tmp/p2ter-backend.log || true
          tail -100 /tmp/p2ter-frontend.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ceph-p2ter-real-cabinet-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            artifacts/ceph-p2ter-authenticated-desktop/
            artifacts/ceph-p2ter-fue-i/
            artifacts/ceph-r23g4-reference-ui/
            artifacts/ceph-v1-fourstep-fue/
          if-no-files-found: warn
          retention-days: 30
