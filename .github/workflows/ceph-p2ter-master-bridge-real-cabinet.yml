name: CEPH P2ter master bridge authenticated real Cabinet FUE-I (experimental)
on:
  push:
    branches: [master]
    paths:
      - 'backend/routers/cephalo*.py'
      - 'backend/services/cephalo/**'
      - 'backend/tests/test_cephalo_*.py'
      - 'frontend/src/features/ortho/**'
      - 'scripts/ceph_p2ter_seed_t2.py'
      - 'scripts/t2_runtime_server.py'

permissions:
  contents: read
concurrency:
  group: postmerge-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cabinet-real-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ENVIRONMENT: test
      SECRET_KEY: p2ter-t2-disposable-only-secret-key-000001
      DATABASE_URL: sqlite:///./t2-runtime-cert.db
      DIGITALCROWN_ISOLATED_RUNTIME: "1"
      DIGITALCROWN_ISOLATION_DB_FINGERPRINT: c04779c8d18b3ac12a0f4093a47a5d0c3c0e2251714be532893cfa052e9ee780
      TELEMETRY_ENABLED: "false"
      CLOUD_AI_ENABLED: "false"
      DEBUG: "false"
      ALLOWED_ORIGINS: http://127.0.0.1:5173,http://localhost:5173
      PRODUCT_HEAD: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Require exact HEAD in T2 lab
        run: test "$(git rev-parse HEAD)" = "$PRODUCT_HEAD"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Generate disposable T2 password (masked)
        run: |
          password="$(python -c 'import secrets; print(secrets.token_urlsafe(24))')"
          echo "::add-mask::$password"
          echo "T2_PASSWORD=$password" >> "$GITHUB_ENV"
          # One ephemeral, independent SQLCipher key for server and seed.
          # Never reuse the authentication key for encrypted storage.
          storage_key="$(python -c 'import secrets; print(secrets.token_hex(32))')"
          echo "::add-mask::$storage_key"
          echo "SQLCIPHER_KEY_HEX=$storage_key" >> "$GITHUB_ENV"
      - name: Install backend isolated
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.10.0 torchvision==0.25.0 torchaudio==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^(torch|torchvision|torchaudio)([<=>].*)?$' requirements.txt > /tmp/p2ter-cabinet-dependencies.txt
          pip install -r /tmp/p2ter-cabinet-dependencies.txt
          python -m pip check
      - name: Install frontend and Playwright
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save --package-lock=false --legacy-peer-deps playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start isolated T2 FastAPI runtime (real JWT and workstation)
        run: |
          python scripts/t2_runtime_server.py > /tmp/p2ter-backend.log 2>&1 &
          echo $! > /tmp/p2ter-backend.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8005/health >/dev/null; then exit 0; fi
            sleep 1
          done
          tail -100 /tmp/p2ter-backend.log
          exit 1
      - name: Seed two synthetic versioned studies on disposable test DB
        run: |
          python -m scripts.ceph_p2ter_seed_t2 | tee /tmp/p2ter-seed.log
          studies="$(python - <<'PY'
          import json
          text=open('/tmp/p2ter-seed.log').read()
          line=next(x.split('=',1)[1] for x in text.splitlines() if x.startswith('P2TER_SYNTHETIC_STUDIES='))
          print(json.dumps(json.loads(line),separators=(',',':')))
          PY
          )"
          echo "P2TER_STUDIES=$studies" >> "$GITHUB_ENV"
      - name: Verify synthetic T2 calibration plate (never a patient radiograph)
        run: |
          python - <<'PY'
          from pathlib import Path
          import struct, zlib
          data=Path("backend/static/uploads/radios/t2-cephalo-seeded.png").read_bytes()
          assert data[:8]==bytes.fromhex("89504e470d0a1a0a")
          width,height,bit_depth,color_type,compression,filter_method,interlace=struct.unpack(">IIBBBBB",data[16:29])
          assert (width,height,bit_depth,color_type,compression,filter_method,interlace)==(1935,2400,8,0,0,0,0)
          i=8
          chunks=[]
          while i<len(data):
              size=struct.unpack(">I",data[i:i+4])[0]
              kind=data[i+4:i+8]
              if kind==b"IDAT": chunks.append(data[i+8:i+8+size])
              i+=12+size
              if kind==b"IEND": break
          raw=zlib.decompress(b"".join(chunks))
          assert len(raw)==height*(width+1)
          sample={(x,y):raw[y*(width+1)+1+x] for x,y in
              [(100,120),(100,1400),(967,1200),(1000,0),(967,500)]}
          assert len(set(sample.values()))>=3 and max(sample.values())-min(sample.values())>=60,sample
          print("R23_G4_NONCLINICAL_SYNTHETIC_PLATE_VISIBLE",sample)
          PY
      - name: Start real Cabinet React frontend
        working-directory: frontend
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 > /tmp/p2ter-frontend.log 2>&1 &
          echo $! > /tmp/p2ter-frontend.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:5173 >/dev/null; then exit 0; fi
            sleep 1
          done
          tail -100 /tmp/p2ter-frontend.log
          exit 1
      - name: REAL UI login, history study A/B, JWT PDF at two desktops
        working-directory: frontend
        run: node scripts/certify-ceph-p2ter-authenticated-cabinet.mjs
      - name: Verify A4 PDF identity and rendered nonclinical pages
        run: |
          python - <<'PY'
          from pathlib import Path
          import fitz,json
          root=Path('artifacts/ceph-p2ter-authenticated-desktop')
          report=json.loads((root/'report.json').read_text())
          assert report['head']=='${{ github.sha }}' and len(report['viewports'])==2
          assert all(item['valid'] for item in report['viewports'])
          for label in ('1280x900','1600x1000'):
              for kind in ('older','newer'):
                  p=root/(label+'-'+kind+'-selected-study.pdf')
                  with fitz.open(p) as doc:
                      assert len(doc)>=2
                      clinical_text=' '.join(page.get_text() for page in doc)
                      sentinel='P2TER_SENTINEL_A_ONLY'
                      # Official PDF rendering deliberately consumes the
                      # scientific projection, not clinician free-text as
                      # authoritative content. Do NOT demand A's marker be
                      # rendered: A/B binding is checked at the authenticated
                      # form + request payload. This checks only visible B leak.
                      if kind=='newer':
                          assert sentinel not in clinical_text, 'A-only clinical sentinel leaked to B PDF'
                      for index,page in enumerate(doc):
                          assert 590 < page.rect.width < 600 and 838 < page.rect.height < 845
                          if index<8:
                              page.get_pixmap(matrix=fitz.Matrix(1,1),alpha=False).save(root/(label+'-'+kind+'-page-'+str(index+1)+'.png'))
          PY
      - name: Verify clicked archives persisted same old study and scientific revision
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import fitz
          from backend import database, models
          source=json.loads(Path('artifacts/ceph-p2ter-authenticated-desktop/report.json').read_text())
          studied=json.loads(next(line.split('=',1)[1] for line in Path('/tmp/p2ter-seed.log').read_text().splitlines() if line.startswith('P2TER_SYNTHETIC_STUDIES=')))
          with database.SessionLocal() as db:
              rows=db.query(models.DocumentArchive).filter(models.DocumentArchive.patient_id==studied['patient_id'], models.DocumentArchive.document_type==models.DocumentType.RAPPORT_CEPHALO).all()
              assert len(rows)==2, f"Idempotency requires exactly one archive for A and B rev2, got {len(rows)}"
              assert {row.analysis_id for row in rows}=={studied['older_id'],studied['latest_id']}
              assert all(row.clinical_data.get('cephalo_analysis_revision')==2 for row in rows)
              assert len({(row.analysis_id,row.clinical_data['cephalo_analysis_revision']) for row in rows})==2
          for viewport in source['viewports']:
              assert any('REAL_CABINET_ARCHIVE_BUTTON_OLDER_STUDY_' in check for check in viewport['checks'])
              pdf=Path('artifacts/ceph-p2ter-authenticated-desktop')/(viewport['viewport']+'-older-click-archived.pdf')
              with fitz.open(pdf) as doc:
                  assert len(doc)>=2 and all(590 < page.rect.width < 600 and 838 < page.rect.height < 845 for page in doc)
          print('P2TER_CLICK_ARCHIVE_DB_FK_REVISION_AND_A4_PASS')
          PY
      - name: EXPERIMENTAL FUE-I first useful PDF on two supported desktop viewports
        working-directory: frontend
        run: node scripts/fue-ceph-p2ter-first-value.mjs
      - name: Verify FUE-I report and same-viewport before-after captures
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report_path=Path("artifacts/ceph-p2ter-fue-i/report.json")
          report=json.loads(report_path.read_text())
          assert report["head"] == "${{ github.sha }}"
          assert {r["viewport"] for r in report["viewports"]} == {"1280x900","1600x1000"}
          assert report["overall"] == "FUE_I_AUTOMATED_SCOPE_PASS"
          required_checks={
              "CLEAN_BROWSER_LOGIN","DASHBOARD_PATIENT_SEARCH","ENTER_IMAGING",
              "OPEN_CEPHALO","SELECT_OLDER_STUDY","DESKTOP_STEPPER",
              "NO_HORIZONTAL_VIEWPORT_OVERFLOW","DRAFT_PDF_FIRST_VALUE","OFFICIAL_ARCHIVE_REPLAY",
          }
          for r in report["viewports"]:
              assert r["valid"] and all(c["status"] == "PASS" for c in r["matrix"])
              assert {c["id"] for c in r["matrix"]} == required_checks, "Missing real UI discovery or first-value check"
              # Native Chromium window.confirm is not present in AFTER screenshots:
              # verify the actual dialog text, tied to the replayed selected study.
              feedback=r.get("archiveUiFeedback") or {}
              assert feedback.get("kind") == "native-window.confirm"
              assert "Archive existante réutilisée sans modification" in feedback.get("message","")
              assert "étude "+str(r["firstValue"]["analysis_id"]) in feedback.get("message","")
              for label in ("before-hub", "after-login", "before-patient-search",
                            "patient-search-result","after-patient-opened",
                            "after-imaging-opened","before-select-study",
                            "before-first-value","before-first-value-actions",
                            "after-first-value","before-official-archive-replay",
                            "after-official-archive-replay"):
                  filename=r["viewport"]+"-"+label+".png"
                  assert (report_path.parent/filename).is_file(), filename
          print("P2TER_FUE_I_AUTOMATED_EVIDENCE_VERIFIED")
          PY
      - name: R23-G4 EXPERIMENTAL authenticated desktop AFTER evidence (COM/Focus)
        working-directory: frontend
        run: node scripts/certify-ceph-r23g4-reference-ui.mjs
      - name: Verify R23-G4 two-viewport real UI source-proof screenshots
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("artifacts/ceph-r23g4-reference-ui")
          report=json.loads((root/"report.json").read_text())
          assert report["head"]=="${{ github.sha }}"
          assert report["overall"]=="R23_G4_EXPERIMENTAL_DESKTOP_AFTER_PASS"
          assert {v["viewport"] for v in report["viewports"]}=={"1280x900","1600x1000"}
          checks={"GENUINE_CABINET_LOGIN_AND_STUDY_SELECTION",
                  "COM10_SOURCE_ROWS_EXACT_REVISION","NO_FABRICATED_FOCUS_ON_COM_HOLD",
                  "RICKETTS_ATLAS33_VS_GREGORET13","SECOND_STUDY_HAS_NO_STALE_REFERENCE",
                  "COM_LAST_FACTOR_ACCESSIBLE_AND_UNOBSCURED","NO_DESKTOP_VIEWPORT_OVERFLOW"}
          screenshots={"before-from-stable-all","after-com-ten-factor","after-com-focus-hold",
                       "after-ricketts-atlas33","after-ricketts-gregoret13","after-other-study-rebound",
                       "after-com-last-factor-accessible"}
          for v in report["viewports"]:
              assert v["valid"] and not v["errors"], v
              assert {c["id"] for c in v["checks"]}==checks
              assert all(c["status"]=="PASS" for c in v["checks"])
              last=next(c for c in v["checks"] if c["id"]=="COM_LAST_FACTOR_ACCESSIBLE_AND_UNOBSCURED")
              evidence=last["evidence"]
              assert evidence["bottomPadding"] >= 120
              assert evidence["rowTop"] >= evidence["scrollTop"]-1
              assert evidence["rowBottom"] <= evidence["scrollBottom"]+1
              for label in screenshots:
                  assert (root/(v["viewport"]+"-"+label+".png")).is_file()
          print("R23_G4_EXPERIMENTAL_AFTER_TWO_DESKTOP_VIEWPORTS_PASS")
          PY
      - name: Dump isolated runtime diagnostic on failure
        if: failure()
        run: |
          tail -100 /tmp/p2ter-backend.log || true
          tail -100 /tmp/p2ter-frontend.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ceph-p2ter-real-cabinet-${{ github.sha }}
          path: |
            artifacts/ceph-p2ter-authenticated-desktop/
            artifacts/ceph-p2ter-fue-i/
            artifacts/ceph-r23g4-reference-ui/
          if-no-files-found: warn
          retention-days: 30
