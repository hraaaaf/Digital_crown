name: P6 Aariz Training Qualification

on:
  push:
    branches:
      - portability/p6-scientific-assets-refresh
    paths:
      - scripts/p6_aariz_training_qualification.py
      - tests/test_p6_aariz_training_metrics.py
      - .github/workflows/p6-aariz-training-qualification.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p6-aariz-training-qualification
  cancel-in-progress: false

jobs:
  qualify-training-and-mm-metrics:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact research HEAD
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned CPU qualification stack
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install \
            --index-url https://download.pytorch.org/whl/cpu \
            "torch==2.3.0+cpu"
          python -m pip install \
            "numpy==1.26.4" \
            "Pillow==10.4.0" \
            "pytest==8.3.2"

      - name: Unit-test physical metric math before dataset download
        run: python -m pytest tests/test_p6_aariz_training_metrics.py -q

      - name: Download exact Aariz Figshare v1 asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p p6-aariz-training/work p6-aariz-training/evidence
          curl --fail --location --retry 3 --retry-delay 5 \
            --output p6-aariz-training/work/Aariz.zip \
            https://figshare.com/ndownloader/files/51041642

      - name: Re-verify exact archive and safely extract real dataset
        run: >-
          python scripts/p6_aariz_ingestion_probe.py
          --zip p6-aariz-training/work/Aariz.zip
          --extract-dir p6-aariz-training/work/extracted
          --output p6-aariz-training/evidence/ingestion_manifest.json

      - name: Run short real-data training qualification
        run: >-
          python scripts/p6_aariz_training_qualification.py
          --extracted-dir p6-aariz-training/work/extracted
          --output p6-aariz-training/evidence/training_qualification.json
          --train-samples 32
          --valid-samples 16
          --epochs 3

      - name: Prove product tree stayed untouched
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- backend frontend
          git status --short

      - name: Remove all radiographs and annotations before upload
        if: always()
        shell: bash
        run: rm -rf p6-aariz-training/work

      - name: Upload compact qualification evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p6-aariz-training-qualification
          path: p6-aariz-training/evidence
          if-no-files-found: warn
          retention-days: 14
