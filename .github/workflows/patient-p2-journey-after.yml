name: Patient P2 Journey After

on:
  pull_request:
    branches: [master]
    paths:
      - 'frontend/src/features/patients/components/PatientJourney.tsx'
      - 'frontend/src/components/clinical/FlashSummary.tsx'
      - 'backend/tests/test_patient_p2_journey_truth.py'
      - 'docs/PATIENT_P2_JOURNEY_GOAL.md'
      - '.github/workflows/patient-p2-journey-after.yml'

permissions:
  contents: read

jobs:
  after:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ENVIRONMENT: test
      SECRET_KEY: patient-p2-after-secret-000001
      DATABASE_URL: sqlite:///./t2-runtime-cert.db
      TELEMETRY_ENABLED: 'false'
      CLOUD_AI_ENABLED: 'false'
      DEBUG: 'false'
      ALLOWED_ORIGINS: 'http://127.0.0.1:5173,http://localhost:5173'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: P2 source truth contract
        run: |
          python - <<'PY'
          from pathlib import Path
          journey = Path('frontend/src/features/patients/components/PatientJourney.tsx').read_text(encoding='utf-8')
          flash = Path('frontend/src/components/clinical/FlashSummary.tsx').read_text(encoding='utf-8')
          for required in [
              'Prochaine action', 'Aucune action planifiée', 'Aucun plan enregistré',
              'Solde indéterminé', 'Source :', 'Ouvrir la source',
              "setSearchParams({ tab: 'clinical' })",
          ]:
              assert required in journey, required
          assert "setSearchParams({ tab: 'admin' })" not in journey
          assert 'risk_level' not in flash
          assert '/ai-summary' not in flash
          assert 'return null' in flash
          PY

      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.12.0 torchvision==0.27.0 --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^(torch|torchvision)([<=>].*)?$' requirements.txt > /tmp/requirements-p2-after.txt
          pip install -r /tmp/requirements-p2-after.txt
          pip install httpx==0.27.2

      - name: P2 targeted backend truth tests
        run: pytest -q backend/tests/test_patient_p2_journey_truth.py

      - name: Install frontend and Chromium
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Frontend tests and build
        working-directory: frontend
        run: |
          npm test -- --run
          npm run build

      - name: Start backend
        run: |
          rm -f t2-runtime-cert.db
          python scripts/t2_runtime_server.py > /tmp/p2-after-backend.log 2>&1 &
          for i in {1..90}; do if curl -fsS http://127.0.0.1:8005/health >/dev/null; then exit 0; fi; sleep 1; done
          cat /tmp/p2-after-backend.log
          exit 1

      - name: Start frontend
        working-directory: frontend
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 > /tmp/p2-after-front.log 2>&1 &
          for i in {1..90}; do if curl -fsS http://127.0.0.1:5173 >/dev/null; then exit 0; fi; sleep 1; done
          cat /tmp/p2-after-front.log
          exit 1

      - name: Capture P2 AFTER
        working-directory: frontend
        run: |
          mkdir -p ../artifacts/p2-journey-after
          cat > .p2-after.mjs <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import { chromium, request } from 'playwright';
          const out=path.resolve('../artifacts/p2-journey-after');
          const viewports=[{width:390,height:844},{width:430,height:932},{width:768,height:1024},{width:1280,height:900}];
          const api=await request.newContext({baseURL:'http://127.0.0.1:8005'});
          const login=await api.post('/api/auth/login',{form:{username:'t2-browser@cabinet.ma',password:'T2BrowserPass123!'}});
          if(!login.ok()) throw new Error(await login.text());
          const tok=await login.json(); const headers={Authorization:`Bearer ${tok.access_token}`};
          const ps=await api.get('/api/patients',{headers});
          const patient=(await ps.json()).find(p=>p.numero_dossier==='T2-0001');
          if(!patient) throw new Error('T2 patient missing');
          const browser=await chromium.launch({headless:true}); const evidence=[];
          for(const viewport of viewports){
            const ctx=await browser.newContext({viewport,colorScheme:'light'}); const page=await ctx.newPage();
            await page.addInitScript(({a,r})=>{localStorage.setItem('token',a);localStorage.setItem('refresh_token',r||'');localStorage.setItem('appMode','prod');},{a:tok.access_token,r:tok.refresh_token});
            const errors=[]; const http5xx=[];
            page.on('pageerror',e=>errors.push(String(e)));
            page.on('response',r=>{if(r.status()>=500)http5xx.push({url:r.url(),status:r.status()});});
            await page.goto(`http://127.0.0.1:5173/patients/${patient.id}`,{waitUntil:'networkidle',timeout:90000});
            await page.getByText('Prochaine action',{exact:true}).waitFor({state:'visible',timeout:30000});
            await page.waitForTimeout(800);
            for(const required of ['Aucune action planifiée','Aucun plan enregistré','Situation financière']){
              if(await page.getByText(required,{exact:true}).count()===0) throw new Error(`P2 truth label missing: ${required} @ ${viewport.width}`);
            }
            if(await page.getByText(/Risque:/).count()>0) throw new Error(`opaque risk summary still visible @ ${viewport.width}`);
            if(await page.getByText('0/0',{exact:true}).count()>0) throw new Error(`false plan 0/0 still visible @ ${viewport.width}`);
            if(await page.getByText('Source :',{exact:false}).count()<3) throw new Error(`summary provenance missing @ ${viewport.width}`);
            const overflow=await page.evaluate(()=>document.documentElement.scrollWidth>document.documentElement.clientWidth+2);
            const shot=`p2-after-${viewport.width}x${viewport.height}.png`;
            await page.screenshot({path:path.join(out,shot),fullPage:false});
            evidence.push({viewport,overflow,errors,http5xx,shot});
            await ctx.close();
          }
          const summary={captures:evidence.length,noHorizontalOverflow:evidence.every(x=>!x.overflow),runtimeErrors:evidence.filter(x=>x.errors.length),http5xx:evidence.filter(x=>x.http5xx.length),opaqueRiskAbsent:true,falsePlanZeroAbsent:true,provenanceVisible:true};
          fs.writeFileSync(path.join(out,'evidence.json'),JSON.stringify(evidence,null,2));
          fs.writeFileSync(path.join(out,'summary.json'),JSON.stringify(summary,null,2));
          await browser.close(); await api.dispose();
          if(summary.captures!==4||!summary.noHorizontalOverflow||summary.runtimeErrors.length||summary.http5xx.length) process.exit(1);
          JS
          node .p2-after.mjs
          rm .p2-after.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: patient-p2-journey-after
          path: artifacts/p2-journey-after
          if-no-files-found: error
          retention-days: 14
