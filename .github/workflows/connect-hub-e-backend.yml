name: Connect Hub E Backend Certification

on:
  workflow_dispatch:
  push:
    branches: [feat/lot-e-connect-hub]
    paths:
      - 'backend/routers/connect_hub.py'
      - 'backend/routers/mobile_push.py'
      - 'backend/tests/test_connect_hub_contract.py'
      - 'backend/tests/test_connect_hub_runtime.py'
      - 'backend/tests/test_mobile_identity_security.py'
      - '.github/workflows/connect-hub-e-backend.yml'
  pull_request:
    branches: [master]
    paths:
      - 'backend/routers/connect_hub.py'
      - 'backend/routers/mobile_push.py'
      - 'backend/tests/test_connect_hub_contract.py'
      - 'backend/tests/test_connect_hub_runtime.py'
      - 'backend/tests/test_mobile_identity_security.py'
      - '.github/workflows/connect-hub-e-backend.yml'

permissions:
  contents: read

jobs:
  backend-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SECRET_KEY: ci-only-secret-key-minimum-32-characters-long
      DATABASE_URL: "sqlite:///:memory:"
      ENVIRONMENT: development
      TELEMETRY_ENABLED: "false"
      CLOUD_AI_ENABLED: "false"
    steps:
      - name: Checkout exact LOT E HEAD
        uses: actions/checkout@v4

      - name: Record exact product HEAD
        run: |
          PRODUCT_HEAD=$(git rev-parse HEAD)
          echo "PRODUCT_HEAD=$PRODUCT_HEAD" >> "$GITHUB_ENV"
          echo "LOT E backend certification HEAD=$PRODUCT_HEAD"

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.12.0 torchvision==0.27.0 --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^(torch|torchvision)([<=>].*)?$' requirements.txt > /tmp/requirements-ci.txt
          pip install -r /tmp/requirements-ci.txt
          pip install httpx==0.27.2 pytest pytest-asyncio

      - name: Prod safety check
        run: python scripts/prod_safety_check.py

      - name: Canonical Web Push and Connect Hub targeted regression
        run: |
          python -m pytest \
            backend/tests/test_mobile_identity_security.py \
            backend/tests/test_connect_hub_contract.py \
            backend/tests/test_connect_hub_runtime.py \
            -q --maxfail=1
