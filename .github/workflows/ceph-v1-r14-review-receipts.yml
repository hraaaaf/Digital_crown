name: CEPH V1 R14 audited hold receipts (NO DEPLOY)

on:
  push:
    branches:
      - feat/ceph-v1-r14-audit-receipts-20261103
    paths:
      - 'backend/services/cephalo_r14_review_receipt.py'
      - 'backend/routers/cephalo_clinical_studio.py'
      - 'backend/tests/test_cephalo_r14_review_receipt.py'
      - '.github/workflows/ceph-v1-r14-review-receipts.yml'
  pull_request:
    branches:
      - feat/ceph-v1-l3-practitioner-gate-20261102
    paths:
      - 'backend/services/cephalo_r14_review_receipt.py'
      - 'backend/routers/cephalo_clinical_studio.py'
      - 'backend/tests/test_cephalo_r14_review_receipt.py'
      - '.github/workflows/ceph-v1-r14-review-receipts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-r14-hold:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SECRET_KEY: 'ceph-r14-isolated-review-key-32-chars'
      DATABASE_URL: 'sqlite:///:memory:'
      ENVIRONMENT: test
      DIGITALCROWN_ISOLATED_RUNTIME: 'true'
      TELEMETRY_ENABLED: 'false'
      CLOUD_AI_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact candidate SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.10.0 torchvision==0.25.0 torchaudio==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^(torch|torchvision|torchaudio)([<=>].*)?$' requirements.txt > /tmp/ceph-r14-requirements.txt
          pip install -r /tmp/ceph-r14-requirements.txt
      - name: Test R14 audit receipts, prior R14 safety, R15 and PDF hold
        run: |
          python -m pytest -q \
            backend/tests/test_cephalo_r14_review_receipt.py \
            backend/tests/test_cephalo_r14_final_validation_safety.py \
            backend/tests/test_cephalo_r15_clinical_studio.py \
            backend/tests/test_cephalo_r17_pdf_projection.py
