name: Agenda A2 AFTER Visual Certification

on:
  pull_request:
    paths:
      - ".github/workflows/agenda-a2-after-visual.yml"
      - "frontend/src/features/agenda/**"
      - "frontend/src/pages/AgendaPage.tsx"
      - "frontend/src/AgendaClinicA2.test.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agenda-a2-after-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  capture-after:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend and Chromium
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run focused A2 contract test
        working-directory: frontend
        run: npx vitest run src/AgendaClinicA2.test.ts

      - name: Inject deterministic A2 AFTER harness
        working-directory: frontend
        run: |
          cat > agenda-a2-after.html <<'EOF'
          <!doctype html><html lang="fr"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Agenda A2 AFTER</title></head><body><div id="root"></div><script type="module" src="/src/agenda-a2-after.tsx"></script></body></html>
          EOF

          cat > src/agenda-a2-after.tsx <<'EOF'
          import React from 'react';
          import { createRoot } from 'react-dom/client';
          import { MemoryRouter } from 'react-router-dom';
          import './index.css';
          import { AgendaPage } from './pages/AgendaPage';
          import { ClinicPractitionerBar } from './features/clinic/ClinicPractitionerBar';
          import { useAuthStore } from './stores/useAuthStore';

          useAuthStore.setState({
            user: { id:1, email:'owner@agenda-a2.local', nom_complet:'Dr Lina Alaoui', role:'ADMIN', is_superadmin:false, permissions:{} } as any,
            isAuthenticated:true, isLoading:false, error:null,
          });

          createRoot(document.getElementById('root')!).render(
            <MemoryRouter initialEntries={['/agenda']}>
              <div className="min-h-screen min-w-0 overflow-x-hidden bg-slate-50 p-3 sm:p-4 lg:p-6">
                <ClinicPractitionerBar />
                <div className="mt-4 min-w-0"><AgendaPage /></div>
              </div>
            </MemoryRouter>,
          );
          EOF

          cat > agenda-a2-after.mjs <<'EOF'
          import { chromium } from 'playwright';
          import { createServer } from 'vite';
          import fs from 'node:fs/promises';

          const out='agenda-a2-after';
          await fs.mkdir(out,{recursive:true});
          const json=(body,status=200)=>({status,contentType:'application/json',body:JSON.stringify(body)});
          const mk=(id,patient_name,praticien_id,datetime_start,duration_minutes,motif,status='PRÉVU')=>({
            id,patient_name,patient_id:id+1000,praticien_id,datetime_start,duration_minutes,motif,status,
            scheduling_type:'EXACT_TIME',reminder_sent:false,
          });
          const lina=[
            mk(201,'Sara El Amrani',1,'2026-09-16T09:00:00',30,'Consultation'),
            mk(202,'Adam Tazi',1,'2026-09-16T11:00:00',45,'Endodontie','CONFIRMÉ'),
            mk(203,'Nora Idrissi',1,'2026-09-17T15:00:00',30,'Contrôle'),
          ];
          const youssef=[
            mk(211,'Yasmine Fassi',2,'2026-09-16T09:00:00',60,'Prothèse','CONFIRMÉ'),
            mk(212,'Omar Bennani',2,'2026-09-16T14:30:00',30,'Consultation'),
          ];
          const salma=[
            mk(221,'Aya Alaoui',3,'2026-09-16T10:30:00',30,'Contrôle'),
            mk(222,'Mehdi Kabbaj',3,'2026-09-18T16:00:00',45,'Chirurgie','EN_S_ATTENTE'),
          ];
          const legacy=[mk(299,'Legacy non assigné',null,'2026-09-16T12:00:00',30,'RDV historique')];
          const multiPractitioner={
            plan:'ELITE',
            dentists:[
              {dentist_id:1,dentist_name:'Dr Lina Alaoui',appointments:lina},
              {dentist_id:2,dentist_name:'Dr Youssef Benali',appointments:youssef},
              {dentist_id:3,dentist_name:'Dr Salma Idrissi',appointments:salma},
            ],
            legacy_unassigned:legacy,
            total_appointments:lina.length+youssef.length+salma.length+legacy.length,
          };
          const all=[...lina,...youssef,...salma,...legacy];
          const fixtures={
            '/api/admin/cabinet/me':{header_lines_fr:['Clinique A2']},
            '/api/clinics/me':{nom_praticien:'Dr Lina Alaoui',nom_cabinet:'Clinique A2',header_lines_fr:['Dr Lina Alaoui'],specialty_ids:[],contacts_json:{}},
            '/api/agenda/settings':{id:1,opening_time_morning:'09:00',closing_time_morning:'13:00',opening_time_afternoon:'14:00',closing_time_afternoon:'18:00',is_continuous:false,agenda_mode:'EXACT',use_tickets:true},
            '/api/agenda/exceptions':[],
            '/api/appointments/pending':[],
            '/api/upcoming-holidays':[],
            '/api/agenda/upcoming-holidays':[],
            '/api/team/':[],
            '/api/team':[],
            '/api/team/quota':{plan:'ELITE',dentistes_used:3,dentistes_max:null,secretaires_used:1,secretaires_max:null,pending_count:0,can_add_dentiste:true,can_add_secretaire:true},
            '/api/catalog/specialties':[],
          };

          const server=await createServer({server:{host:'127.0.0.1',port:4199,strictPort:true},clearScreen:false});
          await server.listen();
          const browser=await chromium.launch();
          const report=[];
          try {
            for(const [width,height] of [[390,844],[768,1024],[1280,900]]){
              const context=await browser.newContext({viewport:{width,height},locale:'fr-FR',timezoneId:'Africa/Casablanca'});
              const page=await context.newPage();
              const errors=[];
              let createdBody=null;
              page.on('pageerror',e=>errors.push(`pageerror: ${e.message}`));
              page.on('console',m=>{if(m.type()==='error')errors.push(`console: ${m.text()}`)});
              await page.route('**/api/**',async route=>{
                const req=route.request(); const url=new URL(req.url());
                if(url.pathname==='/api/appointments/multi-practitioner') return route.fulfill(json(multiPractitioner));
                if(url.pathname==='/api/appointments/check-conflicts') return route.fulfill(json({conflicts:[]}));
                if(url.pathname==='/api/appointments/' && req.method()==='POST'){
                  try { createdBody=req.postDataJSON(); } catch { createdBody=null; }
                  return route.fulfill(json({id:777,...(createdBody||{})}));
                }
                if(url.pathname==='/api/appointments/' || url.pathname.startsWith('/api/appointments?')) return route.fulfill(json(all));
                if(url.pathname.startsWith('/api/appointments')) return route.fulfill(json(url.pathname==='/api/appointments/pending'?[]:all));
                if(url.pathname==='/api/patients/') return route.fulfill(json([]));
                if(url.pathname==='/api/actes/catalog/search') return route.fulfill(json([]));
                if(url.pathname==='/api/actes/duration') return route.fulfill(json({duration:30}));
                if(req.method()!=='GET') return route.fulfill(json({}));
                return route.fulfill(json(fixtures[url.pathname] ?? {}));
              });

              await page.goto('http://127.0.0.1:4199/agenda-a2-after.html',{waitUntil:'networkidle'});
              await page.getByRole('heading',{name:'Agenda'}).waitFor({state:'visible',timeout:15000});
              await page.getByRole('button',{name:'Multi',exact:true}).click();
              await page.getByText('Heure',{exact:true}).waitFor({state:'visible',timeout:15000});
              await page.getByText('Non assigné · 12:00').waitFor({state:'visible',timeout:15000});

              const sara=await page.getByText('09:00 · Sara El Amrani',{exact:true}).boundingBox();
              const yasmine=await page.getByText('09:00 · Yasmine Fassi',{exact:true}).boundingBox();
              if(!sara || !yasmine || Math.abs(sara.y-yasmine.y)>2) throw new Error(`09:00 rows not synchronized at ${width}`);

              const scrollMetrics=await page.getByTestId('multi-practitioner-scroll').evaluate(el=>({clientWidth:el.clientWidth,scrollWidth:el.scrollWidth,scrollLeft:el.scrollLeft}));
              const layout=await page.evaluate(()=>({clientWidth:document.documentElement.clientWidth,scrollWidth:document.documentElement.scrollWidth,bodyScrollWidth:document.body.scrollWidth}));
              if(width===390 && scrollMetrics.scrollWidth<=scrollMetrics.clientWidth) throw new Error('mobile multi grid is not horizontally scrollable');
              if(layout.scrollWidth>layout.clientWidth) throw new Error(`page overflow ${layout.scrollWidth}>${layout.clientWidth} at ${width}`);
              if(errors.length) throw new Error(`runtime errors at ${width}: ${errors.join(' | ')}`);

              const row={width,height,...layout,internalScroll:scrollMetrics,legacyRendered:true,synchronized0900:true,errors};
              report.push(row);
              await fs.writeFile(`${out}/agenda-multi-${width}x${height}.json`,JSON.stringify(row,null,2));
              await page.screenshot({path:`${out}/agenda-multi-${width}x${height}.png`,fullPage:true,animations:'disabled'});

              if(width===1280){
                const conflictRequest=page.waitForRequest(req=>{
                  const url=new URL(req.url());
                  return url.pathname==='/api/appointments/check-conflicts' && url.searchParams.get('praticien_id')==='2';
                });
                await page.getByRole('button',{name:'Créer un rendez-vous avec Dr Youssef Benali à 15:00'}).click();
                await page.getByText('Praticien : Dr Youssef Benali',{exact:true}).waitFor({state:'visible'});
                await conflictRequest;
                await page.getByPlaceholder('Rechercher ou saisir un nom...').fill('Patient A2');
                await page.getByPlaceholder("Saisir l'acte ou rechercher dans le catalogue...").fill('Consultation A2');
                const createRequest=page.waitForRequest(req=>new URL(req.url()).pathname==='/api/appointments/' && req.method()==='POST');
                await page.getByRole('button',{name:'Confirmer le RDV'}).click();
                const request=await createRequest;
                const body=request.postDataJSON();
                if(Number(body.praticien_id)!==2) throw new Error(`lane create practitioner mismatch: ${JSON.stringify(body)}`);
                if(!createdBody || Number(createdBody.praticien_id)!==2) throw new Error(`fulfilled POST body mismatch: ${JSON.stringify(createdBody)}`);
                await fs.writeFile(`${out}/lane-create-contract.json`,JSON.stringify({praticien_id:body.praticien_id,datetime_start:body.datetime_start,duration_minutes:body.duration_minutes},null,2));
              }

              await context.close();
            }
            await fs.writeFile(`${out}/report.json`,JSON.stringify(report,null,2));
          } finally { await browser.close(); await server.close(); }
          EOF

      - name: Capture and verify AFTER 390 / 768 / 1280
        working-directory: frontend
        run: node agenda-a2-after.mjs

      - name: Verify AFTER evidence set
        working-directory: frontend
        run: |
          test "$(find agenda-a2-after -name '*.png' | wc -l)" -eq 3
          test "$(find agenda-a2-after -name 'agenda-multi-*.json' | wc -l)" -eq 3
          test -s agenda-a2-after/lane-create-contract.json
          cat > agenda-a2-after/metadata.txt <<EOF
          phase=AFTER
          head_sha=${{ github.event.pull_request.head.sha || github.sha }}
          before_product_base_sha=bc3d8d145670dc70dc6c6842e772e56d1d89aa99
          before_run_id=35084989399
          before_artifact_digest=sha256:c4fc22b6a489170e06b5a7f6ff09f76cdaa2e68ac40cec82c5bdd55abc7a3755
          viewports=390x844,768x1024,1280x900
          assertions=shared time axis; synchronized 09:00 events; legacy visible; mobile internal horizontal scroll; no page overflow; no runtime errors; Dr Youssef lane creation POST praticien_id=2
          EOF

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agenda-a2-after-visual-evidence
          path: frontend/agenda-a2-after/
          if-no-files-found: error
          retention-days: 14
