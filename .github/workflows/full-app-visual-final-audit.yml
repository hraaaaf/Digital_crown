name: Full App Visual Final Audit

on:
  push:
    branches: [audit/visual-final-2026-09-08]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-app-visual-final-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend and Chromium
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Build final audit harness
        working-directory: frontend
        run: |
          awk '/cat > full-app-visual-audit.mjs <<'"'"'EOF'"'"'/{flag=1;next}/^          EOF$/{flag=0}flag{sub(/^          /,"");print}' ../.github/workflows/full-app-visual-theme-audit.yml > full-app-visual-audit.mjs
          python - <<'PY'
          from pathlib import Path
          p = Path('full-app-visual-audit.mjs')
          s = p.read_text()
          s = s.replace("const themes = ['default', 'medical-ocean'];", "const themes = ['default', 'ocean'];")
          needle = "function fixture(pathname, method) {\n            if (pathname === '/health') return { status: 'ok' };"
          insert = """function fixture(pathname, method) {
            if (pathname.endsWith('/api/mobile/passkey/status')) return { state: 'disabled', credential_id: null, rp_id: 'digitalcrown.local', expected_origin: 'https://digitalcrown.local:8005', origin_ready: true, user_verification: 'required', server_gate: true };
            if (pathname.endsWith('/api/patients/1/journey')) return { patient_id: 1, window_months: 12, truncated: false, total_events_available: 2, summary: { active_plan_steps: 1, total_plan_steps: 2, remaining_due: 1200, has_billing_data: true, next_appointment: '2026-09-10T10:00:00', last_document_date: '2026-09-01T10:00:00' }, events: [ { event_key: 'appointment:1', source: 'appointment', type: 'appointment', ref_id: 1, date: '2026-09-10T10:00:00', title: 'Contrôle clinique', status: 'PLANIFIÉ', phase_hint: 'controle', navigation_target: 'INLINE', related_event_key: null }, { event_key: 'treatment_plan_step:1', source: 'treatment_plan_step', type: 'treatment_plan_step', ref_id: 1, date: '2026-09-08T10:00:00', title: 'Soin conservateur', status: 'PENDING', phase_hint: 'plan', navigation_target: 'TREATMENT_PLAN_TAB', related_event_key: null } ] };
            if (pathname.endsWith('/api/patients/1/documents')) return [];
            if (pathname.endsWith('/api/actes/patient/1')) return [];
            if (pathname.endsWith('/api/partner-catalog/products/1')) return { id: 1, supplierId: 1, supplierName: 'Dental Partner', externalProductId: 'VIS-001', name: 'Composite Universel', sku: 'VIS-001', dentalCategory: 'Restauration', dentalSpecialty: 'Dentisterie restauratrice', unit: 'Seringue 4 g', price: 420, availability: 'AVAILABLE', shortDescription: 'Composite universel de démonstration visuelle.', longDescription: 'Référence catalogue partenaire utilisée uniquement comme fixture déterministe pour la certification visuelle.', benefits: ['Lecture clinique rapide', 'Commande partenaire claire', 'Présentation premium'], isFeatured: true, sortOrder: 1 };
            if (pathname.endsWith('/api/partner-catalog/suppliers/1')) return { id: 1, supplierKey: 'visual-partner', name: 'Dental Partner', badge: 'Partenaire actif', description: 'Fournisseur de démonstration visuelle.', promise: 'Approvisionnement dentaire structuré.', apiBaseUrl: null, syncMode: 'API prête', isActive: true, productCount: 1 };
            if (pathname.endsWith('/api/superadmin/clients')) return [];
            if (pathname.endsWith('/api/superadmin/trial-codes')) return [];
            if (pathname === '/health') return { status: 'ok' };"""
          if needle not in s:
              raise SystemExit('fixture needle missing')
          s = s.replace(needle, insert)
          goto = "await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 30000 });"
          force = goto + "\n                  await page.evaluate((theme) => { if (theme === 'ocean') { document.documentElement.dataset.theme = 'ocean'; document.body.dataset.theme = 'ocean'; localStorage.setItem('digitalcrown_theme', 'ocean'); } else { delete document.documentElement.dataset.theme; delete document.body.dataset.theme; localStorage.removeItem('digitalcrown_theme'); } }, theme);"
          if goto not in s:
              raise SystemExit('goto needle missing')
          s = s.replace(goto, force)
          p.write_text(s)
          PY
          grep "const themes" full-app-visual-audit.mjs
          grep "passkey/status" full-app-visual-audit.mjs
      - name: Capture definitive routes and themes
        working-directory: frontend
        run: node full-app-visual-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-app-visual-final-audit
          path: artifacts/full-app-visual-audit
          retention-days: 14
          if-no-files-found: error
