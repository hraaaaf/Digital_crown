name: Pharmacology AMMPS First RCP Capture Probe

on:
  push:
    branches:
      - research/pharmacology-rcp-first-capture-20260916
    paths:
      - '.github/workflows/pharmacology-rcp-first-capture-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pharmacology-rcp-first-capture-probe
  cancel-in-progress: true

jobs:
  probe:
    name: Read-only AMMPS ibuprofen RCP capture probe
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rcp-probe"
          cd "$RUNNER_TEMP/rcp-probe"
          npm init -y >/dev/null 2>&1
          npm install --silent playwright
          npx playwright install --with-deps chromium
      - name: Inventory oral ibuprofen RCP controls and capture one enabled official PDF
        env:
          OUT_DIR: ${{ github.workspace }}/audit/out/pharmacology-rcp-first-capture-probe
          TARGET_URL: https://www.ammps.gov.ma/recherche-medicaments?page=27
        run: |
          set -euo pipefail
          mkdir -p "$OUT_DIR"
          cd "$RUNNER_TEMP/rcp-probe"
          node - <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const path = require('path');
          const crypto = require('crypto');
          const outDir = process.env.OUT_DIR;
          const targetUrl = process.env.TARGET_URL;
          const officialHosts = new Set(['ammps.gov.ma','www.ammps.gov.ma']);
          const norm = v => (v || '').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').trim().toUpperCase();
          const sha256 = b => crypto.createHash('sha256').update(b).digest('hex');
          const official = v => { try { const u=new URL(v); return u.protocol==='https:' && officialHosts.has(u.hostname); } catch { return false; } };

          (async()=>{
            const browser=await chromium.launch({headless:true});
            const context=await browser.newContext({acceptDownloads:true});
            const page=await context.newPage();
            const events=[]; const pdfs=[]; let armed=false;
            context.on('request', r=>{ if(armed) events.push({kind:'request',method:r.method(),url:r.url(),postData:r.postData()||null}); });
            context.on('response', async r=>{
              if(!armed) return;
              const h=await r.allHeaders(); const url=r.url();
              const looks=((h['content-type']||'').toLowerCase().includes('application/pdf') || (h['content-disposition']||'').toLowerCase().includes('.pdf') || /\.pdf(?:$|[?#])/i.test(url));
              events.push({kind:'response',status:r.status(),url,contentType:h['content-type']||null,contentDisposition:h['content-disposition']||null,looksPdf:looks});
              if(!looks) return;
              try { const body=await r.body(); const signatureOk=body.subarray(0,5).toString('ascii')==='%PDF-'; const item={source:'response',url,status:r.status(),contentType:h['content-type']||null,byteLength:body.length,signatureOk,officialHttps:official(url),sha256:sha256(body)}; pdfs.push(item); fs.writeFileSync(path.join(outDir,`response-${pdfs.length}.pdf`),body); } catch(e) { pdfs.push({source:'response',url,error:String(e)}); }
            });
            page.on('download', async d=>{
              if(!armed) return;
              const saved=path.join(outDir,'download-'+Date.now()+'-'+d.suggestedFilename().replace(/[^a-zA-Z0-9._-]/g,'_'));
              try { await d.saveAs(saved); const body=fs.readFileSync(saved); pdfs.push({source:'download',suggestedFilename:d.suggestedFilename(),byteLength:body.length,signatureOk:body.subarray(0,5).toString('ascii')==='%PDF-',sha256:sha256(body),sourceUrlVerified:false}); } catch(e) { events.push({kind:'download-error',error:String(e)}); }
            });
            try {
              const response=await page.goto(targetUrl,{waitUntil:'domcontentloaded',timeout:60000});
              if(!response || response.status()>=400) throw new Error('AMMPS page load failed');
              await page.waitForTimeout(5000);
              const inventory=await page.evaluate(()=>{
                const n=v=>(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').trim().toUpperCase();
                const controls=Array.from(document.querySelectorAll('a,button,[role="button"]')).filter(el=>n(el.textContent).includes('TELECHARGER RCP'));
                const out=[];
                for(const c of controls){
                  let node=c; let chosen=null;
                  while(node && node!==document.body){ const t=n(node.innerText||node.textContent||''); if(t.includes('IBUPROFENE')) { chosen={node,text:t}; break; } node=node.parentElement; }
                  if(!chosen) continue;
                  const modal=c.closest('.modal');
                  const disabled=c.getAttribute('aria-disabled')==='true'||c.classList.contains('disabled-rcp-btn')||c.hasAttribute('disabled');
                  out.push({enabled:!disabled,modalId:modal?modal.id:null,href:c.getAttribute('href'),onclick:c.getAttribute('onclick'),attributes:Array.from(c.attributes).reduce((a,x)=>(a[x.name]=x.value,a),{}),containerText:chosen.text});
                }
                const dedup=[]; const seen=new Set();
                for(const x of out){ const k=(x.modalId||'')+'|'+x.containerText; if(!seen.has(k)){seen.add(k);dedup.push(x);} }
                return dedup;
              });
              fs.writeFileSync(path.join(outDir,'ibuprofen-rcp-inventory.json'),JSON.stringify(inventory,null,2));
              await page.screenshot({path:path.join(outDir,'inventory.png'),fullPage:true});
              const enabled=inventory.filter(x=>x.enabled && x.modalId);
              const base={schemaVersion:'ammps-ibuprofen-rcp-probe.1',sourcePageUrl:targetUrl,inventory,enabledCount:enabled.length,manifestMutationPerformed:false,clinicalActivationPerformed:false};
              if(!enabled.length){ fs.writeFileSync(path.join(outDir,'probe-report.json'),JSON.stringify({...base,result:'NO_ENABLED_IBUPROFEN_RCP_CONTROL'},null,2)); console.log('NO_ENABLED_IBUPROFEN_RCP_CONTROL'); return; }
              const selected=enabled[0];
              await page.evaluate(id=>{
                const modal=document.getElementById(id); if(!modal) throw new Error('selected modal missing');
                const n=v=>(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').trim().toUpperCase();
                const c=Array.from(modal.querySelectorAll('a,button,[role="button"]')).find(el=>n(el.textContent).includes('TELECHARGER RCP')); if(!c) throw new Error('RCP control missing');
                c.setAttribute('data-rcp-probe-target','true');
                if(window.bootstrap&&window.bootstrap.Modal) window.bootstrap.Modal.getOrCreateInstance(modal).show(); else { modal.classList.add('show'); modal.style.display='block'; modal.removeAttribute('aria-hidden'); }
              },selected.modalId);
              await page.waitForTimeout(500); armed=true;
              await page.locator('[data-rcp-probe-target="true"]').click({timeout:15000});
              await page.waitForTimeout(10000);
              const verified=pdfs.filter(x=>x.source==='response'&&x.signatureOk===true&&x.officialHttps===true&&x.status>=200&&x.status<300);
              const result=verified.length===1?'ONE_OFFICIAL_PDF_RESPONSE_CAPTURED':verified.length>1?'MULTIPLE_OFFICIAL_PDF_RESPONSES_CAPTURED_REVIEW_REQUIRED':'NO_VERIFIED_OFFICIAL_PDF_RESPONSE_CAPTURED';
              fs.writeFileSync(path.join(outDir,'probe-report.json'),JSON.stringify({...base,selected,events,pdfCandidates:pdfs,verifiedResponsePdfs:verified,result},null,2));
              console.log(`Enabled ibuprofen RCP controls: ${enabled.length}`); console.log(`Verified official PDF responses: ${verified.length}`); console.log(`Probe result: ${result}`);
            } finally { await browser.close(); }
          })().catch(e=>{fs.writeFileSync(path.join(outDir,'probe-error.txt'),String(e&&e.stack?e.stack:e));console.error(e);process.exit(1);});
          NODE
      - name: Validate fail-closed report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('audit/out/pharmacology-rcp-first-capture-probe/probe-report.json')
          if not p.is_file(): raise SystemExit('probe-report.json missing')
          r=json.loads(p.read_text())
          if r.get('schemaVersion')!='ammps-ibuprofen-rcp-probe.1': raise SystemExit('wrong schema')
          if r.get('manifestMutationPerformed') is not False or r.get('clinicalActivationPerformed') is not False: raise SystemExit('mutation/activation forbidden')
          allowed={'NO_ENABLED_IBUPROFEN_RCP_CONTROL','NO_VERIFIED_OFFICIAL_PDF_RESPONSE_CAPTURED','ONE_OFFICIAL_PDF_RESPONSE_CAPTURED','MULTIPLE_OFFICIAL_PDF_RESPONSES_CAPTURED_REVIEW_REQUIRED'}
          if r.get('result') not in allowed: raise SystemExit('unexpected result')
          if r.get('result')=='ONE_OFFICIAL_PDF_RESPONSE_CAPTURED':
              v=r.get('verifiedResponsePdfs',[])
              if len(v)!=1 or not v[0].get('sha256') or not v[0].get('url'): raise SystemExit('verified PDF evidence incomplete')
          print(r['result'])
          PY
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pharmacology-ibuprofen-rcp-probe
          path: audit/out/pharmacology-rcp-first-capture-probe/
          retention-days: 30
