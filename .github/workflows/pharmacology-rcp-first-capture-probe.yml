name: Pharmacology AMMPS Strict Active RCP Identity Map

on:
  push:
    branches:
      - research/pharmacology-rcp-first-capture-20260916
    paths:
      - .github/workflows/pharmacology-rcp-first-capture-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  map:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Strictly bind each active RCP href to its exact AMMPS modal
        run: |
          python - <<'PY'
          import html as html_lib
          import json, re, time, urllib.request
          from pathlib import Path

          origin = 'https://www.ammps.gov.ma'
          targets = [
            (33, 'medicamentModal9736', 'uploads/rcp/rcp-9736-1789116233.pdf'),
            (33, 'medicamentModal9735', 'uploads/rcp/rcp-9735-1789116249.pdf'),
            (65, 'medicamentModal5208', 'uploads/rcp/rcp-5208-1789116272.pdf'),
            (67, 'medicamentModal4615', 'uploads/rcp/rcp-4615-1789116134.pdf'),
            (118, 'medicamentModal2732', 'uploads/rcp/rcp-2732-1789116342.pdf'),
            (118, 'medicamentModal2733', 'uploads/rcp/rcp-2733-1789116367.pdf'),
            (129, 'medicamentModal9807', 'uploads/rcp/9807.pdf'),
            (136, 'medicamentModal9281', 'uploads/rcp/rcp-9281-1789116503.pdf'),
            (175, 'medicamentModal9773', 'uploads/rcp/9773.pdf'),
            (175, 'medicamentModal9774', 'uploads/rcp/9774.pdf'),
            (190, 'medicamentModal8336', 'uploads/rcp/rcp-8336-1789116534.pdf'),
            (190, 'medicamentModal8337', 'uploads/rcp/rcp-8337-1789116546.pdf'),
            (244, 'medicamentModal2796', 'uploads/rcp/rcp-2796-1789116596.pdf'),
            (244, 'medicamentModal2797', 'uploads/rcp/rcp-2797-1789116606.pdf'),
            (244, 'medicamentModal9339', 'uploads/rcp/rcp-9339-1789116651.pdf'),
            (250, 'medicamentModal9841', 'uploads/rcp/9841.pdf'),
            (250, 'medicamentModal9842', 'uploads/rcp/9842.pdf'),
            (317, 'medicamentModal9836', 'uploads/rcp/9836.pdf'),
            (340, 'medicamentModal9718', 'uploads/rcp/9718.pdf'),
            (340, 'medicamentModal9719', 'uploads/rcp/9719.pdf'),
            (343, 'medicamentModal8033', 'uploads/rcp/rcp-8033-1789116685.pdf'),
            (366, 'medicamentModal6719', 'uploads/rcp/rcp-6719-1789117361.pdf'),
            (366, 'medicamentModal6720', 'uploads/rcp/rcp-6720-1789116827.pdf'),
            (366, 'medicamentModal8510', 'uploads/rcp/rcp-8510-1789116768.pdf'),
            (372, 'medicamentModal7990', 'uploads/rcp/rcp-7990-1789117045.pdf'),
            (493, 'medicamentModal8640', 'uploads/rcp/rcp-8640-1789117069.pdf'),
            (579, 'medicamentModal9819', 'uploads/rcp/9819.pdf'),
            (580, 'medicamentModal9822', 'uploads/rcp/9822.pdf'),
            (580, 'medicamentModal9823', 'uploads/rcp/9823.pdf'),
            (580, 'medicamentModal9824', 'uploads/rcp/9824.pdf'),
            (580, 'medicamentModal9825', 'uploads/rcp/9825.pdf'),
            (580, 'medicamentModal9826', 'uploads/rcp/9826.pdf'),
            (644, 'medicamentModal9406', 'uploads/rcp/rcp-9406-1789117115.pdf'),
            (649, 'medicamentModal9539', 'uploads/rcp/rcp-9539-1789116193.pdf'),
            (649, 'medicamentModal9540', 'uploads/rcp/rcp-9540-1789116175.pdf'),
            (666, 'medicamentModal9188', 'uploads/rcp/rcp-9188-1789117187.pdf'),
            (667, 'medicamentModal9189', 'uploads/rcp/rcp-9189-1789117169.pdf'),
            (667, 'medicamentModal9202', 'uploads/rcp/rcp-9202-1789116002.pdf'),
            (667, 'medicamentModal9203', 'uploads/rcp/rcp-9203-1789116101.pdf'),
            (677, 'medicamentModal8834', 'uploads/rcp/rcp-8834-1789117209.pdf'),
            (715, 'medicamentModal3051', 'uploads/rcp/rcp-3051-1789117231.pdf'),
            (716, 'medicamentModal5452', 'uploads/rcp/rcp-5452-1789117270.pdf'),
            (756, 'medicamentModal7318', 'uploads/rcp/rcp-7318-1789117293.pdf'),
            (758, 'medicamentModal7979', 'uploads/rcp/7979.pdf'),
            (759, 'medicamentModal7992', 'uploads/rcp/7992.pdf'),
            (759, 'medicamentModal9793', 'uploads/rcp/9793.pdf'),
            (759, 'medicamentModal9794', 'uploads/rcp/9794.pdf'),
            (759, 'medicamentModal9795', 'uploads/rcp/9795.pdf')
          ]

          def fetch(url):
              last = None
              for attempt in range(5):
                  try:
                      req = urllib.request.Request(url, headers={'User-Agent':'Digital-Crown-read-only-strict-active-rcp-map/1.0'})
                      with urllib.request.urlopen(req, timeout=30) as r:
                          return r.read().decode('utf-8', errors='replace')
                  except Exception as e:
                      last = e
                      if attempt < 4:
                          time.sleep(0.5 * (attempt + 1))
              raise last

          def clean(raw):
              raw = re.sub(r'<script[\s\S]*?</script>', ' ', raw, flags=re.I)
              raw = re.sub(r'<style[\s\S]*?</style>', ' ', raw, flags=re.I)
              raw = re.sub(r'<[^>]+>', ' ', raw)
              return re.sub(r'\s+', ' ', html_lib.unescape(raw)).strip()

          def exact_modal_block(page_html, modal_id):
              modal_re = re.compile(r'<div\b[^>]*\bid=["\'](medicamentModal\d+)["\'][^>]*>', re.I)
              starts = [(m.start(), m.group(1)) for m in modal_re.finditer(page_html)]
              positions = {mid: i for i, (_, mid) in enumerate(starts)}
              if modal_id not in positions:
                  raise SystemExit(f'exact modal start missing: {modal_id}')
              i = positions[modal_id]
              start = starts[i][0]
              end = starts[i + 1][0] if i + 1 < len(starts) else len(page_html)
              block = page_html[start:end]
              if re.search(r'<div\b[^>]*\bid=["\']medicamentModal\d+["\']', block[len(starts[i][1]):], re.I):
                  raise SystemExit(f'nested/ambiguous modal boundary: {modal_id}')
              return block

          dental = re.compile(r'AMOXICIL|CLARITHROMYC|METRONIDAZOL|CLINDAMYC|IBUPROF|PARACETAMOL|PHENOXYMETHYLPENICILL|PENICILLIN|SPIRAMYC|CLAVULAN|AZITHROMYC|DOXYCYCL|DICLOFENAC|KETOPROFEN|NAPROXEN|CHLORHEXID|LIDOCAIN|ARTICAIN|MEPIVACAIN|PRILOCAIN|EPINEPHRIN|ADRENALIN', re.I)
          pages = {}
          results = []
          for page, modal_id, href in targets:
              if page not in pages:
                  pages[page] = fetch(f'{origin}/recherche-medicaments?page={page}')
              block = exact_modal_block(pages[page], modal_id)
              href_count = block.count(href)
              if href_count != 1:
                  raise SystemExit(f'exact href binding failed modal={modal_id} count={href_count} href={href}')
              rcp_links = re.findall(r'href\s*=\s*["\']([^"\']*uploads/rcp/[^"\']+\.pdf[^"\']*)["\']', block, flags=re.I)
              if len(rcp_links) != 1 or rcp_links[0] != href:
                  raise SystemExit(f'ambiguous RCP links modal={modal_id} links={rcp_links}')
              text = clean(block)
              title_m = re.search(r'<h5[^>]*class=["\'][^"\']*modal-title[^"\']*["\'][^>]*>([\s\S]*?)</h5>', block, flags=re.I)
              title = clean(title_m.group(1)) if title_m else None
              sa_m = re.search(r'Substance active\s*:?[\s\S]{0,120}?<[^>]*>\s*([^<]{2,160})', block, flags=re.I)
              substance = clean(sa_m.group(1)) if sa_m else None
              match = dental.search(text)
              results.append({
                  'page': page,
                  'modalId': modal_id,
                  'href': href,
                  'title': title,
                  'substanceActiveParsed': substance,
                  'dentalRelevanceKeywordMatch': bool(match),
                  'matchedKeyword': match.group(0) if match else None,
                  'modalText': text,
                  'exactModalBinding': True,
                  'exactRcpHrefBinding': True,
                  'manifestMutationPerformed': False,
                  'clinicalActivationPerformed': False,
              })

          relevant = [x for x in results if x['dentalRelevanceKeywordMatch']]
          report = {
              'schemaVersion':'ammps-active-rcp-identity-map.3',
              'source':'https://www.ammps.gov.ma/recherche-medicaments',
              'mappedCount':len(results),
              'strictBindingCount':sum(1 for x in results if x['exactModalBinding'] and x['exactRcpHrefBinding']),
              'relevantKeywordMatchCount':len(relevant),
              'manifestMutationPerformed':False,
              'clinicalActivationPerformed':False,
              'relevant':relevant,
              'results':results,
          }
          out = Path('audit/out/pharmacology-active-rcp-identity-map-strict')
          out.mkdir(parents=True, exist_ok=True)
          (out/'active-rcp-identity-map-strict.json').write_text(json.dumps(report, ensure_ascii=False, indent=2))
          print(json.dumps({
              'mappedCount': report['mappedCount'],
              'strictBindingCount': report['strictBindingCount'],
              'relevantKeywordMatchCount': report['relevantKeywordMatchCount'],
              'relevant': [
                  {'page':x['page'],'modalId':x['modalId'],'href':x['href'],'title':x['title'],'substanceActiveParsed':x['substanceActiveParsed'],'matchedKeyword':x['matchedKeyword'],'modalText':x['modalText'][:1200]}
                  for x in relevant
              ]
          }, ensure_ascii=False, indent=2))
          PY
      - name: Validate strict identity map
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('audit/out/pharmacology-active-rcp-identity-map-strict/active-rcp-identity-map-strict.json')
          r=json.loads(p.read_text())
          assert r['schemaVersion']=='ammps-active-rcp-identity-map.3'
          assert r['mappedCount']==48
          assert r['strictBindingCount']==48
          assert len(r['results'])==48
          assert all(x['exactModalBinding'] and x['exactRcpHrefBinding'] for x in r['results'])
          assert all(x['href'].startswith('uploads/rcp/') for x in r['results'])
          assert r['manifestMutationPerformed'] is False and r['clinicalActivationPerformed'] is False
          print('STRICT_ACTIVE_RCP_IDENTITY_MAP_VERIFIED', r['mappedCount'], 'RELEVANT', r['relevantKeywordMatchCount'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pharmacology-active-rcp-identity-map-strict
          path: audit/out/pharmacology-active-rcp-identity-map-strict/
          retention-days: 30
