name: Pharmacology AMMPS RCP Availability Census

on:
  push:
    branches: [research/pharmacology-rcp-first-capture-20260916]
    paths: ['.github/workflows/pharmacology-rcp-first-capture-probe.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pharmacology-rcp-availability-census
  cancel-in-progress: true

jobs:
  census:
    name: Read-only AMMPS RCP availability census
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Census all current AMMPS medication pages for enabled RCP controls
        env:
          OUT_DIR: ${{ github.workspace }}/audit/out/pharmacology-rcp-availability-census
        run: |
          set -euo pipefail
          mkdir -p "$OUT_DIR"
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const outDir = process.env.OUT_DIR;
          const origin = 'https://www.ammps.gov.ma';
          const base = `${origin}/recherche-medicaments`;
          const norm = v => (v || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\s+/g, ' ').trim().toUpperCase();
          const sleep = ms => new Promise(r => setTimeout(r, ms));

          function parsePage(html, pageNumber) {
            const anchors = [...html.matchAll(/<a\b([^>]*)>([\s\S]*?)<\/a>/gi)];
            const controls = [];
            for (const m of anchors) {
              const text = norm(m[2].replace(/<[^>]+>/g, ' '));
              if (!text.includes('TELECHARGER RCP')) continue;
              const attrs = m[1] || '';
              const hrefMatch = attrs.match(/href\s*=\s*["']([^"']*)["']/i);
              const href = hrefMatch ? hrefMatch[1] : null;
              const disabled = /disabled-rcp-btn/i.test(attrs) || /aria-disabled\s*=\s*["']true["']/i.test(attrs) || /(?:^|\s)disabled(?:\s|=|$)/i.test(attrs);
              const before = html.slice(Math.max(0, m.index - 30000), m.index);
              const modalMatches = [...before.matchAll(/id\s*=\s*["']medicamentModal(\d+)["']/gi)];
              const modalId = modalMatches.length ? `medicamentModal${modalMatches[modalMatches.length - 1][1]}` : null;
              const titleMatches = [...before.matchAll(/<h5[^>]*class=["'][^"']*modal-title[^"']*["'][^>]*>([\s\S]*?)<\/h5>/gi)];
              const title = titleMatches.length ? norm(titleMatches[titleMatches.length - 1][1].replace(/<[^>]+>/g, ' ')) : null;
              controls.push({page: pageNumber, modalId, title, href, disabled, attributes: attrs.slice(0, 3000)});
            }
            const pdfUrls = [...new Set((html.match(/(?:https?:\/\/[^"'<>\s]+|\/[^"'<>\s]+)\.pdf(?:\?[^"'<>\s]*)?/gi) || []))]
              .filter(u => /rcp|medicament|upload|storage|document/i.test(u));
            const modalCount = (html.match(/id\s*=\s*["']medicamentModal\d+["']/gi) || []).length;
            return {controls, pdfUrls, modalCount};
          }

          async function fetchHtml(url) {
            const r = await fetch(url, {headers: {'user-agent': 'Digital-Crown-read-only-evidence-census/1.0'}});
            if (!r.ok) throw new Error(`HTTP ${r.status} ${url}`);
            return await r.text();
          }

          (async () => {
            const first = await fetchHtml(`${base}?page=1`);
            const firstParsed = parsePage(first, 1);
            const totalMatch = norm(first.replace(/<[^>]+>/g, ' ')).match(/([0-9][0-9\s]*) MEDICAMENT\(S\) TROUVE/);
            const totalMedicaments = totalMatch ? Number(totalMatch[1].replace(/\s+/g, '')) : null;
            const pageLinks = [...first.matchAll(/[?&]page=(\d+)/g)].map(m => Number(m[1])).filter(Number.isFinite);
            let pageCount = pageLinks.length ? Math.max(...pageLinks) : null;
            if ((!pageCount || pageCount < 2) && totalMedicaments && firstParsed.modalCount > 0) {
              pageCount = Math.ceil(totalMedicaments / firstParsed.modalCount);
            }
            if (!pageCount || pageCount < 1 || pageCount > 700) throw new Error(`Untrusted page count: ${pageCount}`);

            const pages = new Array(pageCount);
            pages[0] = {page: 1, ...firstParsed};
            let next = 2;
            const workers = Array.from({length: 3}, async () => {
              while (true) {
                const p = next++;
                if (p > pageCount) return;
                const html = await fetchHtml(`${base}?page=${p}`);
                pages[p - 1] = {page: p, ...parsePage(html, p)};
                await sleep(100);
              }
            });
            await Promise.all(workers);

            const controls = pages.flatMap(p => p.controls);
            const enabled = controls.filter(c => !c.disabled);
            const disabled = controls.filter(c => c.disabled);
            const pdfCandidates = [...new Set(pages.flatMap(p => p.pdfUrls))];
            const report = {
              schemaVersion: 'ammps-rcp-availability-census.1',
              source: base,
              totalMedicaments,
              pageCount,
              scannedPageCount: pages.filter(Boolean).length,
              modalCount: pages.reduce((n, p) => n + p.modalCount, 0),
              rcpControlCount: controls.length,
              enabledRcpControlCount: enabled.length,
              disabledRcpControlCount: disabled.length,
              enabledExamples: enabled.slice(0, 25),
              pdfCandidates: pdfCandidates.slice(0, 100),
              manifestMutationPerformed: false,
              clinicalActivationPerformed: false
            };
            fs.writeFileSync(path.join(outDir, 'rcp-availability-census.json'), JSON.stringify(report, null, 2));
            console.log(JSON.stringify({totalMedicaments, pageCount, scannedPageCount: report.scannedPageCount, rcpControlCount: controls.length, enabledRcpControlCount: enabled.length, disabledRcpControlCount: disabled.length, pdfCandidateCount: pdfCandidates.length}, null, 2));
          })().catch(e => { console.error(e); process.exit(1); });
          NODE
      - name: Validate census report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('audit/out/pharmacology-rcp-availability-census/rcp-availability-census.json')
          if not p.is_file(): raise SystemExit('rcp-availability-census.json missing')
          r=json.loads(p.read_text())
          assert r['schemaVersion']=='ammps-rcp-availability-census.1'
          assert r['manifestMutationPerformed'] is False and r['clinicalActivationPerformed'] is False
          assert r['scannedPageCount']==r['pageCount'] and r['pageCount']>0
          assert r['rcpControlCount']==r['enabledRcpControlCount']+r['disabledRcpControlCount']
          assert r['rcpControlCount']>0
          print(json.dumps({k:r[k] for k in ['totalMedicaments','pageCount','scannedPageCount','modalCount','rcpControlCount','enabledRcpControlCount','disabledRcpControlCount']}, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pharmacology-rcp-availability-census
          path: audit/out/pharmacology-rcp-availability-census/
          retention-days: 30
