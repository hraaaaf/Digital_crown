name: Pharmacology AMMPS Active RCP Transport Proof

on:
  push:
    branches: [research/pharmacology-rcp-first-capture-20260916]
    paths: ['.github/workflows/pharmacology-rcp-first-capture-probe.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pharmacology-active-rcp-transport-proof
  cancel-in-progress: true

jobs:
  proof:
    name: Read-only AMMPS active RCP transport proof
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Capture three enabled AMMPS RCPs with identity and SHA-256
        env:
          OUT_DIR: ${{ github.workspace }}/audit/out/pharmacology-active-rcp-proof
        run: |
          set -euo pipefail
          mkdir -p "$OUT_DIR"
          node - <<'NODE'
          const fs=require('fs'), path=require('path'), crypto=require('crypto');
          const outDir=process.env.OUT_DIR;
          const origin='https://www.ammps.gov.ma';
          const targets=[
            {page:33, modalId:'medicamentModal9736'},
            {page:65, modalId:'medicamentModal5208'},
            {page:129, modalId:'medicamentModal9807'}
          ];
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const sha256=b=>crypto.createHash('sha256').update(b).digest('hex');
          const clean=s=>(s||'').replace(/<script[\s\S]*?<\/script>/gi,' ').replace(/<style[\s\S]*?<\/style>/gi,' ').replace(/<[^>]+>/g,' ').replace(/&nbsp;/gi,' ').replace(/&amp;/gi,'&').replace(/\s+/g,' ').trim();

          async function fetchRetry(url,accept,max=4){
            let last;
            for(let i=1;i<=max;i++){
              try{
                const ac=new AbortController(); const t=setTimeout(()=>ac.abort(),30000);
                const r=await fetch(url,{signal:ac.signal,headers:{'user-agent':'Digital-Crown-read-only-active-rcp-proof/1.0','accept':accept}});
                clearTimeout(t);
                if(!r.ok) throw new Error(`HTTP ${r.status}`);
                return r;
              }catch(e){ last=e; if(i<max) await sleep(500*i); }
            }
            throw last;
          }

          function modalSlice(html,modalId){
            const needle=`id="${modalId}"`;
            let start=html.indexOf(needle);
            if(start<0) start=html.indexOf(`id='${modalId}'`);
            if(start<0) throw new Error(`modal missing: ${modalId}`);
            const nextDouble=html.indexOf('id="medicamentModal',start+needle.length);
            const nextSingle=html.indexOf("id='medicamentModal",start+needle.length);
            const next=[nextDouble,nextSingle].filter(x=>x>start).sort((a,b)=>a-b)[0] || Math.min(html.length,start+60000);
            return html.slice(start,next);
          }

          (async()=>{
            const results=[];
            for(let i=0;i<targets.length;i++){
              const t=targets[i];
              const pageUrl=`${origin}/recherche-medicaments?page=${t.page}`;
              const html=await (await fetchRetry(pageUrl,'text/html,application/xhtml+xml')).text();
              const modal=modalSlice(html,t.modalId);
              const anchor=[...modal.matchAll(/<a\b([^>]*)>([\s\S]*?)<\/a>/gi)].find(m=>clean(m[2]).toUpperCase().includes('TELECHARGER RCP'));
              if(!anchor) throw new Error(`RCP control missing: ${t.modalId}`);
              const attrs=anchor[1]||'';
              if(/disabled-rcp-btn/i.test(attrs)||/aria-disabled\s*=\s*["']true["']/i.test(attrs)) throw new Error(`RCP unexpectedly disabled: ${t.modalId}`);
              const hm=attrs.match(/href\s*=\s*["']([^"']+)["']/i);
              if(!hm) throw new Error(`RCP href missing: ${t.modalId}`);
              const url=new URL(hm[1],pageUrl);
              if(url.protocol!=='https:'||!['ammps.gov.ma','www.ammps.gov.ma'].includes(url.hostname)) throw new Error(`non-official RCP URL: ${url}`);
              const pr=await fetchRetry(url.toString(),'application/pdf,*/*');
              const bytes=Buffer.from(await pr.arrayBuffer());
              const signature=bytes.subarray(0,5).toString('ascii');
              const contentType=pr.headers.get('content-type');
              const item={
                page:t.page, modalId:t.modalId, pageUrl, modalText:clean(modal).slice(0,5000),
                href:hm[1], url:url.toString(), status:pr.status, contentType,
                byteLength:bytes.length, signature, signatureOk:signature==='%PDF-', sha256:sha256(bytes),
                officialHttps:true, manifestMutationPerformed:false, clinicalActivationPerformed:false
              };
              if(!item.signatureOk) throw new Error(`not a PDF signature: ${url}`);
              fs.writeFileSync(path.join(outDir,`sample-${i+1}.pdf`),bytes);
              results.push(item);
              await sleep(250);
            }
            const report={schemaVersion:'ammps-active-rcp-transport-proof.1',sampleCount:results.length,manifestMutationPerformed:false,clinicalActivationPerformed:false,results};
            fs.writeFileSync(path.join(outDir,'active-rcp-transport-proof.json'),JSON.stringify(report,null,2));
            for(const r of results) console.log(JSON.stringify({modalId:r.modalId,url:r.url,status:r.status,contentType:r.contentType,byteLength:r.byteLength,signature:r.signature,sha256:r.sha256,modalText:r.modalText.slice(0,500)}));
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Validate active RCP proof
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('audit/out/pharmacology-active-rcp-proof/active-rcp-transport-proof.json')
          r=json.loads(p.read_text())
          assert r['schemaVersion']=='ammps-active-rcp-transport-proof.1'
          assert r['sampleCount']==3
          assert r['manifestMutationPerformed'] is False and r['clinicalActivationPerformed'] is False
          for x in r['results']:
              assert x['officialHttps'] is True and x['status']==200 and x['signatureOk'] is True
              assert x['url'].startswith('https://www.ammps.gov.ma/uploads/rcp/') or x['url'].startswith('https://ammps.gov.ma/uploads/rcp/')
              assert len(x['sha256'])==64 and x['byteLength']>1000 and x['modalText']
          print('ACTIVE_RCP_TRANSPORT_VERIFIED', len(r['results']))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pharmacology-active-rcp-transport-proof
          path: audit/out/pharmacology-active-rcp-proof/
          retention-days: 30
