name: V1.5-02.3 Patient Photo UI AFTER

on:
  pull_request:
    paths:
      - "frontend/src/types/index.ts"
      - "frontend/src/features/patients/components/PatientAvatar.tsx"
      - "frontend/src/features/patients/components/PatientAvatar.test.tsx"
      - "frontend/src/features/patients/components/PatientPhotoEditor.tsx"
      - "frontend/src/features/patients/components/PatientPhotoEditor.test.tsx"
      - "frontend/src/features/patients/PatientList.tsx"
      - "frontend/src/features/patients/PatientDetailsInner.tsx"
      - "frontend/src/features/dashboard/types.ts"
      - "frontend/src/features/dashboard/components/DashboardHeader.tsx"
      - "frontend/src/features/dashboard/components/WaitingRoom.tsx"
      - "frontend/src/features/agenda/DailyView.tsx"
      - "frontend/src/features/agenda/WeeklyView.tsx"
      - "frontend/src/features/agenda/MonthlyView.tsx"
      - "frontend/src/features/agenda/MultiPractitionerTimelineView.tsx"
      - "frontend/src/features/mobile/Dashboard/views/WaitingRoomView.tsx"
      - "frontend/src/features/mobile/Dashboard/views/WaitingRoomView.g3Interactive.test.tsx"
      - "frontend/src/features/mobile/Dashboard/MobileG3BrowserCertHarness.tsx"
      - "frontend/scripts/capture-v15-02-3-photo-ui-after.mjs"
      - ".github/workflows/v15-02-3-photo-ui-after.yml"
  workflow_dispatch:

concurrency:
  group: v15-02-3-after-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  after:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ENVIRONMENT: test
      SECRET_KEY: v15-02-3-after-secret-long-enough
      DATABASE_URL: sqlite:///./t2-runtime-cert.db
      DIGITALCROWN_ISOLATED_RUNTIME: "1"
      DIGITALCROWN_ISOLATION_DB_FINGERPRINT: c04779c8d18b3ac12a0f4093a47a5d0c3c0e2251714be532893cfa052e9ee780
      TELEMETRY_ENABLED: "false"
      CLOUD_AI_ENABLED: "false"
      DEBUG: "false"
      ALLOWED_ORIGINS: http://127.0.0.1:5173,http://localhost:5173
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Credential
        run: |
          echo "T2_USER=t2-browser@cabinet.ma" >> "$GITHUB_ENV"
          echo "T2_PASSWORD=$(python -c 'import secrets; print(secrets.token_urlsafe(32))')" >> "$GITHUB_ENV"
      - name: Backend deps
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.12.0 torchvision==0.27.0 --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^(torch|torchvision)([<=>].*)?$' requirements.txt >/tmp/requirements-v15-02-3.txt
          pip install -r /tmp/requirements-v15-02-3.txt
      - name: Frontend + Chromium
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Unit tests
        working-directory: frontend
        run: npx vitest run src/features/patients/components/PatientAvatar.test.tsx src/features/patients/components/PatientPhotoEditor.test.tsx src/features/mobile/Dashboard/views/WaitingRoomView.g3Interactive.test.tsx
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Start backend
        run: |
          rm -f t2-runtime-cert.db
          python scripts/t2_runtime_server.py >/tmp/v15-02-3-backend.log 2>&1 &
          for i in {1..90}; do curl -fsS http://127.0.0.1:8005/health >/dev/null && exit 0; sleep 1; done
          cat /tmp/v15-02-3-backend.log; exit 1
      - name: Start frontend
        working-directory: frontend
        env:
          VITE_DC_PREVIEW_DEMO: "1"
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 >/tmp/v15-02-3-frontend.log 2>&1 &
          for i in {1..90}; do curl -fsS http://127.0.0.1:5173 >/dev/null && exit 0; sleep 1; done
          cat /tmp/v15-02-3-frontend.log; exit 1
      - name: Capture AFTER matrix
        working-directory: frontend
        run: node scripts/run-with-t2-workstation.mjs scripts/capture-v15-02-3-photo-ui-after.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v15-02-3-photo-ui-after
          path: artifacts/v15-02-3-photo-ui-after
          if-no-files-found: error
          retention-days: 14