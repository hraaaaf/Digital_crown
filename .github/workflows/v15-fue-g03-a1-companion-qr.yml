name: "V1.5-03 A1 | Real Patient Companion QR First-Use Gate"

on:
  pull_request:
    branches:
      - test/v15-fue-g02-g03-risk-matrix-20261024
    paths:
      - ".github/workflows/v15-fue-g03-a1-companion-qr.yml"
      - "frontend/scripts/certify-v15-03-a1-real-companion-qr.mjs"
      - "scripts/seed_v15_station_companion_a1.py"
      - "docs/quality/V15_FUE_G03_A1_EXECUTION_MATRIX.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v15-g03-a1-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  companion-qr-real-e2e:
    name: "03-A1 / real first pairing -> Companion QR -> Station -> SQL"
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      ENVIRONMENT: test
      SECRET_KEY: g03-a1-synthetic-runner-only-key
      DATABASE_URL: sqlite:///./t2-runtime-cert.db
      DIGITALCROWN_ISOLATED_RUNTIME: "1"
      DIGITALCROWN_ISOLATION_DB_FINGERPRINT: c04779c8d18b3ac12a0f4093a47a5d0c3c0e2251714be532893cfa052e9ee780
      T2_G03_A1: "1"
      T2_STATION_FUE: "1"
      TELEMETRY_ENABLED: "false"
      CLOUD_AI_ENABLED: "false"
      DEBUG: "false"
      ALLOWED_ORIGINS: "http://127.0.0.1:5173,http://localhost:5173"
      STATION_HANDOFF_PUBLIC_ORIGIN: "http://127.0.0.1:5173"
      EVALUATED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EVALUATED_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Synthetic ephemeral T2 account secret
        run: |
          echo "T2_USER=t2-browser@cabinet.ma" >> "$GITHUB_ENV"
          echo "T2_PASSWORD=$(python -c 'import secrets; print(secrets.token_urlsafe(32))')" >> "$GITHUB_ENV"
      - name: Python runtime dependencies and syntax
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.12.0 torchvision==0.27.0 --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^(torch|torchvision)([<=>].*)?$' requirements.txt >/tmp/v15-g03-a1-requirements.txt
          pip install -r /tmp/v15-g03-a1-requirements.txt
          python -m py_compile scripts/seed_v15_station_companion_a1.py
      - name: Station pairing, Companion claims, expiry and fallback API regression
        run: |
          python -m pytest backend/tests/test_station_patient_session_v15.py backend/tests/test_station_identity_pairing_migration_v15.py -q --disable-warnings
      - name: Install frontend and real Chromium
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
          node --check scripts/certify-v15-03-a1-real-companion-qr.mjs
      - name: StrictMode and kiosk patient identity regressions
        working-directory: frontend
        run: |
          npx vitest run src/features/hub/StationPatientIdentity.test.tsx --maxWorkers=1 --fileParallelism=false
          npm run build
      - name: Boot isolated encrypted SQLCipher T2 backend
        run: |
          test "$ENVIRONMENT" = test
          test "$DIGITALCROWN_ISOLATED_RUNTIME" = 1
          test "$T2_G03_A1" = 1
          test "$DATABASE_URL" = "sqlite:///./t2-runtime-cert.db"
          rm -f t2-runtime-cert.db
          python scripts/t2_runtime_server.py >/tmp/v15-g03-a1-backend.log 2>&1 &
          for i in {1..90}; do curl -fsS http://127.0.0.1:8005/health >/dev/null && exit 0; sleep 1; done
          tail -120 /tmp/v15-g03-a1-backend.log
          exit 1
      - name: Create synthetic patients before browser launch
        run: python scripts/seed_v15_station_companion_a1.py
      - name: Boot true Vite/React Station and Companion
        working-directory: frontend
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 >/tmp/v15-g03-a1-frontend.log 2>&1 &
          for i in {1..90}; do curl -fsS http://127.0.0.1:5173 >/dev/null && exit 0; sleep 1; done
          tail -100 /tmp/v15-g03-a1-frontend.log
          exit 1
      - name: Cold start / genuine pair / real QR claim / explicit context / anti-replay / expiry / revocation
        working-directory: frontend
        run: node scripts/certify-v15-03-a1-real-companion-qr.mjs
      - name: Independent SQL readback
        run: python scripts/seed_v15_station_companion_a1.py --verify
      - name: Upload real screenshot and sanitized HTTP + SQL oracle artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v15-g03-a1-real-companion-qr
          path: frontend/artifacts/v15-03-a1-companion-real
          if-no-files-found: warn
          retention-days: 14
