name: AMMPS Wave1 RCP Availability Scan

on:
  push:
    branches:
      - feat/neo-medication-dictionary-rcp-clinical
    paths:
      - 'scripts/scan_ammps_wave1_rcp.py'
      - '.github/workflows/ammps-wave1-rcp-scan.yml'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests==2.32.5 beautifulsoup4==4.12.3
      - name: Scan Wave-1 RCP controls
        run: |
          mkdir -p artifacts/d4-wave1-rcp
          python scripts/scan_ammps_wave1_rcp.py \
            --queries PARACETAMOL IBUPROFENE AMOXICILLINE PHENOXYMETHYLPENICILLINE METRONIDAZOLE CLARITHROMYCINE CLINDAMYCINE \
            --out artifacts/d4-wave1-rcp/wave1-rcp-availability.json
      - name: Upload Wave-1 RCP availability proof
        uses: actions/upload-artifact@v4
        with:
          name: ammps-d4-wave1-rcp-availability
          path: artifacts/d4-wave1-rcp
          retention-days: 14
