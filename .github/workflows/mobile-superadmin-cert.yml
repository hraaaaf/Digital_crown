name: Mobile Superadmin Certification

on:
  pull_request:
    branches: [master]
    paths:
      - 'frontend/src/App.tsx'
      - 'frontend/src/services/api.ts'
      - 'frontend/src/services/platformPasskey.ts'
      - 'frontend/src/features/mobile/Dashboard/MobileDashboard.tsx'
      - 'frontend/src/features/mobile/Dashboard/views/MobileSuperAdminView.tsx'
      - 'frontend/src/features/superadmin/**'
      - 'frontend/src/test/mobileSuperAdminView.test.tsx'
      - 'frontend/src/test/mobilePlatformAuthBoundary.test.ts'
      - 'frontend/src/test/superAdminAccessBoundary.test.tsx'
      - '.github/workflows/mobile-superadmin-cert.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-superadmin-cert-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    name: Mobile Tour de contrôle BEFORE / AFTER
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BEFORE_HEAD: 1937169b7d28b361cc0b946026fd9c6402e46e7f
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Record product HEAD
        run: |
          PRODUCT_HEAD=$(git rev-parse HEAD)
          echo "PRODUCT_HEAD=$PRODUCT_HEAD" >> "$GITHUB_ENV"
          test "$PRODUCT_HEAD" = "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend and Chromium
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.62.1
          npx playwright install --with-deps chromium

      - name: Targeted security tests
        working-directory: frontend
        run: npm test -- src/test/mobileSuperAdminView.test.tsx src/test/mobilePlatformAuthBoundary.test.ts src/test/superAdminAccessBoundary.test.tsx src/test/superAdminControlCenter.test.tsx src/test/superAdminWorkspace.test.tsx

      - name: Build frontend
        working-directory: frontend
        run: npm run build:test

      - name: Materialize immutable BEFORE source
        run: |
          git show "$BEFORE_HEAD:frontend/src/features/mobile/Dashboard/views/MobileSuperAdminView.tsx" > frontend/src/features/mobile/Dashboard/views/MobileSuperAdminView.before.tsx
          grep -F 'Navigate to="/mobile/dashboard" replace' frontend/src/features/mobile/Dashboard/views/MobileSuperAdminView.before.tsx

      - name: Materialize visual harness
        working-directory: frontend
        run: |
          cat > mobile-superadmin-cert.html <<'EOF'
          <!doctype html><html lang="fr"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>Mobile Superadmin cert</title></head><body><div id="root"></div><script type="module" src="/src/mobile-superadmin-cert.tsx"></script></body></html>
          EOF

          cat > src/mobile-superadmin-cert.tsx <<'EOF'
          import React from 'react';
          import { createRoot } from 'react-dom/client';
          import { MemoryRouter, Route, Routes } from 'react-router-dom';
          import './index.css';
          import { MobileSuperAdminView as BeforeView } from './features/mobile/Dashboard/views/MobileSuperAdminView.before';
          import { MobileSuperAdminView as AfterView } from './features/mobile/Dashboard/views/MobileSuperAdminView';

          const phase = new URLSearchParams(window.location.search).get('phase') || 'after';
          if (phase === 'after') {
            window.history.replaceState({}, '', '/mobile/superadmin');
          }
          createRoot(document.getElementById('root')!).render(
            phase === 'before' ? (
              <MemoryRouter initialEntries={['/mobile/superadmin']}>
                <Routes>
                  <Route path="/mobile/superadmin" element={<BeforeView />} />
                  <Route path="/mobile/dashboard" element={<main data-testid="before-redirect" style={{minHeight:'100dvh',display:'grid',placeItems:'center',fontFamily:'sans-serif'}}>Retour automatique au cabinet</main>} />
                </Routes>
              </MemoryRouter>
            ) : (
              <MemoryRouter initialEntries={['/mobile/superadmin']}><AfterView /></MemoryRouter>
            ),
          );
          EOF

          cat > mobile-superadmin-cert.mjs <<'EOF'
          import { chromium } from 'playwright';
          import { createServer } from 'vite';
          import fs from 'node:fs/promises';

          const output = '../artifacts/mobile-superadmin-cert';
          await fs.mkdir(output, { recursive: true });
          const viewports = [{width:390,height:844},{width:430,height:932}];
          const server = await createServer({ server: { host:'127.0.0.1', port:4178, strictPort:true }, clearScreen:false });
          await server.listen();
          const browser = await chromium.launch({headless:true});
          const captures=[];
          try {
            for (const viewport of viewports) {
              const context = await browser.newContext({viewport,colorScheme:'light'});
              const before = await context.newPage();
              await before.goto('http://127.0.0.1:4178/mobile-superadmin-cert.html?phase=before', {waitUntil:'networkidle'});
              await before.getByTestId('before-redirect').waitFor();
              const beforeShot=`before-${viewport.width}x${viewport.height}.png`;
              await before.screenshot({path:`${output}/${beforeShot}`,fullPage:true,animations:'disabled'});
              await before.close();

              const page = await context.newPage();
              const pageErrors=[];
              const requests=[];
              page.on('pageerror', error => pageErrors.push(String(error)));
              await page.route('**/*', async route => {
                const request=route.request();
                const url=new URL(request.url());
                if (url.port !== '8005' || !url.pathname.startsWith('/api/')) return route.continue();
                const ok=(body)=>route.fulfill({status:200,contentType:'application/json',body:JSON.stringify(body)});
                requests.push({method:request.method(),path:url.pathname,auth:request.headers().authorization || ''});
                if (request.method()==='POST' && url.pathname==='/api/auth/login') return ok({access_token:'platform-visual-token',refresh_token:'discard-me',token_type:'bearer'});
                if (request.method()==='GET' && url.pathname==='/api/superadmin/passkey/status') return ok({enrolled:true,origin_ready:true,step_up_valid:true,rp_id:'digitalcrown.local',expected_origin:'https://digitalcrown.local'});
                if (request.method()==='GET' && url.pathname==='/api/superadmin/clients') return ok([{id:42,email:'cabinet.atlas@example.test',role:'ADMIN',nom_complet:'Cabinet Atlas',is_active:true,is_licensed:true,license_expires_at:'2027-08-31T10:00:00Z',is_archived:false,is_suspended:false,internal_notes:null,last_login_at:'2026-08-31T09:00:00Z',created_at:'2026-01-15T10:00:00Z',subscription_plan:'GOLD',stats:{total_patients:84,total_ia_panoramique:19,total_ia_cephalo:12}}]);
                if (request.method()==='GET' && url.pathname==='/api/superadmin/trial-codes') return ok([]);
                if (request.method()==='GET' && url.pathname==='/api/superadmin/platform-admins/clients/42/devices') return ok({client_id:42,license:{active:true,license_type:'PAID',max_devices:3,active_devices:1,release_channel:'stable'},devices:[{device_id:'mobile-atlas-01',user_id:42,created_at:'2026-08-20T09:00:00Z',last_seen_at:'2026-08-31T09:50:00Z',revoked_at:null,active:true}]});
                if (request.method()==='GET' && url.pathname==='/api/superadmin/platform-admins') return ok([]);
                if (request.method()==='GET' && url.pathname==='/api/superadmin/audit') return ok([]);
                return route.fulfill({status:404,contentType:'application/json',body:JSON.stringify({detail:`Unexpected ${request.method()} ${url.pathname}`})});
              });
              await page.goto('http://127.0.0.1:4178/mobile-superadmin-cert.html?phase=after',{waitUntil:'networkidle'});
              await page.getByTestId('mobile-superadmin-login').waitFor();
              await page.getByLabel('Email plateforme').fill('owner@platform.test');
              await page.getByLabel('Mot de passe').fill('visual-cert-password');
              await page.getByRole('button',{name:'Ouvrir la Tour de contrôle'}).click();
              await page.getByTestId('mobile-superadmin-authorized').waitFor({timeout:30000});
              await page.getByRole('heading',{name:'Contrôle plateforme',level:1}).waitFor({timeout:30000});
              const metrics={
                authorized:await page.getByTestId('mobile-superadmin-authorized').count(),
                controlHeading:await page.getByRole('heading',{name:'Contrôle plateforme',level:1}).count(),
                clientsTab:await page.getByRole('button',{name:'Clients & licences'}).count(),
                controlTab:await page.getByRole('button',{name:'Contrôle plateforme'}).count(),
                hasHorizontalOverflow:await page.evaluate(()=>document.documentElement.scrollWidth>document.documentElement.clientWidth+2),
                platformAuthRequests:requests.filter(r=>r.path.startsWith('/api/superadmin/') && r.auth==='Bearer platform-visual-token').length,
              };
              const checks=[metrics.authorized===1,metrics.controlHeading===1,metrics.clientsTab===1,metrics.controlTab===1,!metrics.hasHorizontalOverflow,metrics.platformAuthRequests>=2,pageErrors.length===0];
              const visualScore=Math.round((checks.filter(Boolean).length/checks.length)*100)/10;
              const afterShot=`after-${viewport.width}x${viewport.height}.png`;
              await page.screenshot({path:`${output}/${afterShot}`,fullPage:true,animations:'disabled'});
              captures.push({viewport,beforeShot,afterShot,metrics,pageErrors,visualScore,valid:checks.every(Boolean)});
              await context.close();
            }
          } finally { await browser.close(); await server.close(); }
          const report={schema:'digital-crown.mobile-superadmin-cert.v1',productHead:process.env.PRODUCT_HEAD,beforeHead:process.env.BEFORE_HEAD,goal:'Tour de contrôle réellement accessible dans la PWA mobile sans jamais promouvoir la session cabinet.',reference:'Mobile Security glass shell + existing responsive SuperAdminWorkspace; separate platform login then WebAuthn step-up; cabinet API deliberately isolated from platform API.',viewports,captures,valid:captures.every(c=>c.valid && c.visualScore>=9.5)};
          await fs.writeFile(`${output}/report.json`,JSON.stringify(report,null,2));
          if (!report.valid) process.exit(1);
          EOF

      - name: Capture and compare BEFORE / AFTER
        working-directory: frontend
        env:
          PRODUCT_HEAD: ${{ env.PRODUCT_HEAD }}
          BEFORE_HEAD: ${{ env.BEFORE_HEAD }}
          VITE_API_URL: http://127.0.0.1:8999
          VITE_PLATFORM_API_URL: http://127.0.0.1:8005
        run: node mobile-superadmin-cert.mjs

      - name: Assert visual contract
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const report=JSON.parse(readFileSync('artifacts/mobile-superadmin-cert/report.json','utf8'));
          if (report.productHead !== process.env.PRODUCT_HEAD) throw new Error('HEAD mismatch');
          if (report.beforeHead !== process.env.BEFORE_HEAD) throw new Error('BEFORE mismatch');
          if (!report.valid) throw new Error('Mobile Superadmin visual contract failed');
          for (const capture of report.captures) {
            if (capture.visualScore < 9.5) throw new Error(`Visual score ${capture.visualScore} < 9.5`);
          }
          console.table(report.captures.map(c=>({viewport:`${c.viewport.width}x${c.viewport.height}`,score:c.visualScore,overflow:c.metrics.hasHorizontalOverflow,platformAuth:c.metrics.platformAuthRequests})));
          NODE

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-superadmin-cert-${{ env.PRODUCT_HEAD }}
          path: artifacts/mobile-superadmin-cert
          if-no-files-found: error
          retention-days: 14
