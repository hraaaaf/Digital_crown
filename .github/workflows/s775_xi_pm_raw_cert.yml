name: S775 Xi Pm Raw Head Certification

on:
  push:
    branches:
      - S775-xi-pm-cert-5f974d7

jobs:
  raw-head-pytest:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-only-secret-key-minimum-32-characters-long
      DATABASE_URL: "sqlite:///:memory:"
      ENVIRONMENT: development
      TELEMETRY_ENABLED: "false"
      CLOUD_AI_ENABLED: "false"
    steps:
      - name: Checkout exact certified head
        uses: actions/checkout@v4
        with:
          ref: 5f974d7f7b0982e4711a3aef3f2de814806ae63e
      - name: Verify exact HEAD
        run: test "$(git rev-parse HEAD)" = "5f974d7f7b0982e4711a3aef3f2de814806ae63e"
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.10.0 torchvision==0.25.0 torchaudio==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^(torch|torchvision|torchaudio)' requirements.txt > /tmp/requirements-ci.txt
          pip install -r /tmp/requirements-ci.txt
          pip install jsonschema==4.25.1
          python -m pip check
      - name: Run exact targeted cephalo tests
        run: |
          python -m pytest \
            backend/tests/test_cephalo_lot08_ricketts_gregoret13_geometry.py \
            backend/tests/test_cephalo_lot08_ricketts_gregoret13_profile.py \
            backend/tests/test_cephalo_vnext_lot06_canonical_analysis_v2.py \
            -q
