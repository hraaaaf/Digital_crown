name: Marketplace P11 Final Certification

on:
  pull_request:
    paths:
      - 'backend/models_marketplace_*.py'
      - 'backend/routers/partner_*.py'
      - 'backend/tests/test_partner*.py'
      - 'backend/tests/test_marketplace*.py'
      - 'frontend/src/pages/Partner*.tsx'
      - 'frontend/src/features/partnerMarketplace/**'
      - '.audit/marketplace-p5-after.mjs'
      - '.github/workflows/marketplace-final-cert.yml'
      - 'docs/MARKETPLACE_AUDIT_ROADMAP.md'
  workflow_dispatch:

jobs:
  backend-marketplace:
    name: P11 Backend Marketplace truth
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Collect exact Marketplace tests
        id: collect
        shell: bash
        run: |
          mapfile -t TESTS < <(find backend/tests -maxdepth 1 -type f \( -name 'test_partner*.py' -o -name 'test_marketplace*.py' \) | sort)
          if [ "${#TESTS[@]}" -lt 10 ]; then
            echo "Expected >=10 Marketplace backend test files, got ${#TESTS[@]}" >&2
            printf '%s\n' "${TESTS[@]}"
            exit 1
          fi
          printf '%s\n' "${TESTS[@]}" | tee /tmp/marketplace-tests.txt
          {
            echo 'files<<EOF'
            printf '%s\n' "${TESTS[@]}"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Run Marketplace backend certification
        shell: bash
        run: |
          mapfile -t TESTS < /tmp/marketplace-tests.txt
          pytest -q "${TESTS[@]}" --tb=short

  frontend-marketplace:
    name: P11 Frontend Marketplace truth
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Marketplace unit tests
        working-directory: frontend
        shell: bash
        run: |
          mapfile -t TESTS < <(find src -type f \( -path '*partnerMarketplace*.test.*' -o -path '*PartnerMarketplace*.test.*' -o -path '*PartnerProduct*.test.*' -o -path '*PartnerSupplier*.test.*' \) | sort)
          if [ "${#TESTS[@]}" -lt 1 ]; then
            echo 'No Marketplace frontend tests found' >&2
            exit 1
          fi
          printf '%s\n' "${TESTS[@]}"
          npm test -- "${TESTS[@]}"

      - name: Production build
        working-directory: frontend
        run: npm run build

  visual-marketplace:
    name: P11 Marketplace visual/E2E 390/430/768/1280
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Record exact head
        run: echo "PRODUCT_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend and Chromium
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.62.1
          npx playwright install --with-deps chromium
          test ! -e ../node_modules
          ln -s "$PWD/node_modules" ../node_modules

      - name: Replay certified Marketplace visual/E2E contract
        working-directory: frontend
        env:
          PRODUCT_HEAD: ${{ env.PRODUCT_HEAD }}
        run: node ../.audit/marketplace-p5-after.mjs

      - name: Assert final visual contract
        working-directory: frontend
        env:
          PRODUCT_HEAD: ${{ env.PRODUCT_HEAD }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const report = JSON.parse(readFileSync('marketplace-p5-after-artifacts/report.json', 'utf8'));
          if (report.productHead !== process.env.PRODUCT_HEAD) throw new Error('P11 visual HEAD mismatch');
          if (report.captures.length !== 4) throw new Error(`Expected 4 captures, got ${report.captures.length}`);
          if (report.invalidCount !== 0) throw new Error(`Invalid visual captures: ${report.invalidCount}`);
          const expected = ['390x844','430x932','768x1024','1280x800'];
          for (const viewport of expected) {
            if (!report.captures.some((capture) => capture.viewport === viewport)) throw new Error(`Missing ${viewport}`);
          }
          NODE

      - name: Upload final Marketplace captures
        uses: actions/upload-artifact@v4
        with:
          name: marketplace-p11-final-captures
          path: frontend/marketplace-p5-after-artifacts/
          if-no-files-found: error
          retention-days: 30
