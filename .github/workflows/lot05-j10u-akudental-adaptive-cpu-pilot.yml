name: LOT05 J10U AKUDENTAL Adaptive Detection Research Pilot

on:
  push:
    branches:
      - exp/lot05-j10o-public-panoramic-datasets-research-smoke-20261022
    paths:
      - .github/workflows/lot05-j10u-akudental-adaptive-cpu-pilot.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  academic-non-commercial-cpu:
    name: Academic CPU 96 train x 3 / 33 val, no model weights
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install vetted CPU-only framework and pillow
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'pillow==11.3.0'
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu \
            'torch==2.5.1' 'torchvision==0.20.1'
          python -c 'import torch, torchvision; assert not torch.cuda.is_available(); print("TORCH_CPU_ONLY_READY")'
      - name: Fetch only exact academic research revision into disposable runner
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --depth=1 --no-checkout \
            https://github.com/melihoz/AKUDENTAL.git third_party/AKUDENTAL
          git -C third_party/AKUDENTAL sparse-checkout set --no-cone \
            '/AKUDENTAL/folds/fold_0/labels/' '/AKUDENTAL/images/'
          git -C third_party/AKUDENTAL checkout --detach \
            92e2cc3ae5eebc9de509311a3edefb7106fca7dd
          test "$(git -C third_party/AKUDENTAL rev-parse HEAD)" = \
            92e2cc3ae5eebc9de509311a3edefb7106fca7dd
      - name: Audit all source labels and construct private research-only workspace
        shell: bash
        run: |
          python experiments/lot05_j10r_akudental_private_research_workspace.py \
            --source-repo third_party/AKUDENTAL \
            --fold fold_0 \
            --workspace "$RUNNER_TEMP/j10u-ephemeral"
      - name: Adapt RPN and ROI detection heads and compare before-after validation
        shell: bash
        run: |
          python experiments/lot05_j10u_akudental_adaptive_frcnn_research.py \
            --workspace "$RUNNER_TEMP/j10u-ephemeral"
      - name: Delete all research pixels labels and pretrained checkpoint cache
        if: always()
        shell: bash
        run: |
          rm -rf third_party/AKUDENTAL "$RUNNER_TEMP/j10u-ephemeral" \
            "$HOME/.cache/torch/hub/checkpoints"
          echo "ACADEMIC_RESEARCH_LOCAL_DATA_AND_WEIGHTS_REMOVED"
