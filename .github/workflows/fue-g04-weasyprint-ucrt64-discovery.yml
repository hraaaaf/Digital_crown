name: FUE-G04 EXPERIMENTAL WeasyPrint UCRT64 native discovery

# EXPERIMENTAL research lab only: floating transitive pacman/pip packages
# MUST NEVER be inserted into signed CODE_CERTIFIED or an installer.
# No patient data, no production release, no clinic machine, no secrets.
on:
  push:
    branches:
      - ci/fue-g04-windows-installable-chain-20261010
    paths:
      - 'docs/audits/FUE_G04_TRIGGER_WEASYPRINT_UCRT64_DISCOVERY_20261011.txt'

permissions:
  contents: read

jobs:
  experimental-native-discovery:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Install official MSYS2 UCRT64 Pango in disposable runner
        id: msys
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        with:
          msystem: UCRT64
          update: true
          cache: false
          install: mingw-w64-ucrt-x86_64-pango
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pin Pango archive SHA and verify lab-only native discovery
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys.outputs.msys2-location }}
        run: |
          $ErrorActionPreference = 'Stop'
          $native = Join-Path $env:MSYS2_LOCATION 'ucrt64/bin'
          if (-not (Test-Path -LiteralPath $native -PathType Container)) { throw 'No UCRT64 native bin' }
          # Package-manager cache, authenticated by MSYS2 repository; no direct mirror request.
          $cache = Join-Path $env:MSYS2_LOCATION 'var/cache/pacman/pkg'
          $archive = Join-Path $cache 'mingw-w64-ucrt-x86_64-pango-1.58.2-1-any.pkg.tar.zst'
          if (-not (Test-Path -LiteralPath $archive -PathType Leaf)) {
            $bash = Join-Path $env:MSYS2_LOCATION 'usr/bin/bash.exe'
            if (-not (Test-Path -LiteralPath $bash -PathType Leaf)) { throw 'Cannot use authenticated package manager' }
            & $bash -lc 'pacman -Sw --noconfirm --cachedir /var/cache/pacman/pkg mingw-w64-ucrt-x86_64-pango'
            if ($LASTEXITCODE -ne 0) { throw 'Official MSYS2 package manager could not cache Pango' }
          }
          if (-not (Test-Path -LiteralPath $archive -PathType Leaf)) { throw 'The exact Pango archive version is unavailable; do not use floating dependency' }
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '8d86e4a018ff139b010bf357fa1c9f9030fa32ee195c54ed7e89d8ea701851c8') {
            throw 'Official Pango package SHA256 mismatch: stop discovery'
          }
          Write-Host 'DISCOVERY_OFFICIAL_PANGO_PACKAGE_SHA256=VERIFIED'
          $needed = @('libgobject-2.0-0.dll', 'libpango-1.0-0.dll', 'libpangoft2-1.0-0.dll', 'libfontconfig-1.dll', 'libharfbuzz-0.dll')
          $manifest = @()
          foreach ($name in $needed) {
            $f = Join-Path $native $name
            if (-not (Test-Path -LiteralPath $f -PathType Leaf)) { throw "MSYS2 native library missing: $name" }
            $actual = (Get-FileHash -LiteralPath $f -Algorithm SHA256).Hash.ToLowerInvariant()
            $manifest += [pscustomobject]@{ Name = $name; Sha256 = $actual; Bytes = (Get-Item -LiteralPath $f).Length }
            Write-Host "DISCOVERY_NATIVE_DLL_FOUND=$name"
          }
          $manifestFile = Join-Path $env:RUNNER_TEMP 'FUE-G04-experimental-dll-hashes.json'
          $manifest | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath $manifestFile -Encoding utf8
          $env:WEASYPRINT_DLL_DIRECTORIES = $native
          $env:PATH = "$native;$env:PATH"
          # PATH intentionally includes native MSYS2 DLLs, but the MSYS2 Python lacks pip.
          # Always execute the CPython 3.12 selected by actions/setup-python.
          $hostPython = Join-Path $env:pythonLocation 'python.exe'
          if (-not (Test-Path -LiteralPath $hostPython -PathType Leaf)) { throw 'Missing setup-python interpreter' }
          & $hostPython -c 'import sys; print("LAB_HOST_PYTHON=" + sys.executable)'
          if ($LASTEXITCODE -ne 0) { throw 'setup-python interpreter failed' }
          & $hostPython -m pip install --no-input --disable-pip-version-check 'weasyprint==68.1'
          if ($LASTEXITCODE -ne 0) { throw 'Exact WeasyPrint 68.1 lab dependency failed to install' }
          @'
          import os
          from pathlib import Path
          from weasyprint import HTML
          out = Path(os.environ['RUNNER_TEMP']) / 'fue-g04-synthetic-native-test.pdf'
          HTML(string='<html><body><h1>FUE-G04 Native PDF Research</h1><p>Fictional test, no patient data.</p></body></html>').write_pdf(out)
          b = out.read_bytes()
          if not b.startswith(b'%PDF-') or not 1024 < len(b) < 500000:
              raise AssertionError('Real native WeasyPrint 68.1 PDF failed size/signature')
          print('EXPERIMENTAL_WEASYPRINT_NATIVE_RENDER=PASS')
          print('DISCOVERY_PDF_BYTES=' + str(len(b)))
          '@ | & $hostPython -
          if ($LASTEXITCODE -ne 0) { throw 'Actual native WeasyPrint lab rendering failed' }
          Write-Host 'EXPERIMENTAL_ONLY_TRANSITIVE_PACKAGES_NOT_YET_PINNED=YES'
          Write-Host 'PRODUCTION_CODE_CERTIFIED_AND_INSTALLER=UNCHANGED'
      - name: Audit transitive package archives, native DLLs and Windows wheels (LAB only)
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys.outputs.msys2-location }}
        run: |
          $ErrorActionPreference = 'Stop'
          $pkgDir = Join-Path $env:MSYS2_LOCATION 'var/cache/pacman/pkg'
          $native = Join-Path $env:MSYS2_LOCATION 'ucrt64/bin'
          $bash = Join-Path $env:MSYS2_LOCATION 'usr/bin/bash.exe'
          $hostPython = Join-Path $env:pythonLocation 'python.exe'
          $lines = @(& $bash -lc 'pacman -Q')
          if ($LASTEXITCODE -ne 0) { throw 'pacman inventory failed' }
          $archives = @(Get-ChildItem -LiteralPath $pkgDir -File -Filter '*.pkg.tar.zst')
          $pkgs = @()
          foreach ($line in $lines) {
            if ($line -notmatch '^(mingw-w64-ucrt-x86_64-\S+)\s+(\S+)        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: fue-g04-experimental-native-ucrt64-inventory
          path: |
            ${{ runner.temp }}/FUE-G04-experimental-dll-hashes.json
            ${{ runner.temp }}/FUE-G04-experimental-complete-provenance.json
            ${{ runner.temp }}/FUE-G04-experimental-python-requirements.txt
          if-no-files-found: error
          retention-days: 7
) { continue }
            $name = $Matches[1]; $ver = $Matches[2]
            $found = @($archives | Where-Object { $_.Name.StartsWith("$name-$ver-", [StringComparison]::Ordinal) })
            if ($found.Count -ne 1) { throw "Missing/ambiguous archive for $name $ver" }
            $f = $found[0]
            $pkgs += @{ Name=$name; Version=$ver; Archive=$f.Name; Bytes=$f.Length; Sha256=(Get-FileHash -LiteralPath $f.FullName -Algorithm SHA256).Hash.ToLowerInvariant() }
          }
          $pkgs = @($pkgs | Sort-Object Name)
          if ($pkgs.Count -lt 5 -or @($pkgs | Where-Object { $_.Name -eq 'mingw-w64-ucrt-x86_64-pango' }).Count -ne 1) {
            throw 'Incomplete MSYS2 UCRT64 package closure'
          }
          $dlls = @(Get-ChildItem -LiteralPath $native -File -Filter '*.dll' | Sort-Object Name | ForEach-Object {
            @{ Name=$_.Name; Bytes=$_.Length; Sha256=(Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() }
          })
          if ($dlls.Count -lt 5) { throw 'Missing native DLL inventory' }
          $distJson = & $hostPython -m pip list --format=json
          if ($LASTEXITCODE -ne 0) { throw 'pip distribution query failed' }
          $dist = @($distJson | ConvertFrom-Json | Where-Object { $_.name -notin @('pip','setuptools','wheel') } | Sort-Object name)
          if (@($dist | Where-Object { $_.name -eq 'weasyprint' -and $_.version -eq '68.1' }).Count -ne 1) { throw 'WeasyPrint missing' }
          $reqFile = Join-Path $env:RUNNER_TEMP 'FUE-G04-experimental-python-requirements.txt'
          @($dist | ForEach-Object { "$($_.name)==$($_.version)" }) | Set-Content -LiteralPath $reqFile -Encoding utf8
          $wheelDir = Join-Path $env:RUNNER_TEMP 'fue-g04-wheel-discovery'
          New-Item -Path $wheelDir -ItemType Directory -Force | Out-Null
          & $hostPython -m pip download --no-input --disable-pip-version-check --only-binary=:all: --no-deps -r $reqFile -d $wheelDir
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Windows wheel download failed' }
          $wheels = @(Get-ChildItem -LiteralPath $wheelDir -File -Filter '*.whl' | Sort-Object Name | ForEach-Object {
            @{ Name=$_.Name; Bytes=$_.Length; Sha256=(Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() }
          })
          if ($wheels.Count -ne $dist.Count) { throw 'Wheel/distribution cardinality mismatch' }
          $report = @{
            Status='EXPERIMENTAL_NOT_RELEASE_APPROVED'; Sha=$env:GITHUB_SHA
            MsYs2Packages=$pkgs; NativeDlls=$dlls; PythonDistributions=$dist; WindowsWheels=$wheels
            Limitations='metadata-only; no PE import closure or bundled executable run; no frozen package replay'
          }
          $report | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'FUE-G04-experimental-complete-provenance.json') -Encoding utf8
          Write-Host "EXPERIMENTAL_MSYS2_PACKAGES=$($pkgs.Count)"
          Write-Host "EXPERIMENTAL_NATIVE_DLLS=$($dlls.Count)"
          Write-Host "EXPERIMENTAL_PYTHON_WHEELS=$($wheels.Count)"
          Write-Host 'EXPERIMENTAL_METADATA_ONLY=YES'
      - name: Save experimental digest inventory for subsequent strict manifest work
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: fue-g04-experimental-native-ucrt64-inventory
          path: ${{ runner.temp }}/FUE-G04-experimental-dll-hashes.json
          if-no-files-found: error
          retention-days: 7
