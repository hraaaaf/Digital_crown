name: FUE-G04 EXPERIMENTAL WeasyPrint UCRT64 native discovery

# EXPERIMENTAL research lab only: floating transitive pacman/pip packages
# MUST NEVER be inserted into signed CODE_CERTIFIED or an installer.
# No patient data, no production release, no clinic machine, no secrets.
on:
  push:
    branches:
      - ci/fue-g04-windows-installable-chain-20261010
    paths:
      - 'docs/audits/FUE_G04_TRIGGER_WEASYPRINT_UCRT64_DISCOVERY_20261011.txt'

permissions:
  contents: read

jobs:
  experimental-native-discovery:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Install official MSYS2 UCRT64 Pango in disposable runner
        id: msys
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        with:
          msystem: UCRT64
          update: true
          cache: false
          install: mingw-w64-ucrt-x86_64-pango
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pin Pango archive SHA and verify lab-only native discovery
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys.outputs.msys2-location }}
        run: |
          $ErrorActionPreference = 'Stop'
          $native = Join-Path $env:MSYS2_LOCATION 'ucrt64/bin'
          if (-not (Test-Path -LiteralPath $native -PathType Container)) { throw 'No UCRT64 native bin' }
          # Package-manager cache, authenticated by MSYS2 repository; no direct mirror request.
          $cache = Join-Path $env:MSYS2_LOCATION 'var/cache/pacman/pkg'
          $archive = Join-Path $cache 'mingw-w64-ucrt-x86_64-pango-1.58.2-1-any.pkg.tar.zst'
          if (-not (Test-Path -LiteralPath $archive -PathType Leaf)) {
            $bash = Join-Path $env:MSYS2_LOCATION 'usr/bin/bash.exe'
            if (-not (Test-Path -LiteralPath $bash -PathType Leaf)) { throw 'Cannot use authenticated package manager' }
            & $bash -lc 'pacman -Sw --noconfirm --cachedir /var/cache/pacman/pkg mingw-w64-ucrt-x86_64-pango'
            if ($LASTEXITCODE -ne 0) { throw 'Official MSYS2 package manager could not cache Pango' }
          }
          if (-not (Test-Path -LiteralPath $archive -PathType Leaf)) { throw 'The exact Pango archive version is unavailable; do not use floating dependency' }
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '8d86e4a018ff139b010bf357fa1c9f9030fa32ee195c54ed7e89d8ea701851c8') {
            throw 'Official Pango package SHA256 mismatch: stop discovery'
          }
          Write-Host 'DISCOVERY_OFFICIAL_PANGO_PACKAGE_SHA256=VERIFIED'
          $needed = @('libgobject-2.0-0.dll', 'libpango-1.0-0.dll', 'libpangoft2-1.0-0.dll', 'libfontconfig-1.dll', 'libharfbuzz-0.dll')
          $manifest = @()
          foreach ($name in $needed) {
            $f = Join-Path $native $name
            if (-not (Test-Path -LiteralPath $f -PathType Leaf)) { throw "MSYS2 native library missing: $name" }
            $actual = (Get-FileHash -LiteralPath $f -Algorithm SHA256).Hash.ToLowerInvariant()
            $manifest += [pscustomobject]@{ Name = $name; Sha256 = $actual; Bytes = (Get-Item -LiteralPath $f).Length }
            Write-Host "DISCOVERY_NATIVE_DLL_FOUND=$name"
          }
          $manifestFile = Join-Path $env:RUNNER_TEMP 'FUE-G04-experimental-dll-hashes.json'
          $manifest | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath $manifestFile -Encoding utf8
          $env:WEASYPRINT_DLL_DIRECTORIES = $native
          $env:PATH = "$native;$env:PATH"
          # PATH intentionally includes native MSYS2 DLLs, but the MSYS2 Python lacks pip.
          # Always execute the CPython 3.12 selected by actions/setup-python.
          $hostPython = Join-Path $env:pythonLocation 'python.exe'
          if (-not (Test-Path -LiteralPath $hostPython -PathType Leaf)) { throw 'Missing setup-python interpreter' }
          & $hostPython -c 'import sys; print("LAB_HOST_PYTHON=" + sys.executable)'
          if ($LASTEXITCODE -ne 0) { throw 'setup-python interpreter failed' }
          & $hostPython -m pip install --no-input --disable-pip-version-check 'weasyprint==68.1'
          if ($LASTEXITCODE -ne 0) { throw 'Exact WeasyPrint 68.1 lab dependency failed to install' }
          @'
          import os
          from pathlib import Path
          from weasyprint import HTML
          out = Path(os.environ['RUNNER_TEMP']) / 'fue-g04-synthetic-native-test.pdf'
          HTML(string='<html><body><h1>FUE-G04 Native PDF Research</h1><p>Fictional test, no patient data.</p></body></html>').write_pdf(out)
          b = out.read_bytes()
          if not b.startswith(b'%PDF-') or not 1024 < len(b) < 500000:
              raise AssertionError('Real native WeasyPrint 68.1 PDF failed size/signature')
          print('EXPERIMENTAL_WEASYPRINT_NATIVE_RENDER=PASS')
          print('DISCOVERY_PDF_BYTES=' + str(len(b)))
          '@ | & $hostPython -
          if ($LASTEXITCODE -ne 0) { throw 'Actual native WeasyPrint lab rendering failed' }
          Write-Host 'EXPERIMENTAL_ONLY_TRANSITIVE_PACKAGES_NOT_YET_PINNED=YES'
          Write-Host 'PRODUCTION_CODE_CERTIFIED_AND_INSTALLER=UNCHANGED'
      - name: Audit transitive package archives, native DLLs and Windows wheels (LAB only)
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys.outputs.msys2-location }}
        run: |
          $ErrorActionPreference = 'Stop'
          $pkgDir = Join-Path $env:MSYS2_LOCATION 'var/cache/pacman/pkg'
          $native = Join-Path $env:MSYS2_LOCATION 'ucrt64/bin'
          $bash = Join-Path $env:MSYS2_LOCATION 'usr/bin/bash.exe'
          $hostPython = Join-Path $env:pythonLocation 'python.exe'
          $lines = @(& $bash -lc 'pacman -Q')
          if ($LASTEXITCODE -ne 0) { throw 'pacman inventory failed' }
          $archives = @(Get-ChildItem -LiteralPath $pkgDir -File -Filter '*.pkg.tar.zst')
          $pkgs = @()
          foreach ($line in $lines) {
            if ($line -notmatch '^(mingw-w64-ucrt-x86_64-\S+)\s+(\S+)$') { continue }
            $name = $Matches[1]; $ver = $Matches[2]
            $found = @($archives | Where-Object { $_.Name.StartsWith("$name-$ver-", [StringComparison]::Ordinal) })
            if ($found.Count -ne 1) { throw "Missing/ambiguous archive for $name $ver" }
            $f = $found[0]
            $pkgs += @{ Name=$name; Version=$ver; Archive=$f.Name; Bytes=$f.Length; Sha256=(Get-FileHash -LiteralPath $f.FullName -Algorithm SHA256).Hash.ToLowerInvariant() }
          }
          $pkgs = @($pkgs | Sort-Object Name)
          if ($pkgs.Count -lt 5 -or @($pkgs | Where-Object { $_.Name -eq 'mingw-w64-ucrt-x86_64-pango' }).Count -ne 1) {
            throw 'Incomplete MSYS2 UCRT64 package closure'
          }
          $dlls = @(Get-ChildItem -LiteralPath $native -File -Filter '*.dll' | Sort-Object Name | ForEach-Object {
            @{ Name=$_.Name; Bytes=$_.Length; Sha256=(Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() }
          })
          if ($dlls.Count -lt 5) { throw 'Missing native DLL inventory' }
          $distJson = & $hostPython -m pip list --format=json
          if ($LASTEXITCODE -ne 0) { throw 'pip distribution query failed' }
          $dist = @($distJson | ConvertFrom-Json | Where-Object { $_.name -notin @('pip','setuptools','wheel') } | Sort-Object name)
          if (@($dist | Where-Object { $_.name -eq 'weasyprint' -and $_.version -eq '68.1' }).Count -ne 1) { throw 'WeasyPrint missing' }
          $reqFile = Join-Path $env:RUNNER_TEMP 'FUE-G04-experimental-python-requirements.txt'
          @($dist | ForEach-Object { "$($_.name)==$($_.version)" }) | Set-Content -LiteralPath $reqFile -Encoding utf8
          $wheelDir = Join-Path $env:RUNNER_TEMP 'fue-g04-wheel-discovery'
          New-Item -Path $wheelDir -ItemType Directory -Force | Out-Null
          & $hostPython -m pip download --no-input --disable-pip-version-check --only-binary=:all: --no-deps -r $reqFile -d $wheelDir
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Windows wheel download failed' }
          $wheels = @(Get-ChildItem -LiteralPath $wheelDir -File -Filter '*.whl' | Sort-Object Name | ForEach-Object {
            @{ Name=$_.Name; Bytes=$_.Length; Sha256=(Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() }
          })
          if ($wheels.Count -ne $dist.Count) { throw 'Wheel/distribution cardinality mismatch' }
          $report = @{
            Status='EXPERIMENTAL_NOT_RELEASE_APPROVED'; Sha=$env:GITHUB_SHA
            MsYs2Packages=$pkgs; NativeDlls=$dlls; PythonDistributions=$dist; WindowsWheels=$wheels
            Limitations='metadata-only; no PE import closure or bundled executable run; no frozen package replay'
          }
          $report | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'FUE-G04-experimental-complete-provenance.json') -Encoding utf8
          Write-Host "EXPERIMENTAL_MSYS2_PACKAGES=$($pkgs.Count)"
          Write-Host "EXPERIMENTAL_NATIVE_DLLS=$($dlls.Count)"
          Write-Host "EXPERIMENTAL_PYTHON_WHEELS=$($wheels.Count)"
          Write-Host 'EXPERIMENTAL_METADATA_ONLY=YES'
      - name: Prove synthetic PDF with copied UCRT64 DLLs and isolated PATH (LAB only)
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys.outputs.msys2-location }}
        run: |
          $ErrorActionPreference = 'Stop'
          $native = Join-Path $env:MSYS2_LOCATION 'ucrt64/bin'
          $copy = Join-Path $env:RUNNER_TEMP 'fue-g04-isolated-dll-directory'
          New-Item -Path $copy -ItemType Directory -Force | Out-Null
          $libraries = @(Get-ChildItem -LiteralPath $native -Filter '*.dll' -File)
          if ($libraries.Count -ne 64) { throw "Unexpected UCRT64 DLL inventory: $($libraries.Count), expected 64" }
          foreach ($lib in $libraries) {
            $destination = Join-Path $copy $lib.Name
            Copy-Item -LiteralPath $lib.FullName -Destination $destination -ErrorAction Stop
            $fromHash = (Get-FileHash -LiteralPath $lib.FullName -Algorithm SHA256).Hash
            $toHash = (Get-FileHash -LiteralPath $destination -Algorithm SHA256).Hash
            if ($fromHash -ne $toHash) { throw "Isolated copied DLL mismatch: $($lib.Name)" }
          }
          $python = Join-Path $env:pythonLocation 'python.exe'
          if (-not (Test-Path -LiteralPath $python -PathType Leaf)) { throw 'Missing pinned GitHub Python 3.12' }
          $env:WEASYPRINT_DLL_DIRECTORIES = $copy
          $system = $env:SystemRoot
          $env:PATH = "$env:pythonLocation;$system\System32;$system;$system\System32\Wbem"
          if ($env:PATH -match '(?i)(msys|ucrt64)') { throw 'Native MSYS2 PATH was not isolated' }
          @'
          import ctypes
          import hashlib
          import json
          import os
          from pathlib import Path
          from weasyprint import HTML

          native = Path(os.environ["WEASYPRINT_DLL_DIRECTORIES"]).resolve()
          if "msys" in os.environ["PATH"].lower() or "ucrt64" in os.environ["PATH"].lower():
              raise AssertionError("MSYS2 installation leaked into PATH")
          dll_guard = os.add_dll_directory(str(native))
          required = (
              "libgobject-2.0-0.dll", "libpango-1.0-0.dll",
              "libpangoft2-1.0-0.dll", "libfontconfig-1.dll", "libharfbuzz-0.dll",
          )
          for name in required:
              ctypes.WinDLL(str(native / name))
          out = Path(os.environ["RUNNER_TEMP"]) / "fue-g04-isolated-native-smoke.pdf"
          HTML(string="<html><body><h1>Isolated native PDF</h1><p>Fictional data only.</p></body></html>").write_pdf(out)
          data = out.read_bytes()
          if not (data.startswith(b"%PDF-") and 1024 < len(data) < 500000):
              raise AssertionError("Invalid isolated Windows native PDF")

          kernel = ctypes.WinDLL("kernel32", use_last_error=True)
          kernel.GetModuleHandleW.argtypes = [ctypes.c_wchar_p]
          kernel.GetModuleHandleW.restype = ctypes.c_void_p
          kernel.GetModuleFileNameW.argtypes = [ctypes.c_void_p, ctypes.c_wchar_p, ctypes.c_uint]
          kernel.GetModuleFileNameW.restype = ctypes.c_uint
          modules = {}
          for name in required:
              handle = kernel.GetModuleHandleW(name)
              if not handle:
                  raise AssertionError(f"Native DLL not loaded: {name}")
              buf = ctypes.create_unicode_buffer(4096)
              if not kernel.GetModuleFileNameW(handle, buf, len(buf)):
                  raise AssertionError(f"Cannot inspect module path: {name}")
              resolved = Path(buf.value).resolve()
              if resolved.parent != native:
                  raise AssertionError(f"Unexpected DLL loader fallback: {name} at {resolved}")
              modules[name] = str(resolved)
          report = {
              "status": "EXPERIMENTAL_ISOLATION_ONLY",
              "sha": os.environ["GITHUB_SHA"],
              "pdf_bytes": len(data),
              "pdf_sha256": hashlib.sha256(data).hexdigest(),
              "isolated_dll_count": len(list(native.glob("*.dll"))),
              "five_loaded_modules": modules,
              "notes": "Not a packaged Digital Crown executable. No clinic or Lenovo test.",
          }
          (Path(os.environ["RUNNER_TEMP"]) / "fue-g04-isolated-native-check.json").write_text(
              json.dumps(report, indent=2), encoding="utf-8"
          )
          print("EXPERIMENTAL_ISOLATED_NATIVE_PDF=PASS")
          print("EXPERIMENTAL_ISOLATED_PDF_BYTES=" + str(len(data)))
          print("EXPERIMENTAL_DLL_PATHS_ONLY_COPIED_FOLDER=PASS")
          '@ | & $python -
          if ($LASTEXITCODE -ne 0) { throw 'Isolated native smoke failed' }
          Write-Host 'EXPERIMENTAL_ONLY_NO_STANDALONE_INSTALLER=YES'
      - name: Smoke disposable PyInstaller onedir executable with copied native DLLs (LAB only)
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys.outputs.msys2-location }}
        run: |
          $ErrorActionPreference = 'Stop'
          $python = Join-Path $env:pythonLocation 'python.exe'
          $sourceNative = Join-Path $env:MSYS2_LOCATION 'ucrt64/bin'
          $dlls = @(Get-ChildItem -LiteralPath $sourceNative -File -Filter '*.dll' | Sort-Object Name)
          if ($dlls.Count -ne 64) { throw 'Unexpected DLL count: abort frozen laboratory' }
          # This is the canonical Windows toolchain version; no app runtime is changed.
          & $python -m pip install --no-input --disable-pip-version-check 'pyinstaller==6.22.3'
          if ($LASTEXITCODE -ne 0) { throw 'PyInstaller 6.22.3 unavailable' }
          $root = Join-Path $env:RUNNER_TEMP 'fue-g04-disposable-frozen-probe'
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          $source = Join-Path $root 'fue-g04-synthetic-pdf-only.py'
          @'
          import ctypes
          import hashlib
          import json
          import os
          import sys
          from pathlib import Path

          if not getattr(sys, "frozen", False):
              raise AssertionError("Test did not run in a frozen PyInstaller executable")
          if "msys" in os.environ["PATH"].lower() or "ucrt64" in os.environ["PATH"].lower():
              raise AssertionError("MSYS2 leak in frozen executable PATH")

          bundled = Path(sys._MEIPASS).resolve() / "native"
          if not bundled.is_dir():
              raise AssertionError("Bundled native DLL directory missing")
          if len(list(bundled.glob("*.dll"))) != 64:
              raise AssertionError("Bundled DLL count mismatch")

          os.environ["WEASYPRINT_DLL_DIRECTORIES"] = str(bundled)
          dll_handle = os.add_dll_directory(str(bundled))
          from weasyprint import HTML

          required = (
              "libgobject-2.0-0.dll", "libpango-1.0-0.dll",
              "libpangoft2-1.0-0.dll", "libfontconfig-1.dll", "libharfbuzz-0.dll"
          )
          for name in required:
              ctypes.WinDLL(str(bundled / name))

          out = Path(os.environ["RUNNER_TEMP"]) / "fue-g04-frozen-lab-synthetic.pdf"
          HTML(string="<html><body><h1>Frozen probe</h1><p>Fictional only.</p></body></html>").write_pdf(out)
          pdf = out.read_bytes()
          if not (pdf.startswith(b"%PDF-") and 1024 < len(pdf) < 500000):
              raise AssertionError("Bundled frozen WeasyPrint PDF invalid")

          kernel = ctypes.WinDLL("kernel32", use_last_error=True)
          kernel.GetModuleHandleW.argtypes = [ctypes.c_wchar_p]
          kernel.GetModuleHandleW.restype = ctypes.c_void_p
          kernel.GetModuleFileNameW.argtypes = [ctypes.c_void_p, ctypes.c_wchar_p, ctypes.c_uint]
          kernel.GetModuleFileNameW.restype = ctypes.c_uint
          loaded = {}
          for name in required:
              handle = kernel.GetModuleHandleW(name)
              if not handle:
                  raise AssertionError(f"Missing frozen DLL module {name}")
              buf = ctypes.create_unicode_buffer(4096)
              if not kernel.GetModuleFileNameW(handle, buf, len(buf)):
                  raise AssertionError(f"Cannot resolve frozen DLL module path for {name}")
              resolved = Path(buf.value).resolve()
              if resolved.parent != bundled:
                  raise AssertionError(f"Frozen DLL did not load from bundle: {name}: {resolved}")
              loaded[name] = str(resolved)

          record = {
              "status": "EXPERIMENTAL_FROZEN_PDF_ONLY",
              "sha": os.environ["GITHUB_SHA"],
              "pyinstaller_toolchain": "6.22.3",
              "pdf_bytes": len(pdf),
              "pdf_sha256": hashlib.sha256(pdf).hexdigest(),
              "bundled_dlls": 64,
              "loaded_critical_dlls": loaded,
              "notes": "Synthetic minimal PyInstaller executable only, NOT the certified Digital Crown app or installer",
          }
          (Path(os.environ["RUNNER_TEMP"]) / "fue-g04-frozen-lab-evidence.json").write_text(
              json.dumps(record, indent=2), encoding="utf-8"
          )
          print("EXPERIMENTAL_FROZEN_NATIVE_PDF=PASS")
          print("EXPERIMENTAL_FROZEN_BUNDLED_DLL_PATHS=PASS")
          print("EXPERIMENTAL_FROZEN_PDF_BYTES=" + str(len(pdf)))
          '@ | Set-Content -LiteralPath $source -Encoding utf8
          $dist = Join-Path $root 'dist'
          $build = Join-Path $root 'build'
          $spec = Join-Path $root 'spec'
          $pyArgs = @('-m','PyInstaller','--noconfirm','--clean','--onedir','--console',
                      '--name','FUEG04LabFrozenPDF','--distpath',$dist,
                      '--workpath',$build,'--specpath',$spec)
          foreach ($dll in $dlls) {
            $pyArgs += @('--add-binary', "$($dll.FullName);native")
          }
          $pyArgs += $source
          & $python @pyArgs
          if ($LASTEXITCODE -ne 0) { throw 'PyInstaller frozen native probe build failed' }
          $exe = Join-Path $dist 'FUEG04LabFrozenPDF/FUEG04LabFrozenPDF.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) { throw 'Frozen laboratory EXE missing' }
          # Execution has no Python nor MSYS2 toolchain directory in PATH.
          $system = $env:SystemRoot
          $env:PATH = "$system\System32;$system;$system\System32\Wbem"
          $env:WEASYPRINT_DLL_DIRECTORIES = ''
          if ($env:PATH -match '(?i)(msys|ucrt64)') { throw 'Host PATH isolation failed' }
          & $exe
          if ($LASTEXITCODE -ne 0) { throw 'Frozen executable native PDF failed' }
          $exeSha = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Add-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'fue-g04-frozen-lab-evidence.json') -Value ''
          Write-Host "EXPERIMENTAL_FROZEN_EXE_SHA256=$exeSha"
          Write-Host 'EXPERIMENTAL_ONLY_APP_INSTALLER_NOT_TESTED=YES'
      - name: Save experimental digest inventory for subsequent strict manifest work
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: fue-g04-experimental-native-ucrt64-inventory
          path: |
            ${{ runner.temp }}/FUE-G04-experimental-dll-hashes.json
            ${{ runner.temp }}/FUE-G04-experimental-complete-provenance.json
            ${{ runner.temp }}/FUE-G04-experimental-python-requirements.txt
            ${{ runner.temp }}/fue-g04-isolated-native-smoke.pdf
            ${{ runner.temp }}/fue-g04-isolated-native-check.json
            ${{ runner.temp }}/fue-g04-frozen-lab-synthetic.pdf
            ${{ runner.temp }}/fue-g04-frozen-lab-evidence.json
          if-no-files-found: error
          retention-days: 7
