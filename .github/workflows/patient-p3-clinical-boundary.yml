name: Patient P3 Clinical Boundary

on:
  pull_request:
    branches:
      - agent/patient-page-p2-journey
    paths:
      - 'frontend/src/features/patients/components/ClinicalHub.tsx'
      - 'frontend/src/features/patients/components/wizards/**'
      - 'frontend/src/features/patients/PatientP3ClinicalAssistantBoundary.test.ts'
      - '.github/workflows/patient-p3-clinical-boundary.yml'

permissions:
  contents: read

jobs:
  boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: P3 assistant authority test and build
        working-directory: frontend
        run: |
          npm ci
          npm test -- --run src/features/patients/PatientP3ClinicalAssistantBoundary.test.ts
          npm run build
