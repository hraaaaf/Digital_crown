name: Patient P0-D Routine Mobile Header Cert

on:
  push:
    branches:
      - agent/patient-page-p0-truth-safety
    paths:
      - .github/workflows/patient-p0d-routine-mobile-header-cert.yml
  workflow_dispatch:

concurrency:
  group: patient-p0d-routine-mobile-header-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      ENVIRONMENT: test
      SECRET_KEY: patient-p0d-mobile-header-secret-000001
      DATABASE_URL: sqlite:///./t2-runtime-cert.db
      TELEMETRY_ENABLED: "false"
      CLOUD_AI_ENABLED: "false"
      DEBUG: "false"
      ALLOWED_ORIGINS: "http://127.0.0.1:5173,http://localhost:5173"
    steps:
      - uses: actions/checkout@v4

      - name: Patch mobile Patient header behavior
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('frontend/src/features/patients/PatientDetailsInner.tsx')
          text = path.read_text()
          old = '''      <header className={cn(\n        "sticky top-0 z-[300] bg-card-bg/80 backdrop-blur-xl border-b border-border-main transition-all duration-500",\n        isCompact ? "pt-3 pb-0 shadow-elite" : "pt-4 md:pt-8 pb-0 shadow-elite"\n      )}>'''
          new = '''      <header className={cn(\n        "bg-card-bg/80 backdrop-blur-xl border-b border-border-main transition-all duration-500",\n        isCompact\n          ? "sticky top-0 z-[300] pt-3 pb-0 shadow-elite"\n          : "relative z-[100] pt-4 pb-0 shadow-elite md:sticky md:top-0 md:z-[300] md:pt-8"\n      )}>'''
          if old in text:
              path.write_text(text.replace(old, new, 1))
          elif new not in text:
              raise SystemExit('Expected Patient header fragment not found')
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.12.0 torchvision==0.27.0 --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^(torch|torchvision)([<=>].*)?$' requirements.txt > /tmp/requirements-p0d-mobile-header.txt
          pip install -r /tmp/requirements-p0d-mobile-header.txt
          pip install httpx==0.27.2

      - name: Install frontend and Chromium
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Start isolated backend
        run: |
          python scripts/t2_runtime_server.py > /tmp/p0d-mobile-header-backend.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8005/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/p0d-mobile-header-backend.log
          exit 1

      - name: Start frontend
        working-directory: frontend
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 > /tmp/p0d-mobile-header-frontend.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:5173 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/p0d-mobile-header-frontend.log
          exit 1

      - name: Capture Routine mobile-header evidence
        working-directory: frontend
        run: |
          set -euo pipefail
          rm -rf ../artifacts/patient-p0d-routine-after
          node scripts/capture-patient-p0d-routine-after.mjs 2>&1 | tee /tmp/p0d-mobile-header-runner.log
          test -f ../artifacts/patient-p0d-routine-after/summary.json
          test -f ../artifacts/patient-p0d-routine-after/evidence.json
          test "$(find ../artifacts/patient-p0d-routine-after -maxdepth 1 -name '*.png' | wc -l)" -eq 12
          cp /tmp/p0d-mobile-header-runner.log ../artifacts/patient-p0d-routine-after/runner.log

      - name: Upload Routine mobile-header evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patient-p0d-routine-mobile-header-after
          path: artifacts/patient-p0d-routine-after
          if-no-files-found: error
          retention-days: 14

      - name: Commit certified mobile Patient header patch
        run: |
          if git diff --quiet -- frontend/src/features/patients/PatientDetailsInner.tsx; then
            echo "Patient header already contains certified mobile behavior."
            exit 0
          fi
          git add frontend/src/features/patients/PatientDetailsInner.tsx
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(patient): disable sticky clinical header on mobile"
          git push origin HEAD:agent/patient-page-p0-truth-safety
