name: LOT05 J10O Public Dataset Qualification

on:
  push:
    branches:
      - exp/lot05-j10o-public-panoramic-datasets-research-smoke-20261022
  pull_request:
    branches:
      - exp/lot05-j10n-fdi-synthetic-annotation-governance-20261022
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rights-before-tests:
    name: Offline fail-closed checks for public source metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Keep commercial and clinical model training blocked
        run: |
          python experiments/lot05_j10i_fdi_commercial_rights_gate.py
          python experiments/lot05_j10l_fdi_training_readiness.py --mode synthetic_geometry
      - name: Install Pillow for synthetic JPEG unit fixtures
        run: python -m pip install 'pillow==11.3.0'
      - name: 17 offline public metadata and safe decoding tests
        run: python experiments/test_lot05_j10o_public_dataset_smoke.py -v
      - name: 12 local-only synthetic COCO FDI32 import security and integrity tests
        run: python experiments/test_lot05_j10p_roboflow_coco_offline_intake.py -v
      - name: 12 synthetic AKUDENTAL research-only YOLO FDI32/35 text label tests
        run: python experiments/test_lot05_j10q_akudental_fdi_yolo_text_only.py -v
      - name: 6 synthetic private-workspace staging tests (never read pixels)
        run: python experiments/test_lot05_j10r_akudental_private_research_workspace.py -v
      - name: 5 synthetic pilot-metrics and partition-isolation unit tests
        run: python experiments/test_lot05_j10t_akudental_torchvision_pilot.py -v
      - name: 9 synthetic FDI32 confusion, false positives and AP50 evaluator tests
        run: python experiments/test_lot05_j10v_akudental_fdi_holdout_eval.py -v
      - name: 6 synthetic FDI31/32 and duplicate-location root-cause tests
        run: python experiments/test_lot05_j10w_akudental_duplicate_fdi_root_cause.py -v
      - name: 4 synthetic private visual-review source selection tests
        run: python experiments/test_lot05_j10x_local_private_fdi_visual_reviewer.py -v
      - name: 5 synthetic FDI32 resolution-ablation metric tests
        run: python experiments/test_lot05_j10y_akudental_resolution_ablation.py -v

  roboflow-public-metadata:
    name: Public FDI32 publisher metadata on native runner
    needs: rights-before-tests
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read only the original published HTML class labels and splits
        shell: bash
        run: |
          python experiments/lot05_j10o_roboflow_fdi_public_metadata.py \
            --output-json reports/j10o-roboflow-${{ matrix.os }}.json
      - name: Never conflate declared CC BY with cleared clinical/commercial rights
        shell: bash
        run: |
          python -c "import json, pathlib; d=json.loads(next(pathlib.Path('reports').glob('j10o-roboflow-*.json')).read_text()); assert d['status']=='PUBLIC_FDI32_METADATA_CONFIRMED_RIGHTS_UNVERIFIED'; assert d['fdi_class_count']==32; assert d['cloud_commercial_training_authorized'] is False; assert d['image_data_downloaded'] is False"
      - name: Metadata JSON only; never upload patient images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: j10o-roboflow-fdi-metadata-${{ matrix.os }}
          path: reports/j10o-roboflow-${{ matrix.os }}.json
          if-no-files-found: warn
          retention-days: 7

  academic-public-panoramic:
    name: Public Tunisian academic OPG single image research-only test
    needs: rights-before-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pillow in-memory public research image decoding
        run: python -m pip install 'pillow==11.3.0'
      - name: Try first-party published CC BY dataset single JPEG without login
        run: |
          python experiments/lot05_j10o_tunisia_public_opg_sample.py \
            --output-json reports/j10o-tunisia-public-academic.json
      - name: No 32 FDI ground-truth or commercial clinical clearance claim
        run: |
          python -c "import json; d=json.load(open('reports/j10o-tunisia-public-academic.json')); assert d['status']=='PUBLIC_ACADEMIC_OPG_ONE_IMAGE_PREPROCESS_PASS'; assert d['fdi_32_ground_truth_available_for_this_test'] is False; assert d['clinical_release_approved'] is False"
      - name: Upload aggregate academic processing JSON not the public image
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: j10o-academic-public-opg-metadata
          path: reports/j10o-tunisia-public-academic.json
          if-no-files-found: warn
          retention-days: 7
