name: LOT05 J10O Public Dataset Qualification

on:
  push:
    branches:
      - exp/lot05-j10o-public-panoramic-datasets-research-smoke-20261022
  pull_request:
    branches:
      - exp/lot05-j10n-fdi-synthetic-annotation-governance-20261022
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rights-before-tests:
    name: Public metadata QA offline tests
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pillow for synthetic JPEG fixtures
        run: python -m pip install 'pillow==11.3.0'
      - name: Test public metadata validators without any patient image
        run: python experiments/test_lot05_j10o_public_dataset_smoke.py -v
