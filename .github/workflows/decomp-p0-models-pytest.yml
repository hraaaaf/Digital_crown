name: DECOMP P0-C Targeted Pytest

on:
  pull_request:
    types: [edited]
    branches: [master]

permissions:
  contents: read

jobs:
  targeted-model-contract:
    if: github.head_ref == 'agent/decomp-p0-large-files' && contains(github.event.pull_request.body || '', 'DECOMP_P0C_PYTEST')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout certified P0-C head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install targeted test dependencies
        run: python -m pip install --disable-pip-version-check SQLAlchemy==2.0.28 pytest==9.0.3

      - name: Run focused models contract
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          cat > /tmp/test_p0c_models_contract.py <<'PY'
          from datetime import datetime, timedelta

          from sqlalchemy import create_engine, inspect
          from sqlalchemy.orm import Session, configure_mappers

          import backend.models as models
          import backend.models_base as base_mod
          import backend.models_platform as platform
          import backend.models_operations as operations
          import backend.models_bot_settings as bot_settings
          import backend.models_catalog_plan  # noqa: F401
          import backend.models_clinical_p3  # noqa: F401
          import backend.models_imaging_p4  # noqa: F401
          import backend.models_identity_p4  # noqa: F401


          PLATFORM_EXPORTS = (
              'AuditLog', 'RevokedToken', 'AIFeedback', 'ProactiveAlert', 'DeviceToken',
              'ClinicalContraindication', 'ClinicalDrug', 'ClinicalProtocolDB',
              'ZKAPairingToken', 'GhostMemoryLog', 'MilestoneType', 'JourneyMilestone',
          )
          OPERATIONS_EXPORTS = (
              'LabJobStatus', 'Lab', 'LabJob', 'StockCategorie', 'StockItem',
              'PartnerOrderStatus', 'PartnerSettlementBasis', 'PartnerRevenueModel',
              'PartnerProductAvailability', 'PartnerOrder', 'PartnerOrderEvent',
              'PartnerSupplier', 'PartnerCatalogProduct',
          )
          BOT_EXPORTS = (
              'AgendaMode', 'BotSession', 'BotMessage', 'BotPendingAction',
              'CabinetSettings', 'AgendaException',
          )
          MOVED_TABLES = {
              'audit_logs', 'revoked_tokens', 'ai_feedback', 'proactive_alerts', 'device_tokens',
              'clinical_contraindications', 'clinical_drugs', 'clinical_protocols_db',
              'zka_pairing_tokens', 'ghost_memory_logs', 'journey_milestones',
              'labs', 'lab_jobs', 'stock_items', 'partner_orders', 'partner_order_events',
              'partner_suppliers', 'partner_catalog_products', 'bot_sessions', 'bot_messages',
              'bot_pending_actions', 'cabinet_settings', 'agenda_exceptions',
          }


          def test_historical_facade_reexports_exact_objects_and_single_base():
              assert models.Base is base_mod.Base
              for module, names in (
                  (platform, PLATFORM_EXPORTS),
                  (operations, OPERATIONS_EXPORTS),
                  (bot_settings, BOT_EXPORTS),
              ):
                  for name in names:
                      assert getattr(models, name) is getattr(module, name), name

              for table_name in MOVED_TABLES:
                  assert models.Base.metadata.tables[table_name].metadata is models.Base.metadata


          def test_all_mappers_and_full_schema_create_cleanly():
              configure_mappers()
              assert len(models.Base.metadata.tables) == 57
              assert len(models.Base.registry.mappers) == 57

              engine = create_engine('sqlite:///:memory:')
              models.Base.metadata.create_all(engine)
              actual = set(inspect(engine).get_table_names())
              assert len(actual) == 57
              assert MOVED_TABLES <= actual


          def test_safe_extracted_models_round_trip_in_sqlite():
              engine = create_engine('sqlite:///:memory:')
              models.Base.metadata.create_all(engine)
              now = datetime(2026, 8, 22, 12, 0, 0)

              rows = [
                  models.RevokedToken(jti='p0c-contract', expires_at=now + timedelta(hours=1)),
                  models.ClinicalContraindication(antecedent='test', molecule='molecule-test'),
                  models.ClinicalDrug(molecule='drug-test', brand_names=['Brand'], dosages=['1 mg'], form='test'),
                  models.ClinicalProtocolDB(procedure='procedure-test', molecules=['drug-test'], advice='test'),
                  models.Lab(name='Lab P0-C', phone='000'),
                  models.CabinetSettings(id=1),
                  models.AgendaException(
                      start_date=now,
                      end_date=now + timedelta(hours=1),
                      reason='P0-C contract',
                      is_holiday=False,
                  ),
              ]
              with Session(engine) as session:
                  session.add_all(rows)
                  session.commit()
                  assert session.get(models.RevokedToken, 'p0c-contract').jti == 'p0c-contract'
                  assert session.get(models.CabinetSettings, 1).agenda_mode == models.AgendaMode.EXACT
                  assert session.query(models.Lab).filter_by(name='Lab P0-C').one().phone == '000'
                  assert session.query(models.ClinicalDrug).filter_by(molecule='drug-test').one().brand_names == ['Brand']
                  assert session.query(models.AgendaException).filter_by(reason='P0-C contract').one().is_holiday is False
          PY
          python -m pytest -q /tmp/test_p0c_models_contract.py

      - name: Ensure certification is read-only
        run: test -z "$(git status --porcelain)"
