name: Facad Ricketts 32F dental cluster contract

on:
  push:
    branches:
      - feat/ortho-studio-lot08-ricketts-protocol-v2
    paths:
      - .github/workflows/facad-314-ricketts32-dental-contract.yml
      - docs/audits/schemas/ortho_lot08_ricketts32_facad_dental_cluster_resolution_v1.json
      - docs/audits/schemas/ortho_lot08_facad_dc_unmapped_backlog_v1.json
      - backend/tests/test_cephalo_lot08_ricketts32_facad_dental_cluster_contract.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run self-contained contract tests
        run: python backend/tests/test_cephalo_lot08_ricketts32_facad_dental_cluster_contract.py
