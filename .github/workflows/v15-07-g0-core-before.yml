name: V1.5-07 G0 Core baseline exact-master

on:
  pull_request:
    paths:
      - '.github/workflows/v15-07-g0-core-before.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v15-07-g0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-before:
    name: Core real UI / four routes / isolated T2
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      SOURCE_HEAD: 9158902e034c22b162873d5fd44ea7afd45f3e16
      ENVIRONMENT: test
      DIGITALCROWN_ISOLATED_RUNTIME: "1"
      DATABASE_URL: sqlite:///./t2-runtime-cert.db
      TELEMETRY_ENABLED: "false"
      CLOUD_AI_ENABLED: "false"
      DEBUG: "false"
      ALLOWED_ORIGINS: "http://127.0.0.1:5173,http://localhost:5173"
      T2_USER: t2-browser@cabinet.ma
    steps:
      - name: Checkout immutable product master (no PR UI delta)
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_HEAD }}
      - name: Attest exact immutable source
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"
          test "$ENVIRONMENT" = test
          test "$DIGITALCROWN_ISOLATED_RUNTIME" = 1
          test "$DATABASE_URL" = sqlite:///./t2-runtime-cert.db
          echo "PRODUCT_SHA=$SOURCE_HEAD" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Isolated synthetic T2 password
        shell: bash
        run: |
          password="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          echo "::add-mask::$password"
          echo "T2_PASSWORD=$password" >> "$GITHUB_ENV"
      - name: Install server dependencies for disposable fixture DB
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install torch==2.10.0 torchvision==0.25.0 torchaudio==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^(torch|torchvision|torchaudio)([<=>].*)?$' requirements.txt >/tmp/v15-07-g0-req.txt
          pip install -r /tmp/v15-07-g0-req.txt
      - name: Install real frontend and Chromium
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start isolated FastAPI fixture runtime
        shell: bash
        run: |
          rm -f t2-runtime-cert.db
          python scripts/t2_runtime_server.py >/tmp/v15-07-g0-backend.log 2>&1 &
          for i in {1..100}; do
            if curl -fsS http://127.0.0.1:8005/health >/dev/null; then exit 0; fi
            sleep 1
          done
          tail -100 /tmp/v15-07-g0-backend.log
          exit 1
      - name: Start actual master frontend
        working-directory: frontend
        shell: bash
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 >/tmp/v15-07-g0-frontend.log 2>&1 &
          for i in {1..100}; do
            if curl -fsS http://127.0.0.1:5173 >/dev/null; then exit 0; fi
            sleep 1
          done
          tail -80 /tmp/v15-07-g0-frontend.log
          exit 1
      - name: Materialize ephemeral browser evidence script (not product code)
        working-directory: frontend
        shell: bash
        run: |
          cat > scripts/v15-07-g0-core-before.mjs <<'EVIDENCE'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          import { chromium, request } from 'playwright';

          const out = path.resolve('../artifacts/v15-07-g0-core');
          fs.mkdirSync(out, { recursive: true });
          const sourceHead = process.env.SOURCE_HEAD;
          const user = process.env.T2_USER;
          const password = process.env.T2_PASSWORD;
          if (!sourceHead || !user || !password) throw Error('Missing isolated G0 identity');
          const api = await request.newContext({ baseURL: 'http://127.0.0.1:8005' });
          const login = await api.post('/api/auth/login', { form: { username:user, password } });
          if (!login.ok()) throw Error('Disposable T2 authentication failed HTTP ' + login.status());
          const tokens = await login.json();
          const headers = { Authorization: 'Bearer ' + tokens.access_token };
          const response = await api.get('/api/patients/', { headers });
          if (!response.ok()) throw Error('Cannot read isolated fixture patients HTTP ' + response.status());
          const rows = await response.json();
          const patient = rows.find(x => x.numero_dossier === 'T2-0001') || rows[0];
          if (!patient) throw Error('No isolated T2 patient fixture');

          const screens = [
            {key:'dashboard',path:'/dashboard'},
            {key:'agenda',path:'/agenda'},
            {key:'dossier',path:'/patients/' + patient.id},
            {key:'imagerie',path:'/patients/' + patient.id,imaging:true},
          ];
          const sizes = [
            {key:'desktop1280',width:1280,height:900},
            {key:'desktop1440',width:1440,height:900},
            {key:'desktop1920',width:1920,height:1080},
            {key:'desktop2560',width:2560,height:1080},
            {key:'cssZoom200Proxy',width:1280,height:900,cssZoom:2},
            {key:'mobile390Regression',width:390,height:844},
            {key:'mobile430Regression',width:430,height:932},
            {key:'tablet768Regression',width:768,height:1024},
          ];
          const evidence = [];
          const browser = await chromium.launch({headless:true});
          try {
            for (const size of sizes) {
              const context = await browser.newContext({viewport:{width:size.width,height:size.height},locale:'fr-FR',colorScheme:'light'});
              for (const screen of screens) {
                const page = await context.newPage();
                const errors=[], http5xx=[];
                page.on('pageerror',err=>errors.push(String(err).slice(0,350)));
                page.on('response',res=>{if(res.status()>=500)http5xx.push({status:res.status(),path:new URL(res.url()).pathname});});
                let failure=null, actualUrl=null, dom=null, screenshot=null, hash=null;
                try {
                  await page.addInitScript(({access,refresh})=>{
                    localStorage.setItem('token',access);
                    localStorage.setItem('refresh_token',refresh||'');
                    localStorage.setItem('appMode','prod');
                  },{access:tokens.access_token,refresh:tokens.refresh_token});
                  await page.goto('http://127.0.0.1:5173'+screen.path,{waitUntil:'domcontentloaded',timeout:90000});
                  await page.locator('main').first().waitFor({state:'visible',timeout:30000});
                  if(screen.imaging){
                    await page.getByRole('button',{name:'Imagerie',exact:true}).click({timeout:20000});
                    await page.getByRole('button',{name:'Médiathèque',exact:true}).click({timeout:20000});
                    await page.getByText('Médiathèque clinique',{exact:true}).waitFor({state:'visible',timeout:20000});
                  }
                  if(size.cssZoom) {
                    await page.evaluate(z=>{document.documentElement.style.zoom=String(z)},size.cssZoom);
                  }
                  await page.waitForTimeout(1250);
                  actualUrl=new URL(page.url()).pathname;
                  dom=await page.evaluate(()=>{
                    const main=document.querySelector('main');
                    return {title:document.title,heading:document.querySelector('main h1')?.textContent?.trim().slice(0,120)||null,
                      mainVisible:!!main&&main.getBoundingClientRect().height>0,
                      mainTextLength:(main?.innerText||'').trim().length,
                      viewportWidth:innerWidth,docScrollWidth:document.documentElement.scrollWidth,
                      horizontalOverflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+2,
                      visibleButtons:Array.from(document.querySelectorAll('main button')).filter(e=>e.getBoundingClientRect().width>0).length};
                  });
                  if(actualUrl!==screen.path||!dom.mainVisible||dom.mainTextLength<12)failure='route/visible-app validation: '+JSON.stringify({actualUrl,expected:screen.path,dom});
                  const name=screen.key+'-'+size.key+'.png';
                  screenshot=name;
                  const bytes=await page.screenshot({path:path.join(out,name),fullPage:false,timeout:30000});
                  hash=crypto.createHash('sha256').update(bytes).digest('hex');
                } catch(e){failure=String(e).slice(0,600); actualUrl=actualUrl||new URL(page.url()).pathname;}
                evidence.push({screen:screen.key,size:size.key,viewport:{width:size.width,height:size.height},
                  zoom:size.cssZoom?'CSS zoom proxy only, NOT browser 200%': '1x',
                  intendedPath:screen.path,actualUrl,dom,screenshot,sha256:hash,
                  pageErrors:errors,http5xx,failure});
                await page.close();
              }
              await context.close();
            }
          } finally {await browser.close(); await api.dispose();}
          const critical=evidence.filter(e=>e.failure||e.pageErrors.length||e.http5xx.length);
          const report={sourceHead,runnerHead:process.env.GITHUB_SHA,fixture:'isolated T2 only',
            authentication:'real API credentials with enrolled disposable workstation',
            method:'real Vite React UI + disposable FastAPI + Playwright chromium, no routes mocked',
            cssZoomWarning:'CSS zoom proxy does not prove actual browser zoom at 200%',
            humanApproval:false,physicalEvidence:false,
            expected:32,captured:evidence.filter(e=>e.screenshot&&e.sha256).length,
            errors:critical.length,records:evidence};
          fs.writeFileSync(path.join(out,'manifest.json'),JSON.stringify(report,null,2));
          console.log('V15_07_G0_CAPTURE_SUMMARY '+JSON.stringify({sourceHead,expected:report.expected,captured:report.captured,critical:critical.length,
            failures:critical.slice(0,8).map(e=>({screen:e.screen,size:e.size,error:e.failure,pageErrors:e.pageErrors,http5xx:e.http5xx}))}));
          if(report.captured!==32||critical.length)process.exitCode=1;
          EVIDENCE
          node --check scripts/v15-07-g0-core-before.mjs
      - name: Execute real Core screen matrix (no application source modifications)
        working-directory: frontend
        shell: bash
        run: |
          set -o pipefail
          node scripts/run-with-t2-workstation.mjs scripts/v15-07-g0-core-before.mjs 2>&1 | tee ../artifacts/v15-07-g0-runner.log
      - name: Capture failure diagnostics (sanitized)
        if: failure()
        shell: bash
        run: |
          tail -80 /tmp/v15-07-g0-backend.log || true
          tail -80 /tmp/v15-07-g0-frontend.log || true
      - name: Upload manifest and real screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v15-07-g0-core-before-exact-master
          path: |
            artifacts/v15-07-g0-core
            artifacts/v15-07-g0-runner.log
          retention-days: 30
          if-no-files-found: warn
