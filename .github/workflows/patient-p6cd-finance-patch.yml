name: Patient P6CD Finance Patch

on:
  pull_request:
    branches:
      - agent/patient-page-p5-documents
    paths:
      - '.github/workflows/patient-p6cd-finance-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/patient-page-p6-finances-identite'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply P6-C/D truth and RBAC patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          patients = Path('backend/routers/patients.py')
          details = Path('frontend/src/features/patients/PatientDetailsInner.tsx')
          finances = Path('frontend/src/features/patients/components/PatientFinances.tsx')

          # Backend: finance permission + explicit billing-base truth.
          p = patients.read_text(encoding='utf-8')
          old_sig = '''@router.get("/{patient_id}/financial-snapshot")
def get_patient_financial_snapshot(
    patient_id: int,
    db: Session = Depends(database.get_db),
    current_user: models.User = Depends(require_permission("patients"))
):'''
          new_sig = '''@router.get("/{patient_id}/financial-snapshot")
def get_patient_financial_snapshot(
    patient_id: int,
    db: Session = Depends(database.get_db),
    current_user: models.User = Depends(require_permission(["accounting", "payments"]))
):'''
          if old_sig in p:
              p = p.replace(old_sig, new_sig, 1)
          elif 'financial-snapshot' in p and 'require_permission(["accounting", "payments"])' not in p:
              raise SystemExit('financial snapshot permission signature not found')

          old_billed = '''    total_billed = float(
        db.query(func.sum(models.Acte.montant)).filter(models.Acte.patient_id == patient_id).scalar() or 0.0
    )'''
          new_billed = '''    acte_total, acte_count = (
        db.query(func.sum(models.Acte.montant), func.count(models.Acte.id))
        .filter(models.Acte.patient_id == patient_id)
        .one()
    )
    total_billed = float(acte_total or 0.0)
    has_billing_data = (acte_count or 0) > 0'''
          if old_billed in p:
              p = p.replace(old_billed, new_billed, 1)
          elif 'has_billing_data = (acte_count or 0) > 0' not in p:
              raise SystemExit('financial snapshot billing block not found')

          marker = '        "total_billed": round(total_billed, 2),\n'
          if '"has_billing_data": has_billing_data' not in p:
              if marker not in p: raise SystemExit('financial snapshot return marker not found')
              p = p.replace(marker, marker + '        "has_billing_data": has_billing_data,\n', 1)
          patients.write_text(p, encoding='utf-8')

          # Page Patient: hide + guard financial surface unless accounting/payments is real.
          d = details.read_text(encoding='utf-8')
          clinical_line = "  const canClinical = !user?.employer_id || Boolean(user?.permissions?.clinical);"
          if 'const canFinance =' not in d:
              if clinical_line not in d: raise SystemExit('canClinical marker missing')
              d = d.replace(
                  clinical_line,
                  clinical_line + "\n  const canFinance = !user?.employer_id || Boolean(user?.permissions?.accounting || user?.permissions?.payments);",
                  1,
              )

          clinical_guard = '''  useEffect(() => {
    if (!canClinical && activeTab === 'clinical') {
      setSearchParams({ tab: 'tracking' }, { replace: true });
    }
  }, [canClinical, activeTab, setSearchParams]);'''
          finance_guard = '''

  // Même garde-fou pour Finances : aucune surface financière sans permission accounting/payments.
  useEffect(() => {
    if (!canFinance && activeTab === 'finances') {
      setSearchParams({ tab: 'tracking' }, { replace: true });
    }
  }, [canFinance, activeTab, setSearchParams]);'''
          if 'if (!canFinance && activeTab === \'finances\')' not in d:
              if clinical_guard not in d: raise SystemExit('clinical guard marker missing')
              d = d.replace(clinical_guard, clinical_guard + finance_guard, 1)

          quick_pay = '''              <QuickAction
                icon={<Banknote size={18} />}
                label="Encaisser"
                onClick={() => setIsPayModalOpen(true)}
                accent="emerald"
              />'''
          if quick_pay in d:
              d = d.replace(quick_pay, '''              {canFinance && (
                <QuickAction
                  icon={<Banknote size={18} />}
                  label="Encaisser"
                  onClick={() => setIsPayModalOpen(true)}
                  accent="emerald"
                />
              )}''', 1)
          elif '{canFinance && (' not in d:
              raise SystemExit('quick pay block missing')

          finance_tab = '''            <TabButton active={activeTab === 'finances'} onClick={() => handleTabChange('finances')} icon={<Banknote size={17} />} label="Finances" />'''
          if finance_tab in d:
              d = d.replace(finance_tab, '''            {canFinance && <TabButton active={activeTab === 'finances'} onClick={() => handleTabChange('finances')} icon={<Banknote size={17} />} label="Finances" />}''', 1)
          elif 'canFinance && <TabButton' not in d:
              raise SystemExit('finance tab marker missing')

          finance_render = '''          {activeTab === 'finances' && (
            <PatientFinances patientId={Number(id)} />
          )}'''
          if finance_render in d:
              d = d.replace(finance_render, '''          {canFinance && activeTab === 'finances' && (
            <PatientFinances patientId={Number(id)} />
          )}''', 1)
          elif "canFinance && activeTab === 'finances'" not in d:
              raise SystemExit('finance render marker missing')
          details.write_text(d, encoding='utf-8')

          # Finance UI: error state, factual KPI set, no false zero/no false no-arrears.
          f = finances.read_text(encoding='utf-8')
          f = f.replace(
              "import { Banknote, Clock, CheckCircle2, AlertTriangle, Calendar, TrendingUp, CreditCard } from 'lucide-react';",
              "import { Banknote, Clock, CheckCircle2, AlertTriangle, Calendar, CreditCard, RefreshCcw } from 'lucide-react';",
          )
          if "useAuthStore" not in f:
              f = f.replace(
                  "import { InstallmentPlanModal } from './InstallmentPlanModal';",
                  "import { InstallmentPlanModal } from './InstallmentPlanModal';\nimport { useAuthStore } from '../../../stores/useAuthStore';",
                  1,
              )
          state_marker = '''  const [planActe, setPlanActe] = useState<ActeBillingItem | null>(null);'''
          if 'const canAccounting =' not in f:
              f = f.replace(
                  state_marker,
                  state_marker + "\n  const user = useAuthStore(state => state.user);\n  const canAccounting = !user?.employer_id || Boolean(user?.permissions?.accounting);",
                  1,
              )

          f = f.replace(
              '  const { data: snapshot, isLoading, refetch } = useQuery({',
              '  const { data: snapshot, isLoading, isError, refetch } = useQuery({',
              1,
          )
          billing_query = '''  const { data: actesBilling, refetch: refetchBilling } = useQuery({
    queryKey: ['actes-billing', patientId],
    queryFn: async () => {
      const res = await api.get(`/accounting/actes-billing/patient/${patientId}`);
      return res.data as ActeBillingItem[];
    },
  });'''
          billing_query_new = '''  const { data: actesBilling, refetch: refetchBilling } = useQuery({
    queryKey: ['actes-billing', patientId],
    queryFn: async () => {
      const res = await api.get(`/accounting/actes-billing/patient/${patientId}`);
      return res.data as ActeBillingItem[];
    },
    enabled: canAccounting,
  });'''
          if billing_query in f:
              f = f.replace(billing_query, billing_query_new, 1)

          old_after_loading = '''  if (!snapshot) return null;

  const hasBillingBase = snapshot.total_billed > 0;
  const recoveryRate = hasBillingBase
    ? Math.round((snapshot.total_collected / snapshot.total_billed) * 100)
    : null;'''
          new_after_loading = '''  if (isError || !snapshot) {
    return (
      <div className="flex flex-col items-center justify-center py-24 gap-4 text-center">
        <AlertTriangle size={36} className="text-rose-500" />
        <div>
          <h3 className="font-black text-slate-800">Impossible de charger les finances</h3>
          <p className="text-sm text-text-muted mt-1">Aucun solde n'est déduit tant que le snapshot financier ne répond pas.</p>
        </div>
        <button type="button" onClick={() => refetch()} className="flex items-center gap-2 px-4 py-2 rounded-xl bg-primary text-white text-xs font-black uppercase tracking-widest">
          <RefreshCcw size={14} /> Réessayer
        </button>
      </div>
    );
  }

  const hasBillingBase = Boolean(snapshot.has_billing_data);
  const nextInstallment = snapshot.upcoming_installments?.[0] ?? null;'''
          if old_after_loading in f:
              f = f.replace(old_after_loading, new_after_loading, 1)
          elif 'const nextInstallment =' not in f:
              raise SystemExit('PatientFinances post-loading block missing')

          # Replace the complete 4-card KPI block up to Actes & Paiements.
          kpi_pattern = re.compile(r'''      /\* KPI Cards \*/.*?      /\* Actes & Paiements \*/''', re.S)
          kpi_new = '''      {/* KPI Cards */}
      <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
        <div className="bg-card-bg p-6 rounded-[2rem] border border-border-main shadow-sm">
          <p className="text-[10px] font-black uppercase tracking-[0.12em] text-text-muted mb-2">Facturé</p>
          <div className="text-3xl font-black text-slate-800">
            {hasBillingBase ? snapshot.total_billed.toLocaleString('fr-MA') : 'Indéterminé'}
          </div>
          <div className="text-xs text-text-muted font-bold mt-1">{hasBillingBase ? 'MAD · Source Actes' : 'Aucune base Acte fiable'}</div>
        </div>

        <div className="bg-card-bg p-6 rounded-[2rem] border border-border-main shadow-sm">
          <p className="text-[10px] font-black uppercase tracking-[0.12em] text-text-muted mb-2">Encaissé</p>
          <div className="text-3xl font-black text-emerald-600">{snapshot.total_collected.toLocaleString('fr-MA')}</div>
          <div className="text-xs text-text-muted font-bold mt-1">MAD · Paiements</div>
        </div>

        <div className={cn(
          "p-6 rounded-[2rem] border shadow-sm",
          hasBillingBase && snapshot.remaining_due > 0 ? "bg-red-50 border-red-100" : "bg-card-bg border-border-main"
        )}>
          <p className="text-[10px] font-black uppercase tracking-[0.12em] text-text-muted mb-2">Reste dû</p>
          <div className={cn(
            "text-3xl font-black",
            !hasBillingBase ? "text-slate-500" : snapshot.remaining_due > 0 ? "text-red-600" : "text-emerald-600"
          )}>
            {hasBillingBase ? snapshot.remaining_due.toLocaleString('fr-MA') : 'Indéterminé'}
          </div>
          <div className="text-xs text-text-muted font-bold mt-1">{hasBillingBase ? 'MAD · Facturé − encaissé' : 'Base facturée absente'}</div>
        </div>

        <div className="bg-card-bg p-6 rounded-[2rem] border border-border-main shadow-sm">
          <p className="text-[10px] font-black uppercase tracking-[0.12em] text-text-muted mb-2">Prochaine échéance</p>
          <div className="text-2xl font-black text-blue-600">
            {nextInstallment?.due_date ? new Date(nextInstallment.due_date).toLocaleDateString('fr-FR') : 'Aucune'}
          </div>
          <div className="text-xs text-text-muted font-bold mt-1">
            {nextInstallment ? `${nextInstallment.amount.toLocaleString('fr-MA')} MAD · ${nextInstallment.label}` : 'Échéancier'}
          </div>
        </div>
      </div>

      {/* Actes & Paiements */}'''
          f, n = kpi_pattern.subn(kpi_new, f, count=1)
          if n != 1: raise SystemExit('PatientFinances KPI block not found')

          empty_arrears = '''          {snapshot.overdue_items.length === 0 ? (
            <div className="flex flex-col items-center justify-center py-10 text-text-muted">
              <CheckCircle2 size={32} className="text-emerald-400 mb-2" />
              <p className="text-sm font-bold">Aucun impayé</p>
            </div>
          ) : ('''
          neutral_arrears = '''          {!hasBillingBase ? (
            <div className="flex flex-col items-center justify-center py-10 text-text-muted text-center px-6">
              <AlertTriangle size={32} className="text-amber-400 mb-2" />
              <p className="text-sm font-bold">État des impayés indéterminé</p>
              <p className="text-xs mt-1">Aucune base Acte fiable n'est disponible pour conclure à un solde nul.</p>
            </div>
          ) : snapshot.overdue_items.length === 0 ? (
            <div className="flex flex-col items-center justify-center py-10 text-text-muted">
              <CheckCircle2 size={32} className="text-emerald-400 mb-2" />
              <p className="text-sm font-bold">Aucun impayé</p>
            </div>
          ) : ('''
          if empty_arrears in f:
              f = f.replace(empty_arrears, neutral_arrears, 1)
          elif 'État des impayés indéterminé' not in f:
              raise SystemExit('arrears empty-state marker missing')

          finances.write_text(f, encoding='utf-8')

          # Final source contracts.
          p = patients.read_text(encoding='utf-8')
          d = details.read_text(encoding='utf-8')
          f = finances.read_text(encoding='utf-8')
          for required in [
              'require_permission(["accounting", "payments"])',
              'has_billing_data = (acte_count or 0) > 0',
              '"has_billing_data": has_billing_data',
          ]:
              if required not in p: raise SystemExit(f'backend requirement missing: {required}')
          for required in ['const canFinance =', "activeTab === 'finances'", 'canFinance &&']:
              if required not in d: raise SystemExit(f'RBAC requirement missing: {required}')
          for required in ['Impossible de charger les finances', 'Boolean(snapshot.has_billing_data)', 'Prochaine échéance', 'État des impayés indéterminé']:
              if required not in f: raise SystemExit(f'finance UI requirement missing: {required}')
          for forbidden in ['Taux Recouvrement', 'const recoveryRate =']:
              if forbidden in f: raise SystemExit(f'finance UI stale concept remains: {forbidden}')
          PY
          git diff --check

      - name: Commit P6-C/D product patch
        run: |
          git config user.name 'digital-crown-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add backend/routers/patients.py frontend/src/features/patients/PatientDetailsInner.tsx frontend/src/features/patients/components/PatientFinances.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'fix(patient): align P6 finance truth and RBAC'
          git push origin HEAD:${GITHUB_HEAD_REF}
