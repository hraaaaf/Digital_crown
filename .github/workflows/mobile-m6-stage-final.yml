      - name: Materialize exact final candidate in audit namespace
        run: |
          rm -rf m6-final
          cd /tmp/m6-work
          git diff --name-only 40cb22d6dddcbae6dee7340dc23956decaf701d8 > /tmp/m6-final-files.txt
          cd "$GITHUB_WORKSPACE"
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            mkdir -p "m6-final/$(dirname "$path")"
            cp "/tmp/m6-work/$path" "m6-final/$path"
          done < /tmp/m6-final-files.txt
          cp /tmp/m6-final-files.txt m6-final/file-list.txt
          printf 'base=40cb22d6dddcbae6dee7340dc23956decaf701d8\n' > m6-final/metadata.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- m6-final
          git commit -m "chore(mobile): stage reviewed M6.1 candidate"
