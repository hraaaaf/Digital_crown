name: Mobile M6 Stage Final Candidate

on:
  push:
    branches: [audit/mobile-m6-generator]
    paths: [.github/workflows/mobile-m6-stage-final.yml]

permissions:
  actions: read
  contents: write

jobs:
  stage:
    name: Build and verify M6.1 candidate without touching product branch
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-only-secret-key-minimum-32-characters-long
      DATABASE_URL: "sqlite:///:memory:"
      ENVIRONMENT: development
      TELEMETRY_ENABLED: "false"
      CLOUD_AI_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/mobile-m6-generator
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Prepare clean current-master worktree and detached candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git worktree add --detach /tmp/m6-work 40cb22d6dddcbae6dee7340dc23956decaf701d8
          gh api repos/${{ github.repository }}/actions/artifacts/9485239294/zip > /tmp/m6.zip
          rm -rf /tmp/m6-artifact && mkdir -p /tmp/m6-artifact
          unzip -q /tmp/m6.zip -d /tmp/m6-artifact
          test -f /tmp/m6-artifact/files/backend/routers/mobile.py
          test -f /tmp/m6-artifact/files/frontend/src/services/api.ts
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            src="/tmp/m6-artifact/files/$path"
            [ -f "$src" ] || continue
            mkdir -p "/tmp/m6-work/$(dirname "$path")"
            cp "$src" "/tmp/m6-work/$path"
          done < /tmp/m6-artifact/file-list.txt

      - name: Apply final reviewed M6.1 corrections
        working-directory: /tmp/m6-work
        shell: python
        run: |
          from pathlib import Path
          import textwrap

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, value):
              Path(path).parent.mkdir(parents=True, exist_ok=True)
              Path(path).write_text(value, encoding='utf-8')

          def once(path, old, new):
              value = read(path)
              count = value.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, got {count}: {old[:100]!r}')
              write(path, value.replace(old, new, 1))

          # Repair the known generator indentation defect.
          once(
              'backend/security.py',
              '            db_session.add(RevokedToken(jti=marker, expires_at=expires_at))\n                    invalidated = db_session.query(ZKAPairingToken).filter(',
              '            db_session.add(RevokedToken(jti=marker, expires_at=expires_at))\n            invalidated = db_session.query(ZKAPairingToken).filter(',
          )

          once(
              'backend/models_platform.py',
              '# La masterKey ne transite jamais dans une URL. Le QR encode un UUID 5min.',
              '# La masterKey ne transite jamais dans une URL. Le QR encode un secret haute entropie 5 min.',
          )

          once(
              'backend/routers/admin_legacy.py',
              '    import uuid\n    from datetime import timedelta\n',
              '    from datetime import timedelta\n',
          )

          # Dedicated mobile endpoints: active device + DB role/permissions + finance fail-closed.
          path = 'backend/routers/mobile_legacy.py'
          value = read(path)
          replacements = [
              ('from backend import models, database\n', 'from backend import models, database\nfrom backend.models_platform import MobilePairedDevice\n'),
              (
                  '        tenant_id = int(payload["tenant_id"])\n        user = db.query(models.User).filter(models.User.id == user_id).first()\n        if not user or not user.is_active or user.get_employer_id() != tenant_id:\n            raise err\n        return user, tenant_id, payload\n',
                  '        tenant_id = int(payload["tenant_id"])\n        device_id = payload.get("device_id")\n        if not device_id:\n            raise err\n        user = db.query(models.User).filter(models.User.id == user_id).first()\n        if not user or not user.is_active or user.get_employer_id() != tenant_id:\n            raise err\n        device = db.query(MobilePairedDevice).filter(\n            MobilePairedDevice.device_id == device_id,\n            MobilePairedDevice.user_id == user_id,\n            MobilePairedDevice.employer_id == tenant_id,\n            MobilePairedDevice.revoked_at.is_(None),\n        ).first()\n        if not device:\n            raise err\n        return user, tenant_id, payload\n'
              ),
              (
                  'description="Token à usage unique (UUID 5 min). Si client_public_key_hex est fourni, utilise ECDH (secp256r1) pour chiffrer la masterKey.",',
                  'description="Secret QR haute entropie ou code manuel 6 chiffres, à usage unique 5 min. ECDH (secp256r1) est obligatoire pour transmettre la clé.",'
              ),
              ('    db.add(models.MobilePairedDevice(\n', '    db.add(MobilePairedDevice(\n'),
              ('    current_user: models.User = Depends(require_mobile_permission(["agenda", "patients"])),\n', '    current_user: models.User = Depends(require_mobile_permission("agenda")),\n'),
              (
                  '    # ──────────────────────────────────────────────────────────────────────────────────────────────────\n    from backend.services.accounting_service import accounting_service\n    kpis = accounting_service.get_finance_kpis(db, employer_id, today)\n\n    # Nombre total patients \n',
                  '    # Les agrégats financiers ne sont même pas lus sans permission finance.\n    # Nombre total patients \n'
              ),
              (
                  '    else:\n        finance_data = {\n            "today_revenue": kpis["today_revenue"],\n',
                  '    else:\n        from backend.services.accounting_service import accounting_service\n        kpis = accounting_service.get_finance_kpis(db, employer_id, today)\n        finance_data = {\n            "today_revenue": kpis["today_revenue"],\n'
              ),
          ]
          for old, new in replacements:
              count = value.count(old)
              if count != 1:
                  raise SystemExit(f'mobile_legacy: expected one match, got {count}: {old[:90]!r}')
              value = value.replace(old, new, 1)
          write(path, value)

          # Refresh replay detection: revoke the whole device chain.
          path = 'backend/routers/mobile.py'
          value = read(path)
          start = value.index('    device = db.query(models.MobilePairedDevice).filter(')
          end = value.index("    role = user.role.value if hasattr(user.role, 'value') else str(user.role)", start)
          replacement = '''    device = db.query(models.MobilePairedDevice).filter(
              models.MobilePairedDevice.device_id == device_id,
              models.MobilePairedDevice.user_id == user_id,
              models.MobilePairedDevice.employer_id == tenant_id,
              models.MobilePairedDevice.revoked_at.is_(None),
          ).first()
          user = db.query(models.User).filter(models.User.id == user_id).first()
          if not device or not user or not user.is_active or user.get_employer_id() != tenant_id:
              raise err
          if device.refresh_jti != jti:
              device.revoked_at = datetime.utcnow()
              db.commit()
              raise err

          '''
          replacement = textwrap.dedent(replacement)
          write(path, value[:start] + replacement + value[end:])

          # Standard shared API auth must enforce the same active-device boundary.
          path = 'backend/routers/auth.py'
          value = read(path)
          start = value.index('        if jti and token_blacklist.is_revoked(jti, db):')
          end = value.index('\n\n    except (JWTError, ValueError, KeyError):', start)
          replacement = '''        if token_type == "mobile":
              if not jti or token_blacklist.is_revoked(jti, db):
                  raise credentials_exception
              user_id = int(payload["sub"])
              tenant_id = int(payload["tenant_id"])
              device_id = payload.get("device_id")
              if not device_id:
                  raise credentials_exception
              user = db.query(models.User).filter(models.User.id == user_id).first()
              if user is None or user.get_employer_id() != tenant_id:
                  raise credentials_exception
              device = db.query(models.MobilePairedDevice).filter(
                  models.MobilePairedDevice.device_id == device_id,
                  models.MobilePairedDevice.user_id == user_id,
                  models.MobilePairedDevice.employer_id == tenant_id,
                  models.MobilePairedDevice.revoked_at.is_(None),
              ).first()
              if device is None:
                  raise credentials_exception
          else:
              if jti and token_blacklist.is_revoked(jti, db):
                  raise credentials_exception
              email: str = payload.get("sub")
              if email is None:
                  raise credentials_exception
              user = db.query(models.User).filter(models.User.email == email).first()
          '''
          replacement = textwrap.dedent(replacement)
          replacement = '\n'.join(('        ' + line if line else '') for line in replacement.splitlines())
          write(path, value[:start] + replacement + value[end:])

          # Durable pairing truth and local bearer cleanup.
          path = 'frontend/src/services/zka/MobileStorage.ts'
          value = read(path)
          old = '  async clearCredentials(): Promise<void> {\n    await localforage.removeItem(STORE_CREDENTIALS_ID);\n  },'
          new = "  async clearCredentials(): Promise<void> {\n    await localforage.removeItem(STORE_CREDENTIALS_ID);\n    try { localStorage.removeItem('token'); localStorage.removeItem('refresh_token'); } catch { /* ignore */ }\n  },"
          if value.count(old) != 1: raise SystemExit('MobileStorage clearCredentials mismatch')
          value = value.replace(old, new, 1)
          old = '  async clearAll(): Promise<void> {\n    await localforage.removeItem(STORE_CREDENTIALS_ID);'
          if value.count(old) != 1: raise SystemExit('MobileStorage clearAll mismatch')
          value = value.replace(old, '  async clearAll(): Promise<void> {\n    await this.clearCredentials();', 1)
          old = '    return !!(creds?.publicId && creds?.masterKey && creds?.access_token);'
          if value.count(old) != 1: raise SystemExit('MobileStorage isPaired mismatch')
          value = value.replace(old, '    return !!(creds?.publicId && creds?.masterKey && creds?.access_token && creds?.refresh_token && creds?.device_id);', 1)
          write(path, value)

          write('frontend/src/services/zka/mobileFetch.ts', textwrap.dedent('''\
          import { MobileStorage, type ZKACredentials } from './MobileStorage';

          let mobileRefreshInFlight: Promise<ZKACredentials | null> | null = null;

          function trimTrailingSlash(value: string): string {
            return value.endsWith('/') ? value.slice(0, -1) : value;
          }

          export function resolveMobileApiBase(stored: string): string {
            const hostname = window.location.hostname;
            if (hostname === 'localhost' || hostname === '127.0.0.1') return trimTrailingSlash(stored);
            if (stored.includes('localhost') || stored.includes('127.0.0.1')) {
              return `${window.location.protocol}//${hostname}:8005`;
            }
            return trimTrailingSlash(stored);
          }

          async function clearRejectedCredentials(): Promise<void> {
            await MobileStorage.clearCredentials();
          }

          export async function refreshMobileCredentials(
            supplied?: ZKACredentials | null,
          ): Promise<ZKACredentials | null> {
            if (mobileRefreshInFlight) return mobileRefreshInFlight;
            mobileRefreshInFlight = (async () => {
              const creds = supplied ?? await MobileStorage.getCredentials();
              if (!creds?.refresh_token || !creds.device_id) return null;
              let response: Response;
              try {
                response = await fetch(`${resolveMobileApiBase(creds.api_base_url)}/api/mobile/refresh-token`, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ refresh_token: creds.refresh_token }),
                });
              } catch {
                return null;
              }
              if (!response.ok) {
                if (response.status === 401 || response.status === 403) await clearRejectedCredentials();
                return null;
              }
              const payload = await response.json();
              if (!payload.access_token || !payload.refresh_token || !payload.device_id) return null;
              const next = await MobileStorage.updateTokens(
                payload.access_token,
                payload.refresh_token,
                payload.device_id,
              );
              if (next) {
                try { localStorage.setItem('token', next.access_token); } catch { /* ignore */ }
              }
              return next;
            })().finally(() => { mobileRefreshInFlight = null; });
            return mobileRefreshInFlight;
          }

          export async function mobileFetch(
            input: RequestInfo | URL,
            init: RequestInit = {},
            supplied?: ZKACredentials | null,
          ): Promise<Response> {
            const creds = supplied ?? await MobileStorage.getCredentials();
            if (!creds) throw new Error('Mobile credentials unavailable');

            const send = (active: ZKACredentials) => {
              const headers = new Headers(init.headers);
              headers.set('Authorization', `Bearer ${active.access_token}`);
              return fetch(input, { ...init, headers });
            };

            const first = await send(creds);
            if (first.status !== 401) return first;

            const refreshed = await refreshMobileCredentials(creds);
            if (!refreshed) {
              if (!creds.refresh_token || !creds.device_id) await clearRejectedCredentials();
              return first;
            }
            return send(refreshed);
          }
          '''))

          # Focused backend security tests.
          write('backend/tests/test_mobile_identity_security.py', textwrap.dedent('''\
          from datetime import datetime, timedelta
          from pathlib import Path
          import uuid

          import pytest
          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric import ec
          from jose import jwt

          from backend import models
          from backend.routers.mobile import _create_mobile_jwt
          from backend.routers.mobile_legacy import get_mobile_employer_id, get_mobile_role
          from backend.security import ALGORITHM, SECRET_KEY, get_password_hash, token_blacklist
          from backend.utils import rate_limit


          @pytest.fixture(autouse=True)
          def _reset_pairing_rate_limit():
              path = Path(rate_limit._store_path)
              path.unlink(missing_ok=True)
              yield
              path.unlink(missing_ok=True)


          def _user(db, *, email, role, employer_id=None, permissions=None):
              user = models.User(
                  email=email,
                  hashed_password=get_password_hash('TestPass123!'),
                  role=role,
                  nom_complet='Mobile User',
                  is_active=True,
                  is_licensed=True,
                  employer_id=employer_id,
                  permissions=permissions or {},
              )
              db.add(user); db.commit(); db.refresh(user)
              return user


          def _pairing(db, owner, user, *, token=None, manual_code='654321'):
              row = models.ZKAPairingToken(
                  token=token or uuid.uuid4().hex,
                  manual_code=manual_code,
                  employer_id=owner.id,
                  user_id=user.id if user else None,
                  public_id='abcdef1234567890',
                  master_key='a' * 64,
                  role='DENTISTE',
                  expires_at=datetime.utcnow() + timedelta(minutes=5),
              )
              db.add(row); db.commit(); db.refresh(row)
              return row


          def _client_public_key():
              private_key = ec.generate_private_key(ec.SECP256R1())
              return private_key.public_key().public_bytes(
                  encoding=serialization.Encoding.X962,
                  format=serialization.PublicFormat.UncompressedPoint,
              ).hex()


          def _claim(client, record, token=None):
              return client.post('/api/mobile/claim-token', json={
                  'token': token or record.token,
                  'client_public_key_hex': _client_public_key(),
              })


          def test_pairing_binds_real_user_tenant_role_and_device(client, db, dentiste):
              secretary = _user(db, email='secretary-mobile@cabinet.ma', role=models.UserRole.SECRETAIRE,
                  employer_id=dentiste.id, permissions={'agenda': True, 'patients': True, 'accounting': False, 'payments': False})
              response = _claim(client, _pairing(db, dentiste, secretary))
              assert response.status_code == 200, response.text
              body = response.json()
              payload = jwt.decode(body['access_token'], SECRET_KEY, algorithms=[ALGORITHM])
              assert payload['sub'] == str(secretary.id)
              assert payload['tenant_id'] == dentiste.id
              assert payload['role'] == 'SECRETAIRE'
              assert payload['device_id'] == body['device_id']
              device = db.query(models.MobilePairedDevice).filter(models.MobilePairedDevice.device_id == body['device_id']).one()
              assert device.user_id == secretary.id and device.employer_id == dentiste.id


          def test_manual_code_is_separate_and_claimable(client, db, dentiste):
              record = _pairing(db, dentiste, dentiste, manual_code='123456')
              assert record.token != record.manual_code
              assert _claim(client, record, token='123456').status_code == 200


          def test_legacy_pairing_without_user_id_fails_closed(client, db, dentiste):
              record = _pairing(db, dentiste, None)
              response = _claim(client, record)
              assert response.status_code == 409
              db.refresh(record)
              assert record.used_at is None


          def test_role_and_tenant_are_reloaded_from_db(db, dentiste):
              secretary = _user(db, email='role-mobile@cabinet.ma', role=models.UserRole.SECRETAIRE, employer_id=dentiste.id)
              device = models.MobilePairedDevice(device_id=str(uuid.uuid4()), user_id=secretary.id,
                  employer_id=dentiste.id, client_public_key_hex=_client_public_key(), refresh_jti='refresh-test')
              db.add(device); db.commit()
              token = _create_mobile_jwt(secretary.id, 'DENTISTE', dentiste.id, device.device_id)
              auth = f'Bearer {token}'
              assert get_mobile_employer_id(auth, db) == dentiste.id
              assert get_mobile_role(auth, db) == 'SECRETAIRE'


          def test_refresh_replay_revokes_device_and_new_chain(client, db, dentiste):
              claim = _claim(client, _pairing(db, dentiste, dentiste))
              assert claim.status_code == 200, claim.text
              body = claim.json()
              old_refresh = body['refresh_token']
              refreshed = client.post('/api/mobile/refresh-token', json={'refresh_token': old_refresh})
              assert refreshed.status_code == 200, refreshed.text
              new_refresh = refreshed.json()['refresh_token']
              assert client.post('/api/mobile/refresh-token', json={'refresh_token': old_refresh}).status_code == 401
              db.expire_all()
              device = db.query(models.MobilePairedDevice).filter(models.MobilePairedDevice.device_id == body['device_id']).one()
              assert device.revoked_at is not None
              assert client.post('/api/mobile/refresh-token', json={'refresh_token': new_refresh}).status_code == 401


          def test_standard_auth_rejects_revoked_mobile_device(client, db, dentiste):
              claim = _claim(client, _pairing(db, dentiste, dentiste))
              body = claim.json()
              headers = {'Authorization': f"Bearer {body['access_token']}"}
              assert client.get('/api/auth/me', headers=headers).status_code == 200
              device = db.query(models.MobilePairedDevice).filter(models.MobilePairedDevice.device_id == body['device_id']).one()
              device.revoked_at = datetime.utcnow(); db.commit()
              assert client.get('/api/auth/me', headers=headers).status_code == 401


          def test_finance_export_is_backend_permission_guarded(client, db, dentiste):
              secretary = _user(db, email='finance-denied-mobile@cabinet.ma', role=models.UserRole.SECRETAIRE,
                  employer_id=dentiste.id, permissions={'agenda': True, 'patients': True, 'accounting': False, 'payments': False})
              claim = _claim(client, _pairing(db, dentiste, secretary))
              response = client.get('/api/mobile/accounting/export-pdf?year=2026&month=8',
                  headers={'Authorization': f"Bearer {claim.json()['access_token']}"})
              assert response.status_code == 403


          def test_cabinet_revocation_invalidates_device_and_refresh(client, db, dentiste):
              body = _claim(client, _pairing(db, dentiste, dentiste)).json()
              token_blacklist.revoke_mobile_access(dentiste.id, db)
              assert client.post('/api/mobile/refresh-token', json={'refresh_token': body['refresh_token']}).status_code == 401
              db.expire_all()
              device = db.query(models.MobilePairedDevice).filter(models.MobilePairedDevice.device_id == body['device_id']).one()
              assert device.revoked_at is not None
          '''))

          write('frontend/src/services/zka/mobileFetch.test.ts', textwrap.dedent('''\
          import { beforeEach, describe, expect, it, vi } from 'vitest';

          vi.mock('./MobileStorage', () => ({
            MobileStorage: {
              getCredentials: vi.fn(),
              updateTokens: vi.fn(),
              clearCredentials: vi.fn(),
            },
          }));

          import { MobileStorage } from './MobileStorage';
          import { mobileFetch } from './mobileFetch';

          const creds = {
            publicId: 'abcdef1234567890', masterKey: 'a'.repeat(64), access_token: 'old-access',
            refresh_token: 'old-refresh', device_id: 'device-1', api_base_url: 'http://127.0.0.1:8005',
          };
          const response = (status: number, body: Record<string, unknown> = {}) => ({
            status, ok: status >= 200 && status < 300, json: vi.fn().mockResolvedValue(body),
          }) as unknown as Response;

          describe('mobileFetch', () => {
            beforeEach(() => {
              vi.clearAllMocks(); localStorage.clear();
              vi.mocked(MobileStorage.getCredentials).mockResolvedValue(creds);
              vi.mocked(MobileStorage.updateTokens).mockImplementation(async (access, refresh, device) => ({
                ...creds, access_token: access, refresh_token: refresh, device_id: device,
              }));
            });

            it('rotates refresh credentials and retries one 401', async () => {
              const fetchMock = vi.fn().mockResolvedValueOnce(response(401))
                .mockResolvedValueOnce(response(200, { access_token: 'new-access', refresh_token: 'new-refresh', device_id: 'device-1' }))
                .mockResolvedValueOnce(response(200));
              vi.stubGlobal('fetch', fetchMock);
              const result = await mobileFetch('http://127.0.0.1:8005/api/mobile/snapshot');
              expect(result.status).toBe(200);
              expect(fetchMock).toHaveBeenCalledTimes(3);
              expect((fetchMock.mock.calls[0][1].headers as Headers).get('Authorization')).toBe('Bearer old-access');
              expect((fetchMock.mock.calls[2][1].headers as Headers).get('Authorization')).toBe('Bearer new-access');
            });

            it('clears rejected credentials after refresh rejection', async () => {
              const fetchMock = vi.fn().mockResolvedValueOnce(response(401)).mockResolvedValueOnce(response(401));
              vi.stubGlobal('fetch', fetchMock);
              await mobileFetch('http://127.0.0.1:8005/api/mobile/snapshot');
              expect(MobileStorage.clearCredentials).toHaveBeenCalledTimes(1);
            });
          });
          '''))

      - name: Backend static verification
        working-directory: /tmp/m6-work
        run: |
          python -m py_compile \
            backend/models_platform.py backend/database.py backend/main.py backend/security.py \
            backend/utils/rate_limit.py backend/routers/auth.py backend/routers/admin_legacy.py \
            backend/routers/mobile_legacy.py backend/routers/mobile.py \
            backend/tests/test_mobile_credential_hardening.py backend/tests/test_mobile_identity_security.py
          git diff --check

      - name: Install backend test dependencies
        working-directory: /tmp/m6-work
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.12.0 torchvision==0.27.0 --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^(torch|torchvision)([<=>].*)?$' requirements.txt > /tmp/requirements-m6.txt
          pip install -r /tmp/requirements-m6.txt
          pip install httpx==0.27.2 pytest pytest-asyncio

      - name: Run M6.1 backend tests
        working-directory: /tmp/m6-work
        run: |
          python -m pytest backend/tests/test_mobile_credential_hardening.py backend/tests/test_mobile_identity_security.py -q --maxfail=1

      - name: Install frontend dependencies
        working-directory: /tmp/m6-work/frontend
        run: npm ci

      - name: Run M6.1 frontend tests and build
        working-directory: /tmp/m6-work/frontend
        run: |
          npx vitest run src/services/zka/mobileFetch.test.ts
          npx eslint src/services/zka/MobileStorage.ts src/services/zka/mobileFetch.ts src/services/api.ts src/features/mobile/Onboarding/OnboardingScanner.tsx
          npm run build

      - name: Materialize exact verified candidate in audit namespace
        run: |
          rm -rf m6-final
          cd /tmp/m6-work
          git diff --name-only 40cb22d6dddcbae6dee7340dc23956decaf701d8 > /tmp/m6-final-files.txt
          cd "$GITHUB_WORKSPACE"
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            mkdir -p "m6-final/$(dirname "$path")"
            cp "/tmp/m6-work/$path" "m6-final/$path"
          done < /tmp/m6-final-files.txt
          cp /tmp/m6-final-files.txt m6-final/file-list.txt
