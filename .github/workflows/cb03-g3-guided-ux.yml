name: CB-03 G3 Guided UX Contract (synthetic source only)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - master
      - feature/cb03-g2-confirm-reconcile-20261024
    paths:
      - frontend/.env.example
      - frontend/src/components/CrownBot/CrownBotGuidedActionsG3.tsx
      - frontend/src/components/CrownBot/CrownBotGuidedActionsG3.test.tsx
      - frontend/src/components/CrownBot/CrownBotWorkflowPreview.tsx
      - .github/workflows/cb03-g3-guided-ux.yml

permissions:
  contents: read

concurrency:
  group: cb03-g3-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cb03-g3-synthetic-ui:
    name: G3 frontend TS and user interaction (no clinical runtime)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
      DIGITALCROWN_ISOLATED_RUNTIME: "true"
      CLOUD_AI_ENABLED: "false"
      TELEMETRY_ENABLED: "false"
      VITE_CROWN_BOT_WORKFLOW_PREVIEW_ENABLED: "false"
      VITE_CROWN_BOT_GUIDED_NLU_ENABLED: "false"
      VITE_CROWN_BOT_CB03_G3_ENABLED: "false"
      CROWN_BOT_CB03_PREPARATION_ENABLED: "false"
      CROWN_BOT_CB03_STATUS_PREPARATION_ENABLED: "false"
      CROWN_BOT_CB03_CONFIRMATION_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Exact-source and all flags OFF assertion
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$DIGITALCROWN_ISOLATED_RUNTIME" = true
          test "$CLOUD_AI_ENABLED" = false
          test "$TELEMETRY_ENABLED" = false
          test "$VITE_CROWN_BOT_CB03_G3_ENABLED" = false
          test "$CROWN_BOT_CB03_CONFIRMATION_ENABLED" = false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: TypeScript compile (source only)
        working-directory: frontend
        run: npx tsc --noEmit -p tsconfig.app.json
      - name: G3 + CB02 + CB01 component interaction regression
        working-directory: frontend
        run: |
          npx vitest run             src/components/CrownBot/CrownBotGuidedActionsG3.test.tsx             src/components/CrownBot/CrownBotGuidedNluCb02.test.tsx             src/components/CrownBot/CrownBotWorkflowPreview.test.tsx             src/components/CrownBot/CrownBotChat.g9Interactive.test.tsx
      - name: Evidence classification
        run: |
          echo "G3 TypeScript + synthetic component tests on exact SHA ${{ github.event.pull_request.head.sha }}." >> "$GITHUB_STEP_SUMMARY"
          echo "No real human visual FUE, Windows NVDA/native zoom, clinic/patient, backend flags, merge or deployment." >> "$GITHUB_STEP_SUMMARY"
