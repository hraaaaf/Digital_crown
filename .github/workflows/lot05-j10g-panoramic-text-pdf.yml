name: LOT05 J10G panoramic report PDF — text only

on:
  pull_request:
    branches:
      - exp/lot05-j10f-imagerie-fdi-dev-gated-20261022
    paths:
      - 'backend/templates/panoramic_elite.html'
      - 'backend/services/generators/panoramic_elite_gen.py'
      - 'backend/services/generators/panoramic_gen.py'
      - 'backend/tests/test_panoramic_pdf_text_only_j10g.py'
      - '.github/workflows/lot05-j10g-panoramic-text-pdf.yml'
      - 'docs/research/LOT05_J10G_*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  text-only-pdf:
    name: "True PDF — report narrative retained; zero radiographs/images"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Pin exact PR head SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install rendering and inspection tools only (no clinic backend or data)
        run: |
          python -m pip install 'weasyprint==68.1' 'jinja2==3.1.6' 'pypdf==6.1.3'
          python -m pip check
      - name: Render real PDF from synthetic narrative and inspect EVERY page for embedded images
        run: python -m unittest -v backend/tests/test_panoramic_pdf_text_only_j10g.py
      - name: Confirm the PDF path remains protected
        run: |
          python - <<'PY'
          from pathlib import Path
          src=Path('backend/routers/ia.py').read_text(encoding='utf-8')
          start=src.index('@router.get("/panoramic/{analysis_id}/pdf")')
          tail=src[start:src.index('@router.', start+1)]
          assert 'assert_patient_access' in tail
          assert 'panoramic_elite_generator.generate' in tail
          assert 'FileResponse(' in tail
          print('PASS: panoramic PDF access and preview/download endpoint unchanged')
          PY
