name: DECOMP P0-A Accounting treasury panel

on:
  push:
    branches:
      - agent/decomp-p0-large-files
    paths:
      - '.github/workflows/decomp-p0-accounting-treasury.yml'
      - 'scripts/decomp_accounting_treasury.py'

permissions:
  contents: write

jobs:
  refactor-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/decomp-p0-large-files
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply guarded treasury extraction
        run: python scripts/decomp_accounting_treasury.py

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript exact check
        working-directory: frontend
        run: npx tsc -b --pretty false

      - name: Verify intended diff only
        run: |
          git diff --check
          changed="$(git status --short -uall | awk '{print $2}' | sort)"
          expected="$(printf '%s\n' \
            frontend/src/features/accounting/components/TreasuryPanel.tsx \
            frontend/src/pages/AccountingPage.tsx | sort)"
          test "$changed" = "$expected"

      - name: Commit verified treasury extraction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- frontend/src/pages/AccountingPage.tsx frontend/src/features/accounting/components/TreasuryPanel.tsx
          git commit -m 'refactor(accounting): extract treasury panel'
          git push origin HEAD:agent/decomp-p0-large-files

# trigger after workflow creation
