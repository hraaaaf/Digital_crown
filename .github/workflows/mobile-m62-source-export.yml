name: Mobile M6.2 Source Export

on:
  push:
    branches: [audit/mobile-m6-generator]
    paths: [.github/workflows/mobile-m62-source-export.yml]

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cfb7f72b6ef8d99427e18aad324d3ec882bfe38c
      - name: Verify exact source
        run: test "$(git rev-parse HEAD)" = "cfb7f72b6ef8d99427e18aad324d3ec882bfe38c"
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-m62-source
          path: |
            frontend/src/main.tsx
            frontend/vite.config.ts
            frontend/public/sw.js
            frontend/src/services/zka/MobileStorage.ts
            frontend/src/features/mobile/Dashboard/hooks/useMobileDashboard.ts
            backend/routers/mobile_legacy.py
          if-no-files-found: error
          retention-days: 2
      - name: Publish run marker in audit namespace
        run: |
          git fetch origin audit/mobile-m6-generator
          git checkout -B audit/mobile-m6-generator origin/audit/mobile-m6-generator
          mkdir -p .github/m6
          printf '%s\n' "$GITHUB_RUN_ID" > .github/m6/mobile-m62-source-export-run.txt
          git config user.name "Digital Crown M6 Audit"
          git config user.email "123034021+hraaaaf@users.noreply.github.com"
          git add .github/m6/mobile-m62-source-export-run.txt
          git commit -m "audit(m6): record M6.2 source export run $GITHUB_RUN_ID"
          git push origin HEAD:audit/mobile-m6-generator
