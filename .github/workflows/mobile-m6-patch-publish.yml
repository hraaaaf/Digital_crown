          if (!_refreshing) {
""",
              """    if (status === 401 && !original._retried && !original.url?.includes('/auth/')) {
              original._retried = true;

              if (window.location.pathname.startsWith('/mobile')) {
                const refreshed = await refreshMobileCredentials().catch(() => null);
                if (refreshed) {
