          replace_once(
              "frontend/src/services/zka/MobileStorage.ts",
              "  async clearCredentials(): Promise<void> {\n    await localforage.removeItem(STORE_CREDENTIALS_ID);\n  },",
              "  async clearCredentials(): Promise<void> {\n    await localforage.removeItem(STORE_CREDENTIALS_ID);\n    try {\n      localStorage.removeItem('token');\n      localStorage.removeItem('refresh_token');\n    } catch { /* ignore */ }\n  },",
          )
          replace_once(
              "frontend/src/services/zka/MobileStorage.ts",
              "  async clearAll(): Promise<void> {\n    await localforage.removeItem(STORE_CREDENTIALS_ID);",
              "  async clearAll(): Promise<void> {\n    await this.clearCredentials();",
          )
          replace_once(
              "frontend/src/services/zka/MobileStorage.ts",
              "    return !!(creds?.publicId && creds?.masterKey && creds?.access_token);",
