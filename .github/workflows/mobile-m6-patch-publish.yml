              "            db_session.add(RevokedToken(jti=marker, expires_at=expires_at))\n            invalidated = db_session.query(ZKAPairingToken).filter(",
          )

          replace_once(
              "backend/models_platform.py",
              "# La masterKey ne transite jamais dans une URL. Le QR encode un UUID 5min.",
              "# La masterKey ne transite jamais dans une URL. Le QR encode un secret haute entropie 5 min.",
          )

          replace_once(
              "backend/routers/admin_legacy.py",
