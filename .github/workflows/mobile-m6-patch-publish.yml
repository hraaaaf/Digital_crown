              'frontend/src/services/zka/mobileFetch.ts', 'frontend/src/services/zka/mobileFetch.test.ts',
          }
          changed = set(subprocess.check_output(['git','diff','--name-only','2bf0f639b198b5aacdd1f797f62ea9ac11aa9cff'], text=True).splitlines())
          unexpected = changed - allowed
          missing = {'backend/routers/auth.py','backend/routers/mobile.py','backend/routers/mobile_legacy.py','frontend/src/services/zka/mobileFetch.ts'} - changed
          if unexpected or missing:
