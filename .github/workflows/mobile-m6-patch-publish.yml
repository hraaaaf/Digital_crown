name: Mobile M6.1 Patch Publisher

on:
  push:
    branches: [audit/mobile-m6-generator]
    paths: [.github/workflows/mobile-m6-patch-publish.yml]

permissions:
  actions: read
  contents: write

jobs:
  publish:
    name: Assemble static-check and publish one M6.1 product commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/mobile-m6-generator
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Assemble reviewed candidate from exact master plus frozen product patch
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: 2bf0f639b198b5aacdd1f797f62ea9ac11aa9cff
        run: |
          git worktree add --detach /tmp/m6-product "$BASE_SHA"
          gh api repos/${{ github.repository }}/actions/artifacts/9485239294/zip > /tmp/m6.zip
          rm -rf /tmp/m6-artifact && mkdir -p /tmp/m6-artifact
          unzip -q /tmp/m6.zip -d /tmp/m6-artifact
          test -s /tmp/m6-artifact/product.patch
          cd /tmp/m6-product
          git apply --check /tmp/m6-artifact/product.patch
          git apply /tmp/m6-artifact/product.patch

      - name: Apply small post-review corrections only
        working-directory: /tmp/m6-product
        shell: python
        run: |
          from pathlib import Path
          import textwrap

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, content):
              p = Path(path)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(content, encoding="utf-8")

          def replace_once(path, old, new):
              content = read(path)
              count = content.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected 1 match, got {count}: {old[:120]!r}")
              write(path, content.replace(old, new, 1))

          replace_once(
              "backend/security.py",
