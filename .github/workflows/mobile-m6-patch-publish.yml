name: Mobile M6.1 Patch Publisher

on:
  push:
    branches: [audit/mobile-m6-generator]
    paths: [.github/workflows/mobile-m6-patch-publish.yml]

permissions:
  actions: read
  contents: write

jobs:
  publish:
    name: Verify and publish exactly one M6.1 product commit
    runs-on: ubuntu-latest
    env:
      BASE_SHA: 2bf0f639b198b5aacdd1f797f62ea9ac11aa9cff
      ARTIFACT_ID: "9485239294"
      PRODUCT_BRANCH: mobile/m6-security-first
      PATCH_B64_SHA256: b59f024b159fd0badf7e89dfaddbba1276e9f99be42166455ee0b7e5f58a7a9c
      PATCH_SHA256: e3a7197e2fd645d62832550f851a81da0e13b5f3b7decbc4e1cb4ac216f9d784
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/mobile-m6-generator
          fetch-depth: 0

      - name: Require unchanged master and clean product branch
        run: |
          set -euo pipefail
          git fetch origin master "$PRODUCT_BRANCH"
          test "$(git rev-parse origin/master)" = "$BASE_SHA"
          test "$(git rev-parse origin/$PRODUCT_BRANCH)" = "$BASE_SHA"

      - name: Assemble exact reviewed candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/m61 "$BASE_SHA"
          gh api "repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID/zip" > /tmp/m61.zip
          rm -rf /tmp/m61-artifact && mkdir /tmp/m61-artifact
          unzip -q /tmp/m61.zip -d /tmp/m61-artifact
          test -s /tmp/m61-artifact/product.patch

          cd /tmp/m61
          git apply --check /tmp/m61-artifact/product.patch
          git apply /tmp/m61-artifact/product.patch

          PATCH_B64="$GITHUB_WORKSPACE/.github/m6/m61-post-artifact.patch.gz.b64"
          printf '%s  %s\n' "$PATCH_B64_SHA256" "$PATCH_B64" | sha256sum -c -
          base64 -d "$PATCH_B64" | gzip -d > /tmp/m61-post.patch
          printf '%s  %s\n' "$PATCH_SHA256" /tmp/m61-post.patch | sha256sum -c -
          git apply --check /tmp/m61-post.patch
          git apply /tmp/m61-post.patch

      - name: Static security gate and exact scope
        working-directory: /tmp/m61
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          git diff --check
          python -m py_compile \
            backend/database.py backend/main.py backend/models.py backend/models_platform.py \
            backend/routers/admin_legacy.py backend/routers/mobile.py backend/routers/mobile_legacy.py \
            backend/security.py backend/utils/rate_limit.py \
            backend/tests/test_mobile_credential_hardening.py backend/tests/test_mobile_identity_security.py

          cat > /tmp/expected-m61-paths <<'EOF'
          backend/database.py
          backend/main.py
          backend/models.py
          backend/models_platform.py
          backend/routers/admin_legacy.py
          backend/routers/mobile.py
          backend/routers/mobile_legacy.py
          backend/security.py
          backend/tests/test_mobile_credential_hardening.py
          backend/tests/test_mobile_identity_security.py
          backend/utils/rate_limit.py
          frontend/src/features/mobile/Onboarding/OnboardingScanner.tsx
          frontend/src/services/zka/MobileStorage.ts
          EOF
          sed -i 's/^          //' /tmp/expected-m61-paths
          git diff --name-only | sort > /tmp/actual-m61-paths
          sort -o /tmp/expected-m61-paths /tmp/expected-m61-paths
          diff -u /tmp/expected-m61-paths /tmp/actual-m61-paths

          grep -q 'target_user_id' backend/routers/admin_legacy.py
          grep -q 'secrets.token_urlsafe(24)' backend/routers/admin_legacy.py
          grep -q 'MobilePairedDevice.revoked_at.is_(None)' backend/routers/mobile_legacy.py
          grep -q 'device.revoked_at = datetime.utcnow()' backend/routers/mobile.py
          grep -q 'legacy_pairing_without_user_id_fails_closed' backend/tests/test_mobile_identity_security.py
          grep -q 'snapshot_without_finance_permission_does_not_query_finance' backend/tests/test_mobile_identity_security.py
          grep -q 'creds?.refresh_token && creds?.device_id' frontend/src/services/zka/MobileStorage.ts
          ! git diff --name-only | grep -Eq '(^|/)sw\.js$|vite\.config\.ts$|useMobileDashboard\.ts$|frontend/src/services/api\.ts$'

      - name: Commit once and publish product branch
        working-directory: /tmp/m61
        run: |
          set -euo pipefail
          git config user.name "Digital Crown M6"
          git config user.email "123034021+hraaaaf@users.noreply.github.com"
          git add -- \
            backend/database.py backend/main.py backend/models.py backend/models_platform.py \
            backend/routers/admin_legacy.py backend/routers/mobile.py backend/routers/mobile_legacy.py \
            backend/security.py backend/tests/test_mobile_credential_hardening.py \
            backend/tests/test_mobile_identity_security.py backend/utils/rate_limit.py \
            frontend/src/features/mobile/Onboarding/OnboardingScanner.tsx \
            frontend/src/services/zka/MobileStorage.ts
          test "$(git diff --cached --name-only | wc -l)" -eq 13
          git commit -m "Mobile M6.1 — harden user-scoped pairing and device sessions"
          test "$(git rev-list --count "$BASE_SHA"..HEAD)" -eq 1
          git push --force-with-lease="refs/heads/$PRODUCT_BRANCH:$BASE_SHA" origin "HEAD:refs/heads/$PRODUCT_BRANCH"
