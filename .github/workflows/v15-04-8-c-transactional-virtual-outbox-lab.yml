name: V1.5-04.8 C Transactional Virtual Outbox LAB

on:
  pull_request:
    branches:
      - feat/v15-04-8-e-integrated-software-gate-20261013
    paths:
      - "backend/services/station_print_virtual_outbox_lab_v15.py"
      - "backend/tests/test_station_print_virtual_outbox_lab_v15.py"
      - "backend/tests/certify_station_print_virtual_outbox_pg_v15.py"
      - ".github/workflows/v15-04-8-c-transactional-virtual-outbox-lab.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-sqlite:
    name: Atomic outbox, crashes, no-PHI and one-shot synthetic fence
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    env:
      DC_SYNTHETIC_VIRTUAL_SPOOL_LAB: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Validate exact tested SHA
        env:
          EXPECTED: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned SQLite LAB test libraries
        run: python -m pip install SQLAlchemy==2.0.28 pytest==8.3.3
      - name: Compile and execute actual SQLAlchemy transaction tests
        run: |
          python -m py_compile backend/services/station_print_virtual_outbox_lab_v15.py backend/tests/test_station_print_virtual_outbox_lab_v15.py
          mkdir -p /tmp/dc-04-8-c-one-shot
          cp backend/tests/test_station_print_virtual_outbox_lab_v15.py /tmp/dc-04-8-c-one-shot/test_virtual.py
          python - <<'PY'
          import os,sys,types,pytest
          for name, folder in (("backend","backend"),("backend.services","backend/services")):
              pkg=types.ModuleType(name)
              pkg.__path__=[os.path.abspath(folder)]
              sys.modules[name]=pkg
          raise SystemExit(pytest.main(["-q","/tmp/dc-04-8-c-one-shot/test_virtual.py"]))
          PY

  postgres-two-process:
    name: PostgreSQL 18 two independent reserve workers and two fence workers
    runs-on: ubuntu-24.04
    timeout-minutes: 11
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: virtual_outbox_lab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d virtual_outbox_lab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/virtual_outbox_lab
      DC_SYNTHETIC_VIRTUAL_SPOOL_LAB: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Validate exact tested SHA
        env:
          EXPECTED: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned PostgreSQL LAB test libraries
        run: python -m pip install SQLAlchemy==2.0.28 psycopg2-binary==2.9.10
      - name: Two independent PostgreSQL processes per transaction phase
        run: |
          python -m py_compile backend/tests/certify_station_print_virtual_outbox_pg_v15.py
          python backend/tests/certify_station_print_virtual_outbox_pg_v15.py
