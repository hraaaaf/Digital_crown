name: Media C4 Visual Certification

on:
  pull_request:
    paths:
      - "frontend/src/features/patients/PatientDetailsInner.tsx"
      - "frontend/src/features/patients/components/PatientMediaTimeline.tsx"
      - "frontend/scripts/certify-media-c4-browser.mjs"
      - "backend/routers/media_core.py"
      - "backend/services/clinical_asset_service.py"
      - "backend/services/clinical_asset_storage.py"
      - "backend/tests/test_media_core_timeline_api.py"
      - "scripts/t2_runtime_server.py"
      - "requirements.txt"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - ".github/workflows/media-c4-visual-cert.yml"
  workflow_dispatch:

concurrency:
  group: media-c4-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  certify:
    name: C4 Media Timeline Responsive Matrix
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ENVIRONMENT: test
      SECRET_KEY: media-c4-certification-secret-key-long-enough
      DATABASE_URL: sqlite:///./t2-runtime-cert.db
      DIGITALCROWN_ISOLATED_RUNTIME: "1"
      DIGITALCROWN_ISOLATION_DB_FINGERPRINT: "c04779c8d18b3ac12a0f4093a47a5d0c3c0e2251714be532893cfa052e9ee780"
      TELEMETRY_ENABLED: 'false'
      CLOUD_AI_ENABLED: 'false'
      DEBUG: 'false'
      ALLOWED_ORIGINS: 'http://127.0.0.1:5173,http://localhost:5173'
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Record exact head
        run: |
          HEAD_SHA=$(git rev-parse HEAD)
          EXPECTED_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$HEAD_SHA" = "$EXPECTED_SHA"
          echo "MEDIA_C4_HEAD=$HEAD_SHA" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Generate isolated runtime credential
        shell: bash
        run: |
          echo "T2_USER=t2-browser@cabinet.ma" >> "$GITHUB_ENV"
          echo "T2_PASSWORD=$(python -c 'import secrets; print(secrets.token_urlsafe(32))')" >> "$GITHUB_ENV"

      - name: Source isolation contract
        run: |
          python - <<'PY'
          from pathlib import Path
          details = Path('frontend/src/features/patients/PatientDetailsInner.tsx').read_text(encoding='utf-8')
          media = Path('frontend/src/features/patients/components/PatientMediaTimeline.tsx').read_text(encoding='utf-8')
          router = Path('backend/routers/media_core.py').read_text(encoding='utf-8')
          browser = Path('frontend/scripts/certify-media-c4-browser.mjs').read_text(encoding='utf-8')
          assert 'Médiathèque' in details
          assert 'PatientMediaTimeline' in details
          assert 'Médiathèque clinique' in media
          assert 'storage_key' not in media
          assert 'sha256' not in media
          assert '@router.get("/{patient_id}/assets")' in router
          assert '@router.get("/{patient_id}/assets/{asset_id}/content")' in router
          assert 'process.env.T2_USER' in browser
          assert 'process.env.T2_PASSWORD' in browser
          PY

      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.12.0 torchvision==0.27.0 --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^(torch|torchvision)([<=>].*)?$' requirements.txt > /tmp/requirements-c4.txt
          pip install -r /tmp/requirements-c4.txt
          pip install httpx==0.27.2 pytest

      - name: Targeted Media Core backend tests
        run: |
          pytest -q \
            backend/tests/test_clinical_asset_ingestion.py \
            backend/tests/test_media_core_ingestion_api.py \
            backend/tests/test_media_core_timeline_api.py

      - name: Install frontend and Chromium
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Start isolated backend
        run: |
          rm -f t2-runtime-cert.db
          python scripts/t2_runtime_server.py > /tmp/c4-backend.log 2>&1 &
          for i in {1..90}; do
            if curl -fsS http://127.0.0.1:8005/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/c4-backend.log
          exit 1

      - name: Start frontend
        working-directory: frontend
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 > /tmp/c4-frontend.log 2>&1 &
          for i in {1..90}; do
            if curl -fsS http://127.0.0.1:5173 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/c4-frontend.log
          exit 1

      - name: Execute C4 responsive browser matrix
        working-directory: frontend
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ../artifacts/media-c4
          node scripts/certify-media-c4-browser.mjs 2>&1 | tee ../artifacts/media-c4/runner.log

      - name: Dump runtime logs on failure
        if: failure()
        run: |
          echo '===== BACKEND ====='
          cat /tmp/c4-backend.log || true
          echo '===== FRONTEND ====='
          cat /tmp/c4-frontend.log || true

      - name: Upload C4 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: media-c4-visual-certification
          path: artifacts/media-c4
          if-no-files-found: error
          retention-days: 14
