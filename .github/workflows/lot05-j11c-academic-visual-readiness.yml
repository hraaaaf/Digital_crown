name: LOT05 J11C Academic Visual Readiness Aggregate Only

on:
  push:
    branches:
      - exp/lot05-j10o-public-panoramic-datasets-research-smoke-20261022
    paths:
      - .github/workflows/lot05-j11c-academic-visual-readiness.yml
      - experiments/lot05_j11c_academic_visual_readiness.py
      - experiments/test_lot05_j11c_academic_visual_readiness.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  academic-review-readiness:
    name: Readability and pairing checks, no media export
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pinned academic JPEG decoder
        run: python -m pip install --disable-pip-version-check 'pillow==11.3.0'
      - name: Eight synthetic no-export and fail-closed tests
        run: python experiments/test_lot05_j11c_academic_visual_readiness.py -v
      - name: Sparse checkout pinned academic JPEG plus TXT in disposable runner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p third_party
          git clone --filter=blob:none --depth=1 --no-checkout \
            https://github.com/melihoz/AKUDENTAL.git third_party/AKUDENTAL
          git -C third_party/AKUDENTAL sparse-checkout set --no-cone \
            '/AKUDENTAL/folds/fold_0/labels/' '/AKUDENTAL/images/'
          git -C third_party/AKUDENTAL checkout --detach \
            92e2cc3ae5eebc9de509311a3edefb7106fca7dd
          test "$(git -C third_party/AKUDENTAL rev-parse HEAD)" = \
            92e2cc3ae5eebc9de509311a3edefb7106fca7dd
      - name: Verify source readability of 28 flagged images and 6 pairs
        shell: bash
        run: |
          set -euo pipefail
          python experiments/lot05_j11c_academic_visual_readiness.py \
            --images-dir third_party/AKUDENTAL/AKUDENTAL/images \
            --labels-dir third_party/AKUDENTAL/AKUDENTAL/folds/fold_0/labels
      - name: Destroy all temporary academic JPEGs even on failures
        if: always()
        shell: bash
        run: |
          rm -rf third_party/AKUDENTAL
          echo "J11C_EPHEMERAL_ACADEMIC_JPEGS_REMOVED_NO_ARTIFACTS"
