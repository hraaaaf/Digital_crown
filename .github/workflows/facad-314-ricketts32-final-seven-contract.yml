name: Facad Ricketts 32F final seven contract

on:
  push:
    branches:
      - feat/ortho-studio-lot08-ricketts-protocol-v2
    paths:
      - .github/workflows/facad-314-ricketts32-final-seven-contract.yml
      - docs/audits/schemas/ortho_lot08_ricketts32_facad_final_seven_cluster_resolution_v1.json
      - docs/audits/schemas/ortho_lot08_facad_dc_unmapped_backlog_v1.json
      - scripts/ci_contract_tests/test_cephalo_lot08_ricketts32_facad_final_seven_cluster_contract.py
      - scripts/ci_contract_tests/test_cephalo_lot08_ricketts32_facad_vertical_fh_cluster_contract.py
      - scripts/ci_contract_tests/test_cephalo_lot08_ricketts32_facad_ptv_cranial_cluster_contract.py
      - backend/tests/test_cephalo_lot08_ricketts32_facad_dental_cluster_contract.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pytest
        shell: pwsh
        run: python -m pip install --disable-pip-version-check pytest==9.0.3

      - name: Download and extract official Facad 3.14.1 payload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path facad-r32-final | Out-Null
          $installer = 'facad-r32-final/Facad-Installer-3.14.1.1111.exe'
          Invoke-WebRequest -Uri 'https://downloads.citodent.com/pub/Facad/Facad-Installer-3.14.1.1111.exe' -OutFile $installer
          $seven = "$env:ProgramFiles\7-Zip\7z.exe"
          New-Item -ItemType Directory -Force -Path facad-r32-final/outer | Out-Null
          & $seven x $installer '-ofacad-r32-final/outer' -y | Out-Null
          New-Item -ItemType Directory -Force -Path facad-r32-final/release | Out-Null
          & $seven x 'facad-r32-final/outer/FacadRelease-3.14.1.1111.zip' '-ofacad-r32-final/release' -y | Out-Null

      - name: Verify pinned Ricketts 32F profile bytes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = 'd0b442b39ac7db3dc9c46d807cb3c20bd937c69783b096b484872017f9376518'
          $path = 'facad-r32-final/release/Ceph/Ricketts (32 F).cph'
          $actual = (Get-FileHash -Algorithm SHA256 $path).Hash.ToLowerInvariant()
          Write-Host "Ricketts32.cph sha256=$actual"
          if ($actual -ne $expected) { throw "Ricketts32.cph SHA256 drift: expected $expected got $actual" }

      - name: Verify exact vendor definitions for final seven
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          root = ET.parse(Path(r"facad-r32-final/release/Ceph/Ricketts (32 F).cph")).getroot()

          expected = {
              "Xi-OL": ("DistLine", ["OL", "Xi"], "-3.5±3"),
              "Xi-PM/OL": ("Angle4p", ["OLa", "OLp", "PM", "Xi"], "26±4"),
              "Upper lip len": ("Dist2p", ["ANS", "STs"], "24±2"),
              "STi-OL": ("DistLine", ["OL", "STi"], "-3±2"),
              "Facial cone angle": ("Angle4p", ["Go", "Me", "N", "Pog"], "68±3"),
              "Mand arc": ("Angle4p", ["Xi", "PM", "DC", "Xi"], "30±4"),
              "Mand len": ("Dist2p", ["Xi", "PM'"], "78±2.5"),
          }
          expected_constructions = {
              "OLa": ("Mid-point", ["Is", "Ii"]),
              "OL": ("Line", ["OLp", "OLa"]),
              "PM'": ("Intersect", ["Xi", "PM", "A", "Pog"]),
              "Xi": ("Intersect", ["R23", "R14", "R13", "R24"]),
          }
          expected_markers = {
              "PM": "Protuberance Menti; Suprapogonion",
              "DC": "Centre of condyle",
              "STs": "Stomion superior",
              "STi": "Stomion inferior",
              "Go": "Gonion",
              "Me": "Menton",
              "N": "Nasion",
              "Pog": "Pogonion",
              "OLp": "Occlusal Line, posterior point",
          }

          found = {}
          constructions = {}
          flags = {}
          for e in root.iter("ceph_calc"):
              fields = {}
              for c in list(e):
                  if len(list(c)) == 0:
                      fields.setdefault(c.tag, []).append((c.text or "").strip())
              name = (fields.get("name") or [None])[0]
              if name in expected:
                  found[name] = (
                      (fields.get("calc_type") or [None])[0],
                      fields.get("point_ref", []),
                      (fields.get("norm") or [None])[0],
                  )
                  flags[name] = {
                      "changeSign": (fields.get("changeSign") or [None])[0],
                      "changeRightLeft": (fields.get("changeRightLeft") or [None])[0],
                  }
              if name in expected_constructions:
                  constructions[name] = (
                      (fields.get("calc_type") or [None])[0],
                      fields.get("point_ref", []),
                  )

          markers = {}
          for e in root.iter("marker"):
              fields = {c.tag: (c.text or "").strip() for c in list(e) if len(list(c)) == 0}
              name = fields.get("name")
              if name in expected_markers:
                  markers[name] = fields.get("longname")

          assert found == expected, (found, expected)
          assert constructions == expected_constructions, (constructions, expected_constructions)
          assert markers == expected_markers, (markers, expected_markers)
          assert flags["Xi-OL"] == {"changeSign": "true", "changeRightLeft": "true"}, flags["Xi-OL"]
          assert flags["STi-OL"]["changeRightLeft"] == "true", flags["STi-OL"]
          print("VENDOR_FINAL_SEVEN_ASSERTIONS=PASS", len(found), len(constructions), len(markers))
          '@ | python -

      - name: Run final seven contract tests
        shell: pwsh
        run: |
          python -m pytest scripts/ci_contract_tests/test_cephalo_lot08_ricketts32_facad_final_seven_cluster_contract.py -q
          python -m pytest scripts/ci_contract_tests/test_cephalo_lot08_ricketts32_facad_vertical_fh_cluster_contract.py -q
          python -m pytest scripts/ci_contract_tests/test_cephalo_lot08_ricketts32_facad_ptv_cranial_cluster_contract.py -q
          python backend/tests/test_cephalo_lot08_ricketts32_facad_dental_cluster_contract.py
