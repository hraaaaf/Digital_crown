name: Patient P0 ClinicalHub Apply

on:
  push:
    branches: [agent/patient-page-p0-rescue]
    paths:
      - '.github/workflows/patient-p0-clinicalhub-apply.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-certify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ENVIRONMENT: test
      SECRET_KEY: patient-clinicalhub-apply-secret-000001
      DATABASE_URL: sqlite:///./t2-runtime-cert.db
      TELEMETRY_ENABLED: 'false'
      CLOUD_AI_ENABLED: 'false'
      DEBUG: 'false'
      ALLOWED_ORIGINS: 'http://127.0.0.1:5173,http://localhost:5173'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/patient-page-p0-rescue
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Restore verified fail-closed ClinicalHub candidate
        run: |
          git fetch origin agent/patient-page-p0-truth-safety --depth=1
          git show FETCH_HEAD:frontend/src/features/patients/components/ClinicalHub.tsx > /tmp/ClinicalHub.safe.tsx
          cp /tmp/ClinicalHub.safe.tsx frontend/src/features/patients/components/ClinicalHub.tsx
          git diff --check

      - name: ClinicalHub truth contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('frontend/src/features/patients/components/ClinicalHub.tsx').read_text(encoding='utf-8')
          required=[
            'const [treatmentPlan, setTreatmentPlan] = useState<TreatmentStep[]>([]);',
            'const [planLoading, setPlanLoading] = useState(true);',
            'const [planError, setPlanError] = useState<string | null>(null);',
            'const rawSteps = Array.isArray(res.data?.steps) ? res.data.steps : [];',
            "setPlanError(\"Plan de traitement indisponible. Aucune donnée locale n'est utilisée comme remplacement.\");",
            'const savePlan = async (plan: TreatmentStep[]): Promise<boolean> => {',
            'setTreatmentPlan(mapPersistedPlan(res.data));',
            "toast.error(\"Échec de sauvegarde du plan de traitement.\");",
            'const handleWizardComplete = (wizardId: string, diag: string, _steps: any[], _suggestedNextAssistant?: string | null) => {',
            "toast.success('Proposition clinique générée. Validation du praticien requise.');",
            'Aucune étape de traitement enregistrée.',
            'Espace Clinique',
            'Protocoles structurés',
          ]
          for marker in required: assert marker in s, marker
          banned=[
            'scientificOrder',
            'localStorage.getItem(`master_plan_${patientId}`)',
            'localStorage.setItem(`master_plan_${patientId}`',
            'localStorage.getItem(`diag_${patientId}`)',
            'localStorage.setItem(`diag_${patientId}`',
            'Diagnostic : ${diag}',
            'Simuler Ajout au Plan',
            "localStorage.setItem('pending_devis_plan'",
            'Générer Devis Global',
            "Détartrage & Surfaçage', assistant: 'paro'",
          ]
          for marker in banned: assert marker not in s, marker
          print('ClinicalHub P0 truth contracts OK')
          PY

      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.12.0 torchvision==0.27.0 --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^(torch|torchvision)([<=>].*)?$' requirements.txt > /tmp/requirements-clinicalhub-after.txt
          pip install -r /tmp/requirements-clinicalhub-after.txt
          pip install httpx==0.27.2

      - name: Install frontend and Chromium
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Frontend build
        working-directory: frontend
        run: npm run build

      - name: Start isolated backend
        run: |
          rm -f t2-runtime-cert.db
          python scripts/t2_runtime_server.py > /tmp/clinicalhub-after-backend.log 2>&1 &
          for i in {1..90}; do
            if curl -fsS http://127.0.0.1:8005/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/clinicalhub-after-backend.log
          exit 1

      - name: Start frontend
        working-directory: frontend
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 > /tmp/clinicalhub-after-front.log 2>&1 &
          for i in {1..90}; do
            if curl -fsS http://127.0.0.1:5173 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/clinicalhub-after-front.log
          exit 1

      - name: Capture ClinicalHub AFTER
        working-directory: frontend
        run: |
          mkdir -p ../artifacts/clinicalhub-after
          cat > .clinicalhub-after.mjs <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import { chromium, request } from 'playwright';
          const out=path.resolve('../artifacts/clinicalhub-after');
          const viewports=[{width:390,height:844},{width:430,height:932},{width:768,height:1024},{width:1280,height:900}];
          const api=await request.newContext({baseURL:'http://127.0.0.1:8005'});
          const login=await api.post('/api/auth/login',{form:{username:'t2-browser@cabinet.ma',password:'T2BrowserPass123!'}});
          if(!login.ok()) throw new Error(`login ${login.status()} ${await login.text()}`);
          const tok=await login.json();
          const ps=await api.get('/api/patients',{headers:{Authorization:`Bearer ${tok.access_token}`}});
          if(!ps.ok()) throw new Error(`patients ${ps.status()} ${await ps.text()}`);
          const patient=(await ps.json()).find(p=>p.numero_dossier==='T2-0001');
          if(!patient) throw new Error('T2 patient missing');
          const browser=await chromium.launch({headless:true});
          const evidence=[];
          for(const viewport of viewports){
            const ctx=await browser.newContext({viewport,colorScheme:'light'});
            const page=await ctx.newPage();
            await page.addInitScript(({a,r})=>{localStorage.setItem('token',a);localStorage.setItem('refresh_token',r||'');localStorage.setItem('appMode','prod');},{a:tok.access_token,r:tok.refresh_token});
            const errors=[]; const http5xx=[];
            page.on('pageerror',e=>errors.push(String(e)));
            page.on('response',r=>{if(r.status()>=500)http5xx.push({url:r.url(),status:r.status()});});
            await page.goto(`http://127.0.0.1:5173/patients/${patient.id}?tab=clinical`,{waitUntil:'networkidle',timeout:90000});
            await page.waitForTimeout(900);
            const heading=await page.getByText('Espace Clinique',{exact:true}).count();
            const fakePlan=await page.getByText('Détartrage & Surfaçage',{exact:false}).count();
            const emptyPlan=await page.getByText('Aucune étape de traitement enregistrée.',{exact:true}).count();
            const metrics=await page.evaluate(()=>({scrollWidth:document.documentElement.scrollWidth,clientWidth:document.documentElement.clientWidth,noHorizontalOverflow:document.documentElement.scrollWidth<=document.documentElement.clientWidth+2}));
            const screenshot=`clinicalhub-after-${viewport.width}x${viewport.height}.png`;
            await page.screenshot({path:path.join(out,screenshot),fullPage:false});
            evidence.push({viewport,heading,fakePlan,emptyPlan,metrics,errors,http5xx,screenshot});
            await ctx.close();
          }
          const summary={captures:evidence.length,headingVisibleEverywhere:evidence.every(x=>x.heading===1),fakePlanAbsentEverywhere:evidence.every(x=>x.fakePlan===0),emptyPlanVisibleEverywhere:evidence.every(x=>x.emptyPlan===1),overflowFindings:evidence.filter(x=>!x.metrics.noHorizontalOverflow),runtimeErrors:evidence.filter(x=>x.errors.length),http5xx:evidence.filter(x=>x.http5xx.length)};
          fs.writeFileSync(path.join(out,'evidence.json'),JSON.stringify(evidence,null,2));
          fs.writeFileSync(path.join(out,'summary.json'),JSON.stringify(summary,null,2));
          await browser.close(); await api.dispose();
          if(!summary.headingVisibleEverywhere||!summary.fakePlanAbsentEverywhere||!summary.emptyPlanVisibleEverywhere||summary.runtimeErrors.length||summary.http5xx.length) process.exit(1);
          JS
          node .clinicalhub-after.mjs
          rm .clinicalhub-after.mjs

      - name: Write proof
        env:
          RUN_ID: ${{ github.run_id }}
          PRE_APPLY_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          summary=json.loads(Path('artifacts/clinicalhub-after/summary.json').read_text())
          proof={
            'lot':'Patient P0 ClinicalHub truth',
            'status':'CERTIFIED',
            'baseline':{'run_id':32132516356,'artifact_id':9322786474,'digest':'sha256:53a98e50020ce5bbd467253b908673878f18fed96bdd4d3c87e6d1dba076cc92','captures':4},
            'after':summary,
            'contracts':['backend Master Plan authoritative','empty backend remains empty','assistant output session-only','no automatic diagnosis/plan mutation','save failures remain visible','no scientificOrder','no simulated plan/devis'],
            'workflow_run_id':os.environ['RUN_ID'],
            'pre_apply_sha':os.environ['PRE_APPLY_SHA']
          }
          Path('docs/PATIENT_P0_CLINICALHUB_CERT.json').write_text(json.dumps(proof,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git diff --check

      - uses: actions/upload-artifact@v4
        with:
          name: patient-clinicalhub-after
          path: artifacts/clinicalhub-after
          if-no-files-found: error
          retention-days: 14

      - name: Commit certified ClinicalHub
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/features/patients/components/ClinicalHub.tsx docs/PATIENT_P0_CLINICALHUB_CERT.json
          git diff --cached --check
          git commit -m 'cert(patient): fail-close ClinicalHub truth' || exit 0
          git push origin HEAD:agent/patient-page-p0-rescue
