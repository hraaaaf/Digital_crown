name: LOT05 J10D panoramic GitHub model research (experimental)

on:
  pull_request:
    branches: [master]
    paths:
      - 'experiments/lot05_j10d_panoramic_github_probe.py'
      - 'experiments/lot05_j10d_panoramic_dentex_benchmark.py'
      - '.github/workflows/lot05-j10d-panoramic-github-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research-panoramic-models:
    name: GitHub panoramic candidates ONNX CPU smoke (experimental)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GIT_TERMINAL_PROMPT: '0'
      PYTHONUNBUFFERED: '1'
      YOLO_CONFIG_DIR: /tmp/lot05-yolo-config
      ULTRALYTICS_AUTOINSTALL: 'False'
      WANDB_DISABLED: 'true'
      LOT05_PANORAMIC_REPORT: lot05-panoramic-probe.json
    steps:
      - name: Checkout public script only with no persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Pin research to exact PR HEAD
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU scientific runtime in throwaway runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.10.0 torchvision==0.25.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'ultralytics>=8.3.200,<8.4' onnx==1.19.0 onnxruntime==1.23.2
          python -m pip check
      - name: Run GitHub checkpoint export and ONNX CPU tensor smoke
        run: python experiments/lot05_j10d_panoramic_github_probe.py
      - name: Install public DENTEX evaluation data reader
        run: python -m pip install datasets==3.6.0 pyarrow==21.0.0
      - name: Evaluate DENTEX public radiographs (exploratory; leakage not excluded)
        env:
          LOT05_DENTEX_REPORT: lot05-dentex-exploratory.json
        run: python experiments/lot05_j10d_panoramic_dentex_benchmark.py
      - name: Upload scientific probe results; no model binaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lot05-j10d-panoramic-probe-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            lot05-panoramic-probe.json
            lot05-dentex-exploratory.json
          if-no-files-found: warn
          retention-days: 30
