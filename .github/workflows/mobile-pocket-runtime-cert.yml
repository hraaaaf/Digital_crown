name: Mobile Pocket Real Runtime Cert

on:
  pull_request:
    paths:
      - .github/workflows/mobile-pocket-runtime-cert.yml
      - frontend/src/features/mobile/**
      - frontend/src/services/zka/**
      - frontend/src/services/api.ts
      - frontend/src/App.tsx
      - frontend/src/main.tsx
      - frontend/src/hooks/usePWAInstall.ts
      - frontend/index.html
      - frontend/public/manifest.json
      - frontend/src/test/mobilePocketPwaLifecycle.contract.test.ts
      - frontend/scripts/capture-mobile-pocket-runtime-after.mjs
      - backend/routers/mobile.py
      - backend/tests/test_mobile_pocket_security_boundary.py
      - backend/tests/test_mobile_frontdesk.py
  workflow_dispatch:

concurrency:
  group: mobile-pocket-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-frontdesk:
    name: Pocket Frontdesk paired JWT, tenant and revocation
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SECRET_KEY: ci-only-secret-key-minimum-32-characters-long
      DATABASE_URL: "sqlite:///:memory:"
      ENVIRONMENT: development
      TELEMETRY_ENABLED: "false"
      CLOUD_AI_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact PR head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify mobile backend facade syntax
        run: python -m py_compile backend/routers/mobile.py
      - name: Install isolated backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.12.0 torchvision==0.27.0 --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^(torch|torchvision)([<=>].*)?$' requirements.txt > /tmp/requirements-pocket-frontdesk.txt
          pip install -r /tmp/requirements-pocket-frontdesk.txt
          pip install httpx==0.27.2 pytest pytest-asyncio
      - name: Certify paired Frontdesk boundary and Pocket regression
        run: python -m pytest -q --maxfail=1 backend/tests/test_mobile_frontdesk.py backend/tests/test_mobile_pocket_security_boundary.py backend/tests/test_pocket_common_capabilities.py

  certify:
    name: Real MobileDashboard roles + Pocket V1 routes
    runs-on: ubuntu-latest
    # Pinned browsers + system libraries avoid flaky Ubuntu apt mirrors in CI.
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Record exact candidate
        run: |
          test "$(git -c safe.directory=\"$GITHUB_WORKSPACE\" rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          echo "candidate=${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Verify Pocket contracts
        working-directory: frontend
        run: >-
          npx vitest run
          src/features/mobile/bridge.m5a.test.ts
          src/features/mobile/Dashboard/components/MobileBottomNav.test.tsx
          src/features/mobile/Dashboard/components/PocketTodayOverview.test.tsx
          src/features/mobile/Dashboard/hooks/usePocketReadCapabilities.test.tsx
          src/features/mobile/Dashboard/MobileDashboard.readAccess.test.tsx
          src/features/mobile/Onboarding/OnboardingScanner.g1Interactive.test.tsx
          src/test/mobilePocketPwaLifecycle.contract.test.ts
          src/features/mobile/Security/MobileBiometricGate.test.tsx
          src/services/zka/mobileBiometricLock.test.ts
          src/test/mobileM6IPasskey.test.ts
          src/features/mobile/Dashboard/views/StockView.test.tsx
          src/features/mobile/Dashboard/views/LibraryView.test.tsx
          src/features/mobile/Dashboard/PocketRuntimeScope.contract.test.ts
          src/features/partnerMarketplace/usePartnerMarketplace.test.tsx
          src/test/mobileM62OfflineTruth.test.ts
          src/test/mobileM62Behavior.test.ts
          src/features/mobile/Dashboard/MobileP0UI.test.tsx
          src/features/mobile/Dashboard/hooks/useMobileDashboard.p0.test.tsx
          src/features/mobile/Dashboard/views/PocketAgendaDay.test.tsx
          src/features/mobile/Dashboard/MobileP2Compact.test.tsx
          src/features/mobile/Dashboard/PocketMicroPolishTheme.contract.test.ts
          src/features/mobile/bridge.test.ts
          src/test/mobileM64ContextualBridge.test.ts
          src/features/mobile/Dashboard/components/MobileQuickActionHub.test.tsx
          src/features/mobile/Dashboard/views/FrontdeskView.test.tsx
          src/features/mobile/Dashboard/views/FrontdeskView.g3Interactive.test.tsx
      - name: Verify production frontend build
        working-directory: frontend
        run: npm run build
      - name: Install Chromium evidence runner
        working-directory: frontend
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          node -e "const { chromium, webkit } = require('playwright'); const fs=require('node:fs'); for (const browser of [chromium, webkit]) { if (!fs.existsSync(browser.executablePath())) throw Error('Pinned Playwright browser missing: ' + browser.executablePath()); }"
      - name: Start production-built application runtime
        working-directory: frontend
        run: |
          # Certify the production-built PWA and its shipped Workbox lifecycle,
          # not Vite's development modules/development service worker.
          npm run preview -- --host 127.0.0.1 --port 5173 --strictPort >/tmp/mobile-pocket-runtime-vite.log 2>&1 &
          # POSIX sh in this container: Bash brace expansion does not work here.
          for i in $(seq 1 60); do
            curl -fsS 'http://127.0.0.1:5173/landing' >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/mobile-pocket-runtime-vite.log
          exit 1
      - name: Capture authenticated-production-equivalent Pocket AFTER
        working-directory: frontend
        env:
          MOBILE_RUNTIME_URL: http://127.0.0.1:5173
          MOBILE_RUNTIME_DIR: ../artifacts/mobile-pocket-runtime
        run: node scripts/capture-mobile-pocket-runtime-after.mjs
      - name: Capture Pocket with WebKit (Safari engine)
        working-directory: frontend
        env:
          MOBILE_RUNTIME_URL: http://127.0.0.1:5173
          MOBILE_RUNTIME_DIR: ../artifacts/mobile-pocket-webkit
          MOBILE_RUNTIME_ENGINE: webkit
        run: node scripts/capture-mobile-pocket-runtime-after.mjs
      - name: Verify real-runtime evidence
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          function check(ok, message) { if (!ok) throw new Error(message); }
          function json(file) { return JSON.parse(fs.readFileSync(file, 'utf8')); }
          function png(file, width, height) {
            const data = fs.readFileSync(file);
            const signature = Buffer.from([137,80,78,71,13,10,26,10]);
            check(data.subarray(0, 8).equals(signature), `${file}: not PNG`);
            check(data.readUInt32BE(16) === width && data.readUInt32BE(20) === height, `${file}: invalid dimensions`);
          }
          const viewports = [[390,844],[430,932],[768,1024],[1280,800]];
          const states = ['today','agenda','plus','frontdesk','stock','library','finance','lab','dentists','marketplace','bot','securite'];
          for (const engine of ['mobile-pocket-runtime','mobile-pocket-webkit']) {
            const root = path.join('artifacts', engine);
            for (const role of ['dentiste','secretaire']) {
              for (const [width,height] of viewports) {
                for (const state of states) {
                  png(path.join(root, `runtime-${role}-${state}-${width}x${height}.png`), width, height);
                }
              }
            }
            const evidence = json(path.join(root, 'runtime-evidence.json'));
            check(evidence.length === 8, `expected 8 role/viewport records in ${engine}`);
            check(new Set(evidence.map(r => r.role)).size === 2 && ['DENTISTE','SECRETAIRE'].every(role => evidence.some(r => r.role === role)), 'role coverage incomplete');
            for (const row of evidence) {
              check(row.preview === false, 'preview runtime leaked into canonical evidence');
              check(row.stockRoutable === true && row.libraryRoutable === true, 'Stock/Library real runtime routing failed');
              check(row.readCapabilityHits >= 1, 'Pocket read-capability fixture not consumed');
              check(row.restoredModulesRoutable === true && row.roleGuardsVerified === true, 'Pocket modules/role guards failed');
              check(!row.horizontalOverflow && !row.runtimeErrors, `runtime defect: ${JSON.stringify(row)}`);
            }
            const themes = json(path.join(root, 'theme-evidence.json'));
            const required = ['emerald','rose','prestige','ocean','graphite','dark','high-contrast'];
            check(themes.length === required.length && required.every(id => themes.some(row => row.id === id)), 'Pocket cabinet-selected theme coverage incomplete');
            for (const row of themes) {
              check(!row.horizontalOverflow && !row.preview && row.primaryActionText, `invalid theme evidence: ${JSON.stringify(row)}`);
              for (const state of ['today','plus','stock','securite']) {
                png(path.join(root, `theme-${row.id}-${state}-430x932.png`), 430, 932);
              }
            }
          }
          NODE
          printf 'head=%s\nruntime=MobileDashboard\npreview=false\nroles=DENTISTE,SECRETAIRE\nviewports=390x844,430x932,768x1024,1280x800\nstock=real-runtime-routable\nlibrary=real-runtime-routable-rbac\nrestored_modules=real-runtime-routable\nrole_guards=verified\ntouch_targets=date+plus-close>=44\ndeployment=none\n' '${{ github.event.pull_request.head.sha || github.sha }}' > artifacts/mobile-pocket-runtime/result.txt
          cp /tmp/mobile-pocket-runtime-vite.log artifacts/mobile-pocket-runtime/vite.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-pocket-real-runtime-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            artifacts/mobile-pocket-runtime
            artifacts/mobile-pocket-webkit
          if-no-files-found: warn
          retention-days: 30
