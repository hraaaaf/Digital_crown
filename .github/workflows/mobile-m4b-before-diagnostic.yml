name: Mobile M4-B Panoramic BEFORE Diagnostic

on:
  push:
    branches:
      - audit/mobile-m4b-before-diagnostic-20260824

permissions:
  contents: read

jobs:
  before-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch frozen BEFORE harness source
        run: git fetch origin audit/mobile-m4b-before-20260824

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend and Playwright
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.62.1
          npx playwright install --with-deps chromium

      - name: Extract frozen harness and disable verdict assertions
        run: |
          git show origin/audit/mobile-m4b-before-20260824:.github/workflows/mobile-m4b-before.yml > /tmp/m4b-source.yml
          python - <<'PY'
          from pathlib import Path
          import re, textwrap

          source = Path('/tmp/m4b-source.yml').read_text()

          def extract(marker: str) -> str:
              lines = source.splitlines()
              start = next(i for i, line in enumerate(lines) if marker in line) + 1
              block = []
              for line in lines[start:]:
                  if line.strip() == 'EOF':
                      break
                  block.append(line)
              return textwrap.dedent('\n'.join(block)) + '\n'

          Path('frontend/mobile-m4b-before.html').write_text(extract("cat > mobile-m4b-before.html <<'EOF'"))
          Path('frontend/src/mobile-m4b-before.tsx').write_text(extract("cat > src/mobile-m4b-before.tsx <<'EOF'"))
          script = extract("cat > mobile-m4b-before.mjs <<'EOF'")
          script = re.sub(r'^\s*if \(summary\..*throw new Error\(.*\);\s*$', '', script, flags=re.MULTILINE)
          Path('frontend/mobile-m4b-before.mjs').write_text(script)
          PY

      - name: Capture truth without verdict filtering
        working-directory: frontend
        env:
          PRODUCT_HEAD: c6de4b7a86acc33ecfc2ae09e2b10da452281590
        run: node mobile-m4b-before.mjs

      - name: Upload diagnostic BEFORE artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobile-m4b-panoramic-before-diagnostic
          path: frontend/mobile-m4b-before-artifacts
          if-no-files-found: error
          retention-days: 14
