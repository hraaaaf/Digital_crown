name: FACAD B65 exact-source research gates

on:
  push:
    branches:
      - research/facad-b-source-gates-20261011
    paths:
      - .github/workflows/facad-314-b65-source-matrix.yml
      - docs/audits/facad_trial_20261011/B_65_PROFILE_SOURCE_GATES_20261011.json
      - docs/audits/facad_trial_20261011/B_STEINER_TWEED_SOURCE_ARTIFACT_RECOVERY_20261011.json
      - docs/audits/facad_trial_20261011/B_C01_C02_WAVE3_SOURCE_ADJUDICATION.json
      - docs/audits/facad_trial_20261011/B_WAVE4_OFFICIAL_REFERENCE_OPERATOR_TYPES.json
      - docs/audits/facad_trial_20261011/FACAD_F06_2_CANONICAL_EXCEPTION_REGISTER_20261011.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: research
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 068d30a5437a4bf0fe8a46a96391fa3cd8a6428d
          path: source
          persist-credentials: false
      - name: Assert exact source identities and 65/65 negative clinical gates
        shell: bash
        run: |
          python - <<'PY'
          import csv, io, json, re, subprocess
          from pathlib import Path
          root=Path('source')
          doc=Path('research/docs/audits/facad_trial_20261011/B_65_PROFILE_SOURCE_GATES_20261011.json')
          d=json.loads(doc.read_text(encoding='utf-8'))
          assert d['status']=='RESEARCH_ONLY'
          for pinned in d['source_files']:
              path=pinned['path']
              blob=subprocess.check_output(['git','-C',str(root),'hash-object',path],text=True).strip()
              assert blob==pinned['git_blob_sha'],f'SOURCE_BLOB_DRIFT:{path}'
          def csv_rows(path):
              return list(csv.DictReader(io.StringIO((root/path).read_text(encoding='utf-8-sig'))))
          catalog=csv_rows(d['source_files'][0]['path'])
          ledger=csv_rows(d['source_files'][1]['path'])
          cross=csv_rows(d['source_files'][2]['path'])
          counts={}
          for line in (root/d['source_files'][3]['path']).read_text(encoding='utf-8').splitlines():
              m=re.match(r'^\|\s*(\d+)\s*\|\s*(.+?)\s*\|\s*[^|]+\|\s*(\d)/3\s*\|\s*[^|]+\|$',line)
              if m:counts[int(m[1])]=(m[2],int(m[3]))
          assert [len(catalog),len(ledger),len(cross),len(counts),len(d['items'])]==[65]*5
          classes={}
          complete=0
          for i,item in enumerate(d['items']):
              a,b,c=catalog[i],ledger[i],cross[i]
              ordinal=i+1
              assert all(int(v['ordinal'])==ordinal for v in (a,b,c))
              assert a['analysis_name']==b['analysis_name']==c['facad_analysis_name']==item['analysis']==counts[ordinal][0]
              assert item['ordinal']==ordinal
              assert item['source_run_id']==b['github_run_id']
              assert item['editor_observation']==b['editor_definition_state']
              assert item['mapping_class']==c['mapping_class']
              label='3_OF_3_FILES_PRESENT' if counts[ordinal][1]==3 else '0_OF_3_IN_THIS_REF'
              assert item['git_uia_triplets']==label
              complete+=counts[ordinal][1]==3
              assert item['formula_gate']=='UNKNOWN'
              assert item['numeric_vendor_parity']=='NOT_TESTED'
              assert item['patient_calculation']=='NOT_TESTED'
              assert item['population_norm_gate']=='NOT_ACTIVATED'
              classes[item['mapping_class']]=classes.get(item['mapping_class'],0)+1
          expected={'NO_REPO_MAPPING':56,'EXACT_NAMED_MAPPING_UNVERIFIED':4,
                    'RICKETTS_VENDOR_VARIANT_UNRESOLVED':4,'NAME_ONLY_PROVISIONAL_PACK':1}
          assert classes==expected
          assert complete==42 and 65-complete==23
          assert d['verification']['mapping_classes']==expected
          print('B65_SOURCE_MATRIX_PASS=65_NAME_AND_ORDINAL_JOINED')
          print('B65_UIA_GIT_TRIPLETS=42_PRESENT_23_NOT_VERSIONED_HERE')
          print('B65_FORMULA_PARITY_VALIDATED=false')
          PY
      - name: Cross-check Steiner/Tweed recovered UIA artifact provenance (not certified formulas)
        shell: bash
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          root=Path('research/docs/audits/facad_trial_20261011')
          entries=json.loads((root/'B_65_PROFILE_SOURCE_GATES_20261011.json').read_text())
          recovery=json.loads((root/'B_STEINER_TWEED_SOURCE_ARTIFACT_RECOVERY_20261011.json').read_text())
          assert len(recovery['items'])==2
          assert [x['analysis'] for x in recovery['items']]==['Steiner','Tweed']
          assert len(entries['items'])==65
          for item in recovery['items']:
              p=next(x for x in entries['items'] if x['analysis']==item['analysis'])
              assert p['source_run_id']==str(item['source_run_id'])
              assert p['git_uia_triplets']=='0_OF_3_IN_THIS_REF'
              assert item['strict_csv_triplets_versioned'] is False
              assert item['clinical_parity_tested'] is False
              assert item['page_c02_definition_verified'] is False
              assert re.fullmatch(r'[0-9a-f]{64}',item['zip_sha256'])
              assert set(item['three_text_views'])=={'measurements','lines','markers'}
              for tab,record in item['three_text_views'].items():
                  assert record['zip_member']==f"d1c-{item['analysis']}-{tab}-texts.txt"
                  assert re.fullmatch(r'[0-9a-f]{64}',record['sha256'])
                  assert record['bytes']>0 and record['uia_text_lines']>0
          ml={x['analysis']:x['observed_arguments'] for x in recovery['scientific_hazards']}
          assert ml=={'Steiner':['Go','Gn'],'Tweed':['Go','Me']}
          print('B65_RECOVERY_SOURCE_REFERENCES_PASS=2_PROFILES_6_TEXT_VIEWS')
          print('B65_STRICT_UIA_CSV_TRIPLETS_PRESENT=42_UNCHANGED')
          print('B65_VENDOR_FORMULAS_VERIFIED=false')
          PY

      - name: Defend ten C01-C02 operator source claims from false page formula promotion
        shell: bash
        run: |
          python - <<'PY'
          import json, subprocess, re
          from pathlib import Path
          root=Path('research/docs/audits/facad_trial_20261011')
          o=json.loads((root/'B_10_OPERATOR_EVIDENCE_GATES.json').read_text())
          x=json.loads((root/'B_C01_C02_WAVE3_SOURCE_ADJUDICATION.json').read_text())
          report='docs/audits/FACAD_314_C02_LEXICAL_LANDMARK_INDEX_ADJUDICATION_2026-10-11.md'
          blob=subprocess.check_output(['git','-C','source','hash-object',report],text=True).strip()
          assert blob=='55b40f91d8b7090e82b58959ebea3da1cdfe2d8a'
          doc=(Path('source')/report).read_text(encoding='utf-8')
          assert '34 pages' in doc and '24' in doc
          assert x['sources']['c02_pdf_sha256']=='4dbd3fa8419b684529fcbc17f615f49f7486cdf037fcfff025b1b307c0c0a548'
          assert x['sources']['c02_minimal_index_sha256']=='011f9330320c46ce2b776506710080bc42826c4155e54a9e9600ee5ed5158a4'
          assert x['sources']['c02_cooccurrence_sha256']=='a6903d480aa21c97b8bce40d5f13b1a3666e9b102fa4432cb4d8127fb84edf28'
          assert x['sources']['c02_artifact_zip_sha256']=='d121d062920dea17cecb5ff43c778a93681283530b21a582f044b9f9186d0bd3'
          assert x['sources']['operator_registry_blob']=='e6bd251f24cb2c347af8b2f1f30299090ca1e37f'
          assert x['c02_verified_lexical_index']['pages_with_target_lines']==[5,10,19,20,22,24,30]
          assert x['c02_verified_lexical_index']['label_matched_lines_total']==24
          assert x['c02_verified_lexical_index']['formula_definition_verified'] is False
          assert x['c02_verified_lexical_index']['visual_page_definition_reviewed'] is False
          actual=x['operators']; source=o['operators']
          assert len(actual)==len(source)==10
          assert [v['operator'] for v in actual]==[q['operator'] for q in source]
          for row,original in zip(actual,source):
              assert row['observed_count_in_5_profiles']==original['ui_editor_occurrences_5_profiles']
              assert row['operator_definition_state']=='UNKNOWN'
              assert row['orientation_sign_and_units']=='UNKNOWN'
              assert row['geometry_identity_verified'] is False
              assert row['numeric_parity_tested'] is False
              assert row['clinical_gate']=='OPEN'
              link=row['lexical_c02_link']
              if link:
                  assert link['scope']=='LABEL_ONLY_NOT_OPERATOR_DEFINITION'
                  assert set(link['pages']).issubset({5,10,19,20,22,24,30})
          assert x['c01_provenance']['actual_formula_page_certification'] is False
          assert x['scope']=='RESEARCH_ONLY_METADATA_WITHOUT_PROPRIETARY_PDF_TEXT'
          print('B_WAVE3_C01_C02_10_OPERATORS_SOURCE_GATES_PASS=true')
          print('B_WAVE3_C02_SEVEN_PAGES_24_LABEL_LINES_FORMULAS_UNKNOWN=true')
          print('B_WAVE3_C01_C02_NUMERIC_PARITY_VALIDATED=false')
          PY

      - name: Require source-gated nine generic type definitions without promoting C01/C02 formulas
        shell: bash
        run: |
          python - <<'PY'
          import copy,json
          from pathlib import Path
          base=Path('research/docs/audits/facad_trial_20261011')
          x=json.loads((base/'B_WAVE4_OFFICIAL_REFERENCE_OPERATOR_TYPES.json').read_text())
          old=json.loads((base/'B_C01_C02_WAVE3_SOURCE_ADJUDICATION.json').read_text())
          assert x['schema']=='FACAD_B_WAVE4_OFFICIAL_314_OPERATOR_TYPE_REFERENCES_V1'
          assert x['source']['url']=='https://www.facad.com/dox/dox314/FacadRefMan.pdf'
          assert x['source']['direct_pdf_bytes_acquired'] is False
          assert x['source']['direct_visual_page_review'] is False
          assert x['source']['not_equivalent_to_c01_c02_measurement_library'] is True
          assert x['type_definitions_from_official_reference']==9
          assert x['structural_editor_heading']==1
          rows=x['records']
          assert len(rows)==10 and len({r['operator'] for r in rows})==10
          assert {r['operator'] for r in rows}=={r['operator'] for r in old['operators']}
          for r in rows:
              assert r['c01_c02_specific_definition']=='NOT_CERTIFIED'
              assert r['measured_FACAD_DigitalCrown_numeric_parity']=='NOT_TESTED'
              assert r['clinical_use_allowed'] is False
              if r['operator']=='Heading':
                  assert r['facad_314_reference_manual_print_page'] is None
                  assert r['evidence_level']=='UIA_EDITOR_STRUCTURAL_ONLY'
              else:
                  assert r['facad_314_reference_manual_print_page'] in (86,87)
                  assert r['evidence_level']=='OFFICIAL_INDEXED_PDF_EXCERPT_NOT_PAGE_RENDERED'
                  assert r['generic_arguments'] and r['known_unresolved']
          def fail_closed(doc):
              return (doc['science_gate']=='OPEN_VENDOR_FORMULA_AND_SAME_TRACE_PARITY'
                      and all(not r['clinical_use_allowed']
                              and r['c01_c02_specific_definition']=='NOT_CERTIFIED'
                              and r['measured_FACAD_DigitalCrown_numeric_parity']=='NOT_TESTED'
                              for r in doc['records']))
          assert fail_closed(x)
          for index in range(10):
              bogus=copy.deepcopy(x)
              bogus['records'][index]['clinical_use_allowed']=True
              assert not fail_closed(bogus),f'UNSAFE_SCIENCE_PROMOTION:{index}'
          print('B_WAVE4_OFFICIAL_GENERIC_OPERATOR_TYPES=9_OF_10')
          print('B_WAVE4_NEGATIVE_CLINICAL_PROMOTIONS_REJECTED=10')
          print('B_WAVE4_C01_C02_FORMULAS_CERTIFIED=false')
          print('B_WAVE4_VENDOR_NUMERIC_PARITY_TESTED=false')
          PY

      - name: Enforce F06.2 exceptions register traceability and ten negative mutations
        shell: bash
        run: |
          python - <<'PY'
          import copy,json,subprocess
          from pathlib import Path
          base=Path('research/docs/audits/facad_trial_20261011')
          reg=json.loads((base/'FACAD_F06_2_CANONICAL_EXCEPTION_REGISTER_20261011.json').read_text(encoding='utf-8'))
          src=json.loads((base/'B_65_PROFILE_SOURCE_GATES_20261011.json').read_text(encoding='utf-8'))
          science=json.loads((base/'B_C01_C02_WAVE3_SOURCE_ADJUDICATION.json').read_text(encoding='utf-8'))
          assert reg['schema']=='FACAD_F06_2_CANONICAL_EXCEPTIONS_AND_GAPS_V1'
          assert reg['notion']['page_id']=='3ec77c66-3362-811d-b11e-c59dbd9eb7d3'
          assert reg['notion']['snapshot_before']=={'total':39,'already_checked':19,'open':20}
          assert reg['notion']['candidate_to_close']=='F06.2'
          gates=reg['canonical_facad_gates_before']
          assert len(gates)==39 and len({g['id'] for g in gates})==39
          assert sum(g['canonical_state']=='ALREADY_CHECKED' for g in gates)==19
          assert sum(g['canonical_state']=='OPEN' for g in gates)==20
          assert next(g for g in gates if g['id']=='F06.2')['canonical_state']=='OPEN'
          assert all(g['source']=='NOTION_FACAD_PRIMARY_CHECKBOX' for g in gates)
          assert 'Registre' in next(g for g in gates if g['id']=='F06.2')['title']
          p=reg['git_source_profile_exceptions']
          expected=[x for x in src['items'] if x['git_uia_triplets']=='0_OF_3_IN_THIS_REF']
          assert len(p)==23 and len(expected)==23
          assert src['verification']['git_uiatriplets_complete']==42
          assert [(x['ordinal'],x['analysis_name'],str(x['source_run_id'])) for x in p]==[
             (x['ordinal'],x['analysis'],str(x['source_run_id'])) for x in expected]
          assert all(x['does_not_mean_vendor_analysis_absent'] is True for x in p)
          assert reg['evidence_sources']['b65_blob_sha']=='54cf83e2f76fb08b8d887ac73f138bfd003ec189'
          assert reg['evidence_sources']['science_c01_c02_blob_sha']=='d766e19a39f29f12d06740fd570035412bae863e'
          assert reg['evidence_sources']['d3_blob_sha']=='72f5e1a97a42ec95b8f547b73f194829f74b07af'
          assert reg['evidence_sources']['fac05_synthetic_tests_ran']==56
          assert reg['evidence_sources']['fac05_vendor_same_case_numeric_parity']=='NOT_TESTED'
          assert reg['evidence_sources']['git_triplets_not_versioned_here']==23
          assert len(reg['case_specific_exceptions'])>=10
          assert len({e['id'] for e in reg['case_specific_exceptions']})==len(reg['case_specific_exceptions'])
          assert any(e['id']=='RUN_STEINER_PARTIAL' for e in reg['case_specific_exceptions'])
          assert any(e['id']=='RUN_HARVOLD_EMPTY_LINES' for e in reg['case_specific_exceptions'])
          assert any(e['id']=='D3_VENDOR_PERMISSION_NOT_PRODUCED' for e in reg['case_specific_exceptions'])
          assert len(reg['d3_open_blockers'])==6
          assert {q['blocker_id'] for q in reg['d3_open_blockers']}=={
                 'SEC-01','SEC-02','SEC-03','SCI-01','SCI-02','SCI-03'}
          assert all(x['proof_status']=='NOT_OBSERVED' and x['controls_passed'] is False and
                     x['independent_reviewer_id'] is None for x in reg['d3_open_blockers'])
          assert len(reg['d3_cross_cutting_fail_closed'])==5
          assert all(x['ready'] is False for x in reg['d3_cross_cutting_fail_closed'])
          assert len(reg['operator_unknowns'])==len(science['operators'])==10
          for a,b in zip(reg['operator_unknowns'],science['operators']):
              assert a['operator']==b['operator']
              assert a['formula_state']=='UNKNOWN'
              assert a['numeric_vendor_parity']=='NOT_TESTED'
          c=reg['closure_policy']
          assert c=={
              'candidate_gate':'F06.2',
              'would_close_only':'Documentation of already-known exceptions and missing evidence; does not repair them',
              'other_open_gates_not_reclassified':True,
              'no_proprietary_formula_certified':True,
              'no_patient_data_or_nonclinical_vendor_installer_launched':True,
              'facad_clinical_gate':'OPEN',
              'd3_gate':'D3_OPEN_RED',
              'facad_same_trace_vendor_numeric_parity':'NOT_TESTED',
              'two_human_independent_reviewers_observed':0,
              'converged':False,
              'no_merge_or_deploy':True
          }
          def valid(x):
              gates=x['canonical_facad_gates_before']
              return (
                sum(g['canonical_state']=='ALREADY_CHECKED' for g in gates)==19 and
                next(g for g in gates if g['id']=='F06.2')['canonical_state']=='OPEN' and
                len(x['git_source_profile_exceptions'])==23 and
                len(x['d3_open_blockers'])==6 and
                all(b['proof_status']=='NOT_OBSERVED' for b in x['d3_open_blockers']) and
                x['closure_policy']['d3_gate']=='D3_OPEN_RED' and
                x['closure_policy']['facad_same_trace_vendor_numeric_parity']=='NOT_TESTED' and
                x['closure_policy']['other_open_gates_not_reclassified'] is True and
                x['closure_policy']['no_proprietary_formula_certified'] is True and
                x['closure_policy']['two_human_independent_reviewers_observed']==0 and
                not x['closure_policy']['converged'])
          assert valid(reg)
          mutations=[]
          for field,value in [
              ('d3_gate','CLOSED'),('facad_same_trace_vendor_numeric_parity','VERIFIED'),
              ('converged',True),('other_open_gates_not_reclassified',False)]:
              z=copy.deepcopy(reg);z['closure_policy'][field]=value
              mutations.append(z)
          for idx in range(6):
              z=copy.deepcopy(reg);z['d3_open_blockers'][idx]['proof_status']='VERIFIED'
              mutations.append(z)
          z=copy.deepcopy(reg)
          next(g for g in z['canonical_facad_gates_before'] if g['id']=='F06.2')['canonical_state']='ALREADY_CHECKED'
          mutations.append(z)
          z=copy.deepcopy(reg);z['git_source_profile_exceptions'].pop()
          mutations.append(z)
          assert len(mutations)==12
          assert all(not valid(z) for z in mutations)
          print('F06_2_REGISTRY_GATES=39_CANONICAL_19_CLOSED_20_OPEN')
          print('F06_2_GIT_MISSING_UIA_TRIPLETS=23_OF_65')
          print('F06_2_D3_OPEN_BLOCKERS=6_AND_CASE_EXCEPTIONS='+str(len(reg['case_specific_exceptions'])))
          print('F06_2_MUTATIONS_REJECTED=12')
          print('F06_2_REGISTER_DOCUMENTED_ONLY_NO_CLINICAL_CERTIFICATION=true')
          PY
