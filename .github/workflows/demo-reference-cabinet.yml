name: DEMO Reference Cabinet Safety (isolated)
on:
  push:
    branches:
      - feat/synthetic-demo-cabinet-fixture-20261018
    paths:
      - scripts/seed_demo_cabinet_reference.py
      - .github/workflows/demo-reference-cabinet.yml
      - docs/clinic/DEMO_REFERENCE_CABINET.md
      - techdoubt.md
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guard-and-pdf:
    name: Fail-closed guards and fictional PDF smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install reportlab pypdf
      - name: Exact HEAD and syntax
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python -m py_compile scripts/seed_demo_cabinet_reference.py
      - name: Fail closed before database import, PDF watermark, fixture shape
        env:
          ENVIRONMENT: production
          DIGITALCROWN_ISOLATED_RUNTIME: "0"
          DATABASE_URL: "sqlite:////tmp/real-cabinet.db"
        run: |
          python - <<'PY'
          import os, sys
          from pypdf import PdfReader
          from scripts import seed_demo_cabinet_reference as m
          assert len(m.PATIENTS) == 12
          assert len(m.DOCS) == 3
          assert "backend.database" not in sys.modules
          for environment, isolated, url in [
              ("production", "0", "sqlite:////tmp/real-cabinet.db"),
              ("test", "0", "sqlite:////tmp/demo-fixture.db"),
              ("test", "1", "sqlite:////tmp/real-cabinet.db"),
          ]:
              os.environ.update(ENVIRONMENT=environment, DIGITALCROWN_ISOLATED_RUNTIME=isolated, DATABASE_URL=url)
              try:
                  m.main()
              except RuntimeError as exc:
                  assert "DEMO_REFUSED" in str(exc), str(exc)
              else:
                  raise AssertionError("unsafe environment accepted")
              assert "backend.database" not in sys.modules
          pdf=m._pdf("Ordonnance DEMO","Patient Fictif","DEMO-0001")
          from io import BytesIO
          reader=PdfReader(BytesIO(pdf))
          text=reader.pages[0].extract_text()
          assert m.MARKER in text
          assert "Patient Fictif" in text
          assert "DEMO-0001" in text
          print("DEMO_GUARDS_AND_PDF_SMOKE_PASS")
          PY

  integration-seed:
    name: Isolated SQLCipher seed and archive integrity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ENVIRONMENT: test
      DIGITALCROWN_ISOLATED_RUNTIME: "1"
      DATABASE_URL: sqlite:////tmp/digital-crown-demo-reference.db
      DIGITALCROWN_DEMO_ROOT: /tmp/digital-crown-demo-reference-media
      DIGITALCROWN_DEMO_PASSWORD: "CI-Only-Synthetic-Fixture-Secret-Not-For-Deployment-2026"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated integration dependencies
        run: python -m pip install SQLAlchemy==2.0.28 sqlcipher3==0.6.2 passlib==1.7.4 bcrypt==3.2.2 reportlab==4.4.10 pydantic==2.6.3 pydantic-settings==2.2.1 python-jose==3.5.0 python-dotenv==1.2.1 alembic==1.20.0
      - name: Create disposable migrated schema and seed
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from backend import models, database
          from backend.models_base import Base
          Base.metadata.create_all(bind=database.engine)
          Path('/tmp/digital-crown-demo-reference.db').touch(exist_ok=True)
          PY
          python -m scripts.seed_demo_cabinet_reference
          python -m scripts.seed_demo_cabinet_reference
      - name: Verify rows, files and hashes
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          from backend import models
          from backend.database import SessionLocal
          with SessionLocal() as db:
              assert db.query(models.User).count() == 1
              assert db.query(models.Patient).count() == 12
              assert db.query(models.Appointment).count() == 36
              assert db.query(models.DocumentArchive).count() == 36
              for doc in db.query(models.DocumentArchive):
                  path=Path('/tmp/digital-crown-demo-reference-media') / doc.file_path
                  assert path.is_file(), path
                  data=path.read_bytes()
                  assert len(data) == doc.file_size
                  assert hashlib.sha256(data).hexdigest() == doc.file_hash
          print('DEMO_REFERENCE_INTEGRATION_12_36_36_PASS')
          PY
