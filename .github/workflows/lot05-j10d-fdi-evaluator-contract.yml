name: LOT05 J10D FDI local evaluator synthetic tests (experimental)

on:
  pull_request:
    branches: [master, exp/lot05-j10d-panoramic-github-model-probe-20261021]
    paths:
      - 'experiments/lot05_j10d_fdi_local_benchmark.py'
      - 'experiments/test_lot05_j10d_fdi_local_benchmark.py'
      - '.github/workflows/lot05-j10d-fdi-evaluator-contract.yml'
      - 'experiments/lot05_j10e_fdi_*'
      - 'docs/research/LOT05_J10E_*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluator-contract:
    name: Synthetic-only FDI evaluation correctness, privacy and failure paths
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: experiments
      PYTHONUNBUFFERED: '1'
      GIT_TERMINAL_PROMPT: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact PR head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run adversarial unit and CLI smoke tests with synthetic annotations only
        run: python -m unittest -v experiments/test_lot05_j10d_fdi_local_benchmark.py
      - name: Confirm no patient data or model artifacts in job
        run: |
          test ! -e lot05-fdi-raw-images
          test ! -e best.pt

  # LOT05/J10E experimental stacked PR; do not activate any patient service.
  fdi-interactive-contract:
    name: Clinician FDI correction/confirmation state (offline synthetic only)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Exact HEAD
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run local FDI editor logic (no image or network)
        run: node --test experiments/test_lot05_j10e_fdi_review_state.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run ONNX bridge and parity pure synthetic tests
        env:
          PYTHONPATH: experiments
        run: python -m unittest -v experiments/test_lot05_j10e_fdi_onnx_bridge.py
      - name: Verify standalone prototype includes no remote scripts or model/data assets
        shell: bash
        run: |
          set -euo pipefail
          test ! -e experiments/lot05_j10e_fdi_model.onnx
          test ! -e experiments/best.pt
          python - <<'PY'
          from pathlib import Path
          raw = Path('experiments/lot05_j10e_fdi_review_demo.html').read_text(encoding='utf8')
          assert 'lot05_j10e_fdi_review_state.mjs' in raw
          assert '<script src="https://' not in raw
          assert 'RESEARCH_ONLY_NOT_SAVED_TO_PATIENT' in Path('experiments/lot05_j10e_fdi_review_state.mjs').read_text()
          assert 'fetch(' not in raw
          PY

  fdi-real-public-onnx-parity:
    name: Public research film: pinned FDI PT vs exported ONNX CPU parity
    runs-on: ubuntu-24.04
    needs: fdi-interactive-contract
    timeout-minutes: 50
    env:
      GIT_TERMINAL_PROMPT: '0'
      ULTRALYTICS_AUTOINSTALL: 'False'
      YOLO_CONFIG_DIR: /tmp/j10e-fdi-onnx-yolo
      WANDB_DISABLED: 'true'
      HF_HUB_DISABLE_TELEMETRY: '1'
      PYTHONPATH: experiments
      PYTHONUNBUFFERED: '1'
      PUBLIC_SOURCE: /tmp/dc-lot05-j10e-published-akudental
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact PR HEAD
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU export/inference tooling
        run: |
          python -m pip install torch==2.10.0 torchvision==0.25.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'ultralytics>=8.3.200,<8.4' 'huggingface_hub>=0.34,<2' onnx==1.21.0 onnxruntime==1.25.0
          python -m pip check
      - name: Retrieve only author-public noncommercial-research panoramics in disposable runner
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --depth=1 --filter=blob:none --sparse https://github.com/melihoz/AKUDENTAL.git "$PUBLIC_SOURCE"
          git -C "$PUBLIC_SOURCE" sparse-checkout set --no-cone '/AKUDENTAL/images/' '/AKUDENTAL/akudental_instances.json' >/dev/null
          test "$(git -C "$PUBLIC_SOURCE" rev-parse HEAD)" = "92e2cc3ae5eebc9de509311a3edefb7106fca7dd"
          test -d "$PUBLIC_SOURCE/AKUDENTAL/images"
          test -f "$PUBLIC_SOURCE/AKUDENTAL/akudental_instances.json"
      - name: Verify FDI PT vs ONNX predictions on 2 real public OPGs
        shell: bash
        run: |
          set -euo pipefail
          python experiments/lot05_j10e_fdi_onnx_parity_ci.py --publisher-repo "$PUBLIC_SOURCE" --count 2 --report lot05-j10e-onnx-parity-aggregate.json
      - name: Keep aggregate results only — never images/weights/individual boxes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lot05-j10e-fdi-onnx-parity-${{ github.event.pull_request.head.sha || github.sha }}
          path: lot05-j10e-onnx-parity-aggregate.json
          if-no-files-found: ignore
          retention-days: 7
