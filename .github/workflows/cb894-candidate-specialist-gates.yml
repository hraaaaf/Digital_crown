name: CB-894 exact reconciled candidate PG SQLCipher (ISOLATED)

on:
  pull_request:
    branches: [master]
    paths:
      - .github/workflows/cb894-candidate-specialist-gates.yml

permissions:
  contents: read

env:
  CB894_MASTER_SHA: b6eafd2cec5516a64c5d8013ffd3b3f54430000f
  CB894_CANDIDATE_SHA: 9c30c1391190a570ed1ef6c3f030be10634a0bef
  CB894_DIAG_SHA: a97ac5fc64cc88b0d7851a6cd623faff09f7bd53
  CB894_SOURCE_SHA: 9cf19e68026fa92d31fb704f5b81b9cd667e5254

concurrency:
  group: cb894-candidate-clinical-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend-preview:
    name: Crown Bot guarded UI preview unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify exact reconciled merge candidate from sandbox
        shell: bash
        env:
          EXPECTED_PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = pull_request
          test "$GITHUB_REPOSITORY" = hraaaaf/Digital_crown
          test "$GITHUB_HEAD_REF" = integration/cb894-master-reconcile-diagnostic-20261021
          test "$GITHUB_BASE_REF" = master
          test "$(git rev-parse HEAD)" = "$EXPECTED_PR_HEAD"
          test "$(git ls-remote origin refs/heads/master | cut -f1)" = "$CB894_MASTER_SHA"
          git fetch --no-tags origin integration/cb894-master-reconciled-candidate-20261021
          test "$(git rev-parse FETCH_HEAD)" = "$CB894_CANDIDATE_SHA"
          git checkout --detach "$CB894_CANDIDATE_SHA"
          test "$(git rev-parse HEAD^1)" = "$CB894_DIAG_SHA"
          test "$(git rev-parse HEAD^2)" = "$CB894_SOURCE_SHA"
          test "$(git merge-base HEAD "$CB894_MASTER_SHA")" = "$CB894_MASTER_SHA"
          test -z "$(git status --porcelain)"
          echo "CB894_CANDIDATE_SOURCE_SHA=$CB894_CANDIDATE_SHA" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Test flag OFF, guarded preview and non-executable actions
        working-directory: frontend
        run: npx vitest run src/components/CrownBot/CrownBotChat.g9Interactive.test.tsx src/components/CrownBot/CrownBotWorkflowPreview.test.tsx

  pure:
    name: Pure FSM (synthetic no-deps)
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify exact reconciled merge candidate from sandbox
        shell: bash
        env:
          EXPECTED_PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = pull_request
          test "$GITHUB_REPOSITORY" = hraaaaf/Digital_crown
          test "$GITHUB_HEAD_REF" = integration/cb894-master-reconcile-diagnostic-20261021
          test "$GITHUB_BASE_REF" = master
          test "$(git rev-parse HEAD)" = "$EXPECTED_PR_HEAD"
          test "$(git ls-remote origin refs/heads/master | cut -f1)" = "$CB894_MASTER_SHA"
          git fetch --no-tags origin integration/cb894-master-reconciled-candidate-20261021
          test "$(git rev-parse FETCH_HEAD)" = "$CB894_CANDIDATE_SHA"
          git checkout --detach "$CB894_CANDIDATE_SHA"
          test "$(git rev-parse HEAD^1)" = "$CB894_DIAG_SHA"
          test "$(git rev-parse HEAD^2)" = "$CB894_SOURCE_SHA"
          test "$(git merge-base HEAD "$CB894_MASTER_SHA")" = "$CB894_MASTER_SHA"
          test -z "$(git status --porcelain)"
          echo "CB894_CANDIDATE_SOURCE_SHA=$CB894_CANDIDATE_SHA" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile changed code
        run: |
          python -m compileall -q backend/services/bot/workflow_poc.py backend/services/bot/atomic_action_claim.py backend/services/bot/action_dispatcher.py backend/services/agenda_transaction_lock.py backend/routers/appointments.py backend/routers/frontdesk.py backend/routers/mobile_legacy.py backend/services/patient_companion_agenda.py backend/routers/bot_workflows.py backend/routers/bot_reconciliation.py backend/routers/bot.py backend/config.py
      - name: Run pure FSM tests
        run: python -m unittest discover -s backend/tests -p 'test_crown_bot_zero_llm_poc.py' -v

  pg-atomic-cas:
    name: PostgreSQL real concurrency (two independent sessions)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: claims
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d claims"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CROWN_BOT_CAS_TEST_DB_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/claims
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify exact reconciled merge candidate from sandbox
        shell: bash
        env:
          EXPECTED_PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = pull_request
          test "$GITHUB_REPOSITORY" = hraaaaf/Digital_crown
          test "$GITHUB_HEAD_REF" = integration/cb894-master-reconcile-diagnostic-20261021
          test "$GITHUB_BASE_REF" = master
          test "$(git rev-parse HEAD)" = "$EXPECTED_PR_HEAD"
          test "$(git ls-remote origin refs/heads/master | cut -f1)" = "$CB894_MASTER_SHA"
          git fetch --no-tags origin integration/cb894-master-reconciled-candidate-20261021
          test "$(git rev-parse FETCH_HEAD)" = "$CB894_CANDIDATE_SHA"
          git checkout --detach "$CB894_CANDIDATE_SHA"
          test "$(git rev-parse HEAD^1)" = "$CB894_DIAG_SHA"
          test "$(git rev-parse HEAD^2)" = "$CB894_SOURCE_SHA"
          test "$(git merge-base HEAD "$CB894_MASTER_SHA")" = "$CB894_MASTER_SHA"
          test -z "$(git status --porcelain)"
          echo "CB894_CANDIDATE_SOURCE_SHA=$CB894_CANDIDATE_SHA" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Minimal real PostgreSQL dependencies
        run: python -m pip install 'sqlalchemy>=2.0,<3' psycopg2-binary
      - name: Execute two-connection CAS, crash rollback and distinct-booking serialization
        run: python -m unittest discover -s backend/tests -p 'test_bot_atomic_claim_postgres.py' -v

  sqlcipher-real:
    name: Real encrypted SQLCipher booking concurrency and crash
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify exact reconciled merge candidate from sandbox
        shell: bash
        env:
          EXPECTED_PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = pull_request
          test "$GITHUB_REPOSITORY" = hraaaaf/Digital_crown
          test "$GITHUB_HEAD_REF" = integration/cb894-master-reconcile-diagnostic-20261021
          test "$GITHUB_BASE_REF" = master
          test "$(git rev-parse HEAD)" = "$EXPECTED_PR_HEAD"
          test "$(git ls-remote origin refs/heads/master | cut -f1)" = "$CB894_MASTER_SHA"
          git fetch --no-tags origin integration/cb894-master-reconciled-candidate-20261021
          test "$(git rev-parse FETCH_HEAD)" = "$CB894_CANDIDATE_SHA"
          git checkout --detach "$CB894_CANDIDATE_SHA"
          test "$(git rev-parse HEAD^1)" = "$CB894_DIAG_SHA"
          test "$(git rev-parse HEAD^2)" = "$CB894_SOURCE_SHA"
          test "$(git merge-base HEAD "$CB894_MASTER_SHA")" = "$CB894_MASTER_SHA"
          test -z "$(git status --porcelain)"
          echo "CB894_CANDIDATE_SOURCE_SHA=$CB894_CANDIDATE_SHA" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install SQLCipher runtime library
        run: sudo apt-get update && sudo apt-get install -y libsqlcipher-dev
      - name: Install SQLCipher test runtime
        run: python -m pip install 'pytest>=8,<10' 'sqlalchemy>=2.0,<3' 'sqlcipher3==0.6.2'
      - name: Encrypted on-disk two-connection booking and crash regression
        run: python -m pytest tests/test_fue_g04_crown_bot_sqlcipher.py -q

  api:
    name: Flag OFF + tenant + action replay API regressions
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crown_bot_clinical_cert
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d crown_bot_clinical_cert"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SECRET_KEY: ci-only-secret-key-minimum-32-characters-long
      DATABASE_URL: "sqlite:///:memory:"
      ENVIRONMENT: test
      DIGITALCROWN_ISOLATED_RUNTIME: "true"
      TELEMETRY_ENABLED: "false"
      CLOUD_AI_ENABLED: "false"
      CROWN_BOT_DETERMINISTIC_WORKFLOWS_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify exact reconciled merge candidate from sandbox
        shell: bash
        env:
          EXPECTED_PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = pull_request
          test "$GITHUB_REPOSITORY" = hraaaaf/Digital_crown
          test "$GITHUB_HEAD_REF" = integration/cb894-master-reconcile-diagnostic-20261021
          test "$GITHUB_BASE_REF" = master
          test "$(git rev-parse HEAD)" = "$EXPECTED_PR_HEAD"
          test "$(git ls-remote origin refs/heads/master | cut -f1)" = "$CB894_MASTER_SHA"
          git fetch --no-tags origin integration/cb894-master-reconciled-candidate-20261021
          test "$(git rev-parse FETCH_HEAD)" = "$CB894_CANDIDATE_SHA"
          git checkout --detach "$CB894_CANDIDATE_SHA"
          test "$(git rev-parse HEAD^1)" = "$CB894_DIAG_SHA"
          test "$(git rev-parse HEAD^2)" = "$CB894_SOURCE_SHA"
          test "$(git merge-base HEAD "$CB894_MASTER_SHA")" = "$CB894_MASTER_SHA"
          test -z "$(git status --porcelain)"
          echo "CB894_CANDIDATE_SOURCE_SHA=$CB894_CANDIDATE_SHA" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install canonical backend dependencies (CPU-only ML)
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.10.0 torchvision==0.25.0 torchaudio==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^(torch|torchvision|torchaudio)([<=>].*)?$' requirements.txt > /tmp/requirements-ci.txt
          pip install -r /tmp/requirements-ci.txt
          python -m pip check
      - name: Run API integration and legacy action regression
        run: |
          python -m pytest -q \
            backend/tests/test_bot_workflow_api_safe.py \
            backend/tests/test_bot_action_strict.py \
            backend/tests/test_bot_router.py \
            backend/tests/test_crown_bot_clinical_gate.py \
            backend/tests/test_agenda_a3_practitioner_availability.py \
            backend/tests/test_agenda_a4_resource_conflicts.py \
            backend/tests/test_patient_companion_agenda.py \
            backend/tests/test_frontdesk.py \
            backend/tests/test_appointments_multi_practitioner_p0.py \
            backend/tests/test_mobile_m63_canonical_agenda.py \
            backend/tests/test_mobile_frontdesk.py
      - name: REQUIRED — migrated PostgreSQL clinical HTTP end-to-end
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/crown_bot_clinical_cert
          CROWN_BOT_CLINICAL_CI_DATABASE: synthetic-only
        run: |
          alembic upgrade head
          python scripts/ci/crown_bot_clinical_pg_http_e2e.py
      - name: REQUIRED — full-schema encrypted SQLCipher clinical HTTP E2E
        env:
          DATABASE_URL: sqlite:////tmp/crown_bot_clinical_${{ github.run_id }}.db
          CROWN_BOT_CLINICAL_CI_DATABASE: synthetic-only
          CABINET_MASTER_KEY_HEX: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          SQLCIPHER_KEY_HEX: cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
        run: |
          sudo apt-get update && sudo apt-get install -y libsqlcipher-dev
          python -m pip install 'sqlcipher3==0.6.2'
          alembic upgrade head
          python scripts/ci/crown_bot_clinical_pg_http_e2e.py
      - name: Security evidence summary
        if: always()
        run: |
          echo "## ZERO-LLM adapter security gate" >> "$GITHUB_STEP_SUMMARY"
          echo "PR merge-ref SHA: \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Flag is OFF by default. No Vercel deployment, no real patients." >> "$GITHUB_STEP_SUMMARY"
          echo "API SQLite tests and real migrated PG/SQLCipher HTTP clinical E2E required; UI preview unit tests run separately. Browser screenshots require separate validation." >> "$GITHUB_STEP_SUMMARY"
