name: Patient P0 ClinicalHub PR Cert

on:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/patient-p0-clinicalhub-pr-cert.yml'
      - 'frontend/src/features/patients/components/ClinicalHub.tsx'

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ENVIRONMENT: test
      SECRET_KEY: patient-clinicalhub-pr-cert-secret-000001
      DATABASE_URL: sqlite:///./t2-runtime-cert.db
      TELEMETRY_ENABLED: 'false'
      CLOUD_AI_ENABLED: 'false'
      DEBUG: 'false'
      ALLOWED_ORIGINS: 'http://127.0.0.1:5173,http://localhost:5173'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Materialize verified candidate
        run: |
          git fetch origin agent/patient-page-p0-truth-safety --depth=1
          git show FETCH_HEAD:frontend/src/features/patients/components/ClinicalHub.tsx > frontend/src/features/patients/components/ClinicalHub.tsx
          git diff --check

      - name: Truth contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('frontend/src/features/patients/components/ClinicalHub.tsx').read_text(encoding='utf-8')
          required=[
            'const [treatmentPlan, setTreatmentPlan] = useState<TreatmentStep[]>([]);',
            'const [planLoading, setPlanLoading] = useState(true);',
            'const [planError, setPlanError] = useState<string | null>(null);',
            'const savePlan = async (plan: TreatmentStep[]): Promise<boolean> => {',
            'setTreatmentPlan(mapPersistedPlan(res.data));',
            'const handleWizardComplete = (wizardId: string, diag: string, _steps: any[], _suggestedNextAssistant?: string | null) => {',
            "toast.success('Proposition clinique générée. Validation du praticien requise.');",
            'Aucune étape de traitement enregistrée.',
            'Espace Clinique',
          ]
          for marker in required: assert marker in s, marker
          banned=['scientificOrder','localStorage.getItem(`master_plan_${patientId}`)','localStorage.setItem(`master_plan_${patientId}`','localStorage.getItem(`diag_${patientId}`)','localStorage.setItem(`diag_${patientId}`','Diagnostic : ${diag}','Simuler Ajout au Plan',"localStorage.setItem('pending_devis_plan'",'Générer Devis Global']
          for marker in banned: assert marker not in s, marker
          print('ClinicalHub truth contracts OK')
          PY

      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.12.0 torchvision==0.27.0 --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^(torch|torchvision)([<=>].*)?$' requirements.txt > /tmp/requirements-clinicalhub-pr.txt
          pip install -r /tmp/requirements-clinicalhub-pr.txt
          pip install httpx==0.27.2

      - name: Install frontend and Chromium
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Frontend build
        working-directory: frontend
        run: npm run build

      - name: Start isolated backend
        run: |
          rm -f t2-runtime-cert.db
          python scripts/t2_runtime_server.py > /tmp/ch-pr-backend.log 2>&1 &
          for i in {1..90}; do
            if curl -fsS http://127.0.0.1:8005/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/ch-pr-backend.log
          exit 1

      - name: Start frontend
        working-directory: frontend
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 > /tmp/ch-pr-front.log 2>&1 &
          for i in {1..90}; do
            if curl -fsS http://127.0.0.1:5173 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/ch-pr-front.log
          exit 1

      - name: Capture candidate
        working-directory: frontend
        run: |
          mkdir -p ../artifacts/clinicalhub-pr-candidate
          cat > .clinicalhub-pr-candidate.mjs <<'JS'
          import fs from 'node:fs'; import path from 'node:path'; import { chromium, request } from 'playwright';
          const out=path.resolve('../artifacts/clinicalhub-pr-candidate');
          const viewports=[{width:390,height:844},{width:430,height:932},{width:768,height:1024},{width:1280,height:900}];
          const api=await request.newContext({baseURL:'http://127.0.0.1:8005'});
          const login=await api.post('/api/auth/login',{form:{username:'t2-browser@cabinet.ma',password:'T2BrowserPass123!'}}); if(!login.ok()) throw new Error(await login.text());
          const tok=await login.json(); const ps=await api.get('/api/patients',{headers:{Authorization:`Bearer ${tok.access_token}`}}); if(!ps.ok()) throw new Error(await ps.text());
          const patient=(await ps.json()).find(p=>p.numero_dossier==='T2-0001'); if(!patient) throw new Error('T2 patient missing');
          const browser=await chromium.launch({headless:true}); const evidence=[];
          for(const viewport of viewports){
            const ctx=await browser.newContext({viewport,colorScheme:'light'}); const page=await ctx.newPage();
            await page.addInitScript(({a,r})=>{localStorage.setItem('token',a);localStorage.setItem('refresh_token',r||'');localStorage.setItem('appMode','prod');},{a:tok.access_token,r:tok.refresh_token});
            const errors=[]; const http5xx=[]; page.on('pageerror',e=>errors.push(String(e))); page.on('response',r=>{if(r.status()>=500)http5xx.push({url:r.url(),status:r.status()});});
            await page.goto(`http://127.0.0.1:5173/patients/${patient.id}?tab=clinical`,{waitUntil:'networkidle',timeout:90000}); await page.waitForTimeout(900);
            const heading=await page.locator('h2').filter({hasText:/Espace Clinique/}).count(); const fakePlan=await page.getByText('Détartrage & Surfaçage',{exact:false}).count(); const emptyPlan=await page.getByText('Aucune étape de traitement enregistrée.',{exact:true}).count();
            const metrics=await page.evaluate(()=>({scrollWidth:document.documentElement.scrollWidth,clientWidth:document.documentElement.clientWidth,noHorizontalOverflow:document.documentElement.scrollWidth<=document.documentElement.clientWidth+2}));
            const screenshot=`clinicalhub-candidate-${viewport.width}x${viewport.height}.png`; await page.screenshot({path:path.join(out,screenshot),fullPage:false}); evidence.push({viewport,heading,fakePlan,emptyPlan,metrics,errors,http5xx,screenshot}); await ctx.close();
          }
          const summary={captures:evidence.length,headingVisibleEverywhere:evidence.every(x=>x.heading===1),fakePlanAbsentEverywhere:evidence.every(x=>x.fakePlan===0),emptyPlanVisibleEverywhere:evidence.every(x=>x.emptyPlan===1),overflowFindings:evidence.filter(x=>!x.metrics.noHorizontalOverflow),runtimeErrors:evidence.filter(x=>x.errors.length),http5xx:evidence.filter(x=>x.http5xx.length)};
          fs.writeFileSync(path.join(out,'evidence.json'),JSON.stringify(evidence,null,2)); fs.writeFileSync(path.join(out,'summary.json'),JSON.stringify(summary,null,2)); await browser.close(); await api.dispose();
          if(!summary.headingVisibleEverywhere||!summary.fakePlanAbsentEverywhere||!summary.emptyPlanVisibleEverywhere||summary.runtimeErrors.length||summary.http5xx.length) process.exit(1);
          JS
          node .clinicalhub-pr-candidate.mjs
          rm .clinicalhub-pr-candidate.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: patient-clinicalhub-pr-candidate
          path: artifacts/clinicalhub-pr-candidate
          if-no-files-found: error
          retention-days: 14
