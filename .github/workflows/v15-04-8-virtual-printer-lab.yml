name: V1.5-04.8 Virtual Printer Spool LAB

on:
  pull_request:
    paths:
      - "backend/scripts/certify_v15_04_8_virtual_print.py"
      - "backend/scripts/certify_print_ledger_to_virtual_spool_lab_v15.py"
      - "backend/services/station_print_held_claims_lab.py"
      - ".github/workflows/v15-04-8-virtual-printer-lab.yml"
      - ".github/workflows/v15-04-8-e-integrated-software-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-cups-virtual-printer:
    name: Real CUPS lp job to virtual PDF printer (synthetic only)
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Checkout exact source HEAD, never synthetic merge
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Assert actual source HEAD
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned SQLAlchemy for synthetic held-claim laboratory
        run: python -m pip install SQLAlchemy==2.0.28
      - name: Install CUPS and a PDF-backed virtual printer (no physical device)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cups cups-client printer-driver-cups-pdf ghostscript poppler-utils
          sudo service cups restart
          lpstat -r
          # Use a dedicated queue; never fall back to a default/real printer.
          model="$(lpinfo -m | awk 'tolower($0) ~ /cups-pdf/ { print $1; exit }')"
          if [ -z "$model" ]; then
            echo "BLOCKER: CUPS-PDF printer model is not installed" >&2
            exit 1
          fi
          sudo lpadmin -p DC_VIRTUAL_PDF -E -v cups-pdf:/ -m "$model"
          sudo cupsenable DC_VIRTUAL_PDF
          sudo cupsaccept DC_VIRTUAL_PDF
          mkdir -p "$HOME/PDF"
          lpstat -v DC_VIRTUAL_PDF
          lpstat -p DC_VIRTUAL_PDF
          dpkg-query -W -f='${Package} ${Version}\n' printer-driver-cups-pdf

      - name: Submit SYNTHETIC HELD ledger and virtual lp job
        env:
          DC_SYNTHETIC_VIRTUAL_SPOOL_LAB: '1'
          GITHUB_SHA_SOURCE: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 backend/scripts/certify_print_ledger_to_virtual_spool_lab_v15.py
          test -s print-lab-artifacts/spooler-output.pdf
          test -s print-lab-artifacts/evidence.json

      - name: Upload only synthetic virtual printer evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: v15-04-8-cups-virtual-spool-proof
          path: |
            print-lab-artifacts/spooler-output.pdf
            print-lab-artifacts/evidence.json
            print-lab-artifacts/synthetic-source.ps
          retention-days: 7
          if-no-files-found: error

      - name: Diagnostics on failure (no patient content)
        if: failure()
        run: |
          lpstat -t || true
          sudo tail -n 65 /var/log/cups/error_log || true
          find "$HOME/PDF" -maxdepth 2 -type f -printf '%f %s bytes\n' 2>/dev/null || true
