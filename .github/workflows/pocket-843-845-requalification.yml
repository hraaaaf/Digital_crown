name: Pocket 843+845 — exact-SHA WebKit safety gates

on:
  pull_request:
    paths:
      - .github/workflows/pocket-843-845-requalification.yml
      - scripts/ci/pocket-843-845-webkit-safety-smoke.mjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  current-master-contracts:
    name: Current product Pocket pairing/PWA contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Require exact tested SHA
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend
        working-directory: frontend
        run: npm ci
      - name: Check current product contracts (no legacy 6-digit literal assertion)
        working-directory: frontend
        run: |
          npx vitest run \
            src/test/mobileM64ContextualBridge.test.ts \
            src/test/mobilePocketPwaLifecycle.contract.test.ts \
            src/features/mobile/Onboarding/OnboardingScanner.g1Interactive.test.tsx \
            src/features/mobile/Dashboard/components/MobileBottomNav.test.tsx

  webkit-loopback-safety:
    name: Real WebKit engine — isolated Safari/PWA refusal gates
    runs-on: ubuntu-24.04
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Require exact tested SHA
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend and isolated browser runner
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps webkit
      - name: Start loopback Vite only (no real backend, no patient data)
        working-directory: frontend
        run: |
          (npm run dev -- --host 127.0.0.1 --port 5173 --strictPort > /tmp/pocket-843-845-vite.log 2>&1 &)
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5173/mobile/onboarding > /dev/null; then exit 0; fi
            sleep 1
          done
          echo "POCKET_LOCAL_DEV_START_FAILED"
          exit 1
      - name: WebKit fail-closed checks on actual source
        working-directory: frontend
        env:
          TELEMETRY_ENABLED: 'false'
          CLOUD_AI_ENABLED: 'false'
        run: POCKET_TESTED_HEAD="$(git rev-parse HEAD)" node ../scripts/ci/pocket-843-845-webkit-safety-smoke.mjs

# Scope: physical iPhone, real HTTPS pairing, persistent PWA Home Screen,
# and LOT10 printer hardware remain NOT TESTED by these isolated checks.
