name: Portability P7 P10 macOS Signed Lifecycle Certification

on:
  workflow_call:
    inputs:
      candidate_ref:
        description: Exact branch, tag, or SHA to certify
        required: true
        type: string
    secrets:
      MACOS_DEVELOPER_ID_P12_B64:
        required: true
      MACOS_DEVELOPER_ID_P12_PASSWORD:
        required: true
      MACOS_CODESIGN_IDENTITY:
        required: true
      APPLE_NOTARY_KEY_P8_B64:
        required: true
      APPLE_NOTARY_KEY_ID:
        required: true
      APPLE_NOTARY_ISSUER_ID:
        required: true
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: Exact branch, tag, or SHA to certify
        required: true
        default: portability/p7-macos-packaging
        type: string

permissions:
  contents: read

concurrency:
  group: portability-p7-p10-macos-${{ inputs.candidate_ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  signed-lifecycle:
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_ref }}

      - name: Lock exact certification candidate
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATE_SHA="$(git rev-parse HEAD)"
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "P10_MACOS_CANDIDATE_SHA=$CANDIDATE_SHA" >> "$GITHUB_ENV"
          echo "P7_P10_CANDIDATE_SHA=$CANDIDATE_SHA"

      - name: Require Apple Silicon runner
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(uname -m)" == "arm64" ]]
          echo "P7_P10_RUNNER_ARCH=arm64"

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Static P7 and P10 contracts
        run: |
          python -m py_compile scripts/p10_macos_signed_lifecycle_ci.py
          python scripts/p7_macos_packaging_check.py --static
          python scripts/p10_update_contract_check.py

      - name: Require distribution credentials
        shell: bash
        env:
          CERT_P12_B64: ${{ secrets.MACOS_DEVELOPER_ID_P12_B64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
          CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          NOTARY_KEY_B64: ${{ secrets.APPLE_NOTARY_KEY_P8_B64 }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          for name in CERT_P12_B64 CERT_PASSWORD CODESIGN_IDENTITY NOTARY_KEY_B64 NOTARY_KEY_ID NOTARY_ISSUER_ID; do
            [[ -n "${!name:-}" ]] || { echo "Missing required secret: $name" >&2; exit 1; }
          done
          echo "P7_P10_DISTRIBUTION_CREDENTIALS=READY"

      - name: Build frontend once
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix frontend ci
          npm --prefix frontend run build
          rm -rf frontend/node_modules
          npm cache clean --force || true

      - name: Install exact macOS packaging toolchain
        run: |
          python -m pip install --no-cache-dir -r backend/requirements-p7-macos.txt
          python -m pip check

      - name: Generate native macOS icon
        shell: bash
        run: |
          set -euo pipefail
          python scripts/generate_macos_icon.py
          iconutil -c icns build/macos/DigitalCrown.iconset -o build/macos/DigitalCrown.icns
          test -s build/macos/DigitalCrown.icns

      - name: Import Developer ID and notary credentials
        shell: bash
        env:
          CERT_P12_B64: ${{ secrets.MACOS_DEVELOPER_ID_P12_B64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
          CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          NOTARY_KEY_B64: ${{ secrets.APPLE_NOTARY_KEY_P8_B64 }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/digitalcrown-p7-p10-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          CERT_PATH="$RUNNER_TEMP/digitalcrown-developer-id.p12"
          NOTARY_KEY="$RUNNER_TEMP/AuthKey_${NOTARY_KEY_ID}.p8"
          echo "P7_P10_SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "P7_P10_CERT_PATH=$CERT_PATH" >> "$GITHUB_ENV"
          echo "P7_P10_NOTARY_KEY=$NOTARY_KEY" >> "$GITHUB_ENV"
          export CERT_PATH NOTARY_KEY
          python - <<'PY'
          import base64, os
          from pathlib import Path
          Path(os.environ["CERT_PATH"]).write_bytes(base64.b64decode(os.environ["CERT_P12_B64"], validate=True))
          Path(os.environ["NOTARY_KEY"]).write_bytes(base64.b64decode(os.environ["NOTARY_KEY_B64"], validate=True))
          PY
          chmod 600 "$CERT_PATH" "$NOTARY_KEY"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT_PATH" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -A -t cert -f pkcs12
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security find-identity -v -p codesigning "$KEYCHAIN" | grep -F "$CODESIGN_IDENTITY"
          echo "DIGITALCROWN_CODESIGN_IDENTITY=$CODESIGN_IDENTITY" >> "$GITHUB_ENV"

      - name: Build Developer ID signed notarized pair
        shell: bash
        env:
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          BASELINE_VERSION="$(tr -d '[:space:]' < VERSION)"
          [[ "$BASELINE_VERSION" == "1.0.0" ]] || { echo "Expected VERSION=1.0.0, got $BASELINE_VERSION" >&2; exit 1; }
          PAIR_DIR="$RUNNER_TEMP/dc-p7-p10-signed-pair"
          mkdir -p "$PAIR_DIR" build/macos
          trap 'printf "%s" "$BASELINE_VERSION" > VERSION' EXIT

          notarize_dmg() {
            local version="$1"
            local dmg="$2"
            local result="build/macos/notary-result-${version}.json"
            local log="build/macos/notary-log-${version}.json"
            xcrun notarytool submit "$dmg" \
              --key "$P7_P10_NOTARY_KEY" \
              --key-id "$NOTARY_KEY_ID" \
              --issuer "$NOTARY_ISSUER_ID" \
              --wait \
              --output-format json > "$result"
            local notary_id
            notary_id="$(python - "$result" <<'PY'
          import json, sys
          from pathlib import Path
          payload = json.loads(Path(sys.argv[1]).read_text())
          if payload.get("status") != "Accepted":
              raise SystemExit(f"Notarization not accepted: {payload}")
          print(payload["id"])
          PY
            )"
            xcrun notarytool log "$notary_id" \
              --key "$P7_P10_NOTARY_KEY" \
              --key-id "$NOTARY_KEY_ID" \
              --issuer "$NOTARY_ISSUER_ID" \
              "$log"
            python - "$log" <<'PY'
          import json, sys
          from pathlib import Path
          payload = json.loads(Path(sys.argv[1]).read_text())
          errors = [item for item in payload.get("issues") or [] if str(item.get("severity", "")).lower() == "error"]
          if errors:
              raise SystemExit(f"Notary log contains errors: {errors}")
          PY
            xcrun stapler staple "$dmg"
            xcrun stapler validate "$dmg"
            spctl --assess --type open --context context:primary-signature --verbose=4 "$dmg"
          }

          build_version() {
            local version="$1"
            printf "%s" "$version" > VERSION
            python -m PyInstaller --noconfirm --clean DigitalCrown.spec
            python scripts/p7_macos_packaging_check.py --bundle dist/DigitalCrown.app
            dist/DigitalCrown.app/Contents/MacOS/DigitalCrown --package-self-test
            bash scripts/create_macos_dmg.sh
            local dmg="$PWD/dist_macos/DigitalCrown-${version}-arm64.dmg"
            test -s "$dmg"
            notarize_dmg "$version" "$dmg"
            cp "$dmg" "$PAIR_DIR/"
          }

          build_version "1.0.0"
          build_version "1.0.1"
          printf "%s" "$BASELINE_VERSION" > VERSION
          trap - EXIT

          BASELINE_DMG="$PAIR_DIR/DigitalCrown-1.0.0-arm64.dmg"
          TARGET_DMG="$PAIR_DIR/DigitalCrown-1.0.1-arm64.dmg"
          test -s "$BASELINE_DMG"
          test -s "$TARGET_DMG"
          echo "P10_MACOS_BASELINE_DMG=$BASELINE_DMG" >> "$GITHUB_ENV"
          echo "P10_MACOS_TARGET_DMG=$TARGET_DMG" >> "$GITHUB_ENV"
          echo "P7_P10_SIGNED_PAIR=READY baseline=$(shasum -a 256 "$BASELINE_DMG" | awk '{print $1}') target=$(shasum -a 256 "$TARGET_DMG" | awk '{print $1}')"

      - name: Real signed current-to-next lifecycle rollback and recovery
        shell: bash
        run: |
          set -euo pipefail
          WORK_ROOT="$RUNNER_TEMP/dc-p10-macos-signed"
          REPORT="$WORK_ROOT/proof.json"
          mkdir -p "$WORK_ROOT/positive/cabinet"
          printf "preserve-me" > "$WORK_ROOT/positive/cabinet/P7_DATA_SENTINEL.txt"
          GITHUB_SHA="$P10_MACOS_CANDIDATE_SHA" python scripts/p10_macos_signed_lifecycle_ci.py \
            --baseline-dmg "$P10_MACOS_BASELINE_DMG" \
            --target-dmg "$P10_MACOS_TARGET_DMG" \
            --work-root "$WORK_ROOT" \
            --report "$REPORT" \
            --repo-root "$GITHUB_WORKSPACE"
          python - "$REPORT" "$P10_MACOS_CANDIDATE_SHA" <<'PY'
          import json, sys
          from pathlib import Path
          proof = json.loads(Path(sys.argv[1]).read_text())
          candidate_sha = sys.argv[2]
          required = (
              proof.get("status") == "success",
              proof.get("source_head") == candidate_sha,
              proof.get("positive", {}).get("job_status") == "healthy",
              proof.get("positive", {}).get("installed_version") == "1.0.1",
              proof.get("positive", {}).get("finalization") == "passed",
              proof.get("interruption_recovery", {}).get("job_status") == "rolled_back",
              proof.get("interruption_recovery", {}).get("rollback") == "passed",
              proof.get("database_rollback", {}).get("database_rollback") == "passed",
          )
          if not all(required):
              raise SystemExit(f"P7/P10 signed lifecycle proof invalid: {proof}")
          PY
          rm -rf "$WORK_ROOT/positive/Applications/DigitalCrown.app"
          test -f "$WORK_ROOT/positive/cabinet/P7_DATA_SENTINEL.txt"
          echo "P7_P10_SIGNED_LIFECYCLE=SUCCESS candidate=$P10_MACOS_CANDIDATE_SHA"

      - name: Upload signed macOS lifecycle proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digitalcrown-p7-p10-macos-signed-lifecycle
          path: |
            ${{ runner.temp }}/dc-p7-p10-signed-pair/*.dmg
            ${{ runner.temp }}/dc-p10-macos-signed/proof.json
            ${{ runner.temp }}/dc-p10-macos-signed/**/*.json
            ${{ runner.temp }}/dc-p10-macos-signed/**/*.log
            build/macos/notary-result-*.json
            build/macos/notary-log-*.json
          if-no-files-found: warn
          retention-days: 7

      - name: Cleanup temporary signing material
        if: always()
        shell: bash
        run: |
          if [[ -n "${P7_P10_SIGNING_KEYCHAIN:-}" ]]; then
            security delete-keychain "$P7_P10_SIGNING_KEYCHAIN" || true
          fi
          if [[ -n "${P7_P10_NOTARY_KEY:-}" ]]; then
            rm -f "$P7_P10_NOTARY_KEY"
          fi
          if [[ -n "${P7_P10_CERT_PATH:-}" ]]; then
            rm -f "$P7_P10_CERT_PATH"
          fi
          rm -f "$RUNNER_TEMP/digitalcrown-developer-id.p12"
