name: V1.5-05.1 Offline SQL Inspector

on:
  pull_request:
    paths:
      - 'backend/services/legacy_sql_inspector_v15.py'
      - 'backend/tests/test_legacy_sql_inspector_v15*.py'
      - 'docs/quality/V15_05_SQL_MIGRATION_CONTRACT.md'
      - '.github/workflows/v15-05-1-offline-inspector.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspector:
    name: Offline synthetic source refusal and inventory
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: .
      PYTHONDONTWRITEBYTECODE: '1'
      ENVIRONMENT: test
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Check exact git commit
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          printf 'Inspector test HEAD: %s\n' "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run isolated synthetic inspector tests
        run: |
          python -m unittest discover -s backend/tests -p 'test_legacy_sql_inspector_v15*.py' -v
      - name: Inspect code without booting cabinet or target database
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast
          source = Path('backend/services/legacy_sql_inspector_v15.py')
          ast.parse(source.read_text(encoding='utf-8'))
          assert not Path('backend/services/legacy_sql_inspector_v15.py').is_symlink()
          print('schema-only inspector syntax verified; no source database attached')
          PY
