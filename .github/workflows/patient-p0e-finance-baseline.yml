name: Patient P0-E Finance Baseline

on:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/patient-p0e-finance-baseline.yml'
      - 'frontend/src/features/patients/components/PatientFinances.tsx'
      - 'frontend/src/features/patients/components/InstallmentPlanModal.tsx'

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ENVIRONMENT: test
      SECRET_KEY: patient-p0e-finance-baseline-secret-000001
      DATABASE_URL: sqlite:///./t2-runtime-cert.db
      TELEMETRY_ENABLED: 'false'
      CLOUD_AI_ENABLED: 'false'
      DEBUG: 'false'
      ALLOWED_ORIGINS: 'http://127.0.0.1:5173,http://localhost:5173'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Add zero-billed runtime fixture only
        run: |
          git fetch origin agent/patient-page-p0-truth-safety --depth=1
          git show FETCH_HEAD:scripts/t2_runtime_server.py > scripts/t2_runtime_server.py

      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.12.0 torchvision==0.27.0 --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^(torch|torchvision)([<=>].*)?$' requirements.txt > /tmp/requirements-p0e-baseline.txt
          pip install -r /tmp/requirements-p0e-baseline.txt
          pip install httpx==0.27.2

      - name: Install frontend and Chromium
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start isolated backend
        run: |
          rm -f t2-runtime-cert.db
          python scripts/t2_runtime_server.py > /tmp/p0e-baseline-backend.log 2>&1 &
          for i in {1..90}; do
            if curl -fsS http://127.0.0.1:8005/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/p0e-baseline-backend.log
          exit 1

      - name: Start frontend
        working-directory: frontend
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 > /tmp/p0e-baseline-front.log 2>&1 &
          for i in {1..90}; do
            if curl -fsS http://127.0.0.1:5173 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/p0e-baseline-front.log
          exit 1

      - name: Capture finance and installment BEFORE
        working-directory: frontend
        run: |
          mkdir -p ../artifacts/p0e-finance-before
          cat > .p0e-finance-before.mjs <<'JS'
          import fs from 'node:fs'; import path from 'node:path'; import { chromium, request } from 'playwright';
          const out=path.resolve('../artifacts/p0e-finance-before');
          const viewports=[{width:390,height:844},{width:430,height:932},{width:768,height:1024},{width:1280,height:900}];
          const api=await request.newContext({baseURL:'http://127.0.0.1:8005'});
          const login=await api.post('/api/auth/login',{form:{username:'t2-browser@cabinet.ma',password:'T2BrowserPass123!'}}); if(!login.ok()) throw new Error(await login.text());
          const tok=await login.json(); const ps=await api.get('/api/patients',{headers:{Authorization:`Bearer ${tok.access_token}`}}); if(!ps.ok()) throw new Error(await ps.text());
          const all=await ps.json(); const zero=all.find(p=>p.numero_dossier==='T2-ZERO-BILL'); const main=all.find(p=>p.numero_dossier==='T2-0001'); if(!zero||!main) throw new Error('T2 finance fixtures missing');
          const browser=await chromium.launch({headless:true}); const evidence=[];
          async function seed(page){await page.addInitScript(({a,r})=>{localStorage.setItem('token',a);localStorage.setItem('refresh_token',r||'');localStorage.setItem('appMode','prod');},{a:tok.access_token,r:tok.refresh_token});}
          for(const viewport of viewports){
            const ctx=await browser.newContext({viewport,colorScheme:'light'}); const page=await ctx.newPage(); await seed(page); const errors=[]; page.on('pageerror',e=>errors.push(String(e)));
            await page.goto(`http://127.0.0.1:5173/patients/${zero.id}?tab=finances`,{waitUntil:'networkidle',timeout:90000}); await page.getByText('Taux Recouvrement',{exact:true}).waitFor();
            const body=await page.locator('body').innerText(); const zeroScreenshot=`zero-billed-before-${viewport.width}x${viewport.height}.png`; await page.screenshot({path:path.join(out,zeroScreenshot),fullPage:true});
            const shows100=body.includes('100%');
            await page.goto(`http://127.0.0.1:5173/patients/${main.id}?tab=finances`,{waitUntil:'networkidle',timeout:90000}); const plan=page.getByRole('button',{name:/Plan/i}).first(); await plan.waitFor(); await plan.click(); await page.getByText("Plan d'échéances",{exact:true}).waitFor();
            const modalScreenshot=`installment-before-${viewport.width}x${viewport.height}.png`; await page.screenshot({path:path.join(out,modalScreenshot),fullPage:false});
            const modalVisible=await page.getByText("Plan d'échéances",{exact:true}).isVisible();
            evidence.push({viewport,shows100,modalVisible,errors,zeroScreenshot,modalScreenshot}); await ctx.close();
          }
          const summary={captures:evidence.length*2,recovery100Everywhere:evidence.every(x=>x.shows100),modalVisibleEverywhere:evidence.every(x=>x.modalVisible),runtimeErrors:evidence.filter(x=>x.errors.length)};
          fs.writeFileSync(path.join(out,'evidence.json'),JSON.stringify(evidence,null,2)); fs.writeFileSync(path.join(out,'summary.json'),JSON.stringify(summary,null,2)); await browser.close(); await api.dispose();
          if(!summary.recovery100Everywhere||!summary.modalVisibleEverywhere||summary.runtimeErrors.length) process.exit(1);
          JS
          node .p0e-finance-before.mjs
          rm .p0e-finance-before.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: patient-p0e-finance-before
          path: artifacts/p0e-finance-before
          if-no-files-found: error
          retention-days: 14
