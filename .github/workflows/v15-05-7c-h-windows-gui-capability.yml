name: LOT05 05.7C-H Signed GUI Privilege Boundary Probe (READ ONLY)

on:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/v15-05-7c-h-windows-gui-capability.yml'
      - 'scripts/quality/v15_05_7c_h_windows_gui_capability_probe.ps1'
      - 'scripts/quality/v15_05_7c_h_signed_vendor_window_probe.ps1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-windows-gui-capability:
    name: Signed GUI and launcher token elevation comparison (NO CLICK)
    runs-on: windows-2022
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Check exact HEAD, trusted runner, and offline PowerShell syntax
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = '${{ github.event.pull_request.head.sha || github.sha }}'
          if ((git rev-parse HEAD).Trim() -cne $expected) { throw 'EXACT_HEAD_REQUIRED' }
          if ($env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or $env:RUNNER_OS -cne 'Windows') { throw 'HOSTED_WINDOWS_REQUIRED' }
          $path = './scripts/quality/v15_05_7c_h_windows_gui_capability_probe.ps1'
          $tokens = $null
          $errors = @()
          $null = [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) { throw 'GUI_PROBE_POWERSHELL_SYNTAX_INVALID' }
          Write-Host 'LOT05_H_EXACT_HEAD_AND_SYNTAX_VALID'
      - name: Probe synthetic UI only (NO editor software, installer, database or patient data)
        shell: pwsh
        run: |
          & powershell.exe -NoLogo -NoProfile -STA -ExecutionPolicy Bypass -File './scripts/quality/v15_05_7c_h_windows_gui_capability_probe.ps1'
          if ($LASTEXITCODE -ne 0) { throw 'GUI_PROBE_EXECUTION_FAILED' }
      - name: Upload ONLY capability JSON; success means assessed, NOT that GUI was available
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lot05-7c-h-synthetic-windows-gui-capability-metadata-only
          path: ${{ runner.temp }}/lot05-7c-h-gui-capability-metadata-only.json
          if-no-files-found: error
          retention-days: 5
      - name: Validate signed vendor GUI observation probe offline syntax
        shell: pwsh
        run: |
          $errors = @()
          $tokens = $null
          $path = './scripts/quality/v15_05_7c_h_signed_vendor_window_probe.ps1'
          $null = [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) { throw 'SIGNED_VENDOR_GUI_PROBE_AST_INVALID' }
          Write-Host 'SIGNED_VENDOR_GUI_PROBE_AST_VALID'
      - name: Read-only signed vendor window vs runner token elevation (NO CLICK)
        shell: pwsh
        run: |
          & powershell.exe -NoLogo -NoProfile -STA -ExecutionPolicy Bypass -File './scripts/quality/v15_05_7c_h_signed_vendor_window_probe.ps1' -ReadOnlyElevationProbe
          if ($LASTEXITCODE -ne 0) { throw 'SIGNED_VENDOR_GUI_PROBE_FAILED_TO_COMPLETE' }
      - name: Fail closed on any installer click, EULA acceptance, DB or import during read-only diagnostic
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = Join-Path $env:RUNNER_TEMP 'lot05-7c-h-official-vendor-gui-window-metadata-only.json'
          if (-not (Test-Path -LiteralPath $path)) { throw 'READ_ONLY_TOKEN_PROBE_JSON_REQUIRED' }
          $v = Get-Content -LiteralPath $path -Raw -Encoding UTF8 | ConvertFrom-Json
          if (-not $v.official_binary_authenticode_valid -or
              -not $v.installer_win32_install_semantic_button_proven -or
              -not $v.read_only_elevation_probe_requested -or
              -not $v.runner_token_queryable -or
              $v.install_button_invocation_attempted -or
              $v.install_button_message_delivered -or
              $v.licence_or_eula_accepted -or
              $v.clicked_wizard_next -or
              $v.db_service_created_observed -or
              $v.database_installed -or
              $v.import_permitted -or
              $v.target_rows_written -ne 0) {
            throw 'READ_ONLY_ELEVATION_PROBE_UNSAFE_OR_INVALID_FAIL_CLOSED'
          }
          Write-Host 'LOT05H_READ_ONLY_WINDOWS_TOKEN_GATE_NO_CLICK_NO_EULA_NO_DB_NO_IMPORT'
      - name: Upload ONLY sanitized publisher-window metadata (never exe, window title, patient or CSV)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lot05-7c-h-signed-vendor-gui-window-metadata-only
          path: ${{ runner.temp }}/lot05-7c-h-official-vendor-gui-window-metadata-only.json
          if-no-files-found: warn
          retention-days: 5
      - name: Upload ONLY cropped signed vendor initial installer window (not desktop, no patient data)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lot05-7c-h-official-trial-initial-window-NO-PATIENTS
          path: ${{ runner.temp }}/lot05-7c-h-OFFICIAL-INSTALLER-FIRST-WINDOW-NO-PATIENTS.png
          if-no-files-found: warn
          retention-days: 3
