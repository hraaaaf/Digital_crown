name: LOT05 05.7C-H Synthetic BM_CLICK WinForms Forensic Probe (NO VENDOR)

on:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/v15-05-7c-h-windows-gui-capability.yml'
      - 'scripts/quality/v15_05_7c_h_windows_gui_capability_probe.ps1'
      - 'scripts/quality/v15_05_7c_h_signed_vendor_window_probe.ps1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-windows-gui-capability:
    name: Synthetic WinForms native button BM_CLICK forensic proof (NO VENDOR)
    runs-on: windows-2022
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Check exact HEAD, trusted runner, and offline PowerShell syntax
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = '${{ github.event.pull_request.head.sha || github.sha }}'
          if ((git rev-parse HEAD).Trim() -cne $expected) { throw 'EXACT_HEAD_REQUIRED' }
          if ($env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or $env:RUNNER_OS -cne 'Windows') { throw 'HOSTED_WINDOWS_REQUIRED' }
          $path = './scripts/quality/v15_05_7c_h_windows_gui_capability_probe.ps1'
          $tokens = $null
          $errors = @()
          $null = [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) { throw 'GUI_PROBE_POWERSHELL_SYNTAX_INVALID' }
          Write-Host 'LOT05_H_EXACT_HEAD_AND_SYNTAX_VALID'
      - name: Probe synthetic UI only (NO editor software, installer, database or patient data)
        shell: pwsh
        run: |
          & powershell.exe -NoLogo -NoProfile -STA -ExecutionPolicy Bypass -File './scripts/quality/v15_05_7c_h_windows_gui_capability_probe.ps1'
          if ($LASTEXITCODE -ne 0) { throw 'GUI_PROBE_EXECUTION_FAILED' }
      - name: Upload ONLY capability JSON; success means assessed, NOT that GUI was available
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lot05-7c-h-synthetic-windows-gui-capability-metadata-only
          path: ${{ runner.temp }}/lot05-7c-h-gui-capability-metadata-only.json
          if-no-files-found: error
          retention-days: 5
      - name: Assert synthetic BM_CLICK Win32 result and real event handler (never vendor)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = Join-Path $env:RUNNER_TEMP 'lot05-7c-h-gui-capability-metadata-only.json'
          if (-not (Test-Path -LiteralPath $path)) { throw 'SYNTHETIC_BM_CLICK_JSON_REQUIRED' }
          $v = Get-Content -LiteralPath $path -Raw -Encoding UTF8 | ConvertFrom-Json
          if (-not $v.source_is_synthetic -or
              $v.attempted_vendor_install -or
              $v.attempted_vendor_export -or
              $v.gui_capability -cne 'SYNTHETIC_WINFORMS_KEYBOARD_ROUNDTRIP_PROVEN' -or
              -not $v.synthetic_bm_click_candidate_created -or
              -not $v.synthetic_bm_click_requested -or
              -not $v.synthetic_bm_click_returned_nonzero -or
              -not $v.synthetic_bm_click_handler_fired -or
              -not $v.synthetic_bm_click_proven -or
              $v.publisher_gui_csv_export_verified -or
              $v.import_permitted -or
              $v.target_rows_written -ne 0) {
            throw 'SYNTHETIC_BM_CLICK_ROUNDTRIP_NOT_PROVEN_FAIL_CLOSED'
          }
          Write-Host 'LOT05H_NATIVE_BM_CLICK_PROVEN_ON_SYNTHETIC_WINFORMS_ONLY_NO_VENDOR'
