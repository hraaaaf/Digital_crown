name: P1 Ordonnance Runtime Screenshots

on:
  push:
    branches: [work-20260815-p1-runtime-screenshots]
  workflow_dispatch:

jobs:
  screenshots:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend
        run: npm ci

      - name: Install Chromium
        run: npx -y playwright@1.55.0 install --with-deps chromium

      - name: Start screenshot harness
        run: |
          npm run dev -- --port 4173 > /tmp/p1-vite.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/p1-screens.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/p1-vite.log
          exit 1

      - name: Capture desktop tablet mobile
        run: |
          mkdir -p p1-screens
          npx -y playwright@1.55.0 screenshot --browser chromium --viewport-size="1440,1100" --full-page --wait-for-timeout=4000 "http://127.0.0.1:4173/p1-screens.html?documentTab=ordonnance" p1-screens/01-ordonnance-desktop-1440.png
          npx -y playwright@1.55.0 screenshot --browser chromium --viewport-size="768,1100" --full-page --wait-for-timeout=4000 "http://127.0.0.1:4173/p1-screens.html?documentTab=ordonnance" p1-screens/02-ordonnance-tablet-768.png
          npx -y playwright@1.55.0 screenshot --browser chromium --viewport-size="390,844" --full-page --wait-for-timeout=4000 "http://127.0.0.1:4173/p1-screens.html?documentTab=ordonnance" p1-screens/03-ordonnance-mobile-390.png

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: p1-ordonnance-runtime-screenshots
          path: frontend/p1-screens/*.png
          if-no-files-found: error
