name: V1.5-05.2-B1 Staff Mapping Wizard Proof

on:
  pull_request:
    paths:
      - frontend/src/App.tsx
      - frontend/src/components/Sidebar.tsx
      - frontend/src/features/admin/migration/**
      - frontend/scripts/capture-v15-05-2b-mapping-preview.mjs
      - frontend/migration-preview.html
      - docs/quality/V15_05_2B_STAFF_MAPPING_UI_CONTRACT.md
      - .github/workflows/v15-05-2b-mapping-ui.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mapping-staff-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frozen lockfile
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Targeted Mapping Studio interactive and adversarial cases
        working-directory: frontend
        run: |
          set -euo pipefail
          CI=1 npx vitest run src/features/admin/migration/MappingStudioPolicy.test.ts src/features/admin/migration/MigrationMappingStudio.test.tsx --reporter=json --outputFile=/tmp/lot05-2b-results.json
          node --input-type=module -e "
            import fs from 'node:fs';
            const data = JSON.parse(fs.readFileSync('/tmp/lot05-2b-results.json','utf8'));
            if (data.numTotalTests !== 24 || data.numPassedTests !== 24 ||
                data.numFailedTests !== 0 || data.numPendingTests !== 0 ||
                data.numTodoTests !== 0 || data.testResults?.length !== 2) {
              throw new Error('B1 TEST CONTRACT FAILED: '+JSON.stringify({
                total:data.numTotalTests,pass:data.numPassedTests,fail:data.numFailedTests,
                pending:data.numPendingTests,todo:data.numTodoTests,files:data.testResults?.length
              }));
            }
            console.log('PASS exactly 24/24 cases from 2 unique files, no skip');
          "
      - name: TypeScript app typecheck
        working-directory: frontend
        run: npx tsc --noEmit -p tsconfig.app.json
      - name: Certify exact PR source SHA
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          echo "05.2-B1 reviewed UI (not backend approved/import-safe) HEAD: ${{ github.event.pull_request.head.sha || github.sha }}" >> "$GITHUB_STEP_SUMMARY"

  mapping-visual-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install UI deps + isolated Chromium test harness
        working-directory: frontend
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Serve Vite preview fixture only, then capture BEFORE/AFTER
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          npm run dev -- --port 4195 --host 127.0.0.1 >/tmp/v15-05-2b-vite.log 2>&1 &
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:4195/migration-preview.html -o /dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:4195/migration-preview.html -o /dev/null
          GITHUB_SHA="$(git rev-parse HEAD)" node scripts/capture-v15-05-2b-mapping-preview.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v15-05-2b-staff-mapping-before-after
          path: frontend/artifacts/v15-05-2b-mapping
          if-no-files-found: warn
          retention-days: 14
      - name: Exact SHA of visual source (not authenticated app certification)
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
