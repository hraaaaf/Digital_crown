name: LOT05 J10D FDI real public AKUDENTAL benchmark (experimental)

on:
  pull_request:
    branches: [master]
    paths:
      - 'experiments/lot05_j10d_fdi_akudental_public_ci.py'
      - '.github/workflows/lot05-j10d-fdi-real-akudental.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fdi-public-dataset-cpu:
    name: Pinned FDI CPU vs author-public research OPGs (non-clinical)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GIT_TERMINAL_PROMPT: '0'
      ULTRALYTICS_AUTOINSTALL: 'False'
      YOLO_CONFIG_DIR: /tmp/lot05-fdi-public-yolo
      WANDB_DISABLED: 'true'
      HF_HUB_DISABLE_TELEMETRY: '1'
      PYTHONUNBUFFERED: '1'
      PYTHONPATH: experiments
      DATASET_ROOT: ${{ runner.temp }}/lot05-fdi-public-akudental
      LOT05_FDI_REPORT: lot05-fdi-real-akudental-aggregates.json
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Pin exact experimental PR HEAD
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU-only pinned numerical dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.10.0 torchvision==0.25.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'ultralytics>=8.3.200,<8.4' 'huggingface_hub>=0.34,<2'
          python -m pip check
      - name: Download only published noncommercial-research AKUDENTAL dataset to ephemeral runner
        shell: bash
        run: |
          set -euo pipefail
          # Source is the dataset author's existing PUBLIC research publication,
          # never clinic/patient/private data; no credentials or cached images.
          git clone --quiet --depth=1 --filter=blob:none --sparse https://github.com/melihoz/AKUDENTAL.git "$DATASET_ROOT"
          git -C "$DATASET_ROOT" sparse-checkout set --no-cone '/AKUDENTAL/images/' '/AKUDENTAL/akudental_instances.json' >/dev/null
          SOURCE_SHA="$(git -C "$DATASET_ROOT" rev-parse HEAD)"
          test "${#SOURCE_SHA}" -eq 40
          test -f "$DATASET_ROOT/AKUDENTAL/akudental_instances.json"
          test -d "$DATASET_ROOT/AKUDENTAL/images"
          echo "Public AKUDENTAL source revision: $SOURCE_SHA"
      - name: Run real public-image FDI benchmark (fixed pre-prediction cohort)
        shell: bash
        run: |
          set -euo pipefail
          python experiments/lot05_j10d_fdi_akudental_public_ci.py \
            --publisher-repo "$DATASET_ROOT" --sample-size 40 --out "$LOT05_FDI_REPORT"
      - name: Retain aggregate metrics ONLY — never store radiographs, paths, labels, weight or predictions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lot05-fdi-real-public-akudental-${{ github.event.pull_request.head.sha || github.sha }}
          path: lot05-fdi-real-akudental-aggregates.json
          if-no-files-found: ignore
          retention-days: 7
