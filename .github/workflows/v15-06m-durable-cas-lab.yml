name: V1.5-06M Durable CAS Synthetic Lab

on:
  push:
    branches:
      - feat/v15-06-hotfolder-foundation-20261012
    paths:
      - 'tools/imaging_gateway/durable_cas_lab.py'
      - 'tools/imaging_gateway/tests/test_durable_cas_lab.py'
      - '.github/workflows/v15-06m-durable-cas-lab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cas-lab:
    name: Disposable SQLite CAS process-crash on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test-only signer
        run: python -m pip install 'cryptography>=42,<48'
      - name: Compile isolated lab
        run: python -m compileall -q tools/imaging_gateway/durable_cas_lab.py tools/imaging_gateway/tests/test_durable_cas_lab.py
      - name: Run full disposable CAS, competing processes and killed processes
        run: python -m unittest discover -s tools/imaging_gateway/tests -p 'test_durable_cas_lab.py' -v
