name: Patient P4AB Unified Patch V2

on:
  pull_request:
    branches:
      - agent/patient-page-p3-clinique
    paths:
      - '.github/workflows/patient-p4ab-unified-patch-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/patient-page-p4-imagerie'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Reuse guarded P4 A/B patch and align imaging permissions
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, textwrap

          workflow = Path('.github/workflows/patient-p4ab-unified-patch.yml').read_text(encoding='utf-8')
          start = workflow.index("          python - <<'PY'\n") + len("          python - <<'PY'\n")
          end = workflow.index("\n          PY\n", start)
          script = textwrap.dedent(workflow[start:end])
          exec(compile(script, 'p4ab-unified-patch', 'exec'), {})

          details = Path('frontend/src/features/patients/PatientDetailsInner.tsx')
          d = details.read_text(encoding='utf-8')

          permission_marker = "  const canClinical = !user?.employer_id || Boolean(user?.permissions?.clinical);"
          if 'const canPanoramic =' not in d:
              if permission_marker not in d:
                  raise SystemExit('PatientDetails clinical permission marker missing')
              permission_block = '''  const canClinical = !user?.employer_id || Boolean(user?.permissions?.clinical);
  const hasPatientPermission = (permission: 'patients' | 'panoramic' | 'cephalo') => {
    if (!user) return false;
    if (!user.employer_id || user.role === 'ADMIN') return true;
    const permissions = user.permissions || {};
    if (Object.keys(permissions).length > 0) return permissions[permission] === true;
    // Mirror backend legacy defaults for accounts created before granular permissions.
    if (user.role === 'DENTISTE') return ['patients', 'panoramic', 'cephalo'].includes(permission);
    if (user.role === 'SECRETAIRE') return permission === 'patients';
    return false;
  };
  const canRvg = hasPatientPermission('patients');
  const canPanoramic = hasPatientPermission('panoramic');
  const canCephalo = hasPatientPermission('cephalo');'''
              d = d.replace(permission_marker, permission_block, 1)

          radio_marker = "  const handleRadioTabChange = (v: 'rvg' | 'panoramic' | 'cephalo') =>\n    setSearchParams(prev => { const p = new URLSearchParams(prev); p.set('radioTab', v); return p; });"
          if 'const currentImagingAllowed =' not in d:
              if radio_marker not in d:
                  raise SystemExit('P4 radio marker missing after unified patch')
              guard = radio_marker + '''

  // URL fail-closed: an unavailable modality is never rendered as if accessible.
  useEffect(() => {
    if (activeTab !== 'radiology') return;
    const currentImagingAllowed =
      (radioTab === 'rvg' && canRvg) ||
      (radioTab === 'panoramic' && canPanoramic) ||
      (radioTab === 'cephalo' && canCephalo);
    if (currentImagingAllowed) return;

    const fallback = canRvg ? 'rvg' : canPanoramic ? 'panoramic' : canCephalo ? 'cephalo' : null;
    setSearchParams(prev => {
      const p = new URLSearchParams(prev);
      if (fallback) p.set('radioTab', fallback);
      else { p.set('tab', 'tracking'); p.delete('radioTab'); }
      return p;
    }, { replace: true });
  }, [activeTab, radioTab, canRvg, canPanoramic, canCephalo, setSearchParams]);'''
              d = d.replace(radio_marker, guard, 1)

          for permission, tab in [('canRvg','rvg'), ('canPanoramic','panoramic'), ('canCephalo','cephalo')]:
              if f'{{{permission} && (' not in d:
                  pattern = re.compile(
                      rf"(\s*<button\s+onClick=\{{\(\) => handleRadioTabChange\('{tab}'\)\}}.*?</button>)",
                      re.S,
                  )
                  d, count = pattern.subn(lambda match: f"\n                  {{{permission} && (\n{match.group(1)}\n                  )}}", d, count=1)
                  if count != 1:
                      raise SystemExit(f'Unable to wrap {tab} imaging tab with {permission}')

          details.write_text(d, encoding='utf-8')

          # Final source contract.
          d = details.read_text(encoding='utf-8')
          for required in [
              "const canRvg = hasPatientPermission('patients')",
              "const canPanoramic = hasPatientPermission('panoramic')",
              "const canCephalo = hasPatientPermission('cephalo')",
              "user.role === 'DENTISTE'",
              "user.role === 'SECRETAIRE'",
              "{canRvg && (",
              "{canPanoramic && (",
              "{canCephalo && (",
              'const currentImagingAllowed =',
          ]:
              if required not in d:
                  raise SystemExit(f'P4 imaging permission requirement missing: {required}')
          PY
          git diff --check
      - name: Commit guarded patch
        run: |
          git config user.name 'digital-crown-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add frontend/src/features/ortho/CephaloWorkspace.tsx frontend/src/features/panoramic/PanoramicStudio.tsx frontend/src/features/patients/PatientDetailsInner.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'fix(patient): unify P4 imaging truth RVG and RBAC'
          git push origin HEAD:${GITHUB_HEAD_REF}
