name: Harden Missing Financial PDF Rollback

on:
  push:
    branches: [fix/document-archive-consistency]
    paths:
      - '.github/workflows/document-missing-file-rollback-hardening.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/document-archive-consistency
          fetch-depth: 0
      - name: Snapshot missing canonical file state
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('backend/routers/documents.py')
          text=p.read_text()

          old='''    replacement_file_backups: list[tuple[pathlib.Path, bytes]] = []\n'''
          new='''    replacement_file_backups: list[tuple[pathlib.Path, Optional[bytes]]] = []\n'''
          if text.count(old) != 1: raise SystemExit(f'type marker mismatch: {text.count(old)}')
          text=text.replace(old,new,1)

          old='''        seen = set()\n        for candidate in candidates:\n            resolved = candidate.resolve()\n            if resolved in seen or not resolved.exists():\n                continue\n            seen.add(resolved)\n            replacement_file_backups.append((resolved, resolved.read_bytes()))\n'''
          new='''        seen = set()\n        for index, candidate in enumerate(candidates):\n            resolved = candidate.resolve()\n            if resolved in seen:\n                continue\n            seen.add(resolved)\n            if index == 0:\n                replacement_file_backups.append((resolved, resolved.read_bytes() if resolved.exists() else None))\n            elif resolved.exists():\n                replacement_file_backups.append((resolved, resolved.read_bytes()))\n'''
          if text.count(old) != 1: raise SystemExit(f'backup loop mismatch: {text.count(old)}')
          text=text.replace(old,new,1)

          old='''        for path, content in replacement_file_backups:\n            path.parent.mkdir(parents=True, exist_ok=True)\n            path.write_bytes(content)\n'''
          new='''        for path, content in replacement_file_backups:\n            if content is None:\n                if path.exists():\n                    path.unlink()\n                continue\n            path.parent.mkdir(parents=True, exist_ok=True)\n            path.write_bytes(content)\n'''
          if text.count(old) != 1: raise SystemExit(f'restore loop mismatch: {text.count(old)}')
          text=text.replace(old,new,1)
          p.write_text(text)
          PY
          python -m py_compile backend/routers/documents.py
          grep -q 'Optional\[bytes\]' backend/routers/documents.py
          grep -q 'if content is None:' backend/routers/documents.py
      - name: Commit and remove one-shot workflow
        run: |
          rm .github/workflows/document-missing-file-rollback-hardening.yml
          git config user.name 'Digital Crown CI'
          git config user.email 'actions@users.noreply.github.com'
          git add backend/routers/documents.py .github/workflows/document-missing-file-rollback-hardening.yml
          git commit -m 'Handle missing archive files in edit rollback'
          git push origin HEAD:fix/document-archive-consistency
