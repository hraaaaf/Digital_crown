name: Mobile M6 Source Export

on:
  push:
    branches: [audit/mobile-m6-generator]
    paths: [.github/workflows/mobile-m6-source-export.yml]

permissions:
  contents: read

jobs:
  export:
    name: Export exact master source files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a65d14dddddea3d513913f1453b26c259ef9a7fe
      - name: Package source files
        run: |
          mkdir -p /tmp/m6-source/backend/routers
          mkdir -p /tmp/m6-source/frontend/src/features/mobile/Dashboard/hooks
          mkdir -p /tmp/m6-source/frontend/src
          mkdir -p /tmp/m6-source/frontend
          cp backend/routers/auth.py /tmp/m6-source/backend/routers/auth.py
          cp frontend/src/features/mobile/Dashboard/hooks/useMobileDashboard.ts /tmp/m6-source/frontend/src/features/mobile/Dashboard/hooks/useMobileDashboard.ts
          cp frontend/src/main.tsx /tmp/m6-source/frontend/src/main.tsx
          cp frontend/vite.config.ts /tmp/m6-source/frontend/vite.config.ts
          printf 'source=a65d14dddddea3d513913f1453b26c259ef9a7fe\n' > /tmp/m6-source/metadata.txt
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-m6-exact-source
          path: /tmp/m6-source/
          retention-days: 14
