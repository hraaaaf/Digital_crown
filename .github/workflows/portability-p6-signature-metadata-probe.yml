name: Portability P6 Signature Metadata Probe

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - ".github/workflows/portability-p6-signature-metadata-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata-probe:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - name: Prepare signer and LocalMachine trust
        shell: pwsh
        timeout-minutes: 3
        env:
          CERT_PFX_B64: ${{ secrets.WINDOWS_CODESIGN_PFX_B64 }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PASSWORD }}
          EXPECTED_CERT_SHA256: ${{ vars.WINDOWS_CODESIGN_CERT_SHA256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          $values = @($env:CERT_PFX_B64, $env:CERT_PASSWORD, $env:EXPECTED_CERT_SHA256)
          $present = @($values | Where-Object { -not [string]::IsNullOrWhiteSpace([string]$_) })
          if ($present.Count -eq 0) { throw 'P6_PRIVATE_CODESIGN_NOT_CONFIGURED' }
          if ($present.Count -ne 3) { throw 'P6_PRIVATE_CODESIGN_PARTIAL_CONFIGURATION' }
          $pfx = Join-Path $env:RUNNER_TEMP 'dc-p6-meta.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_PFX_B64))
          $securePassword = ConvertTo-SecureString $env:CERT_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $securePassword -Exportable:$false
          if ($null -eq $cert -or -not $cert.HasPrivateKey) { throw 'P6_PRIVATE_CODESIGN_PRIVATE_KEY_MISSING' }
          $cer = Join-Path $env:RUNNER_TEMP 'dc-p6-meta.cer'
          Export-Certificate -Cert $cert -FilePath $cer -Type CERT | Out-Null
          $actual = (Get-FileHash -Algorithm SHA256 $cer).Hash.ToLowerInvariant()
          if ($actual -ne $env:EXPECTED_CERT_SHA256.ToLowerInvariant()) { throw "P6_PRIVATE_CODESIGN_CERT_SHA256_MISMATCH actual=$actual" }
          Import-Certificate -FilePath $cer -CertStoreLocation Cert:\LocalMachine\Root -Confirm:$false | Out-Null
          Import-Certificate -FilePath $cer -CertStoreLocation Cert:\LocalMachine\TrustedPublisher -Confirm:$false | Out-Null
          "P6_META_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "P6_META_PHASE=TRUST_READY thumbprint=$($cert.Thumbprint)"

      - name: Sign and verify native PE
        shell: pwsh
        timeout-minutes: 4
        run: |
          $ErrorActionPreference = 'Stop'
          $signtool = (Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter signtool.exe | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          if (-not $signtool) { throw 'P6_PRIVATE_CODESIGN_SIGNTOOL_MISSING' }
          $probe = Join-Path $env:RUNNER_TEMP 'dc-p6-meta-probe.exe'
          Copy-Item -LiteralPath (Join-Path $env:SystemRoot 'System32\where.exe') -Destination $probe -Force
          & $signtool sign /fd SHA256 /sha1 $env:P6_META_THUMBPRINT /s My /tr http://timestamp.digicert.com /td SHA256 $probe
          if ($LASTEXITCODE -ne 0) { throw "P6_PRIVATE_AUTHENTICODE_SIGN_FAILED exit_code=$LASTEXITCODE" }
          $verify = & $signtool verify /pa /v $probe 2>&1
          $verifyCode = $LASTEXITCODE
          $verify | Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'dc-p6-meta-signtool.txt') -Encoding utf8
          if ($verifyCode -ne 0) { throw "P6_PRIVATE_AUTHENTICODE_VERIFY_FAILED exit_code=$verifyCode" }
          Write-Host 'P6_META_PHASE=SIGNTOOL_VERIFY_SUCCESS'

      - name: Capture PowerShell Authenticode metadata
        shell: pwsh
        timeout-minutes: 2
        run: |
          $ErrorActionPreference = 'Stop'
          $probe = Join-Path $env:RUNNER_TEMP 'dc-p6-meta-probe.exe'
          $signature = Get-AuthenticodeSignature -FilePath $probe
          $payload = [ordered]@{
            status = [string]$signature.Status
            status_message = [string]$signature.StatusMessage
            signer_subject = if ($signature.SignerCertificate) { $signature.SignerCertificate.Subject } else { $null }
            signer_thumbprint = if ($signature.SignerCertificate) { $signature.SignerCertificate.Thumbprint } else { $null }
            expected_thumbprint = $env:P6_META_THUMBPRINT
            signer_match = [bool]($signature.SignerCertificate -and $signature.SignerCertificate.Thumbprint -eq $env:P6_META_THUMBPRINT)
            timestamper_present = [bool]($null -ne $signature.TimeStamperCertificate)
            timestamper_subject = if ($signature.TimeStamperCertificate) { $signature.TimeStamperCertificate.Subject } else { $null }
            timestamper_thumbprint = if ($signature.TimeStamperCertificate) { $signature.TimeStamperCertificate.Thumbprint } else { $null }
          }
          $json = $payload | ConvertTo-Json -Depth 3
          $json | Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'dc-p6-meta-authenticode.json') -Encoding utf8
          Write-Host "P6_META_AUTHENTICODE=$json"
          if ($payload.status -ne 'Valid') { throw "P6_PRIVATE_AUTHENTICODE_INVALID status=$($payload.status)" }
          if (-not $payload.timestamper_present) { throw 'P6_PRIVATE_AUTHENTICODE_TIMESTAMP_MISSING' }
          if (-not $payload.signer_match) { throw 'P6_PRIVATE_AUTHENTICODE_SIGNER_MISMATCH' }
          Write-Host 'P6_SIGNATURE_METADATA_PROBE=SUCCESS'

      - name: Upload metadata proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digitalcrown-p6-signature-metadata-probe
          path: |
            ${{ runner.temp }}\dc-p6-meta-authenticode.json
            ${{ runner.temp }}\dc-p6-meta-signtool.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Cleanup signing material
        if: always()
        shell: pwsh
        run: |
          foreach ($path in @('dc-p6-meta.pfx','dc-p6-meta.cer','dc-p6-meta-probe.exe')) {
            Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP $path) -Force -ErrorAction SilentlyContinue
          }
          if ($env:P6_META_THUMBPRINT) {
            Remove-Item -LiteralPath "Cert:\CurrentUser\My\$env:P6_META_THUMBPRINT" -Force -ErrorAction SilentlyContinue
            foreach ($store in @('Root','TrustedPublisher')) {
              Remove-Item -LiteralPath "Cert:\LocalMachine\$store\$env:P6_META_THUMBPRINT" -Force -ErrorAction SilentlyContinue
            }
          }
