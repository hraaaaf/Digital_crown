name: DECOMP P0-A Accounting controller

on:
  pull_request:
    branches: [master]
    paths:
      - 'scripts/decomp_accounting_controller.py'
      - '.github/workflows/decomp-accounting-controller.yml'

permissions:
  contents: write

jobs:
  refactor-and-verify:
    if: github.head_ref == 'agent/decomp-p0-large-files'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/decomp-p0-large-files
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply guarded controller extraction
        run: python scripts/decomp_accounting_controller.py
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: TypeScript exact check
        working-directory: frontend
        run: npx tsc -b --pretty false
      - name: Verify intended diff only
        run: |
          python - <<'PY'
          import subprocess
          expected = {
              'frontend/src/pages/AccountingPage.tsx',
              'frontend/src/features/accounting/hooks/useAccountingController.ts',
          }
          lines = subprocess.check_output(['git', 'status', '--short', '-uall'], text=True).splitlines()
          paths = {line[3:] for line in lines if line.strip()}
          if paths != expected:
              raise SystemExit(f'Unexpected controller diff: {sorted(paths)}')
          PY
      - name: Commit verified controller extraction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- frontend/src/pages/AccountingPage.tsx frontend/src/features/accounting/hooks/useAccountingController.ts
          git commit -m 'refactor(accounting): extract page controller'
          git push origin HEAD:agent/decomp-p0-large-files
