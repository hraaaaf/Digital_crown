name: V1.5-01 First Use Experience

on:
  pull_request:
    branches: [master]
    paths:
      - "frontend/src/features/hub/**"
      - "frontend/src/services/apiBase.ts"
      - "backend/core/cabinet_topology.py"
      - "backend/main.py"
      - "frontend/scripts/audit-v15-01-first-use.mjs"
      - ".github/workflows/v15-01-fue.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fue-v15-01:
    name: FUE V1.5-01 Topology
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ENVIRONMENT: test
      SECRET_KEY: fue-v15-01-secret-key-long-enough-000001
      DATABASE_URL: sqlite:///./t2-runtime-cert.db
      DIGITALCROWN_ISOLATED_RUNTIME: "1"
      TELEMETRY_ENABLED: "false"
      CLOUD_AI_ENABLED: "false"
      DEBUG: "false"
      ALLOWED_ORIGINS: "http://127.0.0.1:5173,http://localhost:5173"
      T2_USER: t2-browser@cabinet.ma
      PRODUCT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PRODUCT_HEAD }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Generate isolated credential
        shell: bash
        run: python -c 'import secrets; print("T2_PASSWORD=" + secrets.token_urlsafe(24))' >> "$GITHUB_ENV"

      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          grep -vE '^(torch|torchvision|torchaudio)([<=>].*)?$' requirements.txt >/tmp/requirements-fue-v15-01.txt
          pip install torch==2.10.0 torchvision==0.25.0 torchaudio==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r /tmp/requirements-fue-v15-01.txt
          python -m pip check

      - name: Topology contract regression
        run: python -m pytest tests/test_cabinet_topology.py backend/tests/test_v1_5_01_topology_contract.py -q

      - name: Install frontend and Chromium
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save playwright@1.55.0
          npx playwright install chromium

      - name: Start isolated backend
        run: |
          rm -f t2-runtime-cert.db
          python scripts/t2_runtime_server.py >/tmp/fue-v15-01-backend.log 2>&1 &
          for i in {1..60}; do
            curl -fsS http://127.0.0.1:8005/health >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/fue-v15-01-backend.log
          exit 1

      - name: Start frontend
        working-directory: frontend
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 >/tmp/fue-v15-01-frontend.log 2>&1 &
          for i in {1..60}; do
            curl -fsS http://127.0.0.1:5173 >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/fue-v15-01-frontend.log
          exit 1

      - name: Run FUE V1.5-01
        working-directory: frontend
        run: node scripts/run-with-t2-workstation.mjs scripts/audit-v15-01-first-use.mjs

      - name: Dump logs on failure
        if: failure()
        run: |
          echo "===== BACKEND ====="
          cat /tmp/fue-v15-01-backend.log || true
          echo "===== FRONTEND ====="
          cat /tmp/fue-v15-01-frontend.log || true

      - name: Upload FUE evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fue-v15-01-evidence
          path: artifacts/fue-v15-01
          if-no-files-found: error
          retention-days: 14
