name: Pocket A-B frozen SHA 2026-11-10 (diagnostic only)

# Synthetic browser reproduction on GitHub-hosted runners.
# This workflow lives ONLY on isolated ci/pocket-ab-20261110.
# It checks out two already-existing commits, without changing them.
on:
  push:
    branches:
      - ci/pocket-ab-20261110
    paths:
      - .github/workflows/pocket-ab-frozen-sha-20261110.yml

permissions:
  contents: read

concurrency:
  group: pocket-ab-20261110-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pocket-ab:
    name: Pocket Chromium ${{ matrix.name }} pinned ${{ matrix.sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - name: master
            sha: d4d2d144393fc884e01ca8734c1efa9fb0e0f2e3
          - name: candidate
            sha: a1bc5fbe92aad273130cf7e586135b5a0dd774a5

    steps:
      - name: Checkout exact frozen product commit (not diagnostic branch)
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.sha }}
          persist-credentials: false

      - name: Assert exact source and synthetic-only browser fixtures
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ matrix.sha }}"
          test -f frontend/scripts/capture-mobile-pocket-runtime-after.mjs
          grep -Fq "serviceWorkers: 'block'" frontend/scripts/capture-mobile-pocket-runtime-after.mjs
          grep -Fq "'SECRETAIRE'" frontend/scripts/capture-mobile-pocket-runtime-after.mjs
          echo "Tested source: ${{ matrix.name }} ${{ matrix.sha }}"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install pinned frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build authentic production frontend
        working-directory: frontend
        env:
          VITE_QUEUE_CORE_LAB_PREVIEW: 'false'
        run: npm run build

      - name: Install same Chromium runner as real-runtime certification
        working-directory: frontend
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start production-built Vite preview
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 5173 --strictPort > /tmp/pocket-ab-vite-${{ matrix.name }}.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:5173/landing >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/pocket-ab-vite-${{ matrix.name }}.log
          exit 1

      - name: Run unchanged real-runtime browser FUE (two SHA A/B)
        working-directory: frontend
        shell: bash
        env:
          MOBILE_RUNTIME_URL: http://127.0.0.1:5173
          MOBILE_RUNTIME_DIR: ../artifacts/pocket-ab-${{ matrix.name }}
          MOBILE_RUNTIME_ENGINE: chromium
        run: |
          set +e
          node scripts/capture-mobile-pocket-runtime-after.mjs
          result=$?
          mkdir -p ../artifacts/pocket-ab-${{ matrix.name }}
          printf 'source_sha=%s\nsource_name=%s\nrunner=ubuntu-latest\nengine=chromium\nscript=original_capture_mobile_pocket_runtime_after\nexit_code=%s\nsynthetic=true\n' "${{ matrix.sha }}" "${{ matrix.name }}" "$result" > ../artifacts/pocket-ab-${{ matrix.name }}/source-result.txt
          echo "FUE_EXIT_CODE=$result"
          exit "$result"

      - name: Upload synthetic evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pocket-ab-${{ matrix.name }}-${{ matrix.sha }}
          path: artifacts/pocket-ab-${{ matrix.name }}
          if-no-files-found: warn
          retention-days: 14
