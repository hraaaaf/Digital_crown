name: SEC-1 exact-head final dispatch

on:
  push:
    branches:
      - security/sec1-signed-licenses
    paths:
      - '.github/workflows/sec1-final-dispatch.yml'

permissions:
  contents: write
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: security/sec1-signed-licenses
          fetch-depth: 0

      - name: Restore exact final tree and dispatch canonical gates
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          TEMP_HEAD=$(git rev-parse HEAD)
          BASE_HEAD=$(git rev-parse HEAD^)
          BASE_TREE=$(git rev-parse "$BASE_HEAD^{tree}")
          echo "TEMP_HEAD=$TEMP_HEAD"
          echo "BASE_HEAD=$BASE_HEAD"
          echo "BASE_TREE=$BASE_TREE"

          git rm .github/workflows/sec1-final-dispatch.yml
          git commit -m "chore(sec1): remove exact-head dispatcher"
          FINAL_HEAD=$(git rev-parse HEAD)
          FINAL_TREE=$(git rev-parse HEAD^{tree})
          echo "FINAL_HEAD=$FINAL_HEAD"
          echo "FINAL_TREE=$FINAL_TREE"
          test "$FINAL_TREE" = "$BASE_TREE"

          git push origin HEAD:security/sec1-signed-licenses

          gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/dispatches" \
            -f ref='security/sec1-signed-licenses'
          gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/sec1-windows-package-cert.yml/dispatches" \
            -f ref='security/sec1-signed-licenses'
          gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/mobile-superadmin-cert.yml/dispatches" \
            -f ref='security/sec1-signed-licenses'

          echo "Dispatched canonical gates for $FINAL_HEAD"
