name: DC Cephalo 02D identity gate and invalid geometry diagnostics

on:
  push:
    branches:
      - research/dc-ceph02d-gated-source-diagnostics-20261012
    paths:
      - .github/workflows/dc-ceph02d-source-gates.yml
      - backend/tests/test_dc_ceph02b_runtime_matrix.py
      - backend/tests/test_dc_ceph02c_steiner_calibration.py
      - backend/tests/test_dc_ceph02d_source_gates.py
      - backend/services/cephalo_calibration_evidence.py

permissions:
  contents: read

jobs:
  isolated-typed-runtime-matrix:
    name: Diagnose four source-locked NO-GOs and invalid convexity
    if: github.event_name == 'push' && github.ref == 'refs/heads/research/dc-ceph02d-gated-source-diagnostics-20261012'
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      ENVIRONMENT: test
      TELEMETRY_ENABLED: 'false'
      CLOUD_AI_ENABLED: 'false'
      DEBUG: 'false'
    steps:
      - uses: actions/checkout@v4
      - name: Confirm isolated exact HEAD
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "hraaaaf/Digital_crown"
          test "$GITHUB_REF" = "refs/heads/research/dc-ceph02d-gated-source-diagnostics-20261012"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "DC_CEPH02D_EXACT_HEAD=$GITHUB_SHA"
          echo "DC_CEPH02D_FACAD_EXECUTED=false"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install backend scientific test runtime, no model weights
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install pytest==9.0.3 SQLAlchemy==2.0.28 pydantic==2.6.3 pydantic-settings==2.2.1 fastapi==0.115.6 httpx==0.28.1 numpy==2.4.3 opencv-python-headless==4.13.0.92 onnxruntime==1.25.0 python-jose==3.5.0 python-dotenv==1.2.1 cryptography==49.0.0 pillow==12.2.0 requests==2.32.5 PyYAML==6.0.3 reportlab==4.4.10 email-validator==2.3.0 passlib==1.7.4 python-multipart==0.0.31 pytest-asyncio==1.3.0
      - name: Run existing runtime, calibration and PDF regression plus 38-status matrix
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q -s \
            backend/tests/test_dc_ceph02b_runtime_matrix.py \
            backend/tests/test_dc_ceph02c_steiner_calibration.py \
            backend/tests/test_dc_ceph02d_source_gates.py \
            backend/tests/test_cephalo_runtime_chain.py \
            backend/tests/test_cephalo_calibration_evidence.py \
            backend/tests/test_cephalo_landmark_correction_evidence.py \
            backend/tests/test_cephalo_r17_pdf_projection.py \
            | tee /tmp/dc-ceph02b-test.log
          python - <<'PY'
          import json
          from pathlib import Path
          logs=Path("/tmp/dc-ceph02b-test.log").read_text(encoding="utf-8")
          matches=[s.removeprefix("DC_CEPH02B_MATRIX_SAFE=") for s in logs.splitlines() if s.startswith("DC_CEPH02B_MATRIX_SAFE=")]
          assert len(matches)==1, "Expected exactly one safe runtime matrix"
          x=json.loads(matches[0])
          assert x["schema"]=="DC_CEPH02B_RUNTIME_MATRIX_V1"
          assert x["contract_measurements"]==38
          assert len(x["revision_sequence"])==4
          assert all(sum(x[period].values())==38 for period in ("uncalibrated","calibrated","post_correction"))
          assert x["calibrated"]["AVAILABLE"] > x["uncalibrated"]["AVAILABLE"]
          rows=x["per_measure_statuses"]
          contract=json.load(open("docs/audits/schemas/cephalo_vnext_lot06_executable_measurement_contract_v1.json",encoding="utf-8"))
          assert set(rows)=={i["measurement_id"] for i in contract["measurements"]}
          for phase in ("uncalibrated","calibrated","post_correction"):
            assert all(row[phase] in {"AVAILABLE","NOT_COMPUTABLE","INVALID","NOT_EXPOSED"} for row in rows.values())
            assert {state:sum(row[phase]==state for row in rows.values()) for state in ("AVAILABLE","NOT_COMPUTABLE","INVALID","NOT_EXPOSED")} == x[phase]
          assert x["all_38_measurements_available"] == (x["post_correction"]["AVAILABLE"]==38)
          assert x["previously_available_lost_after_correction"] == []
          assert x["newly_available_contract_ids_after_correction"] == sorted(
            mid for mid,row in rows.items() if row["calibrated"] != "AVAILABLE" and row["post_correction"] == "AVAILABLE"
          )
          assert x["post_correction"]["AVAILABLE"] >= x["calibrated"]["AVAILABLE"]
          expected={"M_U1_NA_MM_V1","M_L1_NB_MM_V1","M_POG_NB_MM_V1","M_L1_DLINE_MM_V1"}
          assert all(rows[k]["calibrated"]!="NOT_EXPOSED" for k in expected)
          assert x["calibrated"]["NOT_EXPOSED"]==4
          assert x["post_correction"]["NOT_EXPOSED"]==4
          assert x["typed_runtime_read_valid"] is True
          assert x["pdf_projection_invoked"] is True
          assert x["pdf_document_clinically_complete"] is False
          assert x["facad_numeric_parity_proved"] is False
          assert x["clinical_activation_allowed"] is False
          assert x["real_patient_data_used"] is False
          assert "NOT_EXPOSED" in x["post_correction"]
          source_rows=[line.split("DC_CEPH02D_SAFE=",1)[1] for line in logs.splitlines() if "DC_CEPH02D_SAFE=" in line]
          assert len(source_rows)==1
          findings=json.loads(source_rows[0])
          exact={"M_AB_PRIME_FH_MM_V1","M_B_NPERP_MM_V1","M_COM_S_NPERP_DEPTH_MM_V1","M_U1_FH_DEG_V1"}
          assert findings["schema"]=="DC_CEPH02D_SOURCE_GATES_V1"
          assert set(findings["identity_blocked"])==exact
          assert findings["identity_block_reason"]=="LEGACY_LANDMARK_IDENTITY_BRIDGE_REQUIRED"
          assert findings["invalid_canonical_id"]=="M_MAXILLARY_CONVEXITY_A_NPOG_MM_V1"
          assert findings["invalid_has_no_numeric_value"] is True
          assert findings["synthetic_contract_count"]==38
          assert findings["baseline_counts"]==x["calibrated"]
          assert findings["numeric_parity_facad_certified"] is False
          assert findings["clinical_activation_allowed"] is False
          assert findings["real_patient_data_used"] is False
          assert findings["vendor_software_executed"] is False
          assert findings["production_runtime_modified"] is False
          assert all(x["per_measure_statuses"][key]["calibrated"]=="NOT_EXPOSED" for key in exact)
          assert x["per_measure_statuses"][findings["invalid_canonical_id"]]["calibrated"]=="INVALID"
          Path("dc-ceph02d-safe-diagnostic.json").write_text(
            json.dumps(findings, sort_keys=True, indent=2)+"\n",encoding="utf-8"
          )
          print("DC_CEPH02D_GATE=SCIENTIFIC_GATES_RETAINED")
          PY
      - name: Upload non-identifying status matrix only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dc-ceph02d-source-gates-safe-aggregate
          path: dc-ceph02d-safe-diagnostic.json
          if-no-files-found: warn
          retention-days: 7
