name: LOT07 P1 Clinical Context and G1 MultiView Contract

on:
  pull_request:
    paths:
      - 'frontend/src/features/patients/PatientDetailsInner.tsx'
      - 'frontend/src/features/patients/components/PatientClinicalContextNotice.tsx'
      - 'frontend/src/features/patients/components/PatientClinicalContextNotice.p1.test.tsx'
      - 'frontend/src/features/patients/PatientDetails.p1ClinicalContext.test.tsx'
      - '.github/workflows/lot07-p1-clinical-multiview-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lot07-p1-clinical-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Clinical truth, guarded actions and G1 MultiView regression
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout exact candidate HEAD with full diff history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Locked dependency install
        run: npm ci
      - name: P1 source-first clinical notice unit regression
        run: npx vitest run src/features/patients/components/PatientClinicalContextNotice.p1.test.tsx --maxWorkers=1 --fileParallelism=false
      - name: PatientDetails G1 route and RBAC regression
        run: npx vitest run src/features/patients/PatientDetails.p1ClinicalContext.test.tsx src/features/patients/PatientDetails.g2Interactive.test.tsx --maxWorkers=1 --fileParallelism=false
      - name: Real G1 two panes same patient no cross-leak regression
        run: npx vitest run src/features/multiview/CabinetTwoViewsPilot.test.tsx --maxWorkers=1 --fileParallelism=false
      - name: Typecheck and isolated build (never production dist)
        run: npm run build:test
      - name: Verify all visual theme identities untouched
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet b75012e3edc1a63d1b904635cafb2a20dc4913b2 HEAD -- src/index.css src/features/multiview/CabinetTwoViewsPilot.css
          echo 'No palette, font, theme or MultiView CSS files changed'
