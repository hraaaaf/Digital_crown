name: Patient Radiology R1-R3 Clinical Safety

on:
  push:
    branches:
      - agent/patient-page-p0-truth-safety
    paths:
      - '.github/workflows/patient-radiology-r1-r3-clinical-safety.yml'
      - 'backend/routers/ia.py'
      - 'backend/services/panoramic_service.py'
      - 'backend/services/sota_panoramic_service.py'
      - 'backend/services/bilan_ortho_engine.py'
      - 'frontend/src/features/panoramic/PanoramicStudio.tsx'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: patient-r1-panoramic-pdf-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Patch R1-R3 fail-closed clinical safety
        run: |
          python - <<'PY'
          from pathlib import Path

          # R1 — authenticated PDF stream + patient boundary.
          ia = Path('backend/routers/ia.py')
          src = ia.read_text(encoding='utf-8')
          old = '''@router.get("/panoramic/{analysis_id}/pdf")
def download_panoramic_pdf(analysis_id: int, db: Session = Depends(database.get_db), current_user: models.User = Depends(require_permission("panoramic"))):
    """Génère et retourne l'URL du bilan PDF professionnel Élite."""
    try:
        from backend.services.generators.panoramic_elite_gen import panoramic_elite_generator
        pdf_url = panoramic_elite_generator.generate(
            db=db,
            analysis_id=analysis_id,
            current_user=current_user
        )
        return {"pdf_url": f"{os.getenv('BACKEND_URL', 'http://localhost:8000')}/{pdf_url}"}
    except Exception as e:
        logger.exception(f"Erreur lors de la génération du PDF panoramique Élite: {e}")
        raise HTTPException(status_code=500, detail=str(e))
'''
          new = '''@router.get("/panoramic/{analysis_id}/pdf")
def download_panoramic_pdf(analysis_id: int, db: Session = Depends(database.get_db), current_user: models.User = Depends(require_permission("panoramic"))):
    """Génère et diffuse le PDF panoramique via un flux authentifié."""
    analysis = db.query(models.PanoramicAnalysis).filter(models.PanoramicAnalysis.id == analysis_id).first()
    if not analysis:
        raise HTTPException(status_code=404, detail="Analyse introuvable")
    assert_patient_access(analysis.patient_id, current_user, db)

    try:
        from fastapi.responses import FileResponse
        from backend.services.generators.panoramic_elite_gen import panoramic_elite_generator
        pdf_rel = panoramic_elite_generator.generate(db=db, analysis_id=analysis_id, current_user=current_user)
        clean_rel = pdf_rel.removeprefix("api/")
        pdf_path = os.path.join(BASE_DIR, clean_rel)
        if not os.path.isfile(pdf_path):
            raise HTTPException(status_code=500, detail="PDF généré introuvable")
        return FileResponse(path=pdf_path, media_type="application/pdf", filename=os.path.basename(pdf_path))
    except HTTPException:
        raise
    except Exception as e:
        logger.exception(f"Erreur lors de la génération du PDF panoramique Élite: {e}")
        raise HTTPException(status_code=500, detail=str(e))
'''
          if new not in src:
              if old not in src:
                  raise SystemExit('ia.py PDF source mismatch')
              ia.write_text(src.replace(old, new, 1), encoding='utf-8')

          ui = Path('frontend/src/features/panoramic/PanoramicStudio.tsx')
          src = ui.read_text(encoding='utf-8')
          old_download = '''      const response = await api.get(`/ia/panoramic/${result.id}/pdf`);
      window.open(response.data.pdf_url, '_blank');'''
          new_download = '''      const response = await api.get(`/ia/panoramic/${result.id}/pdf`, { responseType: 'blob' });
      const blobUrl = URL.createObjectURL(response.data);
      window.open(blobUrl, '_blank', 'noopener,noreferrer');
      window.setTimeout(() => URL.revokeObjectURL(blobUrl), 60_000);'''
          old_preview = '''      const response = await api.get(`/ia/panoramic/${result.id}/pdf`);
      setPreviewPdfUrl(response.data.pdf_url);'''
          new_preview = '''      const response = await api.get(`/ia/panoramic/${result.id}/pdf`, { responseType: 'blob' });
      setPreviewPdfUrl(URL.createObjectURL(response.data));'''
          if new_download not in src:
              if old_download not in src: raise SystemExit('download source mismatch')
              src = src.replace(old_download, new_download, 1)
          if new_preview not in src:
              if old_preview not in src: raise SystemExit('preview source mismatch')
              src = src.replace(old_preview, new_preview, 1)
          ui.write_text(src, encoding='utf-8')

          # R2 — production and cabinet are clinical environments: never simulate detections.
          for filename in ('backend/services/panoramic_service.py', 'backend/services/sota_panoramic_service.py'):
              p = Path(filename)
              src = p.read_text(encoding='utf-8')
              old_env = '''def _is_production() -> bool:
    """En production, aucune simulation IA clinique silencieuse n'est tolérée (P0.8)."""
    return str(getattr(settings, "ENVIRONMENT", "development")).lower() == "production"
'''
              new_env = '''def _is_clinical_environment() -> bool:
    """En production ou cabinet, aucune simulation clinique n'est tolérée."""
    return str(getattr(settings, "ENVIRONMENT", "development")).lower() in {"production", "cabinet"}
'''
              if new_env not in src:
                  if old_env not in src: raise SystemExit(f'{filename}: env source mismatch')
                  src = src.replace(old_env, new_env, 1).replace('_is_production()', '_is_clinical_environment()')
              p.write_text(src, encoding='utf-8')

          pano = Path('backend/services/panoramic_service.py')
          src = pano.read_text(encoding='utf-8')
          old_fb = '''            # Fallback: retourner une liste vide avec succès
            return {
                "status": "SUCCESS",
                "mode_inference": "FALLBACK_EMPTY",
                "detections_data": {
                    "detections": [],
                    "summary": "Détection indisponible — annotation manuelle par le praticien",
                    "error": str(e)
                },
            }
'''
          new_fb = '''            # Échec explicite : aucune détection clinique n'est fabriquée ni présentée comme réussie.
            return {
                "status": "UNAVAILABLE",
                "mode_inference": "FALLBACK_EMPTY",
                "detections_data": {
                    "detections": [],
                    "summary": "Détection automatique indisponible — repérage manuel requis par le praticien",
                    "error": str(e)
                },
            }
'''
          if new_fb not in src:
              if old_fb not in src: raise SystemExit('panoramic fallback source mismatch')
              pano.write_text(src.replace(old_fb, new_fb, 1), encoding='utf-8')

          # R3 — no automatic orthodontic treatment strategy.
          bilan = Path('backend/services/bilan_ortho_engine.py')
          src = bilan.read_text(encoding='utf-8')
          old_plan = '        plan_traitement = self._generate_plan_traitement(cephalo, clinique)\n'
          new_plan = '''        if clinique.plan_traitement and clinique.plan_traitement.strip():
            plan_traitement = clinique.plan_traitement.strip()
        else:
            plan_traitement = (
                "Aucune stratégie thérapeutique n'est générée automatiquement. "
                "Le plan de traitement relève exclusivement de la décision du praticien "
                "après validation clinique et radiographique."
            )
'''
          if new_plan not in src:
              if old_plan not in src: raise SystemExit('bilan auto-plan source mismatch')
              bilan.write_text(src.replace(old_plan, new_plan, 1), encoding='utf-8')
          PY

      - name: Clinical safety contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          ia = Path('backend/routers/ia.py').read_text(encoding='utf-8')
          ui = Path('frontend/src/features/panoramic/PanoramicStudio.tsx').read_text(encoding='utf-8')
          pano = Path('backend/services/panoramic_service.py').read_text(encoding='utf-8')
          sota = Path('backend/services/sota_panoramic_service.py').read_text(encoding='utf-8')
          bilan = Path('backend/services/bilan_ortho_engine.py').read_text(encoding='utf-8')

          start = ia.index('@router.get("/panoramic/{analysis_id}/pdf")')
          end = ia.index('@router.delete("/panoramic/{analysis_id}"', start)
          endpoint = ia[start:end]
          assert 'assert_patient_access(analysis.patient_id, current_user, db)' in endpoint
          assert endpoint.index('assert_patient_access') < endpoint.index('panoramic_elite_generator.generate')
          assert 'FileResponse(' in endpoint and 'pdf_url' not in endpoint
          assert "responseType: 'blob'" in ui and 'response.data.pdf_url' not in ui

          for text in (pano, sota):
              assert 'in {"production", "cabinet"}' in text
              assert '_is_production()' not in text
          assert '"status": "UNAVAILABLE"' in pano
          assert '"status": "SUCCESS",\n                "mode_inference": "FALLBACK_EMPTY"' not in pano

          assert 'plan_traitement = self._generate_plan_traitement(cephalo, clinique)' not in bilan
          assert 'Aucune stratégie thérapeutique n\'est générée automatiquement.' in bilan
          assert 'relève exclusivement de la décision du praticien' in bilan
          print('R1-R3 clinical safety contracts: OK')
          PY

      - name: Python syntax
        run: python -m py_compile backend/routers/ia.py backend/services/panoramic_service.py backend/services/sota_panoramic_service.py backend/services/bilan_ortho_engine.py

      - name: Cabinet fail-closed probe
        run: |
          python - <<'PY'
          import os
          os.environ['ENVIRONMENT'] = 'cabinet'
          from backend.config import settings
          object.__setattr__(settings, 'ENVIRONMENT', 'cabinet')
          import backend.services.sota_panoramic_service as sota
          import backend.services.panoramic_service as pano
          assert sota._is_clinical_environment() is True
          assert pano._is_clinical_environment() is True
          print('Cabinet fail-closed: OK')
          PY

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend build
        working-directory: frontend
        run: npm run build

      - name: Commit certified R1-R3 product patch
        run: |
          if git diff --quiet -- backend/routers/ia.py backend/services/panoramic_service.py backend/services/sota_panoramic_service.py backend/services/bilan_ortho_engine.py frontend/src/features/panoramic/PanoramicStudio.tsx; then
            echo "R1-R3 product patch already committed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/routers/ia.py backend/services/panoramic_service.py backend/services/sota_panoramic_service.py backend/services/bilan_ortho_engine.py frontend/src/features/panoramic/PanoramicStudio.tsx
          git commit -m "fix(patient): fail closed radiology and ortho planning"
          git push origin HEAD:${GITHUB_REF_NAME}
