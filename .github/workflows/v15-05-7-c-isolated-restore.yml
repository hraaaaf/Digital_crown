name: V1.5-05.7-C Isolated SQLCipher PostgreSQL Restore Lab

on:
  push:
    branches:
      - feat/v15-05-7c-synthetic-restore-proof-20261018
  pull_request:
    paths:
      - backend/tests/test_legacy_sql_057c_sqlcipher_offline_lab.py
      - backend/tests/test_legacy_sql_057c_postgres_native_restore_lab.py
      - docs/quality/V15_05_7_C_ISOLATED_RESTORE_PROOF.md
      - .github/workflows/v15-05-7-c-isolated-restore.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sqlcipher-offline:
    name: SQLCipher encrypted fake offline restore (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      LOT05C_SQLCIPHER_SYNTHETIC_ONLY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux SQLCipher system dependency
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsqlcipher-dev
      - name: Install one bounded SQLCipher test dependency
        run: python -m pip install sqlcipher3==0.6.2
      - name: Encrypted offline snapshot and independent restore on fake DB
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile backend/tests/test_legacy_sql_057c_sqlcipher_offline_lab.py
          python -B backend/tests/test_legacy_sql_057c_sqlcipher_offline_lab.py -v 2>&1 | tee lot05c-sqlcipher.log
          grep -q 'Ran 12 tests' lot05c-sqlcipher.log
          grep -q '^OK' lot05c-sqlcipher.log
          ! grep -E 'FAILED|ERROR|skipped=' lot05c-sqlcipher.log
      - name: Verify exact SHA and no production code change
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || '541ca81ebc71d9b05403d0e8a52cc18fcc6c11c2' }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git diff --exit-code "$BASE_SHA" HEAD -- backend/main.py backend/database.py backend/routers/legacy_migration_v15.py backend/services/legacy_migration_gateway_v15.py alembic frontend

  postgres-native:
    name: PostgreSQL 18 native dump/restore (dedicated fake CI instance)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_USER: lot05c_ci
          POSTGRES_PASSWORD: only-fake-lot05c-secret
          POSTGRES_DB: lot05c_fake_admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lot05c_ci -d lot05c_fake_admin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      LOT05C_PG_SYNTHETIC_ONLY: '1'
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: lot05c_ci
      PGDATABASE: lot05c_fake_admin
      PGPASSWORD: only-fake-lot05c-secret
      LOT05C_PG_SERVICE_CONTAINER_ID: ${{ job.services.postgres.id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated Postgres driver only
        run: python -m pip install psycopg2-binary==2.9.9
      - name: Verify dedicated PostgreSQL 18 container and native clients
        shell: bash
        run: |
          set -euo pipefail
          docker exec "$LOT05C_PG_SERVICE_CONTAINER_ID" pg_dump --version | grep -E 'PostgreSQL\) 18'
          docker exec "$LOT05C_PG_SERVICE_CONTAINER_ID" pg_restore --version | grep -E 'PostgreSQL\) 18'
      - name: Native dump/restore + logical and fake media parity
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile backend/tests/test_legacy_sql_057c_postgres_native_restore_lab.py
          python -B backend/tests/test_legacy_sql_057c_postgres_native_restore_lab.py -v 2>&1 | tee lot05c-postgres.log
          grep -q 'Ran 10 tests' lot05c-postgres.log
          grep -q '^OK' lot05c-postgres.log
          ! grep -E 'FAILED|ERROR|skipped=' lot05c-postgres.log
      - name: Verify exact SHA and no production code change
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || '541ca81ebc71d9b05403d0e8a52cc18fcc6c11c2' }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git diff --exit-code "$BASE_SHA" HEAD -- backend/main.py backend/database.py backend/routers/legacy_migration_v15.py backend/services/legacy_migration_gateway_v15.py alembic frontend
