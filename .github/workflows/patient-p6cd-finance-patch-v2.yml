name: Patient P6CD Finance Patch V2

on:
  pull_request:
    branches:
      - agent/patient-page-p5-documents
    paths:
      - '.github/workflows/patient-p6cd-finance-patch-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/patient-page-p6-finances-identite'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Reuse guarded P6 C/D patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/patient-p6cd-finance-patch.yml').read_text(encoding='utf-8')
          start = workflow.index("          python - <<'PY'\n") + len("          python - <<'PY'\n")
          end = workflow.index("\n          PY\n", start)
          script = textwrap.dedent(workflow[start:end])
          exec(compile(script, 'p6cd-finance-patch', 'exec'), {})
          PY
          git diff --check
      - name: Commit guarded patch
        run: |
          git config user.name 'digital-crown-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add backend/routers/patients.py frontend/src/features/patients/PatientDetailsInner.tsx frontend/src/features/patients/components/PatientFinances.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'fix(patient): harden P6 financial truth and RBAC'
          git push origin HEAD:${GITHUB_HEAD_REF}
