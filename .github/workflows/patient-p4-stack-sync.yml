name: Patient P4 Stack Sync

on:
  pull_request:
    branches:
      - agent/patient-page-p3-clinique
    paths:
      - '.github/workflows/patient-p4-stack-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    if: github.head_ref == 'agent/patient-page-p4-imagerie'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Merge current P3 base into P4 stack
        run: |
          git config user.name 'digital-crown-ci'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin agent/patient-page-p3-clinique
          git merge --no-edit origin/agent/patient-page-p3-clinique
          git push origin HEAD:${GITHUB_HEAD_REF}
