name: Client Copy Hygiene Apply

on:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/client-copy-hygiene-pr-apply.yml'
      - 'scripts/apply_client_copy_hygiene.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Apply practitioner-facing copy cleanup
        run: python scripts/apply_client_copy_hygiene.py

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Enforce client-facing copy gate
        working-directory: frontend
        run: npx vitest run src/ClientFacingCopyCandidateAudit.test.ts

      - name: Type/build verification
        working-directory: frontend
        run: npm run build:test

      - name: Commit verified cleanup
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No copy changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src
          git commit -m 'fix(ui): remove internal implementation wording from client surfaces'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
