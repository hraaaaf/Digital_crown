name: Mobile Library MOB-5E Cert

on:
  pull_request:
    branches: [master]
    paths:
      - .github/workflows/mobile-library-mob5e-cert.yml
      - frontend/src/features/mobile/**
      - frontend/src/features/clinical-ref/**
      - frontend/src/data/clinical-protocols/**
      - frontend/scripts/capture-mobile-library-mob5e.mjs
      - docs/ux/DIGITAL_CROWN_MOBILE_LIBRARY_MOB5E_*.md
  workflow_dispatch:

concurrency:
  group: mobile-library-mob5e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    name: MOB-5E contracts + build + exact BEFORE/AFTER
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record exact candidate and baseline
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test "$(git cat-file -t 9cb740bc52efc9bf734c19fefc3c4f07470eba80)" = commit
          echo "candidate=${{ github.sha }}"
          echo "baseline=9cb740bc52efc9bf734c19fefc3c4f07470eba80"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install candidate frontend
        working-directory: frontend
        run: npm ci

      - name: Verify MOB-5E contracts
        working-directory: frontend
        run: >-
          npx vitest run
          src/features/mobile/bridge.m5a.test.ts
          src/features/mobile/Dashboard/components/MobileBottomNav.test.tsx
          src/features/mobile/Dashboard/views/LibraryView.test.tsx
          src/features/mobile/mobileThemeHardcoding.test.ts

      - name: Verify production frontend build
        working-directory: frontend
        run: npm run build

      - name: Install Chromium evidence runner
        working-directory: frontend
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Prepare exact BEFORE baseline
        run: |
          git worktree add /tmp/mob5e-before 9cb740bc52efc9bf734c19fefc3c4f07470eba80
          cd /tmp/mob5e-before/frontend
          npm ci

      - name: Start exact BEFORE preview harness
        env:
          VITE_DC_PREVIEW_DEMO: "1"
        run: |
          cd /tmp/mob5e-before/frontend
          npm run dev -- --host 127.0.0.1 --port 5173 >/tmp/mob5e-before-vite.log 2>&1 &
          for i in {1..60}; do
            curl -fsS 'http://127.0.0.1:5173/mobile/demo?demo=1' >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/mob5e-before-vite.log
          exit 1

      - name: Capture and assert exact MOB-5E BEFORE
        working-directory: frontend
        env:
          MOBILE_EVIDENCE_MODE: before
          MOBILE_EVIDENCE_URL: http://127.0.0.1:5173/mobile/demo?demo=1
          MOBILE_EVIDENCE_DIR: ../artifacts/mobile-library-mob5e
        run: node scripts/capture-mobile-library-mob5e.mjs

      - name: Start candidate AFTER preview harness
        working-directory: frontend
        env:
          VITE_DC_PREVIEW_DEMO: "1"
        run: |
          npm run dev -- --host 127.0.0.1 --port 5174 >/tmp/mob5e-after-vite.log 2>&1 &
          for i in {1..60}; do
            curl -fsS 'http://127.0.0.1:5174/mobile/demo?demo=1&tab=library' >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/mob5e-after-vite.log
          exit 1

      - name: Capture and assert MOB-5E AFTER
        working-directory: frontend
        env:
          MOBILE_EVIDENCE_MODE: after
          MOBILE_EVIDENCE_URL: http://127.0.0.1:5174/mobile/demo?demo=1&tab=library
          MOBILE_EVIDENCE_DIR: ../artifacts/mobile-library-mob5e
        run: node scripts/capture-mobile-library-mob5e.mjs

      - name: Verify PNG dimensions and record evidence
        run: |
          python - <<'PY'
          from pathlib import Path
          import struct
          expected = {
              'before-plus-390x844.png': (390, 844),
              'before-plus-430x932.png': (430, 932),
              'before-plus-768x1024.png': (768, 1024),
              'after-library-list-390x844.png': (390, 844),
              'after-library-list-430x932.png': (430, 932),
              'after-library-list-768x1024.png': (768, 1024),
              'after-library-detail-390x844.png': (390, 844),
              'after-library-detail-430x932.png': (430, 932),
              'after-library-detail-768x1024.png': (768, 1024),
          }
          root = Path('artifacts/mobile-library-mob5e')
          for name, dims in expected.items():
              data = (root / name).read_bytes()
              width, height = struct.unpack('>II', data[16:24])
              if (width, height) != dims:
                  raise SystemExit(f'{name}: got {(width, height)}, expected {dims}')
              print(f'{name}: {width}x{height} OK')
          PY
          printf 'baseline=%s\ncandidate=%s\nsource=50 shared clinical protocols\nviewports=390x844,430x932,768x1024\nbefore=Plus-without-Library\nafter=Plus->Library->Extraction-molaire-detail\ncanonical_nav=preserved\nhorizontal_overflow=none-required\nruntime_errors=none-required\nscience_hub_mobile=excluded\ndeployment=none\n' '9cb740bc52efc9bf734c19fefc3c4f07470eba80' '${{ github.sha }}' > artifacts/mobile-library-mob5e/result.txt
          cp /tmp/mob5e-before-vite.log artifacts/mobile-library-mob5e/before-vite.log
          cp /tmp/mob5e-after-vite.log artifacts/mobile-library-mob5e/after-vite.log

      - uses: actions/upload-artifact@v4
        with:
          name: mobile-library-mob5e-evidence
          path: artifacts/mobile-library-mob5e
          if-no-files-found: error
          retention-days: 30