name: V1.5-02 Patient Photo Actions
on:
  pull_request:
    paths:
      - "frontend/src/features/patients/components/PatientPhotoEditor.tsx"
      - "frontend/src/features/patients/components/PatientPhotoEditor.test.tsx"
      - "frontend/scripts/certify-v15-02-patient-photo-actions.mjs"
      - ".github/workflows/v15-02-patient-photo-actions.yml"
  workflow_dispatch:
concurrency:
  group: v15-02-patient-photo-actions-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  photo-actions:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ENVIRONMENT: test
      SECRET_KEY: v15-02-photo-actions-secret-long-enough
      DATABASE_URL: sqlite:///./t2-runtime-cert.db
      DIGITALCROWN_ISOLATED_RUNTIME: "1"
      DIGITALCROWN_ISOLATION_DB_FINGERPRINT: c04779c8d18b3ac12a0f4093a47a5d0c3c0e2251714be532893cfa052e9ee780
      TELEMETRY_ENABLED: "false"
      CLOUD_AI_ENABLED: "false"
      DEBUG: "false"
      ALLOWED_ORIGINS: http://127.0.0.1:5173,http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Credential
        run: |
          echo "T2_USER=t2-browser@cabinet.ma" >> "$GITHUB_ENV"
          echo "T2_PASSWORD=$(python -c 'import secrets; print(secrets.token_urlsafe(32))')" >> "$GITHUB_ENV"
      - name: Backend deps
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.12.0 torchvision==0.27.0 --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^(torch|torchvision)([<=>].*)?$' requirements.txt >/tmp/requirements-v15-02-photo-actions.txt
          pip install -r /tmp/requirements-v15-02-photo-actions.txt
      - name: Frontend + Chromium
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start backend
        run: |
          rm -f t2-runtime-cert.db
          python scripts/t2_runtime_server.py >/tmp/v15-02-photo-actions-backend.log 2>&1 &
          for i in {1..90}; do curl -fsS http://127.0.0.1:8005/health >/dev/null && exit 0; sleep 1; done
          cat /tmp/v15-02-photo-actions-backend.log; exit 1
      - name: Start frontend
        working-directory: frontend
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 >/tmp/v15-02-photo-actions-frontend.log 2>&1 &
          for i in {1..90}; do curl -fsS http://127.0.0.1:5173 >/dev/null && exit 0; sleep 1; done
          cat /tmp/v15-02-photo-actions-frontend.log; exit 1
      - name: Run patient photo actions proof
        working-directory: frontend
        run: node scripts/run-with-t2-workstation.mjs scripts/certify-v15-02-patient-photo-actions.mjs
