name: V1-07 G2 Browser Action Certification
on:
  pull_request:
    paths:
      - "frontend/src/features/dashboard/**"
      - "frontend/src/features/patients/**"
      - "frontend/src/pages/Dashboard.tsx"
      - "frontend/scripts/certify-v1-07-g2-browser-actions.mjs"
      - "scripts/t2_runtime_server.py"
      - ".github/workflows/v1-07-g2-browser-actions.yml"
  workflow_dispatch:
concurrency:
  group: v1-07-g2-browser-actions-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  browser-actions:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      ENVIRONMENT: test
      SECRET_KEY: v1-07-g2-browser-actions-secret-000001
      DATABASE_URL: sqlite:///./t2-runtime-cert.db
      DIGITALCROWN_ISOLATED_RUNTIME: "1"
      DIGITALCROWN_ISOLATION_DB_FINGERPRINT: "c04779c8d18b3ac12a0f4093a47a5d0c3c0e2251714be532893cfa052e9ee780"
      TELEMETRY_ENABLED: "false"
      CLOUD_AI_ENABLED: "false"
      DEBUG: "false"
      ALLOWED_ORIGINS: "http://127.0.0.1:5173,http://localhost:5173"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Credential
        run: echo "T2_PASSWORD=$(python -c 'import secrets; print(secrets.token_urlsafe(32))')" >> "$GITHUB_ENV"
      - name: Backend deps
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.12.0 torchvision==0.27.0 --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^(torch|torchvision)([<=>].*)?$' requirements.txt >/tmp/requirements-g2.txt
          pip install -r /tmp/requirements-g2.txt
      - name: Frontend + Chromium
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start backend
        run: |
          rm -f t2-runtime-cert.db
          python scripts/t2_runtime_server.py >/tmp/g2-backend.log 2>&1 &
          for i in {1..90}; do curl -fsS http://127.0.0.1:8005/health >/dev/null && exit 0; sleep 1; done
          cat /tmp/g2-backend.log; exit 1
      - name: Start frontend
        working-directory: frontend
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 >/tmp/g2-frontend.log 2>&1 &
          for i in {1..90}; do curl -fsS http://127.0.0.1:5173 >/dev/null && exit 0; sleep 1; done
          cat /tmp/g2-frontend.log; exit 1
      - name: Certify Dashboard and Patients actions
        working-directory: frontend
        run: node scripts/certify-v1-07-g2-browser-actions.mjs
