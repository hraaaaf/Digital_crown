name: Patient P4C Imaging Trash Patch V2

on:
  pull_request:
    branches:
      - agent/patient-page-p3-clinique
    paths:
      - '.github/workflows/patient-p4c-imaging-trash-patch-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/patient-page-p4-imagerie'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply recoverable imaging lifecycle with correct P3 ancestry
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess, textwrap

          source_commit = '3f5669bfd941edb5b3635ca97639b1fb92f69ec2'
          workflow = subprocess.check_output(
              ['git', 'show', f'{source_commit}:.github/workflows/patient-p4c-imaging-trash-patch.yml'],
              text=True,
          )
          start = workflow.index("          python - <<'PY'\n") + len("          python - <<'PY'\n")
          end = workflow.index("\n          PY\n", start)
          script = textwrap.dedent(workflow[start:end])

          # P3 owns e6f7a8b9c0d1 for Master Plan revisions. P4C must extend it.
          script = script.replace('e6f7a8b9c0d1_add_imaging_trash_fields.py', 'f7a8b9c0d1e2_add_imaging_trash_fields.py')
          script = script.replace('Revision ID: e6f7a8b9c0d1', 'Revision ID: f7a8b9c0d1e2')
          script = script.replace('revision: str = "e6f7a8b9c0d1"', 'revision: str = "f7a8b9c0d1e2"')
          script = script.replace('Revises: d5e6f7a8b9c0', 'Revises: e6f7a8b9c0d1')
          script = script.replace('down_revision: Union[str, None] = "d5e6f7a8b9c0"', 'down_revision: Union[str, None] = "e6f7a8b9c0d1"')

          exec(compile(script, 'patient-p4c-imaging-trash-patch-v2', 'exec'), {})

          # Tenant ownership of background memories must remain cabinet-scoped.
          ia_path = Path('backend/routers/ia.py')
          ia = ia_path.read_text(encoding='utf-8')
          ia = ia.replace(
              'background_tasks.add_task(_background_tasks_radio, patient_id, current_user.id)',
              'background_tasks.add_task(_background_tasks_radio, patient_id, current_user.get_employer_id())',
          )
          ia = ia.replace(
              'background_tasks.add_task(_background_tasks_pano, patient_id, current_user.id)',
              'background_tasks.add_task(_background_tasks_pano, patient_id, current_user.get_employer_id())',
          )
          ia_path.write_text(ia, encoding='utf-8')

          # CMO remains deterministic/non-prescriptive, but trashed imaging is not active evidence.
          cmo_path = Path('backend/services/cmo_agent_service.py')
          cmo = cmo_path.read_text(encoding='utf-8')
          cmo = cmo.replace(
              '.filter(models.PanoramicAnalysis.patient_id == patient_id)\n            .order_by(models.PanoramicAnalysis.created_at.desc())',
              '.filter(\n                models.PanoramicAnalysis.patient_id == patient_id,\n                models.PanoramicAnalysis.deleted_at.is_(None),\n            )\n            .order_by(models.PanoramicAnalysis.created_at.desc())',
              1,
          )
          cmo = cmo.replace(
              '.filter(models.CephaloAnalysis.patient_id == patient_id)\n            .order_by(models.CephaloAnalysis.created_at.desc())',
              '.filter(\n                models.CephaloAnalysis.patient_id == patient_id,\n                models.CephaloAnalysis.deleted_at.is_(None),\n            )\n            .order_by(models.CephaloAnalysis.created_at.desc())',
              1,
          )
          cmo_path.write_text(cmo, encoding='utf-8')
          PY
          python -m compileall -q backend alembic/versions/f7a8b9c0d1e2_add_imaging_trash_fields.py
          git diff --check

      - name: Verify P4C migration and lifecycle contract
        run: |
          python - <<'PY'
          from pathlib import Path
          migration = Path('alembic/versions/f7a8b9c0d1e2_add_imaging_trash_fields.py').read_text(encoding='utf-8')
          assert 'revision: str = "f7a8b9c0d1e2"' in migration
          assert 'down_revision: Union[str, None] = "e6f7a8b9c0d1"' in migration
          ia = Path('backend/routers/ia.py').read_text(encoding='utf-8')
          models = Path('backend/models.py').read_text(encoding='utf-8')
          cmo = Path('backend/services/cmo_agent_service.py').read_text(encoding='utf-8')
          for required in ['panoramic-trash', 'cephalo-trash', '/panoramic/{analysis_id}/restore', '/cephalo/{analysis_id}/restore']:
              assert required in ia, required
          assert 'db.delete(analysis)' not in ia
          assert 'os.remove(file_abs_path)' not in ia
          assert models.count('deleted_at: Mapped[Optional[datetime]]') >= 3
          assert ia.count('current_user.get_employer_id())') >= 2
          assert 'models.PanoramicAnalysis.deleted_at.is_(None)' in cmo
          assert 'models.CephaloAnalysis.deleted_at.is_(None)' in cmo
          PY

      - name: Commit P4C recoverable lifecycle
        run: |
          git config user.name 'digital-crown-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add backend/models.py backend/schemas/clinical.py backend/schemas/panoramic.py backend/routers/ia.py backend/services/cmo_agent_service.py backend/services/patient_journey_service.py alembic/versions/f7a8b9c0d1e2_add_imaging_trash_fields.py
          git diff --cached --quiet && exit 0
          git commit -m 'fix(patient): make P4 imaging deletion recoverable'
          git push origin HEAD:${GITHUB_HEAD_REF}
