name: Mobile M6.2 Offline Truth Stage

on:
  push:
    branches: [audit/mobile-m6-generator]
    paths: [.github/workflows/mobile-m62-stage.yml]

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    env:
      BASE_SHA: 2bf0f639b198b5aacdd1f797f62ea9ac11aa9cff
      PRODUCT_SHA: 1015cbe9eb22ee7b7b30c0ae9f4430a55db3eead
      PRODUCT_BRANCH: mobile/m6-security-first
      STAGE_BRANCH: audit/mobile-m62-stage
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/mobile-m6-generator
          fetch-depth: 0

      - name: Build and verify M6.2 candidate
        run: |
          set -euo pipefail
          git fetch origin master "$PRODUCT_BRANCH" "$STAGE_BRANCH"
          test "$(git rev-parse origin/master)" = "$BASE_SHA"
          test "$(git rev-parse origin/$PRODUCT_BRANCH)" = "$PRODUCT_SHA"
          test "$(git rev-parse origin/$STAGE_BRANCH)" = "$PRODUCT_SHA"

          git worktree add --detach /tmp/m62 "$PRODUCT_SHA"
          cd /tmp/m62
          python "$GITHUB_WORKSPACE/.github/m6/m62_transform.py"

          python -m py_compile backend/routers/mobile_legacy.py backend/tests/test_mobile_router.py
          git diff --check

          git add -N frontend/src/services/zka/mobileFetch.ts frontend/src/test/mobileM62OfflineTruth.test.ts
          git diff --name-only | sort > /tmp/actual-m62-paths
          cat > /tmp/expected-m62-paths <<'EOF'
          backend/routers/mobile_legacy.py
          backend/tests/test_mobile_router.py
          frontend/public/sw.js
          frontend/src/features/mobile/Dashboard/hooks/useMobileDashboard.ts
          frontend/src/features/mobile/Dashboard/views/DentistsView.tsx
          frontend/src/features/mobile/Dashboard/views/MobileSuperAdminView.tsx
          frontend/src/main.tsx
          frontend/src/services/api.ts
          frontend/src/services/zka/MobileStorage.ts
          frontend/src/services/zka/mobileFetch.ts
          frontend/src/test/mobileM62OfflineTruth.test.ts
          frontend/vite.config.ts
          EOF
          sed -i 's/^          //' /tmp/expected-m62-paths
          diff -u /tmp/expected-m62-paths /tmp/actual-m62-paths

          test ! -e frontend/public/sw.js
          grep -q "runtimeCaching: \[\]" frontend/vite.config.ts
          ! grep -q "serviceWorker.register('/sw.js')" frontend/src/main.tsx
          grep -q 'zka_action_queue_v2' frontend/src/services/zka/MobileStorage.ts
          grep -q 'cabinetPublicId' frontend/src/services/zka/MobileStorage.ts
          grep -q 'deviceId' frontend/src/services/zka/MobileStorage.ts
          grep -q 'MobileStorage.refreshCredentials()' frontend/src/services/api.ts
          grep -q 'X-Mobile-Action-Id' frontend/src/features/mobile/Dashboard/hooks/useMobileDashboard.ts
          grep -q "already_absent': True" backend/routers/mobile_legacy.py
          grep -q 'mobileM62OfflineTruth' <(find frontend/src/test -maxdepth 1 -type f -printf '%f\n')

      - name: Materialize audit staging only
        run: |
          set -euo pipefail
          cd /tmp/m62
          git config user.name "Digital Crown M6 Audit"
          git config user.email "123034021+hraaaaf@users.noreply.github.com"
          git add -A -- \
            backend/routers/mobile_legacy.py \
            backend/tests/test_mobile_router.py \
            frontend/public/sw.js \
            frontend/src/features/mobile/Dashboard/hooks/useMobileDashboard.ts \
            frontend/src/features/mobile/Dashboard/views/DentistsView.tsx \
            frontend/src/features/mobile/Dashboard/views/MobileSuperAdminView.tsx \
            frontend/src/main.tsx \
            frontend/src/services/api.ts \
            frontend/src/services/zka/MobileStorage.ts \
            frontend/src/services/zka/mobileFetch.ts \
            frontend/src/test/mobileM62OfflineTruth.test.ts \
            frontend/vite.config.ts
          test "$(git diff --cached --name-only | wc -l)" -eq 12
          git commit -m "audit(m6.2): stage offline truth candidate"
          git push --force-with-lease="refs/heads/$STAGE_BRANCH:$PRODUCT_SHA" origin "HEAD:refs/heads/$STAGE_BRANCH"
