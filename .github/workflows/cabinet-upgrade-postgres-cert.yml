name: Cabinet Upgrade PostgreSQL Certification

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cabinet-upgrade-postgres-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  postgres-18-upgrade-gate:
    name: PostgreSQL 18 + immutable release invariants
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cabinet_compat
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cabinet_compat"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/cabinet_compat
      CABINET_COMPAT_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/cabinet_compat
      SECRET_KEY: cabinet-upgrade-ci-secret-key-not-for-production
      SUPERADMIN_EMAIL: ci-admin@example.invalid
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Parse PowerShell release guards
        shell: pwsh
        run: |
          $failed = $false
          foreach ($script in @(
            "backend/scripts/create_release.ps1",
            "backend/scripts/run_real_backend.ps1"
          )) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script), [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Error "$script parse errors: $($errors | Out-String)"
            }
          }
          if ($failed) { exit 1 }

      - name: Run cabinet preservation and release-policy gates on PostgreSQL 18
        run: |
          python -m pytest \
            backend/tests/test_cabinet_upgrade_compatibility.py \
            backend/tests/test_cabinet_upgrade_postgres.py \
            backend/tests/test_clinic_local_data_preservation.py \
            backend/tests/test_certified_release_policy.py \
            -q

  windows-powershell-51-release-guard:
    name: Windows PowerShell 5.1 release guards
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse guards with Windows PowerShell 5.1
        shell: powershell
        run: |
          if ($PSVersionTable.PSVersion.Major -ne 5) {
            throw "Expected Windows PowerShell 5.1, got $($PSVersionTable.PSVersion)"
          }
          foreach ($script in @(
            "backend/scripts/create_release.ps1",
            "backend/scripts/run_real_backend.ps1"
          )) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script), [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              throw "$script parse errors: $($errors | Out-String)"
            }
          }

      - name: Preserve Windows PowerShell 5.1 API compatibility
        shell: powershell
        run: |
          $creator = Get-Content backend/scripts/create_release.ps1 -Raw
          if ($creator -match '\[IO\.Path\]::GetRelativePath') {
            throw "[IO.Path]::GetRelativePath is not allowed on the Windows PowerShell 5.1 cabinet path"
          }
          if ($creator -notmatch 'Substring\(\$payloadRootResolved\.Length\)') {
            throw "Expected PowerShell 5.1-compatible relative path derivation is missing"
          }
