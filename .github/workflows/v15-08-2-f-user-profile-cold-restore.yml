name: LOT08.2-F explicit user profile and Windows cold-restore FUE LAB

on:
  push:
    branches:
      - feat/v15-08-2-f-user-profile-cold-restore-lab-20261110
    paths:
      - .github/workflows/v15-08-2-f-user-profile-cold-restore.yml
      - queue_core/tests/test_activation_source_08_2_f.py
      - scripts/quality/lot08_2_f_*
  pull_request:
    paths:
      - .github/workflows/v15-08-2-f-user-profile-cold-restore.yml
      - queue_core/tests/test_activation_source_08_2_f.py
      - scripts/quality/lot08_2_f_*

permissions:
  contents: read

jobs:
  linux-source-and-queue-core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 25
          persist-credentials: false
      - name: Exact source SHA and five added-only paths
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --name-only bb3c92b9b8c7a56ecd5f60bf9c1d52c578f2f3a4 HEAD | sort > actual.txt
          cat > expected.txt <<'EOF'
          .github/workflows/v15-08-2-f-user-profile-cold-restore.yml
          queue_core/tests/test_activation_source_08_2_f.py
          scripts/quality/lot08_2_f_activation_source_lab.py
          scripts/quality/lot08_2_f_user_process_probe.py
          scripts/quality/lot08_2_f_windows_user_profile_lab.ps1
          EOF
          diff -u expected.txt actual.txt
          test ! -e dist/DigitalCrownSetup.exe
          echo "LOT08F_FIVE_FILE_EXACT_HEAD_SOURCE_ONLY_PASS=$GITHUB_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pinned Queue Core test dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          'pytest==9.0.3' 'SQLAlchemy==2.0.28' 'tzdata==2025.2'
          'fastapi==0.115.6' 'starlette==0.41.3'
          'pydantic==2.6.3' 'httpx==0.28.1' 'anyio==4.12.1'
      - name: Full Queue Core and activation source negative regression
        run: python -m pytest -q queue_core/tests --maxfail=1 --junitxml=lot08f-linux.xml
      - name: Archive JUnit source-only proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lot08f-linux-junit
          path: lot08f-linux.xml
          if-no-files-found: error
          retention-days: 7

  windows-real-user-cold-restore:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check Windows SHA and forbid installed build
        shell: pwsh
        run: |
          if ((git rev-parse HEAD) -ne $env:GITHUB_SHA) { throw 'HEAD_MISMATCH' }
          if (Test-Path 'dist/DigitalCrownSetup.exe') { throw 'INSTALLABLE_FORBIDDEN' }
      - name: Test source-only negative activation invariants
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check 'pytest==9.0.3'
          python -m pytest -q queue_core/tests/test_activation_source_08_2_f.py --maxfail=1 --junitxml=lot08f-windows-contract.xml
      - name: True standard user process / Windows NTFS / cold restore FUE
        shell: pwsh
        run: ./scripts/quality/lot08_2_f_windows_user_profile_lab.ps1
      - name: Archive sanitized evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lot08f-windows-user-and-cold-restore
          path: |
            lot08f-windows-contract.xml
            ${{ runner.temp }}/lot08_2_f_windows_user_profile_evidence.json
          if-no-files-found: error
          retention-days: 7
