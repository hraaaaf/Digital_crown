name: Harden Honoraires Edit Hydration

on:
  push:
    branches: [fix/document-archive-consistency]
    paths:
      - '.github/workflows/document-edit-hydration-hardening.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/document-archive-consistency
          fetch-depth: 0
      - name: Preserve legacy accounting and reminder state
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path); text=p.read_text(); count=text.count(old)
              if count != 1: raise SystemExit(f'{path}: expected one match, got {count}: {old[:100]!r}')
              p.write_text(text.replace(old,new,1))

          replace_once(
              'backend/routers/patients.py',
              '''            "is_accounted": bool(doc.is_accounted),\n''',
              '''            "is_accounted": True if doc.is_accounted is None else bool(doc.is_accounted),\n''',
          )
          replace_once(
              'frontend/src/features/admin/DocumentHub.tsx',
              '''  installments?: { date?: string; dueDate?: string; amount?: number; label?: string }[];\n''',
              '''  installments?: { date?: string; dueDate?: string; amount?: number; label?: string; sendReminder?: boolean }[];\n''',
          )
          replace_once(
              'frontend/src/features/admin/DocumentHub.tsx',
              '''          label: inst.label || `Échéance ${idx + 1}`,\n        })));\n''',
              '''          label: inst.label || `Échéance ${idx + 1}`,\n          sendReminder: Boolean(inst.sendReminder),\n        })));\n''',
          )
          PY
          python -m py_compile backend/routers/patients.py
          grep -q 'True if doc.is_accounted is None' backend/routers/patients.py
          grep -q 'sendReminder: Boolean(inst.sendReminder)' frontend/src/features/admin/DocumentHub.tsx
      - name: Commit and remove one-shot workflow
        run: |
          rm .github/workflows/document-edit-hydration-hardening.yml
          git config user.name 'Digital Crown CI'
          git config user.email 'actions@users.noreply.github.com'
          git add backend/routers/patients.py frontend/src/features/admin/DocumentHub.tsx .github/workflows/document-edit-hydration-hardening.yml
          git commit -m 'Preserve financial edit hydration semantics'
          git push origin HEAD:fix/document-archive-consistency
