name: Patient P3 Clinique Backend

on:
  pull_request:
    branches:
      - agent/patient-page-p2-journey
    paths:
      - 'backend/__init__.py'
      - 'backend/models_clinical_p3.py'
      - 'backend/routers/__init__.py'
      - 'backend/routers/patient_odontogram.py'
      - 'backend/schemas/odontogram.py'
      - 'backend/tests/test_patient_p3_odontogram.py'
      - 'alembic/versions/d5e6f7a8b9c0_add_patient_odontograms.py'
      - '.github/workflows/patient-p3-clinique-backend.yml'

permissions:
  contents: read

jobs:
  p3a-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ENVIRONMENT: test
      SECRET_KEY: patient-p3-backend-secret-0001
      DATABASE_URL: sqlite:///./p3-backend-test.db
      TELEMETRY_ENABLED: 'false'
      CLOUD_AI_ENABLED: 'false'
      DEBUG: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.12.0 torchvision==0.27.0 --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^(torch|torchvision)([<=>].*)?$' requirements.txt > /tmp/requirements-p3-backend.txt
          pip install -r /tmp/requirements-p3-backend.txt
          pip install httpx==0.27.2 pytest alembic

      - name: Source contract
        run: |
          python - <<'PY'
          from backend import models
          assert 'patient_odontograms' in models.Base.metadata.tables
          from backend.main import app
          paths = {route.path for route in app.routes}
          assert '/api/patients/{patient_id}/odontogram' in paths
          PY

      - name: Alembic single head and upgrade
        run: |
          test "$(alembic heads | wc -l)" -eq 1
          rm -f p3-backend-test.db
          alembic upgrade head

      - name: P3-A targeted tests
        run: pytest -q backend/tests/test_patient_p3_odontogram.py
