name: Patient P3 Clinique Backend

on:
  pull_request:
    branches:
      - agent/patient-page-p2-journey
    paths:
      - 'backend/__init__.py'
      - 'backend/models_clinical_p3.py'
      - 'backend/routers/__init__.py'
      - 'backend/routers/patient_odontogram.py'
      - 'backend/routers/patient_clinical_conclusions.py'
      - 'backend/schemas/odontogram.py'
      - 'backend/schemas/clinical_conclusion.py'
      - 'backend/tests/test_patient_p3_odontogram.py'
      - 'backend/tests/test_patient_p3_clinical_conclusions.py'
      - 'alembic/versions/d5e6f7a8b9c0_add_patient_odontograms.py'
      - '.github/workflows/patient-p3-clinique-backend.yml'

permissions:
  contents: read

jobs:
  p3-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ENVIRONMENT: test
      SECRET_KEY: patient-p3-backend-secret-0001
      DATABASE_URL: sqlite:///./p3-backend-test.db
      TELEMETRY_ENABLED: 'false'
      CLOUD_AI_ENABLED: 'false'
      DEBUG: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.12.0 torchvision==0.27.0 --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^(torch|torchvision)([<=>].*)?$' requirements.txt > /tmp/requirements-p3-backend.txt
          pip install -r /tmp/requirements-p3-backend.txt
          pip install httpx==0.27.2 pytest alembic

      - name: Source and API contract
        run: |
          python - <<'PY'
          from backend import models
          assert 'patient_odontograms' in models.Base.metadata.tables
          assert 'clinical_conclusions' in models.Base.metadata.tables
          from backend.main import app
          paths = {route.path for route in app.routes}
          assert '/api/patients/{patient_id}/odontogram' in paths
          assert '/api/patients/{patient_id}/clinical-conclusions' in paths
          PY

      - name: P3 migration structural contract
        run: |
          test "$(alembic heads | wc -l)" -eq 1
          python - <<'PY'
          from pathlib import Path
          from sqlalchemy import create_engine, inspect
          from backend import models

          migration = Path('alembic/versions/d5e6f7a8b9c0_add_patient_odontograms.py').read_text(encoding='utf-8')
          assert 'revision: str = "d5e6f7a8b9c0"' in migration
          assert 'down_revision: Union[str, None] = "c4d5e6f7a8b9"' in migration
          for table in ('patient_odontograms', 'clinical_conclusions'):
              assert f'"{table}"' in migration

          # The repository's historical clean-db Alembic chain currently fails before P3
          # in legacy revision 8f6465e49d90 (missing SQLite index). Do not turn that
          # pre-existing defect into a false P3 failure. Validate the P3 runtime schema
          # from canonical SQLAlchemy metadata instead, while still enforcing one Alembic head
          # and exact P3 revision ancestry/source above.
          engine = create_engine('sqlite:///:memory:')
          models.Base.metadata.create_all(engine)
          inspector = inspect(engine)
          assert 'patient_odontograms' in inspector.get_table_names()
          assert 'clinical_conclusions' in inspector.get_table_names()

          odonto_cols = {c['name'] for c in inspector.get_columns('patient_odontograms')}
          assert {'patient_id','dentition_type','state','revision','updated_by','created_at','updated_at'} <= odonto_cols
          conclusion_cols = {c['name'] for c in inspector.get_columns('clinical_conclusions')}
          assert {'patient_id','conclusion_text','proposal_text','proposal_source','validated_by','created_at'} <= conclusion_cols
          PY

      - name: P3 targeted clinical persistence tests
        run: |
          pytest -q \
            backend/tests/test_patient_p3_odontogram.py \
            backend/tests/test_patient_p3_clinical_conclusions.py
