name: Temporary CI post-merge policy patch

on:
  push:
    branches: [ci/post-merge-backend-heavy]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/post-merge-backend-heavy
          fetch-depth: 0

      - name: Move heavy generic backend gates to post-merge
        run: |
          python - <<'PY'
          from pathlib import Path

          ci = Path('.github/workflows/ci.yml')
          text = ci.read_text()
          old = """jobs:\n  test:\n    name: Tests & durcissement\n"""
          new = """jobs:\n  # Generic full backend regression is intentionally post-merge.\n  # PRs keep targeted lot checks plus frontend/build and the lightweight prod gate.\n  test:\n    if: >-\n      github.event_name == 'workflow_dispatch' ||\n      (github.event_name == 'push' &&\n       (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'))\n    name: Full backend regression (post-merge)\n"""
          if text.count(old) != 1:
              raise SystemExit(f'ci.yml anchor mismatch: {text.count(old)}')
          ci.write_text(text.replace(old, new, 1))

          pg = Path('.github/workflows/cabinet-upgrade-postgres-cert.yml')
          text = pg.read_text()
          old_trigger = """on:\n  pull_request:\n  workflow_dispatch:\n"""
          new_trigger = """on:\n  push:\n    branches: [main, master]\n  workflow_dispatch:\n"""
          if text.count(old_trigger) != 1:
              raise SystemExit(f'postgres trigger anchor mismatch: {text.count(old_trigger)}')
          text = text.replace(old_trigger, new_trigger, 1)
          old_group = 'group: cabinet-upgrade-postgres-${{ github.event.pull_request.number || github.ref }}'
          new_group = 'group: cabinet-upgrade-postgres-${{ github.ref }}'
          if text.count(old_group) != 1:
              raise SystemExit(f'postgres concurrency anchor mismatch: {text.count(old_group)}')
          pg.write_text(text.replace(old_group, new_group, 1))
          PY

      - name: Remove temporary patch workflow
        run: git rm .github/workflows/_tmp-ci-post-merge-policy-patch.yml

      - name: Commit policy change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml .github/workflows/cabinet-upgrade-postgres-cert.yml
          git diff --cached --check
          git commit -m "ci: move heavy backend gates post-merge"
          git push origin HEAD:ci/post-merge-backend-heavy
