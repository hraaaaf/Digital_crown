name: P6 Mendeley V3 Provenance Probe

on:
  push:
    branches:
      - portability/p6-scientific-assets-refresh
    paths:
      - scripts/p6_mendeley_v3_provenance_probe.py
      - .github/workflows/p6-mendeley-v3-provenance-probe.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p6-mendeley-v3-provenance-probe
  cancel-in-progress: false

jobs:
  source-files-and-annotations:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact research HEAD
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Probe exact Mendeley V3 source and annotation semantics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p p6-mendeley-v3/evidence
          python scripts/p6_mendeley_v3_provenance_probe.py \
            --out p6-mendeley-v3/evidence/manifest.json

      - name: Validate compact provenance evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("p6-mendeley-v3/evidence/manifest.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          ann = data["annotations"]

          assert data["schema_version"] == 2
          assert data["dataset"]["id"] == "73n3kz2k4k"
          assert data["dataset"]["version"] == 3
          assert data["dataset"]["doi"] == "10.17632/73n3kz2k4k.3"
          assert data["file_count"] == len(data["files"])
          assert data["file_count"] > 0
          assert ann["metadata_image_count"] > 0
          assert isinstance(ann["annotated_images"], list)
          assert isinstance(ann["teeth_raw_value_counts"], dict)
          assert isinstance(ann["teeth_scalar_token_counts"], dict)
          assert isinstance(ann["fdi_code_counts"], dict)
          assert isinstance(ann["non_fdi_token_counts"], dict)
          assert isinstance(ann["source_fdi_labels_present"], bool)
          assert isinstance(ann["all_teeth_tokens_are_fdi"], bool)
          assert isinstance(ann["fdi_coverage_complete"], bool)
          assert isinstance(data["interpretation"]["direct_fdi_ground_truth_ready"], bool)

          for item in data["files"]:
              assert len(item["sha256"]) == 64
              assert item["size_bytes"] > 0
              if item["declared_size_bytes"] is not None:
                  assert int(item["declared_size_bytes"]) == int(item["size_bytes"])

          print(json.dumps({
              "status": "PASS",
              "file_count": data["file_count"],
              "total_downloaded_bytes": data["total_downloaded_bytes"],
              "annotated_image_count": ann["annotated_image_count"],
              "total_regions": ann["total_regions"],
              "teeth_attribute_region_count": ann["teeth_attribute_region_count"],
              "teeth_scalar_token_counts": ann["teeth_scalar_token_counts"],
              "fdi_code_counts": ann["fdi_code_counts"],
              "non_fdi_token_counts": ann["non_fdi_token_counts"],
              "fdi_labeled_region_count": ann["fdi_labeled_region_count"],
              "source_fdi_labels_present": ann["source_fdi_labels_present"],
              "all_teeth_tokens_are_fdi": ann["all_teeth_tokens_are_fdi"],
              "fdi_coverage_complete": ann["fdi_coverage_complete"],
              "direct_fdi_ground_truth_ready": data["interpretation"]["direct_fdi_ground_truth_ready"],
          }, indent=2))
          PY

      - name: Prove product tree stayed untouched
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- backend frontend
          git status --short

      - name: Upload compact evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p6-mendeley-v3-provenance
          path: p6-mendeley-v3/evidence
          if-no-files-found: warn
          retention-days: 14
