name: P2-D canonical closeout

on:
  push:
    branches:
      - work-20260815-p2d-closeout

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Close P2-D canonical docs
        run: |
          if git log -1 --pretty=%B | grep -q '\[p2d-closeout-done\]'; then
            echo 'Already patched.'
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path

          roadmap = Path('DOCUMENT_STUDIO_ROADMAP.md')
          text = roadmap.read_text(encoding='utf-8')
          old = "- **P2-D — Odontogramme/déduplication/prix groupe** : policy préparée en PR draft `#33`, banc CI `31884472613` 3/3 SUCCESS ; intégration au callback legacy actif encore requise."
          new = """- **P2-D — Odontogramme/déduplication/prix groupe** : ✅ **engineering fermé**.\n  - PR finale `#47` — MERGED ; ancienne PR préparatoire `#33` fermée sans merge.\n  - Head final certifié : `2698f3d508c57ca07a410706d05855adba3bc392`.\n  - CI exacte : run `31902205419` — **3/3 SUCCESS**.\n  - Frontend tests/build : ✅ SUCCESS.\n  - Backend tests/durcissement : ✅ SUCCESS.\n  - Garde production négative : ✅ SUCCESS.\n  - Merge `master` : `021ee425a532bb83ae9669ab4c449522258bdcc6`.\n  - Le flux actif remplace idempotemment les traitements par dent via une clé stable `dent::traitement`, préserve les autres dents et les lignes manuelles, autorise la suppression du dernier traitement d’une dent déjà renseignée, conserve le libellé de surface existant si aucune nouvelle surface n’est fournie et refuse l’ajout silencieux d’un acte groupé à `0 MAD`.\n  - **Aucune interaction authentifiée runtime, certification clinique ou certification financière production n’est revendiquée.**"""
          if text.count(old) != 1:
              raise SystemExit(f'roadmap P2-D match count: {text.count(old)}')
          roadmap.write_text(text.replace(old, new, 1), encoding='utf-8')

          audit = Path('docs/audits/DOCUMENT_STUDIO_P2_DEVIS_HONORAIRES_AUDIT.md')
          text = audit.read_text(encoding='utf-8')
          text = text.replace(
              '- **TESTS EXÉCUTÉS** : P2-A, P2-B, P2-C, P2-E et P2-F certifiés par CI exacte ; P2-D reste à intégrer/recertifier sur son head final.',
              '- **TESTS EXÉCUTÉS** : P2-A, P2-B, P2-C, P2-D, P2-E et P2-F certifiés par CI exacte.',
              1,
          )
          start = text.index('## P2-D — Odontogramme / modes / déduplication')
          end = text.index('\n---\n\n## P2-E', start)
          replacement = """## P2-D — Odontogramme / modes / déduplication — CLOSED ✅\n\n### Défauts vérifiés\nTrois modes sont présents : `individual`, `group` et `ortho`. Le callback legacy de synchronisation odontogramme existait mais était orphelin, tandis que `TreatmentSelector` ajoutait directement des lignes. En mode groupe, certains actes pouvaient être ajoutés avec `PriceBrain.suggestPrice(act) || 0`, donc à `0 MAD` si aucun prix positif n’était connu.\n\n### Correctif fusionné\n- clé stable `dent::traitement` ;\n- remplacement idempotent **par dent** qui préserve les autres dents et les lignes manuelles ;\n- réouverture d’une dent avec ses traitements déjà liés ;\n- possibilité de supprimer le dernier traitement uniquement pour une dent déjà renseignée (`allowEmptyConfirm` reste `false` par défaut ailleurs) ;\n- conservation du libellé de surface existant lorsqu’aucune nouvelle surface n’est renvoyée ;\n- refus explicite d’un acte groupé sans prix positif connu au lieu d’un ajout silencieux à `0 MAD` ;\n- tests de policy et de wiring sur le composant legacy actif.\n\n### Preuve engineering finale\n- ancienne PR préparatoire `#33` : fermée sans merge ;\n- PR finale `#47` — **MERGED** ;\n- head final certifié : `2698f3d508c57ca07a410706d05855adba3bc392` ;\n- CI exacte : run `31902205419` — **3/3 SUCCESS** ;\n- Frontend tests/build : ✅ SUCCESS ;\n- Backend tests/durcissement : ✅ SUCCESS ;\n- Garde production négative : ✅ SUCCESS ;\n- merge `master` : `021ee425a532bb83ae9669ab4c449522258bdcc6`.\n\n**Aucune interaction authentifiée dans l’application locale réelle, certification clinique ou certification financière production n’est revendiquée par cette fermeture engineering.**\n"""
          text = text[:start] + replacement + text[end:]
          text = text.replace(
              '6. **P2-D — Odontogramme/déduplication/prix groupe** — prochain lot engineering.\n7. Recertification runtime ciblée.',
              '6. **P2-D — Odontogramme/déduplication/prix groupe** — ✅ CLOSED.\n7. Recertification runtime ciblée — reste ouverte.',
              1,
          )
          audit.write_text(text, encoding='utf-8')
          PY

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DOCUMENT_STUDIO_ROADMAP.md docs/audits/DOCUMENT_STUDIO_P2_DEVIS_HONORAIRES_AUDIT.md
          git commit -m "P2-D: close canonical docs [p2d-closeout-done]"
          git push
