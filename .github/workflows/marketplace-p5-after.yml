name: Marketplace Final Certification

on:
  pull_request:
    paths:
      - "backend/**/*marketplace*"
      - "backend/**/*partner*"
      - "frontend/src/features/partnerMarketplace/**"
      - "frontend/src/features/mobile/Dashboard/views/MarketplaceView*"
      - "frontend/src/features/mobile/Dashboard/MobileDashboard.tsx"
      - "frontend/src/features/mobile/Dashboard/MobilePreviewDashboard.tsx"
      - "frontend/src/features/mobile/Dashboard/components/MobileBottomNav*"
      - "frontend/src/features/mobile/Dashboard/types.tsx"
      - "frontend/src/features/mobile/bridge*"
      - "frontend/src/pages/PartnerMarketplacePage.tsx"
      - "frontend/scripts/capture-mobile-marketplace-mob5g.mjs"
      - "docs/marketplace/P5_UI_REFERENCE.md"
      - "docs/marketplace/P5_UI_REFERENCE.svg"
      - "docs/ux/DIGITAL_CROWN_MOBILE_MARKETPLACE_MOB5G_GOAL_UI.md"
      - "requirements.txt"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - ".github/workflows/marketplace-p5-after.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marketplace-final-cert-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-regression:
    name: Backend Marketplace P1-P10
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SECRET_KEY: marketplace-final-cert-secret-key-minimum-32-characters
      DATABASE_URL: "sqlite:///:memory:"
      ENVIRONMENT: development
      TELEMETRY_ENABLED: "false"
      CLOUD_AI_ENABLED: "false"
    steps:
      - name: Checkout exact candidate HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Prove exact candidate HEAD
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.12.0 torchvision==0.27.0 --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^(torch|torchvision)([<=>].*)?$' requirements.txt > /tmp/requirements-marketplace-final.txt
          pip install -r /tmp/requirements-marketplace-final.txt
          pip install httpx==0.27.2 pytest pytest-asyncio

      - name: Run Marketplace P1-P10 regression contracts
        run: |
          python -m pytest -q --maxfail=1 \
            backend/tests/test_partner_catalog_visibility.py \
            backend/tests/test_partner_orders_integrity.py \
            backend/tests/test_partner_order_engine.py \
            backend/tests/test_partner_order_split.py \
            backend/tests/test_partner_catalog_query.py \
            backend/tests/test_partner_dispatch.py \
            backend/tests/test_partner_procurement.py \
            backend/tests/test_partner_receipts.py \
            backend/tests/test_partner_receipts_hardening.py \
            backend/tests/test_marketplace_stock_intelligence.py \
            backend/tests/test_marketplace_stock_receipt_bridge.py \
            backend/tests/test_marketplace_finance.py \
            backend/tests/test_marketplace_supplier_sync.py \
            backend/tests/test_marketplace_supplier_sync_audit_snapshot.py \
            backend/tests/test_marketplace_supplier_sync_http.py \
            backend/tests/test_marketplace_supplier_sync_local_ambiguity.py \
            backend/tests/test_marketplace_superadmin_catalog.py \
            backend/tests/test_marketplace_superadmin_governance.py \
            backend/tests/test_marketplace_superadmin_http.py \
            backend/tests/test_marketplace_superadmin_security.py

  frontend-regression:
    name: Frontend Marketplace truth + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout exact candidate HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Prove exact candidate HEAD
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Setup Node 20
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run Marketplace frontend regression contracts
        run: |
          npm test -- \
            src/features/partnerMarketplace/data.test.ts \
            src/features/partnerMarketplace/usePartnerMarketplace.test.tsx \
            src/features/mobile/Dashboard/views/MarketplaceView.test.tsx \
            src/features/mobile/Dashboard/components/MobileBottomNav.test.tsx \
            src/features/mobile/bridge.m5a.test.ts

      - name: Build frontend
        run: npm run build

  visual-certification:
    name: Marketplace visual 390/430/768/1280
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Record exact candidate HEAD
        run: |
          PRODUCT_HEAD=$(git rev-parse HEAD)
          test "$PRODUCT_HEAD" = "${{ github.event.pull_request.head.sha || github.sha }}"
          echo "PRODUCT_HEAD=$PRODUCT_HEAD" >> "$GITHUB_ENV"

      - name: Setup Node 20
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend and Chromium
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.62.1
          npx playwright install --with-deps chromium

      - name: Capture Marketplace current visual evidence
        working-directory: frontend
        env:
          PRODUCT_HEAD: ${{ env.PRODUCT_HEAD }}
          VITE_DC_PREVIEW_DEMO: "1"
        run: node scripts/capture-mobile-marketplace-mob5g.mjs

      - name: Assert visual artifact contract
        working-directory: frontend
        env:
          PRODUCT_HEAD: ${{ env.PRODUCT_HEAD }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const report = JSON.parse(readFileSync('mobile-marketplace-mob5g-artifacts/report.json', 'utf8'));
          if (report.productHead !== process.env.PRODUCT_HEAD) throw new Error('Marketplace visual product HEAD mismatch');
          if (report.baselineBefore !== '062eadf1afc6ffc241be8420313e065a35f7d95b') throw new Error('Marketplace BEFORE baseline mismatch');
          if (report.beforeArtifactId !== 9992935589) throw new Error('Marketplace BEFORE artifact mismatch');
          if (report.mobile.length !== 3) throw new Error(`Expected 3 mobile captures, got ${report.mobile.length}`);
          if (report.mobileInvalidCount !== 0) throw new Error(`Invalid mobile captures: ${report.mobileInvalidCount}`);
          if (report.desktopInvalid) throw new Error('Desktop visual/checkout contract failed');
          if (report.desktop?.checkout?.postCount !== 1) throw new Error('Checkout must emit exactly one POST');
          if (!report.desktop?.checkout?.sameUrlAfterSubmit) throw new Error('Checkout reloaded or navigated unexpectedly');
          NODE

      - name: Upload final Marketplace visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marketplace-p11-final-visual
          path: frontend/mobile-marketplace-mob5g-artifacts/
          if-no-files-found: error
          retention-days: 30
