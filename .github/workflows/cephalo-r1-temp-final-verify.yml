name: Cephalo R1 Temp Final Verify

on:
  push:
    branches:
      - tmp/cephalo-r1-ui-build
    paths:
      - .github/workflows/cephalo-r1-temp-final-verify.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Targeted R1 tests
        working-directory: frontend
        run: npx vitest run src/features/ortho/cephaloCalibration.test.ts src/features/ortho/cephaloRepository.test.ts src/features/ortho/cephaloUtils.test.ts

      - name: Frontend build
        working-directory: frontend
        run: npm run build

      - name: Install Playwright
        working-directory: frontend
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install chromium

      - name: Capture versioned R1 AFTER
        working-directory: frontend
        shell: bash
        run: PRODUCT_HEAD="$(git rev-parse HEAD)" node scripts/capture-cephalo-r1-after.mjs

      - name: Assert R1 AFTER
        working-directory: frontend
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const report = JSON.parse(await readFile('cephalo-r1-after-artifacts/report.json', 'utf8'));
          if (report.invalidCount !== 0) throw new Error(`Invalid captures: ${report.invalidCount}`);
          if (report.blockedExternalRequests.length !== 0) throw new Error('External egress attempted');
          if (report.captures.length !== 3) throw new Error('Expected three viewports');
          console.log('Temporary final R1 preparation verified.');
          NODE

      - name: Upload temp final AFTER
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cephalo-r1-temp-final-after
          path: frontend/cephalo-r1-after-artifacts/
          if-no-files-found: error
          retention-days: 7
