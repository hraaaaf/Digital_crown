name: LOT08.3-B Windows G3 synthetic 30-day retention FUE

on:
  pull_request:
    paths:
      - .github/workflows/v15-08-3-b-retention-lab-windows.yml
      - queue_core/service/retention_lab_08_3_b.py
      - queue_core/tests/test_retention_lab_08_3_b.py

permissions:
  contents: read

jobs:
  windows-synthetic-retention:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assert immutable HEAD and no cabinet installer
        shell: pwsh
        run: |
          if ((git rev-parse HEAD) -ne "${{ github.event.pull_request.head.sha }}") { throw 'HEAD_MISMATCH' }
          if (Test-Path 'dist/DigitalCrownSetup.exe') { throw 'INSTALLABLE_FORBIDDEN' }
      - name: Install pinned synthetic FUE dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check 'pytest==9.0.3' 'SQLAlchemy==2.0.28' 'tzdata==2025.2'
      - name: Exercise actual isolated Windows SQLite 30-day purge and rollback
        shell: pwsh
        run: python -m pytest -q queue_core/tests/test_retention_lab_08_3_b.py --maxfail=1 --junitxml=lot08-3-b-windows.xml
      - name: Preserve synthetic JUnit proof only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lot08-3-b-windows-retention-junit
          path: lot08-3-b-windows.xml
          if-no-files-found: error
          retention-days: 7
