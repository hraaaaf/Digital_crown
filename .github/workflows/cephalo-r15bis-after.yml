name: Cephalo R15bis AFTER

on:
  workflow_dispatch:
  push:
    branches:
      - feat/cephalo-r15bis-uiux
    paths:
      - 'frontend/src/features/ortho/CephaloWorkspace.tsx'
      - 'frontend/src/features/ortho/components/ClinicalScientificStudio.tsx'
      - 'frontend/src/features/ortho/components/ClinicalScientificStudio.test.tsx'
      - 'frontend/src/features/ortho/components/StepTab.tsx'
      - 'frontend/src/features/ortho/components/StepTab.test.tsx'
      - 'frontend/src/features/ortho/components/Step3Clinical.tsx'
      - 'frontend/src/features/ortho/components/Step4Documents.tsx'
      - 'frontend/scripts/capture-cephalo-r15-after.mjs'
      - '.github/workflows/cephalo-r15bis-after.yml'
  pull_request:
    branches: [master]
    paths:
      - 'frontend/src/features/ortho/**'
      - 'frontend/scripts/capture-cephalo-r15-after.mjs'
      - '.github/workflows/cephalo-r15bis-after.yml'

permissions:
  contents: read

jobs:
  visual-after:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact product HEAD
        env:
          PRODUCT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$PRODUCT_HEAD"
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend and browser
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save --package-lock=false --legacy-peer-deps playwright@1.55.0 react-is@19.2.0 @testing-library/dom@10.4.1
          npx playwright install --with-deps chromium
      - name: Test clinical scientific studio
        working-directory: frontend
        run: npx vitest run src/features/ortho/components/ClinicalScientificStudio.test.tsx
      - name: Test workflow navigation keyboard semantics
        working-directory: frontend
        run: npx vitest run src/features/ortho/components/StepTab.test.tsx
      - name: Test theme token mapping
        working-directory: frontend
        run: npx vitest run src/features/ortho/cephaloTheme.test.ts
      - name: Capture exact-head R15bis AFTER
        working-directory: frontend
        env:
          PRODUCT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/capture-cephalo-r15-after.mjs
      - name: Verify AFTER evidence contract and density improvement
        working-directory: frontend
        env:
          PRODUCT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const report = JSON.parse(await readFile('cephalo-r15-after-artifacts/report.json', 'utf8'));
          const expected = process.env.PRODUCT_HEAD;
          if (report.productHead !== expected) throw new Error('Exact-head mismatch');
          if (report.phase !== 'AFTER') throw new Error('Wrong AFTER phase');
          if (report.invalidCount !== 0) throw new Error('Invalid captures');
          if (report.blockedExternalRequests.length !== 0) throw new Error('Unexpected external egress');
          if (report.captures.length !== 3) throw new Error('Expected three certified viewports');
          const before = {
            '390x844': { step3: 4585, step4: 4455 },
            '768x1024': { step3: 3328, step4: 3012 },
            '1280x900': { step3: 2378, step4: 1955 },
          };
          for (const capture of report.captures) {
            if (!capture.valid || capture.pageErrors.length || capture.consoleErrors.length || !capture.selectedAnalysisBound) throw new Error(`Runtime failure ${capture.viewport}`);
            for (const scene of [capture.step3Top, capture.step4Top]) {
              if (scene.horizontalDocumentOverflow || scene.headerClipped) throw new Error(`Layout failure ${capture.viewport}/${scene.scene}`);
              if (!scene.hasClinicalJourney || !scene.hasDiagnosticStage || !scene.hasObjectivesStage || !scene.hasOptionsStage || !scene.hasValidationStage) throw new Error(`Client clinical journey incomplete ${capture.viewport}`);
              if (!scene.hasMissingSurface || !scene.hasContradictionSurface || !scene.hasContraindicationSurface) throw new Error(`Clinical exception surfaces hidden ${capture.viewport}`);
              if (!scene.hasPractitionerAction || !scene.hasNoFakeValidation || scene.hasTechnicalVocabulary) throw new Error(`Client copy contract failure ${capture.viewport}`);
            }
            if (!capture.step3Top.hasImportedNotes) throw new Error(`Imported-note provenance missing ${capture.viewport}`);
            if (!capture.step4Top.hasDocumentSeparation || !capture.step4Top.hasArchiveAction) throw new Error(`Document/clinical validation separation missing ${capture.viewport}`);
            if (capture.step3Top.bodyHeight >= before[capture.viewport].step3) throw new Error(`Step 3 density did not improve ${capture.viewport}: ${capture.step3Top.bodyHeight}`);
            if (capture.step4Top.bodyHeight >= before[capture.viewport].step4) throw new Error(`Step 4 density did not improve ${capture.viewport}: ${capture.step4Top.bodyHeight}`);
          }
          NODE
          for viewport in 390x844 768x1024 1280x900; do
            test -s "cephalo-r15-after-artifacts/after-step3-top-${viewport}.png"
            test -s "cephalo-r15-after-artifacts/after-step3-decision-${viewport}.png"
            test -s "cephalo-r15-after-artifacts/after-step4-top-${viewport}.png"
            test -s "cephalo-r15-after-artifacts/after-step4-action-${viewport}.png"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cephalo-r15bis-after-${{ github.sha }}
          path: frontend/cephalo-r15-after-artifacts
          if-no-files-found: warn
          retention-days: 30
