name: Cephalo R15bis AFTER

on:
  workflow_dispatch:
  push:
    branches:
      - feat/cephalo-r15bis-uiux
    paths:
      - 'frontend/src/features/ortho/CephaloWorkspace.tsx'
      - 'frontend/src/features/ortho/components/ClinicalScientificStudio.tsx'
      - 'frontend/src/features/ortho/components/ClinicalScientificStudio.test.tsx'
      - 'frontend/src/features/ortho/components/StepTab.tsx'
      - 'frontend/src/features/ortho/components/StepTab.test.tsx'
      - 'frontend/src/features/ortho/components/Step3Clinical.tsx'
      - 'frontend/src/features/ortho/components/Step4Documents.tsx'
      - 'frontend/scripts/capture-cephalo-r15-after.mjs'
      - 'frontend/scripts/capture-cephalo-r15bis-before-viewer.mjs'
      - '.github/workflows/cephalo-r15bis-after.yml'
  pull_request:
    branches: [master]
    paths:
      - 'frontend/src/features/ortho/**'
      - 'frontend/scripts/capture-cephalo-r15-after.mjs'
      - 'frontend/scripts/capture-cephalo-r15bis-before-viewer.mjs'
      - '.github/workflows/cephalo-r15bis-after.yml'

permissions:
  contents: read

jobs:
  visual-after:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact product HEAD
        env:
          PRODUCT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$PRODUCT_HEAD"
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend and browser
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save --package-lock=false --legacy-peer-deps playwright@1.55.0 react-is@19.2.0 @testing-library/dom@10.4.1
          npx playwright install --with-deps chromium
      - name: Targeted R15bis frontend tests
        working-directory: frontend
        run: npx vitest run src/features/ortho/components/ClinicalScientificStudio.test.tsx src/features/ortho/components/StepTab.test.tsx src/features/ortho/cephaloTheme.test.ts
      - name: Capture exact-head R15bis AFTER
        working-directory: frontend
        env:
          PRODUCT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node scripts/capture-cephalo-r15-after.mjs
          node scripts/capture-cephalo-r15bis-before-viewer.mjs
          node --input-type=module <<'NODE'
          import { readFile, rename, writeFile } from 'node:fs/promises';
          const dir = 'cephalo-r15-after-artifacts';
          const reportPath = `${dir}/viewer-report.json`;
          const report = JSON.parse(await readFile(reportPath, 'utf8'));
          report.phase = 'AFTER_VIEWER';
          report.sourceHarness = 'capture-cephalo-r15bis-before-viewer.mjs reused read-only against exact R15bis HEAD';
          await writeFile(reportPath, JSON.stringify(report, null, 2), 'utf8');
          for (const viewport of ['390x844', '768x1024', '1280x900']) {
            await rename(`${dir}/before-step1-viewer-${viewport}.png`, `${dir}/after-step1-viewer-${viewport}.png`);
          }
          await writeFile(`${dir}/r15bis-after-metadata.json`, JSON.stringify({
            lot: 'CEPHALO-R15BIS',
            phase: 'AFTER',
            productHead: process.env.PRODUCT_HEAD,
            viewports: ['390x844', '768x1024', '1280x900'],
          }, null, 2), 'utf8');
          NODE
      - name: Verify AFTER evidence contract and density improvement
        working-directory: frontend
        env:
          PRODUCT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const report = JSON.parse(await readFile('cephalo-r15-after-artifacts/report.json', 'utf8'));
          const viewer = JSON.parse(await readFile('cephalo-r15-after-artifacts/viewer-report.json', 'utf8'));
          const metadata = JSON.parse(await readFile('cephalo-r15-after-artifacts/r15bis-after-metadata.json', 'utf8'));
          const expected = process.env.PRODUCT_HEAD;
          if (report.productHead !== expected || metadata.productHead !== expected || viewer.productHead !== expected) throw new Error('Exact-head mismatch');
          if (report.phase !== 'AFTER' || viewer.phase !== 'AFTER_VIEWER' || metadata.phase !== 'AFTER') throw new Error('Wrong AFTER phase');
          if (report.invalidCount !== 0 || viewer.invalidCount !== 0) throw new Error('Invalid captures');
          if (report.blockedExternalRequests.length !== 0 || viewer.blockedExternalRequests.length !== 0) throw new Error('Unexpected external egress');
          if (report.captures.length !== 3 || viewer.captures.length !== 3) throw new Error('Expected three certified viewports');
          const before = {
            '390x844': { step3: 4585, step4: 4455 },
            '768x1024': { step3: 3328, step4: 3012 },
            '1280x900': { step3: 2378, step4: 1955 },
          };
          for (const capture of report.captures) {
            if (!capture.valid || capture.pageErrors.length || capture.consoleErrors.length || !capture.selectedAnalysisBound) throw new Error(`Runtime failure ${capture.viewport}`);
            for (const scene of [capture.step3Top, capture.step4Top]) {
              if (scene.horizontalDocumentOverflow || scene.headerClipped) throw new Error(`Layout failure ${capture.viewport}/${scene.scene}`);
              if (!scene.hasScientificChain || !scene.hasR11Surface || !scene.hasR12Surface || !scene.hasR13Surface || !scene.hasR14Surface) throw new Error(`Missing R11-R14 traceability ${capture.viewport}`);
              if (!scene.hasMissingSurface || !scene.hasContradictionSurface || !scene.hasContraindicationSurface) throw new Error(`Scientific exceptions hidden ${capture.viewport}`);
              if (!scene.hasPractitionerAction || !scene.hasNoFakeValidation) throw new Error(`Practitioner action contract missing ${capture.viewport}`);
            }
            if (capture.step3Top.bodyHeight >= before[capture.viewport].step3) throw new Error(`Step 3 density did not improve ${capture.viewport}: ${capture.step3Top.bodyHeight}`);
            if (capture.step4Top.bodyHeight >= before[capture.viewport].step4) throw new Error(`Step 4 density did not improve ${capture.viewport}: ${capture.step4Top.bodyHeight}`);
          }
          for (const capture of viewer.captures) {
            if (!capture.valid || capture.pageErrors.length || capture.consoleErrors.length) throw new Error(`Viewer runtime failure ${capture.viewport}`);
            if (capture.horizontalDocumentOverflow || !capture.viewerInBounds || !capture.themeTokensResolved) throw new Error(`Viewer layout failure ${capture.viewport}`);
          }
          NODE
          for viewport in 390x844 768x1024 1280x900; do
            test -s "cephalo-r15-after-artifacts/after-step3-top-${viewport}.png"
            test -s "cephalo-r15-after-artifacts/after-step3-decision-${viewport}.png"
            test -s "cephalo-r15-after-artifacts/after-step4-top-${viewport}.png"
            test -s "cephalo-r15-after-artifacts/after-step4-action-${viewport}.png"
            test -s "cephalo-r15-after-artifacts/after-step1-viewer-${viewport}.png"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cephalo-r15bis-after-${{ github.sha }}
          path: frontend/cephalo-r15-after-artifacts
          if-no-files-found: error
          retention-days: 30
