name: Crown Bot ZERO-LLM Integration Gate

on:
  pull_request:
    paths:
      - backend/config.py
      - backend/routers/bot.py
      - backend/routers/bot_workflows.py
      - backend/services/bot/workflow_poc.py
      - backend/tests/test_crown_bot_zero_llm_poc.py
      - backend/tests/test_bot_workflow_api_safe.py
      - .github/workflows/crown-bot-zero-llm-integration.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crown-bot-zero-llm-integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pure:
    name: Pure FSM (synthetic no-deps)
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile changed code
        run: |
          python -m compileall -q backend/services/bot/workflow_poc.py backend/routers/bot_workflows.py backend/routers/bot.py backend/config.py
      - name: Run pure FSM tests
        run: python -m unittest discover -s backend/tests -p 'test_crown_bot_zero_llm_poc.py' -v

  api:
    name: Flag OFF + tenant + action replay API regressions
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SECRET_KEY: ci-only-secret-key-minimum-32-characters-long
      DATABASE_URL: "sqlite:///:memory:"
      ENVIRONMENT: test
      DIGITALCROWN_ISOLATED_RUNTIME: "true"
      TELEMETRY_ENABLED: "false"
      CLOUD_AI_ENABLED: "false"
      CROWN_BOT_DETERMINISTIC_WORKFLOWS_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install canonical backend dependencies (CPU-only ML)
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.10.0 torchvision==0.25.0 torchaudio==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^(torch|torchvision|torchaudio)([<=>].*)?$' requirements.txt > /tmp/requirements-ci.txt
          pip install -r /tmp/requirements-ci.txt
          python -m pip check
      - name: Run API integration and legacy action regression
        run: |
          python -m pytest backend/tests/test_bot_workflow_api_safe.py backend/tests/test_bot_action_strict.py backend/tests/test_bot_router.py -q
      - name: Security evidence summary
        if: always()
        run: |
          echo "## ZERO-LLM adapter security gate" >> "$GITHUB_STEP_SUMMARY"
          echo "PR merge-ref SHA: \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Flag is OFF by default. No Vercel deployment, no real patients." >> "$GITHUB_STEP_SUMMARY"
          echo "API test DB = SQLite in-memory. PostgreSQL race/real browser tests still required before activation." >> "$GITHUB_STEP_SUMMARY"
