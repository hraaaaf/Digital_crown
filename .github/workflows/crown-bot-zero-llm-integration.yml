name: Crown Bot ZERO-LLM Integration Gate

on:
  pull_request:
    paths:
      - backend/config.py
      - backend/routers/bot.py
      - backend/routers/bot_workflows.py
      - backend/services/bot/workflow_poc.py
      - backend/services/bot/atomic_action_claim.py
      - backend/services/bot/action_dispatcher.py
      - backend/routers/appointments.py
      - backend/services/agenda_transaction_lock.py
      - backend/tests/test_bot_atomic_claim_postgres.py
      - backend/tests/test_crown_bot_zero_llm_poc.py
      - backend/tests/test_bot_workflow_api_safe.py
      - .github/workflows/crown-bot-zero-llm-integration.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crown-bot-zero-llm-integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pure:
    name: Pure FSM (synthetic no-deps)
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile changed code
        run: |
          python -m compileall -q backend/services/bot/workflow_poc.py backend/services/bot/atomic_action_claim.py backend/services/bot/action_dispatcher.py backend/services/agenda_transaction_lock.py backend/routers/appointments.py backend/routers/bot_workflows.py backend/routers/bot.py backend/config.py
      - name: Run pure FSM tests
        run: python -m unittest discover -s backend/tests -p 'test_crown_bot_zero_llm_poc.py' -v

  pg-atomic-cas:
    name: PostgreSQL real concurrency (two independent sessions)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: claims
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d claims"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CROWN_BOT_CAS_TEST_DB_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/claims
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Minimal real PostgreSQL dependencies
        run: python -m pip install 'sqlalchemy>=2.0,<3' psycopg2-binary
      - name: Execute two-connection CAS, crash rollback and distinct-booking serialization
        run: python -m unittest discover -s backend/tests -p 'test_bot_atomic_claim_postgres.py' -v

  api:
    name: Flag OFF + tenant + action replay API regressions
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SECRET_KEY: ci-only-secret-key-minimum-32-characters-long
      DATABASE_URL: "sqlite:///:memory:"
      ENVIRONMENT: test
      DIGITALCROWN_ISOLATED_RUNTIME: "true"
      TELEMETRY_ENABLED: "false"
      CLOUD_AI_ENABLED: "false"
      CROWN_BOT_DETERMINISTIC_WORKFLOWS_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install canonical backend dependencies (CPU-only ML)
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.10.0 torchvision==0.25.0 torchaudio==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^(torch|torchvision|torchaudio)([<=>].*)?$' requirements.txt > /tmp/requirements-ci.txt
          pip install -r /tmp/requirements-ci.txt
          python -m pip check
      - name: Run API integration and legacy action regression
        run: |
          python -m pytest backend/tests/test_bot_workflow_api_safe.py backend/tests/test_bot_action_strict.py backend/tests/test_bot_router.py -q
      - name: Security evidence summary
        if: always()
        run: |
          echo "## ZERO-LLM adapter security gate" >> "$GITHUB_STEP_SUMMARY"
          echo "PR merge-ref SHA: \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Flag is OFF by default. No Vercel deployment, no real patients." >> "$GITHUB_STEP_SUMMARY"
          echo "API test DB = SQLite in-memory. PostgreSQL tests use synthetic SQL schema, not a real HTTP/backend clinical E2E. Browser tests still required." >> "$GITHUB_STEP_SUMMARY"
