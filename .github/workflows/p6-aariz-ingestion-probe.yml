name: P6 Aariz Ingestion Probe

on:
  push:
    branches:
      - portability/p6-scientific-assets-refresh
    paths:
      - scripts/p6_aariz_ingestion_probe.py
      - .github/workflows/p6-aariz-ingestion-probe.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p6-aariz-ingestion-probe
  cancel-in-progress: false

jobs:
  provenance-schema-and-training-cost:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact research HEAD
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned CPU probe stack
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install \
            --index-url https://download.pytorch.org/whl/cpu \
            "torch==2.3.0+cpu"
          python -m pip install \
            "numpy==1.26.4" \
            "Pillow==10.4.0"

      - name: Download exact Aariz Figshare v1 asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p p6-aariz-probe/work p6-aariz-probe/evidence
          curl --fail --location --retry 3 --retry-delay 5 \
            --output p6-aariz-probe/work/Aariz.zip \
            https://figshare.com/ndownloader/files/51041642

      - name: Verify archive, real schema and CPU training cost
        run: >-
          python scripts/p6_aariz_ingestion_probe.py
          --zip p6-aariz-probe/work/Aariz.zip
          --extract-dir p6-aariz-probe/work/extracted
          --output p6-aariz-probe/evidence/manifest.json

      - name: Prove product tree stayed untouched
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- backend frontend
          git status --short

      - name: Remove radiographs before artifact upload
        if: always()
        shell: bash
        run: rm -rf p6-aariz-probe/work

      - name: Upload compact evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p6-aariz-ingestion-probe
          path: p6-aariz-probe/evidence
          if-no-files-found: warn
          retention-days: 14
