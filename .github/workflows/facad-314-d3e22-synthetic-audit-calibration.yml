name: Facad D3E22 synthetic Windows file audit enable-restore (EXPERIMENTAL)

on:
  push:
    branches:
      - feat/cephalo-facad-direct-parity-runtime-probe
    paths:
      - .github/workflows/facad-314-d3e22-synthetic-audit-calibration.yml
      - scripts/facad_314_d3e22_synthetic_audit_enable_restore.ps1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disposable-synthetic-windows-audit:
    name: disposable runner - SYNTHETIC ONLY - no FACAD or clinical evidence
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Pin exact source SHA and parse PowerShell without side effects
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if ((git rev-parse HEAD) -cne $env:GITHUB_SHA) { throw 'EXACT_HEAD_MISMATCH' }
          $script='scripts/facad_314_d3e22_synthetic_audit_enable_restore.ps1'
          $tokens=$null
          $errors=$null
          [void][Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path $script).Path,[ref]$tokens,[ref]$errors)
          if ($errors.Count -gt 0) { throw 'D3E22_SCRIPT_SYNTAX_INVALID' }
          if ((Get-Content -LiteralPath $script -Raw) -notmatch 'D3E22_FACAD_EXECUTED=false') { throw 'SAFETY_SENTINEL_MISSING' }
          Write-Host "EXACT_HEAD=$env:GITHUB_SHA"
          Write-Host 'D3E22_EXP_NATIVE_SYNTHETIC_ONLY=true'
      - name: Native synthetic 4663 PID calibration and audit-policy restoration
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & 'scripts/facad_314_d3e22_synthetic_audit_enable_restore.ps1'
          $exit=$LASTEXITCODE
          if ($exit -ne 0) {
            throw "D3E22_NATIVE_EXPERIMENT_NO_CLEARANCE_EXIT=$exit"
          }
          Write-Host 'D3E22_NO_NATIVE_FACAD_EVIDENCE=true'
          Write-Host 'SHARED_APP_STORAGE_ISOLATION=UNVERIFIED'
          Write-Host 'CLINICAL_EDIT_ALLOWED=false'
