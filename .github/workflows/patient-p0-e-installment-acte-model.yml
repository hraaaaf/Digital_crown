name: Patient P0 E — Link installment model to Acte

on:
  push:
    branches:
      - agent/patient-page-p0-truth-safety
    paths:
      - .github/workflows/patient-p0-e-installment-acte-model.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/patient-page-p0-truth-safety
          fetch-depth: 0

      - name: Add optional acte_id to InstallmentPlan ORM
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/models.py')
          text = path.read_text(encoding='utf-8')
          old = '''    patient_id: Mapped[int] = mapped_column(ForeignKey("patients.id", ondelete="CASCADE"), nullable=False)\n    title: Mapped[str] = mapped_column(String(255), nullable=False) # Ex: Traitement Ortho 2024\n    total_amount: Mapped[float] = mapped_column(Float, nullable=False)\n'''
          new = '''    patient_id: Mapped[int] = mapped_column(ForeignKey("patients.id", ondelete="CASCADE"), nullable=False)\n    acte_id: Mapped[Optional[int]] = mapped_column(ForeignKey("actes.id", ondelete="SET NULL"), nullable=True, index=True)\n    title: Mapped[str] = mapped_column(String(255), nullable=False) # Ex: Traitement Ortho 2024\n    total_amount: Mapped[float] = mapped_column(Float, nullable=False)\n'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'InstallmentPlan columns: expected 1 block, found {count}')
          text = text.replace(old, new, 1)

          old_rel = '''    # Relations\n    patient: Mapped["Patient"] = relationship()\n    installments: Mapped[List["Installment"]] = relationship(\n'''
          new_rel = '''    # Relations\n    patient: Mapped["Patient"] = relationship()\n    acte: Mapped[Optional["Acte"]] = relationship()\n    installments: Mapped[List["Installment"]] = relationship(\n'''
          count = text.count(old_rel)
          if count != 1:
              raise SystemExit(f'InstallmentPlan relations: expected 1 block, found {count}')
          text = text.replace(old_rel, new_rel, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify minimal scope
        run: |
          git diff --check
          test "$(git diff --name-only | grep -v '^.github/workflows/patient-p0-e-installment-acte-model.yml$' | wc -l)" -eq 1
          grep -q 'acte_id: Mapped\[Optional\[int\]\].*installment' /dev/null || true
          grep -q 'ForeignKey("actes.id", ondelete="SET NULL")' backend/models.py

      - name: Commit patch and remove temporary workflow
        run: |
          rm .github/workflows/patient-p0-e-installment-acte-model.yml
          git config user.name "digital-crown-ci"
          git config user.email "actions@users.noreply.github.com"
          git add backend/models.py .github/workflows/patient-p0-e-installment-acte-model.yml
          git commit -m "feat(patient): link installment plans to billed Acte"
          git push origin HEAD:agent/patient-page-p0-truth-safety
