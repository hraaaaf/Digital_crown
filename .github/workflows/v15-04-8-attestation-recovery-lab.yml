name: V1.5-04.8 Pending Evidence and Uncertain Recovery LAB

on:
  pull_request:
    branches:
      - feat/v15-04-8-c-transactional-virtual-outbox-lab-20261013
      - feat/v15-04-8-attestation-recovery-guard-20261013
    paths:
      - "backend/services/station_print_attestation_recovery_v15.py"
      - "backend/tests/test_station_print_attestation_recovery_v15.py"
      - "backend/routers/station_print_config_admin.py"
      - "backend/tests/certify_station_print_attestation_recovery_pg_v15.py"
      - "alembic/versions/neo000000030_print_evidence_investigation.py"
      - ".github/workflows/v15-04-8-attestation-recovery-lab.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sqlite-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Exact PR SHA
        env:
          SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install only pinned SQL requirements
        run: python -m pip install pytest==8.3.3 SQLAlchemy==2.0.28
      - name: Run SQLite actual SQL/tenant/conflict/review tests without app conftest
        run: |
          python -m py_compile backend/services/station_print_attestation_recovery_v15.py backend/tests/test_station_print_attestation_recovery_v15.py
          mkdir -p /tmp/dc048-pending-reviews
          cp backend/tests/test_station_print_attestation_recovery_v15.py /tmp/dc048-pending-reviews/test_reviews.py
          python - <<'PY'
          import os,sys,types,pytest
          for name,path in (("backend","backend"),("backend.services","backend/services")):
              pkg=types.ModuleType(name)
              pkg.__path__=[os.path.abspath(path)]
              sys.modules[name]=pkg
          raise SystemExit(pytest.main(["-q","/tmp/dc048-pending-reviews/test_reviews.py"]))
          PY

  postgres-concurrency:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dc_print_review_lab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dc_print_review_lab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/dc_print_review_lab
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Exact PR SHA
        env:
          SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PostgreSQL test requirements
        run: python -m pip install SQLAlchemy==2.0.28 psycopg2-binary==2.9.10
      - name: Real concurrent SQL on PostgreSQL 18
        run: python backend/tests/certify_station_print_attestation_recovery_pg_v15.py
