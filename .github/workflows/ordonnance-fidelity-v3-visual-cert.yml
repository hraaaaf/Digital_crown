name: Ordonnance Fidelity V3 Visual Certification

on:
  pull_request:
    paths:
      - 'frontend/src/features/admin/DocumentStudio/**'
      - 'frontend/scripts/certify-ordonnance-fidelity-v3.mjs'
      - 'frontend/scripts/capture-acig-autocomplete-proof.mjs'
      - '.github/workflows/ordonnance-fidelity-v3-visual-cert.yml'
  workflow_dispatch:

concurrency:
  group: ordonnance-fidelity-v3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual-cert:
    name: Ordonnance Fidelity V3 390/430/768/1280
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ENVIRONMENT: test
      SECRET_KEY: ordonnance-fidelity-v3-secret-key-000001
      DATABASE_URL: sqlite:///./ordonnance-fidelity-v3.db
      DIGITALCROWN_ISOLATED_RUNTIME: "1"
      DIGITALCROWN_ISOLATION_DB_FINGERPRINT: "c04779c8d18b3ac12a0f4093a47a5d0c3c0e2251714be532893cfa052e9ee780"
      TELEMETRY_ENABLED: 'false'
      CLOUD_AI_ENABLED: 'false'
      DEBUG: 'false'
      ALLOWED_ORIGINS: http://127.0.0.1:5173,http://localhost:5173
      T2_USER: t2-browser@cabinet.ma
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Generate isolated runtime credential
        shell: bash
        run: python -c 'import secrets; print("T2_PASSWORD=" + secrets.token_urlsafe(24))' >> "$GITHUB_ENV"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.12.0 torchvision==0.27.0 --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^(torch|torchvision)([<=>].*)?$' requirements.txt > /tmp/requirements-ordonnance-v3.txt
          pip install -r /tmp/requirements-ordonnance-v3.txt
          pip install httpx==0.27.2

      - name: Install frontend and Chromium
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save playwright@1.55.0
          npx playwright install chromium

      - name: Start isolated backend
        run: |
          python scripts/t2_runtime_server.py > /tmp/ordonnance-v3-backend.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8005/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/ordonnance-v3-backend.log
          exit 1

      - name: Start frontend
        working-directory: frontend
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 > /tmp/ordonnance-v3-frontend.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:5173 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/ordonnance-v3-frontend.log
          exit 1

      - name: Capture ACIG AMMPS autocomplete proof
        working-directory: frontend
        run: node scripts/capture-acig-autocomplete-proof.mjs

      - name: Capture deterministic Fidelity V3 evidence
        working-directory: frontend
        run: node scripts/certify-ordonnance-fidelity-v3.mjs

      - name: Dump runtime logs on failure
        if: failure()
        run: |
          echo '===== BACKEND ====='
          cat /tmp/ordonnance-v3-backend.log || true
          echo '===== FRONTEND ====='
          cat /tmp/ordonnance-v3-frontend.log || true

      - name: Upload Fidelity V3 visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ordonnance-fidelity-v3-evidence
          path: artifacts/ordonnance-fidelity-v3
          if-no-files-found: error
          retention-days: 14
