name: V1.5-06D REAL Cross-Host Shared Server Stress LAB

on:
  pull_request:
    paths:
      - 'isolated_fue_lot06c/qa_shared_server_crosshost_stress_v15.py'
      - '.github/workflows/v15-06d-shared-crosshost-stress.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: lot06c05b03g-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  shared-receiver:
    name: One ephemeral HTTPS ingress / REAL isolated SQLite HotFolder
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    env:
      ENVIRONMENT: test
      DIGITALCROWN_ISOLATED_RUNTIME: 'true'
      DC06C05B03G_TEST_ONLY: '1'
      GITHUB_SHA_EXACT: ${{ github.event.pull_request.head.sha || github.sha }}
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify immutable test-only source and install crypto
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python -m pip install 'cryptography>=42,<48'
          python -m py_compile isolated_fue_lot06c/qa_shared_server_crosshost_stress_v15.py
      - name: Download temporary Cloudflare Quick Tunnel binary (TEST ingress only)
        shell: bash
        run: |
          set -euo pipefail
          curl -fLSs --retry 3 --max-time 85 -o cloudflared 'https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64'
          chmod 0700 cloudflared
          ./cloudflared --version
      - name: Start ONLY shared synthetic receiver in background (never expose cabinet)
        shell: bash
        run: |
          set -euo pipefail
          nohup python -m isolated_fue_lot06c.qa_shared_server_crosshost_stress_v15 server > host-stress.log 2>&1 </dev/null &
          echo "$!" > host.pid
          for i in $(seq 1 90); do
            if test -s rendezvous-private.json; then
              echo 'LOT06C05B03G_SINGLE_SHARED_RECEIVER_EPHEMERAL_READY'
              exit 0
            fi
            if ! kill -0 "$(cat host.pid)" 2>/dev/null; then
              tail -n 20 host-stress.log | sed -E 's#https://[a-z0-9-]+\\.trycloudflare\\.com#[REDACTED_TEST_HOST]#g'
              exit 1
            fi
            sleep 2
          done
          echo 'REAL_SHARED_RECEIVER_BOOT_TIMEOUT'
          exit 1
      - name: Publish ephemeral run-only rendezvous for the four trusted test runners
        uses: actions/upload-artifact@v4
        with:
          name: lot06-c05b03g-private-rendezvous-${{ github.run_id }}
          path: rendezvous-private.json
          if-no-files-found: error
          retention-days: 1
      - name: Wait for all FOUR real remote Ubuntu senders and verify queue
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 315); do
            if test -s server-proof.json; then
              python - <<'PY'
          import json,os
          d=json.load(open("server-proof.json"))
          assert d["head_sha"]==os.environ["EXPECTED_SHA"]
          assert d["external_clients_all_joined"] is True
          assert d["remote_http_received"]==216
          assert d["pre_saturation_queue"]==152
          assert d["final_sqlite_encrypted_queue"]==160
          assert d["deferred_sources_preserved"]==56
          assert d["all_source_sha256_and_aesgcm_verified"] is True
          assert d["cold_restart_no_duplicate"] is True
          assert d["production_endpoint_touched"] is False
          assert d["clinical_receipt_issued"] is False
          assert d["product_ready"] is False
          print("LOT06C05B03G_SHARED_SERVER_216_REMOTE_FILES_AND_SQLITE_QUEUE_PASS")
          PY
              exit 0
            fi
            if ! kill -0 "$(cat host.pid)" 2>/dev/null; then
              echo 'SHARED_RECEIVER_EXITED_BEFORE_PROOF'
              tail -n 30 host-stress.log | sed -E 's#https://[a-z0-9-]+\\.trycloudflare\\.com#[REDACTED_TEST_HOST]#g'
              exit 1
            fi
            sleep 2
          done
          echo 'FOUR_REMOTE_CLIENTS_NOT_COMPLETE'
          exit 1
      - name: Upload shared receiver queue integrity and saturation evidence
        uses: actions/upload-artifact@v4
        with:
          name: lot06-c05b03g-proof-server
          path: server-proof.json
          if-no-files-found: error
          retention-days: 14
      - name: Stop isolated TEST process and tunnel
        if: always()
        shell: bash
        run: |
          if test -s host.pid; then
            kill "$(cat host.pid)" 2>/dev/null || true
          fi
          rm -f rendezvous-private.json

  four-senders:
    name: "Real remote Ubuntu ${{ matrix.label }} to ONE shared receiver"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 16
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - { label: u22a, os: ubuntu-22.04, files: 24 }
          - { label: u22b, os: ubuntu-22.04, files: 48 }
          - { label: u24a, os: ubuntu-24.04, files: 24 }
          - { label: u24b, os: ubuntu-24.04, files: 48 }
    env:
      ENVIRONMENT: test
      DIGITALCROWN_ISOLATED_RUNTIME: 'true'
      DC06C05B03G_TEST_ONLY: '1'
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      GITHUB_SHA_EXACT: ${{ github.event.pull_request.head.sha || github.sha }}
      GH_API_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify source and install isolated synthetic crypto helper
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python -m pip install 'cryptography>=42,<48'
      - name: Four actual GitHub VMs submit parallel PNGs via common HTTPS test endpoint
        shell: bash
        run: |
          set -euo pipefail
          python -m isolated_fue_lot06c.qa_shared_server_crosshost_stress_v15 client --label ${{ matrix.label }}
          test -s client-proof.json
      - name: Upload independent remote sender evidence (no URL/token/data)
        uses: actions/upload-artifact@v4
        with:
          name: lot06-c05b03g-proof-${{ matrix.label }}
          path: client-proof.json
          if-no-files-found: error
          retention-days: 14

  aggregate:
    name: Cross-host 5-way exact SHA FUE / false clinical claim refusal
    needs: [shared-receiver, four-senders]
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: lot06-c05b03g-proof-*
          path: crosshost-proofs
          merge-multiple: false
      - name: Independently verify 216 actual cross-host receipts / 160 spool / 56 deferred
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,pathlib
          root=pathlib.Path("crosshost-proofs")
          expected={"u22a":24,"u22b":48,"u24a":24,"u24b":48}
          actual={x.name for x in root.iterdir() if x.is_dir()}
          assert actual=={"lot06-c05b03g-proof-server"}|{"lot06-c05b03g-proof-"+x for x in expected},actual
          server=json.loads((root/"lot06-c05b03g-proof-server"/"server-proof.json").read_text())
          assert server["head_sha"]==os.environ["EXPECTED_SHA"]
          assert server["remote_http_received"]==216
          assert server["pre_saturation_queue"]==152 and server["final_sqlite_encrypted_queue"]==160
          assert server["deferred_sources_preserved"]==56
          assert server["all_source_sha256_and_aesgcm_verified"] is True
          assert server["cold_restart_no_duplicate"] is True
          assert server["external_clients_all_joined"] is True
          assert not server["product_ready"] and not server["clinical_receipt_issued"]
          summed=0
          for label,bulk in expected.items():
              path=root/("lot06-c05b03g-proof-"+label)/"client-proof.json"
              d=json.loads(path.read_text())
              assert d["head_sha"]==os.environ["EXPECTED_SHA"]
              assert d["label"]==label
              assert d["real_https_to_single_shared_test_server"] is True
              assert d["metrics"]["two"]["files"]==2
              assert d["metrics"]["bulk"]["files"]==bulk
              assert d["metrics"]["flood"]["files"]==16
              assert d["uploads"]==bulk+18
              assert d["source_files_synthetic"] is True
              assert not d["clinical_receipt_issued"] and not d["product_ready"]
              summed+=d["uploads"]
              print("C05B03G_REMOTE_CLIENT",label,"files",d["uploads"],
                    "bulk_rps",d["metrics"]["bulk"]["requests_per_s"],
                    "p95_ms",d["metrics"]["bulk"]["p95_ms"])
          assert summed==216
          print("LOT06C05B03G_TRUE_FOUR_UBUNTU_ONE_SHARED_RECEIVER_PASS files=216 queued=160 deferred=56")
          PY
      - name: Publish cross-host complete evidence bundle (no ephemeral credentials)
        uses: actions/upload-artifact@v4
        with:
          name: lot06-c05b03g-aggregate-crosshost-evidence
          path: crosshost-proofs/
          if-no-files-found: error
          retention-days: 14
