name: Patient P3 Clinique After

on:
  pull_request:
    branches:
      - agent/patient-page-p2-journey
    paths:
      - 'frontend/src/features/patients/components/ClinicalHub.tsx'
      - 'frontend/src/components/odontogram/Odontogram.tsx'
      - 'frontend/src/features/patients/services/patientClinicalPersistence.ts'
      - 'frontend/src/features/patients/services/patientClinicalPersistence.test.ts'
      - 'frontend/src/features/patients/PatientP3ClinicalAssistantBoundary.test.ts'
      - 'frontend/src/features/patients/components/wizards/**'
      - 'backend/models_clinical_p3.py'
      - 'backend/routers/patient_odontogram.py'
      - 'backend/routers/patient_clinical_conclusions.py'
      - 'backend/routers/patients.py'
      - 'backend/tests/test_patient_p3_odontogram.py'
      - 'backend/tests/test_patient_p3_clinical_conclusions.py'
      - 'backend/tests/test_patient_p3_master_plan_revisions.py'
      - '.github/workflows/patient-p3-clinique-after.yml'

permissions:
  contents: read

jobs:
  after:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ENVIRONMENT: test
      SECRET_KEY: patient-p3-after-secret-000001-long-enough
      DATABASE_URL: sqlite:///./t2-runtime-cert.db
      TELEMETRY_ENABLED: 'false'
      CLOUD_AI_ENABLED: 'false'
      DEBUG: 'false'
      ALLOWED_ORIGINS: 'http://127.0.0.1:5173,http://localhost:5173'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: P3 source truth contract
        run: |
          python - <<'PY'
          from pathlib import Path
          hub = Path('frontend/src/features/patients/components/ClinicalHub.tsx').read_text(encoding='utf-8')
          persistence = Path('frontend/src/features/patients/services/patientClinicalPersistence.ts').read_text(encoding='utf-8')
          patients = Path('backend/routers/patients.py').read_text(encoding='utf-8')

          for forbidden in ['VigilanceRadar', 'odontogram_state_', 'localStorage.setItem(`odontogram_state_']:
              assert forbidden not in hub, forbidden
          for required in [
              'Sécurité médicale',
              'Source : dossier Patient',
              'patientClinicalPersistence.getOdontogram',
              'patientClinicalPersistence.saveOdontogram',
              'clinical-conclusions',
              'Conclusion retenue par le praticien',
              'master-plan/revisions',
          ]:
              assert required in hub or required in persistence or required in patients, required
          for forbidden in [
              'Génération du Diagnostic AAP/EFP 2017',
              'Génération du Plan Prothétique',
              'Génération du Plan Orthodontique',
          ]:
              for path in Path('frontend/src/features/patients/components/wizards').glob('*.tsx'):
                  assert forbidden not in path.read_text(encoding='utf-8'), f'{forbidden}: {path.name}'
          assert 'master-plan/revisions' in patients
          assert 'TreatmentMasterPlanRevision' in patients
          PY

      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.12.0 torchvision==0.27.0 --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^(torch|torchvision)([<=>].*)?$' requirements.txt > /tmp/requirements-p3-after.txt
          pip install -r /tmp/requirements-p3-after.txt
          pip install httpx==0.27.2 pytest

      - name: P3 backend persistence tests
        run: |
          pytest -q \
            backend/tests/test_patient_p3_odontogram.py \
            backend/tests/test_patient_p3_clinical_conclusions.py \
            backend/tests/test_patient_p3_master_plan_revisions.py

      - name: Install frontend and Chromium
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: P3 frontend truth tests and build
        working-directory: frontend
        run: |
          npm test -- --run \
            src/features/patients/PatientP3ClinicalAssistantBoundary.test.ts \
            src/features/patients/services/patientClinicalPersistence.test.ts
          npm run build

      - name: Start backend
        run: |
          rm -f t2-runtime-cert.db
          python scripts/t2_runtime_server.py > /tmp/p3-after-backend.log 2>&1 &
          for i in {1..90}; do if curl -fsS http://127.0.0.1:8005/health >/dev/null; then exit 0; fi; sleep 1; done
          cat /tmp/p3-after-backend.log
          exit 1

      - name: Start frontend
        working-directory: frontend
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 > /tmp/p3-after-front.log 2>&1 &
          for i in {1..90}; do if curl -fsS http://127.0.0.1:5173 >/dev/null; then exit 0; fi; sleep 1; done
          cat /tmp/p3-after-front.log
          exit 1

      - name: Capture P3 AFTER
        working-directory: frontend
        run: |
          mkdir -p ../artifacts/p3-clinique-after
          cat > .p3-after.mjs <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import { chromium, request } from 'playwright';
          const out=path.resolve('../artifacts/p3-clinique-after');
          const viewports=[{width:390,height:844},{width:430,height:932},{width:768,height:1024},{width:1280,height:900}];
          const api=await request.newContext({baseURL:'http://127.0.0.1:8005'});
          const login=await api.post('/api/auth/login',{form:{username:'t2-browser@cabinet.ma',password:'T2BrowserPass123!'}});
          if(!login.ok()) throw new Error(await login.text());
          const tok=await login.json(); const headers={Authorization:`Bearer ${tok.access_token}`};
          const ps=await api.get('/api/patients',{headers});
          const patient=(await ps.json()).find(p=>p.numero_dossier==='T2-0001');
          if(!patient) throw new Error('T2 patient missing');
          const browser=await chromium.launch({headless:true}); const evidence=[];
          for(const viewport of viewports){
            const ctx=await browser.newContext({viewport,colorScheme:'light'}); const page=await ctx.newPage();
            await page.addInitScript(({a,r})=>{localStorage.setItem('token',a);localStorage.setItem('refresh_token',r||'');localStorage.setItem('appMode','prod');},{a:tok.access_token,r:tok.refresh_token});
            const errors=[]; const http5xx=[];
            page.on('pageerror',e=>errors.push(String(e)));
            page.on('response',r=>{if(r.status()>=500)http5xx.push({url:r.url(),status:r.status()});});
            await page.goto(`http://127.0.0.1:5173/patients/${patient.id}`,{waitUntil:'networkidle',timeout:90000});
            const clinical=page.getByRole('button',{name:'Clinique',exact:true});
            await clinical.waitFor({state:'visible',timeout:30000});
            await clinical.click();
            await page.getByText('Espace Clinique',{exact:true}).waitFor({state:'visible',timeout:30000});
            for(const required of ['Sécurité médicale','Dossier clinique','Master Plan']){
              if(await page.getByText(required,{exact:true}).count()===0) throw new Error(`P3 section missing: ${required}`);
            }
            if(await page.getByText(/Radar de Vigilance/i).count()) throw new Error('Legacy VigilanceRadar still visible');
            await page.waitForTimeout(700);
            const overflow=await page.evaluate(()=>document.documentElement.scrollWidth>document.documentElement.clientWidth+2);
            const shot=`p3-after-${viewport.width}x${viewport.height}.png`;
            await page.screenshot({path:path.join(out,shot),fullPage:false});
            evidence.push({viewport,overflow,errors,http5xx,shot,url:page.url()});
            await ctx.close();
          }
          fs.writeFileSync(path.join(out,'evidence.json'),JSON.stringify(evidence,null,2));
          const invalid=evidence.filter(e=>e.overflow||e.errors.length||e.http5xx.length);
          fs.writeFileSync(path.join(out,'summary.json'),JSON.stringify({captures:evidence.length,invalid,evidence},null,2));
          await browser.close(); await api.dispose();
          if(evidence.length!==4||invalid.length) process.exit(1);
          JS
          node .p3-after.mjs
          rm .p3-after.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: patient-p3-clinique-after
          path: artifacts/p3-clinique-after
          if-no-files-found: error
          retention-days: 14
