name: SEC-P1.2 Experimental FastAPI Native HTTP Parity

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "scripts/security/sec_p1_2_fastapi_parity_lab.py"
      - ".github/workflows/sec-p1-2-fastapi-native-parity.yml"
      - "docs/security/SEC_P1_2_FASTAPI_LAB.md"
      - "backend/core/key_material.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sec-p1-2-http-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  isolated-fastapi-native:
    name: EXPERIMENTAL native module FastAPI parity (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout immutable PR HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify immutable checkout
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Select Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install minimal pinned runtime without production services
        run: >-
          python -m pip install Nuitka==4.3 fastapi==0.115.6
          starlette==0.41.3 pydantic==2.6.3 httpx==0.28.1

      - name: Validate installed dependency contracts
        run: python -m pip check

      - name: Run synthetic HTTP parity on existing compiled backend module
        run: python scripts/security/sec_p1_2_fastapi_parity_lab.py
