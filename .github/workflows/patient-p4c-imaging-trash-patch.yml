    assert_patient_access(patient_id, current_user, db)
    return db.query(models.PanoramicAnalysis).filter(
        models.PanoramicAnalysis.patient_id == patient_id,
        models.PanoramicAnalysis.deleted_at.isnot(None),
    ).order_by(models.PanoramicAnalysis.deleted_at.desc()).all()'''
          if old_pano_list not in text:
              raise SystemExit('panoramic active list marker missing')
          text = text.replace(old_pano_list, new_pano_list, 1)

          old_compare = '''        .filter(models.PanoramicAnalysis.patient_id == patient_id)
