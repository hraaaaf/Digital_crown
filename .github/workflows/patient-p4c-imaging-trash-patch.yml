name: Patient P4C Imaging Trash Patch

on:
  pull_request:
    branches:
      - agent/patient-page-p3-clinique
    paths:
      - '.github/workflows/patient-p4c-imaging-trash-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/patient-page-p4-imagerie'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply recoverable imaging lifecycle
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, count=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              found = text.count(old)
              if found != count:
                  raise SystemExit(f'{path}: expected {count}, found {found}: {old[:120]!r}')
              p.write_text(text.replace(old, new, count), encoding='utf-8')

          models = 'backend/models.py'
          clinical_schema = 'backend/schemas/clinical.py'
          panoramic_schema = 'backend/schemas/panoramic.py'
          ia = 'backend/routers/ia.py'
          journey = 'backend/services/patient_journey_service.py'

          replace_exact(models, '''    created_at: Mapped[datetime] = mapped_column(DateTime, default=func.now())
    
    patient: Mapped["Patient"] = relationship(back_populates="analyses")

class PanoramicAnalysis(Base):''', '''    created_at: Mapped[datetime] = mapped_column(DateTime, default=func.now())
    deleted_at: Mapped[Optional[datetime]] = mapped_column(DateTime, nullable=True, index=True)
    deleted_by: Mapped[Optional[int]] = mapped_column(Integer, nullable=True)
    
    patient: Mapped["Patient"] = relationship(back_populates="analyses")

class PanoramicAnalysis(Base):''')
          replace_exact(models, '''    created_at: Mapped[datetime] = mapped_column(DateTime, default=func.now())
    
    patient: Mapped["Patient"] = relationship(back_populates="panoramic_analyses")''', '''    created_at: Mapped[datetime] = mapped_column(DateTime, default=func.now())
    deleted_at: Mapped[Optional[datetime]] = mapped_column(DateTime, nullable=True, index=True)
    deleted_by: Mapped[Optional[int]] = mapped_column(Integer, nullable=True)
    
    patient: Mapped["Patient"] = relationship(back_populates="panoramic_analyses")''')

          replace_exact(clinical_schema, '''    mm_per_pixel: Optional[float] = None
    created_at: datetime.datetime
    model_config = ConfigDict(from_attributes=True, populate_by_name=True)''', '''    mm_per_pixel: Optional[float] = None
    created_at: datetime.datetime
    deleted_at: Optional[datetime.datetime] = None
    deleted_by: Optional[int] = None
    model_config = ConfigDict(from_attributes=True, populate_by_name=True)''')
          replace_exact(panoramic_schema, '''    id: int
    patient_id: int
    created_at: datetime.datetime
    model_config = ConfigDict(from_attributes=True)''', '''    id: int
    patient_id: int
    created_at: datetime.datetime
    deleted_at: Optional[datetime.datetime] = None
    deleted_by: Optional[int] = None
    model_config = ConfigDict(from_attributes=True)''')

          p = Path(ia)
          text = p.read_text(encoding='utf-8')
          text = text.replace(
              'filter(models.CephaloAnalysis.id == analysis_id).first()',
              'filter(models.CephaloAnalysis.id == analysis_id, models.CephaloAnalysis.deleted_at.is_(None)).first()'
          )
          text = text.replace(
              'filter(models.PanoramicAnalysis.id == analysis_id).first()',
              'filter(models.PanoramicAnalysis.id == analysis_id, models.PanoramicAnalysis.deleted_at.is_(None)).first()'
          )
          text = text.replace(
              'filter(models.PanoramicAnalysis.id == req.analysis_id).first()',
              'filter(models.PanoramicAnalysis.id == req.analysis_id, models.PanoramicAnalysis.deleted_at.is_(None)).first()'
          )

          old_pano_list = '''    analyses = db.query(models.PanoramicAnalysis).filter(
        models.PanoramicAnalysis.patient_id == patient_id
    ).order_by(models.PanoramicAnalysis.created_at.desc()).all()
    return analyses'''
          new_pano_list = '''    analyses = db.query(models.PanoramicAnalysis).filter(
        models.PanoramicAnalysis.patient_id == patient_id,
        models.PanoramicAnalysis.deleted_at.is_(None),
    ).order_by(models.PanoramicAnalysis.created_at.desc()).all()
    return analyses


