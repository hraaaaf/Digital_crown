name: V1.5-02.4 Photo Lifecycle Gate

on:
  push:
    branches:
      - fix/v1-5-02-4-photo-lifecycle-permissions
  pull_request:
    branches: [master]
    paths:
      - "frontend/src/features/patients/components/PatientAvatar.tsx"
      - "frontend/src/features/patients/components/PatientAvatar.test.tsx"
      - "frontend/src/features/patients/components/PatientPhotoEditor.tsx"
      - "frontend/src/features/patients/components/PatientPhotoEditor.test.tsx"
      - "frontend/src/features/mobile/Dashboard/views/WaitingRoomView.tsx"
      - "frontend/src/features/mobile/Dashboard/views/WaitingRoomView.g3Interactive.test.tsx"
      - "frontend/src/features/mobile/Dashboard/MobileG3BrowserCertHarness.tsx"
      - "frontend/scripts/capture-v15-02-3-photo-ui-after.mjs"
      - "backend/tests/test_patient_profile_photo_v15.py"
      - ".github/workflows/v15-02-4-photo-lifecycle.yml"
  workflow_dispatch:

concurrency:
  group: v15-02-4-photo-lifecycle-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ENVIRONMENT: test
      SECRET_KEY: v15-02-4-photo-lifecycle-secret-long-enough
      DATABASE_URL: sqlite:///./t2-runtime-cert.db
      DIGITALCROWN_ISOLATED_RUNTIME: "1"
      DIGITALCROWN_ISOLATION_DB_FINGERPRINT: c04779c8d18b3ac12a0f4093a47a5d0c3c0e2251714be532893cfa052e9ee780
      TELEMETRY_ENABLED: "false"
      CLOUD_AI_ENABLED: "false"
      DEBUG: "false"
      ALLOWED_ORIGINS: http://127.0.0.1:5173,http://localhost:5173
      EVALUATED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      EVALUATED_BASE: ${{ github.event.pull_request.base.sha || '98b739788d1793d91babeaf83d5db6fc8f0e99a6' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EVALUATED_SHA }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Runtime credential
        run: |
          echo "T2_USER=t2-browser@cabinet.ma" >> "$GITHUB_ENV"
          echo "T2_PASSWORD=$(python -c 'import secrets; print(secrets.token_urlsafe(32))')" >> "$GITHUB_ENV"

      - name: Backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.12.0 torchvision==0.27.0 --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^(torch|torchvision)([<=>].*)?$' requirements.txt >/tmp/requirements-v15-02-4.txt
          pip install -r /tmp/requirements-v15-02-4.txt

      - name: Backend photo contract regression
        run: python -m pytest backend/tests/test_patient_profile_photo_v15.py -q

      - name: Frontend dependencies + Chromium
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Frontend photo lifecycle tests
        working-directory: frontend
        run: npx vitest run src/features/patients/components/PatientAvatar.test.tsx src/features/patients/components/PatientPhotoEditor.test.tsx --maxWorkers=1 --fileParallelism=false

      - name: Frontend build
        working-directory: frontend
        run: npm run build

      - name: Start backend
        run: |
          rm -f t2-runtime-cert.db
          python scripts/t2_runtime_server.py >/tmp/v15-02-4-backend.log 2>&1 &
          for i in {1..90}; do curl -fsS http://127.0.0.1:8005/health >/dev/null && exit 0; sleep 1; done
          cat /tmp/v15-02-4-backend.log
          exit 1

      - name: Start frontend
        working-directory: frontend
        env:
          VITE_DC_PREVIEW_DEMO: "1"
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 >/tmp/v15-02-4-frontend.log 2>&1 &
          for i in {1..90}; do curl -fsS http://127.0.0.1:5173 >/dev/null && exit 0; sleep 1; done
          cat /tmp/v15-02-4-frontend.log
          exit 1

      - name: Capture responsive lifecycle matrix
        working-directory: frontend
        run: |
          node scripts/run-with-t2-workstation.mjs scripts/capture-v15-02-3-photo-ui-after.mjs
          rm -rf ../artifacts/v15-02-4-photo-lifecycle
          mkdir -p ../artifacts/v15-02-4-photo-lifecycle
          cp -R ../artifacts/v15-02-3-photo-ui-after/. ../artifacts/v15-02-4-photo-lifecycle/
          node -e "const fs=require('fs');const p='../artifacts/v15-02-4-photo-lifecycle/evidence.json';const j=JSON.parse(fs.readFileSync(p));j.phase='V1.5-02.4';j.head=process.env.EVALUATED_SHA;j.base=process.env.EVALUATED_BASE;j.evidenceSource='real-photo-lifecycle-after';fs.writeFileSync(p,JSON.stringify(j,null,2));"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v15-02-4-photo-lifecycle
          path: artifacts/v15-02-4-photo-lifecycle
          if-no-files-found: error
          retention-days: 14
