name: Client Copy SuperAdmin Finalize

on:
  push:
    branches:
      - fix/client-facing-copy-hygiene

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/client-facing-copy-hygiene
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Apply copy hygiene patch
        run: python scripts/finalize_superadmin_copy.py

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run targeted copy-hygiene tests
        working-directory: frontend
        run: npm test -- src/ClientFacingCopyCandidateAudit.test.ts src/features/mobile/Dashboard/views/MobileSuperAdminView.test.tsx

      - name: Validate diff
        run: |
          git diff --check
          git diff --stat

      - name: Remove one-shot files
        run: |
          rm .github/workflows/client-copy-superadmin-finalize.yml
          rm scripts/finalize_superadmin_copy.py

      - name: Commit verified patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(ui): remove SuperAdmin implementation wording"
          git push origin HEAD:fix/client-facing-copy-hygiene
