name: V1.5-04.8 C Real Cabinet Auth and Clinical E2E

on:
  pull_request:
    branches:
      - feat/v15-04-8-integration-bcd-lab-20261013
      - feat/v15-04-8-attestation-recovery-guard-20261013
    paths:
      - "backend/tests/test_station_print_real_auth_clinical_e2e_v15.py"
      - "backend/routers/station_print_config_admin.py"
      - "backend/services/station_print_attestation_recovery_v15.py"
      - ".github/workflows/v15-04-8-c-real-auth-clinical-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clinical-deny-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ENVIRONMENT: test
      DIGITALCROWN_ISOLATED_RUNTIME: "true"
      SECRET_KEY: v15-04-8-c-real-auth-e2e-synthetic-secret-key
      DATABASE_URL: sqlite:///./synthetic-only.db
      TELEMETRY_ENABLED: "false"
      CLOUD_AI_ENABLED: "false"
      DEBUG: "false"
    steps:
      - name: Checkout exact PR source SHA, not synthetic merge
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact HEAD
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install backend dependencies without GPU packages
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.10.0 torchvision==0.25.0 torchaudio==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^(torch|torchvision|torchaudio)([<=>].*)?$' requirements.txt >/tmp/v15-04-8-c-e2e-deps.txt
          pip install -r /tmp/v15-04-8-c-e2e-deps.txt
      - name: Collect tests with authentic app fixture
        run: |
          python -m py_compile backend/tests/test_station_print_real_auth_clinical_e2e_v15.py
          python -m pytest backend/tests/test_station_print_real_auth_clinical_e2e_v15.py backend/tests/test_station_care_sheet_v15.py --collect-only -q | tee /tmp/v15-04-8-c-e2e-collect.txt
          grep -Eq '[0-9]+ tests? collected' /tmp/v15-04-8-c-e2e-collect.txt
      - name: Exercise REAL FastAPI auth JWT, workstation cookie, PIN and clinical archives
        run: python -m pytest backend/tests/test_station_print_real_auth_clinical_e2e_v15.py backend/tests/test_station_care_sheet_v15.py -q
