name: Settings Security Visual Certification

on:
  pull_request:
    paths:
      - "frontend/src/features/admin/Settings/tabs/SecurityTab.tsx"
      - "frontend/src/features/admin/Security/MobileSecurity.tsx"
      - ".github/workflows/settings-security-visual-cert.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend and browser
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Inject targeted Settings security harness
        working-directory: frontend
        run: |
          cat > settings-security-cert.html <<'EOF'
          <!doctype html><html lang="fr"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><link rel="icon" href="data:,"/><title>Settings Security</title></head><body><div id="root"></div><script type="module" src="/src/settings-security-cert.tsx"></script></body></html>
          EOF

          cat > src/settings-security-cert.tsx <<'EOF'
          import React from 'react';
          import { createRoot } from 'react-dom/client';
          import { MemoryRouter } from 'react-router-dom';
          import './index.css';
          import Settings from './pages/Settings';
          import { useAuthStore } from './stores/useAuthStore';

          useAuthStore.setState({
            user: ({ id: 1, email: 'admin@security-cert.local', nom_complet: 'Dr Security', role: 'ADMIN', is_superadmin: false, permissions: {} } as any),
            isAuthenticated: true,
            isLoading: false,
            error: null,
          });

          createRoot(document.getElementById('root')!).render(
            <MemoryRouter initialEntries={['/settings']}><Settings /></MemoryRouter>,
          );
          EOF

          cat > settings-security-cert.mjs <<'EOF'
          import { chromium } from 'playwright';
          import { createServer } from 'vite';
          import fs from 'node:fs/promises';

          const output = 'settings-security-artifacts';
          await fs.mkdir(output, { recursive: true });
          const json = body => ({ status: 200, contentType: 'application/json', body: JSON.stringify(body) });
          const profile = {
            id: 1, public_id: 'security-cert', nom_cabinet: 'Cabinet Security', nom_praticien: 'Dr Security',
            footer_address: 'Rabat, Maroc', footer_phones: '05 37 00 00 00', primary_color: '#003380',
            secondary_color: '#1e40af', accent_color: '#60a5fa', selected_theme: 'elite', font_fr: 'inter',
            selected_template: 'swiss', header_lines_fr: ['Dr Security'], header_lines_ar: [], specialty_ids: [],
            contacts_json: {}, margin_top: 3.6, margin_bottom: 3.2, watermark_enabled: false, use_letterhead: false,
            qr_code_enabled: false, qr_code_type: 'VCARD', qr_code_style: 'dots', show_patient_badges: true,
            performance_mode: false, clinical_tips_enabled: true, hide_header: true, hide_footer: true, cabinet_type: 'PRIVE',
          };

          const server = await createServer({ server: { host: '127.0.0.1', port: 4178, strictPort: true }, clearScreen: false });
          await server.listen();
          const browser = await chromium.launch();
          const widths = [1440, 1024, 768, 430, 390];
          try {
            for (const width of widths) {
              const context = await browser.newContext({ viewport: { width, height: 1200 } });
              const page = await context.newPage();
              const errors = [];
              page.on('pageerror', e => errors.push(`pageerror: ${e.message}`));
              page.on('console', m => { if (m.type() === 'error') errors.push(`console: ${m.text()}`); });

              await page.route('**/*', async route => {
                const request = route.request();
                const url = new URL(request.url());
                if (url.port !== '8005' || !url.pathname.startsWith('/api/')) return route.continue();
                if (request.method() !== 'GET') return route.fulfill(json({}));
                if (url.pathname === '/api/clinics/me') return route.fulfill(json(profile));
                if (url.pathname.includes('/audit-logs')) return route.fulfill(json({ total: 0, logs: [] }));
                if (url.pathname.includes('/backups')) return route.fulfill(json([]));
                return route.fulfill(json({}));
              });

              await page.goto('http://127.0.0.1:4178/settings-security-cert.html', { waitUntil: 'networkidle' });
              await page.getByRole('heading', { name: 'Paramètres', exact: true }).waitFor({ timeout: 15000 });
              await page.getByRole('button', { name: 'Sécurité & Backup', exact: true }).click();
              await page.getByRole('heading', { name: 'Sécurité & Souveraineté', exact: true }).waitFor({ state: 'visible' });
              await page.getByText('Sauvegarde chiffrée vérifiée', { exact: true }).waitFor({ state: 'visible' });
              await page.getByText("Afficher le code d'appairage", { exact: true }).waitFor({ state: 'visible' });

              const bodyWidth = await page.evaluate(() => document.documentElement.scrollWidth);
              if (bodyWidth > width) throw new Error(`Horizontal overflow: document=${bodyWidth}, viewport=${width}`);
              if (errors.length) throw new Error(errors.join('\n'));

              await page.screenshot({ path: `${output}/admin-securite-${width}x1200.png`, fullPage: true, animations: 'disabled' });
              await context.close();
            }
          } finally {
            await browser.close();
            await server.close();
          }
          EOF

      - name: Capture and assert Security views
        working-directory: frontend
        run: node settings-security-cert.mjs

      - name: Verify proof count
        working-directory: frontend
        run: test "$(find settings-security-artifacts -name '*.png' | wc -l)" -eq 5

      - uses: actions/upload-artifact@v4
        with:
          name: settings-security-visual-cert
          path: frontend/settings-security-artifacts/
          if-no-files-found: error
          retention-days: 14
