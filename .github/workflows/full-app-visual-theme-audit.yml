name: Full App Visual Theme Audit

on:
  push:
    branches: [audit/visual-theme-2026-09-08]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-app-visual-theme-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    name: Capture desktop and mobile themes
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend and Chromium
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Write audit harness
        working-directory: frontend
        run: |
          cat > full-app-visual-audit.mjs <<'EOF'
          import { chromium } from 'playwright';
          import { createServer } from 'vite';
          import fs from 'node:fs/promises';

          const OUT = '../artifacts/full-app-visual-audit';
          await fs.mkdir(OUT, { recursive: true });

          const routes = [
            '/',
            '/landing', '/download', '/activate', '/login', '/register', '/terms', '/privacy',
            '/dashboard', '/agenda', '/accounting', '/patients', '/patients/new',
            '/patients/1', '/patients/1/archives', '/patients/1/edit',
            '/settings', '/analytics', '/labo', '/stock', '/approvisionnement',
            '/approvisionnement/partenaire/1', '/approvisionnement/produits/1',
            '/salle-attente', '/bibliotheque', '/science-hub', '/super-admin',
            '/mobile/onboarding', '/mobile/dashboard', '/mobile/context', '/mobile/dentists', '/mobile/superadmin'
          ];

          const desktopWidths = [1280];
          const mobileWidths = [390, 430];
          const themes = ['default', 'medical-ocean'];

          const now = Math.floor(Date.now() / 1000);
          const payload = Buffer.from(JSON.stringify({ exp: now + 86400, sub: 'visual-audit' })).toString('base64url');
          const token = `e30.${payload}.sig`;

          const user = {
            id: 1,
            email: 'audit@digitalcrown.local',
            nom_complet: 'Dr Audit Visuel',
            role: 'ADMIN',
            is_superadmin: true,
            permissions: {},
          };

          const patient = {
            id: 1, nom: 'BENALI', prenom: 'Sara', sexe: 'F', telephone: '0600000000',
            email: 'sara@example.test', date_naissance: '1990-05-15', ville: 'Rabat',
            adresse: 'Agdal', profession: 'Architecte', created_at: '2026-09-01T10:00:00'
          };

          const appointments = [
            { id: 1, patient_id: 1, start_time: '2026-09-08T09:00:00', end_time: '2026-09-08T09:30:00', status: 'PLANIFIÉ', description: 'Consultation', patient },
            { id: 2, patient_id: 1, start_time: '2026-09-08T11:00:00', end_time: '2026-09-08T11:45:00', status: 'EN_S_ATTENTE', description: 'Contrôle', patient },
          ];

          function fixture(pathname, method) {
            if (pathname === '/health') return { status: 'ok' };
            if (pathname.endsWith('/api/auth/me')) return user;
            if (pathname.endsWith('/api/clinics/init-status')) return { is_initialized: true };
            if (pathname.endsWith('/api/clinics/me')) return { id: 1, nom: 'Cabinet Digital Crown', nom_praticien: 'Dr Audit Visuel', city: 'Rabat' };
            if (pathname.endsWith('/api/clinics/me/practitioner')) return { id: 1, nom_complet: 'Dr Audit Visuel' };
            if (pathname.includes('/api/patients/1')) return patient;
            if (pathname.endsWith('/api/patients/') || pathname.endsWith('/api/patients')) return [patient];
            if (pathname.includes('/api/appointments')) return appointments;
            if (pathname.includes('/api/admin/dashboard/stats')) return {
              total_patients: 184, total_analyses: 326, in_waiting: 2,
              weekly_activity: [38,55,47,72,61,84,66], weekly_patient_counts: [4,7,5,9,6,10,8], weekly_patients: 49,
              recent_patients: [{ id: 1, nom: 'BENALI', prenom: 'Sara', acte: 'Consultation', time: '09:20', type: 'patient' }]
            };
            if (pathname.includes('/api/admin/cabinet-health')) return {
              database: { status: 'ok' }, disk: { status: 'ok', free_gb: 418.6, total_gb: 512 },
              backup_local: { status: 'ok', overall_status: 'ok', age_hours: 3 },
              offsite: { status: 'ok', offsite_status: 'ok', db_copied: true, media_copied: true }, overall_severity: 'ok'
            };
            if (pathname.includes('/api/intelligence/alerts/today')) return { alerts: [] };
            if (pathname.includes('/api/intelligence/forecast-semaine')) return { week_start: '2026-09-07', week_end: '2026-09-13', rdv_count: 31, forecast_revenue: 28400, avg_per_rdv: 916 };
            if (pathname.includes('/api/intelligence/taux-conversion')) return { devis_count: 12, converted_count: 8, taux: 66.7, avg_days: 4 };
            if (pathname.includes('/api/intelligence/projection-mensuelle')) return { historical: [], projections: [], avg_monthly: 77233 };
            if (pathname.includes('/api/intelligence/latent-cash')) return { total_opportunites: 0, valeur_totale_latente: 0, opportunites: [] };
            if (pathname.includes('/api/stats/financial')) return { today_revenue: 6200, month_revenue: 48600, total_debt: 9300 };
            if (pathname.includes('/api/mobile/')) {
              if (pathname.includes('snapshot')) return { patients: [patient], appointments, generated_at: new Date().toISOString() };
              return {};
            }
            if (pathname.includes('marketplace') || pathname.includes('catalog') || pathname.includes('partners') || pathname.includes('products')) return [];
            if (pathname.includes('stock')) return [];
            if (pathname.includes('analytics') || pathname.includes('stats') || pathname.includes('account')) return {};
            if (pathname.startsWith('/api/') || pathname.includes('/api/')) return method === 'GET' ? {} : {};
            return null;
          }

          const server = await createServer({ server: { host: '127.0.0.1', port: 4177, strictPort: true }, clearScreen: false });
          await server.listen();
          const browser = await chromium.launch();

          const manifest = [];
          try {
            for (const theme of themes) {
              for (const routePath of routes) {
                const isMobileRoute = routePath.startsWith('/mobile/');
                const widths = isMobileRoute ? mobileWidths : desktopWidths;
                for (const width of widths) {
                  const height = isMobileRoute ? 844 : 1000;
                  const context = await browser.newContext({ viewport: { width, height }, locale: 'fr-FR' });
                  const page = await context.newPage();
                  const errors = [];
                  page.on('pageerror', e => errors.push(`pageerror: ${e.message}`));
                  page.on('console', m => { if (m.type() === 'error') errors.push(`console: ${m.text()}`); });

                  await page.route('**/*', async r => {
                    const req = r.request();
                    const u = new URL(req.url());
                    const body = fixture(u.pathname, req.method());
                    const isBackend = u.port === '8005' || u.pathname.startsWith('/api/') || u.pathname === '/health';
                    if (isBackend) {
                      const payload = body ?? {};
                      return r.fulfill({ status: 200, contentType: 'application/json', body: JSON.stringify(payload) });
                    }
                    return r.continue();
                  });

                  await page.addInitScript(({ token, theme }) => {
                    localStorage.setItem('token', token);
                    localStorage.setItem('appMode', 'prod');
                    localStorage.setItem('performanceMode', 'false');
                    localStorage.setItem('app_background_animated', 'false');
                    if (theme === 'default') localStorage.removeItem('digitalcrown_theme');
                    else localStorage.setItem('digitalcrown_theme', theme);
                  }, { token, theme });

                  if (isMobileRoute && routePath !== '/mobile/onboarding') {
                    await page.goto('http://127.0.0.1:4177/mobile/onboarding', { waitUntil: 'domcontentloaded' });
                    await page.evaluate(async ({ token }) => {
                      await new Promise((resolve, reject) => {
                        const request = indexedDB.open('digital-crown-zka', 1);
                        request.onupgradeneeded = () => {
                          const db = request.result;
                          if (!db.objectStoreNames.contains('secure_keys')) db.createObjectStore('secure_keys');
                        };
                        request.onerror = () => reject(request.error);
                        request.onsuccess = () => {
                          const db = request.result;
                          const tx = db.transaction('secure_keys', 'readwrite');
                          tx.objectStore('secure_keys').put({
                            publicId: '0123456789abcdef',
                            masterKey: 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa',
                            access_token: token,
                            refresh_token: 'visual-refresh',
                            device_id: 'visual-device',
                            api_base_url: 'http://127.0.0.1:8005'
                          }, 'zka_credentials');
                          tx.oncomplete = () => { db.close(); resolve(); };
                          tx.onerror = () => reject(tx.error);
                        };
                      });
                    }, { token });
                  }

                  const url = `http://127.0.0.1:4177${routePath}`;
                  await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 30000 });
                  await page.waitForTimeout(2500);
                  const finalUrl = page.url();
                  const title = await page.title();
                  const bodyText = (await page.locator('body').innerText().catch(() => '')).slice(0, 500);
                  const slug = routePath === '/' ? 'root' : routePath.replace(/^\//, '').replaceAll('/', '__');
                  const file = `${theme}__${slug}__${width}x${height}.png`;
                  await page.screenshot({ path: `${OUT}/${file}`, fullPage: true, animations: 'disabled' });
                  await fs.writeFile(`${OUT}/${file}.errors.txt`, errors.join('\n'));
                  manifest.push({ theme, route: routePath, width, height, file, finalUrl, title, bodyText, errors });
                  await context.close();
                }
              }
            }
          } finally {
            await browser.close();
            await server.close();
          }

          await fs.writeFile(`${OUT}/manifest.json`, JSON.stringify({ sha: process.env.GITHUB_SHA, generated_at: new Date().toISOString(), manifest }, null, 2));
          EOF

      - name: Capture all routes and themes
        working-directory: frontend
        run: node full-app-visual-audit.mjs

      - name: Upload visual audit
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-app-visual-theme-audit
          path: artifacts/full-app-visual-audit
          retention-days: 14
          if-no-files-found: error
