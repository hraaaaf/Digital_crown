name: Facad 3.14 D3 snapshot validator (EXPERIMENTAL)

on:
  push:
    branches:
      - feat/cephalo-facad-direct-parity-runtime-probe
    paths:
      - scripts/facad_314_d3_snapshot_diff_gate.py
      - scripts/test_facad_314_d3_snapshot_diff_gate.py
      - scripts/facad_314_d3_cold_warm_verdict_gate.py
      - scripts/facad_314_d3e_facad_root_pid_write_observer.ps1
      - scripts/facad_314_d3e_facad_root_pid_verdict_gate.py
      - scripts/test_facad_314_d3e_facad_root_pid_verdict_gate.py
      - scripts/facad_314_d3e3_same_file_correlation_gate.py
      - scripts/test_facad_314_d3e3_same_file_correlation_gate.py
      - scripts/facad_314_d3e4_unattributed_classification_gate.py
      - scripts/test_facad_314_d3e4_unattributed_classification_gate.py
      - scripts/facad_314_d3e5_first_observed_timing_gate.py
      - scripts/test_facad_314_d3e5_first_observed_timing_gate.py
      - scripts/facad_314_d3e6_early_window_gate.py
      - scripts/test_facad_314_d3e6_early_window_gate.py
      - scripts/facad_314_d3e7_preflight_gate.py
      - scripts/test_facad_314_d3e7_preflight_gate.py
      - scripts/facad_314_d3e8_passive_control_gate.py
      - scripts/test_facad_314_d3e8_passive_control_gate.py
      - scripts/facad_314_d3e9_independent_arm.ps1
      - scripts/facad_314_d3e9_arm_gate.py
      - scripts/test_facad_314_d3e9_arm_gate.py
      - scripts/facad_314_d3e10_provenance_gate.py
      - scripts/test_facad_314_d3e10_provenance_gate.py
      - scripts/facad_314_d3e11_observation_gate.py
      - scripts/test_facad_314_d3e11_observation_gate.py
      - scripts/facad_314_d3e12_etw_feasibility.ps1
      - scripts/facad_314_d3e12_etw_gate.py
      - scripts/test_facad_314_d3e12_etw_gate.py
      - .github/workflows/facad-314-d3e12-etw-feasibility.yml
      - scripts/test_facad_314_d3_cold_warm_verdict_gate.py
      - scripts/facad_314_d3_storage_authority_gap_gate.py
      - scripts/test_facad_314_d3_storage_authority_gap_gate.py
      - docs/audits/FACAD_314_D3_STORAGE_ISOLATION_STATIC_REVIEW_2026-10-09.md
      - scripts/facad_314_d3_windows_snapshot.ps1
      - scripts/facad_314_d3_process_io_observer.ps1
      - .github/workflows/facad-314-d3-snapshot-validator.yml
      - .github/workflows/facad-314-d3-windows-storage-observation.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-d3-guard-tests:
    name: offline D3 guard (NO isolation certification)
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record immutable exact HEAD for source-only gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "EXACT_HEAD=$GITHUB_SHA"
          grep -Fq '## 6. Phase D3B' docs/audits/FACAD_314_D3_STORAGE_ISOLATION_STATIC_REVIEW_2026-10-09.md
          grep -Fq 'REGISTRY_WRITE_EVENT_ATTRIBUTION' docs/audits/FACAD_314_D3_STORAGE_ISOLATION_STATIC_REVIEW_2026-10-09.md
          grep -Fq '$officialScopeCount=10' .github/workflows/facad-314-d3-windows-storage-observation.yml
          grep -Fq '$evidence.monitored_scope_count -ne $officialScopeCount' .github/workflows/facad-314-d3-windows-storage-observation.yml
          grep -Fq 'D3 BLOCKED: observed storage drift in cold or warm' .github/workflows/facad-314-d3-windows-storage-observation.yml
          grep -Fq 'd3-cold-warm-research-summary.json' .github/workflows/facad-314-d3-windows-storage-observation.yml
          if grep -Fq '$evidence.monitored_scope_count -ne 9' .github/workflows/facad-314-d3-windows-storage-observation.yml; then exit 1; fi
          grep -Fq 'root-PID write-use attribution unproven' .github/workflows/facad-314-d3-windows-storage-observation.yml
          grep -Fq 'd3e3-event-keys-' .github/workflows/facad-314-d3-windows-storage-observation.yml
          grep -Fq 'D3E3_TEMPORARY_EVENT_KEY_IDS_CLEANED=true' .github/workflows/facad-314-d3-windows-storage-observation.yml
          grep -Fq 'D3E4_' .github/workflows/facad-314-d3-windows-storage-observation.yml
          grep -Fq 'D3E5_PRIVATE_TIMELINE_CLEANED=true' .github/workflows/facad-314-d3-windows-storage-observation.yml
          grep -Fq 'D3E6_PRIVATE_PRELAUNCH_CLEANED=true' .github/workflows/facad-314-d3-windows-storage-observation.yml
          grep -Fq 'D3E7_PRIVATE_PREFLIGHT_CLEANED=true' .github/workflows/facad-314-d3-windows-storage-observation.yml
          grep -Fq 'D3E8_PRIVATE_CONTROL_CLEANED=true' .github/workflows/facad-314-d3-windows-storage-observation.yml
          grep -Fq 'arm: [passive_1, passive_2, sacl_1, sacl_2]' .github/workflows/facad-314-d3-windows-storage-observation.yml
          grep -q 'name: facad-314-d3-windows-storage-.*matrix.arm' .github/workflows/facad-314-d3-windows-storage-observation.yml
          grep -Fq 'D3E9_MATCHED_COUNTERFACTUAL_PROVEN=false' .github/workflows/facad-314-d3-windows-storage-observation.yml
          grep -Fq 'D3E10_ARM_VERDICT=' .github/workflows/facad-314-d3-windows-storage-observation.yml
          grep -Fq 'D3E11_ARM_VERDICT=' .github/workflows/facad-314-d3-windows-storage-observation.yml
          grep -Fq 'Microsoft-Windows-Kernel-File' scripts/facad_314_d3e12_etw_feasibility.ps1
          grep -Fq 'D3E12_RAW_TRACE_CLEANED=' scripts/facad_314_d3e12_etw_feasibility.ps1
          grep -Fq 'tracerpt.exe' scripts/facad_314_d3e12_etw_feasibility.ps1
          grep -Fq 'D3E12_ETW_DECODER=' scripts/facad_314_d3e12_etw_feasibility.ps1
          grep -Fq 'D3E12_DIRECT_ETL_READ_STATUS=' scripts/facad_314_d3e12_etw_feasibility.ps1
          grep -Fq 'D3E12_TRACERPT_EVTX_READ_STATUS=' scripts/facad_314_d3e12_etw_feasibility.ps1
          grep -Fq 'D3E12_XML_READ_STATUS=' scripts/facad_314_d3e12_etw_feasibility.ps1
          grep -Fq '[System.Xml.DtdProcessing]::Prohibit' scripts/facad_314_d3e12_etw_feasibility.ps1
          grep -Fq 'MaxCharactersInDocument=25000000' scripts/facad_314_d3e12_etw_feasibility.ps1
          grep -Fq 'tracerpt_xml_raw_exported=$false' scripts/facad_314_d3e12_etw_feasibility.ps1
          if grep -Fq 'private-tracerpt.xml' .github/workflows/facad-314-d3e12-etw-feasibility.yml; then exit 1; fi
          grep -Fq 'D3E12_RAW_ETL_EXPORTED=false' scripts/facad_314_d3e12_etw_gate.py
          grep -Fq 'D3E12_REAL_ILEXIS_TRACE_CAPTURED=false' .github/workflows/facad-314-d3e12-etw-feasibility.yml
          grep -Fq 'facad-d3e12-synthetic-etw' .github/workflows/facad-314-d3e12-etw-feasibility.yml
          if grep -Fq 'local-trace.etl' .github/workflows/facad-314-d3e12-etw-feasibility.yml; then exit 1; fi
          if grep -Fq 'patient' .github/workflows/facad-314-d3e12-etw-feasibility.yml; then exit 1; fi
          grep -Fq 'D3E11_WRITER_PID_PROVEN=false' scripts/facad_314_d3e9_independent_arm.ps1
          grep -Fq 'Register-ObjectEvent -InputObject $watcher -EventName Error' scripts/facad_314_d3e9_independent_arm.ps1
          grep -Fq 'Get-Acl -LiteralPath $postPaths[$key] -Audit' scripts/facad_314_d3e9_independent_arm.ps1
          grep -Fq 'notification_delivery_complete_proven=$false' scripts/facad_314_d3e9_independent_arm.ps1
          grep -Fq 'd3e11-checked-sacl_2.json' .github/workflows/facad-314-d3-windows-storage-observation.yml
          if grep -Fq 'facad-quick-demo/d3e11-raw-' .github/workflows/facad-314-d3-windows-storage-observation.yml; then exit 1; fi
          grep -Fq 'D3E10_ARM_AUDIT_QUERY_OUTCOME=' .github/workflows/facad-314-d3-windows-storage-observation.yml
          grep -Fq "'NoMatchingEventsFound*'" scripts/facad_314_d3e9_independent_arm.ps1
          grep -Fq "security_4663_query_outcome" scripts/facad_314_d3e10_provenance_gate.py
          grep -Fq 'd3e10-checked-sacl_1.json' .github/workflows/facad-314-d3-windows-storage-observation.yml
          grep -Fq 'file_content_read=$false' scripts/facad_314_d3e9_independent_arm.ps1
          grep -Fq 'full_event_delivery_proven=$false' scripts/facad_314_d3e9_independent_arm.ps1
          grep -Fq 'file_identity_or_size_or_timestamp_exported=$false' scripts/facad_314_d3e9_independent_arm.ps1
          if grep -Fq 'raw_event_xml' .github/workflows/facad-314-d3-windows-storage-observation.yml; then exit 1; fi
          grep -Fq 'sacl_restored' scripts/facad_314_d3e9_independent_arm.ps1
          grep -Fq 'Set-Acl -LiteralPath $root -AclObject $oldAcl' scripts/facad_314_d3e9_independent_arm.ps1
          grep -Fq 'if($Arm.StartsWith' scripts/facad_314_d3e9_independent_arm.ps1
          grep -Fq 'd3e8-control-cold.json' .github/workflows/facad-314-d3-windows-storage-observation.yml
          if grep -Fq 'facad-quick-demo/d3e8-passive-control-' .github/workflows/facad-314-d3-windows-storage-observation.yml; then exit 1; fi
          grep -Fq 'd3e7-preflight-cold.json' .github/workflows/facad-314-d3-windows-storage-observation.yml
          if grep -Fq 'facad-quick-demo/d3e7-preflight-cold.json.local' .github/workflows/facad-314-d3-windows-storage-observation.yml; then exit 1; fi
          grep -Fq 'd3e6-early-window-cold.json' .github/workflows/facad-314-d3-windows-storage-observation.yml
          if grep -Fq 'facad-quick-demo/d3e6-prelaunch-' .github/workflows/facad-314-d3-windows-storage-observation.yml; then exit 1; fi
          if grep -Fq 'facad-quick-demo/d3e5-timeline-' .github/workflows/facad-314-d3-windows-storage-observation.yml; then exit 1; fi
          grep -Fq 'other_pid_relative_key_hashes' scripts/facad_314_d3e_facad_root_pid_write_observer.ps1
          grep -Fq 'non_root_events_are_proven_descendants' scripts/facad_314_d3e4_unattributed_classification_gate.py
          if grep -Fq 'facad-quick-demo/d3e3-event-keys-' .github/workflows/facad-314-d3-windows-storage-observation.yml; then exit 1; fi
          grep -Fq 'POSITIVE_FACAD_ROOT_PID_WRITE_USE_EVENTS_NOT_ISOLATION' scripts/facad_314_d3e_facad_root_pid_verdict_gate.py
          echo "D3_REGISTRY_VALUES_READ=false"
      - name: Validate syntax
        run: python -m py_compile scripts/facad_314_d3_snapshot_diff_gate.py scripts/test_facad_314_d3_snapshot_diff_gate.py
      - name: Verify synthetic D3 drift and fail-closed evidence
        run: python -m unittest scripts/test_facad_314_d3_snapshot_diff_gate.py -v
      - name: Test independent cold/warm verdict gate (SYNTHETIC ONLY)
        run: |
          python -m py_compile scripts/facad_314_d3_cold_warm_verdict_gate.py scripts/test_facad_314_d3_cold_warm_verdict_gate.py
          python -m unittest scripts/test_facad_314_d3_cold_warm_verdict_gate.py -v
          echo 'D3_COLD_WARM_RUNTIME_OBSERVATION=NOT_CERTIFIED_BY_THIS_JOB'
      - name: Verify root-PID file-write evidence contract (SYNTHETIC ONLY)
        run: |
          python -m py_compile scripts/facad_314_d3e_facad_root_pid_verdict_gate.py scripts/test_facad_314_d3e_facad_root_pid_verdict_gate.py
          python -m unittest scripts/test_facad_314_d3e_facad_root_pid_verdict_gate.py -v
          echo 'FACAD_REAL_WRITE_ATTRIBUTION=NOT_TESTED_BY_THIS_JOB'
      - name: Test private same-file correlation with adversarial synthetic evidence
        run: |
          python -m py_compile scripts/facad_314_d3e3_same_file_correlation_gate.py scripts/test_facad_314_d3e3_same_file_correlation_gate.py
          python -m unittest scripts/test_facad_314_d3e3_same_file_correlation_gate.py -v
          echo 'D3E3_REAL_FACAD_CORRELATION=NOT_TESTED_BY_THIS_JOB'
      - name: Adversarial synthetic classification of unexplained file identity
        run: |
          python -m py_compile scripts/facad_314_d3e4_unattributed_classification_gate.py scripts/test_facad_314_d3e4_unattributed_classification_gate.py
          python -m unittest scripts/test_facad_314_d3e4_unattributed_classification_gate.py -v
          echo 'D3E4_LIVE_UNATTRIBUTED_FILE_CLASSIFICATION=NOT_TESTED_BY_THIS_JOB'
      - name: Adversarial synthetic temporal classification (NO live Facad)
        run: |
          python -m py_compile scripts/facad_314_d3e5_first_observed_timing_gate.py scripts/test_facad_314_d3e5_first_observed_timing_gate.py
          python -m unittest scripts/test_facad_314_d3e5_first_observed_timing_gate.py -v
          echo 'D3E5_LIVE_INTERVAL_CAUSALITY=UNVERIFIED'
      - name: Adversarial synthetic prelaunch startup window (NO live Facad)
        run: |
          python -m py_compile scripts/facad_314_d3e6_early_window_gate.py scripts/test_facad_314_d3e6_early_window_gate.py
          python -m unittest scripts/test_facad_314_d3e6_early_window_gate.py -v
          echo 'D3E6_LIVE_ROOT_PROCESS_WRITER=NOT_PROVEN_BY_THIS_JOB'
      - name: Adversarial synthetic observer audit and SACL brackets (NO live Facad)
        run: |
          python -m py_compile scripts/facad_314_d3e7_preflight_gate.py scripts/test_facad_314_d3e7_preflight_gate.py
          python -m unittest scripts/test_facad_314_d3e7_preflight_gate.py -v
          echo 'D3E7_AUDIT_OR_SACL_CAUSALITY=NOT_PROVEN_BY_THIS_JOB'
      - name: Adversarial synthetic passive no-SACL control evidence (NO live Facad)
        run: |
          python -m py_compile scripts/facad_314_d3e8_passive_control_gate.py scripts/test_facad_314_d3e8_passive_control_gate.py
          python -m unittest scripts/test_facad_314_d3e8_passive_control_gate.py -v
          echo 'D3E8_SACL_CAUSALITY=NOT_PROVEN_BY_THIS_JOB'
      - name: Adversarial synthetic independent Windows D3E9 arms (NO live Facad)
        run: |
          python -m py_compile scripts/facad_314_d3e9_arm_gate.py scripts/test_facad_314_d3e9_arm_gate.py
          python -m unittest scripts/test_facad_314_d3e9_arm_gate.py -v
          echo 'D3E9_INDEPENDENT_RUNNERS=NOT_SIMULATED_BY_SOURCE_ONLY_CI'
          echo 'D3E9_CAUSALITY_PROVEN=false'
      - name: Adversarial synthetic prelaunch size/mtime and 4663 provenance (NO Facad)
        run: |
          python -m py_compile scripts/facad_314_d3e10_provenance_gate.py scripts/test_facad_314_d3e10_provenance_gate.py
          python -m unittest scripts/test_facad_314_d3e10_provenance_gate.py -v
          echo 'D3E10_WRITER_CAUSALITY=NOT_PROVEN_BY_THIS_JOB'
          echo 'D3E10_CLINICAL_EDIT_ALLOWED=false'
      - name: Adversarial native watcher and per-file SACL coverage metadata (SOURCE ONLY)
        run: |
          python -m py_compile scripts/facad_314_d3e11_observation_gate.py scripts/test_facad_314_d3e11_observation_gate.py
          python -m unittest scripts/test_facad_314_d3e11_observation_gate.py -v
          echo 'D3E11_FILE_NOTIFICATION_NOT_WRITER_CAUSALITY=true'
          echo 'D3E11_CLINICAL_EDIT_ALLOWED=false'
      - name: D3E12 synthetic ETW feasibility adversarial gate (SOURCE ONLY)
        run: |
          python -m py_compile scripts/facad_314_d3e12_etw_gate.py scripts/test_facad_314_d3e12_etw_gate.py
          python -m unittest scripts/test_facad_314_d3e12_etw_gate.py -v
          echo 'D3E12_ETW_SYNTHETIC_ONLY=true'
          echo 'D3E12_ILEXIS_WRITER_IDENTIFIED=false'
      - name: Compare manufacturer storage topology to blind spots (SOURCE ONLY)
        run: |
          python -m py_compile scripts/facad_314_d3_storage_authority_gap_gate.py scripts/test_facad_314_d3_storage_authority_gap_gate.py
          python -m unittest scripts/test_facad_314_d3_storage_authority_gap_gate.py -v
          python scripts/facad_314_d3_storage_authority_gap_gate.py --collector scripts/facad_314_d3_windows_snapshot.ps1 --observer scripts/facad_314_d3_process_io_observer.ps1 --comparator scripts/facad_314_d3_snapshot_diff_gate.py
          echo 'FACAD_APPLICATION_LAUNCHED=false'
          echo 'PATIENT_IO=false'
          echo 'SHARED_APP_STORAGE_ISOLATION=UNVERIFIED'
      - name: Enforce claims remain unverified
        run: |
          python - <<'PY'
          from pathlib import Path
          code = Path('scripts/facad_314_d3_snapshot_diff_gate.py').read_text(encoding='utf8')
          assert "'d3_isolation_verified': False" in code
          assert "'clinical_edit_allowed': False" in code
          assert 'else 3  # INCONCLUSIVE is NOT a green D3 gate' in code
          print('D3 ISOLATION STILL UNVERIFIED: static gate tests only')
          PY
