name: CB-02 B NEW Windows NVDA Native Zoom 200 (EXPERIMENTAL)

# Actual NEW CB-02 React UI, synthetic browser stub, no real clinic backend.
# No success without real NVDA spoken terms AND Chrome extension getZoom(2).
on:
  pull_request:
    paths:
      - frontend/cb02-native-zoom-lab.html
      - frontend/src/components/CrownBot/CB02NativeZoomLab.tsx
      - frontend/src/components/CrownBot/CrownBotGuidedNluCb02.tsx
      - frontend/scripts/certify-cb02-windows-native-nvda.mjs
      - .github/workflows/cb02-windows-native-nvda.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-200-and-nvda-new-panel:
    name: NEW CB-02 headed Chromium Chrome setZoom(2) + real NVDA announcement
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      DIGITALCROWN_ISOLATED_RUNTIME: '1'
      CB02_NATIVE_ZOOM_EXPERIMENT: '1'
      CB02_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      CI: 'true'
      TELEMETRY_ENABLED: 'false'
      CLOUD_AI_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Validate exact SHA, local-only lab, flags not deployed
        shell: pwsh
        run: |
          if ((git rev-parse HEAD).Trim() -ne $env:CB02_SOURCE_HEAD) { throw 'REFUSED: exact SHA mismatch' }
          foreach ($f in @(
            'frontend/cb02-native-zoom-lab.html',
            'frontend/src/components/CrownBot/CB02NativeZoomLab.tsx',
            'frontend/src/components/CrownBot/CrownBotGuidedNluCb02.tsx',
            'frontend/scripts/certify-cb02-windows-native-nvda.mjs'
          )) {
            if (-not (Test-Path $f)) { throw "REFUSED: missing $f" }
          }
          "CB02 native Windows HEAD: $env:CB02_SOURCE_HEAD" >> $env:GITHUB_STEP_SUMMARY
          'Isolated React/stub only, not human usability or full FastAPI cabinet certification.' >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install app and Guidepup NVDA lab dependencies
        shell: pwsh
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm install --no-save --no-audit --no-fund playwright@1.55.0 @guidepup/guidepup@0.36.3 @guidepup/setup@0.29.3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx playwright install chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Configure REAL NVDA on Windows
        shell: pwsh
        working-directory: frontend
        run: |
          npx --no-install guidepup setup --ci
          if ($LASTEXITCODE -ne 0) { throw 'NOT_CERTIFIED: Guidepup OS setup failed' }
          npx --no-install guidepup install nvda
          if ($LASTEXITCODE -ne 0) { throw 'NOT_CERTIFIED: NVDA install failed' }
      - name: Real NVDA must speak NEW CB-02 controls at verified native zoom 200%
        shell: pwsh
        working-directory: frontend
        run: |
          node scripts/certify-cb02-windows-native-nvda.mjs
          if ($LASTEXITCODE -ne 0) { throw 'NOT_CERTIFIED: new CB-02 native Windows a11y lab failed' }
          'CB-02 actual panel synthetic OS proof: review SHA-bound report.json, speech, native getZoom and screenshots.' >> $env:GITHUB_STEP_SUMMARY
      - name: Upload CB-02 native Windows real NVDA and zoom evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cb02-b-new-ui-native-zoom-real-nvda
          path: artifacts/cb02-guided-native-windows
          if-no-files-found: warn
          retention-days: 14
