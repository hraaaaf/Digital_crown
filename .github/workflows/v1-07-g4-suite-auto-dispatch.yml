name: V1-07 G4 Suite Auto Dispatch

on:
  push:
    branches:
      - audit/g0-global-interactive-inventory
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: v1-07-g4-suite-auto-dispatch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dispatch:
    name: Dispatch residual G4 exact-head gates
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch G4 certification suite on current branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          workflows=(
            "t2-runtime-cert.yml"
            "ci.yml"
          )
          for workflow in "${workflows[@]}"; do
            echo "Dispatching $workflow on $REF"
            gh api --method POST               -H "Accept: application/vnd.github+json"               -H "X-GitHub-Api-Version: 2022-11-28"               "/repos/$REPO/actions/workflows/$workflow/dispatches"               -f ref="$REF"
          done