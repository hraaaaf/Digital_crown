name: V1.5-05 Parallel ABC Integration Synthetic Lab
on:
  pull_request:
    paths:
      - backend/tests/test_legacy_sql_tenant_link_guard_lab_v15.py
      - backend/tests/test_legacy_sql_physical_schema_gate_lab_v15.py
      - backend/tests/test_legacy_sql_replay_restore_lab_v15.py
      - docs/quality/V15_05_PARALLEL_ABC_INTEGRATION_LAB.md
      - .github/workflows/v15-05-parallel-abc-integration-lab.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrated-synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pinned SQLAlchemy
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check SQLAlchemy==2.0.28
      - name: Track A B C independent and combined
        run: |
          set -euo pipefail
          python -m py_compile backend/tests/test_legacy_sql_tenant_link_guard_lab_v15.py backend/tests/test_legacy_sql_physical_schema_gate_lab_v15.py backend/tests/test_legacy_sql_replay_restore_lab_v15.py
          for item in "test_legacy_sql_tenant_link_guard_lab_v15.py:7" "test_legacy_sql_physical_schema_gate_lab_v15.py:6" "test_legacy_sql_replay_restore_lab_v15.py:8"; do
            name="${item%%:*}"
            count="${item##*:}"
            PYTHONWARNINGS=error::ResourceWarning python "backend/tests/${name}" -v 2>&1 | tee "/tmp/${name}.log"
            grep -q "Ran ${count} tests" "/tmp/${name}.log"
            grep -q '^OK$' "/tmp/${name}.log"
            if grep -Ei 'skipped|expected failure' "/tmp/${name}.log"; then exit 1; fi
          done
          PYTHONWARNINGS=error::ResourceWarning python -m unittest discover -s backend/tests -p 'test_legacy_sql_*_lab_v15.py' -v 2>&1 | tee /tmp/abc-combined.log
          grep -q 'Ran 21 tests' /tmp/abc-combined.log
          grep -q '^OK$' /tmp/abc-combined.log
      - name: All 119 predecessor unique regressions
        run: |
          set -euo pipefail
          for item in "test_legacy_sql_real_orm_scratch_v15.py:10" "test_legacy_sql_synthetic_dryrun_v15.py:19" "test_legacy_sql_migration_scenarios_v15.py:12" "test_legacy_sql_mapping_v15.py:25" "test_legacy_sql_target_manifest_v15.py:25"; do
            name="${item%%:*}"
            count="${item##*:}"
            python "backend/tests/${name}" -v 2>&1 | tee "/tmp/regression-${name}.log"
            grep -q "Ran ${count} tests" "/tmp/regression-${name}.log"
            grep -q '^OK$' "/tmp/regression-${name}.log"
          done
          python -m unittest discover -s backend/tests -p 'test_legacy_sql_inspector_v15*.py' -v 2>&1 | tee /tmp/inspector.log
          grep -q 'Ran 28 tests' /tmp/inspector.log
          grep -q '^OK$' /tmp/inspector.log
      - name: Verify exact HEAD and no real import
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          echo "ABC synthetic-only: 21 NEW unique + 119 preceding unique = 140 unique tests; 21 duplicated in combined test process. NO REAL IMPORT." >> "$GITHUB_STEP_SUMMARY"
