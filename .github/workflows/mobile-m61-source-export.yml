name: Mobile M6.1 Source Export

on:
  push:
    branches: [audit/mobile-m6-generator]
    paths: [.github/workflows/mobile-m61-source-export.yml]

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 634892172ac8026a74a47d15de794a7f64c46d86
      - name: Verify exact source
        run: test "$(git rev-parse HEAD)" = "634892172ac8026a74a47d15de794a7f64c46d86"
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-m61-license-source
          path: |
            backend/main.py
            backend/tests/test_mobile_identity_security.py
            backend/tests/test_mobile_revocation_epoch.py
          if-no-files-found: error
          retention-days: 2
      - name: Publish run marker in audit namespace
        run: |
          git fetch origin audit/mobile-m6-generator
          git checkout -B audit/mobile-m6-generator origin/audit/mobile-m6-generator
          mkdir -p .github/m6
          printf '%s\n' "$GITHUB_RUN_ID" > .github/m6/mobile-m61-source-export-run.txt
          git config user.name "Digital Crown M6 Audit"
          git config user.email "123034021+hraaaaf@users.noreply.github.com"
          git add .github/m6/mobile-m61-source-export-run.txt
          git commit -m "audit(m6): record source export run $GITHUB_RUN_ID"
          git push origin HEAD:audit/mobile-m6-generator
