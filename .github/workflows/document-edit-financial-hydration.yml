name: Hydrate Honoraires Edit State

on:
  push:
    branches: [fix/document-archive-consistency]
    paths:
      - '.github/workflows/document-edit-financial-hydration.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/document-archive-consistency
          fetch-depth: 0
      - name: Apply guarded hydration patch
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path); text=p.read_text(); count=text.count(old)
              if count != 1: raise SystemExit(f'{path}: expected one match, got {count}: {old[:100]!r}')
              p.write_text(text.replace(old,new,1))

          patients='backend/routers/patients.py'
          replace_once(
              patients,
              '''            "clinical_data": doc.clinical_data, "timestamp": doc.created_at.timestamp(),\n            "file_exists": os.path.isfile(abs_path),\n''',
              '''            "clinical_data": doc.clinical_data, "timestamp": doc.created_at.timestamp(),\n            "payment_status": getattr(doc.payment_status, "value", doc.payment_status),\n            "is_accounted": bool(doc.is_accounted),\n            "file_exists": os.path.isfile(abs_path),\n''',
          )

          pd='frontend/src/features/patients/PatientDocuments.tsx'
          replace_once(
              pd,
              '''  clinical_data?: any;\n  isDuplicate?: boolean;\n''',
              '''  clinical_data?: any;\n  payment_status?: string;\n  is_accounted?: boolean;\n  isDuplicate?: boolean;\n''',
          )

          hub='frontend/src/features/admin/DocumentHub.tsx'
          replace_once(
              hub,
              '''    clinical_data: Record<string, unknown>;\n    id?: number;\n''',
              '''    clinical_data: Record<string, unknown>;\n    id?: number;\n    payment_status?: string;\n    is_accounted?: boolean;\n''',
          )
          replace_once(
              hub,
              '''  payments?: { acte: string; dent: string; montant?: number; prix_unitaire?: number; dents?: number[] }[];\n  doc_date?: string;\n''',
              '''  payments?: { acte: string; dent: string; montant?: number; prix_unitaire?: number; dents?: number[]; mode_reglement?: string }[];\n  installments?: { date?: string; dueDate?: string; amount?: number; label?: string }[];\n  is_global_note?: boolean;\n  doc_date?: string;\n''',
          )
          replace_once(
              hub,
              '''    isAccounted,\n    paymentStatus, setPaymentStatus,\n''',
              '''    isAccounted, setIsAccounted,\n    paymentStatus, setPaymentStatus,\n''',
          )
          old='''    } else {\n      const srcItems = d.items || d.payments || [];\n      setItems(srcItems.map((i: { acte: string; dent: string; montant?: number; prix_unitaire?: number; dents?: number[] }, idx: number) => ({\n        id: Date.now() + idx,\n        description: i.acte || '',\n        dent: i.dent || '0',\n        price: i.montant ?? i.prix_unitaire ?? 0,\n        toothNumbers: i.dents || [],\n      })));\n    }\n'''
          new='''    } else {\n      const srcItems = d.items || d.payments || [];\n      setItems(srcItems.map((i: { acte: string; dent: string; montant?: number; prix_unitaire?: number; dents?: number[] }, idx: number) => ({\n        id: Date.now() + idx,\n        description: i.acte || '',\n        dent: i.dent || '0',\n        price: i.montant ?? i.prix_unitaire ?? 0,\n        toothNumbers: i.dents || [],\n      })));\n      if (desiredTab === 'honoraires') {\n        const paymentState = editData.payment_status === 'PAYE' ? 'PAYE' : 'EN_ATTENTE';\n        setPaymentStatus(paymentState);\n        setIsAccounted(editData.is_accounted ?? true);\n        setIsGlobalNote(Boolean(d.is_global_note));\n        setInstallments((d.installments || []).map((inst, idx) => ({\n          id: Date.now() + idx,\n          date: inst.date || inst.dueDate || '',\n          amount: Number(inst.amount || 0),\n          label: inst.label || `Échéance ${idx + 1}`,\n        })));\n        const rawMode = d.payments?.find(item => item.mode_reglement)?.mode_reglement || '';\n        const allowedModes = ['Espèces', 'Chèque', 'TPE', 'Virement'];\n        setPaymentMode(paymentState === 'PAYE' && allowedModes.includes(rawMode) ? rawMode as 'Espèces' | 'Chèque' | 'TPE' | 'Virement' : '');\n      }\n    }\n'''
          replace_once(hub,old,new)
          replace_once(
              hub,
              '''  }, [editData, allowedTabs, setActiveTab, setItems]);\n''',
              '''  }, [editData, allowedTabs, setActiveTab, setItems, setPaymentMode, setPaymentStatus, setIsAccounted, setIsGlobalNote, setInstallments]);\n''',
          )
          PY
          python -m py_compile backend/routers/patients.py
          grep -q 'payment_status.*doc.payment_status' backend/routers/patients.py
          grep -q 'setIsAccounted(editData.is_accounted' frontend/src/features/admin/DocumentHub.tsx
          grep -q 'setIsGlobalNote(Boolean(d.is_global_note))' frontend/src/features/admin/DocumentHub.tsx
          grep -q 'setInstallments((d.installments' frontend/src/features/admin/DocumentHub.tsx
      - name: Commit and remove one-shot workflow
        run: |
          rm .github/workflows/document-edit-financial-hydration.yml
          git config user.name 'Digital Crown CI'
          git config user.email 'actions@users.noreply.github.com'
          git add backend/routers/patients.py frontend/src/features/patients/PatientDocuments.tsx frontend/src/features/admin/DocumentHub.tsx .github/workflows/document-edit-financial-hydration.yml
          git commit -m 'Hydrate financial state when editing honoraires'
          git push origin HEAD:fix/document-archive-consistency
