name: Mobile M4 Final Matrix AFTER

on:
  push:
    branches:
      - audit/mobile-m4-final-after-20260825
    paths:
      - '.audit/mobile-m4-final-after.html'
      - '.audit/mobile-m4-final-after.tsx'
      - '.audit/mobile-m4-final-after.mjs'
      - 'backend/tests/test_mobile_m4_final_matrix_audit.py'
      - '.github/workflows/mobile-m4-final-after.yml'

permissions:
  contents: read

jobs:
  after:
    name: M4 final resource matrix AFTER
    runs-on: ubuntu-latest
    env:
      PRODUCT_HEAD: 03d1150a8071088890bdfd431e845d55e7930f98
      SECRET_KEY: ci-only-secret-key-minimum-32-characters-long
      DATABASE_URL: "sqlite:///:memory:"
      ENVIRONMENT: development
      TELEMETRY_ENABLED: "false"
      CLOUD_AI_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert frozen product baseline
        run: |
          test "$(git merge-base "$PRODUCT_HEAD" HEAD)" = "$PRODUCT_HEAD"
          python - <<'PY'
          import os, subprocess
          product = os.environ['PRODUCT_HEAD']
          expected = {
              '.audit/mobile-m4-final-after.html',
              '.audit/mobile-m4-final-after.mjs',
              '.audit/mobile-m4-final-after.tsx',
              '.github/workflows/mobile-m4-final-after.yml',
              'backend/tests/test_mobile_m4_final_matrix_audit.py',
          }
          changed = set(subprocess.check_output(['git', 'diff', '--name-only', f'{product}..HEAD'], text=True).splitlines())
          if changed != expected:
              raise SystemExit(f'Unexpected final-M4 AFTER audit scope: {sorted(changed ^ expected)}')
          print('Frozen M4 AFTER product baseline + exact audit scope PASS')
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend and Chromium
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.62.1
          npx playwright install --with-deps chromium

      - name: Frontend build
        working-directory: frontend
        run: npm run build

      - name: Materialize M4 final AFTER harness
        run: |
          cp .audit/mobile-m4-final-after.html frontend/mobile-m4-final-after.html
          cp .audit/mobile-m4-final-after.tsx frontend/src/mobile-m4-final-after.tsx
          cp .audit/mobile-m4-final-after.mjs frontend/mobile-m4-final-after.mjs

      - name: Capture M4 final AFTER states
        working-directory: frontend
        run: PRODUCT_HEAD="$PRODUCT_HEAD" node mobile-m4-final-after.mjs

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.12.0 torchvision==0.27.0 --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^(torch|torchvision)([<=>].*)?$' requirements.txt > /tmp/requirements-m4-final.txt
          pip install -r /tmp/requirements-m4-final.txt
          pip install httpx==0.27.2 pytest pytest-asyncio

      - name: Certify expiry and one-shot plus resource regressions
        run: |
          python -m pytest \
            backend/tests/test_mobile_m4_final_matrix_audit.py \
            backend/tests/test_mobile_m4d_appointment_context.py \
            backend/tests/test_mobile_m4c_document_context.py \
            backend/tests/test_mobile_m4b_panoramic_context.py \
            backend/tests/test_mobile_m4a_patient_context.py \
            -q --maxfail=1

      - name: Record evidence metadata
        if: always()
        run: |
          mkdir -p frontend/mobile-m4-final-after-artifacts
          cat > frontend/mobile-m4-final-after-artifacts/metadata.txt <<EOF_META
          chantier=Digital Crown Mobile Full Experience
          lot=M4 final resource error-return-expiry matrix AFTER
          product_head=${PRODUCT_HEAD}
          audit_head=$(git rev-parse HEAD)
          viewports=390x844,768x1024
          states=unpaired,revoked,deleted,backend-offline,ready-return
          deployment=none
          EOF_META

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-m4-final-after
          path: frontend/mobile-m4-final-after-artifacts/
          if-no-files-found: error
          retention-days: 14
