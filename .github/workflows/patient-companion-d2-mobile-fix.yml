name: Patient Companion D2 Mobile Fix

on:
  push:
    branches:
      - feat/patient-companion-d2-staff-ui

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/patient-companion-d2-staff-ui
          fetch-depth: 0
      - name: Apply verified mobile simplification
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'missing target: {label}')
              if text.count(old) != 1:
                  raise SystemExit(f'non-unique target: {label} count={text.count(old)}')
              return text.replace(old, new, 1)

          details_path = Path('frontend/src/features/patients/PatientDetailsInner.tsx')
          details = details_path.read_text()

          old_nba = '''  useEffect(() => {\n    if (!id) return;\n    const timer = setTimeout(() => {\n      api.get(`/intelligence/patient/${id}/nba`).then(res => {\n        if (res.data.nba) toast(`💡 ${res.data.nba.title} — ${res.data.nba.message}${res.data.nba.action ? ` · Action : ${res.data.nba.action}` : ''}`, { duration: 7000 });\n      }).catch(() => {});\n    }, 1500);\n    return () => clearTimeout(timer);\n  }, [id]);'''
          new_nba = '''  useEffect(() => {\n    // The contextual next-best-action belongs to clinical navigation, not the Companion admin flow.\n    // Keeping it out of Companion also prevents a large mobile toast from obscuring the access controls.\n    if (!id || activeTab === 'companion') return;\n    const timer = setTimeout(() => {\n      api.get(`/intelligence/patient/${id}/nba`).then(res => {\n        if (res.data.nba) toast(`💡 ${res.data.nba.title} — ${res.data.nba.message}${res.data.nba.action ? ` · Action : ${res.data.nba.action}` : ''}`, { duration: 7000 });\n      }).catch(() => {});\n    }, 1500);\n    return () => clearTimeout(timer);\n  }, [id, activeTab]);'''
          details = replace_once(details, old_nba, new_nba, 'NBA context')

          details = replace_once(
              details,
              "<div className={cn('max-w-[1600px] mx-auto md:px-8', isRadiology ? 'px-2.5 pt-1.5' : 'px-4 pt-3')}>",
              "<div className={cn('max-w-[1600px] mx-auto md:px-8', isRadiology ? 'px-2.5 pt-1.5' : 'px-3 pt-2 sm:px-4 sm:pt-3')}>",
              'mobile header padding',
          )
          details = replace_once(
              details,
              "<div className={cn('flex flex-col xl:flex-row xl:items-center xl:justify-between', isRadiology ? 'gap-1.5 mb-1.5' : 'gap-3 mb-3')}>",
              "<div className={cn('flex flex-col xl:flex-row xl:items-center xl:justify-between', isRadiology ? 'gap-1.5 mb-1.5' : 'gap-2 mb-2 sm:gap-3 sm:mb-3')}>",
              'mobile header spacing',
          )
          details = replace_once(
              details,
              "isRadiology ? 'w-8 h-8 rounded-lg' : 'w-10 h-10'",
              "isRadiology ? 'w-8 h-8 rounded-lg' : 'w-9 h-9 sm:w-10 sm:h-10'",
              'back button size',
          )
          details = replace_once(
              details,
              "isRadiology ? 'text-base md:text-lg' : 'text-xl md:text-2xl'",
              "isRadiology ? 'text-base md:text-lg' : 'text-lg sm:text-xl md:text-2xl'",
              'patient title size',
          )
          details = replace_once(
              details,
              "isRadiology ? 'mt-0.5 gap-x-2 gap-y-0.5 text-[10px]' : 'mt-1.5 gap-x-3 gap-y-1 text-xs'",
              "isRadiology ? 'mt-0.5 gap-x-2 gap-y-0.5 text-[10px]' : 'mt-1 gap-x-2 gap-y-0.5 text-[11px] sm:mt-1.5 sm:gap-x-3 sm:gap-y-1 sm:text-xs'",
              'patient metadata density',
          )
          details = replace_once(
              details,
              "isRadiology ? 'hidden md:inline-flex' : 'inline-flex'",
              "isRadiology ? 'hidden md:inline-flex' : 'hidden sm:inline-flex'",
              'hide redundant phone mobile',
          )
          details = replace_once(
              details,
              "<div className={cn('grid gap-2 w-full xl:w-auto', canFinance ? 'grid-cols-4' : 'grid-cols-3', isRadiology && 'hidden lg:grid')} aria-label=\"Actions rapides patient\">",
              "<div className={cn('hidden sm:grid gap-2 w-full xl:w-auto', canFinance ? 'grid-cols-4' : 'grid-cols-3', isRadiology && 'sm:hidden lg:grid')} aria-label=\"Actions rapides patient\">",
              'hide redundant quick actions mobile',
          )

          tab_replacements = {
              'label="Vue d’ensemble" />': 'label="Vue d’ensemble" mobileLabel="Suivi" />',
              'label="Clinique" />': 'label="Clinique" mobileLabel="Clinique" />',
              'label="Imagerie" />': 'label="Imagerie" mobileLabel="Image" />',
              'label="Documents" />': 'label="Documents" mobileLabel="Docs" />',
              'label="Companion" />': 'label="Companion" mobileLabel="Companion" />',
              'label="Finances" />': 'label="Finances" mobileLabel="Finance" />',
          }
          for old, new in tab_replacements.items():
              details = replace_once(details, old, new, f'tab {old}')

          details = replace_once(
              details,
              "'flex-1 px-4 py-6 md:px-8 md:py-8 space-y-6'",
              "'flex-1 px-3 py-3 sm:px-4 sm:py-6 md:px-8 md:py-8 space-y-4 sm:space-y-6'",
              'mobile content spacing',
          )

          old_tab = '''const TabButton = ({ active, onClick, icon, label, compact = false }: any) => (\n  <button onClick={onClick} className={cn('shrink-0 flex items-center font-black uppercase transition-all border-b-[3px] whitespace-nowrap', compact ? 'gap-1 pb-1.5 px-1 text-[9px] tracking-[0.04em] md:gap-1.5 md:px-2 md:text-[11px] md:tracking-[0.06em]' : 'gap-1.5 sm:gap-2 pb-2 px-1.5 md:px-3 text-[10px] md:text-[12px] tracking-[0.06em] md:tracking-[0.08em]', active ? 'text-primary' : 'border-transparent text-text-muted hover:text-main hover:border-border-main')} style={active ? { borderColor: 'var(--primary)', color: 'var(--primary)' } : {}}>\n    {icon} {label}\n  </button>\n);'''
          new_tab = '''const TabButton = ({ active, onClick, icon, label, mobileLabel, compact = false }: any) => (\n  <button onClick={onClick} aria-label={label} className={cn('shrink-0 flex items-center font-black uppercase transition-all border-b-[3px] whitespace-nowrap', compact ? 'gap-1 pb-1.5 px-1 text-[9px] tracking-[0.04em] md:gap-1.5 md:px-2 md:text-[11px] md:tracking-[0.06em]' : 'gap-1 pb-1.5 px-1 text-[9px] tracking-[0.04em] sm:gap-2 sm:pb-2 sm:px-1.5 sm:text-[10px] sm:tracking-[0.06em] md:px-3 md:text-[12px] md:tracking-[0.08em]', active ? 'text-primary' : 'border-transparent text-text-muted hover:text-main hover:border-border-main')} style={active ? { borderColor: 'var(--primary)', color: 'var(--primary)' } : {}}>\n    {icon}<span className=\"sm:hidden\">{mobileLabel || label}</span><span className=\"hidden sm:inline\">{label}</span>\n  </button>\n);'''
          details = replace_once(details, old_tab, new_tab, 'TabButton responsive labels')
          details_path.write_text(details)

          panel_path = Path('frontend/src/features/patients/components/PatientCompanionPanel.tsx')
          panel = panel_path.read_text()
          panel = replace_once(panel, '<div className="space-y-5" data-patient-companion-admin>', '<div className="space-y-4 sm:space-y-5 scroll-mt-28" data-patient-companion-admin>', 'panel spacing')
          panel = replace_once(panel, '<section className="grid grid-cols-1 lg:grid-cols-[1.15fr_0.85fr] gap-4">', '<section className="grid grid-cols-1 lg:grid-cols-[1.15fr_0.85fr] gap-3 sm:gap-4">', 'panel grid gap')
          panel = replace_once(panel, '<div className="bg-card-bg rounded-[1.75rem] border border-border-main shadow-elite p-5 md:p-6">', '<div className="bg-card-bg rounded-2xl sm:rounded-[1.75rem] border border-border-main shadow-elite p-4 sm:p-5 md:p-6">', 'status card density')
          panel = replace_once(panel, '<h2 className="mt-2 text-2xl font-black text-main">Patient Companion</h2>', '<h2 className="mt-1.5 text-xl sm:mt-2 sm:text-2xl font-black text-main">Patient Companion</h2>', 'mobile title density')
          panel = replace_once(panel, '<p className="mt-1 text-sm font-medium text-text-muted">Administration sécurisée de l’accès mobile, sans dupliquer le dossier patient.</p>', '<p className="hidden sm:block mt-1 text-sm font-medium text-text-muted">Administration sécurisée de l’accès mobile, sans dupliquer le dossier patient.</p>', 'hide explanatory copy mobile')
          panel = replace_once(panel, '<RefreshCcw size={15} /> Actualiser', '<RefreshCcw size={15} /><span className="hidden sm:inline">Actualiser</span>', 'compact refresh')
          panel = replace_once(panel, '<div className="mt-5 grid grid-cols-1 sm:grid-cols-3 gap-3">', '<div className="mt-4 grid grid-cols-3 gap-2 sm:mt-5 sm:gap-3">', 'metrics one row mobile')
          panel = replace_once(panel, '<div className="bg-card-bg rounded-[1.75rem] border border-border-main shadow-elite p-5 md:p-6">', '<div className="bg-card-bg rounded-2xl sm:rounded-[1.75rem] border border-border-main shadow-elite p-4 sm:p-5 md:p-6">', 'invitation card density')
          panel = replace_once(panel, '<section className="bg-card-bg rounded-[1.75rem] border border-primary/20 shadow-elite p-5 md:p-6" data-ephemeral-invitation>', '<section className="scroll-mt-28 sm:scroll-mt-36 bg-card-bg rounded-2xl sm:rounded-[1.75rem] border border-primary/20 shadow-elite p-4 sm:p-5 md:p-6" data-ephemeral-invitation>', 'ephemeral card density')
          panel = replace_once(panel, 'className="rounded-2xl border border-border-main bg-white p-3 flex items-center justify-center min-h-[220px]"', 'className="rounded-2xl border border-border-main bg-white p-3 flex items-center justify-center min-h-[180px] sm:min-h-[220px]"', 'QR card height')
          panel = replace_once(panel, 'className="w-48 h-48 object-contain"', 'className="w-40 h-40 sm:w-48 sm:h-48 object-contain"', 'QR mobile size')
          panel = replace_once(panel, "<div className={cn('rounded-2xl border px-4 py-3', tone === 'good' ? 'border-emerald-200 bg-emerald-50/70' : tone === 'warn' ? 'border-amber-200 bg-amber-50/70' : 'border-border-main bg-background')}><div className=\"flex items-center gap-2 text-text-muted\">{icon}<span className=\"text-[10px] font-black uppercase tracking-widest\">{label}</span></div><p className=\"mt-2 text-lg font-black text-main\">{value}</p></div>", "<div className={cn('rounded-xl sm:rounded-2xl border px-2.5 py-2.5 sm:px-4 sm:py-3', tone === 'good' ? 'border-emerald-200 bg-emerald-50/70' : tone === 'warn' ? 'border-amber-200 bg-amber-50/70' : 'border-border-main bg-background')}><div className=\"flex items-center gap-1.5 text-text-muted\"><span className=\"hidden sm:inline-flex\">{icon}</span><span className=\"text-[8px] sm:text-[10px] font-black uppercase tracking-[0.04em] sm:tracking-widest\">{label}</span></div><p className=\"mt-1 text-sm sm:mt-2 sm:text-lg font-black leading-tight text-main\">{value}</p></div>", 'compact status metric')
          panel = replace_once(panel, 'return <div className="bg-card-bg rounded-[1.75rem] border border-border-main shadow-elite p-5 md:p-6">', 'return <div className="bg-card-bg rounded-2xl sm:rounded-[1.75rem] border border-border-main shadow-elite p-4 sm:p-5 md:p-6">', 'resource card density')
          panel = replace_once(panel, '<section className="rounded-[1.75rem] border border-rose-200 bg-rose-50/70 p-5 md:p-6">', '<section className="rounded-2xl sm:rounded-[1.75rem] border border-rose-200 bg-rose-50/70 p-4 sm:p-5 md:p-6">', 'danger card density')
          panel_path.write_text(panel)

          test_path = Path('frontend/src/features/patients/components/PatientCompanionPanel.test.ts')
          test = test_path.read_text()
          needle = '''  it('is exposed only to the principal owner/admin inside PatientDetails', () => {\n    expect(details).toContain("| 'companion'");\n    expect(details).toContain('ownerOrAdmin && <TabButton');\n    expect(details).toContain("activeTab === 'companion'");\n    expect(details).toContain('<PatientCompanionPanel patientId={Number(id)} patientEmail={patient.email} />');\n    expect(details).toContain("if (!ownerOrAdmin && activeTab === 'companion')");\n  });\n'''
          replacement = needle + '''\n  it('keeps the 390px Companion shell compact without changing D0 contracts', () => {\n    expect(details).toContain("if (!id || activeTab === 'companion') return;");\n    expect(details).toContain("'hidden sm:grid gap-2 w-full xl:w-auto'");\n    expect(details).toContain('mobileLabel="Suivi"');\n    expect(panel).toContain('grid grid-cols-3 gap-2');\n    expect(panel).toContain('hidden sm:block mt-1 text-sm');\n    expect(panel).toContain('w-40 h-40 sm:w-48 sm:h-48');\n  });\n'''
          test = replace_once(test, needle, replacement, 'responsive regression test')
          test_path.write_text(test)

          capture_path = Path('frontend/scripts/capture-patient-companion-d2-visual.mjs')
          capture = capture_path.read_text()
          capture = replace_once(capture, "    // First AFTER frame: top of the Companion surface, consistently aligned on every viewport.\n    await panel.evaluate(element => element.scrollIntoView({ block: 'start', behavior: 'instant' }));\n    await page.waitForTimeout(100);", "    // First AFTER frame: true page-top experience after transient invitation feedback settles.\n    // Do not force the panel underneath the sticky patient header.\n    await page.evaluate(() => window.scrollTo({ top: 0, behavior: 'auto' }));\n    await page.waitForTimeout(100);", 'primary capture alignment')
          capture = replace_once(capture, "await invitation.evaluate(element => element.scrollIntoView({ block: 'start', behavior: 'instant' }));", "await invitation.evaluate(element => element.scrollIntoView({ block: 'start', behavior: 'auto' }));", 'safe detail scroll behavior')
          capture_path.write_text(capture)
          PY

          git diff --check
          git status --short
      - name: Commit product change and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patient-companion-d2-mobile-fix.yml
          git add frontend/src/features/patients/PatientDetailsInner.tsx \
                  frontend/src/features/patients/components/PatientCompanionPanel.tsx \
                  frontend/src/features/patients/components/PatientCompanionPanel.test.ts \
                  frontend/scripts/capture-patient-companion-d2-visual.mjs
          git commit -m "fix(patient-companion): simplify mobile staff flow"
          git push origin HEAD:feat/patient-companion-d2-staff-ui
