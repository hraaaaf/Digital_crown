name: Mobile Routing MOB-6 Certification

on:
  push:
    branches: [ux/mobile-routing-mob6]
    paths:
      - .github/workflows/mobile-routing-mob6-cert.yml
      - frontend/src/main.tsx
      - frontend/src/features/mobile/mobileRouting.ts
      - frontend/src/features/mobile/__tests__/mobileRoutingMob6.test.ts
      - frontend/scripts/capture-mobile-routing-mob6-after.mjs
      - docs/ux/DIGITAL_CROWN_MOBILE_ROUTING_MOB6_*.md
  workflow_dispatch:

concurrency:
  group: mobile-routing-mob6-cert-${{ github.ref }}
  cancel-in-progress: false

jobs:
  frontend-contract:
    name: MOB-6 routing contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Routing contract
        working-directory: frontend
        run: npm test -- --run src/features/mobile/__tests__/mobileRoutingMob6.test.ts

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Build
        working-directory: frontend
        run: npm run build

  after:
    name: AFTER routing 390 430 768
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Install Playwright runner
        working-directory: frontend
        run: npm install --no-save --package-lock=false playwright@1.63.0
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Start isolated frontend
        working-directory: frontend
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 >/tmp/mobile-routing-mob6-after-vite.log 2>&1 &
          for i in {1..60}; do
            curl -fsS 'http://127.0.0.1:5173/mobile/onboarding' >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/mobile-routing-mob6-after-vite.log
          exit 1
      - name: Capture and assert AFTER
        working-directory: frontend
        env:
          PRODUCT_HEAD: ${{ github.sha }}
          ARTIFACT_DIR: ../artifacts/mobile-routing-mob6-after
        run: node scripts/capture-mobile-routing-mob6-after.mjs
      - name: Preserve harness log
        if: always()
        run: cp /tmp/mobile-routing-mob6-after-vite.log artifacts/mobile-routing-mob6-after/vite.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-routing-mob6-after
          path: artifacts/mobile-routing-mob6-after
          if-no-files-found: error
          retention-days: 30
